                "anyOf": [
                  {
                    "$ref": "#/$defs/AgentRescuerSearchResponse"
                  },
                  {
                    "$ref": "#/$defs/AgentToolError"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "search_rescuersOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Buscar ONGs e protetores na cidade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://adoteca/rescuers.html",
            "openai/toolInvocation/invoked": "ONGs encontradas",
            "openai/toolInvocation/invoking": "Buscando ONGs na Adoteca…",
            "ui": {
              "resourceUri": "ui://adoteca/rescuers.html"
            }
          },
          "digest": "sha256:4d81515fb8dd39cf38e9dcb63385de6dc082631808aa2bc8458d0c49163a67ba"
        },
        {
          "name": "search_similar_pets",
          "title": "Ver pets parecidos",
          "description": "Pets parecidos com UM pet específico, mesma espécie e mesma cidade — não é a busca geral do catálogo. Use quando o pet desejado já não estiver disponível. Só traz pets disponíveis, cada um com o `adoption_url`, e pode vir vazia. `total` é o tamanho desta lista; não há página 2.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 6,
                "description": "Quantos pets parecidos devolver, no máximo 24. Esta lista não tem páginas: não existe `page` aqui.",
                "title": "Limit",
                "type": "integer"
              },
              "pet_ref": {
                "description": "Código curto do pet (ex.: 'ab12cd') ou o identificador da ficha.",
                "title": "Pet Ref",
                "type": "string"
              }
            },
            "required": ["pet_ref"],
            "title": "search_similar_petsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentNameMatch": {
                "properties": {
                  "confidence": {
                    "description": "'high' = é este pet: afirme direto. 'low' = NÃO afirme qual é; mostre os pets da lista e pergunte qual deles.",
                    "enum": ["high", "low"],
                    "title": "Confidence",
                    "type": "string"
                  },
                  "query": {
                    "description": "O nome que foi buscado.",
                    "title": "Query",
                    "type": "string"
                  }
                },
                "required": ["confidence", "query"],
                "title": "AgentNameMatch",
                "type": "object"
              },
              "AgentPetSummary": {
                "properties": {
                  "adoption_evidence": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Só quando status='adopted': 'announced' (a ONG anunciou) ou 'unlisted' (o post saiu do ar e a ONG confirma isso como adoção). null nos demais status.",
                    "title": "Adoption Evidence"
                  },
                  "adoption_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Link da ficha do pet. SEMPRE mostre este link na resposta.",
                    "title": "Adoption Url"
                  },
                  "age": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Idade legível, ex.: '6 meses', '2 anos'. Acima de um ano a idade é dada em anos inteiros; abaixo, em meses.",
                    "title": "Age"
                  },
                  "age_category": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Faixa etária: 'filhote', 'adulto' ou 'idoso'.",
                    "title": "Age Category"
                  },
                  "breed": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Raça informada; a maioria é SRD (sem raça definida).",
                    "title": "Breed"
                  },
                  "city": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cidade e UF onde o pet está, ex.: 'Campinas - SP'.",
                    "title": "City"
                  },
                  "contact_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Link para falar com a ONG sobre este pet: abre uma página da Adoteca que leva ao post original no Instagram. Mostre este link ao indicar contato.",
                    "title": "Contact Url"
                  },
                  "days_without_update": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Dias desde a última notícia nova sobre este pet (publicação da ONG ou sinal de adoção). null = desfecho confirmado ou data desconhecida. Passado um mês, diga que nada novo chegou desde então e que o pet pode ou não continuar disponível; quem confirma é quem cuida dele.",
                    "title": "Days Without Update"
                  },
                  "dewormed": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou.",
                    "title": "Dewormed"
                  },
                  "distance_km": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Distância em km entre o centro da cidade do pet e o da cidade buscada (0 = a própria cidade). Só vem quando a busca usou `area` ou `widen_if_empty`.",
                    "title": "Distance Km"
                  },
                  "foster_status": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "'aceita lar temporário' ou 'precisa de lar temporário'. Muda o que se pede à pessoa: não é adoção definitiva. null = não classificado.",
                    "title": "Foster Status"
                  },
                  "good_with_cats": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou.",
                    "title": "Good With Cats"
                  },
                  "good_with_dogs": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou.",
                    "title": "Good With Dogs"
                  },
                  "good_with_kids": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou.",
                    "title": "Good With Kids"
                  },
                  "microchipped": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou.",
                    "title": "Microchipped"
                  },
                  "name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nome do pet, quando a ONG informou.",
                    "title": "Name"
                  },
                  "neutered": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou. Nunca afirme 'não castrado' quando for null.",
                    "title": "Neutered"
                  },
                  "photo_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Foto principal do pet.",
                    "title": "Photo Url"
                  },
                  "published_recently": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/AgentPublishedRecently"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Preenchido só na busca por nome: a Adoteca postou este pet nesta rede há pouco. Use para situar a pessoa ('o que postamos no Instagram') em vez de afirmar sem contexto."
                  },
                  "rescuer": {
                    "$ref": "#/$defs/AgentRescuer",
                    "description": "Quem cuida do pet."
                  },
                  "sex": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "'macho' ou 'fêmea'.",
                    "title": "Sex"
                  },
                  "short_code": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Código curto do pet (o mesmo de adoteca.com.br/p/{code}).",
                    "title": "Short Code"
                  },
                  "size": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Porte: 'pequeno', 'médio' ou 'grande'.",
                    "title": "Size"
                  },
                  "species": {
                    "description": "'cachorro' ou 'gato'.",
                    "title": "Species",
                    "type": "string"
                  },
                  "status": {
                    "description": "'available', 'adopted', 'deceased' ou 'source_gone' (post original saiu do ar: pode ter sido adotado; confirme com o protetor). Nunca ofereça um pet que não esteja 'available'. 'available' só diz que ninguém sinalizou mudança: leia `days_without_update` antes de afirmar que está disponível.",
                    "title": "Status",
                    "type": "string"
                  },
                  "vaccinated": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "null = a ONG não informou. Nunca afirme 'não vacinado' quando for null.",
                    "title": "Vaccinated"
                  }
                },
                "required": ["adoption_url", "age", "age_category", "breed", "city", "name", "photo_url", "rescuer", "sex", "short_code", "size", "species", "status"],
                "title": "AgentPetSummary",
                "type": "object"
              },
              "AgentPublishedRecently": {
                "properties": {
                  "platform": {
                    "description": "Rede onde a Adoteca postou este pet, ex.: 'Instagram'.",
                    "title": "Platform",
                    "type": "string"
                  },
                  "published_at": {
                    "description": "Quando a Adoteca postou.",
                    "format": "date-time",
                    "title": "Published At",
                    "type": "string"
                  }
                },
                "required": ["platform", "published_at"],
                "title": "AgentPublishedRecently",
                "type": "object"
              },
              "AgentRescuer": {
                "properties": {
                  "instagram_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Perfil oficial da ONG no Instagram. Para indicar contato, mostre contact_url.",
                    "title": "Instagram Url"
                  },
                  "name": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Nome da ONG ou protetor responsável pelo pet.",
                    "title": "Name"
                  }
                },
                "required": ["instagram_url", "name"],
                "title": "AgentRescuer",
                "type": "object"
              },
              "AgentSearchResponse": {
                "properties": {
                  "available_total": {
                    "description": "Quantos desses pets estão disponíveis para adoção (status 'available'). É o número do título do catálogo; use este, não `total`, ao dizer quantos pets há para adotar.",
                    "title": "Available Total",
                    "type": "integer"
                  },
                  "name_match": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/AgentNameMatch"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Só quando a busca enviou `name`. Leia `confidence` antes de afirmar de qual pet a pessoa está falando."
                  },
                  "page": {
                    "description": "Página devolvida (começa em 1).",
                    "title": "Page",
                    "type": "integer"
                  },
                  "pets": {
                    "description": "Os pets desta página.",
                    "items": {
                      "$ref": "#/$defs/AgentPetSummary"
                    },
                    "title": "Pets",
                    "type": "array"
                  },
                  "searched_area": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/AgentSearchedArea"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "A área que a busca realmente cobriu. Se `widened` for true, os pets não são da cidade pedida: diga isso antes de listá-los."
                  },
                  "total": {
                    "description": "Total de pets que atendem aos filtros.",
                    "title": "Total",
                    "type": "integer"
                  }
                },
                "required": ["available_total", "page", "pets", "total"],
                "title": "AgentSearchResponse",
                "type": "object"
              },
              "AgentSearchedArea": {
                "description": "The area the pet search actually ran — after any automatic widening.",
                "properties": {
                  "area": {
                    "description": "Área usada: 'city' (só a cidade), 'neighbors' (a cidade e as que fazem divisa com ela) ou 'radius' (também as cidades a até `radius_km`).",
                    "enum": ["city", "neighbors", "radius"],
                    "title": "Area",
                    "type": "string"
                  },
                  "cities": {
                    "description": "Quantas cidades a área cobriu (0 = busca sem cidade).",
                    "title": "Cities",
                    "type": "integer"
                  },
                  "radius_km": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Raio em km quando `area` é 'radius'; senão null.",
                    "title": "Radius Km"
                  },
                  "widened": {
                    "description": "true quando a cidade não tinha pets e a busca foi ampliada sozinha (widen_if_empty). Diga isso à pessoa e cite a cidade de cada pet.",
                    "title": "Widened",
                    "type": "boolean"
                  }
                },
                "required": ["area", "cities", "radius_km", "widened"],
                "title": "AgentSearchedArea",
                "type": "object"
              },
              "AgentToolError": {
                "description": "The error branch of every tool's return type.\n\nErrors are DATA, never a raised exception: a raised one aborts the calling\nmodel's tool loop, while this arrives as a normal result the model can read\nand act on. It is part of the declared output schema so a client sees the\nbranch exists before it ever hits one.",
                "properties": {
                  "error": {
                    "description": "O que impediu a consulta e o que enviar na próxima chamada. Leia e corrija a chamada; NUNCA responda que não existem pets por causa disto.",
                    "title": "Error",
                    "type": "string"
                  }
                },
                "required": ["error"],
                "title": "AgentToolError",
                "type": "object"
              }
            },
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/AgentSearchResponse"
                  },
                  {
                    "$ref": "#/$defs/AgentToolError"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "search_similar_petsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ver pets parecidos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://adoteca/pets.html",
            "ui": {
              "resourceUri": "ui://adoteca/pets.html"
            }
          },
          "digest": "sha256:0d7e751148ea209fc07b80a39a5dd952ca755c71693fc3a31c033d7237c38583"
        }
      ],
      "resources": [
        {
          "uri": "ui://adoteca/pets.html",
          "name": "ui://adoteca/pets.html",
          "title": "Pets da Adoteca",
          "description": "Galeria de cães e gatos disponíveis para adoção.",
          "mimeType": "text/html;profile=mcp-app",
