      },
      "instructions": "Catálogo brasileiro de cães e gatos disponíveis para adoção responsável, agregado dos perfis de ONGs e protetores. Use `search_pets` para encontrar pets e `get_pet_details` para a ficha completa. Antes de buscar, resolva a cidade com `search_cities` (nomes se repetem entre estados) e confira o que existe com `get_city_stats` e `list_breeds`. Depois de um pet, use `search_similar_pets`; se vier vazia, volte a `search_pets`. Para quem cuida dos pets — quais ONGs e protetores existem em uma cidade, ou quem cuida de um pet específico — use `search_rescuers`, `get_rescuer_details` e `search_pets` com `rescuer`. Use `get_catalog_link` para mandar a pessoa ao catálogo com filtros prontos e `search_guides` para dúvidas de adoção, saúde e uso do site. Para QUAIS ONGs existem, use `search_rescuers`: `get_city_stats` só conta. Ao responder: cite só pets que as ferramentas devolveram, nunca invente nenhum, e mostre o `adoption_url` de cada um. Ofereça para adoção só pets com `status` 'available'. Antes de falar da saúde de um pet, leia o resultado de cada item de `health_conditions`. Na busca por nome, leia `name_match.confidence` antes de afirmar de qual pet se trata; se vier vazia, diga que não achou e pergunte como se escreve. Não prometa que um anúncio é recente. Se `search_cities` devolver `ambiguous`, escolha pelo contexto ou pergunte; nunca chute. Raças: a maioria é SRD, então ofereça SRD em vez de dizer que não há pets. Raça mestiça vem no campo `breed` como 'Pit Bull (mestiço)'. Sobre ONGs e protetores, não afirme que estão ativos nem que têm vaga para acolher. Para doações, mostre `donation_url` ou `profile_url`; nunca peça nem repasse chave PIX. Serviços públicos: cite só os que vierem, com a data da conferência; se vier vazio, não invente. Guias: responda com base no `summary` e mostre o `url`; lista vazia quer dizer que não temos guia sobre isso. Nunca escreva um link de catálogo à mão; se `get_catalog_link` não trouxer `url`, leia `note` e ofereça tirar um filtro. Um erro de ferramenta diz o que corrigir: leia, corrija a chamada e repita; ele nunca significa que não existem pets.",
      "tools": [
        {
          "name": "get_catalog_link",
          "title": "Montar link do catálogo",
          "description": "Monta o link do catálogo com os filtros pedidos e confirma que existem pets neles. Use quando a pessoa quiser ver a lista no site. Sem pets nesses filtros, `url` vem null e `note` explica.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Faixa etária, uma só: 'filhote', 'adulto' ou 'idoso'. São as três faixas que o catálogo distingue; os cortes mudam com espécie e porte (idoso a partir de 8 anos no cão grande, 9 no médio, 10 no pequeno e no gato).",
                "title": "Age"
              },
              "breed": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Raça: slug ('golden-retriever') ou nome em português ('pastor alemão'). A maioria do catálogo é SRD (sem raça definida).",
                "title": "Breed"
              },
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Nome do MUNICÍPIO por extenso, não do bairro nem abreviado: 'Belo Horizonte', não 'BH'. Acento é opcional. Se o nome for ambíguo, ou se nenhuma ONG tiver pets ali hoje, o erro explica o que corrigir; isso não significa que a cidade não exista.",
                "title": "City"
              },
              "good_with_cats": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Somente pets que convivem bem com gatos.",
                "title": "Good With Cats"
              },
              "good_with_dogs": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Somente pets que convivem bem com cães.",
                "title": "Good With Dogs"
              },
              "good_with_kids": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Somente pets que convivem bem com crianças.",
                "title": "Good With Kids"
              },
              "neutered": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true devolve somente pets castrados. `false` é IGNORADO pelo mesmo motivo de `vaccinated`; o valor de cada pet está em `neutered`.",
                "title": "Neutered"
              },
              "sex": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sexo: 'male'/'macho' ou 'female'/'femea'.",
                "title": "Sex"
              },
              "size": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Portes, um ou mais: 'small'/'pequeno', 'medium'/'medio', 'large'/'grande'. Envie os dois quando a pessoa aceitar os dois.",
                "title": "Size"
              },
              "sort": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Ordem da página: 'recentes' (padrão, os anúncios mais novos primeiro) ou 'disponiveis' (os que ainda estão para adoção primeiro, empurrando os já adotados para o fim).",
                "title": "Sort"
              },
              "special_needs": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true monta o link só com pets com cuidados especiais. `false` é IGNORADO: o catálogo não tem o filtro inverso.",
                "title": "Special Needs"
              },
              "species": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Espécie: 'dog'/'cachorro' ou 'cat'/'gato'.",
                "title": "Species"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sigla de duas letras da UF (SP, MG), apenas para desambiguar `city`. Busca só por estado NÃO é suportada: sempre envie `city` junto.",
                "title": "State"
              },
              "vaccinated": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true devolve somente pets vacinados. `false` é IGNORADO: a maioria dos anúncios não informa vacinação, então filtrar por 'não vacinado' esconderia quase todo o catálogo. O valor de cada pet está em `vaccinated` (null = a ONG não informou).",
                "title": "Vaccinated"
              }
            },
            "title": "get_catalog_linkArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentLinkResponse": {
                "description": "A catalog link that was CONFIRMED to have pets, or no link at all.",
                "properties": {
                  "note": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Quando presente, explica por que não há link. Leia e siga.",
                    "title": "Note"
                  },
                  "total": {
                    "description": "Quantos pets essa página do catálogo mostra hoje.",
                    "title": "Total",
                    "type": "integer"
                  },
                  "url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Link do catálogo com esses filtros. null = nenhum pet corresponde hoje; nesse caso leia `note` e NUNCA escreva um link à mão.",
                    "title": "Url"
                  }
                },
                "required": ["total", "url"],
                "title": "AgentLinkResponse",
                "type": "object"
              },
              "AgentToolError": {
                "description": "The error branch of every tool's return type.\n\nErrors are DATA, never a raised exception: a raised one aborts the calling\nmodel's tool loop, while this arrives as a normal result the model can read\nand act on. It is part of the declared output schema so a client sees the\nbranch exists before it ever hits one.",
                "properties": {
                  "error": {
                    "description": "O que impediu a consulta e o que enviar na próxima chamada. Leia e corrija a chamada; NUNCA responda que não existem pets por causa disto.",
                    "title": "Error",
                    "type": "string"
                  }
                },
                "required": ["error"],
                "title": "AgentToolError",
                "type": "object"
              }
            },
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/AgentLinkResponse"
                  },
                  {
                    "$ref": "#/$defs/AgentToolError"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "get_catalog_linkOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Montar link do catálogo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5151f8f608ebf5768e61b106bd883fdebff0a697875c150217a6156b6588d78"
        },
        {
          "name": "get_city_stats",
          "title": "Ver números do catálogo na cidade",
          "description": "Números do catálogo em UMA cidade já resolvida: quantos pets, por espécie, porte e idade, entradas em 24h, adoções, quantas ONGs e as raças mais comuns. Use para 'quantos pets tem em X?'. Não devolve pets, não resolve o nome da cidade e não lista QUAIS são as ONGs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Nome do MUNICÍPIO por extenso, ou o slug devolvido pela resolução de cidade. Obrigatório: a resposta é sempre de uma cidade. Se o nome for ambíguo ou ninguém tiver pets ali hoje, o erro diz o que fazer.",
                "title": "City",
                "type": "string"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sigla de duas letras da UF (SP, MG), se a pessoa informou. Opcional.",
                "title": "State"
              }
            },
            "required": ["city"],
            "title": "get_city_statsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentBreedCount": {
                "description": "A breed and how many of the city's pets carry it.\n\nNo `slug`, unlike `AgentBreed`: `search_pets(breed=...)` takes the NAME too\n(Breed values are the accent-stripped pt-BR names, and `parse_breed` aliases\nthe one name this surface invents), so a second identifier would only be\nsomething else to keep in sync.",
                "properties": {
                  "by_species": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Quantos desses são de cada espécie: chaves 'cachorro' e 'gato', e somam `count`. Uma raça pode aparecer nas duas — SRD (sem raça definida) aparece. Se a pessoa perguntou por uma espécie só, leia daqui: `name` e `count` juntam as duas.",
                    "title": "By Species",
                    "type": "object"
                  },
                  "count": {
                    "description": "Pets dessa raça entre os contados em `pet_count`.",
                    "title": "Count",
                    "type": "integer"
                  },
                  "name": {
                    "description": "Nome da raça. Pode ser enviado em `breed` na busca de pets.",
                    "title": "Name",
                    "type": "string"
                  }
                },
                "required": ["count", "name"],
                "title": "AgentBreedCount",
                "type": "object"
              },
              "AgentCityStats": {
                "description": "Aggregate counts for ONE city. Deliberately carries no pets and no\nneighbouring cities — the pet search and the city lookup answer those.",
                "properties": {
                  "adopted_total": {
                    "description": "Adoções já registradas nessa cidade, desde o início do catálogo.",
                    "title": "Adopted Total",
                    "type": "integer"
                  },
                  "available_count": {
                    "description": "Pets dessa cidade disponíveis para adoção agora. É este o número para dizer quantos pets a cidade TEM — `pet_count` e os campos por espécie, idade, porte e raça contam também os já adotados e os anúncios antigos, então são sempre maiores ou iguais a este.",
                    "title": "Available Count",
                    "type": "integer"
                  },
                  "by_age": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Quantos por faixa etária: 'filhote', 'adulto', 'idoso'. Pets sem idade informada ficam de fora, então pode somar menos que `total_ever`.",
                    "title": "By Age",
                    "type": "object"
                  },
                  "by_size": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Quantos por porte: 'pequeno', 'médio', 'grande'. Pets sem porte informado ficam de fora, então pode somar menos que `total_ever`.",
                    "title": "By Size",
                    "type": "object"
                  },
                  "by_species": {
                    "additionalProperties": {
                      "type": "integer"
                    },
                    "description": "Quantos por espécie: chaves 'cachorro' e 'gato'. Somam `total_ever`.",
                    "title": "By Species",
                    "type": "object"
                  },
                  "city": {
                    "description": "Cidade e UF, ex.: 'Campinas - SP'.",
                    "title": "City",
                    "type": "string"
                  },
                  "national_pct": {
                    "description": "Percentual de todo o catálogo histórico que está nessa cidade, ex.: 2.4. Calculado sobre `total_ever`.",
                    "title": "National Pct",
                    "type": "number"
                  },
                  "new_last_24h": {
                    "description": "Pets que entraram no catálogo dessa cidade em 24h.",
                    "title": "New Last 24H",
                    "type": "integer"
                  },
                  "pet_count": {
                    "description": "Pets já anunciados nessa cidade, de qualquer data. Inclui os já adotados e anúncios antigos, então pode ser bem maior que o número disponível agora. Não prometa à pessoa que são recentes.",
                    "title": "Pet Count",
                    "type": "integer"
                  },
                  "rank": {
                    "description": "Posição da cidade no ranking nacional por `total_ever` (1 = 1º).",
                    "title": "Rank",
                    "type": "integer"
                  },
                  "rescuer_count": {
                    "description": "ONGs e protetores com pets anunciados nessa cidade.",
                    "title": "Rescuer Count",
                    "type": "integer"
                  },
                  "top_breeds": {
                    "description": "As raças mais comuns na cidade em todo o histórico, as mais numerosas primeiro.",
                    "items": {
                      "$ref": "#/$defs/AgentBreedCount"
                    },
                    "title": "Top Breeds",
                    "type": "array"
                  },
                  "total_ever": {
                    "description": "Pets já anunciados nessa cidade desde o início do catálogo, sem recorte de tempo. É a base dos campos por espécie, idade e porte, do `rank` e do `national_pct` — todos históricos. `pet_count` carrega hoje o mesmo número: este retorno não tem um recorte de 'anunciado agora'.",
                    "title": "Total Ever",
                    "type": "integer"
                  }
                },
                "required": ["adopted_total", "available_count", "by_age", "by_size", "by_species", "city", "national_pct", "new_last_24h", "pet_count", "rank", "rescuer_count", "top_breeds", "total_ever"],
                "title": "AgentCityStats",
                "type": "object"
              },
              "AgentToolError": {
                "description": "The error branch of every tool's return type.\n\nErrors are DATA, never a raised exception: a raised one aborts the calling\nmodel's tool loop, while this arrives as a normal result the model can read\nand act on. It is part of the declared output schema so a client sees the\nbranch exists before it ever hits one.",
                "properties": {
                  "error": {
                    "description": "O que impediu a consulta e o que enviar na próxima chamada. Leia e corrija a chamada; NUNCA responda que não existem pets por causa disto.",
                    "title": "Error",
                    "type": "string"
                  }
                },
                "required": ["error"],
                "title": "AgentToolError",
                "type": "object"
              }
            },
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/AgentCityStats"
                  },
                  {
                    "$ref": "#/$defs/AgentToolError"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "get_city_statsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ver números do catálogo na cidade"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:817f4395e3c59459ba8c5db5a7012ed6077f65351cdc7026bb81865fae9e87da"
        },
        {
          "name": "get_pet_details",
          "title": "Ver ficha completa do pet",
          "description": "Ficha completa de um pet: saúde, cuidados, convivência e como falar com a ONG. Aceita o código curto do link ou o id de um pet já listado. Traz o `status` do pet e o resultado de cada item de `health_conditions`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pet_ref": {
                "description": "Código curto do pet (ex.: 'ab12cd') ou o identificador da ficha.",
                "title": "Pet Ref",
                "type": "string"
              }
            },
            "required": ["pet_ref"],
            "title": "get_pet_detailsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentContact": {
                "properties": {
                  "kind": {
                    "description": "Tipo do canal, já em português: 'WhatsApp', 'Telefone', 'E-mail' ou 'Site'.",
                    "title": "Kind",
                    "type": "string"
                  },
                  "value": {
                    "description": "O contato em si, já validado e formatado.",
                    "title": "Value",
                    "type": "string"
                  }
                },
                "required": ["kind", "value"],
                "title": "AgentContact",
                "type": "object"
              },
              "AgentHealthCondition": {
                "description": "A reported condition AND its diagnostic result.\n\nThe two travel together or not at all: a NEGATIVE FIV exam is the opposite\nof an FIV diagnosis, and emitting the condition alone would have an\nassistant tell an adopter the pet is positive when the ONG said it is not.",
                "properties": {
                  "condition": {
                    "description": "Condição examinada, ex.: 'FIV', 'FELV'.",
                    "title": "Condition",
                    "type": "string"
                  },
                  "status": {
                    "description": "Resultado: 'positivo', 'negativo', 'suspeito' ou 'tratado'. LEIA este campo antes de afirmar qualquer coisa: 'negativo' significa que o pet NÃO tem a condição.",
                    "title": "Status",
                    "type": "string"
                  }
                },
                "required": ["condition", "status"],
                "title": "AgentHealthCondition",
                "type": "object"
              },
              "AgentPetDetail": {
                "properties": {
                  "about": {
                    "anyOf": [
                      {
                        "additionalProperties": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Seções do 'Sobre o pet' (personalidade, rotina, cuidados).",
                    "title": "About"
                  },
                  "adoption_evidence": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Só quando status='adopted': 'announced' (a ONG anunciou) ou 'unlisted' (o post saiu do ar e a ONG confirma isso como adoção). null nos demais status.",
                    "title": "Adoption Evidence"
                  },
                  "adoption_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Link da ficha do pet. SEMPRE mostre este link na resposta.",
                    "title": "Adoption Url"
                  },
                  "age": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Idade legível, ex.: '6 meses', '2 anos'. Acima de um ano a idade é dada em anos inteiros; abaixo, em meses.",
                    "title": "Age"
                  },
                  "age_category": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Faixa etária: 'filhote', 'adulto' ou 'idoso'.",
                    "title": "Age Category"
                  },
                  "breed": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Raça informada; a maioria é SRD (sem raça definida).",
                    "title": "Breed"
                  },
                  "city": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Cidade e UF onde o pet está, ex.: 'Campinas - SP'.",
                    "title": "City"
                  },
                  "colors": {
                    "description": "Cores e padrões da pelagem, já em português (ex.: 'preto', 'rajada').",
                    "items": {
                      "type": "string"
                    },
                    "title": "Colors",
                    "type": "array"
                  },
                  "contact_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
