        {
          "name": "search_pets",
          "title": "Buscar pets para adoção",
          "description": "Busca em TODO o catálogo de cães e gatos para adoção no Brasil, por filtros como cidade, espécie, porte e idade, ou pelo nome do pet. É a busca padrão de quem quer adotar. Inclui pets já adotados, indicados em `status`; cada pet traz o `adoption_url` da ficha.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age_max_months": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Idade máxima em meses. O catálogo só distingue três faixas — filhote, adulto e idoso — então sem porte 6 e 12 selecionam os mesmos pets. Os cortes mudam com espécie e porte: idoso a partir de 8 anos no cão grande, 9 no médio, 10 no pequeno e no gato.",
                "title": "Age Max Months"
              },
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Amplia a busca em volta de `city`: 'city'/'cidade' (padrão, só a cidade), 'neighbors'/'vizinhas' (mais as cidades que fazem divisa) ou 'radius'/'raio' (mais as cidades a até `radius_km` km). Resultados: a cidade primeiro, depois as vizinhas, depois o resto. Não combina com `name`.",
                "title": "Area"
              },
              "breed": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Raça: slug ('golden-retriever') ou nome em português ('pastor alemão'). A maioria do catálogo é SRD (sem raça definida).",
                "title": "Breed"
              },
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Nome do MUNICÍPIO por extenso, não do bairro nem abreviado: 'Belo Horizonte', não 'BH'. Acento é opcional. Se o nome for ambíguo, ou se nenhuma ONG tiver pets ali hoje, o erro explica o que corrigir; isso não significa que a cidade não exista.",
                "title": "City"
              },
              "good_with_cats": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Somente pets que convivem bem com gatos.",
                "title": "Good With Cats"
              },
              "good_with_dogs": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Somente pets que convivem bem com cães.",
                "title": "Good With Dogs"
              },
              "good_with_kids": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Somente pets que convivem bem com crianças.",
                "title": "Good With Kids"
              },
              "include_older": {
                "default": false,
                "description": "Sem efeito no momento: o catálogo devolve os pets anunciados em qualquer data, independente deste parâmetro. Mantido por compatibilidade. Um resultado pode ser antigo: `days_without_update`, quando vem, diz há quanto tempo.",
                "title": "Include Older",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Quantos resultados devolver por página. Valores acima de 24 são reduzidos a 24. Buscar por `name` devolve no máximo 5: é uma lista para confirmar, não para navegar.",
                "title": "Limit",
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Nome do pet como a pessoa escreveu ('nina', 'bebe'). Acentos e maiúsculas não importam; erros de grafia geralmente NÃO são encontrados. `name_match.confidence` diz quão certo é o pet encontrado. Se a lista vier vazia, o nome não foi encontrado como escrito.",
                "title": "Name"
              },
              "neutered": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "true devolve somente pets castrados. `false` é IGNORADO pelo mesmo motivo de `vaccinated`; o valor de cada pet está em `neutered`.",
                "title": "Neutered"
              },
              "page": {
                "default": 1,
                "description": "Página, começando em 1.",
                "title": "Page",
                "type": "integer"
              },
              "radius_km": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
