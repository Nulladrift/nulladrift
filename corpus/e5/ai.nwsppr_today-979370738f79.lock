{
  "lockfileVersion": 2,
  "subjects": {
    "ai.nwsppr/today": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.nwsppr.ai/signup"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nwsppr-signup",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "nwsppr is a newspaper for one company's marketing team: industry news ranked for that company's competitors, products, customers and topics. Use todays_top_stories when the person wants today's news in an industry: no sign-in, and every story links its source. Use list_plans to see the price and add-ons. Call start_signup only when the person has asked to sign up or agreed to it, then pass on the link or message it returns: the person finishes and pays themselves. Once they have a paper, connect to the read-only paper server at /mcp on this host.",
      "tools": [
        {
          "name": "list_plans",
          "title": "nwsppr plans",
          "description": "The plan and its add-ons, what each includes, the price when it's public, the industries nwsppr covers, and how buying works.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0937f7a810ddf8b381c4d3762b5225a6cb194a7ed05721e4f964e8e0898ce305"
        },
        {
          "name": "start_signup",
          "title": "Start a signup for a person",
          "description": "Starts nwsppr for the person's company with their own work email, once they have asked for it or agreed to it (person_agreed). Nothing is charged: the reply has a message and usually a link (Stripe checkout or sign-in) for the person to open, or says they're on the waitlist.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "The company's name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "The person's work email.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "industry": {
                "description": "The company's industry: a slug from list_plans, or its name (e.g. 'fintech').",
                "maxLength": 80,
                "type": "string"
              },
              "keep_up_with": {
                "description": "Competitors, products and topics to follow, comma separated.",
                "maxLength": 400,
                "type": "string"
              },
              "person_agreed": {
                "const": true,
                "description": "true: the person asked for or agreed to this signup.",
                "type": "boolean"
              },
              "plan": {
                "default": "daily",
                "description": "Plan id from list_plans. There is one plan, daily; add-ons are added later inside the app.",
                "enum": ["daily"],
                "type": "string"
              },
              "website": {
                "description": "The company's website.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["company", "email", "person_agreed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d2736e4539ceb787a8d34222d1e11ce07d39133abddee6060d3fe81813442845"
        },
        {
          "name": "todays_top_stories",
          "title": "Today's top industry stories",
          "description": "The day's top news stories for an industry, picked and ranked by nwsppr, each with why it matters, the original source link, and how soon a company should act. No sign-in. Leave industry out for a front page with the lead story from each industry. Every story includes its original source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "industry": {
                "description": "An industry slug from list_plans or a plain name, e.g. 'fintech', 'healthcare', 'b2b software'. Leave out for a front page.",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many stories, 1 to 6.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9d85d30117f2538636182434b2e5772db6875aa1e0f1c3c7f8d7137a83f0e02"
        }
      ],
      "digest": "sha256:16f3ab1622f7f3c6941873118ea80338ca2c721999bebe42d355e32a49d88e13"
    }
  }
}
