      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Öffentliche Aktionen der Website https://drei-business.at/. Inhalte: content_summary (Überblick), content_full (alles, in Teilen), content_section (eine Seite/ein Abschnitt) — jede Antwort beginnt mit der Änderungsliste. Buchen, Anfragen und Bestellen nur im Auftrag und mit den Angaben der betroffenen Person.",
      "tools": [
        {
          "name": "content_full",
          "title": "Ganze Website als Text",
          "description": "Der komplette Inhalt der Website, strukturiert nach Seiten und Abschnitten, mit Quellen (references) und Bildbeschreibungen. Zuerst die Änderungsliste (was wann dazukam, entfernt oder geändert wurde). Lange Antworten kommen in Teilen: nextCursor an cursor übergeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Fortsetzung aus nextCursor der vorigen Antwort",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2881783d1bdb4083a84e8ba2f812c7bdc2990af1be2c56047c302060705a98dd"
        },
        {
          "name": "content_section",
          "title": "Ein Abschnitt oder eine Seite",
          "description": "Eine Seite (page) oder ein Abschnitt (page + section) als Text mit Quellen und Bildern. Kennungen aus content_full oder content_summary (pages). Lange Texte in Teilen: nextOffset an offset übergeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Fortsetzung aus nextOffset",
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Seitenkennung, z. B. home oder de/leistungen",
                "type": "string"
              },
              "section": {
                "description": "Abschnittskennung (optional; ohne = ganze Seite)",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb78ca4efcb63e2279b5fab8b66ccec4830f52769c34556a514e0288cdd18113"
        },
        {
          "name": "content_summary",
          "title": "Zusammenfassung des Betriebs",
          "description": "Kurzfassung: Betrieb, Leistungen mit öffentlichen Preisen, Gebiet, Öffnungszeiten, Kontakt, dazu die Seitenliste mit Abschnitts-Kennungen. Zuerst die Änderungsliste.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8938038a6bc877c6312dc69e825ce11156edd91fc83866c08791f46af53c6584"
        },
        {
          "name": "get_business_info",
          "title": "Betrieb: Kontakt, Standorte, Öffnungszeiten",
          "description": "Name, Standorte mit Adresse und Telefon, Öffnungszeiten und Leistungen dieses Betriebs, wie auf der Website veröffentlicht.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83e3702802ebd8fbe87603d6cff764570a7c956f148360904f559d900c713f01"
        },
        {
          "name": "request_callback",
          "title": "Rückruf oder Nachricht",
          "description": "Schickt dem Betrieb eine Nachricht oder eine Rückrufbitte; sie landet im Posteingang des Betriebs, der Betrieb bekommt eine E-Mail und meldet sich. Kein Termin. Nur im Auftrag der Person, mit ihrer Telefonnummer und/oder E-Mail-Adresse. Für einen Rückruf die Telefonnummer und die passende Zeit in message angeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "E-Mail-Adresse (optional; ohne E-Mail entsteht kein Kontakt im CRM, die Nachricht kommt trotzdem an)",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "message": {
                "description": "Anliegen in den Worten der Person, bei Rückruf mit passender Zeit (bis 4000 Zeichen)",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Vor- und Nachname (bis 120 Zeichen)",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Telefonnummer für den Rückruf",
                "maxLength": 40,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["message", "name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
