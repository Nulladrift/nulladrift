{
  "lockfileVersion": 2,
  "subjects": {
    "at.drei-business/business-mobilfunk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://drei-business.at/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Drei Business (mekyn)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Öffentliche Aktionen der Website https://drei-business.at/. Inhalte: content_summary (Überblick), content_full (alles, in Teilen), content_section (eine Seite/ein Abschnitt) — jede Antwort beginnt mit der Änderungsliste. Buchen, Anfragen und Bestellen nur im Auftrag und mit den Angaben der betroffenen Person.",
      "tools": [
        {
          "name": "content_full",
          "title": "Ganze Website als Text",
          "description": "Der komplette Inhalt der Website, strukturiert nach Seiten und Abschnitten, mit Quellen (references) und Bildbeschreibungen. Zuerst die Änderungsliste (was wann dazukam, entfernt oder geändert wurde). Lange Antworten kommen in Teilen: nextCursor an cursor übergeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Fortsetzung aus nextCursor der vorigen Antwort",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2881783d1bdb4083a84e8ba2f812c7bdc2990af1be2c56047c302060705a98dd"
        },
        {
          "name": "content_section",
          "title": "Ein Abschnitt oder eine Seite",
          "description": "Eine Seite (page) oder ein Abschnitt (page + section) als Text mit Quellen und Bildern. Kennungen aus content_full oder content_summary (pages). Lange Texte in Teilen: nextOffset an offset übergeben.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Fortsetzung aus nextOffset",
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "Seitenkennung, z. B. home oder de/leistungen",
                "type": "string"
              },
              "section": {
                "description": "Abschnittskennung (optional; ohne = ganze Seite)",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb78ca4efcb63e2279b5fab8b66ccec4830f52769c34556a514e0288cdd18113"
        },
        {
          "name": "content_summary",
          "title": "Zusammenfassung des Betriebs",
          "description": "Kurzfassung: Betrieb, Leistungen mit öffentlichen Preisen, Gebiet, Öffnungszeiten, Kontakt, dazu die Seitenliste mit Abschnitts-Kennungen. Zuerst die Änderungsliste.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8938038a6bc877c6312dc69e825ce11156edd91fc83866c08791f46af53c6584"
        },
        {
          "name": "get_business_info",
          "title": "Betrieb: Kontakt, Standorte, Öffnungszeiten",
          "description": "Name, Standorte mit Adresse und Telefon, Öffnungszeiten und Leistungen dieses Betriebs, wie auf der Website veröffentlicht.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:83e3702802ebd8fbe87603d6cff764570a7c956f148360904f559d900c713f01"
        },
        {
          "name": "get_request_status",
          "title": "Stand eines Vorgangs",
          "description": "Stand eines Vorgangs, den ein Agent auf dieser Website mit clientRequestId angelegt hat (Termin, Bestellung, Terminanfrage, Werkstatt-Anfrage, Rückrufbitte oder Besichtigungsanfrage): found, kind, status, Kennung und bei Terminen Beginn und Ende. Ohne Personendaten und ohne cancelToken; den gibt es nur in der ursprünglichen Antwort (dafür den ursprünglichen Aufruf mit derselben clientRequestId und denselben Angaben wiederholen).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientRequestId": {
                "description": "Die clientRequestId des ursprünglichen Aufrufs",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              }
            },
            "required": ["clientRequestId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:086f6aa1dc48b99daafad8654f8992c42ad8e6349dc97196680c4a363cd22a48"
        },
        {
          "name": "list_catalog",
          "title": "Katalog",
          "description": "Katalog des Shops mit stabiler productId/variantId, Kategorie, Beschreibung, Bild und Varianten. Händler-Shop: Preise erst nach Händler-Login, daher unitMinor null und priceVisibility \"b2b_login_required\" – nie ein erfundener Preis. Seitenweise über cursor/nextCursor.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter (slug or name)",
                "type": "string"
              },
              "cursor": {
                "description": "Pagination cursor",
                "type": "string"
              },
              "limit": {
                "description": "Default 25",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "locationId": {
                "description": "Optional with several locations",
                "type": "string"
              },
              "query": {
                "description": "Optional search term (name/SKU)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bf7c22ef8f5e03d410aeebb443f86780a4a97290317985a178eb10faf62f8897"
        },
        {
          "name": "quote_order",
          "title": "Preisvorschau einer Bestellung",
          "description": "Unverbindliche Preis- und Verfügbarkeitsvorschau ohne Bestellung und ohne Zahlung. Im Händler-Shop ohne Login gibt es keine Preise: Antwort status \"unavailable\" mit reason \"b2b_login_required\" je Artikel.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countryCode": {
                "description": "ISO-2, default AT",
                "type": "string"
              },
              "fulfillment": {
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "productId": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 100,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variantId": {
                      "type": "string"
                    }
                  },
                  "required": ["productId", "quantity"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "locationId": {
                "type": "string"
              },
              "postalCode": {
                "description": "Postal code for shipping (required for delivery)",
                "type": "string"
              }
            },
            "required": ["fulfillment", "items"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21729d8631f6780a2d9f3d8cc61d556c1384883ab6a8b05f00bb10d2a66ba9ad"
        },
        {
          "name": "request_callback",
          "title": "Rückruf oder Nachricht",
          "description": "Schickt dem Betrieb eine Nachricht oder eine Rückrufbitte; sie landet im Posteingang des Betriebs, der Betrieb bekommt eine E-Mail und meldet sich. Kein Termin. Nur im Auftrag der Person, mit ihrer Telefonnummer und/oder E-Mail-Adresse. Für einen Rückruf die Telefonnummer und die passende Zeit in message angeben. Mit clientRequestId kann der Aufruf nach einer verlorenen Antwort gefahrlos wiederholt werden.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientRequestId": {
                "description": "Eigene Vorgangs-ID des Agenten (optional, 8–64 Zeichen: Buchstaben, Ziffern, _ und -), am besten zufällig, z. B. eine UUID. Gleiche ID mit gleichen Angaben = dieselbe Antwort und kein zweiter Vorgang; mit anderen Angaben wird der Aufruf abgelehnt. get_request_status findet den Vorgang mit dieser ID.",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "Ausdrückliche Einwilligung der Person, dass der Betrieb ihre Angaben für diese Anfrage verarbeitet und sie kontaktiert – nur true, wenn die Person zugestimmt hat. Ohne consent: true wird nichts gespeichert.",
                "type": "boolean"
              },
              "email": {
                "description": "E-Mail-Adresse (optional; ohne E-Mail entsteht kein Kontakt im CRM, die Nachricht kommt trotzdem an)",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "message": {
                "description": "Anliegen in den Worten der Person, bei Rückruf mit passender Zeit (bis 4000 Zeichen)",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Vor- und Nachname (bis 120 Zeichen)",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Telefonnummer für den Rückruf",
                "maxLength": 40,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["consent", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afad3d67a192b37c70ccb53b606815b5cd9caf93f9c77b28db61dcbe61f085b5"
        }
      ],
      "digest": "sha256:2f0035e9d20285eb84749ea45e3c042039b3ecd6fb155e37103a93b63ec9e42b"
    }
  }
}
