      "instructions": "RentalHunter lists rentals, Pune first, for people relocating for work, including IT corridors such as Baner, Kharadi, Hinjewadi, Viman Nagar, Wakad, and Magarpatta. Other listed cities are in India, Southeast Asia, and the UAE. A hunt needs city, locality, stay length, budget in that city's currency, move-in timing, and any must-haves the seeker names. search_rentals applies those filters. A locality filter is exact. After city, choose property_type apartment or pg (or accommodation whole_home/pg). PG uses per-bed rent and sharing — not apartment BHK brackets. Set furnished true only when the seeker explicitly asks for furnished. Omit it for any furnishing. Do not assume furnished. pet_friendly, near_transit, near_coworking, attached bath, AC, lift, and no curfew work the same way: omit or false means not required, not excluded. area_min is an optional minimum size; pass area_unit as sqft or sqm. 330 nights is 11 months, the usual India residential lease. Pune budgets are INR. Typical Pune bands: 1BHK 15000–30000 INR, 2BHK 20000–45000 INR, 3BHK 30000–65000 INR per month. search_rentals returns at most 10 homes. It is not a full inventory export. search_pg, get_pg, and save_pg_alert cover PG / co-living beds (per-bed rent, sharing, meals). list_cities returns the live USD conversion, cached about 6 hours. Each result includes local-currency rent, locality, stay fit, deposit, lock-in, verification badges, freshness, and a listing link. get_listing returns one home by id. An empty result means no matching home is listed. save_hunt_alert stores an email for this query only when consent is true: the seeker agrees to share that email with partners whose listings match. It does not take a phone number. Sharing a phone, only with the partner whose property the seeker shortlists, is a later website step and is not collected here. Privacy: https://rentalhunter.co/privacy. Terms: https://rentalhunter.co/terms. Support: https://rentalhunter.co/support (tanmay@rentalhunter.co). Website hunt: https://rentalhunter.co/start. A partner with an API token from signed-in partner settings can call my_listings, listing_performance, my_leads, and suggestions for their own homes only.",
