        {
          "name": "guided_rental_questionnaire",
          "title": "Check hunt details and search",
          "description": "Reports which hunt fields are still missing. When city, stay length, and budget are present, searches inventory. Does not save an alert or collect an email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accommodation": {
                "description": "Legacy stay type after city. Prefer property_type. pg starts the PG filter path (no bedroom/BHK filters). whole_home is a standard apartment hunt. Omit for any category.",
                "enum": ["pg", "whole_home"],
                "type": "string"
              },
              "amenities": {
                "description": "PG property amenities (all required must be present on the listing).",
                "items": {
                  "enum": ["wifi", "housekeeping", "laundry", "power_backup", "parking", "gym"],
                  "type": "string"
                },
                "type": "array"
              },
              "area_min": {
                "description": "Optional minimum apartment size. Pair with area_unit. Omit for any size.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "area_unit": {
                "description": "Unit for area_min. Use sqft in Pune and sqm in other cities. Defaults from the city when area_min is set and this is omitted.",
                "enum": ["sqft", "sqm"],
                "type": "string"
              },
              "attached_bath": {
                "description": "True only when an attached bath is required. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "available_by": {
                "description": "Move-in by date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "bedrooms_min": {
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "description": "City slug",
                "enum": ["pune", "ho-chi-minh", "bangkok", "hanoi", "da-nang", "phuket", "dubai", "sharjah"],
                "type": "string"
              },
              "currency": {
                "description": "Budget currency for price_max. Defaults to the city's local currency. USD rates are the live cached interbank quote. Saved alerts store the USD equivalent.",
                "enum": ["INR", "USD", "EUR", "GBP", "AED", "THB", "VND"],
                "type": "string"
              },
              "deposit_months_max": {
                "description": "Max security deposit in months of rent",
                "maximum": 12,
                "minimum": 0,
                "type": "number"
              },
              "furnished": {
                "description": "Set true only when the seeker explicitly asks for furnished. Omit for any furnishing.",
                "type": "boolean"
              },
              "gender": {
                "description": "PG gender filter.",
                "enum": ["boys", "girls", "coed"],
                "type": "string"
              },
              "has_ac": {
                "description": "True only when AC is required. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "has_lift": {
                "description": "True only when a lift or elevator is required. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "has_pets": {
                "description": "True when the seeker has pets. Excludes homes that explicitly disallow pets. Unknown pet policy still appears as ask about pets.",
                "type": "boolean"
              },
              "locality": {
                "description": "Exact area inside the city, such as Baner or Kharadi. A Baner search does not return Hinjewadi.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "lock_in_max": {
                "description": "Max lock-in months the seeker will accept",
                "maximum": 24,
                "minimum": 0,
                "type": "integer"
              },
              "meals_included": {
                "description": "PG meals included in rent.",
                "type": "boolean"
              },
              "near_coworking": {
                "description": "True only when near coworking is required. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "near_transit": {
                "description": "True only when near transit is required. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "no_curfew": {
                "description": "True when the seeker needs no gate curfew. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "pet_friendly": {
                "description": "True only when pets are required. Omit or false means not required, not excluded.",
                "type": "boolean"
              },
              "price_max": {
                "description": "Max monthly rent in `currency` units. Defaults to the city's local currency (Pune INR, Dubai/Sharjah AED, Bangkok/Phuket THB, Vietnam VND). Example: 30000 INR, 4000 AED.",
                "maximum": 500000000,
                "minimum": 100,
                "type": "number"
              },
              "property_type": {
                "description": "Apartment vs PG / co-living after city. When pg, use sharing, gender, rent_min/rent_max per bed, meals_included, attached_bath, ac, suits, amenities — not bedrooms_min.",
                "enum": ["apartment", "pg"],
                "type": "string"
              },
              "rent_max": {
                "description": "PG max rent per bed per month (INR).",
                "maximum": 500000,
                "minimum": 0,
                "type": "number"
              },
              "rent_min": {
                "description": "PG min rent per bed per month (INR).",
                "maximum": 500000,
                "minimum": 0,
                "type": "number"
              },
              "sharing": {
                "description": "PG sharing types (multi-select).",
                "items": {
                  "enum": ["private", "twin", "triple", "4plus"],
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "description": "Household: Single, Couple, or Family (values single, partner, or family). single matches Everyone and Singles only. partner is Couple and matches Everyone and Couples. family matches Everyone and Families only.",
                "enum": ["single", "partner", "family"],
                "type": "string"
              },
              "stay_nights": {
                "anyOf": [
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 14,
                    "type": "number"
                  },
                  {
                    "const": 30,
                    "type": "number"
                  },
                  {
                    "const": 60,
                    "type": "number"
                  },
                  {
                    "const": 90,
                    "type": "number"
                  },
                  {
                    "const": 180,
                    "type": "number"
                  },
                  {
                    "const": 330,
                    "type": "number"
                  },
                  {
                    "const": 365,
                    "type": "number"
                  }
                ],
                "description": "Desired stay length in nights (7=1 week … 330=11 months, 365=12 months). 11 months is offered everywhere; it is the standard residential lease in India."
              },
              "suits": {
                "description": "PG suits: working professionals or students.",
                "enum": ["professional", "student"],
                "type": "string"
              }
            },
            "type": "object"
          },
