        {
          "name": "compute_dscr",
          "title": "Debt service coverage ratio (DSCR)",
          "description": "Debt service coverage ratio of a rental, two ways: NOI divided by yearly principal and interest, and the figure DSCR-loan lenders use on 1-4 unit rentals, scheduled rent divided by PITIA (payment plus tax, insurance and HOA). The two definitions give different numbers for the same property, which is why quotes of a DSCR often disagree; both are labelled in the answer. With target_dscr, rate_pct and amort_years the answer also sizes the largest loan the NOI supports. Send noi and annual_debt_service, plus gross_rent_annual, annual_tax, annual_insurance and annual_hoa for the lender figure. Zero debt service is refused: with no debt, DSCR does not exist.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amort_years": {
                "description": "Amortization in years, e.g. 30, for the largest loan",
                "type": ["number", "string"]
              },
              "annual_debt_service": {
                "description": "Principal and interest paid per year, e.g. 22000",
                "type": ["number", "string"]
              },
              "annual_hoa": {
                "description": "HOA dues per year, e.g. 0, for the lender figure",
                "type": ["number", "string"]
              },
              "annual_insurance": {
                "description": "Insurance per year, e.g. 1800, for the lender figure",
                "type": ["number", "string"]
              },
              "annual_tax": {
                "description": "Property tax per year, e.g. 3600, for the lender figure",
                "type": ["number", "string"]
              },
              "gross_rent_annual": {
                "description": "Scheduled rent per year, e.g. 38400, for the lender rent-to-PITIA figure",
                "type": ["number", "string"]
              },
              "noi": {
                "description": "Net operating income per year, e.g. 28000",
                "type": ["number", "string"]
              },
              "rate_pct": {
                "description": "Loan interest rate in percent, e.g. 7.25, for the largest loan",
                "type": ["number", "string"]
              },
              "target_dscr": {
                "description": "Lender minimum DSCR, e.g. 1.25, to size the largest loan",
                "type": ["number", "string"]
              }
            },
            "required": ["annual_debt_service", "noi"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Debt service coverage ratio (DSCR)"
