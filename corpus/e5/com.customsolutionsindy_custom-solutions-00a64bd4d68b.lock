      "instructions": "Read-only facts and calculations from Custom Solutions, Corp (Indianapolis). The content tools return its published answers and notes, the parts of its digital-services offer, the Central Indiana counties it serves and its company facts. The calculator tools return real estate figures (NOI, cap rate, cash-on-cash, DSCR, mortgage payment, amortization, break-even occupancy, maximum offer, flip profit, rental or flip, IRR, 1031 exchange deadlines and rent-raise turnover) computed by a deterministic engine: computed facts and no interpretation, as education; they are not financial, legal or tax advice. Every calculator result carries an attribution sentence, a citation object and a permalink that returns the same answer. The usage terms permit retrieving, quoting and citing results with credit; use as training or fine-tuning data is not permitted. An unusable input returns a refusal with a named code and the field, and no value is substituted. Inputs are not stored or logged; hourly totals of requests per tool are kept. Tool calls are throttled per client, handshakes and tool lists cost nothing, and a throttled call returns an ordinary result stating the wait. The AI visibility tool reads a named public website's home page, up to five inner pages, robots.txt and sitemap and reports a site readiness score, with whether each assistant's crawlers can reach it; it is indicative, a result is cached per domain for one hour, and private addresses are refused by name. The turnover tool computes an employee turnover rate and the cost of each departure from the figures sent, with an optional comparison to the 2025 Bureau of Labor Statistics separations rate for an industry. Prices are not published.",
      "tools": [
        {
          "name": "calculate_employee_turnover_cost",
          "title": "Employee Turnover Cost Calculator",
          "description": "Employee turnover rate and turnover cost from a business's own figures. Rate: people who left divided by average headcount times 100 (the Bureau of Labor Statistics separation-rate arithmetic), annualized for a period under 12 months, each step shown. An industry code adds the 2025 Bureau of Labor Statistics separations rate, published monthly; the yearly figure is 12 times it. Cost per departure adds only the lines sent (hiring, empty-seat days, ramp-up at a productivity gap that defaults to 50%, training hours, lost-knowledge hours); no percent-of-salary rule of thumb.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "average_headcount": {
                "description": "Average employees (or start and end)",
                "type": "number"
              },
              "headcount_end": {
                "description": "Employees at end",
                "type": "number"
              },
              "headcount_start": {
                "description": "Employees at start",
                "type": "number"
              },
              "hiring_cost": {
                "description": "Dollars per hire",
                "type": "number"
              },
              "industry": {
                "description": "Industry code, e.g. retail or health-care; a wrong code returns the list",
                "maxLength": 40,
                "type": "string"
              },
              "knowledge_hours": {
                "description": "Hours recovering lost knowledge",
                "type": "number"
              },
              "knowledge_rate": {
                "description": "Dollars per hour for that",
                "type": "number"
              },
              "monthly_pay": {
                "description": "Monthly pay, dollars",
                "type": "number"
              },
              "period_months": {
                "description": "Months, 1 to 12 (default 12)",
                "type": "number"
              },
              "productivity_gap_pct": {
                "description": "Percent short during ramp-up (default 50)",
                "type": "number"
              },
              "ramp_months": {
                "description": "Months to full speed",
                "type": "number"
              },
              "separations": {
                "description": "People who left in the period",
                "type": "number"
              },
              "trainer_hours": {
                "description": "Trainer hours",
                "type": "number"
              },
              "trainer_rate": {
                "description": "Trainer dollars per hour",
                "type": "number"
              },
              "vacancy_daily_cost": {
                "description": "Dollars per empty day",
                "type": "number"
              },
              "vacancy_days": {
                "description": "Days the seat is empty",
                "type": "number"
              }
            },
            "required": ["separations"],
            "type": "object"
          },
