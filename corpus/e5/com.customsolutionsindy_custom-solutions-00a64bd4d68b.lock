        {
          "name": "compute_noi",
          "title": "Net operating income (NOI)",
          "description": "Net operating income (NOI) of a rental property per year: scheduled rent less vacancy, management, maintenance, capital reserve and fixed costs, before any mortgage payment. NOI is easy to overstate: management is charged on rent actually collected, maintenance and reserves on scheduled rent, and the debt payment is left out entirely, so a figure that subtracts the mortgage is cash flow instead. Send the monthly rent for the whole property; vacancy, management, maintenance and capex as percents (8 means 8%); and the yearly fixed costs (tax, insurance, owner-paid utilities, HOA). Any omitted expense counts as 0 and is listed in the answer's inputs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annual_fixed_costs": {
                "description": "Property tax, insurance, owner-paid utilities, HOA and other fixed costs per year, e.g. 5400",
                "type": ["number", "string"]
              },
              "capex_pct": {
                "description": "Capital reserve as a percent of scheduled rent, e.g. 5",
                "type": ["number", "string"]
              },
              "maintenance_pct": {
                "description": "Repairs and maintenance as a percent of scheduled rent, e.g. 8",
                "type": ["number", "string"]
              },
              "management_pct": {
                "description": "Property management as a percent of collected rent, e.g. 8",
                "type": ["number", "string"]
              },
              "monthly_rent": {
                "description": "Scheduled rent for the whole property per month, in dollars, e.g. 2400",
                "type": ["number", "string"]
              },
              "other_income_monthly": {
                "description": "Laundry, parking or pet income per month, e.g. 50",
                "type": ["number", "string"]
              },
              "vacancy_pct": {
                "description": "Vacancy and credit loss as a percent of rent, e.g. 8 for 8%",
                "type": ["number", "string"]
              }
            },
            "required": ["monthly_rent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
