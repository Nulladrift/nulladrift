        {
          "name": "compute_amortization",
          "title": "Amortization schedule",
          "description": "Amortization schedule of a loan: interest, principal and ending balance for each year, and the balance left after a chosen year, which is the payoff figure behind a refinance or a sale. Balances drift when a schedule mixes yearly and monthly compounding or skips interest-only months; this one sums the monthly schedule and holds principal at zero during interest-only months. Send loan_amount, rate_pct and amort_years (1 to 40); optionally io_months and year. The schedule covers the whole term.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amort_years": {
                "description": "Amortization in years, 1 to 40, e.g. 30",
                "type": ["number", "string"]
              },
              "io_months": {
                "description": "Interest-only months at the start, e.g. 12",
                "type": ["number", "string"]
              },
              "loan_amount": {
                "description": "Loan amount in dollars, e.g. 300000",
                "type": ["number", "string"]
              },
              "rate_pct": {
                "description": "Interest rate in percent per year, e.g. 7.25",
                "type": ["number", "string"]
              },
              "year": {
                "description": "Year whose ending balance to report, e.g. 7",
                "type": ["number", "string"]
              }
            },
            "required": ["amort_years", "loan_amount", "rate_pct"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
