        {
          "name": "compute_flip_profit",
          "title": "Flip profit",
          "description": "Profit on a buy, fix and sell: the net sale after selling costs, less price, purchase costs, repairs, holding costs and points, with the cash needed, the return on that cash and, with min_profit_pct, the most to pay and still keep that profit. Holding costs are what most flip estimates miss: interest on an interest-only loan plus tax, insurance and utilities for every month held, with months rounded up. Send price, arv, repairs, months and selling_costs_pct; optionally purchase_costs, holding_costs_monthly, loan_pct_of_price, loan_pct_of_repairs, rate_pct, points_pct and min_profit_pct. Omitted loan inputs mean an all-cash flip.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "arv": {
                "description": "Value after repairs (ARV), e.g. 260000",
                "type": ["number", "string"]
              },
              "holding_costs_monthly": {
                "description": "Tax, insurance and utilities per month while held, e.g. 400",
                "type": ["number", "string"]
              },
              "loan_pct_of_price": {
                "description": "Share of the price the lender funds, in percent, e.g. 85",
                "type": ["number", "string"]
              },
              "loan_pct_of_repairs": {
                "description": "Share of repairs the lender funds, in percent, e.g. 100",
                "type": ["number", "string"]
              },
              "min_profit_pct": {
                "description": "Minimum profit as a percent of ARV, e.g. 12, for the most to pay",
                "type": ["number", "string"]
              },
              "months": {
                "description": "Months to finish and sell, e.g. 5 (rounded up, at least 1)",
                "type": ["number", "string"]
              },
              "points_pct": {
                "description": "Points as a percent of the loan, e.g. 2",
                "type": ["number", "string"]
              },
              "price": {
                "description": "Purchase price, e.g. 150000",
                "type": ["number", "string"]
              },
              "purchase_costs": {
                "description": "Closing and other purchase costs, e.g. 3500",
                "type": ["number", "string"]
              },
              "rate_pct": {
                "description": "Interest-only rate in percent, e.g. 11",
                "type": ["number", "string"]
              },
              "repairs": {
                "description": "All repairs plus resale prep, e.g. 45000",
                "type": ["number", "string"]
              },
              "selling_costs_pct": {
                "description": "Selling costs as a percent of the sale price, e.g. 7",
                "type": ["number", "string"]
              }
            },
            "required": ["arv", "months", "price", "repairs", "selling_costs_pct"],
            "type": "object"
