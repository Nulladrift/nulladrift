        {
          "name": "compare_rental_vs_flip",
          "title": "Rental or flip",
          "description": "Whether a property earns more as a rental held for a number of years or as a flip: the rental's total profit (cash flow over the hold plus sale proceeds after selling costs and the loan payoff, less the cash invested) against the flip's profit, with the difference and the rental's yearly return. The comparison is only fair over the same money: the rental side needs its loan balance at sale and the growth of rent, expenses and value. Send price, noi, annual_debt_service, cash_invested, hold_years and flip_profit; optionally arv, loan_amount, rate_pct, amort_years, growth_pct, value_growth_pct and selling_costs_pct. Without arv the price is grown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amort_years": {
                "description": "Amortization in years, e.g. 30",
                "type": ["number", "string"]
              },
              "annual_debt_service": {
                "description": "Principal and interest per year, e.g. 9800 (0 for no loan)",
                "type": ["number", "string"]
              },
              "arv": {
                "description": "Value after repairs, e.g. 180000; the price is used when absent",
                "type": ["number", "string"]
              },
              "cash_invested": {
                "description": "Cash put into the rental, e.g. 40000",
                "type": ["number", "string"]
              },
              "flip_profit": {
                "description": "The flip's profit, e.g. 24000",
                "type": ["number", "string"]
              },
              "growth_pct": {
                "description": "Yearly growth of rent and expenses in percent, e.g. 3",
                "type": ["number", "string"]
              },
              "hold_years": {
                "description": "Years held before selling, 1 to 30, e.g. 7",
                "type": ["number", "string"]
              },
              "loan_amount": {
                "description": "Loan amount, e.g. 120000, for the balance at sale",
                "type": ["number", "string"]
              },
              "noi": {
                "description": "Stabilized NOI per year, e.g. 14000",
                "type": ["number", "string"]
              },
              "price": {
                "description": "Purchase price, e.g. 150000",
                "type": ["number", "string"]
              },
              "rate_pct": {
                "description": "Loan rate in percent, e.g. 7.25",
                "type": ["number", "string"]
              },
              "selling_costs_pct": {
                "description": "Selling costs at the end of the hold in percent, e.g. 7",
                "type": ["number", "string"]
              },
              "value_growth_pct": {
                "description": "Yearly growth of the property value in percent, e.g. 3",
                "type": ["number", "string"]
              }
            },
            "required": ["annual_debt_service", "cash_invested", "flip_profit", "hold_years", "noi", "price"],
            "type": "object"
          },
