        },
        {
          "name": "housing_trend",
          "title": "Apartment rent and jeonse trend in a Korean area",
          "description": "Month by month median apartment rent, deposit and jeonse deposit in an area of South Korea for each of the most recent months (up to 12), from reported contracts (MOLIT). Fits questions about whether rent is rising or falling in an area.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "A place in South Korea: \"Korea\" for the whole country, a province or city (\"Seoul\", \"Busan\", \"Gyeonggi\"), or a district, city or county (\"Mapo-gu\", \"Gangnam\", \"Suwon-si\", \"마포구\").",
                "type": "string"
              },
              "province": {
                "description": "Optional. The province or city the area is in, when its name exists in more than one (\"Jung-gu\" is in Seoul, Busan and other cities).",
                "type": "string"
              }
            },
            "required": ["area"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Apartment rent and jeonse trend in a Korean area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb321dcbf091edd7411b679c7bcbb0cf39ea54112b18c61f564e58ee3c2b924e"
        },
        {
          "name": "jobs_overview",
          "title": "Seoulstart Jobs at a glance",
          "description": "Counts of the open jobs on Seoulstart Jobs: how many jobs in South Korea for foreigners, remote, global (including Japan) and AI training jobs, with the Korea jobs split by role family, likely visa route, Korean level needed and posting language, and the same split for Japan jobs once Seoulstart's Japan jobs board is public. Fits questions about how many English-speaking jobs there are in Korea or Japan, or which visa routes and roles are common. Returns counts and the date of the newest listing, no job names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Seoulstart Jobs at a glance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f24940962d2318610cfa9d85762ac2c9db1d7b1b0c3a93b1352cd6190dc625ce"
        },
        {
          "name": "search_jobs",
          "title": "Search Seoulstart Jobs",
          "description": "Search open jobs for foreigners on Seoulstart: jobs in South Korea that hire people on foreign visas, remote jobs, global jobs (including Japan) and AI training work. Returns the number of matches and a link to the list on Seoulstart. Free sample jobs come back in full: title, company, location, posting date, a link to the job page and, for Korea and Japan jobs, Seoulstart's read of the language level needed and the likely visa route. Every other match is locked and carries only the role type, the city and the posting language; titles, companies, pay and apply links are for Seoulstart members. Fits questions about jobs in Korea, jobs in Japan, English-speaking jobs in Seoul or Tokyo, visa sponsorship in Korea or Japan, D-10 or E-7 jobs, and AI training work.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "english_posting": {
                "description": "true: only postings written in English.",
                "type": "boolean"
              },
              "korean": {
                "description": "Korea jobs only. none: no Korean needed. some: no Korean or conversational Korean.",
                "enum": ["none", "some"],
                "type": "string"
              },
              "limit": {
                "description": "How many jobs to return (default 5, at most 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "korea (default): jobs located in South Korea. remote: remote roles. global: jobs outside Korea, including Japan. ai_training: AI training and data annotation work.",
                "enum": ["korea", "remote", "global", "ai_training"],
                "type": "string"
              },
              "query": {
                "description": "Words to match in the job title, company or location, for example \"data analyst\", \"Samsung\", \"Busan\", \"Japan\" or \"Tokyo\". Leave empty to list the newest jobs.",
                "type": "string"
              },
              "visa_route": {
                "description": "Korea jobs only. e7: employer likely sponsors the E-7 work visa. d10: fits the D-10 job-seeker visa. e9: Employment Permit System. f_series: for people who already hold an F visa.",
                "enum": ["e7", "d10", "e9", "f_series"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Seoulstart Jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32d8ad9e8f1f62f649d932c59ac812019bb15a301c1d569bccaa4c6cf7198b92"
        },
        {
          "name": "visa_sponsoring_companies",
          "title": "Companies in Korea hiring for visa-sponsored roles",
          "description": "Employers in South Korea with open jobs on Seoulstart that mention visa sponsorship or are professional roles that usually hire on the E-7 visa, ranked by how many of their postings mention sponsorship, then by how many are likely E-7 roles, then by open jobs. This is the public list from seoulstart.com/jobs/visa-sponsorship-companies. A mention is a strong sign, not a promise of sponsorship for a given role.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_teaching": {
                "description": "true: also list schools and academies whose roles are mostly teaching jobs (usually the E-2 visa). Default false.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many employers to return (default 20, at most 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Companies in Korea hiring for visa-sponsored roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94950519e0f1a2cae2414d63ffa85b2dd786ae6580f72b179715dc7cf0df175a"
        }
      ],
      "digest": "sha256:50a52d63427a5eb7fe25396f7a3dcd76f3f909cd57728912a5bf3440d96db3bf"
    }
