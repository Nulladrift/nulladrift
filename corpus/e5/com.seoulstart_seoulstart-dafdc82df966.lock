      },
      "instructions": "Seoulstart is a practical companion for foreign residents in Korea. Jobs: search_jobs lists jobs for foreigners in South Korea, remote, global (including Japan) and AI training work; jobs_overview gives counts; visa_sponsoring_companies lists employers hiring for visa-sponsored roles. A few sample jobs are open to everyone; job titles, companies, pay and apply links are for Seoulstart members, so locked results carry only role type, location and posting language. Every result includes the Seoulstart link it came from. Housing: housing_median, housing_trend, housing_compare and housing_report give median rent, jeonse deposits and apartment sale prices from reported MOLIT contracts. Korean or Japanese level and visa route are Seoulstart's reading of each posting, not the employer's promise.",
      "tools": [
        {
          "name": "housing_compare",
          "title": "Compare rent or prices in two Korean areas",
          "description": "Median monthly rent, jeonse deposit and apartment sale price side by side for two areas of South Korea, from reported contracts (MOLIT). Fits choosing between two districts or cities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area_a": {
                "description": "A place in South Korea: \"Korea\" for the whole country, a province or city (\"Seoul\", \"Busan\", \"Gyeonggi\"), or a district, city or county (\"Mapo-gu\", \"Gangnam\", \"Suwon-si\", \"마포구\").",
                "type": "string"
              },
              "area_b": {
                "description": "A place in South Korea: \"Korea\" for the whole country, a province or city (\"Seoul\", \"Busan\", \"Gyeonggi\"), or a district, city or county (\"Mapo-gu\", \"Gangnam\", \"Suwon-si\", \"마포구\").",
                "type": "string"
              },
              "property_type": {
                "description": "apartment (default), officetel or villa (multi-family house).",
                "enum": ["apartment", "officetel", "villa"],
                "type": "string"
              },
              "province_a": {
                "description": "Optional. The province or city the area is in, when its name exists in more than one (\"Jung-gu\" is in Seoul, Busan and other cities).",
                "type": "string"
              },
              "province_b": {
                "description": "Optional. The province or city the area is in, when its name exists in more than one (\"Jung-gu\" is in Seoul, Busan and other cities).",
                "type": "string"
              }
            },
            "required": ["area_a", "area_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare rent or prices in two Korean areas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35cae9c4e93df7d80859b59620dd1629f7684cbbf1f5264cd4b2475a7aa4f7ab"
        },
        {
          "name": "housing_median",
          "title": "Median rent, jeonse or sale price in a Korean area",
          "description": "Median monthly rent and deposit, jeonse deposit, or apartment sale price in an area of South Korea, from reported contracts (MOLIT). Fits questions about what rent costs in a Seoul district or Korean city, how big a jeonse deposit is, or what apartments sell for. Returns the median, the number of contracts and the month.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "A place in South Korea: \"Korea\" for the whole country, a province or city (\"Seoul\", \"Busan\", \"Gyeonggi\"), or a district, city or county (\"Mapo-gu\", \"Gangnam\", \"Suwon-si\", \"마포구\").",
                "type": "string"
              },
              "month": {
                "description": "Optional month as YYYY-MM, for apartment rent or jeonse within the last 12 months. Default: the latest complete month.",
                "type": "string"
              },
              "property_type": {
                "description": "apartment (default), officetel or villa (multi-family house).",
                "enum": ["apartment", "officetel", "villa"],
                "type": "string"
              },
              "province": {
                "description": "Optional. The province or city the area is in, when its name exists in more than one (\"Jung-gu\" is in Seoul, Busan and other cities).",
                "type": "string"
              },
              "size_band": {
                "description": "Optional home size: under40, 40-60, 60-85 or over85 square meters. Uses new leases over the last 3 months.",
                "enum": ["under40", "40-60", "60-85", "over85"],
                "type": "string"
              },
              "transaction": {
                "description": "monthly_rent (default, 월세): rent plus deposit. jeonse (전세): a large deposit and no monthly rent. sale: apartment sale price (apartments only).",
                "enum": ["monthly_rent", "jeonse", "sale"],
                "type": "string"
              }
            },
            "required": ["area"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Median rent, jeonse or sale price in a Korean area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c35adbe5b5f3724c82ba2992a22139e83258a69b205fec65ea9cd0e69446c76"
        },
