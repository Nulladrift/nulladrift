                  },
                  "style_version": {
                    "description": "Version of the style; omit for its current one.",
                    "type": "integer"
                  }
                },
                "required": ["model"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
