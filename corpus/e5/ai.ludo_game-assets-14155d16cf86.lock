        },
        {
          "name": "convertToPixelArt",
          "title": "Convert image to pixel art",
          "description": "Convert an image to pixel art: any art, broken AI pixel art or pixel art comes back as pixel art at about the input's own size. Free (no credits) and synchronous: the call answers with the result directly, with no job to poll. `pixel_size` is the size of one pixel-art pixel, in the input's pixels: larger values give coarser art. Omit it to use the image's own pixel size, which only works on an image that already has a pixel grid - when none can be detected the call fails with HTTP 400 asking for a pixel_size. On an input already on a pixel grid, a pixel_size you pass snaps to whole steps of that grid. `palette_size` (2-256) caps the number of colours; omit it to keep the colours as they are. The response has the image `url`, the `pixel_size` used (fractional when it was detected) and the art's size in pixel-art pixels as `columns` and `rows`; resize the image to columns x rows with nearest-neighbour to get one image pixel per art pixel. The source image (URL or base64) is uploaded and validated, and one larger than 15MB is rejected with HTTP 400. The source is left as it is and the result is a new image. Limited to 20 calls per 5 minutes, 120 an hour and 1000 a day. Pass an optional request_id to tag the result for later retrieval via listGenerations (type image).",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for converting an image to pixel art",
                "properties": {
                  "image": {
                    "description": "URL or base64-encoded image to convert - any art, broken AI pixel art or pixel art.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "palette_size": {
                    "description": "At most this many colours (2-256). Omit it to keep the colours as they are.",
                    "maximum": 256,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "pixel_size": {
                    "description": "Size of one pixel-art pixel, in the input image's pixels (at least 2): larger values give coarser art. Omit it to use the image's own pixel size, which must be detectable (the image must already be on a pixel grid); when none is detected the call fails with HTTP 400 asking for a pixel_size. On an input already on a pixel grid it snaps to whole steps of that grid.",
                    "format": "float",
                    "minimum": 2,
                    "type": "number"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier to tag the result with, usable as the request_id filter of listGenerations.",
                    "type": "string"
                  }
                },
                "required": ["image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Convert image to pixel art"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:031cb07bd556e38f83ed4186ae152c4cff35b4ae3360f82d1c3ae5dd3fc85470"
        },
        {
          "name": "create3DModel",
          "title": "Create 3D model",
          "description": "Convert a source image into a textured 3D model (image-to-3D). The job result is a downloadable GLB model_url plus an array of snapshot image URLs rendered from different angles (handy for previews). model picks the generator: prop (default) is low-cost and suits everyday props and environment pieces; hero is far more detailed and accurate, for close-up assets, but slower and more expensive. image is the front view; with prop, pass an optional back_image (the same subject seen from behind) so the back of the model follows it instead of being invented - hero takes the front image only and rejects a back_image with HTTP 400. The image is converted as it is: to make a character image for it first, from a prompt or by redrawing your own image as a 3D render, use create3DModelImage. Accepts optional mesh controls: target_num_faces (max triangle count, 1000-200000, default 50000), texture_size (1024 or 2048, default 2048), and texture_type (\"pbr\", \"simple\", or \"none\", default \"pbr\"). Pass rig true to also rig the model in the same call, with the general rig (joint_naming as in rigModel), ready for animate3DModelPreset or createDirectionalSprites; that adds the rigModel price, charged only when the result comes back rigged. Credits are held when the job is accepted and refunded if it fails or is cancelled. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type 3d). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 4 credits per call with model \"prop\" (default), 15 credits per call with model \"hero\"; rig true adds 1 credit when the model comes back rigged.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating a 3D model from an image",
                "properties": {
                  "back_image": {
                    "description": "Optional URL or base64-encoded image of the SAME subject seen from behind (rotated 180 degrees from image). The model's back then follows it instead of being invented from the front view alone. It must show the same subject, at the same scale and in the same pose and style as image. Only a back view is supported: a side or three-quarter view here produces a distorted model. Prop model only: hero rejects it with HTTP 400. No extra cost.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "image": {
                    "description": "URL or base64-encoded image to convert to 3D, taken as the front view of the subject",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "joint_naming": {
                    "description": "With rig, the bone naming convention (as rigModel's joint_naming). Purely a relabel - the skeleton is identical. Default: \"smpl\".",
                    "enum": ["smpl", "mixamo", "humanik", "unreal", "godot", "rigify", "vroid"],
                    "example": "smpl",
                    "type": "string"
                  },
                  "model": {
                    "description": "Model to use. Available models:\n- \"prop\" (Prop): 4 credits · Low-cost, good for everyday props and environment pieces\n- \"hero\" (Hero): 15 credits · Highly detailed, accurate 3D generation for close-up assets · front image only, no back_image. Default: \"prop\".",
                    "enum": ["prop", "hero"],
                    "example": "prop",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "rig": {
                    "description": "Also rig the model (skeleton and skin weights) in the same call, so it can be animated or rendered with createDirectionalSprites. It gets the general rig, which suits any shape; there is no rig type to pick here (rigModel offers the others). Adds the rigModel price, charged only when the model comes back rigged (the result's rigged). Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "target_num_faces": {
                    "description": "Maximum triangle count for the mesh (1000-200000) Default: 50000.",
                    "example": 50000,
                    "maximum": 200000,
                    "minimum": 1000,
                    "type": "integer"
                  },
                  "texture_size": {
                    "description": "Texture resolution in pixels Accepted values: 1024, 2048. Default: 2048.",
                    "example": 2048,
                    "type": "integer"
                  },
                  "texture_type": {
                    "description": "Texture type Default: \"pbr\".",
                    "enum": ["pbr", "simple", "none"],
                    "example": "pbr",
                    "type": "string"
                  }
                },
                "required": ["image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
