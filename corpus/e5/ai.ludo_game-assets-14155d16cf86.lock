          "title": "Get Ludo plans and pricing",
          "description": "What Ludo's paid service costs and includes, for an agent advising a user: every plan with its monthly and annual price, credits, seats, queue concurrency and what it includes or lacks; credit top-ups and their price brackets; what each API call costs; and the rules to know before telling a user to pay. The ones that matter most: the API, MCP and CLI need an active paid plan (the free trial gets 402 on every other call), and there every generation costs credits - \"unlimited\" on Pro and Studio is the web app only. Plans are bought in the web app (`links.billing`), not through the API. Plans, prices and rules here are the live ones, the same as https://ludo.ai/pricing. This is a free lookup (no credits, no job) and works with or without an API key, on any plan.",
