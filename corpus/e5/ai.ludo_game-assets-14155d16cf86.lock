        {
          "name": "transferMotion",
          "title": "Transfer motion onto sprite",
          "description": "Transfer motion from a reference video or a named animation preset onto a static sprite image, producing an animated spritesheet that mimics the reference movement. Provide the sprite as image (URL or base64) plus either a video URL or a preset_id together with perspective and direction (all three from listAnimationPresets; if both video and preset_id are sent the video wins). The job result is the same sprite result as animateSprite: `spritesheet_url`, `video_url`, grid fields, optional GIF / frame / with-background URLs, and `audio_url` when the model is hydra. `duration` defaults to 1.5s where the chosen model offers it, otherwise to that model's shortest (hydra, the default, starts at 3s) - and a longer reference clip or preset is compressed to fit, so pass the preset's own `duration` (returned by listAnimationPresets) to keep its timing. It returns HTTP 400 if neither a video nor a complete preset_id/perspective/direction triple is supplied, if the named preset, perspective, or direction cannot be resolved, or if the model/duration combination is invalid. Credits are held for the duration you requested when the job is accepted; the final charge is rate × seconds of video generated (which follows the reference clip or preset; legacy models keep their minimum charge), never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. The returned sheet is then trimmed to its best loop and can run slightly shorter than the video; that trim is not deducted. Use this when you have an existing motion clip or preset to copy; prefer animateSprite to generate animation purely from a text prompt. Omit `model` to run on hydra (the default - most capable, and returns audio); pick forge for a cheaper run on simple motion, presets and matching poses; the `model` field lists rates. Pass an optional request_id to tag the result so you can retrieve it later via listGenerations (type spritesheet). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: credits/s × seconds, per model: Hydra 3/s, Forge 2/s, Forge Pixel 2/s, Tango 4/s (min charge 4 credits) [LEGACY]; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint's full pricing table in the API docs.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for transferring motion from a video onto a static sprite image, producing an animated spritesheet.",
                "properties": {
                  "crop": {
                    "description": "Crop sprite frames to fit content. Results in smaller spritesheets but inconsistent frame sizes across different animations. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "direction": {
                    "description": "Direction for the animation preset. When using a preset, `direction` is required.",
                    "enum": ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
                    "example": "N",
                    "type": "string"
                  },
                  "duration": {
                    "description": "Duration in seconds. If the reference video is longer, it will be compressed to this duration. Available values depend on the model:\n- hydra: 3, 3.5, 4, 4.5, 5\n- forge: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- forge-pixel: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- tango: 1, 1.5, 2, 2.5, 3, 3.5, 4 Default: 1.5.",
                    "example": 1.5,
                    "format": "float",
                    "type": "number"
                  },
                  "frame_size": {
                    "description": "Size of the sprite in pixels, not of the frame: it sets how big the character is drawn in the exported sheet, and each frame also holds the space around the sprite, so frames come out larger than this value. 0 is maximum resolution. Exporting larger than the input image adds no detail: do not pick a size above the input's own resolution, and 0 gains nothing on inputs under 512 px. True Size is not available here: the image is not the first frame of the result, so there is nothing to align to. Accepted values: 32, 64, 96, 128, 192, 256, 384, 0. Default: 0.",
                    "example": 0,
                    "format": "integer",
                    "type": "number"
                  },
                  "frames": {
                    "description": "Maximum number of frames in the output spritesheet. Allow about one second of duration per 16 frames - above that the model may not be able to produce them all (64 frames needs a duration of at least 4). The result can have fewer frames when the duration is short or bad frames were removed. Accepted values: 4, 9, 16, 25, 36, 49, 64. Default: 36.",
                    "example": 36,
                    "format": "integer",
                    "type": "number"
                  },
                  "gif": {
                    "description": "When true, generates an animated GIF from the spritesheet and returns it in gif_url. Disabled by default to reduce response time. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "image": {
                    "description": "The static sprite to animate, as a URL or base64 image. Ideally an image generated with the \"sprite\", \"sprite-vfx\" or \"ui_asset\" image type.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "individual_frames": {
                    "description": "When true, extracts each frame from the spritesheet as an individual image and returns the URLs in individual_frame_urls. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "loop": {
                    "description": "Trim the animation at the beginning or end to create a seamless loop. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "margin_ratio_horizontal": {
                    "description": "Horizontal padding around the sprite as a ratio (0.0 to 1.0). Every bit of margin is resolution taken from the sprite, so keep it as tight as the motion allows - about 0.15 - and go higher only for motion that extends sideways (sword slashes, punches) or if the sprite gets cut off.",
                    "format": "float",
                    "type": "number"
                  },
                  "margin_ratio_mode": {
                    "description": "How the sprite is framed for generation. Defaults to \"manual\" (0.15 on each axis when no margin value is given); transfer motion has no \"auto\". The model always generates on a canvas of the same size, so any margin is canvas the sprite does not fill: the more margin, the lower the resolution and detail of the sprite. Keep the margins tight - about 0.15 - and raise only the axis the motion needs. \"none\" animates the image exactly as framed, so it must already have suitable margins (not touching the edges, not mostly empty space); an off-center sprite can give unpredictable results. Sending \"none\" together with a margin value fails with HTTP 400 (the value would be ignored). Default: \"manual\".",
                    "enum": ["manual", "none"],
                    "example": "manual",
                    "type": "string"
                  },
                  "margin_ratio_vertical": {
                    "description": "Vertical padding around the sprite as a ratio (0.0 to 1.0). Every bit of margin is resolution taken from the sprite, so keep it as tight as the motion allows - about 0.15 - and go higher only for motion that extends up or down (jumps) or if the sprite gets cut off.",
                    "format": "float",
                    "type": "number"
                  },
                  "model": {
                    "description": "Model to use. Available models:\n- \"hydra\" (Hydra): 3 credits/s · Best motion and prompt adherence\n- \"forge\" (Forge): 2 credits/s · Cheapest alternative, for simple body shapes and simple actions\n- \"forge-pixel\" (Forge Pixel): 2 credits/s · Best for low-res pixel art animations\n- \"tango\" (Tango): 4 credits/s, min charge 4 credits · LEGACY - scheduled for removal, do not use for new work\nModels marked LEGACY still work for existing integrations but will be removed; pick a current model for anything new.\nforge is tuned for the motion presets (preset_id) and often fails to follow your own video - use hydra for custom footage. forge-pixel expects real pixel art - a perfect pixel grid at its natural resolution; convert art that only looks pixelated with convertToPixelArt (free) first. Default: \"hydra\".",
                    "enum": ["hydra", "forge", "forge-pixel", "tango"],
                    "example": "hydra",
                    "type": "string"
                  },
                  "perspective": {
                    "description": "Camera perspective of the preset clip, by id (the `perspectives` list of listAnimationPresets, the same set for every preset): high = tactical steep top-down, horizon = side view at eye level, isometric = diagonal top-down with depth, low = hero low angle, top = directly overhead. Required when using a preset. Unrelated to the `perspective` of createImage, which is a free-text art direction.",
                    "enum": ["high", "horizon", "isometric", "low", "top"],
                    "example": "high",
                    "type": "string"
                  },
                  "preset_id": {
                    "description": "ID of an animation preset to use instead of a video URL. Use listAnimationPresets to list available presets. When using a preset, `perspective` and `direction` are required.",
                    "type": "string"
                  },
                  "prompt": {
                    "description": "Optional extra instructions for the motion transfer (e.g. \"keep the cape still\"), added to the model's own prompt.",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of the spritesheet, for 2.5D lighting, returned as normal_map_url. It lines up with the sheet pixel for pixel and frame for frame (same layout, cells and alpha), as a lossless WebP in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. 0.5 credits per map on top of the generation; a map that could not be made is not charged, and its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "spritesheet_with_background": {
                    "description": "When true, also returns the spritesheet with background intact (before background removal). Useful for manually fixing background removal issues. The with-background spritesheet URL will be in spritesheet_with_background_url. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "use_pixel_grid": {
                    "description": "Use the animation's pixel grid if one is detected. Defaults to true. true: when Ludo detects a pixel grid with confidence, the sheet is packed on it (logical pixels, scaled up by whole blocks); when none is detected, this has no effect. false: always pack as ordinary art, for when the detected grid is wrong for your asset (for example a smooth sprite coming back as coarse blocks). Ignored for forge-pixel animations, which are always packed on their grid.",
                    "type": "boolean"
                  },
                  "video": {
                    "description": "URL of the video to use as motion source - the `video_url` of a spritesheet from animateSprite, or your own clip. Videos up to 4 seconds work best. Either `video` or `preset_id` + `perspective` + `direction` must be provided; when both are sent the video is used. A video more than twice as long as `duration` gets heavily compressed and the motion turns rushed - trim it to the part you want, or raise `duration`.",
                    "type": "string"
                  }
                },
                "required": ["image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Transfer motion onto sprite"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5dc9d08656d49f92baa554d3226d81bd57c944209b23120e28038b1914880cd8"
        },
        {
          "name": "upscaleImage",
          "title": "Upscale image",
          "description": "Upscale an image: the same picture at a higher resolution, up to 4x, with the result capped at 2048px on its longest side. The source image (URL or base64) must be below 2048px on its longest side; a larger one is rejected with HTTP 400. The job result is a single image result with a url (not an array). The image is uploaded and validated, and an image larger than 15MB is rejected with HTTP 400. Credits are held when the job is accepted and refunded if it fails or is cancelled. Use upscaleImage to raise the resolution of an image you already have; createImage and editImage make new or changed images instead. Pass an optional request_id to tag the result so you can retrieve it later via listGenerations (type image). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per result.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for upscaling an image",
                "properties": {
                  "image": {
                    "description": "URL or base64-encoded image to upscale, below 2048px on its longest side.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  }
                },
                "required": ["image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
