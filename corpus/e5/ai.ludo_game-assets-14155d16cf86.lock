        {
          "name": "createImage",
          "title": "Create image",
          "description": "Generate game-art images from a text prompt alone, selecting an image_type (e.g. sprite) and optionally art_style, perspective, and aspect_ratio. The job result is an array of image results, each with a url; request n (1-8) to control how many variations come back. Because it generates purely from text it takes no source image, so there is no upload size limit to trip. Credits are held when the job is accepted and refunded if it fails or is cancelled; the charge scales with the number of images produced. Use createImage to make new images from scratch; use generateWithStyle to match a reference image's art style, editImage to modify an existing image, and removeBackground to cut out a subject. Pass an optional request_id to tag the results so you can retrieve them later via listGenerations (type image). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per result.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating an image from text prompt",
                "properties": {
                  "art_style": {
                    "description": "Visual art style of the image, one of the listed values (e.g. \"Hand-Painted\", \"Stylized 3D\", \"16-Bit Pixel\"). The pixel-art styles from the largest pixels to the most detail: \"Micro Pixel\", \"8-Bit Pixel\", \"16-Bit Pixel\", \"32-Bit Pixel\", plus \"Free Pixel\" (fine-grained 90s console pixel art).",
                    "enum": ["Any style", "Cel-Shaded", "Inked Painterly", "Illustration", "Western Cartoon", "Anime", "Chibi", "Micro Pixel", "8-Bit Pixel", "16-Bit Pixel", "32-Bit Pixel", "Free Pixel", "Hand-Painted", "Digital Painting", "Comic Book", "Block Print", "Sketch", "Watercolor", "Stylized 3D", "Pixar Style", "Low Poly", "Photorealistic 3D", "Voxel Art", "Retro 3D", "Flat Design", "Minimalist", "Silhouette", "Noir", "Neon", "Glitch Art", "Claymation", "Paper Craft", "Textile"],
                    "example": "Any style",
                    "type": "string"
                  },
                  "aspect_ratio": {
                    "description": "Aspect ratio of the output image.",
                    "enum": ["default", "ar_1_1", "ar_4_3", "ar_16_9", "ar_19_9", "ar_3_4", "ar_9_16", "ar_9_19"],
                    "example": "default",
                    "type": "string"
                  },
                  "augment_prompt": {
