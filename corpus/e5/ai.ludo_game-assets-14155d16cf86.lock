        {
          "name": "fitDirectionalAccessory",
          "title": "Fit an accessory to a 3D model",
          "description": "Fit an accessory to a rigged 3D model for Directional Sprites: an item GLB (a sword, a gun, a staff, a bow, a shield, a helmet, a hat, a backpack...) held by one bone of the model - a hand, the head, the back or the hips. Nothing is saved. The item is first placed automatically for its `kind` (a sword by its handle, a gun by its pistol grip, a shield on the forearm, a helmet over the head, a backpack on the back), and the hand closes round it. Adjust it relative to that automatic fit with `size` (% of it), `move` (% of the character's height along forward/up/out) and `turn` (degrees about those axes), and call again with the new values until it looks right: each call starts from the automatic fit, so send the full adjustment every time. The response has the `placement` to pass to attachDirectionalAccessories, `checks` (how far the item sinks into the body, how far its grip is from the palm, how much of the head pokes through a helmet, each in % of the character's height or of its vertices), and, unless `preview` is false, `model_url` (the model holding the item, a GLB kept 7 days) and `previews`: frames of the model walking with it, seen from SW and SE, like previewDirectionalSprites' (which this shares: one preview at a time, a newer one cancels the older, which then comes back without previews). Free (no credits) and synchronous; a fit takes a few seconds with previews.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for fitting an accessory to a rigged 3D model",
                "properties": {
                  "bone": {
                    "description": "A bone of the model's skeleton to hold the item, by name, instead of `point`.",
                    "maxLength": 128,
                    "type": "string"
                  },
                  "flip": {
                    "description": "Hold the item by its other end (when the automatic fit grabbed it by the wrong end). Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "grip": {
                    "description": "Close the hand round the item (on a skeleton with finger bones). Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "item": {
                    "description": "The item, as a URL or base64-encoded GLB file - any 3D model (create3DModel without rig, standing as generated). Up to 30MB.",
                    "example": "<url> OR data:model/gltf-binary;base64,...",
                    "type": "string"
                  },
                  "kind": {
                    "description": "What the item is, which decides how it is first held: blade (sword, axe, dagger, mace, wand...: by its handle, pointing forward), gun (by its pistol grip, barrel forward), staff (spear, polearm: at its middle, upright), bow (at its middle, upright), shield (on the forearm, facing out), helmet (over the head, sized to it), hat (hat or crown: on top of the head), back (backpack, quiver: flat on the back), other. Omit to guess it from `name` and the item's shape (other when unsure).",
                    "enum": ["blade", "gun", "staff", "bow", "shield", "helmet", "hat", "back", "other"],
                    "example": "blade",
                    "type": "string"
                  },
                  "model": {
                    "description": "The rigged 3D model, as a URL or base64-encoded GLB file - create3DModel with rig true, or rigModel. Up to 30MB; a larger file is rejected with HTTP 400.",
                    "example": "<url> OR data:model/gltf-binary;base64,...",
                    "type": "string"
                  },
                  "move": {
                    "$ref": "#/components/schemas/DirectionalAccessoryAxes"
                  },
                  "name": {
                    "description": "What the item is, in words (\"rusty sword\"). Used to guess `kind` when it is omitted, and as the item's name when saved.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "point": {
                    "description": "Where the item goes. Omit for where its kind goes (a bow and a shield in the left hand, a helmet or hat on the head, a backpack on the back, anything else in the right hand). The response lists the points this skeleton has.",
                    "enum": ["right_hand", "left_hand", "head", "back", "hips"],
                    "example": "right_hand",
                    "type": "string"
                  },
                  "preview": {
                    "description": "Render previews and host the model holding the item. False answers only the fit and its checks, in about a second. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "preview_preset_id": {
                    "description": "The animation preset (listAnimationPresets) the previews show the model doing with the item. Default: \"walk_forward\".",
                    "example": "walk_forward",
                    "type": "string"
                  },
                  "size": {
                    "description": "The item's size in % of the automatic fit's (100 = as fitted, 150 = half as big again). Default: 100.",
                    "example": 100,
                    "format": "float",
                    "maximum": 1000,
                    "minimum": 10,
                    "type": "number"
                  },
                  "turn": {
                    "$ref": "#/components/schemas/DirectionalAccessoryAxes"
                  }
                },
                "required": ["item", "model"]
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Fit an accessory to a 3D model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2fc46e802202d7876483b33817311298809e69a44f1492f1ab50f2770a511280"
        },
        {
          "name": "generatePose",
          "title": "Re-pose sprite",
          "description": "Re-pose an existing sprite into a new target pose while preserving the character, taking a source image (URL or base64), a pose name (or \"Other\" with a free-text description), and an optional n (1-4) for how many variations to produce. Only works with sprite image types (not icons, screenshots, etc.). The job result is an array of pose results, each containing the generated image url, the pose and description used, and a suggested motion_prompt tuned for that pose. Credits are held when the job is accepted and refunded if it fails or is cancelled; the charge scales with the number of images generated. This is typically the first step before animating: call generatePose to set the character's pose, then feed the result (and its suggested motion_prompt) into animateSprite for the best animation quality; use rotateSprite instead when you want to change the camera angle rather than the pose. Pass an optional request_id to tag the results so you can locate them later via listGenerations (type spritesheet). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per result.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating a new pose for an existing sprite",
                "properties": {
                  "description": {
                    "description": "Optional additional instructions or description to guide the pose generation.",
                    "type": "string"
                  },
                  "image": {
                    "description": "URL or base64-encoded source sprite image to generate a new pose from.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "n": {
                    "description": "Number of pose variations to generate (1-4). Default: 1.",
                    "example": 1,
                    "format": "integer",
                    "maximum": 4,
                    "minimum": 1,
                    "type": "number"
                  },
                  "pose": {
                    "description": "Target pose for the sprite. Use the value \"Other\" to generate other poses not listed in the accepted values, and fill the field description accordingly.",
                    "enum": ["Idle (Front)", "Idle (Back)", "Idle (Left Facing)", "Idle (Right Facing)", "Walk (Left)", "Walk (Right)", "Walk (Towards the camera)", "Walk (Away from the camera)", "Run (Left)", "Run (Right)", "Run (Towards the camera)", "Run (Away from the camera)", "Crouching", "Crawling", "Sitting", "Defending / Blocking", "Attack Ready", "Jump Preparation", "Sleeping", "Flying", "Other"],
                    "example": "Idle (Front)",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of each image, for 2.5D lighting, returned as normal_map_url. It is a lossless WebP of the same size and alpha as the image, in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. Free; when a map could not be made, its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  }
                },
                "required": ["image", "pose"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Re-pose sprite"
          },
