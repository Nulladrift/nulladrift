        {
          "name": "cancelApiJob",
          "title": "Cancel job",
          "description": "Cancel a queued job you started through the API or MCP; the credits held for it are refunded. Jobs that are already running cannot be canceled (409). Returns the canceled job. This is free (no credits).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The job id returned by a generation call (its `id` in the 202 response).",
