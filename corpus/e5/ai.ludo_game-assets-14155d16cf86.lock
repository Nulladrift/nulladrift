        {
          "name": "animateSpriteKeyframes",
          "title": "Animate sprite from keyframes",
          "description": "Animate a sprite through up to three fixed keyframes - initial_image, middle_image and final_image (each a URL or base64) - producing a spritesheet that interpolates through the provided frames in order. initial_image is required: the animation starts from it, and middle_image and final_image add keyframes after it (either may be omitted). The motion_prompt is optional here - when omitted, the motion is derived purely from the keyframes. Runs on hydra (default; also returns `audio_url`), hydra-plus (hydra with finer detail, also returns `audio_url`), forge, or forge-pixel for pixel-art sprites - the models that support a middle keyframe; any other model returns HTTP 400. For just a start and end frame, animateSprite with `final_image` does the same job. The job result is the same sprite result as animateSprite (`spritesheet_url`, `video_url`, grid fields, optional GIF and frame URLs, `audio_url` on hydra and hydra-plus). Credits are held for the duration you requested when the job is accepted; the final charge is rate × seconds of video generated, never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. The returned sheet is then trimmed to its best loop and can run slightly shorter than the video; that trim is not deducted. Use animateSprite instead for the classic single-image + text-prompt animation. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type spritesheet). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: credits/s × seconds, per model: Hydra 3/s (shortest duration 3s, so 9 credits minimum), Griffin 10 flat, Forge 1.5/s, Forge Pixel 1.5/s, Hydra+ 4/s (shortest duration 3s, so 12 credits minimum) [LEGACY]; flat = credits per generation; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint's full pricing table in the API docs.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating an animated spritesheet that interpolates through up to three fixed keyframes (initial / middle / final). Runs on hydra (default), hydra-plus, forge or forge-pixel - the models supporting a middle keyframe. Input images can be provided in base64 or URL. initial_image is required; middle_image and final_image are optional.",
                "properties": {
                  "augment_prompt": {
                    "description": "Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "crop": {
                    "description": "Crop sprite frames to fit content. Results in smaller spritesheets but inconsistent frame sizes across different animations. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "duration": {
                    "description": "Duration in seconds. Available values depend on the model:\n- hydra: 3, 3.5, 4, 4.5, 5\n- griffin-hd: 5\n- forge: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- forge-pixel: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- hydra-plus: 3, 3.5, 4, 4.5, 5 Default: 3.",
                    "example": 3,
                    "format": "float",
                    "type": "number"
                  },
                  "final_image": {
                    "description": "The url OR base64 of the final keyframe. Optional.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "frame_size": {
                    "description": "Size of the sprite in pixels, not of the frame: it sets how big the character is drawn in the exported sheet, and each frame also holds the space around the sprite, so frames come out larger than this value. It changes the export only, not how the sprite is generated. 0 is maximum resolution. -1 is AI 1.5x upscaling. -9 is True Size: frames keep the size and position of the input frame, untrimmed, so the spritesheet lines up exactly with the input image - use it (not margin_ratio_mode \"none\") whenever the output must align with your input; it works with any margin mode. Exporting larger than the input image adds no detail: do not pick a size above the input's own resolution, and 0 or -1 gain nothing on inputs under 512 px. True Size crops at the input image's edges, so anything the animation adds beyond them (an aura, a spell effect, a swung weapon) is cut off: use a fixed size or 0 for those. adjustSpritesheet re-exports a finished animation at another size for free. Accepted values: 32, 64, 96, 128, 192, 256, 384, 0, -1, -9. Default: 0.",
                    "example": 0,
                    "format": "integer",
                    "type": "number"
                  },
                  "frames": {
                    "description": "Maximum number of frames in the output spritesheet. Allow about one second of duration per 16 frames - above that the model may not be able to produce them all (64 frames needs a duration of at least 4). The result can have fewer frames when the duration is short or bad frames were removed. Accepted values: 4, 9, 16, 25, 36, 49, 64. Default: 36.",
                    "example": 36,
                    "format": "integer",
                    "type": "number"
                  },
                  "gif": {
                    "description": "When true, generates an animated GIF from the spritesheet and returns it in gif_url. Disabled by default to reduce response time. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "image_type": {
                    "description": "Type of sprite being animated. Affects generation parameters and styling. Tiling types (horizontal / vertical tiles, scrolling backgrounds, parallax layers, textures) stay seamless only on forge and forge-pixel, and only if the input image itself already wraps seamlessly on that axis; otherwise the animation shows a visible seam when tiled. Default: \"sprite\".",
                    "enum": ["sprite", "sprite-vfx", "item-icon", "ui_asset", "logo", "sprite-tiling-horizontal", "sprite-tiling-vertical", "scatter-pattern", "parallax_layer", "tile", "texture", "portrait", "card-art"],
                    "example": "sprite",
                    "type": "string"
                  },
                  "individual_frames": {
                    "description": "When true, extracts each frame from the spritesheet as an individual image and returns the URLs in individual_frame_urls. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "initial_image": {
                    "description": "The url OR base64 of the first keyframe. Required - the animation starts from it.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "loop": {
                    "description": "Trim the animation at the beginning or end to create a seamless loop. Not guaranteed to produce a perfect loop. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "margin_ratio_horizontal": {
                    "description": "Horizontal padding around the sprite as a ratio (0.0 to 1.0). Every bit of margin is resolution taken from the sprite, so keep it as tight as the motion allows - about 0.15 - and go higher only for motion that extends sideways (sword slashes, punches) or if the sprite gets cut off. Supplying a value selects margin_ratio_mode \"manual\" unless margin_ratio_mode is set explicitly.",
                    "format": "float",
                    "type": "number"
                  },
                  "margin_ratio_mode": {
                    "description": "How the sprite is framed for generation. The model always generates on a canvas of the same size, so any margin is canvas the sprite does not fill: the more margin, the lower the resolution and detail of the sprite. \"auto\" (default, recommended) trims and centers the sprite and picks a margin suited to the motion. \"manual\" uses margin_ratio_horizontal / margin_ratio_vertical; keep them as tight as the motion allows (about 0.15) and raise only the axis the motion needs. \"none\" animates the input exactly as framed, with no trimming and no margin added, so the input must already have suitable margins: a sprite touching the edges gets its limbs, weapons and effects cut off as soon as it moves, and an image that is mostly empty space yields a small, low-detail sprite. \"none\" is the way to keep a deliberately off-center sprite (e.g. a character at the left edge firing a beam to the right), but results can be unpredictable. Do not use \"none\" to make the spritesheet line up with the input image - use frame_size -9 (True Size) for that; it works with any margin mode. Rules: omit margin_ratio_mode and send margin_ratio_horizontal / margin_ratio_vertical to get \"manual\" automatically; \"manual\" with no margin value fails with HTTP 400; \"auto\" or \"none\" sent together with a margin value fails with HTTP 400 (the value would be ignored). Default: \"auto\".",
                    "enum": ["auto", "manual", "none"],
                    "example": "auto",
                    "type": "string"
                  },
                  "margin_ratio_vertical": {
                    "description": "Vertical padding around the sprite as a ratio (0.0 to 1.0). Every bit of margin is resolution taken from the sprite, so keep it as tight as the motion allows - about 0.15 - and go higher only for motion that extends up or down (jumps) or if the sprite gets cut off. Supplying a value selects margin_ratio_mode \"manual\" unless margin_ratio_mode is set explicitly.",
                    "format": "float",
                    "type": "number"
                  },
                  "middle_image": {
                    "description": "The url OR base64 of the middle keyframe the animation passes through between the initial and final frames. Consecutive keyframes must differ - two identical keyframes in a row produce no motion across that span.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "model": {
                    "description": "Model to use. Available models:\n- \"hydra\" (Hydra): 3 credits/s, shortest duration 3s, so 9 credits minimum · Best motion and prompt adherence\n- \"griffin-hd\" (Griffin): flat 10 credits per generation · Highest resolution and best image fidelity\n- \"forge\" (Forge): 1.5 credits/s · Cheapest alternative, for simple body shapes and simple actions\n- \"forge-pixel\" (Forge Pixel): 1.5 credits/s · Best for low-res pixel art animations\n- \"hydra-plus\" (Hydra+): 4 credits/s, shortest duration 3s, so 12 credits minimum · LEGACY - scheduled for removal, do not use for new work\nModels marked LEGACY still work for existing integrations but will be removed; pick a current model for anything new.\nforge-pixel expects real pixel art - a perfect pixel grid at its natural resolution; for other art use hydra or forge. Art that only looks pixelated (an AI image with soft edges or uneven blocks) is refused: convert it with convertToPixelArt (free) first. Tiling image types stay seamless only on forge and forge-pixel. Default: \"hydra\".",
                    "enum": ["hydra", "griffin-hd", "forge", "forge-pixel", "hydra-plus"],
                    "example": "hydra",
                    "type": "string"
                  },
                  "motion_prompt": {
                    "description": "Optional text description of the desired animation, e.g. \"walking\", \"attack slash\". When omitted, the motion is derived purely from the keyframes. When provided, describe exactly and unambiguously what the character should do. Specific or complex actions are fine; there is no need to simplify them. Do not over-describe, though: too much detail can harm the animation, and an action the model already knows should be named, not decomposed into its steps (\"walking\", never \"move the left foot forward, then the right foot\"). Do not restate what the keyframes already show (the character, its appearance and equipment, the art style, the background, the lighting, the camera), and leave frame count and timing to the frames and duration fields. Negative phrasing (\"no background\", \"do not move the camera\", \"without a weapon\") works only on hydra and hydra-plus. On forge and forge-pixel it backfires: naming something you do not want makes it more likely to appear, so \"without a weapon\" tends to produce a weapon. On those models never phrase anything negatively; state only what should happen, and control everything else through the keyframes and the other fields. Keep it well under 100 words: in longer prompts details start competing and some get dropped.",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of the spritesheet, for 2.5D lighting, returned as normal_map_url. It lines up with the sheet pixel for pixel and frame for frame (same layout, cells and alpha), as a lossless WebP in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. 0.5 credits per map on top of the generation; a map that could not be made is not charged, and its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "spritesheet_with_background": {
                    "description": "When true, also returns the spritesheet with background intact (before background removal). Useful for manually fixing background removal issues. The with-background spritesheet URL will be in spritesheet_with_background_url. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "use_pixel_grid": {
                    "description": "Use the animation's pixel grid if one is detected. Defaults to true. true: when Ludo detects a pixel grid with confidence, the sheet is packed on it (logical pixels, scaled up by whole blocks); when none is detected, this has no effect. false: always pack as ordinary art, for when the detected grid is wrong for your asset (for example a smooth sprite coming back as coarse blocks). Ignored for forge-pixel animations, which are always packed on their grid.",
                    "type": "boolean"
                  }
                },
                "required": ["initial_image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Animate sprite from keyframes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5c52f29ff3cb8cb8e55097d890610d7debb81d1c1b649c3d1e3caba04188d3a2"
        },
        {
          "name": "attachDirectionalAccessories",
          "title": "Attach accessories to a 3D model",
          "description": "Put accessories on a rigged 3D model for Directional Sprites: up to 8 items, each at the `placement` fitDirectionalAccessory returned (or, without one, at the automatic fit plus the same size/move/turn adjustments). Returns `model_url`, one GLB of the model holding them all (kept 7 days): pass it as `model` to createDirectionalSprites, createDirectionalStills or previewDirectionalSprites. When `model` is the URL of one of your 3D models (as listGenerations or create3DModel returned it), the items are also saved on that model (`saved: true`; `save_on_model: false` skips it), so the Ludo web app's Directional Sprites shows them on it. Items the model already had saved stay on it and in the GLB (`kept`), except those held by a bone a new item takes; `keep_saved: false` replaces them all. Free (no credits) and synchronous.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for putting accessories on a rigged 3D model",
                "properties": {
                  "items": {
                    "description": "The items to put on the model, at most one closing each hand (the first one in it). Items the model already has saved stay on it (see keep_saved).",
                    "items": {
                      "$ref": "#/components/schemas/DirectionalAccessoryItem"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  },
                  "keep_saved": {
                    "description": "When the model is one of your 3D models, keep the items it already has saved, except those held by a bone one of these items takes, and put them in the GLB too (listed in `kept`). False replaces them all with these items. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "model": {
                    "description": "The rigged 3D model, as a URL or base64-encoded GLB file. Up to 30MB. The URL of one of your 3D models saves the items on it too.",
                    "example": "<url> OR data:model/gltf-binary;base64,...",
                    "type": "string"
                  },
                  "save_on_model": {
                    "description": "Save the items on the model when it is one of your 3D models. False only builds the GLB. Default: true.",
                    "example": true,
                    "type": "boolean"
                  }
                },
                "required": ["items", "model"]
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Attach accessories to a 3D model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d699caf6fbed3a03549e5f7022426f9243bf34b1e452b859610c1cf0e7ab83d6"
