        {
          "name": "createSpeech",
          "title": "Speak text in a cloned voice",
          "description": "Convert text to speech by cloning the voice from an audio sample you provide (voice-cloning text-to-speech). Both text and sample are required; the text is limited to 250 characters and the sample is supplied as a URL or base64 audio that must be at most 15MB, with violations returning HTTP 400. An optional delivery note (at most 50 characters, e.g. \"angry, shouting\") says how the line is said. The job result is a single audio result containing the URL of an MP3 or WAV file (the URL's extension, .mp3 or .wav, says which). Credits are held when the job is accepted and refunded if it fails or is cancelled. Use this when you have a reference voice sample to clone; use createSpeechPreset to speak with a built-in named preset voice instead, and createVoice to design a brand-new voice from a text description rather than cloning one. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type audio). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 2 credits per call.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for text-to-speech generation using voice cloning",
                "properties": {
                  "delivery": {
                    "description": "How the line is said, e.g. \"angry, shouting\" or \"whispering, out of breath\" (max 50 characters).",
                    "maxLength": 50,
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "sample": {
                    "description": "URL or base64-encoded audio sample for voice cloning.",
                    "example": "<url> OR data:audio/mp3;base64,...",
                    "type": "string"
                  },
                  "text": {
                    "description": "Text to convert to speech (max 250 characters).",
                    "maxLength": 250,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["sample", "text"],
                "type": "object"
              }
