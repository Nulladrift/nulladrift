      "capabilities": {
        "tools": {}
      },
      "instructions": "IMPORTANT: Asset URLs returned by these tools point to Google Cloud Storage links that EXPIRE AFTER 7 DAYS. Any generated asset that needs to outlive that window — especially assets destined for production use — must be downloaded and saved locally (or re-uploaded to permanent storage) right away. Never store or hard-code the returned URLs as permanent references. Before generating with a feature you have not used here before, call searchDocs with a plain-language question to read Ludo's own guidance for it — how to pick a sprite animation mode or model, when to use Generate Before / Generate After, how margins behave, and each generator's known limitations. It returns only the few documentation sections that answer the question. Use getDocs when you need to browse what documentation exists (no arguments gives a table of contents) or to read a whole document or named sections; a whole document can run to tens of thousands of characters. If searchDocs returns no results or an error, fall back to getDocs. JOBS: every generation tool returns {id, status} immediately (except convertToPixelArt, which answers with its result directly). Poll getApiJob with that id (pass wait: 30 to long-poll; up to 60) until status is succeeded (read result - exactly the response documented for the tool) or failed (read error: {code, subcode, message, retriable}); canceled is the third terminal status. Non-terminal responses carry poll_after_ms - wait at least that long between polls. Each account may have up to 50 generations queued or running at once; beyond that a call returns 429 (PENDING_JOBS_LIMIT) - wait for jobs to finish. cancelApiJob cancels a job that is still queued. CREDITS: each tool states its price. Credits are held when a job is accepted; for duration-priced tools the final charge is rate x produced seconds (legacy models keep a minimum charge), never more than for the duration requested, and the difference - or everything, if the job fails or is cancelled - is refunded. PLANS: getPricing lists Ludo's plans, what each includes and costs, and the billing rules; call it before advising a user to upgrade or buy credits (both happen in the web app, not through tools). Every tool requires the API key the session was opened with. DIRECTIONAL SPRITES turn a 3D model into sprites seen from up to 8 directions that line up. In order: (1) optionally create3DModelImage (a character image from a prompt, or your own image redrawn as a 3D render; call again for another try); (2) create3DModel with that image and rig: true (or rigModel for a model you have); optionally accessories (a sword, a shield, a helmet: an item GLB from create3DModel): fitDirectionalAccessory (free; call again with size/move/turn until its previews and checks look right), then attachDirectionalAccessories, whose model_url is the model to use from here on; (3) optionally an animation: a preset_id from listAnimationPresets, or an animation_url from animate3DModelPreset or animate3DModel on this model - none renders a still pose; (4) pick a style with listDirectionalSpriteStyles; (5) check it with previewDirectionalSprites (free and synchronous, returns frame images; one preview at a time - a newer one cancels yours); (6) render with createDirectionalSprites (sheets) or createDirectionalStills (one image per direction). FEEDBACK: when you hit a limitation you cannot work around, a bug, or a capability the user needed that Ludo lacks, send one short report with submitApiFeedback (free, capped at a few a day), with the id of every job involved, and tell the user you did. Current models: hydra (Hydra) - Best motion and prompt adherence. griffin-hd (Griffin) - Cinematic videos in any style, with audio, 768p. forge (Forge) - Cheapest alternative, for simple body shapes and simple actions. forge-pixel (Forge Pixel) - Best for low-res pixel art animations. Per action - sprite animation: hydra, griffin-hd, forge, forge-pixel; motion transfer: hydra, forge, forge-pixel; spritesheet editing: hydra, griffin-hd, forge, forge-pixel; new view: hydra; video generation: griffin-hd; references to video: griffin-hd; video editing: griffin-hd. LEGACY models, still accepted but scheduled for removal - do not use them for new work: hydra-plus, blitz, eagle, eagle-audio, tango.",
      "tools": [
        {
          "name": "adjustSpritesheet",
          "title": "Adjust spritesheet export",
          "description": "Adjust Sprite Sheet: re-export a previously generated sprite animation with different sheet settings - frame count, frame size, loop trimming or whitespace cropping - without generating the animation again. Free (no credits). Pass the `spritesheet_url` you received from `animateSprite`, `animateSpriteKeyframes`, `transferMotion`, `editSpritesheet`, `rotateSpritesheet` or an earlier adjust - it must be a spritesheet you generated through the API within the last 7 days; arbitrary external images are not accepted. Omit a setting to keep the source's value. The animation itself is unchanged: this only re-cuts the same video into a new sheet, so use it to fix framing (for example an effect clipped by True Size: re-export with a fixed `frame_size` or 0), to change the frame count or size for your engine, to upscale it 1.5x (`frame_size` -1), to turn loop trimming on or off, or to pack it as ordinary art when its detected pixel grid is wrong for the asset (`use_pixel_grid` false). It cannot change the motion, margins or content - use editSpritesheet for that. The source is left as it is and the result is a new spritesheet with its own `spritesheet_url`. The job result is the same sprite result as animateSprite (`spritesheet_url`, `video_url`, grid fields, optional GIF and frame URLs, and the source's `audio_url` when it has one). Limited to 20 calls per 5 minutes, 120 an hour and 1000 a day. Pass an optional request_id to tag the result for later retrieval via listGenerations (type spritesheet). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for re-exporting a previously generated sprite animation with different sheet settings (Adjust Sprite Sheet in the web app).",
                "properties": {
                  "crop": {
                    "description": "Crop frames to fit their content. Results in smaller spritesheets but inconsistent frame sizes across different animations. Omit to keep the source's setting. Ignored with True Size, which never crops.",
                    "type": "boolean"
                  },
                  "frame_size": {
                    "description": "Size of the sprite in pixels, not of the frame: it sets how big the character is drawn, and each frame also holds the space around it, so frames come out larger than this value. Omit to keep the source's setting. 0 is maximum resolution. -1 is AI 1.5x upscaling, which gains nothing on sources under 512 px. -9 is True Size: frames keep the size and position of the source's input image, so anything the animation adds beyond its edges is cut off - pick a fixed size or 0 to get it back. Accepted values: 32, 64, 96, 128, 192, 256, 384, 0, -1, -9.",
                    "format": "integer",
                    "type": "number"
                  },
                  "frames": {
                    "description": "Number of frames in the new sheet. Omit to keep the source's frame count. Accepted values: 4, 9, 16, 25, 36, 49, 64.",
                    "format": "integer",
                    "type": "number"
                  },
                  "gif": {
                    "description": "When true, generates an animated GIF from the spritesheet and returns it in gif_url. Disabled by default to reduce response time. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "individual_frames": {
                    "description": "When true, extracts each frame from the spritesheet as an individual image and returns the URLs in individual_frame_urls. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "loop": {
                    "description": "Trim the animation at the beginning or end to create a seamless loop. Omit to keep the source's setting.",
                    "type": "boolean"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of the new spritesheet, for 2.5D lighting, returned as normal_map_url. It lines up with the sheet pixel for pixel and frame for frame (same layout, cells and alpha), as a lossless WebP in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. Adjusting is free, but the map costs 0.5 credits; a map that could not be made is not charged, and its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "spritesheet_url": {
                    "description": "URL of a spritesheet you generated through the API in the last 7 days (the spritesheet_url returned by animateSprite, animateSpriteKeyframes, transferMotion, editSpritesheet, rotateSpritesheet or adjustSpritesheet). External URLs are not accepted.",
                    "example": "<url>",
                    "type": "string"
                  },
                  "spritesheet_with_background": {
                    "description": "When true, also returns the spritesheet with background intact (before background removal). The with-background spritesheet URL will be in spritesheet_with_background_url. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "use_pixel_grid": {
                    "description": "Use the animation's pixel grid if one is detected. true: when Ludo detects a pixel grid with confidence, the sheet is packed on it (logical pixels, scaled up by whole blocks); when none is detected, this has no effect. false: always pack as ordinary art, for when the detected grid is wrong for your asset (for example a smooth sprite coming back as coarse blocks). Ignored for forge-pixel animations, which are always packed on their grid. Unset keeps the source spritesheet's setting (true unless it was made with false). Re-cutting with false fixes a sheet whose detected grid is wrong without generating it again.",
                    "type": "boolean"
                  }
                },
                "required": ["spritesheet_url"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Adjust spritesheet export"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2d540a542f3272900aab435aea89dd19fab919baa4379ae03ad9fe577c90be89"
        },
        {
          "name": "animate3DModel",
          "title": "Animate 3D model",
          "description": "Generate text-driven skeletal animations for an already-rigged 3D model. Pass the rigged GLB in `model` (URL or base64; the 3D asset file, not an AI model name) and a motion `prompt` (e.g. \"walking\", \"swinging its axe\"). The model must already have a skeleton - rig it first with rigModel if not. The job result is num_variants candidate animations (default 4), each a standalone animation-only GLB (skeleton + one clip, no mesh) in `glb_url` plus an mp4 `preview_url`, so you can pick the best one and fuse it with your model in a game engine or three.js. mode selects the representation - rot_trans (default, rotation plus translation per bone, most faithful) or rot_only (rotation only, easier to retarget onto another skeleton in an engine). Animation quality is hit-or-miss, which is why multiple candidates are returned. Credits are held once per call regardless of variant count and refunded if the job fails or is cancelled. Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per call.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for animating a rigged 3D model from a text prompt",
                "properties": {
                  "augment_prompt": {
                    "description": "Rewrites the prompt into a detailed motion caption with an LLM. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "loop": {
                    "description": "Return to the initial pose: each clip plays forward then mirrors back to the rest pose for a seamless loop. Best for one-way motions (crouch, punch, wave); reads oddly for cyclic gaits like walking. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "mode": {
                    "description": "Animation representation: rot_trans (per-bone rotation+translation, most faithful) or rot_only (rotation + root translation only, for retargeting). Default: \"rot_trans\".",
                    "enum": ["rot_trans", "rot_only"],
                    "example": "rot_trans",
                    "type": "string"
                  },
                  "model": {
                    "description": "The already-rigged 3D asset to animate, as a URL or base64-encoded GLB file (not an AI model name). Rig it first with rigModel if it has no skeleton. Up to 30MB; a larger file is rejected with HTTP 400.",
                    "example": "<url> OR data:model/gltf-binary;base64,...",
                    "type": "string"
                  },
                  "num_variants": {
                    "description": "Number of candidate animations to generate; each returned as a standalone animation-only GLB with an mp4 preview. Default: 4.",
                    "example": 4,
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "prompt": {
                    "description": "Desired motion, e.g. \"walking\" or \"swinging its axe\".",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  }
                },
                "required": ["model", "prompt"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Animate 3D model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6ab3ed6dca4020865c9ca8945707fcd932a0bc57e99d65b82bba4a4dacc7ca8d"
        },
        {
          "name": "animate3DModelPreset",
          "title": "Animate 3D model with a preset",
          "description": "Apply a curated animation preset to an already-rigged 3D model (retargeting). Pass the rigged GLB in `model` (URL or base64; the 3D asset file, not an AI model name) and a `preset_id` from the animation presets list (from listAnimationPresets; any preset id works). Any rig type can take a preset, though retargeting does not succeed on every model: when it does not, the job fails. The job result is one retargeted animation - a standalone animation-only GLB in `glb_url` plus an mp4 `preview_url` - in the same `animations` envelope as the animate endpoint. crop_loop trims the clip to its seamlessly-looping span (omit to follow the preset's own loop flag); in_place removes net travel so the character moves on the spot, as game-engine locomotion expects (omit to keep the preset's own travel). Credits are held when the job is accepted and refunded if it fails or is cancelled. Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per call.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for animating a rigged 3D model with a preset animation",
                "properties": {
                  "crop_loop": {
                    "description": "Trim the animation to the span that loops seamlessly. Omit to follow the preset's own loop flag. Ignored when no clean loop exists.",
                    "type": "boolean"
                  },
                  "in_place": {
                    "description": "Remove the animation's net travel so the character moves on the spot (engine-driven locomotion). Omit to keep the preset's own travel.",
                    "type": "boolean"
                  },
                  "model": {
                    "description": "The already-rigged 3D asset, as a URL or base64-encoded GLB file (not an AI model name). Rig it first, with rigModel or with create3DModel's rig (any rig type). Up to 30MB; a larger file is rejected with HTTP 400.",
                    "example": "<url> OR data:model/gltf-binary;base64,...",
                    "type": "string"
                  },
                  "preset_id": {
                    "description": "id of an animation preset from listAnimationPresets. Any preset id from that list works.",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  }
                },
                "required": ["model", "preset_id"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Animate 3D model with a preset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c7e800d154b342df2da69f068e801515397590ca91fa45fa74eb62e7d33783ca"
        },
        {
          "name": "animateSprite",
          "title": "Animate sprite",
          "description": "Animate a static sprite into a spritesheet driven by a motion text prompt (image-to-spritesheet): supply an initial_image (URL or base64) plus a motion_prompt like \"walking\" or \"attack slash\", and optionally a final_image to interpolate between a start and end frame. Describe the motion exactly and unambiguously, but do not over-describe it: an action the model already knows is one phrase, not a sequence of steps, and the character, art style, background and camera come from the image, not the prompt. For animations driven by up to three keyframes (including a middle frame), use animateSpriteKeyframes instead. The job result is a single sprite result: `spritesheet_url` (the sheet image), `video_url` (an mp4 of the animation - pass it as `video` to transferMotion or as `spritesheet_video_url` to createSpriteAudio; editSpritesheet takes `spritesheet_url`), `num_frames`/`num_cols`/`num_rows` (the grid layout), and, when requested, `gif_url`, `individual_frame_urls` and `spritesheet_with_background_url`. The hydra and hydra-plus models also return `audio_url`, a sound effect for the animation - there is no need to call createSpriteAudio afterwards; forge and forge-pixel produce no audio. The chosen model must support sprite animation and the duration must be valid for it; incompatible model/duration combinations return HTTP 400. Credits are held for the duration you requested when the job is accepted; the final charge is rate × seconds of video generated (legacy models keep their minimum charge), never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. The returned sheet is then trimmed to its best loop and can run slightly shorter than the video; that trim is not deducted. Choosing a tool: animateSprite (this one) when you can describe the motion in text; transferMotion when you want an exact motion copied from a reference video or one of the named presets from listAnimationPresets (e.g. a standard walk or attack cycle); generatePose first when the source image is not yet in the pose the animation should start from. Omit `model` to run on hydra (the default) - see the `model` field for the per-model rates. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type spritesheet). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: credits/s × seconds, per model: Hydra 3/s (shortest duration 3s, so 9 credits minimum), Griffin 10 flat, Forge 1.5/s, Forge Pixel 1.5/s, Hydra+ 4/s (shortest duration 3s, so 12 credits minimum) [LEGACY], Blitz 1.9/s (min charge 4 credits) [LEGACY], Eagle 2.6/s (min charge 4 credits) [LEGACY], Eagle with Audio 3.1/s (min charge 4 credits) [LEGACY]; flat = credits per generation; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint's full pricing table in the API docs.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating an animated spritesheet from a static image. Input images can either be provided in base64 or URL. If the image was generated using Ludo, ideally it should be generated using the \"sprite\", \"sprite-vfx\" or \"ui_asset\" type.",
                "properties": {
                  "augment_prompt": {
                    "description": "Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "crop": {
                    "description": "Crop sprite frames to fit content. Results in smaller spritesheets but inconsistent frame sizes across different animations. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "duration": {
                    "description": "Duration in seconds. Available values depend on the model:\n- hydra: 3, 3.5, 4, 4.5, 5\n- griffin-hd: 5\n- forge: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- forge-pixel: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- hydra-plus: 3, 3.5, 4, 4.5, 5\n- blitz: 1.2, 1.5, 2, 2.5, 3, 3.5, 4\n- eagle: 1, 2, 3, 4\n- eagle-audio: 1, 2, 3, 4 Default: 3.",
                    "example": 3,
                    "format": "float",
                    "type": "number"
                  },
                  "final_image": {
                    "description": "The url OR base64 of ending frame image. When provided, the animation will interpolate between the initial and final frames.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "frame_size": {
                    "description": "Size of the sprite in pixels, not of the frame: it sets how big the character is drawn in the exported sheet, and each frame also holds the space around the sprite, so frames come out larger than this value. It changes the export only, not how the sprite is generated. 0 is maximum resolution. -1 is AI 1.5x upscaling. -9 is True Size: frames keep the size and position of the input frame, untrimmed, so the spritesheet lines up exactly with the input image - use it (not margin_ratio_mode \"none\") whenever the output must align with your input; it works with any margin mode. Exporting larger than the input image adds no detail: do not pick a size above the input's own resolution, and 0 or -1 gain nothing on inputs under 512 px. True Size crops at the input image's edges, so anything the animation adds beyond them (an aura, a spell effect, a swung weapon) is cut off: use a fixed size or 0 for those. adjustSpritesheet re-exports a finished animation at another size for free. Accepted values: 32, 64, 96, 128, 192, 256, 384, 0, -1, -9. Default: 0.",
                    "example": 0,
                    "format": "integer",
                    "type": "number"
                  },
                  "frames": {
                    "description": "Maximum number of frames in the output spritesheet. Allow about one second of duration per 16 frames - above that the model may not be able to produce them all (64 frames needs a duration of at least 4). The result can have fewer frames when the duration is short or bad frames were removed. Accepted values: 4, 9, 16, 25, 36, 49, 64. Default: 36.",
                    "example": 36,
                    "format": "integer",
                    "type": "number"
                  },
                  "gif": {
                    "description": "When true, generates an animated GIF from the spritesheet and returns it in gif_url. Disabled by default to reduce response time. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "image_type": {
                    "description": "Type of sprite being animated. Affects generation parameters and styling. Tiling types (horizontal / vertical tiles, scrolling backgrounds, parallax layers, textures) stay seamless only on forge and forge-pixel, and only if the input image itself already wraps seamlessly on that axis; otherwise the animation shows a visible seam when tiled. Default: \"sprite\".",
                    "enum": ["sprite", "sprite-vfx", "item-icon", "ui_asset", "logo", "sprite-tiling-horizontal", "sprite-tiling-vertical", "scatter-pattern", "parallax_layer", "tile", "texture", "portrait", "card-art"],
                    "example": "sprite",
                    "type": "string"
                  },
                  "individual_frames": {
                    "description": "When true, extracts each frame from the spritesheet as an individual image and returns the URLs in individual_frame_urls. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "initial_image": {
                    "description": "The url OR base64 of the starting frame image to animate. This is the base sprite that will be brought to life.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "loop": {
                    "description": "Trim the animation at the beginning or end to create a seamless loop. Not guaranteed to produce a perfect loop. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "margin_ratio_horizontal": {
                    "description": "Horizontal padding around the sprite as a ratio (0.0 to 1.0). Every bit of margin is resolution taken from the sprite, so keep it as tight as the motion allows - about 0.15 - and go higher only for motion that extends sideways (sword slashes, punches) or if the sprite gets cut off. Supplying a value selects margin_ratio_mode \"manual\" unless margin_ratio_mode is set explicitly.",
                    "format": "float",
                    "type": "number"
                  },
                  "margin_ratio_mode": {
                    "description": "How the sprite is framed for generation. The model always generates on a canvas of the same size, so any margin is canvas the sprite does not fill: the more margin, the lower the resolution and detail of the sprite. \"auto\" (default, recommended) trims and centers the sprite and picks a margin suited to the motion. \"manual\" uses margin_ratio_horizontal / margin_ratio_vertical; keep them as tight as the motion allows (about 0.15) and raise only the axis the motion needs. \"none\" animates the input exactly as framed, with no trimming and no margin added, so the input must already have suitable margins: a sprite touching the edges gets its limbs, weapons and effects cut off as soon as it moves, and an image that is mostly empty space yields a small, low-detail sprite. \"none\" is the way to keep a deliberately off-center sprite (e.g. a character at the left edge firing a beam to the right), but results can be unpredictable. Do not use \"none\" to make the spritesheet line up with the input image - use frame_size -9 (True Size) for that; it works with any margin mode. Rules: omit margin_ratio_mode and send margin_ratio_horizontal / margin_ratio_vertical to get \"manual\" automatically; \"manual\" with no margin value fails with HTTP 400; \"auto\" or \"none\" sent together with a margin value fails with HTTP 400 (the value would be ignored). Default: \"auto\".",
                    "enum": ["auto", "manual", "none"],
                    "example": "auto",
                    "type": "string"
                  },
                  "margin_ratio_vertical": {
                    "description": "Vertical padding around the sprite as a ratio (0.0 to 1.0). Every bit of margin is resolution taken from the sprite, so keep it as tight as the motion allows - about 0.15 - and go higher only for motion that extends up or down (jumps) or if the sprite gets cut off. Supplying a value selects margin_ratio_mode \"manual\" unless margin_ratio_mode is set explicitly.",
                    "format": "float",
                    "type": "number"
                  },
                  "model": {
                    "description": "Model to use. Available models:\n- \"hydra\" (Hydra): 3 credits/s, shortest duration 3s, so 9 credits minimum · Best motion and prompt adherence\n- \"griffin-hd\" (Griffin): flat 10 credits per generation · Highest resolution and best image fidelity\n- \"forge\" (Forge): 1.5 credits/s · Cheapest alternative, for simple body shapes and simple actions\n- \"forge-pixel\" (Forge Pixel): 1.5 credits/s · Best for low-res pixel art animations\n- \"hydra-plus\" (Hydra+): 4 credits/s, shortest duration 3s, so 12 credits minimum · LEGACY - scheduled for removal, do not use for new work\n- \"blitz\" (Blitz): 1.9 credits/s, min charge 4 credits · LEGACY - scheduled for removal, do not use for new work\n- \"eagle\" (Eagle): 2.6 credits/s, min charge 4 credits · LEGACY - scheduled for removal, do not use for new work\n- \"eagle-audio\" (Eagle with Audio): 3.1 credits/s, min charge 4 credits · LEGACY - scheduled for removal, do not use for new work\nLegacy aliases: \"standard\" → blitz.\nModels marked LEGACY still work for existing integrations but will be removed; pick a current model for anything new.\nforge-pixel expects real pixel art - a perfect pixel grid at its natural resolution; for other art use hydra or forge. Art that only looks pixelated (an AI image with soft edges or uneven blocks) is refused: convert it with convertToPixelArt (free) first. Tiling image types stay seamless only on forge and forge-pixel. Default: \"hydra\".",
                    "enum": ["hydra", "griffin-hd", "forge", "forge-pixel", "hydra-plus", "blitz", "standard", "eagle", "eagle-audio"],
                    "example": "hydra",
                    "type": "string"
                  },
                  "motion_prompt": {
                    "description": "Text description of the desired animation, e.g. \"walking\", \"idle breathing\", \"attack slash\", \"casting a fireball with both hands\". Describe exactly and unambiguously what the character should do. Specific or complex actions are fine; there is no need to simplify them. Do not over-describe, though: too much detail can harm the animation, and an action the model already knows should be named, not decomposed into its steps (\"walking\", never \"move the left foot forward, then the right foot\"). Do not restate what initial_image already shows (the character, its appearance and equipment, the art style, the background, the lighting, the camera), and leave frame count and timing to the frames and duration fields. Negative phrasing (\"no background\", \"do not move the camera\", \"without a weapon\") works only on hydra and hydra-plus. On forge, forge-pixel and the legacy models it backfires: naming something you do not want makes it more likely to appear, so \"without a weapon\" tends to produce a weapon. On those models never phrase anything negatively; state only what should happen, and control everything else through the image and the other fields. Keep it well under 100 words: in longer prompts details start competing and some get dropped.",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of the spritesheet, for 2.5D lighting, returned as normal_map_url. It lines up with the sheet pixel for pixel and frame for frame (same layout, cells and alpha), as a lossless WebP in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. 0.5 credits per map on top of the generation; a map that could not be made is not charged, and its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "spritesheet_with_background": {
                    "description": "When true, also returns the spritesheet with background intact (before background removal). Useful for manually fixing background removal issues. The with-background spritesheet URL will be in spritesheet_with_background_url. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "use_pixel_grid": {
                    "description": "Use the animation's pixel grid if one is detected. Defaults to true. true: when Ludo detects a pixel grid with confidence, the sheet is packed on it (logical pixels, scaled up by whole blocks); when none is detected, this has no effect. false: always pack as ordinary art, for when the detected grid is wrong for your asset (for example a smooth sprite coming back as coarse blocks). Ignored for forge-pixel animations, which are always packed on their grid.",
                    "type": "boolean"
                  }
                },
                "required": ["initial_image", "motion_prompt"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
