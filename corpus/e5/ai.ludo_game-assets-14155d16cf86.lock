        },
        {
          "name": "generateWithStyle",
          "title": "Create image in a reference style",
          "description": "Generate new images that match the visual style of a reference image: supply a style_image (URL or base64) plus a text prompt describing what to create and an optional image_type (defaults to sprite). The job result is an array of image results, each with a url; request n (1-4) to control the number of variations. The style_image is uploaded and validated, and an image larger than 15MB is rejected with HTTP 400. Credits are held when the job is accepted and refunded if it fails or is cancelled; the charge scales with the number of images produced. Use this instead of createImage when style consistency with an existing asset matters; use editImage to alter the content of a specific image rather than borrow its style, and removeBackground to isolate a subject. Pass an optional request_id to tag the results so you can retrieve them later via listGenerations (type image). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per result.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating new content while maintaining the visual style of a reference image",
                "properties": {
                  "augment_prompt": {
                    "description": "Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "image_type": {
                    "description": "What kind of image to generate. Default: \"sprite\".",
                    "enum": ["generic", "screenshot", "art", "asset", "sprite", "sprite-vfx", "sprite-tiling-horizontal", "sprite-tiling-vertical", "scatter-pattern", "icon", "logo", "ui_asset", "fixed_background", "side_scrolling_background", "vertical_scrolling_background", "parallax_layer", "texture", "tile", "item-icon", "portrait", "card-art", "splash", "3d"],
                    "example": "sprite",
                    "type": "string"
                  },
                  "n": {
                    "description": "Number of variations to generate (1-4). Default: 1.",
                    "example": 1,
                    "format": "integer",
                    "maximum": 4,
                    "minimum": 1,
                    "type": "number"
                  },
                  "prompt": {
                    "description": "Text description of what to generate (e.g., \"a warrior character\", \"a forest background\", \"a treasure chest\").",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of each image, for 2.5D lighting, returned as normal_map_url. It is a lossless WebP of the same size and alpha as the image, in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. Free; when a map could not be made, its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "style_image": {
                    "description": "URL or base64-encoded reference image whose visual style should be matched.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  }
                },
                "required": ["prompt", "style_image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
