        },
        {
          "name": "createVoice",
          "title": "Design voice",
          "description": "Design a new voice from a character description (such as \"deep-voiced warrior\" or \"cheerful young girl\"), a character image, or both, and have it speak a short line of text, returning a sample of that newly created voice. text is required, plus voice_description or image (an image of the speaking character, given as a URL or base64, makes the description optional); the spoken text is limited to 100 characters or the call returns HTTP 400, and type selects \"human\" or \"non-human\" voices. The job result is a single audio result containing the URL of an MP3 or WAV file (the URL's extension, .mp3 or .wav, says which). Credits are held when the job is accepted and refunded if it fails or is cancelled. Use this to invent and audition a voice from a description; use createSpeech for text-to-speech that clones a specific voice from an audio sample, and createSpeechPreset for text-to-speech using a named preset voice. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type audio). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 2 credits per call.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for generating a voice sample from a character description and/or a character image",
                "properties": {
                  "augment_prompt": {
                    "description": "Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively. Default: true.",
                    "example": true,
                    "type": "boolean"
                  },
                  "image": {
                    "description": "URL or base64-encoded image of the speaking character (concept art, at most 15MB). The voice is designed from it, and voice_description becomes optional.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "text": {
                    "description": "Text for the voice to speak (max 100 characters).",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "type": {
                    "description": "Type of voice to generate. Default: \"human\".",
                    "enum": ["human", "non-human"],
                    "example": "human",
                    "type": "string"
                  },
                  "voice_description": {
                    "description": "Text description of the voice character (e.g., \"deep-voiced warrior\", \"cheerful young girl\"). Required unless image is given; with an image, a few words of hints.",
                    "type": "string"
                  }
                },
                "required": ["text"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Design voice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:41359255e2e1262d4176f5de53b45fdac81bfabf5facdd9465c871d5e9e568b4"
        },
        {
          "name": "editImage",
          "title": "Edit image",
          "description": "Modify an existing image according to text instructions: supply a source image (URL or base64) and a prompt describing the changes (e.g. \"add clouds\", \"warmer color scheme\"), with an optional reference_image for extra style or content guidance. To change only one area, pass a mask (white = change, black = keep, the same size as the image): mask_mode \"replace\" (default) redraws that area from the prompt, \"erase\" removes what is there. Without a mask the whole image is re-rendered. Never ask for a transparent background in the prompt: it often comes back as a grey-and-white checkerboard painted into the pixels, which removeBackground cannot remove. A sprite keeps its transparency without being asked (see image_type). The job result is an array of image results, each with a url; request n (1-4) to control the number of edited variations. Provided images are uploaded and validated, and any image larger than 15MB is rejected with HTTP 400. Credits are held when the job is accepted and refunded if it fails or is cancelled; the charge scales with the number of images produced. Use editImage to transform a specific existing image; use createImage to generate from text alone, generateWithStyle to borrow a reference's art style, and removeBackground for the dedicated background-removal case. Pass an optional request_id to tag the results so you can retrieve them later via listGenerations (type image). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: This endpoint consumes 0.5 credits per result; 1 credit per result with a mask.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for editing an existing image based on text instructions",
                "properties": {
                  "image": {
                    "description": "URL or base64-encoded source image to edit.",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "image_type": {
                    "description": "What kind of image the source is (e.g. \"sprite\"). Not needed when `image` is the URL of an image you generated on Ludo in the last 30 days, which keeps its own type. Set it when the image is an upload or a link from elsewhere, so a sprite is edited as a sprite and keeps its transparent background.",
                    "enum": ["generic", "screenshot", "art", "asset", "sprite", "sprite-vfx", "sprite-tiling-horizontal", "sprite-tiling-vertical", "scatter-pattern", "icon", "logo", "ui_asset", "fixed_background", "side_scrolling_background", "vertical_scrolling_background", "parallax_layer", "texture", "tile", "item-icon", "portrait", "card-art", "splash", "3d"],
                    "example": "sprite",
                    "type": "string"
                  },
                  "mask": {
                    "description": "Optional URL or base64-encoded PNG that limits the edit to one area of the image. White marks the area to change, black the area to keep. It must be exactly the same width and height as `image`, or the call returns 400. Without a mask the whole image is re-rendered, which can shift colours and details outside the part you meant to change. A masked edit costs more than an unmasked one (see the price).",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "mask_mode": {
                    "description": "Only with `mask`. \"replace\" (the default) redraws the masked area from `prompt`; \"erase\" removes what is in the masked area and takes no prompt.",
                    "enum": ["replace", "erase"],
                    "example": "replace",
                    "type": "string"
                  },
                  "n": {
                    "description": "Number of edited variations to generate (1-4). Default: 1.",
                    "example": 1,
                    "format": "integer",
                    "maximum": 4,
                    "minimum": 1,
                    "type": "number"
                  },
                  "prompt": {
                    "description": "Text description of the changes to make (e.g., \"add clouds to the sky\", \"make it darker\", \"change the color scheme to warmer tones\"). Required, except with mask_mode \"erase\". With a mask, describe what should fill the masked area. Describe only the change, never the background's transparency (\"transparent background\", \"on transparency\", \"transparent padding\"); asking for it often paints a checkerboard into the pixels instead. A sprite keeps its transparent background on its own, and removeBackground is the tool for removing one.",
                    "type": "string"
                  },
                  "reference_image": {
                    "description": "Optional URL or base64-encoded reference image for style or content guidance. Not used with mask_mode \"erase\".",
                    "example": "<url> OR data:image/png;base64,...",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of each image, for 2.5D lighting, returned as normal_map_url. It is a lossless WebP of the same size and alpha as the image, in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. Free; when a map could not be made, its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  }
                },
                "required": ["image"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b4da2c054076b92eedbe5d52306d48e202b5024ffdb9114c291e0d0d758b97d5"
        },
        {
          "name": "editSpritesheet",
          "title": "Edit spritesheet",
          "description": "Edit a previously generated spritesheet: re-prompt its underlying animation (edit_mode \"prompt\"), extend the frame beyond its borders (\"outpaint\"), repair a bad loop (\"fix_loop\"), or re-render it with finer detail (\"improve\": the extra pass hydra-plus runs when it generates, on a spritesheet generated with hydra only - any other returns HTTP 400; a sheet generated on hydra-plus already has it). Pass the `spritesheet_url` you received from `animateSprite`, `animateSpriteKeyframes`, `transferMotion`, or an earlier edit - it must be a spritesheet you generated within the last 7 days; arbitrary external images are not accepted. Omit `duration`, `frames`, `frame_size`, `crop` and `model` to keep the source spritesheet's values. A `prompt` is required for edit_mode \"prompt\", optional for \"outpaint\", and not accepted for \"fix_loop\" or \"improve\"; optionally add up to 5 reference `images` (URL or base64) to guide the edit. The job result is the same result shape as animateSprite (spritesheet URL, frame layout, optional GIF or individual frames). Credits are held when the job is accepted; the final charge is rate × seconds of video generated, never more than was held, and the difference (or everything, if the job fails or is cancelled) is refunded. The returned sheet is then trimmed to its best loop and can run slightly shorter than the video; that trim is not deducted. Prompt edits are priced per model (credits/second × duration) and held for the duration you requested; \"outpaint\", \"fix_loop\" and \"improve\" run a lighter pipeline in which `model` is ignored and are billed at a flat 1 credit per second of output, held for and capped at the length of the source spritesheet's video (`duration` does not change their price). Outpaint decides the extra margin itself - there is no amount parameter. The result carries the same fields as animateSprite (`spritesheet_url`, `video_url`, grid fields); new audio is generated only by prompt edits on hydra: \"fix_loop\", \"outpaint\" and \"improve\" do not regenerate it, and their result carries the source spritesheet's `audio_url` when it had one. Pass an optional `request_id` to tag the result for later retrieval via listGenerations (type spritesheet). Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: edit_mode \"fix_loop\" / \"outpaint\": flat 1 credit per second of output, capped at the source spritesheet's video length, no minimum, model ignored; edit_mode \"improve\" (hydra spritesheets only): flat 1 credit per second of output, same terms; edit_mode \"prompt\": per model as listed - credits/s × seconds, per model: Hydra 3/s, Griffin 10 flat, Forge 2/s, Forge Pixel 2/s; flat = credits per generation; see this endpoint's full pricing table in the API docs.",
          "inputSchema": {
            "properties": {
              "requestBody": {
                "description": "Payload for editing a previously generated spritesheet. edit_mode selects the operation - prompt-driven edit (default), outpaint, loop fixing, or improve (finer detail, on hydra spritesheets only).",
                "properties": {
                  "crop": {
                    "description": "Crop sprite frames to fit content (omit to keep the source spritesheet's setting). Results in smaller spritesheets but inconsistent frame sizes across different animations.",
                    "type": "boolean"
                  },
                  "duration": {
                    "description": "Duration in seconds. Available values depend on the model:\n- hydra: 3, 3.5, 4, 4.5, 5\n- griffin-hd: 5\n- forge: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5\n- forge-pixel: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5",
                    "format": "float",
                    "type": "number"
                  },
                  "edit_mode": {
                    "description": "Edit operation to perform. \"improve\" re-renders the animation with finer detail (the extra pass hydra-plus runs when it generates) and only takes a spritesheet generated with hydra; any other source returns HTTP 400, including an already improved spritesheet (or a loop fix or outpaint of one), which has that detail already. \"fix_loop\" generates a new clip rather than patching the seam, so run it only on a spritesheet whose result had bad_loop true: on a loop that is already clean it can come back with a worse seam. If the fix is worse, keep the source. Default: \"prompt\".",
                    "enum": ["prompt", "outpaint", "fix_loop", "improve"],
                    "example": "prompt",
                    "type": "string"
                  },
                  "frame_size": {
                    "description": "Size of the sprite in pixels, not of the frame - it sets how big the character is drawn, and each frame also holds the space around it, so frames come out larger than this value. 0 is for maximum resolution. Omit to keep the source spritesheet's setting. Accepted values: 32, 64, 96, 128, 192, 256, 384, 0.",
                    "format": "integer",
                    "type": "number"
                  },
                  "frames": {
                    "description": "Number of frames in the output spritesheet. Omit to keep the source spritesheet's frame count. Allow about one second of duration per 16 frames - above that the model may not be able to produce them all. Accepted values: 4, 9, 16, 25, 36, 49, 64.",
                    "format": "integer",
                    "type": "number"
                  },
                  "gif": {
                    "description": "When true, generates an animated GIF from the spritesheet and returns it in gif_url. Disabled by default to reduce response time. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "images": {
                    "description": "Optional reference images (up to 5), each a URL or base64, to guide the edit. Two, at most three, work best: more references reduce the model's ability to use any of them correctly.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "individual_frames": {
                    "description": "When true, extracts each frame from the spritesheet as an individual image and returns the URLs in individual_frame_urls. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "loop": {
                    "description": "Trim the animation at the beginning or end to create a seamless loop. Default: true.",
                    "type": "boolean"
                  },
                  "model": {
                    "description": "Model to use. Available models:\n- \"hydra\" (Hydra): 3 credits/s · Best motion and prompt adherence\n- \"griffin-hd\" (Griffin): flat 10 credits per generation · Highest resolution and best image fidelity\n- \"forge\" (Forge): 2 credits/s · Cheapest alternative, for simple body shapes and simple actions\n- \"forge-pixel\" (Forge Pixel): 2 credits/s · Best for low-res pixel art animations Default: \"hydra\".",
                    "enum": ["hydra", "griffin-hd", "forge", "forge-pixel"],
                    "type": "string"
                  },
                  "prompt": {
                    "description": "Edit instruction. Required for edit_mode \"prompt\", optional for \"outpaint\", not accepted for \"fix_loop\" or \"improve\". Focus it on a single change and keep it short (under about 50 words); run a second edit for more.",
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.",
                    "type": "string"
                  },
                  "save_normals": {
                    "description": "Also make a normal map of the spritesheet, for 2.5D lighting, returned as normal_map_url. It lines up with the sheet pixel for pixel and frame for frame (same layout, cells and alpha), as a lossless WebP in the OpenGL convention (red = right, green = up, blue = towards the viewer; Unity and Godot read it as is, Unreal expects green flipped). Pixel art gets one normal per art pixel. 0.5 credits per map on top of the generation; a map that could not be made is not charged, and its normal_map_url is absent. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "spritesheet_url": {
                    "description": "URL of a spritesheet you generated in the last 7 days (returned by animateSprite, transferMotion, or a previous edit as spritesheet_url). External URLs are not accepted. Edit the original animation rather than a previous edit's result: every edit re-renders the whole animation, so colors and detail drift further with each pass. If an edit did not work, retry from the original instead of editing on top.",
                    "example": "<url>",
                    "type": "string"
                  },
                  "spritesheet_with_background": {
                    "description": "When true, also returns the spritesheet with background intact (before background removal). The with-background spritesheet URL will be in spritesheet_with_background_url. Default: false.",
                    "example": false,
                    "type": "boolean"
                  },
                  "use_pixel_grid": {
                    "description": "Use the animation's pixel grid if one is detected. true: when Ludo detects a pixel grid with confidence, the sheet is packed on it (logical pixels, scaled up by whole blocks); when none is detected, this has no effect. false: always pack as ordinary art, for when the detected grid is wrong for your asset (for example a smooth sprite coming back as coarse blocks). Ignored for forge-pixel animations, which are always packed on their grid. Unset keeps the source spritesheet's setting (true unless it was made with false).",
                    "type": "boolean"
                  }
                },
                "required": ["spritesheet_url"],
                "type": "object"
              }
            },
            "required": ["requestBody"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit spritesheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dff58aa1091dda699113b11278b4c314ef15cf62ec9501c201976f19370fdfa3"
        },
        {
          "name": "editVideo",
          "title": "Edit video",
          "description": "Edit a previously generated video with a text prompt and optional reference images (video-to-video); runs on griffin-hd (768p, with soundtrack) and the output keeps the source video's duration unless you pass one. Pass the video `url` you received from `createVideo`, `createVideoFromReferences`, or an earlier edit - it must be a video you generated within the last 7 days; arbitrary external videos are not accepted. Optionally add up to 5 reference `images` (URL or base64) to guide the edit. The job result is the new video URL and its actual duration in seconds. Credits are held when the job is accepted; the final charge is rate × produced seconds, never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. Pass an optional `request_id` to tag the result so you can locate it later via listGenerations (type video). Related tools: `createVideo` to generate the source clip, `createVideoFromReferences` for reference-driven generation. Async generation job: returns `{id, status}` - poll `getApiJob` (job and credit contract: see the server instructions).\n\nCredits: credits/s × seconds, per model: Griffin 2/s, Eagle 2/s [LEGACY]; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint's full pricing table in the API docs.",
          "inputSchema": {
