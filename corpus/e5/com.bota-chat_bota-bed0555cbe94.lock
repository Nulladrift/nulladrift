      "instructions": "Bota lets you rent a car directly from the car rental companies that use Bota, at the price each company sets (the same as its own web chat), with the booking created in the company's own system. Flow: list_rental_companies → list_offices → search_availability → select_offer → select_extras (if offered) → provide_customer_details → confirm_booking. Ask the main driver's age before searching and the driver's phone number before submitting details; never invent them. Keep the session_id of each company and pass it back on every call. Only submit details once the customer accepted the company's terms, and only confirm a booking or a cancellation after the customer explicitly confirms the summary shown. For questions about requirements, deposit or insurance use ask_company. After booking, get_booking_status and cancel_booking take the booking reference and the customer's email. The demo company is for testing: its bookings are free and fictitious. Machine guide: https://www.bota-chat.com/api/public/provider-api-guide",
      "tools": [
        {
          "name": "ask_company",
          "title": "Ask the rental company",
          "description": "Ask the company a free-text question (requirements, deposit, insurance, documents, opening hours, pickup instructions…). Bota answers in the customer's language with the company's approved information. Read-only: it never starts, changes or completes a booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_id": {
                "description": "Rental company id.",
                "type": "string"
              },
              "language": {
                "description": "Language of the conversation, BCP-47 (es, en, pt-BR, fr, de, it…). Defaults to 'en'. Bota also answers in the language the customer writes.",
                "type": "string"
              },
              "question": {
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["company_id", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask the rental company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e1ef4dac93e759b506986faf47257f1cdc9a41452844c0a3d3982693a906ad7"
        },
        {
          "name": "cancel_booking",
          "title": "Cancel a booking",
          "description": "Cancels a booking made through Bota. Without confirm it only returns the booking and whether it can be cancelled; with confirm=true it cancels it. Cancellation fees, if any, follow the company's terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "booking_reference": {
                "description": "Booking reference from the customer's confirmation email.",
                "maxLength": 40,
                "type": "string"
              },
              "company_id": {
                "description": "Rental company id.",
                "type": "string"
              },
              "confirm": {
                "description": "true cancels the booking; omitted or false only previews it.",
                "type": "boolean"
              },
              "email": {
                "description": "Email the booking was made with. Required to prove the customer owns it.",
                "format": "email",
                "type": "string"
              },
              "language": {
                "description": "Language of the conversation, BCP-47 (es, en, pt-BR, fr, de, it…). Defaults to 'en'. Bota also answers in the language the customer writes.",
                "type": "string"
              }
            },
            "required": ["booking_reference", "company_id", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel a booking"
          },
          "behavior": {
