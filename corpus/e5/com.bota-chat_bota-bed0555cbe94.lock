        {
          "name": "provide_customer_details",
          "title": "Provide driver details",
          "description": "Submits the driver's details for the booking in progress and returns the booking summary with its confirmation_token. terms_accepted records that the customer accepted the company's terms and must be true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_id": {
                "description": "Rental company id.",
                "type": "string"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "first_name": {
                "maxLength": 80,
                "type": "string"
              },
              "flight_number": {
                "maxLength": 20,
                "type": "string"
              },
              "language": {
                "description": "Language of the conversation, BCP-47 (es, en, pt-BR, fr, de, it…). Defaults to 'en'. Bota also answers in the language the customer writes.",
                "type": "string"
              },
              "last_name": {
                "maxLength": 120,
                "type": "string"
              },
              "notes": {
                "maxLength": 500,
                "type": "string"
              },
              "phone": {
                "description": "With country code (+1…). Required by most companies.",
                "maxLength": 30,
                "type": "string"
              },
              "references": {
                "additionalProperties": false,
                "description": "Only for a company where the person has a negotiated agreement and that asks for booking references: the claim or file number, cost center or purchase order and agency reference the customer gives, exactly as given. If one it requires is missing, this tool fails with references_required naming it.",
                "properties": {
                  "agency_ref": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "claim": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "cost_center": {
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "session_id": {
                "description": "Booking session id returned by a previous call for this company (offers, selection, customer details). Omitted, a new session starts.",
                "type": "string"
              },
              "terms_accepted": {
                "type": "boolean"
              }
            },
            "required": ["company_id", "email", "first_name", "last_name", "session_id", "terms_accepted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
