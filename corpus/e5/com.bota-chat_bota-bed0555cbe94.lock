        {
          "name": "confirm_booking",
          "title": "Confirm the booking",
          "description": "Confirms the summarised booking with its confirmation_token, which proves the customer saw that exact summary. Creates the reservation in the company's reservation system and returns the confirmation code (and a payment link when the company requires prepayment). An on-request booking comes back pending the company's confirmation and without a code yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_id": {
                "description": "Rental company id.",
                "type": "string"
              },
              "confirmation_token": {
                "description": "confirmation_token from the response that showed the booking summary.",
                "type": "string"
              },
              "language": {
                "description": "Language of the conversation, BCP-47 (es, en, pt-BR, fr, de, it…). Defaults to 'en'. Bota also answers in the language the customer writes.",
                "type": "string"
              },
              "session_id": {
                "description": "Booking session id returned by a previous call for this company (offers, selection, customer details). Omitted, a new session starts.",
                "type": "string"
              }
            },
            "required": ["company_id", "confirmation_token", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
