        {
          "name": "search_availability",
          "title": "Search available cars and prices",
          "description": "Search available vehicles with real prices for a company, office and dates. Prices are identical to the company's own web chat (mandatory charges, one-way and time rules included). Returns numbered offers and the session_id of this booking session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_id": {
                "description": "Rental company id.",
                "type": "string"
              },
              "driver_age": {
                "description": "Main driver's age. The price and the available cars depend on it.",
                "maximum": 99,
                "minimum": 18,
                "type": "integer"
              },
              "language": {
                "description": "Language of the conversation, BCP-47 (es, en, pt-BR, fr, de, it…). Defaults to 'en'. Bota also answers in the language the customer writes.",
                "type": "string"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD, office-local.",
                "type": "string"
              },
              "pickup_office": {
                "description": "Pickup office name or id.",
                "type": "string"
              },
              "pickup_time": {
                "description": "HH:MM, office-local. Default 10:00.",
                "type": "string"
              },
              "promo_code": {
                "type": "string"
              },
              "return_date": {
                "description": "YYYY-MM-DD, office-local.",
                "type": "string"
              },
              "return_office": {
                "description": "Return office name or id when different (one-way).",
                "type": "string"
              },
              "return_time": {
                "description": "HH:MM, office-local. Default 10:00.",
                "type": "string"
              },
              "session_id": {
                "description": "Booking session id returned by a previous call for this company (offers, selection, customer details). Omitted, a new session starts.",
                "type": "string"
              }
            },
            "required": ["company_id", "driver_age", "pickup_date", "pickup_office", "return_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
