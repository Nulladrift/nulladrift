{
  "lockfileVersion": 2,
  "subjects": {
    "com.intoperson.bid/bid-conditions": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bid.intoperson.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kr-bid",
        "title": "입찰 공고 참가 조건",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "나라장터 공사 입찰 공고(조달청 공공데이터와 첨부 공고문)의 참가 조건 판정과 근거 원문. 공고 찾기(search_notices)·공고 상세(get_notice)·회사 참가 판정(check_eligibility, top_notices, widen_eligibility)·답 대조(verify_answer). 예측값(1순위 확률, 예상 낙찰가, 예상 참가업체 수)은 유료 구독자에게 보이고, 그 밖에는 masked로 옵니다. 투찰 전 나라장터 원문을 확인하세요.",
      "tools": [
        {
          "name": "bid_price_scenarios",
          "title": "투찰가별 1순위 확률",
          "description": "Use this when: the user asks what 사정률 or 투찰가 to write, or the chance of 개찰 1순위 at a price. Returns 1순위 확률 by 사정률 98.5~101.5%, the highest spot (best = 추천 투찰가 on our report) and the expected number of bidders, for 복수예가 notices awarded by 적격심사 or 소액수의견적 (otherwise why there is none). Masked for non-paying users. Do not use this when: the notice is not open.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "no": {
                "description": "나라장터 입찰공고번호, 예: R26BK01743030",
                "type": "string"
              }
            },
            "required": ["no"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "투찰가별 1순위 확률"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b782259ed7402ab848cdcaef9726c2a360fdae3153381fab1e38d8de8c94e77"
        },
        {
          "name": "check_eligibility",
          "title": "우리 회사 참가 판정",
          "description": "Use this when: the user asks whether their company can enter notices. Judges up to 20 notices (or, with none given, every open notice) against the company's licences and 소재지: 적격 / 확인 필요 / 부적격 with the reason per condition. On the personal address it uses the signed-up company's 조달청 registration; otherwise give licences and region. Do not use this when: the user only wants the notice's conditions (use get_notice).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "licences": {
                "description": "회사가 가진 업종(면허) 이름이나 4자리 업종코드. 개인 연결 주소면 비워도 조달청 등록 정보를 씀",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "nos": {
                "description": "공고번호 목록. 비우면 지금 열린 공고 전부에서 적격·확인 필요를 마감 빠른 순으로 40건까지",
                "items": {
                  "description": "나라장터 입찰공고번호, 예: R26BK01743030",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "region": {
                "description": "회사 소재지(시·도 또는 시·도 시·군). 예: 경기도 가평군",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "우리 회사 참가 판정"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c7147e407cd0f5b4db9b2028cebb36005796a3eb81d3e7e54c635fb2376e1dd"
        },
        {
          "name": "get_notice",
          "title": "공고 상세",
          "description": "Use this when: the user asks about one public construction bid notice of 나라장터 (참가 조건, 면허, 지역, 등급, 공동도급, 기초금액, 낙찰하한율, 정정). Returns every recorded condition with the notice sentence it came from (모름 = not found in the notice), the check date, and the forecast block (예상 낙찰가, 예상 참가업체 수), masked for non-paying users. Do not use this when: the user asks whether their own company can enter (use check_eligibility).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "no": {
                "description": "나라장터 입찰공고번호, 예: R26BK01743030",
                "type": "string"
              }
            },
            "required": ["no"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "공고 상세"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6be6676d83c7e1d03edf7aff23d4a8a3ab8f41a59980e850d4f3d66f33affbbf"
        },
        {
          "name": "my_bid_history",
          "title": "우리 회사 지난 투찰",
          "description": "Use this when: the user asks how their company bid before (건수, 1순위, 3위 안, 순위 중앙값, 사정률 중앙값). Only the signed-up company's own record, on the personal address. Do not use this when: the user asks about another company.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "우리 회사 지난 투찰"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d16a136fa17b20570328ff7dce0de7cb8fd1a9b073f0208c20c5eca16dcec4c2"
        },
        {
          "name": "request_coverage",
          "title": "자료 요청",
          "description": "Use this when: the user needs notices or conditions we do not have (another agency, a condition we do not read, a region). Records only the kind of request, not its words, so we can see what to add next. Do not use this when: the data is already answered by another tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "agency: 나라장터 밖 기관 공고, condition: 못 읽는 참가 조건, region: 지역, other",
                "enum": ["agency", "condition", "region", "other"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "자료 요청"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:55620905d4e30b619bf625ee44021b6e4ed3e6dadf9aac1b486f1ce9bebc24ac"
        },
        {
          "name": "search_notices",
          "title": "공고 찾기",
          "description": "Use this when: the user looks for open 나라장터 construction bid notices by words (공고명·발주기관), licence (업종·면허), region (시·도 or 시·군), 추정가격 range or how soon they close. Returns open notices, nearest deadline first, each with its licence and region limits and the page link. Do not use this when: the user asks whether a given company can enter (use check_eligibility) or about one known notice number (use get_notice).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "close_within_days": {
                "description": "며칠 안에 마감하는 공고만",
                "type": "number"
              },
              "licence": {
                "description": "업종(면허) 이름이나 4자리 업종코드. 예: 전기공사업, 0036",
                "type": "string"
              },
              "limit": {
                "description": "최대 건수, 기본 20, 최대 50",
                "type": "number"
              },
              "max_estimate": {
                "description": "추정가격 상한(원)",
                "type": "number"
              },
              "min_estimate": {
                "description": "추정가격 하한(원)",
                "type": "number"
              },
              "query": {
                "description": "공고명·발주기관 낱말, 띄어 쓴 낱말은 모두 들어간 공고만. 예: 하천 정비, 교육청",
                "type": "string"
              },
              "region": {
                "description": "공사 참가 지역. 지역 제한이 없는 공고도 함께 나옴. 예: 경기도, 경기도 가평군",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "공고 찾기"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d27f67d5db6cebe629bb9dd3fd315513137089269f937df6e5ab88e178df4bd"
        },
        {
          "name": "top_notices",
          "title": "먼저 볼 공고",
          "description": "Use this when: the user asks which open notices their company should look at first today. Returns the 적격 notices whose deadline is more than 3 days away, nearest deadline first (up to 5), with the counts of 적격 / 확인 필요 / 부적격 and the page and report links. Same company input as check_eligibility. Do not use this when: the user searches by words or price (use search_notices).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "licences": {
                "description": "업종(면허) 이름이나 4자리 업종코드",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "region": {
                "description": "회사 소재지",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "먼저 볼 공고"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2798c6fab4f2de0135388a9eace052d51efac10d15e484fabb5c4c793d947d3e"
        },
        {
          "name": "verify_answer",
          "title": "답 대조",
          "description": "Use this when: you have written facts about one notice (마감, 추정가격, 배정예산, 계약 방법, 낙찰하한율, 참가 지역, 필요한 면허) and want to check them before answering. Returns 맞음 / 틀림 / 기록 없음 per claim with the recorded value and its source field. Do not use this when: you have not read the notice yet (use get_notice).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claims": {
                "additionalProperties": false,
                "description": "대조할 값. 쓸 수 있는 칸: close(마감 일시), estimate(추정가격 원), budget(배정예산 원), method(계약 방법), lower_rate(낙찰하한율 %), region(참가 지역 하나), licence(필요한 면허 하나)",
                "properties": {
                  "budget": {
                    "type": "number"
                  },
                  "close": {
                    "type": "string"
                  },
                  "estimate": {
                    "type": "number"
                  },
                  "licence": {
                    "type": "string"
                  },
                  "lower_rate": {
                    "type": "number"
                  },
                  "method": {
                    "type": "string"
                  },
                  "region": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "no": {
                "description": "나라장터 입찰공고번호, 예: R26BK01743030",
                "type": "string"
              }
            },
            "required": ["claims", "no"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "답 대조"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:069af24740982942abfd8b03c1ff10305333ad8343984764a8b82f745a36435a"
        },
        {
          "name": "widen_eligibility",
          "title": "막는 조건",
          "description": "Use this when: the company can enter few or no open notices and the user asks what blocks it. Counts the 부적격 notices by cause and gives, for one more licence or one more region, how many more notices would open, with an example notice each. Same company input as check_eligibility. Do not use this when: the user asks about one notice (use check_eligibility with nos).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "licences": {
                "description": "업종(면허) 이름이나 4자리 업종코드",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "region": {
                "description": "회사 소재지",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "막는 조건"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87b6f9d82266541c7ac5b447926c8e89b3f839d4da57c10a970c5f22fab15f5d"
        }
      ],
      "digest": "sha256:eb7a33f59873692e87bc89ff161c09c4049071552ccb47d55a6e438f50f142e9"
    }
  }
}
