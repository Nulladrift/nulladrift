      "instructions": "TensorFeed.ai MCP server. Hosted HTTP transport at https://mcp.tensorfeed.ai/mcp (legacy path https://tensorfeed.ai/api/mcp) serves 30 tools: 15 free tools, 12 with a free tier and a paid full tier, and 3 paid only. Free: AI news, model pricing, AI service status, AI research papers, the daily agent-ecosystem opportunities scan, MITRE CVE, CISA KEV, EPSS, OSV.dev package advisories, the AI supply-chain IOC feed, agent reputation, SEC EDGAR full-text search, free webhook watches, the data wantlist, and find_tensorfeed_data, which searches the full endpoint catalog plus more tools callable here by name (openFDA, EIA energy series, USGS earthquakes, NWS alerts, SEC submissions and ticker lookup, the agent directory). Free tier plus paid full tier: route_verdict, provider_reliability_verdict, x402_settlement_verdict, x402_publisher_verdict, stack_safety_verdict, benchmark_trust_verdict, failover_verdict, ssvc_verdict, pricing_series, benchmark_series, status_uptime, status_leaderboard. The signed verdicts return a free preview (10 calls per IP per day) and the full AFTA-signed verdict with tier=\"full\"; with tier omitted, a call that carries a payment or credits token (or uses the strict x402 transport) bills as full. The time series are free for 1 to 7 days and paid for 8 to 90. Paid only: whats_new, compare_models, provider_deepdive. Paid calls are wallet-payable per call over x402: an unpaid call returns canonical payment requirements (accepts[]), then pay via arguments.payment or an X-PAYMENT header on the POST. x402 client wrappers can use strict HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict. Credits tokens (Authorization: Bearer tf_live_...) also work. Claim free trial credits by signing a wallet message at https://tensorfeed.ai/api/payment/trial-credits (no payment, no USDC), or buy credits at https://tensorfeed.ai/developers/agent-payments. The npx stdio server @tensorfeed/mcp-server is a 24-tool set that shares the verdict, time-series, and paid tools by name and bills through a credits token; per-call wallet payment is hosted only. Free results lead with page_url, the tensorfeed.ai page that shows the same data; link it when you cite TensorFeed to a user. License posture: most data is US Government public domain; commercial redistribution permitted; attribution preserved on every response.",
      "tools": [
        {
          "name": "benchmark_series",
          "description": "Daily benchmark scores for one model+benchmark over a window. Benchmark keys: swe_bench, mmlu_pro, gpqa_diamond, math, human_eval. days 1 to 7 is free; days 8 to 90 costs 1 credit ($0.02), tracking score evolution over the longer window. tier='full' uses the paid tier at any window. Pay per call with an x402 wallet payment (arguments.payment, or an X-PAYMENT header; strict HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization: Bearer tf_live_... credits token. No token and no USDC? Claim free trial credits by signing a wallet message at https://tensorfeed.ai/api/payment/trial-credits.",
          "inputSchema": {
            "properties": {
              "benchmark": {
                "description": "Benchmark key (e.g. swe_bench, mmlu_pro, gpqa_diamond, math, human_eval).",
                "type": "string"
              },
              "days": {
                "description": "Window length in days (1 to 90, default 7). 1 to 7 free; 8 to 90 paid.",
                "type": "number"
              },
              "model": {
                "description": "Model id or display name.",
                "type": "string"
              },
              "payment": {
                "description": "Optional base64 x402 payment payload (the same string an X-PAYMENT header would carry). Sign against the accepts[0] requirement returned by an unpaid call. Alternative to the Bearer credits token.",
                "type": "string"
              },
              "tier": {
                "description": "Optional. 'full' uses the paid tier even for a window of 7 days or less (adds the paid series envelope). Omit for the default split: days 1 to 7 free, 8 to 90 paid.",
                "enum": ["full"],
                "type": "string"
              }
            },
            "required": ["benchmark", "model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
