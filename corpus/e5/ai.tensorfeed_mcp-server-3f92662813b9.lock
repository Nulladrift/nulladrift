        {
          "name": "check_agent_reputation",
          "description": "Look up an agent's public reputation card from the TensorFeed Agent Reputation Bureau. Takes a wallet (0x + 40 hex) OR a token_prefix (first 16 chars of a tf_live_ bearer). Returns the full ReputationCard: composite + sub-metric ranks (reliability, spend, activity, streak), trust grade A through F, public flags (new_wallet, spend_spike, claim_disputed, etc), wallet age, first_seen, last_active, ofac_clean, banned + ban_reason if applicable. Cards rebuild daily at 04:50 UTC from TF's own observable telemetry. Returns ok=false with status=not_found for unknown identities so callers can distinguish \"we have no record\" from \"we have a record showing zero activity\". Useful for: marketplaces routing work to high-grade agents, peer agents deciding to trust another agent, ops dashboards monitoring an agent's standing, or operators inspecting their own reputation before claiming a wallet.",
          "inputSchema": {
            "properties": {
              "token_prefix": {
                "description": "First 16 chars of a tf_live_ bearer token (e.g. \"tf_live_18e54f47\"). Mutually exclusive with wallet.",
                "type": "string"
              },
              "wallet": {
                "description": "EIP-55 or lowercased EOA wallet address (0x + 40 hex). Mutually exclusive with token_prefix.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
