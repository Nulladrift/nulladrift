{
  "lockfileVersion": 2,
  "subjects": {
    "com.allthepossibles/verdict": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://verdict.allthepossibles.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "verdict",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Six design review tools. The text you pass is sent to the model for the review and is not stored; send an x-anthropic-key header to run on your own Anthropic account. What is stored, where it goes and for how long is on https://allthepossibles.com/trust.",
      "tools": [
        {
          "name": "audit_copy",
          "title": "Audit copy",
          "description": "Per-string critique of interface copy: buttons, errors, empty states, confirmations, notifications. Each string comes back with the problem and a fix, or nothing if it already works. Call it before shipping UI strings.",
          "inputSchema": {
            "properties": {
              "strings": {
                "items": {
                  "properties": {
                    "context": {
                      "enum": ["button", "error", "empty_state", "confirmation", "notification"],
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["context", "text"],
                  "type": "object"
                },
                "maxItems": 60,
                "type": "array"
              }
            },
            "required": ["strings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da32c1b9936acfb971bd5a90fd6cfbb6fa480300a1abefcbab3fe2cdb272964d"
        },
        {
          "name": "check_terminology",
          "title": "Check terminology",
          "description": "Finds concepts that carry different names across surfaces (UI strings, docs, API reference, support macros) and flags drift. Pass the text from each surface; nothing needs connecting.",
          "inputSchema": {
            "properties": {
              "sources": {
                "items": {
                  "properties": {
                    "label": {
                      "description": "Where this text lives, e.g. 'onboarding UI', 'API reference'.",
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "text"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "required": ["sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cd9ad539ee3ddca07ef61f93b144e8da16171f9c4f57153b23f5bf9b4f4a888"
        },
        {
          "name": "critique_experience",
          "title": "Critique experience",
          "description": "Adversarial critique of a design, given as a description or a screenshot URL, with an optional PRD. Returns findings ranked by severity covering hierarchy, density, affordance, composition, copy, and the first-use / 500th-use / zero-data / huge-data / no-permission / irreversible questions. Call it before presenting a design to a human or handing it to engineering.",
          "inputSchema": {
            "properties": {
              "artifact": {
                "description": "The design under review.",
                "properties": {
                  "type": {
                    "enum": ["description", "screenshot_url"],
                    "type": "string"
                  },
                  "value": {
                    "description": "A written description of the design, or an https URL to a screenshot.",
                    "type": "string"
                  }
                },
                "required": ["type", "value"],
                "type": "object"
              },
              "context": {
                "description": "Optional: audience, the single most important action, viewport.",
                "type": "string"
              },
              "prd": {
                "description": "Optional brief or PRD. Without one, the review judges against general principles.",
                "type": "string"
              }
            },
            "required": ["artifact"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ca634d67936b7a69c0b6c004cbeea2cd21ead667bf4dabeccfc3242569decd2"
        },
        {
          "name": "find_assumptions",
          "title": "Find assumptions",
          "description": "Reads a PRD or design brief and extracts the unverified assumptions inside it, ranked by risk, each turned into a research question that could change a decision. Never simulates user answers.",
          "inputSchema": {
            "properties": {
              "prd_text": {
                "description": "The PRD, brief or proposal.",
                "type": "string"
              }
            },
            "required": ["prd_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6fcb8a33234d4bc09494271a073048aa94ff9f693a7ad79a2d924d7daeba5bd3"
        },
        {
          "name": "generate_state_matrix",
          "title": "Generate state matrix",
          "description": "Generates the state space for a feature, form or screen across data, loading, permission, network, account, content, time, concurrency, outside dependencies, money, consistency and people, and lists the gaps most likely to cause real harm. Call it when a feature is described and you want to know what nobody drew.",
          "inputSchema": {
            "properties": {
              "feature_description": {
                "description": "The feature, form or screen, in prose or as a spec.",
                "type": "string"
              },
              "known_dimensions": {
                "description": "Optional: dimensions you already cover, so they are skipped.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["feature_description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f947f4fc85c01a3ce6798aeb98a3e4391e0fcd46b2468c82e91694c3f88b625"
        },
        {
          "name": "map_journey",
          "title": "Map journey",
          "description": "Breaks a user objective into the stages of a real journey and flags entry points and exit paths that have no designed arrival or recovery. Optionally focuses on one user maturity (first use, occasional, habitual, expert). Describes behavior, not screens.",
          "inputSchema": {
            "properties": {
              "objective": {
                "description": "What the person is trying to accomplish, in their words.",
                "type": "string"
              },
              "user_maturity": {
                "enum": ["first_use", "occasional", "habitual", "expert"],
                "type": "string"
              }
            },
            "required": ["objective"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:23cdb22e32931472700fe0d6318e5a69a9629c7ad4a7184a03adfbdef6df2135"
        }
      ],
      "digest": "sha256:1896aeb83a99917a28a05e642d5250001dc6900139fe3dddaa5da27ff1962db8"
    }
  }
}
