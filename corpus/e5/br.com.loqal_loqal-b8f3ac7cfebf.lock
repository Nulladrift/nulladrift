        },
        {
          "name": "estimate_job",
          "title": "Estimar o preço do caso",
          "description": "Estima quanto vai custar um serviço específico descrito pelo usuário (ex.: \"instalar ar split de 12 mil BTUs no 7º andar, sem infraestrutura, na Tijuca\"), separando mão de obra, material e deslocamento, com as premissas e o que falta para refinar. Usa o Índice de Preços Loqal e preços reais publicados por profissionais quando existem (base=indice_loqal|precos_reais); sem eles, é uma referência de mercado (base=ia). É estimativa, não orçamento. Antes de chamar, se faltar o detalhe que mais muda o preço (tamanho, quantidade, m², BTUs), pergunte ao usuário.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "details": {
                "description": "Respostas do usuário que mudam o preço, ex.: \"12.000 BTUs\", \"7º andar\"",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "need": {
                "description": "O caso com os detalhes do usuário",
                "minLength": 5,
                "type": "string"
              },
              "niche": {
                "description": "slug do tipo de profissional (search_services/list_categories); se omitido, a Loqal entende pelo texto",
                "type": "string"
              },
              "where": {
                "description": "Bairro e cidade, ou cidade e UF",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
