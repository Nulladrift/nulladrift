        {
          "name": "find_providers",
          "title": "Encontrar profissionais",
          "description": "Encontra profissionais reais perto de um lugar para uma necessidade. Ex.: need=\"instalar 3 ventiladores\", where=\"Tijuca, Rio de Janeiro\", min_rating=4.5, max_price_brl=350. Retorna perfis estruturados (nota, avaliações, distância, preço quando informado) e uma tela com cards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "emergency_24h": {
                "description": "Só quem atende 24 horas / emergência",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude (busca geolocalizada: use com lng quando o usuário compartilhar a localização)",
                "type": "number"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "type": "number"
              },
              "max_price_brl": {
                "description": "Mantém quem não informou preço (cobra por orçamento)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_rating": {
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "min_reviews": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "need": {
                "description": "O que o usuário precisa, com as palavras dele",
                "minLength": 2,
                "type": "string"
              },
              "niche": {
                "description": "Slug exato do tipo de profissional (de list_categories), ex.: \"motorista\", \"pedreiro\". Quando informado, vence a interpretação do texto.",
                "type": "string"
              },
              "radius_km": {
                "description": "Raio da busca em km a partir de lat/lng ou do lugar (padrão: 5 a 15 km conforme o lugar)",
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              },
              "service": {
                "description": "Subcategoria exata, a service_key de search_services (ex.: \"piscina/limpeza\"). Prioriza quem faz exatamente isso, sem esconder o resto do tipo.",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "distance", "rating"],
                "type": "string"
              },
              "where": {
                "description": "Bairro e/ou cidade, ex.: \"Tijuca, Rio de Janeiro\" ou \"Pinheiros SP\"",
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "loqal_page": {
                "type": ["string", "null"]
              },
              "providers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
