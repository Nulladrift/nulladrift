                      "type": "boolean"
                    },
                    "contact_available": {
                      "type": "boolean"
                    },
                    "contact_url": {
                      "type": ["string", "null"]
                    },
                    "demo": {
                      "type": "boolean"
                    },
                    "distance_km": {
                      "type": ["number", "null"]
                    },
                    "emergency_24h": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    },
                    "location": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "approximate": {
                              "type": "boolean"
                            },
                            "lat": {
                              "type": "number"
                            },
                            "lng": {
                              "type": "number"
                            }
                          },
                          "required": ["approximate", "lat", "lng"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "match": {
                      "additionalProperties": false,
                      "properties": {
                        "score": {
                          "type": "number"
                        },
                        "why": {
                          "additionalProperties": {
                            "type": "number"
                          },
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        }
                      },
                      "required": ["score", "why"],
                      "type": "object"
                    },
                    "plan": {
                      "anyOf": [
                        {
                          "enum": ["destaque", "impulso"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Plano pago do Loqal Pro que sobe a posição (Destaque ou Impulso); posição paga, mostre como tal"
                    },
                    "price_from_brl": {
                      "type": ["number", "null"]
                    },
                    "profile_url": {
                      "type": "string"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "rating": {
                      "type": ["number", "null"]
                    },
                    "rating_source": {
                      "anyOf": [
                        {
                          "enum": ["google", "loqal", "google+loqal"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "response_time_min": {
                      "type": ["number", "null"]
                    },
                    "reviews": {
                      "type": "number"
                    },
                    "service_area": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "services": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "top_review": {
                      "type": ["string", "null"]
                    },
                    "verified": {
                      "description": "Verificado Loqal: CNPJ ativo conferido na Receita Federal (telefone, cidade e nome ou ofício batem). Já vem primeiro no ranking.",
                      "type": "boolean"
                    }
                  },
                  "required": ["availability", "category", "city", "claimed", "contact_available", "contact_url", "demo", "distance_km", "emergency_24h", "id", "location", "match", "plan", "price_from_brl", "profile_url", "provider", "rating", "rating_source", "response_time_min", "reviews", "service_area", "services", "slug", "state", "top_review", "verified"],
                  "type": "object"
                },
                "type": "array"
              },
              "related_niches": {
                "description": "Presente quando o tipo pedido ainda não tem ninguém na região e a lista é de tipos afins",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              },
              "understood": {
                "additionalProperties": false,
                "properties": {
                  "confidence": {
                    "type": "number"
                  },
                  "niche": {
                    "type": ["string", "null"]
                  },
                  "place": {
                    "type": ["string", "null"]
                  },
                  "service": {
                    "type": ["string", "null"]
                  },
                  "urgent": {
                    "type": "boolean"
                  }
                },
                "required": ["confidence", "niche", "place", "service", "urgent"],
                "type": "object"
              }
            },
            "required": ["loqal_page", "providers", "total", "understood"],
            "type": "object"
          },
