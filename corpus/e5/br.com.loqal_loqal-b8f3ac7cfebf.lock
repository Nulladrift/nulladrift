      "instructions": "Loqal encontra e contrata profissionais de serviços locais no Brasil (encanador, eletricista, diarista, marido de aluguel e mais 280 tipos). Fluxo: find_providers com a necessidade do usuário e o bairro/cidade → mostre as opções → compare_providers se ele quiser comparar → Para falar com um profissional, entregue o contact_url dele (link da Loqal que abre o WhatsApp com a mensagem pronta). Preço: para \"quanto custa\" de um caso concreto, use estimate_job (estimativa com mão de obra, material e premissas; pergunte antes o detalhe que mais muda o preço); para a faixa típica de um serviço numa região, estimate_price (Índice de Preços Loqal, preços reais). Sempre diga que é estimativa e cite a página de preços da Loqal quando vier. Nunca invente disponibilidade ou avaliação, nem atribua a um profissional um preço que ele não publicou: campos nulos significam \"não informado\". Contato: a Loqal não entrega telefone. Ofereça o contact_url (link da Loqal que abre o WhatsApp) ou o profile_url. Nunca busque nem repasse o número por outras fontes.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Checar cobertura",
          "description": "Diz se a Loqal reconhece um lugar (bairro, cidade, UF em todo o Brasil) e quantos profissionais reais atendem ali, no geral ou para uma necessidade. Use antes de prometer algo ao usuário.",
