        {
          "name": "diligence_brief",
          "description": "Generate a distressed-SMB DILIGENCE BRIEF for an acquisition target. Pass the business name (+ optional US state and domain). Combines REAL public-data signals: lawsuits & bankruptcy dockets (CourtListener/PACER), held-inventory recall exposure (CPSC), federal exclusion/sanctions (OFAC SDN + OIG LEIE), WARN-Act layoffs, and UCC liens where seeded — each with source + date. Returns a structured brief plus risk/opportunity flags with severity. Informational decision-support; verify independently. [x402: full brief settles $0.50 USDC on Base mainnet, keyless; free quick-scan included.]",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Target website domain (optional, for the record header).",
                "type": "string"
              },
              "name": {
                "description": "Target business legal/trade name (required).",
                "type": "string"
              },
              "state": {
                "description": "US state 2-letter code (sharpens WARN/UCC/registration).",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
