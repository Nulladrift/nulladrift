        {
          "name": "ch11_feed",
          "description": "Fresh CHAPTER 11 FIREHOSE for the restructuring/creditor bar. Returns new business reorganization filings (newest-first) across the major bankruptcy venues, each with the debtor's-counsel firm + attorney, presiding judge, docket number, filing date and a CourtListener link. Args: days (lookback, default 14), court (optional CourtListener court id like deb/nysb/txsb). Public-docket decision-support for counsel; not legal advice, not a solicitation of the estate. [x402: full feed settles $0.50 USDC on Base mainnet, keyless; free header preview included.]",
          "inputSchema": {
            "properties": {
              "court": {
                "description": "Optional CourtListener court id (deb, nysb, txsb, njb, cacb, flsb…).",
                "type": "string"
              },
              "days": {
                "description": "Lookback window in days (default 14, max 60).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24c51c1b71b8357a5e0d16ba4fd1ed1da7263e6e570e05f4beccf061fa3ecb66"
        },
