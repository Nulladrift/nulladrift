        {
          "name": "check_certificate",
          "title": "Check a certificate of insurance",
          "description": "Checks a certificate of insurance (ACORD 25) against insurance requirements with CertifiKit's deterministic rules engine: coverage present, limits at or above the minimums, policies not expired or expiring too soon, and the required endorsements. Read the certificate yourself and pass what it shows; the verdict (pass, fail or needs_review) and a plain-English reason per requirement come from fixed rules, not a model. Anything unreported, unreadable or below 0.7 confidence is routed to needs_review, never silently passed. Use preset or the requirements object from build_insurance_requirements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "Date to check expiry against, yyyy-mm-dd. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "certificate": {
                "description": "What the certificate shows. Report only what is printed; do not infer. Leave out rows the certificate does not have.",
                "properties": {
                  "additionalInsured": {
                    "description": "Additional insured: from the ADDL INSD / SUBR WVD boxes, the description of operations, or an attached endorsement form.",
                    "properties": {
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "formNumber": {
                        "description": "Endorsement form number if printed, e.g. CG 20 10.",
                        "type": ["string", "null"]
                      },
                      "present": {
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  },
                  "autoLiability": {
                    "description": "The Automobile Liability row of the ACORD 25. Omit it if the certificate has no such row.",
                    "properties": {
                      "aggregate": {
                        "description": "General aggregate limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "eachOccurrence": {
                        "description": "Combined single limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "effectiveDate": {
                        "description": "Policy effective date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "expirationDate": {
                        "description": "Policy expiration date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "policyNumber": {
                        "type": ["string", "null"]
                      },
                      "present": {
                        "description": "true only if the row has a policy number or limits filled in.",
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  },
                  "certificateHolder": {
                    "type": ["string", "null"]
                  },
                  "generalLiability": {
                    "description": "The Commercial General Liability row of the ACORD 25. Omit it if the certificate has no such row.",
                    "properties": {
                      "aggregate": {
                        "description": "General aggregate limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "eachOccurrence": {
                        "description": "Each occurrence limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "effectiveDate": {
                        "description": "Policy effective date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "expirationDate": {
                        "description": "Policy expiration date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "policyNumber": {
                        "type": ["string", "null"]
                      },
                      "present": {
                        "description": "true only if the row has a policy number or limits filled in.",
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  },
                  "insuredName": {
                    "type": ["string", "null"]
                  },
                  "overallConfidence": {
                    "description": "How legible and complete the whole document was, 0-1. Defaults to 1. Below 0.7, a pass becomes needs_review.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "primaryNonContributory": {
                    "description": "Primary and non-contributory wording: from the ADDL INSD / SUBR WVD boxes, the description of operations, or an attached endorsement form.",
                    "properties": {
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "formNumber": {
                        "description": "Endorsement form number if printed, e.g. CG 20 10.",
                        "type": ["string", "null"]
                      },
                      "present": {
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  },
                  "producer": {
                    "description": "The issuing agent or broker.",
                    "type": ["string", "null"]
                  },
                  "umbrella": {
                    "description": "The Umbrella / Excess Liability row of the ACORD 25. Omit it if the certificate has no such row.",
                    "properties": {
                      "aggregate": {
                        "description": "General aggregate limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "eachOccurrence": {
                        "description": "Each occurrence limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "effectiveDate": {
                        "description": "Policy effective date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "expirationDate": {
                        "description": "Policy expiration date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "policyNumber": {
                        "type": ["string", "null"]
                      },
                      "present": {
                        "description": "true only if the row has a policy number or limits filled in.",
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  },
                  "waiverOfSubrogation": {
                    "description": "Waiver of subrogation: from the ADDL INSD / SUBR WVD boxes, the description of operations, or an attached endorsement form.",
                    "properties": {
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "formNumber": {
                        "description": "Endorsement form number if printed, e.g. CG 20 10.",
                        "type": ["string", "null"]
                      },
                      "present": {
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  },
                  "workersComp": {
                    "description": "The Workers' Compensation and Employers' Liability row of the ACORD 25. Omit it if the certificate has no such row.",
                    "properties": {
                      "aggregate": {
                        "description": "General aggregate limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "confidence": {
                        "description": "How sure you are of this row, 0-1. Defaults to 1. Set it below 0.7 if the row was hard to read, so it is routed to needs_review instead of pass or fail.",
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "eachOccurrence": {
                        "description": "Employers' liability each accident limit in whole dollars as printed (1000000 for $1,000,000). null if blank or unreadable.",
                        "minimum": 0,
                        "type": ["number", "null"]
                      },
                      "effectiveDate": {
                        "description": "Policy effective date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "expirationDate": {
                        "description": "Policy expiration date, yyyy-mm-dd. null if blank or unreadable.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": ["string", "null"]
                      },
                      "policyNumber": {
                        "type": ["string", "null"]
                      },
                      "present": {
                        "description": "true only if the row has a policy number or limits filled in.",
                        "type": "boolean"
                      }
                    },
                    "required": ["present"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "preset": {
                "description": "\"standard-subcontractor\" = Typical GC requirements for a trade sub: GL $1M/$2M, auto $1M, workers' comp $1M, additional insured + waiver of subrogation. \"property-vendor\" = Common requirements for service vendors at managed properties: GL $1M/$2M, workers' comp $500K, additional insured.",
                "enum": ["standard-subcontractor", "property-vendor"],
                "type": "string"
              },
              "requirements": {
                "description": "Custom requirements, e.g. the requirements object returned by build_insurance_requirements. Takes precedence over preset.",
                "properties": {
                  "autoLiability": {
                    "properties": {
                      "minAggregate": {
                        "exclusiveMinimum": 0,
