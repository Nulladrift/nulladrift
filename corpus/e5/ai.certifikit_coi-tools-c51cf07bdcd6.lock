      "serverInfo": {
        "name": "certifikit",
        "title": "CertifiKit COI tools",
        "version": "1.0.0",
        "websiteUrl": "https://certifikit.ai/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CertifiKit certificate of insurance (COI) tools for contractors, property managers and HOAs. build_insurance_requirements recommends the limits and endorsements to require of a subcontractor or vendor and writes the contract exhibit. check_certificate checks an ACORD 25 against those requirements: you read the certificate and pass its values, and a deterministic rules engine returns pass, fail or needs_review with a reason per requirement. find_coi_guides links plain-English guides to cite. Decision support, not insurance or legal advice.",
      "tools": [
        {
          "name": "build_insurance_requirements",
          "title": "Build contract insurance requirements",
          "description": "Recommends the insurance a general contractor should require of a subcontractor, or a property manager or HOA of a vendor: general liability, auto, umbrella and workers' comp limits, additional insured, waiver of subrogation and primary/non-contributory wording, scaled to the trade's risk and the contract size. Returns the reasoning for each limit, contract-ready exhibit text, and a requirements object that check_certificate accepts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cancellationNoticeDays": {
                "default": 30,
                "description": "Days of written notice before cancellation. 0 = as the policy provides.",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "context": {
                "description": "\"gc\" = a contractor hiring a subcontractor; \"property\" = a property manager or HOA hiring a service vendor.",
                "enum": ["gc", "property"],
                "type": "string"
              },
              "contractSize": {
                "description": "Contract value band. For \"gc\": under-50k, 50k-250k, 250k-1m, over-1m. For \"property\": under-10k, 10k-50k, 50k-250k, over-250k. A band from the other context is mapped to the smallest valid one.",
                "enum": ["under-50k", "50k-250k", "250k-1m", "over-1m", "under-10k", "10k-50k", "over-250k"],
                "type": "string"
              },
              "hasEmployees": {
                "default": true,
                "description": "false for a sole proprietor with no employees: workers' comp is replaced by a signed exemption declaration.",
                "type": "boolean"
              },
              "overrides": {
                "additionalProperties": false,
                "description": "Optional dollar limits that replace the recommended ones, for lines that are already required.",
                "properties": {
                  "autoEachOccurrence": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "glAggregate": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "glEachOccurrence": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "umbrellaEachOccurrence": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "wcEachOccurrence": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "trade": {
                "description": "The vendor's trade, and the contexts it is offered in: \"general\" = General / multi-trade (gc); \"carpentry\" = Carpentry / framing (gc); \"concrete\" = Concrete / masonry (gc); \"drywall\" = Drywall / plaster (gc); \"painting\" = Painting / finishes (gc/property); \"electrical\" = Electrical (gc/property); \"mechanical\" = Plumbing / HVAC (gc/property); \"glazing\" = Glazing / curtain wall (gc); \"roofing\" = Roofing (gc/property); \"demolition\" = Demolition (gc); \"steel\" = Structural steel / crane work (gc); \"excavation\" = Excavation / earthwork (gc); \"scaffolding\" = Scaffolding / shoring (gc); \"abatement\" = Asbestos / lead abatement (gc); \"designbuild\" = Design-build / engineering (gc); \"landscaping\" = Landscaping / grounds (property/gc); \"janitorial\" = Janitorial / cleaning (property); \"pool\" = Pool maintenance (property); \"pest\" = Pest control (property); \"snow\" = Snow & ice removal (property); \"tree\" = Tree removal / arborist (property); \"elevator\" = Elevator maintenance (property); \"security\" = Security services (property); \"pm\" = Property management services (property).",
                "enum": ["general", "carpentry", "concrete", "drywall", "painting", "electrical", "mechanical", "glazing", "roofing", "demolition", "steel", "excavation", "scaffolding", "abatement", "designbuild", "landscaping", "janitorial", "pool", "pest", "snow", "tree", "elevator", "security", "pm"],
                "type": "string"
              },
              "usesVehicles": {
                "default": true,
                "description": "Drives to or around the site. false drops commercial auto.",
                "type": "boolean"
              }
            },
            "required": ["context", "contractSize", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build contract insurance requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9423149b2cbe171d1fb43a6628474ddd91ea326a7dc9756f102d4367f9bbb82"
