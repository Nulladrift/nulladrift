        {
          "name": "marketsummary__ask_market",
          "description": "[marketsummary] Ask a market question in natural language; the answer is written only from Tachyo's recap items.\n\n question: plain text, at most 500 characters (longer returns error \"question too long\").\n lang: en / pl (anything else is answered in en). The answer draws on up to 40 recap/digest items\n from the last 7 days, ranked by overlap with the question's words (the most recent items when\n nothing overlaps). It has no on-chain wallet lookups and never covers anyone's positions or our\n own track record. `as_of` is the timestamp of the newest item used. Free returns a connect-CTA.\n Unlock a grounded answer via session_token (from verify_wallet_ownership) OR an x402 `payment`\n proof. When synthesis is unavailable, `answer` is null, `relevant` lists the top headlines and\n the call is not charged.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "title": "Lang",
                "type": "string"
              },
              "payment": {
