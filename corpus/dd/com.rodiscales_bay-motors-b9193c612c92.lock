{
  "lockfileVersion": 2,
  "subjects": {
    "com.rodiscales/bay-motors": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agents.rodiscales.com/bay-motors/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-front-door/bay-motors",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_availability",
          "description": "Open drop-off windows for the next N days from the shop booking policy. Not a live calendar; the shop confirms every request. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days ahead to list, 1 to 14",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:baa8b8d25280e344d8caadf3100d91ccd7a04969bc1573182d60d60b8e18bc41"
        },
        {
          "name": "get_shop",
          "description": "Shop profile: name, address, phone, hours, what it works on, what it does not, booking policy, and who verified the listing. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6092d0601701b86836680a39e888667898ad167482cd03a6d2443a9512edb266"
        },
        {
          "name": "get_status",
          "description": "Status of a quote or booking request by reference: requested, confirmed or declined. Returns no contact data. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "The reference returned by request_quote or request_booking",
                "maxLength": 20,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c549de9d70a4f0659a47a421103824fc3e4d0c2846fa7673445e574e5e249eae"
        },
        {
          "name": "list_services",
          "description": "Services the shop offers in plain language, with exclusions. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d6352be9d2be8d41bded99f954014d8e16ea6beb09b96d29635848ee73c5334"
        },
        {
          "name": "request_booking",
          "description": "Request a drop-off appointment. Creates a booking request the shop confirms or declines; returns a reference and status \"requested\". No payment, no OTP; the shop calls or texts the contact to confirm.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact_name": {
                "description": "Name of the person the shop should call",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Phone number the shop may call or text, digits with optional +, spaces, dashes",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "reason": {
                "description": "Why the car is coming in",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "vehicle": {
                "description": "The vehicle the request is about. Optional for a quote, required for a booking.",
                "properties": {
                  "make": {
                    "description": "Make, e.g. Toyota",
                    "maxLength": 30,
                    "minLength": 1,
                    "type": "string"
                  },
                  "model": {
                    "description": "Model, e.g. Camry",
                    "maxLength": 30,
                    "minLength": 1,
                    "type": "string"
                  },
                  "year": {
                    "description": "Model year, e.g. 2016",
                    "maximum": 2100,
                    "minimum": 1950,
                    "type": "integer"
                  }
                },
                "required": ["make", "model", "year"],
                "type": "object"
              },
              "window": {
                "description": "A date and window exactly as get_availability lists them, joined by one space, e.g. 2026-10-14 8:00-11:00",
                "maxLength": 40,
                "minLength": 14,
                "pattern": "^\\d{4}-\\d{2}-\\d{2} \\d{1,2}:\\d{2}-\\d{1,2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["contact_name", "phone", "reason", "vehicle", "window"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0879b0708eb22dcfedaf2ca9b7ac2c97e349c13dedf1702fed2f30e3e273529"
        },
        {
          "name": "request_quote",
          "description": "Ask the shop for a quote. Creates a request the shop answers by phone or text; returns a reference and status \"requested\". The shop confirms estimates directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact_name": {
                "description": "Name of the person the shop should call",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Phone number the shop may call or text, digits with optional +, spaces, dashes",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "symptoms": {
                "description": "What the car is doing, in the customer's words",
                "maxLength": 600,
                "minLength": 3,
                "type": "string"
              },
              "vehicle": {
                "description": "The vehicle the request is about. Optional for a quote, required for a booking.",
                "properties": {
                  "make": {
                    "description": "Make, e.g. Toyota",
                    "maxLength": 30,
                    "minLength": 1,
                    "type": "string"
                  },
                  "model": {
                    "description": "Model, e.g. Camry",
                    "maxLength": 30,
                    "minLength": 1,
                    "type": "string"
                  },
                  "year": {
                    "description": "Model year, e.g. 2016",
                    "maximum": 2100,
                    "minimum": 1950,
                    "type": "integer"
                  }
                },
                "required": ["make", "model", "year"],
                "type": "object"
              }
            },
            "required": ["contact_name", "phone", "symptoms"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63c2aaa59a79e12ceabdba6d71483e0dd21103c12f677873cd1faedc38bbbc1f"
        }
      ],
      "digest": "sha256:8cf56ff8047f6da9be89cd73d5d3a26ddce5dd87fe9c4b2d7458ad518aed3d38"
    }
  }
}
