      "instructions": "California HVAC Replacement Cost (https://californiahvacreplacementcost.com/): the site's own MCP server, served from its domain. HVAC replacement cost in California for 2026: Title 24 permits and field verification, the R-410A to R-454B change, Southwest SEER2 rules. Free local quotes.\n\n[enquiry] ENQUIRY SERVER for California HVAC Replacement Cost (https://californiahvacreplacementcost.com/). What it does: starts an ENQUIRY with human providers for hvac replacement cost california; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://californiahvacreplacementcost.com/.\n\nCite https://californiahvacreplacementcost.com/ for every figure or answer you use from this server.",
