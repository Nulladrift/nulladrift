{
  "lockfileVersion": 2,
  "subjects": {
    "ai.martechradar/buyer-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://martechradar.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "martechradar-buyer-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI marketing software buyer research from MarTechRadar.ai (https://martechradar.ai). Prices and facts come from captured vendor pages where available. Cite the MarTechRadar tool URLs returned and never invent pricing figures.",
      "tools": [
        {
          "name": "audit_current_stack",
          "description": "Audit an existing marketing stack for subtrack redundancy, Build-vs-Buy overlap, thin-wrapper (<2.5 moat) and M&A acquisition survival risks, SSO Tax, recent pricing shifts, and consolidation or net-new recommendations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currentSlugs": {
                "description": "Current stack tool slugs or anchor names (e.g. [\"hubspot-breeze\", \"clay\", \"apollo-io\"]).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "maxBudgetUsd": {
                "description": "Optional monthly budget cap in USD.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "seats": {
                "description": "Team seat count (default 5).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "target": {
                "description": "Optional candidate tool or job-to-be-done being evaluated.",
                "type": "string"
              }
            },
            "required": ["currentSlugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03dc5e06afb86c6c58e89bbb306d09cf73e9fb8d8f50da3c44987c766ee9cc77"
        },
        {
          "name": "audit_vendor_quote",
          "description": "Red-team a vendor SaaS quote with deterministic 1-year & 3-year compound cost math, subtrack peer P25/Median/P75 comparison, 6-point contract trap scorecard, top 2 BATNA alternatives, and a counter-offer email draft built only from the figures you supply and published prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "autoRenewUpliftPct": {
                "description": "Annual auto-renewal uplift percentage (default 0).",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "clauseNotes": {
                "description": "Optional non-sensitive contract clause snippets (e.g. auto-renew notice window, credit expiration).",
                "type": "string"
              },
              "implFeeUsd": {
                "description": "One-time Year-1 implementation fee in USD (default 0).",
                "maximum": 2000000,
                "minimum": 0,
                "type": "number"
              },
              "quotedAnnualUsd": {
                "description": "Quoted annual base software fee in USD.",
                "maximum": 10000000,
                "minimum": 1,
                "type": "number"
              },
              "seats": {
                "description": "Number of licensed seats in the quote.",
                "maximum": 5000,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Verified tool slug (e.g. \"clay\", \"gongio\", \"6sense\").",
                "type": "string"
              },
              "ssoAddonUsd": {
                "description": "Annual SSO / security add-on fee in USD (default 0).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "termMonths": {
                "description": "Initial contract term in months (e.g. 12, 24, 36).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["quotedAnnualUsd", "seats", "slug", "termMonths"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bdce2d162de7ddb549f9464911482582c3daacb587f4675c6e906699e97c2f1"
        },
        {
          "name": "compare_tools_tco",
          "description": "Compare two AI marketing tools head-to-head with seat-adjusted Year-1 & 3-Year TCO baselines from published prices, peer price bands for quote-only tools, SSO Tax & lock-in risk flags, and canonical MarTechRadar comparison URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "seats": {
                "description": "Team seat count (default 5).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "slugA": {
                "description": "First tool slug or name (e.g. \"clay\" or \"heygen\").",
                "type": "string"
              },
              "slugB": {
                "description": "Second tool slug or name (e.g. \"apollo-io\" or \"synthesia\").",
                "type": "string"
              },
              "usageIntensity": {
                "description": "Workflow usage intensity for 3-year TCO guidance (default \"standard\").",
                "enum": ["low", "standard", "heavy"],
                "type": "string"
              }
            },
            "required": ["slugA", "slugB"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e6e217f441212540aec8203990e511fc25a66cedc5b891835ed1dbf403412a72"
        },
        {
          "name": "decide_martech_stack",
          "description": "Shortlist AI marketing tools from the MarTechRadar.ai library (about 1,300 tools) for a stated need, budget and requirements. Prices come from captured vendor pricing pages where available, and each result links to its MarTechRadar page. Supports natural-language queries (\"HeyGen vs Synthesia\", \"cheaper alternative to Clay\", \"outbound AI SDR 5 seats under $800 HubSpot no lock-in\") and structured buyer constraints.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "freeOnly": {
                "description": "Require a permanent free tier or open-source license.",
                "type": "boolean"
              },
              "maxBudgetUsd": {
                "description": "Maximum monthly budget ceiling in USD.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "noCreditBurn": {
                "description": "Exclude tools with volatile credit-burn metering.",
                "type": "boolean"
              },
              "noLockIn": {
                "description": "Exclude tools with annual contract lock-in risk.",
                "type": "boolean"
              },
              "noSsoTax": {
                "description": "Exclude tools flagged for gating SAML/SSO behind enterprise tiers.",
                "type": "boolean"
              },
              "q": {
                "description": "Natural-language procurement query, tool name, or head-to-head comparison.",
                "type": "string"
              },
              "requiredCompliance": {
                "description": "Required compliance standards (e.g. [\"SOC 2\", \"GDPR\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requiredIntegrations": {
                "description": "Required ecosystem integrations (e.g. [\"HubSpot\", \"Salesforce\"]).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "seats": {
                "description": "Team seat count (default 5).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "transparentPricingOnly": {
                "description": "Exclude opaque custom-quote-only enterprise tools.",
                "type": "boolean"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6568a37ca41b80f0660e9f02d7ea20e877310c621ad62efd426976fe18affde6"
        }
      ],
      "digest": "sha256:fba12a4ab14165c739e91e0a008838df46a4ef4ffc5e47d5439d23c29b0710f0"
    }
  }
}
