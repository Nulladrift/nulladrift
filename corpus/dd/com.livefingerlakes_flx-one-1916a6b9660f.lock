        },
        {
          "name": "open_now",
          "title": "What is open",
          "description": "Places open at a given moment (default now, America/New_York) in a town or category, judged only from posted hours. Verified hours are listed first. Places with unknown hours are returned separately with call_to_confirm=true and are never counted as open.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "eat_drink",
                "description": "Type or category: restaurant, eat_drink, bar, winery, brewery, cidery, distillery, lodging, shopping, park, trail, museum, attraction, service, health, civic, church, or a category word such as \"pizza\" or \"bakery\"",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "\"now\", \"HH:MM\" today (Eastern), or ISO 8601 such as 2026-11-20T18:30",
                "type": "string"
              },
              "town": {
                "description": "Town or county, e.g. \"Hornell\", \"Watkins Glen\", \"Steuben County\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
