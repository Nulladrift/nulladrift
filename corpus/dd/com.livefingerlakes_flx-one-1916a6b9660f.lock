        },
        {
          "name": "search_places",
          "title": "Search places",
          "description": "Search verified places in the Finger Lakes and Southern Tier of New York (restaurants, bars, wineries, breweries, shops, lodging, parks, trails, services, civic offices). Each result has source_url, verified_date, hours with their verification status, open_now, and a call_to_confirm flag. Unknown hours are never treated as open.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Type or category: restaurant, eat_drink, bar, winery, brewery, cidery, distillery, lodging, shopping, park, trail, museum, attraction, service, health, civic, church, or a category word such as \"pizza\" or \"bakery\"",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "open_now": {
                "description": "Only places whose posted hours show them open right now (America/New_York)",
                "type": "boolean"
              },
              "query": {
                "description": "Name or words, e.g. \"pizza\", \"Sixty Six\", \"waterfall\"",
                "type": "string"
              },
              "town": {
                "description": "Town or county, e.g. \"Hornell\", \"Watkins Glen\", \"Steuben County\"",
                "type": "string"
              }
            },
            "type": "object"
          },
