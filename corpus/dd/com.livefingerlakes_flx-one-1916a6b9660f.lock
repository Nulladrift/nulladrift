          },
          "digest": "sha256:7b753b35a51429be413320e206e699aa4e4d1a962125719ff2cd11581c8b323a"
        },
        {
          "name": "events",
          "title": "Events",
          "description": "Reviewed upcoming events (America/New_York times), each with the organizer's official page as source_url. Filter by town, date range and words.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "YYYY-MM-DD, default today",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "town": {
                "description": "Town or county, e.g. \"Hornell\", \"Watkins Glen\", \"Steuben County\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d9e4241ab273fc36dff29a805689ad9b572d43ee57c2d0df2b395beeb806027"
        },
        {
          "name": "get_beverage_places",
          "title": "Get breweries, wineries, cideries and distilleries",
          "description": "Search manufacturer listings compiled from the New York State Liquor Authority public active-license dataset (data.ny.gov 9s3h-dpkz) for counties from Broome west through Erie and Niagara, including the Finger Lakes and Southern Tier. Hours, websites, taps and food are included only when a separate public source or a claimed listing has them. Independent compilation, not a government site.",
          "inputSchema": {
            "properties": {
              "county": {
                "type": "string"
              },
              "lat": {
                "description": "Latitude for near-me filtering",
                "type": "number"
              },
              "lon": {
                "description": "Longitude for near-me filtering",
                "type": "number"
              },
              "open_now": {
                "description": "If true, only places with verified hours that are open at this moment in America/New_York. Places with unknown hours are omitted, never treated as open.",
                "type": "boolean"
              },
              "q": {
                "description": "Name or address text",
                "type": "string"
              },
              "radius": {
                "description": "Radius in miles (default 25)",
                "type": "number"
              },
              "town": {
                "type": "string"
              },
              "type": {
                "description": "brewery, winery, cidery, distillery, or meadery",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2845418a8a035a1c78a2c18feb59f724bd122fc64e255ee2c31017994485f23"
        },
        {
          "name": "get_indicators",
          "title": "Get regional indicators",
          "description": "Cited regional statistics for Finger Lakes and Southern Tier counties (Steuben, Yates, Schuyler, Ontario, Seneca) and for Hornell, Canisteo, Hammondsport, Bath, Penn Yan, Corning, Watkins Glen, Geneva and Canandaigua: ACS population, income, housing, rent and broadband subscription; NYS DOL LAUS unemployment (counties); NYSED school enrollment (municipal districts); and Tourism Economics / ESD visitor and lodging spending (counties). Every figure includes a source URL and a checked date. This is an independent compilation, not an official government dataset.",
          "inputSchema": {
            "properties": {
              "geo": {
                "description": "County or municipality name or slug, e.g. \"Steuben County\", \"hornell\"",
                "type": "string"
              },
              "indicator": {
                "description": "Optional series id, e.g. unemployment_rate, median_gross_rent, visitor_spending, school_enrollment_k12, broadband_subscription_share, population, median_household_income",
                "type": "string"
              },
              "kind": {
                "description": "county or place",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c19fc3d359e05bf8cd37bea7fa5def9e5030fa9ce2707f9f296db9e336f034c"
        },
        {
          "name": "get_place",
          "title": "Get one place",
          "description": "One verified place by id, slug or name (fuzzy name matching, aliases and former names included), with hours, open_now, source_url, verified_date, call_to_confirm and the owner claim link. Returns found=false rather than guessing.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              },
              "name": {
                "description": "e.g. \"Sixty Six on Broadway\"",
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "town": {
                "description": "Town or county, e.g. \"Hornell\", \"Watkins Glen\", \"Steuben County\"",
                "type": "string"
              }
            },
            "type": "object"
          },
