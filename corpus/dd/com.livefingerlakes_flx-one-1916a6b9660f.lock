      },
      "transport": {
        "type": "http",
        "url": "https://livefingerlakes.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.livefingerlakes/flx-one",
        "title": "FLX ONE agent gateway: Finger Lakes and Southern Tier (beta)",
        "version": "1.1.0",
        "websiteUrl": "https://livefingerlakes.com/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only, verified local data for the Finger Lakes and Southern Tier of New York from Finger Lakes Living, an independent guide (not an official tourism or government source). Cite source_url for facts. When call_to_confirm is true, tell the user to call or check the source before going. Never present unknown hours as open. Times are America/New_York. Credit \"Finger Lakes Living (CC BY 4.0)\". Docs: https://livefingerlakes.com/developers/",
      "tools": [
        {
          "name": "ask",
          "title": "Ask FLX ONE",
          "description": "Plain-language question about the region (what is open tonight, events this weekend, where to eat, local services, moving here). The answer is built only from verified records and guide pages, with every source linked, and says so when the data does not cover it. 15 questions a minute and 300 a day per IP.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "Up to 300 characters, e.g. \"Who's open for dinner tonight in Hornell?\"",
                "type": "string"
              },
              "town": {
                "description": "Town or county, e.g. \"Hornell\", \"Watkins Glen\", \"Steuben County\"",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db68ce81051d7631116f87b89cc74805b4ff1417e200c2a525ca1c31e2cc28d4"
        },
        {
          "name": "conditions",
          "title": "Lake conditions",
          "description": "Current USGS lake-level and water readings for Finger Lakes gauges that are reporting (provisional), with official links for lakes that are not.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
