        },
        {
          "name": "get_town",
          "title": "Get town",
          "description": "One town: guide link, official site, coordinates, its verified places, and upcoming reviewed events.",
          "inputSchema": {
            "properties": {
              "town": {
                "description": "Town name or slug",
                "type": "string"
              }
            },
            "required": ["town"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
