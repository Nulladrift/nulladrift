        {
          "name": "submit_page",
          "title": "Submit one page",
          "description": "Save one page you wrote (page 1: the file with Section0 and the shared design; page N: only its Section), with its direction (one sentence: the thing, the motion that acts out the claim, one craft detail). A page is accepted only after its brief was handed to you. The reply carries the next page's brief; when every page is saved the deck is merged, checked and rendered and the reply carries the rendered pages. To rewrite one page of a finished design, submit just that page: it replaces that page only, and everything else stays as it is, the person's own edits included. To change part of a page, read_page and edit_page are lighter.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deck_id": {
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "direction": {
                "description": "This page's direction in one sentence — the thing, the motion that acts out the claim, one craft detail. It goes into the page as its // Direction: line.",
                "maxLength": 400,
                "minLength": 15,
                "type": "string"
              },
              "label": {
                "description": "Who wrote it, e.g. 'claude-code'. Shown in the deck's trace.",
                "maxLength": 40,
                "type": "string"
              },
              "next_brief": {
                "description": "Default true: the reply carries the next page's brief. A helper writing just one page sends false.",
