{
  "lockfileVersion": 2,
  "subjects": {
    "com.renderball/renderball": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://renderball.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "renderball",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Renderball turns a deck you write into a designed, animated, editable presentation the user can finish in the Renderball editor and share. Write it the way the studio's own writer does, ONE PAGE AT A TIME: (1) create_deck with the user's brief, the brand (if you can open the brand's website, read its real colours and fonts there and declare them; always give the website; never invent a colour) AND your outline, one entry per page — the reply carries PAGE 1'S BRIEF with example pages chosen for it. (2) Study the examples, follow THE STUDIO'S METHOD, write page 1 (the file with Section0 and the deck's whole design system) and send it with submit_page with its direction (one sentence: the thing, the motion that acts out the claim, one craft detail). (3) Each submit_page reply carries the next page's brief and its examples: do the same for every page, with your full attention on each; a page is accepted only after its brief was handed to you. Where you can run helpers in parallel, a helper gets its page's full brief with get_page_brief and sends next_brief false. (4) When the last page is saved the deck is merged, checked and rendered: the reply carries the RENDERED PAGES as images and fix_these when our checks found something. Fix every item, and look at every page for overlapping or clipped text, odd spacing, an element off its page, or a picture that does not say the page's claim; resubmit just the pages you change with submit_page. (5) Give the user the editor link (editor_url). submit_deck takes a whole file only to replace a deck whose pages are all written. Every call needs the user's Renderball API key (Authorization: Bearer rb_live_…); without one, the reply says how the user gets one: tell them. Never invent facts, figures or quotes: the deck's truth check flags anything not in the brief. Ask the user for missing numbers instead of guessing.",
      "tools": [
        {
          "name": "create_deck",
          "title": "Create a deck",
          "description": "Start a new presentation from a brief, the brand and your outline. The brand: if you can open the brand's website, read its real colours and fonts there first and declare them — the lead colour is usually the main buttons and the large coloured areas, not the link colour — and always give the website; never invent a colour. With the outline the reply carries PAGE 1'S BRIEF; write page 1 and send it with submit_page — each reply carries the next page's brief.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "The brand as YOU know it: name, and only the colours, fonts and logo you actually have. Never guess a colour; leave it out.",
                "properties": {
                  "accent": {
                    "description": "The lead brand colour (usually the main buttons and the large coloured areas, not the links), only if you know it from the user, their material or their site. Never invent one.",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "background": {
                    "description": "The page background colour, only if known.",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "fonts": {
                    "properties": {
                      "body": {
                        "description": "Body font family name, only if known.",
                        "maxLength": 60,
                        "type": "string"
                      },
                      "headline": {
                        "description": "Headline font family name, only if known.",
                        "maxLength": 60,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "logo_url": {
                    "description": "A public https image of the logo (SVG or PNG), only if you have a real one.",
                    "format": "uri",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "name": {
                    "description": "The brand's name as it should appear.",
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "text": {
                    "description": "The main text colour, only if known.",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "voice": {
                    "description": "How the brand speaks, in a sentence or two.",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "website": {
                    "description": "Their website, e.g. yourcompany.com. With an account, when you declare no colours, Renderball reads the site for its colours, fonts and logo — so give the website and leave colours you do not know out.",
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "brand_url": {
                "description": "Key holders only: a website Renderball reads for colours, fonts and logo when no brand is declared.",
                "maxLength": 300,
                "type": "string"
              },
              "brief": {
                "description": "What the deck is for, who it is for, what it should argue and ask. Real facts only; the truth check refuses invented figures.",
                "maxLength": 6000,
                "minLength": 20,
                "type": "string"
              },
              "outline": {
                "description": "Your page-by-page outline (one entry per page: label, description, visual_concept, content with a headline). Send it here and the reply carries the brief to write from (page 1's brief when the deck is written page by page) — one call instead of create_deck + write_outline.",
                "properties": {
                  "pages": {
                    "items": {
                      "properties": {
                        "content": {
                          "description": "The approved copy. Every numeral here must come from the user's material — the deck's truth check enforces it.",
                          "properties": {
                            "bullets": {
                              "description": "Up to 6 short points; no walls.",
                              "items": {
                                "maxLength": 160,
                                "type": "string"
                              },
                              "maxItems": 6,
                              "type": "array"
                            },
                            "caption": {
                              "description": "Small mono caption, e.g. a source line.",
                              "maxLength": 200,
                              "type": "string"
                            },
                            "cta": {
                              "properties": {
                                "primary": {
                                  "maxLength": 60,
                                  "type": "string"
                                },
                                "secondary": {
                                  "maxLength": 80,
                                  "type": "string"
                                }
                              },
                              "required": ["primary"],
                              "type": "object"
                            },
                            "eyebrow": {
                              "description": "Tiny label above the headline, e.g. 'THE PROBLEM'.",
                              "maxLength": 60,
                              "type": "string"
                            },
                            "headline": {
                              "description": "The one strong display line.",
                              "maxLength": 120,
                              "minLength": 1,
                              "type": "string"
                            },
                            "lede": {
                              "description": "Supporting sentence or two.",
                              "maxLength": 400,
                              "type": "string"
                            },
                            "meta": {
                              "description": "Stat tiles as label/value pairs — ONLY figures the user gave you.",
                              "items": {
                                "properties": {
                                  "label": {
                                    "maxLength": 60,
                                    "type": "string"
                                  },
                                  "value": {
                                    "maxLength": 60,
                                    "type": "string"
                                  }
                                },
                                "required": ["label", "value"],
                                "type": "object"
                              },
                              "maxItems": 6,
                              "type": "array"
                            }
                          },
                          "required": ["headline"],
                          "type": "object"
                        },
                        "description": {
                          "description": "What this page must accomplish in the argument, one or two sentences. Not shown on the page.",
                          "maxLength": 600,
                          "minLength": 1,
                          "type": "string"
                        },
                        "label": {
                          "description": "Short page title, 2-6 words (e.g. 'The Tracker Tax').",
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        "visual_concept": {
                          "description": "The composition and the one graphic device that expresses the page's argument: layout, the diagram/chart/mock, where the headline sits, colours by role. Concrete enough to draw from.",
                          "maxLength": 1200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["content", "description", "label", "visual_concept"],
                      "type": "object"
                    },
                    "maxItems": 16,
                    "minItems": 1,
                    "type": "array"
                  },
                  "tone": {
                    "description": "The register, e.g. 'confident, technical, CTO-to-CTO'.",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "required": ["pages"],
                "type": "object"
              },
              "pages": {
                "description": "How many pages you intend to write (default 5). Ignored when `outline` is given.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "size": {
                "description": "The page size, any you need: \"wide\" 1920×1080 (slides, the default), \"square\" 1080×1080 (a post), \"vertical\" 1080×1920 (a story, a poster, a menu), or any width × height in px written \"1200x628\" (each side 100 to 4096): a link card 1200x628, a portrait post 1080x1350, an A4-shaped page 1240x1754, a banner 1500x500. Pick the size the person asked for: never draw a page turned sideways to fake another size.",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
