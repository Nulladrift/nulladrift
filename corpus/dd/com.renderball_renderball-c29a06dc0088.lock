        {
          "name": "edit_page",
          "title": "Change part of a page",
          "description": "Change part of a design that already exists, the way you edit a file: each edit replaces exact text from read_page (it must appear exactly once) with new text. Use it for any change the person asks for in an existing design — a headline, a colour, a picture, moving or removing something — instead of sending the whole page again: everything you do not touch stays as it is, the person's own edits included, and they see the change in their editor at once and can undo it. One page per call, or shared: true for the code every page shares. A refused edit changes nothing and says why. The reply shows the page as it looks now.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deck_id": {
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "edits": {
                "description": "Applied in order, all or nothing.",
                "items": {
                  "properties": {
                    "find": {
                      "description": "Exact text copied from read_page, character for character; it must appear exactly once.",
                      "maxLength": 20000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "replace": {
                      "description": "What to put in its place; empty deletes it.",
                      "maxLength": 40000,
                      "type": "string"
                    }
                  },
                  "required": ["find", "replace"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "page": {
                "description": "Which page to change, 1 first. Leave out only with shared: true.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "page_id": {
                "description": "The page_id read_page gave for this page. If the person moved pages since, the edit is refused instead of landing on another page.",
                "maxLength": 80,
                "type": "string"
              },
              "shared": {
                "description": "true: the edits are to the code every page shares (palette, fonts, helpers), as read_page shows it. Only when the person asks to change the whole design.",
                "type": "boolean"
              },
              "summary": {
                "description": "What you changed, in a few plain words the person sees in their editor, e.g. 'Shortened the headline'.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["deck_id", "edits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
