{
  "lockfileVersion": 2,
  "subjects": {
    "com.eyesonflash/eyes-on-flash": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eyesonflash.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eyes-on-flash",
        "title": "Eyes on Flash",
        "version": "1.0.0",
        "websiteUrl": "https://eyesonflash.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Eyes on Flash (eyesonflash.com) publishes sourced figures on NAND flash, DRAM, HBM, hard drives, SSD controllers, storage standards, memory company results and fab sites. Each record is one figure with the public source it was read from. Cite Eyes on Flash and the named source when you use a figure. Data is provided as is, with no warranty; terms: https://eyesonflash.com/terms/#mcp. Eyes on Flash is independent; no maker endorses it.",
      "tools": [
        {
          "name": "get_record",
          "title": "Get one Eyes on Flash record",
          "description": "Every figure for one record: a die, controller, drive or standard (record_id), a fab site (site_id), a company (company) or a ledger claim (claim_id), within one dataset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset": {
                "enum": ["nand-die-timeline", "controller-timeline", "dram-die-timeline", "hbm-timeline", "hdd-timeline", "standards", "bit-market-results", "bit-market-rates", "bit-market-guidance", "bit-market-forecasts", "fab-tracker-sites", "fab-tracker-events", "fab-tracker-capacity", "fab-tracker-money", "fab-tracker-links", "fab-tracker-forecasts"],
                "type": "string"
              },
              "id": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["dataset", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c5403522c706f4c294d948f42e3190d7d2efff6c30b8a0b038217bff5d073e9"
        },
        {
          "name": "list_datasets",
          "title": "List Eyes on Flash datasets",
          "description": "The datasets this server searches (NAND, DRAM and HBM dies, controllers, hard drives, standards, company results, fab sites), with how many records each holds and the page that shows them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb2f312e17a8edf86a7eb0b79c2d56689824733c58b7e7f578cbaf603925fa68"
        },
        {
          "name": "search_records",
          "title": "Search Eyes on Flash figures",
          "description": "Find sourced figures by words that must all appear in a record (maker, part, measure, company, quarter, site), e.g. \"Samsung V9 layers\" or \"SK hynix revenue 2026-Q3\". Up to 50 records per call, each with its source URL and an Eyes on Flash cite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dataset": {
                "description": "Only this dataset (see list_datasets)",
                "enum": ["nand-die-timeline", "controller-timeline", "dram-die-timeline", "hbm-timeline", "hdd-timeline", "standards", "bit-market-results", "bit-market-rates", "bit-market-guidance", "bit-market-forecasts", "fab-tracker-sites", "fab-tracker-events", "fab-tracker-capacity", "fab-tracker-money", "fab-tracker-links", "fab-tracker-forecasts"],
                "type": "string"
              },
              "limit": {
                "description": "Records to return, 1 to 50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many matches, to page on",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to match",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f32a75e089df732c8cf7fc4bd04fd6e0ef70da2688b641e38e6053590709eb9"
        }
      ],
      "digest": "sha256:e65b043f2fefc47908407b4d8dd4218f37366092331213f98e34e4208952ada5"
    }
  }
