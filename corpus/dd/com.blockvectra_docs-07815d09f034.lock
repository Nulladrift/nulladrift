{
  "lockfileVersion": 2,
  "subjects": {
    "com.blockvectra/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs.blockvectra.com/mcp/docs"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "blockvectra-docs",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search and read BlockVectra's public documentation without an API key. Use `search_docs` for topic or task keywords, then `read_doc` with a result's path and the same lang. For a known path, use `read_doc` directly; start with path 'quickstart'. These are the two tools available at this endpoint. Omit lang for English; tools/list shows published languages. Never put credentials in tool arguments, URLs or chat.",
      "tools": [
        {
          "name": "read_doc",
          "title": "Read Documentation Page",
          "description": "Read the raw Markdown content of a documentation page from /md/{lang}/{path}.md. Path must be an internal relative path (e.g. 'quickstart', 'guides/ai-agents', 'api/json-rpc', 'chains').",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Published documentation language (case-insensitive, e.g. zh-hant or zh-Hant). Omit for English; unavailable languages return an error.",
                "enum": ["en", "zh", "de", "es", "fr", "id", "ja", "ko", "pt-br", "ru", "th", "tr", "uk", "vi", "zh-hant"],
                "type": "string"
              },
              "path": {
                "description": "Internal relative documentation path (e.g. 'quickstart', 'guides/ai-agents', 'api/json-rpc'). Do not include protocol, hostname, query string, fragment, or '..'.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad25020fbbdd74d50020a32d5a6963afa752770860d2050075bd2dbb051fda78"
        },
        {
          "name": "search_docs",
          "title": "Search Documentation",
          "description": "Find documentation by topic or task keywords in page titles, navigation titles, relative paths, and summaries. Read a result with read_doc using its path and the same lang; use read_doc directly for a known path. Omit lang for English; limit is 1-20 (default 5). If no results match, try broader keywords or read_doc with path 'quickstart'. Available without an API key.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Published documentation language (case-insensitive, e.g. zh-hant or zh-Hant). Omit for English; unavailable languages return an error.",
                "enum": ["en", "zh", "de", "es", "fr", "id", "ja", "ko", "pt-br", "ru", "th", "tr", "uk", "vi", "zh-hant"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of search results to return (1-20, default 5).",
                "type": "number"
              },
              "query": {
                "description": "Keywords to search for in documentation titles, navigation titles, paths, and summaries.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "allOf": [
                  {
                    "anyOf": [
                      {
                        "allOf": [
                          {
                            "properties": {
                              "message": {
                                "type": "string"
                              },
                              "results": {
                                "items": {
                                  "properties": {
                                    "path": {
                                      "type": "string"
                                    },
                                    "summary": {
                                      "type": "string"
                                    },
                                    "title": {
                                      "type": "string"
                                    }
                                  },
                                  "required": ["path", "summary", "title"],
                                  "type": "object"
                                },
                                "type": "array"
                              }
                            },
                            "required": ["results"],
                            "type": "object"
                          },
                          {
                            "not": {
                              "properties": {
                                "error": {
                                  "const": "executor_request_rejected",
                                  "type": "string"
                                }
                              },
                              "required": ["error"],
                              "type": "object"
                            }
                          }
                        ]
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "error": {
                            "const": "executor_request_rejected",
                            "type": "string"
                          },
                          "message": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "reason": {
                            "enum": ["query_required"],
                            "type": "string"
                          }
                        },
                        "required": ["error", "message", "reason"],
                        "type": "object"
                      }
                    ],
                    "type": "object"
                  },
                  {
                    "not": {
                      "properties": {
                        "error": {
                          "const": "invalid_tool_arguments",
                          "type": "string"
                        }
                      },
                      "required": ["error"],
                      "type": "object"
                    }
                  }
                ]
              },
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "const": "invalid_tool_arguments",
                    "type": "string"
                  },
                  "message": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "reason": {
                    "enum": ["invalid_root", "schema_type", "schema_enum", "undeclared_property", "credential_field", "credential_value"],
                    "type": "string"
                  }
                },
                "required": ["error", "message", "reason"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a497ca7f48508daff4a02c3d889763565e60546ff6284c6e11658767ee22bd9"
        }
      ],
      "digest": "sha256:b9d6d5a58878254c82c1cec3a76a87e91a8f94a912651f71b31244dddcf85465"
    }
  }
}
