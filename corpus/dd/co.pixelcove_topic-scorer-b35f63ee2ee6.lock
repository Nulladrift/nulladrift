{
  "lockfileVersion": 2,
  "subjects": {
    "co.pixelcove/topic-scorer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://topic-scorer.pixelcove.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "topic-scorer",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Score a page or draft against 11,485 public taxonomy categories (Google Ads Topics, Google Merchant, IAB Content 3.1, IAB Audience 1.1, IAB Ad Product 2.0, LinkedIn Industries v2) by embedding similarity, rank it per taxonomy, and get the phrases that pull it toward a target category. Free. A topical-alignment check for content briefs and SEO/GEO audits, not a ranking predictor.",
      "tools": [
        {
          "name": "topic_scorer_find",
          "title": "Find Categories",
          "description": "Finds categories whose path contains the query (case-insensitive substring), optionally within one taxonomy. Free. Returns up to `limit` hits with id and path; pass the id as `category` to the scoring tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in category paths.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "taxonomy": {
                "description": "Taxonomy of the target category.",
                "enum": ["google_ads_topics", "google_merchant", "iab_content", "iab_audience", "iab_ad_product", "linkedin_industries"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:14046d9749a78c457cc5a4089a3e295cd2fb91cc5f9aa7c3f9db337244668631"
        },
        {
          "name": "topic_scorer_gate",
          "title": "Gate Text",
          "description": "Pass/fail check: does the text rank within the top `min_rank` categories of its target taxonomy? Returns `pass`, the target's rank and gap to #1, the taxonomy's top five, and the unused phrases to work in. Use it as a content-pipeline gate. Free; read-only and safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Target category id, full path, or a unique path substring within the taxonomy (use topic_scorer_find to look one up).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "full": {
                "default": false,
                "description": "Score the whole text as the mean of 8,192-char chunks instead of only the first 8,192 chars.",
                "type": "boolean"
              },
              "min_rank": {
                "default": 3,
                "description": "Highest passing rank.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "phrases": {
                "default": 30,
                "description": "Phrase bank size for the target category (0 skips it).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "taxonomy": {
                "description": "Taxonomy of the target category.",
                "enum": ["google_ads_topics", "google_merchant", "iab_content", "iab_audience", "iab_ad_product", "linkedin_industries"],
                "type": "string"
              },
              "text": {
                "description": "The page or draft text to score, as plain text or HTML (tags are stripped). 1 to 32768 characters. URLs are not fetched; send the content.",
                "maxLength": 32768,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category", "taxonomy", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gate Text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:52e1702ff1cb06156d275eccd41c0a7e6991934a44ebb6b78f97e1cc8e4a16b2"
        },
        {
          "name": "topic_scorer_phrases",
          "title": "Phrase Bank",
          "description": "Returns the ranked phrase bank for one category: 1 to 4 word phrases a page squarely about that category would contain, ordered by similarity to the category. Use it to seed a brief. Free; read-only and safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Target category id, full path, or a unique path substring within the taxonomy (use topic_scorer_find to look one up).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "n": {
                "default": 30,
                "description": "Bank size.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "taxonomy": {
                "description": "Taxonomy of the target category.",
                "enum": ["google_ads_topics", "google_merchant", "iab_content", "iab_audience", "iab_ad_product", "linkedin_industries"],
                "type": "string"
              }
            },
            "required": ["category", "taxonomy"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Phrase Bank"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:509524750d7adf3f5898cd7c7ea2e9c9f5583ab148a5e51fbd3bd6cd52e944e4"
        },
        {
          "name": "topic_scorer_score",
          "title": "Score Text",
          "description": "Scores text against every category in all six taxonomies (one embedding, cosine similarity) and returns the top `per` rows per taxonomy. With `taxonomy` and `category` it also returns the target's rank, score, gap to #1, and a phrase bank split into phrases the text already uses and phrases it does not. Read the rank and the gap, not the raw percent (scores compress into a 70 to 90 band). Free; read-only and safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Target category id, full path, or a unique path substring within the taxonomy (use topic_scorer_find to look one up).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "full": {
                "default": false,
                "description": "Score the whole text as the mean of 8,192-char chunks instead of only the first 8,192 chars.",
                "type": "boolean"
              },
              "per": {
                "default": 10,
                "description": "Rows per taxonomy.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "phrases": {
                "default": 30,
                "description": "Phrase bank size for the target category (0 skips it).",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "taxonomy": {
                "description": "Taxonomy of the target category.",
                "enum": ["google_ads_topics", "google_merchant", "iab_content", "iab_audience", "iab_ad_product", "linkedin_industries"],
                "type": "string"
              },
              "text": {
                "description": "The page or draft text to score, as plain text or HTML (tags are stripped). 1 to 32768 characters. URLs are not fetched; send the content.",
                "maxLength": 32768,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score Text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:a38e222c5122452d2084f3a09eac4e1194ae4a59932096954ec520d85f4726ad"
        },
        {
          "name": "topic_scorer_taxonomies",
          "title": "List Taxonomies",
          "description": "Lists the six taxonomies with their label and category count. Free. Call it first to pick the taxonomy for topic_scorer_find.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Taxonomies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "agent-stack/costClass": "cheap",
            "agent-stack/freeTier": true,
            "agent-stack/price": null
          },
          "digest": "sha256:a4b4db88c793cc8c320d633ece3d1351df1462643ed9bfef21946e5e81477e77"
        }
      ],
      "digest": "sha256:fd95183ea2934389eab2f3e639e6b78dbe853a9d7f975886e1a5d9d809c4922c"
    }
  }
}
