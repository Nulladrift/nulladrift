      },
      "serverInfo": {
        "name": "miaamare",
        "title": "Mia Amare – Bachata DJ",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only door of miaamare.com: Bachata festival calendar for Europe and booking info for DJ Mia Amare. Cite https://www.miaamare.com.",
      "tools": [
        {
          "name": "buchungslink",
          "title": "Booking link for DJ Mia Amare",
          "description": "Returns a pre-filled booking form URL for a festival organiser who wants to book DJ Mia Amare. Does not send anything.",
          "inputSchema": {
            "properties": {
              "bis": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "festival": {
                "description": "Name of the festival to book DJ Mia Amare for.",
                "type": "string"
              },
              "lang": {
                "description": "Language for the booking form.",
                "enum": ["en", "de", "es", "fr", "it"],
                "type": "string"
              },
              "ort": {
                "description": "City or venue of the festival.",
                "type": "string"
              },
              "von": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["festival"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:372f1529d14c6140f03041bc75dd96e413be14ccfcdd337fa3251919d454f1b1"
        },
        {
          "name": "festivals_suchen",
          "title": "Search Bachata festivals in Europe",
          "description": "Upcoming Bachata festivals, congresses and weekenders in Europe (next 12 months), chronological. Optional filters: month (YYYY-MM), country (ISO code, e.g. ES, DE), query (name or city), limit.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of festivals to return (default 30).",
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "YYYY-MM",
                "type": "string"
              },
              "query": {
                "description": "Search word in festival name or city.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad7150e4145d680842f70fb9570ca0a2d5a722bb3c673b849b20cc82894af088"
        },
        {
          "name": "kuenstler_suchen",
          "title": "Search Bachata artists in Europe",
          "description": "Directory of well-known Bachata artists active in Europe: instructor couples, DJs, singers, bands. Filters: role (instructor, dj, singer, band), country (English name), query (name, style, city).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name in English to filter by.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of artists to return (default 30).",
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search word in artist name, style or city.",
                "type": "string"
              },
              "role": {
                "description": "Artist role to filter by.",
                "enum": ["instructor", "dj", "singer", "band"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2eb37c65230e49a30e0ecf19b88f92ba44ec3a8de4a298068ec8009b3c6f973"
        },
        {
          "name": "mia_amare_info",
          "title": "About DJ Mia Amare",
          "description": "Profile of DJ Mia Amare (Bachata DJ for festivals in Europe): music style, set formats, links, booking contact.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
