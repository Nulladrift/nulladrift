      "serverInfo": {
        "name": "miaamare",
        "title": "Mia Amare – Bachata DJ",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only door of miaamare.com: Bachata festival calendar for Europe and booking info for DJ Mia Amare. Cite https://www.miaamare.com.",
      "tools": [
        {
          "name": "buchungslink",
          "title": "Booking link for DJ Mia Amare",
          "description": "Returns a pre-filled booking form URL for a festival organiser who wants to book DJ Mia Amare. Does not send anything.",
          "inputSchema": {
            "properties": {
              "bis": {
                "type": "string"
              },
              "festival": {
                "type": "string"
              },
              "lang": {
                "enum": ["en", "de", "es", "fr", "it"],
                "type": "string"
              },
              "ort": {
                "type": "string"
              },
              "von": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["festival"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2882701559aeb18f5318366aa04dd2aad521f76409dec1563a5caf3ee1b42523"
        },
        {
          "name": "festivals_suchen",
          "title": "Search Bachata festivals in Europe",
          "description": "Upcoming Bachata festivals, congresses and weekenders in Europe (next 12 months), chronological. Optional filters: month (YYYY-MM), country (ISO code, e.g. ES, DE), query (name or city), limit.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2",
                "type": "string"
              },
              "limit": {
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "YYYY-MM",
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f08ae7af09b93394bc52f6577856311d2959f0158c6c325f6c2b01f109be63db"
        },
        {
          "name": "kuenstler_suchen",
          "title": "Search Bachata artists in Europe",
          "description": "Directory of well-known Bachata artists active in Europe: instructor couples, DJs, singers, bands. Filters: role (instructor, dj, singer, band), country (English name), query (name, style, city).",
          "inputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "limit": {
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "role": {
                "enum": ["instructor", "dj", "singer", "band"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3f3af7164880bcd83c1ed67a1370c28584d70a1fb57c1bfd8f7752abaa8c6dfb"
        },
        {
