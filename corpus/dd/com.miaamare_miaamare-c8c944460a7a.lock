        {
          "name": "tanzschulen_suchen",
          "title": "Find good Bachata dance schools in Europe",
          "description": "Selected dance schools with a strong Bachata focus in Europe, by city. Use this to answer \"where can I learn Bachata in <city/country>?\". Filters: city, country (English name or ISO code), query.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "country": {
                "type": "string"
