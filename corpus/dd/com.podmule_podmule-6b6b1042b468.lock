{
  "lockfileVersion": 2,
  "subjects": {
    "com.podmule/podmule": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.podmule.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "podmule-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PodMule gives you read and write access to a podcast workspace: shows, episodes, transcripts, knowledge pages, clips, contacts, interviews and campaigns.\n\nHow to work with it:\n- Call search to discover the exact capability and its input schema. Capability names and schemas change; do not guess either.\n- Call execute with one capability name and one input object to do the work.\n- If execute returns an error, call search again to repair the route rather than retrying the same input.\n\nWhere a question belongs:\n- Verbatim quotes, passages, exact timestamps, or \"which episodes discuss X\" / \"episodes about X\" lists: search_transcripts. Read episode lists off its matched_episodes field.\n- Cross-episode synthesis (\"what does the show think about X\", topic overviews, guest summaries, takeaways across the back catalogue): search_knowledge, then get_knowledge_page for a full page. Drop to search_transcripts when you need the underlying quotes or timestamps.\n- Reusable Saved Prompts the workspace has stored: list_prompt_library, then get_saved_prompt.\n\nBefore you write:\n- Writes act on the customer's live workspace. Confirm with the user before creating, updating, deleting or publishing anything.\n- Route writes through execute. ask_podmule is read-only and will not perform them.",
      "tools": [
        {
          "name": "ask_podmule",
          "title": "ask_podmule",
          "description": "Ask PodMule for a concise read-only domain answer or an advisory route plan. Use this for quick questions, summaries, diagnostics, drafting, \"what should I do?\" prompts, and ambiguous action requests. This tool never performs writes. For exact capability contracts use search; for one selected action (read or write) use execute.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "properties": {
                  "contact_id": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "conversation_id": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "episode_id": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "organization_id": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "show_id": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "timeframe": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "request": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "enum": ["answer", "route_plan", "json"],
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "type": "string"
              },
              "citations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["workspace", "show", "episode", "contact", "contact_group", "interview", "clip", "email_template", "email_campaign", "workflow", "job", "system_prompt", "system"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "error": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "links": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "markdown": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["episode", "contact", "group", "interview", "show", "clip", "email-campaign", "email-template-editor"],
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "label", "markdown", "path", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "route": {
                "additionalProperties": false,
                "properties": {
                  "capability_name": {
                    "type": "string"
                  },
                  "confidence": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "input": {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "intent": {
                    "enum": ["answer", "read", "write", "workflow", "ask_user"],
                    "type": "string"
                  },
                  "next_tool": {
                    "enum": ["none", "search", "execute", "ask_user"],
                    "type": "string"
                  },
                  "reason": {
                    "type": "string"
                  },
                  "requires_confirmation": {
                    "type": "boolean"
                  }
                },
                "required": ["confidence", "intent", "next_tool", "reason"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "error"],
                "type": "string"
              },
              "suggested_actions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "capability_name": {
                      "type": "string"
                    },
                    "input": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "label": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "requires_confirmation": {
                      "type": "boolean"
                    }
                  },
                  "required": ["capability_name", "input", "label", "reason", "requires_confirmation"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:745962825cab417a55a5e8d6b2f48580de4b3608ed578dc131f8fa2a00a6b65c"
        },
        {
          "name": "execute",
          "title": "execute",
          "description": "Execute one OAuth-visible PodMule capability. Reads run directly. Modern MCP 2026 clients with MRTR support may preview and affirm the allowlisted update_episode pilot; legacy clients and every other MCP write remain read-only. Dangerous writes are always blocked — do those in the PodMule app. Use ask_podmule for ambiguous requests and search for exact schemas.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "input": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "error": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "invocation_id": {
                "type": ["string", "null"]
              },
              "links": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "markdown": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["episode", "contact", "group", "interview", "show", "clip", "email-campaign", "email-template-editor"],
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "label", "markdown", "path", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "result": {},
              "status": {
                "enum": ["ok", "error"],
                "type": "string"
              },
              "writes_enabled": {
                "type": "boolean"
              }
            },
            "required": ["status", "writes_enabled"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:41b4fa0c399b0875a19db0eab23a922f1631f98f98a8b3f084355ce095b69e9d"
        },
        {
          "name": "search",
          "title": "search",
          "description": "Search available PodMule capabilities for this OAuth token. Use this when you need the exact capability name or schema before calling execute. For ambiguous domain requests, call ask_podmule first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "enum": ["summary", "schema"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dangerous": {
                      "type": "boolean"
                    },
                    "description": {
                      "type": "string"
                    },
                    "mutates": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "scope": {
                      "type": "string"
                    },
                    "signature": {
                      "type": "string"
                    }
                  },
                  "required": ["dangerous", "description", "mutates", "name", "scope"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "writes_enabled": {
                "type": "boolean"
              }
            },
            "required": ["matches", "total", "writes_enabled"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:450b6950b2a373e5e18899d835941f9dadf3ab17f97693c8ca68de509ff93ae9"
        }
      ],
      "digest": "sha256:b1dc1a63c8636b35623e4605c19765eb8df872d6548cb92524618d0de808abec"
    }
  }
}
