          "digest": "sha256:0fd00571ef63c79f948cc899724349c5da8a2470eb0a19609495b870c06ba0bd"
        },
        {
          "name": "get_today",
          "description": "Today's complete picture: calorie/macro totals vs targets, water, streak, exercises, and the item-by-item food log (`recent`: every logged item's name, calories, macros, ingredients). Each `recent` item's `id` works with update_log to correct mistakes.",
          "inputSchema": {
            "properties": {
              "tz_offset_min": {
                "description": "The user's JS getTimezoneOffset() — minutes BEHIND UTC (e.g. 240 for EDT). Optional: when omitted, the user's app-reported timezone is used (UTC only if the account has never reported one).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Today's log & totals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
