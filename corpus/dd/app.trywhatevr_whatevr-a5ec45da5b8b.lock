          "digest": "sha256:59403ede56b3e074398354314be2cde5aa148dfadfdedc889601c9bd2ef34b1d"
        },
        {
          "name": "log_weight",
          "description": "Log a weigh-in in pounds. The newest reading also becomes the user's current weight (drives their calorie targets).",
          "inputSchema": {
            "properties": {
              "logged_at": {
                "description": "Bare-local timestamp YYYY-MM-DDThh:mm:ss (no zone). Omit to use the user's 'now'.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "tz_offset_min": {
                "description": "The user's JS getTimezoneOffset() — minutes BEHIND UTC (e.g. 240 for EDT). Optional: when omitted, the user's app-reported timezone is used (UTC only if the account has never reported one).",
                "type": "number"
              },
              "weight_lb": {
                "maximum": 1500,
                "minimum": 20,
                "type": "number"
              }
            },
            "required": ["weight_lb"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Log a weigh-in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
