      "capabilities": {
        "tools": {}
      },
      "instructions": "Log food, water, exercise, and weigh-ins to the user's whatevr account, and read their day, progress, and profile. Every tool call needs the user's API token in the Authorization header (Bearer wtvr_live_…) — they create one in the whatevr app under Settings → API Access. Clients whose connector setup can't send headers can put the token in the connect URL instead: POST /mcp/<token>. Timestamps are bare-local (YYYY-MM-DDThh:mm:ss, no zone); when logging 'now', pass tz_offset_min (the user's JS getTimezoneOffset(), minutes behind UTC) so entries land on their calendar day. Prefer log_anything for anything said in plain words — it runs the same parser as the app's voice logging. With the user's permission you can also change their goals and targets (update_goals), reminders (update_reminders), and delete entries (delete_log). Those need a switch the user turns on per connection in the whatevr app (Settings → Connections) — get_me's `connection` says which are on; if one is off, tell the user exactly which switch to turn on rather than retrying.",
      "tools": [
        {
          "name": "delete_log",
          "description": "Delete ONE entry from the user's log: a food, exercise, weigh-in or water entry. Read get_today/get_day first — each item in `recent` carries its `id` and `type`; pass both. Deleting a weigh-in updates their current weight to the newest remaining one. This can't be undone, so confirm with the user first. Needs the user's \"Delete entries\" switch for this connection (whatevr app → Settings → Connections). The user is notified.",
          "inputSchema": {
            "properties": {
              "log_id": {
                "description": "The item's `id` from get_today/get_day `recent`.",
                "type": "string"
              },
              "type": {
                "description": "The item's `type` from `recent`.",
                "enum": ["food", "exercise", "weight", "water"],
                "type": "string"
              }
            },
            "required": ["log_id", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete a logged entry"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:edfd64aee6f86f124b6e580ece588f4b90bebe4211777a9a83c8aad943834730"
        },
        {
          "name": "get_day",
          "description": "Everything logged on a specific day, INCLUDING each food item's name and nutrition (same shape as get_today). Use this to answer “what did I eat yesterday / on <date>”. Each `recent` item's `id` works with update_log to correct mistakes.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A specific day's log"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b07d4dc18ac21f289ca304d02833b9c524d6ff28ab30b282f3d3daa687ea66c5"
        },
        {
          "name": "get_me",
          "description": "Who the user is: name/handle/email, health profile, calorie/macro targets, and derived metrics.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Profile & targets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1161d46033e9914f1f28f24c3f5300da5e2352baa41c3cfd479dd715075f160"
        },
        {
          "name": "get_progress",
          "description": "Daily calorie/macro/exercise TOTALS over time + the weight trend (no food item names — use get_day for what was actually eaten).",
          "inputSchema": {
            "properties": {
              "anchor": {
                "description": "Window end date (default: the user's today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "1–730, or 0 for all-time (default 30)",
                "type": "number"
              },
              "tz_offset_min": {
                "description": "The user's JS getTimezoneOffset() — minutes BEHIND UTC (e.g. 240 for EDT). Optional: when omitted, the user's app-reported timezone is used (UTC only if the account has never reported one).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Progress & trends"
          },
          "behavior": {
            "destructive": false,
