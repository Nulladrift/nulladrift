      "serverInfo": {
        "name": "whatevr",
        "title": "whatevr — food & health logging",
        "version": "1.0.0",
        "websiteUrl": "https://trywhatevr.app",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png",
            "sizes": ["48x48"]
          },
          {
            "src": "https://app.trywhatevr.app/icon-192.png",
