          },
          "digest": "sha256:0377e72020a482da0f3ebaf0c020ade32f6de4e38921437bcabffbbb6d2b5595"
        },
        {
          "name": "update_goals",
          "description": "Change the user's goal and daily targets — the same settings as the app's Goals screen. Send ONLY the fields to change. Each target takes a number (a custom target) or \"auto\" (computed from their body, activity and goal). The server keeps calories and macros consistent (protein×4 + carbs×4 + fat×9 ≈ calories), so the targets it returns can differ slightly from what you sent — report the returned ones. Current weight is not here: log a weigh-in with log_weight. Needs the user's \"Change goals & settings\" switch for this connection (whatevr app → Settings → Connections); if it's off you'll get a message saying so — relay it. The user is notified of every change.",
          "inputSchema": {
            "properties": {
              "activity_level": {
                "enum": ["sedentary", "light", "moderate", "very", "extra"],
                "type": "string"
              },
              "calorie_target": {
                "anyOf": [
                  {
                    "maximum": 5000,
                    "minimum": 1000,
                    "type": "number"
                  },
                  {
                    "enum": ["auto"],
                    "type": "string"
                  }
                ],
                "description": "1000–5000, or \"auto\"."
              },
              "carbs_target_g": {
                "anyOf": [
                  {
                    "maximum": 600,
                    "minimum": 20,
                    "type": "number"
                  },
                  {
                    "enum": ["auto"],
                    "type": "string"
                  }
                ],
                "description": "20–600, or \"auto\"."
              },
              "fat_target_g": {
                "anyOf": [
                  {
                    "maximum": 250,
                    "minimum": 10,
                    "type": "number"
                  },
                  {
                    "enum": ["auto"],
                    "type": "string"
                  }
                ],
                "description": "10–250, or \"auto\"."
              },
              "fiber_minimum_g": {
                "maximum": 60,
                "minimum": 5,
                "type": "number"
              },
              "goal": {
                "enum": ["lose", "maintain", "gain"],
                "type": "string"
              },
              "goal_weight_lb": {
                "maximum": 700,
                "minimum": 50,
                "type": "number"
              },
              "protein_target_g": {
                "anyOf": [
                  {
                    "maximum": 400,
                    "minimum": 20,
                    "type": "number"
                  },
                  {
                    "enum": ["auto"],
                    "type": "string"
                  }
                ],
                "description": "20–400, or \"auto\"."
              },
              "rate_lb_per_week": {
                "description": "Pace for lose/gain (ignored for maintain).",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "sodium_maximum_mg": {
                "maximum": 5000,
                "minimum": 500,
                "type": "number"
              },
              "sugar_maximum_g": {
                "maximum": 150,
                "minimum": 10,
                "type": "number"
              },
              "water_goal_glasses": {
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change goals & targets"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:76a2906f2685bf8d10e3f076731e733792fdebb01308a5a6de5a8d7ac0a6cbbd"
        },
        {
          "name": "update_log",
          "description": "Correct an existing FOOD log: title, nutrition numbers, the ingredient list, meal, or time-of-day. Read get_today/get_day first — each item in `recent` (type \"food\") carries the `id` to pass here. Send ONLY the fields to change; values are absolute for the item as logged. Two modes, never mixed: send `ingredients` to REPLACE the whole list (include every ingredient you want kept — the log's totals recompute from it, so don't also send calories/macros), OR send top-level numbers to set totals directly — the existing ingredient breakdown then RESCALES proportionally so the parts always sum to the new totals (ingredient names/amounts don't change, so when the COMPOSITION changed — something added or removed — send `ingredients` instead). Note: ANY edit that changes a routine-created log's title or its calories — including an ingredients replacement, since totals recompute — also updates that saved routine. When logged_time changes, the log's meal may re-infer from the new hour unless you set meal explicitly. Requires a full-access token; edit one log at a time.",
          "inputSchema": {
            "properties": {
              "calories": {
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "carbs_g": {
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "fat_g": {
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "fiber_g": {
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "ingredients": {
                "description": "REPLACES the full ingredient list; totals recompute from it. Cannot be combined with top-level numeric fields.",
                "items": {
                  "properties": {
                    "amount": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "calories": {
                      "maximum": 20000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "carbs_g": {
                      "maximum": 2000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "fat_g": {
                      "maximum": 2000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "fiber_g": {
                      "maximum": 2000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "protein_g": {
                      "maximum": 2000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "sodium_mg": {
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "sugar_g": {
                      "maximum": 2000,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["calories", "name"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "log_id": {
                "description": "The item's `id` from get_today/get_day `recent` (type \"food\" only).",
                "type": "string"
              },
              "logged_time": {
                "description": "HH:MM 24h — time-of-day only; the log's DATE never changes.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "meal": {
                "enum": ["breakfast", "lunch", "dinner", "snack"],
                "type": "string"
              },
              "protein_g": {
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "sodium_mg": {
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "sugar_g": {
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "title": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["log_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Fix a logged item"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c5a573aa419ca401ab64af20f71f478a3e7d2807be891c84b47acfdcb064535b"
        },
        {
          "name": "update_reminders",
          "description": "Turn the user's daily reminders on or off: the evening 'nothing logged today' nudge and the streak reminder. Same as the app's Notifications screen. Needs the user's \"Change goals & settings\" switch for this connection. The user is notified of the change.",
          "inputSchema": {
            "properties": {
              "log_reminder": {
                "type": "boolean"
              },
              "streak_reminder": {
                "type": "boolean"
              },
              "tz_offset_min": {
                "description": "The user's JS getTimezoneOffset(). Only used if the app has never reported their timezone; then it's required.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Turn reminders on or off"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:13ac0fcb4420ba5e6af4f158e0519fb2ee9edbe513af5eaff255ff45b0c5c898"
        }
      ],
      "digest": "sha256:2028c567c58d1e2555dbf19f2ebc2af5152792ac7b764a55fadef23a7dbcdd1c"
    }
  }
