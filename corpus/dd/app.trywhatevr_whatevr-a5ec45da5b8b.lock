            "readOnly": true
          },
          "digest": "sha256:2c871f2478345f8a0d3e8488336b809355854f0b6650a39e4417f76cba97a6a0"
        },
        {
          "name": "log_anything",
          "description": "Log food, drinks, water, exercise, or a weigh-in from one natural-language sentence — the same parser as the app's voice logging. Examples: 'two eggs and toast', '30 minute run', '3 glasses of water', 'weighed 184 this morning'. Spoken dates like 'yesterday I had pizza' work. Describe the FOOD, not just numbers: stating explicit nutrition in the text ('burrito, 800 calories') pins those totals exactly but logs ONE pre-computed item with no ingredient breakdown — if you do that, follow up with update_log's `ingredients` array so the log keeps its per-item detail.",
          "inputSchema": {
            "properties": {
              "logged_at": {
                "description": "Bare-local timestamp YYYY-MM-DDThh:mm:ss (no zone). Omit to use the user's 'now'.",
                "type": "string"
              },
              "text": {
                "description": "What to log, in plain words.",
                "maxLength": 2000,
                "type": "string"
              },
              "tz_offset_min": {
                "description": "The user's JS getTimezoneOffset() — minutes BEHIND UTC (e.g. 240 for EDT). Optional: when omitted, the user's app-reported timezone is used (UTC only if the account has never reported one).",
                "type": "number"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Log by describing it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3484a2179a942d75ed1bab680a022bc03a372727400190c11a62c9f358a7b304"
        },
        {
