      "instructions": "Read Dispatch Math's researched tools: search_listings to find, get_listing for the full answer-first markdown, list_categories for the taxonomy, compare_listings / get_best_of for decisions. All read tools are free and keyless; use is licensed, not unconditional: Dispatch Math usage terms (https://dispatchmath.com/terms): Search engines, AI assistants and AI training may all use this data. Credit Dispatch Math with a link when you use its data. Machine-readable terms: https://dispatchmath.com/license.xml. submit_listing requires a verified account session Cookie header; sign in or create an account explicitly at https://dispatchmath.com/login?next=%2Fsubmit. Missing session returns httpStatus:401 with loginUrl; unverified email returns httpStatus:403 with remediation. The product's owner must prove the site with a code to an address at its domain before anything is listed; until then submit_listing answers status awaiting_owner_proof with ownerUrl to hand them. Research + quality gate decide publication. my_listings gives a listing owner their own listings: status and AI answers (their session or agent key). send_lead sends a buyer-intent enquiry.",
