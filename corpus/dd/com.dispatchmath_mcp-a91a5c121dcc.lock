          "title": "Read your listings",
          "description": "What the Dispatch Math owner dashboard shows about the listings an account owns: each one's status (`status.kind`: review with the expected date, accepted with `liveOn` and `paid` ('express' | 'featured' | null: the paid way that releases it, Featured including VIP listing), live, refused with the reason, or archived), the listing as it shows, where AI answers named the product or cited its page, and what it can buy here at this site's prices. Only for the account itself: send its session Cookie header, or its agent key with \"Read your listings\" as Authorization: Bearer. Same answer as GET https://dispatchmath.com/api/owner/listings. Read-only: corrections go through the dashboard's request form.",
