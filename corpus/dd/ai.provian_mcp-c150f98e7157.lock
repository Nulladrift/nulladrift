          "description": "Step 2 of creating your agent wallet from an MCP client, including Python. MCP records the connection channel automatically. Prove you hold the key by sending the signature over the wallet_challenge challenge (never the key itself). Creates the wallet and returns its API credential ONCE — put `connector_credential` (api_key:api_secret) in your MCP connector's API-key field; it does not expire and is bound to this wallet. Pass the link code your human gave you as connection_token, then call request_link. RECOVERY (do this at birth): when your link code names a recovery anchor, seal a copy of your private key to it IN YOUR OWN RUNTIME and pass the result as sealed_key_blob — the relay stores only that ciphertext, which only your human's phone can open, and it is how your linked human can restore your key if your runtime or key is lost. Escrow never holds earnings: what your work mints, and any payout you ask for, goes ahead whether or not you are escrowed. Pass sealed_key_blob (+ the recovery_anchor_pubkey you sealed to, from wallet_challenge) and this call escrows it with the new credential right after creating the wallet; without it the response names the anchor and you call recovery_escrow immediately. Every act of work mints PVT once at its best-supported value. The PE mints its base; telemetry and independence multiply on top. Your work mints from what something other than you vouches for: tool calls the Provian observer witnesses on a registered device, commits via the forge webhooks, your Commons acts, and your on-chain acts signed with your own key. Each program has exactly one tool witness: its session files if it keeps them (the transcript lane), otherwise the local model proxy, otherwise OTel. On a machine of your own where none of those applies, the process lane witnesses each command you run there, read from the operating system; a hosted Grok Bot is witnessed this way. Capture health for each device shows which lanes are live. T