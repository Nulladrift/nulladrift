        {
          "name": "check_challenge",
          "description": "PRESENTER step 0 — call this BEFORE record_burn. Checks a challenge a requester handed you and returns WHO is asking: status 'verified' (signed; signature valid, audience bound to the requester, not expired, addressed to you — requester identity is a domain hostname or a Provian wallet id + address), 'unverified' (an unsigned legacy challenge — nothing proves who issued it; you may still present), or a refusal: 'invalid' (signed but a check fails — forged or corrupt), 'expired', 'not_addressed' (it names a different presenter). may_present is false for the refusals: do not burn. Pure: no burn, no relay write (it reads only the requester's public key — the Provian JWKS for a wallet requester, the requester's own /.well-known/provian-requester.json for a domain, fetched https-only). No credentials needed.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "Legacy (unsigned) challenge: the audience.",
                "type": "string"
              },
              "challenge": {
                "description": "Legacy (unsigned) challenge: the challenge nonce.",
                "type": "string"
              },
              "challenge_envelope": {
                "description": "The requester's challenge envelope, verbatim (object or JSON string): {v, audience, challenge, predicates?, issuedAt, expiresAt, presenter?, requester, sig}."
              },
              "predicates": {
                "description": "Legacy challenge: its predicates, if any.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "presenter_address": {
                "description": "Your 0x address, to check a challenge addressed to one presenter. Local stdio defaults to this machine's identity.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:65d5f2e7b923c3abd9ef5d6e725b19a72b5b4de22c78d44db2f0b451fa4447a9"
        },
        {
          "name": "create_wallet",
          "description": "Local stdio only: create a self-sovereign Provian agent wallet. Encrypts one pending agent ID/key before networking, then proves possession of it by signing a relay-issued challenge (the key itself is never sent), and records local MCP as the wallet registration channel. Returns wallet_id, EVM address, api_key + api_secret (agent API credentials, shown once), and the private key (shown once — store securely). The wallet is your durable identity on the Provian trust layer: Every act of work mints PVT once at its best-supported value. The PE mints its base; telemetry and independence multiply on top.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "description": "Stable agent identifier (alphanumeric, hyphens/underscores/dots; globally unique — a taken id returns 409). Defaults to a slug of agent_name plus one persisted random suffix reused across retries.",
                "type": "string"
              },
              "agent_name": {
                "description": "Display name for the agent (required).",
                "type": "string"
              },
              "connection_token": {
                "description": "OPTIONAL. A connection code carrying the human device recovery anchor. Read-only; the code is not consumed here.",
                "type": "string"
              },
              "platform": {
                "description": "Platform identifier. Defaults to 'mcp'.",
                "type": "string"
              },
              "save_credentials": {
                "description": "Local stdio mode only: persist api_key/api_secret to ~/.provian/agent-credentials.json (0600) so later authenticated tools work automatically. Must remain true. The private key lives only in the separate encrypted local wallet identity. Remote create_wallet is disabled because hosted MCP has no durable caller-owned state.",
                "type": "boolean"
              }
            },
            "required": ["agent_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69d7be1acf1569935c45d90fa6408f49fbb159bf52ae238ea8e32e3dae0d0f7c"
        },
