      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Empire Tune — Auto-tune the magic numbers in your code MCP server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools about Empire Tune — Auto-tune the magic numbers in your code. No account needed; an API key from https://empiretune.eliteaiempire.com/agent-api/v1/keys raises limits.",
      "tools": [
        {
          "name": "get_checkout_link",
          "title": "Checkout link",
          "description": "Checkout URL for a plan. With no arguments: the main paid plan. Where the site supports it the URL is a Stripe-hosted Checkout session (created unpaid; a human pays, nothing is charged by this tool). A free plan is only returned when the plan is requested or the company sells nothing else.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "description": "ONLY where the site requires the buyer to accept its Terms/refund policy before checkout: set true only after the human buyer has read and accepted the policy links the tool lists. Never set it on your own.",
                "type": "boolean"
              },
              "buyer_email": {
                "description": "only for sites that need the buyer's email or store handle before checkout: the human buyer's own receipt email",
                "type": "string"
              },
              "interval": {
                "enum": ["month", "year", "one_time"],
                "type": "string"
              },
              "plan": {
                "description": "plan name from list_pricing",
                "type": "string"
              },
              "store_handle": {
                "description": "only where the site asks for it (StoreForge): the store handle the buyer chose, 3+ chars a-z 0-9 -",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9248d4d477fde6232c1568b02ed73793dd276ef6c9f774a24ba3a1271cb8952d"
        },
        {
          "name": "get_company_info",
          "title": "Company info",
          "description": "What this company sells, who it is for, and every agent/API entry point. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e40a1a2e81804358b8dea4a6f68018d33ced5fcfca8d2ccb31f6ec66188e96a"
        },
        {
          "name": "list_pricing",
          "title": "Pricing",
          "description": "Current plans and prices in USD: plan, interval, amount_usd, currency, what_you_get. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
