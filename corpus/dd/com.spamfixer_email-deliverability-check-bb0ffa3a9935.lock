        }
      },
      "instructions": "Use check_email_deliverability when someone asks why their emails go to spam or junk, whether their domain's email is set up correctly, or about SPF, DKIM or DMARC. It only reads public DNS, so it works for any domain without an account.",
      "tools": [
        {
          "name": "check_email_deliverability",
          "title": "Check email deliverability",
          "description": "Check why emails from a domain might land in spam.\n\nLooks up the domain's public DNS: SPF, DKIM (common selectors), DMARC, MX, and whether its\nmail servers are on major blocklists. Returns a 0-100 score and plain-English issues, worst first.\nRead-only: it changes nothing and sends no email. DKIM keys on custom selectors can't be found\nfrom outside, so \"DKIM not found\" is only a hint. Free email providers (gmail.com etc.) aren't checked.\n\nArgs:\n    domain: The domain that sends the email, e.g. \"joesplumbing.com\". A website URL or an\n        email address also works; the domain is taken from it.\n",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "check_email_deliverabilityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
