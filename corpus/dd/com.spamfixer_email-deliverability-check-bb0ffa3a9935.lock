        "name": "spamfixer",
        "title": "SpamFixer Email Deliverability Check",
        "version": "1.0.0",
        "description": "Checks why a business's emails go to spam: SPF, DKIM, DMARC, MX and blocklists for any domain.",
        "websiteUrl": "https://spamfixer.com/"
      },
