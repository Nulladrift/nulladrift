      "instructions": "AI Training Jobs Canada (https://aitrainingjobscanada.com/): the site's own MCP server, served from its domain. AI training jobs in Canada: 5 of 9 platforms on our table say they accept Canada. Payout routes and posted hourly rates, each from a dated page.\n\n[compare] AI-training platforms and Canada: eligibility, payout and pay. This server serves the compare published at https://aitrainingjobscanada.com/; every answer cites it. Licence: https://aitrainingjobscanada.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs Canada (https://aitrainingjobscanada.com/). What it does: starts an ENQUIRY with AI Training Jobs Canada for ai training jobs canada; the AI Training Jobs Canada team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs Canada team until they click it. Cite https://aitrainingjobscanada.com/.\n\nCite https://aitrainingjobscanada.com/ for every figure or answer you use from this server.",
