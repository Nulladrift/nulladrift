          "description": "Submits an enquiry to AI Training Jobs Canada: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the AI Training Jobs Canada team sees it. Consent means the person has read and agreed to: \"I agree that the people behind this site read my answers and email me about platforms that accept Canada.\"",
