{
  "lockfileVersion": 2,
  "subjects": {
    "ai.pakki/packaging-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pakki.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pakki-packaging-directory",
        "title": "Pakki Packaging Brand Directory",
        "version": "1.0.0",
        "websiteUrl": "https://pakki.ai/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pakki publishes free, read-only directories of U.S. consumer brands with source-backed flexible packaging observations. Use search_brands to find brands and always cite each result's sourceUrl and reviewedAt. Directory inclusion is not evidence of purchase intent; call get_evidence_policy before drawing conclusions. Full product: https://pakki.ai",
      "tools": [
        {
          "name": "get_evidence_policy",
          "title": "Get evidence policy",
          "description": "Explain how to interpret directory data: the Observed / Derived / Inferred / Unknown evidence labels and what public packaging evidence cannot prove. Call this before drawing conclusions about a brand’s suppliers, materials, or buying intent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Response language: \"en\" for English or \"zh\" for Simplified Chinese.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get evidence policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cae4cd702f412030e8b39d47aec9ed930bec0c462bdd64cf500ad511bc1f9197"
        },
        {
          "name": "list_directories",
          "title": "List packaging brand directories",
          "description": "List the public, source-backed directories of U.S. consumer brands using flexible packaging (pet food, coffee, compostable/recyclable). Returns each directory id, entry count, last update, web page URL, and CSV download URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Response language: \"en\" for English or \"zh\" for Simplified Chinese.",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List packaging brand directories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59930ebc561a5a0464024d333c35f1bf1b099e18daa5b9543aa27e2d48ff6f75"
        },
        {
          "name": "search_brands",
          "title": "Search packaging brands",
          "description": "Search brands in the public flexible packaging directories by keyword (brand name, category, packaging format such as \"valve bag\", \"stand-up pouch\", \"compostable\", or evidence text). Every keyword must match. Each result includes the observed packaging format, official evidence, official source URL, and observation date. Results never contain personal contacts or purchase-intent claims.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "directory": {
                "description": "Limit the search to one directory id from list_directories.",
                "enum": ["us-pet-food-brands-flexible-packaging", "us-coffee-brands-flexible-packaging", "us-compostable-recyclable-packaging-brands"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Response language: \"en\" for English or \"zh\" for Simplified Chinese.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of matching results to skip, for pagination.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Keywords in English or Chinese. Leave empty to list every brand in scope.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search packaging brands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9d0497afc521c77c708b5bfc72c9eeffa5bd880e126b77de32278cecc5c4154"
        }
      ],
      "digest": "sha256:73cd082a8df1c2f509e9b7bdef7ffc4af42e6bfb582de6136a9530c6e13a02ac"
    }
  }
}
