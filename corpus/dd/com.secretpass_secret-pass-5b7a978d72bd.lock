        {
          "name": "search_offers",
          "title": "Search SecretPass offers",
          "description": "Find current shop offers and voucher deals in Australia, the United Kingdom and the United States by keyword, country, category, shop, product brand or specifications. Use when someone is shopping for a product, brand or shop and wants to check current offers, savings and conditions before buying. Every query word must match, so use 1 or 2 short singular keywords, for example \"scooter\" or \"dyson\". Returns public offer details and SecretPass offer page links, never voucher codes. Use list_filters to find country/category slugs and exact product values.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Product maker, independent of the shop.",
                "maxLength": 160,
                "type": "string"
              },
              "business": {
                "description": "Business slug from a previous result.",
                "maxLength": 200,
                "type": "string"
              },
              "category": {
                "description": "Category slug from list_filters.",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "product_type": {
                "description": "Reviewed product type from list_filters.",
                "maxLength": 160,
                "type": "string"
              },
              "query": {
                "description": "Words to match across shop, title, category, product brand, model and specifications.",
                "maxLength": 100,
                "type": "string"
              },
              "region": {
                "enum": ["au", "uk", "us"],
                "maxLength": 2,
                "type": "string"
              },
              "specifications": {
                "additionalProperties": {
                  "maxLength": 160,
                  "type": "string"
                },
                "description": "Attribute keys and exact values including units, from list_filters.",
                "maxProperties": 24,
                "propertyNames": {
                  "maxLength": 64,
                  "pattern": "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$"
                },
                "type": "object"
              }
            },
            "type": "object"
          },
