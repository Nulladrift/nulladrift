        {
          "name": "new_carriers",
          "description": "Newly-authorized US motor carriers (FMCSA new entrants), newest first — the new-carrier LEADS feed for trucking insurance agents, factoring companies, and ELD/fuel-card/equipment vendors selling to new carriers. Each row: USDOT, legal/DBA name, address, phone, EMAIL (where on file), fleet size, authority type/status, plus factoring pre-qualification (forHire, financeable, authority/insurance status) and the safety layer (out-of-service rate / inspection history where the carrier already has a roadside record; honest-null with a 'no inspection history yet' flag for true new entrants). Alias of new_authority_feed. Filter by state, fleet size, since-date, has-email, forHire, financeable, insured. Leads from public FMCSA census — verify before outreach; respect DNC / CAN-SPAM.",
