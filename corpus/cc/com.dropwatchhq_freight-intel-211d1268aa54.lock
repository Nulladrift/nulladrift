          "description": "Re-grade a list of carriers (USDOT numbers and/or MC/docket numbers) against the live FMCSA/L&I record plus our switch-signal and chameleon layers. Each carrier returns a triage verdict and flags: already-factored, authority-revoked, insurance-lapsed, chameleon, virgin (no factor yet), or switch-lead (just terminated its factor). The 'wow' demo for factoring companies vetting their own lead list.",
