        {
          "name": "new_authority_feed",
          "description": "Return US trucking carriers newly granted FMCSA operating authority, newest first. The broker/factoring lead signal: each carrier just became able to legally haul. Pre-qualified for factoring: each carrier carries financeable (GO/WAIT/NO/UNKNOWN), forHire (has broker/shipper receivables to factor), authorityStatus (Active/Pending), insuranceStatus + insurer (BIPD on file), and owner/principal name — derived from the FMCSA census + L&I authority/insurance datasets. Filter by state, fleet size, since-date, has-email, forHire, financeable verdict, and insured.",
          "inputSchema": {
            "properties": {
              "financeable": {
                "description": "Filter by verdict: GO | WAIT | NO | UNKNOWN.",
                "type": "string"
              },
              "forHire": {
                "description": "Only for-hire carriers (have factorable receivables).",
                "type": "boolean"
              },
              "hasEmail": {
                "description": "Only carriers with an email on file.",
                "type": "boolean"
              },
              "insured": {
                "description": "Only carriers with BIPD insurance on file.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max carriers (default 100).",
                "type": "number"
              },
              "maxPowerUnits": {
                "type": "number"
              },
              "minPowerUnits": {
                "type": "number"
              },
              "since": {
                "description": "ISO date; only authorities on/after.",
                "type": "string"
              },
              "state": {
