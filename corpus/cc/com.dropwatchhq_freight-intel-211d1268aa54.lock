          "description": "Chameleon / reincarnation entity-resolution: new authorities that share a phone or physical address with a recently-DEACTIVATED carrier (a likely reincarnation of an outfit that lost authority). Filing-agent / registration-service clusters are down-weighted. Returns a 0-100 score + match basis. A review signal, not proof of fraud.",
