{
  "lockfileVersion": 2,
  "subjects": {
    "com.mihenkai/mihenk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.mihenkai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mihenk",
        "title": "Mihenk AI: measured crypto KOL data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mihenk measures crypto KOLs (influencers): real reach, audience quality and what the market did after their calls. Use kol_lookup before trusting a KOL, organic_interest to see if attention on a token is real, ecosystem_report for a chain, evidence_search for what someone said and when (deleted posts included). Measurement, not investment advice. Full records are sold per call on the x402 Agent API: https://app.mihenkai.com/x402",
      "tools": [
        {
          "name": "ecosystem_report",
          "title": "KOL report for a chain",
          "description": "Who among measured KOLs talks about a chain (base, solana, ethereum, bsc, near, arbitrum, hyperliquid, …), its most-discussed tokens, and the KOLs whose posts were followed by more trading volume. Window 7, 30 or 90 days.",
          "inputSchema": {
            "properties": {
              "chain": {
                "type": "string"
              },
              "days": {
                "default": 30,
                "enum": [7, 30, 90],
                "type": "integer"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "KOL report for a chain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08bc0b22422a2e8a3fc9576d541c1f30bee9cafbf792d2be73f686bfce3bc1b0"
        },
        {
          "name": "evidence_search",
          "title": "Search the KOL evidence archive",
          "description": "Archived posts of measured KOLs with the exact post time, including posts later deleted from X. Give a handle, words (or a $ticker), or both. Returns at most 10 records with links and record hashes.",
          "inputSchema": {
            "properties": {
              "deleted_only": {
                "default": false,
                "type": "boolean"
              },
              "handle": {
                "type": "string"
              },
              "words": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the KOL evidence archive"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8721104d32cc4ee00d160887d66530a4e108c9af77688877078ae3925901ee5"
        },
        {
          "name": "kol_basket",
          "title": "Coins a KOL promoted lately",
          "description": "The spot coins a KOL promoted in the last 7, 30 or 90 days, with the median 24 h move after their posts. Not a recommendation; it shows what the KOL promoted and what followed.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "enum": [7, 30, 90],
                "type": "integer"
              },
              "handle": {
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coins a KOL promoted lately"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:861f1d9933c9485d08b30b5086e759e0e757ce1414f168ecce0314b25575d614"
        },
        {
          "name": "kol_lookup",
          "title": "Look up a crypto KOL",
          "description": "Mihenk's measurement of one X account: Mihenk score (0-10), real reach (typical views per post), followers, region, 90-day call record (share of calls that went the call's way within 24 h) and the last 5 calls.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "X handle, e.g. cobie",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a crypto KOL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ca328a82249dce5feec169dac366d899176d648b178980c14a9d9969f07c2ae"
        },
        {
          "name": "organic_interest",
          "title": "Organic KOL interest in a token",
          "description": "Which measured KOLs talked about a token, how many views those posts got and how much was organic (posts that 3+ accounts published with the same text count as coordinated). Window 7, 30 or 90 days.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "enum": [7, 30, 90],
                "type": "integer"
              },
              "token": {
                "description": "Ticker without $ (e.g. PEPE) or a contract address",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Organic KOL interest in a token"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa14fb3a856865505ddf53549353e36ffca58c7ddba1e714363da20a0a2dd71d"
        }
      ],
      "digest": "sha256:5ce9291f499e1accde9d479ffe88ce0ea2e045d754a512777e985093c1e5d079"
    }
  }
}
