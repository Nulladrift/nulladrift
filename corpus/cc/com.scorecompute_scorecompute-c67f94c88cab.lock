        {
          "name": "shape_the_sound",
          "title": "Design a drum for a chord",
          "description": "Kac's question in reverse: design a polygonal drumhead whose lowest tones play requested frequency ratios (a fifth, a triad, a pentatonic scale), each accepted within ±tolerance_cents. proven_impossible is returned only when proven theorems exclude every ratio combination inside those tolerance windows for a connected uniform membrane with a fixed edge: simple fundamental, f2/f1 ≤ j11/j01 ≈ 1.5933 with equality for the disk (Ashbaugh–Benguria 1992), and Yang's universal inequality minimized exactly over the window box; an exact-target exclusion is reported separately. Otherwise multi-start L-BFGS with exact finite-element shape derivatives designs a 5–16-vertex polygon, then reanalyses it on three refined meshes with the shared hear_the_shape solver: achieved ratios, errors in cents with estimated uncertainty (not rigorous bounds), resolution warnings, optional numerical tuning of the fundamental in Hz. not_achieved is a bounded-search result, never an impossibility proof. Ideal membrane only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fundamental_hz": {
                "description": "With wave_speed: scale the drum so its fundamental sounds at this frequency.",
                "maximum": 20000,
                "minimum": 1,
                "type": "number"
              },
              "include_mode_shapes": {
                "description": "Adds computed mode shapes from the shared forward solver (≤1024 triangles, full-precision coordinates) for visualization.",
                "type": "boolean"
              },
              "max_evaluations": {
                "description": "Search budget in finite-element evaluations, default 300.",
                "maximum": 1000,
                "minimum": 50,
                "type": "integer"
              },
              "seed": {
                "description": "Default 1. Same seed, same drum.",
                "maximum": 4294967295,
                "minimum": 0,
                "type": "integer"
              },
              "target_ratios": {
                "description": "Frequency ratios f2/f1, f3/f1, … of the lowest modes, ascending (e.g. [1.25, 1.5] for a just major triad).",
                "items": {
                  "maximum": 4,
                  "minimum": 1,
                  "type": "number"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "tolerance_cents": {
                "description": "Success when |error| + uncertainty ≤ tolerance for every ratio; default 5 cents.",
                "maximum": 100,
                "minimum": 0.5,
                "type": "number"
              },
              "vertices": {
                "description": "Polygon vertices, default 10.",
                "maximum": 16,
                "minimum": 5,
                "type": "integer"
              },
              "wave_speed": {
                "description": "m/s, √(tension/areal density).",
                "maximum": 1000000,
                "minimum": 1e-9,
                "type": "number"
              }
            },
            "required": ["target_ratios"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
