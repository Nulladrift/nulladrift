                    "maxItems": 4,
                    "minItems": 2,
                    "type": "array"
                  }
                },
                "required": ["observers"],
                "type": "object"
              }
            },
            "required": ["assumptions", "data_origin", "new_series", "objective", "observations"],
            "type": "object"
