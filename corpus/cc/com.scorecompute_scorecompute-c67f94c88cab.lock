        {
          "name": "compose_capabilities",
          "title": "Plan a capability chain",
          "description": "Plan from declared available/goal contracts within tool, locality and search bounds. Returns dependencies, blockers and existing-tool bindings. Cost counts graph steps, not speed, price or quality. Runs no engines; execution validates arguments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adapters": {
                "additionalProperties": false,
                "properties": {
                  "route_durations.v1": {
                    "additionalProperties": false,
                    "properties": {
                      "speed_kmh": {
                        "maximum": 150,
                        "minimum": 1,
                        "type": "number"
                      }
                    },
                    "required": ["speed_kmh"],
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "available": {
                "items": {
                  "maxLength": 96,
                  "minLength": 1,
                  "pattern": "^[a-z0-9_.]+$",
                  "type": "string"
                },
                "maxItems": 48,
                "type": "array"
