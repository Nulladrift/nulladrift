        {
          "name": "assimilate_observation",
          "title": "Refit with a new observation series",
          "description": "Refit original tracks plus one supplied new angular series, each counted once; compute the baseline natively. Declare synthetic/measured origin (unverified). Conditional uncertainty may worsen; forecast angles are not acquired evidence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "additionalProperties": false,
                "properties": {
                  "constant_velocity": {
                    "const": true,
                    "type": "boolean"
                  },
                  "exact_stations_and_clocks": {
                    "const": true,
                    "type": "boolean"
                  },
                  "independent_new_errors": {
                    "const": true,
                    "type": "boolean"
                  }
                },
                "required": ["constant_velocity", "exact_stations_and_clocks", "independent_new_errors"],
                "type": "object"
              },
              "data_origin": {
                "description": "Origin declared by the caller; even measured is not independently verified or authenticated.",
                "enum": ["synthetic", "measured"],
                "type": "string"
              },
              "new_series": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "maxLength": 64,
                    "minLength": 1,
                    "pattern": "^[A-Za-z0-9_.-]+$",
                    "type": "string"
                  },
                  "samples": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "azimuth_deg": {
                          "maximum": 360,
                          "minimum": 0,
                          "type": "number"
                        },
                        "elevation_deg": {
                          "maximum": 90,
                          "minimum": -2,
                          "type": "number"
                        },
                        "t_s": {
                          "description": "Already corrected absolute time; strictly after all baseline samples and no later than the comparison horizon.",
                          "maximum": 1000000000000,
                          "minimum": -1000000000000,
                          "type": "number"
                        }
                      },
                      "required": ["azimuth_deg", "elevation_deg", "t_s"],
                      "type": "object"
                    },
                    "maxItems": 120,
                    "minItems": 3,
                    "type": "array"
                  },
                  "sigma_az_deg": {
                    "maximum": 10,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  "sigma_el_deg": {
                    "maximum": 10,
                    "minimum": 0.01,
                    "type": "number"
                  },
                  "station": {
                    "additionalProperties": false,
                    "properties": {
                      "elevation_m": {
                        "maximum": 9000,
                        "minimum": -500,
                        "type": "number"
                      },
                      "id": {
                        "maxLength": 64,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9_.-]+$",
                        "type": "string"
                      },
                      "lat": {
                        "maximum": 89,
                        "minimum": -89,
                        "type": "number"
                      },
                      "lon": {
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      }
                    },
                    "required": ["elevation_m", "id", "lat", "lon"],
                    "type": "object"
                  }
                },
                "required": ["id", "samples", "sigma_az_deg", "sigma_el_deg", "station"],
                "type": "object"
              },
              "objective": {
                "additionalProperties": false,
                "properties": {
                  "horizon_s": {
                    "description": "Absolute comparison time in the same corrected seconds as the observations; after the original observations, within their bounded 3600-second domain.",
                    "maximum": 1000000000000,
                    "minimum": -1000000000000,
                    "type": "number"
                  }
                },
                "required": ["horizon_s"],
                "type": "object"
              },
              "observations": {
                "additionalProperties": false,
                "properties": {
                  "observers": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "clock_offset_s": {
                          "default": 0,
                          "description": "The observer clock is ahead of the common base by this many seconds; the engine subtracts it.",
                          "maximum": 60,
                          "minimum": -60,
                          "type": "number"
                        },
                        "elevation_m": {
                          "default": 0,
                          "maximum": 9000,
                          "minimum": -500,
                          "type": "number"
                        },
                        "lat": {
                          "maximum": 89,
                          "minimum": -89,
                          "type": "number"
                        },
                        "lon": {
                          "maximum": 180,
                          "minimum": -180,
                          "type": "number"
                        },
                        "samples": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "azimuth_deg": {
                                "maximum": 360,
                                "minimum": 0,
                                "type": "number"
                              },
                              "elevation_deg": {
                                "maximum": 90,
                                "minimum": -2,
                                "type": "number"
                              },
                              "t_s": {
                                "description": "Seconds from a common epoch, strictly increasing for this observer.",
                                "maximum": 1000000000000,
                                "minimum": -1000000000000,
                                "type": "number"
                              }
                            },
                            "required": ["azimuth_deg", "elevation_deg", "t_s"],
                            "type": "object"
                          },
                          "maxItems": 120,
                          "minItems": 3,
                          "type": "array"
                        },
                        "sigma_az_deg": {
                          "maximum": 10,
                          "minimum": 0.01,
                          "type": "number"
                        },
                        "sigma_el_deg": {
                          "maximum": 10,
                          "minimum": 0.01,
                          "type": "number"
                        }
                      },
                      "required": ["lat", "lon", "samples", "sigma_az_deg", "sigma_el_deg"],
                      "type": "object"
