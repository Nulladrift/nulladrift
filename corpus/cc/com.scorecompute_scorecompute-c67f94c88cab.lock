        {
          "name": "propagate_uncertainty",
          "title": "Measurement uncertainty: GUM and Monte Carlo",
          "description": "Check dimensions, then compare first-order GUM with seeded fixed-sample Monte Carlo for an explicit model of 1–16 inputs. Return uncertainty budgets, coverage intervals and convergence/linearization findings. Conditional on supplied distributions; no affine units. CPU, direct-only; no planner binding.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "correlations": {
                "description": "Correlations between normal inputs with standard_uncertainty > 0.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "a": {
                      "maxLength": 32,
                      "minLength": 1,
                      "type": "string"
                    },
                    "b": {
                      "maxLength": 32,
                      "minLength": 1,
                      "type": "string"
                    },
                    "coefficient": {
                      "maximum": 1,
                      "minimum": -1,
                      "type": "number"
                    }
                  },
                  "required": ["a", "b", "coefficient"],
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 0,
                "type": "array"
              },
              "coverage": {
                "description": "Coverage probability, default 0.95.",
                "maximum": 0.999,
                "minimum": 0.5,
                "type": "number"
              },
              "expression": {
                "description": "Model with + - * / ^, parentheses, pi and sqrt exp ln log10 sin cos tan asin acos atan abs. Literals are dimensionless; no implicit multiplication.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "result_unit": {
                "description": "Output unit; must match the model dimension.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "samples": {
                "description": "Monte Carlo draws, default 1000000 (JCGM 101 typical value for 2 significant digits).",
                "maximum": 2000000,
                "minimum": 10000,
                "type": "integer"
              },
              "seed": {
                "description": "Default 1. Same seed, same result.",
                "maximum": 4294967295,
                "minimum": 0,
                "type": "integer"
              },
              "variables": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "distribution": {
                      "anyOf": [
                        {
                          "const": "constant",
