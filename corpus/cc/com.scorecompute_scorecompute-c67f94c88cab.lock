        {
          "name": "scan_counterexample",
          "title": "Scan a grid for a counterexample",
          "description": "Bounded deterministic float64 scan of a scalar <= or >= claim over a declared grid of 1–6 variables. Reports numerical witnesses, undefined and uncertain evaluations, and the exact stop reason. A propagated screening guard rejects near-boundary candidates; it is not a certified interval or formal proof. An inconclusive outcome preserves unresolved sampled cells; absence of a witness does not establish the claim over the continuous box.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bound": {
                "maximum": 1000000000000,
                "minimum": -1000000000000,
                "type": "number"
              },
              "expression": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "max_counterexamples": {
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "max_evaluations": {
                "maximum": 200000,
                "minimum": 1,
                "type": "integer"
              },
              "relation": {
                "anyOf": [
                  {
                    "const": "le",
                    "type": "string"
                  },
                  {
                    "const": "ge",
                    "type": "string"
                  }
                ]
              },
              "tolerance": {
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "variables": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "max": {
                      "maximum": 1000000,
                      "minimum": -1000000,
                      "type": "number"
                    },
                    "min": {
                      "maximum": 1000000,
                      "minimum": -1000000,
                      "type": "number"
                    },
                    "name": {
                      "maxLength": 32,
                      "minLength": 1,
                      "pattern": "^[A-Za-z_][A-Za-z0-9_]*$",
                      "type": "string"
                    },
                    "steps": {
                      "maximum": 64,
                      "minimum": 2,
                      "type": "integer"
                    }
                  },
                  "required": ["max", "min", "name", "steps"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["bound", "expression", "relation", "variables"],
            "type": "object"
