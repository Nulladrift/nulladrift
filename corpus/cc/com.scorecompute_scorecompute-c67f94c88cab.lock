      "instructions": "Choose by task. Select tasks within a time budget: optimize_tasks. Chance a plan meets its deadline: simulate_plan. Both in one call: build_robust_plan (plan_mission only previews). Uncertainty of a formula with measured inputs: propagate_uncertainty. Order points into a tour: route_optimizer. Sun, shadow or Moon checks: verify_shadows, check_shadow_track, check_ephemeris, plan_golden_hour. Reported mean/SD plausibility: audit_statistics. Exact arithmetic: check_arithmetic. Any of these with a signed receipt: verify_claim. Orbits: compute_orbit, kepler_stability. Drum shapes and sounds: hear_the_shape, shape_the_sound. Tool contracts and units: list_capabilities. Dates are UTC strings like 2026-06-21T12:00:00Z. Results are conditional on your inputs and the stated model, never verdicts on truth. To keep this list small, output schemas are omitted; results are unchanged and still checked. Connect to https://scorecompute.com/mcp?schemas=full to list them. The specialized computation tools remain directly callable, independently of the optional mission composer. forge_route_policy synthesizes bounded route-score expressions using only supplied training cases; selected is experimental, never independently validated or automatically promoted. run_route_policy executes an explicit bounded expression without retraining; its hash identifies the program, not its merit. Generated variants and the sealed held-out campaign are distinct from the manually engineered observation policy. plan_golden_hour computes one strict UTC day of geometric solar-elevation windows on CPU, with explicit photographic bands and a separate conventional sunrise threshold; it predicts neither terrain visibility nor weather or beautiful light. Its shared solar source means that combining it with shadow and ephemeris tools is not independent corroboration. plan_observation derives its baseline from original angular measurements and ranks supplied candidate series by conditional local linear uncertainty forecasts; predicted is not acquired evidence. stress_test_observation searches a finite declared list of hypothetical input perturbations; none_found is not a global robustness guarantee and solver non-convergence is inconclusive. assimilate_observation refits original and supplied new angles exactly once; data origin is caller-declared, never authenticated. improve_schedule compares only permitted deadline/task changes and uses a separately seeded confirmation; confirmed is conditional on the duration model. Discovery tools remain independently callable; the composition planner can bind their complete requests without inventing data adapters. list_capabilities describes native contracts and composition readiness; plan_mission previews a bounded scheduling plan without running engines; build_robust_plan compares up to three scheduling candidates in native Rust and reports conditional confidence bounds. list_composition_capabilities exposes the typed capability bank and runnable examples; compose_capabilities searches for a bounded admissible dependency plan and explains missing contracts or permissions. Structural cost counts graph steps, not time, price or quality. execute_composition recompiles and executes approved task-selection or geometric-route risk chains; a completed assessment does not mean the deadline is likely to be met. Other compositions require their advertised existing-tool binding or remain planning-only. Internal engines are native calls, not nested MCP requests. ScoreCompute publishes declared MCP client name/version, called tool, status and execution duration in its public observatory. Tool inputs, results and mission events are not published in that journal. Do not include secrets or personal information in clientInfo. This identity is self-declared and does not establish the AI provider or model. Computations describe their assumptions and limits: compatible, contredit and intestable are conditional consistency findings, never authenticity, fraud or cheating verdicts. CUDA acceleration applies to simulate_pi and the separate fixed pi_chunk_v1 contributor pilot. network_status exposes available resources; submit_network_job queues a public synthetic job and get_network_job reports verified progress. The separate schedule_probe_v1 contributor workload uses only three compiled public synthetic scenarios on explicitly enabled CPU clients; its discrete-grid probabilities are not real-world guarantees. Contributor calculations are recomputed on coordinator CPU; no net speedup is claimed. Contribution jobs do not accept private files or datasets. Public access has request, concurrency and session limits.",
