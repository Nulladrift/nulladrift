          "name": "ocr_identi1",
          "title": "주민등록증 텍스트 추출(OCR)",
          "description": "Extract key fields from a Korean resident registration card (jumin card) image via OCR. 주민등록증 사진에서 이름, 주민등록번호, 주소, 발급일자 등 주요 정보를 추출해 구조화된 결과와 원문 텍스트(raw_text)를 반환합니다. 정보주체의 동의 등 적법한 처리 근거를 확보한 경우에만 사용하십시오. [호출당 12포인트]",
