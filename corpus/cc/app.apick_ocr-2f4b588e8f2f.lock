        {
          "name": "ocr",
          "title": "이미지 텍스트 추출(OCR)",
          "description": "Extract text from an image file (OCR). 이미지 파일에서 텍스트를 추출해 전체 텍스트(full_text)를 반환합니다. 문서 사진, 스캔 이미지, 캡처 화면 등 범용 이미지에 사용합니다. [호출당 12포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/png, image/jpeg) (최대 50MB)",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c13a3d086be09bd0adae10c2f1548dce4507f426f2b0fdab8fd6e0e5a002da13"
        },
        {
          "name": "ocr_identi1",
          "title": "주민등록증 텍스트 추출(OCR)",
