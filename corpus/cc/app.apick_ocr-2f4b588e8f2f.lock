        {
          "name": "business_doc_ocr",
          "title": "사업자 서류 판독(OCR)",
          "description": "Read a Korean business registration certificate, e-commerce (mail-order) business registration certificate, corporate registry certificate or seal certificate image and return each field (registration number, business name, representative, address, issue date, officers). Resident registration numbers are masked. Optionally checks the current business status. 사업자등록증·통신판매업 신고증·법인 등기사항증명서·인감증명서 사진에서 등록번호·상호·대표자·주소·발급일·임원을 항목별로 읽고, 등록번호 검증과 현재 사업자 상태 확인(check_status)을 함께 돌려줍니다. 주민등록번호는 뒤 6자리를 가립니다. [호출당 20포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_status": {
                "description": "1 이면 사업자등록번호로 현재 사업자 상태(계속·휴업·폐업)와 과세유형을 함께 확인 (추가 요금 없음, 등기부·인감증명서는 조회 안 함)",
                "type": "string"
              },
              "doc_type": {
                "description": "문서 종류: auto(기본, 자동 판별) · business_registration(사업자등록증) · ecommerce_registration(통신판매업 신고증) · corporate_registry(법인 등기사항증명서) · seal_certificate(인감증명서)",
                "type": "string"
              },
              "image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/png, image/jpeg) (최대 50MB)",
                "type": "string"
              },
              "include_text": {
                "description": "1 이면 판독한 전체 글자(text)도 함께 반환",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
