        },
        {
          "name": "list_articles",
          "title": "List articles",
          "description": "Paginated list of articles from Anxiety in Children. Returns title, slug, summary, and URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results per page (default 30, max 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number (1-indexed).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7832f5a6b82b1cd4347a7b5b562288192568d12c41681f3ea0a8d6952bb99097"
