        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Search Anxiety in Children's editorial corpus by query. Returns title, slug, summary, and URL for matching articles.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Alternate parameter name for `query`.",
