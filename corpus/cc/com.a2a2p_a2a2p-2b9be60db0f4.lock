      "instructions": "Agents co-invent physical products with the protocol. To run a Co-Invent invention pass, your person adds https://a2a2p.com/co-invent/mcp as a connector in their agent and signs in to a2a2p; this public link (https://a2a2p.com/mcp) can't run one. Claude: in the desktop app or claude.ai (on a phone, claude.ai in the browser), Settings, Connectors, Add custom connector, paste the link, Connect. ChatGPT: chatgpt.com, Settings, Apps and Connectors, turn on developer mode, Create, paste the link. Claude Code: claude mcp add --transport http co-invent https://a2a2p.com/co-invent/mcp. Steps and a live connected check: https://a2a2p.com/co-invent/connect. Open with open_co_invention_session using idea, domain, agent {name, platform} and a stable open_key. Hand the private follow_url to your person; it opens only after they sign in to a2a2p, and only for the account that first opens it. Follow, feed concepts, decide with the concept version, steer with the session revision, then end. Keep follow_token private. Ordinary web agents start at /co-invent/agents.txt. Free concept selection only; no paid run is available. Agents that sign in: connect to https://a2a2p.com/co-invent/mcp. It uses OAuth 2.1 with PKCE and dynamic client registration; discovery is at https://a2a2p.com/.well-known/oauth-protected-resource/co-invent/mcp. Your person signs in to a2a2p and approves, and sessions you open there go straight into their account. Signed in, you can run a whole invention pass from one sentence: co_invent_begin_pass (with your evidence), then co_invent_pass_status and co_invent_act until it's done, deciding where a person would decide; co_invent_read reads any part (part reading: the ranked list of everything in your idea and evidence, function first, and how far each item reached; part commons: prior art and Invention Commons inventions that may overlap your claims, by public teaser only); once a package is ready, co_invent_act operation sibling with body concept_id (or pass, or saved_id) develops another idea from the same shortlist as its own invention, one at a time, and the pass follows it; operation saveidea with body concept_id (and pass) saves any idea of any pass to your undeveloped queue as is; part siblings and part undeveloped show where each idea stands, the earlier passes and the saved ideas with their days left; and co_invent_pass_say gives feedback. Start here: ask what the physical object must do. Call review_specification with that answer in intent.purpose. Follow the returned next_call one step at a time. a2a2p resolves physical-world requirements for AI agents. File links can expire. Fresh reviews and supplier packages cannot be quote-ready when an attachment fails inspection or was not inspected. Reattach the original file and review again; a saved JSON identity does not prove that its CAD links still work. GET /profile/supplier-import-observation links two dated supplier-import checks of the same public calibration drawing. Package hashes are local context, not proof that the supplier received the JSON. These checks do not establish a quote, order, general capability or physical outcome. If reliable exporter evidence says a temporary binary STL uses metre coordinates, call normalize_stl_units before review and use its derivative file_reference. Never infer units from a plausible size. Recommended flow: if you hold local STL, STEP, DXF, or PDF bytes, call upload_design_file first and pass its returned file_reference in specification.design_files. (1) review_specification — instant, stateless engineering review, including auditable deflection and nominal stress for explicit canonical rectangular beam load cases. Purpose prose is preserved but is not silently converted into physical constraints. Read engineering_evaluation.status and checks_run for exact coverage; a finding-penalty score is not engineering soundness. Its clarification_plan gives a compact next patch plus the visible remaining path; next_call names the recommended exact binding, and a complete specification also returns continuation_options for labeled pricing and screened supplier packaging. For a continuation, reuse the whole original request and add only the fields named in arguments.allowed_additions; never rewrite or drop requester intent. Every listed continuation is stateless and explicitly non-authorizing. A complete intent may submit for specification resolution, or choose the design_brief continuation to prepare a portable case without running a model or storing a request; neither is a supplier-ready quote. A real unaffiliated low-voltage outdoor sensor enclosure need may use qualify_specification_exchange_need for the ten-submission qualification cohort. That tool stores complete submission content privately and cannot contact a supplier, collect payment, place an order, or authorize fabrication. When review classifies an undesigned capability or system, prepare_domain_solutioning_case creates the versioned, privacy-minimized handoff for mechanism selection and decomposition. It does not call deb8stack or any model; the public reference path is contract-only. Pass any returned candidates to validate_domain_solutioning_result, which rejects authority or intent mutation, verifies the case digest, re-screens at quote stage, and runs deterministic review only after allow. A malformed or non-prepared case remains rejected and returns a2a2p.domain-solutioning-recovery with the exact preparation prerequisite; never reconstruct it or retry automatically. A validated Actualization Plan returns an execution_projection: each unblocked fabricated part gets an exact review_specification call using only that part's caller-authored function as purpose and specification_patch as specification; blocked work gets no call. The projection executes nothing. For source-bound material properties: plan_material_evidence_promotion identifies the exact missing evidence; an independent caller authors the canonical evidence envelope; validate_material_property_evidence checks and content-addresses that envelope before it is attached to a simulation study. The receipt proves shape and bytes, not source truth, physical evidence, design allowable status, or engineering authority; computed-crystal evidence remains reference-only. (1b) get_supply_options — instant pricing and lead time: deterministic model estimates today; pricing_kind distinguishes model estimates, provider estimates, and provider quotes. For the asynchronous provider-estimate path, request_provider_estimate returns the versioned a2a2p.quote-job-admission receipt on both admission and rejection; rejected calls name a stable reason_code and exact repair without contacting a provider. (1c) build_supplier_request_package — before invoking, obtain the requester's exact purpose and set intent.purpose (or requirement); if it is absent, ask the requester and do not infer or call yet. The operation is an instant, stateless projection into the open supplier-request profile. It applies quote-stage screening, names gaps instead of inventing values, and binds the exact package to a reproducible SHA-256 identity so a later supplier response can name what it answered. It never contacts a supplier or creates an order. For a routed sheet part, use process cnc_routing with a DXF cut profile: a2a2p measures its extents, closure and inside corners. State the sheet in specification.sheet_stock (for plywood: face_grade, ply_count, glue_class, and actual thickness or stock-relative joints), the cutter and inside-corner relief in specification.cutting, and joints cut to the sheet actually used as tolerances with relative_to measured_stock_thickness. specification.notes travel to the supplier verbatim but are never parsed into facts. If it cannot build, both MCP and REST return the versioned a2a2p.supplier-package-rejection contract with a stable closed reason_code and deterministic next_action when repair is sufficient. A missing purpose also returns a machine-executable repair contract that requires a caller value, preserves every other argument, and forbids inferred purpose. (1d) render_supplier_email_binding — instant, stateless rendering of an allow-screened package into a reviewable RFC 5322 draft. It asks, optionally, for Can quote / Need changes / Decline and the minimum quote facts, while accepting normal prose. It validates an accountable envelope but sends nothing and returns sendable=false until human review and sender authentication occur elsewhere. (2) request_physical_solution to submit. If later clarification adds fields, use revise_requirement with the returned request_id to create a linked immutable revision and a deterministic before/after readiness comparison. (3) poll check_request_status for the resolution report: a recommended path (existing commercial option vs. custom fabrication) with pricing, tradeoffs, and a delivery plan. A generated machine draft is returned immediately with a versioned delivery receipt; operator publication is a distinct state and has no promised service level. Two-layer schema: intent describes the problem; specification describes the solution. Arrive fully_specified, intent_only, or partial. At minimum provide intent.purpose or the legacy requirement field. All requests pass deterministic intake screening published at https://a2a2p.com/policy. This L3 reference implementation has no active provider, supplier RFQ, auction, payment, or ordering path.",
      "tools": [
        {
          "name": "assess_supplier_fit",
          "description": "Compare one exact package projection with every lane in one evidence-bound supplier capability declaration. Returns explicit match, conflict, or unknown checks. Import evidence concerns the drawing associated with the package, not proof that its JSON was received or accepted. It never scores or selects a supplier and grants no contact, quote, purchase, or fabrication authority.",
          "inputSchema": {
            "$id": "https://a2a2p.com/schema/supplier-fit",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "description": "A deterministic comparison of caller-projected package facts with one evidence-bound supplier capability declaration. It does not select a supplier.",
            "properties": {
              "capability_declaration": {
                "type": "object"
              },
              "import_observation": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "type": "object"
                  }
                ]
              },
              "package_projection": {
                "additionalProperties": false,
                "properties": {
                  "design_file_format": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "pattern": "^[a-z][a-z0-9_-]{0,127}$",
                        "type": "string"
                      }
                    ]
                  },
                  "material": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "pattern": "^[a-z][a-z0-9_-]{0,127}$",
                        "type": "string"
                      }
                    ]
                  },
                  "package_sha256": {
                    "pattern": "^[a-f0-9]{64}$",
                    "type": "string"
                  },
                  "process": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "pattern": "^[a-z][a-z0-9_-]{0,127}$",
                        "type": "string"
                      }
                    ]
                  },
                  "quantity": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "minimum": 1,
                        "type": "integer"
                      }
                    ]
                  },
                  "ship_to_country": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      }
                    ]
                  },
                  "size_x_mm": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    ]
                  },
                  "size_y_mm": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    ]
                  },
                  "stock_thickness_mm": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    ]
                  },
                  "surface_finish": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "pattern": "^[a-z][a-z0-9_-]{0,127}$",
                        "type": "string"
                      }
                    ]
                  },
                  "tolerance_class": {
                    "anyOf": [
                      {
                        "type": "null"
                      },
                      {
                        "pattern": "^[a-z][a-z0-9_-]{0,127}$",
                        "type": "string"
                      }
                    ]
                  }
                },
                "required": ["design_file_format", "material", "package_sha256", "process", "quantity", "ship_to_country", "size_x_mm", "size_y_mm", "stock_thickness_mm", "surface_finish", "tolerance_class"],
                "type": "object"
              }
            },
            "required": ["capability_declaration", "package_projection"],
            "title": "a2a2p supplier fit assessment input",
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Assess declared supplier fit"
