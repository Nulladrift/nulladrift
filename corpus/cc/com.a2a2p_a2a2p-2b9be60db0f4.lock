                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "model": {
                            "description": "Supported deterministic models: cantilever_end_load or simply_supported_center_load. Other values are preserved but reported as unsupported.",
                            "examples": ["cantilever_end_load", "simply_supported_center_load"],
                            "type": "string"
                          },
                          "section": {
                            "properties": {
                              "height_mm": {
                                "description": "Rectangular section depth in the bending direction, millimetres.",
                                "exclusiveMinimum": 0,
                                "type": "number"
                              },
                              "width_mm": {
                                "description": "Rectangular section width in millimetres.",
                                "exclusiveMinimum": 0,
                                "type": "number"
                              }
                            },
                            "required": ["height_mm", "width_mm"],
                            "type": "object"
                          },
                          "span_mm": {
                            "description": "Beam span in millimetres.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "yield_strength_mpa": {
                            "description": "Optional exact grade/condition/product-form datasheet value supplied by the requester.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["load_n", "model", "section", "span_mm"],
                        "type": "object"
                      },
                      "max_load": {
                        "description": "Maximum load magnitude. A Newton scalar is preferred; { value, unit: \"N\" } remains accepted.",
                        "oneOf": [
                          {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          {
                            "properties": {
                              "unit": {
                                "description": "Force unit; N is canonical.",
                                "type": "string"
                              },
                              "value": {
                                "exclusiveMinimum": 0,
                                "type": "number"
                              }
                            },
                            "required": ["value"],
                            "type": "object"
                          }
                        ]
                      },
                      "max_weight": {
                        "description": "Maximum weight of the part in kg.",
                        "type": "number"
                      },
                      "thermal_range": {
                        "description": "Operating temperature range in Celsius.",
                        "properties": {
                          "max": {
                            "type": "number"
                          },
                          "min": {
                            "type": "number"
                          }
                        },
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  "geometric_envelope": {
                    "description": "Max bounding box in mm if known.",
                    "properties": {
                      "max_x": {
                        "type": "number"
                      },
                      "max_y": {
                        "type": "number"
                      },
                      "max_z": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "inspection_documents": {
                    "description": "Inspection or material documents required with the parts, or \"none required\".",
                    "type": "string"
                  },
                  "priority": {
                    "description": "What matters most when tradeoffs arise.",
                    "enum": ["cost", "speed", "strength", "precision", "aesthetics"],
                    "type": "string"
                  },
                  "purpose": {
                    "description": "What the physical matter needs to accomplish (one non-whitespace line minimum, required).",
                    "minLength": 1,
                    "pattern": "\\S",
                    "type": "string"
                  },
                  "quantity": {
                    "description": "How many units needed.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "quote_by": {
                    "description": "Date a quote is needed by.",
                    "type": "string"
                  },
                  "ship_to_region": {
