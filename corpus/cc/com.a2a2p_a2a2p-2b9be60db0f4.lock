                  "additionalProperties": true,
                  "description": "One item: url or file ({name, type, base64}), with claim, and optionally quote, date, fact (landscape, hard, buyer, price or incumbents: the brief fact it proves) and replaces (the item numbers it supersedes; the same link or file name replaces its earlier copy by itself).",
