        {
          "name": "build_supplier_request_package",
          "description": "PRECONDITION — CALL ONLY after the requester supplied what the physical object must accomplish at intent.purpose (or requirement). If absent, ask the requester first; never infer purpose and do not invoke this tool yet. Build a synchronous, deterministic supplier request package from the requirement the caller already holds. The package follows the open a2a2p supplier profile and its versioned output schema at https://a2a2p.com/schema/supplier-package, preserves provenance, carries quote-stage screening, and names every quote-critical gap instead of inventing values. Every emitted package carries a reproducible SHA-256 artifact_identity over the exact package content, excluding the identity field itself. The digest proves content identity only; it does not prove supplier receipt, a quote, payment, fabrication, or physical correctness. The package also returns a deterministic quote_stage_eligibility receipt. Quote-stage eligibility lane flat_laser_cut_5052_h32: aluminum_5052_h32, laser_cutting, quantity 1-5, 10-300 mm by 10-300 mm, verified HTTPS DXF, raw finish, no secondary or regulated requirements, US delivery, and total budget up to USD 500. Classification sets no fee and grants no payment, supplier-contact, quote-acceptance, order, or fabrication authority. If no package can be built, MCP and REST share the a2a2p.supplier-package-rejection contract: a closed reason_code, exact vocabulary version, and deterministic next_action only where repair is sufficient. A purpose_required rejection includes an a2a2p.argument-repair operation that preserves the caller's existing arguments, requires the caller's own purpose statement, and forbids inference. An explicit specification.assembly with two or more parts returns decomposition_required and no package; one package represents one fabricated part. This is a stateless data transformation only: it stores no requirement, contacts no supplier or provider, requests no external quote, and creates no order, payment, or fabrication authority.",
          "inputSchema": {
            "anyOf": [
              {
                "required": ["requirement"]
              },
              {
                "properties": {
                  "intent": {
                    "required": ["purpose"]
                  }
                },
                "required": ["intent"]
              }
            ],
            "description": "PRECONDITION: provide a requester-supplied non-whitespace purpose at intent.purpose or requirement before invoking. If purpose is absent, ask what the physical object must accomplish; do not infer it and do not call this tool yet.",
            "examples": [
              {
                "intent": {
                  "purpose": "Hold an indoor sensor enclosure against a vertical rail without drilling."
                }
              }
            ],
            "properties": {
              "budget_usd": {
                "description": "Approximate budget in USD. Maps to intent.budget_envelope.",
                "type": "number"
              },
              "business_context": {
                "description": "Optional business requirements (expected volumes, cost targets, ROI constraints). If provided, the quote includes a business case.",
                "type": "string"
              },
              "callback_url": {
                "description": "Optional HTTPS URL. When the quote is ready, a2a2p POSTs it as JSON to this URL.",
                "type": "string"
              },
              "constraints": {
                "description": "Hard constraints: tolerances, certifications, materials to avoid, size/weight limits. Maps to intent.functional_requirements.",
                "type": "string"
              },
              "contact": {
                "description": "Optional email or callback endpoint for quote delivery.",
                "type": "string"
              },
              "deadline": {
                "description": "Required delivery date or timeframe. Maps to intent.timeline.",
                "type": "string"
              },
              "delivery": {
                "additionalProperties": false,
                "description": "Optional caller-declared routing context carried into the returned package. a2a2p does not send it anywhere.",
                "properties": {
                  "accountable_principal": {
                    "description": "A named person or legal entity accountable for the request.",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "principal_kind": {
                    "enum": ["organization", "person"],
                    "type": "string"
                  },
                  "registered_address": {
                    "description": "Required for an organization principal; its verifiable registered address.",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "reply_to": {
                    "description": "A reachable business email or HTTPS reply route.",
                    "maxLength": 500,
                    "type": "string"
                  }
                },
                "required": ["accountable_principal", "principal_kind", "reply_to"],
                "type": "object"
              },
              "intent": {
                "description": "Layer 1 — the problem. What the physical matter needs to DO. Use this for intent-driven requests where the agent describes purpose and a2a2p recommends solutions.",
                "properties": {
                  "alternates_acceptable": {
                    "description": "Whether a supplier may propose a different material, process or stock size.",
                    "type": ["boolean", "string"]
                  },
                  "budget_envelope": {
                    "description": "Budget if known.",
                    "properties": {
                      "max": {
                        "type": "number"
                      },
                      "type": {
                        "enum": ["per_unit", "total"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "compliance": {
                    "description": "Required standards or certifications.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "environment": {
                    "description": "Conditions the part must survive.",
                    "items": {
                      "enum": ["indoor", "outdoor", "saltwater", "uv_exposure", "high_temp", "low_temp", "vibration", "food_contact", "medical", "aerospace", "high_humidity", "chemical_exposure"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "functional_requirements": {
                    "description": "Structured physical constraints.",
                    "properties": {
                      "electrical": {
                        "description": "Electrical properties (conductive, insulating, etc.).",
                        "type": "string"
                      },
                      "flexibility": {
                        "description": "Rigid, semi-rigid, or flexible.",
                        "enum": ["rigid", "semi_rigid", "flexible"],
                        "type": "string"
                      },
                      "load_case": {
                        "description": "Optional bounded structural sanity check. State an explicit static point-load model and rectangular section; height_mm is the bending direction.",
                        "properties": {
                          "allowable_shear_stress_mpa": {
                            "description": "Optional requester-supplied transverse-shear design allowable; evaluated independently and never inferred from handbook data.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "allowable_stress_mpa": {
                            "description": "Optional requester-supplied design allowable; never inferred from handbook yield.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "elastic_modulus_gpa": {
                            "description": "Optional requester-supplied Young's modulus. Otherwise the matched material handbook reference is used and labeled.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "load_n": {
                            "description": "Static point-load magnitude in Newtons.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "max_deflection_mm": {
                            "description": "Optional requester-supplied acceptance limit.",
                            "exclusiveMinimum": 0,
