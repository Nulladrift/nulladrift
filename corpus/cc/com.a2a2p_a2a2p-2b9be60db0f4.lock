        {
          "name": "get_supply_options",
          "description": "Instant, synchronous pricing and lead time for a physical requirement — nothing is submitted or stored. Returns a deterministic parametric estimate (source=\"estimate\", pricing_kind=\"model_estimate\", clearly labeled, never presented as a quote). The protocol separately labels provider_estimate and provider_quote; public provider routing is not active. An explicit specification.assembly with two or more parts returns decomposition_required before file inspection or pricing; submit each fabricated part separately. Covers CNC machining, sheet metal, 3D printing, casting, injection molding, and extrusion. ATTACH AN STL in specification.design_files and a2a2p measures the mesh directly — true volume, surface area, bounding box — which replaces guesswork with measurement and returns manufacturability findings only geometry reveals. Otherwise supply intent.geometric_envelope (bounding box in mm), quantity, and material. Use this to answer \"what will this cost and how long will it take?\" inside a single session, before committing to a full resolution report.",
