        {
          "name": "normalize_stl_units",
          "description": "Create a genuinely millimetre-scaled derivative from an active temporary binary STL whose exporter is known to emit metre coordinates. The operation never guesses units from a filename or plausible size. It requires the exact source SHA-256, an exporter statement tied to a named system and revision, and a separate expected-envelope check. It preserves the source, stores the derivative under a new one-hour file_reference, and returns separate source and derivative hashes. Conversion only: no supplier selection, quote request, order, payment, fabrication, or external contact occurs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_reference": {
                "additionalProperties": false,
                "properties": {
                  "format": {
                    "const": "stl",
                    "type": "string"
                  },
                  "role": {
                    "const": "geometry",
                    "type": "string"
                  },
                  "url": {
                    "pattern": "^https://(?:www\\.)?a2a2p\\.com/file/f-[a-z0-9]{8,16}$",
                    "type": "string"
                  }
                },
                "required": ["format", "role", "url"],
                "type": "object"
              },
              "source_sha256": {
                "description": "SHA-256 of the exact uploaded source STL bytes.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "source_units": {
                "const": "m",
                "type": "string"
              },
              "target_units": {
                "const": "mm",
                "type": "string"
              },
              "unit_evidence": {
                "additionalProperties": false,
                "properties": {
                  "basis": {
                    "enum": ["producer_declaration", "exporter_contract", "verified_export_run"],
                    "type": "string"
                  },
                  "export_operation": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source_revision": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source_system": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "statement": {
                    "maxLength": 300,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["basis", "export_operation", "source_revision", "source_system", "statement"],
                "type": "object"
              },
              "validation": {
                "additionalProperties": false,
                "properties": {
                  "expected_bounding_box_mm": {
                    "additionalProperties": false,
                    "properties": {
                      "x": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "y": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "z": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["x", "y", "z"],
                    "type": "object"
                  },
                  "tolerance_mm": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["expected_bounding_box_mm", "tolerance_mm"],
                "type": "object"
              }
            },
            "required": ["file_reference", "source_sha256", "source_units", "target_units", "unit_evidence", "validation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Normalize STL metres to millimetres"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
