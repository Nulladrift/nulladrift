      "serverInfo": {
        "name": "kweku-anansi-money-sums",
        "title": "Money Sums",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Money Sums does money arithmetic for traders, borrowers and savers in any currency: the repayments and true yearly rate of a loan quoted flat or reducing, the rate of a short loan repaid at once, margin against markup, break-even sales, and the cost of a susu or ajo collector's fee. Call a tool rather than working rates out from memory, and give the figures and how they were counted. It is arithmetic, not financial advice.",
      "tools": [
        {
          "name": "business.break_even",
          "title": "Sales needed to cover fixed costs",
          "description": "Use this when someone running a business gives their fixed costs for a period (rent, wages, power for a month), what one item costs them and what they sell it for, and asks how many they must sell to cover their costs (break even). Do not use it for a business plan's forecasts or to judge whether a business will succeed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost_per_item": {
                "description": "What one item costs to buy or make.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "The currency, as its three-letter code (GHS, NGN, KES, ZAR...). Only labels the answer; leave out if unknown.",
                "enum": ["GHS", "NGN", "KES", "ZAR", "UGX", "TZS", "RWF", "ZMW", "ZWG", "MWK", "BWP", "NAD", "ETB", "EGP", "MAD", "XOF", "XAF", "SLE", "LRD", "GMD", "MZN", "AOA", "USD", "EUR", "GBP"],
                "type": "string"
              },
              "fixed_costs": {
                "description": "Costs that do not change with how much is sold, for the period (for example a month's rent, wages and power).",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "period": {
                "description": "The period the fixed costs are for. Leave out for a month.",
                "enum": ["day", "week", "month", "year"],
                "type": "string"
              },
              "sale_per_item": {
                "description": "What one item is sold for.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["cost_per_item", "fixed_costs", "sale_per_item"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "fixed_costs": {
                "type": "number"
              },
              "items_to_break_even": {
                "type": "integer"
              },
              "left_per_item": {
                "type": "number"
              },
              "left_per_item_percent": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "period": {
                "type": "string"
              },
              "sales_to_break_even": {
                "type": "number"
              }
            },
            "required": ["fixed_costs", "items_to_break_even", "left_per_item", "note", "sales_to_break_even"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2947e989919a30e6a81f9c724b6cf1603aff6afbb4dcf1c47cfa1297f21763d"
        },
        {
          "name": "business.margin",
          "title": "Profit margin and markup on a sale",
          "description": "Use this when a trader gives what an item costs them and either what they sell it for, the margin they want, or the markup they want, and asks for the profit, the margin, the markup or what to sell it for (for example \"I buy a bag of rice for 800 and want a 20% margin\"). It keeps margin (a share of the sale) and markup (a share of the cost) apart, which are often confused. Do not use it for tax on a sale (use a VAT tool), for exchange rates, or to suggest what the market will pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cost": {
                "description": "What one item costs the seller to buy or make.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "The currency, as its three-letter code (GHS, NGN, KES, ZAR...). Only labels the answer; leave out if unknown.",
                "enum": ["GHS", "NGN", "KES", "ZAR", "UGX", "TZS", "RWF", "ZMW", "ZWG", "MWK", "BWP", "NAD", "ETB", "EGP", "MAD", "XOF", "XAF", "SLE", "LRD", "GMD", "MZN", "AOA", "USD", "EUR", "GBP"],
                "type": "string"
              },
              "margin_percent": {
                "description": "The profit wanted as a per cent of the sale amount.",
                "maximum": 99.99,
                "minimum": 0,
                "type": "number"
              },
              "markup_percent": {
                "description": "The profit wanted as a per cent of the cost.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "sale_amount": {
                "description": "What one item is sold for. Give this, or margin_percent, or markup_percent.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["cost"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cost": {
                "type": "number"
              },
              "currency": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "margin_percent": {
                "type": "number"
              },
              "markup_percent": {
                "type": ["number", "null"]
              },
              "note": {
                "type": "string"
              },
              "profit": {
                "type": "number"
              },
              "sale_amount": {
                "type": "number"
              }
            },
            "required": ["cost", "margin_percent", "markup_percent", "note", "profit", "sale_amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edb029686eb6764b2835e0d9ac1fd4cf44dda0a68aaaef10211920c494966e09"
        },
        {
          "name": "loan.instalments",
          "title": "Repayments and yearly cost of a loan",
          "description": "Use this when someone gives a loan amount, an interest rate and a number of weekly, fortnightly or monthly repayments, and asks what each repayment is, what the loan costs in total, or what the rate really is a year, for example \"a microfinance loan of 5,000 at 5% flat a month for 6 months\". It handles a flat rate (interest on the whole amount for the whole term, common with microfinance and hire purchase) and a reducing-balance rate, and fees taken at the start. Do not use it for a loan repaid in one sum (use loan.one_repayment), for a mortgage with a changing rate, or to say whether a loan is a good idea.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount borrowed.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "The currency, as its three-letter code (GHS, NGN, KES, ZAR...). Only labels the answer; leave out if unknown.",
                "enum": ["GHS", "NGN", "KES", "ZAR", "UGX", "TZS", "RWF", "ZMW", "ZWG", "MWK", "BWP", "NAD", "ETB", "EGP", "MAD", "XOF", "XAF", "SLE", "LRD", "GMD", "MZN", "AOA", "USD", "EUR", "GBP"],
                "type": "string"
              },
              "method": {
                "description": "\"flat\" when interest is charged on the whole amount for the whole term; \"reducing\" when it is charged only on what is still owed. Leave out if unknown, and both are worked out.",
                "enum": ["flat", "reducing"],
                "type": "string"
              },
              "rate_per": {
                "description": "Whether the quoted rate is a month or a year.",
                "enum": ["month", "year"],
                "type": "string"
              },
              "rate_percent": {
                "description": "The interest rate as quoted, in per cent, for example 5 for 5%.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "repay_every": {
                "description": "How often a repayment is made. Leave out for every month.",
                "enum": ["week", "fortnight", "month"],
                "type": "string"
              },
              "repayments": {
                "description": "How many repayments there are.",
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "upfront_fee_percent": {
                "description": "Fees taken when the loan is paid out, as a per cent of the amount. Leave out if none.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "upfront_fees": {
                "description": "Fees taken when the loan is paid out (processing, insurance, commitment), as an amount. Leave out if none.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["amount", "rate_per", "rate_percent", "repayments"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_borrowed": {
                "type": "number"
              },
              "amount_received": {
                "type": "number"
              },
              "currency": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "how_counted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "method_known": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "quoted_rate_per": {
                "type": "string"
              },
              "quoted_rate_percent": {
                "type": "number"
              },
              "repay_every": {
                "type": "string"
              },
              "repayments": {
                "type": "integer"
              },
              "results": {
                "items": {
                  "properties": {
                    "effective_yearly_rate_percent": {
                      "type": ["number", "null"]
                    },
                    "interest": {
                      "type": "number"
                    },
                    "method": {
                      "type": "string"
                    },
                    "nominal_yearly_rate_percent": {
                      "type": ["number", "null"]
                    },
                    "repayment": {
                      "type": "number"
                    },
                    "total_cost": {
                      "type": "number"
                    },
                    "total_repaid": {
                      "type": "number"
                    }
                  },
                  "required": ["effective_yearly_rate_percent", "interest", "method", "repayment", "total_cost", "total_repaid"],
                  "type": "object"
                },
                "type": "array"
              },
              "term_months": {
                "type": "number"
              },
              "upfront_fees": {
                "type": "number"
              }
            },
            "required": ["amount_borrowed", "how_counted", "method_known", "note", "repay_every", "repayments", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecf374a99e6ca3e2419f5bcb8fc6af246a38f6daf3dfffc2ebed39fc07a05569"
        },
        {
          "name": "loan.one_repayment",
          "title": "Yearly cost of a short loan repaid at once",
          "description": "Use this when someone borrows an amount and repays a single larger sum after some days, as with a phone or app loan, a salary advance or a loan from a moneylender, and asks what rate that is a month or a year (for example \"I borrowed 1,000 and must repay 1,150 in 30 days\"). Do not use it for a loan repaid in instalments (use loan.instalments), and do not use it to judge a lender.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "The amount borrowed.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "The currency, as its three-letter code (GHS, NGN, KES, ZAR...). Only labels the answer; leave out if unknown.",
                "enum": ["GHS", "NGN", "KES", "ZAR", "UGX", "TZS", "RWF", "ZMW", "ZWG", "MWK", "BWP", "NAD", "ETB", "EGP", "MAD", "XOF", "XAF", "SLE", "LRD", "GMD", "MZN", "AOA", "USD", "EUR", "GBP"],
                "type": "string"
              },
              "days": {
                "description": "How many days until it must be repaid.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "repay": {
                "description": "The whole amount to be paid back, including interest and any fees added to it.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "upfront_fees": {
                "description": "Fees taken from the loan when it is paid out, as an amount. Leave out if none.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["amount", "days", "repay"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_borrowed": {
                "type": "number"
              },
              "amount_received": {
                "type": "number"
              },
              "cost": {
                "type": "number"
              },
              "cost_percent_of_amount": {
                "type": "number"
              },
              "currency": {
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "explore_url": {
                "type": "string"
              },
              "how_counted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "monthly_rate_percent": {
                "type": ["number", "null"]
              },
              "note": {
                "type": "string"
              },
              "repay": {
                "type": "number"
              },
              "yearly_rate_compounded_percent": {
                "type": ["number", "null"]
              },
              "yearly_rate_simple_percent": {
                "type": ["number", "null"]
              }
            },
            "required": ["amount_borrowed", "cost", "days", "how_counted", "note", "repay", "yearly_rate_compounded_percent", "yearly_rate_simple_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9714dbcf5f56c7e90ace63fa2ef7ed0dbf433b603e64d3aeaccdd124e3b28a34"
        },
        {
          "name": "savings.collector_fee",
          "title": "What a susu or ajo collector's fee costs",
          "description": "Use this when someone saves with a collector who takes regular deposits and keeps some of them as a fee (susu in Ghana, ajo or esusu in Nigeria, a daily contribution card), and asks how much they get back, what the fee is, or what it costs as a rate. A common arrangement is a daily deposit for 31 days with one day's deposit kept as the fee. Do not use it for a rotating group where members take turns to collect (a chama or rotating susu), for a bank savings account, or to judge a collector.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collections": {
                "description": "How many deposits make one cycle before the pay-out. Leave out for 31.",
                "maximum": 400,
                "minimum": 2,
                "type": "integer"
              },
              "currency": {
                "description": "The currency, as its three-letter code (GHS, NGN, KES, ZAR...). Only labels the answer; leave out if unknown.",
                "enum": ["GHS", "NGN", "KES", "ZAR", "UGX", "TZS", "RWF", "ZMW", "ZWG", "MWK", "BWP", "NAD", "ETB", "EGP", "MAD", "XOF", "XAF", "SLE", "LRD", "GMD", "MZN", "AOA", "USD", "EUR", "GBP"],
                "type": "string"
              },
              "deposit": {
                "description": "The amount paid in at each collection.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "every_days": {
                "description": "Days between deposits. Leave out for every day.",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "fee_deposits": {
                "description": "How many of those deposits the collector keeps as the fee. Leave out for 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["deposit"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "collections": {
                "type": "integer"
              },
              "currency": {
                "type": "string"
              },
              "cycle_days": {
                "type": "integer"
              },
              "deposit": {
                "type": "number"
              },
              "explore_url": {
                "type": "string"
              },
              "fee": {
                "type": "number"
              },
              "fee_percent_of_saved": {
                "type": "number"
              },
              "how_counted": {
