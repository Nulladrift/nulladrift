      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Admit Coach College Data",
        "version": "1.27.1",
        "websiteUrl": "https://admit-coach.com/mcp-server"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and compare US colleges using public historical data. Historical institutional data from IPEDS and College Scorecard; coverage and reporting years vary. Missing values are unknown. Acceptance rates are not personal admission probabilities. Net prices describe historical cohorts, not an aid offer; public-college figures may not apply to out-of-state or international students. Confirm current policies and costs with the college.",
      "tools": [
        {
          "name": "get_application_deadlines",
          "title": "Get application deadlines with countdowns",
          "description": "Recorded application, aid and commitment deadlines for up to 20 colleges, with days remaining.\n\n    Also returns a prep schedule worked backwards from the earliest application deadline\n    (recommendations, first essay draft, final essay, submission) and a calendar-file URL.\n    Dates come from institution records for the current cycle and can lag; tell the student\n    to confirm each on the official admissions page. No student data is read or stored.\n    ",
          "inputSchema": {
            "properties": {
              "unitids": {
                "items": {
                  "description": "IPEDS institution ID from search results",
                  "pattern": "^\\d{1,10}$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "title": "Unitids",
                "type": "array"
              }
            },
            "required": ["unitids"],
            "title": "get_application_deadlinesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_application_deadlinesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e3ab6aa2cddf6c04969848cb6c3eaef09e95c3fd41f58e26d968d7c83d77dca0"
        },
        {
          "name": "get_financial_aid",
          "title": "Look up historical college costs and aid",
          "description": "Read historical average net price, income brackets, grants and debt for a college.\n\n    These cohort statistics are not a personalized cost estimate or financial aid offer.\n    Public-college averages may not apply to nonresident students. Verify the official\n    college net-price calculator before deciding affordability. Missing figures remain unknown.\n    ",
          "inputSchema": {
            "properties": {
              "unitid": {
                "description": "IPEDS institution ID from search results",
                "pattern": "^\\d{1,10}$",
                "title": "Unitid",
                "type": "string"
              }
            },
            "required": ["unitid"],
            "title": "get_financial_aidArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_financial_aidDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:c0fa1d866aa8b79c45edf37993a9dbbc6bbf82170088fdaa09dd2088f52bde7c"
        },
        {
          "name": "get_university_details",
          "title": "Look up a college profile",
          "description": "Read a college's admissions ranges, majors, costs and outcomes by IPEDS ID.\n\n    Use search_universities to resolve a name first. Values are historical and may be missing;\n    cite the returned school URL. No login, personal profile or student documents are accessed.\n    ",
          "inputSchema": {
            "properties": {
              "unitid": {
                "description": "IPEDS institution ID from search results",
                "pattern": "^\\d{1,10}$",
                "title": "Unitid",
                "type": "string"
              }
            },
            "required": ["unitid"],
            "title": "get_university_detailsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_university_detailsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:b4a2b70541facf28cb73b946a38ecf6be66f2e8ea415df62c1e151336f8df847"
        },
        {
          "name": "search_universities",
          "title": "Search US colleges",
          "description": "Find colleges by name, two-letter location, field of study or historical acceptance rate.\n\n    Returns at most 20 institutions and links to school profiles. This searches public\n    institutional records, does not access student accounts, and does not predict admission.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "major": {
                "default": "",
                "maxLength": 100,
                "title": "Major",
                "type": "string"
              },
              "max_acceptance_rate": {
                "default": 100,
                "maximum": 100,
                "minimum": 0,
                "title": "Max Acceptance Rate",
                "type": "number"
              },
              "query": {
                "default": "",
                "maxLength": 100,
                "title": "Query",
                "type": "string"
              },
              "state": {
                "default": "",
                "pattern": "^([A-Za-z]{2})?$",
                "title": "State",
                "type": "string"
              }
            },
            "title": "search_universitiesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_universitiesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
