{
  "lockfileVersion": 2,
  "subjects": {
    "com.hopwithann/route-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hopwithann.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hop-with-ann",
        "title": "Hop With Ann route finder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hop With Ann plans door-to-door island hopping in the Philippines (ferries, boats, drivers). Use find_route for \"A to B on date X\". Results give legs, usual departure times (confirmed when Ann quotes) and a pre-filled planner link. There are no prices or live seat availability. To get a quote, either give the traveller the planner link, or, if they agree, use send_enquiry to pass their plan to Ann. Ann replies within 24 hours. Ann does not book flights.",
      "tools": [
        {
          "name": "find_route",
          "title": "Find a route",
          "description": "Island-hopping route from A to B in the Philippines: legs, usual departure times, notes and a pre-filled link for the traveller to request a quote. No prices, no live availability.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Travel date, YYYY-MM-DD (optional). At least 7 days ahead.",
                "type": "string"
              },
              "from": {
                "description": "Start place, e.g. \"Cebu City\", \"Panglao\", \"Mactan airport\"",
                "type": "string"
              },
              "group_size": {
                "description": "Number of travellers (optional)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "End place, e.g. \"Siquijor\", \"Camiguin\"",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54e820cb0d961a626624bdcb83a1bfb8639d1d64029b5eeddbc34e93a51fc323"
        },
        {
          "name": "list_routes",
          "title": "List routes",
          "description": "Every route Hop With Ann has a page for, with door-to-door time.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d88aa8801f14610e11cc0f3960c3fc93abdfa47f686e89f014f5fd6d100b253"
        },
        {
          "name": "send_enquiry",
          "title": "Send a trip enquiry to Ann",
          "description": "Send the traveller's trip plan to Ann for a free quote. ONLY use after the traveller has clearly agreed to share their name and contact details with Hop With Ann. Ann replies within 24 hours (usually the same day) by email or WhatsApp. This does not book or charge anything.",
          "inputSchema": {
            "properties": {
              "assistant": {
                "description": "Name of the AI assistant sending this, e.g. \"ChatGPT\"",
                "type": "string"
              },
              "country": {
                "description": "Where the traveller is from (optional)",
                "type": "string"
              },
              "email": {
                "description": "Email (email or WhatsApp needed)",
                "type": "string"
              },
              "end_date": {
                "description": "YYYY-MM-DD (optional)",
                "type": "string"
              },
              "extra_stops": {
                "description": "Stops in between, in order (optional)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "description": "Trip start, e.g. \"Cebu City\"",
                "type": "string"
              },
              "group_size": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "message": {
                "description": "Anything else: hotels, flight times, children, luggage, special needs",
                "type": "string"
              },
              "name": {
                "description": "Traveller name",
                "type": "string"
              },
              "reply_by": {
                "description": "How the traveller wants Ann to reply",
                "enum": ["Email", "WhatsApp"],
                "type": "string"
              },
              "start_date": {
                "description": "YYYY-MM-DD (optional)",
                "type": "string"
              },
              "to": {
                "description": "Trip end, e.g. \"Siquijor\"",
                "type": "string"
              },
              "traveller_consent": {
                "description": "true only if the traveller has explicitly agreed to send their details to Hop With Ann",
                "type": "boolean"
              },
              "whatsapp": {
                "description": "WhatsApp number with country code, e.g. +44 7700 900123",
                "type": "string"
              }
            },
            "required": ["from", "name", "to", "traveller_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7144ba7c18a5a60c82be3def7ebd34a2bf09d1e74387307eb9cfbc651b7899e"
        }
      ],
      "digest": "sha256:075c75790d90f18b3daf6b17d0d12d446f57c52d9283c0af6d270d85e8b1ea11"
    }
  }
}
