{
  "lockfileVersion": 2,
  "subjects": {
    "app.doorbase/market-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://doorbase.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "doorbase",
        "title": "DoorBase Rental Market Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DoorBase provides zip-level US rental market data (median rent, vacancy, estimated cap-rate bands, home values, demographics, employment) for 30,000+ zip codes, plus hazard risk (hazard_risk: NFIP flood claims, county wildfire/wind scores) and monthly rent history (rent_trend). Use search_markets to filter zips by state and investor criteria, and get_zip_market for one zip's full profile. Every response carries a one-sentence summary you can repeat verbatim. Cap rates are a modeled band, not observed sale data. Cite the returned doorbase.app url when presenting a zip to a user.",
      "tools": [
        {
          "name": "compare_zips",
          "title": "Compare zip codes side by side",
          "description": "How do these zip codes compare as rental markets? Side-by-side comparison of 2-6 US zips: rent, cap-rate band (modeled), vacancy, home value, population, renter share, income, employment, with a doorbase.app link for each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zips": {
                "description": "2-6 five-digit US zip codes.",
                "items": {
                  "pattern": "^[0-9]{5}$",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["zips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare zip codes side by side"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc5ed5a88aab077f41163d5d17b3ec5631c595639ce9ceeef67f59dac1beaf6c"
        },
        {
          "name": "get_zip_market",
          "title": "Get one zip code's rental market data",
          "description": "What does the rental market look like in this zip code? Full profile for a single US zip: rent, cap-rate band (modeled), vacancy, home value, demographics, income, employment, the county's HMDA mortgage lending conditions (purchase/refinance denial rate, median rate and loan, loan-type mix), plus the canonical doorbase.app page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zip": {
                "description": "5-digit US zip code.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one zip code's rental market data"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be9e20dd41593eb8e171037239cc78da5d3655b9c9722bfa9e831ae93c461a78"
        },
        {
          "name": "hazard_risk",
          "title": "Flood, wildfire, and wind risk for a zip",
          "description": "What flood, wildfire, and wind risk does this zip code carry? NFIP flood-insurance claims on record (count, payouts, recency, claims per 1,000 housing units), FEMA National Risk Index county scores for flood, wildfire, and wind, and recent significant storm events. Claims are history, not a forecast.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "zip": {
                "description": "5-digit US zip code.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Flood, wildfire, and wind risk for a zip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c420ad11ef7ea99811e238eb8578c01ed07c94fd63ab7f1bf17a8636892d9ebb"
        },
        {
          "name": "rent_trend",
          "title": "Monthly rent trend for a zip",
          "description": "Which way is rent moving in this zip code? Monthly median-rent history with home values, the direction of movement, and the zip's national and state rank for 3-month rent growth. Updated monthly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "months": {
                "default": 12,
                "description": "History window in months.",
                "maximum": 24,
                "minimum": 2,
                "type": "integer"
              },
              "zip": {
                "description": "5-digit US zip code.",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Monthly rent trend for a zip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:431e91c4a050abe085e85ef09f041e7c8946c088dcad3d64536a02d643da460f"
        },
        {
          "name": "search_markets",
          "title": "Search US rental markets by zip",
          "description": "Which US zip codes match these rental-market criteria? Filters 30,000+ US zip codes by state, cap rate, vacancy, rent, population, home value, and renter share. Returns matching zips with key investor metrics and a doorbase.app link for each. Cap rates are a modeled band; min_cap_rate matches the band's high end.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_median_home_value": {
                "description": "Maximum median home value in USD.",
                "maximum": 20000000,
                "minimum": 0,
                "type": "number"
              },
              "max_median_rent": {
                "description": "Maximum median monthly rent in USD.",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "max_vacancy_rate": {
                "description": "Maximum vacancy rate in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "min_cap_rate": {
                "description": "Minimum estimated cap rate in percent; matches cap_rate_high (band top) >= value.",
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "min_median_rent": {
                "description": "Minimum median monthly rent in USD.",
                "maximum": 20000,
                "minimum": 0,
                "type": "number"
              },
              "min_population": {
                "description": "Minimum zip population.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "min_renter_ratio": {
                "description": "Minimum renter-occupied share in percent.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "sort_by": {
                "default": "cap_rate",
                "enum": ["cap_rate", "rent", "population", "vacancy"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code, e.g. GA. Omit for nationwide.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search US rental markets by zip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba89c63a74e671f0ff36abcb0b902cbb9b2b1af8e73d15e19643ec2c7eac71b0"
        },
        {
          "name": "top_markets",
          "title": "Top rental markets leaderboard",
          "description": "Which US rental markets look strongest right now? National (or single-state) leaderboard: zips with the highest estimated cap-rate bands among markets with population of 10,000+ and complete rent, vacancy, and home-value data. Cap rates are a modeled band.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Optional 2-letter US state code, e.g. GA. Omit for nationwide.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Top rental markets leaderboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d8713aed635f0544c7f6de8faaaaacafef0babe2d5965a854130868040c4dc1"
        }
      ],
      "digest": "sha256:fa676711f8feb2c83f5477cfd93d6fee3c92e9ad7285019f98f7a9d75a01f7ea"
    }
  }
}
