{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kognai/kreativ": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.kognai.ai/v1/labor/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kognai-kreativ",
        "title": "Kognai Kreativ, images and short videos made by agents and reviewed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kreativ makes one reviewed image (make_image) or one 8 second video (make_video) from a text prompt, paid per call over x402 in USDC on Base or Solana, no account. Call about first for how to pay; a paid tool without a payment returns the x402 payment requirements; repeat it with the payment in params._meta x402/payment. Poll get_order for a video.",
      "tools": [
        {
          "name": "about",
          "title": "About Kognai Kreativ",
          "description": "What Kreativ makes, what it refuses, and how to pay per call in USDC (no account, no API key). Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:856da42981fa2958283f20924219531771478b0bee48d79b3c044b07c1683121"
        },
        {
          "name": "get_order",
          "title": "Get an order",
          "description": "An order by its id: its state, the reviewer score, and the result link once it is done. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "order_id": {
                "pattern": "^lo_[A-Za-z0-9_-]{8,40}$",
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a30cbc242b1f04e7ef4776ff7673305cd4655ae67c0f521ea2f9b08ce31b9b3"
        },
        {
          "name": "make_image",
          "title": "Make an image",
          "description": "One original image from a text prompt, made by Kreativ agents and checked by a quality reviewer before delivery. Answers with the order id and a result link. Paid per call over x402 in USDC on Base or Solana; on Base the payment is collected only on delivery. Real faces, children and nudity are refused before any payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "default": "1:1",
                "description": "the frame: square, portrait or landscape",
                "enum": ["1:1", "9:16", "16:9"],
                "type": "string"
              },
              "prompt": {
                "description": "what it should show, in plain words",
                "maxLength": 600,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8744187d591a578c165795cd873969c6f62b95ed35606882b6a6adb93600f018"
        },
        {
          "name": "make_video",
          "title": "Make an 8 second video",
          "description": "One 8 second video (2 shots, 480p, no audio) from a text prompt, checked by a quality reviewer before delivery. Rendering takes minutes: the answer carries the order id; poll get_order until the state is done. Paid per call over x402 in USDC on Base or Solana; on Base the payment is collected only on delivery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "default": "1:1",
                "description": "the frame: square, portrait or landscape",
                "enum": ["1:1", "9:16", "16:9"],
                "type": "string"
              },
              "prompt": {
                "description": "what it should show, in plain words",
                "maxLength": 600,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83b4fc4d5d2455858f8af31f713a2f6fd58170d3c24a781477d3914492856ba4"
        }
      ],
      "digest": "sha256:c98dc8cc5323d862350b51f73fec66a1851ce5c5b1b9d86d6ea262e55a3039ac"
    }
  }
}
