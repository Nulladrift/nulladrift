        {
          "name": "get_coop_game",
          "title": "Look up a co-op game",
          "description": "Look up one game's co-op facts on CoopGamesDB: how many can play online and on one screen, whether it has online, split-screen, same-couch or LAN co-op, platforms, price per copy and for the whole group, its lowest price lately, Steam reviews, who it suits, store links, and where each fact comes from (facts nobody has confirmed yet are marked unverified). Use it for questions like \"is It Takes Two split screen?\", \"how many players can play Lethal Company?\", \"can you play Valheim online?\" or \"how much is Helldivers 2 for 4 of us?\". Also knows co-op games not out yet: their release date and how many players their developer states. Takes the name as people write it, and suggests the closest names when none matches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "The game’s name as people write it, such as \"It Takes Two\"; its CoopGamesDB address name works too.",
