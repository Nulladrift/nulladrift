      "instructions": "CoopGamesDB (coopgamesdb.com) is a curated database of co-op games: how many can play online and on one screen, how each game is played together (online, same couch, split screen, LAN), platforms, prices per copy from Steam's US store with current sales, Steam reviews, and new and upcoming co-op games. Use it when someone wants a game to play with friends, a partner or a group, or asks a co-op question about a game. Pass only what the person said and leave other arguments out. In your answer, give each game's CoopGamesDB link so people can check the details and decide together, and say so when a fact is marked unverified. Prices are per copy, in US dollars.",
      "tools": [
        {
          "name": "find_coop_games",
          "title": "Find co-op games for a group",
          "description": "Find co-op games to play with friends, a partner or a group, from CoopGamesDB's curated catalogue: by how many will play, their platforms, how they play together (online, same couch, split screen, LAN), price, genre, mood or theme, and sales. Use it for requests like \"4 player co-op games on PC\", \"split screen games for Switch\", \"free co-op games to play with friends\", \"cozy co-op games for couples\", \"co-op horror games on sale\" or \"what should the 3 of us play tonight?\". Each game comes with how many can play online and on one screen, its platforms, price per copy (US dollars, Steam's US store, sales included) and Steam review score; the answer also says how many games fit in all. Pass only what the person said: fewer filters find more games. Each game links its CoopGamesDB page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "genres": {
                "description": "Kinds of game: games with at least one of these genres.",
                "items": {
                  "enum": ["action", "shooter", "roguelike", "survival", "horror", "puzzle", "platformer", "adventure", "rpg", "strategy", "tower-defense", "simulation", "building", "party", "racing", "sports", "beat-em-up"],
                  "type": "string"
                },
                "maxItems": 17,
                "minItems": 1,
                "type": "array"
              },
              "limit": {
                "description": "How many games to list (6 unless asked).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "modes": {
                "description": "How the group plays together; a game must offer every one listed: \"online\", \"local\" (same couch), \"split\" (split screen), \"lan\".",
                "items": {
                  "enum": ["online", "local", "split", "lan"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "mood": {
                "description": "What the group feels like playing: \"wind-down\" (Cozy, slow, nobody yells), \"chaos\" (Shouting, physics and kitchen fires), \"scary\" (Horror, best with the lights off), \"brainy\" (Puzzles, plans and tower defense), \"adrenaline\" (Shooters, roguelikes and fast action), \"story\" (An adventure you finish together), \"survive\" (Crafting, bases and long nights), \"one-round\" (Short sessions and party games).",
                "enum": ["wind-down", "chaos", "scary", "brainy", "adrenaline", "story", "survive", "one-round"],
                "type": "string"
              },
              "onSale": {
                "description": "Only games with a discount right now.",
                "type": "boolean"
              },
              "platforms": {
                "description": "Platforms the group plays on: games on at least one of them. \"pc\" covers Steam and Windows.",
                "items": {
                  "enum": ["pc", "ps5", "xbox", "switch", "mac", "linux", "mobile", "ios", "android", "web"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "players": {
                "description": "How many people will play together: only games that fit a group this size.",
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "price": {
                "description": "The most one copy may cost, in US dollars on Steam’s US store (sale prices count): \"free\", \"under10\", \"under20\" or \"any\".",
                "enum": ["any", "under10", "under20", "free"],
                "type": "string"
              },
              "query": {
                "description": "A word or two to find in titles, developers, genres and themes, such as \"zombie\" or \"kart\"; not a sentence.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "description": "\"popular\" (the default: most liked first, by Steam reviews), \"most_players\", \"lowest_price\" or \"newest\" (newest on CoopGamesDB).",
                "enum": ["popular", "most_players", "lowest_price", "newest"],
                "type": "string"
              },
              "theme": {
                "description": "One theme, such as \"Cozy\", \"Zombies\", \"Farming\" or \"First person\".",
                "enum": ["Cooking", "Cozy", "Crafting", "Exploration", "Fantasy", "Farming", "First person", "Funny", "Hard", "Physics", "Pixel art", "Sandbox", "Sci-fi", "Space", "Story-rich", "Third person", "Zombies"],
                "type": "string"
              }
            },
            "type": "object"
          },
