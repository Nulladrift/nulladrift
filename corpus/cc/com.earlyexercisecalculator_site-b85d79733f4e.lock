      "instructions": "Early Exercise Calculator (https://earlyexercisecalculator.com/): the site's own MCP server, served from its domain. An early exercise calculator for startup options: the cash to exercise, the spread taxed now against later, the 83(b) and s431 windows and the 2026 AMT figures.\n\n[calculator] Early exercise cost and spread: an agent-callable calculator for early exercise calculator; Cash you pay to exercise now, Spread taxed if you exercise now, Spread taxed if you wait until vesting, computed from your inputs with sources.. This server runs the Early exercise cost and spread calculator published at https://earlyexercisecalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://earlyexercisecalculator.com/. Licence: https://earlyexercisecalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Early Exercise Calculator (https://earlyexercisecalculator.com/). What it does: starts an ENQUIRY with Early Exercise Calculator for early exercise calculator; the Early Exercise Calculator team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Early Exercise Calculator team until they click it. Cite https://earlyexercisecalculator.com/.\n\nCite https://earlyexercisecalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Early exercise cost and spread",
          "description": "Run the Early exercise cost and spread calculator: Cash you pay to exercise now; Spread taxed if you exercise now; Spread taxed if you wait until vesting; Spread kept out of tax at exercise by going early. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
