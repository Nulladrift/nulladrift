      "serverInfo": {
        "name": "AlohaCamp",
        "title": "AlohaCamp MCP",
        "version": "1.0.0",
        "description": "Outdoor stays on AlohaCamp.com: cabins, glamping, tiny houses, camping pitches in Poland, in PLN.",
        "websiteUrl": "https://mcps.wondel.ai/servers/alohacamp/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from AlohaCamp (https://alohacamp.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "alohacamp_property",
          "title": "Get one AlohaCamp property",
          "description": "Full details of one alohacamp.com property: address and coordinates, rating, description (Polish), location description, house rules, check-in/out times, cancellation policy, each unit type (capacity, rooms, beds, area), amenities, surroundings with distances, things to do, fees, meals, photos, recent reviews and nearby properties. With date_from/date_to it also prices the stay for the party: per unit whether it fits, how many are free, the minimum stay, the exact total and nightly price (PLN, incl. AlohaCamp's service fee), plus a booking link. Get the slug from alohacamp_search. Fetched live from alohacamp.com (typically 1–2 s via direct fetch; a few seconds more right after AlohaCamp deploys, or when it falls back to an unblocker). Result: { source, fetchedAt, property: { id, slug, name, url, address, lat, lng, rating, review_count, indicative_price_per_night, currency, check_in, check_in_until, check_out, free_cancellation, free_cancellation_hours, description, location_description, house_rules, units, amenities, surroundings, things_to_do, getting_there, fees, meals_available, meals_included, host, photos, recent_reviews, nearby }, stay?: { date_from, date_to, nights, adults, children, infants, pets, booking_url, units: [{ name, type, fits_party, available_units, min_nights, max_guests, total_price, price_per_night, price_from_per_night, extra_fees }], note? } }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adults. Default 2.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "description": "Children. Default 0.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "date_from": {
                "description": "Check-in date, YYYY-MM-DD — pass with date_to to price the stay.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Check-out date, YYYY-MM-DD, after date_from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "infants": {
                "description": "Infants (babies) — AlohaCamp does not count them toward a unit's capacity. Default 0.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "pets": {
                "description": "Pets travelling along; > 0 also limits results to pet-friendly places. Default 0.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "property": {
                "description": "The property's slug from alohacamp_search (e.g. 'masuria-lakehouse-518'), its alohacamp.com URL, or its numeric id.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67bc2966cd24381635151232b386313d1181313e3999ed4d3b987ebbee2d3b99"
        },
        {
          "name": "alohacamp_search",
          "title": "Search AlohaCamp outdoor stays (cabins, glamping, camping)",
          "description": "Search alohacamp.com, the Polish marketplace for stays in nature: cabins and houses (domki), tiny houses, treehouses, houseboats, yurts, glamping tents, agritourism, and camping pitches (pola namiotowe, caravan pitches), mostly in Poland. Filter by place (a region like Mazury/Bieszczady/Kaszuby, a city, a country) or voivodeship, check-in/check-out dates and party (with dates, only places free for that party are returned, priced for those nights), property type, amenities, surroundings, nightly price and free cancellation. Returns one page of 30 in AlohaCamp's recommended order; pass a property `slug` to alohacamp_property for details and exact per-unit prices. Fetched live from alohacamp.com (typically 1–2 s via direct fetch; a few seconds more right after AlohaCamp deploys, or when it falls back to an unblocker). Result shape: { source, fetchedAt, query, search_url, resolved_location, total_count, page, total_pages, count, nights, properties: [...], note? } — the list key is `properties`; `total_count` counts matches across all pages (use `page` for more). Each property: { id, slug, name, url, city, region, country, lat, lng, property_types, units, max_guests, units_for_party, price_per_night, club_price_per_night, total_price_estimate, currency, rating, review_count, image, photos_count, guests_choice, is_new, only_on_alohacamp, free_cancellation, meals_available, meals_included, extra_fees }. Prices are numbers in PLN: `price_per_night` is the lowest nightly price for the whole party (with dates, the average over those nights; `units_for_party` > 1 means it covers several units), `total_price_estimate` = price_per_night × nights (null without dates; fees in `extra_fees` are paid on top), `club_price_per_night` is a lower members-only price when there is one. `rating` is 0–5 (null without reviews). An empty match answers count: 0 with a `note` saying why and what to change — that is a successful result, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Adults. Default 2.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "amenities": {
                "description": "Must have all of these: sauna, hot_tub (balia), jacuzzi, pool, fireplace, air_conditioning, grill, campfire, wifi, workspace, washing_machine, playground, crib, adults_only; for campsites electric_hookup, shower, toilet, running_water.",
                "items": {
                  "enum": ["sauna", "hot_tub", "jacuzzi", "pool", "fireplace", "air_conditioning", "grill", "campfire", "wifi", "workspace", "washing_machine", "playground", "crib", "adults_only", "electric_hookup", "shower", "toilet", "running_water"],
                  "type": "string"
                },
                "type": "array"
              },
              "children": {
                "description": "Children. Default 0.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "date_from": {
                "description": "Check-in date, YYYY-MM-DD, today or later. Pass together with date_to; without dates prices are the lowest 'from' prices and availability is not checked.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Check-out date, YYYY-MM-DD, after date_from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "free_cancellation": {
                "description": "Only places with free cancellation. Default false.",
                "type": "boolean"
              },
              "infants": {
                "description": "Infants (babies) — AlohaCamp does not count them toward a unit's capacity. Default 0.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "location": {
                "description": "Where, resolved by AlohaCamp's own place search: a region ('Mazury', 'Bieszczady', 'Kaszuby', 'Roztocze'), a city ('Zakopane', 'Kraków' — covers the area around it) or a country ('Chorwacja'). Polish names work best. Omit to search everywhere. Not combinable with region.",
                "minLength": 1,
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh fetch and bypass this server's result cache (5 min). Default false.",
                "type": "boolean"
              },
              "page": {
                "description": "Results page, 1-based (30 per page). Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "Pets travelling along; > 0 also limits results to pet-friendly places. Default 0.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "price_max": {
                "description": "Maximum nightly price in PLN.",
                "minimum": 0,
                "type": "number"
              },
              "price_min": {
                "description": "Minimum nightly price in PLN.",
                "minimum": 0,
                "type": "number"
              },
              "property_types": {
                "description": "Only these kinds of stay: 'house' (domek/dom), 'tiny_house', 'tree_house', 'house_on_water' (houseboat), 'yurt', 'glamping_tent', 'agritourism' (agroturystyka/guesthouse), 'hotel', 'camper_rental' (a camper to rent), 'caravan_pitch' (a pitch for your own campervan/caravan), 'tent_pitch' (pole namiotowe). Default: everything except the two camping pitches — pass ['tent_pitch'] or ['caravan_pitch'] to search campsites.",
                "items": {
                  "enum": ["house", "tiny_house", "tree_house", "house_on_water", "yurt", "glamping_tent", "agritourism", "hotel", "camper_rental", "caravan_pitch", "tent_pitch"],
                  "type": "string"
                },
                "type": "array"
              },
              "region": {
                "description": "A whole voivodeship instead of a place, e.g. 'warminsko-mazurskie', 'malopolskie'.",
                "enum": ["dolnoslaskie", "kujawsko-pomorskie", "lubelskie", "lubuskie", "lodzkie", "malopolskie", "mazowieckie", "opolskie", "podkarpackie", "podlaskie", "pomorskie", "slaskie", "swietokrzyskie", "warminsko-mazurskie", "wielkopolskie", "zachodniopomorskie"],
                "type": "string"
              },
              "surroundings": {
                "description": "Must be near all of these: forest, lake, mountains, sea, river, nature_reserve, village.",
                "items": {
                  "enum": ["forest", "lake", "mountains", "sea", "river", "nature_reserve", "village"],
                  "type": "string"
                },
                "type": "array"
              }
