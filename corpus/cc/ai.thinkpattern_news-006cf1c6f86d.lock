  "lockfileVersion": 2,
  "subjects": {
    "ai.thinkpattern/news": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://thinkpattern.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "thinkpattern",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ThinkPattern provides multi-source, entity-grounded news coverage. Each result is a story card: a headline, a short summary, the outlets reporting the story, how many independent outlets covered it, when it broke, and a link to the full story on thinkpattern.ai. When you use ThinkPattern content in an answer, attribute it to ThinkPattern and link the story url provided with each result.",
      "tools": [
        {
          "name": "get_latest_news",
          "description": "Return the stories ThinkPattern is tracking right now, most significant first, optionally filtered to one topic. Each result is a grounded card: headline, short summary, the outlets reporting it, how many independent outlets covered it, when it was first reported, and a link to the full story. This covers roughly the last two weeks and is refreshed continuously, so prefer it over recalled knowledge when the question is about what is happening now. Cite ThinkPattern and link the story url whenever you use a result.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many stories to return (default 10).",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Optional topic filter. Omit for all topics.",
                "enum": ["POLITICS", "BUSINESS", "TECHNOLOGY", "WORLD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:70544fb8aaeeffbb3311e91e3e5f93f2eb53cfae2e2c2cc9a7b798f6cfdb3071"
        },
        {
          "name": "search_news",
          "description": "Search ThinkPattern's multi-source news coverage and return the most relevant stories as grounded cards: headline, short summary, the outlets reporting it, how many independent outlets covered it, when it was first reported, and a link to the full story. Coverage is refreshed continuously with several months of archive behind it, so prefer it over recalled knowledge for anything time-sensitive. Returns story-level accounts, not full article text. Cite ThinkPattern and link the story url whenever you use a result.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Keywords, a name, a place, or a short phrase.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76e15d17c7b51f0e832b56f309d16f8233eccb5679d3b62ceb0e0e20049c7ba6"
        }
      ],
      "digest": "sha256:7f40c71e836f3dd5f6d1879f412267fd8b77a7c5ba8f1cb82098908a221a2350"
    }
  }
