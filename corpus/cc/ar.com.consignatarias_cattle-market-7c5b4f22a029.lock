        {
          "name": "price_seasonality",
          "title": "Estacionalidad del novillo en dólares",
          "description": "En qué mes del año la hacienda está típicamente cara o barata, y dónde está HOY contra esa norma. Índice estacional del INMAG EN DÓLARES desde 2015 (razón sobre media móvil centrada de 12 meses, mediana entre años, normalizado a 1,00). Contesta \"¿conviene comprar ahora o esperar?\" — que es lo que el precio del día NO contesta. Args: mes (YYYY-MM, opcional; default el último con índice). Se calcula en dólares a propósito: en pesos mediría la inflación, no el ciclo. [EN] Which month Argentine cattle is typically cheap or expensive, and where it stands today against that norm. Seasonal index on the USD series since 2015.",
