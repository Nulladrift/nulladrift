          "description": "¿Se está abriendo o cerrando la dispersión de precios? Serie histórica de la BANDA observada (VR v1.0): cómo evolucionó el rango P10–P90 por categoría en el Mercado Agroganadero. Es la pregunta que el precio puntual NO puede contestar — amplitud y mediana se mueven independientemente, así que una dispersión que se abre mientras el precio hace otra cosa es señal de riesgo que no se deriva del precio. GRATIS los últimos 30 días y también hacia atrás sin techo, gratis y sin cupo (la ventana publicada en /banda es solo el default). Params: dias (default 30), categoria (opcional). Valor de HOY → livestock_prices; valuar una tropa → value_cattle_lot. [EN] Is the market widening or tightening? Historical series of the observed P10-P90 price band by category in the Argentine reference market.",
