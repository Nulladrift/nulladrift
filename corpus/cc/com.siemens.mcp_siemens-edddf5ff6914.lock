        {
          "name": "siemens_developer_search",
          "title": "Search Siemens developer documentation",
          "description": "Searches the Siemens Developer Portal (developer.siemens.com): API references, SDK guides, authentication, getting-started tutorials and changelogs for Siemens platforms such as Insights Hub, Industrial Edge, Building X, Polarion, Senseye and the Industrial AI Suite. Use it for technical questions about Siemens APIs and developer tools (\"How do I authenticate against the Insights Hub API?\", \"Industrial Edge app SDK\"). Returns the best-matching documentation sections with url and a snippet; read a full page with siemens_get_web_content. Do not use it for marketing, company or product-catalog questions (use siemens_search).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "maxResults": {
                "description": "Documentation sections to return. Default 8, range 1-25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Zero-based index of the first result, for paging. Default 0. Pass \"next_offset\" from the previous response.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "portalUrl": {
                "description": "Base URL of another Siemens Developer Portal instance, for example a merge request review deployment (https://developer.code.siemens.io/...). Must be https and on the server allowlist. Omit for https://developer.siemens.com/.",
                "maxLength": 2048,
                "type": "string"
              },
              "product": {
                "description": "Restrict to one product area, by name or slug. Examples: \"insights-hub\", \"industrial-edge\", \"building-x-openness\", \"polarion\", \"senseye\". Omit to search everything. An unknown value returns the list of valid product areas.",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Technical keywords or question. Examples: \"OAuth token technical user\", \"time series API\", \"edge app docker compose\", \"webhook events\".",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "description": "Result verbosity. \"concise\" (default) returns only the fields needed to answer and cite (title, url, short description). \"detailed\" adds secondary metadata such as scores, thumbnails and keywords. Use \"detailed\" only when you need those fields.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "hint": {
                "type": "string"
              },
              "next_offset": {
                "type": ["number", "null"]
              },
              "offset": {
                "type": "number"
              },
