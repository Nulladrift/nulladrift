      "instructions": "Public Siemens information: products, solutions, news, media assets and developer documentation. All tools are read-only.\nChoose by intent:\n- Questions about Siemens, its businesses, products or industries: siemens_search (answer, pages, products, articles and partner offerings; narrow with scope \"pages\", \"products\", \"articles\" or \"partners\").\n- The article number (MLFB) of a product: siemens_search with scope \"articles\".\n- Third-party solutions from Siemens Xcelerator Marketplace partners: siemens_search with scope \"partners\" (filter by \"industry\" or \"sellerRegion\"). Attribute each to its \"partner\"; never call it a Siemens product.\n- Technical data of an article number, such as ratings, currents or dimensions: siemens_product_datasheet.\n- Images, videos, documents or press material: siemens_assets.\n- APIs, SDKs and developer documentation: siemens_developer_search (filter by product to narrow to one API).\n- The full text of a known siemens.com page: siemens_get_web_content with its URL, usually after a search returned the link.\nStart with a search tool, then fetch details. Cite the returned URLs. Results reflect public content only; the resource siemens://docs/scope documents what each tool covers.",
      "tools": [
        {
          "name": "siemens_assets",
          "title": "Search Siemens images, videos and documents",
          "description": "Finds publicly released Siemens media in the Web Asset Pool: photos, videos, PDFs and other documents, audio and icons. Use it when the user needs a picture, video, logo, icon or downloadable document, for example for a presentation, article or web page. Each result includes the usage rights (unlimited, limited or restricted), whether approval is required, the required credit line, a preview image and download URLs in several sizes (small, medium, large, original). Always tell the user the usage rights and credit before they reuse an asset. Filter with usageRights \"UNLIMITED\" when the asset is for external or third-party use. Do not use it for text answers about Siemens (use siemens_search) or for developer documentation (use siemens_developer_search).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assetType": {
                "description": "Kind of asset. Default \"ALL\". Use \"IMAGES\" for photos and illustrations, \"VIDEOS\", \"DOCUMENTS\" for PDFs and office files, \"AUDIO\", or \"ICONS\".",
                "enum": ["ALL", "IMAGES", "VIDEOS", "DOCUMENTS", "AUDIO", "ICONS"],
                "type": "string"
              },
              "collection": {
                "description": "Collection to search. Default \"ALL\" (the main Siemens DAM). \"PRESS\" for press photos, \"ENERGY\" for Siemens Energy media.",
                "enum": ["ALL", "ASSETS", "PRESS", "ENERGY"],
                "type": "string"
              },
              "imageSize": {
                "description": "Filter images by original resolution. Default \"ANY\". \"SMALL\": under 1024x1024 px, \"MEDIUM\": over 1024x1024 px, \"LARGE\": over 2448x2448 px (print quality). Every result still offers several download sizes.",
                "enum": ["ANY", "SMALL", "MEDIUM", "LARGE"],
                "type": "string"
              },
              "maxResults": {
                "description": "Assets to return in this call. Default 10, range 1-50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Zero-based index of the first asset, for paging. Default 0. Pass \"next_offset\" from the previous response.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "orientation": {
                "description": "Filter images and videos by orientation. Default \"ANY\".",
                "enum": ["ANY", "LANDSCAPE", "PORTRAIT", "SQUARE"],
                "type": "string"
              },
              "query": {
                "description": "Keywords describing the asset content, in English. Examples: \"wind turbine offshore\", \"SIMATIC S7-1500\", \"factory automation robot\", \"Siemens logo\". Use * for partial matches, for example \"turbin*\".",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "description": "Result verbosity. \"concise\" (default) returns only the fields needed to answer and cite (title, url, short description). \"detailed\" adds secondary metadata such as scores, thumbnails and keywords. Use \"detailed\" only when you need those fields.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "usageRights": {
                "description": "Only return assets with this usage-rights level. Default \"ANY\". \"UNLIMITED\": Siemens holds all rights including transfer to third parties. \"LIMITED\": usable with limitations. \"RESTRICTED\": not for external material.",
                "enum": ["ANY", "UNLIMITED", "LIMITED", "RESTRICTED"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
