                      "type": "string"
                    },
                    "relevance_score": {
                      "type": "number"
                    },
                    "source": {
                      "type": "string"
                    },
                    "thumbnail": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
