        {
          "name": "siemens_search",
          "title": "Search Siemens (answer, pages, products, articles)",
          "description": "The search tool for any question about Siemens: products, industries, news, careers, references. \"scope\" picks what comes back. \"all\" (default) runs in parallel: an AI answer with source links, siemens.com pages (\"results\"), product family pages (\"products\"), orderable SiePortal articles (\"articles\") and Xcelerator Marketplace partner offerings (\"partners\"). Use it first for any Siemens question. Other scopes return one list, paged by offset/next_offset. \"articles\" finds article numbers (MLFB) for siemens_product_datasheet. \"products\" filters the product catalog by \"industry\", \"topic\", \"seller\". \"partners\": third-party offerings, never Siemens products; \"sellers\": partner firms, by \"sellerRegion\" or \"motion\". \"references\": customer references by keyword, with \"industry\", \"country\", \"customer\". \"collection\" limits pages and answer to sources (\"mobility\", \"news\", \"press\", \"trainings\"...), one or a list. Read a page in full with siemens_get_web_content. Do not use it for images, videos or logos (use siemens_assets) or for API and SDK developer documentation (use siemens_developer_search). Results are public Siemens content only. Cite the returned URLs; do not invent links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "collection": {
                "anyOf": [
                  {
                    "enum": ["siemens_com", "mobility", "news", "press", "resources", "advanta", "references", "trainings"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "enum": ["siemens_com", "mobility", "news", "press", "resources", "advanta", "references", "trainings"],
                      "type": "string"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Search only these content collections, one name or a list ([\"press\",\"news\"] for press releases and news articles): \"siemens_com\" (web pages of www.siemens.com (products, solutions, industries, company, insights, success stories), per country site), \"mobility\" (web pages of mobility.siemens.com (rail vehicles, rail infrastructure, signaling, services, Mobility newsroom), global and per country site), \"news\" (news articles and stories from news.siemens.com), \"press\" (press releases and features from press.siemens.com, global and per country), \"resources\" (white papers, brochures, fact sheets, case studies and on-demand webinars from resources.sw.siemens.com and webinars.sw.siemens.com, mostly Siemens Digital Industries Software), \"advanta\" (consulting offerings, client cases and blog of Siemens Advanta (siemens-advanta.com, English only)), \"references\" (customer references and success stories from references.siemens.com (externally released projects only)), \"trainings\" (training courses from SITRAIN (sitrain.siemens.com) and Siemens Digital Industries Software training (training.plm.automation.siemens.com)). Omit to search all Siemens content. Implies scope \"pages\" (an AI answer from the collections on the first page, then paged results); other scopes reject it. \"region\" works as everywhere else: \"GLOBAL\" for international content or a country code."
              },
              "country": {
                "description": "Scope \"references\" only: Country of the project, in English. Examples: \"Germany\", \"China\", \"United States of America\". Valid values are in \"facets.countries\".",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "customer": {
                "description": "Scope \"references\" only: Customer name or part of it, case-insensitive. Examples: \"BMW\", \"Heineken\".",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "industry": {
                "description": "Scopes \"partners\", \"products\", \"sellers\" and \"references\": keep results of this industry, case-insensitive. Partners, products and sellers share the ecosystem values (\"Automotive\", \"Machine building\", \"Food and beverages\"); references use their own (\"Automotive\", \"Consumer Packaged Goods / Beverage\", \"Beverage\"). Valid values are in \"facets.industries\" of that scope.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Two-letter content language code, uppercase. Default \"EN\". Examples: \"EN\", \"DE\", \"FR\", \"ES\", \"ZH\". Use the language the user writes in when Siemens publishes content in it.",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "maxResults": {
                "description": "Results to return. Default 10. Scope \"all\": total of pages and products (about 60/40, range 2-30), plus as many articles and partner offerings as products. \"pages\": range 1-50. \"products\", \"articles\", \"partners\" and \"references\": range 1-30.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "motion": {
                "description": "Scope \"sellers\" only: how the partner works with Siemens. \"Build\" (builds solutions on Siemens technology), \"Service\" (implements and supports), \"Sell\" (resells).",
                "enum": ["Build", "Service", "Sell"],
                "type": "string"
              },
              "offset": {
                "description": "Zero-based index of the first result to return, for paging. Default 0. To get the next page, pass the \"next_offset\" value from the previous response.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "organization": {
                "description": "Scope \"references\" only: Siemens business that contributed the reference, by code or name. Examples: \"DI\", \"Smart Infrastructure\", \"SI B\", \"Siemens Mobility\". Valid values are in \"facets.organizations\".",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "portfolio": {
                "description": "Scope \"references\" only: Siemens portfolio, or \"portfolio / area\". Examples: \"Digital Industries / Industrial automation\", \"Smart Infrastructure / Fire Safety\". Valid values are in \"facets.portfolios\".",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "What to search for, in natural language or keywords. Examples: \"What is Teamcenter?\", \"SIMATIC S7-1500 CPU\", \"digital twin in automotive manufacturing\". Do not add years or site names; the search already covers siemens.com.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Country/region of the content, uppercase. Default \"GLOBAL\" (international pages). Examples: \"GLOBAL\", \"DE\", \"US\", \"GB\", \"IN\", \"CN\". Only set a country when the user asks about that market.",
                "maxLength": 6,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "description": "Result verbosity. \"concise\" (default) returns only the fields needed to answer and cite (title, url, short description). \"detailed\" adds secondary metadata such as scores, thumbnails and keywords. Use \"detailed\" only when you need those fields.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "scope": {
                "description": "What to return: \"all\" (default: answer, pages, products, articles and partner offerings), \"pages\" (siemens.com content pages, with the AI answer on the first page), \"products\" (product family pages and articles; with \"industry\", \"topic\" or \"seller\" the offerings of the siemens.com product catalog, Siemens' and partners', without articles), \"articles\" (orderable SiePortal articles with article numbers) or \"partners\" (third-party offerings on the Siemens Xcelerator Marketplace, with facets), \"sellers\" (partner companies of the Siemens Ecosystem Explorer, with facets) or \"references\" (customer references from references.siemens.com through the platform's keyword search, with filters and facets; put one or two keywords such as a product into \"query\" and industry, country or customer into the filters).",
                "enum": ["all", "pages", "products", "articles", "partners", "references", "sellers"],
                "type": "string"
              },
              "seller": {
                "description": "Scopes \"products\" and \"partners\": keep offerings of this seller, case-insensitive: a Siemens unit (\"Siemens\", \"Siemens Industry Software\", \"Siemens Advanta\") or a partner (\"CLEVR\", \"DMG MORI\"). Valid values are in \"facets.sellers\".",
                "maxLength": 150,
                "minLength": 2,
                "type": "string"
              },
              "sellerRegion": {
                "description": "Scopes \"partners\" and \"sellers\": keep partners that serve this country or region, case-insensitive. Examples: \"Germany\", \"USA\", \"United Kingdom\", \"India\". Valid values are listed in \"facets.seller_regions\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "summaryLevel": {
                "description": "Length of the AI answer for scope \"all\" and on the first page of scope \"pages\". Default \"medium\". Use \"short\" for quick facts, \"detailed\" for explanations.",
                "enum": ["short", "medium", "detailed"],
                "type": "string"
              },
              "tag": {
                "description": "Scope \"references\" only: Special tag. Examples: \"Sustainability\", \"Siemens Xcelerator\". Valid values are in \"facets.tags\".",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "description": "Scopes \"partners\", \"products\" and \"sellers\": keep results tagged with this topic, case-insensitive. Examples: \"Sustainability\", \"Efficiency\", \"Cybersecurity\", \"Asset management\". Valid values are in \"facets.topics\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
