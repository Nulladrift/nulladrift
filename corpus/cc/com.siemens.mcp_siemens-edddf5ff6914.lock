        {
          "name": "siemens_search",
          "title": "Search Siemens (answer, pages, products, articles)",
          "description": "The search tool for any question about Siemens: companies, businesses, products, solutions, industries, news, careers or sustainability on siemens.com. \"scope\" picks what comes back. \"all\" (default) runs everything in parallel: an AI-generated answer with source links, siemens.com pages (\"results\"), product family pages (\"products\"), orderable SiePortal articles (\"articles\") and Xcelerator Marketplace partner offerings (\"partners\"). Use it first for any Siemens question. The other scopes return one list and page with offset/next_offset. Use \"articles\" to find the article number (MLFB) of a product, then siemens_product_datasheet for its technical data. Use \"partners\" for third-party solutions, filtered by \"industry\" or \"sellerRegion\"; partner offerings belong to the named partner, never call them Siemens products. Read a page in full with siemens_get_web_content. Do not use it for images, videos or logos (use siemens_assets) or for API and SDK developer documentation (use siemens_developer_search). Results are public Siemens content only. Cite the returned URLs; do not invent links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "industry": {
                "description": "Scope \"partners\" only: keep offerings tagged with this industry, case-insensitive. Examples: \"Automotive\", \"Pharma and life science\", \"Food and beverages\", \"Commercial buildings\". Valid values are listed in \"facets.industries\" of a partners response.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Two-letter content language code, uppercase. Default \"EN\". Examples: \"EN\", \"DE\", \"FR\", \"ES\", \"ZH\". Use the language the user writes in when Siemens publishes content in it.",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "maxResults": {
                "description": "Results to return. Default 10. Scope \"all\": total of pages and products (about 60/40, range 2-30), plus as many articles and partner offerings as products. \"pages\": range 1-50. \"products\", \"articles\" and \"partners\": range 1-30.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Zero-based index of the first result to return, for paging. Default 0. To get the next page, pass the \"next_offset\" value from the previous response.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, in natural language or keywords. Examples: \"What is Teamcenter?\", \"SIMATIC S7-1500 CPU\", \"digital twin in automotive manufacturing\". Do not add years or site names; the search already covers siemens.com.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "Country/region of the content, uppercase. Default \"GLOBAL\" (international pages). Examples: \"GLOBAL\", \"DE\", \"US\", \"GB\", \"IN\", \"CN\". Only set a country when the user asks about that market.",
                "maxLength": 6,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "description": "Result verbosity. \"concise\" (default) returns only the fields needed to answer and cite (title, url, short description). \"detailed\" adds secondary metadata such as scores, thumbnails and keywords. Use \"detailed\" only when you need those fields.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "scope": {
                "description": "What to return: \"all\" (default: answer, pages, products, articles and partner offerings), \"pages\" (siemens.com content pages, with the AI answer on the first page), \"products\" (product family pages and articles), \"articles\" (orderable SiePortal articles with article numbers) or \"partners\" (third-party offerings on the Siemens Xcelerator Marketplace, with facets).",
                "enum": ["all", "pages", "products", "articles", "partners"],
                "type": "string"
              },
              "sellerRegion": {
                "description": "Scope \"partners\" only: keep offerings of partners that sell in this country or region, case-insensitive. Examples: \"Germany\", \"USA\", \"United Kingdom\", \"India\", \"North America\". Valid values are listed in \"facets.seller_regions\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "summaryLevel": {
                "description": "Length of the AI answer for scope \"all\" and on the first page of scope \"pages\". Default \"medium\". Use \"short\" for quick facts, \"detailed\" for explanations.",
                "enum": ["short", "medium", "detailed"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "answer": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "sources": {
                        "items": {
