      "serverInfo": {
        "name": "siemens-mcp-server",
        "title": "Siemens MCP Server",
        "version": "2026-11-11-6b74c2e",
        "description": "Public Siemens information for AI agents: search across siemens.com, product articles and datasheets, web pages, media assets and developer documentation. Read-only.",
        "websiteUrl": "https://siemens.ghe.com/open/mcp"
      },
      "capabilities": {
        "completions": {},
        "logging": {},
        "prompts": {},
        "resources": {},
        "tools": {}
