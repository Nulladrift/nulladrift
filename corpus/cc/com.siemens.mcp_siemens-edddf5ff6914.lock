                        },
                        "type": "array"
                      },
                      "text": {
                        "type": "string"
                      }
                    },
                    "required": ["sources", "text"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "articles": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
