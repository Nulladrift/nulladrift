          "digest": "sha256:0a3c54726959bebec1b1a4ad9f46618868b318c631ec383ca55c80ed253cbcf0"
        },
        {
          "name": "draft_llms_txt",
          "title": "Draft an llms.txt file",
          "description": "Drafts a starter llms.txt (llmstxt.org) for a site from its home page and sitemap: an H1 with the site name, its description as the summary, and links to its main pages grouped by section, titled from the pages where they were fetched. Use it when the site has no llms.txt or a broken one. result has llmsTxt (the file text), saveAs (where it goes), links, sitemapUrls and existingLlmsTxt (the outcome of the current one). The person should edit it before publishing. Returns JSON: summary (one sentence), reportUrl (a shareable report page for the person, kept 30 days; null for tools that keep none) and result (the details below). Errors come back as one plain sentence. Recorded: the checked domain and path (never the query string), the tool, which checks failed and the app name; never an IP address or page text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "maxLinks": {
                "description": "The most page links to include, 5 to 50. Defaults to 25.",
                "maximum": 50,
                "minimum": 5,
                "type": "integer"
              },
              "url": {
                "description": "Any page on the site; only its origin is used: an absolute http or https URL, such as https://example.com/pricing.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Draft an llms.txt file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
