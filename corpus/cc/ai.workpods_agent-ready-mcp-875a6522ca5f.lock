      "instructions": "Agent Ready Website Audit runs SEO and AI search audits of public web pages, the way search engines, AI answer engines and AI agents read them, and drafts fixes (llms.txt, robots.txt rules, schema markup). It needs no account and runs no AI model: the checks are deterministic, and you explain them. Share the reportUrl each check returns. Rankings, keyword data and how AI answers mention a brand are out of scope; request_full_audit files a WorkPods audit request when the person asks for one.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "Check AI agent readiness",
          "description": "Checks whether AI agents can use a page and its site: labelled forms and buttons, declared WebMCP tools, a Markdown version (content negotiation or a Link header), the agent files and MCP server cards under /.well-known, and whether the domain has an MCP server listed in the official MCP Registry. Use it when the person asks whether agents can complete tasks on the site or find its MCP server. result has checks (the agent checks with status and summary), webMcpTools, markdownVersion, agentFiles and mcpRegistry (listings by name, website or endpoint; null when the registry could not be read, an empty list when nothing is listed). Registry lookups are cached 6 hours. These are deterministic checks of public pages fetched by Agent Ready Website Audit, with no AI model and no account. They do not cover rankings, keyword volumes, backlinks or how AI answers mention the brand. Returns JSON: summary (one sentence), reportUrl (a shareable report page for the person, kept 30 days; null for tools that keep none) and result (the details below). Errors come back as one plain sentence. Recorded: the checked domain and path (never the query string), the tool, which checks failed and the app name; never an IP address or page text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "The page to check, usually the home page or a task page: an absolute http or https URL, such as https://example.com/pricing.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI agent readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e6160a3ca8a1b72f6f075fef5f77893c97518ee84d848975843ce38f008258c3"
        },
        {
          "name": "check_ai_crawler_access",
          "title": "Check AI crawler access",
          "description": "Checks whether AI crawlers such as GPTBot, ClaudeBot and PerplexityBot may read one page, from robots.txt, the robots meta tags (including ones naming the crawler), the X-Robots-Tag header and the HTTP status. Use it when the person asks whether ChatGPT, Claude, Perplexity or Google can see a page, or whether blocked crawlers explain why the site is missing from AI answers. result.bots lists each crawler with verdict: readable, readable_not_for_index (it may fetch the page but is asked not to index it), blocked_by_robots_txt or page_unavailable, plus robotsTxtAllows and the pageDirectives found. Firewalls that block crawlers by user agent or IP are not visible from here. These are deterministic checks of public pages fetched by Agent Ready Website Audit, with no AI model and no account. They do not cover rankings, keyword volumes, backlinks or how AI answers mention the brand. Returns JSON: summary (one sentence), reportUrl (a shareable report page for the person, kept 30 days; null for tools that keep none) and result (the details below). Errors come back as one plain sentence. Recorded: the checked domain and path (never the query string), the tool, which checks failed and the app name; never an IP address or page text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bot": {
                "description": "One robots.txt product token, such as GPTBot, ClaudeBot or PerplexityBot. Defaults to every AI crawler Agent Ready tracks.",
                "maxLength": 60,
                "type": "string"
              },
              "url": {
                "description": "The page to ask about: an absolute http or https URL, such as https://example.com/pricing.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI crawler access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c4af32bb3b97b0fd3d94cf53481843436d21978dc0551c24157be94c519860a5"
        },
        {
          "name": "check_local_seo_details",
          "title": "Check local SEO details",
          "description": "Local SEO check of a business's website: whether the page states the business name, address and phone the person gives (NAP consistency), and whether it has LocalBusiness schema, click-to-call links and an embedded Google map. Use it for local SEO questions about a shop, clinic, restaurant or office's website. result has name, address and phone, each with status match, mismatch, not_found or profile_missing (no value given) and what the site states, localSchema (types and missing fields; null when there is none), telLinks and embeddedMap. It does not read the Google Business Profile itself. These are deterministic checks of public pages fetched by Agent Ready Website Audit, with no AI model and no account. They do not cover rankings, keyword volumes, backlinks or how AI answers mention the brand. Returns JSON: summary (one sentence), reportUrl (a shareable report page for the person, kept 30 days; null for tools that keep none) and result (the details below). Errors come back as one plain sentence. Recorded: the checked domain and path (never the query string), the tool, which checks failed and the app name; never an IP address or page text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "The street address on one line, such as \"12 Main St, Springfield, IL 62701\". Defaults to none, which leaves the address unchecked.",
                "maxLength": 300,
                "type": "string"
              },
              "name": {
                "description": "The business name, as on its signage.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "The phone number in any format, such as \"+1 217 555 0100\". Defaults to none, which leaves the phone unchecked.",
                "maxLength": 40,
                "type": "string"
              },
              "url": {
                "description": "The business's page, usually its home or contact page: an absolute http or https URL, such as https://example.com/pricing.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check local SEO details"
