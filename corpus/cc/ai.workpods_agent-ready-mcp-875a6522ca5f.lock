              "competitorUrl": {
                "description": "The competitor's page for the same search or task: an absolute http or https URL, such as https://example.com/pricing.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "url": {
                "description": "The person's own page: an absolute http or https URL, such as https://example.com/pricing.",
                "format": "uri",
