          "digest": "sha256:d309bf798cbd4d430da1cdbaf54ea8f1968924aca6684eea34719348a9f1d3bb"
        },
        {
          "name": "draft_robots_txt_for_ai_crawlers",
          "title": "Draft robots.txt rules for AI crawlers",
          "description": "Drafts robots.txt groups for the AI crawlers Agent Ready tracks, and a Content-Signal line, from what the site owner wants: crawlers that index for AI search, crawlers that fetch a page because a user asked, and crawlers that collect training data, each allowed or blocked, with per-crawler overrides. It fetches nothing. Use it after check_robots_sitemap_llms_txt or check_ai_crawler_access shows crawlers blocked or allowed against the owner's wishes. result has robotsTxt (the lines to merge), contentSignal, decisions (each crawler with its role and choice) and unknownOverrides (tokens not recognised). Returns JSON: summary (one sentence), reportUrl (a shareable report page for the person, kept 30 days; null for tools that keep none) and result (the details below). Errors come back as one plain sentence.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "overrides": {
                "additionalProperties": {
                  "enum": ["allow", "block"],
                  "type": "string"
                },
                "description": "Per-crawler choices that win over the role choices, by robots.txt token, such as {\"GPTBot\": \"block\"}. Defaults to none.",
                "propertyNames": {
                  "maxLength": 60,
                  "type": "string"
                },
                "type": "object"
              },
              "search": {
                "description": "Whether AI search crawlers (OAI-SearchBot, Claude-SearchBot, PerplexityBot) may read the site: allow or block. Defaults to allow.",
                "enum": ["allow", "block"],
                "type": "string"
              },
              "training": {
                "description": "Whether training crawlers (GPTBot, ClaudeBot, Google-Extended, CCBot) may read it: allow or block. Defaults to allow.",
                "enum": ["allow", "block"],
                "type": "string"
              },
              "userFetch": {
                "description": "Whether crawlers fetching for a user (ChatGPT-User, Claude-User) may read it: allow or block. Defaults to allow.",
                "enum": ["allow", "block"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft robots.txt rules for AI crawlers"
