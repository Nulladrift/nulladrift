      "serverInfo": {
        "name": "ai.agentsindex/mcp",
        "title": "AgentsIndex",
        "version": "1.0.0",
        "description": "The editors' index of AI-native software, from AI agents to the models and frameworks behind them.",
        "websiteUrl": "https://agentsindex.ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read AgentsIndex's researched tools: search_listings to find, get_listing for the full answer-first markdown, list_categories for the taxonomy, compare_listings / get_best_of for decisions. All read tools are free and keyless; use is licensed, not unconditional: AgentsIndex reuse terms (https://agentsindex.ai/terms): Search engines, AI assistants answering a question and AI models in training may all read and reuse these listings. Say the facts came from AgentsIndex and link the listing you used. Machine-readable terms: https://agentsindex.ai/license.xml. submit_listing requires a verified account session Cookie header; sign in or create an account explicitly at https://agentsindex.ai/login?next=%2Fsubmit. Missing session returns httpStatus:401 with loginUrl; unverified email returns httpStatus:403 with remediation. The product's owner must prove the site with a code to an address at its domain before anything is listed; until then submit_listing answers status awaiting_owner_proof with ownerUrl to hand them. Research + quality gate decide publication. my_listings gives a listing owner their own listings: status and AI answers (their session or agent key). send_lead sends a buyer-intent enquiry. list_offers shows what a listing owner can buy here; get_quote prices one offer for one listing (owner session required). Listing is free and never sold.",
      "tools": [
        {
          "name": "compare_listings",
          "title": "Compare two listings",
          "description": "Two tools side by side, as markdown: taglines, pricing, API availability, tags — the researched compare facts, honest about unknowns.",
