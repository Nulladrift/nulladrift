        {
          "name": "create_order",
          "title": "Order an offer",
          "description": "Turns a quote (from get_quote) into an order, payable for 24 hours. Same account as the quote: its session Cookie header, or its agent key as Authorization: Bearer (order scope). Returns the order with payment.url: POST it without a credential for a 402 card challenge (MPP, method stripe, a Stripe Shared Payment Token), then again with Authorization: Payment. Pass idempotency_key to make a retry return the same order. The price is excl. VAT: EU buyers without a valid EU VAT ID pay 21% VAT on top, and the 402 shows the total. Nothing is charged by this tool.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Optional: your own key, the same on every retry of this order.",
                "type": "string"
              },
              "quote_id": {
                "description": "The quote_id from get_quote.",
                "type": "string"
              }
