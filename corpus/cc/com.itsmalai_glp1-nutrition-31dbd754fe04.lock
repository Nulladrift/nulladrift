        },
        {
          "name": "malai_get_medication_guide",
          "title": "GLP-1 medication guide",
          "description": "MALAI: Get MALAI's guide to a GLP-1 medication (Ozempic, Wegovy, Mounjaro or Zepbound): dose steps, common side effects with trial frequencies and food tips, what to eat, treatment phases, the first week, and FAQs, citing prescribing information. Use for \"what are Mounjaro side effects\", \"what should I eat in my first week on Wegovy\". Never use it to recommend a dose change, skipping or stopping; tell the user to ask their prescriber.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "medication": {
                "description": "Brand name. Semaglutide is Ozempic/Wegovy; tirzepatide is Mounjaro/Zepbound.",
                "enum": ["ozempic", "wegovy", "mounjaro", "zepbound"],
                "type": "string"
              },
              "sections": {
                "description": "Default: overview, doses, side_effects, nutrition.",
                "items": {
                  "enum": ["overview", "doses", "side_effects", "nutrition", "phases", "first_week", "faqs"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["medication"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "administration": {
                "type": "string"
              },
              "doses": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "drug_class": {
                "type": "string"
              },
              "faqs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["answer", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "fda_approval": {},
              "first_week": {},
              "generic": {
                "type": "string"
              },
              "manufacturer": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "nutrition": {},
              "overview": {},
              "phases": {
                "items": {},
                "type": "array"
              },
              "side_effects": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "food_tips": {
                      "type": "string"
                    },
                    "frequency": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "food_tips", "frequency", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["administration", "drug_class", "generic", "manufacturer", "name", "note", "source", "url"],
            "type": "object"
          },
