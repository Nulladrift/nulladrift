        {
          "name": "malai_search_foods",
          "title": "Food nutrition lookup",
          "description": "MALAI: Look up nutrition for a food in MALAI's database (USDA FoodData Central, US foods): calories, protein, carbs, fat, fiber, saturated fat and sugar per serving (or per 100 g), plus the share of calories from protein. Use for \"how much protein is in cottage cheese\", \"compare tofu and chicken\", \"is a turkey sandwich high in protein\". A null value means unknown, not zero. Don't use to log food (that needs a MALAI account: malai_how_to_connect).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results, 1–10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Food name, e.g. \"cottage cheese 2%\".",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "Present when nothing matched.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "data_source": {
                      "type": "string"
                    },
                    "food_id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "notes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "nutrition": {
                      "additionalProperties": {
                        "type": ["number", "null"]
                      },
                      "description": "calories, protein_g, carbs_g, fat_g, fiber_g, saturated_fat_g, sugar_g; null = unknown.",
                      "type": "object"
                    },
                    "per": {
                      "description": "The amount the nutrition is for, e.g. \"0.5 cup (113 g)\" or \"100 g\".",
                      "type": "string"
                    },
                    "usda_fdc_id": {
                      "type": "string"
                    }
                  },
                  "required": ["data_source", "food_id", "name", "notes", "nutrition", "per"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              }
            },
            "required": ["note", "query", "results", "source"],
            "type": "object"
          },
