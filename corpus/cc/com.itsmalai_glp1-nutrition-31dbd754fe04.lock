        {
          "name": "malai_how_to_connect",
          "title": "Connect a MALAI account",
          "description": "MALAI: Explain what connecting a MALAI account adds (logging food by describing it, protein left today, personal targets, saved recipes, next-meal ideas) and how to connect it to this assistant. Use when the user wants to log food, track progress, or ask about their own numbers while only the open MALAI tools are available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "The assistant the user is in. Tailors the steps.",
                "enum": ["chatgpt", "claude", "gemini", "grok", "muse", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "connector_url": {
                "description": "The MCP URL to add as a custom connector.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "sign_up_url": {
                "type": "string"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "steps": {
                "items": {
