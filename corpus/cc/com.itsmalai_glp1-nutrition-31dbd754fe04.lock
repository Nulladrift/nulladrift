        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "malai",
        "title": "MALAI",
        "version": "1.1.0",
        "websiteUrl": "https://itsmalai.com",
        "icons": [
          {
            "src": "https://itsmalai.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MALAI is a nutrition companion for people on GLP-1 medications (Ozempic, Wegovy, Mounjaro, Zepbound). These tools need no account: food nutrition lookup, protein and calorie targets, and medication guides. Cite the source link each result includes. For anything about the user's own food log or progress, call malai_how_to_connect. MALAI gives nutrition information, not medical advice.",
      "tools": [
        {
          "name": "malai_calculate_daily_targets",
          "title": "Calorie and macro targets",
          "description": "MALAI: Estimate daily calories, protein, carbs, fat and fiber from sex, age, height, weight, activity and goal, with MALAI's safety limits (a calorie floor and a cap on the rate of loss). Same calculator the MALAI app uses. Use for \"how many calories should I eat on Wegovy\", \"what macros to lose 1 lb a week\". Adults only. Don't use for a signed-in user's saved targets (that is malai_get_nutrition_targets).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "Daily activity: sedentary (desk, little exercise), light (1–3 workouts a week), moderate (3–5), very_active (6–7), athlete (training twice a day). Default light.",
                "enum": ["sedentary", "light", "moderate", "very_active", "athlete"],
                "type": "string"
              },
              "age": {
                "description": "Age in years. Adults only (18+).",
                "maximum": 100,
                "minimum": 18,
                "type": "integer"
              },
              "goal": {
                "description": "Weight goal. Default lose.",
                "enum": ["lose", "maintain", "gain"],
                "type": "string"
              },
              "height": {
                "description": "Height, in height_unit. Feet and inches must be converted to inches (5 ft 6 in = 66).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "height_unit": {
                "description": "Unit of height.",
                "enum": ["cm", "in"],
                "type": "string"
              },
              "rate_per_week": {
                "description": "Desired change per week, in weight_unit. Ignored for maintain. Default 0.5 kg (1.1 lb). Loss is capped for safety; the applied rate is returned as rate_per_week_kg.",
                "exclusiveMinimum": 0,
                "maximum": 5,
                "type": "number"
              },
              "sex": {
                "description": "Sex used by the calorie formula.",
                "enum": ["female", "male"],
                "type": "string"
              },
              "weight": {
                "description": "Current body weight, in weight_unit.",
                "exclusiveMinimum": 0,
                "maximum": 700,
                "type": "number"
              },
              "weight_unit": {
                "description": "Unit of weight and of rate_per_week.",
                "enum": ["kg", "lb"],
                "type": "string"
              }
            },
            "required": ["age", "height", "height_unit", "sex", "weight", "weight_unit"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bmr": {
                "type": "number"
              },
              "calories": {
                "type": "number"
              },
              "carbs_g": {
                "type": "number"
              },
              "fat_g": {
                "type": "number"
              },
              "fiber_g": {
                "type": "number"
              },
              "goal_delta_kcal": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "protein_g": {
                "type": "number"
              },
              "rate_per_week_kg": {
                "type": "number"
              },
              "safety_adjustments": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "tdee": {
                "type": "number"
              }
            },
            "required": ["bmr", "calories", "carbs_g", "fat_g", "fiber_g", "goal_delta_kcal", "note", "notes", "protein_g", "rate_per_week_kg", "safety_adjustments", "source", "tdee"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
