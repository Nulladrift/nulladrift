{
  "lockfileVersion": 2,
  "subjects": {
    "com.powerbankportatil/store": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://powerbankportatil.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "powerbankportatil",
        "title": "PowerBankPortatil Store",
        "version": "1.1.0",
        "websiteUrl": "https://powerbankportatil.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools for the PowerBankPortatil shop (magnetic MagSafe-compatible power banks and cases). Use search_products to find items and get_product_details for one item; prices are EUR incl. VAT. Before recommending a product for a phone, call check_phone_compatibility. Quote shipping with quote_shipping and returns/warranty only from get_store_policies. This server cannot order or pay: send the shopper to the product URL to buy.",
      "tools": [
        {
          "name": "check_phone_compatibility",
          "title": "Phone compatibility",
          "description": "Check whether the magnetic power bank attaches to a phone model directly or needs a magnetic case, whether the phone charges wirelessly, and whether the store sells a case for it.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Answer language (default en)",
                "enum": ["en", "fr", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "phone": {
                "description": "Phone model, e.g. \"iPhone 15 Pro\" or \"S24 Ultra\"",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05f227bfeafade1ac8791e61a01ae4c2b9e095631721b60a483361d920ddddb2"
        },
        {
          "name": "get_product_details",
          "title": "Product details",
          "description": "Get one product's name, price, stock, colour, capacity, image and URL by slug (any language), SKU or product id.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Answer language (default en)",
                "enum": ["en", "fr", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "slug": {
                "description": "Product slug from search_products, e.g. magnetic-powerbank-10000mah-white",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:931501eb7a001a629f30a5e70e20e25766711ea0074ec11d64651126cec42e42"
        },
        {
          "name": "get_store_policies",
          "title": "Shipping, returns and warranty",
          "description": "Shipping prices, delivery time, returns, warranty and payment methods of the store (same rules as the checkout).",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Answer language (default en)",
                "enum": ["en", "fr", "es", "de", "it", "pt", "nl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8005ba91afd4efe6d873c99f4f4715afdcda0a7b2d32a9c3306f3e67148dd46"
        },
        {
          "name": "quote_shipping",
          "title": "Shipping quote",
          "description": "Exact shipping cost in EUR for a basket, computed with the checkout's rule (one power bank €5, 2–5 power banks free; a case is free with a power bank, €2 alone). Same rate for every country.",
          "inputSchema": {
            "properties": {
              "cases": {
                "description": "Number of phone cases in the basket",
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "description": "Answer language (default en)",
                "enum": ["en", "fr", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "power_banks": {
                "description": "Number of power banks in the basket",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ea25e8e377db0537da93414509edba1df92a901dcd1556e7437d9b9e55ad0d6"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the PowerBankPortatil catalog (magnetic MagSafe-compatible power banks and magnetic phone cases). Returns name, price in EUR, stock, slug and URL of each match. All filters are optional; no filter returns the whole catalog.",
          "inputSchema": {
            "properties": {
              "capacity": {
                "description": "Battery capacity in mAh",
                "enum": [5000, 10000],
                "type": "integer"
              },
              "color": {
                "description": "Orange, White, Silver, Gold or Clear",
                "type": "string"
              },
              "lang": {
                "description": "Answer language (default en)",
                "enum": ["en", "fr", "es", "de", "it", "pt", "nl"],
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in EUR",
                "type": "number"
              },
              "query": {
                "description": "Free text, e.g. \"10000mAh white\"",
                "type": "string"
              },
              "type": {
                "enum": ["power bank", "case"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5691d2cf4eae915c2563ec8fc7e9b95e05210bc8e0088c56289c1db2e7127580"
        }
      ],
      "resources": [
        {
          "uri": "powerbankportatil://catalog",
          "name": "catalog",
          "title": "Product catalog",
          "description": "Every product with price, stock and URL (English).",
          "mimeType": "application/json",
          "digest": "sha256:f22e00f6723040d93120405570c6912c4a5aeb7341eeffe893d57318cc7c9382"
        },
        {
          "uri": "powerbankportatil://policies",
          "name": "policies",
          "title": "Store policies",
          "description": "Shipping, delivery, returns, warranty and payment (English).",
          "mimeType": "application/json",
          "digest": "sha256:d621d6faa617a89427bee83b68bfa5624fb13ffeb153580f7d1133ac039f4a99"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "powerbankportatil://policies/{lang}",
          "name": "policies-localized",
          "title": "Store policies in a language",
          "description": "Shipping, delivery, returns, warranty and payment in en, es, fr, de, it, pt or nl.",
          "mimeType": "application/json",
          "digest": "sha256:2e8b32c9cd207eb3ea8787a0bfba958e74eeee2583213d80ccaae9e66abac5f2"
        },
        {
          "uriTemplate": "powerbankportatil://product/{slug}",
          "name": "product",
          "title": "Product",
          "description": "One product (slug in any language, SKU or product id) with price, stock and URL.",
          "mimeType": "application/json",
          "digest": "sha256:76ffb94abcbac0ce9c7a69f7babb1d8739f479b9b97bd602dc46006900823154"
        }
      ],
      "prompts": [
        {
          "name": "recommend_power_bank",
          "title": "Recommend a power bank",
          "description": "Recommend the right magnetic power bank for a shopper's phone and needs.",
          "arguments": [
            {
              "name": "phone",
              "description": "Shopper's phone model",
              "required": true
            },
            {
              "name": "needs",
              "description": "Usage, e.g. \"travel\", \"light\", \"full charge\"",
              "required": false
            }
          ],
          "digest": "sha256:b71cda89279a5e5c844363dbc5968c87c0bbc9070f83bb3ea803317070a1dc62"
        }
      ],
      "digest": "sha256:ad88e65bf0b92c3b41b988fae805d9346e3451e82ceecab83d375fe1f3738820"
    }
  }
}
