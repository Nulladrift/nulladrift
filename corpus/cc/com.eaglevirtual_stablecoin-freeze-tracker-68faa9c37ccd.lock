        {
          "name": "list_freeze_events",
          "title": "Recent stablecoin blacklistings and freezes",
          "description": "The published feed of recent stablecoin blacklist, freeze, seizure and release events, the same rows eaglevirtual.com shows publicly, with the wallet, coin, blockchain, date, block and transaction for each. Covers every coin on every chain: omit the filters and it returns all of them, newest first. Filter by coin, blockchain, event kind or date to narrow it. This is a published sample of the record, not the full corpus, and there is no way to page beyond it. Add month (YYYY-MM) for one whole recorded month: every caller gets the month’s totals, and the events behind them need a paid account. To check a specific wallet, use get_address_status; for totals use get_token_statistics.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Blockchain name or chain id, e.g. Tron or 1.",
                "maxLength": 32,
                "type": "string"
              },
              "kind": {
                "description": "Restrict to one kind of event. \"blacklist\" is a deny-list entry in the token contract; \"freeze\" locks an account; \"seizure\" took the balance; \"release\" lifted a restriction. Omit for all.",
                "enum": ["blacklist", "freeze", "seizure", "release"],
                "type": "string"
              },
              "limit": {
                "description": "Rows to return, up to 100. Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "One whole recorded month, YYYY-MM, instead of the recent feed. Every caller gets the month’s totals; the events behind them need a paid account.",
                "maxLength": 7,
                "minLength": 7,
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "since": {
                "description": "Only events on or after this date, YYYY-MM-DD.",
                "maxLength": 10,
                "type": "string"
              },
              "token": {
