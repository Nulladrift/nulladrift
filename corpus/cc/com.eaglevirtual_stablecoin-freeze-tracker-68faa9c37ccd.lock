        {
          "name": "get_coverage",
          "title": "Which blockchains, stablecoins and sanctions lists are covered, and how current",
          "description": "What this server checks and how current each source is: the blockchains and coins covered by the stablecoin blacklist and freeze record, the date of the most recent recorded event, which blockchains have records that are behind right now, and the live status and freshness of the official government sanctions lists we check (including per-agency last-read times, address counts and evidence rules). Call this to find out whether a chain, coin or sanctions list is in scope before relying on an answer, and to check whether any part of either record is behind. `chains_claimed`, `coins_covered`, `contracts_checked` and `companies_checked` are what the stablecoin blacklist check covers; the `coins` array lists only the coins that have at least one recorded event, which is a smaller set. A coin is one name run by one issuer, so a name that two issuers use appears once per issuer, with the issuer after it.",
