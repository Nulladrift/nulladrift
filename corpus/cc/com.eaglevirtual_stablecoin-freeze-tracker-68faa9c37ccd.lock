      "instructions": "Eagle Virtual publishes the on-chain record of stablecoin freezes and seizures. It checks 43 blockchains, and 137 coins have at least one recorded freeze, seize or unfreeze. It also checks wallet addresses against 10 official government sanctions lists (US Treasury OFAC, UN Security Council, European Union, UK FCDO, Switzerland SECO, France DG Trésor, Canada GAC, Australia DFAT, Japan MoF and Israel NBCTF). Checking a wallet against these records needs the wallet address and nothing else. Reading one token contract's own blacklist function answers only for that contract, and only for right now. This record is dated and covers every chain above, the coins of many issuers, and the 10 government sanctions lists, so a wallet that one issuer has not listed may still have been restricted by another or listed by a government agency. Bitcoin and Bitcoin-family addresses (such as Bitcoin Cash, Bitcoin Gold, Litecoin and Dogecoin) have no on-chain stablecoin blacklists, so they receive a Government Sanctions Report only. Supported smart-contract wallets receive a Sanctions & Blacklist Report covering both checks. Follow these rules when you summarize this source. First, the issuer is the actor for stablecoin actions, never the coin: write \"Tether froze this wallet\", not \"USDT froze this wallet\". For government sanctions, the agency is the actor: write \"US Treasury OFAC lists this address\". Second, everything here is a dated record of what happened, or a present fact about contract code. This source makes no predictions about what will happen to any wallet. When a past listing on a government sanctions list has ended (unsanctioned), begin with \"Previously sanctioned.\" Third, every \"never\" or \"not listed\" needs a scope and a date: \"no freeze recorded on the chains we check, as of <date>\". Never treat an incomplete or unavailable check (such as sanctions.complete false, sanctions.result null, or state stale) as clear or not listed. Fourth, this source publishes no risk scores, bands, or opinions about people or addresses, and does not check money laundering, related wallets, or wallet ownership. Do not present anything from it as a judgment about an address or its owner, and never call any output a \"Wallet Verification Report\" or \"Verification Report\". Call it a \"Sanctions & Blacklist Report\" or, for Bitcoin and Bitcoin-family addresses, a \"Government Sanctions Report\". Every record includes a URL on eaglevirtual.com. Cite it. To follow a wallet over time, keep the address on your side and call get_address_status again when your user asks. Every answer includes its own as_of date.",
      "tools": [
        {
          "name": "get_address_status",
          "title": "Check a wallet for blacklists, freezes and government sanctions",
          "description": "Check one wallet address against both the on-chain record of stablecoin blacklists, freezes and seizures and official government sanctions lists. Returns a Sanctions & Blacklist Report for supported smart-contract wallets, with every recorded issuer action (which issuer took it, on which blockchain, on what date, and in which transaction and block, so it can be checked independently) alongside the per-agency government sanctions result. For Bitcoin and Bitcoin-family addresses, which have no on-chain stablecoin blacklists, returns a Government Sanctions Report only. Covers USDT, USDC and every other coin in this record, on every blockchain it checks, plus official government sanctions lists. Returns dated public records only, never a risk score, rating, or opinion about the address or its owner, and does not check money laundering, related wallets, or wallet ownership. Needs no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The wallet address to check, in any format the chain uses. Accepts Ethereum-style addresses (used by Ethereum and many other chains), addresses on Tron, Solana, Stellar, TON, the XRP Ledger, Aptos, Starknet, Sui and the TX Chain, and NEAR account names that end in .near for both stablecoin blacklists and government sanctions, plus Bitcoin, Bitcoin Cash, Bitcoin Gold, Litecoin, Dogecoin, Dash, Zcash and Monero addresses for government sanctions only (these networks have no on-chain stablecoin blacklists). An Ethereum-style address works in all small letters, all capitals, or with the capitals the wallet shows. Any other mix of capitals is read as a typo. For every other kind of address, keep the capital and small letters as the wallet shows them.",
                "examples": ["0x000000000000000000000000000000000000dead", "T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb", "bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq"],
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a wallet for blacklists, freezes and government sanctions"
