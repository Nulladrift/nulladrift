            "readOnly": true
          },
          "digest": "sha256:867cb4040e54f32040051c66dff3e3f23026ed217d4c96849646022f3a674ca7"
        }
      ],
      "digest": "sha256:417fd96654f63157517d76ca2810699799cda2d74a7af60c5cf96b15020cea97"
    }
  }
