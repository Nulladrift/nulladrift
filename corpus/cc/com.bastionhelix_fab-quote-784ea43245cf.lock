      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bhx-fab-quote",
        "title": "BHX Fab Quote",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools that measure and price laser, plasma, waterjet and CNC jobs from DXF, G-code and STL files. The default machine and material figures are examples, not a shop's real rates.",
      "tools": [
        {
          "name": "analyse_dxf_for_cutting",
          "title": "Analyse a DXF for laser, plasma or waterjet cutting",
          "description": "Reads a flat 2D DXF (text DXF, as exported by AutoCAD, Fusion, Inventor and most CAD) and returns the parts, cut length, number of pierces and drawing problems (duplicate lines, open contours, near-miss gaps, holes smaller than the thickness). With a cutting speed it also returns the cutting time per part, including acceleration and pierces; with pricing it returns a price. Sheet nesting is not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cut_speed_mm_per_min": {
                "description": "Cutting speed for this material and thickness",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "dxf": {
                "description": "The DXF file content as text",
                "type": "string"
              },
              "machine": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "object"
                  }
                ],
                "description": "A preset name (laser, plasma, waterjet) or {accel_mm_per_s2:[x,y,z], corner_tolerance_mm}"
              },
              "machine_rate_per_hour": {
                "description": "Machine cost per hour, for pricing",
                "minimum": 0,
                "type": "number"
              },
              "material": {
                "description": "For a material cost from the part area: {density_g_cm3, price_per_kg, utilisation_percent (expected sheet use, default 70)}",
                "properties": {
                  "density_g_cm3": {
                    "type": "number"
                  },
                  "price_per_kg": {
                    "type": "number"
                  },
                  "utilisation_percent": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "pierce_time_s": {
                "minimum": 0,
                "type": "number"
              },
              "pricing": {
                "additionalProperties": false,
                "description": "Optional: turn the result into a price",
                "properties": {
                  "currency": {
                    "description": "ISO code, e.g. INR, USD",
                    "type": "string"
                  },
                  "extras": {
                    "items": {
                      "properties": {
                        "amount": {
                          "minimum": 0,
                          "type": "number"
                        },
                        "name": {
                          "type": "string"
                        },
                        "per": {
                          "enum": ["order", "part"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "margin_percent": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "minimum_order": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "tax_name": {
                    "type": "string"
                  },
                  "tax_percent": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "quantity": {
                "description": "How many of each part",
                "minimum": 1,
                "type": "integer"
              },
              "thickness_mm": {
                "description": "Material thickness, used to flag small holes",
                "minimum": 0,
                "type": "number"
              },
              "units": {
                "description": "Override the drawing units if the file does not state them",
                "enum": ["mm", "inch", "cm", "m"],
                "type": "string"
              }
            },
            "required": ["dxf"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c521bedf98976c8f1d767fdb41a9dba4062bdee624277383ac85f35f63770a8"
        },
        {
          "name": "estimate_cnc_from_stl",
          "title": "Estimate CNC machining of a 3D part (before CAM)",
          "description": "Budget estimate for machining a part from an STL: stock block, material removed, surface area, roughing and finishing time at the material removal rates given, and part mass. Based on volume and surface area only; holes and corner radii are not detected from STL. Accepts up to 60,000 triangles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowance_mm": {
                "description": "Stock allowance per side, default 2",
                "minimum": 0,
                "type": "number"
              },
              "machine_rate_per_hour": {
                "minimum": 0,
                "type": "number"
              },
              "material": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "object"
                  }
                ],
                "description": "Preset (al6061, ms, ss304, brass, pom) or {name, density_g_cm3, rough_cm3_per_min, finish_cm2_per_min, price_per_kg}"
              },
              "pricing": {
                "additionalProperties": false,
                "description": "Optional: turn the result into a price",
                "properties": {
                  "currency": {
                    "description": "ISO code, e.g. INR, USD",
                    "type": "string"
                  },
                  "extras": {
                    "items": {
                      "properties": {
                        "amount": {
                          "minimum": 0,
                          "type": "number"
                        },
                        "name": {
                          "type": "string"
                        },
                        "per": {
                          "enum": ["order", "part"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "margin_percent": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "minimum_order": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "tax_name": {
                    "type": "string"
                  },
                  "tax_percent": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "quantity": {
                "minimum": 1,
                "type": "integer"
              },
              "setups": {
                "minimum": 1,
                "type": "integer"
              },
              "stl_base64": {
                "description": "Binary or text STL, base64-encoded",
                "type": "string"
              },
              "up": {
                "enum": ["auto", "+Z", "-Z", "+Y", "-Y", "+X", "-X"],
                "type": "string"
              }
            },
            "required": ["stl_base64"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f9eb479906c870b99bbbd1f037fb898f91d5a5c05f1ef33e18169c800c15ba4"
        },
        {
          "name": "estimate_gcode_run_time",
          "title": "Estimate the run time of a G-code program",
          "description": "Simulates a CNC, laser or plasma G-code program (G0-G3 with arcs and helixes, drilling cycles G73/G81-G89, dwell, tool changes, inch/mm, absolute/incremental) with the machine's rapid speeds, acceleration and tool-change time. Returns the run time, time per tool, the program's size, and warnings such as rapid moves below Z0 or a program bigger than the machine. Accepts programs of up to 3,000 lines.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calibration_factor": {
                "description": "Real time ÷ estimated time from one real job; default 1",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "dialect": {
                "description": "fanuc: G4 P in milliseconds (Fanuc, Haas). grbl: seconds (Grbl, LinuxCNC, Mach)",
                "enum": ["fanuc", "grbl"],
                "type": "string"
              },
              "gcode": {
                "type": "string"
              },
              "machine": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "object"
                  }
                ],
                "description": "Preset (vmc, router, hobby, laser, plasma, waterjet) or {rapid_mm_per_min:[x,y,z], accel_mm_per_s2:[x,y,z], tool_change_s, travel_mm:[x,y,z], corner_tolerance_mm}"
              },
              "machine_rate_per_hour": {
                "minimum": 0,
                "type": "number"
              },
              "pierce_time_s": {
                "description": "Laser/plasma: time added per pierce",
                "minimum": 0,
                "type": "number"
              },
              "pricing": {
                "additionalProperties": false,
                "description": "Optional: turn the result into a price",
                "properties": {
                  "currency": {
                    "description": "ISO code, e.g. INR, USD",
                    "type": "string"
                  },
                  "extras": {
                    "items": {
                      "properties": {
                        "amount": {
                          "minimum": 0,
                          "type": "number"
                        },
                        "name": {
                          "type": "string"
                        },
                        "per": {
                          "enum": ["order", "part"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "margin_percent": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "minimum_order": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "tax_name": {
                    "type": "string"
                  },
                  "tax_percent": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "process": {
                "description": "Default: from the machine preset",
                "enum": ["mill", "laser", "plasma", "waterjet"],
                "type": "string"
              },
              "quantity": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["gcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ecd5c1735728f08b13c7fd192bbe82994ed5f1ca49eaf38f1316173c53c2f0ad"
        },
        {
          "name": "get_example_rates",
          "title": "Example machine and material figures",
          "description": "Returns the example machine presets and material rates this service uses by default. They are starting points, not quotes: a shop should replace them with its own figures.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
