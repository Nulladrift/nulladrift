        {
          "name": "counterparty_check",
          "title": "Counterparty Check (KYB facts)",
          "description": "Counterparty check (KYB preflight) in one call: give any of a company name, domain, LEI or crypto wallet address (plus an optional EU VAT number), get neutral sourced facts for vendor onboarding and supplier due diligence: sanctions screen of the name on OFAC, EU and UK lists with UN designations flagged, US federal exclusions (SAM.gov debarments and suspensions of firms, by name or UEI), OFAC wallet check, GLEIF LEI match and status, domain age, registrar and email-auth, and an EU VAT number format check. A name screen needs fresh OFAC, EU and UK lists (48 hours each) and returns 503 before payment if any of those is stale. Domain-only, address-only and UEI-only checks do not require the EU or UK lists. No risk score or verdict. Signed receipt. Price: $0.01 per call via x402 (USDC on Base or XRP on XRPL). The response includes a `provenance` block (sg-provenance/1): each fact carries its source, source URL, retrieval time and limits; evidence only, no score, rating or verdict. Example arguments: {\"name\":\"Siemens Aktiengesellschaft\",\"domain\":\"siemens.com\",\"vat\":\"DE129274202\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Crypto wallet address to check against OFAC-listed addresses",
                "maxLength": 120,
                "minLength": 20,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 alpha-2 country filter for LEI matches",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "domain": {
                "description": "Company domain: registration age, registrar, DNS and email-auth facts",
                "examples": ["siemens.com"],
                "pattern": "^[A-Za-z0-9.-]{3,253}$",
                "type": "string"
              },
              "lei": {
                "description": "20-character LEI (instead of a GLEIF name search)",
                "pattern": "^[A-Za-z0-9]{18}[0-9]{2}$",
                "type": "string"
              },
              "name": {
                "description": "Company legal or trading name: screened on OFAC, EU and UK sanctions lists and SAM.gov exclusions (entities only) and matched in GLEIF",
                "examples": ["Siemens Aktiengesellschaft"],
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "uei": {
                "description": "12-character SAM.gov Unique Entity ID: exact match in the SAM.gov exclusions extract (name= is also matched there)",
                "pattern": "^[A-Za-z0-9]{12}$",
                "type": "string"
              },
              "vat": {
                "description": "EU VAT number with 2-letter country prefix (EL for Greece, XI for Northern Ireland); format check only, not a VIES registration check",
                "examples": ["DE129274202"],
                "maxLength": 24,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Paid result: { data, receipt }. Unpaid calls return an x402 PaymentRequired object instead (isError: true).",
            "properties": {
              "data": {
                "description": "Sourced facts[] plus sanctions, us_exclusions (SAM.gov), wallet, lei, domain and vat sections; each section says whether it was checked and why not",
                "properties": {
                  "checked_at": {},
                  "domain": {},
                  "facts": {},
                  "lei": {},
                  "name_links": {},
                  "notice": {},
                  "provenance": {
                    "description": "The response includes a `provenance` block (sg-provenance/1): each fact carries its source, source URL, retrieval time and limits; evidence only, no score, rating or verdict."
                  },
                  "query": {},
                  "sanctions": {},
                  "sources": {},
                  "us_exclusions": {},
                  "vat": {},
                  "wallet": {}
                }
              },
              "receipt": {
                "description": "Ed25519-signed, hash-chained receipt; verify free with the verify_receipt tool or POST /v1/verify-receipt. New receipts carry a signed `evidence` object: service_version, data_timestamp, validation, terms_version, terms_hash, provenance_hash."
              }
            },
            "type": "object"
          },
