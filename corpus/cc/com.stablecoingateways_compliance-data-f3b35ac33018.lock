          "description": "Sanctions screening (OFAC, EU, UK, UN): is a company, organisation, vessel (name or IMO), aircraft or crypto wallet address sanctioned? Screens the official US OFAC SDN and Consolidated lists, the EU consolidated financial sanctions list and the UK Sanctions List, flagging UN Security Council designations, with fuzzy name and alias matching; returns matches, scores, programs and each list's date. EU and UK are updated and freshness-checked separately, each for 48 hours; lists= selects which apply, and a stale requested list returns 503 before any payment. A UK update does not refresh EU. Entities only, not individuals. Use for KYB, AML, vendor and pre-payment screening. Data lookup, not a compliance determination. Signed receipt. Price: $0.005 per call via x402 (USDC on Base or XRP on XRPL). The response includes a `provenance` block (sg-provenance/1): each fact carries its source, source URL, retrieval time and limits; evidence only, no score, rating or verdict. Example arguments: {\"name\":\"Huawei Technologies\",\"lists\":\"all\"}.",
