      "instructions": "Compliance and company data for agents. Free tools: catalog, health, verify_receipt. Every other tool is paid per call over x402 v2: call it without payment to get PaymentRequired (isError:true, structuredContent), sign one of the accepts (USDC on Base eip155:8453 or XRP on xrpl:0; testnet rails also offered), and retry the same call with params._meta[\"x402/payment\"]. Invalid input is rejected before any payment; payment is settled only after the answer is produced. Results are { data, receipt } with an Ed25519-signed receipt. Data lookups, not compliance determinations. Contact hello@stablecoingateways.com.",
      "tools": [
        {
          "name": "business_days",
          "title": "Business Days and Holidays",
          "description": "Business days and public holidays: check if a date is a business day, add or subtract N business days, count business days between dates, or list holidays, for 250 countries, 630 subdivisions (e.g. US-NY, GB-ENG) and 31 stock exchanges, 2025-2030. Use for payment due dates, T+N settlement, delivery estimates and SLAs. Data: python-holidays (MIT). Signed receipt. Price: $0.001 per call via x402 (USDC on Base or XRP on XRPL). The response includes a `provenance` block (sg-provenance/1): each fact carries its source, source URL, retrieval time and limits; evidence only, no score, rating or verdict. Example arguments: {\"calendar\":\"US-NY\",\"op\":\"add\",\"date\":\"2026-12-23\",\"days\":\"3\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "ISO country (US), country-subdivision (US-NY) or exchange (FIN-XNYS); default US",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD; default today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "Business days to add (op=add), integer, |days|<=1000",
                "pattern": "^-?\\d{1,4}$",
                "type": "string"
              },
              "end": {
                "description": "End date for op=between",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "op": {
                "description": "Operation; default check",
                "enum": ["check", "add", "between", "list"],
                "type": "string"
              },
              "year": {
                "description": "Year for op=list, 2025-2030",
                "pattern": "^20(2[5-9]|30)$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Paid result: { data, receipt }. Unpaid calls return an x402 PaymentRequired object instead (isError: true).",
            "properties": {
              "data": {
                "description": "Business-day answer for the calendar: is_business_day / result date / count / holiday list, with coverage years",
                "properties": {
                  "calendar": {},
                  "coverage": {},
                  "days": {},
                  "holidays_skipped": {},
                  "op": {},
                  "provenance": {
                    "description": "The response includes a `provenance` block (sg-provenance/1): each fact carries its source, source URL, retrieval time and limits; evidence only, no score, rating or verdict."
                  },
                  "result": {},
                  "source": {},
                  "start": {},
                  "weekend_days": {}
                }
              },
              "receipt": {
                "description": "Ed25519-signed, hash-chained receipt; verify free with the verify_receipt tool or POST /v1/verify-receipt. New receipts carry a signed `evidence` object: service_version, data_timestamp, validation, terms_version, terms_hash, provenance_hash."
              }
