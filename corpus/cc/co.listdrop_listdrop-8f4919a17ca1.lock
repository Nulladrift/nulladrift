{
  "lockfileVersion": 2,
  "subjects": {
    "co.listdrop/listdrop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.listdrop.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "listdrop",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_list",
          "title": "Save a list to ListDrop",
          "description": "Saves list-shaped content as a ListDrop list the user can keep, check off, and share: an itinerary, a reading or watch list, a packing list, gift ideas, an apartment or job-search shortlist, a step-by-step plan, a checklist. Applies when the user wants a list to outlive the conversation. Not meant for throwaway answers, secrets or sensitive data (a list is unowned until claimed), or content that isn't list-shaped. Without a connected account the list is created private and unowned, and the result contains a secret claim URL: opening it is the only way to view and keep the list, and unclaimed lists are deleted after 30 days. With a connected ListDrop account (OAuth, lists:write) the list is created directly in that account, private, and the result contains its URL instead. A URL inside an item becomes a titled, linked item. Optional fields: allowed_emails shares the private list view-only with specific people, who open the returned share URL and verify their address with a one-time email link (no account needed); expires_in_days makes the list archive itself on a date, for trips and events.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "allowed_emails": {
                "description": "Email addresses allowed to VIEW this private list (view-only guest list).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "description": {
                "maxLength": 280,
                "type": "string"
              },
              "emoji": {
                "maxLength": 8,
                "type": "string"
              },
              "expires_in_days": {
                "description": "Self-archive after this many days (list becomes owner-only).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "items": {
                "items": {
                  "anyOf": [
                    {
                      "type": "string"
                    },
                    {
                      "properties": {
                        "note": {
                          "maxLength": 140,
                          "type": "string"
                        },
                        "text": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "title": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["items", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Save a list to ListDrop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44e63ff4a10ae9b16051bcd1d135adc30d5665f1c48f1aa79b00c9142b967efb"
        },
        {
          "name": "get_list",
          "title": "Read a public ListDrop list",
          "description": "Returns a PUBLIC ListDrop list as markdown (title, items, notes, links), given its URL (https://www.listdrop.co/l/<id>/…) or bare id. Private lists are never readable.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "list": {
                "description": "List URL or id",
                "maxLength": 300,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a public ListDrop list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c31f7e413e47449c9525409183ad3b521ea13d3867c3748afcc4ff298ebd36eb"
        },
        {
          "name": "my_lists",
          "title": "List the user's ListDrop lists",
          "description": "Returns the connected user's own lists (titles, visibility, item counts, URLs), private ones included. Requires a connected ListDrop account (OAuth, lists:read scope); without one the server answers 401.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the user's ListDrop lists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3f51b6f9f53913163844d99ea1472d0a98337f96a50576c0772c058c5d4197c"
        },
        {
          "name": "send_feedback",
          "title": "Send feedback to the ListDrop team",
          "description": "Sends a message to the ListDrop team when the user asks to report a problem, request a feature, or give feedback about ListDrop. A person reads every message. No account needed. The message should contain only what the user wants sent: no claim URLs, tokens, or personal data. The email field is for a user who asked for a reply and gave their address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "Only if your user wants a reply and gave you their address.",
                "maxLength": 254,
                "type": "string"
              },
              "kind": {
                "description": "problem | idea | praise | other",
                "enum": ["problem", "idea", "praise", "other"],
                "type": "string"
              },
              "message": {
                "description": "What happened, in plain words. Concrete beats polite: the call you tried, what you expected.",
                "maxLength": 2000,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send feedback to the ListDrop team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d716a5d51edb80e31013f18e8761b8de95c970c70bec75a56d05163bb2ece2c2"
        }
      ],
      "digest": "sha256:f29152d6398b8a0b47fa0d0f6387f1c4d2c927c22ef2ebe460a68209ecdea71d"
    }
  }
}
