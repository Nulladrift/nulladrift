  "subjects": {
    "com.aidemos/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aidemos.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "aidemos-mcp",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Evidence-backed answers about AI tools, from hands-on testing (published data only). START WITH `answer` for any 'which tool is best at X' question — it returns the resolved verdict in one call: winner for the asked criterion, ranked scores, the conditions each result holds under, dissent preserved, openable proof; it refuses honestly when we never tested the topic. Then: list_* to enumerate use cases, rankings, tools, comparisons, toolkits, personas, and categories; tools_in_ranking / rankings_for_tool to traverse; get_persona for everything tagged to a persona; get_tool / get_ranking / get_use_case for the full page as a JSON-structure + Markdown-content envelope; get_evidence for the raw observation cells behind any answer. Every entity has id, slug, and a full url.",
      "tools": [
        {
          "name": "answer",
          "description": "ANSWER a buyer question in ONE call: which tool is best at a specific capability, with proof. Returns the resolved verdict our testing team's evidence supports — a named winner FOR THE ASKED CRITERION, every tested tool ranked with a comparable score /5, the CONDITIONS each result holds under (e.g. 'clean tables yes; nested headers no'), dissenting observations preserved as openable links, the tie-break reason, and artifact proof URLs. Answers are materialized from the evidence substrate — the same question returns the same answer. Honestly refuses (coverage: not_tested) when we never tested the topic. Start HERE for any 'which tool is best at X' / 'A or B for X' question; use get_evidence for the raw cells behind it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "description": "Criterion slug or exact name (with `ranking`).",
                "type": "string"
              },
              "question": {
                "description": "The buyer question in natural language, e.g. 'Which document extraction tool best preserves table structure from scanned PDFs?'. Alternative: pass ranking + criterion explicitly.",
                "type": "string"
              },
              "ranking": {
                "description": "Ranking slug (skips routing).",
                "type": "string"
              },
              "scenario": {
                "description": "Optional scenario/condition of interest.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b2163556b976a3665023eb22233d06c80094d8590e24ff9f02e04235e1b2439"
        },
        {
          "name": "compare_tools",
          "description": "Evidence-aligned comparison of two tools, honesty enforced structurally: head_to_head (cells from the SAME test input — provable same-input comparison), related_not_same_input (same dimension, different runs — flagged), and each tool's unique evidence. Built from real observation cells with artifacts, not prose.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "description": "Optional: restrict to one criterion.",
                "type": "string"
              },
              "tool_a": {
                "description": "First tool slug, e.g. \"llamaparse\".",
                "type": "string"
              },
              "tool_b": {
                "description": "Second tool slug, e.g. \"landing-ai\".",
                "type": "string"
              }
            },
            "required": ["tool_a", "tool_b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:34e459e0dfcc84abcf323ccbe06122f85c0fac4864a3362dfa13f384286d5b17"
        },
        {
          "name": "get_evidence",
          "description": "Query the evidence graph: observation cells (tool × test-scenario × criterion) → verdict, score, the researcher's note, and the REAL artifacts (input/output screenshots) that prove it. The ground truth behind every ranking — filter any combination of tool(s), scenario (slug, group tag, or name), criterion, verdict, or evidence state. evidence_state: \"verified\" = artifact-backed, \"observed\" = noted without artifact, \"scored-only\" = number only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "criterion": {
                "description": "Criterion slug or name, e.g. \"table extraction\".",
                "type": "string"
              },
              "evidence": {
                "enum": ["verified", "observed", "scored-only"],
                "type": "string"
              },
              "limit": {
                "description": "Max cells (default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "ranking": {
                "description": "Ranking page slug — scope cells to the evidence run that published ranking is bound to (exactly what the page renders).",
                "type": "string"
              },
              "scenario": {
                "description": "Scenario slug, cross-run group tag (e.g. \"scanned-research-paper\"), or name fragment.",
                "type": "string"
              },
              "tool": {
                "description": "Tool slug or name, e.g. \"landing-ai\".",
                "type": "string"
              },
              "tools": {
                "description": "Several tools at once.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "verdict": {
                "enum": ["worked", "mixed", "struggled", "failed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:159d0fb1f734449df5999e86fc87bd6f97713f284261129bc3afe0e6fa0ef5e2"
        },
        {
          "name": "get_persona",
          "description": "Given a persona slug (from list_personas), return everything tagged with it: persona, use_cases[], rankings[], compares[], toolkits[], tools[]. Mirrors a persona landing page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Persona slug, e.g. \"students\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:700a334751c35f5fc201c73f1aa83d0300eee50836aa752da00b6a60a7d6cf8c"
        },
        {
          "name": "get_ranking",
          "description": "Full ranking detail as a JSON+Markdown envelope: ranked tools (rank/badge/scores), criteria, winner, breakdown (JSON) + verdicts / final take (Markdown). Every ranked tool carries `proof`: real artifact URLs from the exact evidence run this page is bound to, each with the /evidence permalink for the finding it proves — verdict and proof arrive together, no second call needed to cite evidence. `proof.artifact_count` is the true total and `proof.all_findings` is the get_evidence call that returns all of it. null if unknown. Pass `fields` to project to only the keys you need (token-efficient).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Optional projection: return ONLY these top-level fields (identity id/name/title/slug/url is always included) to control response size. Available: id, title, slug, url, abstract, read_time, tested_date, category, use_case, personas, tags, winner, methodology, tools, breakdown, final_take, evidence_run.",
                "items": {
                  "enum": ["id", "title", "slug", "url", "abstract", "read_time", "tested_date", "category", "use_case", "personas", "tags", "winner", "methodology", "tools", "breakdown", "final_take", "evidence_run"],
                  "type": "string"
                },
                "type": "array"
              },
              "proof": {
                "description": "How many proof artifacts to inline. \"sample\" (default) = up to 6 per tool, spread across distinct criteria so you see breadth; \"full\" = every artifact; \"none\" = counts only, no URLs. Counts (artifact_count / finding_count) are the TRUE totals in every mode, so you can always tell what you did not receive.",
                "enum": ["sample", "full", "none"],
                "type": "string"
              },
              "slug": {
                "description": "Ranking slug, e.g. \"resume-parsing-api\" (from list_rankings).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0baad0e2625f56baad25100ac583a26da20f6fd88a46e236aa31dc115402e4f8"
        },
        {
          "name": "get_tool",
          "description": "Full tool detail as a JSON+Markdown envelope: identity, pricing, per-feature scores, fit, FAQ, relationships (JSON) + our_take / in-depth review (Markdown). Includes `proof`: real artifact URLs (input/output screenshots, recordings) from the runs that tested it, each with the /evidence permalink for the finding it proves — you can cite evidence from THIS call. null if unknown. Pass `fields` to project to only the keys you need (token-efficient).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Optional projection: return ONLY these top-level fields (identity id/name/title/slug/url is always included) to control response size. Available: id, name, slug, url, heading, website, domain, category, sub_category, content_type, personas, tags, rating, testing_history, features, pricing, fit, use_case_track_record, related_pages, related_reads, similar_tools, faq, demo_video, our_take, in_depth_review_md, proof.",
                "items": {
                  "enum": ["id", "name", "slug", "url", "heading", "website", "domain", "category", "sub_category", "content_type", "personas", "tags", "rating", "testing_history", "features", "pricing", "fit", "use_case_track_record", "related_pages", "related_reads", "similar_tools", "faq", "demo_video", "our_take", "in_depth_review_md", "proof"],
                  "type": "string"
                },
                "type": "array"
              },
              "proof": {
                "description": "How many proof artifacts to inline. \"sample\" (default) = up to 6 per tool, spread across distinct criteria so you see breadth; \"full\" = every artifact; \"none\" = counts only, no URLs. Counts (artifact_count / finding_count) are the TRUE totals in every mode, so you can always tell what you did not receive.",
                "enum": ["sample", "full", "none"],
                "type": "string"
              },
              "slug": {
                "description": "Tool seo_slug, e.g. \"affinda\" (from list_tools).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
