      "tools": [
        {
          "name": "buscar_locales_disponibles",
          "title": "Buscar locales disponibles",
          "description": "Busca locales/puestos disponibles (rack comercial) en los proyectos de EcoPlaza, filtrando opcionalmente por proyecto, rango de area en m2 y piso. Devuelve codigo, piso y area de cada local, paginado (maximo 25 resultados por pagina). NO incluye precios: para eso usa consultar_precios_o_financiamiento.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "area_max_m2": {
                "description": "Area maxima en metros cuadrados.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "area_min_m2": {
                "description": "Area minima en metros cuadrados.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Resultados por pagina (por defecto 10, maximo 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Numero de pagina (por defecto 1).",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "piso": {
                "description": "Filtra por piso o nivel exacto.",
                "maxLength": 50,
                "type": "string"
              },
              "proyecto_slug": {
                "description": "Filtra por slug de proyecto.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar locales disponibles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:be1261f7236348181d1416e38f40c8280b1afa03eb7840b2e25a1fc2128eff8d"
        },
        {
          "name": "consultar_precios_o_financiamiento",
          "title": "Consultar precios o financiamiento",
          "description": "ESTA ES LA TOOL CORRECTA cuando el usuario pregunta por precio, costo, cuanto cuesta, financiamiento, credito, cuotas, inicial o forma de pago de un local o proyecto de EcoPlaza. NUNCA devuelve cifras: EcoPlaza conversa precios y financiamiento directamente con un asesor humano en el proyecto. Devuelve un mensaje de derivacion amable, la ubicacion/horario del proyecto (si se indica) y el contacto de WhatsApp para coordinar una visita.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "proyecto_slug": {
                "description": "Slug del proyecto sobre el que se pregunta (opcional).",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Precios y financiamiento"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fd4226784017f07b493c4cc8e234948366752ead27e7378c6795ac20c4c1ffc5"
        },
        {
          "name": "contactar_asesor_comercial",
          "title": "Contactar asesor comercial",
          "description": "Genera un link de WhatsApp pre-armado hacia el equipo comercial de EcoPlaza (\"Gustavito\") para coordinar una visita o resolver dudas. NO envia ningun mensaje: solo construye el enlace para que el usuario humano lo abra. Usa el parametro opcional mensaje_interes para personalizar el texto pre-armado.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mensaje_interes": {
                "description": "Texto breve describiendo el interes del usuario, se incluye tal cual en el mensaje.",
                "maxLength": 300,
                "type": "string"
              },
              "proyecto_slug": {
                "description": "Slug del proyecto de interes (opcional).",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contactar asesor comercial"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:780bccd5aac0e4f318beb6d8264b08c56b6ceb7577dafaf23beca41996929a10"
        },
        {
          "name": "listar_proyectos",
          "title": "Listar proyectos EcoPlaza",
          "description": "Lista los proyectos comerciales activos de EcoPlaza (mercados, urbanizaciones y proyectos de departamentos) con su nombre, tipo, slug y logo. Usa esta tool primero para descubrir que proyectos existen antes de pedir informacion detallada o buscar locales disponibles. NO incluye precios ni financiamiento.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tipo_proyecto": {
                "description": "Filtra por tipo de proyecto. Si se omite, devuelve todos los tipos.",
                "enum": ["mercado", "urbanizacion", "departamentos"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Listar proyectos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e8f13e9f2dd238b09a73a150aefdb6cdd2e808147cd8e3417559972c5e8e3c3e"
        },
        {
          "name": "obtener_detalle_local",
          "title": "Obtener detalle de un local",
          "description": "Devuelve el detalle (codigo, piso, area en m2 y proyecto) de un local comercial de EcoPlaza a partir de su codigo exacto, SOLO si actualmente esta disponible. Si el codigo no corresponde a un local disponible, sugiere usar buscar_locales_disponibles. NO incluye precios.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "codigo": {
                "description": "Codigo exacto del local, ej: \"P-14\" o \"B-21\".",
                "maxLength": 30,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9 ._-]+$",
                "type": "string"
              }
            },
            "required": ["codigo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Detalle de local"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:eb60d1b3a67bfc6e4039d27d2886778d0290e8c02d4ce8aceb447eebdff02291"
        },
        {
          "name": "obtener_info_proyecto",
          "title": "Obtener informacion de un proyecto",
          "description": "Devuelve informacion comercial publica de un proyecto especifico de EcoPlaza: ubicacion, como visitarlo, rubros permitidos, horario de atencion, beneficios y situacion legal. Requiere el slug del proyecto (usa listar_proyectos para obtenerlo). NO incluye precios, TEA ni cuotas de financiamiento.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "proyecto_slug": {
                "description": "Slug del proyecto, obtenido de listar_proyectos (ej: \"trapiche\").",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["proyecto_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Obtener info de proyecto"
          },
          "behavior": {
