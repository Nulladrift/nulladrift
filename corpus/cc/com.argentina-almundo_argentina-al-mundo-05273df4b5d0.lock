        {
          "name": "buscar",
          "title": "Buscar en el ecosistema",
          "description": "Busca en el contenido verificado y completo, página por página, de las 4 webs del ecosistema (argentina-almundo.com, explora-provincias.ar, ad-gourmet.ar y argentinedelights.com) y de la App Argentina al Mundo: provincias, gastronomía, chefs, productos de lujo, documentos ODS y ESG, I Plato + y más. Entiende la consulta por su significado, en cualquiera de los 17 idiomas. Devuelve los fragmentos más pertinentes con la página de origen.",
          "inputSchema": {
            "properties": {
              "consulta": {
                "description": "Qué buscar, en cualquier idioma (mejor en español). Ejemplo: \"vino Malbec Mendoza\" o \"chefs de Jujuy\".",
                "type": "string"
              },
              "sitio": {
                "description": "Opcional: limitar a una de las 4 webs.",
                "enum": ["argentina-almundo.com", "explora-provincias.ar", "ad-gourmet.ar", "argentinedelights.com"],
                "type": "string"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
