      "serverInfo": {
        "name": "graham-number-calculator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "compute_graham_number",
          "description": "Compute Benjamin Graham's fair-value ceiling (sqrt(22.5 * EPS * book value per share)) for a US-listed ticker, and the margin of safety against its current price. Looks up EPS, book value per share, and price from SEC EDGAR + market data automatically -- just pass a ticker. You can also pass eps/bvps/price directly to compute it for a hypothetical company with no ticker.",
          "inputSchema": {
            "properties": {
              "bvps": {
                "description": "Book value per share, used instead of a ticker lookup",
                "type": "number"
              },
              "eps": {
                "description": "Earnings per share, used instead of a ticker lookup",
                "type": "number"
              },
              "price": {
                "description": "Current price, used to compute margin of safety",
                "type": "number"
              },
              "ticker": {
                "description": "A US-listed ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e982f151dc67713fa3cb88ec7573df8b7505385f5858687175ad17765c05d1b0"
        }
      ],
