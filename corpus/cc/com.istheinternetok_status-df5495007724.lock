          "digest": "sha256:6008687c6a8e431a9ef43910dfa2b01212c92f90090e271bc5c1c46de6e49e7e"
        }
      ],
      "digest": "sha256:fc7c8f0b5a455bd89b84d7dfb1dbac91659fd83bf19d2577d280cbb80db0cc17"
    }
  }
