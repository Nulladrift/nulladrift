          },
          "digest": "sha256:2c2c01a24bc6eb82c33b82e01f4bb13fba041947134e6c3a2a0e0c4e617eda6b"
        },
        {
          "name": "list_incidents",
          "title": "Open incidents",
          "description": "The open incidents (critical flaws, big outages, supply-chain attacks), worst first, each with its impact, what to do, the affected packages and products, and its page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "severity": {
                "description": "Only incidents of this severity.",
                "enum": ["critical", "major", "minor"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
