{
  "lockfileVersion": 2,
  "subjects": {
    "com.istheinternetok/status": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://istheinternetok.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.istheinternetok/status",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Is the internet OK? (https://istheinternetok.com): live outages of the big services and critical security flaws, in plain words. Use internet_status when someone asks if the internet or a big service is OK, check_stack for a project's dependencies or a person's apps (every known flaw for the exact versions of a lockfile, and the incidents explained here), check_repo for a full scan of a public GitHub repo.",
      "tools": [
        {
          "name": "check_repo",
          "title": "Is this repo OK?",
          "description": "Checks a public GitHub repo: every package its lockfiles pin at its latest commit, in every folder and 14 ecosystems (npm, PyPI, crates.io, Go, Maven, NuGet, RubyGems, Packagist, Pub, Swift, Hex, Hackage, CRAN, Julia), against every known flaw. Says the answer on the site's scale (yes, mostly, kind-of, no; unknown when it holds no lockfile we can read), what to update first and what each flaw lets someone do, in plain words. A first look at a big repo takes a few seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "full": {
                "description": "Also every flaw of every package (hundreds of KB for a big repo). Without it: the answer, what to update and why, and where the full list is.",
                "type": "boolean"
              },
              "repo": {
                "description": "owner/name, or the repo's GitHub URL: vercel/next.js, https://github.com/pallets/flask",
                "type": "string"
              }
            },
            "required": ["repo"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0a2ae4fd0f0fb91bdc9abdad0bd2c2c405e0c6e42bd637ccd7bd667a0701ca1"
        },
        {
          "name": "check_stack",
          "title": "Am I affected?",
          "description": "Checks a project's dependencies and a person's apps. Every package with an exact version (as a lockfile pins it) is checked against every known flaw (OSV.dev, CISA's exploited list), and the incidents this site explains come first; a range, no version, or an app is only compared with those incidents. Says the answer on the site's scale (yes, mostly, kind-of, no; unknown when no exact version was sent), which packages to update and to which version. Give packages, product ids, or the text of a lockfile (package-lock.json, pnpm-lock.yaml, yarn.lock, requirements.txt, composer.lock; with filename, any of 30+ formats: Cargo.lock, go.mod, uv.lock, Gemfile.lock...). For a public GitHub repo, check_repo reads every lockfile itself. Only names and versions reach the flaw database; nothing about who asked is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "filename": {
                "description": "The lockfile's file name (Cargo.lock, go.mod, uv.lock...): reads it with the repo check's own readers, which also tell dev dependencies apart.",
                "type": "string"
              },
              "full": {
                "description": "Also every flaw of every package, minor ones included. Without it: the answer, what to update and why.",
                "type": "boolean"
              },
              "lockfile": {
                "description": "The whole text of a lockfile or manifest.",
                "maxLength": 5000000,
                "type": "string"
              },
              "packages": {
                "items": {
                  "properties": {
                    "ecosystem": {
                      "description": "One of npm, PyPI, Packagist, Maven, Go, crates.io, RubyGems, NuGet, Docker, GitHub Actions, ConanCenter, Hackage, Pub, SwiftURL, Hex, CRAN, Julia (lowercase works, pip and composer too).",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "products": {
                "description": "Product ids people install: chrome, firefox, safari, edge, windows, macos, ios, android, linux, office, whatsapp, zoom, plex, wordpress, php, nodejs, python, openssl, nginx, apache-httpd, ivanti-connect-secure, pan-os, fortimail, fortios, cisco-asa, netscaler, check-point-gaia, sonicwall-sonicos, openssh, gitlab, tidb-cloud.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:db65e6e611f7698460089049f46747d46f616134f7ee22763e905092f19ae5ce"
        },
        {
          "name": "events_since",
          "title": "What changed",
          "description": "What changed since a date, oldest first: incidents created, updated or resolved, and big services going down or coming back. Keep `next` and pass it as `since` next time to watch.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "since": {
                "description": "An ISO date; the last 7 days when left out.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4ebf04cbc5c543bdc949a8027c739931ae9b199e163b0b30b7c3f7c57509e2e"
        },
        {
          "name": "get_incident",
          "title": "One incident",
          "description": "One incident by its id (as list_incidents or internet_status give it, like 2026-10-14-nextjs-rce), open or resolved.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The incident id.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d777b069f71530c8fd62f725be619fed3b77f4e40176d92c8b52918c87fdabb3"
        },
        {
          "name": "internet_status",
          "title": "Is the internet OK?",
          "description": "The live status of the whole internet: a one-sentence answer, every watched service (Cloudflare, AWS, Google Workspace, Discord, PlayStation Network, OpenAI, GitHub...) with its state and its group, and the open security incidents with what to do. Refreshed every 5 minutes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
