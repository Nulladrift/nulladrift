      "instructions": "AGILEX (松灵机器人) product documentation.\n\nUse this server BEFORE writing or explaining integration code for AGILEX hardware\n(piper, pika, nero, ranger, limo, scout, bunker, hunter, tracer, umr, cobot_magic,\naloha). It contains the official user manuals, CAN/protocol references, firmware\nnotes, FAQ and field-service procedures that shipped with those products.\n\nWorkflow:\n1. `search_docs` with the model name plus the concept you need\n   (e.g. \"piper CAN 波特率\", \"ranger mini 固件升级\").\n2. Once you have a `doc_id`, `find_in_doc` is usually the fastest way to a\n   specific passage — pass the concept (\"波特率\", \"急停 接线\"), not the product\n   name. Then read it with `get_doc(doc_id, offset=...)`. Call `get_doc` from\n   offset 0 only when you want the whole page from the top; note that manuals\n   often open with a preamble, so page 1 rarely answers a specific question.\n   Follow `next_offset` when you need the rest of a long section.\n3. Cite the `url` field so the user can open the original page.\n\nChinese and English titles both appear in the corpus; search in Chinese when the\nproduct docs are Chinese.\n\nKnow when to stop: search at most twice per topic. If those results are only\nweakly related — the titles and snippets do not actually discuss the concept you\nasked about — stop and tell the user the documentation does not cover it. Do not\nkeep rephrasing the query, and never guess a protocol detail or a pinout to fill\nthe gap. A search that returns nothing, or a `find_in_doc` with zero hits, means\nthe same thing: say so instead of inventing an answer.\n",
      "tools": [
        {
          "name": "find_in_doc",
          "description": "Locate a passage *inside* one manual, without paging through it.\n\n        Use this after ``search_docs`` whenever you need a specific table, command\n        or error code rather than the whole page — including short documents,\n        because manuals commonly open with a preamble and page 1 rarely answers a\n        question. It returns the exact ``offset`` of each match, so one\n        ``get_doc(doc_id, offset=...)`` lands on the right section.\n\n        Prefer this over repeatedly calling ``get_doc`` with increasing offsets.\n\n        Args:\n            doc_id: id from ``search_docs`` (also accepts the page slug).\n            query: the *concept*, not the product name — e.g. \"波特率\" or\n                \"急停 接线\". Terms that already appear in this page's title are\n                ignored, because ``search_docs`` picked the page by them; passing\n                the product name again only adds noise. Generic words that appear\n                in nearly every manual are down-weighted, so one distinctive term\n                is enough.\n            limit: 1-10 passages, default 5.\n\n        Matching is OR, not AND: a passage is returned when it contains at least\n        one term with enough weight. Terms that are absent from this page therefore\n        do **not** force a zero result — check ``missing_terms`` to see which of\n        your words this page never mentions, and ``matched_terms`` for the ones it\n        does. A query made only of stop words (or nothing) returns ``count: 0``\n        with a hint.\n\n        Returns JSON: {doc_id,title,space,url,chars,query,count,returned,\n        matched_terms,missing_terms,hits:[{offset,heading,score,matched,excerpt}],\n        hint}. ``count`` is the total number of matched passages; ``returned`` is\n        how many are in ``hits`` (capped by ``limit``). ``heading`` is the nearest\n        heading above the passage; ``offset`` is absolute in the page body.\n        ",
          "inputSchema": {
            "properties": {
              "doc_id": {
                "title": "Doc Id",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["doc_id", "query"],
            "title": "find_in_docArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_in_docOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ef0e07c0f7f48f206c0a96ffaafb75a24cd8bf4c5644c3aedb46977c450dfee"
        },
        {
          "name": "get_doc",
          "description": "Read one documentation page as Markdown.\n\n        Call this with a ``doc_id`` returned by ``search_docs`` (or a slug such as\n        ``ymZimX7JLe``). Manuals are often 20k-60k characters, so this tool\n        paginates: if the reply has ``truncated: true`` and a ``next_offset``,\n        call again with that ``offset`` to continue. Do not re-request the same\n        offset.\n\n        Args:\n            doc_id: id from search_docs (also accepts the page slug).\n            max_chars: characters per call, default 20000, max 120000.\n            offset: start position, default 0.\n\n        Returns JSON: {doc_id,title,space,url,chars,offset,returned,max_chars,\n        truncated,next_offset,updated_at,content}. Always cite ``url``.\n        If the page has no body (folder or unwritten page), the reply has\n        ``empty: true`` and a hint — do not retry with other offsets. A page whose\n        title marks it unpublished returns ``unpublished: true`` with empty\n        content; that is a publication decision, not a missing document.\n        ",
          "inputSchema": {
            "properties": {
              "doc_id": {
                "title": "Doc Id",
                "type": "string"
              },
              "max_chars": {
                "default": 20000,
                "maximum": 120000,
                "minimum": 1,
                "title": "Max Chars",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              }
            },
            "required": ["doc_id"],
            "title": "get_docArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_docOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88eacfd0ef471ba16044410e1fd512b938be68524d6f8ddd92d1c21c0fcc92f9"
        },
        {
          "name": "list_docs",
          "description": "List documented pages, optionally inside one space.\n\n        Use when the caller wants an inventory (\"what manuals exist for ranger\")\n        rather than an answer.\n\n        Args:\n            space: optional space slug or name fragment.\n            limit: 1-300, default 100.\n            offset: pagination offset, must be >= 0.\n\n        Returns JSON: {space, count, offset, docs:[{doc_id,title,space,url,chars}]}.\n        ``count`` is the number of docs in this page; compare it with ``limit`` to\n        decide whether to request the next page. There is no total field — use\n        ``list_spaces`` for per-space counts.\n        ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 100,
                "maximum": 300,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "space": {
                "default": "",
                "title": "Space",
                "type": "string"
              }
            },
            "title": "list_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_docsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
