          "digest": "sha256:998b2a4e0ffd4d0517c271a992547c0ba51203afb990551c021e59ad7517b65d"
        },
        {
          "name": "list_spaces",
          "description": "List the public documentation spaces with page counts.\n\n        Call this when the caller is unsure which product family a document\n        belongs to, or to explain coverage.\n\n        Returns JSON: {count, spaces:[{space,name,docs,chars}]}.\n        ",
          "inputSchema": {
            "properties": {},
