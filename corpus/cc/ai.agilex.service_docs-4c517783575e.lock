            "readOnly": true
          },
          "digest": "sha256:67af9e54d896c89f72e665d96e2fddcfb88e9844ce0639d3d18e4092817090a4"
        },
        {
          "name": "search_docs",
          "description": "Full-text search over the official AGILEX product documentation.\n\n        Use this first for any question about AGILEX hardware: pinouts, CAN\n        protocol details, baud rate, firmware upgrade, error codes, LED/beep\n        meanings, installation, calibration, SDK usage.\n\n        Args:\n            query: Chinese or English keywords. Include the product name\n                (piper / pika / nero / ranger / limo / scout / bunker / hunter /\n                tracer / umr) plus the concept, e.g. \"piper CAN 波特率\".\n            limit: 1-25 results, default 8.\n            space: optional space slug or name fragment to narrow the search,\n                e.g. \"agx-chassis-manual-cn-en\" or \"底盘使用手册\".\n\n        Returns JSON: {query, count, results:[{doc_id,title,space,url,score,chars,snippet}]}.\n        ``count`` is the number of results in this reply (0-``limit``). Pages whose\n        title carries 【未发】/【暂不对外】 are not offered for reading and never\n        appear here — they are unpublished, not missing.\n        ``doc_id`` is what ``get_doc`` expects.\n        ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "space": {
                "default": "",
                "title": "Space",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_docsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
