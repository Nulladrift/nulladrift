      "serverInfo": {
        "name": "inescapable-detail",
        "title": "Inescapable Detail · mobile car detailing, Jacksonville FL",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Inescapable Detail is a family-run mobile car detailer in Jacksonville, Florida. David, the owner, comes to the customer with his own water and power and does every car himself. Use get_services for prices (the price shown is the total), find_open_times for open days, and book_visit ONLY when the person has asked you to book and has confirmed their name, phone, the address, the day and the service. The Full Package takes a whole day. Pay at the visit.",
      "tools": [
        {
          "name": "book_visit",
          "title": "Book a visit",
          "description": "Books one visit, paid at the visit. Only when the person asked you to book and confirmed every field. David texts them to confirm. Pick a date and block from find_open_times; for service \"package\" the block is the whole day (send \"Morning\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address and city (or ZIP) in the Jacksonville area where the car is parked.",
                "type": "string"
              },
              "block": {
                "enum": ["Morning", "Afternoon"],
                "type": "string"
              },
              "car": {
                "description": "The car: year, make and model, like \"2022 Honda CR-V\".",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, from find_open_times.",
                "type": "string"
              },
              "gate_or_parking": {
                "description": "Where to park, and the gate code if there is one (\"driveway\" is fine).",
                "type": "string"
              },
              "name": {
                "description": "First and last name.",
                "type": "string"
              },
              "phone": {
                "description": "US mobile number, 10 digits.",
                "type": "string"
              },
              "service": {
                "description": "package = The Full Package; plus = The Full Package Plus; detail = The Detail; inside = Inside only; wash = Wash only.",
                "enum": ["package", "plus", "detail", "inside", "wash"],
                "type": "string"
              },
              "size": {
                "description": "three_row for a vehicle with three rows of seats (changes The Detail price) or a large truck (changes the Wash only price).",
                "enum": ["standard", "three_row"],
                "type": "string"
              }
            },
            "required": ["address", "block", "car", "date", "gate_or_parking", "name", "phone", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:211a891554ee26bb9447936c0581e767aedfea01592367d53c3cbe7a9cb26747"
        },
        {
          "name": "find_open_times",
          "title": "Open days and times",
          "description": "Open visit times in the next days (Jacksonville time). Mornings are 7 to 11 AM, afternoons 12:30 to 5 PM; Monday, Wednesday and Friday are mornings only; Saturday is closed. Set whole_day true for The Full Package: only days with the whole day open are listed. More than one car at one address: text David.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many days ahead to look (default 14).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "whole_day": {
                "description": "True for The Full Package or more than one car.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe2684e9f9681b4c580362fa8139091d27bc5d5f682c9e421439812f9061a225"
        },
        {
          "name": "get_services",
          "title": "Services and prices",
          "description": "The menu with today's prices in US dollars. The price shown is the total: stains, sand, pet hair and smells are included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
