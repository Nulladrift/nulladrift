      "instructions": "29 DNS, SEO, SSL, security, WHOIS, mail, and AI tools. tools/list is free. tools/call is paid either per call via x402 (USDC on Base, no account) or with a card-paid API key sent as `Authorization: Bearer mcptb_...` or `x-api-key`: Starter $9/mo 2,000 credits https://buy.polar.sh/polar_cl_ohAX5VD8UYJGDHAjfP8Y5jowuK2nRQu0jb2XU3c9PBm ; Pro $29/mo 10,000 credits https://buy.polar.sh/polar_cl_NSE3CdNGwKv97h1v4Koj5mQqMt0ow8CR8oJdR19py6p ; docs https://papacasper.com/mcp-docs#api-key",
      "tools": [
        {
          "name": "ai_readiness_audit",
          "description": "Score how ready a website is for AI agents and LLM-driven discovery, 0-100 with a letter grade: robots.txt presence, explicit AI-crawler policy (GPTBot, ClaudeBot, CCBot, PerplexityBot, and 8 more), llms.txt presence and structure, structured data (JSON-LD) and Open Graph basics, agent/payment discovery files (/.well-known/x402, /openapi.json), sitemap presence, and title/meta basics. The bundle to run before/after making a site agent-friendly — for raw robots/sitemap contents only, use check_robots_sitemap; for classic search SEO only, use seo_audit.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Any URL on the site to audit (origin is derived from it)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c8c1fade9a780a4729350cac4b9b270c140292e84dc88209245055414e1d581"
        },
        {
          "name": "broken_link_check",
          "description": "Find broken links two ways. Default (crawl mode): crawl a site starting from a URL (same-origin pages only, bounded by maxPages) and check every linked URL for broken status codes, returning each broken link with the page(s) it was found on. Sitemap mode (viaSitemap: true): parse the site's sitemap.xml (following one level of sitemap-index nesting) and check the status of every URL listed in it instead. Note: some external sites (e.g. social platforms) block automated HEAD/GET requests and may show up as false positives.",
          "inputSchema": {
            "properties": {
              "checkExternal": {
                "description": "Crawl mode only: also check links pointing off-site (default true; crawling never follows off-site links)",
                "type": "boolean"
              },
              "maxPages": {
                "description": "Max same-origin pages to crawl in crawl mode (default 20, capped at 50)",
                "type": "number"
              },
              "url": {
                "description": "Starting URL to crawl — or, in sitemap mode, the sitemap.xml URL or any page URL on the site",
                "type": "string"
              },
              "viaSitemap": {
                "description": "Check the URLs listed in the site's sitemap.xml instead of crawling pages (default false)",
                "type": "boolean"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6244f2500ebc28eae29fedd6d795ca89cc9429d585b92fec0bd51ab3f4fed79f"
        },
        {
          "name": "check_open_ports",
          "description": "TCP-connect scan a host for open ports, plus network intel on the host's resolved IPs (ASN, network owner, BGP prefix, country — via Team Cymru). Defaults to a list of ~20 common service ports (SSH, HTTP/S, mail, DBs, etc.) if none are given. For checking your own infrastructure's exposure — capped at 100 ports per call.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "Hostname or IP to scan (no scheme)",
                "type": "string"
              },
              "ports": {
                "description": "Specific ports to check. Defaults to a common-ports list. Max 100 ports per call.",
