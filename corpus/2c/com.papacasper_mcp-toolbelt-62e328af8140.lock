        {
          "name": "image_resize",
          "description": "Download an image from a URL and resize it with libvips (sharp): set width and/or height, fit mode (inside keeps aspect ratio within the box, cover crops to fill, contain letterboxes, fill stretches), output format (PNG, JPEG, WebP, AVIF) and quality. Honors EXIF rotation. Input up to 15 MB / 50 megapixels, output up to 4096px per side. Returns a short-lived download URL (valid 1 hour) with final dimensions and byte size; set includeBase64 for the bytes inline (up to 3 MB). Deterministic, no AI.",
