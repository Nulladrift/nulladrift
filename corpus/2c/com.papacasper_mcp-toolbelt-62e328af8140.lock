      "instructions": "39 DNS, SEO, SSL, security, WHOIS, mail, screenshot/PDF, validation, conversion, and archive tools. tools/list is free. tools/call is paid either per call via x402 (USDC on Base, no account) or with a card-paid API key sent as `Authorization: Bearer mcptb_...` or `x-api-key`: Starter $9/mo 2,000 credits https://buy.polar.sh/polar_cl_ohAX5VD8UYJGDHAjfP8Y5jowuK2nRQu0jb2XU3c9PBm ; Pro $29/mo 10,000 credits https://buy.polar.sh/polar_cl_NSE3CdNGwKv97h1v4Koj5mQqMt0ow8CR8oJdR19py6p ; docs https://papacasper.com/mcp-docs#api-key",
      "tools": [
        {
          "name": "address_normalize",
          "description": "Normalize a free-form US postal address to USPS Publication 28 style, deterministically (rule tables, no AI): uppercase, standard street-suffix, directional and unit abbreviations (Street -> ST, Suite -> STE, North -> N), state names to 2-letter codes, ZIP/ZIP+4 cleanup, and a parsed breakdown (house number, street, unit, city, state, ZIP). Formatting only — it does not verify the address is deliverable. Non-US addresses get whitespace cleanup only.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full address on one line or several, e.g. '1600 Pennsylvania Avenue Northwest, Washington, District of Columbia 20500'",
                "type": "string"
              },
              "country": {
                "description": "ISO country code (default US; only US gets full normalization)",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a48947f92c272dd03b51e71e43b95019fa7aaff0e8469bbbac745cb7bd3a42e5"
        },
        {
          "name": "ai_crawler_policy_check",
          "description": "Report, per AI crawler, whether a site allows or blocks it: parses robots.txt with RFC 9309 rules (most-specific user-agent group, longest-match Allow/Disallow, * and $ wildcards) for 29 AI agents including GPTBot, ChatGPT-User, OAI-SearchBot, ClaudeBot, Claude-Web, anthropic-ai, Google-Extended, PerplexityBot, CCBot, Bytespider, Applebot-Extended, Meta-ExternalAgent, Amazonbot and cohere-ai. Also reads the page's meta robots / X-Robots-Tag noai and noimageai hints and checks /llms.txt (and /llms-full.txt). Optional extra paths to test. Deterministic parsing, no AI. For a scored AI-readiness report use ai_readiness_audit; for raw robots/sitemap contents use check_robots_sitemap.",
          "inputSchema": {
            "properties": {
              "paths": {
                "description": "Optional extra paths to test per bot, e.g. ['/blog/', '/api/'] (max 10)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "description": "Any URL on the site (origin is derived from it); its path is also tested",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fde6eb8c9ab25a5a1b05c2a1007fee7afe8ab3de9b01c0d2d8f859f2eae0358"
        },
        {
          "name": "ai_readiness_audit",
          "description": "Score how ready a website is for AI agents and LLM-driven discovery, 0-100 with a letter grade: robots.txt presence, explicit AI-crawler policy (GPTBot, ClaudeBot, CCBot, PerplexityBot, and 8 more), llms.txt presence and structure, structured data (JSON-LD) and Open Graph basics, agent/payment discovery files (/.well-known/x402, /openapi.json), sitemap presence, and title/meta basics. The bundle to run before/after making a site agent-friendly — for raw robots/sitemap contents only, use check_robots_sitemap; for classic search SEO only, use seo_audit.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Any URL on the site to audit (origin is derived from it)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c8c1fade9a780a4729350cac4b9b270c140292e84dc88209245055414e1d581"
        },
        {
          "name": "archived_page_lookup",
          "description": "Find the Internet Archive Wayback Machine snapshot of a URL closest to a given date (default: now): capture time, how many days off it is, the viewable snapshot URL, a raw-content URL (original bytes, no Wayback toolbar), HTTP status, MIME type and content digest, plus a few next-closest captures. Defaults to successful (HTTP 200) captures only. Uses the public CDX index with an availability-API fallback. Good for seeing what a page said on a past date or proving when content changed.",
          "inputSchema": {
            "properties": {
              "alternatives": {
                "description": "How many next-closest captures to include, 0-10 (default 4)",
                "type": "number"
              },
              "date": {
                "description": "Target date: ISO (2015-01-01 or 2015-01-01T12:00:00Z) or Wayback timestamp (20150101). Default now",
                "type": "string"
              },
              "onlySuccessful": {
                "description": "Only consider HTTP 200 captures (default true)",
                "type": "boolean"
              },
              "url": {
                "description": "Page or domain to look up, e.g. example.com or https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7ed06c076285f844ca2b18a77d1c08209ebd9e518ed15d156412f01e8c68aa6"
        },
        {
          "name": "broken_link_check",
          "description": "Find broken links two ways. Default (crawl mode): crawl a site starting from a URL (same-origin pages only, bounded by maxPages) and check every linked URL for broken status codes, returning each broken link with the page(s) it was found on. Sitemap mode (viaSitemap: true): parse the site's sitemap.xml (following one level of sitemap-index nesting) and check the status of every URL listed in it instead. Note: some external sites (e.g. social platforms) block automated HEAD/GET requests and may show up as false positives.",
          "inputSchema": {
            "properties": {
              "checkExternal": {
                "description": "Crawl mode only: also check links pointing off-site (default true; crawling never follows off-site links)",
                "type": "boolean"
              },
              "maxPages": {
                "description": "Max same-origin pages to crawl in crawl mode (default 20, capped at 50)",
                "type": "number"
              },
              "url": {
                "description": "Starting URL to crawl — or, in sitemap mode, the sitemap.xml URL or any page URL on the site",
                "type": "string"
              },
              "viaSitemap": {
                "description": "Check the URLs listed in the site's sitemap.xml instead of crawling pages (default false)",
                "type": "boolean"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6244f2500ebc28eae29fedd6d795ca89cc9429d585b92fec0bd51ab3f4fed79f"
        },
        {
          "name": "check_open_ports",
          "description": "TCP-connect scan a host for open ports, plus network intel on the host's resolved IPs (ASN, network owner, BGP prefix, country — via Team Cymru). Defaults to a list of ~20 common service ports (SSH, HTTP/S, mail, DBs, etc.) if none are given. For checking your own infrastructure's exposure — capped at 100 ports per call.",
          "inputSchema": {
            "properties": {
              "host": {
                "description": "Hostname or IP to scan (no scheme)",
                "type": "string"
              },
              "ports": {
                "description": "Specific ports to check. Defaults to a common-ports list. Max 100 ports per call.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2b335fa42ce2180d1a302452f0db4937c852a3474529a7de5867ed06cc4be85"
        },
        {
          "name": "check_robots_sitemap",
          "description": "Check a site's robots.txt and sitemap.xml in one call: raw contents (truncated), sitemap presence, an AI-crawler policy analysis (explicit rules for GPTBot, ClaudeBot, CCBot, PerplexityBot, Google-Extended, Bytespider, Amazonbot and other AI crawlers, vs wildcard/default), and llms.txt presence. For a scored, whole-site AI-readiness report use ai_readiness_audit instead.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Any URL on the site to check (origin is derived from it)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1acbcbdb0959c63a7bb1d7489cdbc2aedb1a998654b1c02945718721cedb9ac3"
        },
        {
          "name": "csv_to_json",
          "description": "Convert CSV to JSON with a strict RFC 4180 parser: quoted fields, escaped quotes, embedded newlines, CRLF, BOM. Auto-detects the delimiter (comma, semicolon, tab, pipe) or takes one; uses the first row as keys by default (or returns arrays), and optionally infers numbers, booleans and empty-as-null. Pass CSV text or a URL to fetch (max 2 MB, 10,000 rows returned; truncation is flagged). Deterministic, no AI.",
          "inputSchema": {
            "properties": {
              "csv": {
                "description": "CSV text (provide csv OR url)",
                "type": "string"
              },
              "delimiter": {
                "description": "Field delimiter: ',', ';', '|', or 'tab' (default auto-detect)",
                "type": "string"
              },
              "header": {
                "description": "Treat the first row as column names and return objects (default true); false returns arrays",
                "type": "boolean"
              },
              "inferTypes": {
                "description": "Convert numbers, true/false, and empty cells to null (default true); false keeps every value a string",
                "type": "boolean"
              },
              "maxRows": {
                "description": "Maximum data rows to return, up to 10,000 (default 10,000)",
                "type": "number"
              },
              "skipEmptyLines": {
                "description": "Drop blank lines (default true)",
                "type": "boolean"
              },
              "url": {
                "description": "Public URL of a CSV file to fetch instead",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:018c0169390e1460ec716c71f991352b14f187e1ef8cfc2b1118d36b7a665c6a"
        },
