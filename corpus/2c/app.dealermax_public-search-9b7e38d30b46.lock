        {
          "name": "get_market_intel",
          "title": "Get automotive market intelligence",
          "description": "Ricerca semantica nelle FAQ del mercato auto italiano pubblicate dal network\n    DealerMAX. È la superficie EDUCATIVA/ESPLICATIVA della rete — concetti, normativa,\n    \"come funziona\" — dealer-neutrale e platform-wide, NON inventario né offerte.\n\n    Guide long-form e glossario NON sono più serviti da qui: vivono su\n    https://autousatebenissimo.it/guide e https://autousatebenissimo.it/glossario.\n\n    USA QUESTO TOOL per domande concettuali/informative (es. \"cos'è l'NLT\", \"incentivi auto\n    elettriche 2026\", \"ibrido vs plug-in\", \"come funziona la garanzia\"). NON usarlo per: auto\n    usate in vendita → search_vehicles; offerte di noleggio lungo termine → search_nlt_offers;\n    numeri tecnici di un modello (cavalli, consumi, dimensioni) → get_vehicle_specs;\n    anagrafica/contatti dei concessionari → find_dealer. Per il dettaglio di un singolo\n    elemento parti da un hit e apri la sua url.\n\n    Ritorna {mode, query, types, total, hits[], rate_limit}. mode=\"semantic\" (o\n    \"fallback_unavailable\" se l'embedding non è disponibile, con hits vuoto). Ogni hit: type\n    (\"faq\"), title, snippet (~220 char), url (path relativo: /domande-frequenti#),\n    slug, score, last_modified (ISO 8601), metadata (category). Hit ordinati per\n    score desc, troncati a limit. Contenuti in italiano.\n\n    Read-only, keyless. Rate limit 60 richieste/minuto per IP.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum total results to return (1-30, default 5).",
                "maximum": 30,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "Italian semantic query (e.g. 'incentivi auto elettriche 2026', 'differenza ibrido plug-in vs full hybrid', 'NLT vantaggi e svantaggi').",
                "title": "Query",
                "type": "string"
              },
              "types": {
                "anyOf": [
                  {
                    "items": {
                      "const": "faq",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Restringe la ricerca a un sottoinsieme di tipi editoriali. Oggi l'unico tipo servito e' faq=domande frequenti; ometti il parametro.",
                "title": "Types"
              }
            },
            "required": ["query"],
