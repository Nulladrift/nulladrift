                  }
                ],
                "default": null,
                "description": "Max contract duration in months (typical: 36, 48, 60).",
                "title": "Durata Max Mesi"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return (1-30, default 10).",
                "maximum": 30,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_seats": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum number of seats. E.g. 7 for people-movers / large families / NCC (7-9 seaters), 9 for 9-seaters only. Mirrors the dealer-site '7 o + posti' filter (?posti=7plus = min_seats 7). Each result exposes its actual seat count in the `seats` field.",
                "title": "Min Seats"
              },
              "query": {
                "description": "Italian or English semantic query (e.g. 'elettrica city car under 300/mese', 'SUV ibrido per famiglia', 'BMW X1 con manutenzione inclusa', 'furgone diesel sotto 500/mese').",
                "title": "Query",
                "type": "string"
