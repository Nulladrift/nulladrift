                ],
                "default": null,
                "description": "Filter by fuel slugs. Accepts: elettrico, ibrido-benzina, ibrido-diesel, benzina, diesel, gpl, metano. Aligned with SEO pages /noleggio-lungo-termine/alimentazione/<slug>.",
                "title": "Alimentazione"
              },
              "cambio": {
