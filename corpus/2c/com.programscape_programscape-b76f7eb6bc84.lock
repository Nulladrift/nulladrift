        {
          "name": "report_balance",
          "title": "Report a credit balance",
          "description": "Records the balance a provider shows for one program the founder keeps on their Programscape plan and has marked approved: the amount left, in the unit the provider reports it (US dollars, credits or requests), when it was read, and whether the founder’s own router or their assistant reported it. Optionally sets the number under which the founder wants an email reminder, in the same unit. Returns the balance as stored on the plan, with when it was read and who reported it. It is a report, never an estimate or a total, and it is never added to other programs or set against the amount awarded. Changes nothing else on the plan. Needs the founder’s Programscape sign-in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "What the provider shows as left, in `unit`, exactly as reported: dollars to the cent, or a whole number of credits or requests. Never an estimate, a conversion or a sum.",
                "type": "number"
              },
              "asOf": {
                "description": "When the balance was read from the provider, as an ISO 8601 date and time. Leave out to mean now.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "estimate": {
                "additionalProperties": false,
                "description": "Router only (0151): how long this balance lasts at the recent pace. Shown on the plan labelled as an estimate, with when it was worked out. It never sets an expiration date or a date reminder. Leave out when there is no pace yet.",
                "properties": {
                  "daysLeft": {
                    "description": "Whole days this balance lasts at the recent pace, as the router worked it out from its own readings.",
                    "maximum": 3650,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "workedOutAt": {
                    "description": "When the router worked it out, as an ISO 8601 date and time. Leave out to mean now.",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  }
                },
                "required": ["daysLeft"],
                "type": "object"
              },
              "lowBalanceAt": {
                "additionalProperties": false,
                "description": "Optional: the number under which the founder asked to be reminded, in the balance’s unit. Replaces the reminder number on the plan.",
                "properties": {
                  "amount": {
                    "description": "The number under which the founder wants a reminder.",
                    "type": "number"
                  },
                  "unit": {
                    "description": "The same unit as the balance.",
                    "enum": ["usd", "credits", "requests"],
                    "type": "string"
                  }
                },
                "required": ["amount", "unit"],
                "type": "object"
              },
              "planId": {
                "description": "The selected saved plan. Required when the account has more than one plan; an omitted id never chooses the most recently updated one.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "programId": {
                "description": "The id of a program the founder keeps on their plan and has marked approved, for example \"firecrawl.startup-deal\".",
                "maxLength": 160,
                "type": "string"
              },
              "source": {
                "description": "Who is reporting: \"router\" for the founder’s own credit router, \"assistant\" for an AI assistant the founder asked. Defaults to \"assistant\". Only a connection made from a program on the founder’s own computer (a loopback sign-in, as the router’s) can report as \"router\"; any other reports as \"assistant\".",
                "enum": ["router", "assistant"],
                "type": "string"
              },
              "unit": {
                "description": "The unit the provider reports the balance in: usd, credits or requests.",
                "enum": ["usd", "credits", "requests"],
                "type": "string"
              }
            },
            "required": ["amount", "programId", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report a credit balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7e153f1b69f892aa59e803dbdc5a157c5f418a52272eda3b1881c437ff1fb968"
        },
