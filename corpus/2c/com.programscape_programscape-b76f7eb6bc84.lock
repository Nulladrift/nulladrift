        {
          "name": "search_programs",
          "title": "Search startup programs and offers",
          "description": "Searches the reviewed catalog of startup credits, programs, support and product discounts across providers (AWS, Google Cloud, Microsoft Azure, OpenAI, Anthropic, NVIDIA, Stripe and more). Each result carries its official source and the date it was last checked. Can be limited to programs whose product offers an agent-tool capability (search, scrape, crawl, browser, extract, llm or sandbox): a program matches when its record lists any one of those asked for, and results keep the catalog’s own order. A result lists its capabilities when its record has been reviewed for them. A listing is not a statement that anyone qualifies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "capabilities": {
                "description": "Agent-tool capabilities, e.g. [\"search\"] or [\"scrape\", \"crawl\"]. A program matches when its record lists any one of them. Leave it out to search every program, including those not reviewed for capabilities.",
                "items": {
                  "enum": ["search", "scrape", "crawl", "browser", "extract", "llm", "sandbox"],
                  "type": "string"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "description": "\"programs\" for startup programs and support, \"offers\" for product discounts, \"all\" for both (the default).",
                "enum": ["programs", "offers", "all"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return (default 20, at most 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "A provider id such as \"aws\", \"gcp\", \"openai\" or \"stripe\". Leave empty for every provider.",
                "maxLength": 40,
                "type": "string"
              },
              "query": {
                "description": "Words to match against program names, headlines, products and providers. Leave empty to list everything.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
