      "serverInfo": {
        "name": "programscape",
        "title": "Programscape",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Programscape is an independent, founder-maintained map of 113 startup credits, programs and offers across 35 providers. Every record carries an official source and the date it was last checked; providers cannot pay for placement.\nUse build_route when a founder asks what fits them. Ask only what the founder hasn’t already said (profile_questions lists the questions); a fact they haven’t given stays unknown. Before suggesting an application, ask the questions that settle that program, then call build_route again with the answers.\nNever say a founder qualifies or will be approved: report the standing each tool returns. The provider decides.\nNever add amounts into a total, and never name a winning provider.\nCite the official source and checked date. When mayBeOutOfDate is true, tell the founder to confirm on the official page.\nWhen an agent needs credits for a tool capability such as web search, filter search_programs by capabilities. Programscape lists programs and does not route calls; the founder’s own open-source router does: npx @programscape/router@latest, set up at https://programscape.com/router.\nmy_plan, update_my_plan, report_balance, portfolio_perks and partner_perks_admin work on the person’s own Programscape account. The first time one is called, the founder is asked to sign in once (an email code or Google, no password); then call it again.\nA balance on the plan is the founder’s or their router’s report of what a provider showed, never a total: say it with its date and who reported it, never add balances across programs, and never subtract one from an award.\nWhen the founder wants to keep their review or have you keep their plan up to date, save it with update_my_plan: only the answers they gave and the programs they chose, and confirm with them before setting a program aside. If signing in isn’t possible here, call save_plan_draft and give them the link exactly as returned.",
      "tools": [
        {
          "name": "build_route",
          "title": "Build a founder’s route",
          "description": "Returns the review Programscape would show a founder, from what they have said about their company (stage, funding, the tools they use, company type and answers to earlier questions): a short read of what matters at their stage, the programs worth their time now with each one’s standing and the questions that settle it, and what can wait and why. For questions about which startup credits, programs or perks fit a company. A standing is never a statement that the founder qualifies, and a standing of “Ask {provider}” means that provider decides on request and publishes no criteria, so the founder’s step is to ask it; each amount is that program’s own figure, never a total; no provider is ranked the winner. The result says how the review can be saved.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 200,
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "type": "null"
                    },
                    {
                      "items": {
                        "anyOf": [
                          {
                            "maxLength": 80,
                            "type": "string"
                          },
                          {
                            "type": "boolean"
                          }
                        ]
                      },
                      "maxItems": 30,
                      "type": "array"
                    }
                  ]
                },
                "description": "The founder’s answers, keyed by question field: the shared questions’ fields or a question a review returned (e.g. \"stage\": \"seed\", \"funding\": [\"venture\"], \"currentProviders\": [\"aws\", \"openai\"], \"companyTypes\": [\"ai\"]). A fact the founder hasn’t given is left out and stays unknown.",
                "propertyNames": {
                  "maxLength": 80,
                  "type": "string"
                },
                "type": "object"
              },
              "inferredAnswers": {
                "description": "The worked-out partner answers a saved plan returned as inferredAnswers, exactly as returned: the review reads them as Programscape worked them out, not as the founder’s own answers, and one from a list that has changed since as unanswered.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "const": "yes",
                      "type": "string"
                    },
                    "field": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "listDated": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["answer", "field", "listDated"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a founder’s route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52350f48c35cd3463246c0d58d94b0ae4748dcf916df38bf28d3e8a45ef6ab0c"
        },
