        {
          "name": "small_business_stack_report",
          "description": "A free/freemium software stack for a small business, one pick per need with alternatives, from freesmallbiztools.com's checked listings (vendor quote and check date). Costs $1 USDC via x402; invalid input is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "business_type": {
                "enum": ["service", "trades", "retail", "online_store", "creator", "consultant", "agency", "nonprofit"],
                "type": "string"
              },
              "free_only": {
