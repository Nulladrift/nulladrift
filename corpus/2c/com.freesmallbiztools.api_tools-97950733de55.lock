      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free Small Biz Tools: quote totals, late fees and a checked free-tool directory for small businesses. Free: quote_totals, late_fee, list_tools, pricing. Paid (x402 USDC on Base in _meta['x402/payment']): late_fee_notice ($0.01), quote_pack ($0.05), small_business_stack_report ($1). Invalid calls are not charged. Invoices and reminders: PaidPilot (paidpilot.io).",
      "tools": [
        {
          "name": "late_fee",
          "description": "Free. Late fee on an overdue invoice (simple interest by day: monthly, annual or daily percent, or a flat fee), with days late, total due and a state-cap caution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "maximum": 100000000,
                "minimum": 0.01,
                "type": "number"
              },
              "due_date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "grace_days": {
                "maximum": 365,
                "minimum": 0,
                "type": "number"
              },
              "paid_date": {
                "description": "YYYY-MM-DD, default today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rate": {
                "description": "default 1.5",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "rate_type": {
                "enum": ["monthly_percent", "annual_percent", "daily_percent", "flat"],
                "type": "string"
              }
            },
            "required": ["amount", "due_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Late fee (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bb8b46f0fe2e0670887fa3e082eb687718012a1a24fb4da23c72dbb731cc708"
        },
        {
          "name": "late_fee_notice",
          "description": "Late fee plus a ready-to-send reminder email (subject and body) for an overdue invoice, in a polite, firm or final tone. Costs $0.01 USDC via x402; invalid input is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "maximum": 100000000,
                "minimum": 0.01,
                "type": "number"
              },
              "business_name": {
                "maxLength": 80,
                "type": "string"
              },
              "client_name": {
                "maxLength": 80,
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "grace_days": {
                "maximum": 365,
                "minimum": 0,
                "type": "number"
              },
              "invoice_number": {
                "maxLength": 40,
                "type": "string"
              },
              "paid_date": {
                "description": "YYYY-MM-DD, default today",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rate": {
                "description": "default 1.5",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "rate_type": {
                "enum": ["monthly_percent", "annual_percent", "daily_percent", "flat"],
                "type": "string"
              },
              "tone": {
                "enum": ["polite", "firm", "final"],
                "type": "string"
              }
            },
            "required": ["amount", "due_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
