              "scale_percent": {
                "description": "Target scale in percent, e.g. 80 for -20%",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["file_base64", "scale_percent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c40e1c9236d765906932ff751b30a7ceb9265a48eafa16e42ca8e136617f2d5"
        },
        {
          "name": "firewood_calculator",
          "description": "Convert firewood volume between cord (128 ft3), stere/Raummeter (stacked m3), solid m3 (Festmeter), loose m3 and ft3, with optional weight estimate by wood species (dry/fresh).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Input unit: stere = 1 stacked m3, cord = 128 ft3, loose = bulk m3",
                "enum": ["stere", "cord", "loose", "ft3"],
                "type": "string"
              },
              "loose_factor": {
                "default": 1.4,
                "description": "Loose m3 per stacked m3 (1.35-1.55 typical)",
                "exclusiveMinimum": 1,
                "type": "number"
              },
              "moisture": {
                "default": "dry",
                "description": "fresh = 1.5x weight",
                "enum": ["dry", "fresh"],
                "type": "string"
              },
              "solid_factor": {
                "default": 0.7,
                "description": "Solid m3 per stacked m3 (Festmeter/Raummeter, 0.65-0.75 typical) - the weight runs off this",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "species": {
                "description": "Optional species key for weight",
                "enum": ["pine", "spruce", "fir", "cedar", "poplar", "oak-red", "oak-white", "maple-hard", "birch", "ash", "beech", "walnut", "cherry", "mahogany", "teak", "mdf", "plywood", "oak-engineered"],
                "type": "string"
              },
              "value": {
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["from", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0c5a984db92017fd5413f5224e73d70e8face94bde2a7d00298bf6722f0ebcb"
        },
