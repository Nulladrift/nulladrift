        {
          "name": "green_log_weight",
          "description": "Weight of a roundwood/log batch at any moisture content: W = volume x basic density x (1 + MC/100), per USDA Wood Handbook 2021 Ch.4. Presets for 14 verified species (acacia, rubberwood, eucalyptus, oak, teak, spruce...) or a custom basic density. Returns oven-dry mass, water mass and tonnes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "basic_density_kg_m3": {
                "description": "Custom basic density (oven-dry kg per green m3); overrides the species preset",
                "minimum": 0,
                "type": "number"
              },
              "mc_pct": {
                "description": "Moisture content % oven-dry basis; defaults to the species' freshly-felled MC (~73% acacia, ~75% rubberwood)",
                "minimum": 0,
                "type": "number"
              },
              "species": {
                "description": "Species key, e.g. acacia-mangium, rubberwood, white-oak, teak",
                "type": "string"
              },
              "volume_m3": {
                "description": "Roundwood volume in m3 (Hoppus true, Huber or JAS volume)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
