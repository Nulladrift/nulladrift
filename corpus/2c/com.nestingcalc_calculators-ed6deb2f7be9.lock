      "tools": [
        {
          "name": "baluster_spacing_calculator",
          "description": "Equal baluster/spindle spacing for a run: number of balusters, exact gap and positions. Enforces a maximum gap (e.g. the 4-inch / 100 mm sphere code rule).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "baluster_width_mm": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "max_gap_mm": {
                "default": 100,
                "description": "Maximum allowed gap (100 mm = sphere rule, 102 mm = 4 in)",
                "minimum": 0,
                "type": "number"
              },
              "run_mm": {
                "description": "Total run length between posts",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["baluster_width_mm", "run_mm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0bdcf1ce5a10e09830178dd7d40af96aad36665866b468a3342dcadcc6eb108d"
        },
        {
          "name": "board_feet_calculator",
          "description": "Calculate board feet and lumber cost (thickness x width x length / 144 in inches). Accepts multiple boards and an optional price quoted per board foot or per MBF (thousand board feet).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boards": {
                "description": "Boards (dimensions in the chosen unit)",
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "length": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "qty": {
                      "default": 1,
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "thickness": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "width": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["length", "thickness", "width"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "price": {
                "description": "Optional price per price_unit",
                "minimum": 0,
                "type": "number"
              },
              "price_unit": {
                "default": "bf",
                "description": "Unit the price is quoted in: single board foot or MBF (1,000 bf)",
                "enum": ["bf", "mbf"],
                "type": "string"
              },
              "unit": {
                "default": "in",
                "description": "Unit for board dimensions",
                "enum": ["in", "ft", "mm", "cm", "m"],
                "type": "string"
              }
            },
            "required": ["boards"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec7d3d89c7f08050cc011223ffe4b2f37f64b841cbda83a9711a7e8045a4283a"
        },
        {
          "name": "bom_costing",
          "description": "Bill-of-materials cost roll-up for furniture: buy quantity = net qty x (1 + waste%, verified presets: S4S lumber 18%, rough 28%, nested panels 10%, hardware 3%), line and total costs, cost per product and a selling price from a target margin (price = cost / (1 - margin)).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "labor_per_product": {
                "description": "Direct labour per product",
                "minimum": 0,
                "type": "number"
              },
              "lines": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "qty": {
                      "description": "Net quantity per product",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "unit": {
                      "description": "Unit label (m3, m2, pcs...)",
                      "type": "string"
                    },
                    "unit_cost": {
                      "description": "Cost per unit",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "waste_pct": {
                      "default": 0,
                      "description": "Waste allowance %",
                      "maximum": 200,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["qty", "unit_cost"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "margin_pct": {
                "description": "Target margin on selling price, %",
                "maximum": 90,
                "minimum": 0,
                "type": "number"
              },
              "products": {
                "default": 1,
                "description": "Products this BOM covers",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c8e6fbbc9dda3a19e51446a226e179658dcbfb8a32fc98231cab445b9f5dc65"
        },
        {
          "name": "cbm_shipment",
          "description": "Packing CBM for cartons: per-line and lot volume (m3), total weight and lot density, with a cube-out / weigh-out verdict against the 40HC balanced density (390 kg/m3 - same presets as container loading).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lines": {
                "description": "Carton lines",
                "items": {
                  "properties": {
                    "count": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "height_cm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "length_cm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "weight_kg": {
                      "description": "Gross weight per carton, kg",
                      "minimum": 0,
                      "type": "number"
                    },
                    "width_cm": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["count", "height_cm", "length_cm", "width_cm"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd63900de62913d8f9a200199ec084ebfc83f4048d7caf14526ac3c395ea1194"
        },
        {
          "name": "cnc_feeds_speeds",
          "description": "CNC spindle RPM and feed rate from tool diameter, flute count, chip load and cutting speed. Works for routers and mills, metric and imperial.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "chip_load": {
                "description": "Chip load per tooth (mm or inch)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cutting_speed": {
                "description": "Cutting speed Vc (m/min or ft/min)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "flutes": {
                "default": 2,
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "machine": {
                "default": "router",
                "enum": ["router", "mill"],
                "type": "string"
              },
              "tool_diameter": {
                "description": "Cutter diameter (mm or inch)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit": {
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["chip_load", "cutting_speed", "tool_diameter", "unit"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f50b28906a75f4b85abe4e0594a902fca6d83946bb9c700ac82e44bd98bb455a"
        },
        {
          "name": "container_loading",
          "description": "How many uniform cartons fit in a shipping container before cube-out or weigh-out. Presets: 20GP (33.2 CBM nominal, 28,200 kg payload), 40GP (67.7 CBM, 26,700 kg), 40HC (76.4 CBM, 68 usable, 26,500 kg) — all editable. Returns max pieces by volume vs weight, the binding limit, balanced density (kg/m3) and containers needed for a planned quantity.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cbm_per_piece": {
                "description": "Volume per carton in CBM (alternative to dimensions)",
                "minimum": 0,
                "type": "number"
              },
              "container": {
                "default": "40hc",
                "enum": ["20gp", "40gp", "40hc", "custom"],
                "type": "string"
              },
              "kg_per_piece": {
                "description": "Mass per carton (kg)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "payload_kg": {
                "description": "Override max payload (kg); route limits are often lower than the container maximum",
                "minimum": 0,
                "type": "number"
              },
              "piece_h_m": {
                "description": "Carton height (m)",
                "minimum": 0,
                "type": "number"
              },
              "piece_l_m": {
                "description": "Carton length (m)",
                "minimum": 0,
                "type": "number"
              },
              "piece_w_m": {
                "description": "Carton width (m)",
                "minimum": 0,
                "type": "number"
              },
              "planned_qty": {
                "description": "Planned number of cartons (returns containers needed)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "usable_cbm": {
                "description": "Override usable/stowable volume (CBM)",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["kg_per_piece"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db6dab9326f22276e3b3ca643f2a5c3110d9109ba11a9cffaded30e9c8213fb7"
        },
        {
          "name": "cutting_speed_calculator",
          "description": "Cutting speed from spindle speed: Vc = pi*D*n/1000 metric (m/min), SFM = pi*D*n/12 imperial. Always also returns the same speed converted to the other unit system. Includes a web_url with the calculation prefilled.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "diameter": {
                "description": "Tool/workpiece diameter (metric: mm, imperial: inch)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "rpm": {
                "description": "Spindle speed in revolutions per minute",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "unit": {
                "default": "metric",
                "description": "Unit system",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["diameter", "rpm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:456b93d54b2c4cb2521af4be9d1810cfe0a86b0be98ff1d75212e026b4f03ae4"
        },
        {
          "name": "embroidery_resize",
          "description": "Resize an embroidery design file (PES or DST) by a scale percentage. Returns stitch stats before/after, a density safety verdict (safe within +/-15%) and the resized file as base64.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "file_base64": {
                "description": "Base64-encoded PES or DST file",
