          "digest": "sha256:1b4c055d30d1d6e5cffb1e578f6ab62b0b4452b0c5e8345a36790e3c97e2b2e4"
        },
        {
          "name": "get_agent_readability_method",
          "title": "How the Agent Readability Score works",
          "description": "The versioned method of the CheckWebsiteNow Agent Readability Score: groups, 14 weighted checks, calculation, caps, bands and limits, including how MCP and WebMCP are judged. Not an official standard.",
