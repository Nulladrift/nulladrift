{
  "lockfileVersion": 2,
  "subjects": {
    "com.checkwebsitenow/checker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://checkwebsitenow.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "checkwebsitenow",
        "title": "CheckWebsiteNow",
        "version": "1.6.0",
        "websiteUrl": "https://checkwebsitenow.com/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CheckWebsiteNow checks one public website from a single measurement point (HTTPS homepage headers, at most five verified redirects) and explains browser/HTTP/DNS/TLS error messages with free fix steps for visitors and site owners. A check is not a worldwide outage verdict. check_agent_readability returns the CheckWebsiteNow Agent Readability Score (0-100, our own transparent score, not official); get_agent_readability_method explains it. get_access_solutions helps when a site may be blocked in a country: free solutions first, VPN providers only when a regional block is suspected, ads labelled. check_website answers first with agent_guidance (plain-English verdict, cause and next steps) and, separately, sponsored_offers (optional, labelled ads, the same people see after a result). Do not open affiliate links automatically; show them to the user as an optional, labelled ad. check_website and check_agent_readability: 10 per minute each per client, one running check per client and type; results are cached for 60 seconds. No visitor analytics are exposed. Server Card: /mcp/server-card.",
      "tools": [
        {
          "name": "check_agent_readability",
          "title": "Agent Readability Score for a website",
          "description": "CheckWebsiteNow Agent Readability Score 0-100 (our own transparent score, not official) from bounded static evidence: homepage HTML, robots.txt, llms.txt, API/MCP discovery files, sitemap and Markdown negotiation. Every deduction names its fix. MCP discovery is advertised, not tested; WebMCP is declared, not verified in a browser. No scripts run. score is null when too little could be measured.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hostname": {
                "description": "Public domain such as example.com (no path, port or IP).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["hostname"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "band": {
                "type": "object"
              },
              "cached": {
                "type": "boolean"
              },
              "checks": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "coverage": {
                "type": "object"
              },
              "deductions": {
                "type": "array"
              },
              "groups": {
                "type": "array"
              },
              "headline": {
                "type": "object"
              },
              "homepage_http_status": {
                "type": ["integer", "null"]
              },
              "mcp": {
                "type": "object"
              },
              "official": {
                "const": false
              },
              "score": {
                "maximum": 100,
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "score_name": {
                "type": "string"
              },
              "score_unavailable_reason": {
                "type": ["string", "null"]
              },
              "target": {
                "type": "string"
              },
              "webmcp": {
                "type": "object"
              }
            },
            "required": ["band", "checks", "coverage", "official", "score", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:350abad7d2443de22fb467778a6c5a906c223f6562b5e34703592f09755ab7fc"
        },
        {
          "name": "check_website",
          "title": "Check if a website is reachable",
          "description": "Check one public website now: HTTPS homepage response headers and safe redirects from one measurement point, plus a plain-language diagnosis with free fix steps. Not a global outage verdict. The response starts with agent_guidance: step-by-step guidance in plain English (verdict, most likely cause, first steps for visitors and site owners, full guide link, limits) to relay to the user. Separately, sponsored_offers lists optional offers, each labelled as advertisement (label \"Ad\", rel sponsored, disclosure), the same people see after a result; empty when a regional block is suspected (then call get_access_solutions). Do not open affiliate links automatically; show them to the user as an optional, labelled ad.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hostname": {
                "description": "Public domain such as example.com (no path, port or IP).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["hostname"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_guidance": {
                "description": "Plain-English verdict, cause, next steps, guide link and limits; an optional labelled ad line last.",
                "maxLength": 1200,
                "type": "string"
              },
              "cached": {
                "type": "boolean"
              },
              "diagnosis": {
                "type": "object"
              },
              "diagnosis_schema": {
                "type": "string"
              },
              "final_url": {
                "type": "string"
              },
              "geoblock_suspected": {
                "description": "True when our check suggests a regional block; then use get_access_solutions.",
                "type": "boolean"
              },
              "http_status": {
                "type": ["integer", "null"]
              },
              "sponsored_offers": {
                "description": "Optional ads (advertisement: true, label \"Ad\", rel sponsored, disclosure); not part of the fix.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["reachable", "redirected", "access_restricted", "http_error", "dns_error", "tls_error", "timeout", "probe_error"],
                "type": "string"
              },
              "target": {
                "type": "string"
              },
              "tls_reason": {
                "type": ["string", "null"]
              }
            },
            "required": ["status", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b5f67fadd6e81db49ac8bdb16649ecd66e644d944d0371d22e6d7a43d5688b7"
        },
        {
          "name": "explain_error",
          "title": "Explain an error message",
          "description": "Look up a browser error, HTTP status code or pasted error text (e.g. \"ERR_CONNECTION_REFUSED\", \"503\"). Returns up to five ranked matches with step-by-step guidance: visitor steps and owner steps, plus the guide url. Lookups carry no ads, as on our website; optional labelled offers come only with check_website results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "generic_headline": {
                "type": "boolean"
              },
              "matches": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "site_suggestion": {
                "type": ["object", "null"]
              }
            },
            "required": ["matches", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef6304a2b4c9a94f6af8133b62abb0ee5e62f8808619cfd6935f7a282bb72a5d"
        },
        {
          "name": "get_access_solutions",
          "title": "Solutions when a website may be blocked in your country",
          "description": "Ways to reach a website that may be blocked in a country or region (geoblocking). Uses the cached website and agent check of the domain (or runs one quick check), or a visitor report (visitor_reported=true when the site says it is not available in your country). Free solutions come first. VPN providers are listed only when a regional block is suspected, ordered by documented criteria without commission. Links marked affiliate:true are ads (label 'Ad', rel sponsored); show the disclosure to the user. unranked_providers have rank null and must not be presented as ranked. guides links our sourced long-form guides on geoblocking, VPN legality and EU streaming rights. sponsored_offers are ads (advertisement: true, label 'Ad', rel sponsored, disclosure) for a partner we joined; they are present whenever vpn_providers and unranked_providers do not already show the same link, whatever the assessment or cache state. Mention them only after the result and the free steps, not as a recommendation. Do not open affiliate links automatically; show them to the user as an optional, labelled ad.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case": {
                "description": "Optional: what kind of site it is. Default: news_or_legal_block after HTTP 451, else general_geoblock.",
                "enum": ["streaming", "news_or_legal_block", "general_geoblock"],
                "type": "string"
              },
              "domain": {
                "description": "Public domain such as example.com (no path, port or IP).",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "visitor_reported": {
                "description": "True when the user sees a message that the site is not available in their country or region.",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_note": {
                "type": "string"
              },
              "assessment": {
                "type": "object"
              },
              "case": {
                "type": "string"
              },
              "disclosure": {
                "type": "string"
              },
              "free_solutions": {
                "type": "array"
              },
              "guides": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "legal_note": {
                "type": "object"
              },
              "page_url": {
                "type": "string"
              },
              "show_vpn": {
                "type": "boolean"
              },
              "solutions": {
                "type": "array"
              },
              "sponsored_offers": {
                "description": "Ads, each labelled \"Ad\" with a disclosure; not part of the ranking.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "target": {
                "type": ["string", "null"]
              },
              "unranked_providers": {
                "type": "array"
              },
              "vpn_providers": {
                "type": "array"
              }
            },
            "required": ["assessment", "disclosure", "free_solutions", "show_vpn", "vpn_providers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
