      "instructions": "Kurdish text-to-speech (Sorani, Kurmanji and Badini) and speech-to-text (Sorani and Kurmanji).\n\nCREDENTIALS\n- TTS and STT are SEPARATE key spaces. Send \"Authorization: Bearer <ttsKey>\" or\n  \"Bearer <ttsKey>:<sttKey>\" to use both in one session. Keys are 40 lowercase hex characters.\n- list_dialects, list_voices and get_plan need no key. synthesize_speech, transcribe_audio and\n  start_streaming_transcription are billed and require one.\n- No key? Call get_plan for the plan ladder, or GET https://www.kurdishtts.com/api/plans.\n\nCHOOSING A VOICE (this is where first calls usually fail)\n- Always pass the SAME model_version to list_voices and synthesize_speech. Both default to\n  \"v3\". A speaker id from one catalog does NOT exist in another.\n- Never invent a speaker_id. Take it from list_voices.\n- Free keys can only render: v3 → sorani_85, sorani_214, kurmanji_6, kurmanji_12; v4 → sorani_1, sorani_986, kurmanji_236, kurmanji_233.\n  Every other id returns 403 on a free plan. model_version \"v5\" and the Cast/Studio voices\n  require a paid API plan. Call get_plan to see what your own key may use.\n\nTRANSCRIBING (read before calling transcribe_audio)\n- \"dialect\" SELECTS THE DECODER. It is not a hint and nothing detects it for you. Sorani audio\n  decoded as Kurmanji returns fluent, confident, WRONG text — HTTP 200, no warning, fully billed.\n- If you are not certain which dialect the audio is, pass dialect \"auto\". It transcribes with both\n  decoders, returns both, and lets you pick the coherent one. It bills the audio TWICE; say so if\n  the user is paying per minute.\n- Free plans truncate the returned transcript at 500 characters. The whole file is still\n  transcribed and billed — only the text you get back is cut.\n\nAPI GOTCHAS\n- \"speed\" is caller-facing: HIGHER = FASTER.\n- Omit \"temperature\" entirely; sending 0.0 returns 422.\n- On v4 a successful-looking response carrying collapsed:true is a FAILED generation, not audio.\n- Cast and Studio voices (cast_*, studio_*) are tagged sorani because their reference clip is, but\n  they read Sorani AND Kurmanji. To get a correct Kurmanji read from one, pass dialect \"kurmanji\" to\n  synthesize_speech — without it the voice pronounces Kurmanji text with Sorani phonetics.\n- Badini (Behdini) is a THIRD dialect: Northern Kurdish written in the Arabic script. It is\n  TEXT-TO-SPEECH ONLY — transcribe_audio and start_streaming_transcription do not accept it. Its six\n  badini_ voices are the only ones that read it, and they read nothing else; a badini_ id resolves on\n  v5 whatever model_version you send. Free keys may render badini_story_m and badini_narrator_f.\n- The \"moods\" field on a voice is not callable yet: /api/tts-proxy rejects \"emotion\" with a 400.\n- start_streaming_transcription is for LISTENING (live microphone to text), not for speaking. It\n  consumes one streaming session from your plan THE INSTANT it is called.\n\nSPEAKING IN REAL TIME\n- MCP cannot stream audio: a tool result is one message, so synthesize_speech must finish the whole\n  clip before you get anything. That is fine for a sentence and wrong for a live voice agent.\n- For first-audio latency, call POST https://www.kurdishtts.com/api/tts-stream directly with the same API key and\n  stream_format \"sse\" (or \"pcm\"). It emits speech.audio.delta events and returns first audio in\n  about a second. Keep MCP for one-shot lines; use that endpoint for conversation.\n\nLIMITS\n- synthesize_speech: 4000 characters per call in the default mp3 container, but only\n  600 with format \"wav\" (uncompressed audio hits the transport limit ~8x sooner).\n  Free plans are capped at 500 characters server-side regardless of format.\n- transcribe_audio: 3MB of decoded audio — about 90 seconds of 16kHz WAV, but roughly 25 minutes\n  of 64kbps MP3. Send compressed audio and you fit far more in one call. For bigger files use POST\n  https://www.kurdishtts.com/api/stt-proxy (multipart) or the signed-URL job flow.",
