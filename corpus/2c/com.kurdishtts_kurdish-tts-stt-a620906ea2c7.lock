          },
          "digest": "sha256:c22946331445d621a59a4a8ad0c4b6dfb483ddfe3edb7f67c9077c376ee0707c"
        },
        {
          "name": "synthesize_speech",
          "title": "Kurdish text to speech",
          "description": "Convert Kurdish text (Sorani or Kurmanji) to speech audio. Requires a TTS API key; characters are billed against your plan. Get speaker_id from list_voices called with the SAME model_version you pass here (default \"v3\") — ids are not shared between catalogs. Returns one complete clip: MCP cannot stream, so for a live voice agent call POST https://www.kurdishtts.com/api/tts-stream directly instead (SSE, first audio in ~1s). Max 4000 characters per call in the default mp3 container, 600 with format \"wav\"; free plans are capped at 500 server-side. Note: speed is caller-facing (higher = faster).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dialect": {
                "description": "Language the text is in. Normally inferred from the speaker_id prefix and safe to omit. REQUIRED to get a correct Kurmanji read from a Cast or Studio voice (cast_*, studio_*): those are tagged sorani after their reference clip but read Sorani and Kurmanji, so without this they pronounce Kurmanji with Sorani phonetics. \"badini\" is valid only with one of the six badini_ voices — pairing it with any other voice is refused with a 400.",
                "enum": ["sorani", "kurmanji", "badini"],
                "type": "string"
              },
              "format": {
                "description": "Audio container. Default \"mp3\". Audio is returned base64-encoded inside the tool result, so the container decides how much of your context it costs: for identical speech, mp3 is ~7.5x smaller than wav and opus ~11.5x. Choose \"wav\" only when you need uncompressed audio, and keep the text under 600 characters if you do.",
                "enum": ["mp3", "opus", "wav"],
                "type": "string"
              },
              "include_timestamps": {
                "description": "Return JSON with word-level timestamps instead of an audio block. NOTE: the audio in that JSON is headerless raw PCM16 (24kHz mono), not a WAV file — add a WAV header before saving it, or it will not play.",
                "type": "boolean"
              },
              "model_version": {
                "description": "Voice catalog and plan entitlement. Default \"v3\". Explicit \"v5\" and the Cast/Studio voices require a paid API plan.",
                "enum": ["v3", "v4", "v5"],
                "type": "string"
              },
              "speaker_id": {
                "description": "Voice id from list_voices, e.g. \"sorani_85\" or \"kurmanji_6\" on the default \"v3\" catalog. Dialect is derived from the prefix. Must come from the same model_version you pass below.",
                "type": "string"
              },
              "speed": {
                "description": "Playback speed, higher = faster. Default 1.",
                "maximum": 4,
                "minimum": 0.25,
                "type": "number"
              },
              "text": {
                "description": "Kurdish text to synthesize. Max 4000 characters (only 600 if you set format \"wav\"); free plans are capped at 500.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["speaker_id", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e071b2d43b5dfc7e94cd51400dd10df83d2f9ed73b98acad64d13a9cb6fc287a"
        },
        {
          "name": "transcribe_audio",
          "title": "Kurdish speech to text",
          "description": "Transcribe Kurdish audio (Sorani or Kurmanji) to text. Requires an STT API key; usage is metered per audio minute against your plan. IMPORTANT: dialect selects the decoder and nothing detects it for you — transcribing Sorani audio as Kurmanji returns fluent, confident, WRONG text with no error. Pass dialect \"auto\" when you are not certain, and pick the coherent transcript from the two it returns. Max 3MB of decoded audio over MCP (~90s of 16kHz WAV, but ~25 minutes of 64kbps MP3 — send compressed audio to fit more); for larger files call POST https://www.kurdishtts.com/api/stt-proxy directly (multipart).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audio_base64": {
                "description": "Base64-encoded audio file (WAV, MP3, FLAC, OGG or M4A). Max 3MB decoded — compressed formats fit far more speech in that budget than WAV does.",
                "maxLength": 4194308,
                "minLength": 1,
                "type": "string"
              },
              "dialect": {
                "description": "Which decoder to run. \"sorani\" or \"kurmanji\" when you know the dialect. \"auto\" transcribes with BOTH and returns both transcripts so you can choose — it bills the audio twice, so prefer a known dialect when you have one.",
                "enum": ["sorani", "kurmanji", "auto"],
                "type": "string"
              },
              "filename": {
                "description": "Original filename, used to infer the format. Default audio.wav.",
                "type": "string"
              },
              "mime_type": {
                "description": "Audio MIME type. Default audio/wav.",
                "type": "string"
              }
            },
            "required": ["audio_base64", "dialect"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
