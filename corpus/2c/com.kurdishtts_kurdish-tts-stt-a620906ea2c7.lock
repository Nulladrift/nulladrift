        {
          "name": "list_voices",
          "title": "List Kurdish TTS voices",
          "description": "List available Kurdish text-to-speech voices. Returns speaker ids to use with synthesize_speech. Free metadata call — no credits consumed, no API key needed. Defaults to model_version \"v3\", the SAME default synthesize_speech uses — pass the same model_version to both, because a speaker id from one catalog does not exist in another. Results are paginated; the response reports total_count and which ids a free plan may render.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dialect": {
                "description": "Filter by dialect.",
                "enum": ["sorani", "kurmanji", "badini"],
                "type": "string"
              },
              "gender": {
                "description": "Filter by voice gender.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum voices to return. Default 25.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "model_version": {
                "description": "Voice catalog. Default \"v3\", matching synthesize_speech. v3 is the compatibility catalog; v4 is the large catalog (hundreds of voices); v5 is the curated catalog plus Cast and Studio voices, and requires a paid API plan.",
                "enum": ["v3", "v4", "v5"],
                "type": "string"
              },
              "offset": {
                "description": "Number of voices to skip, for paging. Default 0.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
