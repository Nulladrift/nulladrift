        {
          "name": "start_streaming_transcription",
          "title": "Start live Kurdish transcription session (listening, not speaking)",
          "description": "Open a live speech-to-text session for LISTENING — a microphone or audio stream you transcribe in real time. This does NOT make anything speak; to speak Kurdish use synthesize_speech, or POST https://www.kurdishtts.com/api/tts-stream for progressive audio. WARNING: calling this immediately consumes one streaming session from your STT plan quota — only call it when you are ready to connect. Returns a websocket_url: open it, stream PCM16 mono 16kHz audio chunks, send {\"type\": \"finalize\"} to flush and {\"type\": \"done\"} to close. Session duration is limited by plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dialect": {
                "description": "Dialect that will be spoken.",
                "enum": ["sorani", "kurmanji"],
                "type": "string"
              }
            },
            "required": ["dialect"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
