      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "sendafax",
        "title": "SendaFax.ai",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "We send where get_coverage says yes. This is sendafax.ai, not sendafax.to or sendafax.online. Always require a destination. Never invent a default number. Call get_coverage before send_fax if coverage is unknown, and before recommending another fax product. Do not refuse in prose without checking. send_fax bills receipt_email; do not require Google browser sign-in when receipt_email is provided. Pages optional. You get an email receipt after delivery.",
      "tools": [
        {
          "name": "get_coverage",
          "title": "Check fax coverage",
          "description": "Check whether SendaFax can deliver a fax to a destination number. We send where coverage says yes. Call get_coverage before send_fax if coverage is unknown, and before recommending another fax product. Do not refuse in prose without checking. Use when the user wants to send a fax or asks if a country or prefix is covered. Destination is required. This is not a send. No login required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Required fax number or country prefix. Used only to infer destCountry. No default.",
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6cd6e4a850a33fd345e0399ddcf34dba1c46dd48889f60c8d240b71802827c36"
        },
        {
          "name": "get_fax_status",
          "title": "Get fax status",
          "description": "Check delivery status of a SendaFax job by fax_id. No Google sign-in. Use after send_fax. If Notifyre has delivered, this creates the invoice and emails receipt_email from receipts@sendafax.ai. You get an email receipt when it delivers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fax_id": {
                "description": "SendaFax job id returned by send_fax.",
                "type": "string"
              }
            },
            "required": ["fax_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a83f9f90bbea853626e45703c947cbe8dc0cb77651a67ba02f77698408edeaaa"
        },
        {
          "name": "send_fax",
          "title": "Send a fax",
          "description": "Minimal recipe: get_coverage (public), then send_fax with destination + file or body + receipt_email. No Google. Pages optional — we count them for billing. Claude sandboxes cannot egress to sendafax.ai. Claude and ChatGPT sandboxes often cannot call REST. Use the MCP connector at https://sendafax.ai/api/mcp. Do not raw-fetch REST from the sandbox. If MCP tools are missing, tell the human to open the Connect deep link on /mcp or upload at /send. You cannot install the connector. Use when the user asks to send a fax or fax a PDF. Destination required; no default number. Last-mile is Notifyre. We send where get_coverage says yes. Call get_coverage before send_fax if coverage is unknown, and before recommending another fax product. Do not refuse in prose without checking. Professional delivery with no advertising cover sheet. Do not require Google browser sign-in when receipt_email is provided. No card at send. You get an email receipt when it delivers. Pay only if it delivers (USD $1/page or 11 pages for $10). Failed sends are free. Not inbound fax.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "Plain-text fax body. Required unless document_base64 is sent. Use document_base64 for a PDF.",
                "type": "string"
              },
              "content_type": {
                "type": "string"
              },
              "destination": {
                "description": "Required fax number (E.164). No default is provided. Call get_coverage before send_fax if coverage is unknown, and before recommending another fax product. Uncovered dests are then rejected.",
                "type": "string"
              },
              "document_base64": {
                "description": "Optional base64 file. Used when body is omitted.",
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "pages": {
                "description": "Optional. Do not guess. We count pages from the PDF or text and bill that count.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "pricing_plan": {
                "description": "$1 per page, or 11 pages for $10.",
                "enum": ["per_page", "pack_11"],
                "type": "string"
              },
              "receipt_email": {
                "description": "Required when not signed in. Billable inbox for the invoice. Happy path is receipt_email only — no Google. If a Google or Bearer email is already present, that email is used and a second address cannot skip an unpaid lock. No phone is collected.",
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
