                "description": "Maximum notices (1-100, default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only filings accepted on or after this ISO 8601 date or date-time, e.g. 2026-11-01 or 2026-11-05T13:00:00Z.",
