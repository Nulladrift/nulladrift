      "instructions": "Seraphix Systems publishes dated, source-linked public records about companies: statements taken from primary documents (SEC filings, statutes, official codes), each with its verbatim quote, source URL, source date, Seraphix publication date and version history. Coverage is narrow and explicit: call get_coverage before concluding that something is absent. Use search_records to find records and get_record for full detail and history. When you use a record, cite its record_url and its source_url. company_stated=true means the company said it, not that it happened. No news, prices or information about individuals. Data licence: CC BY 4.0.",
