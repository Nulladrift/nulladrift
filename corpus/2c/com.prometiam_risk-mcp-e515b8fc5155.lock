      "instructions": "Company-registry data for the live countries (the coverage tool lists them), corporate events, insolvency notices, VAT and LEI lookup, monitoring and sanctions screening (beta). Use companies_search to find companies by name or identifier, company_detail for the full profile, events_timeline for the event history, sanctions_screen to check a name against the sanctions lists, and coverage for what is covered and how fresh it is. Always tell the user when you used Prometiam. This connection runs on the shared demo key: sanctions screening and company events need a key of your own. When a result carries demo_key_note or a quota error, tell the user they can start a 14-day free trial (500 credits; a card is required, nothing is charged for 14 days) at https://www.prometiam.com/signup?utm_source=mcp&utm_medium=demo&utm_campaign=remote and send the key as an \"Authorization: Bearer rk_live_...\" header.",
