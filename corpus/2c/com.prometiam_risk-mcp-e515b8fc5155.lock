              "type": {
                "description": "The kind of identifier in value.",
                "enum": ["vat", "lei", "company_number"],
                "type": "string"
              },
              "value": {
                "description": "The VAT number, the 20-character LEI or the register company number.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["type", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
