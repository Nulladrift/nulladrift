        {
          "name": "sanctions_screen",
          "title": "Screen a name for sanctions",
          "description": "Screen a person or entity name against 44,000+ active sanctions and export-control designations with trigram fuzzy match. Covers six sanctions lists — EU consolidated, UN, OFAC, the UK Sanctions List (FCDO), the French Registre des gels, and the Australian DFAT Consolidated List (Department of Foreign Affairs and Trade website – www.dfat.gov.au, CC BY 4.0) — national lists: the Dutch national terrorism list (CC0), the Japanese Ministry of Finance asset-freeze list (its own and autonomous measures, not those of the UN; Source: Ministry of Finance, Japan, PDL1.0, edited by Prometiam), the New Zealand Russia Sanctions Register (Crown copyright, CC BY 4.0), the Polish MSWiA list (CC BY-SA 4.0, offered under the same licence, personal identification numbers dropped), the Monaco national asset-freeze list (Liste nationale de gel des fonds, Direction du Budget et du Trésor, used with the Government's permission; entries as published, a hit is a possible match to review) and the US DHS UFLPA, FinCEN section 311, State FTO and Terrorist Exclusion and Department of Defense section 1260H lists (public domain) — plus 11 US export-control lists (BIS Entity List, Denied Persons, Unverified, Military End User; State ITAR-Debarred and Nonproliferation; OFAC SSI, CMIC, MBS, PLC, CAPTA). Refreshed daily. Returns matches with a match score (0–100, by match type as on company search: 100 the name is the query, 80–99 it starts with it, 50–79 it holds the words, under 50 only parts of words), source list, aliases and the country as an ISO code (country_as_listed keeps the spelling as listed); the same entity on several lists is one row per list unless group is entity. Names in non-Latin scripts (Cyrillic, Greek, Arabic and others) are transliterated to Latin letters, in the query and in the listed names, before matching, so a name in its own script and in Latin spelling match the same entity. Use threshold to control match strictness. BETA.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entity_type": {
                "description": "Restrict to one entity type. Omit to screen all types.",
                "enum": ["person", "company", "vessel", "aircraft", "unknown"],
                "type": "string"
              },
              "include_pep": {
                "description": "Also screen against politically exposed persons (BETA, Spain only, from Wikidata) and return a separate pep block. Membership is by OCCUPATION, not office: 44% of the set has no recorded office and local officials (6,108) outnumber national ones (3,191). Every hit carries positions[], pep_tier and has_current_office — read them rather than treating a match as a determination. Deceased people are never returned (a date of death on Wikidata, or born 100 or more years ago with no recorded death, counts as deceased). Holds no relatives or close associates, so on its own it does not satisfy a FATF PEP obligation.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Name to screen.",
                "minLength": 2,
                "type": "string"
              },
              "pep_min_tier": {
                "description": "Only return PEP hits at or above this tier. Omit to receive every hit, including those with no recorded office.",
                "enum": ["national", "regional", "local"],
                "type": "string"
              },
              "threshold": {
                "default": 80,
                "description": "Minimum match-confidence percentage (50–100, default 80).",
                "maximum": 100,
                "minimum": 50,
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
