                "enum": ["ES", "GB", "IE", "PL", "NO", "FI", "SE", "BE", "HR", "DK", "EE", "SK", "CH", "LV", "CY", "RO", "LT", "CA", "AU", "JP", "IL", "SG", "CO", "TW", "BR", "CZ", "DE", "IT", "IN", "AT", "GR", "LU", "HU", "PT", "JE", "MX", "NL", "AR", "UA", "RS", "EC", "US"],
