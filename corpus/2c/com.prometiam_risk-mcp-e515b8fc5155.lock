              },
              "country": {
                "description": "Restrict to one country; omit for all countries. IE to BE are TED awards above the EU thresholds only (FI to BE since November 2023).",
                "enum": ["ES", "FR", "GB", "IE", "PL", "NO", "FI", "SE", "DK", "EE", "LV", "LT", "SK", "CZ", "HR", "RO", "BE", "CO"],
                "type": "string"
              },
              "cpv": {
                "description": "CPV code or prefix, 2-8 digits (45 = construction works).",
                "pattern": "^\\d{2,8}$",
                "type": "string"
              },
              "cursor": {
                "description": "Pagination cursor — pass the previous response's pagination.next_cursor, unchanged, to fetch the next page (a company name search issues o:<n>, the rows already served).",
                "type": "string"
              },
              "date_from": {
                "description": "Award date on or after (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
