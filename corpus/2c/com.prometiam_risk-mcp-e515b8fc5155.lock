          "name": "companies_search",
          "title": "Search companies",
          "description": "Search companies in official registries by name or identifier. Every company is one standard object with the same keys in all 36 countries (null where the register publishes no value): identifiers [{type, value}], vat_number and vat_number_source (register or rule; also in identifiers as type vat; `register`: published by the register (EE; LV from the State Revenue Service’s list of VAT payers; LT from the State Tax Inspectorate’s list; AU the ABN while GST-registered; TW the unified business number where the company is in the tax file) or the register confirms VAT registration and the number is the legal format of its identifier (NO, FI, BE). `rule`: built from the company identifier (ES `ES`+NIF, FR `FR`+key+SIREN, PL `PL`+NIP, NO `NO`+number+`MVA`, FI, SE `SE`+number+`01`, BE, HR `HR`+OIB, DK, RO `RO`+CUI, CH `CHE`+UID+`MWST`): the format is right, the registration is not confirmed (check an EU number with `GET /vat/{number}`; VIES has no NO or CH). Null where the register says the company is not VAT-registered (NO, FI), where a Latvian company is not on the State Revenue Service’s list of VAT payers, and where no rule exists (GB, IE, SK, CY, US, CA, JP, IL, BR, CO, SG, CZ, DE, IT, IN, AT, GR, LU, HU, PT, JE, MX, and EE without a published KMKR).), the standard legal_form abbreviation and legal_form_family beside the register's local_legal_form and local_legal_form_name, a standard status and stage, status_group (active or inactive) and status_qualifier (rescue_plan, insolvency_proceedings, administratively_non_compliant, bankruptcy, in_liquidation, dissolved, dissolved_merger, dissolved_demerger, administratively_suspended, inactive) beside the register's own local_status (both are read from the register's own status and never inferred from silence: the qualifier is null for an ordinary active company and wherever the register does not say; a rescue plan only where the stored status says so; administratively_suspended only for Brazil's suspended registrations, not a pause the company asked for; Australia's external administration serves no group; dormant, reorganization, default of payment and a dissolution that followed a bankruptcy or a liquidation are not served), one main activity_code with its scheme, label and NACE class (nace_class, nace_version, nace_division, nace_derived, and nace_title, its English title), the same industry as a NACE Rev. 2 and a NACE Rev. 2.1 class or division (nace_rev2_class, nace_rev2_division, nace_rev21_class, nace_rev21_division), the ISIC Rev. 4 class (isic4_class) and the US NAICS 2022 sector and subsector (naics_sector, naics_subsector) through the official correspondence tables of Eurostat, the United Nations and the US Census Bureau (a class only where the table links exactly one, the division where the linked classes share one, otherwise null, never a guess and never read from the name; ES and PL mix two editions of their classification, so a class that exists in both revisions with changed content is served only when both readings give it; BR, CO and SG derive from ISIC Rev. 4), each code with its English title as the official table words it (nace_rev2_title, nace_rev21_title, isic4_title, naics_sector_title, naics_subsector_title: the title of the class, or of the division where only the division is served; null exactly when the code is), and the age of the company: age_years (whole years on the day of the answer), age_band (under_1y, 1_3y, 3_5y, 5_10y, 10_20y, 20y_plus) and age_basis (founding_date, else registration_date; null for CH and JP, which publish no founding date, and for DE, which serves no founding date; in an LEI layer the date is the entity creation date GLEIF holds, which can be later than the start of the company), name_latin and name_latin_basis (the Latin-letter name, upper case, of a company whose register writes its legal name in another script, and where it comes from: register, gleif or romanisation; never a translation; null when the legal name is already in Latin letters or no Latin name exists; served for JP, IL, TW, CY, UA, RS, GR and the LEI layers; Hebrew, Chinese and Korean are never romanised, so IL and TW have one only where the register or GLEIF holds one; a Ukrainian name with Russian letters has none; a search in Latin letters also finds the company by it), address with region, capital_amount and capital_eur, and registry_details for what only one register has (null when the dictionary does not recognise a stored value — never a guess), and advertising_protected (Denmark: the CVR register mark that the company asked not to be contacted for direct marketing, CVR act s.19; true means do not use the record for direct marketing, false means the register states no protection, null for other countries and where the register holds no mark yet; the company is served either way). Use country to scope the search to Spain (BORME), France (BODACC), the UK (Companies House), Ireland (CRO), Poland (KRS), Norway (Brønnøysundregistrene), Finland (Kaupparekisteri), Sweden (Bolagsverket), Croatia (Sudski registar), Belgium (KBO/BCE), Denmark (CVR), Estonia (e-Business Register), Slovakia (RPO), Switzerland (Zefix), Latvia (Register of Enterprises), Cyprus (DRCOR), Romania (ONRC), Lithuania (JAR), Canada (Corporations Canada), Australia (ASIC and the ABR), Japan (National Tax Agency), Israel (Corporations Authority), Brazil (CNPJ), Colombia (RUES), Singapore (ACRA), Taiwan (GCIS), the Czech Republic (public register, Ministry of Justice, and RES), Germany (LEI-registered entities and energy-market register companies), Mexico (LEI-registered entities and the companies of INEGI's DENUE directory, not the company register), or the United States (state registers, SEC EDGAR and GLEIF). Fuzzy name results carry a match_score (0–100) and are ranked by relevance, best first. NOTE: \"dissolved\" means different things by country — ES/FR still exists pending liquidation, GB/IE/PL/NO/FI no longer exists — read status (the standard value), not local_status, to compare across countries. Norway and France include sole proprietorships (ENK, EI) as the register publishes them; a French company that opted out of publication (INSEE non-diffusible) has company_name null, status withheld and registry_details.non_diffusible true, is left out of name searches, the founding-date feed and event searches by name, and is found by SIREN or SIRET. Every French company carries registry_details.diffusion_status, the Sirene status of the company: O diffusible, P partially diffusible (the company or its owner restricted the diffusion of its data, art. A.123-96 of the Code de commerce), null while not read yet; a P company has no address and no postal code, and a sole proprietorship that INSEE lists without a name is served like a non-diffusible company. A Spanish company closed by a merger is served as closed (local_status absorbed). A malformed identifier (a Spanish NIF must pass its control character), or a limit outside the documented range, is a 400 validation_error. A name search ranks a pool of up to about 700 candidates and pages through it: when has_more is true, pass next_cursor (o:<n>) back as cursor (offset=<n> is the same), 1 credit a page; a page past the pool is empty. match_score (0-100) means the same in every country: 100 the name is the query, 80-99 it starts with the words of the query, 50-79 it holds every word, below 50 parts of words. match_type on every result says what it matched on: exact (the identifier, the whole name, or a listing with no name), partial (the name starts with or holds the words) or, only when the usual search found nothing, fuzzy (a similar spelling, any country: similarity 0.6 or more, 0.45 in Spain, where a hit must also hold every distinctive word of the name (one letter off at most), at most 10 companies, meta.search_mode name_fuzzy, approximate) or nif_other_letter (Spain only: a NIF with entity letter A or B that finds nothing returns the company holding the same digits under the other letter, which may be another company: confirm the name; meta.search_mode nif_other_letter). Both fallbacks cost the same credits as a normal search and are never applied by companies_lookup, which stays exact. To look up a company whose register number you hold (NIF, SIREN, CRN, KRS, CVR), call company_detail with country and company_number FIRST: one call, 1 credit, the full record, and a number not found is a free 404; search here by identifier only when it answers not found (in Spain this search also answers a NIF whose entity letter A or B differs, nif_other_letter, which company_detail does not). When a search by identifier finds exactly one company, meta.hint names that one call. bic (every company that has an lei, no extra credit): the BIC codes that the GLEIF BIC-to-LEI mapping, built by SWIFT and updated monthly, lists for the LEI ([] when it has none, null when the company has no lei); an answer that carries a BIC carries SWIFT notice in meta.attribution, keep it with the codes. mic (same rule): the market identifier codes (ISO 10383) that the GLEIF MIC-to-LEI mapping, built by SWIFT and updated about monthly, lists for the LEI; only trading venues and market operators have one, so most companies carry []; its own SWIFT notice goes in meta.attribution after the BIC one. service_address (address, postal_code, city, region: the address for legal notices), parent_company (name, country, identifier, relationship controlling_entity or head_office, source annual_filing, as_of: the controlling entity or foreign head office the company declared), duration_end_date (the end of the term fixed in the bylaws; null when indefinite or not published) and filing_profile (the provenance of values read from the latest annual filing: source, source_label, filing_id, period_end, source_url, reported_status, reported_status_local, auditor_required), every plan, no extra credit, null where unknown, any country can fill them. The register value always comes first; only where it has none do address, postal_code, city, region and business_purpose take the latest filing profile, and the filing phone, mobile and e-mail appear in contacts with data_source annual_filing. Today only Colombia fills them (Superintendencia de Sociedades NIIF cover sheet, companies that file NIIF accounts with it): values as the company declared them at the period end, not checked by the register; reported_status is the own declaration of the company, never written into status. register_url (every company, no extra credit): a link to the company's own page at the official register, never a copy of it; only registers whose public page has a stable address built from the company's number (GB, BE, EE, JP, AU by the ABN, as at 11 Nov 2026), null elsewhere, including registers that need a login or a search form. eu_size_class, eu_size and fiscal_year_end_month (every plan, no extra credit): an INDICATIVE EU size class (micro, small, medium or large of Commission Recommendation 2003/361/EC: staff under 10, 50 and 250, and turnover or balance sheet total up to EUR 2m, 10m and 50m, 43m for the balance sheet total) read from the latest annual accounts held (fiscal year 2022 or later) and the register head count; a class, never the figures, with eu_size.range (the classes still possible when the class is null), eu_size.basis, eu_size.autonomy (unverified, or group_member_known) and indicative true. Not a determination that a company is or is not an SME: the partner and linked-enterprise test cannot be applied (a known parent only floors the class; France INSEE category ETI or GE means large, PME at most medium), one year is read, the head count is the accounts average or the register, not annual work units. GB, RO, FR, EE, SE, DK, LV and NO give a class; LT and FI (no head count) a range, or large; null for sole proprietorships (ENK, EI), Brazil, Colombia and every other country. fiscal_year_end_month (1-12) is the month the latest annual accounts end, for every company of those countries with annual accounts held, whatever the fiscal year.",
