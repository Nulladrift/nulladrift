                "type": "string"
              },
              "limit": {
                "description": "Hits returned per name (default 10).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "description": "Comma-separated source lists to restrict to, e.g. OFAC,EU,UN.",
                "type": "string"
              },
              "names": {
                "description": "Names to screen (people, companies, vessels).",
                "items": {
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "threshold": {
                "description": "Minimum similarity 30-100 (default 80).",
                "maximum": 100,
                "minimum": 30,
                "type": "integer"
              }
            },
            "required": ["names"],
            "type": "object"
