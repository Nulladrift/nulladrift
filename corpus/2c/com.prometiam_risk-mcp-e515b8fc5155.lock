                "description": "Registry identifier — exact match. Resolves per country: Spanish NIF/CIF (A78053147), French SIREN, UK Companies House number (00445790, SC123456), the IE/PL/NO registration number, for country FI a Y-tunnus such as 0112038-9 (the hyphen is optional; a wrong check digit is a 400), for country SE an organisationsnummer such as 556012-5790 (the hyphen is optional; a wrong check digit, or a third digit below 2, is a 400), for country HR an MBS such as 080000604 (a dropped leading zero is restored; the check digit is advisory, so only a wrong length is a 400), for country BE an enterprise number such as 0417.497.106 (the dots and spaces are optional; a wrong check digit is a 400), or for country DK a CVR number such as 24256790 (eight digits; the mod-11 check is advisory, so only a number that is not eight digits is a 400), for country LT a juridinio asmens kodas such as 110053842 (nine digits, the ninth a check digit; an LT prefix is a VAT number and is refused), for country CA a corporation number such as 426160-7 (the last digit is a check digit), for country AU an ACN or ARBN such as 004 028 077, for country JP a 13-digit corporate number such as 1180301018771 (the first digit is a check digit), for country IL a company number such as 520013954 (nine digits starting 51, 52 or 56), for country BR a CNPJ such as 33.000.167/0001-01 (the 8-digit root finds the head office), for country CO a NIT such as 900843898-9, for country SG a UEN such as 196800306E, for country TW a unified business number such as 22099131, for country CZ an IČO such as 45274649 (eight digits), for country DE the 20-character LEI such as W38RGI023J3WT1HWRP32 (ISO 17442 check), or for country US a state code and register number such as NY-4424185, CIK- and the SEC number such as CIK-0000320193, or LEI- and the 20-character LEI (no check digit; the dash is optional).",
