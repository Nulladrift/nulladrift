              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results to return (1–100, default 20).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_amount": {
                "description": "Minimum awarded amount in EUR (matches amount_eur only; Colombian contracts never match).",
                "minimum": 0,
                "type": "number"
              },
              "nif": {
                "description": "Supplier identifier as published, exact match: NIF/CIF (Spain), SIRET (France), Companies House number (United Kingdom), CRO number (Ireland), NIP or KRS (Poland), organisasjonsnummer (Norway), the national company number for the other TED countries; supplier_id_scheme says which.",
                "type": "string"
              },
              "supplier": {
                "description": "Supplier name, matched anywhere (min 3 characters).",
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
