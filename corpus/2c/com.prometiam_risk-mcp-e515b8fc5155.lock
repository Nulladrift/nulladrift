              "include": {
                "description": "Comma-separated extra blocks: procurement, insolvency, financials, lei, risk_flags, structure, metrics, securities, charges — or all (all adds lei and risk_flags; name procurement, insolvency, financials, structure, metrics and securities explicitly). structure adds corporate_structure: the direct and ultimate parent as reported to GLEIF (Level 2, CC0) for a company of any live country that carries an LEI (null with a meta.notice when none is linked: not reported, not no parent). For a company of Estonia, Latvia, Norway or Slovakia the block also carries register_ownership from the register, legal entities only (natural persons are never stored or served): shareholders (EE, LV), sole_shareholder (SK: the sole shareholder of an a.s.; EE and LV: a shareholder holding 100 %), partners (SK: the partners of an s.r.o.), auditors, accountants and unlimited_liability_partners (NO), each {name, identifier, country, company_id, share_pct, capital_amount, currency, since}, with as_of, source and credit; it is returned even when no LEI is linked. An empty list means this register shows no legal-entity relation of that kind that we hold, never that the company has no owner, auditor or partner; share_pct is null where the source gives no share. EE and LV give shareholders only, NO no shareholders and no dates, SK no share figures. No extra credit. For a Spanish company the block is returned even without an LEI and carries register_ownership: the sole shareholder named by the BORME sole-shareholder notices since 2009 (companies only; a natural person is never stored or served; null sole_shareholder means no notice names a company, not that there is no owner), the ultimate owner, the foreign parent of a branch (NIF W) and the companies it solely owns, all figures floors; credit: Based on data from the Agencia Estatal Boletín Oficial del Estado (BORME). financials adds latest_financials (GB, FR, DK, SE, NO, FI, US SEC filers, EE, LT and RO headline figures, LV, CO Superintendencia de Sociedades filers, BR listed companies, and listed companies in ES, PL, HR, BE; Scale plan and above; see company_financials for the limits). charges (GB) asks Companies House live for the secured-debt summary when the nightly crawl has not reached it (the summary is registry_details.charges: outstanding, satisfied and part-satisfied counts, latest charge date, lenders of the outstanding charges; null = not fetched yet, unknown, never none). risk_flags is Spain and Colombia (procurement_fine: administrative fines on public contracts by NIT, not court judgments, with amount_original and currency) and each Spanish row states whether its identifier was read directly from the source or reconstructed with name corroboration. The stored flags of other countries (AU, FR, GB, IT, LV, PL, SK) come back with the same keys. metrics adds, for a company that has figures, {<metric>: {label, unit, periods: [{period_start, period_end, value}]}, source, source_url, as_of, credit} with the latest 8 periods of each metric, newest first, as the source published them (Great Britain: gender pay gap, bonus gap and payment practices of the employers that must report; Latvia: average employees and taxes paid per quarter for the companies the State Revenue Service lists); a company without a figure has none, which says nothing about it; 0 credits. securities adds {isin_count, isins, listings, as_of, source, credit} for a company with an LEI (null with a notice otherwise): the ISINs the GLEIF ISIN-to-LEI file links to the LEI (at most 100, sorted), as published, not necessarily every security the entity issued; listings is an empty list, no listing data is served yet; 0 credits. Every company object also carries parent_company and isin_count. One controlling company per company, from the first source that names one: the register (source register: a legal-entity shareholder holding 100 % (sole_shareholder) or more than 50 % (majority_shareholder) where the register names shareholders (ES, EE, LV, SK), or the foreign head office of a Spanish branch (head_office)), then its own annual filing (annual_filing, controlling_entity or head_office: as declared, not checked; Colombia, NIIF filers of the Superintendencia de Sociedades), then the GLEIF direct accounting parent (gleif, accounting_parent: the entity that consolidates its accounts as the company reported it to GLEIF, not an ownership percentage). lei and company_id are set where the parent has an LEI or is a company we serve. Null where no source names one: not 'no parent'. On every company object (search items, details and lookups), at no extra credit; the full structure stays in include=structure.",
