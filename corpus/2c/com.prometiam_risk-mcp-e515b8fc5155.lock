        {
          "name": "events_timeline",
          "title": "Get company event timeline",
          "description": "Returns the event history for one company, newest first. Useful for building lifecycle timelines from incorporation through capital changes, director appointments, and dissolution. One of company_number or company_name is required. Every event carries advertising_protected: for a Danish company the CVR advertising-protection mark (CVR act s.19; true means do not use the event for direct marketing, and pass the company name or address on only with the mark), null otherwise.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
