          "name": "company_financials",
          "title": "Get financial statements",
          "description": "Annual financial statements of a company as filed with the official registers, mapped to one standard chart (revenue, gross profit, operating profit, net profit, assets, cash, equity, liabilities, employees), in the filing currency and in euro (and with convert_to in any currency with an ECB annual average rate, or EUR: figures_converted, ratios_converted and fx_converted, the nearest year's rate where the fiscal year is missing), up to ten fiscal years. A null figure was not stated in the filing, never zero. Annual accounts as filed, for GB, FR, DK, SE and NO, plus FI (statements filed digitally with PRH, the Finnish Patent and Registration Office: XBRL, the company own accounts, about one filer in twenty, registered since July 2023, no employee count, profit before tax before appropriations; plus listed groups), US SEC filers (annual reports 10-K, 20-F and 40-F from EDGAR XBRL, consolidated, US GAAP or IFRS, fiscal years from 2023, in the filing currency (mostly USD) plus euro; no statements for other US companies) and consolidated annual reports of listed groups in GB, DK, SE, LV and LT (ESEF, IFRS, beside the individual accounts, fiscal years from 2022; the latest is fiscal 2024 for SE and 2023 for LV), and listed companies only in ES, PL, HR and BE (their ESEF annual financial reports, IFRS, mostly consolidated; the report of every listed company is not held, and Polish reports arrive more than a year late; reports of Spanish listed companies are available free of charge on the CNMV website). FR: accounts keyed by INPI from the filed documents; none for companies that declare their accounts confidential (about 45% of French filers), and no profit and loss account where only it is declared confidential. Elsewhere only digitally filed accounts: GB electronic (iXBRL) filings, about three in four, where small and micro companies often file no profit and loss account; DK XBRL annual reports, where most small companies report gross profit instead of revenue (Contains CVR data (Erhvervsstyrelsen), CC BY 4.0.); SE digitally filed (iXBRL) reports only; NO the last three approved accounts, with no employee count in the accounts. GB, DK, SE, LV and LT also hold the consolidated annual financial report of listed groups and other issuers (ESEF, IFRS; UKSEF for GB), statement_type consolidated, annual reports only, fiscal years from 2022, as filings.xbrl.org (XBRL International) collects them (an issuer registered elsewhere, a building society or a mutual is not matched; SE: no report added after May 2025, LV after July 2024); credit: Contains annual financial reports published by the issuers (ESEF, IFRS), collected by XBRL International (filings.xbrl.org). Adapted by Prometiam. The last three fiscal years at launch. Figures in the filing currency plus euro at the ECB annual average of the fiscal year (for comparison, not an accounting translation). EE: headline figures only (about sixteen summary items from the annual report: assets, equity, revenue, profits, employee expense, head count; total liabilities is assets minus equity), never a full statement, fiscal years 2019 on (a fiscal year whose report carries no figures in the open data is absent), updated monthly; some figures are read from PDF reports and non-profit income statements follow their own layout. Contains data from the Estonian e-Business Register (RIK), CC BY 4.0. LV: full balance sheet and profit and loss account with employees as filed, consolidated statements separate, fiscal years 2015 on in euro, no cash flow, no filing date, updated daily. Contains data from the Register of Enterprises of the Republic of Latvia (CC0). RO: headline indicators only (assets, equity, debts, net turnover, profit or loss, average employees) of companies filing with the Ministry of Finance, never a full statement, fiscal years 2019 on, in lei with euro copies, no banks, insurers or non-profits. Contains data from the Ministry of Finance of Romania (situații financiare, data.gov.ro), licensed under CC BY 4.0. LT: headline figures only (the balance sheet section totals: fixed assets, current assets, equity, liabilities; the profit and loss account revenue, profit before tax and net profit), never a full statement, individual and consolidated, fiscal years 2023 on in euro, no employees, updated daily from the open data of the register, which held filings up to March 2026 at launch. Contains data from the Register of Legal Entities (JAR), Registrų centras, via data.gov.lt, CC BY 4.0. Adapted by Prometiam. CO: companies that file NIIF statements with the Superintendencia de Sociedades only (groups 1 and 2; about 33,000 companies; banks and insurers supervised by the Superintendencia Financiera via framework co_cuif, no revenue line; each statement carries the auditor opinion and the audit firm the company declared; other Colombian companies answer availability `supersociedades_filers_only`), individual and consolidated, fiscal years 2023 on, in pesos with no euro copy (the ECB publishes no peso rate), no employees, personnel costs or depreciation, no filing date. Contains data from the Superintendencia de Sociedades (estados financieros NIIF), via www.datos.gov.co, licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). Modified by Prometiam; the Colombian records are offered under CC BY-SA 4.0 (share-alike). BR: listed companies only (about 750, the CVM DFP annual statements, individual and consolidated, in reais with euro copies, fiscal years 2023 on, updated weekly); other Brazilian companies publish none (`listed_companies_only`). Contains data from the Comissão de Valores Mobiliários (CVM), Portal Dados Abertos, licensed under the Open Database License (ODbL, share-alike). Adapted by Prometiam. AU: tax_records only, no financial statements (availability `tax_records_only`): the Australian Taxation Office Corporate Tax Transparency report per income year from 2013-14 (total income, taxable income, tax payable, in Australian dollars) for large corporate tax entities, total income AUD 100 million and over (AUD 200 million for Australian-owned private companies up to 2021-22); a null taxable income or tax payable means withheld (zero or a loss), not 0. Contains data from the Australian Taxation Office (ATO), Corporate Tax Transparency report, licensed CC BY 3.0 AU (https://creativecommons.org/licenses/by/3.0/au/). Adapted by Prometiam; the credit and licence link travel with every answer. Finnish companies also return data.tax_records (newest tax year first, from tax year 2020; Finnish Tax Administration public corporate income tax data, CC BY 4.0; 0 means none, not unknown; null when the read failed) and meta.tax_note. Contains data from the Finnish Patent and Registration Office (PRH), CC BY 4.0. Other companies in ES, PL, HR, BE and BR (meta.availability listed_companies_only), other US (sec_filers_only) and Colombian (supersociedades_filers_only) companies, Australian companies (tax_records_only: no statements), Finnish companies without a digital filing (no_statement_held) and IE (PDF images) answer with empty statements and meta.availability. Needs the Scale plan or above (Starter, Professional and free trial keys get 10 calls a month, then upgrade_required). A call that returns statements costs 25 credits; an answer with no statement held costs 0 and uses none of the 10 calls. Every null figure is explained in statements[].quality.missing ({field: reason}: confidential, not_filed, reported_as_gross_profit, not_published_by_register, not_stated, not_collected_for_source); also in figures and figures_eur: operating_cash_flow, capital_expenditure, free_cash_flow (operating cash flow less capital expenditure, where both are filed), dividends_paid (cash paid out as positive amounts; DK and SE: the dividends distributed in the year), cost_of_sales, tax_expense, retained_earnings, financial_debt_long_term, financial_debt_short_term, trade_payables and provisions, each read only where the country's source gives it (cash flow: US SEC filers, listed companies in ES, PL, HR, BE and FI, and BR; none for GB, DK, SE, NO), and what the filing declares: accounts_type (GB, DK, NO, US), audit.status (GB, DK, NO), audit.opinion (BR: unqualified, qualified, adverse, disclaimer) and audit.auditor_name (DK), each null where nothing is stated; for Norway the latest statement of the company itself carries the head count of the register record when the accounts have none (quality.notes employees_from_register, today's figure); company.employee_band is France only (INSEE size band today). A statement that carries ratios also carries ratio_benchmarks: per ratio {percentile (5 to 95; higher means a higher ratio, not a better one), cell {country, nace_division, size_band, year, companies}} among peers of the same country, NACE division, size band (total assets in euro) and statement type, in cells of at least 30 companies (a year with fewer is pooled with the year before, cell.pooled), or null where no cell exists. The peers are the companies with filed statements in this dataset, not every company of the sector; cells exist for GB, FR, DK, SE, NO, FI, EE, LT and RO only, and not for a company without a NACE-based activity code. A percentile is descriptive, not a rating.",
