        {
          "name": "events_search",
          "title": "Search corporate events",
          "description": "Search normalized corporate-event records (capital changes, director changes, dissolutions, mergers, insolvency, name changes, etc.) by company, or, with neither company_name nor company_number, as the country event feed (every event of that country, country then required, newest first, from date_from: default 7 days ago, at most 31 days back), for Spain, France and the UK (from their gazettes) and, as register-change events, for Ireland, Poland, Norway, Finland, Sweden, Belgium, Croatia, Denmark, Estonia, Slovakia, Switzerland, Latvia, Cyprus, Romania, Lithuania, Canada, Australia, Japan, Israel, Singapore, Colombia, Taiwan, Czech Republic, Germany, the Netherlands, Ukraine, Serbia, Ecuador, Brazil, Mexico (LEI-registered entities only: a company only INEGI's DENUE directory lists has none) and the United States. Returns events with a served event_type matching this enum for each of those countries (each row also carries act_type, the raw BORME/BODACC/Companies House code it was derived from, or null when not yet covered), event date, before/after values, and source notice URL. The register-change events of the five (name, status, legal form and registered address; share capital for HR, EE, SK, CH, LV, LT, TW, BR and CZ; for Ukraine name, status, legal form and share capital, no registered address; for Serbia the address is the municipality; for Ecuador the address is the canton) are dated when the change first appears in the register data (for the United States, the weekly read of the registers that first sees it), are not gazette notices and start on 2026-09-30 (Ecuador and Mexico: none before their launch). Ireland, Poland and Norway publish no gazette either; their register-change events are dated the same way and none are before 14 Oct 2026. Every event carries advertising_protected: for a Danish company the CVR advertising-protection mark (CVR act s.19; true means do not use the event for direct marketing, and pass the company name or address on only with the mark), null otherwise.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "Company name — fuzzy match.",
                "type": "string"
              },
              "company_number": {
                "description": "Registry registration number — exact match.",
                "type": "string"
              },
              "country": {
                "description": "Country code: ES (Spain, BORME), FR (France, BODACC), GB (UK, Companies House), IE (Ireland, CRO), PL (Poland, KRS), NO (Norway, Brønnøysundregistrene / Enhetsregisteret), FI (Finland, Kaupparekisteri, the Finnish Trade Register), SE (Sweden, Bolagsverket, the Swedish Companies Registration Office), HR (Croatia, Sudski registar, the Croatian court register), BE (Belgium, KBO/BCE, the Crossroads Bank for Enterprises), DK (Denmark, CVR, the Danish Central Business Register), EE (Estonia, the e-Business Register, RIK), SK (Slovakia, RPO, the Register of Legal Entities), CH (Switzerland, Zefix, the Swiss central business name index), LV (Latvia, the Register of Enterprises, Uzņēmumu reģistrs), CY (Cyprus, DRCOR, the Department of the Registrar of Companies and Intellectual Property), RO (Romania, ONRC, the National Trade Register Office), LT (Lithuania, JAR, the Register of Legal Entities), CA (Canada, Corporations Canada, federal corporations only), AU (Australia, ASIC and the Australian Business Register), JP (Japan, the National Tax Agency corporate number publication site), IL (Israel, the Corporations Authority), BR (Brazil, CNPJ, Receita Federal), AR (Argentina, the Registro Nacional de Sociedades of the Ministry of Justice, built from the register of legal persons of ARCA, the tax authority; commercial companies only, register-change events and monitoring since 28 Oct 2026, read monthly, none before that date, and no dissolution alert), UA (Ukraine, the Unified State Register of Legal Entities, Individual Entrepreneurs and Public Organisations, EDR, of the Ministry of Justice of Ukraine; commercial legal persons only), RS (Serbia, the Register of Business Entities of the Business Registers Agency, APR; companies only: d.o.o., a.d., o.d. and k.d.; the matični broj is the company number; register-change events and monitoring since the October 2026 launch, read monthly), EC (Ecuador, the company directory of the Superintendencia de Companias, Valores y Seguros joined on the RUC with the Catastro RUC of the Servicio de Rentas Internas; limited companies of the SCVS list only; the RUC is the company number; register-change events and monitoring none before the Ecuador launch, read monthly), CL (Chile, the Registro de Empresas y Sociedades (RES), Ministerio de Economía, Fomento y Turismo; only the companies registered under the simplified regime of Ley 20.659 since 2013, not the whole Chilean register; the RUT is the company number; no register-change events and no monitoring), CO (Colombia, RUES, Confecámaras), SG (Singapore, ACRA), TW (Taiwan, GCIS and the Ministry of Finance), CZ (Czech Republic, the public register of the Ministry of Justice and the Czech Statistical Office RES), DE (Germany, LEI-registered entities and energy-market register companies, not the commercial register), NL (Netherlands, LEI-registered entities with a KVK number, not the Dutch commercial register), MX (Mexico, LEI-registered entities and the companies of INEGI's DENUE directory of economic units, not the Mexican company register), or US (United States: state business registers, SEC EDGAR and GLEIF). Ireland, Finland, Sweden, Croatia, Belgium, Denmark, Estonia, Slovakia, Switzerland, Latvia, Cyprus, Romania, Lithuania, Canada, Australia, Japan, Israel, Singapore, Colombia, Taiwan, Germany, the Netherlands, Ukraine, Serbia, Brazil and the United States are company-level (companies only). Norway has companies and officers; the Czech Republic has companies and, as appointments on the company record (no extra credit), its officers and partners: the statutory body, administrative and supervisory boards, control commission, partners (with the deposit and share where the register gives one amount and a percentage or fraction), the sole shareholder of a joint-stock company, procurators and liquidators the register lists today, with the function in Czech; a natural person is the name as published and the month and year of birth only (no day, birth number, address or nationality); a company member carries its name, IČO and foreign register number; no officer history (a member who leaves drops out at the next read); no person records, no search by officer name and no director network; representatives of company members, the way of acting, pledges and insolvency administrators are not served; officer changes are not register-change events; companies deleted before 2026 have no officers; an empty list means the register lists no such member; updated every working day; Poland has companies and officers on the company record (management board, supervisory board, proxies and the representation rule from the KRS full extract; natural persons are masked by the register itself, so no person records, and the list is filled progressively); Ireland, Poland and Norway have register-change events only, from 14 Oct 2026 (no gazette). Finland, Sweden, Belgium, Croatia, Denmark, Estonia, Slovakia, Switzerland, Latvia, Cyprus, Romania, Lithuania, Canada, Australia, Japan, Israel, Singapore, Colombia, Taiwan, Czech Republic, Germany, the Netherlands, Ukraine, Serbia, Brazil and the United States have register-change events (name, status, legal form and registered address; share capital for HR, EE, SK, CH, LV, LT, TW, BR and CZ; for Ukraine name, status, legal form and share capital, no registered address; for Serbia the address is the municipality), dated when the change first appears in the register data (for the United States, the weekly read of the registers that first sees it) and none before 2026-09-30, and monitoring. Company records from the Finnish Trade Register: legal name, legal form, status, registered address, activity code and dates; no officers and no registry-compliance signal. Corporate insolvency notices are linked by business ID. Sweden: Company records from the Swedish Companies Registration Office (Bolagsverket): legal name, legal form, status, registered address, activity code and dates; no officers and no registry-compliance signal, and sole traders (enskild näringsverksamhet) are never served. Corporate insolvency notices (konkurs, företagsrekonstruktion, ackordsförhandling; weekly, no court or case number) are linked by organisationsnummer. Croatia: Company records from the Croatian court register (Sudski registar): legal name, legal form, status, registered address, activity code and dates; no officers and no registry-compliance signal, and sole traders (trgovac pojedinac) are never served. Corporate insolvency notices (court decisions, with court and case number where the register states them) are linked by MBS. Belgium: Company records from the Crossroads Bank for Enterprises (KBO/BCE): legal name, legal form, status, registered address, activity code and dates; no officers, no registry-compliance signal and no insolvency notices (Belgium is not an insolvency market: a bankruptcy shows in the company status and in its register-change events), and enterprises of natural persons (eenmanszaak / entreprise individuelle) are never served. Denmark: Company records from the Danish Central Business Register (CVR): legal name, legal form, status (including the register's bankruptcy state), registered address, activity code and dates; no officers, no registry-compliance signal and no share capital, and sole proprietorships (enkeltmandsvirksomhed) and estates are never served. Corporate insolvency notices (konkurs and tvangsakkord from CVR credit information: one notice per proceeding, dated by the decision that opened it, with the latest stage of the proceeding; no court or case number) are linked by CVR number. Estonia: Company records from the Estonian e-Business Register (RIK): legal name, legal form, status (including liquidation and bankruptcy), registered address, activity code (EMTAK 2008 or 2025, per company) and dates; with register-change events and monitoring, but no officers and no registry-compliance signal. Its bankruptcy declarations are served as insolvency notices. Sole traders (FIE) are never served, and the VAT number (KMKR) is searchable with `vat=`. Slovakia: Company records from the Slovak Register of Legal Entities (RPO): legal name, legal form, status (including bankruptcy (konkurz) and restructuring), registered address, activity code (SK NACE Rev. 2.1) and dates; with register-change events and monitoring, but no officers, no registry-compliance signal and no insolvency notices. Commercial legal persons only (no associations, foundations or other non-commercial entities); no VAT number (a `vat` search is refused); sole traders and other natural persons are never served. Romania: Company records from the National Trade Register Office (ONRC): legal name, legal form, status (including dissolution, liquidation, insolvency, reorganisation, bankruptcy and deregistration), registered address with the county, CAEN activity codes, the J registration number and EUID, and dates; with register-change events and monitoring, but no officers, no registry-compliance signal, no share capital and no insolvency notices. Natural persons and sole traders are never served. The CUI (2 to 10 digits, check digit advisory) is the company_number; the Romanian VAT number (RO plus the CUI, built by rule) is searchable with `vat=`. Cyprus: Company records from the Department of the Registrar of Companies and Intellectual Property (DRCOR): legal name, legal form, status (including strike-off pending, voluntary and compulsory liquidation and administration), registered address with the district and dates; with register-change events and monitoring, but no officers, no registry-compliance signal, no activity code, no share capital, no VAT number (a vat search is refused) and no insolvency notices. Companies and overseas companies only; trade names and partnerships are never served. Latvia: Company records from the Register of Enterprises of the Republic of Latvia (Uzņēmumu reģistrs): legal name, legal form, status (including liquidation, insolvency and legal protection proceedings), registered address with the region, share capital, previous names and dates; with register-change events and monitoring, but no officers, no registry-compliance signal, no activity code. Its Insolvency Register proceedings are served as insolvency notices. Individual merchants and other natural persons are never served. The registration number (11 digits, an LV prefix optional, with a mod-11 check that is enforced) is the company_number, and the Latvian VAT number (LV plus the registration number) is searchable with `vat=`. Switzerland: Company records from Zefix, the Swiss central business name index: legal name, legal form, status (including liquidation), registered address with the canton and business purpose; with register-change events and monitoring, but no officers, no registry-compliance signal and no activity code (the register publishes no NOGA code). Legal entities and branches only; sole proprietorships (Einzelunternehmen) and other natural persons are never served. Corporate insolvency notices (SHAB) are linked by UID where the notice names the debtor's UID. Commercial-register publications of the Swiss Official Gazette of Commerce (SHAB) are served as gazette events for Swiss legal entities and branches, from publications of 1 January 2024 (new entry, change of name, seat, address, purpose, capital, legal form, auditor, board or signatories, merger, liquidation, bankruptcy, deletion), dated by the publication date, linked by UID, with the SHAB publication as notice_url; the notice text and the names of board members and signatories are never served (a board or signatory change says only that persons changed). The gazette events are a summary derived from the SOGC publications; the publication linked as notice_url is the authoritative text. The UID with its MWST, TVA or IVA suffix is searchable with `vat=`. United States: there is no national register, so the API serves company records from the business registers of New York, Colorado, Connecticut, Pennsylvania, Florida, Iowa, the District of Columbia, Texas, Oregon and Massachusetts (state open data and public records) plus SEC filers (EDGAR) and LEI holders (GLEIF) from every state, Delaware included, as one record per state registration (domestic or foreign); numbers look like NY-4424185, CO-20091096973, DE-10684990, CIK-0000320193 or LEI-… and identifiers also carry the SEC CIK, the EIN of SEC filers and the LEI; New York, Pennsylvania, Iowa and Oregon publish active entities only (Florida serves active and inactive entities: profit corporations, limited liability companies, limited partnerships and non-profit corporations, domestic and foreign; the District of Columbia serves every status, a closed one with its reason, and Iowa the home-office address, neither with registered agents or beneficial owners; Texas serves franchise tax taxpayers that hold a Secretary of State file number, from the file of the Comptroller of Public Accounts and not the Secretary of State register, forfeited and closed ones with their status; Oregon serves limited liability companies, business, professional and non-profit corporations, limited partnerships, limited liability partnerships and cooperatives with the principal place of business as address (the mailing address for limited partnerships, which have none), never assumed business names (trade names), business trusts, reserved names or acts of government, and has no registered agents or authorized representatives; Massachusetts serves every status (active, dissolved, revoked, withdrawn, and inactive where no reason is given), domestic and foreign business, professional, benefit and non-profit corporations, limited liability companies, limited partnerships, registered limited liability partnerships, co-operatives and the Chapter 180 and special-statute corporations, from the public-record extract of the Corporations Division (19 Oct 2026; refreshed, with its change events, only when the Division supplies a newer extract), not an official register extract, never trade names (foreign DBAs), voluntary associations, trusts or corporations sole, and has no officers or resident agents) and the SEC gives no legal status; updated weekly; company-level (no officers and no registry-compliance signal, with register-change events (dated by the weekly read) and monitoring), no VAT number (a `vat` search is refused), sole proprietorships never served, and not every US company. US insolvency notices are on insolvency_search and are not linked to the company records. US sources: New York Department of State, Colorado Secretary of State, Connecticut Secretary of the State, Pennsylvania Department of State (open data), Florida Department of State, Division of Corporations (public records), Iowa Secretary of State (CC BY 4.0), District of Columbia Department of Licensing and Consumer Protection (CC BY 4.0), Texas Comptroller of Public Accounts (franchise tax data), Oregon Secretary of State, Corporation Division (open data), Massachusetts Secretary of the Commonwealth, Corporations Division (public-record extract of 19 Oct 2026; not an official register extract and not endorsed by the Secretary), SEC EDGAR, GLEIF (CC0). Lithuania: Company records from the Register of Legal Entities (JAR): legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated each working day. Company status includes liquidation, bankruptcy and restructuring; there are no insolvency notices. Activity codes follow NACE Rev. 2.1 (EVRK 2.1, class level; the 6-digit code is in registry_details). Share capital is held for UAB and AB only. VAT numbers come from the State Tax Inspectorate (VMI) list. Sole proprietorships, partnerships (KUB, TUB), branches, state enterprises and non-commercial bodies are never served. Credit: Contains data from the Register of Legal Entities (JAR), Registrų centras, the State Data Agency (Statistics Lithuania) and the State Tax Inspectorate (VMI), CC BY 4.0. Adapted by Prometiam. Canada: Company records from Corporations Canada (Innovation, Science and Economic Development Canada): legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated each working day. Federal corporations only (Canada Business Corporations Act, Canada Cooperatives Act and the repealed Canada Corporations Act Part I and Cooperative Associations Act); provincial and territorial corporations, not-for-profit corporations and boards of trade are not in the register. There is no insolvency, liquidation or bankruptcy status (that is the Office of the Superintendent of Bankruptcy and the courts), no activity code, share capital or VAT number. The Business Number is searchable with business_number=, and a corporation's other names are in registry_details. Credit: Contains information licensed under the Open Government Licence – Canada (Corporations Canada, Innovation, Science and Economic Development Canada). Adapted by Prometiam. Australia: Company records from the Australian Securities and Investments Commission (ASIC) and the Australian Business Register (ABR): legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated weekly. Proprietary, public and foreign companies (ACN and ARBN) only; associations, cooperatives, other bodies, individuals and sole traders are never served. The register gives the state and the postcode, not a street address. ASIC does not separate liquidation from administration, so external administration shows as in_administration and there is no in_liquidation status; there are no insolvency notices. No activity code or share capital. The VAT number is the ABN when the ABN is active and registered for GST; an ABN is searchable with abn= and a GST-registered one with vat=. Data are licensed CC BY 3.0 AU (no sublicensing): the credit and licence link travel with every answer. Credit: Contains data from the Australian Securities and Investments Commission (ASIC) Company Dataset and the Australian Business Register (ABN Bulk Extract), licensed CC BY 3.0 AU (https://creativecommons.org/licenses/by/3.0/au/). Adapted by Prometiam (joined, normalised, status derived). Japan: Company records from the National Tax Agency corporate number publication site: legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated each working day, with a monthly full reconciliation. Companies (kabushiki, godo, gomei, goshi and tokurei yugen kaisha) and registered foreign companies only; national and local government bodies, associations and other corporations are never served. Status is active, deregistered or merged (with the successor's number): the register publishes no liquidation or insolvency state and there are no insolvency notices; no founding date, activity code, share capital or VAT number. The registration date is the date the corporate number was assigned and is null for companies that carry only the 5 October 2015 designation. Names are in Japanese; the English name, the kana reading and a romanised name are in registry_details. A search in Latin letters also meets the romanised name and, for about 3,600 companies (mostly large and listed), the English names GLEIF holds (CC0; name_latin serves one where the register holds no English name, name_en stays the National Tax Agency name). Credit: Source: National Tax Agency Corporate Number Publication Site (https://www.houjin-bangou.nta.go.jp/). Edited and processed by Prometiam; not a product of the National Tax Agency or the State. 出典：国税庁法人番号公表サイト（https://www.houjin-bangou.nta.go.jp/）。Prometiamが編集・加工して作成（国税庁が作成した情報ではありません）。 Israel: Company records from the Israeli Corporations Authority (Ministry of Justice): legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated each working day. Israeli and registered foreign companies only; partnerships, cooperative societies, non-profit associations and sole traders are other registers and are not served. Company status includes liquidation, receivership, restructuring and insolvency proceedings; there are no insolvency notices. Names are in Hebrew, with the English name in registry_details where the register holds one. A search in Latin letters also meets, for about 2,000 more companies, the English names GLEIF holds (CC0; name_latin serves the best of them, never a trading name). No activity code, share capital or VAT number. Credit: Contains information from the Israeli Corporations Authority, Ministry of Justice, via data.gov.il (used under the data.gov.il terms of use). Adapted by Prometiam; not an official register extract. Brazil: Company records from the Cadastro Nacional da Pessoa Jurídica (CNPJ), Receita Federal do Brasil: legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated monthly (the Receita publishes one full file a month). Commercial legal persons only: limited companies (LTDA), corporations (S.A.), simple societies, single-member limited companies (EIRELI), public companies and mixed-capital companies, and cooperatives; sole traders (empresário individual, MEI included), non-profit entities, branches of foreign companies and every other natural-person form are never served. One record per CNPJ root, with the head office's 14-character CNPJ (shown 00.000.000/0001-91; the 8-digit root finds it too); branches are not served. Status is active, suspended, inapta (served as active_strike_off_pending), deregistered or merged; judicial recovery, bankruptcy, liquidation and intervention are read from the register's special situation, and there are no insolvency notices. The activity code is CNAE-Subclasses 2.3 (BR-CNAE-2.3), not a NACE code; a NACE Rev. 2 class (or only the NACE division) is derived from it through ISIC Rev. 4 where the official tables allow, and nace_derived marks it; the secondary codes are in registry_details. No VAT number (a vat search is refused), and no partners, officers or contacts. Credit: Contains data from the Cadastro Nacional da Pessoa Jurídica (CNPJ), Receita Federal do Brasil, published as open data (CC BY). Adapted by Prometiam. Colombia: Company records from Confecámaras (RUES, the Colombian chambers of commerce): legal name, legal form, status, identifiers and dates, the legal representative (name only, never an identification number; no person search or director network), the supplier-register (RUP) number as identifier type rup while registered there, the end of the term of the company (duration_end_date, null when indefinite); no registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated monthly: the source's own update date is data_as_of and is in the credit. Companies of the commercial register only (S.A.S., Ltda., S.A., S. en C., S.C.A., collective companies, single-person companies (E.U.) and branches of foreign companies); natural persons, non-profit entities, cooperatives and public bodies are never served. The register itself has no address, share capital, contact or VAT number (a vat search is refused); for a company that files NIIF accounts with the Superintendencia de Sociedades, address, service_address, phone, mobile, e-mail, purpose clause and parent_company come from the cover sheet of its latest annual filing, as the company declared them at the period end and not checked by the register (filing_profile names the filing; fiscal years from 2023). The register has no liquidation state: liquidation, judicial liquidation and reorganisation are read from the company name and served as the status, and a cancelled registration is deregistered or merged. The registration may not be current although it reads active: last_renewal_year in registry_details is the last year it was renewed. company_name is the name without those markers and name_as_registered is the name as published. The activity code is the CIIU Rev.4 A.C. 4-digit code (CO-CIIU-REV4-AC), not a NACE code; a NACE Rev. 2 class (or only the NACE division) is derived from it through ISIC Rev. 4 where the official tables allow, and nace_derived marks it. No insolvency notices. SECOP II public contracts to companies by NIT are served as procurement awards, in pesos with no euro amount (read amount_original and currency; min_amount never matches them), and administrative fines imposed by a contracting entity on a public contract (SECOP I) as the risk flag procurement_fine, not a court judgment. The records, the filing-profile values, the contracts and the fines are offered under CC BY-SA 4.0 (share-alike). Credit: Contains data from the Superintendencia de Sociedades (Estados Financieros NIIF, Caratula), via the Portal de Datos Abiertos www.datos.gov.co, licensed under CC BY-SA 4.0. Contains SECOP II data (Agencia Nacional de Contratacion Publica - Colombia Compra Eficiente, datos.gov.co), CC BY-SA 4.0. Contains Multas y Sanciones SECOP I data (Agencia Nacional de Contratacion Publica - Colombia Compra Eficiente), CC BY-SA 4.0. Contains data from the Superintendencia Financiera de Colombia (CUIF), via www.datos.gov.co, licensed under CC BY-SA 4.0. Contains data from Confecámaras (RUES, Registro Único Empresarial y Social), via the Portal de Datos Abiertos www.datos.gov.co, last updated on the date shown in data_as_of, licensed under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/). Adapted by Prometiam; the adapted Colombian records are offered under CC BY-SA 4.0. Singapore: Company records from the Accounting and Corporate Regulatory Authority (ACRA): legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated monthly. Local companies, limited liability partnerships (LLP) and registered foreign company branches only; sole proprietorships, general partnerships and limited partnerships are never served. Status includes liquidation, judicial management and receivership, and a struck-off, dissolved or amalgamated company is deregistered or merged; the corporate insolvency notices of the Singapore Government Gazette are served separately (/insolvency/search?country=SG) and linked to the record by the UEN. The register publishes no cessation date, share capital, GST (VAT) number (a vat search is refused), region or officers. The activity code is SSIC 2020 (5 digits, SG-SSIC-2020; a legacy 4-digit code carries no scheme); a NACE Rev. 2 class (or only the NACE division) is derived from it through ISIC Rev. 4 where the official tables allow, and nace_derived marks it. The annual return and accounts-due dates are in registry_details as published. API use of the data is licensed, not a right to the data itself. Credit: Contains information from ACRA Information on Corporate Entities and Entities Registered with ACRA accessed on the date shown in data_as_of from the Accounting and Corporate Regulatory Authority (ACRA) via data.gov.sg, which is made available under the terms of the Singapore Open Data Licence version 1.0 (https://data.gov.sg/open-data-licence). Adapted by Prometiam; not an official ACRA extract. Taiwan: Company records from the Ministry of Economic Affairs (GCIS) and the Ministry of Finance (Fiscal Information Agency): legal name, legal form, status, registered address, identifiers and dates; no officers or registry-compliance signal; register-change events (name, status, legal form and registered address, dated when the change first appears in the register data, none before the first load) and monitoring are available. Updated each working day. Limited companies, companies limited by shares, unlimited companies, limited partnership companies and Taiwan branches of foreign companies only; sole proprietorships, partnerships, domestic branches, cooperatives, associations and representative offices are never served. Names and addresses are in Chinese (the register publishes no English name; the English name of a company registered as an importer or exporter with the Bureau of Foreign Trade, about one in five since 21 Oct 2026, is in registry_details.name_en and is searchable in Latin letters). The responsible person is not served. Status includes dissolution, reorganisation, receivership and bankruptcy. The VAT number is the unified business number where the company is in the Ministry of Finance tax file (searchable with vat=), else null. The activity code is the Ministry of Finance tax industry code (6 digits, TW-TAX-SIC), which is not a NACE code, and the other codes of the file are in secondary_activity_codes. The check digit of the number is advisory. No officers; no insolvency notices. Credit: Contains data from the Ministry of Economic Affairs (Department of Commerce, GCIS; International Trade Administration, English names) and the Ministry of Finance (Fiscal Information Agency), Republic of China (Taiwan), released under the Open Government Data License, version 1.0 (https://data.gov.tw/license). Adapted by Prometiam, not a certified register extract. Czech Republic: Company records from the Czech public register (Veřejný rejstřík), kept by the regional courts and published by the Ministry of Justice as open data, with the region (kraj) and the activity code from the Czech Statistical Office Register of Economic Entities (RES): legal name, legal form, status, registered address, share capital, identifiers and dates; the officers and partners as appointments on the company record (see the country list) and no registry-compliance signal; register-change events (name, status, legal form, registered address and share capital, dated when the change first appears in the register data, none before the first load, October 2026) and monitoring are available. Updated each working day. Commercial legal persons only (s.r.o., a.s., v.o.s., k.s., cooperatives, SE, SCE and EEIG); sole traders (OSVČ) and every other natural person, associations, foundations, trust funds, owners associations (SVJ) and branches are never served. Status includes liquidation, insolvency, bankruptcy and restructuring; there are no insolvency notices (the Czech Republic is not one of the sixteen insolvency markets) and no financial statements. No VAT number: a vat search is refused. The activity code is CZ-NACE 2025. The IČO has eight digits and its check digit is advisory, so companies whose IČO fails it are served. The registering court and file number (for example B 1581, Městský soud v Praze) are in registry_details. Credit: Contains data from the public registers of the Czech Republic (Ministry of Justice, ISVR open data) and the Czech Statistical Office (RES, CC BY 4.0). Adapted by Prometiam. Netherlands (NL): LEI-registered entities with a KVK number (GLEIF golden copy, CC0 1.0), not the Dutch commercial register (Handelsregister, KVK); company number = the 8-digit KVK number, lei a second identifier; BV, NV, SE, cooperatives, SCE, OWM, CV and VOF only, no sole proprietorships, foundations, associations, public bodies, funds or branches; no officers, share capital, activity code, VAT number or financials; register-change events (none before 30 Oct 2026) and monitoring. Credit: Contains LEI data from GLEIF, available under CC0 1.0. LEI-registered entities only; not an extract of the Dutch commercial register (Handelsregister, KVK). Germany (DE): LEI-registered entities (Global Legal Entity Identifier Foundation, GLEIF golden copy), plus companies listed in the energy market register (Marktstammdatenregister, Bundesnetzagentur) with their commercial-register entry that no LEI record holds; not the German commercial register (Handelsregister). The second source is a partial layer declared by the market actors and not checked against the commercial register: status null (local_status unknown), no founding date, no register-change events; registry_details.source is gleif or mastr. Company records only: the company number is the 20-character LEI (ISO 17442 check) or, for the energy market register, the commercial-register entry with the court (HRB12653/FRANKFURT-AM-MAIN), searchable with company_number, lei, or register_number (HRB12653, optional register_court); no officers, share capital, activity code or VAT number (a vat search is refused), no registry-compliance signal and no financial statements; register-change events for the LEI-registered entities (name, status, legal form, registered address, none before the first load, October 2026) and monitoring are available. Updated daily. GmbH, UG (haftungsbeschränkt), AG, KGaA, SE, OHG, KG (including GmbH & Co. KG), eG and PartG only; sole traders (e.K.) and other natural persons, GbR, associations (e.V.), foundations, public-law bodies, funds and branches are never served. Status is active, deregistered or merged; the LEI's own renewal status is registry_details.lei_status; the register court, register type and number (for example Amtsgericht München, HRB) are in registry_details. German corporate insolvency notices are served separately (Germany is one of the sixteen insolvency markets) and are not linked to these records. Credit: Contains LEI data from the Global Legal Entity Identifier Foundation (GLEIF), available under CC0 1.0. Not an extract of the German commercial register (Handelsregister). Energy market register records also carry: Contains data from the Marktstammdatenregister of the Bundesnetzagentur (https://www.marktstammdatenregister.de/MaStR/Datendownload), licensed under the Datenlizenz Deutschland – Namensnennung – Version 2.0 (dl-de/by-2-0, https://www.govdata.de/dl-de/by-2-0). Data changed: selected, joined and normalised by Prometiam. Mexico (MX): two sources, one record per company. (1) LEI holders (GLEIF golden copy, CC0 1.0): the company number is the LEI (also lei=), with register-change events and monitoring. (2) The companies of the DENUE directory of INEGI (Mexico's national statistics institute). DENUE is a statistical directory of economic units, not the Mexican company register and not a list of all Mexican companies. A unit is served as a company only when it carries a razón social and shows evidence of being a company's (a legal form in the name, a word that says business, a second unit under one INEGI enterprise code, or a match with an LEI holder); natural persons, public bodies, public-sector schools, associations, funds, trusts, branches and sole establishments are screened out, not guaranteed out. For a company only DENUE lists: the name as INEGI publishes it (the legal form is stripped from most names, so legal_form is set only where the name carries one); status null (local_status unknown); no founding date, age or dissolution date; the head-office address with postal code, municipality and locality (registry_details.address_basis); the activity as the head-office unit's SCIAN 2018 code with INEGI's title (activity_code_scheme MX-SCIAN-2018; no NACE, ISIC or NAICS code is derived); employee_band, the size band of the largest unit (a floor for the company, never a head count); registry_details.establishments, the units listed under the name (can undercount); registry_details.denue_listed_since (not a founding date); the website only where DENUE gives a plausible host name; source_provider INEGI. No officers, share capital, VAT number (a vat search is refused), financial statements, insolvency notices or register-change events, and monitoring raises sanctions matches only. The company number of such a company is E plus INEGI's four-digit enterprise code, a dash and eight hexadecimal digits (E0042-0A1B2C3D), or U plus INEGI's unit id (U1001): an identifier of this API, not an INEGI or tax number, and not promised stable until a second INEGI edition has been compared; company_number takes it as well as an LEI. An LEI holder that is also in DENUE keeps GLEIF's data (registry_details.source stays gleif) and gains the DENUE fields. INEGI publishes the directory about twice a year (registry_details.denue_edition). Credit: Fuente: INEGI, Directorio Estadístico Nacional de Unidades Económicas (DENUE) 05/2026. Adapted by Prometiam; not an INEGI product and not endorsed by INEGI. LEI records: Contains LEI data from the Global Legal Entity Identifier Foundation (GLEIF), available under CC0 1.0; not an extract of the Mexican company register. Defaults to first country in the API key allowlist.",
