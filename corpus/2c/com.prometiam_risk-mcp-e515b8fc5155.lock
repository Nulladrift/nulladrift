        {
          "name": "insolvency_search",
          "title": "Search insolvency and risk notices",
          "description": "Spain only: search Spanish insolvency and risk notices (bankruptcies, liquidations, court judgments) by company name or NIF (vat). Another country returns no rows: use insolvency_notices_search for corporate insolvency notices in the countries it lists, or events_search for the register and gazette events of a company. Scope with a date range.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company_number": {
                "description": "UK Companies House number.",
