          "name": "procurement_awards",
          "title": "Search procurement awards",
          "description": "List public-contract awards by supplier, buyer, supplier tax id, CPV code and date, newest first. Spain (PLACSP, including minor contracts), France (DECP), the United Kingdom (Contracts Finder, Find a Tender), Colombia (SECOP II, Colombia Compra Eficiente, CC BY-SA 4.0: contracts to companies by NIT, in pesos with no euro amount), Australia (AusTender, Department of Finance, CC BY 3.0 AU: contracts from AUD 10,000 to suppliers by ABN, only suppliers with a company or public-body marker, converted at the ECB annual average), Chile (Mercado Publico, Direccion ChileCompra, no licence stated: tenders to legal entities by RUT, in pesos with no euro amount) and, from TED (Tenders Electronic Daily), Ireland, Poland, Norway, Finland, Sweden, Denmark, Estonia, Latvia, Lithuania, Slovakia, the Czech Republic, Croatia, Romania and Belgium: above the EU thresholds only (contracts below them are not in TED, so not here), and for Finland to Belgium only awards published since November 2023; pass country to restrict, omit it for all countries. One row per award to one supplier: amount_eur is that supplier's share as published, before VAT where the source distinguishes; amount_contract_eur is the whole contract; amount_is_ceiling marks a framework or dynamic-purchasing ceiling that is not spend; amount_suspect marks a form default rather than a price. Every row carries amount_original (as published) and currency; a Colombian or Chilean contract has amount_eur null (no ECB peso rate), so min_amount never matches it: read amount_original and currency. bids_received is the competition signal where the source publishes it. company_id is set when the supplier resolves to a company record in that country (use company_detail on it; for the TED countries the published supplier name must also match the register, otherwise company_id is null and the award is still returned). 2 credits a call. Natural-person suppliers are never returned. Requires at least one of company_id, nif, supplier, buyer, cpv or date_from.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "description": "Contracting body name, matched anywhere (min 3 characters), e.g. \"Ayuntamiento de Madrid\".",
