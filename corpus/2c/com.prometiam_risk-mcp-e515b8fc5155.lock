          "title": "Search corporate insolvency notices",
          "description": "Search CORPORATE insolvency notices published in official gazettes and registers across France, Germany, the UK, Austria, Switzerland, Norway, Finland, the US, the Netherlands, Denmark, Croatia, Sweden, Spain, Latvia, Estonia and Singapore. Use this for distress coverage in all sixteen markets. DE, AT, US and NL notices stand alone: they are not linked to company records (German and US company records come from other sources and do not carry them). FR, GB, NO and ES notices are linked by company number or NIF, and the notices of the other registry countries can be cross-referenced against companies_search with the same country code (for FI, DK, HR, SE and CH the notices are linked by business ID, CVR number, MBS, organisationsnummer and UID: a company record with include=insolvency returns them; a Swiss notice is linked only where the SHAB notice names the debtor's UID, and one without a UID stays unlinked). DK notices come from CVR credit information (konkurs and tvangsakkord: one notice per proceeding, dated by the decision that opened it, with the latest stage of the proceeding; no court or case number); HR notices are court decisions from the Croatian court register (only companies still on the register); SE notices are Bolagsverket's procedure data (konkurs, företagsrekonstruktion, ackordsförhandling), updated weekly, with no court, case number or link, and proceedings that ended before collection are not included. Belgium and Slovakia are not insolvency markets (their bankruptcy shows in the company status). Spanish notices are the concurso entries (declaration, opening of the liquidation phase, conclusion) published in BORME since 2009, one per court resolution, linked by NIF and dated by the court's resolution date with the BORME publication date alongside (a median of about ten weeks later, sometimes more than a year); legal entities with a NIF only, judge and administrator never served, and an entry that cannot be tied to the company, or whose NIF is an administrator's, is withheld. Latvian notices are the Insolvency Register's insolvency and legal protection proceedings, an opening notice and a closing notice each, since 2008, with court and case number where stated, linked by registration number, legal persons of the commercial register only, updated daily. Estonian notices are bankruptcy declarations from the e-Business Register, one per register entry, dated by the entry (a few days after the court's order), linked by registry code, with no court, case number, trustee or closing notice, for companies still on the register, in liquidation or in bankruptcy only (a floor), sole traders (FIE) never served. Singapore notices are the corporate notices of the Singapore Government Gazette (egazette.gov.sg), back to September 1998: winding-up applications and orders, judicial management, and the steps of a creditors' voluntary or court-ordered liquidation (resolutions, meetings of creditors, claims and dividend notices), dated by the order, filing or resolution date where the notice prints it, else by its first publication, with the court and case number where it prints them; members' voluntary (solvent) liquidations are not included and no liquidator, judicial manager or other natural person is served; linked to the company record by the UEN (a company record with include=insolvency returns them), and a notice that prints no valid UEN stays unlinked. Spanish notices: based on data from the Agencia Estatal Boletín Oficial del Estado (BORME). Contains data from the Insolvency Register of the Republic of Latvia (Register of Enterprises), CC0. Contains data from the Estonian e-Business Register (RIK), CC BY 4.0. Source: Republic of Singapore Government Gazette, www.egazette.gov.sg. The e-Gazettes are subject to copyright of the Singapore Government and are reproduced here with the permission of the Singapore Government. You may check www.egazette.gov.sg for the latest e-Gazettes. US notices are not linked to the US company records. Personal/consumer insolvency is deliberately excluded and is never returned. Distinct from insolvency_search, which covers the linked ES/FR/GB risk-notice corpus. Contains CVR data (Erhvervsstyrelsen), CC BY 4.0.",
