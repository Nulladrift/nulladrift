        {
          "name": "monitor_subscribe",
          "title": "Monitor a company",
          "description": "Subscribe a company to ongoing monitoring. Status changes, dissolutions, sanctions matches and corporate events (ES, GB, IE/PL/NO (the last three from 14 Oct 2026) and FI/SE/BE/HR/DK/EE/SK/CH/LV/CY/RO/LT/CA/AU/JP/IL/SG/CO/TW/BR/CZ/DE/IT/IN/AT/GR/LU/HU/PT/JE/MX/NL/AR/UA/RS/EC/IT/IN/AT/GR/LU/HU/PT/US) are checked every 30 minutes from 05:00 to 22:30 UTC and POSTed to your webhook_url (HMAC-SHA256 signed). Returns the monitor ID and a webhook_secret (shown once). Available for Spain (ES), the United Kingdom (GB), Ireland (IE), Poland (PL), Norway (NO), Finland (FI), Sweden (SE), Belgium (BE), Croatia (HR), Denmark (DK), Estonia (e-Business Register), Slovakia (RPO), Switzerland (Zefix), Latvia (Register of Enterprises), Cyprus (DRCOR), Romania (ONRC), Lithuania (JAR), Canada (federal corporations), Australia (ASIC and ABR), Japan (NTA), Israel (Corporations Authority), Singapore (ACRA), Colombia (RUES), Taiwan (GCIS), Brazil (CNPJ), Argentina (RNS, read monthly: no events before 28 Oct 2026, and no dissolution alert), the Czech Republic, Germany (LEI-registered entities and energy-market register companies, sanctions matches only for the latter), the Netherlands (LEI-registered entities with a KVK number) and Mexico (LEI-registered entities; a company only INEGI's DENUE directory lists raises sanctions matches only), that is every live country except France and Chile. A dissolution alert fires on the dissolution date the register gives or, where the register gives none (Canada, Israel, Singapore, Taiwan, Romania, many US registrations), when the status first shows closed (detail.date_basis first_seen_closed, else register). This creates a persistent subscription, active until it is stopped with monitor_stop.",
