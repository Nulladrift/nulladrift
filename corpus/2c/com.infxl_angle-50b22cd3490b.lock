                  "format_version": {
                    "const": 2,
                    "type": "number"
                  },
                  "generated_at": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "item_count": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "lookback_days": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "sections": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "heading": {
                          "type": "string"
                        },
                        "items": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "angle": {
                                "anyOf": [
                                  {
                                    "type": "string"
                                  },
                                  {
                                    "type": "null"
                                  }
                                ],
                                "description": "What the news means for the company the brief is about."
                              },
                              "date": {
