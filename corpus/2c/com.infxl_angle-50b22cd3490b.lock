        {
          "name": "request_brief",
          "title": "Request brief",
          "description": "Start a competitive-intelligence brief for one company. Returns at once with a brief_id; generation takes 3 to 6 minutes. Then call get_brief(brief_id) after poll_after_seconds. Cost: one credit is held now and spent only if the brief is ready with at least one item. An empty or failed brief costs nothing. Pass the same idempotency_key to retry safely: it returns the original brief instead of starting a second one. Needs an API key in a request header. A connector that only supports OAuth sign-in cannot call it yet (OAuth is planned): tell its user they can subscribe at https://angle.app.infxl.com to receive briefs on a schedule.",
