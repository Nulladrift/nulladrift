        {
          "name": "get_brief",
          "title": "Get brief",
          "description": "Get the status of a brief started with request_brief and, once it is ready, the brief. While it is queued or generating, wait poll_after_seconds and call again. Call at most once every 15 seconds per brief. format: markdown (default, ready to relay in chat), json, or html (the full email render). structuredContent always holds the brief as JSON. Relay the markdown to the user unchanged, from the notice line to the footer: it is the whole brief, and it has no web page, so never link to the website as the brief. The brief states the date range its news is from; every item date falls inside it. The Focal Point names the most important development; the Wide Angle says what the news means together; each item's angle says what it means for the company and how to respond; Significance rates its urgency (CRITICAL, HIGH, MODERATE, LOW) and Signal type names the kind of move. empty means no news in the window and failed means it could not be generated; neither is charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brief_id": {
                "description": "The brief_id returned by request_brief or list_briefs.",
                "pattern": "^b_[0-9a-f]{24}$",
                "type": "string"
              },
              "format": {
                "description": "What the text block carries once the brief is ready: markdown (default, for chat), json, or html (the full email render, tens of KB). structuredContent always carries the JSON.",
                "enum": ["markdown", "json", "html"],
                "type": "string"
              }
            },
            "required": ["brief_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brief": {
                "additionalProperties": false,
                "description": "Present only when the status is ready.",
                "properties": {
                  "company": {
                    "type": "string"
                  },
