          "name": "list_case_studies",
          "title": "List case studies",
          "description": "Case studies of real systems Fedor built. Filter by focus: 'agents', 'mcp', 'other' or 'all' (default). Returns slug, title, summary and URL; use get_case_study for the full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "focus": {
                "default": "all",
                "description": "Which case studies to list.",
                "enum": ["agents", "mcp", "other", "all"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the returned text: en, ru, es or zh. Defaults to en.",
