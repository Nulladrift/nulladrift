            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the returned text: en, ru, es or zh. Defaults to en.",
                "enum": ["en", "es", "ru", "zh"],
                "type": "string"
              },
              "query": {
                "default": "",
                "description": "Words to look for, e.g. 'mcp' or 'snowflake'; empty lists all courses.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
