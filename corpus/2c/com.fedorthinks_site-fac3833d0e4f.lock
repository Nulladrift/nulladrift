      "serverInfo": {
        "name": "fedorthinks",
        "title": "Fedor Chishchin — AI agents & MCP servers",
        "version": "1.1.0",
        "websiteUrl": "https://fedorthinks.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public, read-only server for fedorthinks.com — the site of Fedor Chishchin, an AI engineer who builds AI agents and MCP servers. Use it to answer what services he offers, show case studies and posts as evidence, explain topics with his express courses (AI agents, MCP, RAG, architecture, enterprise stack and more), and tell people how to get in touch. All tools read public site content; nothing is written or sent.",
      "tools": [
        {
          "name": "get_case_study",
          "title": "Get a case study",
          "description": "The full text of one case study as Markdown, by slug (from list_case_studies).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the returned text: en, ru, es or zh. Defaults to en.",
                "enum": ["en", "es", "ru", "zh"],
                "type": "string"
              },
              "slug": {
                "description": "Case study slug, e.g. 'miamiflow'.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a case study"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
