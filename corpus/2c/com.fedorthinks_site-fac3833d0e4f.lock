        },
        {
          "name": "search_posts",
          "title": "Search posts",
          "description": "Search Fedor's blog posts by words in the title and summary, optionally limited to one tag (e.g. 'agents', 'mcp'). Returns up to 10 matches, newest first; use get_post for the full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the returned text: en, ru, es or zh. Defaults to en.",
                "enum": ["en", "es", "ru", "zh"],
                "type": "string"
              },
              "query": {
                "default": "",
                "description": "Words to look for; empty lists the newest posts.",
                "maxLength": 200,
                "type": "string"
              },
              "tag": {
                "description": "Only posts with this tag.",
                "maxLength": 40,
