        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp-scan.lowtoxgear.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.lowtoxgear/scanner",
        "title": "Lowtoxgear Scanner",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only MCP for the Low Tox Scanner (https://scan.lowtoxgear.com) — independent Australian ingredient scanner. 21,000+ AU products, 237 source-cited chemical rules, personalised for 17 chronic conditions (MCAS, eczema, PCOS, pregnancy, etc.). Primary tool: scan_barcode. For shopping the cleanest-in-class products, use the sister service com.lowtoxgear/storefront. Independent, no sponsored placement.",
      "tools": [
        {
          "name": "get_catalog_stats",
          "description": "Return the size of the indexed Australian product catalogue — total, food, beauty, and total scans performed. Useful to set user expectations on coverage.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2459657be02680c4fdac7767d1ee8dc9ee8c1fe8675199acf7aa6ec3fb6ffc99"
        },
        {
          "name": "get_magnet_samples",
          "description": "List the six condition-specific magnet guides with sample product images. Each guide is a strict-clean shortlist (eczema-safe personal care, clean shampoos AU, mineral-only sunscreens AU, pregnancy-safe beauty, fragrance-free essentials, snacks without artificial dyes).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2580e3bb39eeac812a3b0056a0216152e37c708f5e48f1c89be9d31b2cda4d8"
        },
        {
          "name": "get_resources",
          "description": "URL templates for chained queries — product page, per-product alternatives, category alternatives, magnet guides, OG images, and full LLM-ready documentation. Use to give the user/agent canonical links they can fetch or render directly.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:837fe50bf408296503f2293b41055a79e17367cada81b145c180ebe1dfa4b876"
        },
        {
          "name": "scan_barcode",
          "description": "Look up an Australian product by barcode (EAN/UPC/JAN, 6–14 digits) and get full chemical-safety analysis. Returns the product info (if found) plus an array of flagged ingredients with severity (red/amber), the matching chemical rule, source citation, and condition-specific notes. Optional `conditions` array escalates flags for users with chronic conditions: mcas, eczema, pcos, fertility, pregnancy, fibromyalgia, pots, ibs, hashimotos, fragrance, autism, adhd, asthma, autoimmune, endometriosis, lyme, chronic-fatigue.",
          "inputSchema": {
            "properties": {
              "barcode": {
                "description": "6–14 digit barcode (EAN/UPC/JAN). Common: 13-digit EAN.",
                "type": "string"
              },
              "conditions": {
                "description": "Optional list of personal condition tags to escalate flags for. Multiple supported.",
                "items": {
                  "enum": ["mcas", "eczema", "pcos", "fertility", "pregnancy", "fibromyalgia", "pots", "ibs", "hashimotos", "fragrance", "autism", "adhd", "asthma", "autoimmune", "endometriosis", "lyme", "chronic-fatigue"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1fb986c9cb1a89900641753c089e742477b54990cff05ec8013714ee54a5415"
        },
        {
          "name": "submit_missing_product",
          "description": "Request that a product be added to the Low Tox Scanner index. Useful when scan_barcode returns product_found: false. Submission goes to a moderation queue.",
          "inputSchema": {
            "properties": {
              "barcode": {
                "description": "6–14 digit barcode",
                "type": "string"
              },
              "brand": {
                "type": "string"
              },
              "category": {
                "enum": ["food", "cosmetics", "cleaning", "other"],
                "type": "string"
              },
              "ingredients_text": {
                "description": "Comma-separated ingredient list copied from the product packaging",
                "type": "string"
              },
              "notes": {
                "description": "Freeform context for the moderator",
                "type": "string"
              },
              "product_name": {
                "type": "string"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:790c42a5bf375ea247e468daca157d957bdcf825ed29551cfa126ee7152269b4"
        }
      ],
      "digest": "sha256:eff13bb6f1ca841037adf1c1e6e852b47a2d54d0da671a5d1b09ff6b297753cf"
    }
  }
}
