      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Vet US contractors against official public licence, permit, and discipline records. Use check_contractor to look up a contractor (requires an API key in Authorization: Bearer). Use get_coverage for jurisdictions, freshness, pricing, and known limits (free, no key). Results are public records, not legal advice, and not a consumer report.",
      "tools": [
        {
          "name": "check_contractor",
          "title": "Check a US contractor",
          "description": "Look up a US contractor in official public licence, permit, and discipline records (WA, TX, NYC, OR, CT and PA (Pittsburgh city licences only)) and return a match confidence and 0-100 trust score. A name-only match below 0.8 confidence returns verdict needs_review. Requires Authorization: Bearer <api key>. In PA only Pittsburgh city licences are covered (not statewide; PA Attorney General HIC registration is not checked). Each key gets 50 free checks per calendar month (UTC); after that, matched results are billed at the current per-check price from prepaid credits. not_found and out_of_coverage results are never charged (billing.charged is false).",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "City where the contractor works or is based; helps rank matches and permits.",
                "title": "City"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "State or city licence number, if known. An exact hit gives a high-confidence match.",
                "title": "License Number"
              },
              "name": {
                "description": "Business name as the contractor uses it, e.g. 'Valentine Roofing LLC'.",
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Business phone number in any format; used to confirm the match.",
                "title": "Phone"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "2-letter US state code, e.g. WA, TX, NY, OR, CT or PA. Strongly recommended.",
                "title": "State"
              },
              "website": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Business website; only the domain is compared with the name, never fetched.",
                "title": "Website"
              }
            },
            "required": ["name"],
            "title": "check_contractorArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "check_contractorOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a US contractor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6335d01ccb46e57b74899b6d934a9b031dc22085ed520c8ac073fc77814e9ef4"
        },
        {
          "name": "get_coverage",
          "title": "Get coverage, pricing and data freshness",
          "description": "Return jurisdictions, sources, record counts, freshness, pricing, and known limits. Free; no API key required.",
          "inputSchema": {
            "properties": {},
            "title": "get_coverageArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_coverageOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get coverage, pricing and data freshness"
          },
          "behavior": {
