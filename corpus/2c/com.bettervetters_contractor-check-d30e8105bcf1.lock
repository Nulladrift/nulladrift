            "readOnly": true
          },
          "digest": "sha256:16ba12bc6abfb8f5151cd15b2ebd0f2d431385bce7e519d84a14bc3b193340d3"
        }
      ],
      "digest": "sha256:5e0fe22d3a55dd65e350376afe2730e48c6da2c032ce74168a8ec03bb822f12f"
    }
