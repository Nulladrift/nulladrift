      "serverInfo": {
        "name": "Better Vetters",
        "version": ""
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Vet US contractors against official public licence, permit, and discipline records. Use check_contractor to look up a contractor (requires an API key in Authorization: Bearer). Use get_coverage for jurisdictions, freshness, pricing, and known limits (free, no key). Results are public records, not legal advice, and not a consumer report.",
      "tools": [
        {
          "name": "check_contractor",
          "description": "Look up a US contractor in official public licence, permit, and discipline records (WA, TX, NYC, OR, CT and PA (Pittsburgh city licences only)) and return a match confidence and 0-100 trust score. A name-only match below 0.8 confidence returns verdict needs_review. Requires Authorization: Bearer <api key>. In PA only Pittsburgh city licences are covered (not statewide; PA Attorney General HIC registration is not checked). Billed per successful in-coverage check at the current per-check price.",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "City"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License Number"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Phone"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              },
              "website": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Website"
              }
            },
            "required": ["name"],
            "title": "check_contractorArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "check_contractorOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3af99eebddfd8bd704abcae3f761a34b16002a0c96477ba0ca5b71d8c510f8d"
        },
        {
          "name": "get_coverage",
          "description": "Return jurisdictions, sources, record counts, freshness, pricing, and known limits. Free; no API key required.",
          "inputSchema": {
            "properties": {},
            "title": "get_coverageArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_coverageOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a532a34cb317c5057e014345748f8c05f78e8c8eb858aabb897980b5f59a806"
        }
