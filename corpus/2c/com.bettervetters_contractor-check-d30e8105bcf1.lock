      "instructions": "Vet US contractors against official public licence, permit, and discipline records. Use check_contractor to look up a contractor (requires an API key in Authorization: Bearer). Use get_coverage for jurisdictions, freshness, pricing, and known limits (free, no key). Results are public records, not legal advice, and not a consumer report.",
      "tools": [
        {
          "name": "check_contractor",
          "description": "Look up a US contractor in official public licence, permit, and discipline records and return a match confidence and 0-100 trust score. Requires Authorization: Bearer <api key>. Billed per successful in-coverage check at the current per-check price.",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "City"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License Number"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Phone"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              },
              "website": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Website"
              }
            },
            "required": ["name"],
            "title": "check_contractorArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "check_contractorOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
