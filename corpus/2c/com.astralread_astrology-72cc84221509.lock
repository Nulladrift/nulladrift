      "serverInfo": {
        "name": "astralread",
        "title": "AstralRead",
        "version": "0.1.0",
        "description": "Natal charts, transits, the sky of the day and Vedic (Jyotish) basics — nakshatras and Vimshottari dashas — from the Swiss Ephemeris, with links to the AstralRead astrology knowledge base.",
        "websiteUrl": "https://astralread.com",
        "icons": [
          {
            "src": "https://astralread.com/app-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AstralRead computes astrology data with the Swiss Ephemeris: natal charts (planets, houses, angles, major aspects with orbs), the tight transits of a day to a natal chart, the sky of a day, Vedic (Jyotish) basics — the sidereal chart with nakshatras and the Vimshottari dasha periods — and links to AstralRead's astrology knowledge base. The calculation tools are read-only and need no account. Signed in to AstralRead (OAuth), my_charts, my_chart, my_transits and my_calendar (the transits of the coming weeks with their build-up, exact moment and fading) work with the user's saved charts without asking for birth data, and ask_astrologer asks the site's astrologer about a saved chart — it spends one question of the user's plan, so use it only when the user asks for an AstralRead reading. Birth data is used only for the calculation and is never stored. Results are for self-reflection, not medical, psychological, legal or financial advice.",
      "tools": [
        {
          "name": "ask_astrologer",
          "title": "Ask the AstralRead astrologer",
          "description": "Asks the AstralRead astrologer a question about one saved chart of the signed-in user — the same astrologer as on astralread.com: the chart, the current transits and classic astrology and psychology books. Uses one question of the user's AstralRead plan; the answer is also saved in the chart's chat on the site. Not medical, legal or financial advice.",
          "inputSchema": {
            "properties": {
              "chart_id": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "chart_id from my_charts; omit for the first (own) chart.",
                "title": "Chart Id"
              },
              "lang": {
                "default": "en",
                "description": "Language of the result: en or ru.",
                "pattern": "^(en|ru)$",
                "title": "Lang",
                "type": "string"
              },
              "question": {
                "description": "The question, in the user's words.",
                "maxLength": 1000,
                "minLength": 3,
                "title": "Question",
                "type": "string"
              }
            },
            "required": ["question"],
            "title": "ask_astrologerArguments",
            "type": "object"
          },
