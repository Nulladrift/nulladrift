        {
          "name": "natal_chart",
          "title": "Natal chart",
          "description": "Calculates a natal (birth) chart with the Swiss Ephemeris: the exact sign, degree and house of the Sun, Moon, planets, North Node and Chiron; the Ascendant, MC, DSC and IC; the 12 house cusps; and the major aspects between the planets with their orbs. Adds short notes and links from the AstralRead knowledge base for the Sun, Moon and Ascendant signs. Use it when someone asks for their birth chart or about their placements. Needs the birth date, the place (or coordinates) and ideally the birth time. Birth data is used only for this calculation and is not stored or logged.",
          "inputSchema": {
            "properties": {
              "birth_date": {
                "description": "Birth date, YYYY-MM-DD (years 1800–2100).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "title": "Birth Date",
                "type": "string"
              },
              "birth_time": {
                "anyOf": [
                  {
                    "pattern": "^\\d{1,2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Local birth time, 24-hour HH:MM. Omit if unknown: then houses, Ascendant and MC are not computed.",
                "title": "Birth Time"
              },
              "house_system": {
                "default": "koch",
                "description": "House system: koch (default), placidus or whole_sign.",
                "enum": ["koch", "placidus", "whole_sign"],
                "title": "House System",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the result: en or ru.",
                "enum": ["en", "ru"],
                "title": "Lang",
                "type": "string"
              },
              "latitude": {
                "anyOf": [
                  {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Birth latitude in degrees (north +).",
                "title": "Latitude"
              },
              "longitude": {
                "anyOf": [
                  {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Birth longitude in degrees (east +).",
                "title": "Longitude"
              },
              "place": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Birth city, e.g. 'Chicago, Illinois, USA'. Used to look up coordinates and the time zone. Not needed if latitude/longitude are given.",
                "title": "Place"
              },
              "timezone": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "IANA time zone of the birth place, e.g. America/Chicago. Looked up from the place/coordinates when omitted.",
                "title": "Timezone"
              }
            },
            "required": ["birth_date"],
            "title": "natal_chartArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Natal chart"
