{
  "lockfileVersion": 2,
  "subjects": {
    "com.benchlet/incidentlib": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://incidentlib-mcp.benchlet.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "incidentlib",
        "version": "1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_incident",
          "title": "Get one incident",
          "description": "Returns one case in full by its id: the structured write-up (symptoms, trigger, root cause, components, contributing factors, summary, impact, timeline, detection, remediation, action items, lessons), its sources with archived copies, and `similar_cases`. Use after search_incidents, list_incidents or get_topic has given you a case id; not for finding cases (use search_incidents for symptoms, list_incidents or get_topic for a category). `lang: ko` returns the Korean text of each field where the reviewers wrote one, otherwise English. The id must look like IL-0007; an id of that shape that matches no approved case returns an error result saying so, and an id of another shape is rejected before the call. Every call for the same id returns the same case.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Case id such as IL-0007",
                "pattern": "^IL-\\d+$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "ko returns the Korean text of each field where the reviewers wrote one",
                "enum": ["en", "ko"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0d404561578d7722ea9fa608db6912ea9f4b4e2ef11e498249d16da415a6123"
        },
        {
          "name": "get_topic",
          "title": "Get a root cause, component, symptom, contributing factor or organisation",
          "description": "Returns one vocabulary value with every case that carries it and, under `related`, the other four kinds counted over those cases with case ids: for a symptom, the root causes behind it (answers 'what usually causes this'); for a root cause, the components and factors seen with it. Use when you already have a slug and want the picture around it; use vocab to find the slug from words, list_incidents for a plain paged list, search_incidents for a symptom sentence. `kind` is the slug's category: root_causes, components, symptoms, factors or orgs (the organisations that published cases). With `symptoms`, the page keeps only the cases that sentence finds, best match first, and `query` echoes it, so 'certificate expiry, but only where DNS was involved' is one call. The answer is not paged: `count` and `cases` hold every case of the value (at most a few dozen today). An unknown slug or a slug of the wrong kind returns an error result naming it; nothing is written.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Which category the slug belongs to",
                "enum": ["root_causes", "components", "symptoms", "factors", "orgs"],
                "type": "string"
              },
              "slug": {
                "description": "The value's slug, e.g. capacity, coredns, pod-pending, no-alerting, github",
                "type": "string"
              },
              "symptoms": {
                "description": "A symptom sentence that restricts the page to the cases it finds",
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abadd78f967e8f333fe9d3722ef2a3221587a9993d423308153fee6785d0b7bc"
        },
        {
          "name": "list_incidents",
          "title": "List incidents by vocabulary value",
          "description": "Lists cases by category, newest first, one page at a time: `count` and `cases` (id, title, organisation, date, root cause, page url), plus `next_cursor` when more remain; call again with `cursor` for the following page. Use when the question names a category (a root cause, component, symptom, contributing factor, domain or organisation) rather than a symptom sentence; for a sentence use search_incidents, and for one category with its related categories counted use get_topic. Each filter is a slug (kebab-case) of its own kind: `symptom` is what was observed (pod-pending), `factor` is a condition that made it worse (no-alerting), `root_cause` is why it happened (capacity). Filters combine with AND. An unknown slug returns count 0 with no error; find the slug with vocab when you only have words. Reads only; the same filters return the same page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "component": {
                "description": "e.g. coredns, vpc-cni",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "type": "string"
              },
              "domain": {
                "description": "kubernetes or ai-infra",
                "type": "string"
              },
              "factor": {
                "description": "contributing factor, e.g. no-alerting",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "ko returns the Korean text of each field where the reviewers wrote one",
                "enum": ["en", "ko"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Cases per page",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "org": {
                "description": "the organisation's slug, e.g. github",
                "type": "string"
              },
              "root_cause": {
                "description": "e.g. capacity, config-change",
                "type": "string"
              },
              "symptom": {
                "description": "e.g. pod-pending",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:986ecede9c10db97dbdfd0a79a004495934ece05c739e2b9730dd264851294c3"
        },
        {
          "name": "search_incidents",
          "title": "Search incidents by symptoms",
          "description": "Use first, whenever someone describes a failure they are seeing. Pass the symptoms as a sentence or a few words, in English or Korean; returns every reviewed public post-incident report the search finds for it, best match first: `total` is how many, `results` is one page of them in full (each with the case id, the page url and the source link), `matched` is every one as a row, and `next_cursor` fetches the next page. `interpreted` lists the values the sentence named, organisations included (the search moves cases carrying them up); `facets` count the results by root cause, component, symptom, contributing factor and organisation with the case ids, which answers 'what usually caused this' from the same call. The optional slug filters keep only cases carrying those values (AND); take slugs from facets, interpreted or vocab. Follow with get_incident for the full case.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "component": {
                "description": "Keep only cases with this component slug, e.g. coredns",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page",
                "type": "string"
              },
              "domain": {
                "description": "Keep only cases in this domain, e.g. kubernetes or ai-infra",
                "type": "string"
              },
              "factor": {
                "description": "Keep only cases with this contributing factor slug, e.g. no-alerting",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "ko returns the Korean text of each field where the reviewers wrote one",
                "enum": ["en", "ko"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Cases per page",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "org": {
                "description": "Keep only cases of this organisation, by slug, e.g. github (from facets.orgs, interpreted or vocab)",
                "type": "string"
              },
              "root_cause": {
                "description": "Keep only cases with this root cause slug, e.g. capacity",
                "type": "string"
              },
              "symptom": {
                "description": "Keep only cases with this symptom slug, e.g. pod-pending",
                "type": "string"
              },
              "symptoms": {
                "description": "What is observed, as a sentence or a few words, e.g. 'pods cannot get an IP, nodes show no available addresses' or 'coredns oom'. Leave it out to list every case under the slug filters, newest first; then at least one filter is required",
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d3ba20e79dc1d55cc31daffe30850617ba0627642f91e01e2a7c8e9f7d3f97f"
        },
        {
          "name": "vocab",
          "title": "Vocabulary: slugs and their names",
          "description": "Resolves words to vocabulary slugs for the filters of search_incidents, list_incidents and get_topic. With `query`, returns `matches`: the `limit` values nearest in meaning to the words, nearest first, each with kind, slug, English and Korean name and page url (e.g. 'cert ran out' finds certificate-expiry); `kind` restricts to one category. There is no similarity cutoff: the list is always `limit` long, so when the words name nothing in the library the matches are far from them; read the names before using a slug, and when none fits, search with search_incidents instead of filtering. Without `query`, returns every value of every kind with names, aliases and definitions (a large answer; prefer `query`). Reads only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Only this kind",
                "enum": ["root_causes", "components", "symptoms", "factors", "orgs"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Values to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A few words naming what you are looking for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d86b42162d165364aa73c3e5f45da5ca6bd61a557214f7f100804a9a82e1c0c"
        }
      ],
      "digest": "sha256:2ac76bb3d513a117297b13c9b03f91d44c0a6c75b400b68c709f8f445030a4f8"
    }
  }
}
