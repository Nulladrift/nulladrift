{
  "lockfileVersion": 2,
  "subjects": {
    "com.pointifytravels/travel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pointifytravels.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pointify-travel",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_prediction",
          "description": "Get a buy/wait/neutral recommendation for a flight fare based on historical patterns and time-based signals.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currentPrice": {
                "description": "Current fare price in USD that you are considering",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "departureDate": {
                "description": "Departure date in YYYY-MM-DD format",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "IATA airport code for arrival (e.g. LAX)",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "origin": {
                "description": "IATA airport code for departure (e.g. JFK)",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["currentPrice", "departureDate", "destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Fare Prediction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9d19496fa6439cce82c5a108d0a723f11f497009654429f68fdf323e13825dd3"
        },
        {
          "name": "list_deals",
          "description": "Browse current award travel deals and flight promotions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional deal type filter (e.g. 'flight', 'hotel', 'card')",
                "type": "string"
              },
              "limit": {
                "default": 12,
                "description": "Maximum number of deals to return (default 12)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse Award Deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ac771d74fc35e66dea9393fe72a1f33f8e5800e32ef30745986083fbf4f68241"
        },
        {
          "name": "optimize_points",
          "description": "Compare points redemption options for a flight and rank them by cents-per-point (CPP) value. Helps decide whether to pay cash or use loyalty points.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cashPrice": {
                "description": "Cash price of the ticket in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "pointsOptions": {
                "description": "Array of available points redemption options to compare",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "pointsRequired": {
                      "description": "Number of points required for this redemption",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "program": {
                      "description": "Loyalty program name (e.g. Chase Ultimate Rewards)",
                      "type": "string"
                    }
                  },
                  "required": ["pointsRequired", "program"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cashPrice", "pointsOptions"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Optimize Points Redemption"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:07f7cf937a1ea7edd3b1d3fe2970c01bf915eda84846e6a8e30121a88c6153bd"
        },
        {
          "name": "search_calendar",
          "description": "Find the cheapest travel dates around a target date. Shows a calendar view of minimum prices for flexible date travelers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "daysAfter": {
                "default": 7,
                "description": "Number of days after the target date to include (default: 7)",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "daysBefore": {
                "default": 7,
                "description": "Number of days before the target date to include (default: 7)",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "destination": {
                "description": "IATA airport code for arrival (e.g. LAX)",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "origin": {
                "description": "IATA airport code for departure (e.g. JFK)",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "targetDate": {
                "description": "Center date for the calendar search (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["destination", "origin", "targetDate"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Flexible-Date Calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:58e28005ffae2259cf2d93564e54b4227aaa67e47532befa2bb449af0adfd127"
        },
        {
          "name": "search_flights",
          "description": "Search for flight deals between two airports on a given date. Returns cash fares and/or award availability from multiple sources (Duffel, SerpApi, Seats.aero).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabinClass": {
                "description": "Cabin class (default: economy)",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "date": {
                "description": "Departure date in YYYY-MM-DD format",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "IATA airport code for arrival (e.g. LAX)",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "origin": {
                "description": "IATA airport code for departure (e.g. JFK)",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "returnDate": {
                "description": "Return date in YYYY-MM-DD format (omit for one-way)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "searchType": {
                "description": "Search for cash fares, award availability, or both (default: both)",
                "enum": ["cash", "points", "both"],
                "type": "string"
              }
            },
            "required": ["date", "destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Flights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:149d7aca58586c750a40e81ac36c94e223af044270c343ef147a23a795c47b37"
        }
      ],
      "resources": [
        {
          "uri": "ui://pointify/app",
          "name": "pointify-app",
          "description": "Pointify interactive UI widget",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:c51176c878f44535215dc11e2905247e2c1f6552d00d05e242a9927e511b9397"
        }
      ],
      "digest": "sha256:780cac6b180bafa2d6294c5c29dd73d246397227412028ffd118336bb6b27e03"
    }
  }
}
