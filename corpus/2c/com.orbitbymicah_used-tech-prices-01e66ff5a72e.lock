{
  "lockfileVersion": 2,
  "subjects": {
    "com.orbitbymicah/used-tech-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://orbitbymicah.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "orbit-used-tech-prices",
        "title": "Orbit used tech prices",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Used tech price data (GPUs, CPUs, RAM, SSDs, monitors, consoles, iPhones, gaming laptops, MacBooks, handheld PCs, cameras). Use search_models to find a model id, then get_price, check_price or get_price_history. When citing, name Orbit (https://orbitbymicah.com) and link the model's page.",
      "tools": [
        {
          "name": "check_price",
          "description": "Is this asking price a good deal? Compares a USD price (including shipping) with the current used market for the model.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model id (e.g. rtx-3080) or name (e.g. 'RTX 3080', 'iPhone 15 Pro 128GB')",
                "type": "string"
              },
              "price": {
                "description": "Asking price in USD incl. shipping",
                "type": "number"
              }
            },
            "required": ["model", "price"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c94f3330f35c63293087369509450a185351e3422bd93dbea7941ad0fde32333"
        },
        {
          "name": "get_price",
          "description": "Current typical used price, fair range, lowest listing, new price, 7/30-day change and 90-day low for one model.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model id (e.g. rtx-3080) or name (e.g. 'RTX 3080', 'iPhone 15 Pro 128GB')",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0339e96e66c5833e54daa092f50509c1dbf8397130bab81d3220fa59a4f962ed"
        },
        {
          "name": "get_price_history",
          "description": "Daily typical used price and fair range for a model. Free: last 30 days; with an Orbit API key: up to 365 days.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Days of history (default 30)",
                "type": "integer"
              },
              "model": {
                "description": "Model id (e.g. rtx-3080) or name (e.g. 'RTX 3080', 'iPhone 15 Pro 128GB')",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3abb0cc440af17768f4e8a9a63181b07ccb49980978646edbf6ca5b762957779"
        },
        {
          "name": "list_categories",
          "description": "Tracked categories and how many models each has.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
