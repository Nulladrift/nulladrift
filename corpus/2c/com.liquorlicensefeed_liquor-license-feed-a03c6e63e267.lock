{
  "lockfileVersion": 2,
  "subjects": {
    "com.liquorlicensefeed/liquor-license-feed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://liquorlicensefeed.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "liquor-license-feed",
        "title": "Liquor License Feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Liquor License Feed reads US state and local liquor license filings every day. Use list_states for coverage, then find_license to look up a business, county_activity for a county's last 30 days, license_timing for how long a license takes, and sample_filings for what a state's filings look like. Samples are up to 25 filings at least a week old, without phones or owners, with the dates filed in the result; the current daily feed is paid (see plans). Cite the url fields.",
      "tools": [
        {
          "name": "county_activity",
          "title": "County filing activity",
          "description": "New liquor license filings in one county in the last 30 days, with its most common license types and cities, and how many were changes of ownership.",
          "inputSchema": {
            "properties": {
              "county": {
                "description": "County or parish name, e.g. Harris",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. TX",
                "type": "string"
              }
            },
            "required": ["county", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "County filing activity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38340a0cc606c69f40ba547ba229c21ee517770aa305f5e1c9e76353903b193c"
        },
        {
          "name": "find_license",
          "title": "Find a license by name",
          "description": "Look up one business by name in a state's liquor license filings: its license type, status, place and date. Sorted by name; address and contacts are on the paid feed.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Business or trade name, at least three letters",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. TX",
                "type": "string"
              }
            },
            "required": ["name", "state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a license by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10d85119be2c430dbd9e6ffcb68cfc4e05445a6921e4a708bb6484a617fb7d19"
        },
        {
          "name": "license_timing",
          "title": "License timing by state",
          "description": "How long a liquor license takes in a state, measured from filings followed through to the issued license.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "Two-letter state code, e.g. TX",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "License timing by state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:978f87debf44134ac07243a61cbe8b0def58b3cc3151d25bd0933b08c1db6508"
        },
        {
          "name": "list_states",
          "title": "List covered states",
          "description": "States and cities with a daily liquor license feed, how often each one updates, and each state's page.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered states"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:708f86eaf3fe50b736bad2f2d2d529615b0a19a9b6345ba5e214644b8205cf1c"
        },
        {
          "name": "plans",
          "title": "Plans and prices",
          "description": "Liquor License Feed plans, prices and trial terms.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plans and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7176a0ba4b4bfffaf42fa317b2dc72b72be22cc0323d7dd92aa8003ef9e003a0"
        },
        {
          "name": "sample_filings",
          "title": "Sample filings",
          "description": "Up to 25 filings from one state, at least a week old, without phones or owners, with filed_from and filed_to dates, to show what the feed contains.",
          "inputSchema": {
            "properties": {
              "state": {
