      "serverInfo": {
        "name": "skillspicker",
        "title": "SkillsPicker",
        "version": "1.1.0",
        "websiteUrl": "https://skillspicker.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SkillsPicker finds open-license agent skills (SKILL.md) for a coding project. Call recommend_skills when the user starts or sets up a project, or asks which skills, Claude Code skills or Cursor rules to install. Pass stack tags from the project files (package.json, pyproject.toml, go.mod) so no code leaves the machine. Call search_skills to look up skills for one task or tool, for example \"stripe webhooks\". Call list_skill_tags for the tag names. Every call returns 2 free picks with install commands and a link to the full ranked list ($9 once).",
      "tools": [
        {
          "name": "list_skill_tags",
          "title": "List stack and task tags",
          "description": "List the stack tags (frameworks, languages, services) and task tags (testing, code-review, security and more) that recommend_skills accepts, with the size of the skill index. No input needed. Read-only.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List stack and task tags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b6c788d1f852942c022e246a2824fb884f9b40a899fd44cea986fc118c44b74b"
        },
        {
          "name": "recommend_skills",
          "title": "Recommend agent skills for a project",
          "description": "Recommend agent skills (SKILL.md) that fit a coding project, for Claude Code, Cursor, Codex, Copilot or Gemini CLI. Pass stack tags (best), a one line description, or a public GitHub repo URL. With no input it returns a sample for a Next.js project. Returns how many of 90,454 indexed skills fit, 2 free picks with license and install command, and a link to the full ranked list ($9 once). Read-only, no account.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "One or two sentences about the project, for example \"FastAPI service with Postgres, needs tests\".",
                "type": "string"
              },
              "repo_url": {
                "description": "Public GitHub repo URL. We read the file list and manifest files, nothing else.",
                "type": "string"
              },
              "tags": {
                "description": "Stack and task tags from the project files, for example [\"nextjs\",\"supabase\",\"stripe\",\"testing\"]. Tag names: call list_skill_tags.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Recommend agent skills for a project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b6482ec25b80f61c9b0204946339d8cfd414c9a9fb61f09e05cd4d2d4506cea0"
        },
        {
          "name": "search_skills",
          "title": "Search agent skills by task or tool",
          "description": "Search 90,454 open-license agent skills (SKILL.md) by task, tool or framework, for example \"stripe webhooks\", \"playwright tests\", \"django admin\" or \"terraform aws\". Returns the match count, the top 2 skills with license and install command, and a link to the full ranked list ($9 once). Read-only, no account.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A task, tool or framework in plain words, for example \"stripe webhooks\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search agent skills by task or tool"
          },
          "behavior": {
