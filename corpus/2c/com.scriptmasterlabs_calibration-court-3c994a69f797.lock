      "serverInfo": {
        "name": "calibration-court",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Calibration Court scores decision-model probabilities against real outcomes. Free: leaderboard, model report, ledger verification. Paid via x402 (HTTP 402): USDC on Base, USDC on Solana, XRP on XRPL, USDC on Arc, or XAH on Xahau.",
      "tools": [
        {
          "name": "court_calibrate_labels",
          "description": "Paid (x402: USDC on Base, USDC on Solana, XRP on XRPL, USDC on Arc, or XAH on Xahau). Fit isotonic calibration on YOUR labelled outcomes ({p,y} pairs) and recalibrate the given probabilities. Stateless; nothing is stored.",
          "inputSchema": {
            "properties": {
              "examples": {
                "items": {
                  "properties": {
                    "p": {
                      "type": "number"
                    },
                    "y": {
                      "enum": [0, 1],
                      "type": "integer"
                    }
                  },
                  "required": ["p", "y"],
                  "type": "object"
                },
                "type": "array"
              },
              "probs": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["examples", "probs"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:18bfe51269ec583d896333cecabb9fb341dc328230a2c68e8549393de202ff6d"
        },
        {
          "name": "court_leaderboard",
          "description": "Live ranking of decision models by Brier score on resolved real-world questions. Free. Returns empty lists when nothing has resolved.",
          "inputSchema": {
            "properties": {
              "task_type": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:76c77b6e1d26d012bde299566a1ad922053e146b4cd134f5e4504ca95a1aa86d"
        },
        {
          "name": "court_model_report",
          "description": "Calibration report for one model: Brier, ECE, reliability bins with Wilson intervals, overconfidence, drift. Free.",
          "inputSchema": {
            "properties": {
              "model": {
                "type": "string"
              },
              "task_type": {
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6b428fe84727137ce60be1842649bc5885215f2adb42a20c8e2bfbbd78efc4fe"
        },
        {
          "name": "court_recalibrate",
          "description": "Paid (x402: USDC on Base, USDC on Solana, XRP on XRPL, USDC on Arc, or XAH on Xahau). Map a model's raw probability to an empirically calibrated one using resolved outcomes on the ledger. Refuses with insufficient_data below 30 samples.",
          "inputSchema": {
            "properties": {
              "model": {
                "type": "string"
              },
              "prob": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "task_type": {
                "type": "string"
              }
            },
            "required": ["model", "prob"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:304b4134d85f5912017456368d7a7eabf5cbe4e0dede961be91acd9dd5534b0e"
        },
        {
          "name": "court_verify_ledger",
          "description": "Recompute the SHA-256 hash chain and cross-check derived tables. Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cba9b0e0bf6b5c1ce87322eeaf1cd893febafed21ce3e4c7bb285c6bb7ec9101"
        }
      ],
      "digest": "sha256:f217d710a2cd3c024bf410b6e8e611aaefbf358b16719236e9f8ce6b7baf5670"
    }
  }
