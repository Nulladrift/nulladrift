        {
          "name": "BALANCE",
          "description": "General mass/energy balance solver using GEKKO",
          "inputSchema": {
            "properties": {
              "EQUATION": {
                "description": "Equality/inequality constraints. Keys prefixed eq/ge/le/gt/lt. Each entry: {'left': expr, 'right': expr}.",
                "type": "object"
              },
              "MAXIMIZE": {
                "description": "Objective to maximize. Format: {'left': 'maxtarget', 'right': 'expr'}.",
                "nullable": true,
                "type": "object"
              },
              "MINIMIZE": {
                "description": "Objective to minimize. Format: {'left': 'mintarget', 'right': 'expr'}.",
                "nullable": true,
                "type": "object"
              },
              "VARIABLE": {
                "description": "Decision variables. Each entry: [lb, init, ub] for free variable, or [fixed, fixed, fixed] for constant.",
                "type": "object"
              }
            },
            "required": ["EQUATION", "VARIABLE"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6b644b53aa326234f53988b92431089c23ba5516e8444b2aa16702acd6464c9"
        },
