{
  "lockfileVersion": 2,
  "subjects": {
    "com.profullstack/search-peptides": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://search.peptides.pit.world/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "search.peptides",
        "version": "0.3.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "search.peptides compares research-peptide vendors and listings. Use search_listings for \"where is X cheapest / tested\" questions (prices in USD, ranked per mg), search_vendors to find or vet a vendor and how to contact them, get_vendor for one vendor's full record and the evidence behind its verification score, get_rules for how that score is computed. Scores and test counts come from Finnrick's independent lab testing; COA findings are from documents the vendor publishes. Not affiliated with Finnrick or any vendor. For research use; not medical advice.",
      "tools": [
        {
          "name": "get_peptide",
          "title": "Get Peptide",
          "description": "One peptide: how many vendors list it, cheapest USD per mg, and independent lab results by vendor.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb0d9004e26f0a14755c8aa7b2b68f2c22808746965f72ba9781883edbd05083"
        },
        {
          "name": "get_rules",
          "title": "Get Scoring Rules",
          "description": "How the verification score is computed: what counts as a verifiable certificate, each component with its weight and rule, the scored/insufficient/unscored thresholds, and the latest score changes across vendors.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Recent score changes to return (default 20).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e8daa0745f11b9baf2ffe984aa5d2e6c3d5f9f8f264fede71ea95e6a8de3669"
        },
        {
          "name": "get_vendor",
          "title": "Get Vendor",
          "description": "Everything about one vendor: verification score with every component (weight, points, evidence), score history, independent tests with lab, batch and public record link, contact card, every listing with price per mg, payment, shipping, coupons, how to order.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f55852419bb2bcd8818382699d2a87c8f032edbdee10a1cff9a9055fe650e329"
        },
        {
          "name": "list_peptides",
          "title": "List Peptides",
          "description": "Every peptide in the register with vendor and listing counts, lowest USD per mg and lab pass counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57422616bfd69bb40d5d9dc267c4928cca474d832d8c651cef28723a279c8ce3"
        },
        {
          "name": "search_listings",
          "title": "Search Peptide Listings",
          "description": "Search every research-peptide listing (vendor × peptide × size) and rank by USD per mg, price, vendor verification score or size. Filter by lab testing, stock, payment method, where it ships from and more. Returns listings with the vendor verification score, Finnrick rating and lab-test flags, plus facet counts.",
          "inputSchema": {
            "properties": {
              "blend": {
                "description": "Blends only.",
                "type": "boolean"
              },
              "coupon": {
                "type": "boolean"
              },
              "form": {
                "enum": ["vial", "supply", "liquid", "spray", "capsule", "topical", "pen"],
                "type": "string"
              },
              "in_stock": {
                "type": "boolean"
              },
              "limit": {
                "description": "Listings to return (default 25, max 200).",
                "type": "integer"
              },
              "max_mg": {
                "description": "Maximum mg per vial.",
                "type": "number"
              },
              "max_per_mg": {
                "description": "Maximum USD per mg.",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum listing price in USD.",
                "type": "number"
              },
              "min_mg": {
                "description": "Minimum mg per vial.",
                "type": "number"
              },
              "min_price": {
                "type": "number"
              },
              "min_score": {
                "description": "Minimum Finnrick rating (0-100, as Finnrick publishes it).",
                "type": "number"
              },
              "min_verification": {
                "description": "Minimum verification score (0-100, computed from checkable evidence; see get_rules). Unscored vendors never match.",
                "type": "number"
              },
              "ordering": {
                "enum": ["checkout", "message", "marketplace", "login"],
                "type": "string"
              },
              "page": {
                "type": "integer"
              },
              "passed": {
                "description": "Only vendors that passed a lab test for this peptide.",
                "type": "boolean"
              },
              "payment": {
                "enum": ["crypto", "card", "paypal", "zelle", "venmo", "cashapp", "bank", "western-union", "alipay", "marketplace"],
                "type": "string"
              },
              "peptide": {
                "description": "Peptide slug or name, e.g. \"bpc-157\", \"Tirzepatide\", \"BPC-157 + TB-500\".",
                "type": "string"
              },
              "q": {
                "description": "Words to match in the product name, peptide or vendor.",
                "type": "string"
              },
              "ships_from": {
                "description": "ISO-3166 alpha-2 (US, CN, HK, CA, GB, AU…) or EU.",
                "type": "string"
              },
              "single": {
                "description": "Single peptides only (no blends).",
                "type": "boolean"
              },
              "sort": {
                "enum": ["per_mg", "price", "verification", "score", "size", "name"],
                "type": "string"
              },
              "tested": {
                "description": "Only vendors with independent lab tests.",
                "type": "boolean"
              },
              "text": {
                "description": "Free text, e.g. \"retatrutide lab tested under $1/mg in stock\". Parsed into the filters below.",
                "type": "string"
              },
              "vendor": {
                "description": "Vendor slug.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:151c0917226f4601f68a06dcc2efbb4caf053f545315a3d6aa6fd039f1304ac4"
        },
        {
          "name": "search_vendors",
          "title": "Search Peptide Vendors",
          "description": "Search peptide vendors by verification score (default order; null = insufficient data or unscored, never guessed), Finnrick rating, lab pass rate, payment, where they ship from, how to order and how to contact them (email, phone, WhatsApp, Telegram, socials). Each vendor carries a contact card.",
          "inputSchema": {
            "properties": {
              "contact": {
                "enum": ["email", "phone", "website", "whatsapp", "telegram", "instagram", "x", "facebook", "discord", "tiktok", "youtube", "reddit", "linkedin", "signal"],
                "type": "string"
              },
              "coupon": {
                "type": "boolean"
              },
              "limit": {
                "description": "Vendors to return (default 25).",
                "type": "integer"
              },
              "min_pass": {
                "description": "Minimum lab pass rate in percent.",
                "type": "number"
              },
              "min_score": {
                "description": "Minimum Finnrick rating (0-100, as Finnrick publishes it).",
                "type": "number"
              },
              "min_verification": {
                "description": "Minimum verification score (0-100, computed from checkable evidence; see get_rules). Unscored vendors never match.",
                "type": "number"
              },
              "ordering": {
                "enum": ["checkout", "message", "marketplace", "login"],
                "type": "string"
              },
              "payment": {
                "enum": ["crypto", "card", "paypal", "zelle", "venmo", "cashapp", "bank", "western-union", "alipay", "marketplace"],
                "type": "string"
              },
              "peptide": {
                "description": "Only vendors that list this peptide (slug).",
                "type": "string"
              },
              "priced": {
                "description": "Only vendors with published prices.",
                "type": "boolean"
              },
              "q": {
                "description": "Vendor name words.",
                "type": "string"
              },
              "ships_from": {
                "description": "ISO-3166 alpha-2 (US, CN, HK, CA, GB, AU…) or EU.",
                "type": "string"
              },
              "sort": {
                "enum": ["verification", "score", "pass_rate", "tests", "per_mg", "listings", "name"],
                "type": "string"
              },
              "tested": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f06c5b4f47aa81e37e00a6e9d484081921dcfa5e3a8dd3cb976a1670b66605b"
        },
        {
          "name": "sponsor_vendor",
          "title": "Sponsor a Vendor",
          "description": "Start a sponsorship: $49 pins one vendor above matching results for 30 days, always labelled Sponsored. Returns a CoinPay hosted checkout url; the buyer opens it and pays with any coin or PayPal. Nothing is charged until they pay there.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email for the receipt.",
                "type": "string"
              },
              "vendor": {
                "description": "Vendor slug.",
                "type": "string"
              }
            },
            "required": ["email", "vendor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e71b572a736fe361c19fd5cde37532c4f1c7d568ded8bdd71da52956b2e7d12"
        }
      ],
      "digest": "sha256:915a98fd10c9598b88f32b6a77363047dc3bb7d5f149e30e7d0e3aa121fb4bb9"
    }
  }
}
