        {
          "name": "book_depth",
          "description": "FREE, no key: the Taifoon venue's order book for one market as it stands: up to 40 bid and 40 ask levels (price, qty), the mid, the best bid and ask, the qty resting on each side, the largest resting levels as walls, and the venue clock (t_logical, unix seconds) with the age of the reading and whether it is stale. This is the VENUE's own book (its market-making and flow actors are synthetic), never CME order flow: say 'venue book' when you use it. For candles use tape; for the last close use price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "levels": {
                "description": "levels per side to return (default 10; the sums and walls always read all 40)",
