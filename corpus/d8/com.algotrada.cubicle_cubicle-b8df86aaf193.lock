        {
          "name": "follow",
          "description": "Follow a trading model (from the STARTER plan, starter-20): creates the follow record — the model, your sizing (fixed_notional usd, or proportional bps of your balance), your caps (max_notional_usd, max_open_positions, max_daily_loss_usd, markets) and optionally the wallet your own runner will sign with. Validated exactly as follow_quote; one active follow per model, a new one supersedes it. Returns the record, its digest (the coordination record follow.created) and the attribution every mirror of it is placed under (copy:<you>:<model>). Nothing is traded by this call: your own runner mirrors fills under this record, and it can be stopped with unfollow at any time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "caps": {
                "description": "{\"max_notional_usd\":100,\"max_open_positions\":3,\"max_daily_loss_usd\":40,\"markets\":[\"BTC\"]}",
                "type": "object"
              },
              "follower_wallet": {
                "description": "the 0x address your runner signs mirrors with (optional now; required once the venue enforces per-order auth)",
                "type": "string"
              },
              "model": {
                "description": "the model's attribution from the models tool (or give script instead)",
                "type": "string"
              },
              "script": {
                "description": "instead of a model: a PROVEN script's id from the strategies tool (scripts.proven); followed through the desk that runs it, only while the gate lists it PROVEN and the desk trades live",
                "type": "string"
              },
              "sizing": {
                "description": "{\"kind\":\"fixed_notional\",\"usd\":50} or {\"kind\":\"proportional\",\"bps\":200}",
                "type": "object"
              }
