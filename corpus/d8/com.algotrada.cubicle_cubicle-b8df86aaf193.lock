        {
          "name": "film",
          "description": "Seal a past window of the tape into a FILM: the bars replayed one by one with the trader's drawings and marked levels, optionally the structure computed over the bars (pivots, legs, swings and the range they share, none drawn before the bar that confirmed it) and a rehearsed machine's trades. Returns the film's public link, where it plays and can be downloaded as a video. 24 to 360 bars; the window must be in the past. A film is a replay of what printed: say so, and never present it as a forecast.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "drawings": {
                "description": "include the trader's drawings (default true)",
                "type": "boolean"
              },
              "from": {
                "description": "window start, ISO-8601 UTC",
                "type": "string"
              },
              "headline": {
                "description": "the headline's first part (drawn in parchment), at most 44 characters",
                "type": "string"
              },
              "headline_gold": {
                "description": "the headline's second part (drawn in gold)",
                "type": "string"
              },
              "kicker": {
                "description": "a short line at the right, e.g. price → structure",
                "type": "string"
              },
              "machine": {
                "description": "include the trades of the trader's rehearsed machine on this market, labelled a rehearsal",
                "type": "boolean"
              },
              "market": {
                "description": "the market",
                "enum": ["NQ", "ES", "YM", "BTC", "ETH", "SOL"],
                "type": "string"
              },
              "marks": {
                "description": "include the trader's marked levels (default true)",
                "type": "boolean"
              },
              "palette": {
