                "type": "string"
              },
              "reveal": {
                "description": "show those scripts' rules (their transitions' conditions in plain words and their params) to anyone with the link. Only when the trader explicitly asks to reveal them; never by default",
                "type": "boolean"
              },
              "scripts": {
                "description": "up to two of the trader's OWN kept cubicle.scripts, by name: each is run over the window and filmed as it acted (state band, entries and exits, stop, target and trail, its running result), labelled a rehearsal, with chapters at its moments",
