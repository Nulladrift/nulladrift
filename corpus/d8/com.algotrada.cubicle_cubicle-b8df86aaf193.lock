        {
          "name": "decide",
          "description": "One turn of your trading agent: send a SCORE, never an order. p is your probability (0 to 1) that the market is higher at the desk's horizon, what is one line of why. Cubicle's code writes the typed decision (taifoon.trading.decision.v1) by the contract's score rule: enter long or short, stand aside, or exit (exit: true; an exit is always allowed), never stacking, inside the clock and the desk's caps; every entry carries its stop and longest hold, and the code exits on them before it reads your next score. The decision's order goes to Props CLOB (never proof), the decision is sealed onto the coord pipe and appended to your hash-chained ledger. Returns the decision, its trace id, the order and fill, and your open position.",
          "inputSchema": {
