        {
          "name": "generate_gif",
          "title": "Generate GIF",
          "description": "Render a downloadable animated meme GIF from an approved GIF template. Supports clip timing, FPS, width, caption text, caption size, and caption x/y placement.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apiKey": {
                "description": "Optional agent or developer API key for higher free-tier limits.",
                "minLength": 1,
                "type": "string"
              },
              "captions": {
                "description": "Caption objects. Use x/y to control where each caption goes.",
                "items": {
                  "properties": {
                    "boxWidthPct": {
                      "description": "Wrapping box width percent.",
                      "maximum": 100,
                      "minimum": 20,
                      "type": "number"
                    },
                    "color": {
                      "description": "Caption fill color such as #ffffff.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "fontFamily": {
                      "description": "Caption font family.",
                      "enum": ["impact", "arial", "poster"],
                      "type": "string"
                    },
                    "fontSize": {
                      "description": "Caption font size in pixels.",
                      "maximum": 64,
                      "minimum": 14,
                      "type": "number"
                    },
                    "id": {
                      "description": "Caption id such as top or bottom.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxLines": {
                      "description": "Maximum wrapped text lines.",
                      "maximum": 4,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "stroke": {
                      "description": "Caption stroke color such as #000000.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "text": {
                      "description": "Caption text.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "textAlign": {
                      "description": "Caption text alignment.",
                      "enum": ["left", "center", "right"],
                      "type": "string"
                    },
                    "x": {
                      "description": "Horizontal caption anchor percent.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "y": {
                      "description": "Vertical caption anchor percent.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "durationMs": {
                "description": "Clip duration in milliseconds.",
                "maximum": 24000,
                "minimum": 100,
                "type": "integer"
              },
              "fps": {
                "description": "Output playback FPS.",
                "maximum": 24,
                "minimum": 10,
                "type": "integer"
              },
              "gifSlug": {
                "description": "Approved GIF template slug from search_templates.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "returnBase64": {
                "description": "Return base64 and dataUrl in the MCP response. Defaults to true for MCP.",
                "type": "boolean"
              },
              "startMs": {
                "description": "Clip start time in milliseconds.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "tags": {
                "description": "Optional lowercase tags.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "title": {
                "description": "Filename/title hint for the generated GIF.",
                "maxLength": 120,
                "type": "string"
              },
              "widthPx": {
                "description": "Output width in pixels.",
                "maximum": 480,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["gifSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Generate GIF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:307ffb94a31dc23756b78571d7ee46a4b4e6389a3926ed612c17c321152576d7"
        },
        {
          "name": "generate_meme",
          "title": "Generate meme",
          "description": "Select an existing meme template, generate captions, and return one or more meme variants.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "allowHeuristicFallback": {
                "description": "Whether Memesio may fall back to heuristic captions if OpenAI captioning is unavailable. Defaults to false for keyed API/MCP calls.",
                "type": "boolean"
              },
              "apiKey": {
                "description": "Agent or developer API key for AI meme generation.",
                "minLength": 1,
                "type": "string"
              },
              "mode": {
                "description": "Generation mode. Only template-based meme generation is supported.",
                "enum": ["template"],
                "type": "string"
              },
              "prompt": {
                "description": "Prompt describing the meme concept to generate.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "rewriteNote": {
                "description": "Optional rewrite direction that pushes the joke toward a specific flavor.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "tone": {
                "description": "Caption tone. Use this to steer the humor style, for example absurd or corporate.",
                "enum": ["sarcastic", "deadpan", "wholesome", "absurd", "corporate", "dark-lite", "brand"],
                "type": "string"
              },
              "toneCues": {
                "description": "Optional extra style cues such as dry, playful, or bunny-coded.",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "variantCount": {
                "description": "How many meme variants to generate in one call. Defaults to 3 for MCP so results can use visibly different template types.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["apiKey", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate meme"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:64ddb5e42e0fce9f2d1b03635e01fdb4726cae0a6bd226b428764e8b5a51cc08"
        },
        {
          "name": "get_ai_quota",
          "title": "Get AI quota",
          "description": "Read the keyed AI quota before deciding whether to spend a generation run.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apiKey": {
                "description": "Agent or developer API key to inspect keyed AI quota.",
                "minLength": 1,
