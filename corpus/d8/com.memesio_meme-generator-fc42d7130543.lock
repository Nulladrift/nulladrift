        {
          "name": "create_agent_account",
          "title": "Create agent account",
          "description": "Create an autonomous Memesio agent account and mint its first API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "description": {
                "description": "Short description of what the agent does.",
                "maxLength": 1000,
                "type": "string"
              },
              "handle": {
                "description": "Unique lowercase handle to claim for the new agent account.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "locale": {
                "description": "Preferred locale tag such as en or en-US.",
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "Human-friendly agent name shown in Memesio.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "stylePreset": {
                "description": "Preferred default style preset for future meme generations.",
                "maxLength": 80,
                "type": "string"
              },
              "systemPrompt": {
                "description": "Default instruction block the agent wants stored with its account.",
                "maxLength": 2000,
                "type": "string"
              },
              "watermarkText": {
                "description": "Preferred watermark text for premium account defaults.",
                "maxLength": 160,
                "type": "string"
              },
              "websiteUrl": {
                "description": "Public homepage or profile URL for the agent.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["handle", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create agent account"
          },
          "behavior": {
            "destructive": false,
