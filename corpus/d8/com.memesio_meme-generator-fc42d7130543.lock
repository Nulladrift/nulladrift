  "subjects": {
    "com.memesio/meme-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memesio.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "memesio-meme-generator",
        "title": "Memesio Meme Generator",
        "version": "1.4.0",
        "description": "MCP server for meme generation, image/GIF template search, animated GIF rendering, static caption rendering, and AI meme creation.",
        "websiteUrl": "https://memesio.com/developers/mcp",
        "icons": [
          {
            "src": "https://memesio.com/brand/memesio-mark-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "caption_template",
          "title": "Caption template",
          "description": "Render a hosted meme from a known template slug and caption slots. Watermark customization is applied only for premium callers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apiKey": {
                "description": "Optional agent or developer API key for higher limits or premium watermark control.",
                "minLength": 1,
                "type": "string"
              },
              "captions": {
                "description": "Caption slot payloads or plain strings, ordered to match the template.",
                "items": {},
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "templateSlug": {
                "description": "Known Memesio template slug to caption.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "visibility": {
                "description": "Whether the created meme should be publicly shareable.",
                "enum": ["private", "public"],
                "type": "string"
              },
              "watermark": {
                "description": "Optional watermark override payload.",
                "properties": {
                  "enabled": {
                    "description": "Whether watermark rendering is enabled.",
                    "type": "boolean"
                  },
                  "position": {
                    "description": "Desired watermark position, such as bottom_left or bottom_right.",
                    "type": "string"
                  },
                  "scale": {
                    "description": "Relative watermark scale multiplier.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "text": {
                    "description": "Custom watermark text for premium callers.",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["captions", "templateSlug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Caption template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:25669dd6a4947da53cf2eb0f02e3fadd56049070ce89bde2ed1fb74a4cb0bd87"
        },
        {
          "name": "caption_upload",
          "title": "Caption upload",
          "description": "Upload an image by URL or base64, render caption slots on top of it, and return a hosted meme. Watermark customization is applied only for premium callers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apiKey": {
                "description": "Optional agent or developer API key for higher limits or premium watermark control.",
                "minLength": 1,
                "type": "string"
              },
              "captions": {
                "description": "Caption objects describing text and layout.",
                "items": {},
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "imageBase64": {
                "description": "Base64-encoded image bytes when not using imageUrl.",
                "minLength": 1,
                "type": "string"
              },
              "imageUrl": {
                "description": "Remote PNG, JPEG, or WebP image URL to caption.",
                "format": "uri",
                "type": "string"
              },
              "mimeType": {
                "description": "Required MIME type when imageBase64 is used.",
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Optional title for the generated hosted meme page.",
                "maxLength": 140,
                "type": "string"
              },
              "visibility": {
                "description": "Whether the created meme should be publicly shareable.",
                "enum": ["private", "public"],
                "type": "string"
              },
              "watermark": {
                "description": "Optional watermark override payload.",
                "properties": {
                  "enabled": {
                    "description": "Whether watermark rendering is enabled.",
                    "type": "boolean"
                  },
                  "position": {
                    "description": "Desired watermark position, such as bottom_left or bottom_right.",
                    "type": "string"
                  },
                  "scale": {
                    "description": "Relative watermark scale multiplier.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "text": {
                    "description": "Custom watermark text for premium callers.",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["captions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Caption upload"
          },
          "behavior": {
            "destructive": false,
