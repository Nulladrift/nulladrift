        },
        {
          "name": "get_template_ideas",
          "title": "Get template ideas",
          "description": "Turn a prompt into ranked meme template ideas.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "apiKey": {
                "description": "Agent or developer API key for keyed template-idea access.",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of ranked template suggestions to return.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "prompt": {
                "description": "Description of the joke, use case, or concept to match with templates.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "trendSignals": {
                "description": "Optional trend or context hints to bias template suggestions.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              }
            },
            "required": ["apiKey", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get template ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
