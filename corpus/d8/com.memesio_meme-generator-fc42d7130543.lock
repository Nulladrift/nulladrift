        },
        {
          "name": "search_templates",
          "title": "Search templates",
          "description": "Search the public meme template library before committing to a format. Use mediaType=gif or mediaType=all before calling generate_gif.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mediaType": {
                "description": "Filter template media type. Defaults to image for compatibility.",
                "enum": ["image", "gif", "all"],
                "type": "string"
              },
              "mode": {
                "description": "Search mode to use for template lookup.",
                "enum": ["lexical", "hybrid"],
                "type": "string"
              },
              "pageSize": {
                "description": "Maximum number of template results to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search query for meme templates.",
                "maxLength": 200,
                "type": "string"
              },
              "query": {
                "description": "Alternate query field if the client prefers query over q.",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "description": "Sort order for discovered templates.",
                "enum": ["curated", "trending"],
                "type": "string"
              },
              "tag": {
                "description": "Optional template tag to filter by.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
