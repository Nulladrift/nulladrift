{
  "lockfileVersion": 2,
  "subjects": {
    "com.infectrisk/infectrisk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://infectrisk.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "infectrisk",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "InfectRisk reports current respiratory illness activity (influenza, COVID-19, RSV) for 24 countries from aggregated public surveillance data (RKI, ECDC, UKHSA, CDC, WHO FluNet). Answers are qualitative only: activity level, direction, reported week, data date and source. This server never returns incidence numbers, case counts, prevalence or regional breakdowns, and it is not medical advice, not a diagnosis and not a personal risk assessment. Upstream sources publish weekly; data is refetched every 6 hours. A third tool, list_outbreaks, covers a separate dataset: the tracked WHO and ECDC outbreak notifications (Ebola, cholera, mpox and the like) with their region, status, WHO link and a plain language brief. Case figures appear there only where the published pages already show them, and they are reproduced as reported, not verified by InfectRisk. When `stale` is true the source has not published recently; say so instead of reporting the level as current.",
      "tools": [
        {
          "name": "get_infection_activity",
          "description": "Return the current respiratory illness activity (influenza, COVID-19, RSV) for one country as a qualitative level plus direction, reported week, data date, age of that data and source. Returns no incidence numbers, no case counts and no personal risk assessment, and it is not medical advice. When `stale` is true the source has not published recently; say so instead of reporting the level as current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country slug, for example germany, usa or uk. Use list_countries for the full set.",
                "enum": ["germany", "usa", "uk", "france", "spain", "italy", "netherlands", "poland", "sweden", "austria", "belgium", "denmark", "ireland", "portugal", "finland", "norway", "czechia", "hungary", "romania", "greece", "iceland", "japan", "india", "china"],
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language of the human readable labels and the summary sentence. Defaults to en.",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get infection activity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f8116701b377f538dbe4d6e1e58201bac590af13e97ebd7738774c2983972ec"
        },
        {
          "name": "list_countries",
          "description": "List the 24 countries InfectRisk covers, with their English and German names and the surveillance source behind each one. Scope is aggregated public surveillance data only, never case numbers or personal risk.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1bfb2413d7e142be9463cea52c965d69216e102c4db2d7ea3f13ee23b089e3af"
        },
        {
          "name": "list_outbreaks",
          "description": "List the outbreak notifications InfectRisk tracks (WHO Disease Outbreak News, ECDC and news consensus): disease, affected region, lifecycle status, WHO link, a plain language brief and the page a reader can open. Case figures are included only for outbreaks whose public pages already show them, reproduced as reported and never verified by InfectRisk. Separate dataset from the respiratory activity tools; it carries no incidence numbers and no personal risk assessment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language of the disease name, region and brief. Defaults to en.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "status": {
                "default": "active",
                "description": "Which part of the lifecycle to list. \"active\" covers acute events and those without a recent report, \"past\" the ones declared over, \"standing\" the permanent WHO topics. Defaults to active.",
                "enum": ["active", "past", "standing"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List outbreaks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ffc2e45ff29ff88dc073a3dab55b576a27bca9553e07c1664e6cb9d17274c3a"
        }
      ],
      "digest": "sha256:dc6686609bf5ec8bcfae51a1a778a53e62765c88b4dc1d2405d847da37fc5c68"
    }
  }
}
