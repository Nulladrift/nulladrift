      "serverInfo": {
        "name": "bevGTIN",
        "title": "bevGTIN",
        "version": "0.2.0",
        "description": "bevGTIN — the beverage alcohol sourcing GTIN confirmation."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "agent-bev developed bevGTIN — the beverage alcohol sourcing GTIN confirmation for AI agents. Call confirm_gtin with the GTIN as printed (8 to 14 digits); add market to ask whether it was seen in one market. Every confirm is open access before 1.0; pay: true asks for the paid confirm (x402 on Base, HTTP 402 with the offer until paid) and returns a signed receipt with the answer. Every answer is signed with kid bevgtin-2026-10 (key at https://gtin-bev.ai/.well-known/jwks.json). Artificial intelligence makes mistakes. bevGTIN is an information source, not a recommendation.",
      "tools": [
        {
          "name": "confirm_gtin",
          "title": "Confirm a beverage alcohol GTIN",
          "description": "Confirm one GTIN as a beverage alcohol product the trade will move: well-formed, seen (pages and dates), CUVEE category, strength, container, deposit, excise class, age-gated, markets and banners seen, signed. Unknown means no observation, never a guess.",
          "inputSchema": {
            "properties": {
              "gtin": {
                "description": "The GTIN as printed: 8, 12, 13 or 14 digits (spaces allowed)",
                "type": "string"
              },
              "market": {
                "description": "Optional ISO 3166-1 alpha-2 market (uk, de, fr …) to say whether the product was seen there",
                "type": "string"
              },
              "pay": {
                "description": "Optional. true asks for the paid confirm: an x402 settlement on Base (HTTP 402 with the offer until PAYMENT-SIGNATURE is sent) and a signed receipt with the answer. Without it the confirm is open access.",
                "type": "boolean"
              }
            },
            "required": ["gtin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
