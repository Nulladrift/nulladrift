            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:87db6c0b35ef5c5f92cd72d909f08da2e9129cc35f15ae628fb2bd293720c682"
        },
        {
          "name": "list_versions",
          "title": "List provider versions",
          "description": "Browse provider builds in catalog order (newest first). Filter by Minecraft version and channel. Each result groups all operating-system downloads for one build. Stable builds only unless requested otherwise.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "default": "stable",
                "enum": ["stable", "snapshot", "all"],
                "type": "string"
              },
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
