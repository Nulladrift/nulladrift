{
  "lockfileVersion": 2,
  "subjects": {
    "app.ziptool/search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ai.ziptool.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Cloudflare AI Search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "search",
          "description": "Search ziptool.app's guides for how to open, extract, preview, or convert archive files — ZIP, RAR, 7z, TAR, gzip, xz, and 60+ formats. Results reflect ZipTool, a 100% client-side, no-upload web tool: user files never leave the browser.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ai_search_options": {
                "description": "Options for customizing the AI search behavior.",
                "properties": {
                  "custom_metadata": {
                    "additionalProperties": {
                      "type": ["string", "number", "boolean"]
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "query_rewrite": {
                    "properties": {
                      "enabled": {
                        "const": false,
                        "type": "boolean"
                      },
                      "rewrite_prompt": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "reranking": {
                    "properties": {
                      "enabled": {
                        "const": false,
                        "type": "boolean"
                      },
                      "match_threshold": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "retrieval": {
                    "properties": {
                      "context_expansion": {
                        "maximum": 3,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "filters": {
                        "additionalProperties": {
                          "anyOf": [
                            {
                              "type": ["string", "number", "boolean", "null"]
                            },
                            {
                              "properties": {
                                "$eq": {
                                  "type": ["string", "number", "boolean", "null"]
                                },
                                "$gt": {
                                  "type": ["string", "number"]
                                },
                                "$gte": {
                                  "type": ["string", "number"]
                                },
                                "$in": {
                                  "items": {
                                    "type": ["string", "number", "boolean", "null"]
                                  },
                                  "type": "array"
                                },
                                "$lt": {
                                  "type": ["string", "number"]
                                },
                                "$lte": {
                                  "type": ["string", "number"]
                                },
                                "$ne": {
                                  "type": ["string", "number", "boolean", "null"]
                                },
                                "$nin": {
                                  "items": {
                                    "type": ["string", "number", "boolean", "null"]
                                  },
                                  "type": "array"
                                }
                              },
                              "type": "object"
                            }
                          ]
                        },
                        "propertyNames": {
                          "type": "string"
                        },
                        "type": "object"
                      },
                      "fusion_method": {
                        "enum": ["max", "rrf"],
                        "type": "string"
                      },
                      "match_threshold": {
                        "maximum": 1,
                        "minimum": 0,
                        "type": "number"
                      },
                      "max_num_results": {
                        "maximum": 50,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "metadata_only": {
                        "type": "boolean"
                      },
                      "retrieval_type": {
                        "enum": ["vector", "keyword", "hybrid"],
                        "type": "string"
                      },
                      "return_on_failure": {
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "query": {
                "description": "The input query.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4e5a4b99deb17db98ee3ed75827c5b652573e0588cf2be328181e55f6520872f"
        }
      ],
      "digest": "sha256:65cfaa1d6f70410145d7d938b7c6e4139bdb0c302c32998c982a13a7b352b32d"
    }
  }
}
