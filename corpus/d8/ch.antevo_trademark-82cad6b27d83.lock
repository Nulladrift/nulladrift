      "serverInfo": {
        "name": "antevo-trademark",
        "title": "Antevo Trademark",
        "version": "1.0.0",
        "description": "Screen brand names across 50+ trademark registers, with the companies and domains already registered under them, and get the opposition window in twenty offices with the provision it comes from.",
        "websiteUrl": "https://antevo.ch/mcp",
        "icons": [
          {
            "src": "https://antevo.ch/assets/antevo-plugin-logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Antevo Trademark watches the trademark registers for conflicts, copycats and lookalike filings. Use these tools to screen a name, read who holds a mark, see what is closing, and follow an adversary. Everything is read from public registers: it is intelligence, not legal advice, and the user's counsel acts on it. Never present a deadline as certain — always say their counsel confirms it. It does not advise whether to sue, oppose or settle — that is for their counsel. It cannot file, oppose or renew a mark on anyone's behalf: say so, and point to the office or counsel. It covers trademarks, plus company-register names and domain registrations when screening a shortlist; not share prices, company financials or other markets. When a result carries `attribution`, keep its text with any company identity you quote (organisation, HQ, PermID). When someone describes a business rather than naming a class, run suggest_classes before screen_mark or check_names, and relay its reasoning and closing caveat. Where check_names is available, use it for several candidate names at once, with the classes suggest_classes returned, and screen_mark for the detail on one name. In its answer, not_checked means a source did not answer and appears_free means a domain registry had no record that day: neither means the name is free. Say what is on file: never call a name clear, free to use or safe, and say their counsel confirms before they rely on one. Present a holder read as evidence, never as a label: do not call anyone a squatter, which is a legal conclusion. Some tools need the user's Antevo account; their client asks them to sign in the first time one is called. run_investigation spends a credit: say so and get their go-ahead before calling it, and never call a tool that spends unless the user asked. More credits are bought on their Antevo desk, not here. Filing counts from filing_landscape are of Antevo's copy of each register: for an office named in `do_not_quote`, a low count means filings not yet ingested, never a quiet market. Relay each deadline's `kind` as it is, and treat `window_unknown` as urgent. When watching a name and the user has not named classes, watch every class. Clear a conflict with dismiss_conflict only when the user says the hit is not a threat. For the register facts on a holder, holder_read and company_file spend no credits.",
      "tools": [
        {
          "name": "check_names",
          "title": "Screen a shortlist of names",
          "description": "Screens a shortlist of up to 15 candidate names in one call: the trademarks on\n    file near each name, the companies registered under it, and whether its domains are\n    registered. Ranks them fewest conflicts first: by how close the nearest mark is, then\n    by companies registered under the name and domains taken, then by how many near marks\n    there are. No account needed.\n\n    Optional `classes` (Nice class numbers) make marks filed only in unrelated classes\n    weigh less; without them, a mark in any class counts. The Swiss company register and\n    the .ch and .com domains are always checked; `countries` (\"UK\", \"SG\") adds those\n    company registers, and .sg for Singapore.\n\n    Returns, for each name, a trademark verdict on what is on file (none_found, similar,\n    close or identical), how many near marks were found, where they are filed and the\n    closest three; per country, the companies registered under the same or a similar\n    name (name and legal form only); and whether each domain is registered or appears\n    unregistered. A source that did not answer says not_checked, never that nothing is\n    on file, and names whose trademark screen did not finish are listed under\n    not_checked. none_found means none were found, not that the name is free to use, and\n    an unregistered domain can be taken at any time: it is a screen, not clearance, and\n    a filing from the last few days can be missing.\n    ",
          "inputSchema": {
            "properties": {
              "classes": {
                "anyOf": [
                  {
                    "items": {
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Classes"
              },
              "countries": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Countries"
              },
              "names": {
                "items": {
                  "type": "string"
                },
                "title": "Names",
                "type": "array"
              }
            },
            "required": ["names"],
            "title": "check_namesArguments",
            "type": "object"
          },
