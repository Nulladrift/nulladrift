        {
          "name": "suggest_classes",
          "title": "Which classes to file in",
          "description": "Which Nice classes a business like this files in. No account needed, and no\n    register is searched: it maps the description onto the Nice classification.\n\n    The question people cannot answer for themselves: not \"is my name taken\" but\n    \"taken in WHAT\". Nice has 45 classes and the numbering is opaque — software you\n    download is class 9, software you log into is class 42, and selling other people's\n    goods is class 35 whatever the goods are. Filing in one and not the other is the\n    most expensive routine mistake in the process.\n\n    Takes a description of the business and returns the classes similar businesses\n    file in, with the reasoning for each and a closing caveat: this reports how\n    similar businesses file, not what this one should file.\n    ",
          "inputSchema": {
            "properties": {
              "description": {
                "title": "Description",
                "type": "string"
