      "tools": [
        {
          "name": "calculate_deadline",
          "description": "Calculate a court deadline from cited rules (weekends, court holidays, service extensions and local rules applied). Returns the date, each counting step, the verbatim rule text and source for every rule used, any safe-date disclosure and any fixed statutory dates. Ask the user for the trigger date and how the paper was served; do not assume them. Show the user the citation and source link with every date or rule. Results are not legal advice. Coverage: Deadlines: California in depth (civil, family, probate, eviction, small claims, government claims, criminal, juvenile, appeals, agencies, pre-suit clocks, special proceedings, statutes of limitations; local rules for all 58 counties), federal civil and criminal, federal bankruptcy, and a partial Texas set. Other states’ deadlines are not covered. Court directory: every U.S. county.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "county": {
                "description": "California county slug, to use that superior court's local rules and closures",
                "type": "string"
              },
              "court": {
                "description": "Court id for local rules: cacd, cand, casd, caed, ca9, cacb, canb, casb, caeb, or 1dca to 6dca (CA-APP)",
                "type": "string"
              },
              "deadline_type": {
                "description": "Rule id from search_rules or list_deadline_rules, e.g. \"noticed_motion_opposition\"",
                "type": "string"
              },
              "service_method": {
                "description": "How the triggering paper was served, e.g. \"mail\" (TX), \"mail_in_state\", \"electronic\", \"substituted\" (CA). Omit for personal service.",
                "type": "string"
              },
              "state": {
                "description": "Rule set id: TX, CA, CA-FAM, CA-APP, US, US-BK, US-CRIM, CA-PROB, CA-UD, CA-SC, CA-GOV, CA-CRIM, CA-JUV, CA-AGENCY, CA-PRESUIT, CA-SPECIAL, CA-SOL",
                "type": "string"
              },
              "trigger_date": {
                "description": "Trigger date as YYYY-MM-DD (e.g. date of service or date judgment signed)",
                "type": "string"
              }
            },
            "required": ["deadline_type", "state", "trigger_date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a court deadline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7bac41e6c54f9199217a73eb51f185c61cc835a9c400dfc97394f118b13bdad"
        },
        {
          "name": "deadlines_from_trigger",
          "description": "Every deadline that follows one trigger event, like a docketing system: court, trigger, date in; all resulting deadlines out, each with its date, the rule citation, the official source and the 1Court rule page. Deadlines that apply only to some case types (limited civil, asbestos, PI Pathway...) are listed separately. For broad triggers (a motion hearing covers every motion type), pass kind to narrow (e.g. \"Noticed motion\", \"Motion for summary judgment\"); otherwise the usual kind is chosen and the rest are listed as other_deadlines. Ask the user for the trigger date and how the paper was served; do not assume them. Show the user the citation and source link with every date or rule. Results are not legal advice. Coverage: Deadlines: California in depth (civil, family, probate, eviction, small claims, government claims, criminal, juvenile, appeals, agencies, pre-suit clocks, special proceedings, statutes of limitations; local rules for all 58 counties), federal civil and criminal, federal bankruptcy, and a partial Texas set. Other states’ deadlines are not covered. Court directory: every U.S. county.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "county": {
                "description": "California county slug for local rules, e.g. \"los-angeles\"",
                "type": "string"
              },
              "court": {
                "description": "Court id for local rules (federal and appellate)",
                "type": "string"
              },
              "date": {
                "description": "Date of the trigger event, YYYY-MM-DD",
                "type": "string"
              },
              "kind": {
                "description": "For broad triggers, the kind to select (from list_triggers kinds), or \"all\"",
                "type": "string"
              },
              "rule_set": {
                "description": "Rule set id: TX, CA, CA-FAM, CA-APP, US, US-BK, US-CRIM, CA-PROB, CA-UD, CA-SC, CA-GOV, CA-CRIM, CA-JUV, CA-AGENCY, CA-PRESUIT, CA-SPECIAL, CA-SOL",
                "type": "string"
              },
              "service_method": {
                "description": "How the triggering paper (or the summons) was served, from the trigger's service_options. Omit for personal service.",
                "type": "string"
              },
              "trigger": {
                "description": "Trigger id from list_triggers, e.g. \"complaint_served\", \"motion_hearing\", \"trial_date\"",
                "type": "string"
              }
            },
            "required": ["date", "rule_set", "trigger"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "All deadlines from a trigger event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4a0a6387e607f17b9274ce883f7d1c76d96611cf7933fcb9108e6fbfbbf912a"
