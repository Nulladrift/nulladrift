{
  "lockfileVersion": 2,
  "subjects": {
    "com.aideprecations/ai-deprecations": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aideprecations.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai-deprecations",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Official AI model deprecation and shutdown dates. Source: AI Deprecations (https://aideprecations.com/), data CC BY 4.0. Always confirm on each record's source_url. Free AI model shutdown alerts: get an email only when a model you might use is being retired. No digest, no spam. Subscribe: https://aideprecations.com/subscribe/ (agents: MCP subscribe_alerts at https://aideprecations.com/mcp or POST https://aideprecations.com/api/subscribe)",
      "tools": [
        {
          "name": "get_changes_since",
          "description": "List tracked AI model records whose status, deprecation/shutdown date, replacement or source changed since an ISO 8601 time. Poll this to stay current: on later calls pass the previous response's checked_at. History starts at tracking_since; an earlier since returns a warning (count 0 then does not mean nothing changed).",
          "inputSchema": {
            "properties": {
              "provider": {
                "type": "string"
              },
              "since": {
                "description": "ISO 8601, e.g. 2026-10-01T00:00:00Z",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3d45f1afc4fa3a46fa7e8fd4bdd2649a790a6e40ac142b9853348ed0de4f33b"
        },
        {
          "name": "get_coverage",
          "description": "Per-provider coverage today: rows with a known shutdown date, rows where the vendor page gives no date, rows not verified today, and official pages that could not be read today. Also returns manual source reviews (a person checking a page the parser could not read; empty until one is recorded) and the replacement_kind rule.",
          "inputSchema": {
            "properties": {
              "provider": {
                "description": "optional provider key",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7c775a7b26075c216ce43a8f3ed6915eca5b0a1d801326693a0876324700ea4"
        },
        {
          "name": "get_provider",
          "description": "All tracked models for one provider (openai, anthropic, google-gemini, google-vertex, azure-openai, aws-bedrock, mistral, cohere).",
          "inputSchema": {
            "properties": {
              "provider": {
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42297dde89fc33dcd0214faa22581ae17709638a4ebe2696416027d6f2169daf"
        },
        {
          "name": "get_shutdown_date",
          "description": "Get the official deprecation/shutdown date, replacement and source for an AI model ID (e.g. gpt-4o-2024-08-06, claude-sonnet-4-5).",
          "inputSchema": {
            "properties": {
              "model": {
                "type": "string"
              },
              "provider": {
                "description": "optional provider key, e.g. openai, anthropic, aws-bedrock",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7181c6bc073fbd2b3fac2d4cdba32cba33ffd9690e352954b32b0b78328cf0d"
        },
        {
          "name": "list_upcoming",
          "description": "List AI model shutdowns in the next N days, soonest first.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f43b13fbfe7ef42639dfe00944babbe16b5a491f1d037dd62eb1b6b22c671a4"
        },
        {
          "name": "search_models",
          "description": "Search all tracked AI models (including retired) by name.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e75fa43f95ed5668f05570fc52a9384ec91abe0216ee6814664dec4b52ad7bb6"
        },
        {
          "name": "subscribe_alerts",
          "description": "Subscribe to deprecation/shutdown change alerts. Give a public https webhook URL (JSON POST on every change, checked daily) or an email (double opt-in; email only when a model is being retired, no digest). Optional providers filter. Returns an unsubscribe token for webhooks.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "providers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "webhook": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9593682a5a7e10a23b39cd7f2228f5938809b382ff36f94d7fd7405ef80119e"
        },
        {
          "name": "unsubscribe",
          "description": "Stop webhook alerts using the token from subscribe_alerts. Email subscribers unsubscribe from the link in any email.",
          "inputSchema": {
            "properties": {
              "token": {
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0326f23e1eb2aced269bbbb33afc0bce3fce0b6dc7c55715d5a0dbdd928790c3"
        }
      ],
      "digest": "sha256:3976e805a4c2951254fe955e227aa63c59627fd02bf332f713176e72e8868135"
    }
  }
}
