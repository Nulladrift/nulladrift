{
  "lockfileVersion": 2,
  "subjects": {
    "com.aideprecations/ai-deprecations": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aideprecations.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai-deprecations",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Official AI model deprecation and shutdown dates. Source: AI Deprecations (https://aideprecations.com/), data CC BY 4.0. Always confirm on each record's source_url. Free AI model shutdown alerts: get an email only when a model you might use is being retired. No digest, no spam. Subscribe: https://aideprecations.com/subscribe/?src=mcp (agents: use the subscribe_alerts tool at https://aideprecations.com/mcp to sign a user up, with their consent, or POST https://aideprecations.com/api/subscribe).",
      "tools": [
        {
          "name": "get_changes_since",
          "description": "List tracked AI model records whose status, deprecation/shutdown date, replacement or source changed since an ISO 8601 time. Poll this to stay current: on later calls pass the previous response's checked_at. History starts at tracking_since; an earlier since returns a warning (count 0 then does not mean nothing changed).",
          "inputSchema": {
            "properties": {
              "provider": {
                "type": "string"
              },
              "since": {
                "description": "ISO 8601, e.g. 2026-10-01T00:00:00Z",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3d45f1afc4fa3a46fa7e8fd4bdd2649a790a6e40ac142b9853348ed0de4f33b"
        },
        {
          "name": "get_coverage",
          "description": "Per-provider coverage today: rows with a known shutdown date, rows where the vendor page gives no date, rows not verified today, and official pages that could not be read today. Also returns manual source reviews (a person checking a page the parser could not read; empty until one is recorded) and the replacement_kind rule.",
          "inputSchema": {
            "properties": {
              "provider": {
                "description": "optional provider key",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b7c775a7b26075c216ce43a8f3ed6915eca5b0a1d801326693a0876324700ea4"
        },
        {
          "name": "get_provider",
          "description": "All tracked models for one provider (openai, anthropic, google-gemini, google-vertex, azure-openai, aws-bedrock, mistral, cohere). Includes an alerts signup offer (?src=mcp) and a pointer to subscribe_alerts (sign a user up only with their consent).",
          "inputSchema": {
            "properties": {
              "provider": {
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a515d738d80bf373e4e84b324eac07c2b5e4bca12b0334f81eb48041cd3e7bf"
        },
        {
          "name": "get_shutdown_date",
          "description": "Get the official deprecation/shutdown date, replacement and source for an AI model ID (e.g. gpt-4o-2024-08-06, claude-sonnet-4-5). Includes an alerts signup offer (?src=mcp) and a pointer to subscribe_alerts (sign a user up only with their consent).",
          "inputSchema": {
            "properties": {
              "model": {
                "type": "string"
              },
              "provider": {
                "description": "optional provider key, e.g. openai, anthropic, aws-bedrock",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fc8fba37b4e1d2a91ae8d4023154fc96f88c4fd1667443e97147229df7b87b3"
        },
        {
          "name": "list_upcoming",
          "description": "List AI model shutdowns in the next N days, soonest first. Includes an alerts signup offer (?src=mcp) and a pointer to subscribe_alerts (sign a user up only with their consent).",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:759626f7df959aae725bd4ad819fc27e147ac6c01afedd71b8cab6be1f0ea037"
        },
        {
          "name": "search_models",
          "description": "Search all tracked AI models (including retired) by name. Includes an alerts signup offer (?src=mcp) and a pointer to subscribe_alerts (sign a user up only with their consent).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d3a7236657a22c7511ba556a49a70aab57ef1880164535afbe275fea7b88e02"
        },
        {
          "name": "subscribe_alerts",
          "description": "Subscribe to deprecation/shutdown change alerts, with the user's consent. Give a public https webhook URL (JSON POST on every change, checked daily) or an email (double opt-in; email only when a model is being retired, no digest). Optional providers filter. Returns an unsubscribe token for webhooks.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "providers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "webhook": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dbc6ba0475004bc613b944272d7a77c0b425026364f75b40efac676a21c59759"
        },
        {
          "name": "unsubscribe",
          "description": "Stop webhook alerts using the token from subscribe_alerts. Email subscribers unsubscribe from the link in any email.",
          "inputSchema": {
            "properties": {
              "token": {
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0326f23e1eb2aced269bbbb33afc0bce3fce0b6dc7c55715d5a0dbdd928790c3"
        }
      ],
      "digest": "sha256:6b511757b18537250a3a2ed0393fb3cffb3a7400e288f7721c3abad0356be29f"
    }
  }
}
