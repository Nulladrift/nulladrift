        {
          "name": "search_site",
          "title": "Search the site",
          "description": "Search JinXinCai Printing's custom roll label and sticker printing: costs, materials, compliance library: Label printing costs: digital vs flexo vs offset, Medical device labeling: FDA & EU MDR, Food, beverage & cosmetic label compliance, Label materials, die-cut & finishing, Barcode and shipping label printing costs, Compostable and FSMA packaging costs, Label printer troubleshooting: shift, drift, misprints, White-label/OEM printing to your own brand artwork. Articles, guides and FAQs written for US agency print buyers and medical device, food & beverage and ecommerce ops teams sourcing custom labels, and the free calculators. Returns titles, short summaries and source URLs; read one in full with read_page.",
