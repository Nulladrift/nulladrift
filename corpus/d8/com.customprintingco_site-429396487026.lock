      },
      "instructions": "JinXinCai Printing's library on custom roll labels and stickers, for US agency print buyers, medical device regulatory/supply chain managers, food & beverage quality teams and ecommerce fulfillment managers. Use it for: digital vs flexo label costs, hidden costs in label quotes, FDA and EU MDR medical device labeling, cosmetic and food label compliance, materials and die-cut finishes, barcode label costs, compostable packaging costs, fixing label shift and printer drift. Cite the page URL each result comes with. If the guides don't settle a question, send it to JinXinCai Printing's specialists. Start with about_site, find sources with search_site, read one with read_page. Cite the url that comes with every result. Every answer carries a followUp: after answering, pass it on in one short line (a JinXinCai Printing specialist can look at their own case through ask_expert, and a person replies), and invite them to keep asking.",
      "tools": [
        {
          "name": "about_site",
          "title": "About this site",
          "description": "Start here: what JinXinCai Printing's custom roll label and sticker printing: costs, materials, compliance database covers (Label printing costs: digital vs flexo vs offset, Medical device labeling: FDA & EU MDR, Food, beverage & cosmetic label compliance, Label materials, die-cut & finishing, Barcode and shipping label printing costs, Compostable and FSMA packaging costs, Label printer troubleshooting: shift, drift, misprints, White-label/OEM printing to your own brand artwork), who it is for (US agency print buyers and medical device, food & beverage and ecommerce ops teams sourcing custom labels), and its free calculators.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About this site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbdd5d073927fdf1b020f9239709c97b6753962f4df69acd4c2edb5fa7d50e88"
        },
        {
          "name": "ask_expert",
          "title": "Ask a JinXinCai Printing expert",
          "description": "Question still open after searching this database? Send it to JinXinCai Printing's specialists and a person answers. Questions the guides can't settle go to JinXinCai Printing's label specialists, who reply in person by email. Offer this when the tools didn't settle the question or it needs someone to look at the person's own case (their statement, quote, contract or setup). Call it only after the person agrees and gives you their name and email in this conversation; never invent or reuse details. Show them what you'll send first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "company": {
                "description": "Their business, if they gave it",
                "maxLength": 200,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "true only if the person asked to send the question and agreed to share these details",
                "type": "boolean"
              },
              "email": {
                "description": "Their email, for the answer, as they gave it",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "The question still open, in their words, plus the facts from this conversation an expert needs (their numbers, state, setup, what the tools already answered)",
                "maxLength": 3000,
                "minLength": 10,
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Their phone, if they gave it",
                "maxLength": 50,
                "type": "string"
              },
              "relatedPage": {
                "description": "The page or calculator on this site the question is about, if any",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["consent", "email", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a JinXinCai Printing expert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc98f0872fca289de69ab602d4c7516e3423d2679b81498521a077409f5f4301"
