        {
          "name": "search_listings",
          "title": "Search listings",
          "description": "Search the public Fenua Spot directory (French Polynesia). Filter with ile, categorie (slug from list_categories) and activite (plongee, snorkeling, sortie-baleines, survol, excursions, randonnee, surf, kayak, voile, quad, jet-ski, paddle, kitesurf, peche-sportive, sport, dauphins, raies, musee, danse). Each row starts with the canonical https://www.fenuaspot.com fiche URL, then a one-sentence description, offers with prices and booking links, and updatedAt. Phone, email, website, social links, street address, opening hours and coordinates stay on the fiche. Default 5 rows, maximum 10.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "activite": {
                "description": "Activity slug, for example surf or plongee.",
                "type": "string"
              },
              "categorie": {
                "description": "Category slug from list_categories, for example restauration or hebergement.",
                "type": "string"
              },
              "ile": {
                "description": "Island slug, for example moorea, tahiti, bora-bora. Call list_islands.",
                "type": "string"
              },
              "limit": {
                "description": "How many rows to return. Default 5. Maximum 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Result language. fr or en. Default fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "query": {
                "description": "Free text, same match as the website search.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "listings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "access": {
                      "type": "string"
                    },
                    "archipelago": {
                      "type": "string"
                    },
                    "bookingUrl": {
                      "type": ["string", "null"]
                    },
                    "category": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "island": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "offers": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "bookingUrl": {
