        {
          "name": "complete_mission",
          "title": "Complete mission",
          "description": "Complete a ready mission and claim its CWM reward. Omit mission_id to auto-complete the first READY one. Without mission_id and with nothing ready it fails with NO_READY_MISSION and lists progress and remaining time (ticks in parentheses) per active mission; a delivery mission may accept a partial delivery and ask for the rest on a later call. Check progress with list_missions or get_status. Changes state: pays out CWM and closes the mission.",
          "inputSchema": {
            "properties": {
              "bearer": {
                "description": "Your SPACE-CORE Bearer token. Only needed if your client cannot send the Authorization header.",
                "type": "string"
              },
              "mission_id": {
                "description": "player_mission_id (optional, auto-selects if omitted)",
                "type": "integer"
