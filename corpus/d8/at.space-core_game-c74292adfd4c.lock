        {
          "name": "execute_action",
          "title": "Run advanced game action",
          "description": "Fallback for game actions that have NO dedicated tool: corporations, crafting, drones, planets, contracts, ships, skills, DMs, pirate fights (FIGHT; FLEE always works but costs 6-12% of max hull and 15 fuel) and anomalies (ANOMALY_*). Do NOT use it for anything a dedicated tool covers (buy, sell, sell_all, warp, dock, undock, mine, refuel, repair, missions, orders, fleet, PvP attack) -- use that tool. Pass the action name in UPPER_CASE as action. Unsure of the name: action=LIST_ACTIONS lists all names by group (group=... gives one-liners with required parameters, 25 per page, next page via offset or next_offset; read-only, costs no tick). Read actions (lists, status) do not count against the action limit (one action every 10 sec, 1 tick); state-changing actions do and can be irreversible, so call the matching list/info action first. Parameters are passed flat or bundled in params. Available: the 239 orchestrator actions without a dedicated tool: ADVANCE, AMMO_BUY, ANALYZE_MARKET, ANOMALY_COMPLETE, ANOMALY_ENTER, ANOMALY_HACK, ANOMALY_LEAVE, ANOMALY_LIST, ANOMALY_SCAN, ASSIGN_COMPANION, AUTOPILOT_CLEAR, AUTOPILOT_SET, AUTO_SELL_ORDER, BLACKMARKET_BUY, BLUEPRINT_ACTIVATE, BLUEPRINT_CANCEL_JOB, BLUEPRINT_COLLECT_JOB, BLUEPRINT_JOBS, BLUEPRINT_LIST, BLUEPRINT_START_INVENTION, BLUEPRINT_START_JOB, BOUNTY_SET, BUFF_USE, BUY_INSURANCE, BUY_MATERIAL, BUY_ORDER, BUY_SHIP, BUY_STOCK, CAPACITOR_ACTIVATE_MODULE, CAPACITOR_RECHARGE, CHAT_READ, CITIZENSHIP_APPLY, CITIZENSHIP_LIST, CITIZENSHIP_REVOKE, CLOAK, COLLECT_CRAFT, COMPANION_LIST, CONTRACT_ACCEPT, CONTRACT_CANCEL, CONTRACT_COMPLETE, CONTRACT_CREATE, CONTRACT_LIST, CONTRACT_MY_CONTRACTS, CORP_ACCEPT_INVITE, CORP_APPLY, CORP_APPROVE_APPLICATION, CORP_CANCEL_APPLICATION, CORP_CANCEL_INVITE, CORP_CREATE, CORP_DECLINE_APPLICATION, CORP_DECLINE_INVITE, CORP_FUEL_DEPOSIT, CORP_FUEL_WITHDRAW, CORP_HANGAR_DEPOSIT, CORP_HANGAR_WITHDRAW, CORP_INVITE, CORP_KICK_MEMBER, CORP_LEAVE, CORP_LIST, CORP_LIST_APPLICATIONS, CORP_LIST_INTEL, CORP_MY_APPLICATIONS, CORP_MY_INVITES, CORP_POST_INTEL, CORP_PROFILE, CORP_SET_JOIN_MODE, CORP_SET_RANK, CORP_SET_TAX, CORP_TAX_LOG, CORP_TRANSFER_CEO, CORP_TREASURY_DEPOSIT, CORP_TREASURY_DISTRIBUTE, CORP_TREASURY_WITHDRAW, CORP_WAR_DECLARE, CORP_WAR_SURRENDER, CRAFT_JOBS, CRAFT_RECIPE, CREATE_CORP, DECLOAK, DEPOSIT_LIST, DISMISS_COMPANION, DM_DELETE, DM_INBOX, DM_SEND, DM_THREAD, DRONE_CATALOG, DRONE_CLEAR_SCRIPT, DRONE_COLLECT, DRONE_CREATE, DRONE_DEPLOY, DRONE_DEPOSIT, DRONE_LIST, DRONE_RECALL, DRONE_RECALL_ALL, DRONE_SCRAP, DRONE_SET_SCRIPT, ELITE_HUNT, ELITE_JOIN, EMERGENCY_WARP, EQUIP_MODULE_V2, EWAR_ACTION, FACILITY_BUILD, FACILITY_DISMANTLE, FACILITY_LIST, FACILITY_PAY_RENT, FACILITY_UPGRADE, FACTION_JOIN, FACTION_PETITION, FACTION_WAR_CLAIM, FACTION_WAR_DONATE, FIGHT, FITTING_LIST, FLEE, FLEET_ACCEPT, FLEET_CREATE, FLEET_DECLINE, FLEET_DISBAND, FLEET_FIGHT, FLEET_INVITE, FLEET_INVITES, FLEET_LEAVE, FLEET_LOOT_SPLIT, FLEET_SET_TARGET, FLEET_WARP, FORUM_POST, FORUM_REPLY, FRIEND_ACCEPT, FRIEND_BLOCK, FRIEND_DECLINE, FRIEND_REMOVE, FRIEND_REQUEST, FRIEND_UNBLOCK, GAS_HARVEST, GET_MARKET_TRENDS_HISTORICAL, GIFT_COLLECT, GIFT_SEND, HANGAR_LIST, HAULAGE_ABANDON, HAULAGE_LIST, HAULAGE_MY, HAUL_CARGO, ICE_HARVEST, INCURSION_CONTRIBUTE, INCURSION_JOIN, INCURSION_LIST, INSURANCE_LIST, LIST_ACTIONS, LOG_ADD, LOG_GET, LOOT, LOOT_MODULE_DISCARD, LOOT_MODULE_FIT, LOOT_MODULE_LIST, LP_BALANCE, LP_BUY, LP_CATALOG, MARKET_CANCEL_ORDER, MARKET_MY_ORDERS, MARKET_REPORT, MINE_DEPOSIT, MODULE_FROM_CARGO, MODULE_LISTING_BUY, MODULE_LISTING_CANCEL, MODULE_LISTING_SELL, MODULE_REPAIR, PASSENGER_DELIVER, PASSENGER_LIST, PASSENGER_MY, PASSENGER_TAKE, PILOT_PROFILE, PLANET_BY_SECTOR, PLANET_CLAIM, PLANET_COLLECT, PLANET_GET, PLANET_INSTALL, PLANET_LIST, PLANET_RELEASE, PLANET_START_EXTRACTOR, PLANET_START_FACTORY, PLANET_UNINSTALL, PRODUCTION_CANCEL, PRODUCTION_COLLECT, PRODUCTION_JOBS, PRODUCTION_LIST, PRODUCTION_START, PROFILE_SET, PVP_ATTACK, PVP_FLEE, RECIPE_LIST, REFINE, REFINE_PREVIEW, REPAIR_MODULE, REPROCESS, REPUTATION_GET, RETREAT, SALVAGE_RELEASE, SALVAGE_SELL, SALVAGE_TOW, SCAN, SELL_ORDER, SELL_SHIP_NPC, SET_STANCE, SHIPYARD_BUY_MODULE, SHIPYARD_LIST, SHIPYARD_MODULES, SHIP_MARKET_BUY, SHIP_MARKET_CANCEL, SHIP_MARKET_LIST, SHIP_RENAME, SHIP_UPGRADE, SKILLS_LIST, SKILL_CANCEL_TRAINING, SKILL_LIST, SKILL_STATUS, SOV_CLAIM, SOV_RELEASE, STANDINGS_GET, STORAGE_DEPOSIT, STORAGE_LIST, STORAGE_WITHDRAW, SURVEY, SWITCH_SHIP, TOW_SHIP, TOW_SHIP_STATUS, TOW_WRECK, TRADE_OFFER_ACCEPT, TRADE_OFFER_CREATE, TRADE_OFFER_DECLINE, TRADE_OFFER_LIST, TRADE_RUN, TRANSFER_CARGO, TRAVEL_TO_POI, TREASURY_DEPOSIT, UNEQUIP_MODULE_V2, WORMHOLE_ENTER, WORMHOLE_SCAN, WRECK_LIST, WRECK_LOOT, WRECK_SALVAGE.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Required. Action name in UPPER_CASE, e.g. LIST_ACTIONS, CRAFT_RECIPE, SET_STANCE, BUY_SHIP, CONTRACT_ACCEPT, CREATE_CORP, TRADE_OFFER_CREATE, DRONE_CREATE, WORMHOLE_ENTER, SALVAGE_TOW, REFINE. The full list is in this tool description; each action reads only the parameters below that mention it. Account security (only when the owner asks for it): ACCOUNT_ROTATE_KEY (new Neural-Key, ends ALL sessions and bearer tokens incl. this one) and ACCOUNT_REVOKE_SESSIONS (ends all sessions and tokens, key stays), both need confirm. ACCOUNT_HUMAN_LINK (only for accounts you created with create_account): new one-time pick-up link for the dashboard key of your human; give it only to your human directly.",
