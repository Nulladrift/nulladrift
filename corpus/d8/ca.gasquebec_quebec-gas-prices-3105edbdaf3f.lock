{
  "lockfileVersion": 2,
  "subjects": {
    "ca.gasquebec/quebec-gas-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.gasquebec.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gasquebec-mcp",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_cheapest_stations",
          "title": "Find cheapest stations nearby",
          "description": "Find gas stations near a coordinate in Quebec, ranked by price, distance, or value (price + 1¢/L-per-km detour penalty — the best default for \"where should I fill up\"). Prices in ¢/L. Sized for one fill-up decision: at most 10 stations within 30 km; for area-wide summaries use get_city_prices instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fuel_type": {
                "default": "ordinaire",
                "description": "ordinaire = regular, super = premium",
                "enum": ["ordinaire", "super", "diesel"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude (Quebec only: 44–63)",
                "maximum": 63,
                "minimum": 44,
                "type": "number"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude (Quebec only: -80 to -57)",
                "maximum": -57,
                "minimum": -80,
                "type": "number"
              },
              "radius_km": {
                "default": 10,
                "description": "Search radius in km (max 30)",
                "maximum": 30,
                "type": "number"
              },
              "sort": {
                "default": "value",
                "enum": ["value", "price", "distance"],
                "type": "string"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b2cd6c41795bf8f2e9c4fe767d308cb8c4d6a5873dba8e130e427d601ca030bd"
        },
        {
          "name": "get_city_prices",
          "title": "Get city fuel prices",
          "description": "Current gas price summary for one Quebec city: station count, min/average price per fuel type (¢/L), and the five cheapest stations for regular.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city_slug": {
                "description": "City slug from list_cities or search_locations, e.g. \"montreal\"",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5ffcc7442aed49fc75755caf9b02b742041c68bacf27bcdf9d0e1c3f76624610"
        },
        {
          "name": "get_fill_up_verdict",
          "title": "Should I fill up now?",
          "description": "Fair-price assessment and market trend for a Quebec city: whether the current price is fair, and whether to fill up now or wait (based on 30-day history). Fields are null during data gaps.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city_slug": {
                "description": "City slug from list_cities or search_locations",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ddee7c416bd0924aed6e90e324ba309aa1dd4e4b25171bed251fb2d980ee726d"
        },
        {
          "name": "list_cities",
          "title": "List Quebec cities",
          "description": "List every Quebec municipality tracked by Gas Quebec, with the citySlug used by the other tools. Prices throughout come from Régie Essence Québec (Régie de l'énergie du Québec).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:65d1d7d1c7dbacb500dd4ce43d15ba142e1959ca40a5c7a5adb71159d798155b"
        },
        {
          "name": "search_locations",
          "title": "Search cities and stations",
          "description": "Search Quebec cities, regions, and gas stations by name. Use this to resolve a user-mentioned place to a citySlug before calling the price tools.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Language for result labels",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "query": {
                "description": "Place or station name, e.g. \"Sherbrooke\" or \"Costco Anjou\"",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
