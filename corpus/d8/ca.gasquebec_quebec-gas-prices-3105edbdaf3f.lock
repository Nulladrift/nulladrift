      },
      "transport": {
        "type": "http",
        "url": "https://mcp.gasquebec.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gasquebec-mcp",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_cheapest_stations",
          "title": "Find stations near a point",
          "description": "List gas stations around a latitude/longitude in Quebec with current prices in ¢/L, ranked by value (the default: price plus a 1¢/L-per-km distance penalty, the best answer to \"where should I fill up\"), by price, or by distance. Each station comes with name, brand, address, city, distance and all three fuel prices, so this is also the way to look up a specific station or brand: search around its location with sort=distance and pick it out by name or brand. There is no geocoding tool: turn a postal code, address, landmark or neighbourhood into approximate coordinates yourself. If the user gives no location at all, ask for one instead of guessing. Returns at most 10 stations within 30 km; for a whole-city summary use get_city_prices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fuel_type": {
                "default": "ordinaire",
                "description": "Which price ranks the stations: ordinaire = regular, super = premium, diesel = diesel. All three prices are returned either way.",
                "enum": ["ordinaire", "super", "diesel"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees (Quebec: 44 to 63). Estimate it yourself from a postal code, address or landmark.",
                "maximum": 63,
                "minimum": 44,
                "type": "number"
              },
              "limit": {
                "default": 5,
                "description": "Number of stations to return, default 5, max 10",
                "maximum": 10,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude in decimal degrees (Quebec: -80 to -57). Estimate it yourself from a postal code, address or landmark.",
                "maximum": -57,
                "minimum": -80,
                "type": "number"
              },
              "radius_km": {
                "default": 10,
                "description": "Search radius in km, default 10, max 30 (larger values are rejected)",
                "maximum": 30,
                "type": "number"
              },
              "sort": {
                "default": "value",
                "description": "value = price + 1¢/L per km of distance (default); price = cheapest first; distance = closest first",
                "enum": ["value", "price", "distance"],
                "type": "string"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1312cec247e1f81f19a77a1f1bbfbf7d049a32593ba57e3f7ab8bf45d6c8b129"
        },
        {
          "name": "get_city_prices",
          "title": "Get a city's current fuel prices",
          "description": "Current gas prices for one Quebec city: station count, minimum and average ¢/L for regular, premium and diesel, and the five cheapest stations for regular (name, address, price). Use it for \"how much is gas in X\", \"cheapest gas in X\" and comparing stations or brands within a city. Takes a city slug, not a region and not a place outside Quebec; an unknown slug returns an error, after which resolve it with search_locations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city_slug": {
                "description": "City slug: lowercase, no accents, hyphens (e.g. \"montreal\", \"quebec\", \"trois-rivieres\", \"saint-jean-sur-richelieu\"). Use search_locations or list_cities when unsure.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:09e0b0a5923cc5cde0d269851419abdcc5096ab742273af5dcac95fc8aa8097b"
        },
        {
          "name": "get_fill_up_verdict",
          "title": "Should I fill up now or wait?",
          "description": "Whether gas is fairly priced in a Quebec city right now, and whether to fill up now or wait. Returns the city's average regular price against a fair price derived from the Régie de l'énergie's daily cost estimates, with a verdict (good, fair or high) and fill-now/wait advice, plus a low/fair/high verdict for premium and diesel from where today's price sits in its own 30-day range. Use it for \"is now a good time to fill up\", \"should I wait\" or \"is $X a good price\". Current state only: it returns no past prices, and no tool does. Fields are null during data gaps or for an unknown slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city_slug": {
                "description": "City slug: lowercase, no accents, hyphens (e.g. \"sherbrooke\", \"levis\"). Use search_locations or list_cities when unsure.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:80e765e11ce605966cf7ceb4e2bdd14ad33c1df014c42c7be8f1b0c2805e9369"
        },
        {
          "name": "list_cities",
          "title": "List tracked Quebec cities",
          "description": "List every Quebec municipality where Gas Quebec tracks gas stations, as name + slug pairs (the city_slug the price tools take). Names only, no prices. Use it when the user asks which places are covered, or when search_locations cannot match a place. Coverage is the province of Quebec only; prices come from Régie Essence Québec (Régie de l'énergie du Québec).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c21a0c91b52500b182d157b701995802604f347eb2b6740bf850641fcbab4f32"
        },
        {
          "name": "search_locations",
          "title": "Look up a Quebec city slug",
          "description": "Fuzzy-match a Quebec city or region name and return its slug, the city_slug that get_city_prices and get_fill_up_verdict take. It matches city and region names only: it does not find gas stations, brands, street addresses, postal codes or landmarks, and returns no coordinates and no prices. Places outside Quebec have no data, so do not search for them. Region results (e.g. Laurentides) are not accepted by the price tools; pick a city. Skip this call when the slug is obvious: lowercase, accents dropped, spaces as hyphens, Saint/Sainte spelled out (Trois-Rivières = trois-rivieres, Québec City = quebec).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "fr",
                "description": "Language for result labels",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "query": {
                "description": "City or region name, e.g. \"Sherbrooke\", \"St-Jérôme\" or \"Gaspésie\". Not a station, brand, address or postal code.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
