          },
          "digest": "sha256:a5000628af9a0b60c647cc92243beca8f4c589354830114d88b26a7c7e3673b9"
        }
      ],
      "digest": "sha256:561bc0f951207b256a1a95894b35c444e2a64a08ac4847c6a85adf1618e78953"
    }
  }
