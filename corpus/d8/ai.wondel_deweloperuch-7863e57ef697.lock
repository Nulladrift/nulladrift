                  },
                  "required": ["name", "transaction_count"],
                  "type": "object"
                },
                "type": "array"
              },
              "level": {
                "type": "string"
              },
              "min_transactions": {
                "type": "number"
              },
              "ranking_url": {
                "anyOf": [
                  {
                    "type": "string"
