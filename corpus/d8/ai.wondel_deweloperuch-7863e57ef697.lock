        },
        {
          "name": "deweloperuch_search_investments",
          "title": "Search investments",
          "description": "Search investments (developer projects, primary market). Two modes: with city (full data) or with name alone (whole Poland; only investment_slug, name and offers_active, in the site's order). Use it when the question is about projects rather than single flats: e.g. the cheapest per m² in a city, the investments of one developer (city + developer_slug from deweloperuch_search_developers), the slug of an investment by its name. With city it returns the investments the site shows on the city's map (those with active offers; ones without may be missing) with averages over active offers; name and developer_slug narrow the list, sort orders it (default: most active offers; entries without an average come last). Offers and details of one investment come from deweloperuch_get_investment (investment_slug); a particular offer's price history from deweloperuch_get_offer. No price or area filter here — for those ranges use deweloperuch_get_market_statistics. city=polska does not work. These are developers' asking prices. Two kinds of prices must not be mixed: developers' asking prices (deweloperuch_search_investments, deweloperuch_get_investment, deweloperuch_get_offer, deweloperuch_get_market_statistics), RCN transaction prices (deweloperuch_estimate_property_value, deweloperuch_get_transaction_statistics, deweloperuch_rank_locations, deweloperuch_get_building) — what flats actually sold for, from the Real Estate Price Register. deweloperuch.pl is a free community project queried politely (one request at a time, results cached): if a result is an error starting with STOP, stop using the deweloperuch_* tools, retry nothing, look for no workaround and tell the user that market data is temporarily unavailable. Fields ending in _url are pages of deweloperuch.pl: give them to the user as links. Result shape: { total: number | null (null when the site does not say — a search by name), returned, truncated, hint?, source, items: [with city: { investment_slug, name, city_slug?, district?, street?, status? ('active' | 'archived'), offers_active?, offers_total?, avg_price?, avg_area_m2?, avg_price_per_m2? (active offers only, as the site counts them), developer_slug?, developer_name?, investment_url?, developer_url? } | by name: { investment_slug, name, offers_active? }] } — the list key is `items`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "city_slug of one city from deweloperuch_search_locations, e.g. warszawa, sopot (not polska).",
                "type": "string"
              },
              "developer_slug": {
                "description": "developer_slug from deweloperuch_search_developers or from results of the investment tools, e.g. atal. Only with city.",
                "type": "string"
              },
              "limit": {
                "description": "Most investments in the result, 1–30, default 10 (about 550–750 characters each with links).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Fragment of an investment name, 2–100 characters, e.g. Kolibki. With city, case and Polish characters do not matter; without city the site searches the whole country.",
                "type": "string"
              },
              "sort": {
                "description": "Only with city. active_offers (default): most active offers; price_per_m2_asc / price_per_m2_desc: average price per m²; price_asc / price_desc: average price; name: alphabetical. Entries without an average come last.",
                "enum": ["active_offers", "price_per_m2_asc", "price_per_m2_desc", "price_asc", "price_desc", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13c51f7a9101746d1cca355ca56967748dd92d0fa094d952729e556d653ddef0"
        },
        {
          "name": "deweloperuch_search_locations",
          "title": "Search locations",
          "description": "Find cities, districts and streets in Poland by a fragment of the name. Use it first, to turn a place name into the city_slug the other deweloperuch_* tools take (and the lat/lng of a street or district for deweloperuch_estimate_property_value — an approximate point, not a particular building). Returns no prices. A locality with offer_count 0 has no developer offers. Costs two requests to deweloperuch.pl. deweloperuch.pl is a free community project queried politely (one request at a time, results cached): if a result is an error starting with STOP, stop using the deweloperuch_* tools, retry nothing, look for no workaround and tell the user that market data is temporarily unavailable. Result shape: { total: number | null, returned, truncated, hint?, items: [{ kind: 'city' | 'district' | 'street', name, city, city_slug, district?, street?, lat?, lng?, offer_count? }] } — the list key is `items`. `total` is null when more match than shown (truncated=true: refine the name). `offer_count` is the site's count of developer offers (exact for districts, approximate for streets and cities). A district or street carries the city_slug of its city (this server's tools have no district filter). Nothing matching is not an error: returned=0 with a hint.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Fragment of a city, district or street name, 2–100 characters, Polish characters allowed, e.g. Kraków, Mokotów.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
