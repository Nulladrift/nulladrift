        {
          "name": "apply_for_access",
          "title": "申请入驻",
          "description": "替用户提交七喵空间的入驻申请。必须先向用户本人要到手机号或邮箱（至少一项，不要猜、不要代填），并得到他对《隐私政策》（https://www.meowspace.cn/legal/privacy）的明确同意，再把 consent 传 true；用户没有明确同意就不要调用。提交后旗妙会联系用户；本工具不会当场开出账号。不计入试用次数。",
