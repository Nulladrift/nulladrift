      },
      "serverInfo": {
        "name": "botsket",
        "title": "Botsket",
        "version": "0.1.0",
        "description": "Product search over independent US stores, with an agent-checkout verdict.",
        "websiteUrl": "https://botsket.com/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Botsket searches products from independent US online stores (WooCommerce) and\nsays whether an AI agent can actually check out at each store. Prices are in USD.\n\nUse search_products to find offers. Before recommending or buying one, call get_offer: it\nre-checks price and stock with the store and returns price_checked_at. The search index is\nrefreshed weekly, so search prices can be a few days old.\n\nEach store has agent_checkout:\n- clean: our test agent got from the home page to the card form without obstacles.\n- friction: it met a popup, cookie banner, CAPTCHA or an unconfirmed step; may or may not work.\n- cannot finish: our test agent could not reach the card form. Prefer other stores.\n- not tested: unknown.\n\nProducts with variants (sizes, colours) give the lowest price as price and the highest as\nprice_max. url is the store's own product page; Botsket sells nothing.\n\nResults that match every query word come first. When there are too few, offers matching some\nof the words follow, with matched_all_words false; treat those as loose matches.",
      "tools": [
        {
          "name": "get_offer",
          "title": "Re-check an offer",
          "description": "Re-check one offer's price and stock with the store right now, and return it.",
          "inputSchema": {
            "properties": {
              "offer_id": {
                "description": "The id from search_products, e.g. 'candlewic.com/10001660'",
                "title": "Offer Id",
                "type": "string"
              }
            },
            "required": ["offer_id"],
            "title": "get_offerArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "StoreRef": {
                "properties": {
                  "agent_checkout": {
                    "title": "Agent Checkout",
                    "type": "string"
                  },
                  "domain": {
                    "title": "Domain",
                    "type": "string"
                  },
                  "name": {
                    "title": "Name",
                    "type": "string"
                  },
                  "page": {
                    "description": "Botsket page about this store",
                    "title": "Page",
                    "type": "string"
                  }
                },
                "required": ["agent_checkout", "domain", "name", "page"],
                "title": "StoreRef",
                "type": "object"
              }
            },
            "properties": {
              "brand": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Brand"
              },
              "categories": {
                "items": {
                  "type": "string"
                },
                "title": "Categories",
                "type": "array"
              },
              "currency": {
                "title": "Currency",
                "type": "string"
              },
              "id": {
                "description": "Pass to get_offer: store domain / product id",
                "title": "Id",
                "type": "string"
              },
              "image": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Image"
              },
              "in_stock": {
                "title": "In Stock",
                "type": "boolean"
              },
              "live": {
                "default": false,
                "description": "True when the price was re-checked for this call",
                "title": "Live",
                "type": "boolean"
              },
              "matched_all_words": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "In search results: false when the offer matches only some query words",
                "title": "Matched All Words"
              },
              "name": {
                "title": "Name",
                "type": "string"
              },
              "price": {
                "description": "Lowest price an agent can pay, USD",
                "title": "Price",
                "type": "number"
              },
              "price_checked_at": {
                "description": "When the price came from the store (UTC)",
                "title": "Price Checked At",
                "type": "string"
              },
              "price_max": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Highest variant price, when it differs",
                "title": "Price Max"
              },
              "sku": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Sku"
              },
              "store": {
                "$ref": "#/$defs/StoreRef"
              },
              "url": {
                "description": "The product page at the store",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["categories", "currency", "id", "in_stock", "name", "price", "price_checked_at", "store", "url"],
            "title": "Offer",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Re-check an offer"
          },
          "behavior": {
            "destructive": false,
