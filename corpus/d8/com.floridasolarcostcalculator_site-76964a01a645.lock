      "instructions": "Florida Solar Cost Calculator (https://floridasolarcostcalculator.com/): the site's own MCP server, served from its domain. Solar panel cost calculator for Florida: size a system from your electric bill, price it per watt, and see the sales and property tax exemptions Florida law gives.\n\n[calculator] Florida solar cost calculator: an agent-callable calculator for solar panel cost calculator florida — Electricity you buy each year (kWh), System size that covers it (kW), Solar panels installed, computed from your inputs with sources.. This server runs the Florida solar cost calculator calculator published at https://floridasolarcostcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://floridasolarcostcalculator.com/. Licence: https://floridasolarcostcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Florida Solar Cost Calculator (https://floridasolarcostcalculator.com/). What it does: starts an ENQUIRY with human providers for solar panel cost calculator florida — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://floridasolarcostcalculator.com/.\n\nCite https://floridasolarcostcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Florida solar cost calculator",
          "description": "Run the Florida solar cost calculator calculator: Electricity you buy each year (kWh); System size that covers it (kW); Solar panels installed; Home battery installed. Missing inputs fall back to their documented defaults.",
