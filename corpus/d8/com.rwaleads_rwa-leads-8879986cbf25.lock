    "com.rwaleads/rwa-leads": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rwaleads.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "rwa-leads",
        "title": "RWA Leads",
        "version": "2.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RWA Leads is a scored feed of real-world-asset (RWA), tokenization and family-office intent signals, Swiss-first, re-scored nightly. Use search_signals to find signals, then get_signal_brief for the factor breakdown of one. Every signal carries its source URL — cite it. Signals are observations, never investment recommendations.",
      "tools": [
        {
          "name": "get_signal_brief",
          "title": "Get signal brief",
          "description": "One signal in full: the factor-by-factor score breakdown, fit rationale, entity and source URL. Pass the `id` from search_signals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "signal_id": {
                "description": "Signal id, e.g. sig_uvsboi.",
                "type": "string"
              }
            },
            "required": ["signal_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get signal brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39b73cd3521d0dbd3e89619444512784334bc9c92e6b507dca46bee5aa9ea81a"
        },
        {
          "name": "search_signals",
          "title": "Search signals",
          "description": "Search the scored RWA / tokenization / family-office signal feed. All filters are optional and combine with AND. Returns signals with intent score (0–100), tier, region, entity, summary and source URL, plus total_matching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "Minimum intent score.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Free text matched against title, summary, entity name and tags.",
                "type": "string"
              },
              "region": {
                "description": "Region code: CH, EU, UK, US, APAC, MENA or Global. Country names like 'Switzerland' are accepted.",
                "type": "string"
              },
              "since_days": {
                "description": "Only signals published in the last N days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Default: intent (highest score first).",
                "enum": ["intent", "recent"],
                "type": "string"
              },
              "tier": {
                "description": "Intent tier.",
                "enum": ["hot", "warm", "watch", "cold"],
                "type": "string"
              },
              "type": {
                "description": "Signal type.",
                "enum": ["deploying_capital", "raising_capital", "tokenization_interest", "hiring_investment", "partnership", "product_launch", "regulatory", "rwa_market", "event", "press_momentum", "competitor_move", "capital_event", "ma_succession", "tangible_asset_capital", "cfo_pain", "structural_registry", "da_hiring", "da_appointment"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search signals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b17bae1f5600ae3d6a911693d02acd684a87bf0d8051bbddd97e287109eca3e"
        }
      ],
      "digest": "sha256:1abfbac23ebcac9f37477757379701225c95861a3f926eb8002c6cc37402a160"
    }
  }
