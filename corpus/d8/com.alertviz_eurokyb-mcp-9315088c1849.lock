{
  "lockfileVersion": 2,
  "subjects": {
    "com.alertviz/eurokyb-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://alertviz.com/api/eurokyb/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eurokyb-mcp",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only public registry, checksum, FX and website tools. Read status fields before making decisions. Registry availability varies.",
      "tools": [
        {
          "name": "audit_website_and_markdown",
          "description": "Read one public web page. Use audit (default) for HTTP status, security-header grade, TLS and email DNS signals. Use markdown for page text, title, links and truncation status. Both modes fetch the supplied URL and follow public redirects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "default": "audit",
                "description": "Choose audit for configuration signals or markdown to extract readable content.",
                "enum": ["audit", "markdown"],
                "type": "string"
              },
              "url": {
                "description": "Absolute public HTTP or HTTPS page URL, e.g. https://example.org/. Use a URL accessible without credentials.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a272fe50e03fb537e2b7c6abca69771cab3defc9b1d7d4f6dc747f438214b73b"
        },
        {
          "name": "check_czech_company_kyb",
          "description": "Look up one Czech business by IČO in ARES. Returns its name, registry flags, VAT reliability and published bank accounts from ADIS for registered VAT payers. UNKNOWN means evidence is incomplete. Use verify_eu_vat_vies for EU cross-border VAT registration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ico": {
                "description": "Czech business identifier as text, e.g. 00094943. Preserve leading zeros.",
                "type": "string"
              }
            },
            "required": ["ico"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9db27a9e0307ba0e1216c508ea5310a7e966c7cd6ca4c2d6db0bf92899c844dd"
        },
        {
          "name": "get_cnb_exchange_rates",
          "description": "Read Czech National Bank reference rates for the latest available fixing or a historical date. Omit currency to list rates. Supply currency and amount to return both its CZK equivalent and the foreign-currency equivalent of the same numeric amount in CZK. Check publishedDate for the actual fixing used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Non-negative amount to convert. Requires currency. For example, currency EUR and amount 100 converts both 100 EUR and 100 CZK.",
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "Three-letter currency in the CNB table, e.g. EUR. Omit to list all quoted currencies.",
                "type": "string"
              },
              "date": {
                "description": "Fixing date in DD.MM.YYYY format, e.g. 16.11.2026. Omit for the latest available table.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1877df5e9ea1dc2230114febf92e9b057035ecf436352c3cb96138724c4373cb"
        },
        {
          "name": "verify_eu_vat_vies",
          "description": "Check one country-prefixed VAT number against the European Commission’s live VIES service. Read status as VALID, INVALID or UNKNOWN. A registry outage is inconclusive. Use check_czech_company_kyb for Czech tax reliability or published accounts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vat": {
                "description": "EU VAT number with country prefix, e.g. CZ00094943",
                "type": "string"
              }
            },
            "required": ["vat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a5324b83fd785a1ce564bfc6826211a5a6c8bede44f7804fe21d9dc6826a39f1"
        },
        {
          "name": "verify_iban",
          "description": "Check an IBAN’s country length, available national format rules and Mod-97 checksum on the EuroKYB server. Returns valid and reason. This checks the identifier only. Account ownership and existence require confirmation from the bank.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "iban": {
                "description": "IBAN with its country prefix. Spaces and lowercase are accepted, e.g. GB82 WEST 1234 5698 7654 32.",
                "type": "string"
              }
            },
            "required": ["iban"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5754879cdef0bd7a5c01229f1930f368d64e87bd918318bb6a713c0a128b3c6"
        }
      ],
      "digest": "sha256:33f2ca71bf851e96678884c644d0ac8cfac870a5ebf919161aef840c2ec5f09f"
    }
  }
}
