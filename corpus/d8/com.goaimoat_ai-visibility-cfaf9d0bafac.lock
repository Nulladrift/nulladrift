        {
          "name": "get_category_leaders",
          "title": "Get Category Leaders",
          "description": "Return the AI-recommendation leaderboard for a product category.\n\nCombines listed-market leaders (public data) with tracked B2B brands (GoAI Moat geo-footprint audit).\nUseful when a user asks \"who are the top Chinese suppliers of X\" or \"which brands does AI recommend in X\".\n\nFree tier. Available categories: connector, phone_case.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "default": "connector",
                "description": "Product category slug (e.g. \"connector\", \"phone_case\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
