      },
      "instructions": "Diagnose a brand's visibility in AI answers (ChatGPT, Perplexity, Google AI Overviews, Amazon Rufus). Built for AI agents and developers: call audit_ai_visibility with an api_key to run audits programmatically. Free tier = 1 full audit per email. A developer subscription (https://goaimoat.gumroad.com/l/njpksu) provides an api_key that unlocks unlimited audits. get_checklist returns the 30-point checklist; get_fix_priority turns a score into an action plan; get_usage reports the caller's API usage volume.",
      "tools": [
        {
          "name": "audit_ai_visibility",
          "title": "Audit Ai Visibility",
          "description": "Deep-audit a brand's visibility in AI answers (ChatGPT, Perplexity, AI Overviews).\n\nFREE TIER: 1 full deep audit per email — pass your email to unlock it.\nDEVELOPER/UNLIMITED: pass an api_key (or license_key) from a developer subscription\nat https://goaimoat.gumroad.com/l/njpksu to run audits programmatically with no email.\nWithout email/api_key you get the audit framework and tier mapping only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "default": "",
                "description": "Developer API key — equivalent to license_key, for agent/API callers.",
                "type": "string"
              },
              "brand_name": {
                "description": "The brand/company to audit.",
                "type": "string"
              },
              "category": {
                "default": "",
                "description": "Product/service category (e.g. \"phone case\", \"DTC fashion\").",
                "type": "string"
              },
              "email": {
                "default": "",
                "description": "Your email — unlocks 1 free full audit.",
                "type": "string"
              },
              "license_key": {
                "default": "",
                "description": "Gumroad license key — unlocks unlimited full audits.",
                "type": "string"
              },
              "score": {
                "default": -1,
                "description": "Optional known 0-30 checklist score. If provided, a tier + fix plan is included for free.",
                "type": "integer"
              }
            },
            "required": ["brand_name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:bbb5be0ee460f90c6d95b1b8c4145b5ab3c1d3526c28a3ce50bfa61f8ac12c04"
        },
        {
          "name": "check_license",
          "title": "Check License",
          "description": "Activate a Gumroad license and receive a GoAI Moat api_key (validated server-side).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "default": "",
                "description": "Email to bind the api_key to.",
                "type": "string"
              },
              "license_key": {
                "description": "The Gumroad license key from your purchase.",
                "type": "string"
              }
            },
            "required": ["license_key"],
