{
  "lockfileVersion": 2,
  "subjects": {
    "com.eventsynoptic.go/event-synoptic": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://go.eventsynoptic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "event-synoptic",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Event Synoptic: live Los Angeles events, ticket price comparison, bars & nightlife, museums with free-admission days and exhibition schedules, and flea/vintage/night markets with gate prices and opening hours. All links are tracking redirects to official ticket/venue pages. Data by Event Synoptic (eventsynoptic.com) · links are affiliate/tracking redirects",
      "tools": [
        {
          "name": "find_bars",
          "description": "Find Los Angeles bars and nightclubs: by vibe (cocktail, rooftop, dive, techno...), near a location, or with happy hour running right now. Includes ratings, hours, happy hour info and links.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["bar", "club"],
                "type": "string"
              },
              "happy_hour_now": {
                "description": "Only places with happy hour active or starting within an hour",
                "type": "boolean"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "vibe": {
                "description": "One vibe tag, e.g. \"rooftop\". Call get_taxonomy for the list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4e8c52246c5d6f3e5fcd2310d2d729894ad5acc861a2ffc004fe4f51f03daae"
        },
        {
          "name": "find_museums",
          "description": "Find Los Angeles museums and galleries: art, history, science, film, kids, cars, gardens, photography. Answers the two questions ticketing APIs cannot: WHEN IS IT FREE (many LA museums are permanently free, others only on a recurring rule such as \"second Tuesday of the month\" or \"Thursdays 5-8 PM\" — `free.today`, `free.label` and `free.next` resolve that for the current LA date, `free.rules` gives the raw rule) and WHAT IS ON VIEW (current and upcoming exhibitions with their run dates, so you can say what closes soon). Also returns opening hours, open-now, typical visit length, quietest time, admission prices and links.",
          "inputSchema": {
            "properties": {
              "free_today": {
                "description": "Only museums that are free today (always-free ones included, ranked last)",
                "type": "boolean"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "description": "1-25, default 10",
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "open_now": {
                "type": "boolean"
              },
              "type": {
                "description": "Museum type. Call get_taxonomy for labels.",
                "enum": ["art", "history", "science", "film", "kids", "cars", "garden", "photo", "odd"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:090c8e9fdbdde9f4a23c40b323e09f93e55e375e3443af5100381238dafd8a39"
        },
        {
          "name": "get_best_ticket_prices",
          "description": "Compare ticket prices for an event across marketplaces (Ticketmaster, Gametime, StubHub, Vivid Seats...). Gametime prices are fetched LIVE. Returns buy links sorted cheapest first.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d78b1457167a33f16cf3cc9e2847c0b0d18b7df5e387cedb3b2402f31e3f3b3"
        },
        {
          "name": "get_event",
          "description": "Get full details of one event by its id (from search_events results), including `provenance` (source, last_seen_at, still_listed, price_as_of, confidence) and venue facilities.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7684b283410a2c467d69796b3a21a9a38107f07999fb18ed5bccc07f001f2ff6"
        },
        {
          "name": "get_event_history",
          "description": "Change-only history of what the source said about an event over time: price moves, sold-out, date shifts, delisting/cancellation, with when we first saw the listing. Use it to answer \"is the price going up or down\", \"was this rescheduled\" or \"has this been removed\". History starts 2026-08-22; points are recorded only when something changed.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c137c3dd8f155988c3d025b6ad95b09f455408a1ab880cf11a9ec4aadaf1569"
        },
        {
          "name": "get_taxonomy",
          "description": "List all event category tags, bar/club vibe tags, kid-place categories and museum types used by the other tools.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c8e7d6e1433331c64c79f2e8f218750b3fc146d85e97a6e0d3cc3ae38a6c2a12"
        },
        {
          "name": "search_events",
          "description": "Search upcoming Los Angeles events (concerts, parties, theater, family, sport and more). Returns compact JSON with venue, date, price-from, artists and a tickets link. Each event carries `rating` (1-13 composite: data quality plus real demand) and `popularity` (headliner fan count, whether they are charting now, and how many ticket sites list the event) — use them to surface the biggest shows first. Filter by free-text query, category tags, date range, location radius, budget or min_rating. `badge` narrows to audiences no other catalogue indexes: sensory-friendly showings, museum free-admission days, events free or discounted with EBT, dog-friendly events, and 21+ vs all-ages. Tag `#markets` returns flea, vintage and night market days — a category absent from every ticketing feed, because entry is paid at the gate. Those events carry a `market` block (admission tiers with entry times, vendor count, cash-only gate, opening hours, open_now). Every event carries `provenance`: which source it came from, when that source last still listed it (last_seen_at), whether it has since been removed or cancelled there, when the price was captured (price_as_of) and an overall `confidence` (high/medium/low). Prefer high-confidence events and tell the user to verify low-confidence ones.",
          "inputSchema": {
            "properties": {
              "badge": {
                "description": "Audience filter: sensory = sensory-friendly/autism-friendly showings; freeday = a museum/venue free-admission day (Academy Museum Free Day, Huntington's first Thursday) — not a nightclub's free-before-11pm promo; ebt = free or discounted with EBT/CalFresh (Museums for All); dog = dog-friendly; age21 = 21+ only; allages = explicitly all ages.",
                "enum": ["sensory", "ebt", "freeday", "dog", "age21", "allages"],
                "type": "string"
              },
              "date_from": {
                "description": "ISO date/datetime, default now",
                "type": "string"
              },
              "date_to": {
                "description": "ISO date/datetime, default +7 days",
                "type": "string"
              },
              "free_only": {
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude for near-me filtering",
                "type": "number"
              },
              "limit": {
                "description": "1-25, default 10",
                "type": "number"
              },
              "lon": {
                "description": "Longitude for near-me filtering",
                "type": "number"
              },
              "max_price_usd": {
                "type": "number"
              },
              "min_rating": {
                "description": "Only events rated at least this (1-13). 10+ = major act or stadium show, 11+ = megastar.",
                "type": "number"
              },
              "query": {
                "description": "Free text: artist, show or venue name",
                "type": "string"
              },
              "radius_km": {
                "description": "Radius for lat/lon filter, default 15",
                "type": "number"
              },
              "tags": {
                "description": "Category tags, e.g. [\"#concerts\",\"#jazz\"]. Call get_taxonomy for the full list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb84bfc1dfe945a3d97be811cccd73b1034057585cd1ebf8e344d46ae6036722"
        },
        {
          "name": "whats_on_tonight",
          "description": "One call for \"what to do tonight in LA\": top events until ~6am plus bars with happy hour on right now.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86447d0d6dc6e00e22c5b588a60b045ba2c04236b5669bcc16febdc3229d7cfb"
        }
      ],
      "digest": "sha256:c9789bba1a8eb8d7d83f31ff4846ead70ec6c8d5d0111cc384f1e19cf4c92129"
    }
  }
}
