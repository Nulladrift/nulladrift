{
  "lockfileVersion": 2,
  "subjects": {
    "co.subtraq/subtraq": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://subtraq.co/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "subtraq",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "create_link",
          "description": "Crée un lien court. Sans `parentId`, c'est un lien parent et `destination` est obligatoire. Avec `parentId`, c'est un placement : il hérite de la destination du parent et porte ses propres UTM. Renvoie `shortUrl`, prêt à publier.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "URL d'arrivée. Obligatoire pour un parent, interdite pour un placement.",
                "type": "string"
              },
              "domain": {
                "description": "Adresse qui porte le lien (« liens.votresite.fr »). Omise = le même choix que l'écran de création : le domaine de marque réservé à l'espace, sinon l'unique domaine de marque du compte, sinon l'adresse offerte de l'espace (« client.sbtq.link ») ; pour un placement, le domaine de son parent. Pour le domaine partagé, le nommer : « sbtq.link » (la valeur `domain` d'un lien partagé). Un domaine de marque doit être vérifié dans le compte, et libre pour cet espace.",
                "type": "string"
              },
              "label": {
                "description": "Nom du placement, par exemple « Pub Meta — mars ».",
                "type": "string"
              },
              "parentId": {
                "description": "Identifiant du lien parent, pour créer un placement.",
                "type": "string"
              },
              "slug": {
                "description": "Raccourci souhaité. Tiré au sort s'il est omis.",
                "type": "string"
              },
              "space": {
                "description": "Raccourci de l'espace client.",
                "type": "string"
              },
              "utmCampaign": {
                "description": "utm_campaign du placement.",
                "type": "string"
              },
              "utmContent": {
                "description": "utm_content du placement.",
                "type": "string"
              },
              "utmMedium": {
                "description": "utm_medium du placement.",
                "type": "string"
              },
              "utmSource": {
                "description": "utm_source du placement.",
                "type": "string"
              },
              "utmTerm": {
                "description": "utm_term du placement.",
                "type": "string"
              }
            },
            "required": ["space"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9e33362d14782b9237c798819b5e98398fa5bee9c54b7f630295687de5c0e58"
        },
        {
          "name": "create_space",
          "description": "Crée un espace client. Refusé avec le code `space_limit_reached` si la formule est pleine.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Nom affiché, par exemple « Maison Lartigue ».",
                "type": "string"
              },
              "slug": {
                "description": "Raccourci dans les URL. Déduit du nom s'il est omis.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:245c16b285c2e134682c7d66d99132fdec788c93b4c3cbbfd28147c2ea1f48c0"
        },
        {
          "name": "get_analytics",
          "description": "Les chiffres d'un espace : clics, prospects, ventes, revenu ATTRIBUÉ et revenu NON attribué, plus le détail placement par placement. Montants en CENTIMES. Subtraq ne convertit pas les devises : si `mixedCurrencies` est vrai, les totaux ne concernent que `currency`. `model` choisit la lecture de l'attribution ; la réponse rappelle toujours lequel a servi.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Modèle d'attribution : `first` (premier clic, défaut et référence du produit), `last` (dernier clic avant la conversion) ou `linear` (partage entre tous les placements cliqués, revenu réparti au centime près). Dans les trois cas, attribué + non attribué = revenu total.",
                "type": "string"
              },
              "period": {
                "description": "7d, 30d (défaut), 90d ou all.",
                "type": "string"
              },
              "space": {
                "description": "Raccourci de l'espace client.",
                "type": "string"
              }
            },
            "required": ["space"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1b778ce77e5c494204018ad66096016a041c57c55374ee07bab85fcfd3a4f6c"
        },
        {
          "name": "get_link",
          "description": "Détaille un lien : sa destination FINALE (UTM comprises, telle que la reçoit le site d'arrivée) et ses clics sur 30 jours.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Identifiant du lien.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf241ea6c6dd5e5bb5cfb933387eebc02177f87078ea92b808443dab40aeef7e"
        },
        {
          "name": "list_links",
          "description": "Liste les liens. Un lien PARENT porte la destination ; un PLACEMENT (sublink) porte les UTM d'une publication précise et hérite du reste.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Curseur de la page suivante.",
                "type": "string"
              },
              "limit": {
                "description": "1 à 100.",
                "type": "integer"
              },
              "space": {
                "description": "Raccourci de l'espace. Omis = tous les espaces du compte.",
                "type": "string"
              },
              "status": {
                "description": "active (défaut), archived, ou all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:296115382589db763a173055a2a591f997cdd5541852ccfdad5e6e7147c9e981"
        },
        {
          "name": "list_spaces",
          "description": "Liste les espaces du compte. Un espace = un client, une marque ou un projet ; tout le reste (liens, clics, ventes) vit dedans.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "Curseur renvoyé par l'appel précédent (`nextCursor`).",
                "type": "string"
              },
              "limit": {
                "description": "1 à 100, 50 par défaut.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb5d4ce4769a292677fe6d9eecf20b923050149ac9ab50f182d101d8a3648c16"
        },
        {
          "name": "track_sale",
          "description": "Enregistre une VENTE et la rattache au placement d'origine de la personne. Montant en CENTIMES. `invoiceId` rend l'appel idempotent : le rejouer ne facture jamais deux fois. Une vente ne peut PAS être envoyée depuis un navigateur.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Montant en CENTIMES. 43 € s'écrit 4300.",
                "type": "integer"
              },
              "clickId": {
                "description": "Identifiant de clic, si vous l'avez conservé.",
                "type": "string"
              },
              "currency": {
                "description": "Code à trois lettres. USD par défaut.",
                "type": "string"
              },
              "email": {
                "description": "Email de la personne — le plus simple pour la retrouver.",
                "type": "string"
              },
              "externalId": {
                "description": "Son identifiant dans votre système, si vous en avez un.",
                "type": "string"
              },
              "invoiceId": {
                "description": "Votre numéro de facture — c'est lui qui garantit l'idempotence.",
                "type": "string"
              },
              "space": {
                "description": "Raccourci de l'espace client.",
                "type": "string"
              }
            },
            "required": ["amount", "invoiceId", "space"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8bbfd930e306baa305df69fbb31cde6fa7e3bc71f68e9ae97090a24b3561d46"
        },
        {
          "name": "update_link",
          "description": "Modifie la destination, le libellé ou l'ADRESSE d'un lien (`domain` et/ou `slug`), ou l'archive. Changer d'adresse ne casse rien : l'ancienne adresse continue de rediriger vers le même endroit et ses clics comptent sur ce lien (`previousShortUrls`) ; les placements qui partageaient son domaine le suivent. Un lien n'est JAMAIS supprimé : archivé, il cesse de rediriger (anciennes adresses comprises) mais son historique reste.",
          "inputSchema": {
            "properties": {
              "archived": {
                "description": "true pour archiver, false pour réactiver.",
                "type": "boolean"
              },
              "destination": {
                "description": "Nouvelle URL d'arrivée (liens parents seulement).",
                "type": "string"
              },
              "domain": {
                "description": "Nouveau domaine de l'adresse (« liens.votresite.fr »), vérifié dans le compte et libre pour l'espace du lien ; « sbtq.link » pour revenir au domaine partagé. L'ancienne adresse continue de marcher.",
                "type": "string"
              },
              "id": {
                "description": "Identifiant du lien.",
                "type": "string"
              },
              "label": {
                "description": "Nouveau libellé.",
                "type": "string"
              },
              "slug": {
                "description": "Nouveau raccourci. Pris sur le domaine visé : erreur `slug_taken`, avec un raccourci libre proposé dans `details.suggestion`.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:187d0dda499db00708d17458f7c14187755e65d9a0604473603c0ee64fbd5420"
        }
      ],
      "digest": "sha256:3f9fbb84f5edb14f47679a2b43c54755076606201937375534c57cdbff0f1edb"
    }
  }
}
