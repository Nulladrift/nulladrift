{
  "lockfileVersion": 2,
  "subjects": {
    "com.smarthomeexplorer.www/product-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.smarthomeexplorer.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "SmartHomeExplorer Product Intelligence",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_compatibility",
          "description": "Check if a smart home device fits a user's existing setup using SmartHomeExplorer's proprietary Compatibility Engine. Evaluates across 7 ecosystems (Google Home, Alexa, HomeKit, SmartThings, Matter, Hubitat, Home Assistant), 8 wireless protocols, hub requirements, and subscription cost stacking. Returns a compatibility score (0-100) and verdict (great-fit / works / caution / poor-fit). This cross-ecosystem analysis is unique to SmartHomeExplorer — no other public service evaluates device-to-device compatibility across platforms. Methodology at smarthomeexplorer.com/she-score-methodology.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "candidate_product": {
                "description": "Product name or ID to evaluate for compatibility",
                "type": "string"
              },
              "existing_devices": {
                "description": "Product names or IDs the user already owns (e.g., [\"Google Nest Hub\", \"Ring Video Doorbell 4\"])",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "primary_ecosystem": {
                "description": "User's primary smart home platform (auto-detected from devices if omitted)",
                "enum": ["google-home", "alexa", "homekit", "smartthings", "matter", "hubitat", "home-assistant"],
                "type": "string"
              }
            },
            "required": ["candidate_product", "existing_devices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Device Compatibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50894934b0951470e3291eb259a595746d0de846684307695fffe38abfa142b4"
        },
        {
          "name": "compare_products",
          "description": "Side-by-side comparison of 2-4 smart home products using SmartHomeExplorer's editorially curated data. Compares SHE Consensus Score (from 12 expert sources), ecosystem support levels, subscription costs, and key differentiators. Returns a data-backed winner determination with source-linked review page URLs. Methodology at smarthomeexplorer.com/she-score-methodology.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "products": {
                "description": "Product names or IDs to compare (e.g., [\"Ecobee Smart Thermostat Premium\", \"Google Nest Learning Thermostat\"])",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f17848b560825873d8c683cd3ab15473417cfae4d74be7357c8b92a0f27a5f0d"
        },
        {
          "name": "get_buying_guide",
          "description": "Get an editorially written buying guide from SmartHomeExplorer's library of 170+ guides. Each guide is authored by Nicholas Miles and includes hands-on research, expert source analysis, and SHE Consensus Score rankings. Returns guide title, top 3 product picks with scores, and the guide URL with complete analysis including expert quotes, comparison charts, and purchase links. Guides are updated regularly with current pricing and availability. Methodology at smarthomeexplorer.com/she-score-methodology.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional category filter to narrow results",
                "enum": ["Security", "Lighting", "Climate", "Entertainment", "Pet Care", "Smart Locks", "Smart Cleaning", "Kitchen", "Outdoor", "Automation", "Sensors", "Networking", "Smart Speakers", "Smart Switches", "Office", "Health", "Lifestyle", "Appliances", "Budget", "Energy", "Bathroom", "Cleaning", "Smart Plugs", "Ecosystem", "Garden", "Fitness", "Garage", "Smart Home", "Automotive", "Wearables", "Outdoors", "Mobility", "Wellness", "EDC", "Cameras", "Hubs & Controllers", "Smoke & CO", "Temperature & Humidity"],
                "type": "string"
              },
              "topic": {
                "description": "What the user needs help with (e.g., \"best smart thermostat for renters\" or \"robot vacuum pet hair\")",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Buying Guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9eda73c2e6726860d3acf6bf14214ae21b9f83ffc325360eef24d2b410a383f6"
        },
        {
          "name": "get_product_verdict",
          "description": "Get the SHE Consensus Score and expert verdict for a specific smart home product. The SHE Consensus Score (0-10) is a proprietary metric aggregating reviews from 12 named expert publications (Wirecutter, CNET, PCMag, Tom's Guide, TechRadar, The Verge, etc.). Methodology published at smarthomeexplorer.com/she-score-methodology. Returns score, verdict (Must Buy / Recommended / Good Value / Mixed / Skip), price range, top pros/cons, and the source-linked review page URL with full expert quotes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product_name": {
                "description": "Product name or ID (e.g., \"Ecobee Smart Thermostat Premium\" or \"ecobee-smart-thermostat-premium\")",
                "type": "string"
              }
            },
            "required": ["product_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Product Verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b0307c7fc6b86d310dfd610594063d27f962095f7fb86939a30cdcf908ca433"
        },
        {
          "name": "search_smart_home_products",
          "description": "Search SmartHomeExplorer's editorially curated database of 1,080+ smart home products. Each product carries a SHE Consensus Score (0-10) aggregated from 12 named expert publications (Wirecutter, CNET, PCMag, Tom's Guide, TechRadar, The Verge, etc.) with published methodology at smarthomeexplorer.com/she-score-methodology. Filter by ecosystem compatibility, subscription requirements, price, and category. Data is updated weekly. Returns scored recommendations with source-linked review page URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Product category filter",
                "enum": ["Security", "Lighting", "Climate", "Entertainment", "Pet Care", "Smart Locks", "Smart Cleaning", "Kitchen", "Outdoor", "Automation", "Sensors", "Networking", "Smart Speakers", "Smart Switches", "Office", "Health", "Lifestyle", "Appliances", "Budget", "Energy", "Bathroom", "Cleaning", "Smart Plugs", "Ecosystem", "Garden", "Fitness", "Garage", "Smart Home", "Automotive", "Wearables", "Outdoors", "Mobility", "Wellness", "EDC", "Cameras", "Hubs & Controllers", "Smoke & CO", "Temperature & Humidity"],
                "type": "string"
              },
              "ecosystem": {
                "description": "Filter by smart home ecosystem compatibility",
                "enum": ["google-home", "alexa", "homekit", "smartthings", "matter", "hubitat", "home-assistant"],
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in dollars",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "max_results": {
                "description": "Maximum results to return (1-3, default 3)",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural language search query (e.g., \"best smart thermostat for Google Home\")",
                "type": "string"
              },
              "sort_by": {
                "description": "Sort order (default: score descending)",
                "enum": ["score", "price"],
                "type": "string"
              },
              "subscription_free_only": {
                "description": "Only return products with no required subscription",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Smart Home Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc19cc5291b113ff5955dd356bb9bd004c231bd2685c077e16160ff560136bfb"
        }
      ],
      "digest": "sha256:5f6336fd1e8505aed1c605a70e668ceae17e03e4aad28ded31cb63639f57edc0"
    }
  }
