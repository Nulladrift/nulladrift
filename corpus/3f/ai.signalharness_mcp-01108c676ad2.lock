{
  "lockfileVersion": 2,
  "subjects": {
    "ai.signalharness/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://signalharness.ai/api/agent/services/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "signalharness-x402-service-factory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use list_services and get_service freely. invoke_service performs at most one factory invocation and never retries payment automatically.",
      "tools": [
        {
          "name": "get_service",
          "title": "Get SignalHarness service",
          "description": "Inspect one enabled public SignalHarness service before invoking it. Use an exact service_id returned by list_services. This free, read-only call returns the canonical description, input and output schemas, price, endpoint, and supported payment metadata when available; an unknown or disabled ID returns a normalized not-found error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service_id": {
                "description": "Exact canonical service ID from list_services; matching is case-sensitive and aliases are not accepted.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$",
                "type": "string"
              }
            },
            "required": ["service_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Canonical public service metadata, or a normalized machine-readable error.",
            "properties": {
              "error": {
                "description": "Stable machine error code when the service cannot be returned.",
                "type": "string"
              },
              "input_schema": {
                "description": "JSON Schema the invoke_service input must satisfy.",
                "type": "object"
              },
              "output_schema": {
                "description": "JSON Schema describing the service-specific success result.",
                "type": "object"
              },
              "service_id": {
                "description": "Exact canonical service ID.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get SignalHarness service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f47f659b13e47f53e6857e45717b160a6c042fedccfad30481879df3b06c739"
        },
        {
          "name": "invoke_service",
          "title": "Invoke SignalHarness service",
          "description": "Run exactly one enabled public SignalHarness service with caller-supplied input. Call get_service first and validate input against its input_schema. An unpaid call returns the canonical x402 V2 PAYMENT-REQUIRED challenge plus the equivalent x402 V1 JSON challenge; a client can then retry once with payment in params._meta[\"x402/payment\"]. The server never retries automatically. A paid call may settle the advertised charge and perform external work, then returns service-specific structured JSON or a normalized error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Optional stable key for retrying the same logical job safely. Reuse it only for recovery of that same job and payment.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$",
                "type": "string"
              },
              "input": {
                "description": "Caller-supplied job data. It must satisfy the selected service input_schema returned by get_service.",
                "type": "object"
              },
              "request_id": {
                "description": "Optional caller-generated request identifier for tracing this attempt. Never place secrets or payment credentials in it.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$",
                "type": "string"
              },
              "service_id": {
                "description": "Exact canonical ID of an enabled public service, obtained from list_services.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,159}$",
                "type": "string"
              }
            },
            "required": ["input", "service_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Service-specific structured JSON, an unpaid x402 challenge, or a normalized machine-readable error. Inspect get_service.output_schema for the selected service success shape.",
            "properties": {
              "error": {
                "description": "Stable machine error code for unpaid, invalid, failed, or unavailable requests.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Invoke SignalHarness service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e65548157d123f8e452221e0cbd89b1c2f3b95b6f38bfa4894c4487b8da0369"
        },
        {
          "name": "list_services",
          "title": "List SignalHarness services",
          "description": "Discover the currently enabled public SignalHarness service catalog before choosing a service. This free, read-only call takes no arguments and returns a compact service array with canonical IDs, descriptions, prices, and supported payment metadata. Results follow the canonical catalog order; compare services by their exact service_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "A compact public catalog response, or a normalized machine-readable error.",
            "properties": {
              "error": {
                "description": "Stable machine error code when catalog discovery fails.",
                "type": "string"
              },
              "schemaVersion": {
                "description": "Catalog schema version when supplied by the runtime."
              },
              "services": {
                "description": "Enabled public services in canonical catalog order. Each item includes its exact service ID and available discovery and payment fields.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List SignalHarness services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6f4bdfc7029e54fa7e8004c145add96ae07039d75ec5ba4a378c60bb4e35c14"
        }
      ],
      "digest": "sha256:24bd6d7fb79a88e6d81fee7d10b15c7e624c13789cd3d0d885fc79225b68a197"
    }
  }
}
