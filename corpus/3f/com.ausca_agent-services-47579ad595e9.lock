              }
            },
            "required": ["inbox", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Delete an agent-inbox lease"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7501ee1bf08d860fe57437472d2cb4a4209ecb1776749b79433d8820e7321f2"
        },
        {
          "name": "ausca_agent_inbox_messages",
          "title": "Wait for or list inbound messages",
          "description": "For an active inbox, return at most 50 normalized message summaries after an opaque inbox-bound cursor, optionally waiting up to 30 seconds for a newer message. A bounded wait may return an empty page and continuation cursor. Supply the lease bearer on the HTTP or MCP transport; never place it in tool arguments.",
          "inputSchema": {
            "$defs": {
              "AgentInboxID": {
                "pattern": "^inb_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "InboxCursor": {
                "description": "Opaque continuation bound to one inbox. Callers must not construct or modify it.",
                "pattern": "^cur_[A-Za-z0-9_-]{22,171}$",
                "type": "string"
              },
              "InboxWaitSeconds": {
                "default": 0,
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              }
            },
            "$id": "urn:ausca:mcp:ListAgentInboxMessages:input:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "after": {
                "$ref": "#/$defs/InboxCursor"
              },
              "inbox_id": {
                "$ref": "#/$defs/AgentInboxID"
              },
              "wait_seconds": {
                "$ref": "#/$defs/InboxWaitSeconds"
              }
            },
            "required": ["inbox_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentInboxMessageID": {
                "pattern": "^msg_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "AgentInboxMessageSummary": {
                "additionalProperties": false,
                "properties": {
                  "attachment_count": {
                    "maximum": 20,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "cursor": {
                    "$ref": "#/$defs/InboxCursor"
                  },
                  "from": {
                    "$ref": "#/$defs/MailboxAddress"
                  },
                  "message_id": {
                    "$ref": "#/$defs/AgentInboxMessageID"
                  },
                  "received_at": {
                    "description": "Server-observed ingress time. Never derived from the sender-controlled Date header.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "subject": {
                    "maxLength": 998,
                    "type": "string"
                  },
                  "to": {
                    "items": {
                      "$ref": "#/$defs/MailboxAddress"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["attachment_count", "cursor", "from", "message_id", "received_at", "subject", "to"],
                "type": "object"
              },
              "InboxCursor": {
                "description": "Opaque continuation bound to one inbox. Callers must not construct or modify it.",
                "pattern": "^cur_[A-Za-z0-9_-]{22,171}$",
                "type": "string"
              },
              "MailboxAddress": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "format": "email",
                    "maxLength": 320,
                    "minLength": 3,
                    "pattern": "^[A-Za-z0-9!#$%&'*+/=?^_{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 256,
                    "type": "string"
                  }
                },
                "required": ["address"],
                "type": "object"
              }
            },
            "$id": "urn:ausca:mcp:ListAgentInboxMessages:output:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "$ref": "#/$defs/InboxCursor"
              },
              "messages": {
                "items": {
                  "$ref": "#/$defs/AgentInboxMessageSummary"
                },
                "maxItems": 50,
                "type": "array"
              },
              "status": {
                "const": "ok"
              }
            },
            "required": ["cursor", "messages", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Wait for or list inbound messages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e53c38c511fa8fc7a420457bb7508f34b207f52218e0ad4182e9dfd0c1d4e580"
        },
        {
          "name": "ausca_agent_inbox_read",
