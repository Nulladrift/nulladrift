        {
          "name": "ausca_artifact_access",
          "title": "Mint artifact download access",
          "description": "Return an idempotent, short-lived download URL for one verified artifact this service holds, including a result artifact named by a succeeded invocation's output_artifact. HTTP sends no request body, not even an empty JSON object; artifact_uri is the URL path parameter and Idempotency-Key is a header. The MCP tool instead takes artifact_uri and idempotency_key as tool arguments. The URL expires after at most 60 seconds. The immutable artifact reference is the only authority; verify downloaded bytes against the returned content digest.",
          "inputSchema": {
            "$defs": {
              "ArtifactUri": {
                "description": "Opaque artifact reference minted by artifact commitment. Relay it unchanged; its form is not part of the contract.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "IdempotencyKey": {
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[^\\s\\x00-\\x1F\\x7F](?:[^\\x00-\\x1F\\x7F]*[^\\s\\x00-\\x1F\\x7F])?$",
                "type": "string"
              }
            },
            "$id": "urn:ausca:mcp:CreateArtifactAccess:input:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "artifact_uri": {
                "$ref": "#/$defs/ArtifactUri"
              },
              "idempotency_key": {
                "$ref": "#/$defs/IdempotencyKey"
              }
            },
            "required": ["artifact_uri", "idempotency_key"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ArtifactAccess": {
                "additionalProperties": false,
                "properties": {
                  "artifact_uri": {
                    "$ref": "#/$defs/ArtifactUri"
                  },
                  "content_digest": {
                    "$ref": "#/$defs/Digest"
                  },
