                    "$ref": "#/$defs/AgentInboxMessageID"
                  },
                  "received_at": {
                    "description": "Server-observed ingress time. Never derived from the sender-controlled Date header.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "reply_to": {
                    "items": {
                      "$ref": "#/$defs/MailboxAddress"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "subject": {
                    "maxLength": 998,
                    "type": "string"
                  },
                  "text": {
                    "maxLength": 262144,
                    "type": "string"
                  },
                  "to": {
                    "items": {
                      "$ref": "#/$defs/MailboxAddress"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["attachment_count", "attachments", "cc", "cursor", "from", "html", "message_id", "received_at", "reply_to", "subject", "text", "to"],
                "type": "object"
              },
              "AgentInboxMessageID": {
                "pattern": "^msg_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "InboxCursor": {
                "description": "Opaque continuation bound to one inbox. Callers must not construct or modify it.",
                "pattern": "^cur_[A-Za-z0-9_-]{22,171}$",
                "type": "string"
              },
              "MailboxAddress": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "format": "email",
                    "maxLength": 320,
                    "minLength": 3,
                    "pattern": "^[A-Za-z0-9!#$%&'*+/=?^_{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$",
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 256,
                    "type": "string"
                  }
                },
                "required": ["address"],
                "type": "object"
              }
            },
            "$id": "urn:ausca:mcp:GetAgentInboxMessage:output:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
