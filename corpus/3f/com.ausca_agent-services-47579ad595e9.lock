                  }
                },
                "required": ["attachment_id", "filename", "media_type", "safety", "size_bytes"],
                "type": "object"
              },
              "AgentInboxAttachmentID": {
                "pattern": "^att_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "AgentInboxMessage": {
                "additionalProperties": false,
                "properties": {
                  "attachment_count": {
