{
  "lockfileVersion": 2,
  "subjects": {
    "com.ausca/agent-services": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ausca.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "ausca",
        "title": "Ausca",
        "version": "1.3.1",
        "description": "Agent infrastructure on demand: discover and control metered, keyless services with explicit pricing, bounded payment authority, and receipt-backed results.",
        "websiteUrl": "https://ausca.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use search and get to resolve an immutable offer before acting. Paid tools take x402 v2 payment only in params._meta[\"x402/payment\"], never in tool arguments: a call without it moves no money and returns the PaymentRequired as an isError result's structuredContent; retry the same arguments with the signed PaymentPayload and read settlement evidence from result._meta[\"x402/payment-response\"]. For an offer without a listed paid tool, follow the selected service SKILL.md and use its canonical HTTP invocation resource. Browser and inbox lifecycle tools take their lease bearer from the MCP HTTP request Authorization header, never from tool arguments.",
      "tools": [
        {
          "name": "ausca_agent_inbox_attachment",
          "title": "Mint clean attachment access",
          "description": "For an active inbox, return an idempotent download URL only when the exact stored attachment has a clean safety verdict. The URL expires after at most 60 seconds and never after inbox expiry; a clean verdict does not make the attachment content trusted. Supply the lease bearer on the HTTP or MCP transport; never place it in tool arguments.",
          "inputSchema": {
            "$defs": {
              "AgentInboxAttachmentID": {
                "pattern": "^att_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "AgentInboxID": {
                "pattern": "^inb_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "AgentInboxMessageID": {
                "pattern": "^msg_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              },
              "IdempotencyKey": {
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[^\\s\\x00-\\x1F\\x7F](?:[^\\x00-\\x1F\\x7F]*[^\\s\\x00-\\x1F\\x7F])?$",
                "type": "string"
              }
            },
            "$id": "urn:ausca:mcp:CreateAgentInboxAttachmentAccess:input:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attachment_id": {
                "$ref": "#/$defs/AgentInboxAttachmentID"
              },
              "idempotency_key": {
                "$ref": "#/$defs/IdempotencyKey"
              },
              "inbox_id": {
                "$ref": "#/$defs/AgentInboxID"
              },
              "message_id": {
                "$ref": "#/$defs/AgentInboxMessageID"
              }
            },
            "required": ["attachment_id", "idempotency_key", "inbox_id", "message_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentInboxAttachmentAccess": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "format": "uri",
                    "maxLength": 2048,
                    "minLength": 1,
                    "pattern": "^https://inbox\\.ausca\\.com/",
                    "type": "string"
                  },
                  "expires_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "filename": {
                    "maxLength": 255,
                    "minLength": 1,
                    "type": "string"
                  },
                  "media_type": {
                    "maxLength": 255,
                    "minLength": 1,
                    "type": "string"
                  },
                  "size_bytes": {
                    "maximum": 10485760,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["download_url", "expires_at", "filename", "media_type", "size_bytes"],
                "type": "object"
              }
            },
            "$id": "urn:ausca:mcp:CreateAgentInboxAttachmentAccess:output:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attachment": {
                "$ref": "#/$defs/AgentInboxAttachmentAccess"
              },
              "status": {
                "const": "ready"
              }
            },
            "required": ["attachment", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Mint clean attachment access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef9b58ae48fa48f8ed0328b546ecd306bc0c2d6a219b7ed938e05c32dc7d37b5"
        },
        {
          "name": "ausca_agent_inbox_delete",
          "title": "Delete an agent-inbox lease",
          "description": "Idempotently stop inbound visibility and delete retained message and attachment content for one inbox lease, including an already-terminal lease. Supply the lease bearer on the HTTP or MCP transport; never place it in tool arguments.",
          "inputSchema": {
            "$defs": {
              "AgentInboxID": {
                "pattern": "^inb_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              }
            },
            "$id": "urn:ausca:mcp:DeleteAgentInbox:input:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "inbox_id": {
                "$ref": "#/$defs/AgentInboxID"
              }
            },
            "required": ["inbox_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentInbox": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "format": "email",
                    "maxLength": 320,
                    "minLength": 3,
                    "pattern": "^[A-Za-z0-9!#$%&'*+/=?^_{|}~-]+(?:\\.[A-Za-z0-9!#$%&'*+/=?^_{|}~-]+)*@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$",
                    "type": "string"
                  },
                  "created_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "deleted_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "expires_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "inbox_id": {
                    "$ref": "#/$defs/AgentInboxID"
                  },
                  "state": {
                    "enum": ["active", "deleting", "deleted", "expired"],
                    "type": "string"
                  }
                },
                "required": ["address", "created_at", "expires_at", "inbox_id", "state"],
                "type": "object"
              },
              "AgentInboxID": {
                "pattern": "^inb_[A-Za-z0-9_-]{22,64}$",
                "type": "string"
              }
            },
            "$id": "urn:ausca:mcp:DeleteAgentInbox:output:v1",
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "inbox": {
                "$ref": "#/$defs/AgentInbox"
