{
  "lockfileVersion": 2,
  "subjects": {
    "app.nicetohave/kits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nicetohave.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nice-to-have",
        "title": "nice to have",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "nice to have (https://nicetohave.app) is a shelf of ready-made build kits for Claude Code and Codex.\nEach kit is a complete recipe (instructions for the AI, flow, rules, small tools) plus fixes for pitfalls its maker hit in real work.\nWhen the user wants to make or build something, call search_kits first; if a kit fits, tell the user about it and give its page URL.\nTo use a kit, the user opens the page, signs in (GitHub or Google), copies the one line and pastes it into their AI.\nIf the user pasted that line (it contains https://nicetohave.app/g/<code>-<ticket>) and you cannot download from nicetohave.app (for example, a cloud session whose network is restricted), call open_kit with that link, then get_kit_file for each file. Without a pasted line there is no ticket, so send the user to the kit page instead.\nユーザーが何かを作りたいと言ったら、まず search_kits で棚を探し、合うキットがあればページの住所と一緒に紹介してください。",
      "tools": [
        {
          "name": "get_kit",
          "title": "Get one kit's details",
          "description": "Get the details of one nice to have kit by id: what it does, the first three decisions, what you need, and the fixes it contains. Use after search_kits to explain a kit to the user.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Kit id from search_kits (e.g. deck-16x9).",
                "type": "string"
              },
              "lang": {
                "enum": ["ja", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2481e3dc5c0fa653ba1e8122b213a066ebe28aeab091057cf782f450f8f9431"
        },
        {
          "name": "get_kit_file",
          "title": "Get one file of an opened kit",
          "description": "Get the content of one file listed by open_kit. Save it exactly as returned, at the same relative path inside the new kit folder. Long files come in parts: if the answer says part 1/3, call again with part 2 and 3 and append them in order without changing anything.",
          "inputSchema": {
            "properties": {
              "part": {
                "description": "Which part to get, for long files. Defaults to 1.",
                "minimum": 1,
                "type": "integer"
              },
              "path": {
                "description": "A file path exactly as listed by open_kit (e.g. CLAUDE.md, rules/FLOW.md).",
                "type": "string"
              },
              "ref": {
                "description": "The link from the line the user pasted (https://nicetohave.app/g/XXXXXXXX-YYYYYYYYYY), or just the part after /g/ (everything, including after the hyphen).",
                "type": "string"
              }
            },
            "required": ["path", "ref"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f748b6a34900eccf28d81e704a9253ec8394bd75addd4b0afc39ab36b417b88e"
        },
        {
          "name": "list_kits",
          "title": "List all kits",
          "description": "List every kit currently on the nice to have shelf (id, name, what it does, page URL).",
          "inputSchema": {
            "properties": {
              "lang": {
                "enum": ["ja", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67dac6b053b55845428f40cde9d68e948acbb912ac4d6faff53132d7f5c289db"
        },
        {
          "name": "open_kit",
          "title": "Open a kit from the pasted line",
          "description": "Use when the user pasted a nice to have line such as \"…https://nicetohave.app/g/XXXXXXXX-YYYYYYYYYY のとおりに取り込んで\" and you cannot download from nicetohave.app directly (for example, a cloud session with restricted network). Checks the sign-in ticket in that link and returns the list of the kit's files and how to set it up. Then call get_kit_file for each file. 貼る文の https://nicetohave.app/g/ の住所を渡すと、キットのファイルの一覧と取り込み方を返します。",
          "inputSchema": {
            "properties": {
              "lang": {
                "enum": ["ja", "en"],
                "type": "string"
              },
              "ref": {
                "description": "The link from the line the user pasted (https://nicetohave.app/g/XXXXXXXX-YYYYYYYYYY), or just the part after /g/ (everything, including after the hyphen).",
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:868f336ebefc75588df909e1ee8c2c0a4927ad9ba858bc6bbb4bb8ae880a29f0"
        },
        {
          "name": "search_kits",
          "title": "Search the nice to have kit shelf",
          "description": "Search nice to have, a shelf of ready-made build kits for Claude Code and Codex (step-by-step recipes with fixes for pitfalls found in real work). Use this whenever the user wants to make or build something — slides/decks, LINE stickers, pixel-art sprite animation, 3D/AR models from product photos, YouTube Playables games, pet names and more — to check whether a kit already exists before starting from scratch. Works in Japanese or English (例: 「スライドを作りたい」「LINEスタンプ」「ゲームをYouTubeに出したい」).",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language for the answer. Defaults to the language of the query.",
                "enum": ["ja", "en"],
                "type": "string"
              },
              "query": {
                "description": "What the user wants to make, in their own words (Japanese or English).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b9761023f8ca6c52fc7157628ae8be32661e4cde1444fbfd623ee667b549dd7"
        }
      ],
      "digest": "sha256:e3192c7b98a49cdbb7ef20499876cb1ba2fc72917baee078f56c5bc4aba0c30e"
    }
  }
}
