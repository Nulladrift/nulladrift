        },
        {
          "name": "lookup_vehicle",
          "description": "Fuzzy-match a vehicle by make (and optional model/year) to confirm it exists and correct spelling before a plan search. Use this when the user's make/model looks misspelled or uncertain.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Vehicle make to match, e.g. \"toyota\". Spelling does not need to be exact.",
                "type": "string"
              },
              "model": {
                "default": null,
                "description": "Optional vehicle model to narrow the match.",
                "type": ["string", "null"]
              },
              "year": {
                "default": null,
                "description": "Optional model year to narrow the match.",
                "type": ["integer", "null"]
              }
            },
            "required": ["make"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
