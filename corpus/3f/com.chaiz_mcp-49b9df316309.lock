          },
          "digest": "sha256:61d54881e5e867a9b258dd0375ff743f204cdd2a458ea30c77a7e6da4e2341dd"
        },
        {
          "name": "search_plans_by_license_plate",
          "description": "Search Chaiz for vehicle service contract plans by US license plate. The plate plus state is used to identify the vehicle. Results are 36-month (3-year) term plans. License plate, state, and mileage are required. If mileage is missing, ASK the user — never guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "licensePlate": {
                "description": "License plate number, 1-8 characters.",
                "type": "string"
              },
              "mileage": {
                "description": "The vehicle's exact current odometer reading in miles as a single whole number, 1-250000, e.g. 78000 — not a range or approximation. Ask the user; never guess.",
                "type": "integer"
              },
              "sort": {
                "default": null,
                "description": "Optional ordering of results: \"rating\" (Chaiz expert rating, the default), \"recommended\", \"price_low\", or \"price_high\". Omit to use the default ordering.",
                "type": ["string", "null"]
              },
              "state": {
                "description": "Two-letter US state code where the plate is registered, e.g. \"TX\". Ask the user; never guess.",
                "type": "string"
              },
              "zip": {
                "default": null,
                "description": "Optional 5-digit US ZIP code for more precise pricing.",
                "type": ["string", "null"]
              }
            },
            "required": ["licensePlate", "mileage", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
