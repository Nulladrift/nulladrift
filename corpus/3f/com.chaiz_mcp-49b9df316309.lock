        {
          "name": "search_plans_by_vin",
          "description": "Search Chaiz for vehicle service contract plans by VIN. The VIN is decoded to the vehicle automatically. Results are 36-month (3-year) term plans. VIN, mileage, and state are required. If mileage or state is missing, ASK the user — never guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mileage": {
                "description": "The vehicle's exact current odometer reading in miles as a single whole number, 1-250000, e.g. 78000 — not a range or approximation. Ask the user; never guess.",
                "type": "integer"
              },
              "sort": {
                "default": null,
                "description": "Optional ordering of results: \"rating\" (Chaiz expert rating, the default), \"recommended\", \"price_low\", or \"price_high\". Omit to use the default ordering.",
