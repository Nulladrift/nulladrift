            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8850aa9d4733f651de00b7579e9ad89d492a1f9eb360dcabfdf601d7f7c0ba90"
        },
        {
          "name": "list_vehicle_models",
          "description": "List the models (and the years available) for a given Chaiz make id. Get the make id from list_vehicle_makes.",
