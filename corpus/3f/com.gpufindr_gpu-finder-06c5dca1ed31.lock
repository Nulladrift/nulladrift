  "subjects": {
    "com.gpufindr/gpu-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gpufindr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "GPUFinder-MCP",
        "version": "0.1.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "fetch_gpu",
          "description": "Get the full record of one GPU rental offer by its id, as returned by search_gpus.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Offer id from a search_gpus result.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get GPU offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bc41e8f2a71b7e47ef9de9af437dc4192c1dddbab3f44d809715e4869580fb1"
        },
        {
          "name": "search_gpus",
          "description": "Search live cloud GPU rental offers from about a dozen providers (Vast.ai, RunPod, Lambda, Akash, Lium and others), refreshed at least every two hours. Use it to find the cheapest or best-value GPU for a workload, or to compare prices for a GPU model across providers. Returns a count of matching offers and a JSON array; each offer has id, name, num_gpus, vram_mb, total_cost_ph (USD per hour for the whole offer), location, source (provider), reliability, CPU, RAM, disk and network details, and score.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum offers to return (default 50, max 200).",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum total_cost_ph in USD per hour. Omit, 0 or -1 for no limit.",
                "type": "number"
              },
              "min_score": {
                "description": "Minimum score, 0 to 100, combining GPU compute, memory bandwidth, VRAM, GPU count, reliability, CPU and RAM. Omit or 0 for any.",
                "type": "number"
              },
              "offset": {
                "description": "Number of matching offers to skip, for paging (default 0).",
                "type": "number"
              },
              "order_by": {
                "description": "Sort as column.direction. total_cost_ph.asc is cheapest first, score.desc is most capable first, score_dollar_ph.desc is best score per dollar. Default updated_at.desc.",
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive substring of the GPU model name, e.g. \"H100\", \"A100\", \"4090\". Omit or \"*\" for any model.",
                "type": "string"
              },
              "region": {
                "description": "Exact match on the offer's location field; formats vary by provider (e.g. \"California, US\", \"us-southeast-1\"). Omit or \"*\" for any location.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search GPU offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:250c1a90c03dfcddfbd2757e9c6cbf82945fe6bce464d0b1560f8e7c2121ce5d"
        }
      ],
      "digest": "sha256:5f450f8ad1814d4e2b33bc18ff9bdf3a2f795ff400e5c94b85c3d765c52ede7e"
    }
  }
