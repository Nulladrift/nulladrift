        "name": "chalet-montagne-rentals",
        "version": "1.2.0",
        "description": "Locations de vacances à la montagne en France (Alpes, Pyrénées, Jura, Vosges, Massif central) — mise en relation directe et gratuite entre vacanciers et propriétaires, sans commission de réservation.",
