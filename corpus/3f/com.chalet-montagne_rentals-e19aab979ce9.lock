      },
      "instructions": "Chalet-Montagne.com met en relation vacanciers et propriétaires de locations de vacances à la montagne en France, sans commission. Utilise search_rentals pour trouver des locations (destination en texte libre), get_rental_details pour approfondir une fiche, check_availability_and_price pour vérifier disponibilité et prix d'un séjour daté. Les prix sont toujours indicatifs et à confirmer par le propriétaire. Aucune réservation ferme ni paiement ne passe par ce serveur : la finalité est la demande de contact au propriétaire, qui répond directement à l'utilisateur. prepare_rental_inquiry renvoie le formulaire de contact de la fiche prérempli ; la personne y saisit ses coordonnées et l'envoie elle-même. Chaque résultat comporte le lien de la page correspondante sur chalet-montagne.com.",
      "tools": [
        {
          "name": "check_availability_and_price",
          "title": "Vérifier la disponibilité et le prix d'un séjour",
          "description": "Vérifie en une seule fois la disponibilité ET le prix d'un séjour daté\npour une location (id renvoyé par search_rentals). Répond : disponible /\noccupé / partiellement disponible, le prix total du séjour (toujours\nindicatif, à confirmer par le propriétaire), un indicateur de fraîcheur\ndu planning, et si le séjour est indisponible, jusqu'à 3 périodes libres\nproches de même durée.",
          "inputSchema": {
            "properties": {
              "date_end": {
                "description": "Date de départ (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_start": {
                "description": "Date d'arrivée (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "default": null,
                "description": "Nombre de voyageurs (information indicative).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "rental_id": {
                "description": "Identifiant de la location (champ « id » des résultats de search_rentals).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["date_end", "date_start", "rental_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Vérifier la disponibilité et le prix d'un séjour"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee2cb3520fe4190e7133e62c80655797631fb9dd2e1892475e8e858e39074f01"
        },
        {
          "name": "get_rental_details",
          "title": "Consulter la fiche détaillée d'une location",
          "description": "Fiche détaillée d'une location identifiée par l'id renvoyé par\nsearch_rentals : description, capacité et chambres, équipements,\nconditions de location (arrivée/départ, caution, acompte, annulation,\nanimaux), avis voyageurs et lien vers la page du site. Les coordonnées\ndu propriétaire ne sont jamais fournies : la mise en relation passe par\nle formulaire de contact du site (lien inclus).",
          "inputSchema": {
            "properties": {
              "locale": {
                "default": "fr",
                "description": "Langue de la description et du lien.",
                "enum": ["fr", "en", "de", "es", "it", "nl"],
                "type": "string"
              },
              "rental_id": {
                "description": "Identifiant de la location (champ « id » des résultats de search_rentals).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["rental_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Consulter la fiche détaillée d'une location"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:548bcf1511c3b189d3d128e7a2c78d4047b1f41f9e1986f0bd13f66f55677d34"
        },
        {
          "name": "prepare_rental_inquiry",
          "title": "Préparer une demande de location au propriétaire",
          "description": "Prépare une demande de contact au propriétaire d'une location (id renvoyé\npar search_rentals) et renvoie le lien de son formulaire sur\nchalet-montagne.com, déjà rempli avec les dates, les voyageurs et le\nmessage. Rien n'est envoyé par cet outil : la personne ouvre le lien,\nsaisit elle-même ses coordonnées et envoie la demande ; le propriétaire\nlui répond ensuite directement par email. Mise en relation sans\ncommission, sans réservation ferme ni paiement.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Nombre d'adultes.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "babies": {
                "default": 0,
                "description": "Nombre de bébés.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "default": 0,
                "description": "Nombre d'enfants.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "date_end": {
                "description": "Date de départ (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_start": {
                "description": "Date d'arrivée (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "locale": {
                "default": "fr",
                "description": "Langue de la fiche.",
                "enum": ["fr", "en", "de", "es", "it", "nl"],
                "type": "string"
              },
              "message": {
                "default": null,
                "description": "Message au propriétaire, rédigé avec l'utilisateur (facultatif). Il apparaît dans le formulaire, où la personne peut le modifier.",
                "maxLength": 1000,
                "type": "string"
              },
              "pets": {
                "default": 0,
                "description": "Nombre d'animaux.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "rental_id": {
                "description": "Identifiant de la location (champ « id » des résultats de search_rentals).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["adults", "date_end", "date_start", "rental_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Préparer une demande de location au propriétaire"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:458a34ed5c318ea173e4613159a9080635af2bc93f57f98b7c6590a3da044cc1"
        },
        {
          "name": "search_rentals",
          "title": "Rechercher une location de vacances à la montagne",
          "description": "Recherche des locations de vacances à la montagne en France parmi des\nmilliers d'annonces (chalets, appartements, studios) louées en direct par leurs\npropriétaires — sans commission de réservation. Sans dates, les prix\nrenvoyés sont des tarifs à la semaine ; avec des dates, le prix est le\ntotal du séjour demandé. Les prix sont indicatifs, à confirmer par le\npropriétaire. Chaque résultat contient un « id » à réutiliser avec\nget_rental_details et check_availability_and_price, et le lien de la\npage correspondante sur chalet-montagne.com.",
          "inputSchema": {
            "properties": {
              "amenities": {
                "default": null,
                "description": "Équipements exigés (tous devront être présents).",
                "items": {
                  "enum": ["piscine", "sauna-jacuzzi", "cheminee", "wifi", "lave-vaisselle", "lave-linge", "television", "parking", "garage", "balcon", "terrasse", "jardin", "climatisation", "barbecue", "local-skis", "acces-pmr"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "bedrooms_min": {
                "default": null,
                "description": "Nombre minimum de chambres.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "budget_max": {
                "default": null,
                "description": "Budget maximum en euros pour le séjour (ou pour la semaine si pas de dates).",
                "minimum": 1,
                "type": "integer"
              },
              "date_end": {
                "default": null,
                "description": "Date de départ (YYYY-MM-DD). Requise si date_start est fournie.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_start": {
                "default": null,
                "description": "Date d'arrivée (YYYY-MM-DD). Recommandé : les prix deviennent exacts et la disponibilité est prise en compte.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "default": null,
                "description": "Station, massif, département ou domaine skiable français, en texte libre. Ex : \"Les Gets\", \"Haute-Savoie\", \"Portes du Soleil\". En cas d'ambiguïté le serveur propose des choix. Omettre pour chercher dans toutes les destinations.",
                "maxLength": 100,
                "type": "string"
              },
              "flexible_days": {
                "default": 0,
                "description": "Tolérance en jours autour des dates (0 = dates strictes).",
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "guests": {
                "default": null,
                "description": "Nombre de voyageurs (capacité de couchage minimale).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "fr",
                "description": "Langue des libellés et des liens renvoyés.",
                "enum": ["fr", "en", "de", "es", "it", "nl"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page de résultats (10 par page).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pets_allowed": {
                "default": null,
                "description": "true = uniquement les locations acceptant les animaux.",
                "type": "boolean"
              },
              "property_types": {
                "default": null,
                "description": "Types d'hébergement souhaités.",
                "items": {
                  "enum": ["chalet", "appartement", "studio", "maison", "chambre-hotes", "autre"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "sort": {
                "default": null,
                "description": "Tri des résultats. Défaut : pertinence.",
                "enum": ["price", "capacity", "rating"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
