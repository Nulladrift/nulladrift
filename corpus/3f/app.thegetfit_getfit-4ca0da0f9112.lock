{
  "lockfileVersion": 2,
  "subjects": {
    "app.thegetfit/getfit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://thegetfit.app/mcp-server"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "getfit",
        "title": "GetFit — thegetfit.app",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GetFit builds workouts that fit the time, gear and body someone has. Use build_workout for \"I have N minutes and this equipment\"; give the person the whole workout in the chat, including every safety note, and offer the link to run it in GetFit's Player. For personal tools (their profile, plans, schedule), they can make a personal connector at https://thegetfit.app/connect.html.",
      "tools": [
        {
          "name": "build_workout",
          "title": "Build a workout",
          "description": "What workout can I do with this time, this gear, and this body? GetFit's coach builds a complete session that fits the minutes, uses only the equipment they have, and steers around anything they want to avoid. Give the person the whole workout in the chat — warm-up, every exercise with sets, reps, rest and effort — and read out the safety_notes. The workout is also posted to GetFit's public Explore page (no personal details), and `link` opens it in GetFit, where the Player runs it with timers and rest countdowns. Inputs (all optional): focus, minutes, equipment, avoid, level, goal, intensity. Example: {\"focus\":\"legs\",\"minutes\":30,\"equipment\":\"from home\",\"avoid\":[\"knees\"]}.",
          "inputSchema": {
            "properties": {
              "avoid": {
                "description": "Body parts or movements to avoid: \"knees\", \"lower back\", \"jumping\".",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "equipment": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "What they have: a preset (none | dumbbells | hotel_gym | full_gym), free text (\"a couple of dumbbells\", \"from home\"), or a list. Nothing named → bodyweight."
              },
              "focus": {
                "description": "What to train, in plain words: \"legs\", \"upper body\", \"full body\", \"core\".",
                "type": "string"
              },
              "goal": {
                "description": "e.g. \"strength\", \"fat loss\", \"endurance\"",
                "type": "string"
              },
              "intensity": {
                "enum": ["easy", "moderate", "hard", "all-out"],
                "type": "string"
              },
              "level": {
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "minutes": {
                "description": "Time available, warm-up included (5-120). Treated as a hard ceiling. Default 30.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1703df48d71919bd8338e40fc79e0aa95074407b823b9e8c83ebdb504f947d34"
        },
        {
          "name": "get_contributor",
          "title": "Get a GetFit contributor",
          "description": "Who is this GetFit contributor and what have they posted? Input: handle from list_contributors. Example: {\"handle\":\"jenna\"}.",
          "inputSchema": {
            "properties": {
              "handle": {
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa748f75f3c386c2bab5109ae2cad5b846f7329e9e095ad5afee587a68e1d5e9"
        },
        {
          "name": "get_workout",
          "title": "Get a GetFit workout",
          "description": "Show me that workout in full. Returns author, discipline, duration, warm-up, coach note and every exercise (sets, reps, rest, cues). Input: slug from search_workouts. Example: {\"slug\":\"the-45-minute-pull-day\"}.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0103590cbb10c379608cacb25dc1133fa01ab5ac1dc909f3bf26608bfb7accc3"
        },
        {
          "name": "list_contributors",
          "title": "List GetFit contributors",
          "description": "Who posts workouts on GetFit? Lists people with published workouts: handle, name, bio, location, workout count. No inputs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57bf1f0a181592b42504e9768459a7cc4b56a184ebdc16b974778336a329cad1"
        },
        {
          "name": "search_workouts",
          "title": "Search GetFit workouts",
          "description": "What workouts are on GetFit for legs / 20 minutes / dumbbells? Searches published workouts on Explore by body area, name, exercise and gear. If nothing fits, say so and offer build_workout to make one. Inputs: query, focus, max_minutes, equipment, discipline, source (people | agent | any), limit (default 5, max 20). Example: {\"query\":\"legs\",\"max_minutes\":30,\"equipment\":\"dumbbells\"}.",
          "inputSchema": {
            "properties": {
              "discipline": {
                "enum": ["Strength & lifting", "HIIT / Bootcamp", "Running & endurance", "Yoga & mobility", "CrossFit / Functional", "Hybrid"],
                "type": "string"
              },
              "equipment": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "What they have (preset, free text or list); results stay within it."
              },
              "focus": {
                "description": "Body area, e.g. \"legs\", \"upper body\"",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "max_minutes": {
                "type": "number"
              },
              "query": {
                "description": "Plain words: \"legs\", \"pull day\", \"core\"",
                "type": "string"
              },
              "source": {
                "description": "people = posted by GetFit members and trainers; agent = built on request",
                "enum": ["people", "agent", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b7361ce4313751c5f8350cb3f3f40daf709918332de7ec42e305f66b859d305"
        }
      ],
      "digest": "sha256:0383fc1a22c72b6aedc84ba505ecd8080d00ff07dd2f4e24dfb91b8c4d179449"
    }
  }
