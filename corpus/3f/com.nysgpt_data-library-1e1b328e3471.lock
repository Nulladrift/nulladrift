{
  "lockfileVersion": 2,
  "subjects": {
    "com.nysgpt/data-library": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://data.nysgpt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nysgpt-data-library",
        "version": "2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "NYSgpt Data Library: 69 billion public records (federal spending, patents, company filings, scholarly works, labor, census, energy, health, courts and more) as Athena SQL tables. Start with list_databases, then list_tables and describe_table, then query. Free without a key up to a daily limit; paid keys at https://nysgpt.com/data",
      "tools": [
        {
          "name": "describe_table",
          "title": "Describe a table",
          "description": "Return the fields (name, type, description), the table description and the row count of one table. Always call this before writing SQL: many source columns are stored as text and need try_cast.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "database": {
                "description": "Database name, for example govblock_scholarly.",
                "type": "string"
              },
              "table": {
                "description": "Table name from list_tables, for example openalex_works.",
                "type": "string"
              }
            },
            "required": ["database", "table"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:274d67073bf11ebcd85ac3cfa6cb56e0e18a64b474c973482cfc4f475f9972d8"
        },
        {
          "name": "list_databases",
          "title": "List databases",
          "description": "List the databases in the NYSgpt Data Library. Each database is one subject of public records (for example govblock_awards = federal spending, govblock_patents, govblock_sec = company filings, govblock_scholarly = OpenAlex, govblock_labor, govblock_census, govblock_energy, govblock_health, govblock_courts). Call this first, then list_tables.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba4ac1b275e7bd397f7dc29ebbca559c6ad186f320b3ce82fe5f95442ae9d87c"
        },
        {
          "name": "list_tables",
          "title": "List tables",
          "description": "List every table in one database with its row count. Use it to find the table that answers a question before calling describe_table.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "database": {
                "description": "A database name from list_databases, for example govblock_awards.",
                "type": "string"
              }
            },
            "required": ["database"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f71812cde5f6a54e0a7c8f5b139dcc57937000221da14dec0a524d3c67706e6"
        },
        {
          "name": "query",
          "title": "Run SQL",
          "description": "Run one read-only SQL statement (SELECT, WITH, SHOW or DESCRIBE) in the Amazon Athena (Trino) dialect and return up to 1,000 rows with column names and bytes scanned. Qualify every table as database.table. Select only the columns you need and filter on year or state columns where they exist, because each query has a scan limit (1 GB without a key, 10 GB with a paid key). Numeric text columns need try_cast(col AS double). When a daily limit is reached the error message gives the address for a paid key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sql": {
                "description": "One SQL statement, for example: SELECT publication_year, count(*) FROM govblock_scholarly.openalex_works GROUP BY 1 ORDER BY 1",
                "type": "string"
              }
            },
            "required": ["sql"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3768b55735f3379284f0d288eade4180f3c6a1f37a6f43baee32d1b39b04cd6f"
        }
      ],
      "digest": "sha256:18137bd2ba6e6e08ba2e69e1e438b0c6d01a0a3b927f32748a7b490c02f2abea"
    }
  }
}
