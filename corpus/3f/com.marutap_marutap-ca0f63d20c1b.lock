        {
          "name": "cancel_subscription",
          "description": "Cancel a subscription mandate. Safe — canceling never spends money, and the merchant can\n    never charge again afterwards.",
          "inputSchema": {
            "properties": {
              "mandate_id": {
                "title": "Mandate Id",
                "type": "string"
              }
            },
            "required": ["mandate_id"],
            "title": "cancel_subscriptionArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel subscription"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fdf52b4b2b9eb598f4bbfe00fcc3b522a33bf2f1ca76946fa95bc4e44d4dad2f"
        },
        {
          "name": "get_payment_result",
          "description": "Poll for the outcome of a payment request.\n\n    Long-polls up to wait_seconds. Returns status one of: pending, approved, settled,\n    declined, expired, not_found, claim_pending. When approved, includes a single-use\n    `card` (number, cvc, exp) locked to this purchase — use it to complete checkout at\n    the merchant. If still \"pending\"/\"claim_pending\", call again.\n\n    For a claim (charge_id = the \"clm_…\" poll_id from request_payment): pass the\n    agent_secret you received. The first approved result also contains `connect_token` —\n    persist it and send it as the Authorization bearer on all future calls.\n    ",
          "inputSchema": {
            "properties": {
              "agent_secret": {
                "default": "",
                "title": "Agent Secret",
                "type": "string"
              },
              "charge_id": {
                "title": "Charge Id",
                "type": "string"
              },
              "wait_seconds": {
                "default": 20,
                "title": "Wait Seconds",
                "type": "integer"
              }
            },
            "required": ["charge_id"],
            "title": "get_payment_resultArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get payment result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0d06f9d0d915abb1943dff5bda8cc6f1dcf05c6adc22027083f9b7e5eb2e27e"
        },
        {
          "name": "list_payment_requests",
          "description": "List this agent's payment requests and whether each has been approved yet.\n\n    Use this to see the state of every request you've made — not just poll one saved\n    charge_id. Each item includes its `status` (pending, approved, settled, declined,\n    expired) so you can tell which are still waiting and which the user has acted on.\n    For a pending request it also returns the `approval_url` (re-surface it to the user);\n    once a request is approved, call get_payment_result(charge_id) to fetch the card.\n\n    Args:\n        status: which to return — \"open\" (default, still-pending only) or \"all\".\n        limit: max requests to return (default 20, capped at 100), newest first.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "status": {
                "default": "open",
                "title": "Status",
                "type": "string"
              }
            },
            "title": "list_payment_requestsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List payment requests"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba8c2915ecac20beb33cae0d466cd4502ccbc838118bc85a750d00d13c7db071"
        },
        {
          "name": "list_subscriptions",
          "description": "List the user's subscription mandates and their status.",
          "inputSchema": {
            "properties": {},
            "title": "list_subscriptionsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List subscriptions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:983a1c85c21eac436deb8e95901dc1407aa924d583799117022a2fe673194eba"
        },
        {
          "name": "record_order",
          "description": "Report the merchant's order reference back after checkout, so the user can later reverse\n    (refund) the purchase. `order_ref` is the merchant's payment id (e.g. a Stripe PaymentIntent).\n    ",
          "inputSchema": {
            "properties": {
              "charge_id": {
                "title": "Charge Id",
                "type": "string"
              },
              "order_ref": {
                "title": "Order Ref",
                "type": "string"
              }
            },
            "required": ["charge_id", "order_ref"],
            "title": "record_orderArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Record merchant order reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:62d0f4a2495750d5b9c47bf21152f0f6f16041f22f4b192c2b52da3cba715506"
        },
        {
          "name": "request_payment",
          "description": "Request the user's approval to pay for a purchase.\n\n    Usually returns `{auto_approved: false, approval_url}` — show the approval_url to the user\n    so they can review the total and approve with one tap, then call get_payment_result.\n\n    If the user's spending policy auto-approves this purchase (e.g. under their cap at an\n    allowlisted merchant), it returns `{auto_approved: true, status: \"approved\", card}` immediately\n    — no approval needed, just use the card.\n\n    Args:\n        amount: Total to charge, in major units (e.g. 18.50 dollars).\n        merchant: Human-readable merchant / store name shown on the approval screen.\n        line_items: Optional list of {\"name\": str, \"quantity\": int, \"amount_cents\": int}.\n        currency: ISO currency code, default \"usd\".\n    ",
          "inputSchema": {
            "properties": {
              "amount": {
                "title": "Amount",
                "type": "number"
              },
              "currency": {
                "default": "usd",
                "title": "Currency",
                "type": "string"
              },
              "line_items": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Line Items"
              },
              "merchant": {
                "title": "Merchant",
                "type": "string"
              }
            },
            "required": ["amount", "merchant"],
            "title": "request_paymentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request payment approval"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9b6fb72fec9e053f7b6b579d8d0720ef90215efdfe15dcc5c64f19d1bc9c658"
        },
        {
          "name": "request_subscription",
          "description": "Set up a recurring subscription mandate (e.g. Netflix at up to $16/month).\n\n    Requires the user's explicit one-time approval — returns an approval_url. The mandate is\n    merchant-locked and capped: the merchant can never charge more than `cap` per period, and the\n    user can cancel anytime (after which the merchant can never charge again).\n\n    Args:\n        merchant: merchant to authorize (e.g. \"Netflix\").\n        cap: max amount per period in major units (e.g. 16.00).\n        interval: \"weekly\" | \"monthly\" | \"yearly\".\n    ",
          "inputSchema": {
            "properties": {
              "cap": {
                "title": "Cap",
                "type": "number"
              },
              "interval": {
                "default": "monthly",
                "title": "Interval",
                "type": "string"
              },
              "merchant": {
                "title": "Merchant",
                "type": "string"
              }
            },
            "required": ["cap", "merchant"],
            "title": "request_subscriptionArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request subscription approval"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e75de51713b2a5a7bc63b971e7c0c412df9f0d12d7644add31ebc8f96c6f7b9"
        }
      ],
