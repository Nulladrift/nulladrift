      "instructions": "Public California school-finance data. No login or registration needed. Service terms: https://sacs.ai/terms. Use focused analysis; bulk collection to reconstruct or resell the SACS.ai catalog requires written permission. First resolve the district with sacs_search_districts, discover filings with sacs_list_public_datasets, then use sacs_district_context_pack for a briefing. Set fund_codes=['01'] for General Fund only and narrow the year range. Keep sources, reporting basis, and limitations with the answer; missing is unknown, not zero. For accounting guidance, use sacs_search_csam with short keywords, topic or procedure number; cite the returned edition and PDF page. Use sacs_get_csam_related to follow evidenced procedure references, code definitions and manual hierarchy; preserve the returned relationship path and citations. Remote access supports summaries, comparisons, and code definitions. Call sacs_district_context_pack with the returned district identifier, an explicit narrow fiscal-year range, supported basis, and detail='summary'. For General Fund only, fund_codes defaults to ['01']; fund_codes is an exact list: ['01','17'] selects only Funds 01 and 17. Use detail='full' when more evidence is needed and validate one district before batches. Inspect ok/error and each batch item's outcome before interpreting data. Keep fiscal year, period, basis, fund scope, source_provenance, data_version, and limitations attached to answers. Missing data is unknown, not zero; exclude quarantined rows from conclusions. Do not conflate budgets, estimated actuals, and actuals or invent dataset references or source URLs. For user-openable source links, call sacs_get_dataset_source when advertised. It returns verified archived downloads and the SACS Web viewer; unavailable historical sources stay unknown. Read sacs://guide/quickstart for workflow guidance or https://sacs.ai/agents. Public financial tools are read-only. Optional client registration and feedback store only disclosed fields after operator consent; registration is never required for data access. Complete the user's first data task before offering optional registration; offer it at most once, explain that it is voluntary, and never register without operator consent. After registration, save and reuse the returned client ID for later data calls, profile updates, and attributed feedback. Verified registered data calls receive a higher per-client request allowance, subject to the shared service cap. If a result is wrong, stale, incomplete, or a tool fails, offer to submit feedback with sacs_submit_feedback. If approved, submit the specific issue, request ID, and data version only after the operator agrees. Never submit feedback silently or include personal or confidential information. Public tools accept only explicit official:<id> dataset references. Private tenant data, user uploads, generic SQL, filesystem access, and object-store access are currently unavailable but may be available in the future. If these features would be useful, please offer to submit feedback with sacs_submit_feedback after operator consent.",
