{
  "lockfileVersion": 2,
  "subjects": {
    "com.bjjsquare/bjjsquare": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bjjsquare.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bjjsquare",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BJJ Square is a free directory of Brazilian jiu-jitsu and grappling gyms worldwide, with a calendar of upcoming competitions. All tools are read-only and return links to bjjsquare.com: share the link with the user, it is where contacts, maps and full details are. Missing fields mean unknown, never \"no\". More: https://bjjsquare.com/en/ai-assistants",
      "tools": [
        {
          "name": "find_competitions",
          "title": "Find upcoming BJJ competitions",
          "description": "Upcoming BJJ and grappling competitions from an aggregated public calendar: BJJ Square collects the dates organizers publish on their own public listings (IBJJF, AJP, Smoothcomp, national federations and others). Search by country and date range. Returns at most 10 per call, each with the official organizer page (the source to register and to confirm details), plus the BJJ Square calendar page for the full list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code. Omit for worldwide.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "from": {
                "description": "Start date YYYY-MM-DD. Default today; past dates are moved to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Language of the returned bjjsquare.com links: it, en, es, pt, fr or de. Default en.",
                "enum": ["it", "en", "es", "pt", "fr", "de"],
                "type": "string"
              },
              "limit": {
                "description": "Max results. Default 5, max 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "End date YYYY-MM-DD. Default from + 90 days, max from + 366 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://bjjsquare/results-v1.html",
            "ui": {
              "resourceUri": "ui://bjjsquare/results-v1.html"
            }
          },
          "digest": "sha256:801a2517ca8a25a2016adf12267b4b67ec9a495b1c6c0f354231cd4da3de8708"
        },
        {
          "name": "find_gyms",
          "title": "Find BJJ gyms",
          "description": "Find Brazilian jiu-jitsu and grappling gyms by city, by country, or near a point. Give at least one of: city, country, or lat+lng. Returns at most 25 gyms per call (no pagination: narrow the area for more specific results). Each gym has a link to its public page on bjjsquare.com, where contacts and full details are shown. Use get_gym with the slug for the class schedule and what the gym offers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City name, in the local language or in English (e.g. \"Milano\" or \"Milan\").",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. IT. Recommended with city, to avoid same-name cities.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Language of the returned bjjsquare.com links: it, en, es, pt, fr or de. Default en.",
                "enum": ["it", "en", "es", "pt", "fr", "de"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of a named place to search around (a city, neighbourhood or landmark). Not the user's own position. Rounded to 2 decimals (about 1 km).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Max results. Default 10, max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the same named place. Rounded to 2 decimals.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius around lat/lng in km. Default 25, max 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://bjjsquare/results-v1.html",
            "ui": {
              "resourceUri": "ui://bjjsquare/results-v1.html"
            }
          },
          "digest": "sha256:3caf012920671eed6821beefe6e2a5f5cebdd5b561929c8e20a7fa703ab836c0"
        },
        {
          "name": "get_gym",
          "title": "Get a BJJ gym",
          "description": "Public details of one gym by its slug (from find_gyms): address, website, affiliation, what it offers, class schedule when the gym has published one, and when the schedule was last updated. Only known facts are returned: a missing field means unknown, not \"no\". Phone and email are on the gym page linked in the result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "description": "Language of the returned bjjsquare.com links: it, en, es, pt, fr or de. Default en.",
                "enum": ["it", "en", "es", "pt", "fr", "de"],
                "type": "string"
              },
              "slug": {
                "description": "Gym slug, e.g. as returned by find_gyms.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://bjjsquare/results-v1.html",
            "ui": {
              "resourceUri": "ui://bjjsquare/results-v1.html"
            }
          },
          "digest": "sha256:2230decf9bf41a45dc43cc403c442e4716b8a5e870d6d8970ceadbeb20a2fd58"
        },
        {
          "name": "list_places",
          "title": "List covered places",
          "description": "Countries covered by BJJ Square with gym counts, or, with a country code, the cities of that country with gym counts (largest 200). Use it to check coverage before find_gyms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code. Omit to list countries.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Language of the returned bjjsquare.com links: it, en, es, pt, fr or de. Default en.",
                "enum": ["it", "en", "es", "pt", "fr", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eead85f2d09790a1016dea528acd93f62a35f7f66a303c2aac90f28ad7062267"
        }
      ],
