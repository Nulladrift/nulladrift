      "capabilities": {
        "tools": {}
      },
      "instructions": "TickTape gives independent preflight verdicts for Polymarket. Use preflight_trade before sending an order (OK/CAUTION/VETO with slippage, depth, fee drag), preflight_copy before copy-trading a wallet (COPY/WATCH/VETO), and leaderboard / red_list to choose or refuse wallets. Verdicts are deterministic arithmetic on live books - not predictions, not investment advice. Payment: live calls are paid. Send Authorization: Bearer tk_<wallet>_<secret> (credits token, bought once via x402 at POST https://ticktape.cc/api/credits) with your MCP requests for the fast paid lane, or pay per call via x402 directly on the REST endpoints. Unpaid live tool calls return the x402 payment terms as an isError result. Every tool accepts sandbox: true for a free deterministic example. Docs: https://ticktape.cc/llms.txt and https://ticktape.cc/auth.md",
      "tools": [
