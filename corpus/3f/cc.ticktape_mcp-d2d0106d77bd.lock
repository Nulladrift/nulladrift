        {
          "name": "preflight_copy",
          "title": "Preflight copy-trading a wallet",
          "description": "COPY / WATCH / VETO verdict for copy-trading a Polymarket wallet, with the numbers behind it (fee-inclusive copier ROI from a fixed $5-entry / +2c-slippage simulation, win rate, entry-price buckets, category mix). Wallets not yet computed return QUEUED free of charge - typically ready in minutes (retry_after_seconds tells you when); worst case about an hour. Price: $0.10 per call via x402 or 5 credits with a bearer token; sandbox: true is free.",
