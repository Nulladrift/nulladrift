                "type": "object"
              },
              "expires": {
                "description": "Credit expiry (12 months from purchase). Present only with a valid token.",
                "type": "string"
              },
              "how": {
                "description": "How to buy a pack (x402 payment on POST /api/credits).",
                "type": "string"
              },
