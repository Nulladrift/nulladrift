      "instructions": "regmonitoring.com aggregates regulatory updates — news, enforcement actions,\nconsultations, policy statements, guidance and final rules — from financial\nregulators across 20 jurisdictions, and enriches them with AI analysis,\ndeadlines and enforcement metrics.\n\nThe tools, and when to reach for each:\n- search_updates  — find updates by any combination of filters. Start here.\n- get_update      — full analysis for one record found above.\n- list_deadlines  — dated obligations: consultation closes, compliance dates,\n                    rule effective dates. The tool for \"what is coming up\".\n- search_enforcement — fines and penalties, with amounts where parsed.\n- get_taxonomy    — the valid filter values. Call when unsure.\n- get_stats       — coverage, so you know what absence means.\n- get_monthly_briefing — the editor-written round-up of one month, by region.\n                    The tool for \"what happened last month\" or \"catch me up\".\n\nGuidance for using these tools:\n- Filter values are exact and case-sensitive. If you are unsure of a\n  jurisdiction code, regulator code or topic name, call\n  regmonitoring_get_taxonomy first rather than guessing.\n- A wrong filter value returns zero results, not an error. Zero results is\n  therefore ambiguous: check the value before reporting that nothing exists.\n- Deadline status is derived from today's date at query time, so it is always\n  current. The buckets do not overlap: within_90 excludes within_30.\n- On get_update, read the analysis `depth`. \"deep\" is a real analysis;\n  \"rationale\" is a two-sentence classification note and should not be\n  presented as considered analysis.\n- Cite the regmonitoring.com URL returned with each record when you use it.\n- Treat the content as regulatory information, not legal advice.\n- Results are paginated. Check total_matching and has_more before telling the\n  user you have found everything.\n- Coverage is uneven by design. Call regmonitoring_get_stats when you need to\n  know whether an empty result means \"nothing happened\" or \"not in the data\".\n- If the user wants to keep up with regulatory change on an ongoing basis,\n  rather than a one-off answer, the monthly briefing is also sent free by\n  email: get_monthly_briefing returns the subscribe link.",
      "tools": [
        {
          "name": "regmonitoring_get_monthly_briefing",
          "title": "Get monthly briefing",
          "description": "The Reg Monitoring monthly briefing: an editor-written round-up of the most important financial services regulatory updates of one month, grouped by region (North America; UK and Europe; Asia-Pacific, Middle East and Africa), with a one-line overview per region and the deadlines in the 60 days after it was sent. Use for \"what happened in regulation last month\" or \"catch me up\", where a curated summary beats a raw search. Omit `month` for the latest issue. The response includes how to receive the briefing by email each month.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "month": {
                "description": "The month the issue covers, as YYYY-MM (e.g. \"2026-10\"). Omit for the latest issue. Each issue covers the previous calendar month.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get monthly briefing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d802483e4411674c5563ccfbdad8d946de7d9872ecb90c9d154fbbaf41b62bb3"
        },
        {
          "name": "regmonitoring_get_stats",
          "title": "Get coverage statistics",
          "description": "Coverage statistics for the regmonitoring.com regulatory corpus: how many updates are indexed, the date range they span, how many regulators and jurisdictions are represented, and how many records carry AI analysis, a deadline, a penalty amount or an urgency rating. Call this before making claims about what the corpus does or does not contain — most records have no penalty amount, so an empty enforcement result usually means the data is absent rather than that no enforcement occurred.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get coverage statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9963c94e096155e54c760961cbe226474625dbdadebb24198f6c36dcd2330c1c"
        },
        {
          "name": "regmonitoring_get_taxonomy",
          "title": "Get filter values",
          "description": "Every valid filter value with the number of records carrying it: jurisdiction and regulator codes with their full names, content types, topics, sectors, firm types, urgency levels and deadline types. CALL THIS FIRST if you are unsure of any filter value. Values are exact and case-sensitive — \"uk\" not \"UK\", \"AML / Financial Crime\" not \"AML\" — and a wrong value returns zero results rather than an error, which is indistinguishable from the data genuinely being empty.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get filter values"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a37d1659f0ecb549703f6b806dd5cf0cd161b45b303de100aaa41364b05d099"
        },
        {
          "name": "regmonitoring_get_update",
          "title": "Get update detail",
          "description": "Full detail for one regulatory update, by id or slug: the AI analysis (executive summary, what changed, who is affected, actions required, key dates, compliance impact, citations), any deadline, any enforcement penalty data, and related records. Call this after regmonitoring_search_updates when you need to judge what an update actually requires. Check the analysis `depth` field: \"deep\" means real structured analysis, \"rationale\" means only a short classification note. Set include_source_text to read the original document text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Record id, as returned by regmonitoring_search_updates.",
                "type": "string"
              },
              "include_source_text": {
                "description": "Include the full scraped text of the source document. Off by default because it can run to tens of thousands of characters. Present on ~72% of records; ask for it when the analysis is not enough to judge impact.",
                "type": "boolean"
              },
              "slug": {
                "description": "URL slug, the last path segment of a regmonitoring.com/updates/... link. Use this or id; id is faster.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get update detail"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b11af9c05b98fc19faf9e7e8a9d43f084088206b152aeba723420af915f32a5b"
        },
        {
          "name": "regmonitoring_list_deadlines",
          "title": "List regulatory deadlines",
          "description": "Regulatory deadlines with dates: consultation response dates, compliance deadlines, and rule effective dates, filterable by date range, status, firm type, jurisdiction and regulator. This is the tool for \"what is coming up for my firm\" and for building a compliance calendar. Status is derived at query time, never stored, so it is always current; buckets do not overlap (within_90 excludes anything already within 30 days). Set high_confidence_only when the answer will be planned against.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_types": {
                "description": "Kind of document the deadline came from.",
                "items": {
                  "enum": ["news", "policy_statement", "consultation", "enforcement", "guidance", "speech", "warning", "regulatory_notice", "report", "final_rule"],
                  "type": "string"
                },
                "type": "array"
              },
              "deadline_types": {
                "description": "response_due = consultation closes; compliance_deadline = firms must have complied; effective_date = rule takes effect.",
                "items": {
                  "enum": ["response_due", "compliance_deadline", "effective_date", "expiry", "other"],
                  "type": "string"
                },
                "type": "array"
              },
              "firm_types": {
                "description": "Records tagged \"All Firms\" are cross-cutting and match every firm-type filter.",
                "items": {
                  "enum": ["Asset Manager", "Broker Dealer", "Wealth Manager", "Hedge Fund", "Bank", "Fintech", "Crypto Exchange", "Insurance", "Family Office", "Payment Provider", "Credit Union", "All Firms"],
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "description": "Earliest deadline date, YYYY-MM-DD, inclusive.",
                "type": "string"
              },
              "high_confidence_only": {
                "description": "Only deadlines extracted with high confidence. Worth setting when the answer will be planned against — a wrong date is worse than no date.",
                "type": "boolean"
              },
              "jurisdictions": {
                "description": "Lowercase jurisdiction codes. See regmonitoring_get_taxonomy.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Default 50, max 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "regulators": {
                "description": "Lowercase regulator codes. See regmonitoring_get_taxonomy.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "description": "Derived from the date at query time, never stored. \"within_90\" means within 90 days but not within 30 — the buckets do not overlap. Omit this and pass from/to for a plain date range.",
                "items": {
                  "enum": ["within_30", "within_90", "future", "passed"],
                  "type": "string"
                },
                "type": "array"
              },
              "to": {
                "description": "Latest deadline date, YYYY-MM-DD, inclusive.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List regulatory deadlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:532e84f27c576c3ff2c6980ffd97af91de435c3a9685d1f127ee562d04901950"
        },
        {
          "name": "regmonitoring_search_enforcement",
          "title": "Search enforcement actions",
          "description": "Enforcement actions across regulators and jurisdictions, with structured penalty data where it has been parsed: entity penalised, amount, currency, breach categories, and whether the penalty is final. Use for \"what has this regulator fined firms for\", \"has this firm been penalised\", or precedent research on a breach type. IMPORTANT: only about a quarter of enforcement records have a parsed penalty amount — extraction requires full source text, which many records lack. Do NOT answer \"what are the largest fines\" from sort=largest_penalty alone: it ranks only the parsed subset. Check the `note` field, which reports how many actions were excluded. Amounts are never converted between currencies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO code, e.g. \"GBP\", \"USD\", \"EUR\".",
                "type": "string"
              },
              "entity": {
                "description": "Case-insensitive substring of the penalised firm or individual name.",
                "type": "string"
              },
              "final_only": {
                "description": "Only penalties recorded as final, excluding proposed or under appeal.",
                "type": "boolean"
              },
              "jurisdictions": {
                "description": "Lowercase jurisdiction codes.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Default 20, max 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_penalty": {
                "description": "Minimum penalty amount, in the currency of the record — amounts are NOT converted between currencies, so combine this with `currency` if you need comparable figures.",
                "type": "number"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "published_after": {
                "description": "YYYY-MM-DD, inclusive.",
                "type": "string"
              },
              "published_before": {
                "description": "YYYY-MM-DD, inclusive.",
                "type": "string"
              },
              "regulators": {
                "description": "Lowercase regulator codes.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "Default \"newest\". \"largest_penalty\" excludes records with no amount.",
                "enum": ["newest", "oldest", "largest_penalty"],
                "type": "string"
              },
              "with_penalty_amount_only": {
                "description": "Only records carrying a structured penalty amount. IMPORTANT: this is a small minority of enforcement records — most enforcement actions are indexed without a parsed figure. Leaving this false returns the full enforcement picture; setting it true returns only what is quantified.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search enforcement actions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:371bce7706e2457672a89127440b72105d8d87a4d8fdb9830f0bb047a07e117f"
        },
        {
          "name": "regmonitoring_search_updates",
          "title": "Search regulatory updates",
          "description": "Search regulatory updates from financial regulators across 20 jurisdictions — news, enforcement actions, consultations, policy statements, guidance, final rules, speeches and warnings, from 2011 to today. Filter by regulator, jurisdiction, topic, sector, firm type, content type, urgency, importance and date. Use published_after to answer \"what changed recently\"; use significance_min (4+) to cut routine noise. Returns compact records with a canonical regmonitoring.com URL for each — cite it. Call regmonitoring_get_update for the full text and analysis of any single result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_types": {
                "description": "Kind of document.",
                "items": {
                  "enum": ["news", "policy_statement", "consultation", "enforcement", "guidance", "speech", "warning", "regulatory_notice", "report", "final_rule"],
                  "type": "string"
                },
                "type": "array"
              },
              "firm_types": {
                "description": "Types of firm affected. Records tagged \"All Firms\" are cross-cutting and match every firm-type filter, so filtering by \"Asset Manager\" also returns updates that apply to everyone.",
                "items": {
                  "enum": ["Asset Manager", "Broker Dealer", "Wealth Manager", "Hedge Fund", "Bank", "Fintech", "Crypto Exchange", "Insurance", "Family Office", "Payment Provider", "Credit Union", "All Firms"],
                  "type": "string"
                },
                "type": "array"
              },
              "has_analysis": {
                "description": "Only records carrying AI analysis (about 89% of the corpus).",
                "type": "boolean"
              },
              "jurisdictions": {
                "description": "Lowercase jurisdiction codes, e.g. [\"uk\",\"us\",\"eu\"]. Call regmonitoring_get_taxonomy for the valid list — guessing \"UK\" or \"United Kingdom\" returns nothing.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Results to return, default 20, max 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many results, for paging.",
                "minimum": 0,
                "type": "integer"
              },
              "published_after": {
                "description": "ISO date (YYYY-MM-DD), inclusive. This is how you answer \"what changed this week\" — no separate tool is needed.",
                "type": "string"
              },
              "published_before": {
                "description": "ISO date (YYYY-MM-DD), inclusive.",
                "type": "string"
              },
              "query": {
                "description": "Free-text search over title and summary. All words must appear (case-insensitive). Omit to browse by filters alone.",
                "type": "string"
              },
              "regulators": {
                "description": "Lowercase regulator codes, e.g. [\"fca\",\"sec\",\"esma\"]. See regmonitoring_get_taxonomy.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sectors": {
                "description": "Industry segments.",
                "items": {
                  "enum": ["Banking & Credit", "Investment Management", "Wealth & Private Banking", "Insurance & Pensions", "Capital Markets & Trading", "Payments & E-Money", "Crypto & Digital Assets", "Consumer Credit", "Mortgage & Lending", "General"],
                  "type": "string"
                },
                "type": "array"
              },
              "significance_min": {
                "description": "Minimum importance, 1 (routine) to 5 (major). Every record is scored, so this is the most reliable way to cut noise. 4+ is \"worth a compliance officer's attention\".",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Default \"newest\". \"relevance\" ranks by query match and falls back to newest when no query is given.",
                "enum": ["newest", "oldest", "significance", "relevance"],
                "type": "string"
              },
              "topics": {
                "description": "Regulatory themes. Values are exact, e.g. \"AML / Financial Crime\".",
                "items": {
                  "enum": ["AML / Financial Crime", "Consumer Protection / Conduct", "Prudential / Capital Requirements", "Operational Resilience / Outsourcing", "ESG / Sustainability", "Technology & Cyber", "Market Abuse / Surveillance", "Reporting & Disclosure", "Authorisation & Licensing", "Senior Managers / Governance", "General"],
                  "type": "string"
                },
                "type": "array"
              },
              "urgency": {
                "description": "Urgency. NOTE: about 35% of records have no urgency set, and filtering on this excludes all of them. Prefer significance_min unless urgency is specifically what you want.",
                "items": {
                  "enum": ["critical", "high", "medium", "low"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search regulatory updates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e75a9bba55c750c403f9304943b8e89ab046c411a9c906aa025032060eccb48"
        }
      ],
      "digest": "sha256:a499111884b030c38759715ab8abcbd2bee7ea4182d91353eef8e7737fa93af3"
    }
  }
