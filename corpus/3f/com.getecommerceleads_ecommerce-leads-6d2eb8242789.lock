        {
          "name": "exportStores",
          "title": "Export revealed stores",
          "description": "Export revealed stores as CSV text. Stores you have not revealed are skipped. The result holds the header row and at most 200 data rows; it says when it cut the rows. For a larger export, narrow the selection or download the file in the dashboard. Paid plans only.",
          "inputSchema": {
            "properties": {
              "selection": {
                "description": "The stores to price. Pass either \"ids\", or \"tab\" with optional \"filters\" and \"deselected\".",
                "properties": {
                  "deselected": {
                    "description": "Store ids to leave out of a tab selection.",
                    "items": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "filters": {
                    "description": "Filters for the tab, in the searchStores format.",
                    "items": {
                      "properties": {
                        "column": {
                          "description": "A column key, for example \"Industry\" or \"Total Traffic\". Call searchStores with includeColumns true to see all keys.",
                          "type": "string"
                        },
                        "operator": {
                          "description": "Text columns: contains, notContains, is, isNot. Number columns: gt, gte, lt, lte, eq. Date columns: is, isBefore, isAfter, isWithinLast. Tag columns: hasAny, notHas. All types: isEmpty, isNotEmpty, exists, notExists.",
                          "enum": ["contains", "notContains", "is", "isNot", "isEmpty", "isNotEmpty", "exists", "notExists", "gt", "gte", "lt", "lte", "eq", "isBefore", "isAfter", "isWithinLast", "hasAny", "notHas"],
                          "type": "string"
                        },
                        "value": {
                          "description": "The value to compare. A number for number columns, a YYYY-MM-DD date for isBefore and isAfter, a number of days for isWithinLast. Leave it out for isEmpty, isNotEmpty, exists and notExists."
                        }
                      },
                      "required": ["column", "operator"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "ids": {
                    "description": "Store ids (the storeId field of a searchStores row).",
                    "items": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "type": "array"
                  },
                  "tab": {
                    "description": "all, revealed, set:{id} or watchlist:{id}. Prices every store in the tab after the filters.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "visibleColumns": {
                "description": "Optional. The column names to export. Leave it out for all columns.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["selection"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Export revealed stores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2383fb90b9ce79f46b11db694665c380ccfbaad435ba0b8288367ea915d9148a"
