      "instructions": "This server looks up ecommerce stores by domain. The lookupStore tool returns data for one store domain per call: estimated revenue, marketing budget, traffic, Google and Meta ad spend, ad counts, a Conversion Rate Score, buying signals, and social and ad-library URLs.",
      "tools": [
        {
          "name": "addToWatchlist",
          "title": "Add stores to a watchlist (spends credits)",
          "description": "Add domains to a watchlist (merge, nothing is removed). THIS SPENDS CREDITS: 1 credit per domain that is new to the list. Before you call it, tell the user the cost of 1 credit per store and how many domains you will add, then ask the user to confirm. Never call it without the confirmation. If you have too few credits, the result shows the cost and your balance, and nothing is added. Paid plans only.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "The store domains to add, for example example.com. At most 50 per call.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "listId": {
                "description": "The list id from listWatchlists.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["domains", "listId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
