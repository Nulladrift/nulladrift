        {
          "name": "searchStores",
          "title": "Search stores",
          "description": "Search the store catalog like the Ecommerce Leads dashboard. Returns 30 rows per page. Stores you have not revealed show masked values for the hidden fields; revealed stores show the real values. By default, each row has storeId, 9 key columns (Industry, Country, revenue, Total Traffic, Google and Meta ad spend, Buying Signals, Buying Signals List, Status) and a short \"reveal\" object (revealed, contactTypes, pendingTypes). Use the columns argument to choose other columns, or [\"*\"] for all columns and the full reveal object. The result has the column list only when includeColumns is true. The result has the exact total. If the count fails, the result has totalAtLeast (a lower bound that grows on each page) and a note. Use hasMore to decide whether to fetch the next page, and do not report totalAtLeast as the number of matches. When other active stores use the same base domain, the row has sharedMetrics {basedomain, relatedStoreCount}. Those stores show the same traffic and ad numbers, because the data belongs to the base domain.",
          "inputSchema": {
            "properties": {
              "columns": {
                "description": "The column keys to return in each row. Use [\"*\"] for all columns. If you omit it, the default set is returned. An unknown key gives an error that lists the valid keys.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "filters": {
                "description": "Column filters. All filters must match.",
                "items": {
                  "properties": {
                    "column": {
                      "description": "A column key, for example \"Industry\" or \"Total Traffic\". Call searchStores with includeColumns true to see all keys.",
                      "type": "string"
                    },
                    "operator": {
                      "description": "Text columns: contains, notContains, is, isNot. Number columns: gt, gte, lt, lte, eq. Date columns: is, isBefore, isAfter, isWithinLast. Tag columns: hasAny, notHas. All types: isEmpty, isNotEmpty, exists, notExists.",
                      "enum": ["contains", "notContains", "is", "isNot", "isEmpty", "isNotEmpty", "exists", "notExists", "gt", "gte", "lt", "lte", "eq", "isBefore", "isAfter", "isWithinLast", "hasAny", "notHas"],
                      "type": "string"
                    },
                    "value": {
                      "description": "The value to compare. A number for number columns, a YYYY-MM-DD date for isBefore and isAfter, a number of days for isWithinLast. Leave it out for isEmpty, isNotEmpty, exists and notExists."
                    }
                  },
                  "required": ["column", "operator"],
                  "type": "object"
                },
                "type": "array"
              },
              "includeColumns": {
                "description": "Set to true to get the column list (key, label, type) in the result. Default false.",
                "type": "boolean"
              },
              "page": {
                "description": "Page number, starting at 1.",
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "properties": {
                  "column": {
                    "description": "A column key, for example \"Industry\" or \"Total Traffic\". Set includeColumns to true to see all keys.",
                    "type": "string"
                  },
                  "direction": {
                    "enum": ["asc", "desc"],
                    "type": "string"
                  }
                },
                "required": ["column"],
                "type": "object"
              },
              "tab": {
                "description": "Which stores to search: all (default), revealed, set:{id} for a signal set, or watchlist:{id} for a watchlist. Free plans can use all and revealed only.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
