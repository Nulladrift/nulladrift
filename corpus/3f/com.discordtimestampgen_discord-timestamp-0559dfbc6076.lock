{
  "lockfileVersion": 2,
  "subjects": {
    "com.discordtimestampgen/discord-timestamp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://discordtimestampgen.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "discordtimestampgen",
        "title": "Discord Timestamp Generator",
        "version": "1.0.0",
        "websiteUrl": "https://discordtimestampgen.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Builds Discord <t:UNIX:FORMAT> timestamp codes that show in every reader's own timezone, converts Unix time, and decodes Discord snowflake IDs into creation dates. Previews are rendered in UTC; Discord localises them per reader.",
      "tools": [
        {
          "name": "decode_discord_snowflake",
          "title": "Decode a Discord ID",
          "description": "Get the creation date of any Discord user, message, channel or server ID (snowflake), plus its worker, process and increment fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The snowflake (e.g. 175928847299117063) or a Discord message link.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dce786f4c2223e92640838e1ca85181289d1951cbd83e4e55ae0da519f412233"
        },
        {
          "name": "discord_timestamp",
          "title": "Make a Discord timestamp",
          "description": "Turn a moment in time into Discord timestamp codes like <t:1767225600:F>. Give either `unix`, an ISO `datetime` with offset, or a local `date` + `time` + IANA `timezone` (best when the user says e.g. \"8pm New York time\"). Omit `format` to get all 7 styles (t, T, d, D, f, F, R).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Local date YYYY-MM-DD (use with time and timezone).",
                "type": "string"
              },
              "datetime": {
                "description": "ISO 8601 with UTC offset, e.g. 2026-12-25T09:00:00-05:00.",
                "type": "string"
              },
              "format": {
                "description": "One Discord style. Omit for all.",
                "enum": ["t", "T", "d", "D", "f", "F", "s", "S", "R"],
                "type": "string"
              },
              "time": {
                "description": "Local time HH:MM, 24-hour.",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone, e.g. America/New_York.",
                "type": "string"
              },
              "unix": {
                "description": "Unix time in seconds or milliseconds.",
                "type": ["integer", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97bba268f6e7dd84d2b9c8ffd43ae4595f0507ed6fb5287f4e45af0b1fb8443d"
        }
      ],
      "digest": "sha256:0591696df6fefc87c0853953913ce68a3e30074d8ccc4c3fec5ead23461b86dc"
    }
  }
}
