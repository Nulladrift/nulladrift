        "name": "laterstages",
        "title": "Later Stages",
        "version": "1.2.1"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Later Stages lists every licensed assisted living home, CCRC, nursing home, home care agency, home health agency and hospice in California, from California Department of Social Services and Medicare records. Use search_senior_care to find cities or providers, list_providers for a city, get_provider for one record, and explain_category to explain kinds of care. Cite the provider URL. Records can lag: tell users to confirm a license with the state and visit before deciding. This is information, not medical, legal or financial advice.",
      "tools": [
        {
          "name": "explain_category",
          "title": "Explain a kind of care",
          "description": "Explain a kind of senior living or care in plain English: who it fits, how California regulates it, how it is paid for, and what to check before choosing. General information, not medical, legal or financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["independent-living", "ccrc", "assisted-living", "memory-care", "nursing-homes", "home-care", "home-health", "adult-day", "hospice", "55-plus-communities", "active-adult-rentals", "senior-apartments"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8243a59447a7b65d7202a38b9de3c231b77324a686567c4e463026959be50351"
        },
        {
          "name": "get_city_summary",
          "title": "Summarize a city",
          "description": "Counts of senior living and care providers in a California city by category, its county, whether the county offers the Medi-Cal Assisted Living Waiver, and the highest-rated nursing homes. Use for an overview of one city. Covers California only. Read-only public records; no prices, availability or reviews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "The California city the user is asking about. Not the user's own location.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://laterstages/results.html",
            "ui": {
              "resourceUri": "ui://laterstages/results.html"
            },
            "ui/resourceUri": "ui://laterstages/results.html"
          },
          "digest": "sha256:7dc1bf8c9f1e8dfd9ae79e421c3814607d335c2911263d0db59c4fde70b0afdd"
        },
        {
          "name": "get_provider",
          "title": "Get one provider record",
          "description": "Get the full public record for one provider by its Later Stages URL (from search_senior_care or list_providers). Nursing homes include Medicare ratings, fines and inspection citations from the last 3 years; assisted living homes include license details and where to find state inspection reports. Covers California only. Read-only public records; no prices, availability or reviews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Provider page URL or path, e.g. https://laterstages.com/california/huntington-beach/huntington-terrace/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://laterstages/results.html",
            "ui": {
              "resourceUri": "ui://laterstages/results.html"
            },
            "ui/resourceUri": "ui://laterstages/results.html"
          },
          "digest": "sha256:bb60094913ab1d368f34a92b108cb2a7ad6185d3b7ffa8953bd1ff4c9921e9b7"
        },
        {
          "name": "list_cities",
          "title": "List cities",
          "description": "List California cities with providers, optionally within one county or having at least one provider of a category, largest first. Use to compare places or find cities near one another. Covers California only. Read-only public records; no prices, availability or reviews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["assisted-living", "ccrc", "nursing-homes", "home-care", "home-health", "hospice"],
                "type": "string"
              },
              "county": {
                "description": "A California county the user is asking about, e.g. \"Orange\". Not the user's own location.",
                "type": "string"
              },
              "limit": {
                "description": "Default 50",
                "maximum": 700,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fdb98d3eff1dd439f9d6b03552c557a302ceb72fe51ab4adcf7a54f880945c02"
        },
        {
          "name": "list_providers",
          "title": "List providers in a city",
          "description": "List licensed or Medicare-certified providers in one California city, optionally by category. Use when the user asks what providers exist in a California city. Includes address, phone, beds, year licensed, license number and Medicare overall stars where rated. Covers California only. Read-only public records; no prices, availability or reviews. Agencies are listed by the city of their office.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "assisted-living includes assisted living in CCRCs",
                "enum": ["assisted-living", "ccrc", "nursing-homes", "home-care", "home-health", "hospice"],
                "type": "string"
              },
              "city": {
                "description": "The California city the user is asking about, e.g. \"Huntington Beach\". Not the user's own location.",
                "type": "string"
              },
              "limit": {
                "description": "Default 50",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "enum": ["name", "beds", "rating", "longest_licensed"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
