          "digest": "sha256:2a422d46c54f8c244f054f2474b32e5c687130fa56ad47c471b436ea71e73937"
        },
        {
          "name": "search_senior_care",
          "title": "Search cities and providers",
          "description": "Search California cities and licensed senior living and care providers by name. Use when the user names a provider or a California place. Returns matching cities with provider counts and matching providers with their Later Stages URLs. Covers California only. Read-only public records; no prices, availability or reviews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max providers (default 15)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A provider name or the California place the user is asking about, e.g. \"Irvine\" or \"Sunrise of\". Not the user's own location.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
