        {
          "name": "fetch",
          "title": "Fetch one document (ChatGPT connector contract)",
          "description": "Returns one knowledge record in full, by the string id a search result gave: title, the full text in the source's words, the URL to cite, and metadata with the source, licence and date. It is the ChatGPT connector counterpart of get_entity, which gives only an excerpt. Use it after search, or with a search_knowledge id as a string. Give field, a JSON pointer such as /questIds, to read one value of the record's data: text then holds that value as JSON, and an array comes in pages of up to 48 rows with nextOffset for the next page. A long array in a whole record is cut at 48 rows. The text block is the same JSON as a string.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "field": {
                "description": "A JSON pointer into the record's data, such as /criteria or /reagents/0. Without it, the whole record.",
                "maxLength": 200,
                "type": "string"
              },
              "id": {
                "description": "An id from a search result.",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "description": "Rows per answer, default and at most 48.",
                "maximum": 48,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Row to start at when the field is an array; default 0. Use nextOffset from the last answer.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "field": {
                "additionalProperties": false,
                "description": "Present when field was given and found.",
                "properties": {
                  "nextOffset": {
                    "description": "Present when more rows remain: pass it as offset.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "pointer": {
                    "type": "string"
                  },
                  "value": {
                    "description": "The value at the pointer. An array is one page of up to 48 rows."
                  }
                },
                "required": ["pointer", "value"],
                "type": "object"
              },
              "id": {
                "description": "The record id as a string.",
                "type": "string"
              },
              "keys": {
                "description": "Present when field was given and not found: the keys of the deepest object the pointer reached. Empty when the record has no structured data.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "confirmed": {
                    "additionalProperties": false,
                    "description": "Present when player uploads confirm this game-file entry (3 or more installs agree). asOf is the date the rollup was current.",
                    "properties": {
                      "asOf": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["asOf"],
                    "type": "object"
                  },
                  "credit": {
                    "description": "The credit line to show with the text.",
                    "type": "string"
                  },
                  "gameVersion": {
                    "enum": ["forever", "classic", "retail", "lore"],
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["item", "npc", "object", "quest", "zone", "spell", "lore_page", "creator", "realm", "achievement", "faction", "title", "quest_chain", "mount", "legacy_perk", "race", "instance", "build"],
                    "type": "string"
                  },
                  "licence": {
                    "description": "The source's licence, such as CC-BY-SA-4.0.",
                    "type": "string"
                  },
                  "retrievedAt": {
                    "description": "When the source was read.",
                    "type": "string"
                  },
                  "sourceId": {
                    "type": "string"
                  },
                  "sourceUrl": {
                    "description": "Where the record came from. Keep it with the text.",
                    "type": "string"
                  }
                },
                "required": ["credit", "gameVersion", "kind", "licence", "retrievedAt", "sourceId", "sourceUrl"],
                "type": "object"
              },
              "text": {
                "description": "The whole record, in the source's words.",
                "type": "string"
              },
              "title": {
                "description": "The record's name.",
                "type": "string"
              },
              "url": {
                "description": "Where the record is read, as in search.",
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch one document (ChatGPT connector contract)"
          },
          "behavior": {
            "destructive": false,
