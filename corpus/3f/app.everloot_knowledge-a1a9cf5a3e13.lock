      "serverInfo": {
        "name": "everloot-knowledge",
        "title": "Everloot",
        "version": "0.9.1",
        "description": "World of Warcraft: Forever facts, game-file metadata and historical lore, with sources and dates.",
        "websiteUrl": "https://github.com/Everloot/everloot",
        "icons": [
          {
            "src": "https://everloot.app/icon-64.png",
            "mimeType": "image/png",
            "sizes": ["64x64"]
          },
          {
