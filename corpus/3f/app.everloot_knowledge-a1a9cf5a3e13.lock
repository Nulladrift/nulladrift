        {
          "name": "everloot_plan",
          "title": "Everloot implementation tracker",
          "description": "Returns the Everloot feature catalogue: what is live, what is next, what is waiting, and which reference sites are page shapes only, as the tracker that ships with the site holds it. Use it only for questions about Everloot itself, such as whether a feature exists; it holds no game data. For game facts use search_knowledge or answer_sources; for community addons use ecosystem_projects. With no arguments it returns the whole tracker, every row with what done means, as it always has. Any argument returns a bounded page instead: a summary of the counts and each row's id, name and how far it is proven, 40 rows at a time; detail adds what done means (10 rows at a time) and status narrows to one section. A page holds fewer rows when more would pass 12000 bytes, states the tracker revision (the tracker records no date), and when partial gives nextOffset; pass it as offset with the same arguments for the rest. Needs no account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "detail": {
                "description": "On a page, true adds each row's done-when text. Default false: id, name and how far it is proven. With no arguments at all, the whole tracker with done text.",
                "type": "boolean"
              },
              "limit": {
                "description": "Rows per answer: default 40, or 10 with detail; at most 100, and fewer when more would pass 12000 bytes.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Row to start at, default 0. Use nextOffset from the last answer.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "Only rows with this status: live, next, waiting or shape. Without it, every row.",
                "enum": ["live", "next", "waiting", "shape"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "counts": {
                "additionalProperties": false,
                "description": "Rows per status in the whole tracker, whatever status, offset and limit ask for.",
                "properties": {
                  "live": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "next": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "shape": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "waiting": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["live", "next", "shape", "waiting"],
                "type": "object"
              },
              "dataAsOf": {
                "description": "The tracker's date. Always null: the tracker records no date, so it is unknown.",
                "type": ["string", "null"]
              },
              "index": {
                "description": "Id, status, name and proof, in the tracker's order: every row with no arguments, this answer's rows on a summary page; absent on a detail page.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "proof": {
                      "description": "The furthest the row is proven.",
                      "enum": ["none", "code", "deployed", "client", "public", "real-data"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["live", "next", "waiting", "shape"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextOffset": {
                "description": "Present when more rows remain, counted from the rows this page holds: pass it as offset with the same arguments.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "offset": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "revision": {
                "description": "A hash of the tracker's rows. Pages with different revisions came from different trackers: start again from offset 0.",
                "type": "string"
              },
              "rows": {
                "description": "With no arguments, every row with what done means, in the tracker's order. On a page: with detail, this answer's rows; empty in a summary, which lists them in index.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "done": {
                      "description": "What done means, or why this row is not a build.",
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "proof": {
                      "description": "The furthest the row is proven.",
                      "enum": ["none", "code", "deployed", "client", "public", "real-data"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["live", "next", "waiting", "shape"],
                      "type": "string"
                    }
                  },
                  "required": ["done", "id", "name", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Rows matching status. On a page only, like the fields after it.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "url": {
                "description": "The whole tracker as one page.",
                "type": "string"
              }
            },
            "required": ["counts", "rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Everloot implementation tracker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d75f197e15fd325197d0e5d8f8a3ed723b7bb3f4a5b040e0a63179cf65dc360a"
