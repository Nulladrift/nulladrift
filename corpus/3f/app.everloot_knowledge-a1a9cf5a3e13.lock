        {
          "name": "entity_relations",
          "title": "How an item, NPC, spell or quest connects to others",
          "description": "Lists every typed relation of one entity, in both directions, grouped by relation. Player-observed relations (dropped by, sold by, reward from, located in) are listed where 3 installs agree, with the install count and last seen. Game-file relations (created by, reagent for, part of set, same icon) are found in game files, unconfirmed, with the build they came from. Ids are verified game ids from search_knowledge, a page tool, a drop row or world_map_near. For an NPC's drops use kind=npc, rel=dropped_by, direction=to; for an item's sources use kind=item, direction=from. Use it for where something comes from or what something drops, sells or rewards; use the page tools (item_page, npc_page, quest_page) for one entity's own facts, and world_map_near for what is near a place. Reads Everloot's public player data and the game-file relations of the current build.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "direction": {
                "default": "both",
                "description": "from: what this entity points to (an item's sources). to: what points at it (what an NPC drops). Default both.",
                "enum": ["from", "to", "both"],
                "type": "string"
              },
              "id": {
                "description": "The game's id for it, such as item 19019.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "kind": {
                "description": "What the id names. A zone is a UiMap id, as on /map.",
                "enum": ["item", "spell", "npc", "object", "quest", "zone", "item_set", "icon", "skill"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Most lines per relation, 1 to 100, default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "rel": {
                "description": "Only this relation. Without it, every relation.",
                "enum": ["dropped_by", "sold_by", "reward_from", "located_in", "created_by", "reagent_for", "part_of_set", "same_icon", "in_skill_line"],
                "type": "string"
              }
            },
            "required": ["id", "kind"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "connected": {
                "description": "False when no corpus was read; the page is then absent, which is not a measured zero.",
                "type": "boolean"
              },
              "dataAsOf": {
                "description": "The corpus snapshot time, or null when unrecorded.",
