                "maximum": 9007199254740991,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "description": "Most guilds listed, 1 to 100, default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "realm": {
                "description": "Only guilds on this realm. Without it, every realm.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "connected": {
                "description": "False when no corpus was read; the page is then absent, which is not a measured zero.",
                "type": "boolean"
              },
              "dataAsOf": {
                "description": "The corpus snapshot time, or null when unrecorded.",
                "type": ["string", "null"]
