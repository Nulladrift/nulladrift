        {
          "name": "get_by_name",
          "title": "Get records by exact name",
          "description": "Returns records matching a known exact full name, case-insensitively, optionally narrowed by kind. Use search_knowledge for partial names or when this exact lookup misses; no exact match does not mean no gameplay facts exist. Check kind, gameVersion and sourceKind before choosing: lore is archive background and has no gameId. Pass recordId (also id) to get_entity or fetch as a string; pass the separate verified gameId to item_page, npc_page, object_page or quest_page. A zone gameId, as a string, goes to world_map_near.zone. Several kinds can share a name; never guess a game id from a lore record.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Narrow to one record kind. item, npc, object and quest include names 3 installs agree on; zone uses released UiMap ids from the game files. achievement, faction, title, quest_chain, mount, legacy_perk, race and instance come from the game files (found in game files, unconfirmed); spell, lore_page, creator and realm come from the knowledge release; build is an Everloot team starter talent build, not observed. Without it, every kind.",
                "enum": ["item", "npc", "object", "quest", "zone", "spell", "lore_page", "creator", "realm", "achievement", "faction", "title", "quest_chain", "mount", "legacy_perk", "race", "instance", "build"],
                "type": "string"
              },
              "name": {
                "description": "The full record name, any case, up to 200 characters.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hits": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "build": {
                      "description": "Game-file build this metadata was read from; not inferred for observed names.",
                      "type": "string"
                    },
                    "confirmed": {
                      "additionalProperties": false,
                      "description": "Present when player uploads confirm this game-file entry (3 or more installs agree). asOf is the date the rollup was current.",
                      "properties": {
                        "asOf": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["asOf"],
                      "type": "object"
