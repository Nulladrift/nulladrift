        {
          "name": "search_knowledge",
          "title": "Search the Everloot knowledge base",
          "description": "Searches partial names, keywords or a topic across agreed gameplay names, released zones, reference catalogs (achievements, factions, titles, quest chains, mounts, legacy perks, races, instances) and the lore archive; exact-name matches rank first. Use get_by_name only for a known exact full name. Check kind, gameVersion and sourceKind: lore is historical background, not current Forever gameplay. Pass recordId (also id) to get_entity, or fetch as a string; pass a verified gameId to item_page, npc_page, object_page or quest_page. For world_map_near.zone stringify the zone gameId. Lore has no gameId; never turn an archive id or URL number into a game id. Hits carry source, licence and date, plus build or observed snapshot support where available. For achievements, factions, titles and quest chains, read generic records with get_entity and field pagination. Use answer_sources for cited evidence; search is the ChatGPT connector counterpart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Narrow to one record kind. item, npc, object and quest include names 3 installs agree on; zone uses released UiMap ids from the game files. achievement, faction, title, quest_chain, mount, legacy_perk, race and instance come from the game files (found in game files, unconfirmed); spell, lore_page, creator and realm come from the knowledge release; build is an Everloot team starter talent build, not observed. Without it, every kind.",
                "enum": ["item", "npc", "object", "quest", "zone", "spell", "lore_page", "creator", "realm", "achievement", "faction", "title", "quest_chain", "mount", "legacy_perk", "race", "instance", "build"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Most hits, 1 to 25, default 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look up: names, questions, keywords. Question words are ignored.",
                "maxLength": 1000,
                "type": "string"
              },
              "version": {
                "description": "Narrow to one game version: forever, classic, retail or lore. Without it, every version.",
                "enum": ["forever", "classic", "retail", "lore"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hits": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "build": {
                      "description": "Game-file build this metadata was read from; not inferred for observed names.",
                      "type": "string"
                    },
                    "confirmed": {
                      "additionalProperties": false,
                      "description": "Present when player uploads confirm this game-file entry (3 or more installs agree). asOf is the date the rollup was current.",
                      "properties": {
                        "asOf": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["asOf"],
                      "type": "object"
                    },
                    "extId": {
                      "description": "The source's own id, such as a wiki page title.",
                      "type": "string"
                    },
                    "gameId": {
                      "description": "Gameplay id: itemId for item_page, npcId for npc_page, questId for quest_page, objectId for object_page; a zone is a UiMap id for world_map_near.zone. Absent for lore, reference and other catalog kinds (including instances, whose extId is a Map.db map id, not a UiMap id).",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "gameVersion": {
                      "enum": ["forever", "classic", "retail", "lore"],
                      "type": "string"
                    },
                    "id": {
                      "description": "The record id, for get_entity.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["item", "npc", "object", "quest", "zone", "spell", "lore_page", "creator", "realm", "achievement", "faction", "title", "quest_chain", "mount", "legacy_perk", "race", "instance", "build"],
                      "type": "string"
                    },
                    "licence": {
                      "description": "The source's licence, such as CC-BY-SA-4.0.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "observed": {
                      "additionalProperties": false,
                      "description": "Name agreed by 3 or more installs. asOf is the corpus snapshot time, not the last observation time.",
                      "properties": {
                        "asOf": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["asOf"],
                      "type": "object"
                    },
                    "recordId": {
                      "description": "Alias of id. Pass to get_entity or fetch, never a gameplay tool.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "retrievedAt": {
                      "description": "When the source was read.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "A short excerpt, in the source's words.",
                      "type": "string"
                    },
                    "sourceId": {
                      "type": "string"
                    },
                    "sourceKind": {
                      "description": "Observed names are agreed by 3 installs; game-files facts remain unconfirmed. Lore is historical archive text, not current gameplay evidence.",
                      "enum": ["observed", "game-files", "lore", "reference"],
                      "type": "string"
                    },
                    "sourceUrl": {
                      "description": "Where the record came from. Keep it with the text.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The record's page on everloot.app, absolute: an indexed lore page or a catalog page. Absent for a record the site has no page for.",
                      "type": "string"
                    }
                  },
                  "required": ["extId", "gameVersion", "id", "kind", "licence", "name", "retrievedAt", "snippet", "sourceId", "sourceUrl"],
                  "type": "object"
                },
                "type": "array"
