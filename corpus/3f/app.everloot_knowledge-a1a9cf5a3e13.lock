        {
          "name": "market_value",
          "title": "Forever market value for one item",
          "description": "Returns one item's market value, historical value, minimum buyout and units listed from uploaded full auction scans on one Forever realm. Daily values are medians of reporters' values; a day needs 3 reporters from distinct addresses, or Everloot's own installs while few players upload, labelled with counts. Market value weights public days up to 14 calendar days old toward recent days, excluding thin days (5 units or fewer) and outliers. Historical is the median over 60 calendar days, using non-thin days when present. Use the full realm name (CAMWOW US1 Realm 4 PvP), or a unique whole-word suffix of at least two words. Ambiguous or unknown names return candidates; select a full name and retry. Text lists each auction house separately; structured content uses the house with most units listed (ties: Alliance, Horde, Neutral), named in the text. No input selects a house; never blend their prices. Preserve scan dates and corpus age: the minimum is a recorded scan, not a live offer. Use auction_history for dated history and vendor_page for vendor prices. Get a verified item gameId via search_knowledge first if needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "itemId": {
                "description": "The game's item id, as item_page takes it.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "realm": {
                "description": "The realm's full name as the game's realm list shows it, such as CAMWOW US1 Realm 4 PvP. A whole-word suffix of at least two words matching exactly one realm's full name (US1 Realm 4 PvP) is read as that realm; an unknown or ambiguous name answers with the realms to ask with.",
                "type": "string"
              }
            },
            "required": ["itemId", "realm"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "connected": {
                "description": "False when no corpus was read; the page is then absent, which is not a measured zero.",
                "type": "boolean"
              },
              "dataAsOf": {
                "description": "The corpus snapshot time, or null when unrecorded.",
                "type": ["string", "null"]
              },
              "page": {
                "additionalProperties": false,
                "properties": {
                  "askedRealm": {
                    "description": "The realm as asked, when it was read as an alias.",
                    "type": "string"
                  },
                  "candidates": {
                    "description": "For ambiguous or unknown: the realms with public prices to ask with instead, closest first.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "history": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "day": {
                          "type": "string"
                        },
                        "market": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "min": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "quantity": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "reporters": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "thin": {
                          "type": "boolean"
                        }
                      },
                      "required": ["day", "market", "min", "quantity", "reporters", "thin"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "itemId": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "realm": {
                    "type": "string"
                  },
                  "realmStatus": {
                    "description": "exact: a realm Everloot holds scans for. alias: the end of exactly one public realm's full name, read as that realm (realm is its full name). ambiguous: the end of several realms' names, so nothing is read. unknown: no scan names that realm, so nothing is read; that is not an empty market.",
                    "enum": ["exact", "alias", "ambiguous", "unknown"],
                    "type": "string"
                  },
                  "value": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "ageDays": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "day": {
                            "type": "string"
                          },
                          "historical": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "itemId": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "market": {
                            "anyOf": [
                              {
                                "maximum": 9007199254740991,
                                "minimum": -9007199254740991,
                                "type": "integer"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Null when no solid public day falls in the last 14: unrecorded, not zero."
                          },
                          "min": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
