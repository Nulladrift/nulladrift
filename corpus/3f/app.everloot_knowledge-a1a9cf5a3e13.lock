                            "type": "boolean"
                          }
                        },
                        "required": ["ageDays", "day", "historical", "itemId", "market", "min", "quantity", "reporters", "thin"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Null until 3 reporters scanned the item on the realm, or one of Everloot's own installs did, and for an ambiguous or unknown realm."
                  }
