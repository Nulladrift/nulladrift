              },
              "page": {
                "additionalProperties": false,
                "properties": {
                  "edges": {
                    "description": "Outgoing then incoming, grouped by relation, each group cut to the limit.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "build": {
                          "type": ["string", "null"]
                        },
                        "evidence": {
