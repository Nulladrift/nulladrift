                          "enum": ["observed", "client"],
                          "type": "string"
                        },
                        "firstSeen": {
                          "type": ["string", "null"]
                        },
                        "fromId": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "fromKind": {
                          "enum": ["item", "spell", "npc", "object", "quest", "zone", "item_set", "icon", "skill"],
                          "type": "string"
                        },
                        "installs": {
                          "anyOf": [
                            {
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "lastSeen": {
                          "type": ["string", "null"]
                        },
                        "rel": {
                          "enum": ["dropped_by", "sold_by", "reward_from", "located_in", "created_by", "reagent_for", "part_of_set", "same_icon", "in_skill_line"],
                          "type": "string"
                        },
                        "toId": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "toKind": {
                          "enum": ["item", "spell", "npc", "object", "quest", "zone", "item_set", "icon", "skill"],
                          "type": "string"
                        }
                      },
                      "required": ["build", "evidence", "firstSeen", "fromId", "fromKind", "installs", "lastSeen", "rel", "toId", "toKind"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "id": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
