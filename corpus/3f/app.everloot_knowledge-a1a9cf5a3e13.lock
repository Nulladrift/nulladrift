        {
          "name": "collection_gap",
          "title": "Owned versus missing in a collection",
          "description": "Returns what one install still misses in one collection, against what that install uploaded as owned, grouped by source. A list row is public after 3 installs agree on the collection, the source and the item; owned is what that install uploaded. Not a Blizzard profile read and not a copied catalog. Use it for which items of a collection a player is missing; use completion_progress for achievements, reputations and titles. When that install never uploaded the collection, the answer says owned is unknown, not empty. Reads Everloot's public player data when connected. Missing or unavailable data is reported explicitly. Ask for the player's deliberately shared ownerInstallId from their own EverlootDB.installId in SavedVariables/Everloot.lua and required sharing setup; never infer or probe another owner's id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "collection": {
                "description": "Collection name, any case, such as Mounts.",
                "type": "string"
              },
              "ownerInstallId": {
                "description": "The player's own install id, whose owned upload to compare.",
                "type": "string"
              }
            },
            "required": ["collection", "ownerInstallId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "connected": {
                "description": "False when no corpus was read; the page is then absent, which is not a measured zero.",
                "type": "boolean"
              },
              "dataAsOf": {
                "description": "The corpus snapshot time, or null when unrecorded.",
                "type": ["string", "null"]
              },
              "page": {
                "additionalProperties": false,
                "properties": {
                  "collection": {
                    "type": "string"
                  },
                  "groups": {
                    "description": "Catalog entries 3 installs agree on, grouped by source, split by the install's own upload.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "missing": {
                          "items": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "type": "array"
                        },
                        "owned": {
                          "items": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "type": "array"
                        },
                        "source": {
                          "type": "string"
                        }
                      },
                      "required": ["missing", "owned", "source"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "ownedRecorded": {
                    "description": "False when this install never uploaded this collection: owned is unknown, not empty.",
                    "type": "boolean"
                  },
                  "ownerInstallId": {
                    "type": "string"
                  },
                  "queued": {
                    "description": "Catalog entries fewer than 3 installs reported yet.",
                    "items": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "type": "array"
                  }
                },
                "required": ["collection", "groups", "ownedRecorded", "ownerInstallId", "queued"],
                "type": "object"
              },
              "reason": {
                "description": "Why nothing was read, when connected is false.",
                "type": "string"
              },
              "url": {
                "description": "The everloot.app page that shows this answer, absolute. Absent when there is no such page or it would be empty.",
                "type": "string"
              }
            },
            "required": ["connected", "dataAsOf"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Owned versus missing in a collection"
          },
