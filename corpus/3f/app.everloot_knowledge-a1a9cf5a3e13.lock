                      "licence": {
                        "description": "The source's licence, such as CC-BY-SA-4.0.",
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "observed": {
                        "additionalProperties": false,
                        "description": "Name agreed by 3 or more installs. asOf is the corpus snapshot time, not the last observation time.",
                        "properties": {
                          "asOf": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["asOf"],
                        "type": "object"
                      },
                      "recordId": {
                        "description": "Alias of id. Pass to get_entity or fetch, never a gameplay tool.",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
