{
  "lockfileVersion": 2,
  "subjects": {
    "com.callstay/hotels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://callstay.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "callstay",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Callstay sells hotel rooms worldwide with live rates and a human desk on the phone. Call `capabilities` first. Prices are decimal amounts in the stated currency and `total_all_in` includes every itemised fee. When `price_stay` returns no rooms, give the guest the phone number in `human_desk` rather than saying the hotel is full.",
      "tools": [
        {
          "name": "capabilities",
          "description": "What Callstay is, which tools exist, what prices mean, and the human desk's phone number. Call first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:220643a520676c4b3a4087138429a22f9924083207c4b2edc8eae7e2d9a5b4c2"
        },
        {
          "name": "get_property",
          "description": "Full detail for one property by slug: description, facilities, check-in and check-out times, parking, pets, children, policies, review summary and nearby places.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The property slug from search_stays, e.g. 'delta-hotels-by-marriott-peterborough'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df6e3a6e67918f9bea04ebb6efcc727f14bb00455e198cd5e05f89a78eccf874"
        },
        {
          "name": "price_stay",
          "description": "Every room and rate one property has for an exact stay, live from the supplier. Each room has an all-in total, itemised fees, cancellation terms and a booking URL. `status` says whether an empty list is no rooms or a supplier outage.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "default": 2,
                "description": "Adults across all rooms.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Check-in date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD. Must be after checkin.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children_ages": {
                "default": [],
                "description": "Age of each child at check-in.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "currency": {
                "description": "ISO 4217 code to quote in. Defaults to the market's currency.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "rooms": {
                "default": 1,
                "description": "Number of rooms.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The property slug from search_stays, e.g. 'delta-hotels-by-marriott-peterborough'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2d9d437483c98062da01637fa21a9b819a12192a944fe7e33e9e5d7c5d545b53"
        },
        {
          "name": "search_stays",
          "description": "Find hotels for a place, dates and party. Returns up to 48 properties with an indicative nightly and total, rating and a URL that carries the dates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "default": 2,
                "description": "Adults across all rooms.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Check-in date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date, YYYY-MM-DD. Must be after checkin.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children_ages": {
                "default": [],
                "description": "Age of each child at check-in.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "currency": {
                "description": "ISO 4217 code to quote in. Defaults to the market's currency.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "destination": {
                "description": "City or place name, with country when ambiguous: 'Peterborough, United Kingdom'. Strongly recommended; the parser is more reliable with it separate.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "max_results": {
                "default": 12,
                "maximum": 48,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the guest wants, in plain language: 'near the river, pet friendly, 2 adults'. Dates in the text are read too, but the date fields win.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "rooms": {
                "default": 1,
                "description": "Number of rooms.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ce669385ac13c4ae48e5c6d35dc36877219842887f6ee5a81904e281a4297171"
        }
      ],
      "digest": "sha256:50f2572e4c90c2f025fe46fbe0a6be6d5c16e8d8719158b3686f35a52da05f05"
    }
  }
