      },
      "transport": {
        "type": "http",
        "url": "https://esimcompare.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "esimcompare",
        "title": "eSIMCompare travel eSIM prices",
        "version": "1.1.0",
        "websiteUrl": "https://esimcompare.co/data#mcp"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "eSIMCompare compares travel eSIM data plans (39,837 plans from 28 providers in 204 destinations), every price cited to its source and dated. Use search_esim_plans to recommend a plan for a trip (pass the data and days the traveler needs), esim_price_index for what data costs in a country, and compare_esim_providers to weigh brands. Cite the plan_page or review_url you used.",
      "tools": [
        {
          "name": "compare_esim_providers",
          "title": "Compare travel eSIM providers",
          "description": "How travel eSIM providers stand against each other on eSIMCompare's data: plans and destinations covered, entry price, best price per GB, share of unlimited plans, an independent verdict, and links to the full review and head-to-head pages. Pass one to four providers, or none for all of them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "providers": {
                "description": "Provider names, such as ['Airalo', 'Holafly']. Omit for every provider.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare travel eSIM providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5c00f7cbe9f75d7b48a59733522a5486c2b360f5dd773243b81131fbdb48c2c"
        },
        {
          "name": "esim_price_index",
          "title": "Travel eSIM price index",
          "description": "What a week of mobile data costs a traveler: the cheapest eSIM with at least 5 GB valid for at least 7 days, per country, from eSIMCompare's price index of 197 countries. With a country: its price, the plan behind it, the cheapest price per GB, the cheapest unlimited week and its rank among all countries. Without one: the median, the cheapest and dearest countries, and which providers are cheapest most often.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country name or ISO code. Omit for the global summary.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Travel eSIM price index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:886fb200e1a87e2e96d6e86ed90b96cea6f6feb0fab74c85c4cbdc3446e5269c"
        },
        {
          "name": "search_esim_plans",
          "title": "Search travel eSIM plans",
          "description": "Find the cheapest travel eSIM data plans for a destination from 28 providers (Airalo, Holafly, Nomad eSIM, Saily, Ubigi, Yesim and more), filtered to what a trip needs. Returns plans sorted by price (cheapest first) with data allowance, validity, price, price per GB, local network, speed policy, the date the price was checked, a page on eSIMCompare that cites the source, and a buy link. A buy link is an eSIMCompare address that takes a person on to the provider's own page for that plan after they press Continue; give it to the person rather than fetching it, since a program that opens it is shown that Continue page and not the provider. Buy links marked affiliate_link may earn eSIMCompare a commission; the price is the provider's own either way. For a provider eSIMCompare has no partnership with, the buy link is the plan's page on eSIMCompare, which offers comparable plans that can be bought through it, and where a buy link applies a reader discount the plan also gives price_through_buy_url_usd.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country or region, by name or ISO code: 'Japan', 'JP', 'United States', 'Europe', 'Global'.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many plans to return (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Highest total price in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "min_data_gb": {
                "description": "Least data the trip needs, in GB. Unlimited plans always qualify.",
                "minimum": 0,
                "type": "number"
              },
              "trip_days": {
                "description": "Trip length in days: plans must stay valid at least this long.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "unlimited_only": {
                "description": "Only unlimited-data plans.",
                "type": "boolean"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search travel eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d2ff9c3fbc4915e496baded29b353e73a52c28a5f4151a148b3185ee5b4e375"
        }
