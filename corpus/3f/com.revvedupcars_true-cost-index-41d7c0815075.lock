{
  "lockfileVersion": 2,
  "subjects": {
    "com.revvedupcars/true-cost-index": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://revvedupcars.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "revvedupcars-true-cost",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools for the RevvedUpCars True Cost Index: what it costs per month to own a new car in the United States — the loan payment, insurance, maintenance and fuel or charging — for every car RevvedUpCars prices.\n\nUse find_car first to turn a make and model into a slug, then get_true_cost or compare_true_cost. cost_index ranks a whole segment (all, suv, sedan, electric, hybrid, truck, under-700).\n\nFigures assume a new car with the full MSRP financed over 72 months at 6.9% APR with nothing down, 12,000 miles a year, gasoline at $4.13 a gallon and electricity at $0.18 per kWh. Every figure is an estimate. The price is an estimated base price, not a manufacturer quotation, and the loan line is computed from it. Insurance and maintenance are estimates too: \"sources\" says \"per-car-estimate\" when a figure is stored against that car and \"segment-default\" when it is estimated from the car's price (insurance) or drivetrain (maintenance). Fuel economy and electric range are the EPA's own measurements. Say which is which when you quote one, and never present the price as the manufacturer's. The data is CC BY 4.0: credit RevvedUpCars and link the car's url when you use a figure.",
      "tools": [
        {
          "name": "compare_true_cost",
          "title": "Which car is cheaper to own",
          "description": "Compare two cars' true monthly cost of ownership: which is cheaper, by how much per month and per year, and which cost line accounts for most of the gap. Differences under $10 a month are reported as a tie.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "a": {
                "description": "First car slug",
                "maxLength": 120,
                "pattern": "^[a-z0-9_-]+$",
                "type": "string"
              },
              "b": {
                "description": "Second car slug",
                "maxLength": 120,
                "pattern": "^[a-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which car is cheaper to own"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41b616809e90641bde8d47b723a3f314760414567353ee6c8fd3e525d90798db"
        },
        {
          "name": "cost_index",
          "title": "Cheapest cars to own, by segment",
          "description": "Rank a segment of the catalogue by true monthly cost of ownership, cheapest first, with the segment's cheapest, median and most expensive figures.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many of the cheapest cars to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "segment": {
                "default": "all",
                "description": "all, suv, sedan, electric, hybrid, truck, or under-700 (everything under $700 a month)",
                "enum": ["all", "suv", "sedan", "electric", "hybrid", "truck", "under-700"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest cars to own, by segment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ebd6e33f56d01b8c276bf3e492a19ac858742c44203baef519a372aab872060"
        },
        {
          "name": "find_car",
          "title": "Find a car",
          "description": "Search the priced catalogue by make, model, trim or year and return matching cars with their slug and true monthly cost. Every word must match. Newest model years first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Make, model, trim and/or year, e.g. \"toyota rav4\" or \"2025 f-150\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a car"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08e0c3ef4ac7da51e83e251633ed23ba3a6cd3c7a541b80b6e537934c50a0202"
        },
        {
          "name": "get_true_cost",
          "title": "True monthly cost of a car",
          "description": "One car's true monthly cost of ownership: loan, insurance, maintenance and fuel, the total per month and per year, whether each estimate is the car's own figure or a segment average, and its rank among comparable cars.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Car slug from find_car, e.g. 2025-toyota-rav4-le",
                "maxLength": 120,
                "pattern": "^[a-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "True monthly cost of a car"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fa0b87564be578b298b2f836af419b311568eb0eac185b46e1305c092710747"
        }
      ],
      "digest": "sha256:bd4e5429d1d748d2c65e623a6e4d36dac95a1baeacda1a853f8f4f98c54b1f66"
    }
  }
}
