{
  "lockfileVersion": 2,
  "subjects": {
    "ai.freudly/tests": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://freudly.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "freudly-tests",
        "title": "Freudly psychological tests",
        "version": "1.0.0",
        "websiteUrl": "https://freudly.ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Freudly (freudly.ai) is a catalogue of psychological self-assessment tests in English, Spanish and Russian. Use search_tests to find tests that fit what the user is looking for, then get_test_info for the details of one test. Always give the user the `url` from the response: the test is taken on that page. Tests support self-reflection and screening, not diagnosis; if the user may be in crisis, point them to local emergency services first.",
      "tools": [
        {
          "name": "get_test_info",
          "title": "Get test details",
          "description": "Details of one Freudly test by id: description, instructions, the scales it measures, authors and sources, limitations, what the user needs to get the result, and the URL where the test is taken.",
          "inputSchema": {
            "$defs": {
              "PublicLocale": {
                "enum": ["en", "es", "ru"],
                "type": "string"
              }
            },
            "description": "Параметры get_test_info.",
            "properties": {
              "language": {
                "$ref": "#/$defs/PublicLocale",
                "default": "en",
                "description": "Language of the description: en, es, or ru."
              },
              "test_id": {
                "description": "Test id from search_tests.",
                "minimum": 1,
                "title": "Test Id",
                "type": "integer"
              }
            },
            "required": ["test_id"],
            "title": "PublicTestInfoParams",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62452247428c9f3328c9c3972ca1d9d58b811d49131539e078d3cf905f960a84"
        },
        {
          "name": "search_tests",
          "title": "Search psychological tests",
          "description": "Search the Freudly catalogue of psychological self-assessment tests (personality, anxiety, depression, burnout, relationships, IQ and more). Filter by keywords, topic, language (en, es, ru), maximum duration in minutes and maximum number of questions. Returns test ids, short summaries, duration, number of questions, topics and the URL where each test is taken.",
          "inputSchema": {
            "$defs": {
              "PublicLocale": {
                "enum": ["en", "es", "ru"],
                "type": "string"
              }
            },
            "description": "Параметры search_tests — общие для REST и MCP.",
            "properties": {
              "language": {
                "$ref": "#/$defs/PublicLocale",
                "default": "en",
                "description": "Language of the test and its page: en, es, or ru (ru has a small catalogue)."
              },
              "limit": {
                "default": 10,
                "description": "Number of tests to return (1-20).",
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "max_minutes": {
                "anyOf": [
                  {
                    "maximum": 300,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum estimated duration, minutes.",
                "title": "Max Minutes"
              },
              "max_questions": {
                "anyOf": [
                  {
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum number of questions.",
                "title": "Max Questions"
              },
              "page": {
                "default": 1,
                "description": "Results page, starting at 1.",
                "maximum": 50,
                "minimum": 1,
                "title": "Page",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Keywords to match in test names and descriptions, written in the same language as `language` (e.g. \"anxiety\", \"burnout\", \"ansiedad\", \"тревога\"). Short keywords work better than sentences.",
                "title": "Query"
              },
              "topic": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Topic or theme in the same language as `language` (e.g. \"depression\", \"relationships\", \"personality\"). Matched against the catalogue topics; falls back to keyword search.",
                "title": "Topic"
              }
            },
            "title": "PublicTestSearchParams",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a500e4f4385634053217037c4481c6b7e06e3d712fcd981c679c36869378081"
        }
      ],
      "digest": "sha256:e09c6c2d3c41d882e5f6ae3165a7f08d803761beed8b878578f7d16c36a261f3"
    }
  }
}
