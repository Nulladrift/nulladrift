{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/ai-api-radar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiapi.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "ai-api-radar",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "cheapest_model",
          "description": "Return the cheapest LLM API models that meet a constraint, ranked by blended $/M-token cost. Use this to route an agent to the lowest-cost model with enough context that is currently operational. Filter by minimum context window and provider; weight input vs output cost for your workload.",
          "inputSchema": {
            "properties": {
              "in_weight": {
                "description": "Relative weight of input-token price (default 1).",
                "type": "number"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "type": "number"
              },
              "min_context": {
                "description": "Minimum context window (tokens), e.g. 128000.",
                "type": "number"
              },
              "operational_only": {
                "description": "Drop providers with a major/critical status indicator.",
                "type": "boolean"
              },
              "out_weight": {
                "description": "Relative weight of output-token price (default 3, output-heavy).",
                "type": "number"
              },
              "provider": {
                "description": "Restrict to one provider slug (openai, anthropic, google, ...).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:324f5492f37149533121cd461a83ad8d34736d9afd8aed3833e14431c71ccb05"
        },
        {
          "name": "price_change_alerts",
          "description": "Subscribe a webhook to fire when a provider changes prices (or read recent price changes). Pass `webhook` to subscribe (optionally filter by provider and direction 'cut'|'raise'); omit to read recent changes.",
          "inputSchema": {
            "properties": {
              "direction": {
                "enum": ["cut", "raise"],
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "provider": {
                "type": "string"
              },
              "webhook": {
                "description": "HTTPS URL to POST price-change events to. Omit to just read recent changes.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:165c5949078d088996a94fd0519a39296580defd503dd19e638a0ef855441475"
        },
        {
          "name": "price_history",
          "description": "Return the dated $/M-token price history (input + output) for one model. This is AI API Radar's exclusive time-series — useful for spotting price-war cuts and trend.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model slug, e.g. 'anthropic--claude-opus-4-x' or just the id.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f77328b5c80a41cc31907922d8d43584ff036ff68d4233f02746827e9d115f48"
        },
        {
          "name": "status",
          "description": "Current operational status for one or all AI API providers (from each provider's public status page).",
          "inputSchema": {
            "properties": {
              "provider": {
                "description": "Provider slug; omit for all providers.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8e904a4f529c06a75885b81580eb8968faf5f81618537397e54643e7e9e57f64"
        }
      ],
      "digest": "sha256:ca9663e74556ff65101b0ba24af5766ab80bcea08cd6cfbbda5d922b5fa09a5f"
    }
  }
}
