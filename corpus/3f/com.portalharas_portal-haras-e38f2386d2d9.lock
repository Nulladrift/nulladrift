          "digest": "sha256:abbdf9b4bc3f6ff67a3c71cc6e3af76334f40c6e368082669e22b7b7f3c8f23c"
        },
        {
          "name": "list_pages",
          "title": "Listar páginas",
          "description": "Lista las landings por rubro (kind=locales) o los artículos del blog (kind=blog), del más nuevo al más viejo, con slug, título, descripción, fecha y URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Qué listar.",
                "enum": ["blog", "locales"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              }
            },
