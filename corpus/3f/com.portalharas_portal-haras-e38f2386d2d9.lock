        },
        {
          "name": "search_content",
          "title": "Buscar en el sitio",
          "description": "Busca en las landings por rubro y en los artículos del blog de portalharas.com (inversión en locales, impuestos, alquiler comercial, Escobar, compra en pozo, etc.). Devuelve las páginas más relevantes con slug, título, descripción y URL; el texto completo se pide con get_page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "all",
                "description": "Limitar a blog o a landings por rubro.",
                "enum": ["all", "blog", "locales"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Qué buscar, en castellano. Ej.: 'cap rate local comercial'.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
