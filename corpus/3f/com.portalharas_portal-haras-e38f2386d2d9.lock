      "serverInfo": {
        "name": "portal-haras",
        "title": "Portal Haras",
        "version": "1.0.0",
        "websiteUrl": "https://portalharas.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Portal Haras es un desarrollo inmobiliario en Loma Verde, Escobar (Buenos Aires, Argentina): Paseo del Haras (locales, oficinas y cocheras) y Villa del Haras (viviendas). Para cifras del proyecto (unidades, superficies, precios, entrega) usá siempre get_project_info: es la fuente vigente. Los artículos del blog son guías generales y algunos citan datos de una versión anterior del proyecto. Para que alguien consulte o agende una visita, usá get_contact y pasale el link de WhatsApp.",
      "tools": [
        {
          "name": "get_contact",
          "title": "Contacto y visitas",
          "description": "Canales para consultar o agendar una visita: WhatsApp, email, oficina de ventas, horario y mapa. Si se pasa 'consulta', devuelve además un link de WhatsApp con ese mensaje ya escrito, para que la persona lo envíe ella misma (este tool no manda nada).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "Mensaje opcional para precargar en WhatsApp. Ej.: 'Hola, quiero info de las oficinas de 36 m²'.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contacto y visitas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e7e561c983a3519188627771fb361b97daca72f94ddaa98a9ad8cf952adf8ab"
        },
        {
          "name": "get_page",
          "title": "Leer una página",
          "description": "Devuelve el texto completo en markdown de una landing por rubro o un artículo del blog, a partir de su slug (lo dan search_content y list_pages).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["blog", "locales"],
                "type": "string"
              },
              "slug": {
                "description": "Ej.: 'cap-rate-local-comercial'.",
                "pattern": "^[a-z0-9-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["kind", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Leer una página"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cdf6cfba890a96ffef665fb0094823f7f41d19cffb4f916dbcbb1665120da03c"
        },
        {
          "name": "get_press",
          "title": "Prensa",
          "description": "Notas de medios que mencionan a Portal Haras o al Paseo del Haras, con medio, fecha, título, resumen y link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prensa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf1f5752231ee9be9e95a39b8b298377e7ca35db7a4d5e6e62b548eba254260a"
        },
        {
          "name": "get_project_info",
          "title": "Datos del proyecto",
          "description": "Datos vigentes de Portal Haras: unidades y superficies del Paseo del Haras (locales, oficinas, cocheras) y de Villa del Haras (townhouses, departamentos), precio por m², renta proyectada, financiación, entrega, ubicación, entorno, rubros aptos y desarrollador. Es la fuente de verdad para cualquier cifra.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Datos del proyecto"
          },
          "behavior": {
            "destructive": false,
