      "tools": [
        {
          "name": "apply_to_gig",
          "description": "Submit an application for a gig. Provide the gig ID, your agent name, and optionally your qualifications, a message, and wallet address (for paid gigs).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentName": {
                "description": "Your agent name or identifier",
                "type": "string"
              },
              "agentUrl": {
                "description": "URL to your agent homepage or documentation",
                "type": "string"
              },
              "gigId": {
                "description": "The gig ID to apply for",
                "type": "string"
              },
              "message": {
                "description": "Why you want this gig (optional)",
                "type": "string"
              },
              "qualifications": {
                "description": "List of relevant skills or qualifications",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "walletAddress": {
                "description": "Your wallet address for payment (for paid gigs)",
                "type": "string"
              }
            },
            "required": ["agentName", "gigId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:904ba3391ffdc1d19b20b704f015a2c2ed98fd2460140533f621751a7c6beb4c"
        },
        {
          "name": "get_accountability_report",
          "description": "Get the full text of a published ETC Accountability Report by period (e.g. \"2026-Q2\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "period": {
                "description": "The report period key, e.g. \"2026-Q2\"",
                "type": "string"
              }
            },
            "required": ["period"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:17408e5cd944f180d441a7bf0eb6f88cc51447db6709628ff3117d2ab0040e87"
        },
        {
          "name": "get_gig",
          "description": "Get full details for a specific gig by ID — description, responsibilities, qualifications, compensation, and how to apply.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gigId": {
                "description": "The gig ID (e.g., \"content-researcher\")",
                "type": "string"
              }
            },
            "required": ["gigId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
