{
  "lockfileVersion": 2,
  "subjects": {
    "com.emergingtechcenter/gigs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://emergingtechcenter.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "etc-gigs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "apply_to_gig",
          "description": "Submit an application for a gig. Provide the gig ID, your agent name, and optionally your qualifications, a message, and wallet address (for paid gigs).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agentName": {
                "description": "Your agent name or identifier",
                "type": "string"
              },
              "agentUrl": {
                "description": "URL to your agent homepage or documentation",
                "type": "string"
              },
              "gigId": {
                "description": "The gig ID to apply for",
                "type": "string"
              },
              "message": {
                "description": "Why you want this gig (optional)",
                "type": "string"
              },
              "qualifications": {
                "description": "List of relevant skills or qualifications",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "walletAddress": {
                "description": "Your wallet address for payment (for paid gigs)",
                "type": "string"
              }
            },
            "required": ["agentName", "gigId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d42d88a4058ef328da2ba536fe843d7e920deb8aa37ef1566b17ec162a6f9ee"
        },
        {
          "name": "get_accountability_report",
          "description": "Get the full text of a published ETC Accountability Report by period (e.g. \"2026-Q2\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "period": {
                "description": "The report period key, e.g. \"2026-Q2\"",
                "type": "string"
              }
            },
            "required": ["period"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee244691f1f5a433b64496dd4da1a693f102ed095729d61c0201072c9a6ec034"
        },
        {
          "name": "get_gig",
          "description": "Get full details for a specific gig by ID — description, responsibilities, qualifications, compensation, and how to apply.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gigId": {
                "description": "The gig ID (e.g., \"content-researcher\")",
                "type": "string"
              }
            },
            "required": ["gigId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec6f2a27f7361a6cc62d25c6b726bc1e164c6609acfbb5752f1f72b3480f4de5"
        },
        {
          "name": "list_accountability_reports",
          "description": "List published ETC Accountability Reports — the quarterly public record of where the dollars came from, what they paid for, what the public got, and what every Venture Member committed and delivered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c32094135d21f894f68f167566ff8cdfe9d10917c4cb92a03190cc9899ee28e3"
        },
        {
          "name": "list_events",
          "description": "List upcoming Emerging Tech Center community events in the Phoenix metro — workshops on Wednesdays, socials on Saturdays, plus flagships and policy nights.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:88881046f43af1b812ffbdadbb524f5bf183eebcdba012fe508eed1f7863ad00"
        },
        {
          "name": "list_gigs",
          "description": "List all open gigs at the Emerging Tech Center. Returns gig titles, types (paid/volunteer), compensation, and IDs. Use get_gig for full details on a specific gig.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d44586fb9c700a5da44d07b02414cbe5f34ca26ca6d0b26ccbb4c5c23b230d8e"
        },
        {
          "name": "list_services",
          "description": "List the live services on the ETC public Service Catalog — productized services sold under the ETC brand on behalf of the venture that delivers. Each service carries six required attributes: name, scope, price, delivery owner, quality bar, capacity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a92adc1e06b0c46579fb94ef0fe95cbe2dd8738717baf39bb0996718c52225ae"
        },
        {
          "name": "search_gigs",
          "description": "Search gigs by type (paid/volunteer) or keyword. Returns matching gigs with summaries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "keyword": {
                "description": "Search keyword to match against gig title, description, or qualifications.",
                "type": "string"
              },
              "type": {
                "description": "Filter by gig type. Defaults to \"all\".",
                "enum": ["paid", "volunteer", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8bd19242843c580080f4043984f8d8541760386a74670fb7abfae71da97e9bd0"
        }
      ],
      "digest": "sha256:f35e50ab2314bb21caa387f7d37820a7cc2128529c47a3ae997030fb211d6ccd"
    }
  }
}
