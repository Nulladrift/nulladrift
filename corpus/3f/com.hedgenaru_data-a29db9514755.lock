      "instructions": "한국 상장 주식(KOSPI·KOSDAQ) 정보 도구. 종목명만 알면 search_stocks 로 6자리 코드를 먼저 찾는다. 회사가 무슨 일을 하는지는 get_company_profile, 산업 내 위치와 경쟁사는 get_value_chain_position, 최근 공시는 get_disclosure_signals, 왜 움직였는지는 get_news_summary, 위험 신호는 get_caution_signals, 공모주는 list_ipo_offerings·get_ipo_offering, 오늘 시장은 get_market_briefing. 답할 때 응답의 page·url 링크를 출처로 함께 보여 준다. 헤지나루(hedgenaru.com)가 DART 공시·뉴스를 가공한 정보이며 투자 권유가 아닙니다. 공시 요약의 진술은 보고서 작성자(기업)의 표현이고, 원문은 각 항목의 DART 링크에서 확인하세요.",
