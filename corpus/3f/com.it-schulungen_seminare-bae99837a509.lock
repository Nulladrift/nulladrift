        {
          "name": "seminar_topics",
          "title": "Search topics",
          "description": "Searches the topic vocabulary seminars are tagged with.\n\nUse this to turn a customer's wording into a filter value for\n`seminars_search`, and to check whether a product or technology is\ncovered at all. Aliases are searched too, so \"K8s\" finds \"Kubernetes\" and\n\"AKS\" finds \"Azure Kubernetes Services\".\n\nThis is a filter axis, not a catalogue: a hit means the topic exists, not\nthat a seminar on it does. `seminars_search` answers that.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Records per page, 1-50, default 20",
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1",
                "type": "integer"
              },
              "query": {
                "default": null,
                "description": "Part of a topic name or alias, e.g. \"Kubernetes\"",
                "type": ["null", "string"]
              },
              "type": {
                "default": null,
                "description": "One of manufacturer, topic, technology, software, software_version, audience",
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
