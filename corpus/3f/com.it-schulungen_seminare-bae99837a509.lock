        {
          "name": "seminars_search",
          "title": "Search seminars",
          "description": "Finds seminars in the IT-Schulungen.com catalogue.\n\nUse this first when a topic is known but the seminar identifier is not.\nThe search is semantic and covers the whole seminar text, so describe the\ngoal in the customer's own words -- \"wie sichere ich unsere\nContainer-Umgebung ab\" finds Docker and Kubernetes security seminars that\nshare no word with the question. A keyword list works worse than a\nsentence. Results come back by relevance.\n\nTwo operators exist: a phrase in double quotes, and a term prefixed with\na minus sign to exclude it. Either one turns the search back into a\nkeyword match, so use them only to correct a search that went wide.\n\nEach record carries `topics`, the subjects the seminar is tagged with --\nuse them to say why a seminar fits and to tell close candidates apart.\n\nEach record also carries `prices`, one per delivery form: the amount and\nwhat it is per, nothing more. What is included and what costs extra --\nan exam voucher, catering on site -- comes only from `seminar_get`, so\ncall it before stating what a seminar costs in total; until then say\n\"from\". All amounts are net, plus VAT. When the\ndelivery form is not known, lead with the open seminar, priced per\nparticipant; name the in-house price per day only when a team or company\nis asking or there is no open seminar, and coaching or a subscription\nonly when asked. A price without an amount is price on request, and so\nis a seminar without `prices`.\n\nReturns a compact record per seminar, each with `url`: the page on\nIT-Schulungen.com. Enquiries and bookings do not run through this server,\nso that link is where a customer has to go -- name it whenever a seminar\nis recommended, exactly as returned: its query string is part of the\nlink. Call `seminar_get` with a `guid` from this list for the\nagenda and prerequisites, and `seminar_dates` for scheduled dates.",
          "inputSchema": {
            "properties": {
              "difficulty": {
                "default": null,
                "description": "Difficulty identifier from `seminar_difficulties`",
                "type": ["null", "string"]
              },
              "language": {
                "default": null,
                "description": "Two-letter language code (ISO 639-1), e.g. \"de\" or \"en\"",
                "type": ["null", "string"]
              },
              "limit": {
                "default": 20,
                "description": "Records per page, 1-50, default 20",
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1",
                "type": "integer"
              },
              "query": {
                "description": "What the seminar should be about, at least 2 characters",
                "type": "string"
              },
              "topic": {
                "default": null,
                "description": "Exact topic name or identifier from `seminar_topics`",
                "type": ["null", "string"]
              }
            },
            "required": ["query"],
            "type": "object"
          },
