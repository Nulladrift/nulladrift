      "instructions": "Read-only access to the IT-Schulungen.com course catalogue. Every tool is\nsafe to call and never changes anything.\n\nResults are cached and may be a few minutes old. Requests are rate limited\nper client, so prefer one specific query over many broad ones.\n\nResponses are deliberately narrow: list results are paginated and return a\nsmall set of fields. Ask for more fields explicitly when a task needs them\nrather than requesting everything up front.\n\nThe usual path is seminars_search to find candidates, with their prices in\nbrief; seminar_get for the agenda and the full prices, with what is included\nand what costs extra; seminar_dates for when and where.\nseminar_topics, seminar_locations and seminar_difficulties turn what a\ncustomer says into filter values.\n\nTwo things this data cannot tell you, so do not claim them: whether a date\nis still bookable, and any price that was not returned. A date is scheduled,\nnot confirmed; a missing price is price on request. Quote a price only with\nits delivery form and its unit -- an open seminar is per participant, an\nin-house seminar per day -- and always as net, plus VAT. When the delivery\nform is not known, lead with the open seminar.\n\nThis server takes no enquiries and no bookings. Every seminar carries a `url`\nto its page on IT-Schulungen.com; end a recommendation with that link, so the\ncustomer can go on from there, exactly as returned -- its query string is\npart of the link. Never invent one.",
      "tools": [
        {
          "name": "ping",
          "title": "Ping the server",
          "description": "Checks that this MCP server is reachable and reports its version.\n\nUse this only to diagnose connection problems. It returns no course data.",
