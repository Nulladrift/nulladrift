      "serverInfo": {
        "name": "IT-Schulungen.com MCP",
        "version": "0.1.0",
        "description": "Public, read-only access to the IT-Schulungen.com course catalogue.",
        "websiteUrl": "https://www.it-schulungen.com"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
