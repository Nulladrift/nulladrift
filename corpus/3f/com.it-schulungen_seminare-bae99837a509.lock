        {
          "name": "seminar_get",
          "title": "Get a seminar",
          "description": "Returns one seminar with its description, agenda and prerequisites.\n\nThe texts are markdown. Prices come along in full, one per delivery form\nwith what is included and what costs extra -- the only place that says\nso; `seminars_search` carries the amounts alone.\n\n`url` is the seminar's page on IT-Schulungen.com and the place to send a\ncustomer: this server answers questions, it does not take enquiries or\nbookings. Hand it on exactly as returned, query string included. If the\nfield is missing, fall back to the portal's own search\nrather than guessing an address.\n\nA seminar carries one price per delivery form, not one price: an open\nseminar is priced per participant, an in-house seminar and a coaching per\nday. All amounts are net, plus VAT. Always name which form a price\nbelongs to, and read `calculation_unit` before stating an amount.\n`offer_type` says how far the price commits: `not-binding-inquiry` is a\nstarting point for an enquiry, not a quote.",
          "inputSchema": {
            "properties": {
              "guid": {
                "description": "Seminar identifier, e.g. \"NE-PRDCT-1f2dbdfa-d740-47ac-9921-9f5ac767cc86\"",
                "type": "string"
              }
            },
            "required": ["guid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_note": {
                "type": "string"
              },
              "guid": {
                "type": "string"
              },
              "language": {
                "type": ["string", "null"]
              },
              "name": {
                "type": ["string", "null"]
              },
              "prices": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "product_difficulty_guid": {
                "type": ["string", "null"]
              },
              "seminar": {
                "properties": {
                  "duration": {
                    "type": ["number", "null"]
                  },
                  "duration_unit": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "topics": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "type": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["guid"],
            "type": "object"
          },
