        {
          "name": "seminar_dates",
          "title": "Get seminar dates",
          "description": "Lists the scheduled dates of a seminar, soonest first.\n\nPast dates are never returned. Without `from` the window starts today.\n`from` and `to` are calendar days in German time, and both are included.\nAn empty result means nothing is currently scheduled -- it does not mean\nthe seminar does not exist.\n\nEach date carries the cities it runs in; a city of type `virtual` is an\nonline delivery, `place` is on site. Dates that are cancelled, postponed\nor already over are never returned.\n\n`status` is what to lead with when suggesting a date:\n\n  guaranteed  this seminar runs, whatever else happens -- recommend these\n              first, and say so, because it is the customer's strongest\n              reason to pick one date over another\n  planned     scheduled and open for enrolment, not yet confirmed to run\n\n`direct_booking` appears only on dates that can be booked straight\nthrough the portal, with `direct_booking_until` as the last day for it.\n**Its absence says nothing about availability.** Every date listed here\ncan be enquired about and enrolled in; direct booking is a shortcut, not\na condition. Never tell a customer a date is unavailable because this\nfield is missing.\n\n`seminar` names the course the dates belong to -- name, duration and\nits `url` -- so the list can be presented under that heading. It is\nleft out only when the lookup failed; the dates still stand.\n\n`begin` and `finish`, per date and per day in `days`, are UTC. The\nseminars run in local time (Europe/Berlin; Vienna and Zurich are the\nsame zone): convert before quoting a time, so 07:00Z is 09:00 in summer\nand 08:00 in winter, never \"7 Uhr\".",
          "inputSchema": {
            "properties": {
              "city": {
                "default": null,
                "description": "Place name such as \"München\", or \"online\" for virtual delivery",
                "type": ["null", "string"]
              },
              "from": {
                "default": null,
                "description": "Earliest start date, \"YYYY-MM-DD\". Defaults to today",
                "type": ["null", "string"]
              },
              "limit": {
                "default": 20,
                "description": "Records per page, 1-50, default 20",
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1",
                "type": "integer"
              },
              "seminar_guid": {
                "description": "Seminar identifier from `seminars_search`",
                "type": "string"
              },
              "to": {
                "default": null,
                "description": "Latest start date, \"YYYY-MM-DD\", included",
                "type": ["null", "string"]
              }
            },
            "required": ["seminar_guid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "items": {
                "items": {
                  "properties": {
                    "begin": {
                      "description": "UTC",
                      "format": "date-time",
                      "type": "string"
                    },
                    "cities": {
                      "items": {
                        "properties": {
                          "guid": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "type": {
                            "enum": ["place", "virtual"]
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "days": {
                      "items": {
                        "properties": {
                          "begin": {
                            "description": "UTC",
                            "format": "date-time",
                            "type": "string"
                          },
                          "finish": {
                            "description": "UTC",
                            "format": "date-time",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "direct_booking": {
                      "type": "boolean"
                    },
                    "direct_booking_until": {
                      "type": "string"
                    },
                    "finish": {
                      "description": "UTC",
                      "format": "date-time",
                      "type": "string"
                    },
                    "guid": {
                      "type": "string"
                    },
                    "product_guid": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["guaranteed", "planned"]
                    }
                  },
                  "required": ["begin", "finish", "guid", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "type": "integer"
              },
              "returned": {
                "type": "integer"
              },
              "seminar": {
                "properties": {
                  "duration": {
                    "type": "number"
                  },
                  "duration_unit": {
                    "type": "string"
                  },
                  "guid": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["guid"],
                "type": "object"
              },
              "total": {
                "type": "integer"
              }
            },
