{
  "lockfileVersion": 2,
  "subjects": {
    "com.onrender.ghost77-agent/ghosts-food-services": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ghosts-food-services.vercel.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ghosts-food-services",
        "version": "20261117l",
        "description": "Ghost's Food Services: look up restaurants, menus, and place a Rebecca phone order after a $5 paid fee."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_menu",
          "description": "Fetch menu items and prices taken from the restaurant's own website only. If none are found, returns a note to type items. Does not invent dishes.",
          "inputSchema": {
            "properties": {
              "locality": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "placeToken": {
                "type": "string"
              }
            },
            "required": ["locality"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a7be5b56b494cae4fc87487d4fab29ece85e642d289092968d1e7d434f3150f"
        },
        {
          "name": "order_status",
          "description": "Look up a paid order by its public reference (G77-YYYYMMDD-…). Returns outcome, ready time, total, and whether a $5 refund is due. Does not return customer phone or address.",
          "inputSchema": {
            "properties": {
              "ref": {
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:085d85e33e82ddf80b8aee3d7781a2463b451c6792f6c85855db3b0175c48fdd"
        },
        {
          "name": "place_order",
          "description": "Does not place the call by itself. Returns how to pay the $5 fee (Stripe checkout URL for the human, or x402 USDC on Base) and the endpoints to call after payment. Paid placement is a separate HTTP POST after payment is confirmed.",
          "inputSchema": {
            "properties": {
              "allergies": {
                "type": "string"
              },
              "consent": {
                "type": "boolean"
              },
              "customerName": {
                "type": "string"
              },
              "customerPhone": {
                "type": "string"
              },
              "deliveryAddress": {
                "type": "string"
              },
              "items": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "orderType": {
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "payRef": {
                "type": "string"
              },
              "placeToken": {
                "type": "string"
              },
              "termsAccepted": {
                "type": "boolean"
              },
              "termsVersion": {
                "type": "string"
              }
            },
            "required": ["consent", "items", "orderType", "placeToken", "termsAccepted", "termsVersion"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1c4209df4f653ee950476c6b269e49bbea1aef531502dd38010ebe5df78c101b"
        },
        {
          "name": "quote_order",
          "description": "Validate an order and return the $5 call-placement fee, a Stripe checkout URL for the human, and x402 payment terms. Requires termsAccepted true and termsVersion 2026-11-17 (the human must have agreed). Does not charge and does not call the restaurant.",
          "inputSchema": {
            "properties": {
              "allergies": {
                "type": "string"
              },
              "consent": {
                "type": "boolean"
              },
              "customerName": {
                "type": "string"
              },
              "customerPhone": {
                "type": "string"
              },
              "deliveryAddress": {
                "type": "string"
              },
              "items": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "orderType": {
                "enum": ["pickup", "delivery"],
                "type": "string"
              },
              "placeToken": {
                "type": "string"
              },
              "termsAccepted": {
                "type": "boolean"
              },
              "termsVersion": {
                "type": "string"
              }
            },
            "required": ["consent", "items", "orderType", "placeToken", "termsAccepted", "termsVersion"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:803570ee15157901e5d733f1fbedd44b3bec986af1cbad5b0abfa26843eaa159"
        },
        {
          "name": "search_restaurant",
          "description": "Look up a US restaurant by name and town from public map listings and, when found, the restaurant's own website menu. Never invents items or prices. Returns a placeToken needed to quote or place an order.",
          "inputSchema": {
            "properties": {
              "locality": {
                "description": "Town or city, optionally with state",
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["locality", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86a9b1156962599c5d443d22f78b4f0dd27bf3c262598d3c23b059f74fadf085"
        }
      ],
      "digest": "sha256:b54392432143f96f0c2e4ef4748eceef34240f208a6e7ca789ec3363b092c8a6"
    }
  }
}
