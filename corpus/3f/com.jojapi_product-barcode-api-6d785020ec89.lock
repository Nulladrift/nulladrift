        {
          "name": "get_api_external_marketList",
          "title": "Fetch the Market Names",
          "description": "Retrieves the market names used in the filters. Billing per call: 0 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cb7203a09b205affb1e694f44cb3c32df4257192b19e7c089b501d516412cff"
        },
        {
          "name": "get_api_external_product_of_market",
          "title": "Retrieves Only the Relevant Market Price",
          "description": "It returns the current price and details of the product based on the specified barcode and store name. Price history can also be included optionally. Billing per call: Credits: metered (~0.16 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcode": {
                "default": "8690767671081",
                "description": "The product's GTIN/EAN barcode number",
                "example": "8690767671081",
                "title": "barcode",
                "type": "string"
              },
              "history": {
                "default": "false",
                "description": "Returns historical price information; this is optional. If historical price information is available, it consumes 1 additional credit.",
                "example": "false",
                "title": "history",
                "type": "string"
              },
              "isExist": {
                "default": "false",
                "description": "Is the relevant barcode available at the corresponding store? It does not use up credit.",
                "example": "false",
                "title": "isExist",
                "type": "string"
              },
              "marketName": {
                "default": "Migros",
                "description": "Name of the store where the price will be checked (e.g., Özdilekteyim, Migros)",
                "example": "Migros",
                "title": "marketName",
                "type": "string"
              }
            },
            "required": ["barcode", "marketName"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b2a903edf5592d05efe2e9f31cb5397ada36726dc1dc17e0d5ba11bfc6d957c"
        },
        {
          "name": "get_api_external_search",
          "title": "Product Search",
          "description": "Searches for products by barcode or name; returns a minimum of 1 and a maximum of 10 products. Billing per call: Credits: metered (~2.67 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "historyPrices": {
                "default": "false",
                "description": "Adds historical price information for the requested product from available markets to the response. The `marketPrices` parameter must be set to `true`. If historical price information is available, 1 credit is consumed.",
                "example": "false",
                "title": "historyPrices",
                "type": "string"
              },
              "marketPrices": {
                "default": "false",
                "description": "This setting controls whether price information for the requested products at stores is retrieved. If set to `true`, the product's store prices are also returned; if set to `false` or left unspecified, only the product's basic information is retrieved. If data is available, +1 credit is consumed for every 10 market price data points.",
                "example": "false",
                "title": "marketPrices",
                "type": "string"
              },
              "preferredMarkets": {
                "default": "A101,Migros",
                "description": "It allows the user to specify the preferred markets for which they wish to view product prices. When this parameter is provided, price information is returned only for the listed markets within the `markets` field. If the parameter is not provided, price information for all markets is displayed. Users can specify multiple markets by separating them with commas (e.g., `preferredMarkets=A101,Migros`). If data is available, 1 credit is consumed for every 10 market-price data points.",
                "example": "A101,Hakmar",
                "title": "preferredMarkets",
                "type": "string"
              },
              "query": {
                "default": "Çikolatalı Gofret",
                "description": "It allows the user to specify the name or barcode of the product they wish to search for. Using this parameter, the system searches for products based on name or barcode matches and returns the results.",
                "example": "Çikolatalı Gofret",
                "title": "search",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d736233c490512d596b8aba2ff4dc77fd6c500b6ea7cf59774618c96e826771d"
        },
        {
          "name": "get_api_external_xlsx",
          "title": "Ürünleri Excel Formatında Al",
          "description": "Ürünleri Excel Formatında Mail Adresine İletir. Bu end-point'e yalnızca '$350/ay' planında erişilebilir. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "email parametresi ise, üretilen Excel dosyasının veya CSV verisinin bir kopyasının istenirse bu e-posta adresine gönderilmesini sağlar. Parametre verilmezse dosya sadece API yanıtında döner, e-posta gönderimi yapılmaz.",
                "example": "info@camgoz.net",
                "title": "email",
                "type": "string"
              },
              "marketPrices": {
                "description": "marketPrices parametresi, aranan ürünlerin marketlerdeki fiyat bilgilerinin getirilip getirilmemesini kontrol eder. Eğer true olarak gönderilirse, ürünün market fiyatları da döndürülür; false veya belirtilmezse yalnızca ürünün temel bilgileri getirilir. Yani bu parametre, fiyat bilgisinin isteğe bağlı olarak eklenip eklenmeyeceğini belirler.",
                "example": "true",
                "title": "marketPrices",
                "type": "string"
              },
              "preferredMarkets": {
                "description": "Kullanıcının aradığı ürünlerin fiyatlarını görmek istediği tercih ettiği marketleri belirtmesini sağlar. Eğer bu parametre verilirse, sadece listede belirtilen marketlerden gelen fiyat bilgileri markets alanında döndürülür. Parametre verilmezse, tüm marketlerin fiyat bilgileri gösterilir. Kullanıcı birden fazla market belirtmek isterse, bunları virgül (,) ile ayırarak gönderebilir; örneğin preferredMarkets=A101,Migros,Carrefour şeklinde",
                "example": "A101,Şok Market",
                "title": "preferredMarkets",
                "type": "string"
              },
              "size": {
                "description": "size parametresi, döndürülecek ürün sayısının maksimum değerini belirler. Eğer belirtilmezse varsayılan olarak 100 ürün döndürülür.",
                "example": "100",
                "title": "size",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b6bf01d7b37c9b47350e8f2843d80a61ecc6af09b77c2940e2846851d1162961"
        }
