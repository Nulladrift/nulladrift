      "serverInfo": {
        "name": "jojapi-product-barcode-api",
        "title": "Product Barcode API - camgoz.net API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of Product Barcode API - camgoz.net on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/product-barcode-api/pricing · Docs: https://jojapi.com/hub/api/product-barcode-api",
      "tools": [
        {
          "name": "get_api_external_getProducts",
          "title": "Fetch Product",
          "description": "Lists products using pagination. Billing per call: Credits: metered (~124.04 avg).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "historyPrices": {
                "default": "false",
                "description": "Adds historical price information for the requested product from available markets to the response. The `marketPrices` parameter must be set to `true`. If historical price information is available, 1 credit is consumed.",
                "example": "true",
                "title": "historyPrices",
                "type": "string"
              },
              "marketPrices": {
                "default": "false",
                "description": "This setting controls whether price information for the requested products at stores is retrieved. If set to `true`, the product's store prices are also returned; if set to `false` or left unspecified, only the product's basic information is retrieved. If data is available, +1 credit is consumed for every 10 market price data points.",
                "example": "false",
                "title": "marketPrices",
                "type": "string"
              },
              "page": {
                "default": "0",
                "description": "Page number (default: 0)",
                "example": "0",
                "title": "page",
                "type": "string"
              },
              "preferredMarkets": {
                "default": "A101,Migros",
                "description": "It allows the user to specify the preferred markets for which they wish to view product prices. When this parameter is provided, price information is returned only for the listed markets within the `markets` field. If the parameter is not provided, price information for all markets is displayed. Users can specify multiple markets by separating them with commas (e.g., `preferredMarkets=A101,Migros`). If data is available, 1 credit is consumed for every 10 market-price data points.",
                "example": "A101,Şok Market",
                "title": "preferredMarkets",
                "type": "string"
              },
              "size": {
                "default": "20",
                "description": "Page size (default: 10, maximum: 100). It returns a number of products equal to the page size and consumes credits based on the number of products returned.",
                "example": "20",
                "title": "size",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b8fe08602d4b64ea68edb2adfdef740bd5f9fa3f0a5ac007e21c41889ebdc14"
        },
        {
          "name": "get_api_external_get_db_info",
          "title": "Fetch Database Information",
          "description": "It returns the username and password for accessing the MySQL database containing product information. You can use this endpoint by subscribing to the $100 plan. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2430402a28a73244805c7a3a02288a6f04ad3cf97bc2969e3c7df2a3f7d3bf1"
        },
        {
          "name": "get_api_external_history",
          "title": "Historical Price Information",
          "description": "It retrieves the product's historical price information for the relevant store. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcode": {
                "default": "8690767671081",
                "description": "The product's GTIN/EAN barcode number",
                "example": "8699141059286",
                "title": "barcode",
                "type": "string"
              },
              "market": {
                "default": "Migros",
                "description": "The market where the product's price history is recorded. It must exist within the system.",
                "example": "Migros",
                "title": "market",
                "type": "string"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97f5283471930d0afab94026d8fee0ee0533e5ef3d2ec0c7b2b28424ce898ed9"
        },
        {
          "name": "get_api_external_last",
          "title": "*FREE* The 20 most recently updated products",
          "description": "Retrieves the 20 most recently updated products along with their market prices. Billing per call: 0 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
