      "instructions": "Demo mode: no API key, so every tool returns one fixed answer, the same whatever you ask, not an answer to your question. Add an API key to ask about anything. The shapes are identical. To get a key for the person you work for, call sign_up with their email: they approve it with a code you show them.",
