            "readOnly": false
          },
          "digest": "sha256:d0c73401d1dd0189dca5a4a386cf2085472eb67f9df632547f84f1ac0b39d128"
        },
        {
          "name": "get_instagram_comments",
          "title": "Get the comments on an Instagram post",
          "description": "Fetch comments on one Instagram post: username, text, timestamp, like_count, reply_count and parent_id for replies. Use this for social listening and campaign verification. Give exactly one of `url` or `shortcode`. Costs 3 credits, cached or not; a failed call is refunded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The `meta.next_cursor` from the previous page. Omit for the first page.",
                "maxLength": 2048,
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Skip the cache and fetch now. Charged normally. Not available on trial credits — buy any pack to unlock it.",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "At most this many results, 1–50. A page can hold fewer while `next_cursor` is set: read until it is null.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "shortcode": {
                "description": "The post shortcode.",
                "examples": ["C1a2B3c4D5e"],
                "maxLength": 2048,
                "pattern": "^(?:[A-Za-z0-9_-]{5,40})$",
                "type": "string"
              },
              "url": {
                "description": "The post URL.",
                "maxLength": 2048,
                "pattern": "^(?:(https?://)?((www|m)\\.)?instagram\\.com/([A-Za-z0-9._]{1,30}/)?(p|reel|reels|tv)/[A-Za-z0-9_-]{5,40}([/?#]\\S*)?)$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da3edc4f1ed733cdf9752483525d85a10f538d3282994110b1784aef6440b6be"
        },
