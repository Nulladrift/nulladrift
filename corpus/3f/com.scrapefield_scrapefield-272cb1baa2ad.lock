        {
          "name": "get_linkedin_activity",
          "title": "Get a person's LinkedIn comments and reactions",
          "description": "Fetch what one person did recently on other people's posts: with `type=comments`, the comments they wrote and when; with `type=reactions`, the posts they reacted to and how. Each item carries the post, with its author and counts, when they did it, and for a comment its own `comment_url`, which opens the post at that comment. The newest first, up to 100 a page, with `next_cursor` for older ones. Use this for sales signals: who a prospect engages with, and on what. Give exactly one of `url` or `vanity_name`. Costs 7 credits, cached or not; a failed call is refunded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The `meta.next_cursor` from the previous page. Omit for the first page.",
                "maxLength": 2048,
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Skip the cache and fetch now. Charged normally. Not available on trial credits — buy any pack to unlock it.",
                "type": "boolean"
              },
              "posted_within": {
                "description": "Only comments from the last day, week or month. With `type=comments` only.",
                "enum": ["day", "week", "month"],
                "type": "string"
              },
              "type": {
                "default": "comments",
                "description": "Their comments, or their reactions.",
                "enum": ["comments", "reactions"],
                "type": "string"
              },
              "url": {
                "description": "The person's public profile URL. A member-id link (`/in/ACoAA…` or `/in/ACwAA…`), as reactions and Sales Navigator give, works too.",
                "examples": ["https://www.linkedin.com/in/example"],
                "maxLength": 2048,
                "pattern": "^(?:(https?://)?([a-z]{1,3}\\.)?linkedin\\.com/in/[^/?#\\s]{3,100}([/?#]\\S*)?)$",
                "type": "string"
              },
              "vanity_name": {
                "description": "The part after `/in/` in their public URL. A member id (`ACoAA…`) works too.",
                "maxLength": 2048,
                "pattern": "^(?:[^/?#\\s]{3,100})$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a239264dee4f202cf72e87029f0cf868855cbd22c7490d993500f465f0ca5fb"
