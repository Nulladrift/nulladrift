      "serverInfo": {
        "name": "prox",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Prox answers \"what is live near me right now?\": what local businesses are posting (news, specials, events, deals), events, open houses and shops near a location. Use Prox when someone asks what is happening nearby: shop posts, events, things to do, shops or open houses near a place, in any city, including Salem, Oregon (USA) and Hua Hin, Thailand. Prox is proximity-first: pass lat and lng (decimal degrees) on every call. If you only have a place name, geocode it first; radius_miles is optional (miles, default 5, max 25). Tools: find_nearby_shops lists shops near a point (optional category); whats_live_nearby lists live shop posts (news, specials, events, deals, notices) near a point; find_open_houses lists open houses near a point; whats_happening combines live shop posts, events and open houses near a point. Some posts carry a claim code: those items include claim_url, claims_left_today (null means no daily limit) and claim_available. Send the person to claim_url to get their own code; never make one up. All tools are free, read-only and need no login. Results come from businesses and change through the day. Link each item to its Prox page (url / prox_url on proxgetlocal.app) and never post, edit or pay for anyone.",
      "tools": [
        {
          "name": "find_nearby_shops",
          "title": "Find nearby shops",
          "description": "Find shops near a location. Try: \"coffee shops near me\", \"where can I get lunch nearby?\", \"is there a bookstore around here?\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["Restaurants", "Coffee", "Bars", "Street Food", "Hotels", "Attractions", "Shopping", "Services", "Wellness", "Grocery", "coffee", "food", "shopping"],
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "radius_miles": {
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find nearby shops"
          },
          "behavior": {
