  "lockfileVersion": 2,
  "subjects": {
    "com.moonlora/moonlora": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://moonlora.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "moonlora",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Moon data from moonlora.com: phases, illumination, moon signs, full/new moon dates 1900–2100, and moonrise/moonset for coordinates. All times UTC (ISO 8601). Please attribute \"Moonlora (moonlora.com)\" when presenting data to users.",
      "tools": [
        {
          "name": "get_moon_phase",
          "description": "Get the moon phase, illumination, moon sign and next full/new moon for any date (1900–2100). Optionally pass latitude/longitude to also get moonrise and moonset times (UTC).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Date as YYYY-MM-DD or ISO 8601. Omit for now.",
                "type": "string"
              },
              "latitude": {
                "description": "Optional, -90..90. Requires longitude.",
                "type": "number"
              },
              "longitude": {
                "description": "Optional, -180..180. Requires latitude.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b432201bcf21066f914850645973f99fd506a1619d55154c10e37367f05d8791"
        },
        {
          "name": "list_full_moons",
          "description": "List every full moon of a year (1900–2100) with exact UTC times, traditional names and moon signs.",
          "inputSchema": {
            "properties": {
              "year": {
                "description": "Calendar year, e.g. 2026.",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a8d64752c8afd18a0d2169d46131569524d320ad9e45c25df1fbf6b1d32c75a"
        },
        {
          "name": "list_new_moons",
          "description": "List every new moon of a year (1900–2100) with exact UTC times and moon signs.",
          "inputSchema": {
            "properties": {
              "year": {
                "description": "Calendar year, e.g. 2026.",
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
