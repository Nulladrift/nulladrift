{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agenticcart/agenticcart": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agenticcart.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agenticcart",
        "title": "AgenticCart - AI Store Readiness",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Audit online stores, product pages, product feeds and llms.txt files for AI and agent readiness. All tools take one publicly reachable URL and only read. Each check returns a score from 0 to 100 and names every issue it finds.",
      "tools": [
        {
          "name": "check_acp_feed",
          "title": "Grade a feed against the Agentic Commerce Protocol",
          "description": "Grade a product feed against the Agentic Commerce Protocol (ACP) / OpenAI product feed specification, which governs whether a catalog can be sold inside ChatGPT. Takes the feed URL (XML or JSON) and returns a 0-100 score plus per-attribute findings on required and recommended fields. Use this when asked whether a catalog or feed is ready for agentic commerce, for ChatGPT Instant Checkout, or for ACP compliance in general.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public URL of the product feed (XML or JSON).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Grade a feed against the Agentic Commerce Protocol"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:94c95d3ca0e90776de3b983b8bda8a28c236a866818c7c3fe7095d1829918834"
        },
        {
          "name": "check_llms_txt",
          "title": "Check a site's llms.txt",
          "description": "Fetch a website's /llms.txt and check it against the llmstxt.org format: the H1 title, the summary block, the link sections, whether the listed links answer, and whether the server really sends the file rather than an HTML page. Returns a 0-100 score with findings; when the file is missing it says so. Use this when asked whether a site has an llms.txt, whether it is valid, or how to improve it. For a whole-store review use check_store_readiness, which only notes whether the file exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website URL, e.g. \"https://example.com\". Any page of the site works; the file is read from the site root.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a site's llms.txt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9a24fd7aa3783105f439c7bf3b469027ed8a605cc88a480a11988a3aab53ea7b"
        },
        {
          "name": "check_merchant_feed",
          "title": "Validate a Google Merchant Center feed",
          "description": "Validate a product feed against the Google Merchant Center product specification. Takes the feed URL (XML or JSON) and returns a 0-100 score with findings on required attributes, price formatting, availability values and GTIN checksums. Use this when asked to check, debug or validate a Google Merchant / Google Shopping feed, or to explain why products might be disapproved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public URL of the product feed (XML or JSON).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate a Google Merchant Center feed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad926f9c1c9840a22657a46f6051208cd2f2273c9bce9cd7bcda258c8f52a97b"
        },
        {
          "name": "check_product",
          "title": "Check a product page for AI readability",
          "description": "Audit a single product page for how well AI shopping assistants can read and recommend it. Takes the product page URL and returns a 0-100 score with findings on structured data (Product/Offer schema), price and availability markup, images, description quality and identifiers such as GTIN and brand. Use this for questions like \"why does ChatGPT not recommend this product\", or when reviewing one specific product listing rather than a whole store. Works on any public product page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The full URL of one product page, e.g. \"https://example.com/products/blue-shoe\".",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a product page for AI readability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ec7eec04f622535389d5256be89b65fa9fbe6c2012d080c178169d3f5716fb1"
        },
        {
          "name": "check_store_readiness",
          "title": "Check store AI readiness",
          "description": "Audit any public online store for AI and agent readiness. Takes the store homepage URL and returns a 0-100 score with concrete findings: whether AI crawlers are allowed in robots.txt, whether the pages send their content in the HTML or only build it in the browser with JavaScript (React, Vue or Angular apps that most AI crawlers see as empty), whether product structured data is present, sitemap, llms.txt and HTTPS. Use this when asked whether a shop can be discovered, read or cited by AI shopping assistants such as ChatGPT, Perplexity or Google AI Overviews, or when reviewing a store's AI visibility. Works on any store on the public web - no account, no ownership and no login required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The store homepage URL, e.g. \"https://example.com\". A product or category URL also works; the analyzer resolves the site root from it.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check store AI readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:94f7497bbe76872924542ad909996c17af4a4134f5390c190cb0958a5646f599"
        }
      ],
      "digest": "sha256:8536e6c9b98b8a901fc3b1c65f8ab7826a08e6281845b4b0a851dc8705819c6e"
    }
  }
}
