        {
          "name": "update_card",
          "title": "Update a card",
          "description": "Change a card title, description, due date or colour. Pass null to clear a field. Use move_card to change column.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "card_id": {
                "description": "Card id from list_cards.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "color": {
                "anyOf": [
                  {
                    "pattern": "^#[0-9a-f]{6}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Card colour as #rrggbb, or null."
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "due_date": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Due day as YYYY-MM-DD, or null."
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
