{
  "lockfileVersion": 2,
  "subjects": {
    "com.kanbanthing/kanban": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.kanbanthing.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kanbanthing",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Drive a KanbanThing board. Every tool needs a board_id the user supplied - either a board UUID or a board URL. There is no way to list or search boards, so ask the user for the link rather than guessing. Boards with a password need it passed as `password` on every call.",
      "tools": [
        {
          "name": "create_board",
          "title": "Create a Kanban board",
          "description": "Create a new KanbanThing board and return its id, shareable URL and password. No sign-up. Every board is password protected: pass `password` to choose one, otherwise a random password is generated and returned. Give both the URL and the password to whoever should use the board. Boards are deleted when they expire.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "columns": {
                "description": "Columns left to right after Backlog. Defaults to To Do, In Progress, Done.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "lifespan_days": {
                "description": "Days until the board is deleted. Defaults to 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Board name shown to everyone.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "password": {
                "description": "Board password. A random one is generated and returned if omitted.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a Kanban board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:aa53ff93c9707364420cb4addeba80a1a0e28e2a70f773abd6dea0de43b48e7a"
        },
        {
          "name": "create_card",
          "title": "Create a card",
          "description": "Add a card to a column on a board. Lands in Backlog when no column is given.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "color": {
                "description": "Card colour as #rrggbb.",
                "pattern": "^#[0-9a-f]{6}$",
                "type": "string"
              },
              "column": {
                "description": "Column name or id. Defaults to Backlog.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "maxLength": 4000,
                "type": "string"
              },
              "due_date": {
                "description": "Due day as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              },
              "title": {
                "description": "Card title.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["board_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9c5eddc82feea57233e954d010883563317a8819c5ad0015a390fcd7945e4499"
        },
        {
          "name": "delete_card",
          "title": "Delete a card",
          "description": "Permanently delete a card from a board. This cannot be undone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "card_id": {
                "description": "Card id from list_cards.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["board_id", "card_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete a card"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b43e5e040c589349ba6dbc4ebaca051281a2f466515275e9a3c59a4afdf06803"
        },
        {
          "name": "get_board",
          "title": "Get a board",
          "description": "Read a board by id: its name, expiry, columns and how many cards each column holds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["board_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9847dc8136fd7f078cbd006f0f30cef4e7e93a5710bca1e9db4e41a7d9099cb4"
        },
        {
          "name": "list_cards",
          "title": "List cards",
          "description": "List the cards on a board, optionally only those in one column.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "column": {
                "description": "Column name or id. Omit for every column.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Maximum cards to return. Defaults to 100.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["board_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b81c3257c92d1784273d3250ba6e38994d744ad744f0f0ab525de7435cb3dad"
        },
        {
          "name": "list_columns",
          "title": "List columns",
          "description": "List the columns on a board, left to right, with their ids.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["board_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List columns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ef7a2c06f0e4e0d4b5687f8930b2b4d4ce2bbee84eb62515431f6cd2b37a0d1"
        },
        {
          "name": "move_card",
          "title": "Move a card",
          "description": "Move a card to another column on the same board, at the end of that column.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "card_id": {
                "description": "Card id from list_cards.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "column": {
                "description": "Destination column name or id.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["board_id", "card_id", "column"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Move a card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f04e34e41678802011cd66f957bcee824054bc2fc16041c66b0c9bd396a67782"
        },
        {
          "name": "update_card",
          "title": "Update a card",
          "description": "Change a card title, description, due date or colour. Pass null to clear a field. Use move_card to change column.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "card_id": {
                "description": "Card id from list_cards.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "color": {
                "anyOf": [
                  {
                    "pattern": "^#[0-9a-f]{6}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Card colour as #rrggbb, or null."
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 4000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "due_date": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Due day as YYYY-MM-DD, or null."
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["board_id", "card_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dc2f3ee8da339e18a3eb2eee3fcde934896ccb97784d26b1abbb2bec6eee3a7c"
        }
      ],
      "digest": "sha256:dacbd99cbf485ac554ccab4ae502e6fb321072f658c65d25c9296001631171b3"
    }
  }
}
