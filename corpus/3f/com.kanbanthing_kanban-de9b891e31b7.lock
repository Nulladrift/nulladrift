{
  "lockfileVersion": 2,
  "subjects": {
    "com.kanbanthing/kanban": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.kanbanthing.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kanbanthing",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Drive a KanbanThing board. Every tool needs a board_id the user supplied - either a board UUID or a board URL. There is no way to list or search boards, so ask the user for the link rather than guessing. Boards with a password need it passed as `password` on every call.",
      "tools": [
        {
          "name": "create_board",
          "title": "Create a Kanban board",
          "description": "Create a new KanbanThing board and return its id, shareable URL and password. No sign-up. Every board is password protected: pass `password` to choose one, otherwise a random password is generated and returned. Give both the URL and the password to whoever should use the board. Boards are deleted when they expire.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "columns": {
                "description": "Columns left to right after Backlog. Defaults to To Do, In Progress, Done.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "lifespan_days": {
                "description": "Days until the board is deleted. Defaults to 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Board name shown to everyone.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "password": {
                "description": "Board password. A random one is generated and returned if omitted.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a Kanban board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a41815b00fe759fbd0c7ef6e83eefb2394e929aab9c72f6c6a42af76ac83f702"
        },
        {
          "name": "create_card",
          "title": "Create a card",
          "description": "Add a card to a column on a board. Lands in Backlog when no column is given.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "color": {
                "description": "Card colour as #rrggbb.",
                "pattern": "^#[0-9a-f]{6}$",
                "type": "string"
              },
              "column": {
                "description": "Column name or id. Defaults to Backlog.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "maxLength": 4000,
                "type": "string"
              },
              "due_date": {
                "description": "Due day as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              },
              "title": {
                "description": "Card title.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["board_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:64e6079fffb992a380cce75a482a0a5608962c86c1bd367998e5e37dd2438160"
        },
        {
          "name": "delete_card",
          "title": "Delete a card",
          "description": "Permanently delete a card from a board. This cannot be undone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "board_id": {
                "description": "The board UUID, or the board URL the user shared. Never invent one.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "card_id": {
                "description": "Card id from list_cards.",
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              },
              "password": {
                "description": "The board password, if the board is protected.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["board_id", "card_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete a card"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
