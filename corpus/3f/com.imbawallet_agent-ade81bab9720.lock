            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth_date": {
                "maxLength": 32,
                "type": "string"
              },
              "country": {
                "maxLength": 8,
                "type": "string"
              },
              "email": {
                "description": "Cardholder KYC email, not the agent 3DS mailbox.",
                "maxLength": 254,
                "type": "string"
              },
              "ext_id": {
                "description": "Idempotency key. Reuse the same id to retry the same order.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "first_name": {
                "maxLength": 64,
                "type": "string"
              },
              "imba_product_id": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "last_name": {
                "maxLength": 64,
                "type": "string"
              },
              "phone": {
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["ext_id", "imba_product_id"],
            "type": "object"
          },
