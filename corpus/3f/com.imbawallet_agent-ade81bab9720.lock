            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "network": {
                "maxLength": 32,
                "minLength": 2,
                "type": "string"
              },
              "refresh": {
                "type": "boolean"
              }
            },
            "required": ["address", "network"],
            "type": "object"
