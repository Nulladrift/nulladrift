          "name": "yachts_near",
          "title": "Yachts near a place",
          "description": "List the yachts whose latest AIS position, as yachtfinder.co publishes it, lies within a radius of a named harbor or anchorage (e.g. \"Port Hercule\", \"Antibes\", \"Off Monaco\") or of a latitude and longitude. By default only positions from the last 24 hours. Each yacht comes with the time of her fix, her distance from the place, whether the harbor's page counts her in port, and a link to her page. A yacht whose position the site does not publish is never listed. Each yacht is listed once, however many brokerages list her.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "latitude": {
                "description": "Latitude of the place to search (a harbor, an anchorage or a position at sea), in decimal degrees. Not the user's own location.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "description": "Longitude of the place to search, in decimal degrees. Not the user's own location.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "A harbor, harbor town or anchorage by name, or a boat show (\"FLIBS\", \"the show\": the yachts its page lists at its marinas now). Give this, or latitude and longitude.",
                "maxLength": 80,
                "type": "string"
              },
              "radius_km": {
                "description": "Default 2 km for a harbor, 3 km for an anchorage, 10 km for a coordinate.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "seen_within_hours": {
                "default": 24,
                "description": "Only positions this recent. Default 24.",
                "maximum": 2880,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "default": "any",
