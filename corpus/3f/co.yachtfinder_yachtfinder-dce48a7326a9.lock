        {
          "name": "prepare_inquiry",
          "title": "Prepare an inquiry (never sends)",
          "description": "Prepare a request about one yacht for the person to review and send themselves on yachtfinder.co. This tool never sends anything: it saves a draft (the yacht, optional dates and up to 5 short questions) and returns one link. Give the person the link and tell them plainly that nothing has been sent: on that page they read and edit the draft, sign in, add their own details, and only their tap on Send sends it, under the usual inquiry limits. Take `yacht` from the `id` of a find_yachts, yachts_near or yacht_facts answer; a name is not searched. Questions are shown as plain text: links, markup and line breaks are removed. Do not put names, email addresses or phone numbers in them. The draft expires after 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "First day of interest, YYYY-MM-DD: today or later, at most 12 months ahead.",
                "maxLength": 10,
                "type": "string"
              },
              "date_to": {
                "description": "Last day of interest, YYYY-MM-DD, with date_from.",
                "maxLength": 10,
                "type": "string"
              },
              "questions": {
                "description": "Up to 5 questions for the listing broker, each at most 300 characters, in the person's words.",
                "items": {
                  "maxLength": 300,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "yacht": {
                "description": "The yacht's id from another answer (its `id` field). Not a name and not a link.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["yacht"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When YachtFinder last rebuilt the catalog this answer was read from (ISO 8601)."
              },
              "expires_at": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "questions_kept": {
                "type": "integer"
              },
              "sent": {
                "description": "Always false: this tool never sends.",
                "type": "boolean"
              },
              "source": {
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "summary": {
                "type": "string"
              },
              "url": {
                "description": "The page where the person reviews, edits and sends the draft.",
                "type": "string"
              },
              "yacht": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["data_as_of", "expires_at", "notes", "sent", "source", "summary", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare an inquiry (never sends)"
          },
