      "instructions": "EnglishCue (englishcue.app) has ready-to-teach English lessons for online English teachers. These tools return free reference material for teaching English: conjugations, a/an, collocations, commonly confused words, phrasal verbs, idioms, topic vocabulary, level tests by profession and a search over every free page. Each result includes the englishcue.app link; share it with the user so they can open the full page, quiz or printable.",
      "tools": [
        {
          "name": "a_or_an",
          "title": "A or an?",
          "description": "Decide whether a word or phrase takes “a” or “an”, with the reason (silent h, “you” sound, abbreviations, numbers).",
          "inputSchema": {
            "properties": {
              "phrase": {
                "description": "The word or phrase, e.g. “hour”, “university”, “MBA”, “8-year-old”.",
                "type": "string"
              }
            },
            "required": ["phrase"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A or an?"
          },
          "behavior": {
            "destructive": false,
