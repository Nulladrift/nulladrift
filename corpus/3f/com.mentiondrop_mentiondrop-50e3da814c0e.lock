{
  "lockfileVersion": 2,
  "subjects": {
    "com.mentiondrop/mentiondrop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.mentiondrop.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mentiondrop",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "create_keyword",
          "description": "Start monitoring a new keyword for this account. Takes an optional role (own_brand, competitor, or industry) and a short context string that sharpens relevance scoring. Enforces the account plan keyword limit and rejects keywords too generic to produce signal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "maxLength": 300,
                "type": "string"
              },
              "keyword": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "role": {
                "enum": ["own_brand", "competitor", "industry"],
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Create a monitored keyword"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3632a280797ac2f0c67970e81c7334ab0121b308650abff1a5cd55a87daa9e0"
        },
        {
          "name": "generate_reply_draft",
          "description": "Generate a draft reply or outreach email for one processed mention. Returns draft text for a human to review and never posts, sends, or publishes anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draft_intent": {
                "enum": ["reply", "outreach_email"],
                "type": "string"
              },
              "mention_id": {
                "type": "string"
              }
            },
            "required": ["mention_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Generate a reply draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ce0303ecc14b78309268d1de5a1e041ea0fee8622f59815bda58b9539c82b5a"
        },
        {
          "name": "get_competitor_signals",
          "description": "Return recent mentions matched by competitor-role keywords, optionally narrowed to a single competitor name. Use this to see what people are publicly saying about rival products.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competitor": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get competitor signals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:045bb1e5a710fdde292f6b6da8a839dc3403a1bd2655246c2ca6bd86e20c9b4f"
        },
        {
          "name": "get_digest",
          "description": "Return one grouped catch-up brief of recent mentions, split into owned brand mentions, competitor signals, demand signals, and conversations worth replying to. Use this when a single summary is wanted instead of separate queries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get grouped mention digest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e4cdc006485284e44a5e7699e3859c62d3d3dce6e6d4d8c78a4e7e43478dbb7b"
        },
        {
          "name": "get_mention",
          "description": "Fetch one mention by id with its full record: title, AI summary, sentiment, relevance score, suggested action, source, and matched keyword. Only returns mentions owned by this account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get one mention by id"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29eb36f786c11c60fc3fb2d1d20fa5db53d45c93bcb5b2e47fce7325d8f94dec"
        },
        {
          "name": "get_pain_signals",
          "description": "Return recent industry-role mentions that read as demand or pain signals, meaning they carry a suggested action or score at least 80 for relevance. Use this to find people publicly describing a problem the product solves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get demand and pain signals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f02f22807249620afed2d535bb4ee0f821330acfc758429bd297b179541ffc9e"
        },
        {
          "name": "get_recent_mentions",
          "description": "Return the most recent mentions matched for this account, newest first, each with its AI summary, sentiment, relevance score, and suggested action. Filter by keyword role, specific keyword, source, sentiment, and date range. Use this to answer \"what came in lately\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "role": {
                "enum": ["own_brand", "competitor", "industry"],
                "type": "string"
              },
              "sentiment": {
                "enum": ["positive", "neutral", "negative"],
                "type": "string"
              },
              "source": {
                "enum": ["firehose", "reddit", "brave", "google_news", "serper", "hackernews", "adzuna"],
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Get recent mentions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9222873fbfac9b057e1b9db0774f6e59e522a119c9a00d71a4dece7a2b6ac53c"
        },
        {
          "name": "list_keywords",
          "description": "List every keyword this MentionDrop account monitors, with its id, role (own_brand, competitor, or industry), and active state. Call this first to discover the keyword ids and role names the other tools accept.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "List monitored keywords"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9dd2a4c79f8f3c37d8017c6bd73097adf685776b8bc17510aeb5a1f7a2bd3129"
        },
        {
          "name": "mark_mention_reviewed",
          "description": "Record a review verdict on one mention as relevant or not_relevant. This feedback tunes how future mentions are scored for the account. Re-sending the same verdict is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "verdict": {
                "enum": ["relevant", "not_relevant"],
                "type": "string"
              }
            },
            "required": ["id", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false,
            "title": "Mark a mention reviewed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b2b33989853ac890a98dcc900750994fca2cdecde06d58c9dae6af213fb4a51"
        },
        {
          "name": "search_mentions",
          "description": "Find mentions whose title, summary, URL, suggested action, or matched keyword contain every word in the query. Use this to look for a specific topic, product, or phrase rather than a plain time window.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "type": "string"
              },
              "role": {
                "enum": ["own_brand", "competitor", "industry"],
                "type": "string"
              },
              "sentiment": {
                "enum": ["positive", "neutral", "negative"],
                "type": "string"
              },
              "source": {
                "enum": ["firehose", "reddit", "brave", "google_news", "serper", "hackernews", "adzuna"],
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Search mentions by text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9a1d4861447d30bb6188d4577c4c0329ec2dd4d4af970f08c4122304baad1a4"
        },
        {
          "name": "update_keyword",
          "description": "Update one existing monitored keyword by id: change its role, context, active state, minimum relevance threshold, excluded content types, or exclusion terms. Use list_keywords to find the id. Pausing a keyword sets is_active to false rather than deleting it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "context": {
                "type": ["string", "null"]
              },
              "excluded_content_types": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exclusion_terms": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "is_active": {
                "type": "boolean"
              },
              "min_relevance": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "role": {
                "enum": ["own_brand", "competitor", "industry"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false,
            "title": "Update a monitored keyword"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d903904c549331deae00d81bf91484573582fd9d2c363b51d32b80b84d83684"
        }
      ],
      "digest": "sha256:2dbd1fe2f50659cec3a16d4c91afb203f41d2d9d2d70dbb229b2f91fe86f9b1a"
    }
  }
}
