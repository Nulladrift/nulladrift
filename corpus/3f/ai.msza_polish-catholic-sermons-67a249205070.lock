        {
          "name": "get_transcript",
          "title": "Read a public full-session transcript page",
          "description": "Returns saved final transcript segments from an ended or interrupted public session rather than an AI-edited sermon section. Each page contains at most 20 segments and 12000 UTF-16 text units. next_cursor represents the next page for the same session; long segments continue with char_offset. Text is privacy-redacted, timestamps retain original metadata, and creation-time/ID ordering is stable. Pagination is live, so edits can invalidate a cursor. Saved references concern the returned page. Each page consumes the shared listing budget; oversized stored segments fail explicitly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque next_cursor from the previous page of this same session. Omit for the first page.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "session_id": {
                "description": "Exact public session ID from search_msza_ai or a sermon listing. Only ended/interrupted public sessions are accessible.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "next_cursor": {
                "maxLength": 2048,
                "type": ["string", "null"]
              },
              "references": {
                "additionalProperties": false,
                "description": "Saved, potentially machine-generated annotations, not verified facts. selected_section covers the selected section before text truncation; session may refer to any part of the liturgy. Not all mentions are necessarily annotated. Use person/place IDs with their get tools. Pass prayer_id to get_prayer for any prayer-book entry including songs and liturgical texts. For Bible passages search by title to resolve passage coordinates.",
                "properties": {
                  "items": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        },
                        "kind": {
                          "enum": ["person", "place", "bible", "song", "prayer", "liturgical"],
                          "type": "string"
                        },
                        "prayer_id": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "scope": {
                          "enum": ["selected_section", "session"],
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 300,
                          "type": "string"
                        },
                        "url": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["id", "kind", "scope", "title", "url"],
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "provenance": {
                    "enum": ["stored_annotations"],
                    "type": "string"
                  },
                  "truncated": {
                    "description": "The 50-item output cap or bounded stored-segment scan omitted possible references, or stored annotation JSON was unreadable.",
                    "type": "boolean"
                  }
                },
                "required": ["items", "provenance", "truncated"],
                "type": "object"
              },
              "returned": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "segments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "char_offset": {
                      "maximum": 65536,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "end_time_seconds": {
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "segment_complete": {
                      "type": "boolean"
                    },
                    "segment_id": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "start_time_seconds": {
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "text": {
                      "maxLength": 12000,
                      "type": "string"
                    }
                  },
                  "required": ["char_offset", "end_time_seconds", "segment_complete", "segment_id", "start_time_seconds", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "session_id": {
                "type": "string"
              },
              "text_type": {
                "enum": ["privacy_redacted_stored_transcript"],
                "type": "string"
              },
              "url": {
                "type": ["string", "null"]
              }
            },
            "required": ["next_cursor", "references", "returned", "segments", "session_id", "text_type", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a public full-session transcript page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
