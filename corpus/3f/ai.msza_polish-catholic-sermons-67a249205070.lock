            },
            "required": ["camera_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "maxLength": 500,
                "type": ["string", "null"]
              },
              "camera_id": {
                "type": "string"
              },
              "description": {
