        {
          "name": "get_church",
          "title": "Get a public church profile",
          "description": "Returns a saved public church profile by camera_id with bounded description, address, stored Mass schedule, website, and update time. Profiles can be AI-enriched and schedules can be outdated. The result reads saved data without profile refresh or generation.",
          "inputSchema": {
