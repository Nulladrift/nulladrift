        {
          "name": "search_msza_ai",
          "title": "Search public msza.ai sources",
          "description": "Searches public, predominantly Polish-language msza.ai sermons, sermon studies, Bible passages, prayers, songs, people, and places by topic, keyword, and relevance. Results retain stored source language and contain candidate matches, stable source IDs, citation labels, short excerpts, dates, and links. Date and church filters apply to sermon records. Priest names are unavailable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "camera_id": {
                "description": "Optional stable church profile ID. When supplied, only public sermons from that church are searched.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "content_types": {
                "description": "Optional content categories to search; omitted preserves automatic mixed discovery. Unselected categories are not queried. prayer_book covers prayers, songs and fixed liturgical texts. ai_study results are AI-generated orientation, not evidence. Explicit bible selection enables bounded Scripture search without intent inference. Date/weekday/church filters apply only to sermons; camera_id requires sermon when content_types is supplied. Up to 6 entries; duplicates are removed. Existing source kind labels remain unchanged.",
                "items": {
                  "enum": ["sermon", "ai_study", "prayer_book", "person", "place", "bible"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "date_from": {
                "description": "Optional first Warsaw calendar day of an absolute archive period, inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Optional last Warsaw calendar day of an absolute archive period, inclusive.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days_back": {
                "description": "Optional rolling calendar-day window ending today, for example 7 or 28. Omit when using date_from or date_to.",
                "maximum": 36500,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 6,
                "description": "Maximum number of compact source results to return.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Focused Polish retrieval query for a topical request. For another user language, translate only topical terms into Polish while preserving proper names, exact IDs, Bible references, and supplied filters.",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "weekday": {
                "description": "Optional Warsaw weekday filter: Sunday=0, Monday=1, ..., Saturday=6.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "archiveCapabilities": {
                "type": "object"
              },
              "filters": {
                "additionalProperties": false,
                "properties": {
                  "camera_id": {
                    "type": ["string", "null"]
                  },
                  "content_types": {
                    "description": "Normalized requested categories, present only when explicitly supplied.",
                    "items": {
                      "enum": ["sermon", "ai_study", "prayer_book", "person", "place", "bible"],
                      "type": "string"
                    },
                    "maxItems": 6,
                    "minItems": 1,
                    "type": "array"
                  },
                  "date_from": {
                    "type": ["string", "null"]
                  },
                  "date_to": {
                    "type": ["string", "null"]
                  },
                  "days_back": {
                    "type": ["integer", "null"]
                  },
                  "weekday": {
                    "type": ["integer", "null"]
                  }
                },
                "type": "object"
              },
              "query": {
                "type": "string"
              },
              "retrieval": {
                "type": ["object", "null"]
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content_origin": {
