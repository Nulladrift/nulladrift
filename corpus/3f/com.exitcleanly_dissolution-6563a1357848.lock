          },
          "digest": "sha256:77f07afd8517a761629065f17266199e4e0460c041535ff70a7a300f9cff044c"
        },
        {
          "name": "get_llc_dissolution_requirements",
          "title": "How to dissolve an LLC in a given state",
          "description": "Get what it takes to dissolve (close) an LLC in a specific US state: the filing fee quoted exactly as the state publishes it, the form name, how to file, typical processing time, the official state filing office link, the costs that come on top of the filing fee (franchise tax, tax clearance, newspaper notice), and the full seven-step wind-up sequence. Use when someone asks how to close, dissolve, cancel or wind up an LLC or a business in any state, what it costs, or which form they need.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "US state name or two-letter code, e.g. \"Texas\" or \"TX\"",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
