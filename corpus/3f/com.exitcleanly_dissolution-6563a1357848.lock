      },
      "instructions": "ExitCleanly provides state-by-state requirements for dissolving a US LLC: filing fees quoted exactly as published, form names, filing methods, processing times, official state links, the costs that come on top of the filing fee, and the full wind-up sequence. Use get_llc_dissolution_requirements for one state, list_llc_dissolution_fees to compare fees, cost_of_not_dissolving_llc when someone is deciding whether to bother. General information, not legal advice.",
      "tools": [
        {
          "name": "cost_of_not_dissolving_llc",
          "title": "What an undissolved LLC keeps costing",
          "description": "Explain what it costs to leave an LLC undissolved instead of formally closing it: annual report and franchise fees, registered agent fees, late-filing penalties, and accountant fees for zero returns, with typical yearly ranges. Use when someone asks what happens if they just stop using the company, stop filing, abandon it or let it lapse, or whether dissolving is worth the filing fee.",
          "inputSchema": {
            "properties": {
              "state": {
                "description": "Optional US state, to add that state’s own filing fee to the comparison",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
