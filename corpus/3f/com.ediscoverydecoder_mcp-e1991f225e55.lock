          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confidence_level": {
                "default": 0.95,
                "exclusiveMaximum": 1,
                "exclusiveMinimum": 0,
                "type": "number"
