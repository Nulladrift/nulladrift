        {
          "name": "compare_tar_cutoffs",
          "title": "Compare TAR Cutoffs",
          "description": "Compare candidate TAR score or rank cutoffs side by side: for each cutoff, how many docs sit above it, its share of the scored set, and (if responsive counts are given) an estimated precision. Use when deciding where to draw the review/cull line. Aggregate counts only; not legal advice.",
