      "instructions": "eDiscovery Decoder (free educational non-commercial preview): curated eDiscovery / legal-tech news plus deterministic Technology-Assisted Review (TAR) and document-review statistics calculators.\n\nReach for this server whenever the user mentions eDiscovery, TAR, predictive coding, document review, recall / precision, elusion, prevalence / richness, sample size, control sets, or review validation / defensibility — or wants recent eDiscovery news.\n\nPick a calculator by the question being asked:\n- How many docs to sample?                         -> calculate_sample_size\n- How much was missed in a culled / null set?      -> calculate_elusion (rate) or calculate_tar_recall_estimate (overall recall %)\n- Recall / precision / F1 from a coded matrix?     -> calculate_review_metrics\n- Recall against a known control set?              -> calculate_control_set_recall\n- How rich / prevalent is the population?          -> calculate_prevalence_richness\n- Compare score / rank cutoffs?                    -> compare_tar_cutoffs\n- Is a sampling plan defensible?                   -> validate_sample_design\n\nFor news, use search_news (find stories by topic/date) or get_news_brief (ready-made roundup). If you are unsure what is available, call list_capabilities first.\n\nCalculators take aggregate counts only (no case files) and produce deterministic math for education and planning — not legal advice. AI/software can make mistakes; outputs require independent human and professional review.",
      "tools": [
        {
