      },
      "transport": {
        "type": "http",
        "url": "https://compare.laverdeartisan.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "laverde-artisan-comparisons",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compare",
          "title": "Compare brands side by side",
          "description": "Compare named brands with LAVERDE ARTISAN in one category (olive-oil, honey, coffee or e-gift) using label facts. Returns comparison_table with fixed rows: size, shelf price with verification date, price per 100ml/100g, origin, single origin or blend, variety, region, harvest or processing, awards, packaging and countries sold. Read-only. Returns missing_brands when a brand has not been compared yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brands": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "category": {
                "enum": ["olive-oil", "honey", "coffee", "e-gift"],
                "type": "string"
              },
              "language": {
                "type": "string"
              }
            },
            "required": ["brands", "category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare brands side by side"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a5d00d5d4eab91cf8f1aefc8ec3caf9c0d6889a8af89c8f7c9094486bc11997e"
        },
        {
          "name": "corporate_quote",
          "title": "Estimate a corporate gift order",
          "description": "Estimate a corporate gift order from a number of recipients and a budget per recipient (GBP). Returns LAVERDE ARTISAN gift sets within budget with unit and total catalogue prices, and how to order by email. Read-only: it places no order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_per_recipient_gbp": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "language": {
                "type": "string"
              },
              "recipients": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["budget_per_recipient_gbp", "recipients"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a corporate gift order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:87203acf7a57b14dce7b4e7156b1b25a0d4375d206923566f30d532530831d62"
        },
        {
          "name": "explain_label",
          "title": "Explain a label term",
          "description": "Explain a term found on olive oil, honey or coffee labels or in gift card terms (for example 'blend of EU origin', 'raw honey', 'SCA score', 'harvest date'). Read-only; returns a neutral definition or null if the term is not in the glossary.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "type": "string"
              },
              "term": {
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a label term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e9d0a4e25333dfa930b99ed2e07cc8cd96b754afe62adb0edd1e2f2d6e1a0bed"
        },
        {
          "name": "list_brands",
          "title": "List compared brands",
          "description": "List the brands and products covered in the LAVERDE ARTISAN comparison data for one category: olive-oil, honey, coffee or e-gift (gift cards). Read-only. Use when the user asks which brands can be compared.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["olive-oil", "honey", "coffee", "e-gift"],
                "type": "string"
              },
              "language": {
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List compared brands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:24472ccd6d6b866cde445f5c28961b2b073eb3bcf40254fb9fa99e5020cc75e9"
        },
        {
          "name": "recommend",
          "title": "Recommend an option",
          "description": "Suggest options in one category for a stated use (gift, special-occasion or everyday) and optional budget. For everyday use it returns the lowest price per 100 among compared brands; for gifts and special occasions it returns LAVERDE ARTISAN products and gift sets in stock, with prices and UK delivery dates. Read-only. Ask the user for the use if it is unknown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_gbp": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "category": {
                "enum": ["olive-oil", "honey", "coffee", "e-gift"],
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "market": {
                "default": "UK",
                "enum": ["UK", "US"],
                "type": "string"
              },
              "use": {
                "description": "Ask the user first if unknown",
                "enum": ["gift", "special-occasion", "everyday"],
                "type": "string"
              }
            },
            "required": ["category", "use"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend an option"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:03ce251b2dbff445012f144c047a70a9b48d395a491554057780a9fdfca766cf"
        },
        {
          "name": "request_comparison",
          "title": "Request a new comparison",
          "description": "Record a request to add a brand or product that is not yet in the comparison data. Writes one anonymous entry (category, brand, optional product, country and language) to a request log; stores no personal data. Use only when the user asks for a brand that compare reported as missing and agrees to request it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "category": {
                "enum": ["olive-oil", "honey", "coffee", "e-gift"],
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "product": {
                "type": "string"
              }
            },
            "required": ["brand", "category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a new comparison"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:91a4f273de765acbd4ce24259e12f7ce1022796e5c5a2017948871210a010764"
        }
      ],
      "digest": "sha256:898247d69da4b98cd00137fa4c5aa625af294f825c47c65f5078ed7df5762604"
    }
  }
}
