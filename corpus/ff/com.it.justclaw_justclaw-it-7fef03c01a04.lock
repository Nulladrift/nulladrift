      "instructions": "JustClaw-It: licence-cleared, scored code components from real production repos, each with full source, its licence and a GitHub permalink. Start with search_components (free; semantic search; filter by category, language, license, min_composite); get_component for the source (1 credit); library_stats for live counts. Every result is licence-cleared with attribution: keep the attribution header with copied code.",
      "tools": [
        {
          "name": "check_component_security",
          "title": "Check component security",
          "description": "Check components or repositories for known security advisories before or after you reuse\n    them: severity, CVSS, summary and the versions that fix each one. Cost: 0 credits (free; needs a\n    free key).\n\n    Advisories are repository-wide: OSV advisories for the packages each repository publishes\n    (refreshed weekly), plus published CVE/GHSA ids from web reports. \"none_known\" means no advisory\n    in our data, not that the code is safe.\n\n    Parameters: component_ids -- up to 25 ids from search_components / get_component. names -- up\n    to 25 repositories as \"owner/repo\" or a GitHub URL (a bare repo name matches every owner's).\n\n    Returns JSON {\"results\": [...], \"summary\", \"coverage\", \"note\"}; each result has status\n    \"advisories\" (max_severity, by_severity, the most severe advisories with summary, fixed_versions\n    and links), \"none_known\" (with packages_checked) or \"not_found\".\n\n    packages -- up to 50 {\"ecosystem\": \"npm\"|\"PyPI\"|\"Go\"|\"crates.io\", \"name\", \"version\"}: a verdict\n    per exact version (\"vulnerable\", \"no_known_advisories\", \"unknown\", \"unpinned\" without a version).\n    Every key gets counts and max severity; Pro also gets advisory ids, ranges and fixed versions.\n\n    Example: check_component_security(component_ids=[\"<id>\"], names=[\"nestjs/nest\"],\n    packages=[{\"ecosystem\": \"npm\", \"name\": \"lodash\", \"version\": \"4.17.20\"}])",
          "inputSchema": {
            "properties": {
              "component_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Component Ids"
              },
              "names": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Names"
              },
              "packages": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Packages"
              }
            },
            "title": "check_component_securityArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "check_component_securityOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check component security"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7161085a103de36bb95b56245b6891b4c5da147e14d06ed368976e774cecd24"
