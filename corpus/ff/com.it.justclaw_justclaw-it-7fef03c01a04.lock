        {
          "name": "compose_starter",
          "title": "Compose a starter project (Pro)",
          "description": "Pro feature. Assemble a starter project from 3-8 complementary licence-cleared components\n    for what you are building: file tree, files with attribution headers, a README listing every\n    source and licence, a NOTICE file and install commands. Cost: 10 credits per call (Pro plan;\n    other plans get an upgrade message and are not charged).\n\n    Parameters: prompt (required) -- what you are building, e.g. \"saas with stripe billing and\n    magic-link login\". stack -- optional, e.g. \"nextjs\" or \"python fastapi\".\n\n    Returns JSON with files, tree, readme, notice, install commands and credits_charged.\n\n    Example: compose_starter(prompt=\"todo api with jwt auth\", stack=\"python fastapi\")",
          "inputSchema": {
            "properties": {
              "prompt": {
                "title": "Prompt",
                "type": "string"
              },
              "stack": {
                "default": null,
                "title": "Stack",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "title": "compose_starterArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compose_starterOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compose a starter project (Pro)"
