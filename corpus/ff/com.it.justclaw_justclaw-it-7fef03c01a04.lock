        {
          "name": "search_components",
          "title": "Search licence-cleared components",
          "description": "Find existing, licence-cleared code (functions, classes, handlers, modules) mined from real\n    open-source repositories, before writing it from scratch. Cost: 0 credits (free). Works without\n    an API key with a small per-network limit; a free key raises the limits.\n\n    Every result is licence-cleared with attribution: its SPDX licence, copyright holder and a\n    GitHub permalink come with it.\n\n    Parameters: query (required) -- describe the job in plain words, e.g. \"verify stripe webhook\n    signature in python\". limit -- results per page (default 8; capped by plan). category -- a\n    function tag from list_categories, e.g. \"auth\". language -- python, typescript, javascript,\n    go, rust, java, ... . license -- 'permissive' (MIT/BSD/Apache/ISC; use it when the code goes\n    into a product), 'commercial-safe' (adds weak copyleft such as MPL-2.0), 'open-source' or\n    'any' (default). min_composite -- minimum 0-10 quality score, e.g. 7. offset -- pagination.\n    max_per_repo -- cap per source repo (0 = no cap). exclude_vulnerable -- Pro: drop components\n    whose imported npm/PyPI libraries' latest release has a known high/critical advisory.\n\n    Returns JSON {\"results\": [...]}, each with id, name, description, repo, path, language,\n    license, composite and five sub-scores, similarity and permalink. No code body: pass the id\n    to get_component for the source.\n\n    Example: search_components(query=\"express jwt auth middleware\", language=\"javascript\",\n    license=\"permissive\", min_composite=7)",
          "inputSchema": {
            "properties": {
              "category": {
                "default": null,
                "title": "Category",
                "type": "string"
              },
              "exclude_vulnerable": {
                "default": false,
                "title": "Exclude Vulnerable",
                "type": "boolean"
              },
              "language": {
                "default": null,
                "title": "Language",
                "type": "string"
