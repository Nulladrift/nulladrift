        {
          "name": "licence_report",
          "title": "Lockfile licence report",
          "description": "Licence report for your project's dependencies from its lockfiles: the licence each public\n        package declares (deps.dev registry metadata), its JustClaw-It class (permissive, weak-copyleft,\n        copyleft, none, unknown) and whether it is usable in closed-source software you sell. Dual licences\n        (\"A OR B\") are classified by the most permissive option and say so; unknown never counts as permissive.\n        Attribution evidence, not legal advice, licence clearance or certification.\n\n        Cost: format=\"summary\" is free. \"cyclonedx\" (CycloneDX 1.6 JSON), \"spdx\" (SPDX 2.3 JSON) and \"notice\"\n        (THIRD-PARTY NOTICES text) cost 5 credits per document, one format per call, refunded when the files\n        cannot be parsed or contain no packages. Signed-in callers only (API key or account sign-in).\n\n        Limits: up to 4 files, 2 MB each, 5,000 packages per report; 10 reports a day (Pro: 100); at most 500\n        live registry lookups per report (the rest are \"pending -- re-run later\"). Your files are parsed in\n        memory and never stored or logged; private packages (file:, link:, workspace:, git, path deps,\n        private registries we can recognise) are reported as \"private -- not looked up\" and never sent\n        anywhere. We cannot always tell a private-registry package from a public one: list your private\n        scopes in private_scopes and they are never looked up.\n\n        Parameters: files (required) -- list of {\"name\": \"<file name>\", \"content\": \"<file text>\"}; supported:\n        package-lock.json, pnpm-lock.yaml, yarn.lock, poetry.lock, uv.lock, requirements.txt (pinned == only),\n        go.mod, go.sum, Cargo.lock. format -- summary | cyclonedx | spdx | notice (default summary).\n        private_scopes -- optional names or scopes never to look up, e.g. [\"@acme\", \"github.com/acme\"].\n\n        Returns JSON: the summary (counts per class, not_sellable with reasons, unknown, private, pending), or\n        {format, document, summary, credits_charged}.\n\n        Example: licence_report(files=[{\"name\": \"package-lock.json\", \"content\": \"<file text>\"}], format=\"summary\")",
          "inputSchema": {
            "properties": {
              "files": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Files",
                "type": "array"
              },
              "format": {
                "default": "summary",
                "title": "Format",
                "type": "string"
              },
              "private_scopes": {
                "default": null,
                "items": {
                  "type": "string"
                },
                "title": "Private Scopes",
                "type": "array"
              }
            },
            "required": ["files"],
            "title": "licence_report_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "licence_report_toolOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Lockfile licence report"
          },
          "behavior": {
            "destructive": false,
