      "tools": [
        {
          "name": "price_band",
          "title": "Which nearby list prices settle to the same cash total",
          "description": "For a list price and a tax rate, find every nearby list price that settles to the SAME cash total, and the highest one.\n\nUse this for \"what price should I charge\" and \"can I price to gain from rounding\" questions. There is exactly one free move here and it is easy to get backwards, so do not reason about it unaided:\n\nRounding collapses a band of five consecutive list prices onto one nickel. At 0% tax, $19.98 through $20.02 all settle to $20.00 in cash. Within that band the cash collected is IDENTICAL, so the highest price in it is strictly better — same from cash customers, up to 4 cents more from every card customer. That is genuinely free.\n\nThe move that looks clever and is not: pricing BELOW a nickel so rounding \"adds\" a couple of cents. You collect the same cash and less on card. The rounding delta is not revenue. Do not recommend it.\n\nInput: `listPrice` as a dollar string, `taxRatePercent`, and optionally `spreadCents` (1-50, default 5) for how far either side to look.\n\nReturns: the whole band, the highest price in it, the free gain in cents (never more than 4), and a verdict. Tell the user the size of the number. Four cents is not a pricing strategy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "listPrice": {
                "description": "A STRING is read as dollars (\"19.99\"); a NUMBER is read as integer CENTS (1999). A non-integer number is refused rather than guessed at.",
                "type": ["string", "number"]
              },
              "rule": {
                "description": "symmetric (default) is the Common Cents Act and Canadian method. always-down is Indiana's rule for cash payments of TAX, not a retail rule. always-up is not law anywhere for retail and is here only to quantify it. none is what a card gets.",
                "enum": ["symmetric", "always-down", "always-up", "none"],
                "type": "string"
              },
              "spreadCents": {
                "description": "How far either side to look, 1-50. Default 5, which is one whole band.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "taxRatePercent": {
                "description": "Percentage, e.g. 8.25 — not 0.0825. Supply it whenever it is known: rounding happens after tax, so the rate decides which nickel the total lands on.",
                "type": "number"
              }
            },
            "required": ["listPrice"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:272981b97965ad3456106df53879cae2d81c49650f1b1e1f4dbd0b4170480709"
        },
        {
          "name": "round_cash_total",
          "title": "Round a cash total the way the post-penny rules actually work",
          "description": "Settle a transaction under post-penny cash rounding: exact subtotal, tax on the exact subtotal, then round the final total to the nearest nickel — and only for cash.\n\nUse this for any \"what does X round to\" or \"what do I owe in cash\" question. Four things are wrong in most explanations of this, and each one changes the answer:\n\n1. CASH ONLY. Card, EFT, and gift-card payments are still priced to the cent. The same basket legitimately comes to two different amounts by tender. If asked about a card payment, do not round.\n2. THE TOTAL, NOT EACH ITEM. Rounding per item multiplies the effect by the basket size. Five items at $0.99 total $4.95 — already a nickel, no rounding — where per-item rounding would collect $5.00.\n3. AFTER TAX. Tax is computed on the exact subtotal and the rounding comes last. Rounding the base first changes the tax owed.\n4. THE DIGIT DECIDES. 1, 2, 6, 7 round down; 3, 4, 8, 9 round up; 0 and 5 stand. Do not reason about \"nearest\" from scratch, and do not assume rounding is always up.\n\nInput: pass `subtotal` as a dollar string (\"19.99\") or `items` as a list. A NUMERIC amount is read as CENTS and a STRING as dollars — 1999 and \"19.99\" are the same amount, 19.99 as a number is refused. Pass `taxRatePercent` as a percentage (8.25, not 0.0825); rounding depends on it, so omitting it usually gives the wrong nickel. `tender` is cash or card, default cash. `rule` is symmetric (default), always-down, always-up, or none.\n\nReturns: the exact subtotal, tax, exact total, the rounded amount due, the signed delta, which digit decided it, warnings, and a `disclaimer` field.\n\nTHIS IS NOT LEGAL OR TAX ADVICE. There was no federal rounding law as of September 2026 and state law varies. Do not tell a user what their jurisdiction requires — report the arithmetic and the caveats.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "items": {
                "description": "Line items, totalled in exact cents. Rounding applies to the TOTAL only.",
                "items": {
                  "properties": {
                    "amount": {
                      "description": "A STRING is read as dollars (\"19.99\"); a NUMBER is read as integer CENTS (1999). A non-integer number is refused rather than guessed at.",
                      "type": ["string", "number"]
                    },
                    "label": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 9007199254740991,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["amount"],
                  "type": "object"
                },
                "type": "array"
              },
              "rule": {
                "description": "symmetric (default) is the Common Cents Act and Canadian method. always-down is Indiana's rule for cash payments of TAX, not a retail rule. always-up is not law anywhere for retail and is here only to quantify it. none is what a card gets.",
                "enum": ["symmetric", "always-down", "always-up", "none"],
                "type": "string"
              },
              "subtotal": {
                "description": "The pre-tax subtotal. Use this or `items`.",
                "type": ["string", "number"]
              },
              "taxRatePercent": {
                "description": "Percentage, e.g. 8.25 — not 0.0825. Supply it whenever it is known: rounding happens after tax, so the rate decides which nickel the total lands on.",
                "type": "number"
              },
              "tender": {
                "description": "Default cash. A card is NEVER rounded — if the user is paying by card, the exact total is the answer and any rounding rule is ignored.",
                "enum": ["cash", "card"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5028be171d9d2fb76a8538ae09d9e6d24b35058b12593b85f88a5e146f0189a0"
        },
        {
          "name": "rounding_impact",
          "title": "What cash rounding is actually worth across a price list",
          "description": "Compute what cash rounding is actually worth across a list of prices: mean delta per transaction, the up/down/unchanged split, and a per-thousand figure.\n\nUse this whenever someone asks whether rounding costs or earns money — a very common question and one usually answered with a guess. Do not guess. Symmetric rounding nets to EXACTLY zero over evenly spread totals, because that is what it was designed to do. Real price lists all end in .99 and are not evenly spread, so the true figure is small but not always zero and it moves with the tax rate. This computes it for the actual prices given.\n\nInput: `prices` is a list of dollar strings or integer cents. `taxRatePercent` matters, because tax decides which nickel each total lands on. `rule` defaults to symmetric; pass always-up to quantify what the \"just round everything up\" idea would be worth (about 2 cents a sale, and no jurisdiction has adopted it for retail).\n\nReturns: mean and total delta in cents, the split, a per-thousand transaction figure, a per-price breakdown, and a plain-language verdict. Report the verdict — the size of the number is the answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "prices": {
                "description": "The prices actually charged.",
                "items": {
                  "description": "A STRING is read as dollars (\"19.99\"); a NUMBER is read as integer CENTS (1999). A non-integer number is refused rather than guessed at.",
                  "type": ["string", "number"]
                },
                "minItems": 1,
                "type": "array"
              },
              "rule": {
                "description": "symmetric (default) is the Common Cents Act and Canadian method. always-down is Indiana's rule for cash payments of TAX, not a retail rule. always-up is not law anywhere for retail and is here only to quantify it. none is what a card gets.",
                "enum": ["symmetric", "always-down", "always-up", "none"],
                "type": "string"
              },
              "taxRatePercent": {
                "description": "Percentage, e.g. 8.25 — not 0.0825. Supply it whenever it is known: rounding happens after tax, so the rate decides which nickel the total lands on.",
                "type": "number"
              }
            },
            "required": ["prices"],
            "type": "object"
          },
