          "name": "batch_check_suitability",
          "description": "Suitability for multiple Andaman slugs with the same cert and dive count. Quiz helper; does not recommend a centre.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cert": {
                "enum": ["none", "discover", "scuba_diver", "open_water", "advanced_open_water", "rescue", "divemaster", "instructor", "technical"],
                "type": "string"
              },
              "deep_specialty": {
                "type": "boolean"
              },
              "dives": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "last_dive_months": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["cert", "dives", "slugs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
