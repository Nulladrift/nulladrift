{
  "lockfileVersion": 2,
  "subjects": {
    "com.reelagio/slots": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://reelagio.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "reelagio",
        "title": "Reelagio slot database",
        "version": "1.1.0",
        "description": "Specs for online slot games: provider, grid, volatility, max win, features, series and similar slots.",
        "websiteUrl": "https://reelagio.com",
        "icons": [
          {
            "src": "https://reelagio.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only specs for online slot games from reelagio.com: provider, grid, paylines or ways, mechanic, volatility, max win, features, themes, bonus buy, minimum bet, series and write-ups. Use search_slots to find slots (it accepts a slot name, loose filter values or a plain description), get_slot for one full spec sheet and similar_slots for games that play alike. list_vocabulary lists the exact filter values. Link users to the returned url for the full slot page.",
      "tools": [
        {
          "name": "get_slot",
          "title": "Get slot details",
          "description": "Get the full spec sheet for one slot: provider, grid, paylines or ways, mechanic, volatility, max win, features, themes, bonus buy, minimum bet, release date, whether a free demo is available, the other games in its series and, where Reelagio has one, a short write-up of how it plays. Accepts a slot id, URL slug or name; a partial name or a small typo still resolves, and the result then says which slot was picked and what else it could have meant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slot": {
                "description": "Slot id, slug or name, e.g. \"gates-of-olympus\" or \"Gates of Olympus\"",
                "type": "string"
              }
            },
            "required": ["slot"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:12fd6b155a3190f9bb7ba1e8f19ad79df7eed4c233f9b5c1f3c3e09edcd9b6f7"
        },
        {
          "name": "list_vocabulary",
          "title": "List filter values",
          "description": "List the exact providers, themes, features, mechanics, volatility levels and emoji tags used in the database, with how many slots have each. search_slots accepts close guesses, so call this only to show someone the options or when a search reports a value it did not recognise.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57ff62fdd4dba779a6f0f3f0789fef713805045aa1d4551a71f39bd33f7e3952"
        },
        {
          "name": "search_slots",
          "title": "Search slots",
          "description": "Search the Reelagio database of online slot games. Use it to find slots by name, or by any mix of provider, theme, feature, volatility, mechanic, max win and bonus buy. Filters combine with AND. Values are matched loosely (\"pragmatic\" finds Pragmatic Play, \"fishing\" finds the underwater theme), and `query` also understands a plain description such as \"high volatility fishing slots with bonus buy\". Returns up to `limit` slots, most popular first unless `sort` says otherwise, each with its specs and a link to its page, plus `total` matches. When nothing matches, the result says which value was not recognised or which filters clash, and lists the valid values. For the full spec sheet of one slot use get_slot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bonusBuy": {
                "description": "Only slots with (true) or without (false) a bonus buy",
                "type": "boolean"
              },
              "emoji": {
                "description": "Emoji tags the slot must have, e.g. \"🐵🏛️\" (ALL must match)",
                "type": "string"
              },
              "features": {
                "description": "Slot must have ALL of these features, e.g. [\"free spins\", \"sticky wilds\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "gameType": {
                "description": "How wins are formed: fixed (paylines), ways, megaways, cluster (cluster pays), scatter (pay anywhere) or collect",
                "enum": ["fixed", "ways", "megaways", "cluster", "scatter", "collect"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many slots to return (1-25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "minMaxWin": {
                "description": "Minimum max win as a multiple of the bet, e.g. 10000 for 10,000x",
                "type": "number"
              },
              "provider": {
                "description": "Game studio, e.g. \"Pragmatic Play\"; part of the name is enough",
                "type": "string"
              },
              "query": {
                "description": "A slot name or part of one (\"big bass\"), or a plain description of what to find (\"megaways slots over 20,000x\")",
                "type": "string"
              },
              "sort": {
                "default": "popularity",
                "description": "Order of results: most popular first, or highest max win first",
                "enum": ["popularity", "maxWin"],
                "type": "string"
              },
              "themes": {
                "description": "Slot must have ANY of these themes, e.g. [\"western\"], [\"egyptian\", \"greek\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "volatility": {
                "description": "Slot volatility is ANY of these",
                "items": {
                  "enum": ["low", "medium", "high", "extreme"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5940b35c1fc13f3a4a2e6cc91f77d0eb7b00d0d4e99c72e7625e14c792abe2f"
        },
        {
          "name": "similar_slots",
          "title": "Find similar slots",
          "description": "Find slots that play like a given slot, scored on mechanic, grid, volatility, max win, themes and features. Each match comes with a similarity score from 0 to 100 and the reasons it is similar. Use it for \"games like X\"; to filter by specs instead, use search_slots.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 6,
                "description": "How many similar slots to return (1-25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "slot": {
                "description": "Slot id, slug or name; a partial name or a small typo still resolves",
                "type": "string"
              }
            },
            "required": ["slot"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d03411beaa257dbb6ad31da32bb4b4f17fba0d944edafb3d0ff7e4ce4df6831d"
        }
      ],
      "digest": "sha256:474a29546fdedfb1d56c247432a57756b4b6811c51535813eb82f0424b0ef0ff"
    }
  }
}
