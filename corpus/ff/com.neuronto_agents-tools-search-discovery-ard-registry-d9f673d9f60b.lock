{
  "lockfileVersion": 2,
  "subjects": {
    "com.neuronto/agents-tools-search-discovery-ard-registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://neuronto.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "neuronto",
        "title": "Neuronto Discovery",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Neuronto is an Agentic Resource Discovery (ARD) registry: an index of 185,830 MCP servers, APIs and agents, with the tools each one was verified to offer. Use it when the task needs a capability you do not have. Call find_tool with the task in plain words, for example \"convert a PDF to text\", to get specific tools and the endpoint that serves each; call find_resource to find whole servers, APIs or agents. Every result carries the URL to connect to. registry_stats describes the index, and publish_resource lists your own MCP server or domain.",
      "tools": [
        {
          "name": "find_resource",
          "title": "Find an agentic resource",
          "description": "Search for an MCP server, skill, agent, API or other callable capability for a task, across this index and every other public ARD registry at once. Returns ranked matches with a relevance score, the endpoint to connect to, and which registries carry each result. The score is relevance only and is not a trust or safety rating. Filter by payment (free, payable, x402, mpp) and a maximum price per call: terms come from the publisher's manifest or the endpoint's own 402 answer, and the caller pays the provider directly. 2 free calls a day, then 0.1 USDC per call over x402 (or prepaid credits).",
          "inputSchema": {
            "properties": {
              "federate": {
                "default": true,
                "description": "Also query upstream registries live and fuse the rankings. Off is faster.",
                "type": "boolean"
              },
              "kind": {
                "default": "any",
                "description": "Restrict to one family of resource. Matching is normalised, so 'mcp-server' finds them under every media type in circulation, and 'a2a-agent' or 'agent' both reach A2A cards and ACP, OASF and AgentFacts descriptors. 'webmcp' is browser-page tools, which are not callable servers.",
                "enum": ["any", "mcp-server", "skill", "a2a-agent", "agent", "webmcp", "plugin", "openapi", "graphql", "dataset", "package", "doc", "catalog", "registry"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_per_call": {
                "description": "Most you will pay for one call, in US dollars. A resource whose price is unknown is excluded.",
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "description": "Payment network, for example base, solana, tempo or stripe.",
                "type": "string"
              },
              "payment": {
                "default": "any",
                "description": "Keep only resources with this payment requirement. 'free' means none is known; 'payable' means a price or a 402 is known.",
                "enum": ["any", "free", "payable", "x402", "mpp", "card"],
                "type": "string"
              },
              "query": {
                "description": "The task, in plain language. For example: 'scrape a website behind cloudflare'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find an agentic resource"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:064e456962422a6a3818ebced55ddf0ad4ce183e35774d75d8ceda0880e12039"
        },
        {
          "name": "find_tool",
          "title": "Find a specific verified tool",
          "description": "Search individual MCP tools by name and behaviour, not the servers that host them. Every tool returned here was read back from a live server's tools/list, so the name and input schema are what the server actually exposes rather than what its description claims. Use this when you know the shape of the call you need; use find_resource when you are looking for a service. 2 free calls a day, then 0.1 USDC per call over x402 (or prepaid credits).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the tool should do. For example: 'extract text from a pdf'.",
                "type": "string"
              },
              "with_schema": {
                "default": false,
                "description": "Include each tool's full JSON input schema. Verbose; off by default.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a specific verified tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:553f79cf61a3e99db0e3137d6a73bc341feba7c8f32219c76afa49d176952822"
        },
        {
          "name": "publish_resource",
          "title": "Publish a resource to the index",
          "description": "List an MCP server or an ARD-publishing domain in this index so other agents can discover it. Give `endpoint` for an MCP server URL, or `domain` for a site that serves an ARD manifest. The submission is verified before it is indexed: an endpoint must complete an MCP initialize handshake, and a domain must serve a manifest that parses. Nothing is taken on trust, so a listing that succeeds here is one an agent can actually call. Free submissions are reviewed and listed within 30 days. Set priority=true to list now for 5 USDC (x402).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "A domain serving /.well-known/ard.json, e.g. example.com",
                "type": "string"
              },
              "endpoint": {
                "description": "Absolute URL of an MCP server, e.g. https://example.com/mcp",
                "type": "string"
              },
              "priority": {
                "description": "list now instead of after review (paid, x402)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a resource"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d1250671fd1388213e69a751f59e4cd897d32cfe1f7445fec776d4dd4ac63a3"
        },
        {
          "name": "registry_stats",
          "title": "Index statistics",
          "description": "How large this index is, what it holds, how much of it has been verified by introspection, and which upstream registries are federated.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Index statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a365b248614f2e2381862743f52058ad24d7a6b9adea089c6af6abdbf613defc"
        }
      ],
      "digest": "sha256:b57062969f68c40653ccf3603ab45ad48e30d86feeeb52d5405e911450f1ca34"
    }
  }
}
