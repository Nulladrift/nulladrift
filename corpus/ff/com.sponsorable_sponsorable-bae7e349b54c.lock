        {
          "name": "search_podcasts",
          "title": "Search Podcasts",
          "description": "Search podcasts by name, category, sponsor activity, or the industry of their sponsors. Free to call. Results are paginated (default 25 per page, max 100); page depth is capped at 20 — refine the filters instead of paging deep. Each result carries the podcast_id, name, categories, episode count, and sponsor/sponsorship counts. For one podcast's full profile and its top sponsors, use get_podcast.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug — find slugs with list_categories",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "episodes": {
                "description": "Minimum episode count",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "industry": {
                "description": "Only podcasts sponsored by companies in this industry (loosely matched free text, not a slug)",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "last": {
                "description": "Only podcasts with a sponsorship in this recent window",
                "enum": ["day", "week", "month", "quarter"],
                "type": "string"
              },
              "limit": {
                "description": "Results per page (1-100, default 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number (1-20, default 1)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Match against podcast name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sort_by": {
                "description": "Sort key (default: sponsors)",
                "enum": ["episodes", "sponsors", "sponsorships", "last_episode"],
                "type": "string"
              },
              "sort_order": {
                "description": "Sort direction (default: desc)",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "sponsors": {
                "description": "Minimum number of distinct sponsors",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "sponsorships": {
                "description": "Minimum total sponsorship count",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
