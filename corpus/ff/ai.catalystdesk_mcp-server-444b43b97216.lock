                "enum": ["TIME_BAR", "VOLUME_BAR", "DOLLAR_BAR", "TICK_BAR"],
                "type": "string"
              },
              "fast_period": {
                "maximum": 199,
                "minimum": 2,
                "type": "integer"
              },
              "include_overnight": {
                "type": "boolean"
              },
              "max_bars": {
                "maximum": 512,
                "minimum": 1,
