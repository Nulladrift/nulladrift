        {
          "name": "get_dating_guide",
          "title": "Read Gravitate dating guides",
          "description": "Free; no account, payment or Gravitate credits. Retrieve published English/French coaching articles for single dads, dating after 40 or divorce, and deciding whether to reconnect with an ex. Start with topic=catalog to choose a guide. Returns complete editorial content, update dates and canonical sources. General guidance only: no personalized diagnosis, guaranteed reconciliation or tactics to bypass someone's boundaries.",
