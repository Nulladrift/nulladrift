        {
          "name": "score_photo_observations",
          "title": "Calculate photo-presentation scores",
          "description": "Free; no account, payment or Gravitate credits. Use only with explicitly supplied 1–4 ranks for craft, face visibility/expression, pose, setting and signal, after reading the methodology. Calculates gravitate-v1 totals and caps for 1–6 anonymous observations. Accepts no images/URLs; performs no vision or AI inference. Does not measure beauty, age, identity, attraction percentiles or match probability. Never invent ranks from a request without observations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Response language: English or French.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "observation_source": {
                "description": "Who assigned these ranks. Assistant observations are the calling assistant's judgment, not Gravitate image analysis.",
                "enum": ["human", "assistant", "illustrative"],
                "type": "string"
              },
              "photos": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "An anonymous label A–F, never a name, URL or identifier.",
                      "pattern": "^[A-F]$",
                      "type": "string"
                    },
                    "ranks": {
                      "additionalProperties": false,
                      "description": "Use the published rubric: 1 poor, 2 usable, 3 good, 4 excellent. Rank face visibility/expression, never facial beauty.",
                      "properties": {
                        "craft": {
                          "maximum": 4,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "face": {
                          "maximum": 4,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "pose": {
                          "maximum": 4,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "setting": {
                          "maximum": 4,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "signal": {
                          "maximum": 4,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["craft", "face", "pose", "setting", "signal"],
                      "type": "object"
                    },
                    "subject_present": {
                      "description": "Whether the profile owner is visible; false caps the score at 25.",
                      "type": "boolean"
                    },
                    "visual_defect": {
                      "description": "A clearly visible rendering/artifact defect; true caps the score at 60.",
                      "type": "boolean"
                    }
                  },
                  "required": ["label", "ranks", "subject_present", "visual_defect"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["observation_source", "photos"],
            "type": "object"
          },
