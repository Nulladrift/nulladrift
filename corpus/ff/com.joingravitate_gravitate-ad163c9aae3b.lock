      "instructions": "All currently available Gravitate MCP tools are free: no account, payment or Gravitate credits required. Your assistant provider's own fees are separate. Request limits apply; never suggest buying credits to bypass them. Gravitate provides English/French dating-photo guidance, published coaching articles, explicitly fictional profile examples, curated shoot plans, and deterministic arithmetic from supplied observations. Profile examples are not personalized assessments or proven customer outcomes. No image upload, image analysis, generation, checkout, personal-data storage or external AI calls. Cite returned source_url. Score presentation, never inherent beauty or attraction probability. Read methodology before assigning ranks. Never invent image observations or claim an illustrative score analyzed an image. User context must be explicitly supplied.",
      "tools": [
        {
          "name": "build_photo_shoot_plan",
          "title": "Plan dating-profile photos",
          "description": "Free; no account, payment or Gravitate credits. Use when a user wants a practical 15, 30 or 60 minute dating-photo shoot plan. Tailors curated advice to stated single-dad/returning-to-dating context, setting and photographer. No image generation, bookings, or inference about the user's identity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Response language: English or French.",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "minutes": {
                "description": "Available shoot time in minutes.",
                "enum": ["15", "30", "60"],
                "type": "string"
              },
              "persona": {
                "description": "Choose only a context the user has stated; do not infer parental status or age from an image.",
                "enum": ["single_dad", "returning_to_dating", "general"],
                "type": "string"
              },
              "photographer": {
                "enum": ["friend", "self_timer"],
                "type": "string"
              },
              "setting": {
                "enum": ["home", "outdoors", "both"],
                "type": "string"
              }
            },
            "required": ["minutes", "persona", "photographer", "setting"],
            "type": "object"
          },
