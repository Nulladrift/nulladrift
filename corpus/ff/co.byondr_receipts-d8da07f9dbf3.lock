{
  "lockfileVersion": 2,
  "subjects": {
    "co.byondr/receipts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://byondr.co/receipts/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Receipts & invoices to spreadsheet",
        "version": "0.1.0",
        "websiteUrl": "https://byondr.co/receipts",
        "icons": [
          {
            "src": "https://byondr.co/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://byondr.co/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "byondr Receipts & invoices to spreadsheet. Files over 2 MB: call create_upload, PUT the bytes, pass file_id (or pass a public https url). Every document comes back with each field marked ok, check or missing and a status of ready or needs_review: show the needs_review ones and their review_reasons to the user before using their numbers. Ask for exports csv, line_items_csv, quickbooks_csv or file_pack. Download links expire after 24 hours. If a call asks for payment (HTTP 402 or an x402 payment request), ask the user before paying.",
      "tools": [
        {
          "name": "create_upload",
          "description": "Get a one-hour signed upload URL for a document or a zip that is too large to send inline (over 2 MB; up to 100 MB here) or that already sits on disk. PUT the raw bytes to upload_url with a Content-Length header, then pass file_id to extract_documents. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bytes": {
                "description": "Exact size of the file you will upload, in bytes (at most 100 MB)",
                "maximum": 104857600,
                "minimum": 1,
                "type": "integer"
              },
              "filename": {
                "description": "Original file name, used to name the documents",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["bytes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "type": "string"
              },
              "file_id": {
                "type": "string"
              },
              "max_bytes": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "method": {
                "const": "PUT",
                "type": "string"
              },
              "upload_url": {
                "type": "string"
              }
            },
            "required": ["expires_at", "file_id", "max_bytes", "method", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create upload URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c5a5f952d592d628490659d1ede4aa41ad48e82f69ede31ac85333f09d5528d5"
        },
        {
          "name": "extract_documents",
          "description": "Read receipts and invoices (JPG, PNG, WebP, HEIC, PDF, or a zip of them; one document per file or PDF; up to 25 documents per call, 10 MB each, PDFs up to 10 pages) into checked numbers. Give each file as file_id (from create_upload), url (public https) or data_base64 (up to 2 MB inline). MCP requests are capped near 4 MB by the SDK, so keep all inline base64 in one call under about 2 MB and use create_upload for more. Returns one entry per document with vendor, date, currency, line items, subtotal, tax, total and payment method, each field marked ok, check or missing, the checks that ran, a status of ready or needs_review with review_reasons, and duplicate_of for a repeated receipt. Money is a decimal string, never a float. Each document also carries printed: its dates and currency as printed, the paths of fields whose text could not be read (printed.unreadable), the paths of fields a second read changed after a failed check (printed.second_look), and the paths of amounts printed with a dotted thousands separator on a rupiah-style receipt (\"31.000\") that were read as the whole number (printed.thousands; the value is already converted and the field is marked check), and the paths of amounts the model returned as JSON numbers, whose printed digits are lost (printed.number_typed; the field is marked check). Also returns 24-hour download links for the exports you ask for: csv (default), line_items_csv, quickbooks_csv (one currency; set quickbooks_currency and quickbooks_date_format, MM/DD/YYYY or DD/MM/YYYY) and file_pack (a zip of the originals renamed by date, vendor and total, plus documents.csv). Each link lists the documents left out of that file: quickbooks_csv leaves out every document with status needs_review (and ones missing a date or total), with the reason; csv, line_items_csv and file_pack keep every document. Hints: country (ISO 3166-1 alpha-2) and currency (ISO 4217) help with unclear receipts, date_order (DMY or MDY) settles dates like 03/04/2026. Show documents with status needs_review and their review_reasons to the user before using their numbers. Free for now within a daily quota counted in documents (see start.md); price when payments are enabled: $0.01 per document. Use a client timeout of at least 240 s.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country of the documents, ISO 3166-1 alpha-2 (for example DE)",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "description": "Currency to expect when a document does not print one, ISO 4217 (for example EUR)",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "date_order": {
                "description": "How all-numeric dates such as 03/04/2026 are written: day first or month first",
                "enum": ["DMY", "MDY"],
                "type": "string"
              },
              "exports": {
                "default": ["csv"],
                "description": "Files to produce, each as a 24-hour download link. Default: csv; [] writes no file",
                "items": {
                  "enum": ["csv", "line_items_csv", "quickbooks_csv", "file_pack"],
                  "type": "string"
                },
                "type": "array"
              },
              "files": {
                "description": "Documents to read. Each item needs exactly one of file_id, url or data_base64",
                "items": {
                  "properties": {
                    "data_base64": {
                      "description": "Or base64 bytes of a document or zip, up to 2 MB decoded over MCP (REST accepts 3 MB, and 10 MB across all files in one call); use create_upload or url above that",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "A file_id from create_upload (after the PUT)",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Original file name; the exports and file pack use it",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "url": {
                      "description": "Or a public https URL of a document or zip",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "quickbooks_currency": {
                "description": "quickbooks_csv: the one currency the file holds (default: the most common one)",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "quickbooks_date_format": {
                "description": "quickbooks_csv: how dates are written (default MM/DD/YYYY)",
                "enum": ["MM/DD/YYYY", "DD/MM/YYYY"],
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "documents": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category_suggestion": {
                      "type": ["string", "null"]
                    },
                    "checks": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "detail": {
                            "type": "string"
                          },
                          "name": {
                            "enum": ["is_document", "lines_sum", "total_sum", "cross_check", "tax_rate", "date_valid", "date_recent", "date_order", "currency_read", "money_format", "duplicate", "unsupported"],
                            "type": "string"
                          },
                          "passed": {
                            "type": "boolean"
                          }
                        },
                        "required": ["detail", "name", "passed"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "date": {
                      "type": ["string", "null"]
                    },
                    "discount": {
                      "type": ["string", "null"]
                    },
                    "document_number": {
                      "type": ["string", "null"]
                    },
                    "due_date": {
                      "type": ["string", "null"]
                    },
                    "duplicate_of": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "fields": {
                      "additionalProperties": {
                        "additionalProperties": false,
                        "properties": {
                          "inferred": {
                            "type": "boolean"
                          },
                          "reason": {
                            "type": "string"
                          },
                          "status": {
                            "enum": ["ok", "check", "missing"],
                            "type": "string"
                          }
                        },
                        "required": ["status"],
                        "type": "object"
                      },
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "line_items": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "amount": {
                            "type": ["string", "null"]
                          },
                          "description": {
                            "type": ["string", "null"]
                          },
                          "quantity": {
                            "type": ["string", "null"]
                          },
                          "tax_rate": {
                            "type": ["string", "null"]
                          },
                          "unit_price": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["amount", "description", "quantity", "tax_rate", "unit_price"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "payment": {
                      "additionalProperties": false,
                      "properties": {
                        "card_last4": {
                          "type": ["string", "null"]
                        },
                        "method": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["card_last4", "method"],
                      "type": "object"
                    },
                    "printed": {
                      "additionalProperties": false,
                      "properties": {
                        "currency_text": {
                          "type": ["string", "null"]
                        },
                        "date_text": {
                          "type": ["string", "null"]
                        },
                        "due_date_text": {
                          "type": ["string", "null"]
                        },
                        "number_typed": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "second_look": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "thousands": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "unreadable": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["currency_text", "date_text", "due_date_text", "number_typed", "second_look", "thousands", "unreadable"],
                      "type": "object"
                    },
                    "review_reasons": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "shipping": {
                      "type": ["string", "null"]
                    },
                    "source": {
                      "additionalProperties": false,
                      "properties": {
                        "index": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "pages": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["index", "name", "pages"],
                      "type": "object"
                    },
                    "status": {
                      "enum": ["ready", "needs_review"],
                      "type": "string"
                    },
                    "subtotal": {
                      "type": ["string", "null"]
                    },
                    "tax": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "amount": {
                            "type": ["string", "null"]
                          },
                          "label": {
                            "type": ["string", "null"]
                          },
                          "rate": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["amount", "label", "rate"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "tip": {
                      "type": ["string", "null"]
                    },
                    "total": {
                      "type": ["string", "null"]
                    },
                    "type": {
                      "anyOf": [
                        {
                          "enum": ["receipt", "invoice"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "vendor": {
                      "additionalProperties": false,
                      "properties": {
                        "address": {
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": ["string", "null"]
                        },
                        "tax_id": {
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["address", "name", "tax_id"],
                      "type": "object"
                    }
                  },
                  "required": ["category_suggestion", "checks", "currency", "date", "discount", "document_number", "due_date", "duplicate_of", "fields", "line_items", "payment", "printed", "review_reasons", "shipping", "source", "status", "subtotal", "tax", "tip", "total", "type", "vendor"],
                  "type": "object"
                },
                "type": "array"
              },
              "exports": {
                "additionalProperties": {
                  "additionalProperties": false,
                  "properties": {
                    "expires_at": {
                      "type": "string"
                    },
                    "skipped": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "index": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "reason": {
                            "type": "string"
                          }
                        },
                        "required": ["index", "reason"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["expires_at", "skipped", "url"],
                  "type": "object"
                },
                "propertyNames": {
                  "enum": ["csv", "line_items_csv", "quickbooks_csv", "file_pack"],
                  "type": "string"
                },
                "type": "object"
              },
              "needs_review": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "ready": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "skipped": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "reason"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["documents", "exports", "needs_review", "ready", "skipped"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Extract receipts and invoices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:85236f68af89e30fa97eb0e44ad75ecfc33c317df88ba10176ced15d1ec19773"
        }
      ],
      "digest": "sha256:3e116c0b68c92fc26c720ecce89b3372f1ab74945aadd18508cecc8db362b89d"
    }
  }
