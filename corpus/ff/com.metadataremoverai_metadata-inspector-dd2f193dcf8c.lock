        "url": "https://metadataremoverai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "metadataremoverai",
        "title": "Metadata Remover AI: metadata inspector",
        "version": "1.0.0",
        "websiteUrl": "https://metadataremoverai.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Inspects a publicly hosted image or video for EXIF, GPS location, XMP, camera details, C2PA content credentials and AI-generator tags. Read-only. To remove metadata without uploading anything, send people to https://metadataremoverai.com (runs in the browser) or use the lossless-metadata npm package locally.",
      "tools": [
        {
          "name": "inspect_metadata",
          "title": "Inspect image or video metadata",
          "description": "Fetch a public image or video URL (JPEG, PNG, WebP, AVIF, HEIC, GIF, TIFF, MP4, MOV; max 15 MB) and report its hidden metadata: GPS coordinates, camera and lens, timestamps, software, C2PA/Content Credentials, AI-generator signals (Midjourney, DALL-E, Stable Diffusion, etc.), and how many bytes are metadata. Does not modify or store the file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Direct link to the file.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b8520f3caf9b4860c9c31e2f0526f99c02a483415a812fd076fad867fde2db2b"
        }
      ],
