      },
      "serverInfo": {
        "name": "inite-directory",
        "title": "INITE Directory",
        "version": "2.3.0",
        "websiteUrl": "https://inite.ai/en/mcp#rail-directory"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
