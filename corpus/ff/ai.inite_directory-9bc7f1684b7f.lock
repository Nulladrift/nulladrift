          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "INITE (inite.ai) over MCP. The open tools answer without an account. What needs the person is on each product's signed-in door, which signs them in with OAuth when connected (passkey, email link or password at auth.inite.ai; a new person registers there): https://inite.ai/api/mcp/atlas-owners for a tool's owner, https://inite.ai/api/mcp/analyzer-me for their audits, https://inite.ai/api/mcp/portal-me for their account. When the person wants something this server does not do, inite_connect names the INITE server that does and how to add it; answers whose next step is elsewhere carry it in their next field.\ndirectory (INITE Directory): businesses whose owners confirmed their facts at INITE and proved their domain - find_business by what the person wants and where, in any of English, Russian, Portuguese or Spanish; business for one by slug or domain. Each points at its company facts server (MCP and A2A), which answers hours, every service and the business's own answers, and takes requests where the business allows. Ordered by match and completeness; nobody pays for a place. For which AI tool or app to use, that is the Atlas, not this.",
      "tools": [
        {
          "name": "business",
          "title": "One business, by slug or domain",
          "description": "One business that confirmed its facts at INITE, by its INITE slug (the name before .inite.ai) or its domain: what it does, how to reach it, its services with prices as confirmed, hours and whether it is open now, its locations, its company facts server (MCP and A2A) and whether it takes contact or booking requests from agents there. For which AI tool or app to use, call match_tools or atlas_lookup on the INITE Atlas, not this. Free, no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The business's own domain, e.g. \"acme.com\"",
                "maxLength": 253,
                "type": "string"
              },
              "slug": {
                "description": "The business's slug at INITE, e.g. \"acme\" for acme.inite.ai",
                "maxLength": 63,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "atlas": {
                "type": ["object", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "servers": {
                "type": ["object", "null"]
              },
              "servicesTotal": {
                "type": "integer"
              },
              "slug": {
                "type": "string"
              },
              "takesRequests": {
                "type": "object"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One business, by slug or domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:649e230db8de7a5de441722309c9ad9815542a51b4642c066222a94460144f50"
        },
        {
          "name": "find_business",
          "title": "Find a business by what it does and where",
          "description": "Businesses that confirmed their own facts at INITE and proved their domain, found by what they do and where, in English, Russian, Portuguese or Spanish (\"a dentist in Lisbon\", \"кафе в Москве\"). Each answer gives the name, what it does in its own words, its city, its first services with prices as confirmed, its site, and its company facts server (MCP and A2A) for hours, every service and questions, or to send it a request. For which AI tool or app to use, call match_tools or atlas_lookup on the INITE Atlas, not this. Ordered by how well the words match and how complete the confirmed facts are; no business can pay for a place. Free, no account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Only businesses with a location in this city, in any spelling (\"Lisboa\", \"Lisbon\")",
                "maxLength": 120,
                "type": "string"
              },
              "country": {
                "description": "Only businesses with a location in this country: a name in any of the four languages, or its two-letter code",
                "maxLength": 80,
                "type": "string"
              },
              "language": {
                "description": "A language the business serves in, as a code (\"pt\") or a name; businesses that name none come after the rest",
                "maxLength": 16,
                "type": "string"
              },
              "limit": {
                "description": "How many to return, default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "The nextOffset of the previous answer",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "What the business is or does, or what the person wants from it, e.g. \"dentist\", \"wedding photographer\", \"corte de cabelo masculino\". A place in it counts too.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "limit": {
                "type": "integer"
              },
              "matched": {
                "type": "integer"
              },
              "matching": {
                "type": "integer"
              },
              "nextOffset": {
                "type": ["integer", "null"]
              },
              "offset": {
                "type": "integer"
              },
              "read": {
                "type": "object"
              },
              "results": {
                "items": {
                  "properties": {
                    "a2a": {
                      "type": "string"
                    },
                    "atlas": {
                      "type": ["object", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "kind": {
                      "type": ["string", "null"]
                    },
                    "line": {
                      "type": "string"
                    },
                    "mcp": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "services": {
                      "type": "array"
                    },
                    "site": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "takesRequests": {
                      "type": "object"
                    }
                  },
                  "required": ["mcp", "name", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              },
              "totalIsAtLeast": {
                "type": "boolean"
              }
            },
            "required": ["results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a business by what it does and where"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:deb9e1f432cff8fa8c79478e9007c806aedcf66d33ddaeface3fc1115c534c45"
        },
        {
          "name": "inite_connect",
          "title": "Connect another INITE server",
          "description": "How to add another INITE MCP server to this client, when the person wants something this one does not do. With no argument, the server beside this one; `for`, the one that does a job; `all: true`, every server. Returns the URL, the Claude Code command and the custom-connector step.",
          "inputSchema": {
            "properties": {
              "all": {
                "description": "true: every server, with install links. Ignored with `for`.",
                "type": "boolean"
              },
              "for": {
                "description": "What the person wants next; returns the server that does it",
                "enum": ["add_tool", "premium", "licence", "full_audit", "local_start", "account", "find_tools", "visibility", "talk", "find_business"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "doors": {
                "type": "array"
              },
              "more": {
                "type": "object"
              },
              "others": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["doors", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Connect another INITE server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
