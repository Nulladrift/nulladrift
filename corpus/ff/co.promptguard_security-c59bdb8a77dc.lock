      },
      "transport": {
        "type": "http",
        "url": "https://api.promptguard.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "promptguard",
        "version": "3.49.0",
