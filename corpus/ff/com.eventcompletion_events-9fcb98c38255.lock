{
  "lockfileVersion": 2,
  "subjects": {
    "com.eventcompletion/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eventcompletion.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "eventcompletion",
        "title": "EventCompletion",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EventCompletion tracks the progress of events between a start and an end date and keeps a curated, source-verified catalogue (sports, festivals, trade shows, French school holidays, French political calendar…). Use search_events / upcoming_events / get_event to answer questions about dates; every event has a page_url worth citing. Dates are inclusive calendar days. To add an event, call register_agent once (keep the api_key, send it as \"Authorization: Bearer <key>\"), confirm the contact e-mail, then create_event.",
      "tools": [
        {
          "name": "create_event",
          "title": "Create an event",
          "description": "Create a public progress page for an event (needs an API key whose contact e-mail is confirmed; max 10 per day). The event is unlisted: it is reachable by its URL but not featured in the catalogue or sitemap. Dates are inclusive calendar days.",
          "inputSchema": {
            "properties": {
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "end_date": {
                "description": "Last day (inclusive), YYYY-MM-DD, not before start_date.",
                "type": "string"
              },
              "language": {
                "description": "Language of the page. Default en.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "start_date": {
                "description": "First day, YYYY-MM-DD.",
                "type": "string"
              }
            },
            "required": ["end_date", "name", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f3461ef428741cfb6e7ea66b085b99906d600baf85a0dd338e686398d49fdb8c"
        },
        {
          "name": "get_event",
          "title": "Get an event",
          "description": "Details of one event by slug (the last part of its URL), including progress right now and where its dates were verified.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "e.g. \"wimbledon-2027\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f483ea6df6b3d6fa15070844e0ae75b6d509397f772ad4b3a26e720e58726171"
        },
        {
          "name": "register_agent",
          "title": "Get an API key",
          "description": "Issue an API key for your agent (shown once, keep it). Send it as \"Authorization: Bearer <key>\" on later requests for higher rate limits. Give a contact_email to be able to create events: a confirmation link is sent to it.",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "description": "Optional but required to create events. A human must confirm it.",
                "type": "string"
              },
              "name": {
                "description": "Name of your agent or client, e.g. \"Acme research assistant\".",
                "maxLength": 60,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1b817b656330cf266ad9711b48f731bf20821f9058cebf29d80c43704700f6cd"
        },
        {
          "name": "search_events",
          "title": "Search events",
          "description": "Search EventCompletion's curated events by words in the name or description (every word must match, any order), optionally filtered by status, category and language. Returns dates, progress, location and the page URL.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "e.g. sport, culture, trade-show, tech, school, politics, institutions, civic, music, market, tv-film.",
                "type": "string"
              },
              "language": {
                "description": "Language of the event page.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. \"fiba world cup\" or \"vacances zone b\".",
                "type": "string"
              },
              "status": {
                "description": "Default: all.",
                "enum": ["ongoing", "upcoming", "completed", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c4c06139b276db753afab4fcf1ae5d787b56a52b6f2d3232d874c3640f3be9b"
        },
        {
          "name": "upcoming_events",
          "title": "Upcoming events",
          "description": "Events that start soonest (curated catalogue). Use it for \"what is coming up?\" questions.",
          "inputSchema": {
            "properties": {
              "category": {
                "type": "string"
              },
              "language": {
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "within_days": {
                "description": "Only events starting within this many days. Default 90.",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e42c4c6d5e9800538f5485e3ee74a28d2f908b02708d2f3347f47280373ce47c"
        }
      ],
      "digest": "sha256:139e83ee0fc94afc0d64dbb9312c5e3330ac5ca24de4272bbdc2284a47742de7"
    }
  }
}
