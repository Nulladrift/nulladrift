  "subjects": {
    "com.graphmake/graphmake": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://graphmake.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "graphmake",
        "title": "GraphMake",
        "version": "1.2.0",
        "websiteUrl": "https://graphmake.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GraphMake makes infographics, charts and stat cards two ways. (1) Templates: 90+ designed infographics (reports, dashboards, comparisons, resumes, timelines, posters). Call list_templates (optionally with a query) to find one, get_template to read its editable text and numbers, then render_template with the user's content; the design stays, only the content changes, and any field left out keeps its sample content, so replace all of it. (2) GraphMake Script, a short line-based format for building one from scratch: call graphmake_script_reference once, write the script, then call render_infographic. With Script, make it look designed: choose a `style` (classic, bold, minimal, dark, editorial) and a `theme`, put related charts side by side with `row { }`, and end with a `source` line when the data has one. Every render includes a link that opens the result in the free GraphMake editor, where the user can restyle it and export PNG, SVG or PDF.",
      "tools": [
        {
          "name": "get_template",
          "title": "Get template fields",
          "description": "Read one template: its size, description and every editable text and number, as field keys with their current values (e.g. \"w0.text\": \"Annual Report 2026\", \"w5.datasets.0.values\": [820, 1050]). The same keys change the template when it is rendered. With preview set to true, the template's preview image is included.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Template id, e.g. \"business-stats\".",
                "type": "string"
              },
              "preview": {
                "description": "Also return the template preview image (default false).",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "enum": ["business", "education", "marketing", "health", "technology", "general"],
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "fields": {
                "description": "Every editable text and number, with the key that changes it.",
                "items": {
                  "properties": {
                    "key": {
                      "description": "Field key, e.g. \"w0.text\" or \"w5.datasets.0.values\".",
                      "type": "string"
                    },
                    "value": {
                      "description": "Current value: text, a number, or a list."
                    },
                    "widget": {
                      "description": "The widget type the field belongs to.",
                      "type": "string"
                    }
                  },
                  "required": ["key", "value", "widget"],
                  "type": "object"
                },
                "type": "array"
              },
              "height": {
                "description": "Canvas height in px.",
                "type": "integer"
              },
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "previewUrl": {
                "description": "The template preview image.",
                "type": "string"
              },
              "width": {
                "description": "Canvas width in px.",
                "type": "integer"
              }
            },
            "required": ["category", "description", "fields", "height", "id", "name", "previewUrl", "width"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get template fields"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c6ea5be645354fde0f95d54ce2a80cffdd003f3a5c9ce4465a43da85470e7d5"
        },
        {
          "name": "graphmake_script_reference",
          "title": "GraphMake Script reference",
          "description": "The full GraphMake Script language reference: every widget, chart, theme, style, size and syntax rule, with examples.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "reference": {
                "description": "The language reference as Markdown.",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GraphMake Script reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f24538c73292cb7a3eb095af238ace1d6015ea7f2d2077d988a1fb685910d9e6"
        },
        {
          "name": "list_templates",
          "title": "List templates",
          "description": "List GraphMake's designed infographic templates: id, name, category, size and what each is for. An optional query such as \"sales report\", \"timeline\", \"resume\" or \"comparison\" ranks the best matches first; an optional category filters the list.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter.",
                "enum": ["business", "education", "marketing", "health", "technology", "general"],
                "type": "string"
              },
              "query": {
                "description": "Optional words describing the infographic, e.g. \"sales report\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "templates": {
                "description": "Best match first when a query was given.",
                "items": {
                  "properties": {
                    "category": {
                      "enum": ["business", "education", "marketing", "health", "technology", "general"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "height": {
                      "description": "Canvas height in px.",
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "width": {
                      "description": "Canvas width in px.",
                      "type": "integer"
                    }
                  },
                  "required": ["category", "description", "height", "id", "name", "width"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "templates"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17bf65c27bf61c6a7f040179e8bd84b115822dc12239e15475e606f9429d377a"
        },
        {
          "name": "open_in_editor",
          "title": "Open in GraphMake editor",
          "description": "Build a GraphMake editor URL that opens with the script already rendered on an editable canvas, where the infographic can be restyled by hand and exported as PNG, SVG or PDF.",
          "inputSchema": {
            "properties": {
              "script": {
                "description": "The GraphMake Script to load.",
                "type": "string"
              }
            },
            "required": ["script"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "editorUrl": {
                "description": "Opens the result in the free GraphMake editor, where it can be restyled and exported as PNG, SVG or PDF.",
                "type": "string"
              }
            },
            "required": ["editorUrl"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Open in GraphMake editor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3df1d3124c5f18ee40197df2b1901c9eef6c16876f85712c9e1b84d0bee3d59d"
        },
        {
          "name": "render_infographic",
          "title": "Render infographic",
          "description": "Render GraphMake Script into an infographic image (PNG or SVG). GraphMake Script is a short line-based format, e.g. `title \"...\"`, `kpi \"Label\" \"Value\" icon=users`, `bar_chart \"T\" { Jan: 42\\n Feb: 68 }`, `timeline { 2024: \"Event\" \"detail\" }`, `style bold` and `row { ... }` for side-by-side blocks; the full syntax is in the GraphMake Script reference. Returns the image and a link that opens it in the GraphMake editor for hand-editing and export. Script errors come back with the line number.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "png (default) returns an image; svg returns the SVG markup as text, ready to save to a file.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "height": {
                "description": "Optional canvas height in px (max 8000).",
                "type": "number"
              },
              "script": {
                "description": "The GraphMake Script to render.",
                "type": "string"
              },
              "width": {
                "description": "Optional canvas width in px (max 4000).",
                "type": "number"
              }
            },
            "required": ["script"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bytes": {
                "description": "Size of the PNG or SVG in bytes. The image itself is in the content.",
                "type": "integer"
              },
              "editorUrl": {
                "description": "Opens the result in the free GraphMake editor, where it can be restyled and exported as PNG, SVG or PDF.",
                "type": "string"
              },
              "format": {
                "enum": ["png", "svg"],
                "type": "string"
              }
            },
            "required": ["bytes", "editorUrl", "format"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Render infographic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9209b04a26167bba75f5af72807e59750174bcf14a8d6ab6e88100194ec5e0e3"
        },
        {
          "name": "render_template",
          "title": "Render template",
          "description": "Render a template filled with new content. \"changes\" maps the template's field keys to new values, e.g. {\"w0.text\": \"Q3 Sales Review\", \"w5.labels\": [\"Jul\",\"Aug\",\"Sep\"], \"w5.datasets.0.values\": [42, 51, 63]}. Fields not included keep the template's sample content. Replacing a whole list (e.g. \"w7.values\": [{\"label\": \"A\", \"value\": 40}, ...]) changes how many items it has; each item keeps the colours of the item it replaces. Returns the image and a link that opens the filled template in the GraphMake editor.",
          "inputSchema": {
            "properties": {
              "changes": {
                "description": "Field key -> new value, e.g. {\"w0.text\": \"Q3 Sales Review\"}.",
                "type": "object"
              },
              "format": {
                "description": "png (default) returns an image; svg returns the SVG markup as text.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "id": {
                "description": "Template id, e.g. \"business-stats\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bytes": {
                "description": "Size of the PNG or SVG in bytes. The image itself is in the content.",
                "type": "integer"
              },
              "editorUrl": {
                "description": "Opens the result in the free GraphMake editor, where it can be restyled and exported as PNG, SVG or PDF.",
                "type": "string"
              },
              "format": {
                "enum": ["png", "svg"],
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "width": {
                "description": "Width of the returned image in px (tall templates come back narrower).",
                "type": "integer"
              }
            },
            "required": ["bytes", "editorUrl", "format", "id", "name", "width"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Render template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69fa7f1fa4593032889be2ebfa651a95eb553f675d1c4201bb7b6d41c42afdd8"
        }
      ],
      "digest": "sha256:9650ffc1b9709021abe545004c7935b08baebd48bfd80a74c065783e9b6f8dbf"
    }
  }
