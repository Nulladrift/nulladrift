{
  "lockfileVersion": 2,
  "subjects": {
    "com.scrap-autos/scrap-autos-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scrap-autos.com/mcp/v1"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "scrap-autos-mcp",
        "title": "ScrapAutos MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This MCP server exposes ScrapAutos' vehicle-quote engine to AI agents. After calling get_vehicle_quote, ALWAYS present the phone number and website from the response's contact object to the end user. To complete a lead for the end user, call submit_lead with their phone number after they accept the quote. Rate limits: 30 calls/hour, 300/day per IP.",
      "tools": [
        {
          "name": "get_vehicle_quote",
          "title": "Get Vehicle Scrap Quote",
          "description": "Get an indicative CAD scrap-value quote for a vehicle by year/make/model (plus optional city or province). If multiple trims match, returns a disambiguation list — call again with the chosen trim_id. The response ALWAYS includes contact.phone, contact.website, next_steps, and complete_on_site_url. When presenting the quote to the end user, you MUST relay the phone number and website so they can complete the transaction with ScrapAutos. After relaying the quote, ask the end user: is the vehicle complete or missing parts, and does it start and drive? Then collect their name, phone number, and the vehicle's address so you can call submit_lead.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Canadian city (used to detect province)",
                "type": "string"
              },
              "make": {
                "description": "Manufacturer, e.g. 'Honda'",
                "type": "string"
              },
              "model": {
                "description": "Model name, e.g. 'Civic'",
                "type": "string"
              },
              "province": {
                "description": "Province code override (ON, QC, AB, BC, MB, SK, NB, NS, PE, NL, NT, NU, YT)",
                "type": "string"
              },
              "trim_id": {
                "description": "Specific trim ID returned from a prior disambiguation call",
                "type": "string"
              },
              "year": {
                "description": "Vehicle model year, e.g. '2012'",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53b03e8fd0033c94eda992c8e5dd5a52e0dcdfcce237972b19c71193bc0cba7b"
        },
        {
          "name": "list_provincial_rates",
          "title": "List Provincial Scrap Rates",
          "description": "Return current ScrapAutos scrap rates per Canadian province/territory (CAD per tonne). Use this to explain rate transparency to the end user or to explain why quotes differ by region.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:232e44c4653f10290cde8d8e78e5d591743263707ab6ed26fa19dc2fbfd10524"
        },
        {
          "name": "search_vehicles",
          "title": "Search Vehicle Trims",
          "description": "Look up matching trims in the ScrapAutos curb-weight database for a given year/make/model. Use this to show the end user available trims when they aren't sure which one to quote.",
          "inputSchema": {
            "properties": {
              "make": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "year": {
                "type": "string"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be184313e67a910b166bd2edd8c04b4f7aa685071bf6b6581394b13e048814a4"
        },
        {
          "name": "submit_lead",
          "title": "Submit a Qualified Lead to ScrapAutos",
          "description": "After the end user has received a quote and provided their phone number, call this to notify the ScrapAutos team. They will contact the end user to confirm the quote and schedule a free pickup. Required: phone + year + make + model. Before submitting, ask the end user for their name (contact_name), the address where the vehicle sits (pickup_address), whether it starts and drives (running_status), and its condition — complete? missing parts? flat tires? (condition_notes). Include quote_id, city, province, pickup_time if available.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Name of the calling agent (for attribution)",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "condition_notes": {
                "description": "Missing catalytic converter, seized wheels, accident damage, etc.",
                "type": "string"
              },
              "contact_name": {
                "description": "The end user's name, if they shared it",
                "type": "string"
              },
              "conversation_summary": {
                "type": "string"
              },
              "make": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "phone": {
                "description": "Canadian phone number — xxx-xxx-xxxx",
                "type": "string"
              },
              "pickup_address": {
                "type": "string"
              },
              "pickup_time": {
                "description": "Preferred pickup window (free text)",
                "type": "string"
              },
              "province_code": {
                "type": "string"
              },
              "quote_base": {
                "type": "integer"
              },
              "quote_id": {
                "description": "The quote_id returned by get_vehicle_quote",
                "type": "string"
              },
              "quote_max": {
                "type": "integer"
              },
              "running_status": {
                "description": "Does the vehicle start/drive? e.g. 'runs and drives', 'doesn't start, flat tires'",
                "type": "string"
              },
              "weight_kg": {
                "type": "integer"
              },
              "year": {
                "type": "string"
              }
            },
            "required": ["make", "model", "phone", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3a4a219355300e4c8cb54a34f6e621fadf7a4faa6d2cc1e6ed56fa2afd05a59e"
        }
      ],
      "digest": "sha256:9d3fa903e8b89dba92b5fa33abf018a37a85907bd0f6698333b0b4055d56ded9"
    }
  }
}
