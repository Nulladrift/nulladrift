      "serverInfo": {
        "name": "Caelara Shield",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "shield_audit_token",
          "description": "Screen a token and/or an EVM transaction: token safety score, decoded transaction risks (unlimited approvals, failed or contract-creating transactions), address-poisoning lookalike check (0.050 USDC per call)",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "base|ethereum|arbitrum|optimism (default base)",
                "type": "string"
              },
              "destination": {
                "description": "Address you intend to pay",
                "type": "string"
              },
              "hash": {
                "description": "EVM transaction hash (0x + 64 hex) to decode and screen",
                "type": "string"
              },
              "known_addresses": {
                "description": "Addresses you trust, to detect lookalike destinations",
                "type": "array"
              },
              "token": {
                "description": "Token contract (0x...) or Solana mint to screen",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af473c39c693cb7e3b24b63d47cc46559c049cd2631c2d89c370969a62d8aadc"
        },
        {
          "name": "shield_proxy_fetch",
          "description": "Fetch an https URL through an SSRF-guarded proxy and return a JSON envelope with the scanned body (HTTP 200 envelope, upstream status inside) (0.025 USDC per call)",
          "inputSchema": {
            "properties": {
              "allow": {
                "description": "Comma-separated hostnames or *.suffix patterns; when set the target must match",
                "type": "string"
              },
              "include_blocked": {
                "description": "Return the body even when the content scan verdict is block (default false)",
                "type": "boolean"
              },
              "url": {
                "description": "Target https URL (alternative to putting the URL in the path)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27abaa37148842dd3473ed2ba8d40fb5ae8a57d5fc1ff799030ee5767a5e9ed3"
        },
        {
          "name": "shield_route_quote",
          "description": "Screen and quote a token route (same-chain or cross-chain) across Solana, Ethereum, Base, Arbitrum, Optimism, Polygon and BNB, racing several providers with a 50 bps fee. Returns risk telemetry; set strictBlock true to refuse high-risk routes. Free. Heuristic screening — will miss attacks.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Integer amount of tokenIn in its smallest unit.",
                "pattern": "^[1-9][0-9]{0,38}$",
                "type": "string"
              },
              "fromChain": {
                "description": "Source chain.",
                "enum": ["solana", "ethereum", "base", "arbitrum", "optimism", "polygon", "bnb"],
                "type": "string"
              },
              "recipient": {
                "description": "Destination wallet. Required to build an EVM <-> Solana route (an address of the destination chain family).",
                "type": "string"
              },
              "slippageBps": {
                "default": 50,
                "description": "Slippage tolerance in basis points.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "strictBlock": {
                "default": false,
                "description": "Risk policy. false (default): routes are risk-labelled (risk.riskLevel, risk.flags) and still quoted and built. true: a route whose riskLevel is high (a token screened as high risk, or a token that could not be screened) is refused with HTTP 422 policy_blocked before any quote or transaction is built. Heuristic screening — will miss attacks.",
                "type": "boolean"
              },
              "taker": {
                "description": "Wallet that signs on the source chain. Required for build.",
                "type": "string"
              },
              "toChain": {
                "description": "Destination chain. Defaults to fromChain. EVM <-> Solana is supported.",
                "enum": ["solana", "ethereum", "base", "arbitrum", "optimism", "polygon", "bnb"],
                "type": "string"
              },
              "tokenIn": {
                "description": "Token to sell: \"native\", an EVM address or a Solana mint.",
                "type": "string"
              },
              "tokenOut": {
                "description": "Token to buy: \"native\", an EVM address or a Solana mint.",
                "type": "string"
              },
              "venue": {
                "description": "Optional. \"pumpfun\": route a Solana pair (native SOL and a Pump.fun coin) through the Pump.fun bonding curve only. Without it, Pump.fun coins still on their curve are raced against Jupiter automatically. The 0.50% fee is a SOL transfer in the same transaction.",
                "enum": ["pumpfun"],
                "type": "string"
              }
            },
            "required": ["amount", "fromChain", "tokenIn", "tokenOut"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:789142e24e118d1b1cfcfe2be9ffaa4a65e8ac7b295cfdc5810fb309b0fc8e1d"
        },
        {
          "name": "shield_safe_swap",
          "description": "Screen a token route, then build unsigned transactions for the best route (needs taker; recipient for EVM <-> Solana). The caller signs. Set strictBlock true to refuse high-risk routes. Free. Heuristic screening — will miss attacks.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Integer amount of tokenIn in its smallest unit.",
                "pattern": "^[1-9][0-9]{0,38}$",
                "type": "string"
              },
              "fromChain": {
                "description": "Source chain.",
                "enum": ["solana", "ethereum", "base", "arbitrum", "optimism", "polygon", "bnb"],
                "type": "string"
              },
              "recipient": {
                "description": "Destination wallet. Required to build an EVM <-> Solana route (an address of the destination chain family).",
                "type": "string"
              },
              "slippageBps": {
                "default": 50,
                "description": "Slippage tolerance in basis points.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "strictBlock": {
                "default": false,
                "description": "Risk policy. false (default): routes are risk-labelled (risk.riskLevel, risk.flags) and still quoted and built. true: a route whose riskLevel is high (a token screened as high risk, or a token that could not be screened) is refused with HTTP 422 policy_blocked before any quote or transaction is built. Heuristic screening — will miss attacks.",
                "type": "boolean"
              },
              "taker": {
                "description": "Wallet that signs on the source chain. Required for build.",
                "type": "string"
              },
              "toChain": {
                "description": "Destination chain. Defaults to fromChain. EVM <-> Solana is supported.",
                "enum": ["solana", "ethereum", "base", "arbitrum", "optimism", "polygon", "bnb"],
                "type": "string"
              },
              "tokenIn": {
                "description": "Token to sell: \"native\", an EVM address or a Solana mint.",
                "type": "string"
              },
              "tokenOut": {
                "description": "Token to buy: \"native\", an EVM address or a Solana mint.",
                "type": "string"
              },
              "venue": {
                "description": "Optional. \"pumpfun\": route a Solana pair (native SOL and a Pump.fun coin) through the Pump.fun bonding curve only. Without it, Pump.fun coins still on their curve are raced against Jupiter automatically. The 0.50% fee is a SOL transfer in the same transaction.",
                "enum": ["pumpfun"],
                "type": "string"
              }
            },
            "required": ["amount", "fromChain", "tokenIn", "tokenOut"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb2cc72f9191d94714b3edfca1c1e836092d006d37e6a335ba609680cff0c82e"
        },
        {
          "name": "shield_scan_prompt",
          "description": "Screen untrusted text before it reaches a model: injection patterns, hidden characters, PII and secrets, with an allow/review/block verdict (0.015 USDC per call)",
          "inputSchema": {
            "properties": {
              "redact": {
                "description": "Return sanitized_text with PII and secrets masked (default true)",
                "type": "boolean"
              },
              "text": {
                "description": "Untrusted input text (max 200000 characters)",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fb6088145b59f2304deafd723d75ed7e09f67b83e3971df29f0f3deb7c3018c"
        },
        {
          "name": "shield_universal_action",
          "description": "Pre-execution guardrail for any wallet action: screens it, then builds an unsigned payload the caller signs. type: token_route (multi-chain token routes, 50 bps), perp_order (Hyperliquid builder code or GMX v2 UI fee), prediction_order (Polymarket CLOB order), nft_action (Zora mint with mint referral, or a Seaport listing check), tx_guardrail (decode arbitrary calldata: approvals, operators, transfers, unknown calls). strictBlock true refuses riskLevel high with 422 policy_blocked. Free. Heuristic screening — will miss attacks.",
          "inputSchema": {
            "properties": {
              "params": {
                "description": "token_route: the /v1/route/quote body (add taker to build; venue \"pumpfun\" forces the Pump.fun bonding curve). perp_order: {venue: hyperliquid|gmx, ...}. prediction_order: {venue: polymarket, ...}. nft_action: {venue: zora|seaport, ...}. tx_guardrail: {chainId, to, data, value?, from?}. Full field lists: GET /openapi.json.",
                "type": "object"
              },
              "strictBlock": {
                "default": false,
                "description": "false (default): risk-labelled and built. true: riskLevel high returns 422 policy_blocked and nothing is built.",
                "type": "boolean"
              },
              "type": {
                "enum": ["token_route", "perp_order", "prediction_order", "nft_action", "tx_guardrail"],
                "type": "string"
              }
            },
            "required": ["params", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b486dd7776fb3f555b068df8890428c8c323356b3ca8572502d665fe3afd9323"
        },
        {
          "name": "shield_validate_output",
          "description": "Check model output before it is used: secret and PII leakage, exfiltration links, active content, dangerous shell patterns, optional schema and grounding checks (0.015 USDC per call)",
          "inputSchema": {
            "properties": {
              "output": {
                "description": "Raw model output (max 200000 characters)",
                "type": "string"
              },
              "schema": {
                "description": "JSON Schema subset to enforce",
                "type": "object"
              },
              "source": {
                "description": "Source text for a grounding check",
                "type": "string"
              },
              "system_prompt": {
                "description": "Your system prompt, used only in this request to detect it being echoed back",
                "type": "string"
              }
            },
            "required": ["output"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfd83bedb714c7b2ce6d9c030a568495939cfd3345dbae0f24c00220fc991c92"
        }
      ],
      "digest": "sha256:16d0ae6f1ebbeaa3e1b97bb014ee73f19b1e24b3eec3da5212ed621cc8ad5885"
    }
  }
