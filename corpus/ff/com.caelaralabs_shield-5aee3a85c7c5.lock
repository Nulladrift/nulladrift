{
  "lockfileVersion": 2,
  "subjects": {
    "com.caelaralabs/shield": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shield.caelaralabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "Caelara Shield",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "shield_audit_token",
          "description": "Screen a token and/or an EVM transaction before signing: token safety score with live enrichment (GoPlus honeypot, tax and contract flags on EVM; RugCheck risks plus mint and freeze authority on Solana), decoded transaction risks (unlimited approvals, failed or contract-creating transactions), address-poisoning lookalike check. Read-only heuristic screening. (0.050 USDC per call)",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "base|ethereum|arbitrum|optimism|solana (default base; solana supports token screening only)",
                "type": "string"
              },
              "destination": {
                "description": "Address you intend to pay",
                "type": "string"
              },
              "hash": {
                "description": "EVM transaction hash (0x + 64 hex) to decode and screen",
                "type": "string"
              },
              "known_addresses": {
                "description": "Addresses you trust, to detect lookalike destinations",
                "type": "array"
              },
              "token": {
                "description": "Token contract (0x...) or, with chain solana, a Solana mint",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba579930276432e0fa08f04e35e8a3f1a1003fc6a19bff8a383d982ded6aae29"
        },
        {
          "name": "shield_authorize_action",
          "description": "Pre-execution policy check for an action an agent is about to take: screens the action with Caelara Shield, applies your rules (allowed domains, per-action and daily limits, an approval threshold) and returns allow, deny or require_approval with a verifiable audit receipt; require_approval includes a one-tap approval link. Software policy verdict and audit receipt only: Caelara Labs does not execute, transmit or custody payments or funds. This updates your software policy and receipt. No payment custody is handled by Caelara Labs. (0.005 USDC per call)",
          "inputSchema": {
            "properties": {
              "action_type": {
                "description": "What it is trying to do: payment, transfer, purchase, api_call, email, deploy or your own label (max 64 characters)",
                "type": "string"
              },
              "agent_id": {
                "description": "Who is acting: your identifier for the agent or bot (max 128 characters)",
                "type": "string"
              },
              "amount_usd": {
                "description": "Value of the action in USD",
                "type": "number"
              },
              "destination": {
                "description": "Where it goes: URL, domain, address or account label (max 512 characters)",
                "type": "string"
              },
              "network": {
                "description": "Rail or chain the action would use: base, ethereum, solana, card, bank, other (max 32 characters)",
                "type": "string"
              },
              "notify": {
                "description": "Send approval requests to your linked channels (default true)",
                "type": "boolean"
              },
              "payload": {
                "description": "The action content to screen (string or JSON, max 16 KB)",
                "type": "string"
              },
              "rules": {
                "description": "{ max_per_tx_usd, daily_limit_usd, allowed_domains: [exact or *.suffix], require_approval_above_usd }",
                "type": "object"
              },
              "spent_today_usd": {
                "description": "Your own figure for today; otherwise an approximate running total of allowed amounts per key and agent is used",
                "type": "number"
              }
            },
            "required": ["action_type", "agent_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b3b9114289a571f5bd62f3158e3b907086b654a1de713f4a679a4e9891c41d8"
        },
        {
          "name": "shield_preflight",
          "description": "Boot-time clearance for a bot or agent: screens its system prompt and tool descriptions for injection, tool poisoning and embedded secrets, and returns a clearance_id (its SHA-256 audit receipt) to send as X-Caelara-Clearance on later calls. Optional (0.005 USDC per call)",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "A label for the agent or bot (max 100 characters)",
                "type": "string"
              },
              "system_prompt": {
                "description": "The agent system prompt or instructions (max 200000 characters)",
                "type": "string"
              },
              "tools": {
                "description": "Tool names or { name, description } objects the agent will load (max 64)",
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1461334fd1b80a4ad391e277005b9f21253f5626507a5257e6886373c270a0ec"
        },
        {
          "name": "shield_proxy_fetch",
          "description": "Fetch an https URL through an SSRF-guarded proxy and return a JSON envelope with the scanned body (HTTP 200 envelope, upstream status inside) (0.025 USDC per call)",
          "inputSchema": {
            "properties": {
              "allow": {
                "description": "Comma-separated hostnames or *.suffix patterns; when set the target must match",
                "type": "string"
              },
              "include_blocked": {
                "description": "Return the body even when the content scan verdict is block (default false)",
                "type": "boolean"
              },
              "url": {
                "description": "Target https URL (alternative to putting the URL in the path)",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27abaa37148842dd3473ed2ba8d40fb5ae8a57d5fc1ff799030ee5767a5e9ed3"
        },
        {
          "name": "shield_scan_prompt",
          "description": "Screen untrusted text before it reaches a model: injection patterns, hidden characters, PII and secrets, with an allow/review/block verdict (0.015 USDC per call)",
          "inputSchema": {
            "properties": {
              "redact": {
                "description": "Return sanitized_text with PII and secrets masked (default true)",
                "type": "boolean"
              },
              "text": {
                "description": "Untrusted input text (max 200000 characters)",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fb6088145b59f2304deafd723d75ed7e09f67b83e3971df29f0f3deb7c3018c"
        },
        {
          "name": "shield_validate_output",
          "description": "Check model output before it is used: secret and PII leakage, exfiltration links, active content, dangerous shell patterns, optional schema and grounding checks (0.015 USDC per call)",
          "inputSchema": {
            "properties": {
              "output": {
                "description": "Raw model output (max 200000 characters)",
                "type": "string"
              },
              "schema": {
                "description": "JSON Schema subset to enforce",
                "type": "object"
              },
              "source": {
                "description": "Source text for a grounding check",
                "type": "string"
              },
              "system_prompt": {
                "description": "Your system prompt, used only in this request to detect it being echoed back",
                "type": "string"
              }
            },
            "required": ["output"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfd83bedb714c7b2ce6d9c030a568495939cfd3345dbae0f24c00220fc991c92"
        }
      ],
      "digest": "sha256:ee73078ebffa5ba01e28b2bbf047a8d9959f1c6ba93f53a5276e2dbc74c64456"
    }
  }
}
