      "serverInfo": {
        "name": "stackpulse",
        "title": "Stackpulse",
        "version": "1.0.0",
        "websiteUrl": "https://stackpulse.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Stackpulse watches the official status pages of 9,700+ services (GitHub, AWS, Stripe…) and an account's own websites and APIs (URL monitors), on dashboards.\n\nStatuses come from each company's own status page, checked every minute, so they can lag a real outage by a few minutes. Say \"reports no issues\", never \"is up\".\n\nWhen something is down, \"at the same time\" lists what else had a problem around then: a clue, never a cause. Don't call one the cause of another.\n\nEvery tool needs the connection to be signed in to a Stackpulse account on Pro. Dashboards and monitors can be named by id or by name.",
      "tools": [
        {
          "name": "add_monitor",
          "title": "Add a URL monitor",
          "description": "Watches a website or API endpoint on a dashboard: checks the address once first, and refuses what the app refuses (private addresses, other ports, past the plan). Without a name, the page’s title names it. Headers and request bodies stay in the app.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dashboard": {
                "description": "A dashboard’s name or id",
                "type": "string"
              },
              "name": {
                "description": "What to call it; the page’s title when left out",
                "type": "string"
              },
              "url": {
                "description": "The address to watch, e.g. \"https://shop.example.com\"",
                "type": "string"
              }
            },
            "required": ["dashboard", "url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dashboard": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["id", "name"],
                "type": "object"
              },
              "display": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "test": {
                "additionalProperties": false,
                "description": "The check before it was added",
                "properties": {
                  "code": {
                    "type": "number"
                  },
                  "ms": {
                    "type": "number"
                  },
                  "reason": {
                    "type": "string"
                  },
                  "title": {
                    "type": ["string", "null"]
                  },
                  "up": {
                    "type": "boolean"
                  }
                },
                "required": ["code", "ms", "reason", "title", "up"],
                "type": "object"
              }
            },
            "required": ["dashboard", "display", "id", "name", "test"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a URL monitor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["read", "write"],
