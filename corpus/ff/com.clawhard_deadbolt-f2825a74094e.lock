        "name": "com.clawhard/deadbolt",
        "title": "Deadbolt",
        "version": "1.0.1",
        "description": "Deadbolt checks Supabase access control. Paste migration SQL or a read-only catalog snapshot and get a per-table matrix of what signed-out and signed-in users can read and write, the leaks ranked by severity, and the fix SQL. Runs in your browser, no account.",
        "websiteUrl": "https://deadbolt.clawhard.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Deadbolt: Deadbolt checks Supabase access control. Paste migration SQL or a read-only catalog snapshot and get a per-table matrix of what signed-out and signed-in users can read and write, the leaks ranked by severity, and the fix SQL. Runs in your browser, no account. Use it when you are writing, reviewing or applying Supabase/Postgres migrations, or a user asks whether their Supabase tables are exposed, whether RLS is right, or why they get 42501 permission denied. Tools: deadbolt_check_supabase_access (Check who can read and write Supabase tables (RLS, policies, grants)); deadbolt_catalog_query (Get the read-only SQL that snapshots a live Supabase database for Deadbolt). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "deadbolt_catalog_query",
          "title": "Get the read-only SQL that snapshots a live Supabase database for Deadbolt",
          "description": "Use when you need to check a live Supabase project rather than migration files: returns a read-only SQL query that reads table RLS settings, grants for anon and authenticated, policies, SECURITY DEFINER functions and storage buckets (never row data) and returns one JSON value. Run it with the user's Supabase SQL Editor or a Supabase MCP execute_sql tool, then pass the JSON to deadbolt_check_supabase_access.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the read-only SQL that snapshots a live Supabase database for Deadbolt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d50ce88d1fedb0f27abd5b93aefd9c6ca90d19a061fd37d78b801411056e1982"
        },
        {
          "name": "deadbolt_check_supabase_access",
          "title": "Check who can read and write Supabase tables (RLS, policies, grants)",
          "description": "Use when you write, review or are about to apply Supabase / PostgreSQL migration SQL (CREATE TABLE, RLS, CREATE POLICY, GRANT, views, SECURITY DEFINER functions, storage buckets), or when a user asks whether their Supabase data is exposed, whether RLS is set up right, or why a query returns 42501 permission denied or no rows. Replays the SQL with real Postgres rules and returns, per table, what signed-out (anon) and signed-in (authenticated) users can SELECT/INSERT/UPDATE/DELETE (all rows, own rows, some rows, none, or denied for a missing grant), plus findings with severity and ready-to-run fix SQL: RLS off, policies written but RLS never enabled, using(true) writes, personal columns readable by anyone, views that bypass RLS, SECURITY DEFINER functions anyone can call, user_metadata in policies, public bucket listing, grants missing after the Oct 30 2026 default change. Also accepts the JSON produced by deadbolt_catalog_query for the live database. Deterministic; never connects to any database. Up to 200,000 characters.",
          "inputSchema": {
            "properties": {
              "project_created_before_2026_10_30": {
                "description": "Only for SQL input. true (default): the project grants new public tables to anon and authenticated automatically (projects created before Oct 30, 2026). false: new tables get no grants unless the SQL grants them (projects created on or after Oct 30, 2026).",
                "type": "boolean"
              },
              "sql": {
                "description": "Migration SQL (one or many files concatenated, in order), or the single JSON value returned by the catalog query.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["sql"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check who can read and write Supabase tables (RLS, policies, grants)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
