      "instructions": "ValetVoisin (services de proximité, Suisse romande). Préparez des brouillons de mission avec valetvoisin_create_task_draft ; votre humain confirme et paie — jamais vous.",
      "tools": [
        {
          "name": "valetvoisin_create_task_draft",
          "description": "Prépare un BROUILLON de mission (ex : plombier à Fribourg, ménage à Lausanne). Ne publie rien et ne paie rien : renvoie une reviewUrl que vous devez transmettre à votre humain — il vérifie, corrige et confirme dans son navigateur. Utilisez d'abord valetvoisin_list_services pour choisir categorySlug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Adresse (optionnel — l'humain peut compléter)",
                "type": "string"
              },
              "agentName": {
                "description": "Votre nom d'agent (affiché à l'humain), ex. 'Claude'",
                "type": "string"
              },
              "budgetChf": {
                "description": "Budget indicatif CHF (optionnel)",
                "type": "number"
              },
              "categorySlug": {
                "description": "Slug du service (voir valetvoisin_list_services), ex. 'plomberie'",
                "type": "string"
              },
              "city": {
                "description": "Ville d'intervention, ex. 'Fribourg'",
                "type": "string"
              },
              "description": {
                "description": "Description détaillée pour l'artisan (20–1200 caractères)",
                "type": "string"
              },
              "estimatedHours": {
                "description": "Durée estimée en heures (0.5–80, défaut 1)",
                "type": "number"
              },
              "postalCode": {
                "description": "NPA (optionnel)",
                "type": "string"
              },
              "requestedDate": {
                "description": "Date souhaitée YYYY-MM-DD (optionnel)",
                "type": "string"
              },
              "title": {
                "description": "Titre court de la mission (4–120 caractères)",
                "type": "string"
              },
              "urgency": {
                "description": "Défaut STANDARD",
                "enum": ["STANDARD", "URGENT"],
                "type": "string"
              }
            },
            "required": ["agentName", "categorySlug", "city", "description", "title"],
            "type": "object"
          },
