        {
          "name": "save_catalogue_directory",
          "title": "Create or update a coaching catalogue directory",
          "description": "[Coaching catalogue] With action create (the default): create a directory (page) in the coaching portal catalogue. A directory nests other directories (`tags_sub`), lists coaching sessions whose own `tags` match its `tags_interview_set_filter`, and can carry a fully custom Markdown page (`content_md`) with `[sessions]`, `[directory:…]`, `[session:…]` and `[plan-progress]` directives; the top-level fields are the default language, `translations` adds the others. With action update and `id`: rename it, change which sessions it lists, re-order its sub-directories, author its page, or add, replace or remove a language version (`translations`, per language; null removes one). On update only the fields you send change; a top-level null counts as not sent, except `content_md: null`, the only way to remove the custom page and restore the default grid. Coaching-platform feature. `public` visibility is for platform admins only.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "`create` (default) a new directory with this id. `update` changes the existing directory `id` instead: only the fields you send change (a top-level null argument counts as not sent, except on content_md; in `translations` a language sent as null is removed); `parent_tag` and `merchant_id` are not taken.",
                "enum": ["create", "update"],
                "type": "string"
              },
              "coach_plan": {
                "description": "Coaching-plan stage this item belongs to, used by the coaching-plan progress view. Omit to leave it out of any plan, or on update to keep the current stage. A null is ignored: use `other` when no stage fits. Values: `demo`: Demo session | `screening`: Screening-interview practice | `2nd`: Second-interview practice | `3rd`: Third-interview practice | `closing`: Closing / salary-negotiation practice | `job-specific`: Job-specific coaching | `other`: Anything that does not fit the other buckets.",
                "enum": ["demo", "screening", "2nd", "3rd", "closing", "job-specific", "other", null],
                "type": ["string", "null"]
              },
              "content_md": {
                "description": "Markdown for a custom directory page. When set (even as an empty string) the markdown replaces the default grid and decides the layout itself. Sending null removes the custom page and renders the plain grid of sub-directories and sessions.",
                "type": ["string", "null"]
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "cover_image_url": {
                "description": "Cover image URL for the directory card. An empty string clears it.",
                "type": ["string", "null"]
              },
              "description": {
                "description": "Short description shown on the directory card.",
                "type": ["string", "null"]
              },
              "id": {
                "description": "Directory id — also the catalogue URL segment (/catalogue/<id>) and the value other directories reference in their `tags_sub`.",
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:(?:-|_)+[a-z0-9]+)*$",
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Merchant that owns the directory. Admin / sub-merchant callers only; otherwise taken from your token.",
                "type": ["string", "null"]
              },
              "mojito_language_code": {
                "description": "Language of the directory (one of the listed codes). The catalogue groups directories by language; defaults to `en` when omitted.",
                "enum": ["ar", "bg", "zh", "hr", "cs", "da", "nl", "en", "fil", "fi", "fr", "de", "el", "hi", "hu", "id", "it", "ja", "ko", "ms", "no", "pl", "pt", "br", "ro", "ru", "sk", "es", "sv", "ta", "th", "tr", "uk", "vi", null],
                "type": ["string", "null"]
              },
              "name": {
                "description": "Display name of the directory, shown as the page title and on its card. Required to create.",
                "minLength": 1,
                "type": "string"
              },
              "parent_tag": {
                "description": "Id of an existing directory to nest this new one under: the new id is appended to that directory's `tags_sub`. Omit to create a top-level directory (reachable via a direct link, or by adding it to another directory later).",
                "type": ["string", "null"]
              },
              "status": {
                "description": "Lifecycle status of the catalogue directory. Values: `draft`: the directory exists but is not served to visitors | `active`: Published and served in the catalogue | `archived`: kept for reference but no longer served.",
                "enum": ["draft", "active", "archived", null],
                "type": ["string", "null"]
              },
              "tags_interview_set_filter": {
                "description": "Tag filter selecting which coaching sessions this directory lists: a session appears when its own `tags` contain EVERY tag here (an AND, not an OR). Only `active` coaching/persona sessions with visibility `public` or `merchant_public` are listed.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "tags_sub": {
                "description": "Ids of the directories nested under this one, in display order. Replaces the whole list — send the full set, not just the additions. A referenced directory only appears if it exists and is visible to the viewer.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "translations": {
                "additionalProperties": {
                  "additionalProperties": false,
                  "properties": {
                    "content_md": {
                      "type": ["string", "null"]
                    },
                    "cover_image_url": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "tags_interview_set_filter": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "tags_sub": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    }
                  },
                  "required": ["name"],
                  "type": ["object", "null"]
                },
                "description": "Other language versions of the directory, keyed by mojito language code. The top-level fields are the default language (`mojito_language_code`); each version is a page of its own (name, Markdown, session filter, sub-directories) shown to learners who pick that language. With action update only the languages you send change, and a language sent as null is removed; to remove every version, send null for each language.",
                "type": ["object", "null"]
              },
              "visibility": {
                "description": "Who can see the catalogue directory. Values: `public`: Shared across every merchant | `merchant_public`: Listed in the merchant's own catalogue — the normal choice | `merchant_invite`: Reachable only for invited users | `merchant_unlisted`: Reachable only via a direct link.",
                "enum": ["public", "merchant_public", "merchant_invite", "merchant_unlisted", null],
                "type": ["string", "null"]
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_mcp_instructions": {
                "description": "Server-issued metadata for this conversation.",
                "properties": {
                  "conversation_id": {
                    "description": "The server-issued conversation identifier.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "catalogue_url": {
                "type": ["string", "null"]
              },
              "id": {
                "type": ["string", "null"]
              },
              "merchant_id": {
                "type": ["string", "null"]
              },
              "parent_tag": {
                "type": ["string", "null"]
              },
              "updated_fields": {
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              }
            },
            "required": ["catalogue_url", "id", "merchant_id", "parent_tag"],
            "type": "object",
            "x-fastmcp-top-level-schema": "CatalogueTagCreateResponse"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create or update a coaching catalogue directory"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": ["Coaching catalogue", "jobmojito", "jobmojito-api"]
            },
            "jobmojito": {
              "category": "Coaching catalogue",
              "http_method": "POST"
            }
          },
