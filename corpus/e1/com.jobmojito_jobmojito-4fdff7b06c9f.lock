                            ]
                          },
                          "maxItems": 2,
                          "type": "array"
                        },
                        "id": {
                          "pattern": "^[A-Za-z0-9_-]{1,40}$",
                          "type": "string"
                        },
                        "limit": {
                          "maximum": 500,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "measures": {
                          "items": {
                            "pattern": "^[a-z][a-z0-9_]{0,40}$",
                            "type": "string"
                          },
                          "maxItems": 6,
                          "minItems": 1,
                          "type": "array"
                        },
                        "sort": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "dir": {
                                "enum": ["asc", "desc"],
