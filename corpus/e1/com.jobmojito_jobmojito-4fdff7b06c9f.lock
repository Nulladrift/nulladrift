        },
        {
          "name": "save_component_style",
          "title": "Save a component style",
          "description": "[Admin] Write one named style for a block type as a DRAFT in its own file, components/<block_type>/<style>.css; the company's other CSS files are never changed. The page editor then offers it on every block of that type. Every selector starts from the guide's root plus the style class. styleName on blocks (update_portal_configuration) applies it; it goes live only with publish_portal_stylesheet (files: [file_id]). remove: true deletes a style's file; the guide lists which pages use it, and their blocks go back to the standard look once the stylesheet is published.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "block_type": {
                "description": "The kind of block the style is for. The editor offers it only on blocks of this type.",
                "enum": ["hero", "intro", "media-text", "cards", "feature-grid", "stats", "quote", "testimonials", "video", "video-gallery", "audio", "tabs", "timeline", "jobs", "job-openings", "public-avatar", "easy-apply", "blogs", "rich-text", "divider", "logo-row", "faq", "directory", "cta", "footer", "pricing"],
                "type": "string"
              },
              "brand_id": {
                "description": "A sub-brand, from the brands document of get_portal_configuration.",
                "format": "uuid",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "css": {
                "description": "The rules. Every selector must include .jm-site and the style class, starting from the `root` the guide gives plus the class: `.jm-site .jm-block--hero.jm-style-dark-band h1 { ... }`. Required unless remove is true.",
                "maxLength": 50000,
                "type": "string"
              },
              "description": {
                "description": "One line on what the style is for, kept as a comment above it.",
                "maxLength": 300,
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Optional company. Admins and sub-merchant operators only; other callers always use their token's company.",
                "format": "uuid",
                "type": "string"
              },
              "name": {
                "description": "What the editor calls the style. Saving the same block type and name again replaces it.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "portal": {
                "description": "`interview` (career and interview portal) or `consumer` (coaching portal). Only the interview portal has brands.",
                "enum": ["interview", "consumer"],
                "type": "string"
              },
              "remove": {
                "description": "true deletes the style and its file. Blocks that use it (the guide lists the pages) keep the name and show the standard look once the stylesheet is published.",
                "type": "boolean"
              }
            },
            "required": ["block_type", "name", "portal"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_mcp_instructions": {
                "description": "Server-issued metadata for this conversation.",
                "properties": {
