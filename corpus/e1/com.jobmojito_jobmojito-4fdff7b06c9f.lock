        {
          "name": "list_candidates",
          "title": "List and search candidates",
          "description": "[Candidates] List the merchant's candidates, filtered by text, activity tab, source, channel, owner, prospect or applicant. To search like the admin's segment builder (tags, positions, steps, status, dates, countries, skills, custom fields...) pass `rules` as an object (or the same JSON as a string) {\"match\": \"all\", \"rules\": [...]}, field ids and values from list_candidate_filters, e.g. '{\"match\":\"all\",\"rules\":[{\"field\":\"tag\",\"op\":\"any\",\"values\":[\"<tag id>\"]},{\"field\":\"applied\",\"op\":\"within_days\",\"value\":30}]}' (list operators take `values`, the others `value`); or `segment_id` for a segment's members.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "The candidate's first-touch channel; 'untracked' for candidates without one.",
                "enum": ["linkedin", "indeed", "facebook", "instagram", "social", "email", "job_board", "referral", "agency", "internal", "sourced", "search", "website", "other", "direct", "untracked"],
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "filter_emoji": {
                "description": "Filter by the candidate emoji marker.",
                "type": "string"
              },
              "filter_text": {
                "description": "Search on candidate name, email, external id, phone and CV skills. Every word must match (case and accents ignored; longer words tolerate typos). With rules or segment_id it is one more search rule: name, e-mail, phone, external id or skills contain the text.",
                "type": "string"
              },
              "kind": {
                "description": "prospect: sourced candidates who never applied; applicant: the others. Needs the prospects feature (403 otherwise).",
                "enum": ["prospect", "applicant"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of records to return (1–1000).",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "mentioned_me": {
                "description": "true: only candidates you were mentioned about in a note. Needs the mentions feature (403 otherwise).",
                "type": "boolean"
              },
              "merchant_id": {
                "description": "Optional merchant to scope to. Admins and sub-merchant operators only; other callers always use their token's merchant.",
                "format": "uuid",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of records to skip from the start of the result set.",
                "minimum": 0,
                "type": "integer"
              },
              "order_by": {
                "default": "created_at_newest",
                "description": "Sort order of the result set. With rules or segment_id the search is ordered by last activity, and any order other than the default is refused (422).",
                "enum": ["name_accending", "name_decending", "created_at_newest", "created_at_oldest"],
                "type": "string"
              },
              "owner": {
                "description": "Candidates with an application or interview owned by this recruiter (`profile_id` (list_users)), or 'unassigned' for those without an owner. Needs the candidate_assignment feature (403 otherwise).",
                "type": "string"
              },
              "rules": {
                "anyOf": [
                  {
                    "maxLength": 20000,
                    "type": "string"
                  },
                  {
                    "type": "object"
                  }
                ],
                "description": "Segment-builder search: a JSON object (or the same as a string) such as {\"match\":\"all\",\"rules\":[{\"field\":\"tag\",\"op\":\"any\",\"values\":[\"<tag id>\"]}]}, at most 20 rules; the fields, operators and ids come from list_candidate_filters. With rules, tab, order_by, owner, kind, channel and mentioned_me are refused (422) and limit is at most 200."
              },
              "segment_id": {
                "description": "The members of a saved segment (a segment `id` from list_segments), as with rules: ordered by last activity, limit at most 200, filter_text searches within them; not together with rules, filter_emoji or source.",
                "format": "uuid",
                "type": "string"
              },
              "source": {
                "description": "Filter by how the candidate entered: invited or self-registered. Omit for both.",
                "enum": ["invited", "registered"],
                "type": "string"
              },
              "tab": {
                "description": "Filter candidates by recent activity. Omit (or empty) to include all.",
                "enum": ["interview", "pre-screening", "no-action", "leads", ""],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
