        {
          "name": "create_interview",
          "title": "Create interview",
          "description": "[Interviews] Create a new interview. Without `questions` its question sequence is generated from the position data. With `questions` (an explicit list) they are stored as you wrote them, and in the session the avatar says each one in its tone, rephrased, unless you pass `interview_tone=\"exact\"`, which reads them verbatim (compliance, translated or legally reviewed text). With `questions`, a rapport question is added first unless include_rapport_question=false (3 sent are 4 asked), and the candidate expectations are generated from them. `type` is the product (interview, assessment, coaching); `interview_type` is the style of an interview (pre-screening, second-interview...); invite-only hiring is visibility=merchant_invite. A position's pre-screening STEP (resume and form) is something else: added with set_position_process, configured with update_position_step. The `interview_template_id` also sets the modality (voice-only vs realtime/pre-recorded avatar); `list_avatars` lists the templates. Full-session recording (recording_full_session) and a longer max_duration raise the credit cost.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "additional_context": {
                "additionalProperties": {},
                "description": "Arbitrary additional context object merged into AI generation.",
                "type": ["object", "null"]
              },
              "candidate_expectations": {
                "description": "Free-text candidate expectations folded into AI generation.",
                "type": ["string", "null"]
              },
              "candidate_expectations_json": {
                "description": "With questions only: pre-generated candidate expectations, bucketed by requirement level (weak/moderate/strong); generated from your questions when omitted for type interview.",
                "properties": {
                  "moderate": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "strong": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "weak": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": ["object", "null"]
              },
              "candidate_notification_channel": {
                "description": "SMS / WhatsApp notifications to the candidate, sent alongside the e-mails: \"reminders\" = with both e-mail reminders (day 1 and day 3); \"last_reminder\" = only with the final day-3 reminder; \"all\" = invitation, both reminders and the pre-screening-accepted step. null switches them off.",
                "enum": ["reminders", "last_reminder", "all", null],
                "type": ["string", "null"]
              },
              "candidate_video_introduction": {
                "description": "Whether a candidate video introduction is optional or required.",
                "enum": ["hidden", "optional", "required", null],
                "type": ["string", "null"]
              },
              "code": {
                "description": "Optional external code/reference for the interview.",
                "type": ["string", "null"]
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "country_availability": {
                "description": "Which countries the interview / position is open to on the candidate portal, judged by the IP address the candidate opens it from (an unknown location only passes when countries_allowed / countries_allowed_eu are empty). From a closed country it is left out of the portal listings, and a direct link shows \"not available in your region\". Invited candidates (personal invitation links) and candidates who already started keep access; API and MCP calls themselves are never restricted. Null = not used, every country.",
                "properties": {
                  "countries_allowed": {
                    "items": {
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "countries_allowed_eu": {
                    "type": "boolean"
                  },
                  "countries_blocked": {
                    "items": {
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "countries_blocked_eu": {
                    "type": "boolean"
                  }
                },
                "type": ["object", "null"]
              },
              "cover_image_url": {
                "description": "Cover image URL.",
                "type": ["string", "null"]
              },
              "custom_scoring": {
                "additionalProperties": {},
                "description": "Custom result-scoring overrides merged with defaults and template overrides.",
                "type": ["object", "null"]
              },
              "description": {
                "description": "Short, two-sentence job description shown to the candidate. Required with `questions`. Without `questions`, provide it to use it as-is, or leave it null/blank and it is AI-generated from the position name and any other context.",
                "type": ["string", "null"]
              },
              "description_long": {
                "description": "Full job description in Markdown (Job Purpose, Responsibilities, Required & Preferred Qualifications). Provide it to use it as-is; leave it null/blank and it is AI-generated (interview and assessment types only).",
                "type": ["string", "null"]
              },
              "disable_deduplication": {
                "description": "With questions only: when true, every question is stored as a new record instead of reusing an identical one.",
                "type": ["boolean", "null"]
              },
              "environment": {
                "description": "Which of your webhook environments results from this interview are delivered to. Defaults to production. Values: `production`: Live hiring | `uat`: User-acceptance testing - an isolated environment for pre-release verification | `development`: Development/testing | `demo`: Demonstrations and sales trials.",
                "enum": ["production", "uat", "development", "demo"],
                "type": "string"
              },
              "hiring_for_company": {
                "description": "Who the position is really for. Omit/null (or an object with name null/blank) when hiring for yourself; { name: 'undisclosed' } for an unnamed external client; or { name: '<company>' } plus optional description/location/sector/company_size for a named client.",
                "properties": {
                  "company_size": {
                    "type": ["string", "null"]
                  },
                  "description": {
                    "type": ["string", "null"]
                  },
                  "location": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": ["string", "null"]
                  },
                  "sector": {
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "include_closing_prompt": {
                "description": "Include a closing prompt. Defaults to true.",
                "type": ["boolean", "null"]
              },
              "include_rapport_question": {
                "description": "Include an opening rapport question. Defaults to false (true when questions is given).",
                "type": ["boolean", "null"]
              },
              "instructional_video": {
                "description": "Show an instructional video before approval. Defaults to false.",
                "type": ["boolean", "null"]
              },
              "instructional_video_custom_text": {
                "description": "Custom narration text for the instructional video.",
                "type": ["string", "null"]
              },
              "interview_attempts": {
                "description": "Allowed candidate attempts (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": ["number", "null"]
              },
              "interview_available_till": {
                "description": "ISO date/time after which the interview is no longer available to candidates. null keeps it always available.",
                "type": ["string", "null"]
              },
              "interview_category": {
                "description": "Job category shown on public listings, above the department (free text, e.g. \"Ashore\"). Blank is stored as null.",
                "type": ["string", "null"]
              },
              "interview_conversation_speed": {
                "description": "Conversation pace of the AI avatar. Omit/null keeps the template default pace. Values: `slower`: The avatar speaks more slowly | `normal`: Default speaking pace | `faster`: The avatar speaks more quickly for a snappier conversation | `fluent`: Talking pace: the avatar answers 300 ms after the candidate stops speaking.",
                "enum": ["slower", "normal", "faster", "fluent", null],
                "type": ["string", "null"]
              },
              "interview_department": {
                "description": "Department the position belongs to.",
                "type": ["string", "null"]
              },
              "interview_length": {
