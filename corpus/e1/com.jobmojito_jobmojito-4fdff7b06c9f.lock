              "reason_id": {
                "description": "The reason to change (from list_reasons). Left out: a new reason is created.",
                "format": "uuid",
                "type": "string"
              },
              "sort_order": {
                "description": "Position in the list (lower first). Left out: the end of the list for a new reason, unchanged otherwise.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "archived: no longer offered; past decisions and lifecycle changes keep it. active: offered again (decision reasons only: an archived position status reason cannot be restored).",
                "enum": ["active", "archived"],
                "type": "string"
