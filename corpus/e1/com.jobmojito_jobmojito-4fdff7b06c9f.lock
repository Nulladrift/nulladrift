                      "format": "uuid",
                      "type": "string"
                    },
                    "kombo": {
                      "additionalProperties": false,
                      "properties": {
                        "accept_stage_id": {
                          "maxLength": 200,
                          "type": ["string", "null"]
                        },
                        "reject_reason_ai_id": {
                          "maxLength": 200,
                          "type": ["string", "null"]
                        },
                        "reject_reason_id": {
                          "maxLength": 200,
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "meeting": {
                      "additionalProperties": false,
                      "properties": {
                        "conference_provider": {
                          "enum": ["in_person", "fixed", "zoom", "teams", "meet", null],
                          "type": ["string", "null"]
