          "description": "[Positions] Bookable time slots of a meeting step: action create, update or delete (with start_at, duration_minutes, capacity, location, meeting_url, interviewer and panel). Changing start_at, duration_minutes, location or meeting_url of a booked slot e-mails its booked candidates the new details; deleting one cancels their bookings and e-mails them and the interviewers. dry_run=true lists the booked candidates who would be e-mailed, without writing anything. get_interview_definition include=slots lists the slots. Creating a slot e-mails nobody. start_at is ISO 8601 with the UTC offset of the user's time zone (2026-11-20T14:00:00+01:00) and not in the past.\n\nEvery argument in full, with examples: get_tool_reference.",
