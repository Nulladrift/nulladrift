                    "description": "The server-issued conversation identifier.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "action": {
                "enum": ["created", "updated", "removed", null],
                "type": ["string", "null"]
              },
              "block_type": {
                "type": ["string", "null"]
              },
              "class": {
                "type": ["string", "null"]
              },
              "file": {
                "type": ["string", "null"]
              },
              "file_id": {
                "type": ["string", "null"]
              },
              "live": {
                "enum": [false, null],
                "type": ["boolean", "null"]
              },
              "name": {
