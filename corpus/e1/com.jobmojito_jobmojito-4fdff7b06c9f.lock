        {
          "name": "upload_knowledge_base_document",
          "title": "Upload knowledge base document",
          "description": "[Knowledge base] Upload and process a knowledge base document (base64 file, `name` with its extension) into a store from list_knowledge_base_stores. An interview uses a store once create_interview / update_interview set its knowledge_base_store_id: interview_ids can only name interviews already linked to the store. The optional interview_ids limits it to chosen interviews on the same knowledge base: left out it is every interview, [] is none. Returns the limit it set.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "file": {
                "description": "The document file, base64-encoded.",
                "minLength": 1,
                "type": "string"
              },
              "interview_ids": {
                "description": "The interviews that may use this document, in the live session and when generating questions. Omit it or send null to use the document in every interview on the knowledge base. An empty list limits it to no interview. Each interview must belong to the same company and use this knowledge base.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "knowledge_base_store_id": {
                "description": "The knowledge base store to add the document to.",
                "format": "uuid",
                "minLength": 1,
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Override merchant id (admin / sub-merchant only).",
                "type": "string"
              },
              "name": {
                "description": "Document name with its extension, which decides how the file is read: .doc, .docx, .rtf, .odt, .pdf, .pages or .pptx; any other is refused with 422 (name).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["file", "knowledge_base_store_id", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_mcp_instructions": {
                "description": "Server-issued metadata for this conversation.",
                "properties": {
                  "conversation_id": {
                    "description": "The server-issued conversation identifier.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "interview_ids": {
                "items": {
                  "type": "string"
                },
