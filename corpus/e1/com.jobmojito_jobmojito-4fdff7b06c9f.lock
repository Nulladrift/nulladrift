        {
          "name": "save_report",
          "title": "Save a custom report",
          "description": "[Reports] Without report_id: save a new custom report from a definition (schema jobmojito.report/v1); it is created as Only me and is shared from the returned admin_url. With report_id and the version from get_report: replace that report's whole definition; on a report shared with other people the change is saved as a draft that the owner publishes in the admin, a private report updates at once, whatever `target` says. run_report with a `definition` and no report_id validates one without saving it.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
