                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "interview_salary": {
                "description": "Salary range shown for the position.",
                "type": ["string", "null"]
              },
              "interview_template_id": {
                "description": "Id of the interview template to base this interview on.",
                "format": "uuid",
                "minLength": 1,
                "type": "string"
              },
              "interview_tone": {
                "description": "Interview tone — configures the AI avatar's speaking style and the tone of the AI-generated questions and follow-ups. Case-insensitive; omit to default to relaxed. Values: `relaxed`: Friendly and conversational tone that helps candidates feel at ease | `simple`: Plain language at CEFR A2 level | `professional`: Formal and business-like approach suitable for senior roles | `persuasive`: Engaging style that encourages candidates to elaborate | `exact`: Asks the questions exactly as provided, without rephrasing.",
                "enum": ["relaxed", "simple", "professional", "persuasive", "exact", null],
                "type": ["string", "null"]
              },
              "interview_type": {
                "description": "Interview style — configures the AI avatar and shapes both the AI-generated questions and the follow-up questions asked during the interview. Defaults to pre-screening when omitted. Values: `pre-screening`: quick qualification check focusing on basic requirements and availability | `pre-screening-with-test-questions`: pre-screening plus practical questions to test relevant skills | `second-interview`: deeper dive for candidates who passed initial screening | `remote-freelancer-verification`: verify remote work capabilities and communication skills | `strength-based-interview`: focus on what candidates enjoy and excel at to predict job satisfaction | `potential-based-interview`: assess learning ability and growth potential rather than past experience | `process-verification-from-knowledge-base`: generate questions from your knowledge base documents | `knockout-screening`: a short (about 5 minute) check of the role's must-haves with closed questions.",
                "enum": ["pre-screening", "pre-screening-with-test-questions", "second-interview", "remote-freelancer-verification", "strength-based-interview", "potential-based-interview", "process-verification-from-knowledge-base", "knockout-screening"],
                "type": "string"
