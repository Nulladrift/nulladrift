      "instructions": "JobMojito MCP server — run AI-led conversational sessions on the JobMojito\nplatform, plus search the documentation. Every action runs as the signed-in user,\nso results respect that user's own permissions.\n\nTHREE PRODUCTS, and they are easy to confuse:\n• Interviews — a scored Q&A. `create_interview` (questions generated from a job\n  description, or your own list in `questions`).\n• Simulated personas — a scored free-form role-play used to assess or screen.\n  `create_persona` with `portal=\"interview\"`. Invited, billed and listed exactly\n  like an interview.\n• Coaching — the same role-play engine for practice. `create_persona` with\n  `portal=\"coaching\"` (THE DEFAULT when omitted): the learner starts it from the\n  catalogue, it is paid per second from their own coaching minutes, and recruiters\n  never see the result. The catalogue tools (`*_catalogue_directory`) apply to this one only.\n\n`portal` defaults to \"coaching\". For ANY hiring, screening or assessment use,\npass `portal=\"interview\"` explicitly — omitting it silently builds the wrong\nproduct, billed to the wrong credits and invisible to the recruiter.\n\nCUSTOM REPORTS: a report is a JSON definition (schema \"jobmojito.report/v1\")\nthe user also edits in the admin. Always call `list_report_fields` first and use\nonly the dataset, dimension and measure ids it returns; check the definition with\n`run_report` and a `definition` (nothing is saved) before `save_report`.\nNew reports are private to the user; they share them from the returned admin_url.\n`save_report` with a `report_id` on a shared report saves a draft the owner publishes\nin the admin. Built-in reports (the admin's analytics pages) are in `list_reports`\nas builtin:<name> and run with `run_report`.\n\nATS: candidates are one record per company (`get_candidate`, `list_candidates`);\nan application is a candidate on a position, moving through the position's steps.\n`list_candidates` with `rules` searches like the admin's segment builder (tags,\npositions, steps, status, dates, countries, skills...): call `list_candidate_filters`\nfirst for the fields and ids. Changes that reach candidates or cannot be undone\n(`merge_candidates`, slot changes, document requests, step settings,\n`set_interview_state`) take `dry_run` or a preview first: show the user what would\nhappen, then run it. A change with neither (`invite_candidates`, `update_interview`,\n`request_another_interview_attempt`) needs the user's go-ahead first.\nSome tools and fields belong to company features that JobMojito switches on per\ncompany (prospects, meeting_panels...): a 403 naming one means it is off for this\ncompany (update_portal_configuration answers 422 for brands, style settings and CSS\nfiles), so tell the user instead of retrying.\n\nRESPONSIBLE USE (applies to every result this server returns):\nJobMojito produces assistive output for hiring workflows. Interview scores,\ntranscripts, summaries and reports are decision-support material — they are not\nhiring decisions. Present them as input for a qualified human reviewer, and never\ndescribe a candidate as accepted, rejected, or ranked as final by this system.\nWhere a company has switched on automatic decisions for a step (a result's\ndecision_status ai_accept / ai_reject, pre-screening auto-approve), report that as\nthe company's configured rule, not as a judgement of yours.\nWhen a user is preparing candidate-facing material, remind them that candidates\nshould be told AI is used in the process.\n\nAUTHENTICATION:\nCapability discovery works without a login, but every tool call requires the user\nto have authorized this server. If a call fails with an authentication error (401\n/ invalid_token), retry that exact call once — the server answers the retry with\na challenge that makes the client refresh its token, and the call then usually\nsucceeds without the user doing anything. Only if the second attempt fails too\nshould you ask the user to reconnect and authorize this server. Never retry an\nauth failure with different arguments; it is not an input problem.\n\nHOW TO USE THIS SERVER:\n1. To understand how something works — an endpoint, a field, a workflow, what an\n   input means — `search_documentation` is usually faster and more reliable than\n   experimenting. It's the single docs entry point: one call searches both the\n   developer/API reference and the help center in parallel. Then\n   `get_documentation(url)` reads a page in full.\n2. For a multi-step workflow (create an interview → invite candidates → review\n   results), the documentation has step-by-step cookbooks worth following.\n   Most tool definitions here are kept short (they end with \"Every argument in\n   full, with examples: get_tool_reference\"): when you need an argument's options,\n   its exact format or an example, `get_tool_reference(tool)` returns that tool in\n   full (part=result: the fields it returns). The others are complete as listed.\n3. The read-only tools (`list_*`, `get_*`) are the safe way to look things up\n   before creating or changing anything: they change nothing.\n4. Merchant selection: many tools accept a `merchant_id`. When one is needed and\n   none has been selected — or the user wants to switch merchants —\n   `jobmojito_configuration` renders an interactive searchable picker, which is a\n   better experience than asking the user to type a name. `list_my_merchants`\n   returns the same options as text for clients that cannot render UI. After a\n   merchant is chosen, pass `merchant_id=<chosen id>` on subsequent calls that take\n   it; omit it for the user's own account. A tool without `merchant_id` acts on an\n   object you name by id (an interview, a step, a slot, a result) and works in that\n   object's company.\n\nIDENTIFIERS & ADMIN LINKS:\nIds are easy to mix up. The same interview is `interview_def_set_id` (returned by\ncreate_interview), `position_id` (get_interview_definition, set_interview_state)\nand `interview_id` (invite_candidates, generate_interview_url). One candidate is\n`candidate_id`, `interview_profile_id` and `profile_interview_id`: all the `id` of a\nlist_candidates row. To get a result's `interview_result_id` from a\nlist_interview_results row, take the row's `id` on a single-stage row (its\ninterview_result_id is null) and its `interview_result_id` on a multi-stage row.\nEnum values are exact strings, sent as listed even when they look misspelt\n(`name_accending`).\nApart from the `admin_url` the report tools return, no tool builds admin console links.\nFor the full id-to-field map, where each id comes from, and admin link patterns:\nget_documentation(\"https://developer.jobmojito.com/mcp/identifiers\").\n\nTOOLS BY TASK (a description's [label] is the API section it comes from, which can differ):\n• Documentation: search_documentation, get_documentation\n• Configuration / merchants: jobmojito_configuration (searchable picker),\n  list_my_merchants (text equivalent, supports a `search` filter)\n• Interview (create/manage): create_interview, get_interview_definition (add\n  include=process,slots,team,lifecycle,publishing for a position), update_interview,\n  set_interview_state (publication status, vacancy lifecycle),\n  request_another_interview_attempt\n• Positions: set_position_process (steps of a draft), update_position_step (one\n  step's settings), manage_meeting_slot, duplicate_position, duplicate_interview\n  (copies a stand-alone interview)\n• Candidates: list_candidates, get_candidate, list_candidate_filters,\n  add_candidate_note, set_candidate_tags, manage_candidate_tag; duplicates:\n  preview_candidate_merge, merge_candidates, dismiss_candidate_duplicate;\n  segments: list_segments, manage_segment\n• Tasks and documents: list_tasks, save_task, list_document_requests,\n  request_candidate_documents, update_document_request\n• Reasons: list_reasons, get_reason, save_reason (decision and position status\n  reasons; changing them is for owners)\n• Role-play (simulated persona or coaching persona — chosen with `portal`):\n  create_persona\n• Coaching catalogue: list_catalogue_directories, get_catalogue_directory,\n  save_catalogue_directory\n• Invitations: invite_candidates (e-mails each candidate their invitation, the\n  same as the admin console; send_email=false returns personal interview links\n  only, NO e-mail), generate_interview_url (a signed link to share)\n• Results & reports: get_interview_result_details, generate_interview_report,\n  list_reports, run_report, get_report, list_report_fields, save_report;\n  set_assessment_result (records an external assessment step's result)\n• Knowledge base: list_knowledge_base_stores, save_knowledge_base_store (a store an\n  interview draws on once create_interview / update_interview set its\n  knowledge_base_store_id), upload_knowledge_base_document,\n  list_knowledge_base_documents, set_knowledge_base_document_interviews\n• Merchant lists (read-only): list_interviews, list_candidates,\n  list_interview_results, list_avatars, list_sub_merchants, get_merchant_status,\n  list_languages, list_users (the company's users: the profile_id of an assignee,\n  a mention, an interviewer, a recruiter; with position_id, who holds which role on\n  that position)\n• Feedback to JobMojito: submit_feature_request, report_technical_issue (only when\n  the user asks)\n• Portal configuration: get_portal_configuration, update_portal_configuration\n• Career page styles: publish_portal_stylesheet (settings and CSS files are written\n  with update_portal_configuration)\n• Component styles: get_component_style_guide, generate_component_styles (proposals,\n  nothing stored), save_component_style (a named look for one block type, written as a\n  draft to its own file, components/<type>/<style>.css; the guide lists the pages each\n  style is on)\n• Media library: list_media_files, upload_media_file (one call, base64),\n  start_media_upload + finish_media_upload (for a client that can send a file to an\n  address), manage_media_file (describe, move to a folder, or delete);\n  folders: list_media_files include_folders=true, manage_media_folder\n\nTypical flows:\n- \"Set up an interview for a role\" → create_interview (status active, or\n  set_interview_state later) → invite_candidates; with send_email=false it returns\n  each candidate's personal link to share instead.\n- \"Invite candidates to an interview\" → invite_candidates (sends the invitation\n  e-mail; report each row's result as returned). For links the user shares\n  themselves: invite_candidates with send_email=false (no e-mail) or\n  generate_interview_url.\n- \"Review a candidate's result\" → list_interview_results → get_interview_result_details\n  → generate_interview_report.\n- \"Screen someone with a role-play instead of questions\" → create_persona with\n  `portal=\"interview\"` → invite_candidates → list_interview_results.\n- \"Add a practice session learners can start themselves\" → create_persona (default\n  coaching portal) with `tags` → the catalogue directory whose\n  `tags_interview_set_filter` those tags satisfy lists it automatically.\n- \"Offer a coaching page in several languages\" → one session per language\n  (create_interview / create_persona with its `mojito_language_code` and a\n  language tag such as `sales-sk`) → ONE directory: save_catalogue_directory with\n  the default language at the top level and the others in `translations`, each with\n  its own `tags_interview_set_filter` → check each language with\n  get_catalogue_directory(`mojito_language_code`=…). Never one directory per\n  language.\n- \"Rebrand the portal or edit its pages\" → get_portal_configuration (only the\n  sections involved) → change only what was asked → update_portal_configuration\n  with `dry_run: true` to preview → the same call without it. `publish: true` only\n  when the user asked to publish; otherwise pages stay drafts in the admin.\n- \"Add a picture to a career page\" → list_media_files, or upload_media_file → put the\n  file's `url` in the block with update_portal_configuration.\n- \"Change the meeting step of a position\" → get_interview_definition\n  include=process → update_position_step with expected_updated_at and dry_run=true\n  → the same call without dry_run.\n- \"Find candidates tagged X on position Y\" → list_candidate_filters →\n  list_candidates with rules.\n",
      "tools": [
        {
          "name": "add_candidate_note",
          "title": "Add a note to a candidate",
          "description": "[Candidates] Add a note to a candidate (candidate_id) or to one result (result_id), visible to the team or private to you, optionally mentioning colleagues (each mention gets one e-mail). Notes cannot be changed or deleted through this tool.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "candidate_id": {
                "description": "Candidate id (the `id` of a list_candidates row): a note on the candidate.",
                "format": "uuid",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "mention_profile_ids": {
                "description": "Colleagues to mention (`profile_id` (list_users)), at most 20; each gets an e-mail with the note (the mentions feature).",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "result_id": {
                "description": "Interview result id (a result id from list_interview_results): a note on that result.",
                "format": "uuid",
                "type": "string"
              },
              "text": {
                "description": "The note, 1 to 10000 characters.",
                "maxLength": 10000,
                "type": "string"
              },
              "visibility": {
                "default": "team",
                "description": "team (default): the company sees it; private: only you (the private_notes feature).",
