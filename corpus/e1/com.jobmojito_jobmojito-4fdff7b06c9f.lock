                  "additionalProperties": false,
                  "properties": {
                    "advance": {
                      "enum": ["auto", "manual", null],
                      "type": ["string", "null"]
                    },
                    "certo": {
                      "additionalProperties": false,
                      "properties": {
                        "include_contact": {
                          "type": "boolean"
                        },
                        "scope_types": {
                          "items": {
                            "enum": ["employment", "education", "certification", "role", "language", "right_to_work"],
                            "type": "string"
                          },
                          "minItems": 1,
                          "type": ["array", "null"]
                        },
                        "wait_for_identity": {
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "external_assessment": {
                      "additionalProperties": false,
                      "properties": {
                        "due_days": {
                          "maximum": 60,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "instructions": {
                          "maxLength": 3000,
                          "type": ["string", "null"]
                        },
                        "pass_score": {
                          "type": ["number", "null"]
                        },
                        "provider_id": {
                          "format": "uuid",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "interview": {
