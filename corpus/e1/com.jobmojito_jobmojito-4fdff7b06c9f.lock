        {
          "name": "get_interview_result_details",
          "title": "Get interview result details",
          "description": "[Results] Get full interview result details including transcript and scores. Scores are assistive output for a human reviewer. One result is a large record, so `view` controls how much of it comes back — the default (`standard`) omits only the raw machine assessment data. interview_result_id from list_interview_results: a single-stage row's `id`, a multi-stage row's `interview_result_id`.\n\nEvery argument in full, with examples: get_tool_reference.",
