        {
          "name": "generate_interview_url",
          "title": "Generate shareable interview link",
          "description": "[Interviews] Generate a signed link that works for 30 days and can be opened more than once; nothing is sent. Whoever holds the link gets its access. `type` picks who it is for and the ids it needs: interview-for-profile = one candidate's own interview link (interview_profile_id + interview_id); results-for-profile = that candidate's results (interview_profile_id); interview-result-candidate = one result for the candidate, interview-result-talent-seeker = one result for a reviewer (interview_result_id); interview-results-for-position = every result of an active interview or position for a reviewer (interview_id). interview_profile_id is the candidate's `id` from list_candidates. There is no anonymous link to an interview: invitations are sent by invite_candidates.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "interview_id": {
                "description": "The interview (an interview `id` from list_interviews) or position (a position `id` from list_interviews), a uuid. Required for interview-for-profile and interview-results-for-position.",
                "type": "string"
              },
              "interview_profile_id": {
                "description": "The candidate (the `id` of a list_candidates row, a uuid; not a `profile_id` (list_users)). Required for interview-for-profile and results-for-profile.",
                "type": "string"
              },
              "interview_result_id": {
                "description": "The interview result (a result id from list_interview_results), a uuid. Required for interview-result-candidate and interview-result-talent-seeker.",
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Company (a company `id` from list_my_merchants, a uuid) to act for. Honoured for admins and sub-merchant operators only; other callers always use their token's company.",
                "type": "string"
              },
              "show_menu": {
                "description": "true shows the navigation menu on the page the link opens; false or left out hides it.",
                "type": "boolean"
              },
              "type": {
                "description": "Which kind of signed URL to generate.",
                "enum": ["interview-for-profile", "results-for-profile", "interview-result-candidate", "interview-result-talent-seeker", "interview-results-for-position"],
                "type": "string"
