        {
          "name": "update_interview",
          "title": "Update interview or position",
          "description": "[Interviews] Update the configuration of an existing interview/position: name, description, avatar template, recording, scoring, tags, category and the rest of the create-time settings; for a position also its hiring `team` and recruiter. `status` is applied as set_interview_state applies it (archiving an active position can e-mail its open applicants; set_interview_state with dry_run previews that); the vacancy lifecycle and the embed key are set with set_interview_state only. A position's steps are changed with set_position_process and update_position_step. Only the fields you send are changed. To change the questions, send `questions` — the WHOLE list you want the interview to end up with, in order, in the format get_interview_definition returns. OMIT `questions` and the existing questions are left completely alone; there is no way to change one question on its own: the array get_interview_definition returns is edited and sent back whole. Resending an unchanged array does nothing. On an offline (pre-rendered video) template the questions change only while the interview is `draft`; on an interactive one also while it is `active`. Not updated by this tool at all: the welcome and thank-you messages and the instructional-video screen (stored as steps, not questions), and the language, which the existing questions are already written in (no tool changes these: the messages and the video screen are changed in the admin, and another language takes a new interview). `tags` places a coaching session into a catalogue directory. MULTI-STAGE POSITIONS: the interview-only settings (recording, knowledge_base_store_id, candidate_expectations_json and the like) do not exist at position level and are refused with a 422 naming the field. They live on the AI interview step's own interview (the step's interview_set_id, from get_interview_definition include=process). A null argument counts as not sent and changes nothing, except on three fields where null is the only way to switch something off: `candidate_notification_channel` (no SMS / WhatsApp), `questions_random_subset` (ask all questions) and `pdf_export_auto_config` (no automatic report).\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "allow_human_interview": {
                "description": "A recruiter may hold the interview instead of the AI. Single-stage interviews only (an interview step of a position carries its own setting, see update_position_step).",
                "type": "boolean"
              },
              "candidate_expectations": {
                "description": "Free-text candidate expectations.",
                "type": ["string", "null"]
              },
              "candidate_expectations_json": {
                "description": "Structured candidate expectations (the scoring rubric), bucketed by requirement level (weak/moderate/strong). A null is ignored: send a new rubric to replace it, or regenerate_candidate_expectations together with `questions` to derive it again.",
                "properties": {
                  "moderate": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "strong": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "weak": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": ["object", "null"]
              },
              "candidate_notification_channel": {
                "description": "SMS / WhatsApp notifications to the candidate, sent alongside the e-mails: \"reminders\" = with both e-mail reminders (day 1 and day 3); \"last_reminder\" = only with the final day-3 reminder; \"all\" = invitation, both reminders and the pre-screening-accepted step. null switches them off.",
                "enum": ["reminders", "last_reminder", "all", null],
                "type": ["string", "null"]
              },
              "candidate_video_introduction": {
                "description": "Whether a candidate video introduction is hidden, optional or required. Send `hidden` to stop asking.",
                "enum": ["hidden", "optional", "required", null],
                "type": ["string", "null"]
              },
              "coach_plan": {
                "description": "Coaching-plan stage this item belongs to, used by the coaching-plan progress view. Omit to keep the current stage. A null is ignored: use `other` when no stage fits. Values: `demo`: Demo session | `screening`: Screening-interview practice | `2nd`: Second-interview practice | `3rd`: Third-interview practice | `closing`: Closing / salary-negotiation practice | `job-specific`: Job-specific coaching | `other`: Anything that does not fit the other buckets.",
                "enum": ["demo", "screening", "2nd", "3rd", "closing", "job-specific", "other", null],
                "type": ["string", "null"]
              },
              "code": {
                "description": "External code/reference. Blank is stored as null.",
                "type": ["string", "null"]
              },
              "collect_resume_cover_letter": {
                "description": "Ask the candidate for a resume / cover letter: hidden, optional or required. Single-stage interviews only.",
                "enum": ["hidden", "optional", "required"],
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "country_availability": {
                "description": "Which countries the interview / position is open to on the candidate portal, judged by the IP address the candidate opens it from (an unknown location only passes when countries_allowed / countries_allowed_eu are empty). From a closed country it is left out of the portal listings, and a direct link shows \"not available in your region\". Invited candidates (personal invitation links) and candidates who already started keep access; API and MCP calls themselves are never restricted. An empty object {} = not used, every country.",
                "properties": {
                  "countries_allowed": {
                    "items": {
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "countries_allowed_eu": {
                    "type": "boolean"
                  },
                  "countries_blocked": {
                    "items": {
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "countries_blocked_eu": {
                    "type": "boolean"
                  }
                },
                "type": ["object", "null"]
              },
              "cover_image_url": {
                "description": "Cover image URL.",
                "type": ["string", "null"]
              },
              "custom_fields": {
                "additionalProperties": {},
                "description": "Company-defined position fields to set, {key: value}; a null value clears that field and keys you omit keep their value. Requires custom fields to be enabled for the company (else 403). Multi-stage positions only: on a single-stage interview the request is refused with 422.",
                "type": "object"
              },
              "custom_scoring": {
                "additionalProperties": {},
                "description": "Result-scoring overrides (max_score, early_stop, speech_cadence, ai_pronunciation, sentiment_analysis, ai_assessment_answer, ai_assessment_resume, ai_assessment_session). Merged onto the stored configuration, so keys you omit keep their current value.",
                "type": ["object", "null"]
              },
              "description": {
                "description": "Short interview description.",
                "type": ["string", "null"]
              },
              "description_long": {
                "description": "Long-form interview description.",
                "type": ["string", "null"]
              },
              "emoji": {
                "description": "Emoji marker shown in the admin lists. Blank is stored as null.",
                "type": ["string", "null"]
              },
              "environment": {
                "description": "Which of your webhook environments results from this interview are delivered to. Defaults to production. Values: `production`: Live hiring | `uat`: User-acceptance testing - an isolated environment for pre-release verification | `development`: Development/testing | `demo`: Demonstrations and sales trials.",
                "enum": ["production", "uat", "development", "demo"],
                "type": "string"
              },
              "hiring_for_company": {
                "description": "Who the position is really for. An object with name null/blank means hiring for yourself; { name: 'undisclosed' } for an unnamed external client; or { name: '<company>' } plus optional description/location/sector/company_size.",
                "properties": {
                  "company_size": {
                    "type": ["string", "null"]
                  },
                  "description": {
                    "type": ["string", "null"]
                  },
                  "location": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": ["string", "null"]
                  },
                  "sector": {
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "interview_attempts": {
                "description": "Allowed candidate attempts (1-20).",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "interview_available_till": {
                "description": "ISO date/time after which the interview is no longer available to candidates. An empty string makes it always available.",
                "type": ["string", "null"]
              },
              "interview_category": {
                "description": "Job category shown on public listings above the department (free text), e.g. \"Ashore\". Blank is stored as null.",
                "type": ["string", "null"]
              },
              "interview_conversation_speed": {
                "description": "Conversation pace of the AI avatar. Omit to keep the current pace; `normal` is the default speaking pace. Values: `slower`: The avatar speaks more slowly | `normal`: Default speaking pace | `faster`: The avatar speaks more quickly for a snappier conversation | `fluent`: Talking pace: the avatar answers 300 ms after the candidate stops speaking.",
                "enum": ["slower", "normal", "faster", "fluent", null],
                "type": ["string", "null"]
              },
              "interview_department": {
                "description": "Department the position belongs to. Blank is stored as null.",
                "type": ["string", "null"]
              },
              "interview_salary": {
                "description": "Salary range shown for the position. Blank is stored as null.",
                "type": ["string", "null"]
              },
              "interview_template_id": {
                "description": "Id of the interview template (avatar/voice) to use.",
                "minLength": 1,
                "type": "string"
              },
              "interview_tone": {
                "description": "Tone — configures the AI avatar's speaking style and the follow-up questions it generates. Case-insensitive; omit to keep the current tone. Values: `relaxed`: Friendly and conversational tone that helps candidates feel at ease | `simple`: Plain language at CEFR A2 level | `professional`: Formal and business-like approach suitable for senior roles | `persuasive`: Engaging style that encourages candidates to elaborate | `exact`: Asks the questions exactly as provided, without rephrasing.",
