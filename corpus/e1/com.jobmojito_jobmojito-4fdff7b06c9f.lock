        {
          "name": "update_position_step",
          "title": "Change a position step's settings",
          "description": "[Positions] Change one step's settings. It takes `step_id`, optionally `name`, `advance` and `kombo`, and only the settings object of the step's type (`meeting`, `certo`, `external_assessment`, `interview`, `pre_screening`); only the keys you send change and null removes a key, but a list you send (pre_screening form_fields, assessment_rules) replaces the whole list: every item to keep is in it. pre_screening id and status are read only. A new form field: {\"id\": \"custom_<timestamp>\", \"title\", \"field_type\": text|file|radio, \"type\": required|optional, \"options\": [\"Yes\", \"No\"] for radio}; it goes after the fields get_interview_definition include=process returns. pre_screening all_rules_fulfilled_auto_approve approves a candidate who meets every rule without review; whether they then move on by themselves is `advance` (auto), a separate setting. expected_updated_at takes the step's `updated_at` from get_interview_definition include=process; when the step changed since, the call is refused with 409. Settings are live: candidates already on the step get them at once. dry_run=true shows the changed keys, the candidates on the step, booked meetings and warnings, and saves nothing. Nobody is e-mailed. A new meeting duration applies to slots created afterwards; existing slots keep theirs (manage_meeting_slot changes them).\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "advance": {
                "description": "auto: a candidate who passes moves on by themselves; manual: a recruiter moves them on. null = auto.",
                "enum": ["auto", "manual", null],
