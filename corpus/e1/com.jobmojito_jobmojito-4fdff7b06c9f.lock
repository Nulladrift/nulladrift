        {
          "name": "request_another_interview_attempt",
          "title": "Re-open interview for another attempt",
          "description": "[Results] Re-open a submitted interview result so the candidate can take it again: the attempt is marked failed, the same result goes back to draft and the recruiter's decision on it is cleared. The candidate may then continue, keeping the answers already given, or start over from scratch. There is no preview, and this tool notifies nobody, the candidate included. More attempts on the whole interview are set by interview_attempts in update_interview. Company owners, recruiters and platform admins only. interview_result_id from list_interview_results: a single-stage row's `id`, a multi-stage row's `interview_result_id`.\n\nEvery argument in full, with examples: get_tool_reference.",
