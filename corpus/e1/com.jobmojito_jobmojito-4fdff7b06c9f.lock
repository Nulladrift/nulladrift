        {
          "name": "request_candidate_documents",
          "title": "Ask a candidate for documents",
          "description": "[Document requests] Ask a candidate for up to 10 documents (certificate, reference letter, work sample...) with a message and due date. With notify (the default) the candidate is e-mailed. dry_run=true shows whether the e-mail would go out (will_send, not_requested, no_valid_email, suppressed) and stores nothing. documents[].source_field_id replaces one of the position's own file questions, as its form names it (form_cover_letter, custom_<name>...); without it the request is a plain upload.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "application_id": {
                "description": "Optional: the candidate's application this is for (an application `id` from get_candidate); the e-mail then names its position.",
                "format": "uuid",
                "type": "string"
              },
              "candidate_id": {
                "description": "The candidate to ask (the `id` of a list_candidates row).",
                "format": "uuid",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "documents": {
                "description": "The documents to ask for, 1 to 10.",
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "required": {
                      "default": true,
                      "type": "boolean"
                    },
                    "source_field_id": {
                      "pattern": "^(form_cover_letter|custom_[A-Za-z0-9_]{1,60})$",
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["title"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "dry_run": {
                "default": false,
                "description": "true: check everything and answer who would be e-mailed, without creating the request or sending anything.",
                "type": "boolean"
              },
              "due_date": {
                "description": "Due date (YYYY-MM-DD), today or later. After it the candidate is reminded once by e-mail (when notify is true).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Optional company to act on. Admins and sub-merchant operators only; other callers always use their token's company.",
                "format": "uuid",
                "type": "string"
              },
              "message": {
                "description": "Message to the candidate, at most 2000 characters.",
                "maxLength": 2000,
                "type": "string"
              },
              "notify": {
                "default": true,
                "description": "Default true: e-mail the candidate \"Documents requested\" now (and the one reminder after the due date). false: the request only shows on their application page.",
                "type": "boolean"
