        {
          "name": "start_media_upload",
          "title": "Start a media upload",
          "description": "[Admin] First step of an upload for a client that can send a file itself: returns a signed upload_url. The file is PUT there with the declared Content-Type, and finish_media_upload completes it. A client that cannot send a file to an address uses upload_media_file.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
