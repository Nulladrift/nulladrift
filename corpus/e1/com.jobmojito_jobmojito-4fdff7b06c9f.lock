              "dry_run": {
                "default": false,
                "description": "true: run the change in a transaction that is rolled back and answer the result; nothing is written.",
                "type": "boolean"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "position_id": {
                "description": "The position (a position `id` from list_interviews). It must be a draft.",
                "format": "uuid",
                "type": "string"
              },
              "steps": {
                "description": "The whole process in order (replaces the current one): existing steps by id, new ones without. An existing step left out is removed, unless candidates already reached it (409).",
