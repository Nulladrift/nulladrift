                "properties": {
                  "conversation_id": {
                    "description": "The server-issued conversation identifier.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "assignee_notified": {
                "type": ["boolean", "null"]
              },
              "created": {
                "type": ["boolean", "null"]
              },
              "status": {
                "enum": ["open", "done", "cancelled", null],
                "type": ["string", "null"]
              },
              "task_id": {
                "format": "uuid",
                "type": ["string", "null"]
              }
            },
            "required": ["assignee_notified", "created", "status", "task_id"],
