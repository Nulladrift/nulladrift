        {
          "name": "update_portal_configuration",
          "title": "Update portal configuration",
          "description": "[Admin] Import portal configuration documents, the same ones get_portal_configuration returns: branding, interview portal, coaching portal, brands, and portal sites (pages, menu, footer, theme CSS, style settings, CSS files). With `dry_run: true` nothing is written, and the answer has the summary, warnings and changes the same call makes without it. Fields a document omits keep their value, and languages are only ever added. Validation is all-or-nothing: a 422 lists every error and nothing is written. Pages land as drafts the company reviews in the admin; `publish: true` puts the pages and theme live at once, and it also builds and publishes the stylesheet of any brand whose settings or CSS files the documents carry. Brands, style settings and CSS files are switched on per company by JobMojito; while off, those parts are refused with 422. A CSS file's `version`, sent back, makes the call refuse a file someone else changed.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "documents": {
                "description": "1 to 20 documents, applied in order (a later document wins where two set the same thing). Every field a document omits keeps its current value; languages are only ever added, never removed.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "format": {
                      "enum": ["jobmojito.portal-site", "jobmojito.portal-page"],
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["branding", "interview-portal", "coaching-portal", "brands"],
                      "type": "string"
                    },
                    "version": {}
                  },
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "dry_run": {
                "default": false,
                "description": "Validate and report what would change (summary, warnings, changes) without writing anything.",
                "type": "boolean"
              },
              "kind": {
                "description": "Optional: lock the call to one document type, as one admin import tab does. Every document must then be that type (`portal-site` accepts both portal-site and portal-page formats), and a document that declares neither `kind` nor `format` is read as this type with a warning. Without it, every document must declare its own `kind` or `format`.",
                "enum": ["branding", "interview-portal", "coaching-portal", "brands", "portal-site"],
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Optional merchant to configure. Admins and sub-merchant operators only; other callers always use their token's merchant.",
                "format": "uuid",
                "type": "string"
              },
              "portal": {
                "description": "Where portal-site pages and theme CSS go: `interview` (candidate-facing interview / careers portal) or `consumer` (coaching portal). Default: the portal-site document's own `portal`, else `interview`.",
                "enum": ["interview", "consumer"],
                "type": "string"
              },
              "publish": {
                "default": false,
                "description": "Also publish the imported pages and theme CSS (live at once, as the admin's \"Publish after import\"). Default false: pages land as drafts the company reviews in the admin. Built-in page drafts produced by interview-portal / coaching-portal documents are never published. With page versions switched on, only a company owner or admin may publish.",
                "type": "boolean"
              }
            },
            "required": ["documents"],
            "type": "object"
          },
