        {
          "name": "save_knowledge_base_store",
          "title": "Create or change a knowledge base store",
          "description": "[Knowledge base] Without knowledge_base_store_id: a new store (name; strict true by default: the AI uses only its documents). With it: rename it or change strict, which changes how every interview on the store answers. upload_knowledge_base_document adds documents.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "knowledge_base_store_id": {
                "description": "The store to change (from list_knowledge_base_stores). Left out: a new store is created.",
                "format": "uuid",
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Optional company to act on. Admins and sub-merchant operators only; other callers always use their token's company.",
                "format": "uuid",
                "type": "string"
              },
              "name": {
                "description": "Name of the store, 1 to 200 characters. Required for a new store; left out on a change, it stays.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "strict": {
                "description": "true (the default for a new store): the AI uses only these documents. Left out on a change, it stays.",
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_mcp_instructions": {
                "description": "Server-issued metadata for this conversation.",
                "properties": {
                  "conversation_id": {
                    "description": "The server-issued conversation identifier.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "result": {
                "allOf": [
                  {
                    "properties": {
                      "document_count": {
                        "type": ["integer", "null"]
                      },
                      "id": {
                        "format": "uuid",
                        "type": ["string", "null"]
                      },
                      "name": {
                        "type": ["string", "null"]
                      },
