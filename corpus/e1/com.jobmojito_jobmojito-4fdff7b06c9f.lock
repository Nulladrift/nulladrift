        {
          "name": "upload_media_file",
          "title": "Upload a file to the media library",
          "description": "[Admin] Upload a file to the company's media library and return it, ready to use.\n\nSends the file (base64) and has it checked: its real type, the codec of a\nvideo, and anything active in an SVG, which is refused rather than cleaned.\nThe returned `file.url` is what page blocks, brand logos and font settings take.\nThe library is public: a file can be reached by anyone with its address.\nSwitched on per company by JobMojito; while it is off this is refused with 403.\n\nA file too large to pass as an argument goes through start_media_upload and\nfinish_media_upload, for a client that can send a file to an address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_type": {
                "description": "image/jpeg, image/png, image/webp, image/gif, image/avif, image/svg+xml, video/mp4 (H.264 only), audio/mpeg, audio/mp4, audio/x-m4a or font/woff2.",
                "enum": ["image/jpeg", "image/png", "image/webp", "image/gif", "image/avif", "image/svg+xml", "video/mp4", "audio/mpeg", "audio/mp4", "audio/x-m4a", "font/woff2"],
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "duration_seconds": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Length of a video or audio file in seconds."
              },
              "file": {
                "description": "The file's bytes, base64-encoded. At most 50 MB once decoded.",
                "type": "string"
              },
              "file_name": {
                "description": "Display name in the library, such as team-photo.jpg. No slashes.",
                "type": "string"
              },
              "folder": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Library folder, one level, such as Crew life (list_media_files include_folders=true gives the names). Default: the top. A new name makes the folder."
              },
              "height": {
                "anyOf": [
