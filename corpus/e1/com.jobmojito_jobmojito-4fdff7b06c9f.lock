          "title": "Get interview definition",
          "description": "[Interviews] Get the definition/configuration of an interview (position), including its ordered `questions` array. The questions come back in the same format create_interview accepts in `questions`, so an array read here and changed goes back to update_interview as it is. Each question's `id` identifies it: a question keeps its stored record while its id stays in the array. For a position add include=process (its steps with their settings and updated_at, for update_position_step), slots (upcoming meeting slots), team, lifecycle, publishing.\n\nEvery argument in full, with examples: get_tool_reference.",
