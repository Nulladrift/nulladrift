        {
          "name": "list_avatars",
          "title": "List avatars and voice templates",
          "description": "[Admin] List available avatar/voice templates. Each item's `type` decides the interview modality: `interactive_elevenlabs` = voice-only (no video avatar); `interactive_spatius` = realtime interactive 3D avatar (rendered in the candidate's browser, 1.25 credits, no early stop); `interactive_heygen` = premium realtime interactive video avatar; `offline_heygen` = pre-recorded, non-interactive avatar. An item's `id` is the `interview_template_id` of create_interview and create_persona, so the template's type sets the experience. Note: `offline_elai` and `offline_synthesia` are legacy integrations that may still appear here but cannot be used to create new interviews. Rows are large, so this returns 15 by default; `offset` pages while `pagination.has_more` is true, and `type`/`filter_text` narrow it. The company's own templates only unless include_public=true: no voice template here does not mean there is none.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "filter_text": {
                "description": "Case-insensitive search on template name or voice language name.",
                "type": "string"
              },
              "include_archived": {
                "default": false,
                "description": "Include archived templates (excluded by default).",
                "type": "boolean"
