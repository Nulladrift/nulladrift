        {
          "name": "save_reason",
          "title": "Create, change or archive a reason",
          "description": "[Reasons] Without reason_id: a new reason (decision: kind and label; position_status: label and applies_to). With reason_id: change it; fields left out keep their value; status archived stops offering it, active offers it again (an archived position status reason cannot be restored). Company-wide: a renamed reason is renamed on every past decision too. Owners only.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
