        {
          "name": "run_report",
          "title": "Run a report",
          "description": "[Reports] Run a report and return each block's rows (aggregated numbers, at most 500 rows per block). Three ways: `report_id` of a saved custom report (your saved filters, then `filters`, apply; with `version` a newer report is refused with 409); `report_id` builtin:<name> of a built-in report from list_reports (`section`, `from` / `to`, `position_id` or `interview_id`, `limit` / `offset`; sections that list candidates by name run only with include_candidates=true and are audited); or an unsaved `definition`, which is validated against list_report_fields and run without storing anything: this validates a definition without saving it: a wrong block comes back with ok=false and an error naming the field and the valid ids. Report numbers are decision-support material for a human reviewer. Block types: line needs a date dimension first (with a grain), kpi and funnel take no dimensions. The period filters each dataset on its own date (its description in list_report_fields says which; a snapshot dataset ignores it); left out, the last 30 days.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "block_id": {
                "description": "Run only this block (custom reports only; built-in reports take section).",
                "type": "string"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "definition": {
                "additionalProperties": false,
                "description": "A custom report: report-wide filters and up to 12 blocks.",
                "properties": {
                  "blocks": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "compare": {
                          "enum": ["previous_period"],
                          "type": "string"
                        },
                        "dataset": {
                          "type": "string"
                        },
                        "dimensions": {
                          "items": {
                            "anyOf": [
                              {
                                "pattern": "^[a-z][a-z0-9_]{0,40}$",
                                "type": "string"
                              },
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "field": {
                                    "pattern": "^[a-z][a-z0-9_]{0,40}$",
                                    "type": "string"
                                  },
                                  "grain": {
                                    "enum": ["day", "week", "month", "quarter", "year"],
                                    "type": "string"
                                  }
                                },
                                "required": ["field"],
                                "type": "object"
                              }
                            ]
                          },
                          "maxItems": 2,
                          "type": "array"
                        },
                        "id": {
                          "pattern": "^[A-Za-z0-9_-]{1,40}$",
                          "type": "string"
                        },
                        "limit": {
                          "maximum": 500,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "measures": {
                          "items": {
                            "pattern": "^[a-z][a-z0-9_]{0,40}$",
                            "type": "string"
                          },
                          "maxItems": 6,
                          "minItems": 1,
                          "type": "array"
                        },
                        "sort": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "dir": {
                                "enum": ["asc", "desc"],
                                "type": "string"
                              },
                              "field": {
                                "pattern": "^[a-z][a-z0-9_]{0,40}$",
                                "type": "string"
                              }
                            },
                            "required": ["field"],
                            "type": "object"
                          },
                          "maxItems": 3,
                          "type": "array"
                        },
                        "text": {
                          "maxLength": 4000,
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 120,
                          "type": "string"
                        },
                        "type": {
                          "enum": ["kpi", "table", "bar", "stacked_bar", "line", "funnel", "text"],
                          "type": "string"
                        },
                        "where": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "field": {
                                "pattern": "^[a-z][a-z0-9_]{0,40}$",
                                "type": "string"
                              },
                              "op": {
                                "enum": ["eq", "neq", "in", "not_in", "gt", "gte", "lt", "lte", "between", "is_empty", "is_not_empty"],
                                "type": "string"
                              },
                              "value": {
                                "anyOf": [
                                  {
                                    "type": "string"
                                  },
                                  {
                                    "type": "number"
                                  },
                                  {
                                    "type": "boolean"
                                  },
                                  {
                                    "items": {
                                      "anyOf": [
                                        {
                                          "type": "string"
                                        },
                                        {
                                          "type": "number"
                                        }
                                      ]
                                    },
                                    "type": "array"
                                  }
                                ]
                              }
                            },
                            "required": ["field", "op"],
                            "type": "object"
                          },
                          "maxItems": 10,
                          "type": "array"
                        },
                        "width": {
                          "maximum": 12,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["id", "type"],
                      "type": "object"
                    },
                    "maxItems": 12,
                    "type": "array"
                  },
                  "description": {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "filters": {
                    "additionalProperties": false,
                    "properties": {
                      "include_test": {
                        "type": "boolean"
                      },
                      "interview_ids": {
                        "items": {
                          "format": "uuid",
                          "type": "string"
                        },
                        "maxItems": 200,
                        "type": "array"
                      },
                      "period": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "preset": {
                                "enum": ["last_7_days", "last_30_days", "last_90_days", "this_month", "last_month", "this_quarter", "last_quarter", "this_year", "last_year", "all_time"],
                                "type": "string"
                              }
                            },
                            "required": ["preset"],
                            "type": "object"
                          },
                          {
                            "additionalProperties": false,
                            "properties": {
                              "from": {
                                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                                "type": "string"
