              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Optional merchant to act on. Admins and sub-merchant operators only; other callers always use their token's merchant.",
                "format": "uuid",
                "type": "string"
              },
              "report_id": {
                "description": "Optional: replace the definition of this saved report instead of creating one.",
                "format": "uuid",
                "type": "string"
              },
              "target": {
                "description": "With report_id: published (default) or draft; through this server it has no effect: a private report always publishes and a shared one gets a draft.",
                "enum": ["published", "draft"],
