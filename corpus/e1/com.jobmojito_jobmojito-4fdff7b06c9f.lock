                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "get_signed_recordings": {
                "default": false,
                "description": "When true, includes short-lived signed recording URLs for the session, the video introduction, and each transcript answer.",
                "type": "boolean"
              },
              "interview_result_id": {
                "description": "The interview result (a result id from list_interview_results) to fetch the transcript and details for.",
                "format": "uuid",
                "minLength": 1,
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "view": {
                "default": "standard",
                "description": "How much of the record to return. Handled by the MCP server, not the JobMojito API — it only narrows the response, never the query. Values: `summary`: scores, the overall AI analysis, and each question with the candidate's answer | `standard`: everything a human reviewer reads | `full`: every field, including the per-answer raw assessment data.",
                "enum": ["summary", "standard", "full"],
                "type": "string"
