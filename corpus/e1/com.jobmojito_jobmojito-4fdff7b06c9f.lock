                        "text": {
                          "maxLength": 4000,
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 120,
                          "type": "string"
                        },
                        "type": {
                          "enum": ["kpi", "table", "bar", "stacked_bar", "line", "funnel", "text"],
                          "type": "string"
                        },
                        "where": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "field": {
                                "pattern": "^[a-z][a-z0-9_]{0,40}$",
                                "type": "string"
                              },
                              "op": {
                                "enum": ["eq", "neq", "in", "not_in", "gt", "gte", "lt", "lte", "between", "is_empty", "is_not_empty"],
                                "type": "string"
                              },
                              "value": {
                                "anyOf": [
                                  {
                                    "type": "string"
                                  },
                                  {
                                    "type": "number"
                                  },
                                  {
                                    "type": "boolean"
                                  },
                                  {
                                    "items": {
