        {
          "name": "invite_candidates",
          "title": "Invite candidates to an interview or position",
          "description": "[Interviews] Invite candidates to an interview or position: e-mails each one their invitation.\n\nThe same invitation the admin console's Add candidates sends: creates or\nfinds the candidate, uses the company's invitation budget, and queues the\ninvitation e-mail (with the optional recruiter message). Each row comes\nback with its outcome; only 'Invited' means an e-mail was queued.\n\nWith send_email=false NOTHING is e-mailed: each candidate is registered and\ntheir personal interview_url comes back; nothing is sent. The result's\nemail_sent says which happened. send_email=false sends nothing now or later: no\ninvitation, no reminders, no SMS or WhatsApp, and it does not use the invitation\nbudget.\n\nA draft interview is not refused, but candidates can use their links only once\nit is active; activating it is a separate step (set_interview_state).\nis_test=true (with send_email=false) gives test links that also work on a draft,\nfor trying the interview yourself; they are not for candidates, whose results\nwould be marked as tests.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "description": "The people to invite.",
                "items": {
                  "properties": {
                    "email": {
                      "description": "The candidate's e-mail address; the invitation goes here.",
                      "type": "string"
                    },
                    "name": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Display name, e.g. 'Jane Doe'."
                    },
                    "phone": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Optional mobile number in international format (+421903123456) for SMS / WhatsApp notifications."
                    }
                  },
                  "required": ["email"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "interview_id": {
                "description": "The interview or position: its `id` from list_interviews, or the interview_def_set_id create_interview returned.",
                "type": "string"
              },
              "is_test": {
                "default": false,
