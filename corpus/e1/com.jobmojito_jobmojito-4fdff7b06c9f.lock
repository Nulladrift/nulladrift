                                    },
                                    "type": "array"
                                  }
                                ]
                              }
                            },
                            "required": ["field", "op"],
                            "type": "object"
                          },
                          "maxItems": 10,
                          "type": "array"
                        },
                        "width": {
                          "maximum": 12,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["id", "type"],
                      "type": "object"
                    },
                    "maxItems": 12,
