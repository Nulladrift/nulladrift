        {
          "name": "list_catalogue_directories",
          "title": "List coaching catalogue directories",
          "description": "[Coaching catalogue] List the coaching-catalogue directories you can see (your merchant's own plus the platform-wide public ones). Returns directory ids, for finding one, picking a parent for a new one, or walking the tree with `parent_tag`; `is_start_directory` marks the page the catalogue opens on. The custom Markdown page is not included; get_catalogue_directory returns it. Returns 25 by default; `limit` and `offset` page through while `pagination.has_more` is true.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
