          "description": "[Document requests] action cancel (the candidate can no longer upload) or reviewed (the uploads were checked). A request in the wrong state is refused with 409. Nobody is e-mailed, and no tool reopens a cancelled request.\n\nEvery argument in full, with examples: get_tool_reference.",
