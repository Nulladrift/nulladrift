        {
          "name": "dismiss_candidate_duplicate",
          "title": "Dismiss a possible duplicate",
          "description": "[Candidates] Mark a suggested duplicate pair (duplicate_id from get_candidate include=duplicates) as not the same person, with an optional note. Nobody is notified, and no tool undoes a dismissal.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
