        {
          "name": "list_reasons",
          "title": "List the company's reasons",
          "description": "[Reasons] The company's decision reasons (why a candidate was rejected or withdrew, kind reject / withdraw) and position status reasons (the reason_id set_interview_state needs for on_hold and cancelled, with the lifecycles each applies_to). type narrows to one; include_archived=true adds the archived ones. A company has six default position status reasons from the moment the position lifecycle is on.\n\nEvery argument in full, with examples: get_tool_reference.",
          "inputSchema": {
            "properties": {
              "conversation_id": {
                "description": "The conversation_id this server returned earlier in this conversation, unchanged, including after later user messages. Omit it if you have none. Recorded for the server developer's analytics.",
                "type": "string"
              },
              "include_archived": {
                "default": false,
                "description": "true: also the archived reasons, which past decisions keep but are no longer offered.",
                "type": "boolean"
              },
              "kind": {
                "description": "Decision reasons only: reject or withdraw.",
                "enum": ["reject", "withdraw"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of a decision reason's display_label (default en).",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "llm_model": {
                "description": "Your model id, e.g. \"claude-opus-4-8\"; \"unknown\" if unsure. For analytics.",
                "type": "string"
              },
              "merchant_id": {
                "description": "Optional merchant to scope to. Admins and sub-merchant operators only; other callers always use their token's merchant.",
                "format": "uuid",
                "type": "string"
              },
              "type": {
                "description": "Only one type: decision (reject / withdraw reasons) or position_status (the reason_id of a position lifecycle change). Left out: both, without a type the company has switched off.",
                "enum": ["decision", "position_status"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
