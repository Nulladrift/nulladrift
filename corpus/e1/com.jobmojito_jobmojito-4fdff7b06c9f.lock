        {
          "name": "report_technical_issue",
          "title": "Report technical issue",
          "description": "[Feedback] Report a technical problem to JobMojito support. It opens a support conversation from the signed-in user's account (their e-mail), with their company and the interview or result ids given; support answers there. The description covers what was done, what was expected and what happened (error text as shown). It sends the description exactly as given; at most 5 a day.\n\nEvery argument in full, with examples: get_tool_reference.",
