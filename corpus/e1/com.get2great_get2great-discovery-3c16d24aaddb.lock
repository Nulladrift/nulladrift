        {
          "name": "get_cohort_status",
          "title": "Get published cohort status",
          "description": "Returns the published filing count for a Get2Great Snowball cohort (default: turnover). A count below the release threshold is withheld — filed is null, below_reporting_threshold is true. Valid verticals: turnover, engineering-ttf, saas-frt.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vertical": {
                "default": "turnover",
                "description": "Cohort vertical id. Default turnover — the live Get2Great metric.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adequacy_threshold": {
                "type": "number"
              },
              "adequate": {
                "type": "boolean"
              },
              "below_reporting_threshold": {
                "type": "boolean"
              },
              "canonicalUrl": {
                "type": "string"
              },
              "contract": {
                "const": "cohort-status/v1",
                "type": "string"
              },
              "filed": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "release_threshold": {
                "type": "number"
              },
              "vertical": {
                "enum": ["turnover", "engineering-ttf", "saas-frt"],
                "type": "string"
              }
            },
            "required": ["adequacy_threshold", "adequate", "below_reporting_threshold", "canonicalUrl", "contract", "filed", "release_threshold", "vertical"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
