{
  "lockfileVersion": 2,
  "subjects": {
    "com.compamir/news": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.compamir.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "compamir-data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "COMPAMIR structured news: deduplicated events with reporting-conflict flags and source links (JP/EN). Automated AI processing; cite source links.",
      "tools": [
        {
          "name": "get_event",
          "description": "Get a single COMPAMIR event by id, including its source links and conflict note if any.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "lang": {
                "default": "both",
                "enum": ["jp", "en", "both"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3bd147375daef657ffe515edbc7865682e815605c2e316217183ba9e96262780"
        },
        {
          "name": "list_conflicts",
          "description": "List events where reporting diverges across sources (the signature Conflict Watch). Each item includes a plain-language note on what differs and the source links.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "occurred_at >= (YYYY-MM-DD)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba1dcad7b1da5d8539d05527ecb357cf11bf16d7b1bdc4c8fb68258056659d09"
        },
        {
          "name": "search_events",
          "description": "Search COMPAMIR structured news events. Events are deduplicated across multiple sources into single items, with reporting conflicts flagged, in Japanese and English. Each result carries source links. Note: produced by automated AI processing, not exhaustive human verification — cite the provided source links.",
          "inputSchema": {
            "properties": {
              "genre": {
                "enum": ["Politics", "Business", "Tech", "Global"],
                "type": "string"
              },
              "lang": {
                "default": "both",
                "enum": ["jp", "en", "both"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text title search",
                "type": "string"
              },
              "region": {
                "enum": ["Asia", "Europe", "Americas", "Middle East", "Africa", "Oceania", "Global"],
                "type": "string"
              },
              "since": {
                "description": "occurred_at >= (YYYY-MM-DD)",
                "type": "string"
              },
              "status": {
                "enum": ["confirmed", "speculative", "disputed"],
                "type": "string"
              },
              "until": {
                "description": "occurred_at <= (YYYY-MM-DD)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9bac1d7a6d4b146a0052a1bcbbf46405a8998ac1b6bdaa0c16742e4d864f3995"
        }
      ],
      "digest": "sha256:04d5e6f01e7c8eb6715e7048c67eeffc8f0e85a411132bb354c1a8af8d1434e6"
    }
  }
}
