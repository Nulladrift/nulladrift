{
  "lockfileVersion": 2,
  "subjects": {
    "com.profullstack/hdtilt": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hdtilt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hdtilt",
        "version": "0.7.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "hdtilt is an IPTV player. Playlists are saved locally; use list_playlists first, then whats_on or list_channels, then stream_url to get something playable.",
      "tools": [
        {
          "name": "channel_guide",
          "title": "Channel Guide",
          "description": "One channel's programmes for the next N hours (negative start for catch-up).",
          "inputSchema": {
            "properties": {
              "channel": {
                "type": "string"
              },
              "fromHours": {
                "default": 0,
                "type": "number"
              },
              "hours": {
                "default": 12,
                "type": "number"
              },
              "playlist": {
                "description": "Saved playlist name; defaults to the current one",
                "type": "string"
              },
              "source": {
                "description": "Use this playlist instead of a saved one: {type:\"m3u\", url} or {type:\"xtream\", server, username, password}; optional epg",
                "type": "object"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8417406ca72b18dcbe9753fb6bc5d51fdeb2cce41c3af44f126e788ff8c77390"
        },
        {
          "name": "find_subtitles",
          "title": "Find Subtitles",
          "description": "Subtitles for a film or an episode, from OpenSubtitles. Give a title (a provider name like \"EN - Film (1999) 4K\" is cleaned up) or a tmdbId; for an episode add season and episode (title/tmdbId are then the show). Best match first; fetch one with fetch_subtitle.",
          "inputSchema": {
            "properties": {
              "episode": {
                "type": "number"
              },
              "languages": {
                "default": "en",
                "description": "Comma-separated codes, e.g. \"en,fr\"",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "type": "number"
              },
              "season": {
                "type": "number"
              },
              "title": {
                "type": "string"
              },
              "tmdbId": {
                "description": "The film, or for an episode the show",
                "type": "number"
              },
              "year": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:55781f81fb7fc3b6e0835026174c1b73d75354c78c5b1e6f3ed2700554d5e981"
        },
        {
          "name": "list_channels",
          "title": "List Channels",
          "description": "Channels, optionally filtered by group or a search (name or number).",
          "inputSchema": {
            "properties": {
              "group": {
                "type": "string"
              },
              "limit": {
                "default": 50,
                "type": "number"
              },
              "playlist": {
                "description": "Saved playlist name; defaults to the current one",
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "source": {
                "description": "Use this playlist instead of a saved one: {type:\"m3u\", url} or {type:\"xtream\", server, username, password}; optional epg",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:584e70db9bff810ac20a7869e8966cadc9217d14c80bd4b383594386c4290148"
        },
        {
          "name": "list_groups",
          "title": "List Channel Groups",
          "description": "Channel groups (categories) with counts.",
          "inputSchema": {
            "properties": {
              "playlist": {
                "description": "Saved playlist name; defaults to the current one",
                "type": "string"
              },
              "source": {
                "description": "Use this playlist instead of a saved one: {type:\"m3u\", url} or {type:\"xtream\", server, username, password}; optional epg",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bf0aa88aa560270d3490ed5cd990a08d56f773d7f3a29176f7aceb49017f18f"
        },
        {
          "name": "movies_shows",
          "title": "Browse Movies and Shows",
          "description": "Films and series on an Xtream line (or an M3U's /movie/ and /series/ entries): with nothing else, the categories; with category, its titles; with query, a search of every title; with seriesId, that show's episodes. Films and episodes come with their stream URL.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id from the category list",
                "type": "string"
              },
              "kind": {
                "default": "movie",
                "enum": ["movie", "series"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "type": "number"
              },
              "playlist": {
                "description": "Saved playlist name; defaults to the current one",
                "type": "string"
              },
              "query": {
                "description": "Words that must all be in the title",
                "type": "string"
              },
              "seriesId": {
                "description": "A show's seriesId, for its episodes",
                "type": "number"
              },
              "source": {
                "description": "Use this playlist instead of a saved one: {type:\"m3u\", url} or {type:\"xtream\", server, username, password}; optional epg",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bb2e6ac48eaf7789947d2804c46ada56422eccc938af784bd0fbb129dfcd0fca"
        },
        {
          "name": "stream_url",
          "title": "Get Stream URL",
          "description": "The playable URL for a channel, or for a past programme when the channel has catch-up.",
          "inputSchema": {
            "properties": {
              "at": {
                "description": "ISO time inside a past programme, for catch-up",
                "type": "string"
              },
              "channel": {
                "type": "string"
              },
              "playlist": {
                "description": "Saved playlist name; defaults to the current one",
                "type": "string"
              },
              "source": {
                "description": "Use this playlist instead of a saved one: {type:\"m3u\", url} or {type:\"xtream\", server, username, password}; optional epg",
                "type": "object"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7c54e98ac4c041e0624bf50de4e42e46dbf59c814896dab2a1dd02ef4b2fabc0"
        },
        {
          "name": "whats_on",
          "title": "What's On Now",
          "description": "What is on now and next, from the guide, for matching channels.",
          "inputSchema": {
            "properties": {
              "group": {
                "type": "string"
              },
              "limit": {
                "default": 25,
                "type": "number"
              },
              "playlist": {
                "description": "Saved playlist name; defaults to the current one",
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "source": {
                "description": "Use this playlist instead of a saved one: {type:\"m3u\", url} or {type:\"xtream\", server, username, password}; optional epg",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01cae094dd2061523df027104cbbf486f0036e6a3e0aea1527d4fcaa942457c2"
        }
      ],
      "digest": "sha256:ea9f5193f4cd324b0378bc228ed2d50696a01fd217d7286642750e8885586ed1"
    }
  }
}
