        {
          "name": "supplier_history",
          "title": "Supplier history",
          "description": "Use this to size up a supplier, your user's own company or a competitor: what it won, from which buyers, in which categories, how many bidders it beat (competition_when_winning: read median_bidders first, framework agreements with hundreds of bidders skew the average), and, when bidder lists are published, its win rate and most frequent competitors. Pass supplier_id (the company RUT published in award data, or the supplier_id seen in buyer_history) or supplier_name. Suppliers are grouped by legal identifier; built from awarded tenders in Open Contracting (OCDS) data. An empty matches list comes with a note saying why. Access: needs an identified agent key (free, self-service at https://pass.andesprotocol.com).",
