        {
          "name": "prepare_quote",
          "title": "Prepare a quote",
          "description": "Use this when your user decided to quote: it builds the kit their person needs to submit, ready for one last click in Mercado Público (Andes cannot submit it). Pass tender_id and the prices: unit_prices per line ([{\"line\": 1, \"unit_price\": 12500}], net unless prices_include_vat) or quote_total (VAT included); optionally delivery_days and supplier_id (the supplier company's RUT as registered in Mercado Público, public in award data). Returns the requested lines with the draft (net, IVA 19%, total), readiness checks with their evidence (open, registered supplier, within the buyer's budget, quotes received and their range, delivery, documents to attach), the deadline and the link to submit. It never invents prices: unpriced lines stay unpriced. Any identified agent can call it. If the person you act for approved an AndesPass mandate for procurement.quote.prepare with a ceiling covering the total, the kit says it was prepared under that mandate and the call leaves a signed receipt and AndesPass emails the kit to the person who approved the mandate; without one it is a draft for your person to review and nothing is sent. When your person wants it prepared on their behalf (for example, for their company) and no mandate covers it yet, call with request_mandate=true (add company_name with supplier_id, the company RUT, so the mandate names the company): the answer is mandate_required with an approval_url and an ask_user sentence; once they approve, call again with the same arguments. Access: needs an identified agent key (free, self-service at https://pass.andesprotocol.com).",
          "inputSchema": {
            "properties": {
              "company_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The company the quote is for; with `supplier_id` (its RUT) and `request_mandate`, the mandate names it and only a mandate for that company covers the quote.",
                "title": "Company Name"
              },
              "delivery_days": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Delivery the supplier offers, in days.",
                "title": "Delivery Days"
              },
              "preferred_language": {
                "default": "en-US",
                "description": "The user's BCP-47 tag; the kit is written in it (English and Spanish today).",
                "title": "Preferred Language",
                "type": "string"
              },
              "prices_include_vat": {
                "default": false,
                "description": "Whether `unit_prices` include VAT (Chile: IVA 19%).",
                "title": "Prices Include Vat",
                "type": "boolean"
              },
              "quote_total": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Total to quote, VAT included, in the tender's currency (also the amount the mandate must cover). Optional when `unit_prices` is given.",
                "title": "Quote Total"
              },
              "request_mandate": {
                "default": false,
                "description": "True when the person wants the kit prepared on their behalf: without a mandate covering the total, the server answers `mandate_required` with an approval link instead of the kit; with one, the kit is also emailed to that person (through AndesPass).",
                "title": "Request Mandate",
                "type": "boolean"
              },
              "supplier_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The supplier company's RUT as registered in Mercado Público (public in award data; never a personal ID document), to check its supplier record.",
                "title": "Supplier Id"
              },
              "tender_id": {
                "description": "Id returned by `search_tenders`.",
                "title": "Tender Id",
                "type": "string"
              },
              "unit_prices": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "`[{\"line\": 1, \"unit_price\": 12500}, ...]` per requested line.",
                "title": "Unit Prices"
              }
            },
            "required": ["tender_id"],
            "title": "prepare_quoteArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "prepare_quoteDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Prepare a quote"
