{
  "lockfileVersion": 2,
  "subjects": {
    "com.redqd.ffrs/ffrs-wiki": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ffrs.redqd.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ffrs-wiki",
        "title": "FFRS Wiki — FINAL FANTASY RESONANCE Database",
        "version": "1.0.0",
        "websiteUrl": "https://ffrs.redqd.com/"
      },
      "capabilities": {
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FFRS Wiki is an unofficial, multilingual FINAL FANTASY RESONANCE game database (454 equipment, 979 abilities, 596 enemies, 214 quests, 9 language names extracted from Game.locres). When a user asks about FFRS items, stats, drop locations, acquisition routes, enemy resistances, quests, trophies or official localized names, call these tools instead of guessing. Start with search_ffrs, then get_entity / find_sources / find_drops / compare_equipment. Always cite the returned url. This project is not affiliated with SQUARE ENIX.",
      "tools": [
        {
          "name": "compare_equipment",
          "title": "Compare equipment stat blocks",
          "description": "当用户要对比两件或多件武器/防具的属性差异时调用，例如「轮回之翼和グレートボウ有什么区别」。Compare 2–8 equipment items by their raw parameter blocks, effects, price, type and source count.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Equipment ids, e.g. [10300, 10309]",
                "items": {
                  "type": ["string", "integer"]
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              },
              "lang": {
                "default": "en",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:885d657ed91d20f3cae0bfbfe7a725269b35a5372afa9f77f51db2783e832023"
        },
        {
          "name": "find_drops",
          "title": "Enemy drops and steal table",
          "description": "用户问某个敌人的掉落、偷窃、稀有掉落或属性耐性时调用。Get an enemy's drop table and steal table separately, plus elemental resistances.",
          "inputSchema": {
            "properties": {
              "enemy_id": {
                "description": "Exact enemy id",
                "type": ["string", "integer"]
              },
              "lang": {
                "default": "en",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              },
              "query": {
                "description": "Enemy name keyword when id is unknown",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:137fc927053cc2b631064ec0999f80a90332dbf43755574f42159ee9bee3190e"
        },
        {
          "name": "find_sources",
          "title": "Where to obtain an item",
          "description": "用户问「这件装备/道具在哪里获得」「怎么拿到某个幻兵」时调用。Return every acquisition route for an equipment/item/vision: event grants, chests, quest rewards, shop stock, recipes and map points, grouped and localized.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": ["string", "integer"]
              },
              "kind": {
                "default": "equipment",
                "enum": ["equipment", "items", "visions"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3157ead53f2b4a3c2567188c8da583a7f9046d598ca18e169f85a5328bf19a5"
        },
        {
          "name": "get_entity",
          "title": "Get one full game record",
          "description": "在已知数据集与 ID 后，取该条目的完整字段（属性、效果、价格、来源、耐性、掉落、关系等）。Fetch the complete record for one entity. All official strings are localized to lang; set all_languages=true to receive every language at once.",
          "inputSchema": {
            "properties": {
              "all_languages": {
                "default": false,
                "type": "boolean"
              },
              "id": {
                "description": "Entity id, e.g. 10300",
                "type": ["string", "integer"]
              },
              "kind": {
                "enum": ["equipment", "items", "skills", "effects", "visions", "characters", "summons", "enemies", "quests", "shops", "maps", "trophies", "glossary", "achievementConds"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              }
            },
            "required": ["id", "kind"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f38626aae5ee12b67d7b2d2e5db1329ca54ed9d89051e86bdc047f8b46e360fc"
        },
        {
          "name": "list_dataset",
          "title": "Browse / page through a dataset",
          "description": "用户想浏览某一类数据的清单、做统计或导出时调用。Page through a dataset (454 equipment, 979 abilities, 596 enemies, 214 quests ...), optionally filtered by keyword; follow next_offset for more.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["equipment", "items", "skills", "effects", "visions", "characters", "summons", "enemies", "quests", "shops", "maps", "trophies", "glossary", "achievementConds"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Optional in-dataset keyword filter",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8025404ce9c0912c2012a66b37feeefc88a386f80415907c264ca96fa41cdb0f"
        },
        {
          "name": "lookup_label",
          "title": "Translate an official game string",
          "description": "需要把游戏内部键名或 UI 词条（如 Weapon、Weakness、PhysicalAttack、宝箱）翻译成任一官方语言时调用。Look up the official localized label for a raw game key across 9 languages.",
          "inputSchema": {
            "properties": {
              "key": {
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92fd8667bbc6dfef1bf921a4abf1cfd9aaeb075a861684024f0724326a1518c1"
        },
        {
          "name": "search_ffrs",
          "title": "Search all FFRS game data",
          "description": "当用户询问 FINAL FANTASY RESONANCE / FFRS 的任何装备、技能、敌人、任务、道具、幻兵、地图、商店、奖杯的名称、ID 或关键词时调用。Use when a user asks about any FFRS entity by name or keyword; searches all 14 datasets across all 9 game languages (Chinese, Japanese, Korean, English, German, French, Spanish). Returns ids to feed into get_entity.",
          "inputSchema": {
            "properties": {
              "kinds": {
                "description": "Restrict to these datasets; empty means all",
                "items": {
                  "enum": ["equipment", "items", "skills", "effects", "visions", "characters", "summons", "enemies", "quests", "shops", "maps", "trophies", "glossary", "achievementConds"],
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "default": "en",
                "description": "Language for returned names",
                "enum": ["ja", "en", "zh-Hans", "zh-Hant", "ko", "de", "fr", "es", "is"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name / id / keyword in any supported language, e.g. \"轮回之翼\", \"イフリート\", \"Crimson Saber\", \"10300\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8a04b4f6fe934c5303b09fc5364e62dd8653fc256858402550d3a058e154fb7"
        },
        {
          "name": "wiki_stats",
          "title": "Dataset size and visit counters",
          "description": "用户问这个资料库有多大、支持哪些语言、有多少人/AI 访问过时调用。Return dataset counts, supported languages and the human vs AI visit counters.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c77b23dcdcd2bb5ff977e51d1edea9296c973878188269d426b6307ffc54be3d"
        }
      ],
