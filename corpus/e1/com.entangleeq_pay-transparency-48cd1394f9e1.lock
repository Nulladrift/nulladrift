{
  "lockfileVersion": 2,
  "subjects": {
    "com.entangleeq/pay-transparency": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.entangleeq.com/api/mcp-public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entangleeq-public",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "assess_readiness",
          "description": "Use this when a user wants a first-pass readiness check for French/EU pay transparency obligations before requesting an PariteCK demo. country and headcount are required — the tool rejects the call (rather than guessing) if they are missing or mis-named, so obligation applicability is never inferred from incomplete input.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Company country, for example France. Required.",
                "minLength": 2,
                "type": "string"
              },
              "hasCseReporting": {
                "description": "Whether CSE/NAO reporting evidence is already assembled.",
                "type": "boolean"
              },
              "hasJobFamilies": {
                "description": "Whether equivalent-value job families/categories are mapped.",
                "type": "boolean"
              },
              "hasPayrollExport": {
                "description": "Whether payroll export or DSN data is available.",
                "type": "boolean"
              },
              "hasPromotionData": {
                "description": "Whether promotion data is available.",
                "type": "boolean"
              },
              "headcount": {
                "description": "Approximate employee count (positive whole number). Required.",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["country", "headcount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:99eded4dcb96991ad29bfd3b13091d0dde849dd7843d80107b51035e01ecee24"
        },
        {
          "name": "fetch",
          "description": "Use this when ChatGPT needs the full public text for a specific PariteCK page returned by search. Never returns private company or employee data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Public page id returned by search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:232b60e06281e33925bf3835a104f6bea844315445b1c438a0cfb3f27e6a7e1f"
        },
        {
          "name": "request_demo_lead",
          "description": "Use this when a user wants to be contacted by PariteCK, or asks for a demo, a quote or a meeting. This tool does NOT transmit contact details: it returns the URL of the PariteCK contact form, which the user must fill in themselves. Show them the returned URL. Never send a name, an email, a phone number or any personal data through this tool: PariteCK does not accept contact details relayed by an assistant, because the person's consent cannot be verified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "companyName": {
                "description": "Optional. Company / organisation name, kept as an anonymous usage statistic. Never a person name.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "primaryTopic": {
                "description": "Optional. Main interest: egapro | pay_gap | vss | csrd | global.",
                "enum": ["egapro", "pay_gap", "vss", "csrd", "global"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d8cce8006363b2f7c3e8490422b5e3d66ab421abf01f142417b797d3760eb3ce"
        },
        {
          "name": "search",
          "description": "Use this when a ChatGPT user asks about PariteCK, Egapro, Directive (UE) 2023/970, pay transparency, the Score Parité (IDS), or PariteCK public product information. Returns public pages only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results to return. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search query about PariteCK public content.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dded606bb7d37157037ff0a0ab9e8f51745aa2414bdaafb640f4b53113043300"
        },
        {
          "name": "simulate_index_2027",
          "description": "Use this when a French employer (or their advisor) asks what the reform of the French gender-equality index (Index Egapro) means for them, or wants to look up a company's current published index by SIREN or company name. Given a 9-digit SIREN or a company name, returns the latest public Egapro declaration (global score + the 5 current indicators) and the framing of the move to the 7 indicators of the pay-transparency bill (which are new-data indicators, and the 2026 data checklist). Public data only; no private company or employee data. Estimate for decision-support, not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A 9-digit SIREN or a company name (raison sociale). Minimum 3 characters.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e70f172d291eadfb4b9c5cba6d9206326463083b5b1d698d2507449421bef890"
        }
      ],
      "digest": "sha256:8ef31aadcba055f4ca1d067cdca48a95e12ec3be750e7c090e2eaa872b686ad5"
    }
  }
}
