{
  "lockfileVersion": 2,
  "subjects": {
    "com.entangleeq/pay-transparency": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.pariteck.fr/api/mcp-public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "entangleeq-public",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "assess_readiness",
          "description": "Use this when a user wants a first-pass readiness check for French/EU pay transparency obligations before requesting a PariteCK demo. country and headcount are required: the tool rejects the call (rather than guessing) if they are missing or mis-named, so obligation applicability is never inferred from incomplete input.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Company country, for example France. Required.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "hasCseReporting": {
                "description": "Whether CSE/NAO reporting evidence is already assembled.",
                "type": "boolean"
              },
              "hasJobFamilies": {
                "description": "Whether equivalent-value job families/categories are mapped.",
                "type": "boolean"
              },
              "hasPayrollExport": {
                "description": "Whether payroll export or DSN data is available.",
                "type": "boolean"
              },
              "hasPromotionData": {
                "description": "Whether promotion data is available.",
                "type": "boolean"
              },
              "headcount": {
                "description": "Approximate employee count (positive whole number). Required.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["country", "headcount"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appliesDirective2023970": {
                "description": "The French transposition of Directive (UE) 2023/970 would apply.",
                "type": "boolean"
              },
              "appliesEgapro": {
                "description": "Current French index (Egapro) applies.",
                "type": "boolean"
              },
              "blockers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "campaigns": {
                "description": "Last campaign under the current index, then the first one with seven indicators.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assumed": {
                      "description": "True when the date depends on a text not yet in force.",
                      "type": "boolean"
                    },
                    "campaignYear": {
                      "type": "number"
                    },
                    "exerciseYear": {
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    },
                    "regime": {
                      "type": "string"
                    }
                  },
                  "required": ["assumed", "campaignYear", "exerciseYear", "label", "regime"],
                  "type": "object"
                },
                "type": "array"
              },
              "caveat": {
                "description": "Decision-support caveat, to show with the answer.",
                "type": "string"
              },
              "interpretedInputs": {
                "additionalProperties": false,
                "description": "The inputs as the tool understood them; missing booleans read as false.",
                "properties": {
                  "country": {
                    "type": "string"
                  },
                  "hasCseReporting": {
                    "type": "boolean"
                  },
                  "hasJobFamilies": {
                    "type": "boolean"
                  },
                  "hasPayrollExport": {
                    "type": "boolean"
                  },
                  "hasPromotionData": {
                    "type": "boolean"
                  },
                  "headcount": {
                    "type": "number"
                  }
                },
                "required": ["country", "hasCseReporting", "hasJobFamilies", "hasPayrollExport", "hasPromotionData", "headcount"],
                "type": "object"
              },
              "legalStatus": {
                "type": ["string", "null"]
              },
              "nextSteps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "readinessLevel": {
                "enum": ["ready-to-assess", "partially-ready", "not-ready"],
                "type": "string"
              }
            },
            "required": ["appliesDirective2023970", "appliesEgapro", "blockers", "campaigns", "caveat", "interpretedInputs", "legalStatus", "nextSteps", "readinessLevel"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c41a12d78123976bd95cbb2891b837a359f1d7a7317105279415940c740d5fb"
        },
        {
          "name": "benchmark_egapro",
          "description": "Use this when a user wants to compare a company's French gender-equality index (Index Egapro) with its sector, its region or France as a whole. Returns the mean, quartiles and median indicators of the latest public declarations, for one sector (NAF code or plain words such as 'banque'), one region, both, or nationally when neither is given. Aggregated public data (data.gouv.fr) only; groups under 5 companies are never published. No private company or employee data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "region": {
                "description": "Optional. French region name, e.g. 'Île-de-France' or 'Bretagne'.",
                "maxLength": 80,
                "type": "string"
              },
              "sector": {
                "description": "Optional. NAF code (62.02A, 64.19Z; a 2-digit division lists its sub-sectors) or sector words ('banque', 'conseil').",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "byHeadcountBand": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "companyCount": {
                      "type": "number"
                    },
                    "headcountBand": {
                      "type": "string"
                    },
                    "scoreMedian": {
                      "type": "number"
                    }
                  },
                  "required": ["companyCount", "headcountBand", "scoreMedian"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "overall": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "companyCount": {
                        "description": "Number of reporting companies in this group.",
                        "type": "number"
                      },
                      "indicatorMedians": {
                        "additionalProperties": false,
                        "properties": {
                          "ind1Remun": {
                            "type": ["number", "null"]
                          },
                          "ind2Augm": {
                            "type": ["number", "null"]
                          },
                          "ind3Promo": {
                            "type": ["number", "null"]
                          },
                          "ind4Materno": {
                            "type": ["number", "null"]
                          },
                          "ind5Top10": {
                            "type": ["number", "null"]
                          }
                        },
                        "required": ["ind1Remun", "ind2Augm", "ind3Promo", "ind4Materno", "ind5Top10"],
                        "type": "object"
                      },
                      "scoreMean": {
                        "type": ["number", "null"]
                      },
                      "scoreMedian": {
                        "type": "number"
                      },
                      "scoreP25": {
                        "type": "number"
                      },
                      "scoreP75": {
                        "type": "number"
                      }
                    },
                    "required": ["companyCount", "indicatorMedians", "scoreMean", "scoreMedian", "scoreP25", "scoreP75"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Score out of 100 (mean, quartiles) and median of each indicator."
              },
              "pageUrl": {
                "description": "Public PariteCK page with the full benchmark.",
                "type": ["string", "null"]
              },
              "region": {
                "type": ["string", "null"]
              },
              "scope": {
                "description": "Which group the figures describe; not_found when nothing can be published.",
                "enum": ["national", "sector", "region", "sector_region", "not_found"],
                "type": "string"
              },
              "sector": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "label": {
                        "type": "string"
                      },
                      "nafCode": {
                        "type": "string"
                      }
                    },
                    "required": ["label", "nafCode"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "sectorCandidates": {
                "description": "When several sectors match the words given: call again with one nafCode.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "nafCode": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "nafCode"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "year": {
                "description": "Declaration year of the benchmark.",
                "type": ["number", "null"]
              }
            },
            "required": ["byHeadcountBand", "note", "overall", "pageUrl", "region", "scope", "sector", "sectorCandidates", "source", "year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20f6d74f10c3a945b4769eefb7f1751480d16581123323aa493e3f071bc70a21"
        },
        {
          "name": "fetch",
          "description": "Use this when the assistant needs the full public text of a PariteCK page returned by search. Never returns private company or employee data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Public page id returned by search.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Full public text of the page (Markdown).",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["content", "id", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7fd618f075b7c23f895e1b2859605ac0832afb5ca72bd995cac2cdb9dea40e9"
        },
        {
          "name": "request_demo_lead",
          "description": "Use this when a user wants to be contacted by PariteCK, or asks for a demo, a quote or a meeting. This tool does NOT transmit contact details: it returns the URL of the PariteCK contact form, which the user must fill in themselves. Show them the returned URL. Never send a name, an email, a phone number or any personal data through this tool: PariteCK does not accept contact details relayed by an assistant, because the person's consent cannot be verified.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "companyName": {
                "description": "Optional. Company / organisation name, kept only as a usage statistic, with no personal data. Never a person name.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "primaryTopic": {
                "description": "Optional. Main interest: egapro | pay_gap | vss | csrd | global.",
                "enum": ["egapro", "pay_gap", "vss", "csrd", "global"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "action": {
                "const": "show_contact_form_url",
                "type": "string"
              },
              "contactFormUrl": {
                "description": "Contact form the user fills in themselves.",
                "type": "string"
              },
              "instruction": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              }
            },
            "required": ["action", "contactFormUrl", "instruction", "reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8befe49337a387189731a838ba5469b9c4447beedf3f840a847a3e3582d5fb6b"
        },
        {
          "name": "search",
          "description": "Use this when a user asks about PariteCK, Egapro, Directive (UE) 2023/970, pay transparency, the Score Parité (IDS), or PariteCK public product information. Returns public pages only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Maximum results to return. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search query about PariteCK public content.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "description": "Public pages matching the query, best match first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Page id, to pass to fetch.",
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "summary", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9ec2d2aa8babc808d8c7539aa7cb1f5a977006dde49fb2175efce92b6a9a2c0"
        },
        {
          "name": "simulate_index_2027",
          "description": "Use this when a French employer (or their advisor) asks what the reform of the French gender-equality index (Index Egapro) means for them, or wants to look up a company's current published index by SIREN or company name. Given a 9-digit SIREN or a company name, returns the latest public Egapro declaration (global score + the 5 current indicators) and the framing of the move to the 7 indicators of the pay-transparency bill (which are new-data indicators, and the 2026 data checklist). Public data only; no private company or employee data. Estimate for decision-support, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "A 9-digit SIREN or a company name (raison sociale). Minimum 3 characters.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "caveat": {
                "description": "Decision-support caveat, to show with the answer.",
                "type": "string"
              },
              "matchCount": {
                "type": "number"
              },
              "matches": {
                "description": "Latest public declaration per company, from public Egapro data.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "companyName": {
                      "type": "string"
                    },
                    "currentIndicators": {
                      "additionalProperties": false,
                      "properties": {
                        "ind1Remun": {
                          "type": ["number", "null"]
                        },
                        "ind2Augm": {
                          "type": ["number", "null"]
                        },
                        "ind3Promo": {
                          "type": ["number", "null"]
                        },
                        "ind4Materno": {
                          "type": ["number", "null"]
                        },
                        "ind5Top10": {
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["ind1Remun", "ind2Augm", "ind3Promo", "ind4Materno", "ind5Top10"],
                      "type": "object"
                    },
                    "headcountBand": {
                      "type": "string"
                    },
                    "isNC": {
                      "description": "True when the index could not be computed.",
                      "type": "boolean"
                    },
                    "nafLabel": {
                      "type": "string"
                    },
                    "region": {
                      "type": "string"
                    },
                    "scoreGlobal": {
                      "description": "Global score out of 100; null if not computable.",
                      "type": ["number", "null"]
                    },
                    "siren": {
                      "type": "string"
                    },
                    "year": {
                      "description": "Year of the latest public declaration.",
                      "type": "number"
                    }
                  },
                  "required": ["companyName", "currentIndicators", "headcountBand", "isNC", "nafLabel", "region", "scoreGlobal", "siren", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "reform": {
                "additionalProperties": false,
                "properties": {
                  "computedByCompanyCount": {
                    "type": "number"
                  },
                  "computedByStateCount": {
                    "type": "number"
                  },
                  "currentIndicatorCount": {
                    "type": "number"
                  },
                  "dataChecklist2026": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "futureIndicatorCount": {
                    "type": "number"
                  },
                  "futureIndicators": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "computedBy": {
                          "enum": ["etat", "entreprise"],
                          "type": "string"
                        },
                        "detail": {
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "noThreshold": {
                          "type": "boolean"
                        }
                      },
                      "required": ["computedBy", "detail", "label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "source": {
                    "type": "string"
                  }
                },
                "required": ["computedByCompanyCount", "computedByStateCount", "currentIndicatorCount", "dataChecklist2026", "futureIndicatorCount", "futureIndicators", "source"],
                "type": "object"
              },
              "simulatorUrl": {
                "type": "string"
              }
            },
            "required": ["caveat", "matchCount", "matches", "note", "query", "reform", "simulatorUrl"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:375b3e2e53aa51c7e66b83e538b906e715db640352d93ebd95c077e2688240eb"
        }
      ],
      "digest": "sha256:b2f2bd23ced8242d1dce3bbd429f18bfac5c666242d226f858ee0b6954cdb1eb"
    }
  }
}
