{
  "lockfileVersion": 2,
  "subjects": {
    "com.entangleeq/pay-transparency": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.entangleeq.com/api/mcp-public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "entangleeq-public",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "assess_readiness",
          "description": "Use this when a user wants a first-pass readiness check for French/EU pay transparency obligations before requesting an PariteCK demo. country and headcount are required: the tool rejects the call (rather than guessing) if they are missing or mis-named, so obligation applicability is never inferred from incomplete input.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Company country, for example France. Required.",
                "minLength": 2,
                "type": "string"
              },
              "hasCseReporting": {
                "description": "Whether CSE/NAO reporting evidence is already assembled.",
                "type": "boolean"
              },
              "hasJobFamilies": {
                "description": "Whether equivalent-value job families/categories are mapped.",
                "type": "boolean"
              },
              "hasPayrollExport": {
                "description": "Whether payroll export or DSN data is available.",
                "type": "boolean"
              },
              "hasPromotionData": {
                "description": "Whether promotion data is available.",
                "type": "boolean"
              },
              "headcount": {
                "description": "Approximate employee count (positive whole number). Required.",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["country", "headcount"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appliesDirective2023970": {
                "description": "The French transposition of Directive (UE) 2023/970 would apply.",
                "type": "boolean"
              },
              "appliesEgapro": {
                "description": "Current French index (Egapro) applies.",
                "type": "boolean"
              },
              "blockers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "campaigns": {
                "description": "Last campaign under the current index, then the first one with seven indicators.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assumed": {
                      "description": "True when the date depends on a text not yet in force.",
                      "type": "boolean"
                    },
                    "campaignYear": {
                      "type": "number"
                    },
                    "exerciseYear": {
                      "type": "number"
                    },
                    "label": {
                      "type": "string"
                    },
                    "regime": {
                      "type": "string"
                    }
                  },
                  "required": ["assumed", "campaignYear", "exerciseYear", "label", "regime"],
                  "type": "object"
                },
                "type": "array"
              },
              "caveat": {
                "description": "Decision-support caveat, to show with the answer.",
                "type": "string"
              },
              "interpretedInputs": {
                "additionalProperties": false,
                "description": "The inputs as the tool understood them; missing booleans read as false.",
                "properties": {
                  "country": {
                    "type": "string"
                  },
                  "hasCseReporting": {
                    "type": "boolean"
                  },
                  "hasJobFamilies": {
                    "type": "boolean"
                  },
                  "hasPayrollExport": {
                    "type": "boolean"
                  },
                  "hasPromotionData": {
                    "type": "boolean"
                  },
                  "headcount": {
                    "type": "number"
                  }
                },
                "required": ["country", "hasCseReporting", "hasJobFamilies", "hasPayrollExport", "hasPromotionData", "headcount"],
                "type": "object"
              },
              "legalStatus": {
                "type": ["string", "null"]
              },
              "nextSteps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "readinessLevel": {
                "enum": ["ready-to-assess", "partially-ready", "not-ready"],
                "type": "string"
              }
            },
            "required": ["appliesDirective2023970", "appliesEgapro", "blockers", "campaigns", "caveat", "interpretedInputs", "legalStatus", "nextSteps", "readinessLevel"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0c1563d1aaf609cd83de8c849d52f39c79942e91e26094547e817942956d7b82"
        },
        {
          "name": "fetch",
          "description": "Use this when ChatGPT needs the full public text for a specific PariteCK page returned by search. Never returns private company or employee data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Public page id returned by search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Full public text of the page (Markdown).",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["content", "id", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59d0be8ce8c5663d6d3302152fab79fe29f17dca0a8160aa968ac6a95fab87e2"
        },
        {
          "name": "request_demo_lead",
          "description": "Use this when a user wants to be contacted by PariteCK, or asks for a demo, a quote or a meeting. This tool does NOT transmit contact details: it returns the URL of the PariteCK contact form, which the user must fill in themselves. Show them the returned URL. Never send a name, an email, a phone number or any personal data through this tool: PariteCK does not accept contact details relayed by an assistant, because the person's consent cannot be verified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "companyName": {
                "description": "Optional. Company / organisation name, kept as an anonymous usage statistic. Never a person name.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "primaryTopic": {
                "description": "Optional. Main interest: egapro | pay_gap | vss | csrd | global.",
                "enum": ["egapro", "pay_gap", "vss", "csrd", "global"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "const": "show_contact_form_url",
                "type": "string"
              },
              "contactFormUrl": {
                "description": "Contact form the user fills in themselves.",
                "type": "string"
              },
              "instruction": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              }
            },
            "required": ["action", "contactFormUrl", "instruction", "reason"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ae8c9ddc3eb353ba1dbaeaf01fdc5de7ed6773397507c93e0a9b014301d93022"
        },
        {
          "name": "search",
          "description": "Use this when a ChatGPT user asks about PariteCK, Egapro, Directive (UE) 2023/970, pay transparency, the Score Parité (IDS), or PariteCK public product information. Returns public pages only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results to return. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search query about PariteCK public content.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "description": "Public pages matching the query, best match first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "description": "Page id, to pass to fetch.",
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "summary", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9c490de15210aa5951ecbdf12e4240e7eec4e3ca925c8971015d4fe72dd25ef6"
        },
        {
          "name": "simulate_index_2027",
          "description": "Use this when a French employer (or their advisor) asks what the reform of the French gender-equality index (Index Egapro) means for them, or wants to look up a company's current published index by SIREN or company name. Given a 9-digit SIREN or a company name, returns the latest public Egapro declaration (global score + the 5 current indicators) and the framing of the move to the 7 indicators of the pay-transparency bill (which are new-data indicators, and the 2026 data checklist). Public data only; no private company or employee data. Estimate for decision-support, not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A 9-digit SIREN or a company name (raison sociale). Minimum 3 characters.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "caveat": {
                "description": "Decision-support caveat, to show with the answer.",
                "type": "string"
              },
              "matchCount": {
                "type": "number"
              },
              "matches": {
                "description": "Latest public declaration per company, from public Egapro data.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "companyName": {
                      "type": "string"
                    },
                    "currentIndicators": {
                      "additionalProperties": false,
                      "properties": {
                        "ind1Remun": {
                          "type": ["number", "null"]
                        },
                        "ind2Augm": {
                          "type": ["number", "null"]
                        },
                        "ind3Promo": {
                          "type": ["number", "null"]
                        },
                        "ind4Materno": {
                          "type": ["number", "null"]
                        },
                        "ind5Top10": {
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["ind1Remun", "ind2Augm", "ind3Promo", "ind4Materno", "ind5Top10"],
                      "type": "object"
                    },
                    "headcountBand": {
                      "type": "string"
                    },
                    "isNC": {
                      "description": "True when the index could not be computed.",
                      "type": "boolean"
                    },
                    "nafLabel": {
                      "type": "string"
                    },
                    "region": {
                      "type": "string"
                    },
                    "scoreGlobal": {
                      "description": "Global score out of 100; null if not computable.",
                      "type": ["number", "null"]
                    },
                    "siren": {
                      "type": "string"
                    },
                    "year": {
                      "description": "Year of the latest public declaration.",
                      "type": "number"
                    }
                  },
                  "required": ["companyName", "currentIndicators", "headcountBand", "isNC", "nafLabel", "region", "scoreGlobal", "siren", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "reform": {
                "additionalProperties": false,
                "properties": {
                  "computedByCompanyCount": {
                    "type": "number"
                  },
                  "computedByStateCount": {
                    "type": "number"
                  },
                  "currentIndicatorCount": {
                    "type": "number"
                  },
                  "dataChecklist2026": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "futureIndicatorCount": {
                    "type": "number"
                  },
                  "futureIndicators": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "computedBy": {
                          "enum": ["etat", "entreprise"],
                          "type": "string"
                        },
                        "detail": {
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "noThreshold": {
                          "type": "boolean"
                        }
                      },
                      "required": ["computedBy", "detail", "label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "source": {
                    "type": "string"
                  }
                },
                "required": ["computedByCompanyCount", "computedByStateCount", "currentIndicatorCount", "dataChecklist2026", "futureIndicatorCount", "futureIndicators", "source"],
                "type": "object"
              },
              "simulatorUrl": {
                "type": "string"
              }
            },
            "required": ["caveat", "matchCount", "matches", "note", "query", "reform", "simulatorUrl"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f346e13d4296f8c99628b3f0d2d38b884227ff1a21f6e9a75196f03ddba7b9e9"
        }
      ],
      "digest": "sha256:f7bb5b32aea400e4f94ab1d7a1f593d4dab910f247210b9b9abd172339aa6786"
    }
  }
}
