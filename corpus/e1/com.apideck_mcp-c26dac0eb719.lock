        {
          "name": "describe_tool_input",
          "description": "Return the JSON-Schema input contract for a tool by name.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Exact tool name to describe (e.g. \"accounting-invoices-create\"), as returned by list_tools.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
