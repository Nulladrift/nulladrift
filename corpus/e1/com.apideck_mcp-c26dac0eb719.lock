{
  "lockfileVersion": 2,
  "subjects": {
    "com.apideck/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.apideck.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "apideck-mcp",
        "version": "0.29.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "describe_tool_input",
          "description": "Return the JSON-Schema input contract for a tool by name.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Exact tool name to describe (e.g. \"accounting-invoices-create\"), as returned by list_tools.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebbd774941ddcdb2092d75fd8e6143a9ae0243ac93b493fa50536bf5696ea8a8"
        },
        {
          "name": "execute_tool",
          "description": "Invoke a tool by name. `input` is validated against the target schema before dispatch.",
          "inputSchema": {
            "properties": {
              "input": {
                "additionalProperties": {},
                "description": "Arguments object validated before being forwarded to the target tool. Its shape matches that tool's input schema (fetch it with describe_tool_input). Omit for tools that take no arguments.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "description": "Exact tool name to invoke (e.g. \"accounting-invoices-create\"), as returned by list_tools.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:34f0c04975172d0d7a70b81d8b3aea26ccccb3bbbe1d30ae234acf94f811a9ee"
        },
        {
          "name": "list_scopes",
          "description": "Return the list of allowed MCP scopes.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:856c03c7c8b34b147e79c7920e6beb078cff896dddf2543ddd1d6061a722db61"
        },
        {
          "name": "list_tools",
          "description": "Discover Apideck tools. Call with no args for domain index; filter with domain/search_terms/scope. Scoped to the connection's supported resources when service_id is set.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Restrict results to a single tool domain (e.g. \"accounting\", \"hris\"). Omit to get the cross-domain index. Use a key returned by a prior no-arg call.",
                "type": "string"
              },
              "scope": {
                "description": "Filter by mutation scope: \"read\" (no writes), \"write\" (creates/updates), or \"destructive\" (deletes/overwrites). Omit to include all scopes.",
                "enum": ["read", "write", "destructive"],
                "type": "string"
              },
              "search_terms": {
                "description": "Case-insensitive substring terms ANDed across a tool name/description (e.g. [\"invoice\",\"create\"]). Omit to list everything in the domain.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9a5aa5d8c5d09cfc44b0b2a1f7b9829692e05d30677caced508f22a0d87cfe6"
        }
      ],
      "digest": "sha256:a4e2306ef25060e7e01e2763d28d4b2687540bf6479bf2e65e04f3d900055f72"
    }
  }
}
