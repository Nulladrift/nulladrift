          },
          "digest": "sha256:514168678497314225483f5b6e28da570dfa9ef162214bd7cd64d939a0017423"
        },
        {
          "name": "execute_tool",
          "description": "Invoke a tool by name. `input` is validated against the target schema before dispatch.",
          "inputSchema": {
            "properties": {
              "input": {
                "additionalProperties": {},
                "description": "Arguments object validated before being forwarded to the target tool. Its shape matches that tool's input schema (fetch it with describe_tool_input). Omit for tools that take no arguments.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "name": {
                "description": "Exact tool name to invoke (e.g. \"accounting-invoices-create\"), as returned by list_tools.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
