      },
      "transport": {
        "type": "http",
        "url": "https://partstable.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "PartsTable",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get-part",
          "title": "Get Part Details",
          "description": "Get the part record: identity, manufacturer, description, category, lifecycle, and government classification (NSN/FSC) when present. Sourced from the PartsTable read model.",
          "inputSchema": {
            "properties": {
              "partNumber": {
                "description": "Part number to look up",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["partNumber"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5e633bf4eb3a052fcadff46dfcccf5cdf4dfcf649476f7ddf8d03b13b7c5d54"
        },
        {
          "name": "get-substitutes",
          "title": "Get Substitute Part Numbers",
          "description": "Find substitute / equivalent / cross-referenced part numbers in the PartsTable cross-reference graph (2,001,002 cross-references, measured 2026-10-18).",
          "inputSchema": {
            "properties": {
              "partNumber": {
                "description": "Part number to find substitutes for",
                "type": "string"
              }
            },
            "required": ["partNumber"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8f2537db2ec51818423f09ddf3fc2adef5e76c1943f7c9f1e09f2e67b47928e"
        },
        {
          "name": "normalize-pn",
          "title": "Normalize Part Number",
          "description": "Normalize an IT hardware part number into its standard form. Handles HPE (B21/001/spare), Dell (400-XXXX, DP/N), and IBM/Lenovo (FRU) formats. Critical for deduplication and accurate lookups.",
          "inputSchema": {
            "properties": {
              "partNumber": {
                "description": "Part number is required",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["partNumber"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7eb751cdf053a5bdb14ebdef2256b864dfc882c607f47d1b8775c69228e556a8"
        },
        {
          "name": "search-parts",
          "title": "Batch Part Lookup",
          "description": "Look up a batch of part numbers (max 25) against the PartsTable catalog. Returns per-part identity summary and whether each exists.",
          "inputSchema": {
            "properties": {
              "partNumbers": {
                "description": "Part numbers to look up",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["partNumbers"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:503c5dd3f4dce44763cf623c48f599bb9d31a997eb67fc7fba7bb657b73d4e51"
        },
        {
          "name": "validate-pn",
          "title": "Validate Part Number",
          "description": "Validate a part number and check whether it exists in the PartsTable catalog (26,182,530 distinct part numbers, measured 2026-11-11), from government, OEM, and commercial authority sources. Returns structural validity and catalog existence.",
          "inputSchema": {
            "properties": {
              "partNumber": {
                "description": "The part number to validate",
                "type": "string"
              }
            },
            "required": ["partNumber"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b325f42de2e1a948210afffcd232a4addbc168a0799859b4a2770064bbbdddeb"
        }
      ],
      "digest": "sha256:866aea5a69104f3a983851f6ae65e9297fb6fa58c5969f1c376003009c6fe727"
    }
  }
