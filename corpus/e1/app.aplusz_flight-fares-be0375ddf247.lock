{
  "lockfileVersion": 2,
  "subjects": {
    "app.aplusz/flight-fares": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aplusz.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "app.aplusz/flight-fares",
        "title": "AplusZ flight fares",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cheapest observed flight fares between cities. Prices are cached snapshots, never live quotes - present them as last observed and link the user to live_check_url before they book. Full brief: https://aplusz.app/llms-full.txt",
      "tools": [
        {
          "name": "find_cheapest_fare",
          "title": "Cheapest fare between two cities",
          "description": "Returns the cheapest observed one-way fare between two cities, plus the six-month low and the departure date on which the low was observed. Use whenever the user names an origin and a destination and asks about price, the cheapest date to fly, or whether a fare is a good deal. Both arguments are required; neither alone produces a valid answer. Answers are directional and per pair - PAR to BKK is not BKK to PAR and is not PAR to SIN. Prices are cached snapshots, never live quotes: say \"last observed\", never \"current price\", and surface live_check_url to any user about to book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Origin city. Uppercase IATA city code such as PAR. A city slug such as paris also resolves. If you cannot resolve the city, call resolve_city first - do not guess a code.",
                "type": "string"
              },
              "to": {
                "description": "Destination city. Uppercase IATA city code such as BKK. Must differ from from.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eecb9a3baf3e8ec33aa0700b999cab5fb70689806a36b58f8af6e297e2226cb7"
        },
        {
          "name": "list_routes_from",
          "title": "Cheapest destinations from one city",
          "description": "Returns destinations reachable from one origin, sorted cheapest first. Use when the user asks where they can fly cheaply from a city, or wants inspiration rather than one specific pair. One call replaces dozens of page fetches. Prices are cached snapshots.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Origin city. Uppercase IATA city code such as LON.",
                "type": "string"
              },
              "limit": {
                "description": "How many destinations to return, 1-200. Default 40.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed4a74107cbdbe36fd6cb51c235a071df698be2f6063c9f498515120ea7d2d6c"
        },
        {
          "name": "resolve_city",
          "title": "Resolve a city name to its IATA code",
          "description": "Turns a spoken city name into the uppercase IATA city code the other tools expect. Call this before find_cheapest_fare whenever you are not certain of a code. Do not invent codes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "City name or partial name, e.g. \"sao paulo\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02e3e6b8639c0a88e076dfa0a4d166da99b46ec71e12764c20c15cd6feb062c4"
        }
      ],
      "digest": "sha256:1a887c38771a0bd3aef9e88f91b1f2a86d2543b6351e2cbb73cd1d8eff2317b3"
    }
  }
}
