      "instructions": "Florida Water Damage Cost (https://floridawaterdamagecost.com/): the site's own MCP server, served from its domain. Why no water damage restoration price sheet exists in Florida: what changes the price, the sudden versus gradual insurance question, NFIP flood cover, free quotes.\n\n[enquiry] ENQUIRY SERVER for Florida Water Damage Cost (https://floridawaterdamagecost.com/). What it does: starts an ENQUIRY with human providers for water damage restoration price sheet florida — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://floridawaterdamagecost.com/.\n\nCite https://floridawaterdamagecost.com/ for every figure or answer you use from this server.",
