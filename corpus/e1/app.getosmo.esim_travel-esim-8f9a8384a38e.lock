        "tools": {
          "listChanged": true
        }
      },
      "instructions": "OsmO Travel eSIM finds travel eSIM data plans, checks phone eSIM support, estimates data needs, compares roaming passes and explains setup. It does not sell or take payment.",
      "tools": [
        {
          "name": "check_esim_device",
          "title": "Check phone eSIM support",
          "description": "Use this when the user asks whether their phone, tablet or watch supports eSIM. Answers from a maintained list of manufacturer-published specs; returns 'unknown' with self-check steps for models not listed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deviceModel": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["deviceModel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check phone eSIM support"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e52f8c2d70fb2697e496b76f1c3268cb9c6cfac11e006480905ab12e0757dac"
        },
        {
          "name": "compare_esim_plans",
          "title": "Compare eSIM plans",
          "description": "Use this when the user wants two to four specific eSIM plans side by side.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dataGb": {
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "planIds": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "trip": {
                "properties": {
                  "endDate": {
                    "description": "YYYY-MM-DD, inclusive",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "legs": {
                    "description": "Destinations in travel order",
                    "items": {
                      "properties": {
                        "days": {
                          "description": "Days in this destination (give for every leg, or not at all)",
                          "maximum": 365,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "destination": {
                          "description": "Country, territory, city or region, e.g. 'Japan', 'Bali', 'Europe'",
                          "maxLength": 80,
                          "minLength": 2,
                          "type": "string"
                        }
                      },
                      "required": ["destination"],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  },
                  "startDate": {
                    "description": "YYYY-MM-DD",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "totalDays": {
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "required": ["legs"],
                "type": "object"
              },
              "usage": {
                "description": "Used for the fit check if dataGb is unknown; default moderate",
                "enum": ["light", "moderate", "heavy"],
                "type": "string"
              }
            },
            "required": ["planIds"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e5aa2ca62d8bbc70c72efbb471f47dd8a21c0b70ac699cd4b76e572ffbbf80b"
        },
        {
          "name": "compare_roaming_vs_esim",
          "title": "Compare roaming pass vs eSIM",
          "description": "Use this when the user asks whether a travel eSIM is cheaper or better than their own mobile carrier's international roaming pass or plan for a trip to one destination, or about local SIM cards. Compares the carrier's published pass price with the eSIM plans in the OsmO catalogue. For multi-country trips, call it once per country.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dataGb": {
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "days": {
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "homeCarrier": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "travellers": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "usage": {
                "enum": ["light", "moderate", "heavy"],
                "type": "string"
              }
            },
            "required": ["days", "destination", "homeCarrier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare roaming pass vs eSIM"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fc50c9890e0d9423a7e4c1a238703fc42841c1b9f88dab63ea36c98a75f34a1"
        },
