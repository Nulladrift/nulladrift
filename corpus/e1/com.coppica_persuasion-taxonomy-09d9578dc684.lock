      "instructions": "This is the Persuasion Taxonomy, from Coppica. It gives you a working model of the reader, a catalog of 767 persuasion techniques documented from real advertising, a way to check copy before anyone sees it, and the math behind A/B tests.\n\nThe model of the reader is simple. Everyone who reads an ad, a page or an email is silently asking nine questions: Why am I even reading this? Is this written for me? How bad is my problem, really? Am I thinking about this correctly? Can I trust the claim? What does my life look like after? What's stopping me from saying yes? Why should I act right now? Do I like and trust who's speaking? Copy persuades when it answers the questions its goal needs, answers them truthfully, and the answers fit together. When one answer contradicts another, the reader feels that something is off and trusts everything else a little less.\n\nThe tools cover writing, reviewing and testing marketing copy, from ads and landing pages to emails, subject lines, social posts, headlines and scripts. plan_marketing_copy plans a piece around the questions its goal needs, and diagnose_marketing_copy reviews a draft against them. find_persuasion_techniques searches the catalog, and get_persuasion_technique returns one technique in full. check_headlines checks and compares headlines, hooks and subject lines, and check_marketing_claims checks claims and buttons. explain_why_not_converting works back from what a funnel shows to the likely cause. plan_ab_test sizes an A/B test, and read_ab_test_result reads its result.\n\nEach technique comes with a link to its page, which shows the real examples behind it.",
      "tools": [
        {
          "name": "check_headlines",
          "title": "Check and compare headlines, hooks, and subject lines",
          "description": "Check headlines, email subject lines, ad openings, video hooks, social post openings and first lines, and compare options against each other. For each line it tells you whether the line does its job in that spot, meaning which of the nine reader questions it answers, and whether a competitor could send it unchanged. It also shows exactly what a reader sees before the cutoff, flags anything that fails outright, and brings in evidence from thousands of real headline tests. Then it says what each option is betting on and which two to test. It answers requests to check or choose between headlines, hooks or subject lines, including \"which one is best?\" You won't get a score out of ten. Nobody can predict a winner from the words alone, and that includes this tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "awareness_level": {
                "description": "How much the reader already knows, on Eugene Schwartz's scale: unaware means they don't know they have the problem, problem_aware that they feel it, solution_aware that they know solutions exist, product_aware that they know you, and most_aware that they're ready and only need the offer.",
                "enum": ["unaware", "problem_aware", "solution_aware", "product_aware", "most_aware"],
                "type": "string"
              },
              "brief": {
                "additionalProperties": false,
                "description": "The brief. The swap test needs it to tell whether a competitor could send the line unchanged, and without it no line can pass.",
                "properties": {
                  "audience": {
                    "description": "Who reads it: their role, their situation and what is theirs.",
                    "maxLength": 400,
                    "type": "string"
                  },
                  "brand": {
                    "description": "The brand or product name.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "offer": {
                    "description": "The deal or the ask, like the price, a discount, a trial or a deadline.",
                    "maxLength": 400,
                    "type": "string"
                  },
                  "product": {
                    "description": "What you're selling.",
                    "maxLength": 400,
                    "type": "string"
                  },
                  "proof": {
                    "description": "Real proof you can point to, like customer counts, results or names.",
                    "maxLength": 400,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "follows": {
                "description": "What the reader saw just before this line, like the ad before a landing page headline, or the headline or subject before a first line.",
                "maxLength": 600,
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answers": {
                      "description": "The reader questions this line answers, each with the exact words that do it. Leave it empty if the line answers none.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "question": {
                            "description": "The reader question the text answers, by its role name: DISRUPT for \"Why am I even reading this?\", IDENTIFY for \"Is this written for me?\", AGITATE for \"How bad is my problem, really?\", REFRAME for \"Am I thinking about this correctly?\", PROVE for \"Can I trust the claim?\", ELEVATE for \"What does my life look like after?\", RESOLVE for \"What's stopping me from saying yes?\", COMPEL for \"Why should I act right now?\", BOND for \"Do I like and trust who's speaking?\".",
                            "enum": ["DISRUPT", "IDENTIFY", "AGITATE", "REFRAME", "PROVE", "ELEVATE", "RESOLVE", "COMPEL", "BOND"],
                            "type": "string"
                          },
                          "words": {
                            "description": "The exact words in the line that answer it.",
                            "maxLength": 200,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["question", "words"],
                        "type": "object"
                      },
                      "maxItems": 9,
                      "type": "array"
                    },
                    "text": {
                      "description": "The line, exactly as written.",
                      "maxLength": 500,
                      "minLength": 2,
                      "type": "string"
                    }
                  },
                  "required": ["answers", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "slot": {
                "description": "Where the lines will appear: email_subject, ad_opening, landing_page_headline, first_line, video_hook, social_post_open, sales_letter_headline. Each spot has its own job, and the check tells you what it is.",
                "enum": ["email_subject", "ad_opening", "landing_page_headline", "first_line", "video_hook", "social_post_open", "sales_letter_headline"],
                "type": "string"
              }
            },
            "required": ["lines", "slot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check and compare headlines, hooks, and subject lines"
          },
