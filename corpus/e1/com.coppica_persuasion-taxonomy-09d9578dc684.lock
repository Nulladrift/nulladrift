        {
          "name": "plan_ab_test",
          "title": "Plan an A/B test",
          "description": "Plan an A/B test for marketing copy. It takes the current conversion rate, the smallest lift worth detecting and the daily traffic, and returns how many visitors each version needs and how many days to run. It also frames the test as two different answers to the same reader question, so the result teaches you something you can reuse, and not just that \"B won\". It answers questions like how long to run a test, how much traffic it needs, whether a test is worth running, or what to test next.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "baseline_conversion_rate_percent": {
                "description": "The current conversion rate, in percent, so 3 means 3% and 0.8 means 0.8%.",
                "exclusiveMaximum": 100,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "confidence": {
                "default": 0.95,
                "maximum": 0.999,
                "minimum": 0.8,
                "type": "number"
              },
              "daily_visitors": {
                "description": "How many visitors a day enter the test, across all versions.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "minimum_detectable_lift_percent": {
                "description": "The smallest relative lift worth detecting, in percent. 20 means a 20% lift, like going from 3% to 3.6%.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "power": {
                "default": 0.8,
                "maximum": 0.99,
                "minimum": 0.5,
                "type": "number"
              },
              "question": {
                "description": "The reader question both versions answer, each in its own way.",
                "enum": ["DISRUPT", "IDENTIFY", "AGITATE", "REFRAME", "PROVE", "ELEVATE", "RESOLVE", "COMPEL", "BOND"],
                "type": "string"
              },
              "version_a": {
                "description": "How version A answers it.",
                "maxLength": 600,
                "type": "string"
              },
              "version_b": {
                "description": "How version B answers it.",
                "maxLength": 600,
                "type": "string"
              },
              "versions": {
                "default": 2,
                "description": "How many versions, counting the original.",
                "maximum": 6,
                "minimum": 2,
                "type": "integer"
              }
            },
            "required": ["baseline_conversion_rate_percent", "daily_visitors", "minimum_detectable_lift_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
