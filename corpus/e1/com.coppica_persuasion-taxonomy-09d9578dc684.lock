        {
          "name": "check_marketing_claims",
          "title": "Check marketing claims and CTAs",
          "description": "Check whether marketing claims and calls to action are specific enough to believe. It catches the vague superlative, like \"the best\" or \"#1\", that readers discount on sight. It catches promises with no proof behind them and results with no mechanism, and it flags the generic buttons everyone uses, like \"Learn more\" and \"Get started\". Then it says how to fix each one. It covers claims like \"results in days\", \"trusted by thousands\" or \"the #1 tool\", and any button text. For a headline, it checks the claim only, not whether the headline does its job in its spot.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "claims": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "context": {
                      "description": "For a claim in the body, the paragraph around it, so a mechanism named nearby still counts.",
                      "maxLength": 1500,
                      "type": "string"
                    },
                    "text": {
                      "description": "The claim or the button text, exactly as written.",
                      "maxLength": 600,
                      "minLength": 2,
                      "type": "string"
                    },
                    "type": {
                      "description": "headline, cta (a button or call to action) or body_claim (a claim inside the copy).",
                      "enum": ["headline", "cta", "body_claim"],
                      "type": "string"
                    }
                  },
                  "required": ["text", "type"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["claims"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check marketing claims and CTAs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f1eb355aef9863d8b71c6ee9be7cacd2ac2b6df0cfd2e0dff08035f9910aa9e"
        },
        {
          "name": "diagnose_marketing_copy",
          "title": "Diagnose marketing copy (roast / review)",
          "description": "Review, critique or roast any piece of marketing copy, whether it's an ad, a landing page, an email, a sales page, a social post or a script, and find out why it might not persuade. It takes the copy and line-by-line labels naming the reader question each persuasive line answers. It returns which of the nine questions the copy answers for its goal, which it answers weakly and which it skips, along with the biggest gap and what readers do when it is missing. It also checks the order, whether the answers agree with each other, and the craft, pointing to the exact words that read as machine-written, like em dashes, \"it's not X, it's Y\" lines and sentences that all run the same length. Then it checks the opening line and suggests techniques from the catalog to fill the gap. It answers requests like \"is this good?\", \"roast this\", \"what's wrong with this copy?\" and \"how do I make it better?\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "awareness_level": {
                "description": "How much the reader already knows, on Eugene Schwartz's scale: unaware means they don't know they have the problem, problem_aware that they feel it, solution_aware that they know solutions exist, product_aware that they know you, and most_aware that they're ready and only need the offer.",
                "enum": ["unaware", "problem_aware", "solution_aware", "product_aware", "most_aware"],
                "type": "string"
              },
              "brief": {
                "additionalProperties": false,
                "description": "The brief, if you have it: the brand, product, offer, audience and proof. With it, the opening line gets the swap test, which asks whether a competitor could send it unchanged.",
                "properties": {
                  "audience": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "brand": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "offer": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "product": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "proof": {
                    "maxLength": 400,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "category": {
                "description": "The industry, for a comparison with what brands in that category usually do. There is enough data for apparel, automotive, b2b_saas, beauty_skincare, business_coaching, consumer_tech, dtc_food_bev, dtc_health, fitness_health, home_goods, info_product, investing, marketing_education, otc_pharma, personal_care, personal_development, supplements, weight_loss. Any other category still works, just without the comparison.",
                "maxLength": 60,
                "type": "string"
              },
              "copy": {
                "description": "The full copy, exactly as written.",
                "maxLength": 30000,
                "minLength": 10,
                "type": "string"
              },
              "format": {
                "description": "The kind of copy it is: ad, landing_page, sales_letter for long-form sales copy, email, email_subject, social_post, video_script or headline.",
                "enum": ["ad", "landing_page", "sales_letter", "email", "email_subject", "social_post", "video_script", "headline"],
                "type": "string"
              },
              "goal": {
                "description": "What the copy has to get the reader to do: purchase means buy now, signup means an opt-in, a trial, a demo or a lead form, click means the whole job is the click (most ads and links), and engagement covers nurture emails, newsletters and social posts that should be read, answered or followed.",
                "enum": ["purchase", "signup", "click", "engagement"],
                "type": "string"
              },
              "headline": {
                "description": "The headline or opening line, if it isn't the first line of the copy.",
                "maxLength": 300,
                "type": "string"
              },
              "moves": {
                "description": "Line-by-line labels: each persuasive line quoted exactly, with the one reader question it mainly answers. Lines that are pure filler are left out.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clarity": {
                      "default": "clear",
                      "description": "clear: the line answers the question well. partial: it only gestures at it.",
                      "enum": ["clear", "partial"],
                      "type": "string"
                    },
                    "excerpt": {
                      "description": "An exact quote from the copy, whether a sentence, a line or a short passage.",
                      "maxLength": 400,
                      "minLength": 2,
                      "type": "string"
                    },
                    "question": {
                      "description": "The reader question the text answers, by its role name: DISRUPT for \"Why am I even reading this?\", IDENTIFY for \"Is this written for me?\", AGITATE for \"How bad is my problem, really?\", REFRAME for \"Am I thinking about this correctly?\", PROVE for \"Can I trust the claim?\", ELEVATE for \"What does my life look like after?\", RESOLVE for \"What's stopping me from saying yes?\", COMPEL for \"Why should I act right now?\", BOND for \"Do I like and trust who's speaking?\".",
                      "enum": ["DISRUPT", "IDENTIFY", "AGITATE", "REFRAME", "PROVE", "ELEVATE", "RESOLVE", "COMPEL", "BOND"],
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "question"],
                  "type": "object"
                },
                "maxItems": 80,
                "minItems": 1,
                "type": "array"
              },
              "persuasion_mode": {
                "default": "balanced",
                "description": "How hard the copy is allowed to push. Balanced is the default, persuasive and sustainable over time. Equity protects long-term trust, so it rules out fear, hype and hard-sell moves. Aggressive is for short-term direct response and allows fear, threat and hard scarcity. In every mode, the claims stay true.",
                "enum": ["aggressive", "balanced", "equity"],
                "type": "string"
              }
            },
            "required": ["copy", "format", "goal", "moves"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Diagnose marketing copy (roast / review)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e7a751517ae8ea426fd0f039af7c94f7731a521d1699f12769754ae5be020ca"
        },
        {
          "name": "explain_why_not_converting",
          "title": "Explain why marketing is not converting",
          "description": "Work out why an ad, a landing page, an email or a whole funnel isn't converting, starting from what you can see. Maybe people don't click (a low CTR), or they click and bounce, or they read and don't buy. Maybe they abandon the checkout or the form, the leads never buy, customers buy once and leave, or emails don't get opened or get opened and nobody clicks. Whatever the symptom, you get back the reader questions most likely going unanswered, what to check in the copy first, and the problems copy can't fix, which are worth ruling out, along with techniques to try and the test that would confirm the diagnosis. It answers questions like why marketing \"isn't working\", \"isn't converting\" or \"isn't selling\", or why results dropped.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "The industry, for a comparison with what brands in that category usually do. There is enough data for apparel, automotive, b2b_saas, beauty_skincare, business_coaching, consumer_tech, dtc_food_bev, dtc_health, fitness_health, home_goods, info_product, investing, marketing_education, otc_pharma, personal_care, personal_development, supplements, weight_loss. Any other category still works, just without the comparison.",
                "maxLength": 60,
                "type": "string"
              },
              "details": {
                "description": "Anything you know: the numbers, what changed recently, the offer and the audience.",
                "maxLength": 2000,
                "type": "string"
              },
              "format": {
                "description": "The kind of copy it is: ad, landing_page, sales_letter for long-form sales copy, email, email_subject, social_post, video_script or headline.",
                "enum": ["ad", "landing_page", "sales_letter", "email", "email_subject", "social_post", "video_script", "headline"],
                "type": "string"
              },
              "persuasion_mode": {
                "default": "balanced",
                "description": "How hard the copy is allowed to push. Balanced is the default, persuasive and sustainable over time. Equity protects long-term trust, so it rules out fear, hype and hard-sell moves. Aggressive is for short-term direct response and allows fear, threat and hard scarcity. In every mode, the claims stay true.",
                "enum": ["aggressive", "balanced", "equity"],
                "type": "string"
              },
              "symptom": {
                "description": "What you can see happening. Use low_click_through when people see it and don't click, high_bounce when they click and leave fast, reads_but_no_action when they read and don't convert, starts_but_abandons when they abandon the checkout or form, leads_dont_buy when signups never buy, buys_once_no_return for refunds, churn and no repeat orders, low_open_rate when emails don't get opened, and opens_no_clicks when they get opened but not clicked.",
                "enum": ["low_click_through", "high_bounce", "reads_but_no_action", "starts_but_abandons", "leads_dont_buy", "buys_once_no_return", "low_open_rate", "opens_no_clicks"],
                "type": "string"
              }
            },
            "required": ["symptom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain why marketing is not converting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
