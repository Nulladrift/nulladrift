        {
          "name": "read_ab_test_result",
          "title": "Read an A/B test result",
          "description": "Read the result of an A/B test. You get each version's conversion rate and lift, whether the difference is statistically significant, the confidence interval, and the chance each version really beats the original. It also warns you about the things that make a test result lie. Those include too few conversions, traffic that didn't split the way it should (a sample ratio mismatch), stopping the moment it looked good, and testing too many versions at once. It answers questions like \"did my test win?\", \"is this significant?\", \"which version won?\" or \"should I keep it running?\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confidence": {
                "default": 0.95,
                "maximum": 0.999,
                "minimum": 0.8,
                "type": "number"
              },
              "intended_split": {
                "description": "How you meant to split the traffic, like [50, 50]. The default is an even split.",
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "number"
                },
                "type": "array"
              },
              "question": {
                "description": "The reader question the versions answered in different ways.",
                "enum": ["DISRUPT", "IDENTIFY", "AGITATE", "REFRAME", "PROVE", "ELEVATE", "RESOLVE", "COMPEL", "BOND"],
                "type": "string"
              },
              "versions": {
                "description": "Each version with its visitors and conversions. Put the original, the control, first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "conversions": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "name": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "visitors": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["conversions", "name", "visitors"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["versions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an A/B test result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2efe28a776dcaaad85854ca3db529b910e55e50bfd1398d2b7748869e55cd68d"
        }
