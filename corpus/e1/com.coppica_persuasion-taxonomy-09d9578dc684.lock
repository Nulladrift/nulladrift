            "readOnly": true
          },
          "digest": "sha256:619b93bd85310a1db0228aed0700538611cbaeb1a4b40d86152cb3e6521f516a"
        },
        {
          "name": "find_persuasion_techniques",
          "title": "Find persuasion techniques",
          "description": "Search the Persuasion Taxonomy, 767 named persuasion techniques documented from real advertising and organized by the nine reader questions they answer. It takes a plain description of what the copy should do, like handle a price objection, make an opening less generic, prove a claim or reframe a problem, and finds the techniques that do it. Each one comes with its name and ID, a one-line definition, a real example, how common it is in a category if you name one, and a link. It answers requests for tactics, angles or a less expected way to make a point.",
          "inputSchema": {
