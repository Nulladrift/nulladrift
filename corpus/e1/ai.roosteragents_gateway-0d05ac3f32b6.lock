      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "rooster-agent-gateway",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Discover and act on verified real-world businesses. Use discover_businesses to search, get_business for full data, and book for the booking action.",
      "tools": [
        {
          "name": "book",
          "description": "Return the verified booking action (ReserveAction target URL + phone) for a business so you can hand your user off to complete a booking. v1 is a booking handoff; payment settlement is a gated roadmap capability.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7c858b883d43898a6ef28f5f03c808f9f725a6f54ca9936d75300e65976564b"
        },
        {
          "name": "discover_businesses",
          "description": "Search the Rooster Agent Gateway directory of verified, bookable real-world businesses. Filter by category, city, service area or minimum rating. Returns matching businesses with their id, category, location, rating, verification status and booking action.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "e.g. Dentist, MedicalBusiness, HVACBusiness, RealEstateAgent",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "min_rating": {
                "type": "number"
              },
              "service_area": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find verified businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d004b84e53e230a6e1b764ab9a22cfccdfe57915d4dbd3a8e71b5f6e4ba9207"
        },
        {
          "name": "get_business",
          "description": "Get one business's full machine-readable profile: schema.org @graph, plain-text agent manifest, services, FAQ and the booking_action (ReserveAction) target.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "business id / slug from discover_businesses",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business detail"
          },
          "behavior": {
