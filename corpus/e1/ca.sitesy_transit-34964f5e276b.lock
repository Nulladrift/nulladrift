{
  "lockfileVersion": 2,
  "subjects": {
    "ca.sitesy/transit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://transit.sitesy.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "regional-transit",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Live TTC and Hamilton HSR data. For paid website, DNS and Canada weather tools, see mcp.sitesy.ca (pay per call in USDC on Base via x402).",
      "tools": [
        {
          "name": "next_departures",
          "description": "Get the next departures for one stop on the TTC or Hamilton HSR. Static schedule candidates from the persistent schedule store are merged with GTFS Realtime trip updates (BusTime for the TTC, the City of Hamilton feed for HSR), and realtime entries replace matching scheduled entries. TTC and HSR stop ids can collide: pass agency to say which agency the stop belongs to. Without agency, a stop id that exists in both agencies returns an error naming both matches instead of guessing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency the stop belongs to: ttc or hsr. Required when the stop id exists in both agencies.",
                "enum": ["ttc", "hsr"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum departures to return",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "stop_id": {
                "description": "A stop_id from search_stops. A parent station includes its child stops.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stop_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b3bc0e65188b391363fb885f3e5024a931dbbcd2c19aff1beb7b900c17a4b601"
        },
        {
          "name": "route_vehicles",
          "description": "Get live vehicle positions for one route from the agency GTFS Realtime vehicle positions feed. Pass agency to resolve the route inside one agency. Without agency the TTC is tried first and HSR second, so a route name that exists in both returns the TTC vehicles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency the route belongs to: ttc or hsr",
                "enum": ["ttc", "hsr"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum vehicles to return",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "route": {
                "description": "A route_id, short name, or long name, for example 501, King, or 1",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["route"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c4b7b82035b81af1ec0864a7bdcf2870e710a5418dfab8132c172b472f400d75"
        },
        {
          "name": "search_stops",
          "description": "Find transit stops and stations by stop number, stop code, or name from the static GTFS feeds. Searches both the TTC and Hamilton HSR by default and merges the results; pass agency to search one agency only. Every result carries an agency field (TTC or HSR).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency filter: ttc or hsr. Omit to search both agencies.",
                "enum": ["ttc", "hsr"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A stop number or part of a stop or station name, for example Union Station or Hamilton GO Centre",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7939df41fc51fe93815b0e404c952215e639da60911d5b5a53e26752eb1f6ef4"
        },
        {
          "name": "service_alerts",
          "description": "Get currently active service alerts. Defaults to the TTC, optionally filtered by mode to subway, bus, streetcar, or accessibility alerts; the mode filter applies to TTC alerts only. Pass agency hsr for Hamilton HSR alerts, or agency all for both agencies combined.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency selector: ttc (default), hsr, or all for both agencies combined",
                "enum": ["ttc", "hsr", "all"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum alerts to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Optional TTC alert mode filter",
                "enum": ["subway", "bus", "streetcar", "accessibility"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cc7ff892280c48a40c0285a75db15e2fd20fbcfeb785b227cc176a9b8f3ba3c6"
        }
      ],
      "digest": "sha256:edf07fc3639baf47689ae81fc5f3afffb74b09837d03c586111b718d6a9b0d24"
    }
  }
}
