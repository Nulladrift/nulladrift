{
  "lockfileVersion": 2,
  "subjects": {
    "ca.sitesy/transit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://transit.sitesy.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "regional-transit",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "next_departures",
          "description": "Get the next departures for one stop on the TTC, Hamilton HSR or GO Transit, including UP Express stations. Static schedule candidates from the persistent schedule store are merged with GTFS Realtime trip updates (BusTime for the TTC, the City of Hamilton feed for HSR, the Metrolinx Open Data API for GO and UP Express), and realtime entries replace matching scheduled entries. Stop ids can collide between agencies: pass agency to say which agency the stop belongs to. Without agency, a stop id that exists in more than one agency returns an error naming every match instead of guessing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency the stop belongs to: ttc, hsr or go. Required when the stop id exists in more than one agency.",
                "enum": ["ttc", "hsr", "go"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum departures to return",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "stop_id": {
                "description": "A stop_id from search_stops. A parent station includes its child stops.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stop_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:847b0d2796530100af8d9cca15a42eec592e0cfb0236488d8ed63ee2429ea34a"
        },
        {
          "name": "route_vehicles",
          "description": "Get live vehicle positions for one route from the agency GTFS Realtime vehicle positions feed. Pass agency to resolve the route inside one agency. For GO Transit the route can be a line short name or long name such as LW or Lakeshore West, a bus route number such as 41, or UP for UP Express trains. Without agency the TTC is tried first, then HSR, then GO Transit, so a route name that exists in more than one agency returns the first match in that order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency the route belongs to: ttc, hsr or go",
                "enum": ["ttc", "hsr", "go"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum vehicles to return",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "route": {
                "description": "A route_id, short name, or long name, for example 501, King, or 1",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["route"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad56586ee99aeaf7bd1f9b85067fe2310a209d89b72d04b469fd1d55f7de95d8"
        },
        {
          "name": "search_stops",
          "description": "Find transit stops and stations by stop number, stop code, or name from the static GTFS feeds. Searches the TTC, Hamilton HSR and GO Transit by default and merges the results; pass agency to search one agency only. Every result carries an agency field (TTC, HSR or GO). GO Transit results include the UP Express stations Union Station, Bloor, Weston and Pearson Airport.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency filter: ttc, hsr or go. Omit to search all three agencies.",
                "enum": ["ttc", "hsr", "go"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A stop number or part of a stop or station name, for example Union Station or Hamilton GO Centre",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:38a5623f8b70b7821b1092b42c4650de093e52807d1e3da3f947e7dfbf96f52e"
        },
        {
          "name": "service_alerts",
          "description": "Get currently active service alerts. Defaults to the TTC, optionally filtered by mode to subway, bus, streetcar, or accessibility alerts; the mode filter applies to TTC alerts only. Pass agency hsr for Hamilton HSR alerts, agency go for GO Transit and UP Express alerts, or agency all for every agency combined.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agency": {
                "description": "Optional agency selector: ttc (default), hsr, go, or all for every agency combined",
                "enum": ["ttc", "hsr", "go", "all"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum alerts to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Optional TTC alert mode filter",
                "enum": ["subway", "bus", "streetcar", "accessibility"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1084ac8261ed273f86f506509880ec0230b3fc09f47e088ff3ba09cb1d2abb26"
        }
      ],
      "digest": "sha256:bc484893af8e9e1e0469616610f7a70c71b2cc06a13a98c080b40e5686339e8a"
    }
  }
}
