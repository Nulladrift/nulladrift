        {
          "name": "search_boats",
          "title": "Search Boats",
          "description": "Search listed boats, optionally filtered by harbor, type, minimum capacity, and max hourly price, with sorting and pagination.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "harbor": {
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "minCapacity": {
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "name",
                "enum": ["price_asc", "price_desc", "capacity", "name"],
