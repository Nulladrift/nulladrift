        {
          "name": "get_quote",
          "title": "Get Quote",
          "description": "Get a non-binding price quote (in cents) for a charter or rental. Provide exactly one of captainSlug or boatId, plus durationId and partySize. Pass `date` (YYYY-MM-DD) whenever you know it: the rate then comes from the operator's rate card for that day — weekday vs weekend vs holiday, including any per-date price the operator set — so the quote matches what checkout charges. Without a date, pass pricingTierId instead; the quote then reflects that tier and may differ from checkout for the actual day. Optionally pass a partnerCode to preview a discount. Returns currency, totalCents, depositCents, balanceCents, pricingModel, instantBook, and (when a code is given) a discountPreview. instantBook says what booking does: true → create_booking / create_boat_rental return a Stripe Checkout link; false → the operator reviews every request first, so booking sends them a request instead (nothing is charged until they accept, and partnerCode can't be used — the quote then prices no discount and its discountPreview says PARTNER_CODE_NOT_AVAILABLE_FOR_REQUESTS).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boatId": {
                "minLength": 1,
                "type": "string"
              },
              "captainSlug": {
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "durationId": {
                "minLength": 1,
                "type": "string"
              },
              "partnerCode": {
                "minLength": 1,
                "type": "string"
              },
              "partySize": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "pricingTierId": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["durationId", "partySize"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad7d9903ffceeda23b7f250881517b4e370bf8f86b5dd177ad3774c223f97752"
        },
