      "tools": [
        {
          "name": "check_availability",
          "title": "Check Availability",
          "description": "Check a captain's or boat's availability. Provide exactly one of captainSlug or boatId. Omit date to get available dates for the next 90 days; provide both date (YYYY-MM-DD) and durationHours to get bookable time slots for that date. Only departures that have not yet left (Chicago time) are listed, so a past date has no slots. Each slot lists its offeredDurations, and every entry carries the durationId to pass to get_quote, create_booking, or create_boat_rental (null means that length is offered but not bookable through the API). A captain trip that lists harborIds departs only from those harbors (ids as in get_captain's harbors): create_booking refuses any other harbor for that trip. Without harborIds, drive time rules out none of the captain's active harbors.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boatId": {
                "minLength": 1,
                "type": "string"
              },
              "captainSlug": {
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "durationHours": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a96d8d2e5e94fa48d20ddab7566586447aac2f8bb23c0b3ec59f044de3c43e34"
        },
        {
          "name": "create_boat_rental",
          "title": "Create Boat Rental",
          "description": "Book a bareboat boat rental. A boat with Instant Book on returns a Stripe Checkout link (payment.kind checkout_link) for the charterer to complete payment. For a boat whose owner reviews every request first (get_quote's instantBook: false), a request is sent instead: nothing is charged, the result is a request with the estimated total and deposit, and if the owner accepts, the charterer is emailed a link to pay. Requires captainChoiceRightAcknowledged: true (the charterer affirms their right to choose their own captain). Optionally attach a partner/affiliate code; partnerCode can't be used on a request (PARTNER_CODE_NOT_AVAILABLE_FOR_REQUESTS).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "boatId": {
                "minLength": 1,
                "type": "string"
              },
              "captainChoiceRightAcknowledged": {
                "const": true,
                "type": "boolean"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "durationId": {
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstName": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "lastName": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "partnerCode": {
                "type": "string"
              },
              "partySize": {
                "maximum": 13,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "pricingTierId": {
                "minLength": 1,
                "type": "string"
              },
              "specialRequests": {
                "maxLength": 500,
                "type": "string"
              },
              "startTime": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["boatId", "captainChoiceRightAcknowledged", "date", "durationId", "email", "firstName", "lastName", "partySize", "phone", "pricingTierId", "startTime"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c19370477f056ce9ef247ba107652d0693c8601add10d1c87e5af64bcd060fcb"
        },
        {
          "name": "create_booking",
          "title": "Create Booking",
          "description": "Book a charter with a captain. A captain with Instant Book on returns a Stripe Checkout link (payment.kind checkout_link) for the charterer to complete payment. A captain who reviews every request first (get_quote's instantBook: false) is sent a request instead: nothing is charged, the result is a request with the estimated total and deposit, and if the captain accepts, the charterer is emailed a link to pay. Optionally attach a partner/affiliate code to credit a referrer; partnerCode can't be used on a request (PARTNER_CODE_NOT_AVAILABLE_FOR_REQUESTS). harborId must be a harbor this captain departs from: one of get_captain's harbors, or any list_harbors harbor when get_captain lists none. create_booking refuses any other harbor with HARBOR_NOT_OFFERED, and that error's harbors field lists the ones the captain departs from.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "captainSlug": {
                "minLength": 1,
                "type": "string"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "durationId": {
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstName": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "harborId": {
                "minLength": 1,
                "type": "string"
              },
              "lastName": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "partnerCode": {
                "type": "string"
              },
              "partySize": {
                "maximum": 13,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "pricingTierId": {
                "minLength": 1,
                "type": "string"
              },
              "specialRequests": {
                "maxLength": 500,
                "type": "string"
              },
              "startTime": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["captainSlug", "date", "durationId", "email", "firstName", "harborId", "lastName", "partySize", "phone", "pricingTierId", "startTime"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:88e508553cd08061eef9a5674d32d3e85a575422b1714d1f9a86b445b04b75bc"
        },
