            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dir": {
                "description": "Optional direction (north, south, east, west) if not in the stretch name",
                "enum": ["north", "south", "east", "west"],
                "type": "string"
              },
              "stretch": {
                "description": "The stretch by road and direction (e.g. \"SR 520 east\", \"I-90 west\") or stretch id (e.g. \"sr520-03\")",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["stretch"],
            "type": "object"
          },
          "annotations": {
