        {
          "name": "story",
          "title": "Story along the road",
          "description": "Use this when someone asks for a story about a place, landmark, or town along Washington's highways, or asks to hear what Sal knows about a specific location or story by id. Gives Sal's story, place and stretch, running time, and Wikipedia / source credit; Sal is WithBy's AI-generated narrator voice. Not for navigation, bookings, or places outside Washington.",
