              {
                "scopes": ["account"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://withby/next-drive-list.html"
            }
          },
          "digest": "sha256:34ca5442d00ffc2e80fa63ee27f373f184b1bfddc6f4fb78470210d79631fe75"
        },
        {
          "name": "pass_status",
          "title": "Pass status",
          "description": "Use this when someone asks whether a mountain pass or the I-90 or SR 520 floating bridge is open, what the restrictions or chain rules are, or how long the crossing takes. Answers for Snoqualmie, Stevens, White and Blewett passes with WithBy's verdict for each direction and the crossing time against the usual, for the two bridges with their crossing times and alerts, and for 12 other passes with WSDOT's words. Covers Washington's mountain passes in depth, and the passes on the roads out of it, in their agency's words. Every answer carries the time WithBy checked and the agency's own report time. Not for navigation or bookings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "pass": {
                "description": "The pass or bridge by name, e.g. \"Snoqualmie Pass\", \"Stevens\" or \"SR 520 bridge\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pass"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Pass status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://withby/pass.html",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["account"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://withby/pass.html"
            }
          },
          "digest": "sha256:3c77de6679987de23dee648f265db75ce19e7eb980a2c3bb9542f9dfdf845556"
        },
        {
          "name": "passes_now",
          "title": "Mountain passes now",
          "description": "Use this when someone asks about mountain passes in general, which passes are open, or wants the whole list: Washington's mountain passes in depth, and the passes on the roads out of it. Gives WithBy's verdict for Snoqualmie, Stevens, White and Blewett passes in one line each, then 12 other passes in WSDOT's words, seasonal closures marked, then the passes on the way out, each in its agency's words, with the time WithBy checked. Not for navigation or bookings.",
          "inputSchema": {
            "properties": {},
            "type": "object"
