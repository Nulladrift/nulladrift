      "serverInfo": {
        "name": "ai.withby/withby",
        "title": "WithBy",
        "version": "1.0.1",
        "description": "Washington's mountain-pass conditions, checked every few minutes, and hundreds of short stories about the places along the road, told by Sal, WithBy's AI-generated narrator voice.",
        "websiteUrl": "https://withby.ai"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use WithBy when someone asks whether a Washington mountain pass or floating bridge is open right now, or asks for a story about a place along Washington's highways.\n\nPasses: WithBy checks WSDOT every few minutes and gives its own verdict for each direction of Snoqualmie, Stevens, White and Blewett passes (open, chains or closed, with the time it checked), and WSDOT's own words for 12 other passes. `pass_status` answers for one pass or for the I-90 or SR 520 floating bridge, `passes_now` for all the passes.\n\nStories: Sal, WithBy's AI-generated narrator voice, has hundreds of short stories about towns, landmarks and stretches of road, each with its text and credit. `story` answers for a named place or story, `stories_near` for a town or landmark, `stretch_stories` for a highway or stretch such as I-90 east.\n\n`save_for_drive` adds stories to the person's next-drive list and `my_next_drive` reads it back; both need their WithBy account, and the host asks them to connect.\n\nWithBy covers Washington's highways and says so when asked about anywhere else. It does not navigate or book.",
      "tools": [
        {
          "name": "my_next_drive",
          "title": "My next-drive list",
          "description": "Use this when someone asks which stories they saved for their next drive, or what Sal will tell first. Lists their WithBy next-drive list in road order with each story's length. Needs their WithBy account. Not for navigation or bookings.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "My next-drive list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://withby/next-drive-list.html",
