              },
              "erp_code": {
                "maxLength": 40,
                "type": ["string", "null"]
              },
              "mailboxes": {
                "description": "The Microsoft 365 or Google mailboxes its keys may act as; null for every mailbox the connection lists.",
                "items": {
                  "maxLength": 254,
