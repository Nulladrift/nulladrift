                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "stages": {
                "description": "All the stages, in order. Keep a stage (and its deals) by giving its id or its current name. Won and Lost are added when no stage has those outcomes; open stages without a probability get one spread evenly.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "maximum": 9007199254740992,
                      "minimum": 1,
                      "type": "integer"
