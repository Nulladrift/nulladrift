                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["name"],
            "type": "object"
