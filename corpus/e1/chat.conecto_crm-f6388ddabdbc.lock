        {
          "name": "crm_timeline",
          "title": "Read a timeline",
          "description": "Everything that happened with a contact, a company (all its people) or a deal, or in the whole CRM when you name none of them, newest first: notes, tasks, emails from your inboxes, website chats, phone calls (with their summary), tickets, meetings, deal stage moves and deal notes, each with its contact_id where it has one. Each says who made it: `by` is the name of the key whose bot did (like \"Ben, through Claude\"), a person, a form or an import, or null; `via` is \"dashboard\" when a person made it on a dashboard link the key made, \"ai_app\" when the key's AI app did. Read it before you write to someone. For the next page pass next_before as `before`. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "before": {
                "description": "ISO 8601: only entries before this time.",
