        {
          "name": "crm_save_segment",
          "title": "Save a segment",
          "description": "Save filters under a name, such as \"customers renewing within 30 days\" (a new name creates a segment, an existing one replaces its filters). Use it with the segment argument of crm_find_contacts, crm_find_companies, crm_find_deals and crm_export. Relative dates (today+30) are worked out each time. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filters": {
                "description": "Conditions that must all match, e.g. [{\"field\": \"lifecycle_stage\", \"op\": \"eq\", \"value\": \"customer\"}, {\"field\": \"renewal_date\", \"op\": \"lte\", \"value\": \"today+30\"}]. field: a standard field, \"tag\", or a custom field key (crm_list_fields lists them all). op: eq, ne, contains, starts_with, in (value is a list), gt, gte, lt, lte, is_empty, is_set. Dates take YYYY-MM-DD or today, today+N, today-N.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "op": {
                      "enum": ["contains", "eq", "gt", "gte", "in", "is_empty", "is_set", "lt", "lte", "ne", "starts_with"],
                      "type": "string"
                    },
                    "value": {
                      "description": "Text, a number, true/false, a date, or a list for \"in\"."
                    }
                  },
                  "required": ["field", "op"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "object": {
                "enum": ["contact", "company", "deal"],
                "type": "string"
              },
              "sort": {
                "description": "Default sort, e.g. \"-amount\".",
                "maxLength": 61,
                "type": "string"
              }
            },
            "required": ["filters", "name", "object"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save a segment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
