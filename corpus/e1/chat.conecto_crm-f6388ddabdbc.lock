                "type": "object"
              },
              "deal_id": {
                "maximum": 9007199254740992,
                "minimum": 1,
                "type": "integer"
              },
              "description": {
                "maxLength": 20000,
                "type": "string"
              },
              "lost_reason": {
                "maxLength": 500,
                "type": "string"
              },
              "next_step": {
                "maxLength": 500,
                "type": "string"
              },
              "pipeline": {
                "description": "Pipeline name or id (crm_list_pipelines). Default: the deal's own, else the first pipeline.",
                "maxLength": 80,
                "type": "string"
              },
              "stage": {
                "description": "Stage name or id in that pipeline, e.g. \"Proposal\". A new deal without one starts at the first stage. crm_move_deal moves deals too.",
                "maxLength": 60,
                "type": "string"
