                "minimum": 1,
                "type": "integer"
              },
              "currency": {
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "custom_fields": {
                "additionalProperties": {
                  "maxLength": 1000,
                  "type": ["string", "number", "boolean", "null"]
                },
                "description": "Custom fields as {\"key\": value}, merged into the existing ones; null clears one. Keys defined with crm_define_field are checked against their type.",
