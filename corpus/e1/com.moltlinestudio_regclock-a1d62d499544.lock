          "digest": "sha256:2b4a2bf3465dd614dedfd419dfb3df1c6028dd3e3e094af8f1f5bee9868125a0"
        },
        {
          "name": "validate_report",
          "title": "Validate Report",
          "description": "Check a draft report against the statutory content list and its deadline. PREMIUM (license).\n\nTypical input {\"regime\": \"eu_gdpr\", \"obligation\":\n\"supervisory_authority_notification\", \"report\": {\"nature\": \"...\",\n\"contact\": \"...\", \"consequences\": \"...\", \"measures\": \"...\"}} returns\n{\"checklist\": [{\"item\": \"...\", \"found\": true, \"evidence\": [...]}, ...],\n\"missing\": [...], \"coverage\": 0.75, \"timing\": {...}}. The content check is\na keyword heuristic over the report text, reported as such; the timing\ncheck compares submitted_at with due_at and, for GDPR, flags a late\nnotification that gives no reasons for the delay. Use before a report is\nsent. Not a legal review, and it cannot judge quality, only presence. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown obligation '<value>' for <value>/<value>; one of <value>\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "due_at": {
                "default": "",
                "description": "the computed due instant (from compute_deadlines), optional.",
                "type": "string"
              },
              "event_type": {
                "default": "",
                "description": "event type within the regime; optional when the regime has one.",
                "type": "string"
              },
              "obligation": {
                "description": "obligation id (for example incident_notification).",
                "type": "string"
              },
              "regime": {
                "description": "regime id from list_regimes.",
                "type": "string"
              },
              "report": {
                "additionalProperties": true,
                "description": "the draft, as an object of section name -> text (any keys).",
                "type": "object"
              },
              "submitted_at": {
                "default": "",
                "description": "when the report was or will be submitted, optional.",
                "type": "string"
              }
            },
            "required": ["obligation", "regime", "report"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate Report"
          },
