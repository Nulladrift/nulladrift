      "instructions": "Incident-reporting deadlines over MCP (CRA, NIS2, DORA, GDPR, HIPAA, SEC 8-K). Free: list_regimes, explain_rule, classify_event, compute_deadlines, deadline_status, holiday_calendar. Premium (license): compute_deadlines_multi, validate_report, timeline_export. Cited arithmetic; not legal advice.",
      "tools": [
        {
          "name": "classify_event",
          "title": "Classify Event",
          "description": "Apply a regime's statutory criteria to yes/no facts and name the event type. FREE.\n\nTypical input {\"regime\": \"eu_dora\", \"facts\": {\"critical_services_affected\":\ntrue, \"duration_or_downtime\": true, \"geographic_spread\": true}} returns\n{\"reportable\": true, \"event_type\": \"major_ict_incident\", \"reasoning\":\n[...], \"criteria\": {...}}. Unanswered questions are listed under \"missing\"\nso the caller can go and find out. Use when deciding whether an incident\ntriggers a regime at all. Not for judging severity in the abstract: it\nonly applies the written criteria to the facts given. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"facts must be an object of question id -> answer\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facts": {
                "additionalProperties": true,
                "description": "answers keyed by the question ids returned for the regime (booleans; integers for counts).",
                "type": "object"
              },
              "regime": {
                "description": "regime id from list_regimes.",
                "type": "string"
              }
            },
            "required": ["facts", "regime"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Classify Event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3cda1be3a422914285bd92be0727807065cea216e6f2a3df58b949856d7ca0e7"
        },
        {
          "name": "compute_deadlines",
          "title": "Compute Deadlines",
          "description": "Compute every reporting deadline of one regime from the moment of awareness. FREE.\n\nTypical input {\"regime\": \"eu_nis2\", \"event_type\": \"significant_incident\",\n\"awareness_at\": \"2026-09-14T09:30:00+02:00\"} returns {\"deadlines\":\n[{\"obligation\": \"early_warning\", \"due_at\": \"2026-09-15T09:30+02:00\",\n\"citation\": \"Art. 23(4)(a)\", ...}, ...]}. Later clocks that run from an\nearlier submission are estimated from that report's due time until you\npass the actual time in submitted. DORA needs classification_at and a\ncountry for the bank-holiday rule; the SEC needs\nmateriality_determined_at; HIPAA takes discovery_date and\nflags.individuals_affected. Use when an incident has just been\nidentified and the agent needs the instants. Not for several regimes at\nonce: use compute_deadlines_multi. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"flags must be an object\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "awareness_at": {
                "description": "when the entity became aware, ISO 8601 with a UTC offset.",
                "type": "string"
              },
              "classification_at": {
                "default": "",
                "description": "DORA - when the incident was classified as major.",
                "type": "string"
              },
              "country": {
                "default": "",
                "description": "ISO 3166-1 alpha-2 code for the public-holiday calendar (DORA weekend rule; SEC uses US).",
                "type": "string"
              },
              "discovery_date": {
                "default": "",
                "description": "HIPAA - the date the breach is treated as discovered (defaults to awareness date).",
                "type": "string"
              },
              "entity_class": {
                "default": "",
                "description": "e.g. trust_service_provider (NIS2), credit_institution / central_counterparty / trading_venue_operator / nis2_essential_or_important (DORA), business_associate (HIPAA).",
                "type": "string"
              },
              "event_type": {
                "default": "",
                "description": "event type within the regime; optional when the regime has one.",
                "type": "string"
              },
              "flags": {
                "additionalProperties": true,
                "default": {},
                "description": "condition answers: high_risk, processor, ongoing, handled_at, individuals_affected, max_residents_of_one_state, business_associate.",
                "type": "object"
              },
              "materiality_determined_at": {
                "default": "",
                "description": "SEC - when the incident was determined to be material.",
                "type": "string"
              },
              "measure_available_at": {
                "default": "",
                "description": "CRA - when a corrective or mitigating measure became available.",
                "type": "string"
              },
              "regime": {
                "description": "regime id from list_regimes.",
                "type": "string"
              },
              "subdiv": {
                "default": "",
                "description": "optional subdivision code for the holiday calendar (e.g. BY for Bavaria).",
                "type": "string"
              },
              "submitted": {
                "additionalProperties": true,
                "default": {},
                "description": "actual submission times of earlier reports, e.g. {\"initial_notification\": \"...\"}.",
                "type": "object"
              }
            },
            "required": ["awareness_at", "regime"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compute Deadlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3ebb27c2f72dacc842710582518e7c57bdd89d25a04d9eeff55206f3a3718f2f"
        },
        {
          "name": "compute_deadlines_multi",
          "title": "Compute Deadlines Multi",
          "description": "One merged timeline across several regimes for the same incident. PREMIUM (license).\n\nTypical input {\"regimes\": [{\"regime\": \"eu_nis2\"}, {\"regime\": \"eu_gdpr\"},\n{\"regime\": \"eu_dora\", \"entity_class\": \"credit_institution\"}],\n\"awareness_at\": \"2026-09-14T09:30:00+02:00\", \"country\": \"DE\"} returns\n{\"timeline\": [rows sorted by due_at, each tagged with regime], \"first_due\":\n{...}, \"per_regime\": {...}}. Each entry may carry its own event_type and\nentity_class; the anchors and flags are shared. Use when one incident\ntriggers several regimes and the agent needs a single ordered list. Not\nfor one regime: compute_deadlines is free. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"regimes must be a non-empty list of <value>\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "awareness_at": {
                "description": "when the entity became aware, ISO 8601 with a UTC offset.",
                "type": "string"
              },
              "classification_at": {
                "default": "",
                "description": "DORA classification instant.",
                "type": "string"
              },
              "country": {
                "default": "",
                "description": "ISO 3166-1 alpha-2 code for the public-holiday calendar.",
                "type": "string"
              },
              "discovery_date": {
                "default": "",
                "description": "HIPAA discovery date (defaults to the awareness date).",
                "type": "string"
              },
              "entity_class": {
                "default": "",
                "description": "default entity class for entries that do not set their own.",
                "type": "string"
              },
              "flags": {
                "additionalProperties": true,
                "default": {},
                "description": "condition answers shared by all regimes (see compute_deadlines).",
                "type": "object"
              },
              "materiality_determined_at": {
                "default": "",
                "description": "SEC materiality determination instant.",
                "type": "string"
              },
              "measure_available_at": {
                "default": "",
                "description": "CRA corrective-measure instant.",
                "type": "string"
              },
              "regimes": {
                "description": "list of {\"regime\": id, \"event_type\"?: ..., \"entity_class\"?: ...} (1-10 entries).",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "subdiv": {
                "default": "",
                "description": "optional subdivision code for the holiday calendar.",
                "type": "string"
              },
              "submitted": {
                "additionalProperties": true,
                "default": {},
                "description": "actual submission times keyed by \"regime/obligation\" or obligation id.",
                "type": "object"
              }
            },
            "required": ["awareness_at", "regimes"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compute Deadlines Multi"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ca02dc01c990167420d8a1f7e069f1a8f25e2beb87edd934d00b017934df27a5"
        },
        {
          "name": "deadline_status",
          "title": "Deadline Status",
          "description": "Mark each computed deadline open, due soon, overdue or submitted as of now. FREE.\n\nTypical input {\"deadlines\": <rows from compute_deadlines>, \"now\":\n\"2026-09-15T08:00:00+02:00\"} returns {\"items\": [{\"obligation\":\n\"early_warning\", \"status\": \"due_soon\", \"hours_remaining\": 1.5, ...}],\n\"overdue\": 0, \"next_due\": {...}}. Use when polling an incident timeline\nor deciding what to escalate next. Not for computing the deadlines\nthemselves. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"deadlines must be a non-empty list of rows from compute_deadlines\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deadlines": {
                "description": "rows from compute_deadlines / compute_deadlines_multi (each with obligation and due_at).",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "now": {
                "description": "the current instant, ISO 8601 with a UTC offset.",
                "type": "string"
              },
              "submitted": {
                "additionalProperties": true,
                "default": {},
                "description": "actual submission times keyed by obligation id (or \"regime/obligation\").",
                "type": "object"
              }
            },
            "required": ["deadlines", "now"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Deadline Status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:d144d28c61990c1eaeb0b393adbef785aa3b996ab68ae9249873822f37f90185"
        },
        {
          "name": "explain_rule",
          "title": "Explain Rule",
          "description": "Quote the time limit, citation and required content for an obligation. FREE.\n\nTypical input {\"regime\": \"eu_cra\", \"event_type\": \"severe_incident\",\n\"obligation\": \"final_report\"} returns {\"citation\": \"Art. 14(4)(c)\",\n\"rule\": \"within one month after ...\", \"required_content\": [...]}. Leave\nobligation empty to get every obligation of the event type; leave\nevent_type empty on single-event regimes. Use when a caller needs the\nrule's own words next to a computed date. Not for computing dates: use\ncompute_deadlines. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"unknown obligation '<value>' for <value>/<value>; one of <value>\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event_type": {
                "default": "",
                "description": "event type within the regime (see list_regimes); optional when the regime has one.",
                "type": "string"
              },
              "obligation": {
                "default": "",
                "description": "obligation id (for example early_warning); empty for all.",
                "type": "string"
              },
              "regime": {
                "description": "regime id from list_regimes (eu_cra, eu_nis2, eu_dora, eu_gdpr, uk_gdpr, us_hipaa, us_sec_8k).",
                "type": "string"
              }
            },
            "required": ["regime"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain Rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:09b076b523a32bc86936b360111af8ab2661d714eef510be48764d096c820582"
        },
        {
          "name": "holiday_calendar",
          "title": "Holiday Calendar",
          "description": "List the public holidays the engine uses for a country and year. FREE.\n\nTypical input {\"country\": \"IE\", \"year\": 2026} returns {\"holidays\":\n[{\"date\": \"2026-01-01\", \"name\": \"New Year's Day\"}, ...]}. Use when\nchecking why a business-day or bank-holiday adjustment landed where it\ndid, or to see whether a country/subdivision is supported. Not a legal\nregister of bank holidays: it is the `holidays` package's public-holiday\ncalendar, which is what compute_deadlines uses. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"country is required\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code (DE, FR, IE, US, ...).",
                "type": "string"
              },
              "subdiv": {
                "default": "",
                "description": "optional subdivision code (state, province, region).",
                "type": "string"
              },
              "year": {
                "description": "calendar year.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              }
            },
            "required": ["country", "year"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Holiday Calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
