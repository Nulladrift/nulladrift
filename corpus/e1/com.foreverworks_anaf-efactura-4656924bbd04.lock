        {
          "name": "invoice_pdf",
          "title": "Render an invoice as ANAF's PDF",
          "description": "Have ANAF render an invoice as its official PDF, attached to the answer as a file (this server keeps no copy). Give the UBL document as the XML text as xml, which the server hashes (answered in file: size, sha256). The document is validated first unless validate is false, and when it fails nothing is returned and findings say why. Returns saved, name, bytes, sha256 and md5 of the PDF, and the PDF itself attached. The PDF itself needs no grant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "validate": {
                "default": true,
                "description": "For a document only: validate before converting.",
                "type": "boolean"
              },
              "xml": {
                "description": "A UBL invoice or credit note, as the XML text itself (at most 1048576 characters). The server hashes the bytes it receives and answers their sha256 and size (file), so compare them with your source.",
                "maxLength": 1048576,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:c0b77b2e8967ec04a1085bcf2888f4959577232f05d0a167fa99251a06461c96"
        },
        {
          "name": "lookup_company",
          "title": "Look up Romanian companies",
          "description": "Look up companies in ANAF's public VAT registry by CIF: name, trade register number, registered office, CAEN code, and the statuses an invoice depends on (vatPayer with its current period, vatOnCollection, splitVat, inactive, and eFacturaRegistry for the RO e-Factura registry). notFound lists the CIFs ANAF does not know. A status ANAF did not report is absent, not false. Needs no grant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cifs": {
                "description": "1 to 100 CIFs, with or without the RO prefix.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "date": {
                "default": "",
                "description": "YYYY-MM-DD: the statuses as they stood that day. Empty means today in Bucharest.",
                "type": "string"
              }
            },
            "required": ["cifs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
