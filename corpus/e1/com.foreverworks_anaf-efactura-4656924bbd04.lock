        },
        {
          "name": "parse_invoice",
          "title": "Read an invoice as JSON",
          "description": "Read a UBL invoice or credit note into plain JSON: seller and buyer (names, VAT and legal ids, address, contact), every line (quantity, unit, price, net amount, VAT category and rate), the VAT breakdown, the totals, and the payment terms (due date, terms, IBAN). Every value is the document's own text, amounts included, never a number; a field the document does not fill is absent. Give the XML text as xml, which the server hashes (answered in file: size, sha256). Reads only: nothing goes to ANAF. To have ANAF check the document, use validate_invoice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "xml": {
                "description": "A UBL invoice or credit note, as the XML text itself (at most 1048576 characters). The server hashes the bytes it receives and answers their sha256 and size (file), so compare them with your source.",
                "maxLength": 1048576,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "archive": {
                "additionalProperties": false,
                "description": "The archive read, when it came from the outbox",
                "properties": {
                  "bytes": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "path": {
                    "type": "string"
                  },
                  "sha256": {
                    "type": "string"
                  }
                },
                "required": ["bytes", "path", "sha256"],
                "type": "object"
              },
              "file": {
                "additionalProperties": false,
                "description": "The file read, when the document came as xml",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "path": {
                    "type": "string"
                  },
                  "sha256": {
                    "type": "string"
                  },
                  "size": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["name", "sha256", "size"],
                "type": "object"
              },
              "invoice": {
                "additionalProperties": false,
                "properties": {
                  "accountingCost": {
                    "type": "string"
                  },
                  "allowancesCharges": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "type": "string"
                        },
                        "baseAmount": {
                          "type": "string"
                        },
                        "charge": {
                          "type": "boolean"
                        },
                        "percent": {
                          "type": "string"
                        },
                        "reason": {
                          "type": "string"
                        },
                        "reasonCode": {
                          "type": "string"
                        },
                        "vatCategory": {
                          "type": "string"
                        },
                        "vatPercent": {
                          "type": "string"
                        }
