      },
      "serverInfo": {
        "name": "anaf-efactura",
        "title": "ANAF e-Factura",
        "version": "0.1.2",
        "websiteUrl": "https://foreverworks.github.io/mcps/servers/anaf-efactura/",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ANAF's public e-Factura services, with no sign-in and no company behind them: look up companies in the VAT registry (lookup_company), build a CIUS-RO invoice from fields (build_invoice), have ANAF validate one (validate_invoice) or render its PDF (invoice_pdf), read one as JSON (parse_invoice) and check ANAF's seal on one (verify_signature). Start with health, which says whether ANAF's public services answer. Nothing is filed with ANAF, no company's own invoices can be read, and a file a tool makes comes back attached to the answer, not saved anywhere. For filing and a company's invoices, a person runs this server themselves with their own ANAF grant.",
      "tools": [
        {
          "name": "build_invoice",
          "title": "Build a CIUS-RO invoice",
          "description": "Write a Romanian e-Factura invoice (UBL 2.1, CIUS-RO) from fields: seller and buyer, lines with their net price, quantity and VAT category, the currency, the payment terms. Totals are computed exactly (each line rounded to 2 decimals, VAT once per category and rate), and the draft is checked first: CIF, CNP and IBAN check digits, the county and Bucharest sector, the VAT rules per category, CIUS-RO's lengths, every problem named at once. The XML is attached to the answer as a file, with its sha256 and the totals in the answer; this server keeps no copy. Nothing is sent to ANAF. An invoice in another currency needs vat_exchange_rate (RON per unit), so its VAT is stated in RON too.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "description": "The buyer.",
                "properties": {
                  "address": {
                    "description": "The party's postal address.",
                    "properties": {
                      "additional_street": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "city": {
                        "description": "In Bucharest, the sector: \"Sector 3\" is written SECTOR3.",
                        "maxLength": 50,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "default": "RO",
                        "description": "ISO 3166-1 alpha-2, RO by default.",
                        "type": "string"
                      },
                      "county": {
                        "description": "For a Romanian address, required: the county code, CJ or RO-CJ; B for Bucharest.",
                        "type": "string"
                      },
                      "postal_code": {
                        "maxLength": 20,
                        "minLength": 1,
                        "type": "string"
                      },
                      "street": {
                        "description": "Street and number.",
                        "maxLength": 150,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["city", "street"],
                    "type": "object"
                  },
                  "company_id": {
                    "description": "A buyer that is not a VAT payer: its CUI (checked); a person: the CNP, or 0000000000000 when not given.",
                    "type": "string"
                  },
                  "contact": {
                    "properties": {
                      "email": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "phone": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "name": {
                    "description": "The registered name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "trading_name": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "vat_id": {
                    "description": "The VAT id: RO and the CIF for a Romanian VAT payer (checked by its control digit), or a foreign VAT id.",
                    "type": "string"
                  }
                },
                "required": ["address", "name"],
                "type": "object"
              },
              "buyer_reference": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "contract_reference": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "default": "RON",
                "description": "ISO 4217, RON by default.",
                "type": "string"
              },
              "delivery_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "due_date": {
                "description": "When payment is due; an amount due needs this or payment terms.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "file_name": {
                "default": "",
                "description": "The file's name, in the outbox or as attached to the answer; by default the invoice number's.",
                "type": "string"
              },
              "invoice_period": {
                "properties": {
                  "end": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "start": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "issue_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lines": {
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "What was sold.",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "price": {
                      "description": "The NET price per unit, in the invoice's currency.",
                      "pattern": "^\\d{1,15}(\\.\\d{1,8})?$",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Negative on a line that reverses an earlier invoice.",
                      "pattern": "^-?\\d{1,15}(\\.\\d{1,8})?$",
                      "type": "string"
                    },
                    "seller_item_id": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "unit_code": {
                      "default": "H87",
                      "description": "UN/ECE Rec. 20: H87 piece (default), C62 one, HUR hour, DAY, MON month, KGM kilogram.",
                      "type": "string"
                    },
                    "vat_category": {
                      "default": "S",
                      "description": "S standard (default), Z zero rated, E exempt, AE reverse charge, G export outside the EU, O outside the scope of VAT.",
                      "enum": ["S", "Z", "E", "AE", "G", "O"],
                      "type": "string"
                    },
                    "vat_percent": {
                      "default": "0",
                      "description": "The VAT rate for S (21, 11); 0 for every other category.",
                      "pattern": "^\\d{1,15}(\\.\\d{1,8})?$",
                      "type": "string"
                    }
                  },
                  "required": ["name", "price", "quantity"],
                  "type": "object"
                },
                "maxItems": 999,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "default": [],
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "number": {
                "description": "The invoice number, series included; it must contain a digit.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "order_reference": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "payment": {
                "properties": {
                  "account_name": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "bic": {
                    "maxLength": 11,
                    "minLength": 1,
                    "type": "string"
                  },
                  "iban": {
                    "description": "The account to pay into, checked by its check digits.",
                    "type": "string"
                  },
                  "means_code": {
                    "description": "UNTDID 4461: 30 credit transfer (the default with an iban), 42 to a bank account, 10 cash, 48 card.",
                    "type": "string"
                  },
                  "payment_id": {
                    "description": "The reference the payer quotes.",
                    "maxLength": 140,
                    "minLength": 1,
                    "type": "string"
                  },
                  "terms": {
                    "description": "The payment terms in words.",
                    "maxLength": 300,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "preceding_invoice": {
                "description": "The invoice this one corrects or reverses.",
                "properties": {
                  "issue_date": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "number": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["number"],
                "type": "object"
              },
              "seller": {
                "description": "The seller: your company.",
                "properties": {
                  "address": {
                    "description": "The party's postal address.",
                    "properties": {
                      "additional_street": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "city": {
                        "description": "In Bucharest, the sector: \"Sector 3\" is written SECTOR3.",
                        "maxLength": 50,
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "default": "RO",
                        "description": "ISO 3166-1 alpha-2, RO by default.",
                        "type": "string"
                      },
                      "county": {
                        "description": "For a Romanian address, required: the county code, CJ or RO-CJ; B for Bucharest.",
                        "type": "string"
                      },
                      "postal_code": {
                        "maxLength": 20,
                        "minLength": 1,
                        "type": "string"
                      },
                      "street": {
                        "description": "Street and number.",
                        "maxLength": 150,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["city", "street"],
                    "type": "object"
                  },
                  "company_id": {
                    "description": "The trade register number (J99/1234/2020) or EUID.",
                    "type": "string"
                  },
                  "contact": {
                    "properties": {
                      "email": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "phone": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "legal_form": {
                    "description": "Share capital and the like, e.g. \"Capital social 200 RON\".",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "description": "The registered name.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "trading_name": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "vat_id": {
                    "description": "The VAT id: RO and the CIF for a Romanian VAT payer (checked by its control digit), or a foreign VAT id.",
                    "type": "string"
                  }
                },
                "required": ["address", "name"],
                "type": "object"
              },
              "type_code": {
                "default": "380",
                "description": "380 invoice (default), 384 corrected, 389 self-billed, 751 for accounting.",
                "enum": ["380", "384", "389", "751"],
                "type": "string"
              },
              "vat_exchange_rate": {
                "description": "For an invoice not in RON, required: RON for one unit of its currency (bnr's rate); the VAT is then also stated in RON.",
                "pattern": "^\\d{1,15}(\\.\\d{1,8})?$",
                "type": "string"
              },
              "vat_exemptions": {
                "default": [],
                "description": "Why a category carries no VAT: required for E (a VATEX-EU code or the law's words); AE, G and O default to VATEX-EU-AE, -G, -O.",
                "items": {
                  "properties": {
                    "category": {
                      "enum": ["S", "Z", "E", "AE", "G", "O"],
                      "type": "string"
                    },
                    "code": {
                      "maxLength": 30,
                      "minLength": 1,
                      "type": "string"
                    },
                    "reason": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["category"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["buyer", "issue_date", "lines", "number", "seller"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "extern": {
                "const": true,
                "description": "The buyer is not Romanian: upload it with extern: true",
                "type": "boolean"
              },
              "inline": {
                "const": true,
                "description": "The file is attached to the answer, not saved anywhere",
                "type": "boolean"
              },
              "invoice": {
                "additionalProperties": false,
                "description": "The file read back the way upload_invoice reads it for its confirmation line",
                "properties": {
                  "accounts": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "buyer": {
                    "additionalProperties": false,
                    "properties": {
                      "cif": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "document": {
                    "enum": ["invoice", "credit note"],
                    "type": "string"
                  },
                  "issueDate": {
                    "type": "string"
                  },
                  "number": {
                    "type": "string"
                  },
                  "payable": {
                    "type": "string"
                  },
                  "seller": {
                    "additionalProperties": false,
                    "properties": {
                      "cif": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "syntax": {
                    "enum": ["UBL", "CII"],
                    "type": "string"
                  }
                },
                "required": ["accounts", "buyer", "document", "seller", "syntax"],
                "type": "object"
              },
              "name": {
                "description": "The attached file's name",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "path": {
                "description": "The built file in the outbox: give it to validate_invoice and upload_invoice as xml: { path }. Absent when the file is attached to the answer instead",
                "type": "string"
              },
              "sha256": {
                "type": "string"
              },
              "totals": {
                "additionalProperties": false,
                "properties": {
                  "breakdown": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "type": "string"
                        },
                        "percent": {
                          "type": "string"
                        },
                        "tax": {
                          "type": "string"
                        },
                        "taxable": {
                          "type": "string"
                        }
                      },
                      "required": ["category", "percent", "tax", "taxable"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "lines": {
                    "type": "string"
                  },
                  "payable": {
                    "type": "string"
                  },
                  "vat": {
                    "type": "string"
                  },
                  "vatInRon": {
                    "type": "string"
                  }
                },
                "required": ["breakdown", "currency", "lines", "payable", "vat"],
                "type": "object"
              }
            },
            "required": ["bytes", "invoice", "sha256", "totals"],
            "type": "object"
          },
