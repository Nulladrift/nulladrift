        {
          "name": "validate_invoice",
          "title": "Validate an invoice with ANAF",
          "description": "Check a UBL invoice or credit note against ANAF's own schema and CIUS-RO rules without filing it. Answers valid, and when not, findings: each with the rule it broke (e.g. BR-RO-001), where in the document, and ANAF's text. invoice is what the XML says it is, and file which file was read (name, size, sha256). Needs no grant. CII is not accepted: ANAF validates UBL only. The document goes as the XML text as xml, which the server hashes (answered in file: size, sha256).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "xml": {
                "description": "The invoice XML (at most 5 MB), as the XML text itself (at most 1048576 characters). The server hashes the bytes it receives and answers their sha256 and size (file), so compare them with your source.",
                "maxLength": 1048576,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["xml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "foreverworks.com/access": "read"
          },
          "digest": "sha256:39f3e42b1b8556797bcf67e920e83ebcca37040e1058e12162cfcf9e91fc9468"
        },
        {
          "name": "verify_signature",
          "title": "Verify ANAF's seal on an invoice",
          "description": "Check that an invoice is the file ANAF stored, under ANAF's seal (semnatura_*.xml). Give the two files from an archive kept elsewhere (costs nothing): xml and signature, each the XML text of each, read byte for byte, since the seal covers the invoice's exact bytes (text you retype may differ from the file; the sha256 of what arrived is in source, to compare with the file's). Checked locally first: the certificate against Trans Sped's seal CA and the Ministry of Finance, the signature, and the digest of the invoice's raw bytes. Only when that cannot decide is ANAF asked. Answers valid, checkedBy (local or anaf), a reason when not valid, and the certificate. Revocation is not checked locally.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "signature": {
                "description": "The semnatura_*.xml from the same archive, as the XML text itself (at most 1048576 characters). The server hashes the bytes it receives and answers their sha256 and size (file), so compare them with your source.",
                "maxLength": 1048576,
                "minLength": 1,
                "type": "string"
              },
              "xml": {
                "description": "The invoice XML from the archive, as the XML text itself (at most 1048576 characters). The server hashes the bytes it receives and answers their sha256 and size (file), so compare them with your source.",
                "maxLength": 1048576,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["signature", "xml"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
