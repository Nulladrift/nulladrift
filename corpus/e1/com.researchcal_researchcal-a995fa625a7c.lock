{
  "lockfileVersion": 2,
  "subjects": {
    "com.researchcal/researchcal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.researchcal.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ResearchCal",
        "title": "ResearchCal",
        "version": "",
        "websiteUrl": "https://researchcal.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ResearchCal lists academic conferences, workshops, calls for papers and submission deadlines across research fields, such as economics, business and political science; list_calendars gives the current fields. Each event has an official source URL and a ResearchCal page. Public calendar feeds (ICS) can be added to Google Calendar, Apple Calendar or Outlook.",
      "tools": [
        {
          "name": "fetch",
          "title": "Get event details",
          "description": "Get the public facts of one event by its id from search: dates, location, public deadlines, official and source URLs, and the public calendar feeds that contain it.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Event id from search.",
                "pattern": "^[-a-zA-Z0-9_]{1,120}$",
                "title": "Id",
                "type": "string"
              }
            },
            "required": ["id"],
            "title": "fetchArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CalendarLink": {
                "properties": {
                  "calendar_id": {
                    "title": "Calendar Id",
                    "type": "string"
                  },
                  "category_key": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Category key, or null for the top calendar of the field.",
                    "title": "Category Key"
                  },
                  "field": {
                    "title": "Field",
                    "type": "string"
                  },
                  "label": {
                    "title": "Label",
                    "type": "string"
                  },
                  "url": {
                    "description": "ICS feed URL (https).",
                    "title": "Url",
                    "type": "string"
                  },
                  "webcal_url": {
                    "description": "ICS feed URL for one-click subscribe.",
                    "title": "Webcal Url",
                    "type": "string"
                  }
                },
                "required": ["calendar_id", "category_key", "field", "label", "url", "webcal_url"],
                "title": "CalendarLink",
                "type": "object"
              },
              "DeadlineInfo": {
                "properties": {
                  "date": {
                    "description": "ISO date, or empty when not announced.",
                    "title": "Date",
                    "type": "string"
                  },
                  "deadline_type": {
                    "description": "full_paper, extended_abstract, abstract, panel_proposal, call_for_works, application, registration, notification (a decision date), or empty when not yet typed.",
                    "title": "Deadline Type",
                    "type": "string"
                  },
                  "kind": {
                    "description": "cfp or deadline.",
                    "title": "Kind",
                    "type": "string"
                  },
                  "label": {
                    "title": "Label",
                    "type": "string"
                  },
                  "open_call": {
                    "description": "True when the deadline is open and asks for a submission or an application. Registration, decision and untyped deadlines are never open calls.",
                    "title": "Open Call",
                    "type": "boolean"
                  },
                  "status": {
                    "description": "open, announced, tentative or closed.",
                    "title": "Status",
                    "type": "string"
                  },
                  "time": {
                    "description": "Local time (HH:MM), or empty.",
                    "title": "Time",
                    "type": "string"
                  },
                  "timezone": {
                    "title": "Timezone",
                    "type": "string"
                  },
                  "url": {
                    "description": "Source page of this deadline.",
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["date", "deadline_type", "kind", "label", "open_call", "status", "time", "timezone", "url"],
                "title": "DeadlineInfo",
                "type": "object"
              },
              "DetailFact": {
                "properties": {
                  "kind": {
                    "description": "Eligibility: career_stage, membership, affiliation, group, region, nomination or unpublished_only. Submission: format, length, method, document or template.",
                    "title": "Kind",
                    "type": "string"
                  },
                  "text": {
                    "title": "Text",
                    "type": "string"
                  },
                  "url": {
                    "description": "Official page that states it.",
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["kind", "text", "url"],
                "title": "DetailFact",
                "type": "object"
              },
              "EventMetadata": {
                "properties": {
                  "calendars": {
                    "description": "Public calendar feeds that contain this event.",
                    "items": {
                      "$ref": "#/$defs/CalendarLink"
                    },
                    "title": "Calendars",
                    "type": "array"
                  },
                  "categories": {
                    "items": {
                      "type": "string"
                    },
                    "title": "Categories",
                    "type": "array"
                  },
                  "deadlines": {
                    "items": {
                      "$ref": "#/$defs/DeadlineInfo"
                    },
                    "title": "Deadlines",
                    "type": "array"
                  },
                  "eligibility": {
                    "description": "Each restriction on who may submit, with its source.",
                    "items": {
                      "$ref": "#/$defs/DetailFact"
                    },
                    "title": "Eligibility",
                    "type": "array"
                  },
                  "end_date": {
                    "title": "End Date",
                    "type": "string"
                  },
                  "event_type": {
                    "title": "Event Type",
                    "type": "string"
                  },
                  "location": {
                    "title": "Location",
                    "type": "string"
                  },
                  "official_url": {
                    "title": "Official Url",
                    "type": "string"
                  },
                  "series_name": {
                    "title": "Series Name",
                    "type": "string"
                  },
                  "series_url": {
                    "title": "Series Url",
                    "type": "string"
                  },
                  "source_urls": {
                    "items": {
                      "type": "string"
                    },
                    "title": "Source Urls",
                    "type": "array"
                  },
                  "start_date": {
                    "title": "Start Date",
                    "type": "string"
                  },
                  "submission": {
                    "description": "How to submit: format, length, method, documents, template.",
                    "items": {
                      "$ref": "#/$defs/DetailFact"
                    },
                    "title": "Submission",
                    "type": "array"
                  },
                  "submission_checked_on": {
                    "description": "Date (ISO) of the check of how to submit, or empty.",
                    "title": "Submission Checked On",
                    "type": "string"
                  },
                  "submission_ready": {
                    "description": "True when the deadline, its type, the submission method and who may submit are all checked.",
                    "title": "Submission Ready",
                    "type": "boolean"
                  },
                  "who_may_submit": {
                    "description": "Who may submit, for example 'PhD students only' or 'Open to everyone'; empty when not checked.",
                    "title": "Who May Submit",
                    "type": "string"
                  }
                },
                "required": ["calendars", "categories", "deadlines", "eligibility", "end_date", "event_type", "location", "official_url", "series_name", "series_url", "source_urls", "start_date", "submission", "submission_checked_on", "submission_ready", "who_may_submit"],
                "title": "EventMetadata",
                "type": "object"
              }
            },
            "properties": {
              "id": {
                "title": "Id",
                "type": "string"
              },
              "metadata": {
                "$ref": "#/$defs/EventMetadata"
              },
              "text": {
                "description": "Plain-text summary of the event facts.",
                "title": "Text",
                "type": "string"
              },
              "title": {
                "title": "Title",
                "type": "string"
              },
              "url": {
                "description": "ResearchCal event page.",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "title": "FetchResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2a908944bdea0ee0fe48eacc5270712cbc4a0d344b440914fecb225bf92500f"
        },
        {
          "name": "list_calendars",
          "title": "List public calendars",
          "description": "List the public ResearchCal calendar feeds (ICS) with their subscribe URLs, optionally for one research field.",
          "inputSchema": {
            "properties": {
              "field": {
                "anyOf": [
                  {
                    "pattern": "^[-a-z_]{1,40}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Research field key, for example economics, business or political_science. list_calendars gives the current fields.",
                "title": "Field"
              }
            },
            "title": "list_calendarsArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "CalendarLink": {
                "properties": {
                  "calendar_id": {
                    "title": "Calendar Id",
                    "type": "string"
                  },
                  "category_key": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Category key, or null for the top calendar of the field.",
                    "title": "Category Key"
                  },
                  "field": {
                    "title": "Field",
                    "type": "string"
                  },
                  "label": {
                    "title": "Label",
                    "type": "string"
                  },
                  "url": {
                    "description": "ICS feed URL (https).",
                    "title": "Url",
                    "type": "string"
                  },
                  "webcal_url": {
                    "description": "ICS feed URL for one-click subscribe.",
                    "title": "Webcal Url",
                    "type": "string"
                  }
                },
                "required": ["calendar_id", "category_key", "field", "label", "url", "webcal_url"],
                "title": "CalendarLink",
                "type": "object"
              }
            },
            "properties": {
              "calendars": {
                "items": {
                  "$ref": "#/$defs/CalendarLink"
                },
                "title": "Calendars",
                "type": "array"
              },
              "hub_url": {
                "description": "ResearchCal page with all calendars.",
                "title": "Hub Url",
                "type": "string"
              }
            },
            "required": ["calendars", "hub_url"],
            "title": "CalendarList",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:178280834ef5bfba60a5404250a099df1239ce5274dc4aeb1e15ac9aec05fbac"
        },
        {
          "name": "list_upcoming_deadlines",
          "title": "List upcoming deadlines",
          "description": "List the upcoming public deadlines (open and announced) in date order, with their type. open_call is true only for open submission and application calls; registration and decision dates are listed with their type and are never open calls. Set open_calls_only to list open calls only. Filter by research field, category key, and date range. Returns at most 20 deadlines per call; use next_offset for the next page.",
          "inputSchema": {
            "properties": {
              "after": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First deadline date (YYYY-MM-DD). Default: today.",
                "title": "After"
              },
              "before": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last deadline date (YYYY-MM-DD).",
                "title": "Before"
              },
              "category": {
                "anyOf": [
                  {
                    "pattern": "^[a-z0-9_]{1,40}:[-A-Za-z0-9_.]{1,80}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Category key, for example 'economics:macroeconomics', 'finance:asset-pricing' or 'political_science:political-theory'. Use list_calendars to see keys.",
                "title": "Category"
              },
              "field": {
                "anyOf": [
                  {
                    "pattern": "^[-a-z_]{1,40}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Research field key, for example economics, business or political_science. list_calendars gives the current fields.",
                "title": "Field"
              },
              "limit": {
                "default": 10,
                "description": "Rows per page.",
                "maximum": 20,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "open_calls_only": {
                "default": false,
                "description": "List open submission and application calls only.",
                "title": "Open Calls Only",
                "type": "boolean"
              }
            },
            "title": "list_upcoming_deadlinesArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "DeadlineItem": {
                "properties": {
                  "date": {
                    "title": "Date",
                    "type": "string"
                  },
                  "deadline_type": {
                    "description": "full_paper, extended_abstract, abstract, panel_proposal, call_for_works, application, registration, notification (a decision date), or empty when not yet typed.",
                    "title": "Deadline Type",
                    "type": "string"
                  },
                  "event_dates": {
                    "title": "Event Dates",
                    "type": "string"
                  },
                  "event_id": {
                    "title": "Event Id",
                    "type": "string"
                  },
                  "event_title": {
                    "title": "Event Title",
                    "type": "string"
                  },
                  "event_url": {
                    "description": "ResearchCal event page.",
                    "title": "Event Url",
                    "type": "string"
                  },
                  "label": {
                    "title": "Label",
                    "type": "string"
                  },
                  "open_call": {
                    "description": "True when the deadline is open and asks for a submission or an application. Registration, decision and untyped deadlines are never open calls.",
                    "title": "Open Call",
                    "type": "boolean"
                  },
                  "source_url": {
                    "description": "Source page of this deadline.",
                    "title": "Source Url",
                    "type": "string"
                  },
                  "status": {
                    "title": "Status",
                    "type": "string"
                  },
                  "time": {
                    "title": "Time",
                    "type": "string"
                  },
                  "timezone": {
                    "title": "Timezone",
                    "type": "string"
                  }
                },
                "required": ["date", "deadline_type", "event_dates", "event_id", "event_title", "event_url", "label", "open_call", "source_url", "status", "time", "timezone"],
                "title": "DeadlineItem",
                "type": "object"
              }
            },
            "properties": {
              "deadlines": {
                "items": {
                  "$ref": "#/$defs/DeadlineItem"
                },
                "title": "Deadlines",
                "type": "array"
              },
              "next_offset": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Offset of the next page, or null on the last page.",
                "title": "Next Offset"
              },
              "total": {
                "description": "Number of matching deadlines.",
                "title": "Total",
                "type": "integer"
              }
            },
            "required": ["deadlines", "next_offset", "total"],
            "title": "DeadlineList",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aaa16a51e9182a7cc5d4cf222ea487c5e6cd7a7a733e9c0a6ecb7625ece94191"
        },
        {
          "name": "search",
          "title": "Search conferences",
          "description": "Search upcoming academic conferences, workshops and calls for papers by words in the title, organizer, location or topic. Returns at most 10 events with their ResearchCal page and official source URL.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Search words, for example 'macroeconomics Europe'.",
                "maxLength": 200,
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "SearchHit": {
                "properties": {
                  "cfp_deadline": {
                    "description": "Next public call deadline (ISO date).",
                    "title": "Cfp Deadline",
                    "type": "string"
                  },
                  "dates": {
                    "description": "Event dates as text, or empty.",
                    "title": "Dates",
                    "type": "string"
                  },
                  "id": {
                    "description": "Event id. Pass it to fetch for details.",
                    "title": "Id",
                    "type": "string"
                  },
                  "location": {
                    "title": "Location",
                    "type": "string"
                  },
                  "source_url": {
                    "description": "Official event page.",
                    "title": "Source Url",
                    "type": "string"
                  },
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "url": {
                    "description": "ResearchCal event page.",
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["cfp_deadline", "dates", "id", "location", "source_url", "title", "url"],
                "title": "SearchHit",
                "type": "object"
              }
            },
            "properties": {
              "results": {
                "items": {
                  "$ref": "#/$defs/SearchHit"
                },
                "title": "Results",
                "type": "array"
              }
            },
            "required": ["results"],
            "title": "SearchResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59e806e8f07104dbef1e3bcaf5fecc07ba64a46ea3808419e2cad11e2e5d9b45"
        }
      ],
      "digest": "sha256:63d640152e9541b05404aa2e70b71fbfc336388b1b10509deaf77454180855fc"
    }
  }
