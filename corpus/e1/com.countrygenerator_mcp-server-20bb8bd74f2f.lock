        {
          "name": "search_countries",
          "title": "Search countries",
          "description": "List countries by part of a name or capital, by continent, or landlocked only. Returns names, codes and capitals; call get_country for the full facts.",
          "inputSchema": {
            "properties": {
              "landlocked": {
                "description": "Only countries without a coastline.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "The most countries to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, capitals and links.",
                "enum": ["en", "de", "es", "fr", "pt", "ja", "it"],
                "type": "string"
              },
              "query": {
                "description": "Part of a country or capital name.",
                "type": "string"
              },
              "region": {
                "description": "Limit to one continent.",
                "enum": ["Africa", "Americas", "Asia", "Europe", "Oceania"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "countries": {
                "description": "The matches, by name, up to the limit.",
                "items": {
                  "properties": {
                    "capital": {
                      "type": ["string", "null"]
                    },
                    "code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "region": {
                      "type": "string"
                    }
                  },
                  "required": ["capital", "code", "name", "region"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "All matches, also those past the limit.",
                "type": "integer"
              }
            },
            "required": ["countries", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
