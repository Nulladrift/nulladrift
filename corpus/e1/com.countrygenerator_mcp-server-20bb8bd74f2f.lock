{
  "lockfileVersion": 2,
  "subjects": {
    "com.countrygenerator/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://countrygenerator.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Country Generator",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Geography quizzes and country facts from countrygenerator.com, in English, German, Spanish, French, Portuguese, Japanese and Italian.\n\nFor a quiz: call create_quiz, ask the user one question at a time, and send each answer to check_answer with the question's ticket. Never guess or reveal the answer before check_answer: the ticket hides it on purpose. Show an image_url when your client can display images.\n\nShare a play_url once, at the end of a quiz or when the user asks where to play. Do not add it to every message.",
      "tools": [
        {
          "name": "check_answer",
          "title": "Check a quiz answer",
          "description": "Check the user's answer to one create_quiz question. Pass the question's ticket, the user's answer exactly as given (a letter, a name or a code), and the score_ticket from the previous check_answer, if there was one. Returns whether it was correct, the right answer, facts to share in the user's language, and the new score.",
          "inputSchema": {
            "properties": {
              "answer": {
                "description": "The user's answer as given: an option letter, a name, or a code.",
                "type": "string"
              },
              "score_ticket": {
                "description": "The score_ticket from the previous check_answer. Leave out for the first question.",
                "type": "string"
              },
              "ticket": {
                "description": "The ticket of the question being answered.",
                "type": "string"
              }
            },
            "required": ["answer", "ticket"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "description": "Facts to share. A population question has populations and source; the others have country facts.",
                "properties": {
                  "capital": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "neighbours": {
                    "type": "integer"
                  },
                  "populations": {
                    "items": {
                      "properties": {
                        "country": {
                          "type": "string"
                        },
                        "population": {
                          "type": "integer"
                        }
                      },
                      "required": ["country", "population"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "source": {
                    "type": "string"
                  },
                  "subregion": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "correct": {
                "description": "Whether the answer was right.",
                "type": "boolean"
              },
              "correct_answer": {
                "description": "The right answer in the quiz language.",
                "type": "string"
              },
              "game_over": {
                "description": "True after the last life is lost.",
                "type": "boolean"
              },
              "play_url": {
                "description": "A page on the site to play. Share it once.",
                "type": ["string", "null"]
              },
              "score": {
                "description": "The running score.",
                "properties": {
                  "answered": {
                    "type": "integer"
                  },
                  "correct": {
                    "type": "integer"
                  },
                  "lives_left": {
                    "type": "integer"
                  }
                },
                "required": ["answered", "correct", "lives_left"],
                "type": "object"
              },
              "score_ticket": {
                "description": "Send this with the next check_answer.",
                "type": "string"
              }
            },
            "required": ["about", "correct", "correct_answer", "game_over", "score", "score_ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a quiz answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:829af47ea6dc32f71355b6d9a93eb3fd6df50953ad550a07d2ceacae0c31501c"
        },
        {
          "name": "compare_population",
          "title": "Compare populations",
          "description": "Rank 2 to 4 countries by population, largest first, with World Bank 2024 figures.",
          "inputSchema": {
            "properties": {
              "countries": {
                "description": "2 to 4 country names or ISO codes.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, capitals and links.",
                "enum": ["en", "de", "es", "fr", "pt", "ja", "it"],
                "type": "string"
              }
            },
            "required": ["countries"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "play_url": {
                "description": "A page on the site to play. Share it once.",
                "type": ["string", "null"]
              },
              "ranking": {
                "description": "The countries, largest population first.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "population": {
                      "type": ["integer", "null"]
                    },
                    "rank": {
                      "type": "integer"
                    }
                  },
                  "required": ["code", "name", "population", "rank"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "Where the figures come from.",
                "type": "string"
              }
            },
            "required": ["play_url", "ranking", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare populations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1aea5332bd26fbcdb6a7573c8fe43e2699f49ba21e1a18f866e8afda47293749"
        },
        {
          "name": "create_quiz",
          "title": "Create a geography quiz",
          "description": "Create geography quiz questions: guess the country from its flag or outline, pick the capital, pick the most populated country, or name a neighbour. Ask the user one question at a time, then pass the user's answer and the question's ticket to check_answer. Do not guess the answer yourself, and do not reveal it before check_answer.",
          "inputSchema": {
            "properties": {
              "count": {
                "default": 10,
                "description": "How many questions to create.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "difficulty": {
                "default": "medium",
                "description": "easy: well-known countries. hard: lesser-known countries, wrong options from the same area, look-alike flags.",
                "enum": ["easy", "medium", "hard"],
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, capitals and links.",
                "enum": ["en", "de", "es", "fr", "pt", "ja", "it"],
                "type": "string"
              },
              "region": {
                "description": "Limit to one continent.",
                "enum": ["Africa", "Americas", "Asia", "Europe", "Oceania"],
                "type": "string"
              },
              "type": {
                "description": "flag: name the country from its flag. capital: pick the capital. shape: name the country from its outline. population: pick the most populated of four. borders: name a neighbouring country.",
                "enum": ["flag", "capital", "shape", "population", "borders"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "difficulty": {
                "description": "The difficulty that was used.",
                "type": "string"
              },
              "how_to_play": {
                "description": "How to run the quiz with the user.",
                "type": "string"
              },
              "lives": {
                "description": "Wrong answers that end the run.",
                "type": "integer"
              },
              "play_url": {
                "description": "A page on the site to play. Share it once.",
                "type": ["string", "null"]
              },
              "questions": {
                "description": "The questions, in order.",
                "items": {
                  "properties": {
                    "image_url": {
                      "description": "The flag or outline to show, on flag and shape questions.",
                      "type": "string"
                    },
                    "number": {
                      "type": "integer"
                    },
                    "options": {
                      "description": "Empty for a borders question, which is free text.",
                      "items": {
                        "properties": {
                          "letter": {
                            "type": "string"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["letter", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "ticket": {
                      "description": "Send this to check_answer. It hides the answer.",
                      "type": "string"
                    }
                  },
                  "required": ["number", "options", "prompt", "ticket"],
                  "type": "object"
                },
                "type": "array"
              },
              "type": {
                "description": "The quiz type that was asked for.",
                "type": "string"
              }
            },
            "required": ["difficulty", "how_to_play", "lives", "play_url", "questions", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a geography quiz"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db14a7df4056f8384efbb7825fc0fae710f816e908c43095d08efbf77b6fd0a7"
        },
        {
          "name": "get_borders",
          "title": "Neighbouring countries",
          "description": "The countries that share a land border with a country. An island nation returns an empty list.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name in any supported language, or an ISO code.",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, capitals and links.",
                "enum": ["en", "de", "es", "fr", "pt", "ja", "it"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Its two-letter ISO code.",
                "type": "string"
              },
              "country": {
                "description": "The country that was asked for.",
                "type": "string"
              },
              "neighbours": {
                "description": "Empty for an island nation.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "play_url": {
                "description": "A page on the site to play. Share it once.",
                "type": ["string", "null"]
              }
            },
            "required": ["code", "country", "neighbours", "play_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Neighbouring countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f72c82676f7924e907d176ae73b23ae0b5f8b1ab32b82959073164c912dc7a3d"
        },
        {
          "name": "get_country",
          "title": "Country facts",
          "description": "Facts about one country: capital, region, population (World Bank 2024), area, languages, currencies, driving side and neighbours. Accepts a name in English, German, Spanish, French, Portuguese, Japanese or Italian, or an ISO code.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name in any supported language, or an ISO code such as DE or DEU.",
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language for names, capitals and links.",
                "enum": ["en", "de", "es", "fr", "pt", "ja", "it"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "description": "Facts about one country.",
                "properties": {
                  "area_km2": {
                    "type": ["number", "null"]
                  },
                  "borders": {
                    "description": "Names of the neighbouring countries.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "calling_code": {
                    "type": ["string", "null"]
                  },
                  "capital": {
                    "type": ["string", "null"]
                  },
                  "code": {
                    "description": "Two-letter ISO code.",
                    "type": "string"
                  },
                  "currencies": {
                    "description": "ISO currency codes.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "driving_side": {
                    "type": ["string", "null"]
                  },
                  "flag_url": {
                    "type": "string"
                  },
                  "landlocked": {
                    "type": "boolean"
                  },
                  "languages": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "population": {
                    "type": ["integer", "null"]
                  },
                  "population_source": {
                    "description": "Null when the figure is an earlier estimate.",
                    "type": ["string", "null"]
                  },
                  "region": {
                    "type": "string"
                  },
                  "subregion": {
                    "type": "string"
                  }
                },
                "required": ["area_km2", "borders", "calling_code", "capital", "code", "currencies", "driving_side", "flag_url", "landlocked", "languages", "name", "population", "population_source", "region", "subregion"],
                "type": "object"
              },
              "play_url": {
                "description": "A page on the site to play. Share it once.",
                "type": ["string", "null"]
              }
            },
            "required": ["country", "play_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Country facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ef3c14c91fafd72b8084d83b4e21a826fd3fdb2c962c4f0bcb6b47fbc95e034"
        },
