            {
              "name": "region",
              "description": "Africa, Americas, Asia, Europe or Oceania",
              "required": false
            },
            {
              "name": "count",
              "description": "Number of questions, 1 to 20",
              "required": false
            }
          ],
          "digest": "sha256:0d150b2a300cf3a7649c1472476a9377df09901558dbe7f5b383de66dc9c095f"
