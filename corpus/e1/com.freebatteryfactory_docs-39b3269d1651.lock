                        "type": "string"
                      },
                      "type": "array"
                    },
                    "product": {
                      "type": "string"
                    },
                    "section": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["product", "slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
