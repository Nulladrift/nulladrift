      "instructions": "Documentation for The Free Battery Factory’s open-source developer tools — LiteShip (constraint-based adaptive rendering: signals → states → CSS/GLSL/ARIA) and batpak (embedded, sync-first event store for Rust). Start with list_products to see what’s documented, search_docs to find relevant pages, get_doc to read one as Markdown, and get_llms_full for a product’s complete reference. Separately, describe_page_dimensions reports this site’s own adaptive layout regimes — not documentation about LiteShip, but this page rendered by it.",
      "tools": [
        {
          "name": "describe_page_dimensions",
          "title": "Describe the page’s adaptive dimensions",
          "description": "Describe the adaptive dimensions of this site's pages: each named layout regime, the states it can occupy, and the signal and thresholds it is carved from. These are the same boundary definitions that emit the page's @container CSS, so this is the page's real state space rather than a description of it. Read-only — no tool here changes the page. Caveat: each dimension's `current` field is an SSR-time fallback (always the first state), NOT the requesting browser's live state — this manifest is compiled once, server-side, with no viewport to read. HOW to find the live state differs per dimension — some have a `data-czap-state` DOM attribute to read, some do not and must be derived from viewport width against the stated thresholds instead — so read each dimension's own `description` rather than assuming one mechanism for all of them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dimensions": {
                "description": "Dimension name -> { states, current, exclusive, description }. `current` is an SSR fallback (always states[0]), not the live browser state. How to find the real live state is NOT uniform across dimensions — it is a DOM attribute for some, viewport-derived for others — so each dimension's own `description` states which applies to it; do not assume one mechanism for every dimension.",
                "type": "object"
              },
              "systemPrompt": {
                "description": "Rendered prose naming every dimension and its states.",
                "type": "string"
              }
            },
            "required": ["dimensions", "systemPrompt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e86ac16d27001b0646b59772b1dace7517dcd8c2c07fb2c6f5e61eaced6f6e2"
        },
        {
          "name": "get_doc",
          "title": "Read a documentation page",
          "description": "Fetch a single documentation page as Markdown, given a product id and a page slug (both come from list_products / search_docs results, or a doc URL like /liteship/overview). Returns the title, description, a heading outline, and the full Markdown body.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product id from list_products (e.g. \"liteship\", \"batpak\").",
                "type": "string"
              },
              "slug": {
                "description": "Page slug, e.g. \"overview\" or \"factory\" (from search_docs results or the last path segment of a doc URL).",
                "type": "string"
              }
            },
            "required": ["product", "slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00f63fb4baee0e30bcab6482447d806d21d106f278d469ac766582ad617092cc"
        },
        {
          "name": "get_llms_full",
          "title": "Get a product’s full agent reference",
          "description": "Return a link to the complete, source-linked agent reference (llms-full.txt) for a product — its entire prose, API surface, and examples in one document. This file is large, so it is returned as a resource link and canonical URL rather than inlined; use search_docs/get_doc for targeted lookups and this when you want the whole corpus.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product id from list_products.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6e7de664eb22174be45e6aec8d16e048745d9c671be5f81535603239031b66e"
        },
        {
          "name": "list_products",
          "title": "List documented products",
          "description": "List the Free Battery Factory products whose documentation is hosted here, each with a one-line blurb, current docs version, and canonical URLs. Presence here means the docs are published, not that the product is in active development — each blurb states its lifecycle. Call this first to discover the valid `product` ids used by the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "products": {
                "items": {
                  "properties": {
                    "blurb": {
                      "type": "string"
                    },
                    "docsUrl": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "llmsFullUrl": {
                      "type": "string"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["blurb", "docsUrl", "id", "label"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ca5caec49667e334d8d58ca2610eab1e8d08abd4373ac361c10a2e9fd36765b"
        },
        {
          "name": "search_docs",
          "title": "Search the documentation",
          "description": "Full-text search across the product documentation. Returns the best-matching pages with title, description, canonical URL, matched section headings, and a snippet. Omit `product` to search every product at once, or pass one of the ids from list_products to scope it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum results to return (default 8, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "description": "Optional product id from list_products to scope the search. Omit to search all products.",
                "type": "string"
              },
              "query": {
                "description": "Search terms, e.g. \"boundary hysteresis\" or \"deterministic replay\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
