{
  "lockfileVersion": 2,
  "subjects": {
    "co.foreverinourhearts/memorials": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.foreverinourhearts.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "forever-in-our-hearts",
        "title": "Forever In Our Hearts",
        "version": "1.0.0",
        "websiteUrl": "https://foreverinourhearts.co/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public online memorials, death and funeral notices, and partner funeral homes from Forever In Our Hearts (foreverinourhearts.co for the US, UK, Canada, Ireland, New Zealand and other countries; foreverinourhearts.com.au for Australia). Read-only. Only pages the family or funeral home published and allowed in search engines are returned. Link people to the `url` of each result. Families create memorials at https://hub.foreverinourhearts.co.",
      "tools": [
        {
          "name": "get_memorial",
          "title": "Get a memorial",
          "description": "Details of one published memorial: dates, life story (obituary, shortened if long), service details, how many tributes it has, the funeral home and the link. Details the family keeps for QR code visitors are left out.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Memorial id from search_memorials, the memorial's link, or the last part of it (for example \"example\" in /memorials/example)",
                "maxLength": 300,
                "type": "string"
              },
              "region": {
                "description": "\"au\" for Australia (foreverinourhearts.com.au), \"global\" for every other country (foreverinourhearts.co). Omit to search both",
                "enum": ["au", "global"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a memorial"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6979232d7d96b062043c687e5ead4c96eba49afb2bcc72729d69d24c5331feb7"
        },
        {
          "name": "get_notice",
          "title": "Get a funeral notice",
          "description": "Full details of one published funeral notice: every service with its location, livestream link and information, the funeral home, and the memorial page if there is one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Notice id from search_notices, or the notice's link",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a funeral notice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b151b6229487169948cad0f3ee51822728de7cca52feeacc47e1df66e09ccb73"
        },
        {
          "name": "search_funeral_directors",
          "title": "Search funeral directors",
          "description": "Find funeral homes that are Forever In Our Hearts partners, by name, city, state or postcode, or by country. Returns name, logo, address, contact details and the funeral home's notices and memorials site.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Two-letter country code, for example NZ, GB, US, CA, IE or AU",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1 to 25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number, starting at 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Funeral home name, city, state or postcode",
                "maxLength": 100,
                "type": "string"
              },
              "region": {
                "description": "\"au\" for Australia (foreverinourhearts.com.au), \"global\" for every other country (foreverinourhearts.co). Omit to search both",
                "enum": ["au", "global"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search funeral directors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bebce31316b800407ebca5380564782001f850b80ef145e1a2528fe02a13c689"
        },
        {
          "name": "search_memorials",
          "title": "Search memorials",
          "description": "Search published online memorials for people and pets by name. Newest first. Returns dates, the funeral home if there is one, and a link to each memorial.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Results per page, 1 to 25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Name of the person (first name, last name or both)",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "\"au\" for Australia (foreverinourhearts.com.au), \"global\" for every other country (foreverinourhearts.co). Omit to search both",
                "enum": ["au", "global"],
                "type": "string"
              },
              "type": {
                "description": "Memorials for people or for pets. Omit for both",
                "enum": ["person", "pet"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search memorials"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2381d0f320cbe08c4684bcb3985f876923a4a6a87553e8862affbedc0c1f1835"
        },
        {
          "name": "search_notices",
          "title": "Search funeral notices",
          "description": "Search published death and funeral notices by name, service location or funeral home. Newest first. Returns service times and places (local time with the time zone) and a link to each notice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "funeral_home": {
                "description": "Name of the funeral home",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1 to 25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Town, suburb, city or venue of the service",
                "maxLength": 100,
                "type": "string"
              },
              "name": {
                "description": "Name of the person (first name, last name or both)",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "\"au\" for Australia (foreverinourhearts.com.au), \"global\" for every other country (foreverinourhearts.co). Omit to search both",
                "enum": ["au", "global"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search funeral notices"
          },
          "behavior": {
            "destructive": false,
