      "instructions": "IndiaRestros (https://indiarestros.com) is India's open restaurant graph: restaurants, cafes, dhabas, bakeries, bars and sweet\nshops across every state, each with a permanent id IRR-XXXXXXXXXX. Use it to find places to eat, read their phone numbers,\ntimings, cuisines and menus, and to send a correction when something is wrong.\n\nUse it for any question about eating out anywhere in India: \"biryani near Kondapur\", \"veg restaurants open now in\nIndiranagar\", \"a cafe in Goa\", \"where can I get masala dosa under 100 rupees in Bengaluru\", \"the phone number of X\".\n\nHow to use it well:\n- search_restaurants takes free words (name, dish, cuisine) plus a place. Give city as a slug (bengaluru, mumbai, delhi,\n  new-delhi is delhi) and optionally locality (indiranagar, kondapur), or lat/lon with radius_m for \"near me\".\n  \"biryani in kondapur\" also works as q alone. Each hit already has the address, phone, open_now, timings and url, so\n  most answers need no further call; use get_restaurant for the full record and get_menu for prices.\n- For a dish with a price (\"paneer tikka under 300 in Pune\"), use search_dishes first.\n- If a city search returns nothing, try list_places or a nearby bigger city; small towns may have few places.\n- Every field carries its source (src: osm = OpenStreetMap, overture = Overture Maps, owner = the restaurant itself,\n  google/zomato/... = public listings) and the record has scores.confidence (0-1). Say where a fact came from when it\n  matters, e.g. \"the phone number is from OpenStreetMap; it may be out of date\".\n- Word searches list places whose name starts with the words first, then the rest by how well each place is documented;\n  a lat/lon search without words is sorted by distance. Never by payment: no\n  restaurant can buy a position.\n- Ratings: ratings.foodie are IndiaRestros foodie ratings only; ratings.external are other sites' numbers, labelled.\n- Foodies contact restaurants directly by phone/WhatsApp/website. IndiaRestros takes no commission.\n- Always cite the restaurant's url.",
