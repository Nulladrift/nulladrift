        {
          "name": "search_restaurants",
          "title": "Search restaurants in India",
          "description": "Find restaurants, cafes, dhabas, bakeries, bars, sweet shops and delivery kitchens anywhere in India by words and place. Each result has id, name, url, kind, cuisines, address, phone, open_now (IST), timings, cost for two, price_band (1 budget, 2 mid-range, 3 upscale, 4 fine dining), menu_items (null = no menu on file), rating_external (the other-platform rating with the most ratings; ratings_external lists all, weigh by count), photo and distance for near-me searches. An empty result with warning unknown_city / unknown_locality / unknown_cuisine means the slug is wrong, not that there are no places: check list_places.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City slug, e.g. bengaluru, mumbai, delhi, hyderabad, chennai, pune, kolkata",
                "maxLength": 60,
                "type": "string"
              },
              "cuisine": {
                "description": "Cuisine slug: north-indian, south-indian, biryani, chinese, pizza, cafe, desserts, street-food, ...",
                "maxLength": 40,
                "type": "string"
              },
              "diet": {
                "description": "veg (pure vegetarian places) or halal",
                "maxLength": 20,
                "type": "string"
              },
              "kind": {
                "enum": ["restaurant", "cafe", "bakery", "fast-food", "bar", "sweets", "dhaba", "food-court", "cloud-kitchen"],
                "type": "string"
              },
              "lat": {
                "maximum": 37.5,
                "minimum": 6,
                "type": "number"
              },
              "limit": {
                "description": "Default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locality": {
                "description": "Area slug within the city, e.g. indiranagar, koramangala, bandra-west",
                "maxLength": 80,
                "type": "string"
              },
              "lon": {
                "maximum": 98.5,
                "minimum": 67,
                "type": "number"
              },
              "offset": {
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "open_now": {
                "description": "true = only places whose listed timings say open now (IST)",
                "type": "boolean"
              },
              "q": {
                "description": "Name, dish or cuisine words. \"biryani in kondapur\" also works.",
                "maxLength": 200,
                "type": "string"
              },
              "radius_m": {
                "description": "With lat/lon, default 3000",
                "maximum": 25000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "type": "object"
          },
