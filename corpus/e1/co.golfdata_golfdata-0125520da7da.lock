{
  "lockfileVersion": 2,
  "subjects": {
    "co.golfdata/golfdata": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://golfdata.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "golfdataapi",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Golf equipment data: canonical catalog with source-backed specs, stored advertised multi-retailer prices, and dated price history observations. Resolve a product_id with search_products before calling any other tool. Every enriched field carries its source URL via get_product; check enrichment_status before relying on specs. search_products and get_product are keyless at 10 per minute per IP; the other tools are metered at $0.005 per lookup. Pricing: https://golfdata.co/v1/pricing. Every price carries observed_at and expires_at; do not quote after expires_at. To send a shopper to a store, call get_buy_link with the offer source ids and pass its URL on unchanged.\n\nCatalog right now: 21951 products, latest price snapshot 2026-11-27T09:23:22.646877+00:00. Enrichment coverage: {\"flagged\":484,\"enriched\":958,\"partial\":1501,\"unenriched\":18950,\"not_found\":58}.",
      "tools": [
        {
          "name": "compare_prices",
          "title": "Compare stored prices",
          "description": "Dated advertised retailer observations for one product plus min, max and median, and recorded 30 and 90 day lows. Numeric summaries require one known currency across eligible current and historical observations; missing or differing currencies produce null summaries with an explanation, without conversion. Coverage varies; these are not exact-variant verified purchase quotes. Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f11096c5f1cf8e3b3e1a0883ccd500af44c19c72ff58d0cb8ed751dfe8195560"
        },
        {
          "name": "get_buy_link",
          "title": "Issue a tracked buying link",
          "description": "Tracked 27aDay buy link for one marketplace source (source_kind and source_id from get_verified_offer(s), the offer's source ids). Returns a members.27aday.com/go URL carrying a one time ticket issued to your API key; hand it to the shopper unchanged. The link opens the retailer; no purchase or account action happens here. Free with a key. May return 503 when disabled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source_id": {
                "description": "Marketplace source UUID from get_verified_offer(s)",
                "type": "string"
              },
              "source_kind": {
                "enum": ["deal", "product"],
                "type": "string"
              }
            },
            "required": ["source_id", "source_kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:65342e4a9a725949062f4a728dd8dcfd10f952223a2d314d4465d58440b01dbf"
        },
        {
          "name": "get_current_prices",
          "title": "Read stored prices",
          "description": "Latest stored advertised prices for one canonical product, with stock observations and stored affiliate links. These are not exact-variant verified buyable offers; use get_verified_offer when a marketplace source ID is known. Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8eab10817676cfc8cfd61f2bef27407d6c13b471e819bcc1599a85ddb3249141"
        },
        {
          "name": "get_price_history",
          "title": "Read dated price history",
          "description": "Dated price observations per retailer, where available. Coverage and refresh times vary by source. These rows are asking prices, not proof that a discount or stock state is current. Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "1 to 365, default 30",
                "type": "integer"
              },
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f60eb31bb1433a90fbb7437a3b82e6c019d614415e2b4d7fb72230c835a040a4"
        },
        {
          "name": "get_product",
          "title": "Read product facts",
          "description": "One product plus its enrichment_sources provenance rows. Every enriched field carries the source URL, confidence and checked_at it came from. Check enrichment_status before relying on specs: 'enriched' means model, release_year, msrp, description and specs are all sourced; 'partial' means some are missing.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1942268193d7d441b10bced032c5b747cb6483cb6c7e9b1e18b1d9c9801385cf"
        },
        {
          "name": "get_verified_offer",
          "title": "Verify an exact offer",
          "description": "Verify golf-offer.v1 using Chip's admission, exact-variant and live redirect gate. Can contact merchant or affiliate URLs and generate external request traffic; no purchase is performed. Requires a known 27aDay marketplace deal/product source UUID; search_products returns canonical IDs, not these source IDs. Explicit variant_id null means no selectable variant. Returns verified_offer, check_price or unavailable; unknown currency/ratings stay unknown. Deployment may be disabled (503). Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canonical_product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              },
              "source_id": {
                "description": "Known marketplace source UUID, not canonical product UUID",
                "type": "string"
              },
              "source_kind": {
                "enum": ["deal", "product"],
                "type": "string"
              },
              "variant_id": {
                "description": "Exact expected variant UUID or explicit null for nonvariant source",
                "type": ["string", "null"]
              }
            },
            "required": ["canonical_product_id", "source_id", "source_kind", "variant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:216650028f3c59b159ab0712c1755eab507e0c9dee9233e47b7c3c0a023aea31"
        },
        {
          "name": "get_verified_offers",
          "title": "Find verified offers",
          "description": "Discover admitted marketplace sources for a canonical product ID from search_products, then verify each returned offer through Chip's exact-source commerce gate. Can contact merchant or affiliate URLs and generate external request traffic; no purchase or member account action is performed. If variant_id is omitted or null on a variant-bearing product, returns selection_metadata_not_offer options; unsourced specs stay unknown. Supply the exact variant UUID to get offers. Two sources checked per page within a bounded 16-source live window, use next_offset; this is not exhaustive catalog coverage or a stable snapshot. Results retain golf-offer.v1, including check_price and unknown currency. Deployment may be disabled (503). Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canonical_product_id": {
                "description": "Canonical product UUID from search_products",
                "type": "string"
              },
              "offset": {
                "description": "Use response next_offset within the bounded live window; default 0",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "variant_id": {
                "description": "Exact variant UUID; null or omitted requests nonvariant offers or variant selection metadata",
                "type": ["string", "null"]
              }
            },
            "required": ["canonical_product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e32dfee956ba4b82c5cfedde84915137d5fad9f72348000a79b4141c3babee7"
        },
        {
          "name": "search_products",
          "title": "Search golf products",
          "description": "Search the canonical golf equipment catalog by brand, category, or free text. Call this first to resolve a product_id for the other tools. Categories: drivers, iron-sets, wedges, putters, fairway-woods, hybrids, balls, bags, shoes, gloves, apparel, headcovers, complete-sets, accessories, tech, rangefinders, grips.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "brand name, case insensitive",
                "type": "string"
              },
              "category": {
                "description": "one of the categories listed above",
                "type": "string"
              },
              "limit": {
                "description": "1 to 100, default 25",
                "type": "integer"
              },
              "q": {
                "description": "free text matched against the product name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00c701fd881f5863c30fc9e3ea506ff2c2c0e84d16d84eb9ff93ee74a16d21d7"
        }
      ],
      "digest": "sha256:465e2c581cbbe0ca834432b9fa6af441a405efc4facfe062fe8233fa21a854eb"
    }
  }
}
