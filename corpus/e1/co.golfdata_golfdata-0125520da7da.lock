{
  "lockfileVersion": 2,
  "subjects": {
    "co.golfdata/golfdata": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://golfdata.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "golfdataapi",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Golf equipment data: canonical catalog with source-backed specs, stored advertised multi-retailer prices, and dated price history observations. Resolve a product_id with search_products before calling any other tool. Every enriched field carries its source URL via get_product; check enrichment_status before relying on specs. search_products and get_product are keyless at 10 per minute per IP; the other tools are metered at $0.005 per lookup. Pricing: https://golfdata.co/v1/pricing. Every price carries observed_at and expires_at; do not quote after expires_at. To send a shopper to a store, call get_buy_link with the offer source ids and pass its URL on unchanged.\n\nCatalog right now: 21199 products, latest price snapshot 2026-11-12T09:23:22.59526+00:00. Enrichment coverage: {\"flagged\":484,\"enriched\":958,\"partial\":1501,\"unenriched\":18198,\"not_found\":58}.",
      "tools": [
        {
          "name": "compare_prices",
          "description": "Dated advertised retailer observations for one product plus min, max and median, and recorded 30 and 90 day lows. Coverage varies; these are not exact-variant verified purchase quotes. Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d89ef8d36dc256379e8e3879ac9a3d632815d2cf37e85943dd92b9f7f15f02f3"
        },
        {
          "name": "get_buy_link",
          "description": "Tracked 27aDay buy link for one marketplace source (source_kind and source_id from get_verified_offer(s), the offer's source ids). Returns a members.27aday.com/go URL carrying a one time ticket issued to your API key; hand it to the shopper unchanged. The link opens the retailer; no purchase or account action happens here. Free with a key. May return 503 when disabled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source_id": {
                "description": "Marketplace source UUID from get_verified_offer(s)",
                "type": "string"
              },
              "source_kind": {
                "enum": ["deal", "product"],
                "type": "string"
              }
            },
            "required": ["source_id", "source_kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e38ef81418b47f29343e3b5b1df777259bfbae1e1a7def5184658f2d8e138f36"
        },
        {
          "name": "get_current_prices",
          "description": "Latest stored advertised prices for one canonical product, with stock observations and stored affiliate links. These are not exact-variant verified buyable offers; use get_verified_offer when a marketplace source ID is known. Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4515548e1ebe7dd91e3e5d8630816c523502c4e938f4025e977fef787509ff8d"
        },
        {
          "name": "get_price_history",
          "description": "Dated price observations per retailer, where available. Coverage and refresh times vary by source. These rows are asking prices, not proof that a discount or stock state is current. Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "1 to 365, default 30",
                "type": "integer"
              },
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ad707a4a010a682e8e221917a74d88b3aaf176df2d6f20f176ebe1805dc685b"
        },
        {
          "name": "get_product",
          "description": "One product plus its enrichment_sources provenance rows. Every enriched field carries the source URL, confidence and checked_at it came from. Check enrichment_status before relying on specs: 'enriched' means model, release_year, msrp, description and specs are all sourced; 'partial' means some are missing.",
          "inputSchema": {
            "properties": {
              "product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:511deea7896b8ee80a5b532a7896eb1f861ec02a2b09e47cc707d442492f2216"
        },
        {
          "name": "get_verified_offer",
          "description": "Read-only golf-offer.v1 using Chip's admission, exact-variant and live redirect gate. Requires a known 27aDay marketplace deal/product source UUID; search_products returns canonical IDs, not these source IDs. Explicit variant_id null means no selectable variant. Returns verified_offer, check_price or unavailable; unknown currency/ratings stay unknown. No account actions, click attribution or purchase is performed. Deployment may be disabled (503). Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canonical_product_id": {
                "description": "canonical product uuid, from search_products",
                "type": "string"
              },
              "source_id": {
                "description": "Known marketplace source UUID, not canonical product UUID",
                "type": "string"
              },
              "source_kind": {
                "enum": ["deal", "product"],
                "type": "string"
              },
              "variant_id": {
                "description": "Exact expected variant UUID or explicit null for nonvariant source",
                "type": ["string", "null"]
              }
            },
            "required": ["canonical_product_id", "source_id", "source_kind", "variant_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cfb2b50ca110c6b2d8eadb1220d066344b77920616f9ce2c2349e30b45e5e0e"
        },
        {
          "name": "get_verified_offers",
          "description": "Discover admitted marketplace sources for a canonical product ID from search_products, then verify each returned offer through Chip's exact-source commerce gate. If variant_id is omitted or null on a variant-bearing product, returns selection_metadata_not_offer options; unsourced specs stay unknown. Supply the exact variant UUID to get offers. Two sources checked per page within a bounded 16-source live window, use next_offset; this is not exhaustive catalog coverage or a stable snapshot. Results retain golf-offer.v1, including check_price and unknown currency. No member actions or click attribution. Deployment may be disabled (503). Every price carries observed_at and expires_at; do not quote after expires_at.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canonical_product_id": {
                "description": "Canonical product UUID from search_products",
                "type": "string"
              },
              "offset": {
                "description": "Use response next_offset within the bounded live window; default 0",
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              },
              "variant_id": {
                "description": "Exact variant UUID; null or omitted requests nonvariant offers or variant selection metadata",
                "type": ["string", "null"]
              }
            },
            "required": ["canonical_product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d64f50aa3b342d6f15689ed903dec30debfb4277cab77825afea5f775016f334"
        },
        {
          "name": "search_products",
          "description": "Search the canonical golf equipment catalog by brand, category, or free text. Call this first to resolve a product_id for the other tools. Categories: drivers, iron-sets, wedges, putters, fairway-woods, hybrids, balls, bags, shoes, gloves, apparel, headcovers, complete-sets, accessories, tech, rangefinders, grips.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "brand name, case insensitive",
                "type": "string"
              },
              "category": {
                "description": "one of the categories listed above",
                "type": "string"
              },
              "limit": {
                "description": "1 to 100, default 25",
                "type": "integer"
              },
              "q": {
                "description": "free text matched against the product name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41e4f2c59b96895694a338f8db240eb74dd20cc6a02be2f915b82094f7dd4749"
        }
      ],
      "digest": "sha256:b769ad1d7e35618a947203c977fb3d40bf99cced5d9f987429c1ce27467f37cb"
    }
  }
}
