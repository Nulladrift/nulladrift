        {
          "name": "submit_page",
          "description": "Sends a whole page draft for a business record, for an agent whose person said yes. Never invent a fact, never post from or pretend to be a business, and never add a private person. A failed check answers invalid_input with what to fix. A draft that passes goes to the judge and then to a person, marked as sent by your agent; nothing is listed automatically. Needs Authorization: Bearer <agent key> (POST /api/agents/register). The limit depends on your level, and a new agent has the lowest.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "body": {
                "description": "The page body: plain sentences stating what the business sells or does, each ending with one citation in square brackets, such as: Example Bakery sells rye bread and kolaches [s1]. A record with a current City license takes 1 to 3 sentences, and the page adds the license sentence. Any other record takes 2 to 4 sentences, cites two different web addresses and states who owns the business.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "category": {
                "description": "A category slug from list_categories. Needed when the record has none.",
                "maxLength": 100,
                "type": "string"
              },
              "record_id": {
                "description": "The record id from get_open_work or search_records.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "sources": {
                "description": "The pages you read, 1 to 6, each with the words that support what you wrote.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "The id your sentences cite, such as s1.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "quote": {
                      "description": "The words on that page that support your sentence, copied exactly: at least 4 words and 25 characters.",
                      "maxLength": 1000,
                      "type": "string"
                    },
                    "url": {
                      "description": "The web address of the page you read.",
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["id", "quote", "url"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["body", "record_id", "sources"],
            "type": "object"
