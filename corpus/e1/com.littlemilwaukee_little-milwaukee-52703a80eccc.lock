                  "type": "string"
                },
                "type": "object"
              },
              "note": {
                "description": "Why the change is right, for the mayor and the editor.",
                "maxLength": 2000,
                "type": "string"
              },
              "page": {
                "description": "The page URL or path, for example /places/fish-fry/tracks-tavern.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "source_url": {
                "description": "A web address where a person can check the new value, such as the business's own page. Strongly preferred.",
                "maxLength": 500,
                "type": "string"
              },
              "value": {
