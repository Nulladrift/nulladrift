        {
          "name": "search",
          "description": "Searches everything Little Milwaukee knows in one call: listed places, the City of Milwaukee business license records (every licensed business, unreviewed), neighborhoods, categories, collections and Neighborhood Mayor roles. Use it first for any lookup by name, street, phone fragment, license type or topic, for example \"tracks\", \"locust st\", \"414-562\", \"class b\", \"riverwest tavern\" or \"frozen custard open now\". Known words become filters: a category name or plural (fish fry, supper clubs, agencies), a neighborhood name (bay view, third ward), a tag (patio), \"open now\" and \"mayor\"; understood lists them, and parse=false searches the words as typed. Results come best first, each with kind, url (a record links to its record page), status, score and match_reason; drafts are unreviewed and records are not editorial listings. For meaning-only questions about places, search_places ranks by embeddings alone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only this category slug, for example fish-fry; list_categories returns the slugs.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "kinds": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["place", "record", "neighborhood", "category", "collection", "mayor"],
                      "type": "string"
                    },
                    "maxItems": 6,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "pattern": "^(place|record|neighborhood|category|collection|mayor)(,(place|record|neighborhood|category|collection|mayor))*$",
                    "type": "string"
                  }
                ],
                "description": "Only these kinds: place, record, neighborhood, category, collection, mayor."
              },
              "limit": {
                "description": "Most results of each kind, default 10; values above 50 return 50.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "description": "Only this neighborhood slug, for example bay-view; records count within 1500 m of its point.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "open_now": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["true", "false"],
                    "type": "string"
                  }
                ],
                "description": "Only places open at this minute in Milwaukee, from their listed hours."
              },
              "parse": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["true", "false"],
                    "type": "string"
                  }
                ],
                "description": "Default true: known words in the query become filters. false searches the words as typed."
              },
              "query": {
                "description": "What to find, in plain words. May be empty when a filter is given.",
                "maxLength": 500,
                "type": "string"
              },
              "tags": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "pattern": "^[a-z0-9][a-z0-9-]*$",
                      "type": "string"
                    },
                    "maxItems": 10,
                    "minItems": 1,
                    "type": "array"
                  },
                  {
                    "maxLength": 500,
                    "pattern": "^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$",
                    "type": "string"
                  }
                ],
                "description": "Only places that carry every one of these tag slugs, as a list or one comma-separated string, for example patio,live-music. list_tags returns the vocabulary."
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
