            "readOnly": true
          },
          "digest": "sha256:df3174e37db45ccc8f6a735c51178476daeec6997dc3016480e5aac62e3b4854"
        },
        {
          "name": "get_events",
          "description": "Returns listed public events in Milwaukee County from the Little Milwaukee events calendar, the same data as https://littlemilwaukee.com/events. Filter by type, cost, neighborhood or suburb, venue, kid friendly, dates and text. Each event has its page URL, start and end, type and cost each with the source that states it, venue, neighborhood, point, organizer, an .ics file and the source that lists it. Check the time with the source before going.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cost": {
                "description": "free, under-10, 10-to-25, over-25 or unknown (no price listed). By the lowest price.",
                "enum": ["free", "under-10", "10-to-25", "over-25", "unknown"],
                "type": "string"
              },
              "from": {
                "description": "First date, YYYY-MM-DD, Milwaukee time. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kid_friendly": {
                "description": "Only events a source lists for children, and family events.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many events, default 50, at most 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "description": "A neighborhood or suburb slug, for example bay-view or wauwatosa.",
                "maxLength": 80,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "q": {
                "description": "Words in the name, venue, organizer or description.",
                "maxLength": 80,
                "type": "string"
              },
              "to": {
                "description": "Last date, YYYY-MM-DD. Default 30 days after from; at most 92 days after.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "type": {
                "description": "One calendar type.",
                "enum": ["music", "food-and-drink", "family", "arts", "sports", "community-meeting", "market", "outdoors", "education", "faith", "civic", "other"],
                "type": "string"
              },
              "venue": {
                "description": "A venue key: the place page slug, or the venue name as a slug, as the calendar's venue filter writes it.",
                "maxLength": 120,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fca66ce9677757cc3795501a03b978c8dd68448efced3d54e4ac8ef43907a9c2"
        },
        {
          "name": "get_neighborhood",
          "description": "Returns one Milwaukee County neighborhood or suburb by its slug, with its description, municipality, center coordinates, canonical page URL, population and households (Census ACS 5-year, apportioned from block groups), the listed places in it in name order, and its business records: the count and the first 50 by name. Deprecated and unlisted places are left out of places. An unknown slug returns { \"error\": \"not_found\" }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Neighborhood slug, for example bay-view or riverwest. Every place lists its neighborhood slug.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
