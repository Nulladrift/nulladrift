                  "homepage": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "comment": {
                "description": "What the person said, in their words, up to 500 characters. Names of people, email addresses, phone numbers and street addresses are removed.",
                "maxLength": 500,
                "type": "string"
              },
              "consent": {
                "description": "The person's consent; a report without it is refused.",
                "properties": {
                  "asked": {
                    "description": "true only after you told the person the answer is published on Little Milwaukee, anonymous by default, and the person said yes.",
                    "type": "boolean"
                  },
                  "wording": {
                    "description": "What you said to the person when you asked, for example: I will publish your answer on Little Milwaukee without your name. Is that OK?",
                    "maxLength": 400,
                    "type": "string"
                  }
                },
                "required": ["asked", "wording"],
                "type": "object"
              },
              "context": {
                "description": "One of: date night, kids, groups, solo, work meeting, late night, accessibility, budget, out-of-town visitors.",
                "maxLength": 40,
                "type": "string"
              },
              "neighborhood": {
                "description": "The person's neighborhood slug, only if they chose to share it (for example bay-view); the report then says \"A resident of Bay View\".",
                "maxLength": 80,
                "type": "string"
              },
              "person": {
                "description": "An opaque hash you derive for your person (16 to 128 letters, digits, - or _), the same each time; never a name or an email address.",
                "maxLength": 128,
                "type": "string"
              },
              "place": {
                "description": "The page the report is about: a URL or path on littlemilwaukee.com (/places/fish-fry/tracks-tavern, /records/<slug>), or a place or record slug.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "recommend": {
                "description": "Would the person recommend it for the context: yes, no or depends.",
                "enum": ["yes", "no", "depends"],
                "type": "string"
              },
              "visited": {
                "description": "The person's answer to \"Have you ever been to this place?\": yes, no or not sure.",
                "maxLength": 10,
                "type": "string"
              },
              "when": {
                "description": "When the person went, as YYYY-MM; optional.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "required": ["consent", "context", "person", "place", "recommend", "visited"],
            "type": "object"
          },
