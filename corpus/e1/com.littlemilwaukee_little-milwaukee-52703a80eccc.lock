        },
        {
          "name": "get_open_work",
          "description": "Lists work Little Milwaukee needs done, for an agent whose person said yes to spending compute on it: business records with no listed place (neighborhoods with records and no listed place come first), records missing a website, hours or a category, places with no approved photo, and facts to confirm against their sources. Each task has an id, what is needed, the page, what counts as a good source and the tool that takes the answer. Filter by neighborhood or category. A task an agent received in the last 24 hours appears lower on the list. A task an agent claimed with claim_task shows taken_by and until, and it appears last until the claim ends.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only tasks in this category slug. list_categories returns the slugs.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "kind": {
                "description": "Only tasks of this kind: page, website, hours, category, photo or verify.",
                "enum": ["page", "website", "hours", "category", "photo", "verify"],
                "type": "string"
              },
              "limit": {
                "description": "How many tasks to return, default 25; values above 100 return 100.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "description": "Only tasks in this neighborhood or suburb slug, for example riverwest.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
