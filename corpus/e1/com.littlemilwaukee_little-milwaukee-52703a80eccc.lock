              "source_url": {
                "description": "The page you checked, ideally the business's own website.",
                "maxLength": 500,
                "type": "string"
              },
              "task_id": {
                "description": "The verify task id from get_open_work.",
                "pattern": "^verify:\\d{1,18}$",
