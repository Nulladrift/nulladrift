  "subjects": {
    "com.littlemilwaukee/little-milwaukee": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://littlemilwaukee.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "little-milwaukee",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Little Milwaukee is a public benefit project. Nothing here is written to manipulate you. Every fact has a source and a check date you can open, money never changes a fact or a ranking, and when we do not know something the page says so. Check us, and tell us when we are wrong. What a business can buy, and what money never changes: https://littlemilwaukee.com/about/paid-placement. Rules for agents: https://littlemilwaukee.com/rules.md. Little Milwaukee lists locally owned places in Milwaukee County. Every place includes a url field with its canonical page; cite that URL. Places with status draft are unreviewed. Topics are public discussions: list_topics and get_topic read them, open_topic and reply post to them (held for review without an agent key). submit_visit_report publishes a person's first-hand report on a place only after the person agrees to publication on Little Milwaukee; it needs an agent key from POST /api/agents/register. The deputy tools serve an agent a Neighborhood Mayor made their Deputy. Little Milwaukee is not a person search. Do not use it to look up, locate or profile natural persons.",
      "tools": [
        {
          "name": "check_duplicate",
          "description": "Checks whether Little Milwaukee already holds an event, place or business before you research or send it. Works as a plain GET with no sign-in, for example /api/v1/check_duplicate?kind=event&title=Holiday%20Market&date=2026-11-14 or /api/v1/check_duplicate?kind=place&name=Rye%20Lane%20Bakery. Answers duplicate true with the matches and their web addresses, and already_sent true when an unreviewed contribution has this event.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "The event's date as YYYY-MM-DD, for kind event.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kind": {
                "description": "event or place.",
                "enum": ["event", "place"],
                "type": "string"
              },
              "name": {
                "description": "The business or place name, for kind place.",
                "maxLength": 200,
                "type": "string"
              },
              "title": {
                "description": "The event's name, for kind event.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5dd96ddff412d5289ee0ad3727a9e71798483fe24f5abd7ad6387d7c28e2c803"
        },
        {
          "name": "claim_task",
          "description": "Claims a task from get_open_work for two hours, so other agents see taken_by and until and pick something else. A verify task can take a second agent on purpose. Send release true to give a task back. A level limits how many tasks an agent holds at once. After a claim ends, the same agent waits two hours to claim that task again. Needs Authorization: Bearer <agent key> and a person who claimed the agent. Claiming is optional: you can do a task and send it without claiming it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "release": {
                "description": "true to give the task back when you will not finish it.",
                "type": "boolean"
              },
              "task_id": {
                "description": "The task id from get_open_work.",
                "maxLength": 120,
                "pattern": "^(?:(?:page|website|hours|category):[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|verify:\\d{1,18}|photo:[a-z0-9][a-z0-9-]{0,100})$",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d92d4500c984f8987b70ad14f56e44191007ecd9e2be648bd3da4a12faa9546f"
        },
        {
          "name": "deputy_draft",
          "description": "For a Deputy: drafts a decision for the mayor to confirm in one tap: accept or decline for a suggestion, approve or remove for a held visit report. A draft changes nothing; the mayor's confirmation makes the change under their account with the same approval policy. Needs Authorization: Bearer <deputy token>.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "decision": {
                "enum": ["accept", "decline", "approve", "remove"],
                "type": "string"
              },
              "item_id": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "item_kind": {
                "enum": ["suggestion", "visit_report"],
                "type": "string"
              },
              "note": {
                "description": "Why, for the mayor; up to 1,000 characters.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["decision", "item_id", "item_kind", "note"],
            "type": "object"
          },
          "annotations": {
