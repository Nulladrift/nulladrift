{
  "lockfileVersion": 2,
  "subjects": {
    "com.iplover/iplover": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iplover.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "iplover",
        "title": "iplover",
        "version": "1.0.1",
        "websiteUrl": "https://iplover.com/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "iplover answers questions about IP addresses, domains, DNS and web crawlers from public sources (registries, DNS, published IP lists, public blocklists). Results are facts with their source and confidence, not scores: network types can be estimates (see network.confidence and network.evidence), locations of other addresses are the registry country, not a geolocation. Third-party reputation services are given as links only. Limits: 30 calls a minute per tool and 60 a minute for tools that query other servers, per client address.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check a domain's health",
          "description": "A domain report from public data: registrar and expiry (RDAP), hosting and IPv6, email security (MX, SPF, DKIM on common selectors, DMARC, MTA-STS), DNS (name servers, CAA, DNSSEC), the website (HTTP status, HTTPS redirect, security headers) and the TLS certificate (judged from the HTTPS connection; the Certificate Transparency record with issuer and expiry date is in certificate.data.ct when cached, otherwise at certificate.data.ct_url). Each check has a status (good, info, warn, bad, na) and a plain-language explanation; the counts summarize them. Checked once, from one location. The full report is at report_url (/report?domain=<domain> on iplover.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A domain name, e.g. example.com (no scheme or path).",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the human-readable fields (verdict, explanation, labels).",
                "enum": ["en", "it", "de", "es", "fr", "pt"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "counts": {
                "description": "How many checks are good, info, warn, bad and na (could not check).",
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "mail_servers": {
                "description": "Network type of the mail server addresses.",
                "type": "array"
              },
              "report_url": {
                "description": "Public iplover page with the full report for this domain: share it, or open it for the explanations and sources.",
                "format": "uri",
                "type": "string"
              },
              "sections": {
                "description": "domain, hosting, email, dns, website, certificate: each with its data and checks (id, status, text in plain language).",
                "type": "object"
              },
              "servers": {
                "description": "Network type of the web server addresses.",
                "type": "array"
              }
            },
            "required": ["domain", "report_url", "sections"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain's health"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9ac78e9ac61530e13cba2fc8ee25a74d1810a2163e751077ddb5316ee8105c0b"
        },
        {
          "name": "check_my_ip",
          "title": "Show the caller's IP address",
          "description": "The public IP address this MCP request came from, with Cloudflare's approximate location and network for it. For a remote agent this is usually the agent platform's address, not the end user's device. The full report is at report_url (/ip/<address> on iplover.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the human-readable fields (verdict, explanation, labels).",
                "enum": ["en", "it", "de", "es", "fr", "pt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "as_organization": {},
              "asn": {},
              "city": {},
              "country": {},
              "ip": {
                "type": "string"
              },
              "ip_version": {},
              "report_url": {
                "description": "Public iplover page with the full report for this address: share it, or open it for the explanations and sources.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["ip", "report_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show the caller's IP address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a922299780d279d663335aec179485a85b6616de7ac936fac5ca73f990c66fb"
        },
        {
          "name": "dns_lookup",
          "title": "Look up DNS records",
          "description": "DNS records of a domain over DNS-over-HTTPS (Cloudflare, with Google Public DNS as fallback): A, AAAA, CNAME, MX, TXT, NS, SOA, CAA, or all of them. Returns each record with its TTL, the resolver used, the DMARC record and DNSSEC status. The full report is at report_url (/dns?name=<name> on iplover.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language of the human-readable fields (verdict, explanation, labels).",
                "enum": ["en", "it", "de", "es", "fr", "pt"],
                "type": "string"
              },
              "name": {
                "description": "A domain name, e.g. example.com.",
                "type": "string"
              },
              "type": {
                "default": "ALL",
                "description": "One record type, or ALL.",
                "enum": ["ALL", "A", "AAAA", "CNAME", "MX", "TXT", "NS", "SOA", "CAA"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "dmarc": {},
              "dnssec": {
                "type": "object"
              },
              "fetched_at": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "queries": {
                "description": "One entry per record type: status, records (name, type, ttl, value), error, resolver.",
                "type": "array"
              },
              "report_url": {
                "description": "Public iplover page with the full report for these records: share it, or open it for the explanations and sources.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["name", "queries", "report_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up DNS records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:24529b9d04b4f82a1930b69eab4ac75f1d0c012bc9e2eda86f8a97945a00e31e"
        },
        {
          "name": "lookup_ip",
          "title": "Look up an IP address",
          "description": "Who is behind an IPv4 or IPv6 address: owner and network from the regional registry (RDAP), the ASN, the registry country (not a geolocation), the network type (ISP, mobile, hosting, VPN, Tor, a company's own network) with its confidence and evidence, reverse DNS with a forward-confirmation check (FCrDNS), and matches in public blocklists with their dates. Includes a plain-language verdict and links (only links) to third-party services such as VirusTotal and AbuseIPDB. The full report is at report_url (/ip/<address> on iplover.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "An IPv4 or IPv6 address, e.g. 8.8.8.8 or 2606:4700:4700::1111.",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the human-readable fields (verdict, explanation, labels).",
                "enum": ["en", "it", "de", "es", "fr", "pt"],
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "action": {
                "type": "string"
              },
              "asn": {
                "description": "number, name, and the allocation's country and registry (Team Cymru).",
                "type": ["object", "null"]
              },
              "category": {
                "type": "string"
              },
              "category_label": {
                "type": "string"
              },
              "checked_at": {
                "type": "string"
              },
              "country": {
                "description": "Country in the registry record (code, name, source): where the network is registered, not where the device is.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "explanation": {
                "type": "string"
              },
              "ip": {
                "type": "string"
              },
              "ip_version": {
                "type": "integer"
              },
              "matched": {
                "description": "Published lists this address is in.",
                "type": "array"
              },
              "network": {
                "description": "Network type: primary, label, status (identified or estimated), confidence and evidence.",
                "type": ["object", "null"]
              },
              "note": {
                "type": "string"
              },
              "owner": {
                "description": "From the regional registry (RDAP): organization, network, cidr, abuse_email, registry, registered.",
                "type": ["object", "null"]
              },
              "owner_failure": {
                "description": "When the registry did not answer: registry, host, path, HTTP status and reason (rate_limit, 5xx, 4xx, timeout, network, redirect, invalid, budget).",
                "type": ["object", "null"]
              },
              "owner_stale": {
                "description": "When the registry failed just now and owner is the last saved answer for the range: fetched_at (date) and age_days (at most 30). null for a fresh answer.",
                "type": ["object", "null"]
              },
              "owner_status": {
                "description": "ok, not_found, timeout, error or invalid.",
                "type": "string"
              },
              "pivots": {
                "description": "Links to check the address elsewhere. iplover does not copy their results.",
                "type": "array"
              },
              "report_url": {
                "description": "Public iplover page with the full report for this address: share it, or open it for the explanations and sources.",
                "format": "uri",
                "type": "string"
              },
              "reverse_dns": {
                "description": "PTR name and whether it is forward-confirmed (resolves back to this address).",
                "type": ["object", "null"]
              },
              "sources": {
                "description": "Every list checked, with its status and date.",
                "type": "array"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["category", "ip", "report_url", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up an IP address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8e577e339e2dc3634ce2734fa1f130c0b2573a0c0bd5b38122c2eb241d50e2a"
        },
        {
          "name": "verify_bot",
          "title": "Verify a web crawler",
          "description": "Is a request really from the crawler it claims to be (Googlebot, Bingbot, GPTBot, ClaudeBot...)? Give the address, the user agent, or both. The address is checked against the operator's published IP lists and, where the operator supports it, forward-confirmed reverse DNS under the operator's domain. Verdicts: verified, spoofed (claims a bot that publishes its addresses, but isn't from them), different (another known bot), unverified (the bot publishes nothing to check against), notbot, claim (user agent only: what it claims, never proof). The full report is at report_url (/verify-bot?ip=<ip>&ua=<user agent> on iplover.com).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "The request's IPv4 or IPv6 address.",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the human-readable fields (verdict, explanation, labels).",
                "enum": ["en", "it", "de", "es", "fr", "pt"],
                "type": "string"
              },
              "user_agent": {
                "description": "The request's User-Agent header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "bot": {},
              "claim": {},
              "evidence": {},
              "report_url": {
                "description": "Public iplover page with the full report for this check: share it, or open it for the explanations and sources.",
                "format": "uri",
                "type": "string"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["report_url", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify a web crawler"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3abd33a01ec054a9bf09abcbbb41f3f225539ca08c6a5003e0570adf0016803b"
        }
      ],
      "digest": "sha256:e06179af58e2832d9a1b20985b7661fd395e9955897519ff30424aabb89ca648"
    }
  }
}
