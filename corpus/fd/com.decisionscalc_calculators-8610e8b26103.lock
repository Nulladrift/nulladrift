                "type": "number"
              },
              "gmfv": {
                "description": "GMFV / balloon payment due at the end of the PCP, EUR",
                "type": "number"
              },
              "kmAllowance": {
                "description": "PCP mileage allowance, km a year (default 15000)",
                "type": "number"
              },
              "loanAprPct": {
                "description": "Car loan APR % (credit union or bank)",
