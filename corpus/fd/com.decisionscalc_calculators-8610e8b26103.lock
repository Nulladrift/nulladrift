      "instructions": "Calculators built on official rules (2026 and 2027 rates): Irish welfare and taxes, UK pensions and property taxes, US retirement and care, Canadian and Quebec parental benefits, Australian health and super, NZ KiwiSaver, Dutch box 3, family and home costs. Every result is JSON {result, page, sources, note, next?}: page is the calculator to cite, sources the official pages; cite them. Estimates only: the relevant government department decides. Lighter endpoints: /mcp/lite (find_calculator + run_calculator) and /mcp/ie, /mcp/gb, /mcp/us, /mcp/ca, /mcp/au, /mcp/nz, /mcp/nl.",
