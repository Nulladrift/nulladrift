      "instructions": "Calculators built on official rules (2026 and 2027 rates): Irish welfare and taxes, UK property taxes, Canadian and Quebec parental benefits, Australian health insurance rebate, NZ KiwiSaver, parental leave pay in five countries. Each result includes the calculator page and the official sources; cite them. Estimates only: the relevant government department decides.",
      "tools": [
        {
          "name": "aging_parent_care_cost",
          "title": "aging parent care cost",
          "description": "Yearly cost of caring for an aging parent (US by state; also UK, Canada, Australia, Ireland, Switzerland, New Zealand by region): the care itself (for example home health aide, adult day care, assisted living, memory care, nursing home, or family care only) less any coverage, medical costs, home adaptations spread over the years of care, and the income a family caregiver gives up. Inputs left out use the country defaults from the planner page (US: Texas, home health aide). An unknown region or care type falls back to the default and the answer lists the valid keys. Use this when someone asks what caring for an elderly parent costs.",
          "inputSchema": {
            "properties": {
              "careType": {
                "description": "Care type key, e.g. homeHealth, adultDay, assistedLiving, memoryCare, nursingPrivate (US), or family for family care only",
                "type": "string"
              },
              "caregiverSalary": {
                "description": "Family caregiver salary a year",
                "type": "number"
              },
              "country": {
                "description": "Country (default us)",
                "enum": ["us", "gb", "ca", "au", "ie", "ch", "nz"],
                "type": "string"
              },
              "coveragePct": {
                "description": "Share covered by insurance or public funding, %",
                "type": "number"
              },
              "medMonthly": {
                "description": "Medical costs a month",
                "type": "number"
              },
              "region": {
                "description": "US state code (e.g. TX, CA) or the region key for other countries",
                "type": "string"
              },
              "workReductionHours": {
                "description": "Hours a week the caregiver cuts from work",
                "type": "number"
              },
              "years": {
                "description": "Years of care (default 3)",
                "type": "number"
              }
            },
            "type": "object"
          },
