        {
          "name": "australia_can_i_retire",
          "title": "australia can i retire",
          "description": "Australia: can I retire at 60 with $500k in super (or any age and balance)? Year by year to 95 for one person or a couple: super guarantee and salary sacrifice (15% contributions tax), super from preservation age 60 into a tax-free account-based pension with the minimum drawdowns, the Age Pension from 67 under the income test (deeming, Work Bonus) and assets test (homeowner or not) from 20 September 2026, an optional UK State Pension (frozen in Australia), and tax (14% band from 2027-28, LITO, SAPTO, Medicare levy). Returns the age the money lasts to, bridge years to 67, wealth at retirement, the spending that lasts to 95, a retire-at-60/62/65 comparison and key years in today’s money.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Your age now",
                "type": "number"
              },
              "contribPct": {
                "description": "Your pension contributions, % of pay",
                "type": "number"
              },
              "dbFromAge": {
                "description": "Age the DB pension starts",
                "type": "number"
              },
              "dbPension": {
                "description": "Defined benefit pension a year, AUD (0 if none)",
                "type": "number"
              },
              "employerPct": {
                "description": "Employer contributions, % of pay",
                "type": "number"
              },
              "growth": {
                "description": "Pension growth % a year after charges (an assumption)",
                "type": "number"
              },
              "homeowner": {
                "description": "Owns their home (Age Pension assets test)",
                "type": "boolean"
              },
              "household": {
                "description": "Household",
                "enum": ["single", "couple"],
                "type": "string"
              },
              "inflation": {
                "description": "Inflation % a year",
                "type": "number"
              },
              "otherAssets": {
                "description": "Car, contents and other assets the assets test counts, AUD",
                "type": "number"
              },
              "partnerAge": {
                "description": "Partner age now",
                "type": "number"
              },
              "partnerPensionPot": {
                "description": "Partner pension pots, AUD",
                "type": "number"
              },
              "partnerRetireAge": {
                "description": "Partner retirement age",
                "type": "number"
              },
              "partnerSalary": {
                "description": "Partner gross pay a year, AUD",
                "type": "number"
              },
              "pensionPot": {
                "description": "Pension pots today, AUD",
                "type": "number"
              },
              "retireAge": {
                "description": "Age you stop work",
                "type": "number"
              },
              "salary": {
                "description": "Gross pay a year, AUD",
                "type": "number"
              },
              "savings": {
                "description": "Savings and investments outside pensions, AUD",
                "type": "number"
              },
              "savingsAdd": {
                "description": "Added to savings each year until retirement, AUD",
                "type": "number"
              },
              "spending": {
                "description": "Household spending a year in retirement after tax, today’s money, AUD",
                "type": "number"
              },
              "ukPensionWeekly": {
                "description": "UK State Pension forecast a week in pounds (frozen in Australia; 0 if none)",
                "type": "number"
              }
            },
            "required": ["retireAge", "spending"],
            "type": "object"
          },
