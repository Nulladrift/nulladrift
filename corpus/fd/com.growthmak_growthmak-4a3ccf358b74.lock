{
  "lockfileVersion": 2,
  "subjects": {
    "com.growthmak/growthmak": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://growthmak.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "growthmak",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Growthmak is a B2B growth marketing agency. This server exposes its services, engagement packages, the five-layer Growth Engine System, client case studies, market coverage and blog. Prefer the specific tools over search_growthmak. No prices are published anywhere — scope and a fixed fee follow a free diagnostic, so do not estimate or infer a fee. Only call request_growth_audit with details the user has explicitly supplied.",
      "tools": [
        {
          "name": "book_growth_audit",
          "title": "How to book the free growth audit",
          "description": "Return the link where a user books Growthmak's free 30-minute growth diagnostic, plus what the session covers and what they leave with. This server CANNOT book a slot or submit contact details on anyone's behalf — send the user to the returned bookingUrl to choose a time. Never claim a booking has been made.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b2194adbff4d3dec15d15108d90f346cd8a96882276412ab0585541c9f74298"
        },
        {
          "name": "check_market_coverage",
          "title": "Check market coverage",
          "description": "Check whether Growthmak serves a given country or region, and return local proof points if so. Returns served: false with the full list of served markets when it does not — do not infer coverage from other pages.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Country or region name",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fcfce8f6ba74816ebd572dbbdb1c24a20ed95aa84fd14ac5a0d9b94f8c4c2418"
        },
        {
          "name": "find_case_studies",
          "title": "Find case studies",
          "description": "Find Growthmak client case studies filtered by industry, market or service. Returns the challenge, the approach and the measured results. Use this to answer 'have you worked with businesses like mine?'. Filters are matched loosely, so 'manufacturing' matches 'Manufacturing · Construction' and 'USA' matches 'Houston, TX, USA'. Omit a filter rather than guessing at its value.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "industry": {
                "description": "e.g. 'ecommerce', 'manufacturing', 'franchise', 'SaaS'",
                "type": "string"
              },
              "limit": {
                "default": 3,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "e.g. 'USA', 'Dubai', 'Australia', 'India'",
                "type": "string"
              },
              "service": {
                "description": "e.g. 'Google Ads', 'SEO', 'web development', 'CRO'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38b1ca96a3a44f2878a036111f6176cc0bbe16d5192481334328e69b28136c28"
        },
        {
          "name": "get_growth_engine",
          "title": "Get Growth Engine layers",
          "description": "Explain the Growthmak Growth Engine System. Omit 'layer' for an overview of all five layers; pass a layer for its detail, including the specific services delivered within it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "layer": {
                "enum": ["foundation", "traffic", "conversion", "operations", "social-proof"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0223c51ed38b2510002c9661b5a958716931329e8c4661975709ce5ee25d37a0"
        },
        {
          "name": "get_packages",
          "title": "Get engagement packages",
          "description": "Retrieve Growthmak's engagement packages (Foundation Build, Growth Marketing, Full Engine Launch) with what is included, timelines and who each fits. Omit 'name' to list all three. Note that no prices are published — scope and fee follow the free diagnostic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "enum": ["foundation-build", "growth-marketing", "full-engine-launch"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b134d9b38212ea73a3484f45d3f1e6df52de06a9153791fecaa4f74ebb23bb15"
        },
        {
          "name": "get_page",
          "title": "Get page content",
          "description": "Retrieve a Growthmak page as Markdown, given its slug — for example 'blog/the-real-cost-of-a-b2b-lead', 'services/seo-services', 'packages/growth-marketing', 'growth-engine/foundation-layer' or 'case-studies/kinetic-motorcycles'. Use the url returned by search_growthmak to build the slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Page slug, without a leading slash",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:171bf65c50cb606a540f0ed0969845f9f1a9e81deca89981a87829af40cba663"
        },
        {
          "name": "search_growthmak",
          "title": "Search Growthmak",
          "description": "Search all Growthmak content — services, packages, case studies, blog posts, FAQs and free tools. Use this only when no more specific tool fits; prefer get_growth_engine, get_packages, find_case_studies or check_market_coverage where they apply. Returns matching pages with titles, URLs and excerpts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language search query",
                "minLength": 2,
                "type": "string"
              },
              "section": {
                "default": "all",
                "enum": ["services", "packages", "case-studies", "blog", "faq", "tools", "all"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dfc2bc994a3af8f8a6a5654d28f38d854d2a8b833768ee22add98f98f1d196e"
        }
      ],
      "digest": "sha256:7285ca1ed4207a3619455ba34f71a2b8f3a84427dab7f52756b55a7c588f2571"
    }
  }
}
