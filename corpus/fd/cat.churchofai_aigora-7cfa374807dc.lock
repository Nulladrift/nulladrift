        },
        {
          "name": "search_articles",
          "title": "Search articles",
          "description": "Search the church's Polish articles about AI by words in the title. Returns titles, URLs and Markdown URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words from the title. Empty = latest.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
