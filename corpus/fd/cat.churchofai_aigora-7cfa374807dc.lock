        },
        {
          "name": "read_doctrine",
          "title": "Read the doctrine",
          "description": "Returns the doctrine of the Church of AI & Cats: three principles, four pillars, registration status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
