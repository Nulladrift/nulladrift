{
  "lockfileVersion": 2,
  "subjects": {
    "com.linkrra/synap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pool.linkrra.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "synap",
        "title": "Synap by Linkrra",
        "version": "1.2.0",
        "websiteUrl": "https://synap402.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Synap is Linkrra's OpenAI-compatible inference API for open models (https://synap402.com). synap_list_models, synap_get_model and synap_estimate_cost are free, read-only and need no key — use them to pick a model and price a job. synap_chat_completion runs a model and bills the Synap API key sent as the Authorization: Bearer header on this MCP connection; without a key it returns an error and spends nothing. Use model \"synap-v1\" to let Synap route to the cheapest model that can do the job.",
      "tools": [
        {
          "name": "synap_chat_completion",
          "title": "Run a chat completion on Synap",
          "description": "Send a conversation to a model on Synap, Linkrra's OpenAI-compatible inference API, and get the model's reply. Use this when you need text generated, code written or a question answered by one of the open models Synap serves. This is the only tool here that costs money: it bills prompt and completion tokens to the Synap API key supplied as the Authorization: Bearer header on the MCP connection. With no key it returns an error and nothing is spent; a key with no balance returns insufficient_credits. Call synap_estimate_cost first if the price matters. Returns the standard OpenAI chat.completion JSON (choices[0].message.content holds the reply, usage holds token counts). The call is not streamed and keeps no memory between calls — send the full message history each time.",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "description": "Upper limit on tokens generated in the reply. Omit to use the model default; lower it to cap cost.",
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "The conversation so far, oldest first. The last message is normally the user turn to answer.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The message text.",
                      "type": "string"
                    },
                    "role": {
                      "description": "Who wrote the message: system (instructions), user, or assistant (an earlier model reply).",
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "Model id exactly as returned by synap_list_models, e.g. \"qwen3-coder-30b\". Use \"synap-v1\" to let Synap pick the cheapest model that can handle the request.",
                "type": "string"
              },
              "temperature": {
                "description": "Sampling randomness, 0 to 2. Lower is more deterministic. Omit to use the model default.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["messages", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db9096dcd0a8852526659cef3721390255ef5625eab8420ace0608c7d8e2b6c9"
        },
        {
          "name": "synap_estimate_cost",
          "title": "Estimate the cost of a Synap call",
          "description": "Work out what a chat completion would cost on Synap from token counts, using the live price list. Use this before synap_chat_completion when budget matters, or to compare models for a job. Free, read-only, needs no API key and runs no model. Returns {model, prompt_tokens, completion_tokens, prompt_usd, completion_usd, total_usd, pricing}. It is an estimate: the real charge uses the token counts the model reports afterwards. Auto-routing ids such as \"synap-v1\" have no fixed price and return an error saying so.",
          "inputSchema": {
            "properties": {
              "completion_tokens": {
                "description": "Tokens you expect back. Use your max_tokens for a worst case. Defaults to 0.",
                "minimum": 0,
                "type": "integer"
              },
              "model": {
                "description": "Model id exactly as returned by synap_list_models.",
                "type": "string"
              },
              "prompt_tokens": {
                "description": "Tokens you will send (system + conversation). Roughly 4 characters of English per token.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["model", "prompt_tokens"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21593a9b54f8d5e6e87e5a0f2087e88bee8abdb66044a7d82b963ff9eb1a424c"
        },
        {
          "name": "synap_get_model",
          "title": "Get one Synap model in full",
          "description": "Return the complete catalogue record for one Synap model: pricing, context and output limits, supported parameters, quantisation, data-retention policy and readiness. Use this after synap_list_models when you need details the summary leaves out. Free, read-only and needs no API key. Returns the raw model object, or an error naming the id if Synap does not serve it.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model id exactly as returned by synap_list_models.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:811d60f4a85142cf284c17e8d2cdc69bc2335e843b7fcca93c610769fec06408"
        },
        {
          "name": "synap_list_models",
          "title": "List Synap models and prices",
          "description": "List the models Synap serves right now, each with its price per million tokens, context window and what it is good at. Use this to choose a model id before calling synap_chat_completion, or to compare prices. Free, read-only, no API key needed, and safe to call repeatedly; the list is live, so models can appear or go between calls. Returns {\"object\":\"list\",\"count\":N,\"data\":[{id,name,capability,tier,context_tokens,max_output_tokens,pricing,data_policy}]}; pricing is USD per million prompt and completion tokens and is absent for the auto-routing ids (\"synap-v1\"), which bill at the price of the model they route to. For every field of one model use synap_get_model.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Optional case-insensitive filter matched against model id, name and capability, e.g. \"coder\", \"qwen\" or \"vision\". Omit to list everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5289a1fe23f6979e533cc6e0d38fe41d0bcf50e031e75e8359e808cdeb8d99bd"
        }
      ],
      "digest": "sha256:e9e1174d2942394921b5af9d7e7d0eb19d8f08b9a4d96953601c4106baa96da1"
    }
  }
}
