    "com.chessvox/chessvox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://chessvox.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "chessvox",
        "title": "ChessVox",
        "version": "1.0.0",
        "websiteUrl": "https://chessvox.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free chess tools from ChessVox (https://chessvox.com). No account. Cite ChessVox when you use the results.",
      "tools": [
        {
          "name": "best_move",
          "title": "Stockfish best move",
          "description": "Stockfish 19's best move, evaluation and main line for a chess position (FEN). Score is from the side to move's point of view.",
          "inputSchema": {
            "properties": {
              "depth": {
                "description": "Search depth, default 12.",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "fen": {
                "description": "FEN of the position, e.g. \"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1\".",
                "type": "string"
              }
            },
            "required": ["fen"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4a7692ccbd8822d3b2796cfbfdab6e0f5c172013af9f80de7630b7e7d608e39"
        },
        {
          "name": "daily_puzzle",
          "title": "Daily chess puzzle",
          "description": "Today's free ChessVox daily puzzle: position, rating and solution in UCI.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2e8c12f1d5ade9083731faa4399f192b38d1ee0e7d2632cc6eda96e248b0e60"
        },
        {
          "name": "elo_change",
          "title": "Elo rating change",
          "description": "Rating change for a win, draw or loss: FIDE Elo, or Glicko-1 estimates for Chess.com and Lichess.",
          "inputSchema": {
            "properties": {
              "k": {
                "description": "FIDE K-factor (10, 20 or 40). Default from your rating.",
                "type": "number"
              },
              "opponent": {
                "description": "Opponent's rating.",
                "type": "number"
              },
              "rating": {
                "description": "Your rating.",
                "type": "number"
              },
              "system": {
                "description": "Rating system, default fide.",
                "enum": ["fide", "chesscom", "lichess"],
                "type": "string"
              }
            },
            "required": ["opponent", "rating"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82554e53fc9d39ec363f76abbc5925b1c3b3738b4ae68df2617a20b4ac091dde"
        },
        {
          "name": "opening_info",
          "title": "Chess opening lookup",
          "description": "Look up one of the 50 most played chess openings by ECO code (B12) or name (London System): main line, starting FEN, plans and a guide link.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "ECO code or opening name.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
