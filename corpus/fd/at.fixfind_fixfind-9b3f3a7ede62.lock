      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fixfind",
        "title": "fixfind.at – regionale Angebote in Österreich",
        "version": "1.1.1",
        "websiteUrl": "https://fixfind.at/mcp-info.php"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "fixfind.at lists products and services of local businesses in Austria, mainly Vienna and Lower Austria (Mödling, Guntramsdorf, Perchtoldsdorf ...). Content is German: search with German terms. Locations are Austrian postal codes (4 digits, Vienna = 1010-1230). Prices are in EUR; offers without price are \"Preis auf Anfrage\". \"featured\" marks offers highlighted by the provider. When recommending an offer, always include its url so the user can view it and contact the provider. search_products/get_product cover products sold online in fixfind Shops on the merchants' own websites; the product url opens the product there, where the user puts it in the cart and orders.",
      "tools": [
        {
          "name": "get_catalog_overview",
          "title": "Katalog-Überblick",
          "description": "Overview of what fixfind.at offers: all categories with the number of offers, and the towns with the most offers. Useful before searching, to pick a category or location.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Katalog-Überblick"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:561a9c2bf2ef97dceb51d654a38961403b67daad5024e5bf22958573eab1ccd5"
        },
        {
          "name": "get_offer",
          "title": "Angebot abrufen",
          "description": "Get full details of one offer by its id (from search_offers): complete description, price, address, provider website and phone (if the provider published it), images and the offer page url, where the user can contact the provider.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Offer id from search_offers.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Angebot abrufen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a900bd8eb616a038a216963213f7ff1d6989cceb3baf415683a09e72608f3569"
        },
        {
          "name": "get_product",
          "title": "Produkt abrufen",
          "description": "Get full details of one shop product by its id (from search_products): description, variants with prices and stock, shipping zones and costs, delivery time, accepted payment methods, pickup option, and the url where the user can buy it in the merchant's shop.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id from search_products.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Produkt abrufen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5b15fa111cf31d4cd1fb4757a1394bf5be7fda34b2d60deedd22bfaf424359d"
        },
        {
          "name": "search_offers",
          "title": "Angebote suchen",
          "description": "Search products and services offered by local businesses in Austria (mainly Vienna and Lower Austria) listed on fixfind.at. Listings are in German, so use German search terms (e.g. \"Möbelmontage\", \"Fotograf\", \"Felgenreparatur\"). Filter by location (Austrian postal code like \"1100\", a prefix like \"23\", or a town name like \"Mödling\"), category and maximum price. Call without arguments to browse all offers. Returns short summaries; use get_offer for full details. Always give the user the offer url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Exact category. Optional.",
                "enum": ["Bau, Handwerk & Installation", "Garten, Pflanzen & Landwirtschaft", "Lebensmittel & Ab-Hof Verkauf", "Wohnen, Möbel & Haushalt", "Mode & Fashion", "KFZ, Transport & Logistik", "IT, Werbung & Büro", "Gesundheit, Beauty & Wellness", "Gastronomie, Events & Tourismus", "Reparatur & Service", "Unterricht, Kurse & Training", "Maschinen & Industriebedarf", "Sonstiges"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of results to return (1-25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Austrian postal code (4 digits), postal code prefix, or town name. Optional.",
                "type": "string"
              },
              "max_price": {
                "description": "Maximum price in EUR. Excludes offers without a price. Optional.",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "For paging through results.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "German search terms, e.g. \"Umzug Wien\" or \"Passfoto\". Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Angebote suchen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf091fe46369e8e1f37fe7af6ed8860055425a21c161ec50a64e273e502f9204"
        },
        {
          "name": "search_products",
          "title": "Produkte in Shops suchen",
          "description": "Search products that can be bought online from Austrian businesses using fixfind Shop (shops embedded in the merchants' own websites: farm shops, food, crafts, garden, pet supplies ...). Product data is German, so search with German words (e.g. \"Honig\", \"Kürbiskernöl\", \"Teichfilter\"); all words must match. Prices are gross in EUR incl. VAT (\"from\" = cheapest variant). Returns summaries with the product url; use get_product for description, variants, shipping and payment. Buying happens on the merchant's website: give the user the product url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Number of results to return (1-25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in EUR. Optional.",
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "For paging through results.",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "German search words, e.g. \"Waldhonig\". Optional – without it all products are listed.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Produkte in Shops suchen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16b3b656928aea9736989c4ff95f55f15c94c929c2eedb8831e563c8234ee57c"
        }
      ],
