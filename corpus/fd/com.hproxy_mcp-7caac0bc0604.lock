{
  "lockfileVersion": 2,
  "subjects": {
    "com.hproxy/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.hproxy.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hproxy",
        "title": "HProxy",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HProxy's free proxy tools. proxy_list returns live free proxies, proxy_check tests any proxy for real, ip_lookup resolves an address to its location and network. All three are free and need no key. Free proxies are public and come and go, so check one before relying on it.",
      "tools": [
        {
          "name": "ip_lookup",
          "title": "IP lookup",
          "description": "Look up any public IP address: country, region, city, coordinates, timezone, ASN and the network that runs it. No key. Up to 50 per call.",
          "inputSchema": {
            "properties": {
              "ips": {
                "description": "IPv4 or IPv6 addresses. One is the common case.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "IP lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:33dcbe021d14784f411a4ff1613c6391dcbc8f8f48c37620d3b3db8227135b21"
        },
        {
          "name": "proxy_check",
          "title": "Proxy checker",
          "description": "Run a real live test on one or more proxies: is it alive, which protocols it speaks, its anonymity grade, latency and location. No key. Each check opens a real connection, so a dead proxy can take a few seconds. Up to 25 per call.",
          "inputSchema": {
            "properties": {
              "proxies": {
                "description": "Proxies as ip:port, e.g. ['203.0.113.7:1080']. Up to 25.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["proxies"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Proxy checker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba8a8516c4b0662570725ff76cb19c509e6856d28a8148f4a8495af6ca173999"
        },
        {
          "name": "proxy_list",
          "title": "Free proxy list",
          "description": "Fetch live free proxies from HProxy's public pool, re-checked around the clock. No key. Returns ip, port, protocols, anonymity, country, city, network, latency and 24h uptime per proxy. Use this when the user wants free proxies to test with. Free proxies are public and come and go, so check them before relying on one.",
          "inputSchema": {
            "properties": {
              "anonymity": {
                "description": "Only proxies of exactly this anonymity grade: elite hides both your address and the fact that a proxy is used, anonymous hides your address, transparent passes it on.",
                "enum": ["elite", "anonymous", "transparent"],
                "type": "string"
              },
              "country": {
                "description": "ISO 3166 alpha-2 country code, e.g. 'de'. Omit for every country.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many to return. The full list is thousands; ask for what you need.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "protocol": {
                "description": "Only proxies speaking this protocol.",
                "enum": ["http", "https", "socks4", "socks5"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Free proxy list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b0d52d9f459d0c59cad96ba65783d100e18a696ed50af3924ef9140474813ae8"
        }
      ],
      "digest": "sha256:963e884f5534f078779f94db9f057b2e69846c29d0da7776db9c31dec4a1c02a"
    }
  }
}
