            "ui": {
              "resourceUri": "ui://resources/news-cards-app",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:47e88b4504771a80d62954e9f2d88da5895a3479f7787457a2ef4b75353ee1d0"
        }
      ],
