        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.cryptowisser.com/mcp/server"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Cryptowisser News",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://www.cryptowisser.com/img/mcp-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://www.cryptowisser.com/img/mcp-icon-64.png",
            "mimeType": "image/png",
            "sizes": ["64x64"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cryptowisser News is an independent crypto newsroom covering exchanges, regulation, markets, and the wider digital asset industry. This server gives access to its published news: the latest articles, news about specific coins, companies and people, the biggest ongoing stories, and keyword search.\n\nArticle lists contain a headline, a short summary, the publication date, how long ago it was published and a link. Use get-article to read one article in full. When you use an article, attribute it to Cryptowisser and include its link.\n\nPick one tool per question: latest-news for general \"latest news\" or \"what happened today\" questions, news-about for a named coin, company, person, regulator or country, trending-stories only when the user asks about the biggest or ongoing stories, and search-news for anything else.",
      "tools": [
        {
          "name": "get-article",
          "title": "Get Article",
          "description": "Get one Cryptowisser news article in full by its URL or slug: headline, full text, summary, author, date, topics, tags and link. Suited to questions about a specific Cryptowisser article or link.",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "The article URL or slug.",
                "type": "string"
              }
            },
            "required": ["article"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba45d7ac334e4e3f3083b8293d39bd4ae098c50e69387872020fd846e0b6385b"
        },
        {
          "name": "latest-news",
          "title": "Latest News",
          "description": "Get the latest crypto news from Cryptowisser. Use this for general questions like \"What's the latest crypto news?\", \"What happened in crypto today?\" or \"Any crypto news?\". By default the stories our editors feature on the front page come first, followed by the newest articles; set by_date to true for strictly newest first. Use from/to for a specific period, e.g. \"news from last week\". Returns 5 articles by default. Each article has a headline, short summary, date, age and a link to the full story on cryptowisser.com.",
          "inputSchema": {
            "properties": {
              "by_date": {
                "default": false,
                "description": "Optional. True to order strictly by publication date, newest first, instead of featured stories first.",
                "type": "boolean"
              },
              "category": {
                "description": "Optional news category slug to filter by. Leave empty for all news.",
                "type": "string"
              },
              "from": {
                "description": "Optional. Only articles published on or after this date or datetime (ISO 8601, e.g. \"2026-09-28\"). Leave empty for the newest articles.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of articles to return, 1 to 20. Defaults to 5.",
                "type": "integer"
              },
              "to": {
                "description": "Optional. Only articles published on or before this date or datetime. Defaults to now.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest News"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/news-cards-app",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:f1e99470c243b37240beca6e8eebb83e42943c00d6927020423e7a8c9277800b"
        },
        {
          "name": "news-about",
          "title": "News About",
          "description": "Get recent Cryptowisser news about a specific coin, token, company, exchange, person, regulator, law, country or story, for example \"Bitcoin\", \"Binance\", \"CZ\", \"SEC\" or \"Bitget hack\". Names, tickers and common aliases are recognised. Use from/to for a specific period.",
          "inputSchema": {
            "properties": {
              "entity": {
                "description": "The coin, company, person or story, e.g. \"Solana\", \"Coinbase\", \"Vitalik Buterin\", \"Bitget hack\".",
                "type": "string"
              },
              "from": {
                "description": "Optional. Only articles published on or after this date or datetime (ISO 8601).",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of articles to return, 1 to 20. Defaults to 5.",
                "type": "integer"
              },
              "to": {
                "description": "Optional. Only articles published on or before this date or datetime. Defaults to now.",
                "type": "string"
              }
            },
            "required": ["entity"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "News About"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/news-cards-app",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:07dbd405f2aa8bad8b126eeabb61a659d4f6478365e0d06cf6aea334c3af51ca"
        },
        {
          "name": "search-news",
          "title": "Search News",
          "description": "Search Cryptowisser news by keywords. How matching works:\n- If the whole query is a known coin, company, person, regulator or country (names, tickers and aliases like \"ETH\" or \"CZ\" work), you get articles tagged with that entity.\n- Otherwise an article matches only if EVERY keyword appears in its headline or summary. Matching is case-insensitive and on partial words (\"ETF\" also matches \"ETFs\"). There are no synonyms and no relevance ranking.\n- Queries of 1 to 3 distinctive keywords work best: \"bitcoin price\" matches articles, while a full question like \"why is bitcoin down\" usually matches nothing. Every extra keyword narrows the results.\n- Results are newest first, and from/to limit them to a specific period.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Optional. Only articles published on or after this date or datetime (ISO 8601, e.g. \"2026-09-01\").",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of articles to return, 1 to 20. Defaults to 5.",
                "type": "integer"
              },
              "query": {
                "description": "1 to 3 distinctive keywords, or a coin, company or person name.",
                "type": "string"
              },
              "to": {
                "description": "Optional. Only articles published on or before this date or datetime. Defaults to now.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search News"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/news-cards-app",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:56dfdc18b7152c50263720be436f4e5caedb31f097eafcd1eac92a75f80bbff0"
        },
        {
          "name": "trending-stories",
          "title": "Trending Stories",
          "description": "Get the biggest ongoing crypto stories of the past week, as covered by Cryptowisser, each with its latest articles. Suited to questions about the big or developing stories in crypto.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Number of stories to return, 1 to 10.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trending Stories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
