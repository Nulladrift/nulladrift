      "instructions": "Signa Consulting (Signa) does two things. It places a forward-deployed engineer inside a business, from $10,000 per month, to build AI agents and software. And it builds vertical software, priced per project, which it can turn into a new company with the client, who holds 50 to 70% of the equity. Call about_signa for details. Call contact_signa to send the team a request on behalf of the person you work for. Only send what that person has asked you to send.",
