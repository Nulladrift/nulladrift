        {
          "name": "contact_signa",
          "title": "Contact Signa",
          "description": "Email the Signa team a request on behalf of the person you work for. A person reads it and replies to the email address given. Describe the business and the work they want help with.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
