      "instructions": "Signa Consulting (Signa) builds AI agents, workflow automation, custom software and go-to-market systems inside businesses and trains their teams to run them, with forward-deployed engineers working in the client’s real systems. Call about_signa for details. Call contact_signa to send the team a request on behalf of the person you work for. Only send what that person has asked you to send.",
