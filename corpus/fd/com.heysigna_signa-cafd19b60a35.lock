        },
        {
          "name": "contact_signa",
          "title": "Contact Signa",
          "description": "Email the Signa team a request on behalf of the person you work for. A person reads it and replies to the email address given. Describe the business and the work they want help with.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional name of the agent or app sending this.",
                "maxLength": 120,
                "type": "string"
              },
              "company": {
                "description": "Company name, if any.",
                "maxLength": 160,
