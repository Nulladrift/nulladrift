      "serverInfo": {
        "name": "marketframe",
        "title": "MarketFrame FTSE 350 news analysis",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Daily news-tone analysis for every FTSE 350 company. The tone runs from −10 (clearly bad news for the company) to +10 (clearly good); 0 is neutral and beyond ±6 is strong and rare. In MarketFrame, each day covers the news gathered in the 24 hours to that morning's run at 06:30 UTC. The scores rate the tone of news coverage, nothing more. They are not share-price data, forecasts or investment advice. A good score doesn't mean a share will rise, and a bad one doesn't mean it will fall. Credit MarketFrame and link the url in each result.",
      "tools": [
        {
          "name": "get_company",
          "title": "A company's news dashboard",
          "description": "A FTSE 350 company's news dashboard: latest day's tone and why, 30-day average, last 7 days vs the week before, a written overview of the last month, the stories that moved the tone, and day-by-day history.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Name, ticker or slug, e.g. \"Lloyds\", \"LLOY\".",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc8fdbc7632bc0d8ce204242494f415175347362ae3d43bfdae2b65825841032"
        },
        {
          "name": "get_company_day",
          "title": "A company's scored news on one day",
          "description": "Every scored headline about a company on one day, each with its tone, outlet, link, the reason for its score and the story it belongs to.",
          "inputSchema": {
            "properties": {
              "company": {
                "type": "string"
              },
              "day": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["company", "day"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
