          },
          "digest": "sha256:986f2b34565bbd24e5c256a14909dbe995d450a4126d9cd14fe7e7abd50ac2ad"
        },
        {
          "name": "get_weekly_note",
          "title": "The weekly FTSE 100 news note",
          "description": "The Monday weekly note on FTSE 100 news tone: which companies had the best and worst coverage and why.",
          "inputSchema": {
            "properties": {
              "end_day": {
                "description": "Optional YYYY-MM-DD the week ends on.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
