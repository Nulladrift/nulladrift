          },
          "digest": "sha256:d3bc7999ae38b37be6e60a8760f6ac4a7a24eb8afa7d326eddd48d93c8775037"
        },
        {
          "name": "get_movers",
          "title": "What changed overnight",
          "description": "FTSE 350 companies whose news coverage turned up or down against their OWN last 30 days (change and z-score), and companies drawing unusual attention (reports or outlets at 3x their usual rate). A report is a story counted once, however many outlets repeat it. Each item has its evidence (thin, moderate, strong), today's why, and a 30-day history.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "Optional YYYY-MM-DD; defaults to the latest day.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
