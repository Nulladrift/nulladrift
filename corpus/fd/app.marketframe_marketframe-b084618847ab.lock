        {
          "name": "search_news",
          "title": "Search scored FTSE 100 news",
          "description": "Search every FTSE 100 story or headline MarketFrame has scored.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company slug",
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "page": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "newest", "oldest", "biggest", "positive", "negative"],
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "tone": {
                "enum": ["pos", "neg", "flat"],
                "type": "string"
              },
              "type": {
                "enum": ["stories", "headlines"],
                "type": "string"
              }
            },
            "type": "object"
          },
