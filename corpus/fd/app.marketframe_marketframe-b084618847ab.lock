            "readOnly": true
          },
          "digest": "sha256:6973c41d59180c9c8da846f243e2636113a350e326b7106784cb25e73bd1bdcc"
        },
        {
          "name": "get_ftse350_today",
          "title": "FTSE 350 news tone today",
          "description": "How the news treated the FTSE 350 on the latest day (or a given day): overall mood, the biggest stories and every company's tone score (−10 clearly bad news for the company … +10 clearly good).",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "Optional YYYY-MM-DD; defaults to the latest day.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
