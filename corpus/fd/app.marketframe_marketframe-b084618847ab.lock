            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6973c41d59180c9c8da846f243e2636113a350e326b7106784cb25e73bd1bdcc"
        },
        {
          "name": "get_ftse100_today",
          "title": "FTSE 100 news tone today",
          "description": "How the news treated the FTSE 100 on the latest day (or a given day): overall mood, the biggest stories and every company's tone score (−10 clearly bad news for the company … +10 clearly good).",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "Optional YYYY-MM-DD; defaults to the latest day.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8267920cdd09f1b6260bec3d95fc747347a2f941f147cc981b5f1198cd24f6f9"
        },
        {
          "name": "get_story",
          "title": "One news story in full",
          "description": "One news story (an event covered across outlets and days): summary, tone, timeline and every headline.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Story slug from search or get_company.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
