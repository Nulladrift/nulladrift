{
  "lockfileVersion": 2,
  "subjects": {
    "com.openplacesapi/places": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.openplacesapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "openplacesapi",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Place search near a coordinate, backed by the Open Places API. Use list_categories to find category slugs, then search_places with q, category, or both. Authenticate by sending your API key as an Authorization: Bearer header on every request. Create a free key (2,500 searches once) at https://app.openplacesapi.com/signup.",
      "tools": [
        {
          "name": "list_categories",
          "title": "List place categories",
          "description": "Look up valid category slugs for search_places. Answered locally from the Overture category taxonomy; does not use the API key or count against quota. With q (e.g. 'pharmacy', 'coffee', 'ev charging'), returns the best-matching categories (default 20, max 100) with label, parent, and full hierarchy. Without q, returns a compact overview: the top-level groups and their direct subcategories. Prefer passing q; the full taxonomy has over 2,000 categories.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum matches when q is supplied, 1-100. Default 20. Ignored without q.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Words describing the kind of place, or a guessed slug, e.g. 'pharmacy', 'hardware store', 'firestation'.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7386a7d717c50d22190264b42877ac8beb6ea9ac080d9649655d3752dc27b1c"
        },
        {
          "name": "search_places",
          "title": "Search places near a coordinate",
          "description": "Search real-world places (businesses, landmarks, venues) near a latitude/longitude. Returns names, structured addresses, categories, coordinates, and distances in miles, ranked by relevance then distance. Backed by open Overture Places data. Global coverage wherever the current Overture release has indexable Places data; quality varies by location. Pass q (free text), category (an exact Overture category slug such as 'pharmacy'), or both; at least one is required. A q that names a kind of place ('pharmacy', 'coffee near me', 'boots pharmacy') also searches that category: meta.interpreted_as says how q was read, and each result's match field says whether it matched by name, address, category, or name_and_category. Use mode=name to match q literally against names only. Use list_categories to find valid category slugs instead of guessing. This is proximity search only: it cannot geocode street addresses or autocomplete partial input. Each call counts as one search from the prepaid balance. Read meta.warnings: category_alias reports a reviewed legacy category resolved to resolved_category (legacy parent aliases can narrow the old filter), unknown_category lists suggested categories, no_results_within_radius includes nearest_match identifying the closest place found within the bounded 100-mile lookup, outside results, and says which radius_mi to retry with or to search from a closer point beyond the 50-mile maximum, query_relaxed means no exact matches so a loosened q was used, category_inferred means nothing matched by name so the results are nearby places in the closest category (not the named place), pagination_limit_reached means more places match beyond the 1,000-place category-browse window so narrow the search instead of paging. If a call fails with quota_exhausted, stop and tell the user instead of retrying.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Provide q, category, or both. lat and lon are always required.",
            "properties": {
              "category": {
                "description": "Exact Overture category slug, e.g. 'pharmacy', 'coffee_shop', or a parent such as 'food_and_drink' (matches its subcategories). Find slugs with list_categories. Without q, lists places in this category by distance; with q, filters text matches to it.",
                "maxLength": 128,
                "pattern": "^[a-z0-9][a-z0-9_:-]{0,127}$",
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the search center.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Maximum results. 1-20 without category, 1-50 when category is supplied. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude of the search center.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "min_confidence": {
                "description": "Only return places whose Overture confidence score is at least this value, 0-1.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "Match q against names, addresses, or both. Default 'all' (also reads category words in q). 'name' matches names literally, without category interpretation. mode=address needs at least 4 searchable characters in q.",
                "enum": ["all", "name", "address"],
                "type": "string"
              },
              "offset": {
                "description": "Pagination offset for category browsing; only valid with category. offset + limit must be at most 1000 (the first 1000 ranked places). Use meta.next_offset from the previous page; it is null on the last page. Each page is one search.",
                "maximum": 999,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Free-text search, e.g. 'ramen', 'Blue Bottle', 'pharmacy', '서울'. Category words in q also search that category unless mode=name or category is set. Use at least 3 searchable characters, or 2 contiguous CJK characters. Required unless category is supplied.",
                "maxLength": 128,
                "minLength": 2,
                "type": "string"
              },
              "radius_mi": {
                "description": "Search radius in miles, max 50. Default 25.",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              },
              "sort": {
                "description": "Result order. 'relevance' (default) ranks by match quality, then distance. 'distance' returns the same matches nearest first; category pages then page by distance.",
                "enum": ["relevance", "distance"],
                "type": "string"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b7c033515eadae91854ea83716725b46244df1f0716cbc53b159531b29385f8"
        }
      ],
      "digest": "sha256:3ae77221d21fbd6a4107fcd3d053f165a46bf37627b3d353c4fe5b66b1ed39a1"
    }
  }
}
