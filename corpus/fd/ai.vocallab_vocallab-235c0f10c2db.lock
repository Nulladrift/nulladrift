        {
          "name": "save_designed_voice",
          "title": "Save a designed voice",
          "description": "Keep one of the previews from design_voice as a permanent voice on the account. The returned id can be passed straight to generate_speech as `voice`. Uses one of the designed-voice slots included in the plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Optional note about what the voice is for",
