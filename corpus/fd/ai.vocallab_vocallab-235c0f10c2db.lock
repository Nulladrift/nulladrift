        },
        {
          "name": "get_captions",
          "title": "Get captions (SRT) for a generation",
          "description": "Get subtitles for a generation as an SRT file — timed from the actual speech, with any [emotion] markup and <break/> pauses stripped out. `phrase` mode gives readable subtitle lines; `word` mode gives one cue per word (karaoke-style highlighting). Use the id returned by generate_speech.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The generation id returned by generate_speech",
                "minLength": 1,
                "type": "string"
              },
              "max_words": {
                "description": "Words per subtitle line in phrase mode (2–7, default 4)",
                "maximum": 7,
                "minimum": 2,
                "type": "integer"
              },
              "mode": {
                "description": "phrase (default): readable subtitle lines. word: one cue per word, for karaoke-style captions.",
                "enum": ["phrase", "word"],
                "type": "string"
              },
              "uppercase": {
                "description": "UPPERCASE the caption text (default false)",
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
