          },
          "digest": "sha256:d2817ee74fef93d557d00e077b7b1d05f1e408d881d7e22ce60d2f013afb27d9"
        },
        {
          "name": "delete_voice",
          "title": "Delete a cloned or designed voice",
          "description": "Permanently delete one of your own cloned or designed voices. This cannot be undone, and any audio already generated with it is unaffected. Catalog voices can't be deleted. Use an id from list_voices.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The voice id to delete (from list_voices — must be one of your own clones or designs)",
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Which kind of voice it is. Omit to try both — list_voices reports the type of every voice.",
                "enum": ["clone", "designed"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e558cd567186374643bf758d5030f2b256a01644149c142b73c972ad08965f6d"
        },
        {
          "name": "design_voice",
          "title": "Design a voice from a description",
          "description": "Create brand-new voices from a written description — no recording needed. Returns up to 3 candidate previews, each with a listenable URL and a `preview_id`. Nothing is saved yet: pick the one you like and call save_designed_voice with its preview_id. Costs points (each preview is a real synthesis of the preview text).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many candidate voices to generate, 1–3 (default 3). Each one costs points.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "language": {
                "description": "Language name or code the voice should speak (e.g. \"English\", \"ES_ES\"). Defaults to auto-detect from the prompt — see list_voice_languages.",
                "type": "string"
              },
              "preview_text": {
                "description": "What the previews should say (max 1,000 characters). Defaults to a short sample line.",
                "maxLength": 1000,
                "type": "string"
              },
              "prompt": {
                "description": "Describe the voice in English, 30–250 characters: gender, age, accent, tone, pace and delivery. E.g. \"A warm, unhurried British woman in her forties, low and reassuring, like a documentary narrator.\"",
                "maxLength": 250,
                "minLength": 30,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3b39a01c11ab43d0a5de827d7fd7c1f51179aec9bb192de2b33f3ff1274b46d3"
        },
        {
          "name": "generate_speech",
          "title": "Generate speech",
          "description": "Convert text to speech with a VocalLab voice. Returns the generated audio inline, so you can play or save it without fetching anything — very long clips fall back to a download URL. Up to 2,000 characters per call (less on limited-access accounts; the error names the cap) — each call is one synthesis request; for longer scripts, split the text and call again. Costs points from your balance (API rate: 15 characters per second).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "delivery_mode": {
                "description": "How much the model varies its performance. v-studio ONLY — sending it with any other model is an error. v-studio ignores `temperature`; this is its equivalent.",
                "enum": ["STABLE", "BALANCED", "CREATIVE"],
                "type": "string"
              },
              "enhance_generation": {
                "description": "Denoise the generated audio. Works on every model. Default false — it can leave a voice sounding over-smoothed, so only enable it when the output actually has background noise.",
                "type": "boolean"
              },
              "format": {
                "description": "Audio format (default MP3)",
                "enum": ["MP3", "WAV", "OGG_OPUS", "FLAC"],
                "type": "string"
              },
              "model": {
                "description": "Speech model (default v-studio: steerable, follows expression instructions, 200+ languages). v-flash: same 200+ languages, ~5x faster, 3/4 points, not steerable. v-pro: highest fidelity in major languages, supports temperature. v-lite: faster, half the points. See list_models.",
                "enum": ["v-studio", "v-flash", "v-pro", "v-lite"],
                "type": "string"
              },
              "pronunciation_template": {
                "description": "Name or id of a pronunciation list saved in VocalLab Studio (Pronunciations). Applied together with `pronunciations`; entries passed in the call win.",
                "minLength": 1,
                "type": "string"
              },
              "pronunciations": {
                "description": "Words to say differently from how they are written: [{\"from\": \"tendine\", \"to\": \"tèndine\"}]. Whole-word, case-insensitive. Use it to fix a mispronounced word or name — respell it, or add a written stress accent (very effective in Italian and Spanish). Only the voice hears the replacement; billing and captions keep the original text.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "from": {
                      "description": "The word as written in the text",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "to": {
                      "description": "How it should be spoken instead (a respelling or an accented form)",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["from", "to"],
                  "type": "object"
                },
                "maxItems": 300,
                "type": "array"
              },
              "speed": {
                "description": "Speaking pace, 0.5–1.5 (1.0 = the voice's normal pace; lower is slower). Works on every model. Defaults to the voice's own preset — 1.0 for cloned and designed voices.",
                "maximum": 1.5,
                "minimum": 0.5,
                "type": "number"
              },
              "temperature": {
                "description": "Expressiveness, 0.7–1.5 (higher = more varied). v-pro and v-lite only — v-studio and v-flash ignore it; use `delivery_mode` on v-studio instead.",
                "maximum": 1.5,
                "minimum": 0.7,
                "type": "number"
              },
              "text": {
                "description": "The text to speak (max 2,000 characters per request)",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "voice": {
                "description": "A voice id from list_voices",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text", "voice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
