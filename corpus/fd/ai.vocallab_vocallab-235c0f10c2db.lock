              "name": {
                "description": "A name for the voice, e.g. \"Documentary Narrator\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "preview_id": {
                "description": "The preview_id returned by design_voice",
                "minLength": 1,
                "type": "string"
              },
              "tags": {
                "description": "Optional labels, e.g. [\"warm\", \"narration\"]",
