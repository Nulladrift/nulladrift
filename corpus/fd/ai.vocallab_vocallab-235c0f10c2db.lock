      "serverInfo": {
        "name": "vocallab",
        "title": "VocalLab",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "VocalLab: text to speech in 200+ languages, voice cloning, voice design and SRT captions. This session has no API key, so it can list the tools but not run them. To run tools, create a free key at https://vocallab.ai/developer and send it as 'Authorization: Bearer vl_live_…'.",
      "tools": [
        {
          "name": "clone_voice",
          "title": "Clone a voice from a recording",
          "description": "Create a voice that sounds like a specific person, from one short recording (about 30 seconds of clean speech). Almost any audio file works — MP3, WAV, M4A, AAC, OGG, FLAC, WebM and more are converted server-side, and anything longer than 30 seconds is trimmed. The audio must be passed as base64, so this suits a local file you can read and encode; there is no upload URL. Only clone a voice you own or have permission to use. Uses one of the cloned-voice slots included in the plan; costs no points.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audio_base64": {
                "description": "The recording, base64-encoded (no data: prefix). Any common audio format; up to ~8 MB of base64 (roughly a 6 MB file), trimmed to the first 30 seconds.",
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "The language spoken in the recording — a name or code from list_voice_languages (e.g. \"English\", \"EN_US\"). Use \"auto\" to let the provider detect it.",
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "A name for the cloned voice",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "remove_background_noise": {
                "description": "Clean up background noise before cloning (default true)",
                "type": "boolean"
              },
              "transcript": {
                "description": "What is said in the recording. Optional, but it noticeably improves the clone.",
                "type": "string"
              }
            },
            "required": ["audio_base64", "language", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7a61090ad4954f54fdd2e112eaf4a43fbc9e15f66ce5c783b51a4b60b550f780"
        },
        {
          "name": "delete_speech",
          "title": "Delete a VocalLab generation",
          "description": "Permanently delete a generation you own — both its stored audio file and its record. This cannot be undone. Use the id returned by generate_speech.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The generation id to delete",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
