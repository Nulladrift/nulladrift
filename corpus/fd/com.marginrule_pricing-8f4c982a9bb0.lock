      },
      "instructions": "Marginrule pricing agent. Free, read-only pricing math from dated, sourced fee rows for small online sellers (US sellers). Call list_platforms for platform ids, then price_for_margin (lowest whole-cent price that keeps a target margin after fees) or fees_breakdown (fees and take-home at a price), or discount_impact (what a percentage or dollar discount does to fees, profit and the sales needed to make up for it), or compare_plans (which selling plan keeps the most at your price and monthly sales, with break-even sales between tiers). Call data_version for the dataset version, check dates, hashes and sources, to cite or cache answers. Units. Every rate and margin is a FRACTION (0.30 = 30%). Money is USD. Every answer carries fees_as_of, source URLs, assumptions and this verify note. Verify on the platform's page before relying on it. Platforms change fees without notice; every rate here carries the date it was read and its source URL. Not tax or accounting advice. Not affiliated with any platform named.",
      "tools": [
        {
          "name": "compare_plans",
          "title": "Which plan keeps the most at my volume",
          "description": "Compares selling plans at a price and monthly sales volume for Payhip Free, Plus and Pro, Gumroad direct and Discover, Ko-fi Shop and Ko-fi Gold, and Shopify Basic billed monthly or yearly. Use it when a US seller asks which of those plans keeps the most after per-sale fees and monthly plan cost, or where the break-even between tiers falls. Do not use it for Etsy, Notion Marketplace or Square (they have no plan choice in the fee data, so use fees_breakdown), for sellers outside the US, for international cards, for Amazon FBA, for competitor repricing, for VAT, refunds, disputes, payout fees or ads. Inputs are price and sales_per_month. Optional processor, cost, and a platforms filter. A plan without sourced numbers is left out and named. US sellers, domestic cards. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cost": {
                "description": "Optional cost per item sold in USD, so the answer adds profit_per_month_usd and counts it in sales_to_cover_plan_cost. Default 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "platforms": {
                "description": "Optional filter: families (payhip, gumroad, ko-fi, shopify) and/or plan ids (payhip-free, payhip-plus, payhip-pro, gumroad-direct, gumroad-discover, ko-fi-shop, ko-fi-gold, shopify-basic-monthly, shopify-basic-yearly). Leave it out to compare every plan.",
                "items": {
                  "enum": ["payhip", "gumroad", "ko-fi", "shopify", "payhip-free", "payhip-plus", "payhip-pro", "gumroad-direct", "gumroad-discover", "ko-fi-shop", "ko-fi-gold", "shopify-basic-monthly", "shopify-basic-yearly"],
                  "type": "string"
                },
                "maxItems": 13,
                "minItems": 1,
                "type": "array"
              },
              "price": {
                "description": "Your sale price per item in USD before buyer sales tax, in whole cents, e.g. 17.",
                "maximum": 1000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "processor": {
                "description": "Card processor for the plans where you add your own (Payhip plans, Ko-fi Shop and Ko-fi Gold). \"stripe\" = 2.9% + $0.30 (default). \"paypal\" = PayPal Checkout or Guest Checkout, 3.49% + $0.49. Domestic cards only. Gumroad and Shopify charge their own processing.",
                "enum": ["stripe", "paypal"],
                "type": "string"
              },
              "sales_per_month": {
                "description": "How many sales you make (or expect) in a month, a whole number, e.g. 50.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["price", "sales_per_month"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which plan keeps the most at my volume"
