        },
        {
          "name": "discount_impact",
          "title": "What a discount does to fees and profit",
          "description": "Effect of a percentage or fixed-dollar discount (a sale or promo code) on one item: discounted price, fees and profit at list and at the discounted price, the profit lost per sale, and how many discounted sales it takes to earn the same profit as 100 sales at list. With an optional target_margin it also returns the deepest discount that still keeps that margin after fees. Rates and margins are FRACTIONS (0.25 = 25% off). US sellers only. Read-only; sells nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer_tax_rate": {
                "description": "Buyer's sales tax as a FRACTION, e.g. 0.07 for 7%. Default 0. Tax is never profit; it only raises card processing on platforms that charge processing on the tax-inclusive total (see each platform's tax_base).",
                "exclusiveMaximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "cost": {
                "description": "Optional cost per item in USD, so profit and margin are included. Default 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "discount_rate": {
                "description": "Percentage off as a FRACTION: 0.25 means 25% off, used to 6 decimals. Send this OR discount_usd, not both. The dollar amount off is rounded to the cent, half away from zero.",
                "exclusiveMaximum": 1,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "discount_usd": {
                "description": "Fixed dollars off per item, in whole cents, e.g. 5. Send this OR discount_rate, not both.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "list_price": {
                "description": "Regular price in USD before the discount and before buyer sales tax, in whole cents, e.g. 20.",
                "maximum": 1000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "platform": {
                "description": "Platform and plan id from list_platforms, e.g. \"etsy\", \"payhip-free\", \"gumroad-direct\", \"ko-fi-shop\".",
                "enum": ["etsy", "shopify-basic", "payhip-free", "payhip-plus", "payhip-pro", "gumroad-direct", "gumroad-discover", "ko-fi-shop", "notion-marketplace", "square-online", "square-in-person"],
                "type": "string"
              },
              "processor": {
                "description": "Card processor for platforms where the seller adds their own (Payhip plans, Ko-fi Shop). \"stripe\" = 2.9% + $0.30 (default). \"paypal\" = PayPal Checkout or Guest Checkout, 3.49% + $0.49. Ignored, with a note, for platforms that charge their own processing (Etsy, Shopify, Gumroad, Notion, Square).",
                "enum": ["stripe", "paypal"],
                "type": "string"
              },
              "processor_fixed_usd": {
                "description": "Advanced override: your card processor's fixed fee per sale in USD, e.g. 0.30. Replaces the preset's fixed fee.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "processor_rate": {
                "description": "Advanced override: your own card processor percentage as a FRACTION (0.029 = 2.9%). Only for platforms where the seller adds their own processor. Replaces the preset's rate.",
                "maximum": 0.2,
                "minimum": 0,
                "type": "number"
              },
              "region": {
                "description": "Buyer location relative to a US seller. \"us\" (default) = domestic. \"international\" is only modelled with processor \"paypal\" (adds PayPal's 1.50% international fee, so 4.99% + $0.49); other combinations return an error rather than a guess.",
                "enum": ["us", "international"],
                "type": "string"
              },
              "target_margin": {
                "description": "Optional target profit margin as a FRACTION (0.30 = 30%). If sent, the answer also gives the deepest discount off list_price that still keeps it, and whether this discount keeps it.",
                "exclusiveMaximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["list_price", "platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
