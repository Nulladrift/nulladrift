        {
          "name": "fees_breakdown",
          "title": "Fees and take-home at a price",
          "description": "Fees a platform takes from one sale at a given price, split into platform, listing and card processor parts, plus net after fees and, with an optional cost, profit and margin (a fraction). buyer_tax_rate is a FRACTION (0.07 = 7%). US sellers only. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer_tax_rate": {
                "description": "Buyer's sales tax as a FRACTION, e.g. 0.07 for 7%. Default 0. Tax is never profit; it only raises card processing on platforms that charge processing on the tax-inclusive total (see each platform's tax_base).",
                "exclusiveMaximum": 1,
