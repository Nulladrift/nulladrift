        {
          "name": "list_platforms",
          "title": "List platforms and fee presets",
          "description": "Every platform and plan this server knows (Etsy, Shopify Basic, Payhip Free/Plus/Pro, Gumroad direct/Discover, Ko-fi Shop, Notion Marketplace, Square online/in person) with its rates as fractions, fixed and listing fees in USD, monthly plan fee, whether it sells digital downloads, whether the seller adds their own processor, the tax-base flag, fees-as-of date and source URLs. Also the card processor presets. Call this first to get valid platform ids.",
