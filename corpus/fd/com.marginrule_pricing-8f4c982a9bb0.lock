                "description": "Etsy only. Optional Offsite Ads flag. \"none\" (the default) leaves the fee out, so answers match earlier callers. \"under_10k\" adds 15% of the item price for a shop that has always made less than $10,000 USD in any consecutive 365-day period. \"10k_plus\" adds 12% for a shop that has made $10,000 USD or more in any consecutive 365-day period. Etsy charges this fee on the order total, which also includes any shipping and gift wrap the seller charges, so add the same rate on those amounts. The cap is $100 per order, and this tool treats the item as a one-item order. The fee applies only to orders Etsy attributes to an Offsite Ad. Other platforms reject any value except \"none\".",
