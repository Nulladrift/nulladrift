                "enum": ["etsy", "shopify-basic", "payhip-free", "payhip-plus", "payhip-pro", "gumroad-direct", "gumroad-discover", "ko-fi-shop", "notion-marketplace", "square-online", "square-in-person"],
                "type": "string"
              },
              "price": {
                "description": "Sale price in USD before buyer sales tax, in whole cents, at least 0.01, e.g. 17.",
                "maximum": 1000000000,
