        },
        {
          "name": "discount_impact",
          "title": "What a discount does to fees and profit",
          "description": "Shows what a percentage or fixed-dollar discount on one item does to fees and profit at list and at the discounted price. It also reports the profit lost per sale and how many discounted sales it takes to match 100 sales at list. Use it when a US seller asks about a sale or promo code on Etsy, Shopify Basic, Payhip, Gumroad, Ko-fi, Notion Marketplace or Square. With optional target_margin it also returns the deepest discount that still keeps that margin after fees. Do not use it for sellers outside the US, for order-level discounts, free shipping offers, platform-funded promotions, VAT, Amazon FBA or competitor repricing. Inputs are platform, list_price, and either discount_rate or discount_usd. Rates and margins are FRACTIONS (0.25 means 25% off). Optional cost, target_margin, processor, and on Etsy offsite_ads (none, under_10k or 10k_plus). Default offsite_ads is none, which leaves ads out. Optional cross_border is none, international, currency_conversion or both. Default is none, which leaves those fees out. Rates are dated and sourced, so read assumptions and verify before quoting. US sellers only. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer_tax_rate": {
                "description": "Buyer's sales tax as a FRACTION, e.g. 0.07 for 7%. Default 0. Tax is never profit; it only raises card processing on platforms that charge processing on the tax-inclusive total (see each platform's tax_base).",
                "exclusiveMaximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "cost": {
                "description": "Optional cost per item in USD, so profit and margin are included. Default 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "cross_border": {
                "description": "Optional cross-border and currency-conversion fees, from official pages opened 2026-11-20. \"none\" (the default) leaves them out, so answers match earlier callers. \"international\" adds the sourced extra fee on an international card or cross-border receipt (Shopify Payments 1% on a US store, Stripe 1.5%, PayPal 1.50%, Square 1.5%). \"currency_conversion\" adds the sourced conversion fee (Etsy 2.5% when listing currency differs from the Payment account, Shopify Payments 1.5% for a US store, Stripe 1%, PayPal 3% under a labelled assumption). \"both\" adds each as its own line. The fee is applied to the item price. Official pages often also count shipping or gift wrap in the base, so add the same rate on those amounts. Currency conversion applies only when the sale currency differs from the payout currency, not merely because the buyer is abroad. Where a platform page states no rate, that line is marked not_modelled and adds nothing. That is not a statement that the fee is $0. compare_plans does not take this field.",
                "enum": ["none", "international", "currency_conversion", "both"],
                "type": "string"
              },
              "discount_rate": {
                "description": "Percentage off as a FRACTION: 0.25 means 25% off, used to 6 decimals. Send this OR discount_usd, not both. The dollar amount off is rounded to the cent, half away from zero.",
                "exclusiveMaximum": 1,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "discount_usd": {
                "description": "Fixed dollars off per item, in whole cents, e.g. 5. Send this OR discount_rate, not both.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "list_price": {
                "description": "Regular price in USD before the discount and before buyer sales tax, in whole cents, e.g. 20.",
                "maximum": 1000000000,
                "minimum": 0.01,
                "type": "number"
              },
              "offsite_ads": {
                "description": "Etsy only. Optional Offsite Ads flag. \"none\" (the default) leaves the fee out, so answers match earlier callers. \"under_10k\" adds 15% of the item price for a shop that has always made less than $10,000 USD in any consecutive 365-day period. \"10k_plus\" adds 12% for a shop that has made $10,000 USD or more in any consecutive 365-day period. Etsy charges this fee on the order total, which also includes any shipping and gift wrap the seller charges, so add the same rate on those amounts. The cap is $100 per order, and this tool treats the item as a one-item order. The fee applies only to orders Etsy attributes to an Offsite Ad. Other platforms reject any value except \"none\".",
                "enum": ["none", "under_10k", "10k_plus"],
                "type": "string"
              },
              "platform": {
                "description": "Platform and plan id from list_platforms, e.g. \"etsy\", \"payhip-free\", \"gumroad-direct\", \"ko-fi-shop\".",
                "enum": ["etsy", "shopify-basic", "payhip-free", "payhip-plus", "payhip-pro", "gumroad-direct", "gumroad-discover", "ko-fi-shop", "notion-marketplace", "square-online", "square-in-person"],
                "type": "string"
              },
              "processor": {
                "description": "Card processor for platforms where the seller adds their own (Payhip plans, Ko-fi Shop). \"stripe\" = 2.9% + $0.30 (default). \"paypal\" = PayPal Checkout or Guest Checkout, 3.49% + $0.49. Ignored, with a note, for platforms that charge their own processing (Etsy, Shopify, Gumroad, Notion, Square).",
                "enum": ["stripe", "paypal"],
                "type": "string"
              },
              "processor_fixed_usd": {
                "description": "Advanced override: your card processor's fixed fee per sale in USD, e.g. 0.30. Replaces the preset's fixed fee.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "processor_rate": {
                "description": "Advanced override: your own card processor percentage as a FRACTION (0.029 = 2.9%). Only for platforms where the seller adds their own processor. Replaces the preset's rate.",
                "maximum": 0.2,
                "minimum": 0,
                "type": "number"
              },
              "region": {
                "description": "Buyer location relative to a US seller. \"us\" (default) = domestic. \"international\" is only modelled with processor \"paypal\" (adds PayPal's 1.50% international fee, so 4.99% + $0.49); other combinations return an error rather than a guess.",
                "enum": ["us", "international"],
                "type": "string"
              },
              "target_margin": {
                "description": "Optional target profit margin as a FRACTION (0.30 = 30%). If sent, the answer also gives the deepest discount off list_price that still keeps it, and whether this discount keeps it.",
                "exclusiveMaximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["list_price", "platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What a discount does to fees and profit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
