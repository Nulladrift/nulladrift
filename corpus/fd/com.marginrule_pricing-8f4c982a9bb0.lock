      "serverInfo": {
        "name": "marginrule-pricing",
        "title": "Marginrule pricing agent",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Marginrule pricing agent: free, read-only, fee-accurate pricing math for small online sellers (US sellers). Call list_platforms for platform ids, then price_for_margin (lowest whole-cent price that keeps a target margin after fees) or fees_breakdown (fees and take-home at a price), or discount_impact (what a percentage or dollar discount does to fees, profit and the sales needed to make up for it). Units: every rate and margin is a FRACTION (0.30 = 30%); money is USD. Every answer carries fees_as_of, source URLs, assumptions and a verify note: Verify on the platform's page before relying on it. Platforms change fees without notice; every rate here carries the date it was read and its source URL. Not tax or accounting advice. Not affiliated with any platform named.",
      "tools": [
        {
          "name": "data_version",
          "title": "Fee data version and sources",
          "description": "Dataset version, fees-as-of date per platform and processor, SHA-256 of the embedded fee data and engine, and every source URL. Use it to cite or cache answers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fee data version and sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
