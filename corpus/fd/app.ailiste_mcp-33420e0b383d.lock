      "instructions": "ailiste (https://ailiste.app) is a map of new builds in Cyprus: Limassol, Paphos, Larnaca, Nicosia and Famagusta\n(Ayia Napa, Protaras and Paralimni). For each building it has our own photographs and the stage our team saw, with\nthe day; the developer; renders; floors, homes, bedrooms and delivery. For each district: the asking price per square\nmetre and for a whole home.\n\nThe tools: `search` finds anything with a name - a building, a developer, a district, a city - in any language;\n`find_buildings` lists buildings by place, size, type and stage; `get_building` gives one building; `district_prices`\ngives a place's prices; `get_developer` gives a company.\n\nEvery answer carries the ailiste.app link of what it describes. Prices are asking prices in adverts, not sale prices.\n`seen_by_us` is the day our team stood at the building; a stage without it is what its portal lists. For a building,\n`for_sale` is what its page lists for sale by size - how many offers, their asking prices and areas - and\n`developer_homes` how many of the developer's own homes are still available; `location` is where the map draws it.\nWhat the tools return is all ailiste has on a building: no floor plans, and no advert's own link or seller, which open\non its ailiste page behind a sign-in.\n",
      "tools": [
        {
          "name": "district_prices",
          "title": "District asking prices",
          "description": "Asking prices in one district or city of Cyprus for one kind of home: per square metre and for the\nwhole home - the median, the mean and the middle half - with the number of homes they stand on, the\nday, and the city's median beside a district's. `bedrooms` 0 to 4 for apartments, 2 to 5 for houses.\nThey are asking prices in adverts, each home counted once - not sale prices.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "default": 2,
                "description": "The number of bedrooms: 0 (a studio) to 4 for apartments, 2 to 5 for houses.",
                "maximum": 5,
                "minimum": 0,
                "title": "Bedrooms",
                "type": "integer"
              },
              "kind": {
                "default": "apartments",
                "description": "Apartments or houses.",
                "enum": ["apartments", "houses"],
                "title": "Kind",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The language of the names and links in the answer: en (English), el (Greek), ru (Russian), uk (Ukrainian), he (Hebrew) or zh (Chinese).",
                "enum": ["en", "el", "ru", "uk", "he", "zh"],
                "title": "Lang",
                "type": "string"
              },
              "place": {
                "description": "The district, village or city - its name in any language, or its ailiste id.",
                "title": "Place",
                "type": "string"
              }
            },
            "required": ["place"],
            "title": "district_pricesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:042592617259266329e2a4566a99ae31eed548ef29448a5d01489066bcf8268e"
        },
        {
          "name": "find_buildings",
          "title": "Find new buildings",
          "description": "List new-build projects in Cyprus that match every filter given, 10 at a time (pass `offset` to go\non). `city`, `district` and `developer` take a name in any language or an ailiste id; a\ndistrict includes its quarters. `bedrooms` keeps buildings that have homes of that size (0 = studio).\n`stage`: plot, groundworks, frame, closed (walls and windows in), finished, lived_in, stalled - or\nunder_construction, or ready. `delivered_by` is a year. `seen_by_us` keeps the buildings our team has\nstood at. Those come first in any list. Homes handed over before 2020 are not listed.",
          "inputSchema": {
            "properties": {
              "bedrooms": {
                "description": "Only buildings with homes of this many bedrooms. 0 is a studio.",
                "minimum": 0,
                "title": "Bedrooms",
                "type": "integer"
              },
              "city": {
                "description": "Only this city: Limassol, Paphos, Larnaca, Nicosia or Famagusta - its name in any language, or its ailiste id.",
                "title": "City",
                "type": "string"
              },
              "delivered_by": {
                "description": "Only buildings to be handed over by the end of this year, such as 2027. A building with no delivery date is left out.",
                "title": "Delivered By",
                "type": "integer"
              },
              "developer": {
                "description": "Only this developer's buildings - its name in any language, or its ailiste id.",
                "title": "Developer",
                "type": "string"
              },
              "district": {
                "description": "Only this district or village - its name in any language, or its ailiste id. A district includes its quarters.",
                "title": "District",
                "type": "string"
              },
              "kind": {
                "description": "Only apartments, or only villas.",
                "enum": ["apartments", "villas"],
                "title": "Kind",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The language of the names and links in the answer: en (English), el (Greek), ru (Russian), uk (Ukrainian), he (Hebrew) or zh (Chinese).",
                "enum": ["en", "el", "ru", "uk", "he", "zh"],
                "title": "Lang",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "How many buildings to skip: 0 for the first 10, then the next_offset an answer gives.",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "pool": {
                "default": false,
                "description": "Only buildings with a pool.",
                "title": "Pool",
                "type": "boolean"
              },
              "sea_view": {
                "default": false,
                "description": "Only buildings with a view of the sea.",
                "title": "Sea View",
                "type": "boolean"
              },
              "seen_by_us": {
                "default": false,
                "description": "Only buildings our team has stood at, with our own photographs and the day.",
                "title": "Seen By Us",
                "type": "boolean"
              },
              "stage": {
                "description": "Only buildings at this stage: plot, groundworks, frame, closed (walls and windows in), finished, lived_in or stalled. under_construction is groundworks, frame or closed; ready is finished or lived_in.",
                "enum": ["plot", "groundworks", "frame", "closed", "finished", "lived_in", "stalled", "under_construction", "ready"],
                "title": "Stage",
                "type": "string"
              }
            },
            "title": "find_buildingsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
