        {
          "name": "get_building",
          "title": "Building details",
          "description": "Everything ailiste's page says about one building, by its ailiste id or its page's address: the\ndeveloper and its site, the stage and the day we saw it, our photographs, delivery, floors, homes,\nbedrooms, sizes, views, amenities, where the map draws it, the asking price it starts at, and what is\nfor sale in it by size - the asking prices and areas its page lists - with how many of the developer's\nown homes are available. The adverts' own links and sellers are not returned.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The building's ailiste id, 8 letters and digits, or the address of its ailiste page.",
                "title": "Id",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The language of the names and links in the answer: en (English), el (Greek), ru (Russian), uk (Ukrainian), he (Hebrew) or zh (Chinese).",
                "enum": ["en", "el", "ru", "uk", "he", "zh"],
                "title": "Lang",
                "type": "string"
              }
            },
            "required": ["id"],
            "title": "get_buildingArguments",
            "type": "object"
          },
