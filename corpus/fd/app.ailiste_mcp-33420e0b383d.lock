          "name": "search",
          "title": "Search by name",
          "description": "Find buildings, developers, districts and cities of Cyprus on ailiste by name, in any language\n(English, Greek, Russian, Ukrainian, Hebrew, Chinese); a typo is forgiven. At most 8 matches, best\nfirst, each with its ailiste page. `lang` is the language of the names and links given back.",
          "inputSchema": {
