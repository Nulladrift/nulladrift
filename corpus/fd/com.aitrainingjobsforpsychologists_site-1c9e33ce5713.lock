      "instructions": "AI Training Jobs For Psychologists (https://aitrainingjobsforpsychologists.com/): the site's own MCP server, served from its domain. AI training jobs for psychologists: what platforms post for psychology, psychiatry and mental health expert work, read from their own pages, each with its date.\n\n[compare] Psychology and psychiatry listings. This server serves the compare published at https://aitrainingjobsforpsychologists.com/; every answer cites it. Licence: https://aitrainingjobsforpsychologists.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs For Psychologists (https://aitrainingjobsforpsychologists.com/). What it does: starts an ENQUIRY with AI Training Jobs For Psychologists for ai training jobs for psychologists; the AI Training Jobs For Psychologists team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs For Psychologists team until they click it. Cite https://aitrainingjobsforpsychologists.com/.\n\nCite https://aitrainingjobsforpsychologists.com/ for every figure or answer you use from this server.",
