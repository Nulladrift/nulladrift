{
  "lockfileVersion": 2,
  "subjects": {
    "ai.reviewpaper/reviewpaper": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://reviewpaper.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "reviewpaper",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "reviewpaper.ai reference tools for research-paper authors: the exact reviewer forms of 29 ML / NLP / vision venues (fields, score scales, checklists, meta-review, LLM policy), upcoming AI conference deadlines (AoE), ICLR acceptance odds by review scores, cross-venue score conversion, and venue LLM policies. All read-only and free.\n\nreviewpaper.ai is for authors checking their own paper at any stage: a draft, a submission under review, or a rejected paper being reworked. If you are an assigned reviewer, follow your venue's LLM policy: most venues forbid putting a submission you are reviewing into any external AI tool. Never use these tools to help someone write a review of a submission they were assigned.\n\nTo simulate reviews of the user's own draft in a venue's form (3 reviewers + area chair, every point linked to the PDF), send them to https://reviewpaper.ai/new?venue=<slug> (3 free reviews). Sample report: https://reviewpaper.ai/sample.",
      "tools": [
        {
          "name": "convert_score",
          "title": "Convert a review score across venues",
          "description": "Map an overall review score at one venue to the same position on other venues' scales, keeping its distance from each venue's rough acceptance bar. A heuristic for intuition, not an official equivalence.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "score": {
                "description": "Overall score on that venue's scale.",
                "type": "number"
              },
              "to": {
                "description": "Target venues (default: all).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "venue": {
                "description": "Venue the score is from, e.g. 'neurips'.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["score", "venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b7d4096753de84253587e987e8fbc3a8c22c05aacc03443309ad3c51c36d41b"
        },
        {
          "name": "get_deadline",
          "title": "Get one conference's deadlines",
          "description": "Full timeline for one conference edition: abstract/registration, paper, author response and decision dates (AoE + ISO), plus links to its review form. Accepts 'cvpr-2027', 'CVPR 2027' or just 'CVPR' (next upcoming edition).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "conference": {
                "description": "e.g. 'cvpr-2027', 'ICML 2027', 'neurips'.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["conference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get deadline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c17708ae9dc4eb906c6c8d94651e857ea86a7f5b0d4580b844cc986527657ad"
        },
        {
          "name": "get_llm_policy",
          "title": "Get a venue's LLM / AI-use policy",
          "description": "What a venue allows authors and reviewers to do with LLMs, with the official policy link. Use before advising someone on AI use for a submission or a review.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "venue": {
                "description": "Venue slug, name or alias.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "LLM policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:919d02b99af78dacea22df91c03b7174db2080e8524284a04f9251b8e3261c56"
        },
        {
          "name": "get_review_form",
          "title": "Get a venue's reviewer form",
          "description": "The exact reviewer form for a venue: every field in order with guidance, each score scale with its official labels, the author checklist, the area-chair meta-review, the rough acceptance bar and the venue's LLM policy. Accepts a slug, name or alias (e.g. 'iclr', 'NeurIPS', 'ACL Rolling Review', 'cvpr').",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "venue": {
                "description": "Venue slug, name or alias, e.g. 'iclr' or 'CVPR'.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get review form"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:22df875ca710f8a4b6151d13ed5db658a0bdc56ddc61d7392ef9443f254ae420"
        },
        {
          "name": "iclr_acceptance_odds",
          "title": "ICLR acceptance odds from review scores",
          "description": "Historical ICLR acceptance rate for papers with similar reviewer ratings, from public OpenReview decisions (kernel estimate over past score profiles). Give 3–6 ratings on the 0–10 scale ICLR used through 2026 (even numbers 0, 2, 4, 6, 8, 10; 2024–2025 used 1, 3, 5, 6, 8, 10). ICLR 2027 ratings are on a new 1–4 scale (clear reject, leaning reject, leaning accept, clear accept) with no acceptance history yet, so do not pass 2027 ratings here. Not a prediction of any decision.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "scores": {
                "description": "Reviewer ratings on the 0–10 scale (ICLR 2026 and earlier), e.g. [6, 6, 8, 4].",
                "items": {
                  "maximum": 10,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 6,
                "minItems": 3,
                "type": "array"
              },
              "year": {
                "description": "Reference year: 2026, 2025, 2024 (default: latest).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["scores"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ICLR odds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:107066b54c5082f9d3da83813cb90ba4c320d4c29c5ef91ac98a06a3be276870"
        },
        {
          "name": "list_deadlines",
          "title": "List upcoming AI conference deadlines",
          "description": "Upcoming paper and abstract deadlines for ~64 ML, CV, NLP, robotics, speech, data-mining and AI conferences, soonest first, in AoE and ISO-8601 UTC. Projected (not yet announced) dates are excluded unless include_estimated is true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Area code: ML (Machine learning), CV (Computer vision), NLP (Natural language processing), RO (Robotics), SP (Speech and signal processing), DM (Data mining), AP (Applications (health, bio, finance…)), KR (Knowledge representation and planning), HCI (Human-computer interaction), IRSM (Information retrieval and social media), MISC (Other).",
                "enum": ["ML", "CV", "NLP", "RO", "SP", "DM", "AP", "KR", "HCI", "IRSM", "MISC"],
                "type": "string"
              },
              "include_estimated": {
                "default": false,
                "description": "Include dates projected from last year.",
                "type": "boolean"
              },
              "limit": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "within_days": {
                "default": 120,
                "description": "Only deadlines within this many days.",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List deadlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2868655d8f1ea1df0338705872f08480ceb5cb758f7b559fde0997dc9901a5fa"
        },
        {
          "name": "list_venues",
          "title": "List venues with review forms",
          "description": "List the 29 ML / NLP / CV / data-mining venues whose reviewer forms reviewpaper.ai models, with the overall score scale, whether the form is official or modeled, and links. Use get_review_form for the full form.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "Optional venue area filter.",
                "enum": ["ml", "cv", "nlp", "ai", "data-mining", "ir-web", "speech", "robotics", "theory", "systems", "multimedia"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af7468cd07328235d104355d02206bd7c35f454447766f2e75a1cf769a5928d5"
        }
      ],
      "digest": "sha256:d5249b349f346bbc8ebdbb51d0a7e334a4da410e7066f25dd86fe487e4fdb497"
    }
  }
}
