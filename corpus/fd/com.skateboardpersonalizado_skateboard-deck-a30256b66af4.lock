{
  "lockfileVersion": 2,
  "subjects": {
    "com.skateboardpersonalizado/skateboard-deck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://skateboardpersonalizado.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "skateboard-personalizado",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Skateboard Personalizado turns artwork into a real custom skateboard deck. The client supplies the artwork as image bytes or as a composition of shapes and text. get_deck_spec returns the deck’s dimensions, formats and price. create_deck fits the design to the deck and returns viewUrl, where the person reviews, edits and orders it, plus a picture of the deck assembled in 3D (trucks and wheels for reference, sold separately). Links are unlisted. The tools never order or pay.",
      "tools": [
        {
          "name": "create_deck",
          "title": "Create skateboard deck",
          "description": "Saves finished artwork on a skateboard deck and returns a browser link for 3D preview, editing and ordering, plus a picture of the deck assembled with trucks and wheels. Takes exactly one of image_base64 or composition. Stores an unlisted design; it generates no AI artwork and places no order. Each successful call creates a new design.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "background": {
                "default": "#FFFFFF",
                "description": "Six-digit hex colour that fills the deck around an image placed with contain.",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "composition": {
                "additionalProperties": false,
                "description": "Alternative to an image: flat artwork in 1000 × 3833 units. Shapes use top-left x/y; text x/y is its baseline centre. Text can rotate -90 degrees along the deck.",
                "properties": {
                  "background": {
                    "default": "#FFFFFF",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "elements": {
                    "items": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "fill": {
                              "pattern": "^#[0-9a-fA-F]{6}$",
                              "type": "string"
                            },
                            "height": {
                              "exclusiveMinimum": 0,
                              "maximum": 3833,
                              "type": "number"
                            },
                            "type": {
                              "const": "rect",
                              "type": "string"
                            },
                            "width": {
                              "exclusiveMinimum": 0,
                              "maximum": 1000,
                              "type": "number"
                            },
                            "x": {
                              "maximum": 1000,
                              "minimum": 0,
                              "type": "number"
                            },
                            "y": {
                              "maximum": 3833,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["fill", "height", "type", "width", "x", "y"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "fill": {
                              "pattern": "^#[0-9a-fA-F]{6}$",
                              "type": "string"
                            },
                            "height": {
                              "exclusiveMinimum": 0,
                              "maximum": 3833,
                              "type": "number"
                            },
                            "type": {
                              "const": "ellipse",
                              "type": "string"
                            },
                            "width": {
                              "exclusiveMinimum": 0,
                              "maximum": 1000,
                              "type": "number"
                            },
                            "x": {
                              "maximum": 1000,
                              "minimum": 0,
                              "type": "number"
                            },
                            "y": {
                              "maximum": 3833,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["fill", "height", "type", "width", "x", "y"],
                          "type": "object"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "fill": {
                              "pattern": "^#[0-9a-fA-F]{6}$",
                              "type": "string"
                            },
                            "font": {
                              "default": "Anton",
                              "enum": ["Anton", "Bangers", "Righteous"],
                              "type": "string"
                            },
                            "fontSize": {
                              "maximum": 500,
                              "minimum": 12,
                              "type": "number"
                            },
                            "rotation": {
                              "default": 0,
                              "maximum": 180,
                              "minimum": -180,
                              "type": "number"
                            },
                            "text": {
                              "maxLength": 80,
                              "minLength": 1,
                              "pattern": "^[^\\u0000-\\u001f\\u007f<>]*$",
                              "type": "string"
                            },
                            "type": {
                              "const": "text",
                              "type": "string"
                            },
                            "x": {
                              "maximum": 1000,
                              "minimum": 0,
                              "type": "number"
                            },
                            "y": {
                              "maximum": 3833,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["fill", "fontSize", "text", "type", "x", "y"],
                          "type": "object"
                        }
                      ]
                    },
                    "maxItems": 32,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["elements"],
                "type": "object"
              },
              "fit": {
                "default": "contain",
                "description": "contain preserves the whole image; cover crops to fill the deck. The deck silhouette always clips the corners.",
                "enum": ["contain", "cover"],
                "type": "string"
              },
              "image_base64": {
                "description": "PNG, JPEG or WebP file bytes as base64, optionally a data URL. Must be the bytes of an existing file; artwork made of shapes and text goes in composition.",
                "maxLength": 11250347,
                "type": "string"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "ca", "en", "fr", "de", "it", "cs"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create skateboard deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d911c70332bdf548a25ead498bb754a89b1a67cbf2e0febcc51a922e58822abe"
        },
        {
          "name": "get_deck_spec",
          "title": "Get deck specifications",
          "description": "Get artwork dimensions, supported formats, upload alternative and current deck price before preparing a design.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
