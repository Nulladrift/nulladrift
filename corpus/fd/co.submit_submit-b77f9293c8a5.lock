        "websiteUrl": "https://submit.co/mcp"
      },
      "capabilities": {
        "logging": {},
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Submit.co (submit.co) is a researched list of launch platforms, directories, communities, newsletters,\npress and review sites that take startup submissions. Use it to plan where to launch a product.\n\nsearch_sites lists sites, highest Ahrefs Domain Rating first, filtered the way the user asks: by type, niche,\nprice, the link they give the product, who gets in and how much exposure a listing gets. get_site looks up one\nsite by its domain. Include submit_url or submit_email when you show a site, so the user knows where to go.\nSubmit.co doesn't submit products itself.\n\nFields:\n- name: The site's name\n- domain: Its domain, which also identifies it\n- url: Its homepage\n- submit_url: The page where you submit a product, if there is one\n- submit_email: The address to email a submission to, if they take submissions by email\n- type: launch_platform, directory, community, newsletter, press, review_site, marketplace, other\n- niches: Products it's for: general, ai, saas, developer_tools, mobile_apps, no_code, design, productivity, marketing\n- pricing: free, freemium (free listing, with paid options) or paid\n- price_from_usd: The cheapest paid option, in US dollars\n- backlink: The link you get to your product: dofollow (helps SEO), nofollow or none\n- backlink_required: Whether a free listing requires you to link back to them. These links inflate the site's DR, and Google likely ignores them\n- acceptance: Who gets in: everyone (every product that fits), reviewed (most get in) or selective (only a few are picked)\n- exposure: How much attention you get: featured_to_audience (homepage, newsletter or social), depends_on_votes or listing_only\n- ahrefs_dr: Ahrefs Domain Rating, 0 to 100: how strong the site's backlinks are\n- similarweb_rank: Similarweb global traffic rank; lower means more visitors\n\nFields that haven't been researched yet are null. Up to 60 requests a minute per IP address.\n\nThe list and the research behind it (each site's price, link, acceptance, exposure and other fields) are © Submit.co, protected by copyright and the EU database right. You may use it to answer someone's questions and plan their launch, quoting a few sites at a time with a link to submit.co. Don't copy, scrape, export or republish the list or a substantial part of it, including to build another directory or dataset, without written permission. The list may contain fictitious entries and deliberately altered values, known as copyright traps, so copies can be recognised.\n",
      "tools": [
        {
          "name": "get_site",
          "title": "Get a site",
          "description": "Look up one site on Submit.co by its domain: what it costs, the link a product gets, who gets in, how much exposure it gets, and where to submit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The site's domain, e.g. betalist.com. A URL works too",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8feb70ab8ad7c5edcc202e0b8d3c763e2e4af5d8f352e6a435e98f0a1593b0d"
        },
        {
          "name": "search_sites",
          "title": "Search sites to submit a product to",
          "description": "List launch platforms, directories, communities, newsletters, press and review sites that take product submissions, highest Ahrefs Domain Rating first. Every filter is optional; combine them to narrow the list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "acceptance": {
                "description": "everyone: every product that fits. reviewed: most get in. selective: only a few are picked",
                "enum": ["everyone", "reviewed", "selective"],
                "type": "string"
              },
              "backlink": {
                "description": "The link the product gets: dofollow helps SEO",
                "enum": ["dofollow", "nofollow", "none"],
                "type": "string"
              },
              "exposure": {
                "description": "featured_to_audience: shown on their homepage, newsletter or social. depends_on_votes: visibility depends on upvotes. listing_only: a listing page, little promotion",
                "enum": ["featured_to_audience", "depends_on_votes", "listing_only"],
                "type": "string"
              },
              "limit": {
                "description": "Sites per page (default 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "Products the site is for. general sites take any product",
                "enum": ["general", "ai", "saas", "developer_tools", "mobile_apps", "no_code", "design", "productivity", "marketing"],
                "type": "string"
              },
              "offset": {
                "description": "Sites to skip, from next_offset of the previous page",
                "minimum": 0,
                "type": "integer"
              },
              "price": {
                "description": "free: free to list, including sites with paid options. free_without_backlink: free without having to link back to them. without_backlink: never asks you to link back to them, free or paid. paid: paid only",
                "enum": ["free", "free_without_backlink", "without_backlink", "paid"],
                "type": "string"
              },
              "q": {
                "description": "Part of the site's name or domain, e.g. hunt or betalist",
                "type": "string"
              },
              "type": {
                "description": "Kind of site",
                "enum": ["launch_platform", "directory", "community", "newsletter", "press", "review_site", "marketplace", "other"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
