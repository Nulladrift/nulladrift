  "subjects": {
    "co.leviathansystems/public-content": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.leviathansystems.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "co.leviathansystems/public-content",
        "title": "Leviathan Systems Public Content",
        "version": "1.0.0",
        "websiteUrl": "https://www.leviathansystems.co/developers"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Retrieve published Leviathan Systems information and canonical sources. Educational articles do not establish company capabilities. Confirm physical service scope and availability with the team. These read-only tools do not create quotations, bookings, purchases or project approvals.",
      "tools": [
        {
          "name": "read_company_profile",
          "title": "Read company profile and service boundaries",
          "description": "Read Leviathan Systems' public company identity, physical service scope, exclusions and contact guidance. Select a smaller view when only services or scope boundaries are needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "view": {
                "description": "Return the full public profile (default), service listings, or responsibility boundaries.",
                "enum": ["full", "services", "boundaries"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:494e0eee6443b7f15b50d4f0b52cfcdcc2d2ed44c5846606f527d7b649e2f2cc"
        },
        {
          "name": "read_resource",
          "title": "Read a published resource",
          "description": "Read a resource returned by search_resources. Returns native Markdown when available, or the canonical HTML link for preserved legacy articles. Accepts catalog IDs, never arbitrary URLs or file paths.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Exact published catalog ID, for example service:rack-and-stack.",
                "maxLength": 210,
                "pattern": "^(article|service):[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cd29baac29bf722d774e74458c5a8c1738b74158d862f1cca57612865da39a4a"
        },
        {
          "name": "search_resources",
          "title": "Search published resources",
          "description": "Find published article titles and physical service listings. Matches every query word in the title. Follow next_cursor with the same query and kind to read more.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "An opaque next_cursor from the same query and content revision.",
                "maxLength": 100,
                "type": "string"
              },
              "kind": {
                "description": "Restrict the catalog to educational articles or physical services.",
                "enum": ["article", "service"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum records in this page, from 1 to 50; default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Words to match in published titles; every word must match.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9094afddeffb614df7d3786a004cdc9640650ca08a0bf6c10515d6bdfc7093b0"
        }
      ],
      "resources": [
        {
          "uri": "leviathan://company/profile",
          "name": "company-profile",
          "title": "Company profile and service boundaries",
          "mimeType": "text/markdown",
          "digest": "sha256:9b15fd4d40fe8db57a5eb8e882fb9c920e059df9671962adaa63e53d0f9884db"
        },
        {
          "uri": "leviathan://content/index",
          "name": "content-index",
          "title": "Published resource index, first page",
          "mimeType": "application/json",
          "digest": "sha256:04e39fb2eee98dbe4bd4ef961a2ddddedcfe9e83a6e2c04f7adaf463b91312a3"
        }
      ],
      "digest": "sha256:66b74e8e5ba199ee78428410d9387ec07ca12fefa7acdc65f722ef27cbca1aa0"
    }
  }
}
