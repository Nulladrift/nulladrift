          "digest": "sha256:b9b7619856b7526120b22cdf4e8db35ad3e2926164b08263031017e25fe8e3b4"
        },
        {
          "name": "poyo_upload_file",
          "title": "Upload a file for model input",
          "description": "Upload a local image, audio or video file (base64, up to 20 MB) and get a temporary public HTTPS URL to pass as a model input. Files expire after 72 hours. Free; limited to 10 uploads per minute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
