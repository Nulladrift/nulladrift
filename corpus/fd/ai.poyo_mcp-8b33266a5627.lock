                "description": "File size in bytes."
              },
              "url": {
                "description": "Public HTTPS URL of the uploaded file, valid for 72 hours."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Upload a file for model input"
          },
          "behavior": {
            "destructive": false,
