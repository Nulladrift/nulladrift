        {
          "name": "poyo_run_model",
          "title": "Run a generation model",
          "description": "Start an image, video, audio or 3D generation and wait up to wait_seconds for the result. Returns the task with status queued, running, succeeded or failed; if it is not finished, poll poyo_check_job with its task_id instead of submitting again. SPENDS CREDITS from the account's PoYo balance: check the price with poyo_get_pricing, tell the user which model will run and what it costs, and get their confirmation first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "The model's input fields exactly as listed by poyo_get_model_schema. Images, video and audio go in as public HTTPS URLs.",
                "type": "object"
              },
              "model": {
                "description": "PoYo model ID from poyo_search_models, e.g. gpt-6-luna, claude-sonnet-5-5 or kling-4.0.",
                "type": "string"
              },
              "wait_seconds": {
                "default": 30,
                "description": "How long to wait for the result, 0 to 30 seconds. Default 30.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["input", "model"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "files": {
                "description": "Output files with URLs once the task succeeded."
              },
              "poll_after_seconds": {
                "description": "Suggested wait before the next poyo_check_job call."
              },
              "status": {
                "description": "queued, running, succeeded or failed."
              },
              "task_id": {
                "description": "Task ID; poll poyo_check_job with it while the task is not finished."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run a generation model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79806e3dccfee873cf9dd57d3dd1b13bdfeee6122628de79d39decd838d769a7"
        },
        {
          "name": "poyo_search_models",
          "title": "Search PoYo models",
          "description": "Search PoYo's live model catalog: chat models (Claude, GPT, Gemini, Grok, DeepSeek, Kimi) and image, video, audio and 3D generation models. Returns model IDs with category, tags, protocols and input schema, paged with next_cursor. Free, no API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter, e.g. video, image, audio or chat.",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Results per page, 1 to 100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search, e.g. kling, veo, nano banana or claude.",
                "type": "string"
              },
              "service_type": {
                "description": "chat for language models, generate for image, video, audio and 3D generation.",
                "enum": ["chat", "generate"],
                "type": "string"
              },
              "tags": {
                "description": "Optional tags every result must carry.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "has_more": {
                "description": "Whether more results exist."
              },
              "items": {
                "description": "Matching models with model_id, tool_name, service_type, category, title, description, tags and input_schema."
              },
              "next_cursor": {
                "description": "Pass as cursor to get the next page; null on the last page."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
