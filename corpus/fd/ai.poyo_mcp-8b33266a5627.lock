        {
          "name": "poyo_list_jobs",
          "title": "List recent jobs",
          "description": "List the account's recent generation tasks, newest first, with task_id, model, status, credits and timestamps. Use it to find a job again after a disconnect or in a new session, then call poyo_check_job for its outputs. Free.",
