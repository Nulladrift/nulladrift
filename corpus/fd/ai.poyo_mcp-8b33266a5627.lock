        },
        {
          "name": "poyo_submit_job",
          "title": "Submit a generation job",
          "description": "Submit a generation job and return its task_id at once; use it for video and other long jobs. Poll poyo_check_job every 10 to 30 seconds until status is succeeded or failed. SPENDS CREDITS from the account's PoYo balance: check the price with poyo_get_pricing, tell the user which model will run and what it costs, and get their confirmation first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "callback_url": {
                "description": "Optional HTTPS URL PoYo posts the result to when the job ends. Omit it and poll poyo_check_job instead.",
                "format": "uri",
                "type": "string"
              },
              "input": {
                "description": "The model's input fields exactly as listed by poyo_get_model_schema. Images, video and audio go in as public HTTPS URLs.",
                "type": "object"
              },
              "model": {
                "description": "PoYo model ID from poyo_search_models, e.g. gpt-6-luna, claude-sonnet-5-5 or kling-4.0.",
                "type": "string"
              }
            },
            "required": ["input", "model"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "200 when the job was accepted."
              },
              "data": {
                "description": "Contains task_id; poll poyo_check_job with it."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a generation job"
          },
          "behavior": {
            "destructive": false,
