        },
        {
          "name": "poyo_chat",
          "title": "Chat with a model",
          "description": "Run one non-streaming chat request on a PoYo chat model and return the full response, with token usage and the credits charged in _poyo. SPENDS CREDITS from the account's PoYo balance: check the price with poyo_get_pricing, tell the user which model will run and what it costs, and get their confirmation first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "description": "The request body in the chosen protocol, e.g. {\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}],\"max_tokens\":200}. model and stream are set by the server.",
                "type": "object"
              },
              "model": {
                "description": "PoYo model ID from poyo_search_models, e.g. gpt-6-luna, claude-sonnet-5-5 or kling-4.0.",
                "type": "string"
              },
              "protocol": {
                "default": "openai-chat",
                "description": "Request format of input: openai-chat (default, messages), openai-responses, anthropic (Messages API) or gemini (generateContent).",
                "enum": ["openai-chat", "openai-responses", "anthropic", "gemini"],
                "type": "string"
              }
            },
            "required": ["input", "model"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_poyo": {
                "description": "PoYo usage for this call: usage (input, output and total tokens) and credits charged."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Chat with a model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
