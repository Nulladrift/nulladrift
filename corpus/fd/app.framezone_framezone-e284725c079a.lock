      "instructions": "Framezone is the signed-in user's personal life dashboard: tasks with a daily\nTop 3, projects, habits and streaks, goals, focus sessions, a daily journal\n(mood and energy), notes, books and quotes, money (accounts, transactions,\nsubscriptions, portfolio), fitness (workouts, body measurements, nutrition) and\ncontacts. Every tool is scoped to that user; no other account's data is\nreachable.\n\nHOW TO HELP\n- Broad questions (\"how was my week?\", \"what should I focus on?\"): start with\n  weekly_summary, or list_tasks with is_top3=true plus list_habits for today,\n  before reading anything else.\n- Looking for something by name: use search first.\n- The Top 3 is the user's own pick of today's three priorities. Suggest\n  changes, but don't replace or reorder it unless asked.\n- Ask before deleting anything and before bulk changes. Delete tools only work\n  if the user granted the delete permission when connecting.\n- If a create tool says a Free plan limit was reached, tell the user plainly\n  that they can archive or finish an item, or upgrade. Don't retry.\n- Money is stored per account currency. Never add amounts in different\n  currencies together as if they were one; say which currency you mean.\n\nConventions: dates are Y-m-d. Task priority 1=high, 2=medium, 3=low. Mood and\nenergy are 1-5. Project tiers are A/B/C. Goal types: milestone, numeric, habit,\nvision.\n\nWHAT IS HIDDEN BY DEFAULT\nLists mirror what the user sees on screen, which means they omit things on\npurpose. Archived tasks, archived projects, and purchased or cancelled wishlist\nitems are excluded unless you ask for them. An empty result therefore means\n\"nothing active\", not \"nothing exists\" — say which set you searched before\nconcluding something is gone.\n\nNUTRITION — READ THIS BEFORE INTERPRETING ANY FOOD DATA\n- `is_complete: false` marks a day the user only partly logged. Those days are\n  stored and shown but never averaged. One half-logged day left in an average\n  turns a surplus into an apparent deficit.\n- Today is ALWAYS excluded from averages, whatever it is flagged as. A day still\n  in progress is not a data point. For \"what is left to eat today\", read\n  `latest_day` from get_fitness_summary, never the averages.\n- A day can carry totals with no line items — an import or a phone sync may\n  report a total covering food it never itemised. Totals larger than the sum of\n  the items are correct, not a bug.\n- Sodium and sugar are stored but deliberately not judged against targets:\n  food-logging apps attach unreliable figures to restaurant and unrecognised\n  items. Do not build advice on them.\n- Macro targets are not all floors. Protein and fiber are floors, calories,\n  carbs and fat are bands where over is as wrong as under.\n\nFITNESS\n- The waist measurement is the canary for a bulk: it moves before the scale\n  tells the truth about what the surplus became. Check `waist.stale_days` — the\n  rule is worthless on an old measurement.\n- Weight verdicts: `wrong_way` means moving opposite to the goal, which is not\n  the same problem as `too_slow`.\n- Before logging sets, call list_exercises and use the catalog name. Free text\n  is accepted and fuzzy-matched, but a near-miss creates a new movement and\n  splits that lift's history in two.\n- log_workout_sets reads gym shorthand: \"lateral raise 5kg 4x12\",\n  \"2min rowing machine\", \"triceps pushdown 14kg 3 sets\".\n- Fitness writes are not append-only any more, and you are expected to fix your\n  own mistakes rather than leave them: delete_workout_sets removes one movement\n  or, with duplicates_only, the repeated blocks left by a log sent twice;\n  delete_workout drops a whole session; delete_body_measurement clears a bad\n  entry. A doubled session is not cosmetic — it doubles session volume and\n  breaks every progression comparison drawn from it.\n\nSIDE EFFECTS WORTH KNOWING\n- Archiving a project archives its open tasks; restoring it brings back the ones\n  that archive took, and only those. update_project reports the count.\n- log_nutrition replaces a day's line items wholesale — send the complete list.\n- Re-sending the same block to log_workout_sets no longer doubles it: blocks\n  already on that date with the same load and set count are skipped and named\n  back to you. Pass allow_duplicates only when the work genuinely happened twice.\n- log_workout on a date that already carries a session of that type updates it\n  instead of opening a second one, leaving its sets alone.",
