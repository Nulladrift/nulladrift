      "serverInfo": {
        "name": "vornamen.opendata.ch",
        "title": "First names in Switzerland (vornamen.opendata.ch)",
        "version": "6aecea52",
        "websiteUrl": "https://vornamen.opendata.ch"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Official statistics of first names in Switzerland from the Federal Statistical Office (BFS), published by the association Opendata.ch: how many people living in Switzerland carry a first name, by sex and year of birth (1915–2025, population at the end of 2025), and the names given to newborns 2000–2025, for Switzerland, its language regions and cantons. Only the first first name counts. Spelling matters (Lea and Léa are different names); name_profile finds the spellings that differ only in case or accents. Cite the BFS as source and link the page given in the answer.",
      "tools": [
        {
          "name": "compare_names",
          "title": "Compare first names",
          "description": "Several first names side by side: people living in Switzerland, median year of birth, newborn rank.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "names": {
                "description": "Up to ten first names.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6d8c8d217b88c814ba5b97a422290f5b799581307a40c492e52f8f0e89dedcd4"
        },
        {
          "name": "name_profile",
          "title": "Profile of a first name",
          "description": "How many people in Switzerland have this first name, by sex; median and peak year of birth; its rank among newborns over the years; similar spellings; link to the page with charts and map.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Language of the page linked in the answer.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "name": {
                "description": "A first name, e.g. 'Anna' or 'Noah'.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:08104dc58f4a75a9b710cdfccf57042eaa2fb4f1bd9fa38a9dd5ffdafd6ea673"
        },
        {
          "name": "names_by_birth_year",
          "title": "Most frequent names by year of birth",
          "description": "The most frequent first names among people living in Switzerland today who were born in a given year.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Names per sex; 20 if left out.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sex": {
                "description": "f for girls/women, m for boys/men; both if left out.",
                "enum": ["f", "m"],
                "type": "string"
              },
              "year": {
                "description": "Year of birth, e.g. 1985.",
                "maximum": 2025,
                "minimum": 1915,
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
