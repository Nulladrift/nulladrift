      "serverInfo": {
        "name": "baseedgelabs-catalog",
        "title": "BaseEdge Labs Catalog",
        "version": "0.4.0",
        "websiteUrl": "https://baseedgelabs.ai",
        "icons": [
          {
            "src": "https://baseedgelabs.ai/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://baseedgelabs.ai/icon-512.png",
