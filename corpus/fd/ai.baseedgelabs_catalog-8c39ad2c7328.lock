      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BaseEdge Labs publishes automated trading strategies for TradingView. This server, the BaseEdge Labs Catalog, lists them and hands out the settings (presets) of the free ones. No account is needed.\n\nTypical use: call list_strategies, then list_presets to find the presets for the user's instrument and timeframe, get_preset to explain it, and export_preset to give the user download links for the file to import. Give the user the links as they are; the files must not be rewritten by hand, because each input is matched by its exact label.\n\nStrategies marked \"paid\" need a license; their presets come with it and are not served here. Point the user to the strategy's page. A user who holds a license gets those presets by connecting the BaseEdge Labs Account server instead (https://app.baseedgelabs.ai/mcp), which also serves everything this one does.\n\nA preset's \"results\", when present, are hypothetical TradingView Strategy Tester backtests, not a prediction of future results: each window gives its period, trades, net, win rate, profit factor and drawdown for the stated size and costs, and its trade_list.csv, the file of every trade behind those figures. Whenever you show a figure, show its window, its as_of date and its trade list link with it, and say the results are hypothetical. Never show a figure without its trade list. Don't rank presets by their results or recommend one to trade; describe what each does and let the user choose. A preset with no \"results\" has no current published figures; say so rather than estimating any.",
      "tools": [
        {
          "name": "export_preset",
          "title": "Export a preset",
          "description": "Returns download links to one preset's two files, each with import steps. \"tradingview\": a flat settings file keyed by input label, for TradingView's Load Parameters. \"hypernull\": the HyperNull browser extension's preset file (name, strategy, instrument and timeframe included). The response is { preset_id, title, hypernull: { url, how_to_import }, tradingview: { url, how_to_import } }. It is the tool for loading a preset onto a chart; get_preset returns the values for reading or explaining. Links from the signed-in server expire after 15 minutes and re-check the license; links from the public server do not expire. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "preset_id": {
                "description": "The preset_id of one preset, as returned by list_presets",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["preset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7d0420232272b8b2de86bee13f3137ecdcf210ae335b51c89b0cfd105de7261"
        },
        {
          "name": "get_preset",
          "title": "Get a preset",
          "description": "Returns one preset in full: its summary, its results where published (hypothetical TradingView Strategy Tester backtests by window, each with the link to its trade list), the Strategy Tester properties to set (initial capital, commission, slippage), its contracts, the strategy's page, and every input value keyed by its exact label on the TradingView chart. It is the tool for explaining a preset's settings or results, or setting it up by hand; list_presets finds presets and export_preset returns their files. Returns an error message if the preset_id is unknown or not available to this account. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "preset_id": {
                "description": "The preset_id of one preset, as returned by list_presets",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["preset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2a66e482d6253d2e794b6140921e1f7bf8b12bb9986ba0b85a2fc199b659183"
        },
        {
          "name": "list_presets",
          "title": "List presets",
          "description": "Finds presets: saved settings of a strategy for one instrument and chart timeframe. Each result has its preset_id, strategy, instrument, timeframe, a plain summary and, where published, its results: hypothetical TradingView Strategy Tester backtests by window, each with the link to its trade list (every trade behind the figures). It is the tool for finding and comparing presets; every filter is optional and filters combine, and with none it returns every preset available. Results are summaries without input values: get_preset returns one preset's every input, export_preset its files. Covers the free strategies' presets, plus a paid strategy's presets when the signed-in account holds its license. For a paid strategy without a license it returns no presets and a note with the strategy's page. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "instrument": {
                "description": "Optional. A symbol or part of one, for example MNQ, MGC, XAUUSD or US100",
                "maxLength": 40,
                "type": "string"
              },
              "strategy": {
                "description": "Optional. A strategy_id or strategy name, matched ignoring case, spaces and dashes, for example tokyo-drift or Tokyo Drift",
                "maxLength": 80,
                "type": "string"
              },
              "timeframe": {
                "description": "Optional. A chart timeframe in minutes, for example 5m or 5 minutes",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e781a64f6d979584ab883550ee5fa0df4124f9945c84eadbd387aeba81199e56"
        },
        {
          "name": "list_strategies",
          "title": "List strategies",
          "description": "Lists every BaseEdge Labs trading strategy for TradingView: its strategy_id, name, page on baseedgelabs.ai, whether it is free or paid, how many presets it has and, when signed in, whether this account holds a license for it. The response is small: one short row per strategy, no presets. It is the starting point for what exists; list_presets returns the presets themselves. Takes no inputs. Read-only.",
