{
  "lockfileVersion": 2,
  "subjects": {
    "com.nuevedediciembre/river-plate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nuevedediciembre.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "nuevedediciembre",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "nuevedediciembre.com es un portal de noticias, historia y estadísticas de Club Atlético\nRiver Plate hecho por hinchas. NO es un medio oficial ni tiene relación institucional con\nel club: nunca presentes esta información como comunicación oficial de River Plate.\n\nEl contenido está en castellano (es-AR) por defecto; parte tiene traducción al inglés y el\ncampo `translated` indica cuándo el texto devuelto sigue estando en castellano.\n\nAl citar una nota, un jugador o un título, incluí la `url` canónica que devuelve cada\nherramienta. El palmarés y el archivo histórico incluyen `sourceUrl` con la fuente donde el\ndato fue verificado; citala cuando exista.",
      "tools": [
        {
          "name": "get_article",
          "title": "Leer una nota",
          "description": "Devuelve el texto completo de una nota publicada a partir de su slug (el último segmento de la URL, p. ej. 'river-boca-libertadores-2018'). Incluye etiquetas, jugadores mencionados y los datos destacados de la nota. Usá search_site si no conocés el slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ca024e994a7af1e7326d146181b2b89e157964215ab7e711fc474ec046da035"
        },
        {
          "name": "get_fact_of_the_day",
          "title": "Dato del día",
          "description": "El dato destacado del día: una estadística, un récord o una anécdota tomada de una nota publicada, con el enlace a la nota de la que sale.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c03774cdf6c05281b457c34622a5de8cce7e7f1bab769e5669a1a25611f700e0"
        },
        {
          "name": "get_honours",
          "title": "Palmarés",
          "description": "El palmarés completo de River Plate: cada título, con año, rival en la final, resultado, sede y entrenador cuando están registrados. Los totales se cuentan sobre los registros, no están escritos a mano. Cada título incluye la fuente donde fue verificado.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "competition": {
                "description": "Filtra por competencia, p. ej. 'Copa Libertadores'.",
                "maxLength": 120,
                "type": "string"
              },
              "sport": {
                "default": "FOOTBALL",
                "enum": ["FOOTBALL", "BASKETBALL", "VOLLEYBALL", "FIELD_HOCKEY", "RUGBY", "OTHER"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a292c2af55205e01bf3b98773d83590ff9143bac5ce507dc01dad527e36430d"
        },
        {
          "name": "get_match_report",
          "title": "Detalle de un partido",
          "description": "Un partido con su formación: minutos, goles, asistencias, tarjetas y el puntaje editorial de 0 a 10 que le puso el sitio a cada jugador. Ese puntaje es una opinión de nuevedediciembre.com, no una estadística oficial — atribuilo al sitio. Incluye la nota publicada del partido cuando existe.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Id del partido, tal como lo devuelven get_matches o search_site.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:252bc3619afd9d0912aefd43275a0eeb7fdf0abbd46ee2f17530ac369f1b4c1e"
        },
        {
          "name": "get_matches",
          "title": "Partidos",
          "description": "Fixture y resultados recientes de River desde la base del sitio. `upcoming` son los próximos partidos (incluye el que se está jugando), `recent` los últimos finalizados. Los datos de fixture provienen de un proveedor externo y pueden ir por detrás del resultado en vivo; el campo `syncedAt` indica la última actualización.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72462ab30bb5e983ee963c1a1430195f1ff080877ea7a70e4f0b7472c38c59ea"
        },
        {
          "name": "get_player",
          "title": "Ficha de un jugador",
          "description": "Ficha de un jugador, entrenador o figura histórica de River: biografía, posición, años en el club y totales de partidos, goles y asistencias. El campo `statsSource` dice de dónde salen los totales — 'season' (estadísticas cargadas por temporada), 'matches' (sumados sobre los partidos registrados en el sitio, por lo tanto parciales) o 'none'. Nunca presentes un total 'matches' como cifra de carrera completa.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "description": "Slug del jugador, p. ej. 'enzo-perez'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9eb4db245833e893c4c9c3b169104ac6d5a6105dfa59981355ca92e947281b8b"
        },
        {
          "name": "get_standings",
          "title": "Tabla de posiciones",
          "description": "Tabla de posiciones desde la caché del sitio. `zone` devuelve la tabla del torneo en curso acotada a la zona de River (los torneos argentinos se juegan en zonas y las posiciones arrancan de 1 en cada una); `season` devuelve la tabla anual acumulada de todos los equipos. Citá siempre la fuente que viene en la respuesta.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "table": {
                "default": "zone",
                "enum": ["zone", "season"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d55177c8667ecc223b35044da6a44592716f7f67cb8228a14205faeeb6c7940e"
        },
        {
          "name": "get_transfers",
          "title": "Altas y bajas",
          "description": "Movimientos del plantel en una temporada: quién llegó y quién se fue, incluidos los cambios de entrenador. Se deriva de los años de alta y baja de cada ficha, así que refleja lo cargado en el sitio y no un mercado de pases completo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "season": {
                "description": "Año de la temporada, p. ej. 2026.",
                "maximum": 2100,
                "minimum": 1901,
                "type": "integer"
              }
            },
            "required": ["season"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ccaef8e40a45f2f655dbe0d8f1b4fa2160197e938f859d1e22ea3a1e654503f6"
        },
        {
          "name": "head_to_head",
          "title": "Historial contra un rival",
          "description": "Historial de River contra un rival: partidos jugados, ganados, empatados, perdidos y goles. Se calcula sobre los registros, nunca está escrito a mano, y los partidos sin resultado cargado se cuentan aparte en vez de contarse como empate. Combina los partidos recientes con el archivo histórico. Para el superclásico usá rivalry: 'superclasico'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Cuántos partidos del archivo devolver junto al resumen.",
                "maximum": 25,
                "minimum": 0,
                "type": "integer"
              },
              "opponent": {
                "description": "Nombre del rival tal como figura en el sitio, p. ej. 'Boca Juniors'.",
                "maxLength": 120,
                "type": "string"
              },
              "rivalry": {
                "description": "Clásico registrado, p. ej. 'superclasico'. Alternativa a `opponent`.",
                "maxLength": 60,
                "type": "string"
              },
              "sport": {
                "default": "FOOTBALL",
                "enum": ["FOOTBALL", "BASKETBALL", "VOLLEYBALL", "FIELD_HOCKEY", "RUGBY", "OTHER"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:54e3a6ee1fa1222c089d93eabd79a2c644328e321db9c0dfc7658267e46de0da"
        },
        {
          "name": "list_articles",
          "title": "Listar notas",
          "description": "Lista notas publicadas de la más nueva a la más vieja, con resumen y URL pero sin el cuerpo completo. Se puede filtrar por tipo, deporte o etiqueta. Para leer una nota entera, usá get_article con el slug que devuelve esta herramienta.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "sport": {
                "description": "Por defecto se listan todos los deportes.",
                "enum": ["FOOTBALL", "BASKETBALL", "VOLLEYBALL", "FIELD_HOCKEY", "RUGBY", "OTHER"],
                "type": "string"
              },
              "tag": {
                "description": "Slug de la etiqueta.",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "Tipo de nota: NEWS, MATCH_REPORT, HISTORY, OPINION, etc.",
                "enum": ["NEWS", "MATCH_REPORT", "TRANSFER_NEWS", "HISTORY", "PLAYER_PROFILE", "OTHER_SPORTS", "CLUB_INSTITUTIONAL", "OPINION", "INTERVIEW", "LIST", "POLL_RESULTS", "COMMUNITY"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcf8a755e61a731273ef98fb66f2b0305998b12aaedb77b99221d53b92ae1d25"
        },
        {
          "name": "search_site",
          "title": "Buscar en el sitio",
          "description": "Búsqueda de texto completo sobre notas publicadas, jugadores y partidos de River Plate. Tolera la falta de tildes y la ñ ('nunez' encuentra 'Núñez'). Devolvé la URL de cada resultado al citarlo. Mínimo 3 caracteres.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "description": "Idioma de la respuesta. 'es' (por defecto) o 'en'.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "query": {
                "description": "Términos de búsqueda.",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9707b3292b3058b159cefec6cfaaec72ba64dc353679a7925fad23c322b05b23"
        }
      ],
      "digest": "sha256:f9fa6a87974cd2a3e623a45c804913f365b6b20e839abcb778ecf1ee27c91d5f"
    }
  }
