{
  "lockfileVersion": 2,
  "subjects": {
    "ai.monsterdata/max-data-value-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://monsterdata.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "max-data-value-check",
        "title": "MAX Data Value Check",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for business owners asking whether their company's operational data could be licensed to data buyers. Use check_data_readiness for a readiness score, likely buyer types and red flags; get_data_rights_checklist for rights, privacy and de-identification steps; list_public_data_licensing_disclosures for public SEC filings that mention AI data licensing; explain_data_licensing_term for definitions; get_owner_handoff_link only when the owner asks for a real review or next step (it returns a link the owner taps to text MAX themselves). Inputs are multiple-choice categories only — never ask for or send names, contact details, patient information, account numbers or the data itself. Results are general information, not legal or financial advice, and are not a valuation or offer.",
      "tools": [
        {
          "name": "check_data_readiness",
          "title": "Check data readiness",
          "description": "Scores how ready a business's operational data is to be licensed to data buyers (0-100), using only multiple-choice answers about the business and its records. Returns a factor-by-factor breakdown, the buyer types most likely to want those data types, red flags (privacy, consent, history length) and next steps. Use when someone asks whether their company's data could be sold or licensed, or what it would take. Does not estimate a dollar value, make an offer, contact anyone, or store answers. Do not send names, contact details, patient information or the data itself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contains_health_info": {
                "description": "True if any records include health or patient information. Only a yes/no flag; never send the information itself. Optional.",
                "type": "boolean"
              },
              "contains_personal_info": {
                "description": "Whether the records include personal information about customers or other people. Optional.",
                "enum": ["none", "some", "mostly", "not_sure"],
                "type": "string"
              },
              "data_flow": {
                "description": "Whether new records keep arriving daily or the data is mostly historical.",
                "enum": ["historical_only", "ongoing_daily"],
                "type": "string"
              },
              "data_types": {
                "description": "Kinds of records the business keeps.",
                "items": {
                  "enum": ["transactions_sales", "procurement_spend", "saas_usage_logs", "customer_support_conversations", "call_recordings", "operational_sensor_iot", "scheduling_bookings", "inventory_supply_chain", "pricing_quotes", "marketing_ad_performance", "location_foot_traffic", "product_catalog_content", "images_video_footage", "documents_contracts", "other"],
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "employee_range": {
                "description": "Number of employees.",
                "enum": ["1-9", "10-19", "20-49", "50-199", "200-999", "1000+"],
                "type": "string"
              },
              "hq_region": {
                "description": "Region of the business's headquarters (used only for privacy-law flags). Optional.",
                "enum": ["us_canada", "uk_europe", "other"],
                "type": "string"
              },
              "industry": {
                "description": "Closest industry of the business.",
                "enum": ["saas_software", "logistics_fleet", "ecommerce_retail", "restaurants_hospitality", "healthcare_medical", "real_estate_property", "financial_services", "marketing_advertising", "manufacturing_industrial", "professional_services", "home_services", "travel_tourism", "education", "media_content", "other"],
                "type": "string"
              },
              "record_volume": {
                "description": "Approximate number of records.",
                "enum": ["thousands", "hundreds_of_thousands", "millions", "tens_of_millions_plus"],
                "type": "string"
              },
              "same_core_systems_years": {
                "description": "How long the main business software systems have been in place. Optional.",
                "enum": ["under_1", "1_to_3", "over_3", "not_sure"],
                "type": "string"
              },
              "sells_to": {
                "description": "Whether the business sells to other businesses, consumers or both. Optional.",
                "enum": ["businesses", "consumers", "both"],
                "type": "string"
              },
              "years_of_records": {
                "description": "How many years of consistent records the business has.",
                "enum": ["under_2", "2_to_5", "5_to_10", "over_10"],
                "type": "string"
              }
            },
            "required": ["data_flow", "data_types", "employee_range", "industry", "record_volume", "years_of_records"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check data readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Readiness scored",
            "openai/toolInvocation/invoking": "Scoring data readiness…"
          },
          "digest": "sha256:625525ca1f73a6da67347e3763015e40943e8110979107e2302ead5ad54da9e9"
        },
        {
          "name": "explain_data_licensing_term",
          "title": "Explain data licensing term",
          "description": "Gives a short plain-English definition of a data licensing term such as recurring license, exclusive license, de-identification, data provenance, data room or alternative data. If the term isn't in the glossary, returns the list of available terms. Use when someone asks what a data licensing term means.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "The term to define, e.g. \"non-exclusive license\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain data licensing term"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Definition ready",
            "openai/toolInvocation/invoking": "Looking up term…"
          },
          "digest": "sha256:34ed3091ddec560ccfb36e400958b4969fdad71409571e9d0a39c1c5f7b0fa87"
        },
        {
          "name": "get_data_rights_checklist",
          "title": "Get data rights checklist",
          "description": "Returns a step-by-step checklist a business should complete before licensing its data: ownership and contract checks, privacy-policy review, de-identification and re-identification risk, vendor terms, provenance records and permitted uses, plus the privacy laws to review for the selected data types. Use when someone asks what permissions, consents or legal checks they need before selling or licensing business data. General information, not legal advice; stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contains_health_info": {
                "description": "True if any records include health or patient information. Yes/no only. Optional.",
                "type": "boolean"
              },
              "contains_personal_info": {
                "description": "Whether the records include personal information. Optional.",
                "enum": ["none", "some", "mostly", "not_sure"],
                "type": "string"
              },
              "data_location": {
                "description": "Whether the data is stored in the business's own systems, in third-party software, or both. Optional.",
                "enum": ["own_systems", "third_party_software", "both"],
                "type": "string"
              },
              "data_types": {
                "description": "Kinds of records the business is considering licensing.",
                "items": {
                  "enum": ["transactions_sales", "procurement_spend", "saas_usage_logs", "customer_support_conversations", "call_recordings", "operational_sensor_iot", "scheduling_bookings", "inventory_supply_chain", "pricing_quotes", "marketing_ad_performance", "location_foot_traffic", "product_catalog_content", "images_video_footage", "documents_contracts", "other"],
                  "type": "string"
                },
                "maxItems": 15,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "hq_region": {
                "description": "Region of the business's headquarters. Optional.",
                "enum": ["us_canada", "uk_europe", "other"],
                "type": "string"
              },
              "sells_to": {
                "description": "Whether the business sells to businesses, consumers or both. Optional.",
                "enum": ["businesses", "consumers", "both"],
                "type": "string"
              }
            },
            "required": ["data_types"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get data rights checklist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checklist ready",
            "openai/toolInvocation/invoking": "Building rights checklist…"
          },
          "digest": "sha256:09faf4715b2d2d252c66a288c7e1f2162a743dceb899d4673e8c2c342086cea5"
        },
        {
          "name": "get_owner_handoff_link",
          "title": "Get owner handoff link",
          "description": "Returns a link the business owner can tap to open a prefilled text message to MAX, MON$TER's data agent, who arranges a free review of the business's data. Use only when the owner says they want a real review or next step, for example after check_data_readiness. Show the link to the owner; the owner decides whether to send the text, and nothing is sent without them. Never send the owner's name, phone number, email or data to this tool. If you act for a MON$TER ambassador, pass their referral code (or connect via https://monsterdata.ai/mcp?ref=CODE) so the referral is credited to that person. Referral rewards are paid only to the verified human ambassador, never to an agent or wallet. Tell the owner that the person you work for may earn a referral reward if the owner goes ahead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the calling agent or product, used only for an anonymous count. Optional.",
                "maxLength": 60,
                "type": "string"
              },
              "referral_code": {
                "description": "The MON$TER ambassador code of the person this agent works for. Optional; defaults to the ?ref= code in the server URL, if any.",
                "pattern": "^[A-Za-z0-9_-]{3,24}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get owner handoff link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Link ready",
            "openai/toolInvocation/invoking": "Preparing the owner's link…"
          },
          "digest": "sha256:586ef84d5db89d5b6ebfaab5279cedbf608369453b9539d4dea5fbc012d0a3e5"
        },
        {
          "name": "list_public_data_licensing_disclosures",
          "title": "List public data-licensing disclosures",
          "description": "Lists public companies whose SEC filings (8-K, 10-K, 10-Q, S-1) mention AI data licensing, from MON$TER's weekly SEC EDGAR full-text tracker, with filing dates and direct links to each filing on sec.gov. Optionally filter by part of a company name. Use when someone asks which companies license data to AI or wants public examples. A match means a filing mentions the phrases, not that a deal closed or its value.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name_contains": {
                "description": "Optional text to match within company names, e.g. \"yelp\".",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum companies to return (1-40). Default 10.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List public data-licensing disclosures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Filings listed",
            "openai/toolInvocation/invoking": "Reading SEC filing tracker…"
          },
          "digest": "sha256:3b3b2b976346d6b121f6f78c58741c322b6a744ca674132fd7cd69b7cbb3eb1f"
        }
      ],
      "digest": "sha256:b341764aeda4649f9b269c38549430498455560ee2b9cf64637590f61ab7d8de"
    }
  }
}
