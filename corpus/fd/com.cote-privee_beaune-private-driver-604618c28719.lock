      "serverInfo": {
        "name": "cote-privee",
        "title": "Côte Privée: private driver in Burgundy",
        "version": "1.2.0",
        "description": "Private driver in Beaune, Burgundy: places, events, prices per vehicle, availability, quotes, wine-day plans, rides over several days, booking requests and their status.",
        "websiteUrl": "https://www.cote-privee.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Côte Privée is a licensed private driver (French VTC) based in Beaune, Burgundy, France: wine days among the vineyards, a driver by the hour, and airport and station transfers. The driver speaks French, English, Mandarin Chinese and Arabic; the tools answer in English, French, German or Chinese (lang), and in Arabic for their notes (lang ar: place data and links in English). There is one electric car (Polestar 2) for up to 4 guests, and every price is per vehicle, taxes, tolls and parking included; tastings are paid to the domaines. On request, for a supplement per day of service (get_prices cars), a Mercedes E-Class (4 guests) or V-Class (up to 7 guests: groups of 5 to 7) is confirmed with the booking once its availability is checked; quote and request_booking take it as car, and price more than 4 guests with the V-Class. The booking flow: check_availability says whether the car and driver are free on a day (free, pending, busy) and the next free days; quote gives the exact price of one service or of a whole trip (items), cheaper products that do the same job (alternatives), and a link to the booking page already filled in; plan_wine_day times a wine day; find_trips with startDate dates a plan of rides over several days. request_booking sends the request from here once the traveller has seen the price and accepted the terms of sale (dry_run checks it without sending): the traveller receives the request by e-mail, and the driver confirms it by e-mail and says how to pay the full price, or declines it; nothing is paid before he confirms (every answer says so in payment). Its answer's next says what happens for that request. get_booking_status shows the state with the reference and the traveller's e-mail, and paymentUrl once there is a payment link. An unknown place name is an error with candidates, never another place. The tools charge nothing.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Is the driver free?",
          "description": "Whether the one car and its driver are free on a day and the next days: free; pending (a request awaits the driver's answer and may still be confirmed); busy; unbookable (outside the booking rules: tomorrow to 18 months ahead, Beaune time, within the service's hours). With the hours held, the next free days, the sources read, when, today's date, the page to cite (url, pricesUrl) and a booking link. The driver confirms every booking.",
