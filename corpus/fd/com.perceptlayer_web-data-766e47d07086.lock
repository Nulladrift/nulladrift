{
  "lockfileVersion": 2,
  "subjects": {
    "com.perceptlayer/web-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.perceptlayer.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "Perceptlayer",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Perceptlayer is a web data API: one key for structured data from about 250 websites and data sources (marketplaces, travel, real estate, cars, jobs, search engines, reviews, social networks, apps, SEO). Use search_endpoints to find an endpoint for the site or data you need, get_endpoint to read its parameters, then call_endpoint to run it. Each successful call costs the credits shown; failed calls are free. call_endpoint needs the user's API key in the MCP server config (Authorization: Bearer sk_live_... or X-API-Key).",
      "tools": [
        {
          "name": "call_endpoint",
          "title": "Call a data endpoint",
          "description": "Run one endpoint and return its JSON response. Spends the call's credits from the user's balance on success only; failed calls are free. Pass parameters exactly as get_endpoint lists them (array parameters as JSON arrays). The result reports credits used and remaining. Errors come back with a code: invalid_parameters (fix the parameters and retry), not_found (no data for these parameters), rate_limited or temporarily_unavailable (wait and retry), insufficient_credits, restricted_endpoint (the user must accept the restricted-endpoint terms in their dashboard), invalid_api_key (the MCP server config needs a valid API key). Responses over 100,000 characters are truncated; use paging or limit parameters to fetch less.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Endpoint ID from search_endpoints, e.g. \"airbnb.listing\".",
                "type": "string"
              },
              "params": {
                "additionalProperties": true,
                "description": "Parameters for the endpoint, e.g. {\"listing_id\": \"18648717\"}.",
                "type": "object"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Call a data endpoint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bc9bafbd6d63a3b6f1d85937554445cf9b0056eb8acaaed487d347936b8302b"
        },
        {
          "name": "get_endpoint",
          "title": "Get endpoint details",
          "description": "Get the full parameter list for one endpoint: each parameter's name, type, whether it is required, allowed values and limits, plus an example set of parameters, the credit cost and tier. Call this before call_endpoint unless you already know the parameters. Free; no API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Endpoint ID from search_endpoints, e.g. \"airbnb.listing\".",
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get endpoint details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:755b0810bde6415f78aa992c8b852542f8426ddc1eda1e66d47025ec5f4245d1"
        },
        {
          "name": "search_endpoints",
          "title": "Search data endpoints",
          "description": "Find Perceptlayer endpoints for a website or kind of data. The catalogue has 1730 endpoints across 248 sources, so search before calling. Query with the site and the data you want, e.g. \"amazon product reviews\", \"airbnb listing\", \"linkedin company\", \"google maps places\", \"zillow property\". Returns compact matches: endpoint ID (pass it to get_endpoint or call_endpoint), name, HTTP method, credits per call (credits_max when the price depends on the call), tier (\"restricted\" endpoints need the account's restricted-endpoint terms accepted) and required parameters. Free; no API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Site and/or data wanted, in a few words, e.g. \"tripadvisor hotel reviews\".",
                "type": "string"
              },
              "vertical": {
                "description": "Optional: only return endpoints in this vertical.",
                "enum": ["apps", "cars", "jobs", "marketplaces", "real-estate", "reviews", "search", "social", "travel", "web-seo"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search data endpoints"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a2dff3f125f3da8e72894fe8423141aa41ecfe7d911fa9f12cbc4d1642a280a"
        }
      ],
      "digest": "sha256:ceeb3a6c1d3e0ff8f13bec402a76b456e008b2e557110605a2f27b7480913c83"
    }
  }
}
