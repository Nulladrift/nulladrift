{
  "lockfileVersion": 2,
  "subjects": {
    "com.carrepaircostestimator/cost-estimator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://carrepaircostestimator.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "carrepaircostestimator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "decode_vin",
          "title": "Decode VIN",
          "description": "Decode a 17-character Vehicle Identification Number (VIN) into year, make, model, trim, body style, and manufacturer. Use before estimate_vehicle_value to get exact vehicle details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "vin": {
                "description": "17-character VIN (letters I, O, Q are not used)",
                "maxLength": 17,
                "minLength": 17,
                "pattern": "^[A-HJ-NPR-Z0-9]{17}$",
                "type": "string"
              }
            },
            "required": ["vin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7183e0244f6b2488a6e8c19049c897d68c4b19a33b97123f022902557a8ebcb1"
        },
        {
          "name": "estimate_vehicle_value",
          "title": "Estimate Vehicle Value",
          "description": "Estimate the current US market value (USD) of a vehicle from year, make, model, and optional trim. Deterministic model: base price by make, trim multiplier, age-based depreciation. Useful to judge whether a repair is worth the cost.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "make": {
                "description": "Make name, e.g. \"Toyota\", \"BMW\", \"Ford\"",
                "type": "string"
              },
              "model": {
                "description": "Model name, e.g. \"Camry\", \"F-150\"",
                "type": "string"
              },
              "trim": {
                "description": "Optional trim, e.g. \"Limited\", \"XLT\", \"Sport\"",
                "type": "string"
              },
              "year": {
                "description": "Model year, e.g. 2019",
                "maximum": 2027,
                "minimum": 1950,
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0a4fc0498113ce6a26dbe650e949d4eb7edbdc4e565768bc1d6c7d5b022d43fb"
        },
        {
          "name": "get_repair_cost_estimate",
          "title": "Repair Cost Estimate",
          "description": "Estimate the cost of a car repair job (parts + labor, USD, US national averages 2026) by make and repair type. Returns low/high ranges for parts, labor, and total. Use list_makes_models and list_repair_types to discover valid slugs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "make_slug": {
                "description": "Car make slug, e.g. \"ford\", \"bmw\", \"tesla\"",
                "type": "string"
              },
              "part_slug": {
                "description": "Repair type slug, e.g. \"brake-pads\", \"head-gasket\", \"windshield\"",
                "type": "string"
              }
            },
            "required": ["make_slug", "part_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5b0a8c929936411f251ee054ae8e40c9032763f5c4fab8002c2cdcdc1e6eee80"
        },
        {
          "name": "get_repair_cost_guide",
          "title": "Repair Cost Guide",
          "description": "Get the full editorial cost guide for a repair type: direct answer, price range, cost breakdown table, price factors, failure symptoms, and FAQs (US market, 2026). Use list_repair_guides to discover slugs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Guide slug, e.g. \"head-gasket\", \"transmission\", \"windshield\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:18653b9b2c6698eeb92c4ce065c6860f6619f6d1db105e924225a71311a788bf"
        },
        {
          "name": "list_makes_models",
          "title": "List Makes and Models",
          "description": "List all supported car makes and their models (slugs, EV flag, price multiplier). Use the make_slug values with get_repair_cost_estimate and list_repair_types.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2f3754f21e63947dfaf357cb8924354cad2ed4aad61a1dff16a8dfad4d79bb3b"
        },
        {
          "name": "list_repair_guides",
          "title": "List Repair Cost Guides",
          "description": "List all editorial repair cost guides (slug, title, category, price range). Optionally filter by category: body, mechanical, glass-wheels, or electrical.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Optional guide category filter",
                "enum": ["body", "mechanical", "glass-wheels", "electrical"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14a04580b237f23d69c4d971a8998ff09ce99fcba2f21c4668dc361c0c3e64aa"
        },
        {
          "name": "list_repair_types",
          "title": "List Repair Types",
          "description": "List the repair job types available for cost estimates (slugs, typical parts cost, labor hours). Pass a make_slug to get only the jobs applicable to that make (EVs skip ICE-only jobs).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "make_slug": {
                "description": "Optional car make slug to filter jobs applicable to that make",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed27bda9a67b557835789c912c4ff6647319dce89d90a4b33bd064759fedb525"
        }
      ],
      "digest": "sha256:b82019a1b40360b9dc9bb08e37e3807d0df2a506f00dd7b7fcbb2a126584089f"
    }
  }
}
