      "serverInfo": {
        "name": "com.complianceautomator/public-mcp",
        "title": "ComplianceAutomator Public MCP",
        "version": "0.2.0",
        "description": "Public read-only MCP for products, frameworks, guides, methodology, and published blog metadata.",
        "websiteUrl": "https://www.complianceautomator.com/mcp",
        "icons": [
          {
            "src": "https://www.complianceautomator.com/ca-logo.png",
            "mimeType": "image/png"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use these read-only tools only for public ComplianceAutomator product and educational content. Results are not a compliance determination or certification.",
      "tools": [
        {
          "name": "get_blog_post",
          "title": "Get a published blog post summary",
          "description": "Get allowlisted metadata and a short excerpt for one published post. Draft content is excluded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Published slug returned by list_blog_posts.",
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "excerpt": {
                "type": "string"
              },
              "publishedAt": {
                "type": ["string", "null"]
              },
              "slug": {
                "type": "string"
              },
              "summary": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["excerpt", "publishedAt", "slug", "summary", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
