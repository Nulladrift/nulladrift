          "digest": "sha256:e5c36067cbeea37980805172830c165d955215352ea87e064e25d66e8494889a"
        },
        {
          "name": "search_by_city",
          "title": "Search by city",
          "description": "Search for businesses in a specific city, optionally filtered by category. Every business includes name, category, city, state, rating, review count, tier and quote_request_url (its public Bezal profile, where a person can send a request). Phone, website, address, hours, photos, coordinates and a booking link (when the provider saved one) are included only for providers on a paid Bezal plan, and the description only for providers on a higher paid plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
