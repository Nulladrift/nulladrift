        {
          "name": "search_businesses",
          "title": "Search businesses",
          "description": "Search local business profiles on Bezal by name, category, or location. Everyday words work too, so \"tech help\" finds IT Services and \"plumber\" finds Plumbing. Every business includes name, category, city, state, rating, review count, tier and quote_request_url (its public Bezal profile, where a person can send a request). Phone, website, address, hours, photos, coordinates and a booking link (when the provider saved one) are included only for providers on a paid Bezal plan, and the description only for providers on a higher paid plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category keyword (e.g. \"plumbing\", \"hr consulting\")",
                "maxLength": 100,
                "type": "string"
              },
              "city": {
                "description": "City name",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Number of results to return (1-20)",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Free-text search across business name and category (3 characters or more)",
                "maxLength": 200,
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or full state name",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
