                "maxLength": 100,
                "type": "string"
              },
              "city": {
                "description": "City name",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code or full name",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
