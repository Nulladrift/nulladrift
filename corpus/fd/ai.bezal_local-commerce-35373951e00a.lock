        },
        {
          "name": "search_by_service",
          "title": "Search by service",
          "description": "Find businesses that list a specific service, when you know the exact service rather than the category (for example \"Drain cleaning\" rather than \"plumbing\"). Every business includes name, category, city, state, rating, review count, tier and quote_request_url (its public Bezal profile, where a person can send a request). Phone, website, address, hours, photos, coordinates and a booking link (when the provider saved one) are included only for providers on a paid Bezal plan, and the description only for providers on a higher paid plan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "location": {
                "description": "Optional city or state to filter by",
                "maxLength": 100,
                "type": "string"
              },
              "service_type": {
                "description": "Exact service offered (matched against the services list)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["service_type"],
            "type": "object"
          },
          "annotations": {
