{
  "lockfileVersion": 2,
  "subjects": {
    "app.fftcompanion/fft-companion": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fftcompanion.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fft-companion",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Structured Final Fantasy Tactics game data across three releases:\npsx (PlayStation 1997), wotl (War of the Lions), and ic (The Ivalice Chronicles).\n\nStart with list_versions to see what exists, then search to turn a name into an id.\nBoth are free. The data tools then return full records for those ids.\n\nPayments are disabled on this deployment — every tool is free.\n\nIds are camelCase and stable (battleAxe, redPanther, calculator). Always pass the\nversion explicitly: stats, availability and even item restrictions differ between releases.",
      "tools": [
        {
          "name": "compare_versions",
          "title": "Diff a record across releases",
          "description": "Compares the same entity across psx, wotl and ic and reports exactly which fields changed. Answers questions like \"was this weapon nerfed in War of the Lions?\" or \"did Ivalice Chronicles lift the female-only restriction?\" that otherwise require holding three datasets side by side. Free while this deployment runs unmetered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Entity id, present in at least one version.",
                "type": "string"
              },
              "kind": {
                "enum": ["equipment", "abilities", "jobs", "monsters", "bosses", "locations", "consumables"],
                "type": "string"
              },
              "versions": {
                "default": ["psx", "wotl", "ic"],
                "description": "Which releases to compare.",
                "items": {
                  "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                  "enum": ["psx", "wotl", "ic"],
                  "type": "string"
                },
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["id", "kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd1744d3e84cb21eedd6d015168a89d605547c7ce3dc3f3614e8a0a43e6c8ae7"
        },
        {
          "name": "find_item_sources",
          "title": "Find where an item comes from",
          "description": "Reverse lookup: every way to obtain a piece of equipment or a consumable — which outfitter unlocks it and after which battle, which monsters poach into it, and which treasure tiles hold it. This is indexed backwards from the game data and is not readable from the item record alone. Free while this deployment runs unmetered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "itemId": {
                "description": "Equipment or consumable id, e.g. 'excalibur'.",
                "type": "string"
              },
              "version": {
                "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                "enum": ["psx", "wotl", "ic"],
                "type": "string"
              }
            },
            "required": ["itemId", "version"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3050998864c2e92ea9c2b25f949248dc3cde59c9ddd67e1ae4460529fd73c6c"
        },
        {
          "name": "get_job",
          "title": "Get a job with abilities and equipment access",
          "description": "Full job record: raw stat multipliers and growth, static move/jump/evasion, the complete learnable ability set with JP costs, and which equipment types the job can equip. Also returns the version's stat ceilings for normalization. Free while this deployment runs unmetered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "jobId": {
                "description": "Job id, e.g. 'ninja', 'calculator', 'darkKnight'.",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "ja", "pt", "ko", "es", "fr", "de", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "version": {
                "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                "enum": ["psx", "wotl", "ic"],
                "type": "string"
              }
            },
            "required": ["jobId", "version"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4beaad17755710fe2750d953f82a9308bd1a74ecd25df1d9e9e42eeddb6ba5bf"
        },
        {
          "name": "get_monster",
          "title": "Get a monster with poach table and spawn locations",
          "description": "Full monster record: stat multipliers and growth by rank, poach drops (common and rare), ability set, and the random-battle locations it appears in per chapter — including which map you must travel from. Free while this deployment runs unmetered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "enum": ["en", "ja", "pt", "ko", "es", "fr", "de", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "monsterId": {
                "description": "Monster id, e.g. 'behemoth', 'redPanther'.",
                "type": "string"
              },
              "version": {
                "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                "enum": ["psx", "wotl", "ic"],
                "type": "string"
              }
            },
            "required": ["monsterId", "version"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3a1f69d696ae964792e0926a1b95728543d78a6903022667e1e14edf8337854c"
        },
        {
          "name": "get_records",
          "title": "Get full records by id",
          "description": "Returns complete records for up to 25 ids of one entity kind, including stats, costs, effects and availability with all cross-references resolved to names. Free while this deployment runs unmetered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ids": {
                "description": "Entity ids from search.",
                "items": {
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "enum": ["equipment", "abilities", "jobs", "monsters", "bosses", "locations", "consumables"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "ja", "pt", "ko", "es", "fr", "de", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "version": {
                "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                "enum": ["psx", "wotl", "ic"],
                "type": "string"
              }
            },
            "required": ["ids", "kind", "version"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d43c181d1425325fd1a953836f3f81e06f1d0e883afd54d472170663452c582"
        },
        {
          "name": "list_versions",
          "title": "List game versions",
          "description": "Lists the three Final Fantasy Tactics releases covered by this server and how many records exist per entity kind in each. Call this first to pick a version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a94b414b89b29b04c1749123293474f728d7738abcd8b224a5c49e4746e32c3b"
        },
        {
          "name": "query_equipment",
          "title": "Query equipment with filters",
          "description": "Filters and sorts the equipment table — by category, weapon/armor type, cost, and stat thresholds. Use this instead of paging through get_records when shopping for \"best X under Y gil\". Free while this deployment runs unmetered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["weapon", "bodyArmor", "shield", "headgear", "accessory"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "ja", "pt", "ko", "es", "fr", "de", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxCost": {
                "description": "Maximum shop cost in gil.",
                "type": "number"
              },
              "minStat": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Minimum values per stat, e.g. { weaponPower: 10, magicAttack: 2 }.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "sortBy": {
                "description": "Stat name to sort by, descending. Falls back to cost.",
                "type": "string"
              },
              "subCategory": {
                "description": "Narrower type, e.g. 'katana', 'robe', 'hat'.",
                "type": "string"
              },
              "version": {
                "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                "enum": ["psx", "wotl", "ic"],
                "type": "string"
              }
            },
            "required": ["version"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1723b5d3691d16c1836073e060013ec4294bc29990636383e617db0ee8aeb0ef"
        },
        {
          "name": "search",
          "title": "Search the catalog",
          "description": "Finds entities by name or id across equipment, abilities, jobs, monsters, bosses, locations and consumables. Returns ids and display names only — use get_records or a specific data tool to retrieve the actual data. Matches English, Japanese, Portuguese, Korean, Spanish, French and German names, and is punctuation-insensitive.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kinds": {
                "description": "Restrict to these entity kinds.",
                "items": {
                  "enum": ["equipment", "abilities", "jobs", "monsters", "bosses", "locations", "consumables"],
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "default": "en",
                "enum": ["en", "ja", "pt", "ko", "es", "fr", "de", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or id fragment, e.g. 'excalibur', 'battle axe', 'ベヒーモス'.",
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Which release to read. psx = original PlayStation, wotl = War of the Lions, ic = The Ivalice Chronicles. Data differs meaningfully between them.",
                "enum": ["psx", "wotl", "ic"],
                "type": "string"
              }
            },
            "required": ["query", "version"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7722b52462e3471c1b459005594051862a08be06aba73376d9869ad502dcd3c"
        }
      ],
      "digest": "sha256:c3d65fe3e3f5a95c9474d289529bd9a178f06e422d970de8a8a7717a54ef4902"
    }
  }
}
