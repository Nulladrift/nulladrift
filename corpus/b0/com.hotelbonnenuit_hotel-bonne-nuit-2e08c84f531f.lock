                "description": "Nombre de nuits à renvoyer",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "room_id": {
                "description": "Facultatif : limiter à une seule chambre (room_id)",
                "type": "integer"
              },
              "start": {
                "description": "Première nuit, YYYY-MM-DD (par défaut : aujourd'hui)",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
