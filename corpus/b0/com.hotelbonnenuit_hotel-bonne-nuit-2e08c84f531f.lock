      "serverInfo": {
        "name": "hotel-bonne-nuit",
        "title": "Hôtel Bonne Nuit - Labuan Bajo",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Serveur de l'Hôtel Bonne Nuit (Labuan Bajo, Indonésie). check_availability : prix exacts et disponibilités d'un séjour (sans et avec petit-déjeuner). get_rate_calendar : prix par nuit sur une période (jusqu'à 365 nuits). book_room : réserve (chambre bloquée 15 min) et renvoie un lien de paiement Midtrans à payer ou à transmettre au client. Alternative : book_url (moteur officiel) ou WhatsApp +62 821-4674-2710.",
      "tools": [
        {
          "name": "book_room",
          "title": "Réserver une chambre (lien de paiement)",
          "description": "Crée une réservation NON PAYÉE (chambre bloquée 15 minutes) et renvoie un lien de paiement Midtrans (payment_url). Le prix est calculé par l'hôtel. Sans paiement sous 15 minutes, la réservation est annulée automatiquement. Annulation gratuite jusqu'à 5 jours avant l'arrivée, ensuite non remboursable. Petit-déjeuner optionnel (breakfast=true). Données nécessaires : room_id d'une chambre disponible, dates, nom, email du client et acceptation de la politique d'annulation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_cancellation_policy": {
                "description": "true uniquement si le client a accepté la politique d'annulation",
                "type": "boolean"
              },
              "adults": {
                "default": 2,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "breakfast": {
                "default": false,
                "description": "true = petit-déjeuner inclus pour tous les occupants (75 000 IDR par personne et par nuit, enfant compris) ; le prix payé est alors total_price_with_breakfast",
                "type": "boolean"
              },
              "checkin": {
                "description": "Date d'arrivée, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "checkout": {
                "description": "Date de départ, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "Email du client (la confirmation y est envoyée)",
                "format": "email",
                "type": "string"
              },
              "first_name": {
                "description": "Prénom du client",
                "type": "string"
              },
              "last_name": {
                "description": "Nom de famille du client",
                "type": "string"
              },
              "notes": {
                "description": "Remarque facultative (heure d'arrivée, demande spéciale)",
                "type": "string"
              },
              "phone": {
                "description": "Téléphone du client avec indicatif pays (WhatsApp si possible)",
                "type": "string"
              },
              "room_id": {
                "description": "Identifiant (room_id) de la chambre disponible",
                "type": "integer"
              }
            },
            "required": ["accept_cancellation_policy", "checkin", "checkout", "email", "first_name", "last_name", "room_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Réserver une chambre (lien de paiement)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a966a0be8ae7877647447fa16bd28056a2190a6c0b4cf71a62f9b09db63154ce"
        },
        {
          "name": "check_availability",
          "title": "Disponibilités et prix",
          "description": "Disponibilités et prix EXACTS (IDR, taxes comprises) par type de chambre pour un séjour (max 30 nuits), calculés pour le nombre d'adultes et d'enfants demandé. Renvoie pour chaque chambre le prix total SANS petit-déjeuner (total_price) et AVEC petit-déjeuner (total_price_with_breakfast), son room_id et un lien book_url vers le moteur de réservation officiel de l'hôtel. Enfant = moins de 8 ans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "checkin": {
                "description": "Date d'arrivée, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "checkout": {
                "description": "Date de départ, YYYY-MM-DD (après checkin)",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["checkin", "checkout"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Disponibilités et prix"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e110289d7d9df607078806fbec5d6b0c1078e33dfe426b89627267a293e46b7b"
        },
        {
          "name": "get_hotel_info",
          "title": "Infos de l'hôtel",
          "description": "Infos générales sur l'Hôtel Bonne Nuit (Labuan Bajo, Komodo, Indonésie) : adresse, horaires d'arrivée/départ, équipements, moyens de paiement, politique d'annulation, contact.",
