        {
          "name": "get_rate_calendar",
          "title": "Calendrier des tarifs",
          "description": "Calendrier des tarifs : prix exact par nuit (IDR, sans petit-déjeuner) et unités libres de chaque type de chambre, sur une période allant jusqu'à 365 nuits. Utile pour comparer des dates ou trouver les nuits les moins chères. Pour un séjour précis, utiliser ensuite check_availability.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
