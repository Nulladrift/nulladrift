      "serverInfo": {
        "name": "allratestoday",
        "title": "AllRatesToday exchange rates",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AllRatesToday: live mid-market exchange rates for 160+ currencies and the OFFICIAL published rates of 123 central banks and 6 tax authorities (ECB, Fed, BoE, RBI, HMRC, US Treasury…). Never quote an exchange rate from memory — call a tool and cite the returned rate_date or time. For tax, customs, invoicing or audit questions use get_official_rates (the rule names a publisher, not \"the market\"); for everyday conversions use get_exchange_rate; for an index, research series or report that must be reproducible use get_reference_rate (16:00 London daily snapshot). Keyless calls return official ECB/central-bank tables; an API key unlocks real-time rates, history, dated lookups and cross-bank comparison — request_trial_key issues one instantly (100 calls, no account), or register free at https://allratestoday.com/register. Attribution when rates are shown publicly: \"Rates by AllRatesToday\".",
      "tools": [
        {
          "name": "compare_official_rates",
          "title": "Compare one pair across every bank",
          "description": "One currency pair across ALL institutions at once — 'what does each central bank say USD/EUR is?', 'spread between official USD/LKR rates'. Returns every covered bank's latest official rate for the pair plus { min, max, median, spread_bps } over fresh sources. Banks are never mixed: derived rates are cross-computed within each bank's own table. API key required (free tier). Methodology: https://allratestoday.com/official-rates-methodology/",
          "inputSchema": {
            "properties": {
              "source": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare one pair across every bank"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29426a75ab4773008b77569387a7e585e4c637bb1df894e0a6d48abdc4480245"
        },
        {
          "name": "get_exchange_rate",
          "title": "Get live exchange rate",
          "description": "Use this when the user asks 'what is X in Y?', 'convert X to Y', 'current rate of EUR/USD', or any single fiat-to-fiat exchange rate question. Returns { rate, source } meaning 1 source = rate target. Without an API key it answers from the official ECB daily reference table (~30 majors) and says so in `note` — relay the `rate_date`. With a key it is the real-time mid-market rate for 160+ currencies. For several targets at once use get_rates_authenticated; for a time series use get_historical_rates; for a specific institution's official rate use get_official_rates.",
          "inputSchema": {
            "properties": {
              "source": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live exchange rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5fcc82f42058c835f331cc5a117e050ef30d7eadc3b74d064719a45d9444bcc"
        },
        {
          "name": "get_historical_rates",
          "title": "Get historical rate time-series",
          "description": "Fixed-window time series ending now: 'how has EUR/USD moved this week', 'last month of GBP/JPY', '1-year AUD/USD'. Returns { source, target, period, data: [{ date, rate, timestamp }] }. Sampling: 1d=hourly, 7d/30d=daily, 1y=weekly. Requires an API key on a paid plan; free and trial keys get a 403. For a specific past datetime use get_rates_authenticated with `time`.",
          "inputSchema": {
            "properties": {
              "period": {
                "description": "Lookback window ending now. Defaults to '7d'.",
                "enum": ["1d", "7d", "30d", "1y"],
                "type": "string"
              },
              "source": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get historical rate time-series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d3e150021ca0b2e0ee70a0a10a061642e0bace526aec7bed1b30243e93124044"
        },
        {
          "name": "get_official_rate_history",
          "title": "Get a bank's official rate history",
          "description": "Date-by-date series of one bank's OFFICIAL rates — 'ECB USD rate for every day of 2025', 'how did the CBSL rate move last quarter'. Returns { series: [{ date, rate, rate_type, derived, method }] }. Give either `symbol` (vs the bank's home currency) or a source+target pair; from/to default to the last year. API key with a paid plan, BILLED BY VOLUME: one call per month of history covered — keep ranges narrow. For publication dates without values use get_publication_calendar.",
          "inputSchema": {
            "properties": {
              "bank": {
                "description": "Bank/authority code as returned by list_central_banks (lowercase, e.g. 'ecb', 'fed', 'boj', 'hmrc', 'cbsl'). Codes are short abbreviations of the institution, not country codes.",
                "pattern": "^[A-Za-z0-9-]{2,20}$",
                "type": "string"
              },
              "from": {
                "description": "Start date. Defaults to one year ago.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "source": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "symbol": {
                "description": "One currency vs the bank's home currency, e.g. 'USD'. Alternative to source+target.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "to": {
                "description": "End date. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["bank"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a bank's official rate history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13e7d468d10f92c8e0fd273c375488af5142fa70106cefc4345a52ba240dbfd0"
        },
        {
          "name": "get_official_rates",
          "title": "Get a bank's official published rates",
          "description": "OFFICIAL rates a named institution published — 'what is the ECB rate for USD?', 'Bank of Japan rate on 2026-03-14', 'HMRC rate for invoicing'. These are the fixed, citable rates for compliance, tax, customs and accounting — NOT live market rates. Omit `date` for the newest published table (no API key needed); give `date` (API key, paid plan) for the table in force that day — weekends/holidays roll back to the last published date and the response's `rate_date` says which. Omit source/target for the full table; give both for one pair — cross-computed inside the bank's own table when not directly published, flagged `derived`. Always cite the returned `rate_date`.",
          "inputSchema": {
            "properties": {
              "bank": {
                "description": "Bank/authority code as returned by list_central_banks (lowercase, e.g. 'ecb', 'fed', 'boj', 'hmrc', 'cbsl'). Codes are short abbreviations of the institution, not country codes.",
                "pattern": "^[A-Za-z0-9-]{2,20}$",
                "type": "string"
              },
              "date": {
                "description": "Optional YYYY-MM-DD. Omit for the latest table.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "source": {
                "description": "Optional. With target, narrows to one pair.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "Optional. With source, narrows to one pair.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["bank"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a bank's official published rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:18b725f3058c991c2b1aba8dfc126e4703e8b0e3e3ab0fb3f39b9e65b90a97ad"
        },
        {
          "name": "get_publication_calendar",
          "title": "Get a bank's publication calendar",
          "description": "Which dates a bank actually published a rate table — 'did the ECB publish on 2026-01-01?', 'how often does the US Treasury publish?'. Dates only, no values, so it is on every plan (API key required, free tier). Give `year` or a from/to range; large ranges are capped and flagged `truncated`.",
          "inputSchema": {
            "properties": {
              "bank": {
                "description": "Bank/authority code as returned by list_central_banks (lowercase, e.g. 'ecb', 'fed', 'boj', 'hmrc', 'cbsl'). Codes are short abbreviations of the institution, not country codes.",
                "pattern": "^[A-Za-z0-9-]{2,20}$",
                "type": "string"
              },
              "from": {
                "description": "Calendar date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Calendar date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "year": {
                "description": "Whole calendar year, e.g. '2026'.",
                "pattern": "^\\d{4}$",
                "type": "string"
              }
            },
            "required": ["bank"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a bank's publication calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1546a8e1d40f1496c6e39f5d857cf75f149ff2af6385c62541a7857e0d57c4c3"
        },
        {
          "name": "get_rates_authenticated",
          "title": "Get multi-target or point-in-time rates",
          "description": "One source against several targets in a single call ('USD vs EUR, GBP, JPY'), or the rate at a specific past datetime, optionally bucketed by hour/day/week/month. Returns { rates: [{ rate, source, target, time }] }. Requires an API key (free tier for latest rates; a past datetime needs a paid plan).",
          "inputSchema": {
            "properties": {
              "group": {
                "description": "Aggregation bucket. Omit for raw output.",
                "enum": ["hour", "day", "week", "month"],
                "type": "string"
              },
              "source": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "One or more ISO 4217 codes, comma-separated, no spaces: 'EUR' or 'EUR,GBP,JPY'.",
                "pattern": "^[A-Za-z]{3}(,[A-Za-z]{3})*$",
                "type": "string"
              },
              "time": {
                "description": "ISO 8601 UTC timestamp, e.g. '2025-03-14T12:00:00Z'. Omit for latest.",
                "type": "string"
              }
            },
            "required": ["source", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get multi-target or point-in-time rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fd3fe709c00e3bc92da26b5e0635cf343d0f0a8629b3831f2d364e5c4e10ab5d"
        },
        {
          "name": "get_reference_rate",
          "title": "Get the Daily Reference Rate (16:00 London)",
          "description": "AllRatesToday's once-a-day, never-revised mid-market rate: the per-currency median of five samples in a five-minute window centred on 16:00 London, published each business day. Use it when the user needs ONE reproducible rate per day — index levels, return series, research datasets, month-end reports — rather than a live quote (get_exchange_rate) or an institution's official rate (get_official_rates). Keyless: returns the latest table, or one pair with source/target (cross via USD, flagged derived). With a key, `date` returns the table for a past business day. Not the WM/Refinitiv fix and not a registered benchmark — relay the disclaimer and the rate_date.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional past business day, YYYY-MM-DD (API key, paid plan). Omit for the latest table.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "source": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "target": {
                "description": "ISO 4217 currency code, 3 letters, case-insensitive (e.g. 'USD', 'EUR', 'GBP'). Fiat only — no crypto, no commodities.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the Daily Reference Rate (16:00 London)"
          },
          "behavior": {
