          "name": "list_central_banks",
          "title": "List covered central banks & tax authorities",
          "description": "Call this FIRST when you need a bank code, or for 'which central banks do you cover?' / 'do you have rates from X?'. Returns every covered source — 123 central banks plus 6 tax authorities (HMRC, US Treasury, Swiss BAZG, India's CBIC, Peru's SUNAT, US IRS yearly averages) — with `code` (what every other official-rates tool takes as `bank`), name, latest publication date and whether it is behind schedule. No API key needed.",
