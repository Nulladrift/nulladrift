        {
          "name": "checkleaked_leakradar_raw_part",
          "description": "Raw stealer-log files, manual browsing step 3 of 3: read the text of ONE block (container_id + entry_path + seq from checkleaked_leakradar_raw_search or checkleaked_leakradar_raw_parts). Locked blocks come back redacted (censored=true, █); auto_unlock=true (default) returns the plaintext and spends a credit. For search-and-extract in one call use checkleaked_leakradar_raw_search_lines.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "auto_unlock": {
                "description": "Unlock and return plaintext (default true, costs a credit). Set false to get the redacted block.",
                "type": "boolean"
              },
              "container_id": {
                "description": "Container id of the block",
                "type": "integer"
              },
              "entry_path": {
                "description": "Entry path of the block",
                "type": "string"
              },
              "overlap_chars": {
                "description": "Overlap size in characters (default 256)",
                "maximum": 8192,
                "minimum": 0,
                "type": "integer"
              },
              "seq": {
                "description": "Sequential block number to fetch",
                "minimum": 0,
                "type": "integer"
              },
