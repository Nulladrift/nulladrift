        },
        {
          "name": "checkleaked_webhook_set",
          "description": "Create or update the account's tracking webhook. The response carries the plaintext `secret` ONLY when the webhook is created or rotate_secret=true — store it then, it cannot be read back later. Destination: HTTPS only, on a public host (no private/loopback IPs, no localhost). Events: `tracking.finding` — one JSON POST per tracking finding. Every delivery carries `X-CheckLeaked-Event`, `X-CheckLeaked-Delivery` (uuid) and `X-CheckLeaked-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, \"<t>.<raw body>\")>`; verify by recomputing the HMAC over `<t>.<raw body>` with the stored secret and comparing constant-time (Node example in resource checkleaked://webhooks). Retries at 2s and 8s on network error / 5xx / 429; auto-disabled after 20 consecutive failures. Formats: a Slack, Discord, Microsoft Teams or Google Chat webhook URL gets the finding rendered natively for that service (format auto-detected); any other URL gets the generic signed JSON event.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "enabled": {
                "description": "Enable/disable deliveries (default true on create)",
                "type": "boolean"
              },
              "format": {
                "description": "Delivery shape: json = generic signed event (Zapier, Make, n8n, SIEM); slack = Block Kit for a Slack Incoming Webhook (Mattermost/Rocket.Chat compatible); discord = webhook embed; teams = Adaptive Card for a Microsoft Teams Workflows webhook; google_chat = cardsV2 message. auto (default) detects the service from the URL host on create and whenever the URL changes.",
                "enum": ["auto", "json", "slack", "discord", "teams", "google_chat"],
                "type": "string"
              },
              "rotate_secret": {
                "description": "Issue a new signing secret (returned once, in this response)",
                "type": "boolean"
              },
              "url": {
                "description": "HTTPS destination URL on a public host",
                "format": "uri",
                "pattern": "^https\\:\\/\\/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create, update, or rotate the tracking webhook"
