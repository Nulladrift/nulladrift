        {
          "name": "checkleaked_webhook_get",
          "description": "Show the account's tracking webhook — url, enabled, secret_hint (last 4 chars), fail_count, last_status / last_error / last_attempt / last_success — or null when none is configured. The secret itself is never returned here; only checkleaked_webhook_set returns it, on create or rotate. Destination: HTTPS only, on a public host (no private/loopback IPs, no localhost). Events: `tracking.finding` — one JSON POST per tracking finding. Every delivery carries `X-CheckLeaked-Event`, `X-CheckLeaked-Delivery` (uuid) and `X-CheckLeaked-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, \"<t>.<raw body>\")>`; verify by recomputing the HMAC over `<t>.<raw body>` with the stored secret and comparing constant-time (Node example in resource checkleaked://webhooks). Retries at 2s and 8s on network error / 5xx / 429; auto-disabled after 20 consecutive failures. Formats: a Slack, Discord, Microsoft Teams or Google Chat webhook URL gets the finding rendered natively for that service (format auto-detected); any other URL gets the generic signed JSON event.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
