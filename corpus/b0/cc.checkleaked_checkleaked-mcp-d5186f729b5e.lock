        {
          "name": "checkleaked_leak_check",
          "description": "Default breach search — start here. Looks a value up in the LeakCheck breach-dump index (merged with HIBP breach names) and returns every leaked record that contains it: { found, foundWithPass, results: [{ email, username, password, name, phone, ip, address, dob, sources: [{ Name, BreachDate }] }] }. Works for email, username, phone, domain (every account on it), keyword, password and hashes. Free plan: email and username only, with every field except email, username and sources masked; Plus adds phone and password searches, Pro every type, and both return plaintext (see checkleaked_site_plans). Uses one daily lookup only when something is found. For infostealer-captured credentials use checkleaked_leakradar_email_search; for name / street address / IP / VIN searches use checkleaked_dehashed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check": {
                "description": "Value to look up: an email, username, phone number, domain, keyword, password or hash",
                "minLength": 3,
                "type": "string"
              },
              "type": {
                "description": "What `check` is. auto = detect (email, phone, hash or username); email; username; phone (digits); domain = every account on that email domain; origin = credentials leaked FROM that website; keyword = substring match; password = records using that password; hash = SHA-256 of an email (may be cut to 24 chars); phash = SHA-256 password hash. Legacy aliases: login = username, mass = keyword, pass_email / pass_login = password, domain_email = domain",
                "enum": ["auto", "email", "username", "keyword", "domain", "phone", "hash", "password", "origin", "phash", "mass", "login", "pass_email", "domain_email", "pass_login"],
                "type": "string"
              }
            },
            "required": ["check", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Search LeakCheck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:98ceb63a618a8a81e7f54a05e15b06d50fa50c8f7133026a420c16845d139218"
        },
        {
          "name": "checkleaked_leakradar_advanced_search",
          "description": "LeakRadar stealer-log credential index, filtered search: combine facets instead of one identity, e.g. every credential captured for a site (url_domain / url_host), usernames or passwords containing a string, a password-strength class or an indexed-date window. Each field takes an array (OR by default, force_and=true for AND). Rows come back unlocked: { items: [{ id, url, username, password, password_strength, added_at }], total }. For a single email or username use checkleaked_leakradar_email_search; for a company-wide count only use checkleaked_leakradar_domain_summary. Plus/Pro; 1 credit per page that unlocks new rows.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "added_from": {
                "description": "Only leaks indexed on/after this ISO datetime",
                "type": "string"
              },
              "added_to": {
                "description": "Only leaks indexed on/before this ISO datetime",
                "type": "string"
              },
              "email_domain": {
                "description": "Email domain must contain",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "email_host": {
                "description": "Email host must contain",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "force_and": {
                "description": "Require all values within each field (AND)",
                "type": "boolean"
              },
              "page": {
                "description": "1-based page index (default 1)",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "description": "Items per page, max 50 (default 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "password": {
