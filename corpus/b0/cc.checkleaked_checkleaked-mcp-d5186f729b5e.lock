        {
          "name": "checkleaked_experimental",
          "description": "Third breach index (Snusbase), useful for reverse lookups the other two do not offer: every account that used a given password or password hash, or that last logged in from an IP (lastip). Also searches email, username and name. Returns { found, foundWithPass, results: [{ email, username, password, hash, lastip, name, sources, line }] }. Any plan can call it; without Plus/Pro/Unlock the password, hash and line fields are masked. Uses one daily lookup only when fresh results are found. Start with checkleaked_leak_check; use this to cross-check or for password/hash/lastip pivots.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entry": {
                "description": "Value to search, 4-50 chars",
                "maxLength": 50,
                "minLength": 4,
                "type": "string"
              },
              "type": {
                "description": "Field to match. mass = emails that START WITH `entry` (prefix wildcard); lastip = last login IP; hash = a password hash as stored in the breach",
                "enum": ["username", "mass", "email", "lastip", "password", "name", "hash"],
                "type": "string"
              }
            },
            "required": ["entry", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
