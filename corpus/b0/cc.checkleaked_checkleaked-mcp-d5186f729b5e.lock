      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "checkleaked-mcp-server",
        "version": "2.0.0",
        "description": "MCP server for CheckLeaked.cc — search breach databases, crack hashes, run OSINT lookups (WHOIS, name insight, k-anonymity password/email checks), browse the breach registry and news, track entries for new breaches, and manage signed tracking webhooks."
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "checkleaked_crack_hash",
          "description": "Turn a password hash back into its plaintext by looking it up in a table of hashes already cracked from breach data (no brute force). Takes hex hashes such as MD5, NTLM, SHA-1 or SHA-256. Returns { hash, plain } or a not_found error. Plus/Pro/Unlock; no lookup is spent. To check whether a known password is leaked use checkleaked_pwned_password instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "The hash, at least 32 characters (e.g. a 32-char MD5/NTLM or 40-char SHA-1 hex string)",
                "maxLength": 100,
                "minLength": 32,
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Crack a hash"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7c5c603aa48084def4b90fd28dc9ff8edfdb59a2e8fd7793db1cb4c26a30b165"
        },
        {
          "name": "checkleaked_dehashed",
          "description": "Second breach index (DeHashed), for fields checkleaked_leak_check cannot search: a person's full name, a street address, an IP address or a vehicle VIN, plus email / username / phone. Returns { entries: [{ email, username, password, hashed_password, name, address, phone, ip_address, obtained_from }], results, pages, page }. Live queries need Plus or Pro; other plans get previously stored results with passwords masked. Uses one daily lookup only when entries come back. Use it after checkleaked_leak_check to widen coverage, or first for name/address/IP/VIN.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entry": {
                "description": "Value to search, 4-50 chars (e.g. a full name, a street address, an IP)",
                "maxLength": 50,
                "minLength": 4,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Result page, 1-based (default 1); see `pages` in the response",
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Field to match. free = send `entry` as a raw DeHashed query across all fields",
                "enum": ["email", "username", "ip_address", "name", "address", "phone", "vin", "free"],
                "type": "string"
              }
            },
            "required": ["entry", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Search Dehashed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4dc66b67b89a9bc3769367d6d7df091b9bd559bd6a7a2401c5c92697285f5602"
        },
        {
          "name": "checkleaked_domain_whois",
          "description": "WHOIS registration record of a domain: registrar, creation and expiry dates, name servers, status and registrant fields where published. Returns { domain, found, whois }. Use to date or attribute a domain; it is not a breach search (for accounts on a domain use checkleaked_leak_check with type=domain, for its exposure use checkleaked_leakradar_domain_summary). No credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
