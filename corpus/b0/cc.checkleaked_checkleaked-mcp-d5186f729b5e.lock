        {
          "name": "checkleaked_private_bot_set",
          "description": "Create, replace or pause/resume the account's private bot on one platform. Pass `token` to (re)store a token — validated first, saved encrypted, never echoed back. Pass `enabled` alone (no token) to pause (false) or resume (true) an existing bot. Returns { bot } with state, bot_username, token_hint and invite_url; errors: plan not Pro/Plus, private bots not configured on the server, or the token-validation reason. Private bots are Pro/Plus only. Bring your own bot token from the Discord Developer Portal (Bot → Reset Token) or Telegram @BotFather (/newbot). The token is validated against Discord (`users/@me`) / Telegram (`getMe`), stored encrypted (AES-256-GCM) and NEVER returned — only its last 4 chars (`token_hint`) plus the validated `bot_username` / `bot_id`. The bot runs on CheckLeaked's servers with the same commands as the shared CheckLeaked bots and answers ONLY the owner's linked account (anyone else gets \"This private bot answers only the account that runs it.\"), so nobody else can spend the owner's credits. One bot per platform per account; a lapsed plan stops the bot. Discord bots need no privileged intents (slash commands and DMs work; prefix commands in servers cannot read message content) — the response's `invite_url` adds the bot to a server.",
