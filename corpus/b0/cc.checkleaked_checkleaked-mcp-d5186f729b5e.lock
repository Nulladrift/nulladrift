        {
          "name": "checkleaked_leakradar_pwned",
          "description": "Count how often a password appears in the LeakRadar STEALER-LOG corpus (passwords captured by infostealer malware), with k-anonymity: the SHA-1 is computed inside this MCP process and only its first 5 hex chars are sent. Returns { pwned, count, prefix }. The public HIBP Pwned Passwords set is checked by checkleaked_pwned_password instead (free); to turn a hash back into a password use checkleaked_crack_hash.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "password": {
                "description": "Password to check (hashed locally, never sent)",
                "minLength": 1,
                "type": "string"
              },
              "sha1": {
                "description": "Its SHA-1 as 40 hex chars, instead of the password (only the first 5 are sent)",
                "pattern": "^[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a password against LeakRadar"
          },
          "behavior": {
            "destructive": false,
