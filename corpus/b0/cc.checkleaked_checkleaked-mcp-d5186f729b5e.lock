        {
          "name": "checkleaked_email_breach_kanon",
          "description": "Privacy-first yes/no for an email address WITHOUT sending it: SHA-256 of the lowercased, trimmed email is computed inside the MCP process and only its first 24 hex chars are sent. Returns { found, sources[], fields[] }: which breaches contain it and which data types leaked, but no records or passwords. Use when the user does not want the address itself sent, or as a free first check; for the actual leaked records use checkleaked_leak_check. No credits; the email is never echoed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
