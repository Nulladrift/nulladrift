{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/package-latest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/packages"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "package-latest",
        "title": "Package Latest Version Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before adding or pinning an npm or PyPI dependency, check its current latest version, whether a version is deprecated or yanked, and how many major versions behind a remembered version is. Data: npm registry and PyPI JSON API, cached up to 1 hour.",
      "tools": [
        {
          "name": "check_version",
          "title": "Check a package version",
          "description": "Is this version real, yanked, and how far behind latest (major versions released since)?",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ecosystem": {
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "name": {
                "maxLength": 214,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ecosystem", "name", "version"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "latest": {
                "type": "string"
              }
            },
            "required": ["latest"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4df6b24389806ff7acc6fd510b3233b610843547eb623ce476295008199e9803"
        },
        {
          "name": "latest_version",
          "title": "Latest version of a package",
          "description": "Current latest version of an npm or PyPI package, its release date (PyPI; npm gives registryModified instead), and the deprecation message if the latest is deprecated.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ecosystem": {
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "name": {
                "maxLength": 214,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ecosystem", "name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "latest": {
                "type": "string"
              }
            },
            "required": ["latest"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:212b64437b359823bd8fba838695805c1f6f0cf0e24aeb2edfc19c32b9b99a31"
        }
      ],
      "digest": "sha256:9bbaaf366f15ebc3178d9caa567a648613a1b0e241491f032e2007d7c92e6799"
    }
  }
}
