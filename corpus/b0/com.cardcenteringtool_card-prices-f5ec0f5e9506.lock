                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_market_usd": {
                "default": 5,
                "description": "Ignore cards whose raw price is below this.",
                "maximum": 1000,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "basis": {
                      "description": "Which price series the change refers to",
