        {
          "name": "liquid_movers",
          "title": "Liquid movers (rising cards that actually sell)",
          "description": "Use this when the user wants cards that are both rising in price and easy to sell: recent gainers filtered to cards with at least 25 recorded sales a year and a raw price of at least $5, across all games and sports. Better than trending_cards for flipping or selling decisions. Do not use for a single named card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
