              },
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "change_pct": {
                      "type": ["number", "null"]
                    },
                    "game": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Catalog card id. Pass to get_card_prices, grading_roi or get_price_history.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "number": {
                      "type": ["string", "null"]
                    },
                    "psa10_market_usd": {
                      "description": "PSA 10 market price in USD",
                      "type": ["number", "null"]
                    },
                    "rarity": {
                      "type": ["string", "null"]
                    },
                    "raw_market_usd": {
                      "description": "Ungraded (raw) market price in USD",
                      "type": ["number", "null"]
                    },
                    "sales_per_year": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
