        {
          "name": "grading_roi",
          "title": "Is this card worth grading?",
          "description": "Use this when the user asks whether a card is worth grading, submitting to PSA/CGC/BGS/SGC/TAG, or what a PSA 10 adds. Returns raw vs PSA 9 vs PSA 10 market prices, the gem premium, net profit after grading fees per outcome, expected value by gem probability, the break-even gem rate, which company pays most, and a plain-language verdict. Requires a card id from search_cards. It does not assess the condition of the user's copy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "card_id": {
                "description": "Catalog card id from search_cards.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "grading_fee_usd": {
                "description": "Grading fee to assume. Defaults to a $25 economy tier; the table also shows $50 and $150.",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["card_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assumed_fee_usd": {
                "type": "number"
              },
              "break_even_gem_probability": {
                "description": "Chance of a PSA 10 needed to break even at the assumed fee; null when grading never breaks even",
                "type": ["number", "null"]
              },
              "captured_on": {
                "type": ["string", "null"]
              },
              "card": {
                "additionalProperties": false,
                "properties": {
                  "game": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "number": {
                    "type": ["string", "null"]
                  },
                  "set": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["game", "id", "name", "number", "set"],
                "type": "object"
              },
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "expected_value": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expected_net_usd": {
                      "type": "number"
                    },
                    "expected_sale_usd": {
                      "type": "number"
                    },
                    "gem_probability": {
                      "type": "number"
                    }
                  },
                  "required": ["expected_net_usd", "expected_sale_usd", "gem_probability"],
                  "type": "object"
                },
                "type": "array"
              },
              "gem_premium_multiple": {
                "description": "PSA 10 price ÷ raw price",
                "type": ["number", "null"]
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "card_page": {
                    "type": "string"
                  },
                  "measure_centering": {
                    "type": "string"
                  },
                  "worth_grading": {
                    "type": "string"
                  }
                },
                "required": ["card_page", "measure_centering", "worth_grading"],
                "type": "object"
              },
              "net_after_fee": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "net_usd_by_fee": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "fee_usd": {
                            "type": "number"
                          },
                          "net_usd": {
                            "type": "number"
                          }
                        },
                        "required": ["fee_usd", "net_usd"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "outcome": {
                      "type": "string"
                    },
                    "sale_usd": {
                      "type": "number"
                    }
                  },
                  "required": ["net_usd_by_fee", "outcome", "sale_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "psa10_usd": {
                "type": ["number", "null"]
              },
              "psa9_usd": {
                "type": ["number", "null"]
              },
              "raw_market_usd": {
                "type": ["number", "null"]
              },
              "top_grade_by_company": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "centering_tolerance_back": {
                      "type": "string"
                    },
                    "centering_tolerance_front": {
                      "type": "string"
                    },
                    "company": {
                      "type": "string"
                    },
                    "grade": {
                      "type": "string"
                    },
                    "value_usd": {
                      "type": "number"
                    }
                  },
                  "required": ["centering_tolerance_back", "centering_tolerance_front", "company", "grade", "value_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "verdict": {
                "anyOf": [
                  {
                    "additionalProperties": false,
