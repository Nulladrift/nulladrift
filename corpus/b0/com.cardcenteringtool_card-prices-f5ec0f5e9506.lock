        {
          "name": "search_cards",
          "title": "Search card prices",
          "description": "Use this first when the user names a trading card and wants its value, price, or whether to grade it. Searches 1.5M+ Pokémon, Magic, Yu-Gi-Oh!, One Piece, Lorcana, sports (baseball, basketball, football, hockey, soccer, wrestling, UFC and more) and entertainment cards by name, set, number and year, returning ungraded and PSA 10 market prices in USD from real sold listings. Returns card ids for get_card_prices, grading_roi and get_price_history. Do not use for sealed product, for cards you already have an id for, or for price prediction.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Restrict to one game or sport. Omit when unsure.",
                "enum": ["pokemon", "magicthegathering", "yugioh", "onepiece", "lorcana", "riftbound", "gundam", "dragonball", "digimon", "baseball", "basketball", "football", "hockey", "soccer", "wrestling", "ufc", "racing", "tennis", "golf", "boxing", "marvel", "starwars", "gpk", "entertainment", "othertcg"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Card name, optionally with set, number or year. Examples: \"Umbreon VMAX Evolving Skies\", \"1986 Fleer Jordan\", \"Charizard base set 4/102\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "set_id": {
                "description": "Expansion id from list_sets, to search inside one set.",
                "maxLength": 60,
                "pattern": "^[a-zA-Z0-9_.-]*$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
