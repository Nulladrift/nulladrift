                  "required": ["basis", "change_30d_pct", "game", "id", "name", "number", "price_30d_ago_usd", "price_now_usd", "psa10_market_usd", "raw_market_usd", "set", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "criteria": {
                "type": "string"
              },
              "direction": {
                "enum": ["up", "down"],
                "type": "string"
              },
              "excluded_unstable": {
                "description": "Candidates dropped because their own 40-day series did not hold together (too few captures, a baseline that swings >2×, a >6× range, or a one-capture jump).",
                "type": "integer"
              },
              "game": {
                "type": ["string", "null"]
              },
