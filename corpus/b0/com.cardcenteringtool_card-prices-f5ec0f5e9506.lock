        },
        {
          "name": "get_set_cards",
          "title": "Cards in a set with prices",
          "description": "Use this when the user wants the most valuable cards in a specific set or a priced checklist of a set. Requires a set id from list_sets. Returns raw and PSA 10 USD prices per card. Do not use for a single named card; use search_cards instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "game": {
                "enum": ["pokemon", "magicthegathering", "yugioh", "onepiece", "lorcana", "riftbound", "gundam", "dragonball", "digimon", "baseball", "basketball", "football", "hockey", "soccer", "wrestling", "ufc", "racing", "tennis", "golf", "boxing", "marvel", "starwars", "gpk", "entertainment", "othertcg"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "set_id": {
                "description": "Expansion id from list_sets.",
                "maxLength": 60,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_.-]+$",
                "type": "string"
              },
              "sort": {
                "default": "value",
                "description": "\"value\" = most valuable first; \"number\" = checklist order.",
                "enum": ["value", "number"],
                "type": "string"
              }
            },
            "required": ["game", "set_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "game": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Catalog card id. Pass to get_card_prices, grading_roi or get_price_history.",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "number": {
                      "type": ["string", "null"]
                    },
                    "psa10_market_usd": {
                      "description": "PSA 10 market price in USD",
                      "type": ["number", "null"]
                    },
                    "rarity": {
                      "type": ["string", "null"]
                    },
                    "raw_market_usd": {
                      "description": "Ungraded (raw) market price in USD",
                      "type": ["number", "null"]
                    },
                    "set": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "Card page with the full price ladder and history",
                      "type": "string"
                    }
                  },
                  "required": ["game", "id", "name", "number", "raw_market_usd", "set", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "game": {
                "type": "string"
              },
              "set_id": {
                "type": "string"
              },
              "set_name": {
                "type": ["string", "null"]
              },
              "total_cards": {
                "type": "integer"
              }
            },
            "required": ["cards", "count", "game", "set_id", "set_name", "total_cards"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cards in a set with prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
