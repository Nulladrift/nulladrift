        {
          "name": "get_price_history",
          "title": "Get price history",
          "description": "Use this when the user asks how a card's price has changed over weeks or months, or wants a trend for the raw or a PSA-graded series. Returns dated USD market values for the last 7 to 180 days. Requires a card id from search_cards. Do not use for forecasts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "card_id": {
                "description": "Catalog card id from search_cards.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "days": {
                "default": 90,
                "maximum": 180,
                "minimum": 7,
                "type": "integer"
              },
              "grade": {
                "description": "PSA grade for a graded series, e.g. \"10\" or \"9\". Omit for the raw (ungraded) series.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["card_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "card_id": {
                "type": "string"
              },
              "change_note": {
                "description": "Set when one step between consecutive captures accounts for the change: usually a data correction, not a market move. change_pct is null in that case.",
                "type": ["string", "null"]
              },
              "change_pct": {
                "description": "First-to-last change; null when change_note is set because a single step carries it.",
                "type": ["number", "null"]
              },
              "coverage": {
                "additionalProperties": false,
                "description": "How many of the requested days have a capture, and how to read repeated or sparse values.",
                "properties": {
                  "days_with_data": {
                    "type": "integer"
                  },
                  "note": {
                    "type": "string"
                  }
                },
                "required": ["days_with_data", "note"],
                "type": "object"
              },
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "first_usd": {
                "type": ["number", "null"]
              },
              "last_usd": {
                "type": ["number", "null"]
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "card_page": {
                    "type": "string"
                  }
                },
                "required": ["card_page"],
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "points": {
                "description": "Oldest first. Graded series only contain days with sales; gaps are normal.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "market_usd": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["date", "market_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "series": {
                "description": "\"raw\" or \"PSA <grade>\"",
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "variant": {
                "description": "The printing the series follows (e.g. \"holofoil\"); other printings are separate markets and are never mixed in.",
                "type": ["string", "null"]
              }
            },
            "required": ["card_id", "change_note", "change_pct", "coverage", "currency", "days", "first_usd", "last_usd", "links", "name", "points", "series", "source", "variant"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
