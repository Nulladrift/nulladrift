        {
          "name": "get_card_prices",
          "title": "Get card price ladder",
          "description": "Use this when the user wants the full current value of a specific card: ungraded prices by condition (NM/LP/MP/HP) and graded prices for every company and grade on record (PSA, CGC, BGS, SGC, TAG). Requires a card id from search_cards. Prices are USD market values from real sold listings, refreshed daily. Do not use to search by name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "card_id": {
                "description": "Catalog card id from search_cards, e.g. \"swsh7-215\" or \"pricecharting-1821843\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["card_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "captured_on": {
                "description": "Date of the latest price capture (UTC)",
                "type": ["string", "null"]
              },
              "card": {
                "additionalProperties": false,
                "properties": {
                  "game": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "number": {
                    "type": ["string", "null"]
                  },
                  "rarity": {
                    "type": ["string", "null"]
                  },
                  "set": {
                    "type": ["string", "null"]
                  },
                  "set_release_date": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["game", "id", "name", "number", "rarity", "set", "set_release_date"],
                "type": "object"
              },
              "currency": {
                "const": "USD",
                "type": "string"
              },
              "graded": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company": {
                      "type": "string"
                    },
                    "grade": {
                      "type": "string"
                    },
                    "market_usd": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["company", "grade", "market_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "card_page": {
                    "type": "string"
                  },
                  "worth_grading": {
                    "type": "string"
                  }
                },
                "required": ["card_page", "worth_grading"],
                "type": "object"
              },
              "other_variants": {
                "description": "Other printings of the same card id (reverse holo, 1st edition…) with their own prices. Never mix these with the main ladder.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "graded": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "company": {
                            "type": "string"
                          },
                          "grade": {
                            "type": "string"
                          },
                          "market_usd": {
                            "type": ["number", "null"]
                          }
                        },
                        "required": ["company", "grade", "market_usd"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "raw": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "condition": {
                            "type": "string"
                          },
                          "high_usd": {
                            "type": ["number", "null"]
                          },
                          "low_usd": {
                            "type": ["number", "null"]
                          },
                          "market_usd": {
                            "type": ["number", "null"]
                          }
                        },
                        "required": ["condition", "high_usd", "low_usd", "market_usd"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "variant": {
                      "type": "string"
                    }
                  },
                  "required": ["graded", "raw", "variant"],
                  "type": "object"
                },
                "type": "array"
              },
              "raw": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "condition": {
                      "type": "string"
                    },
                    "high_usd": {
                      "type": ["number", "null"]
                    },
                    "low_usd": {
                      "type": ["number", "null"]
                    },
                    "market_usd": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["condition", "high_usd", "low_usd", "market_usd"],
                  "type": "object"
                },
                "type": "array"
              },
              "raw_note": {
                "description": "Set when the raw condition ladder is out of order (thin data): treat raw prices as low confidence.",
                "type": ["string", "null"]
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "best_graded_usd": {
                    "type": ["number", "null"]
                  },
                  "change_30d_pct": {
                    "type": ["number", "null"]
                  },
                  "psa10_usd": {
                    "type": ["number", "null"]
                  },
                  "psa9_usd": {
                    "type": ["number", "null"]
                  },
                  "raw_market_usd": {
                    "type": ["number", "null"]
                  }
                },
                "required": ["best_graded_usd", "change_30d_pct", "psa10_usd", "psa9_usd", "raw_market_usd"],
                "type": "object"
              },
              "variant": {
                "description": "The printing the raw and graded rungs refer to (e.g. \"holofoil\", \"1st edition\"). Other printings are listed under other_variants.",
                "type": ["string", "null"]
              }
            },
            "required": ["captured_on", "card", "currency", "graded", "links", "other_variants", "raw", "raw_note", "summary", "variant"],
            "type": "object"
          },
          "annotations": {
