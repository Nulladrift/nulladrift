      "instructions": "Midpoint trading-card market data: 1.5M+ Pokémon, Magic, Yu-Gi-Oh!, One Piece, Lorcana, Gundam, sports (baseball, basketball, football, hockey, soccer, wrestling, UFC, golf, tennis, boxing, racing) and entertainment cards. All prices are USD market values from real sold listings, refreshed daily; raw = ungraded. Start with search_cards to get a card id, then get_card_prices, grading_roi or get_price_history. No account is needed and nothing is written.",
      "tools": [
        {
          "name": "best_cards_to_grade",
          "title": "Best cards to grade",
          "description": "Use this when the user asks which cards in a game, sport or set have the biggest payoff from grading. Ranks priced cards by expected net profit at a 50% gem rate (half PSA 10, half PSA 9, minus raw and the fee), requiring both PSA 9 and PSA 10 prices so thin-market outliers are excluded. Returns card ids for grading_roi. Do not use for a single named card.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game or sport to rank.",
                "enum": ["pokemon", "magicthegathering", "yugioh", "onepiece", "lorcana", "riftbound", "gundam", "dragonball", "digimon", "baseball", "basketball", "football", "hockey", "soccer", "wrestling", "ufc", "racing", "tennis", "golf", "boxing", "marvel", "starwars", "gpk", "entertainment", "othertcg"],
                "type": "string"
              },
              "grading_fee_usd": {
                "description": "Grading fee to assume. Defaults to $25.",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "default": 12,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "set_slug": {
                "description": "Optional set slug (as used on /sets/<game>/<slug>) to rank inside one set.",
                "maxLength": 80,
                "pattern": "^[a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assumed_fee_usd": {
                "type": "number"
              },
              "cards": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expected_net_usd_at_50pct_gem": {
                      "description": "0.5 × PSA 10 + 0.5 × PSA 9 − raw − fee",
                      "type": "number"
                    },
                    "gem_premium_multiple": {
                      "description": "PSA 10 ÷ raw",
                      "type": ["number", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "number": {
                      "type": ["string", "null"]
                    },
                    "psa10_usd": {
                      "type": "number"
                    },
                    "psa9_usd": {
                      "type": "number"
                    },
                    "raw_market_usd": {
                      "type": "number"
                    },
                    "set": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["expected_net_usd_at_50pct_gem", "gem_premium_multiple", "id", "name", "number", "psa10_usd", "psa9_usd", "raw_market_usd", "set", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "criteria": {
                "type": "string"
              },
              "game": {
                "type": "string"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "worth_grading_index": {
                    "type": "string"
                  }
                },
                "required": ["worth_grading_index"],
                "type": "object"
              }
            },
            "required": ["assumed_fee_usd", "cards", "count", "criteria", "game", "links"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
