                    "change_30d_pct": {
                      "type": "number"
                    },
                    "game": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "number": {
                      "type": ["string", "null"]
                    },
                    "price_30d_ago_usd": {
                      "type": "number"
                    },
                    "price_now_usd": {
                      "type": "number"
                    },
                    "psa10_market_usd": {
                      "type": ["number", "null"]
                    },
                    "raw_market_usd": {
                      "type": ["number", "null"]
                    },
