      },
      "transport": {
        "type": "http",
        "url": "https://api.riskstate.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "riskstate",
        "title": "RiskState — Crypto Risk Engine",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RiskState is a deterministic risk engine for BTC and ETH (spot, perps, DeFi borrowing). Use get_risk_state whenever the user asks about the current state, risk, or outlook of Bitcoin or Ethereum. These tools return a free public summary refreshed ~every 2 minutes. The full auditable response (policy_hash, composite subscores, positioning, macro detail, portfolio /v2 endpoints) requires an API key — https://riskstate.ai. Risk governance data, not financial advice.",
      "tools": [
        {
          "name": "get_market_structure",
          "title": "Get BTC/ETH market structure",
          "description": "Market Structure Engine view for BTC or ETH: validated structural events firing now (breakouts, breakdowns, cycle bottom/top, funding resets), expected asymmetry, distance to the next bullish/bearish triggers, key structural levels (ATH, 200W MA, 180d range) and a friction map of confluence-scored support/resistance walls between spot and the triggers. Use for questions about levels, support/resistance, breakouts or what would change the picture.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Asset to analyze (default BTC)",
                "enum": ["BTC", "ETH"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:312a3aae7dc3a9f7036c9a7691ebe179a3bb054e1799242565d977e0989ae750"
        },
        {
          "name": "get_playbook_status",
          "title": "Get trading playbook status",
          "description": "Trading Playbook Engine status: the registry of rule-based trade setups (playbooks) for BTC and ETH and which ones are firing right now, with structure-gate verdicts, cooldown state and why non-firing setups do not match (failed predicates with live market readings). Strategy-level only — no prices, sizes or portfolio data. Use for questions about active trade setups or what the playbooks are watching.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:234ce2b7086f05e508e761bff026d5afd4de8d64c7f59deea8245b861d61209e"
        },
        {
          "name": "get_risk_state",
          "title": "Get BTC/ETH risk state",
          "description": "Current risk state of Bitcoin (BTC) or Ethereum (ETH): 5-level risk policy (BLOCK to GREEN) with max position size, leverage limit, direction bias and allowed/blocked actions, plus composite score (0-100), structural and tactical scores, market regime (BULL/SIDEWAYS/BEAR), volatility regime, cycle phase and macro state. Computed from 9+ real-time data sources (price, funding, RSI, MVRV, ETF flows, on-chain, macro). Use whenever the user asks how BTC or ETH is doing, whether it is a good time to buy/sell/hold, or how much risk to take.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Asset to assess (default BTC)",
                "enum": ["BTC", "ETH"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7c79eff7316c19b5d023ec16f7f50b2391ab37295568f86b59a1fca9a3304ca7"
        }
      ],
      "digest": "sha256:74c85e611389c682804a142ffbd0a8a0fb5ef40f31bd892bfae81fd6069fb675"
    }
  }
