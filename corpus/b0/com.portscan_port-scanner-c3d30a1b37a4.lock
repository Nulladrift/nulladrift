{
  "lockfileVersion": 2,
  "subjects": {
    "com.portscan/port-scanner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.portscan.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "portscan",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "deep_scan",
          "title": "Deep port scan (all ports)",
          "description": "Scan all 65535 TCP ports (~1-5 min) of YOUR OWN public IP address - the egress IP of the machine running this MCP client. There is no target argument: by policy portscan only scans the requester's own IP. The call is non-blocking and keyed by your IP: it starts a scan if none is running, otherwise returns the current state. Call deep_scan repeatedly to poll until status is \"complete\" (or \"incomplete\"/\"failed\"); open ports and service banners are in the result. Pass rescan:true to force a fresh scan when a previous result already exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "rescan": {
                "default": false,
                "description": "Force a new scan even if a recent result exists for your IP. Default false: reuse the in-flight or last result.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chunks_complete": {
                "type": "number"
              },
              "duration_ms": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "fail_reason": {
                "type": "string"
              },
              "ip": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "partial": {
                "type": "boolean"
              },
              "percent": {
                "type": "number"
              },
              "poll_after_seconds": {
                "type": "number"
              },
              "ports_filtered": {
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "ports_open": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "banner": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "port": {
                      "type": "number"
                    },
                    "service": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["banner", "port", "service"],
                  "type": "object"
                },
                "type": "array"
              },
              "ptr_record": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "scan_type": {
                "enum": ["fast", "deep"],
                "type": "string"
              },
              "service_banners": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "status": {
                "enum": ["queued", "running", "complete", "incomplete", "failed"],
                "type": "string"
              },
              "total_chunks": {
                "type": "number"
              }
            },
            "required": ["ip", "message", "scan_type", "status"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d6b4b4b4a542f4b512551c9a801fd14649dae3bdc5214fb20350fce9e8e8c9a4"
        },
