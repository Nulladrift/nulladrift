      "instructions": "QuantApe Markets gives you stock screens by momentum, technical signals, fundamentals, earnings events, social sentiment, themes, curated baskets and investment theses; per-symbol analytics QuantApe derives itself — last earnings reaction and drift since, how much of the next report is priced in, options-implied move, what the earnings call said about guidance, technical signals, why a stock moved, its sector's mood and rotation; a signed-in user's own watchlist with those analytics and headlines; and today's market conditions — fear & greed, sector scores, sector rotation and categorized news; and how stocks move together — a symbol's residual-correlation neighbours and clusters, and a portfolio lens on concentration and low-correlation names. It returns no live quotes, market cap or valuation ratios; use a quote API for those. Start with list_smart_lists to find a screen id, then get_smart_list or get_smart_list_metrics; for one stock, get_stock_insights; for peers of a stock, graph_neighbors; for what happened to a stock's peers recently, cluster_context; for a set of holdings, portfolio_analyze. QuantApe data is informational only and not investment advice. Screens, metrics, market analyses and recommendations are generated by rules and models from third-party data and may be stale, incomplete or wrong; verify before acting. Metered tools charge USDC via x402 beyond the free daily allowance; tool errors are never charged and there are no refunds for data quality. Terms: https://quantape.com/terms",
      "tools": [
        {
          "name": "cluster_context",
          "description": "What happened recently to a ticker's peers: the cluster's move over the last 5 or 20 days (raw, market and residual), plus the news, earnings reactions, earnings-call guidance, price-mover explanations and themes that name its members. Give a symbol (its cluster; share classes are one company) or a cluster_id from graph_neighbors. Mega-caps and other names without a tight cluster get their closest residual-correlation peers instead (peers.kind = 'neighbors'). Peers are the ticker's residual-correlation cluster: stocks that move together once the market is removed. move is the cluster's equal-weight average in percent over the last 5 or 20 sessions: raw_* is the plain price move, market_* is SPY's, and residual_* is the move left after removing the market (the cluster-specific part); move.members has each member's own figures. Every news, earnings, transcript, mover and theme item cites a member symbol and a date. The optional digest (include_digest) is an LLM summary constrained to the cluster's members, each bullet citing members and a date; it may add latency, not cost. With mode 'peers' (symbol input only) the peers are instead the stocks whose residual moves track the ticker most closely (positive residual correlation over the past year, listed in peers.corr, with the ticker's leaf cluster as peers.theme): move is then the peers-only mean, move.symbol the ticker's own move and move.divergence_5d / _20d the ticker minus its peers, in percentage points. All of it is descriptive, not a recommendation. Free within your daily allowance (anonymous 5/day by IP, signed-in users 10/day, power users 50/day); beyond that $0.03 per call via x402 (USDC), with or without the digest.",
