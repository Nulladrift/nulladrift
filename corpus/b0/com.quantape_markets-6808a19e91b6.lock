              },
              "days": {
                "description": "Look-back window in days: 5 (default) or 20.",
                "enum": [5, 20],
                "type": "number"
              },
              "include_digest": {
                "description": "Also attach the LLM digest (default false). Slower; a failed digest comes back as digest: null with digest_status, never as an error.",
                "type": "boolean"
              },
              "mode": {
                "description": "Symbol input only. 'cluster' (default): the ticker's residual-correlation cluster. 'peers': the ticker plus the stocks whose residual moves track it most closely (with peers.corr), the peers' mean move, the ticker's own move and its divergence from them.",
                "enum": ["cluster", "peers"],
                "type": "string"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. RGTI. Give this or cluster_id, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
