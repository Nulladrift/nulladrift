        {
          "name": "graph_neighbors",
          "description": "The stocks that move most with a given ticker, ranked by strength, each with its cluster (a stable id and a label naming its biggest members) — peers, co-movers and offsetting names. Residual correlation is how much two stocks move together after the market and sector effects are removed from each, so it shows peers and true co-movement rather than shared market beta. type=lead_lag instead lists directed lagged relationships (one stock's move followed by another's a few sessions later; direction is from the symbol's point of view), which are weak and largely noise out of sample. Share classes are one company (GOOG is answered as GOOGL). Everything returned is descriptive statistics of past returns, not a recommendation. Free within your daily allowance (anonymous 5/day by IP, signed-in users 10/day, power users 50/day); beyond that $0.01 per call via x402 (USDC).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "k": {
                "description": "Neighbours to return, 1-50 (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "regime": {
                "description": "all (default) | highvol | lowvol: volatility regime the correlation was measured in (VIX above / below its trailing median).",
                "enum": ["all", "highvol", "lowvol"],
                "type": "string"
              },
              "symbol": {
                "description": "Ticker symbol, e.g. RGTI or BRK-B.",
                "type": "string"
              },
              "type": {
                "description": "resid_corr (default): same-day residual correlation. lead_lag: directed lagged correlation.",
                "enum": ["resid_corr", "lead_lag"],
                "type": "string"
              },
              "window": {
                "description": "Sessions behind resid_corr: 250 (default) or 60. Leave unset for lead_lag.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "cluster": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "id": {
                        "type": "number"
                      },
                      "label": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["id", "label"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The symbol's cluster (stable id + label) or null"
              },
              "neighbors": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "cluster": {
                      "anyOf": [
                        {
                          "additionalProperties": {},
                          "properties": {
                            "id": {
                              "type": "number"
                            },
                            "label": {
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["id", "label"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "direction": {
                      "description": "lead_lag only: leads (the symbol leads the neighbour) | lags | both",
                      "type": "string"
                    },
                    "lag": {
                      "description": "lead_lag only: sessions the leader is ahead",
                      "type": "number"
                    },
                    "n": {
                      "description": "Sessions behind the weight",
                      "type": "number"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "weight": {
                      "description": "Correlation (resid_corr) or lagged correlation (lead_lag), -1 to 1",
                      "type": "number"
                    }
                  },
                  "required": ["cluster", "n", "symbol", "weight"],
                  "type": "object"
                },
                "type": "array"
              },
              "peers_kind": {
                "description": "'neighbors' when the symbol is in no cluster (cluster_context then returns its closest peers)",
                "enum": ["cluster", "neighbors"],
                "type": "string"
              },
              "regime": {
                "type": "string"
              },
              "run_date": {
                "description": "Date of the nightly run the edges come from, YYYY-MM-DD",
                "type": ["string", "null"]
              },
              "symbol": {
                "type": "string"
              },
              "type": {
                "type": "string"
              },
              "window": {
                "description": "Sessions behind resid_corr (60 or 250); for lead_lag the sample size",
                "type": ["number", "null"]
              }
            },
            "required": ["cluster", "neighbors", "regime", "run_date", "symbol", "type", "window"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
