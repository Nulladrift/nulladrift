              },
              "url": {
                "type": "string"
              }
            },
            "required": ["body", "evidence_status", "id", "markdown", "revision", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c7e4e0fade0309cd5c22ca7728e01f7880bf48658b288bd56db57a047b5c0fd"
        },
        {
          "name": "get_test_spec",
          "title": "Get questionnaire availability and specification",
          "description": "Fetch a complete questionnaire specification for mbti (32 items), enneagram (36), disc (16), attachment (36) or big-five (50). All five are available, with exact instrument/version IDs, response anchors and strict scoring instructions. The first four preserve the legacy AgentTune adaptations; instrument-specific source terms apply. Administer only when requested, keep responses local, preserve ties, and let users review any suggested communication preferences before installation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "test": {
                "description": "Which test instrument.",
                "enum": ["mbti", "enneagram", "disc", "attachment", "big-five"],
                "type": "string"
              }
            },
            "required": ["test"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "available": {
                "type": "boolean"
              },
              "body": {
                "type": "string"
              },
              "canonical_url": {
                "type": "string"
              },
              "evidence_status": {
                "type": "string"
              },
              "instrument_id": {
                "type": ["string", "null"]
              },
              "instrument_version": {
                "type": ["string", "null"]
              },
              "markdown_url": {
                "type": "string"
              },
              "revision": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "test": {
                "type": "string"
              }
            },
            "required": ["available", "body", "canonical_url", "evidence_status", "instrument_id", "instrument_version", "markdown_url", "revision", "status", "test"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b756d1e01c6e17080edf73dfed3f10ad83cef66ca5b9dc26062f404520db37b"
        },
        {
          "name": "get_tuning",
          "title": "Get a tuning file (paste-ready Markdown)",
          "description": "Fetch one tuning file as Markdown with YAML front-matter. The front-matter links to the shared platform registry and installation protocol. structuredContent.body is the preference text; metadata stays separate. Confirmation of saved text is distinct from evaluation of behavior. MIT licensed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Type slug, lowercase. mbti: 4-letter code (intj). enneagram: N-name (5-investigator). disc: letter-name (d-dominance). attachment: style (secure). ocean: dimension-pole (openness-high). Unsure? Call list_tunings.",
                "type": "string"
              },
              "system": {
                "description": "Personality system.",
                "enum": ["mbti", "enneagram", "disc", "attachment", "ocean"],
                "type": "string"
              }
            },
            "required": ["slug", "system"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "body": {
                "type": "string"
              },
              "body_url": {
                "type": "string"
              },
              "canonical_url": {
