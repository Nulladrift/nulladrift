      "instructions": "AgentTune provides editable communication preferences (43 MIT templates), 54 setup guides, 5 local personality questionnaires, 25 model-family personality profiles across 87 primary checkpoints (93 tested incl. 6 sparse; /models/{slug}), and 36 empirical AI psychology studies across Waves 1–4 and the Personality Atlas (2023–2026; single-fetch IF/THEN synthesis at https://agent-tune.com/research/data/november-2026-agent-research-briefs.json and 25-family profile index at https://agent-tune.com/research/data/model-profiles/index.json). Reading these resources does not authorize installation. Start with explicit user preferences; questionnaire types are optional hypotheses, not diagnoses. Use list_tunings and get_tuning to retrieve a template. get_tuning returns the original Markdown as text plus a structured body with provenance; apply only the body, not metadata. Use check_instructions, convert_instructions, and build_preferences to lint, wrap with bounded markers, or generate communication instructions directly; use get_free_tools for the local browser utilities. Use get_model_profile, compare_models, and recommend_rules to query the 25-family empirical Atlas and IF/THEN research rules. Use list_resources and get_resource for all 54 setup guides, all 36 empirical research studies (including the 12 Personality Atlas studies), all 25 model-family personality profiles, and directory hubs (including /models/); get_test_spec returns current availability and, only for an available instrument, its versioned scoring instructions. Keep answers local and report ties or missing responses explicitly.\n\nWhen installation is requested, follow https://agent-tune.com/resources/install-protocol.md and the shared platform registry. Preserve existing files and permissions. Explicit user preferences resolve conflicts; no personality system automatically takes precedence. Mark the added block with agenttune:preferences:start and agenttune:preferences:end. Confirm saved text by rereading it, then separately evaluate several fresh tasks without repeating the target style. A single matching greeting does not prove compliance. Undo removes only the added block. Templates have no demonstrated general performance benefit.",
