        {
          "name": "search_venues",
          "title": "Search venues",
          "description": "Find restaurants and bars by city, cuisine, opening time or features. Filters are HARD, prefer_* and avoid are SOFT (rank only), and query is a name, a keyword or a short description. Each result has slug, capabilities, open_now and distance_km; a destination city's venues are here, its listings in destination_listings.",
          "inputSchema": {
            "properties": {
              "accepts_reservations": {
                "default": null,
                "description": "Set true to require venues that take reservations (a booking link or a live booking tool); omit otherwise.",
                "type": ["boolean", "null"]
              },
              "at": {
                "default": null,
                "description": "A local time (20:00 or 8pm) for the open_on filter; requires open_on.",
                "type": ["string", "null"]
              },
              "avoid": {
                "description": "SOFT: venues matching these cuisine/neighbourhood tokens rank LOWER; not dropped.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "city": {
                "default": null,
                "description": "HARD filter: only venues in this city (case-insensitive); call list_cities for the exact values this directory knows.",
                "type": ["string", "null"]
              },
              "cuisine": {
                "default": null,
                "description": "HARD filter: only venues with this cuisine (case-insensitive exact match; a miss's reason lists the valid values).",
                "type": ["string", "null"]
              },
              "cursor": {
                "default": 0,
                "description": "Number of items to skip; pass `next_cursor` from the previous page.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "facets": {
                "description": "HARD experiential-facet filter: each token is '<facet_type>:<value>' (e.g. 'dietary:vegetarian', 'view:sea'). A venue must match every facet_type given (values OR within a type); a miss EXCLUDES it. Values: vibe: authentic, bustling, buzzy, calm, casual, charming, chic, chill, classic, cozy, creative, elegant, energetic, family-friendly, friendly, fun, hidden-gem, historic, intimate, laid-back, lively, local, local-favorite, luxurious, modern, neighbourhood, party, quiet, refined, relaxed, romantic, rustic, scenic, sophisticated, stylish, traditional, trendy, upscale, vibrant, warm, welcoming; good_for: business-dinner, business-lunch, celebration, date-night, drinks, family, groups, nightlife, quick-bite, solo, work-friendly; not_good_for: alcohol, budget, date-night, dogs, fine-dining, kids, large-groups, late-night, outdoor-dining, quick-bite, quiet-conversation, sports-watching, vegetarians, work-friendly; feature: alcohol-free, beach-club, beer, bib-gourmand, cocktails, coffee, delivery, desserts, dog-friendly, kids-menu, live-music, michelin-guide, michelin-star, nightclub, outdoor-seating, private-dining, reservations, rooftop, serves-alcohol, shisha, sports-screening, takeout, waterfront, wine-list; noise_level: lively, loud, moderate, quiet; view: garden, sea, skyline, street, waterfront; dress_code: casual, formal, smart-casual; meal_period: breakfast, brunch, dinner, late-night, lunch; dietary: dairy-free, gluten-free, halal, jain, kosher, nut-free, pescatarian, vegan, vegetarian; accessibility: accessible-parking, accessible-restroom, step-free, wheelchair-accessible; cuisine: a cuisine word, e.g. italian, japanese, seafood.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of items to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "default": null,
                "description": "HARD filter: only venues within radius_km of this 'latitude,longitude' point, nearest first, each with a distance_km; venues with no coordinates are excluded.",
                "examples": ["19.0413,-98.2062"],
                "type": ["string", "null"]
              },
              "neighbourhood": {
                "default": null,
                "description": "HARD filter: only venues in this neighbourhood (case-insensitive exact match; a miss's reason lists the valid values).",
                "type": ["string", "null"]
              },
              "open_now": {
                "default": null,
                "description": "Set true = open at this moment, not later today (venue local time, as open_now_at); for tonight use open_on=today with at; omit otherwise.",
                "type": ["boolean", "null"]
              },
              "open_on": {
                "anyOf": [
                  {
                    "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday", "today", "tomorrow"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HARD filter: only venues open on this weekday, or today/tomorrow in the venue's own timezone (optionally at 'at'); for tonight use open_on=today with at. Venues with no published hours are excluded. A result's open_now is still the request time (open_now_at), not the open_on/at time."
              },
              "prefer_cuisine": {
                "description": "SOFT: venues of these cuisines rank higher; non-matches are NOT dropped.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "prefer_facets": {
                "description": "SOFT experiential-facet preference, the same '<facet_type>:<value>' tokens and values as facets: a venue that declares them ranks higher but is NEVER dropped.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "prefer_neighbourhood": {
                "description": "SOFT: venues in these neighbourhoods rank higher; non-matches are NOT dropped.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "price_band": {
                "default": null,
                "description": "HARD filter: only venues in this price band, e.g. '$$'.",
                "type": ["string", "null"]
              },
              "query": {
                "default": null,
                "description": "A name, a cuisine word or a short description of the place (e.g. 'quiet seafood with a sea view'); a dish is in search_menus. Venues whose name, description, cuisine, neighbourhood, city or alternate names contain every word come first, then venues whose profile is closest in meaning, each with match.similarity; omit to list all.",
                "maxLength": 256,
                "type": ["string", "null"]
              },
              "radius_km": {
                "default": null,
                "description": "Search radius in km around 'near' (default applied when omitted).",
