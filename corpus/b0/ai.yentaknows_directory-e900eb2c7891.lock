                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "destination": {
                "description": "Destination name or slug, e.g. 'Los Cabos'; list_cities names them.",
                "maxLength": 256,
                "type": "string"
              },
              "language": {
                "default": null,
                "description": "Language code (e.g. 'en', 'es'); defaults to the destination's.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of items to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "listing_id": {
                "default": null,
                "description": "One listing's id from a previous result: returns its full detail in item, ignoring the other filters; read a live linked_venue_slug with the venue_* tools, whose answer carries its booking link.",
                "maxLength": 256,
                "type": ["string", "null"]
              },
              "near_listing_id": {
                "default": null,
                "description": "A listing id; returns listings within radius_km, nearest first, each with distance_km.",
                "type": ["string", "null"]
              },
              "query": {
                "default": null,
                "description": "Words matched in any order against listing names, descriptions, tags and categories.",
                "maxLength": 256,
                "type": ["string", "null"]
              },
              "radius_km": {
                "default": null,
                "description": "Search radius in km around near_listing_id; a larger value is reduced to the server maximum.",
