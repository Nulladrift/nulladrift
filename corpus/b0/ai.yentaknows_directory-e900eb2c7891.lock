      "instructions": "Yenta directory of restaurants, bars and travel destinations. Covers: Los Cabos, Dubai, Milan and more. search finds by name; fetch reads a result; search_venues filters venues. venue_profile, venue_menu, destination_overview, destination_listings and other venue_*/destination_* tools read one by name, no reconnect. `source` gives freshness. `booking.url` is a venue's booking page; `mcp_endpoint` (under venues.yentaknows.ai) is a read-only server unless booking.method is live. No auth. Powered by Yenta.",
      "tools": [
        {
          "name": "destination_events",
          "title": "Search a destination's events by name",
          "description": "Find what is on in a named destination: events from today onwards. A recurring event's dates are its series span, so read its recurrence. Results carry booking_url, the partner's booking page when present, and canonical_url, the destination's page.",
          "inputSchema": {
            "properties": {
              "area": {
                "default": null,
                "description": "Area name or slug; destination_overview lists them.",
                "type": ["string", "null"]
              },
              "category": {
                "default": null,
                "description": "Category name or slug; destination_overview lists them.",
                "type": ["string", "null"]
              },
              "cursor": {
                "default": 0,
                "description": "Number of items to skip; pass `next_cursor` from the previous page.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "destination": {
                "description": "Destination name or slug, e.g. 'Los Cabos'; list_cities names them.",
                "maxLength": 256,
                "type": "string"
              },
              "from_date": {
                "default": null,
                "description": "ISO date; defaults to today.",
                "format": "date",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of items to return.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": null,
                "description": "Words matched in any order against event names and descriptions.",
                "maxLength": 256,
                "type": ["string", "null"]
              },
              "to_date": {
                "default": null,
                "description": "ISO date; omit to_date for everything upcoming (recommended for \"coming up\").",
                "format": "date",
                "type": ["string", "null"]
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "The Yenta response envelope: a status, the answer in `item` or `items`, and the approved content revision it was read from.",
