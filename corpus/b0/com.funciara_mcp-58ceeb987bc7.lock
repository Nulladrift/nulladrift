        {
          "name": "create_order_link",
          "title": "Create an order link",
          "description": "Validate a property and prepare an order for the person to finish on funciara.com: returns one link with the form prefilled, plus the mode and, where they apply, the price and delivery term (a reservation has no term). It places no order and takes no payment; give the link to the person. Use dryRun to test without storing anything. Use check_property_number only to test a number without preparing a link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cadastralNumber": {
                "description": "Optional second number, usually the cadastral number, when the person has both. Not used for EXTRACT_PLAN, which takes one number.",
                "maxLength": 800,
                "type": "string"
              },
              "contact": {
                "description": "Optional. Only include what the person gave you (name, e-mail, phone, invoice details). Details of the person that only prefill their order form on funciara.com. They are kept for 72 hours and then expire. Privacy policy: https://funciara.com/politica-confidentialitate",
                "properties": {
                  "companyCui": {
                    "pattern": "^(RO)?[0-9]{2,10}$",
                    "type": "string"
                  },
                  "companyName": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "invoiceAddress": {
                    "maxLength": 255,
                    "minLength": 1,
                    "type": "string"
                  },
                  "invoiceCity": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "invoiceCountry": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "invoiceCounty": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "pattern": "^(\\+40|0)[0-9]{9}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "county": {
                "description": "The county: its numeric id as text (from list_counties) or its name, with or without diacritics.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "documentType": {
                "description": "Catalogue id of the document. EXTRACT_CF (default) is the land-registry extract for information.",
                "enum": ["EXTRACT_CF", "EXTRACT_PLAN", "COLLECTIVE_CF"],
                "type": "string"
              },
              "dryRun": {
                "description": "When true, validate and return the same answer but store nothing and return no link. Use it to test.",
                "type": "boolean"
              },
              "estateIdentifier": {
                "description": "The property number as the person has it: CF number, cadastral number, topographic number or electronic identifier, for example 40461 or 8014-C1-U5. For EXTRACT_PLAN, the land's cadastral number (electronic identifier), digits only: a building's number such as 8014-C1 is read as its land's, 8014, and a flat's is refused.",
                "maxLength": 800,
                "minLength": 1,
                "type": "string"
              },
              "locality": {
                "description": "The locality: its numeric id as text (from search_localities) or its name, with or without diacritics.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["county", "estateIdentifier", "locality"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cadastralNumber": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
