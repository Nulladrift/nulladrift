      "instructions": "Funciara.com is a private Romanian intermediary that obtains land-registry documents for people, mainly the \"extras de carte funciară pentru informare\" (land-book extract for information). It is not affiliated with ANCPI (the national cadastre agency) or any cadastre office, and it does not issue, certify or sign documents: the documents come from the official cadastre systems and are delivered as a PDF by e-mail.\n\nYou prepare an order for a person; you never place or pay it. The person always finishes on funciara.com: they open one link, find the form prefilled, accept the terms, pass a security check and pay by card.\n\nHow to use the tools:\n1. Call get_service_info first: it returns the current price, delivery term and the counties that take paid orders. Never assume them; read them from the tools.\n2. Find the property's county and locality with list_counties and search_localities (or pass names to create_order_link, which resolves them and lists candidates when a name is ambiguous).\n3. Optionally call check_property_number to test the property number (CF, cadastral or topographic number) before preparing the link.\n4. Call create_order_link to prepare the order. Use dryRun: true to test without storing anything. Give the returned checkoutUrl to the person and tell them they finish and pay on funciara.com. Do not say the order is placed or paid.\n5. If the person later gives you an order id and its tracking token, get_order_status reads the order's state.\n\nRead the mode from the tools and describe only what it means. PAY_NOW: the county takes paid orders now; the price and the delivery term (counted from payment confirmation) apply. RESERVATION (the extract only): the county takes no paid orders now, so the form places a reservation without payment; there is no delivery term, and the price shown is that of a possible later offer, not a charge. UNAVAILABLE: this document cannot be ordered there now, so nothing can be ordered and no link is prepared. Never state a price or term the tools did not return for that mode.",
      "tools": [
        {
          "name": "check_property_number",
          "title": "Check a property number",
          "description": "Check a property number: returns the normalised value, a refusal code when it certainly is not a property number, and warnings that do not block. County and locality are optional: without them only the format is checked; with them the check adds the local number-range warning and the order mode, price and term. Use it before create_order_link when unsure; it stores nothing and prepares no link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cadastralNumber": {
                "description": "Optional second number, usually the cadastral number, when the person has both. Not used for EXTRACT_PLAN, which takes one number.",
                "maxLength": 800,
                "type": "string"
              },
              "county": {
                "description": "The county: its numeric id as text (from list_counties) or its name, with or without diacritics.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "documentType": {
                "description": "Catalogue id of the document. EXTRACT_CF (default) is the land-registry extract for information.",
                "enum": ["EXTRACT_CF", "EXTRACT_PLAN", "COLLECTIVE_CF"],
                "type": "string"
              },
              "estateIdentifier": {
                "description": "The property number as the person has it: CF number, cadastral number, topographic number or electronic identifier, for example 40461 or 8014-C1-U5. For EXTRACT_PLAN, the land's cadastral number (electronic identifier), digits only: a building's number such as 8014-C1 is read as its land's, 8014, and a flat's is refused.",
                "maxLength": 800,
                "minLength": 1,
                "type": "string"
              },
              "locality": {
                "description": "The locality: its numeric id as text (from search_localities) or its name, with or without diacritics.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["estateIdentifier"],
            "type": "object"
          },
