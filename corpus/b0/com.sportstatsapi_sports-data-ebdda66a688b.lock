        {
          "name": "get_match",
          "title": "Get match",
          "description": "One match: teams, score, status, events (goals, cards...), venue, referee; where known TV channels by country and, after the match, a highlights video link. Soccer adds timeline: the events normalised (minute, extra_minute, team home/away, kind goal, penalty, own_goal, missed_penalty, yellow, second_yellow, red, substitution or var, player, assist, player_in/player_out, detail: card reason or VAR outcome; minute null = not known; no headers or xG per shot: not in our data) and referee_stats: the referee's season in the league (games, cards and penalties per game, with league_matches_with_referee of league_matches_played). Matches with a page on our website (soccer, basketball, hockey, tennis, volleyball, handball, baseball, American football, cricket): summary, ready paragraphs on the match from our data (table places, form, meetings, season; cricket: the result, the innings, the best performances, before the start form and meetings in the format), with key_facts before kick-off and what_it_means after the result, summary_as_of when written; only until kick-off and once finished, English only (no lang). Facts only, no predictions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "language of team, league and country names: de, es, it or fr (default English)",
                "type": "string"
              },
              "match_id": {
                "description": "match code (or number) from get_matches",
                "type": ["integer", "string"]
              },
              "sport": {
                "description": "sport (see list_sports)",
                "type": "string"
              }
            },
            "required": ["match_id", "sport"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get match"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
