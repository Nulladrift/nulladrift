      "instructions": "SportStatsAPI: fixtures, live scores, results, match events, lineups, box scores, play-by-play, standings, teams and players for soccer, basketball, baseball, hockey, tennis, handball, volleyball, American football, cricket, rugby union, rugby league, esports and table tennis, including many lower leagues (depth varies by league: live scores, line-ups and statistics only where the league's feed has them; play-by-play for basketball, baseball, hockey, tennis and American football); horse racing cards, prices and results; MMA, boxing, golf, snooker and darts events, tournaments and rankings.\n\nTypical flow: find_leagues or find_teams to get ids, then get_matches (by date, or a team's with team_id), get_summary for the ready text on a match, team, league or player, get_match_briefing and get_team_briefing for ready briefings (any sport), get_facts for just their fact sentences, get_league_facts for what finished matches changed, get_h2h for a head-to-head (team sports), get_match / get_match_details, get_standings, get_team (soccer: facts for records, first since and player milestones), get_player, get_transfers (soccer). Horse racing: get_races (by day and region), get_race (card, best prices, result), get_race_briefing, find_horses and get_runner_form (a horse's, jockey's or trainer's last runs), get_racing_stats (jockey and trainer 14/30-day form, course stats and draw). Dates are YYYY-MM-DD in UTC. Ids: answers carry our codes (code, league_code, team_code, ...: t2s, m4fti); every id argument takes the code or the number. Add lang (de, es, it, fr) for translated team and league names.\n\nAccess: list_sports and find_leagues work without an account. Every other tool needs a SportStatsAPI account: sign in when the client asks (OAuth), or connect with an API key (Authorization: Bearer <key>). A free account has 100 requests a day for the whole account and 5 a minute, in every sport, with data up to 15 minutes old (live scores too), for non-commercial use with a visible credit link (\"Data: Stadiro / SportStatsAPI\" to https://sportstatsapi.com): each league's current season of fixtures, results, live scores, standings, top scorers, match details and team stats. Past seasons, line-ups, player stats, box scores and play-by-play need a paid plan; briefings, facts (get_facts too) and get_h2h need a plan with the Insights feature; injuries, play-by-play and horse racing are plan features of their own. A tool outside the account's plan answers with what is not included.",
