        {
          "name": "screen_token",
          "title": "Screen a token for red flags",
          "description": "Use this when the user gives a token address and asks \"is this a rug?\", \"screen this coin\", \"who is the dev?\" or what to check before buying. Pass chain (solana, ethereum, base, bsc, arbitrum, polygon, avalanche, optimism) and token (contract or mint address). Optionally pass github_url and deployer. Returns each signal as red_flag, keep_signal, not_seen or unknown, with a detail line and a source link, a reading (many_red_flags, some_red_flags or no_red_flags_seen), and the X links for a manual check. It reads public sources only and never says a token is safe. Not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "chain": "solana",
                "github_url": "https://github.com/Uniswap",
                "token": "2VYvcfZNiQmFNFT9DAVtDDyHEZK7D743JYmgSpBPpump"
              }
            ],
            "properties": {
              "chain": {
                "description": "The chain the token lives on.",
                "enum": ["solana", "ethereum", "base", "bsc", "arbitrum", "polygon", "avalanche", "optimism"],
                "type": "string"
              },
              "deployer": {
                "description": "Optional wallet that launched the token, when GoPlus does not report one (most Solana tokens).",
                "type": "string"
              },
              "github_url": {
                "description": "Optional GitHub account or repository to check, when the listing names none or a different one.",
                "type": "string"
              },
              "token": {
                "description": "The token's contract address (0x...) or Solana mint address.",
                "type": "string"
              }
            },
            "required": ["chain", "token"],
            "type": "object"
          },
