        {
          "name": "value_token",
          "title": "Value a token from its holder revenue",
          "description": "Use this when the user asks what a token is worth, \"is HYPE cheap?\" or for a fair value from revenue. Pass token (a name, ticker, DefiLlama slug or CoinGecko id); optionally moat, regulation, governance_flags, buyback, team_largest_holder, fee_funded, market_growth_pct, e0_usd and unlocks. Returns bear, base and bull values per token under the standard and disciplined supply rules, the weighted value against the price, the growth the price implies, confidence, warnings, assumptions and what is not known. Defaults are the most cautious. Not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "token": "hyperliquid"
              }
            ],
            "properties": {
              "buyback": {
                "description": "Optional. How holder revenue is paid out. Default discretionary.",
                "enum": ["automatic", "governance", "discretionary"],
                "type": "string"
              },
              "e0_usd": {
                "description": "Optional. Your own yearly holder revenue in USD, used instead of DefiLlama's.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "fee_funded": {
                "description": "Optional. True when fees, not token sales, fund the protocol. With team_largest_holder it selects the disciplined supply rule.",
                "type": "boolean"
              },
              "governance_flags": {
                "description": "Optional. How many hold: concentrated control, a team that can change the rules, no legal wrapper. Default 3.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "market_growth_pct": {
                "description": "Optional. The market's multi-year annual growth in percent; the model uses a third of it, capped at 20.",
                "maximum": 1000,
                "minimum": -100,
                "type": "number"
              },
              "moat": {
                "description": "Optional. Default: from the protocol's rank in its DefiLlama category.",
                "enum": ["near_monopoly", "strong", "moderate", "weak"],
                "type": "string"
              },
              "regulation": {
                "description": "Optional. Default no_kyc_us_exposure, the most cautious.",
                "enum": ["no_kyc_us_exposure", "past_probe_closed", "regulated"],
                "type": "string"
              },
              "team_largest_holder": {
                "description": "Optional. True when the team holds the largest allocation.",
                "type": "boolean"
              },
              "token": {
                "description": "The protocol or its token: a name (Hyperliquid), a ticker (HYPE), a DefiLlama slug or a CoinGecko id.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
