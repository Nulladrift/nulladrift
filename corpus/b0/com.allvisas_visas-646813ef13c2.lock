    "com.allvisas/visas": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://allvisas.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "allvisas",
        "version": "1.62.00"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AllVisas is a register of visa and residence routes worldwide. Every statement links to the official government page it comes from. Each route includes its current review status and source evidence. Respect that status and cite the source_url. This is information, not legal advice; the official page decides.",
      "tools": [
        {
          "name": "check_visa",
          "title": "Does a passport need a visa to visit a country?",
          "description": "For a short visit (tourism or business): what a passport needs to enter a destination — no visa, an electronic travel authorisation (ETA), an eVisa, a visa on arrival or a visa — read from the destination's own official list, with the verbatim sentence, the official URL and the date it was read. Says plainly when we have not read the destination's list, or when the list does not name the passport.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "The destination: name, ISO code or slug, e.g. \"Japan\", \"JP\"",
                "type": "string"
              },
              "passport": {
                "description": "The passport's country: name, ISO code or slug, e.g. \"India\", \"IN\"",
                "type": "string"
              }
            },
            "required": ["destination", "passport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:58bfab563dd7e1ddf6d2b54b935428297b04b7a0ccef061c68868794f0eb3ec4"
        },
        {
          "name": "get_country",
          "title": "Visa routes of a country",
          "description": "All visa and residence routes of one country (by name, ISO code or slug), each with its category, summary, review status and page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "e.g. \"Germany\", \"DE\" or \"germany\"",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5c96438f4a79628fa94c99b96403200437bf45c7e781e3300df54d8fe695f654"
        },
        {
          "name": "get_route",
          "title": "One visa route with its sources",
          "description": "One visa route by its AllVisas page URL or path: requirements, fees, rights and risks, each with the official source URL, the verbatim quote it rests on or the legal provision, and when the source was read or the statement reviewed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "e.g. https://allvisas.com/countries/germany/drafts/work/eu-blue-card/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d9079cf84646433a3c4388d57671373146c2a2a0214a2da77cdd63fa1fef81b"
        },
        {
          "name": "list_countries",
          "title": "List countries",
          "description": "Every country published on AllVisas, with its code and page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:08d397efabe21cdfba0042b63ee9d039ecd329809c249a5a20c599619401cb90"
        },
        {
          "name": "search_visas",
          "title": "Search visas and countries",
          "description": "Search every country and visa route on AllVisas by name, other-language name, summary or country. Returns countries and routes with their page URLs and the current review status of each route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "e.g. \"Blue Card\", \"Germany\", \"student visa Canada\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
