        {
          "name": "list_log_group_events",
          "title": "List log group events",
          "description": "Read the remaining matching events in an application log group, oldest first, without payloads. Pass group_id, started_at, and events_cursor from list_logs, using events_cursor as starting_after. Keep the original event filters. Continue with this tool’s cursor.starting_after. The outer list cursor is not valid here. Group expansion covers the flow lifetime, subject to retention.",
