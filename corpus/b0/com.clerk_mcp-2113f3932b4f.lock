        },
        {
          "name": "create_application",
          "title": "Create Clerk application",
          "description": "Create an application with a development instance in the connected workspace (like `clerk apps create`). Returns the new application_id, name, and instances with their publishable keys. Secret keys are removed, or returned as encrypted_secret_key when recipient_public_key is set.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Name for the application, shown in the Clerk Dashboard.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "recipient_public_key": {
                "description": "RSA public key to encrypt secret keys to: a JWK, or base64, base64url, or hex SubjectPublicKeyInfo DER, with a 2048 to 4096-bit modulus and exponent 65537. Each secret key then comes back as encrypted_secret_key, unpadded base64url RSA-OAEP ciphertext with SHA-256 for OAEP and MGF1 and an empty label, which only the matching private key can decrypt.",
                "minLength": 1,
                "type": "string"
              },
              "template": {
                "description": "Clerk template that pre-configures the application for a use case. Omit to create it with Clerk's default settings.",
                "enum": ["b2b-saas", "b2c-saas", "native", "waitlist"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "application_id": {
                "type": "string"
              },
              "instances": {
                "items": {
                  "properties": {
                    "environment_type": {
                      "description": "\"development\" or \"production\".",
                      "type": "string"
                    },
                    "instance_id": {
                      "type": "string"
                    },
                    "publishable_key": {
                      "type": "string"
                    }
                  },
                  "required": ["environment_type", "instance_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["application_id", "instances", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
