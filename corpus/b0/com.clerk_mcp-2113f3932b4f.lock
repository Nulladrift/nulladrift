        "name": "Clerk MCP Server",
        "title": "Clerk",
        "version": "1.0.0",
        "description": "Manage Clerk applications, users, and production domains, and get Clerk SDK code snippets.",
        "websiteUrl": "https://clerk.com/docs/guides/ai/mcp/clerk-mcp-server",
        "icons": [
          {
            "src": "https://img.clerk.com/static/clerk.svg",
