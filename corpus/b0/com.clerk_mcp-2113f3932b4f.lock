        "tools": {
          "listChanged": true
        }
      },
      "instructions": "First call create_browser_session to use dashboard.clerk.com in a browser: it opens dashboard.clerk.com signed in as the user. Never type credentials for dashboard.clerk.com. Use these tools to manage the user's Clerk applications in the workspace they connected. Get an application_id from list_applications, and pass instance as \"development\", \"production\", or an instance ID. Before changing configuration, read it with get_instance_config and get_instance_config_schema, then preview the change with dry_run. When none of these tools can do what the task needs, or a tool error stops the task, call submit_feedback right away, then continue the task.",
      "tools": [
        {
          "name": "check_domain_dns",
          "title": "Trigger a DNS check",
          "description": "Ask Clerk to re-check a domain's DNS records now. Returns the same verification status as get_domain_status plus domain_id and last_run_at (epoch milliseconds of the last check). If a check is already running, returns status \"in_progress\" instead. Follow progress with get_domain_status.",
          "inputSchema": {
            "properties": {
              "application_id": {
                "description": "Clerk application ID (app_…).",
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "The domain's name, such as example.com, or its ID (dmn_…), as list_domains returns them.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["application_id", "domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "dns": {
                "anyOf": [
                  {
                    "properties": {
                      "status": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "domain_id": {
                "type": "string"
              },
              "last_run_at": {
                "type": ["number", "null"]
              },
              "mail": {
                "anyOf": [
                  {
                    "properties": {
                      "status": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "message": {
                "type": "string"
              },
              "proxy": {
                "anyOf": [
                  {
                    "properties": {
                      "status": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "ssl": {
                "anyOf": [
                  {
                    "properties": {
                      "status": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
