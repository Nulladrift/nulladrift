        {
          "name": "create_android_application",
          "title": "Register an Android application",
          "description": "Register an Android app's package name with an instance, like adding an Android app on the Clerk Dashboard's Native applications page. Returns the registered app, with its id, package_name, namespace, and fingerprints. Clerk needs the registration for native sign-in with Clerk's Android SDK, and before patch_instance_config can set the app's minimum version (native_app_minimum_versions). Check list_native_applications first: a package name that's already registered is rejected. To change or remove a registration, use the Clerk Dashboard. Then run enable_native_api if it isn't enabled.",
          "inputSchema": {
            "properties": {
              "application_id": {
                "description": "Clerk application ID (app_…).",
                "minLength": 1,
                "type": "string"
              },
              "fingerprints": {
                "description": "SHA-256 fingerprints of the app's signing certificates, such as 14:6D:E9:…. Passkeys need them; omit them otherwise.",
                "items": {
                  "pattern": "^(?:[0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$|^[0-9A-Fa-f]{64}$",
                  "type": "string"
                },
                "type": "array"
              },
              "instance": {
                "description": "Instance to target: \"development\", \"production\", or a full instance ID (ins_…).",
                "minLength": 1,
                "type": "string"
              },
              "namespace": {
                "description": "The Digital Asset Links namespace. Omit it to use android_app, which almost every app uses.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "package_name": {
                "description": "The app's package name (its applicationId), such as com.example.app.",
                "maxLength": 255,
                "pattern": "^[A-Za-z][A-Za-z0-9_]*(?:\\.[A-Za-z][A-Za-z0-9_]*)+$",
                "type": "string"
              }
            },
            "required": ["application_id", "instance", "package_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "fingerprints": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "namespace": {
                "type": "string"
              },
              "package_name": {
                "type": "string"
              }
            },
            "required": ["fingerprints", "id", "namespace", "package_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
