        {
          "name": "check_mcp_server",
          "title": "Check an MCP server Clerk OAuth setup",
          "description": "Read an instance's registered MCP servers, the OAuth settings MCP clients depend on, and the latest public discovery check for one registered MCP server URL. Never changes Clerk OAuth settings. Pass force_recheck: true to start a new checker observation instead of reading the cached one: the checker sends unauthenticated GET requests to the MCP endpoint and reads public protected-resource metadata and Clerk issuer discovery documents. It never forwards Clerk credentials to the resource URL and is not end-to-end OAuth verification.",
          "inputSchema": {
            "properties": {
              "application_id": {
                "description": "Clerk application ID (app_…).",
                "minLength": 1,
                "type": "string"
              },
              "check_id": {
                "description": "A specific check to read instead of the latest one. Cannot be combined with force_recheck.",
                "minLength": 1,
                "type": "string"
              },
              "force_recheck": {
                "description": "Start a new public discovery check instead of reading the cached one. Defaults to false.",
                "type": "boolean"
              },
              "instance": {
                "description": "Instance to target: \"development\", \"production\", or a full instance ID (ins_…).",
                "minLength": 1,
                "type": "string"
              },
              "resource_url": {
                "description": "Registered MCP server URL to check. Optional when exactly one is registered.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["application_id", "instance"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "application_id": {
                "type": "string"
              },
              "authorization_server": {
                "properties": {
                  "audience": {
                    "type": "string"
                  },
                  "issuer": {
                    "type": ["string", "null"]
                  },
                  "protected_resource_metadata_url": {
                    "type": "string"
                  }
                },
                "required": ["audience", "issuer", "protected_resource_metadata_url"],
                "type": "object"
              },
              "check": {
                "properties": {
                  "cached": {
                    "const": true
                  },
                  "check": {
                    "properties": {
                      "id": {
                        "type": "string"
                      },
                      "resource": {
                        "type": "string"
                      },
                      "state": {
                        "type": "string"
                      }
                    },
                    "required": ["id", "resource", "state"],
                    "type": "object"
                  },
                  "checker_status": {
                    "type": "number"
                  },
                  "force_recheck_requested": {
                    "const": true
                  },
                  "freshness": {
                    "properties": {
                      "age_seconds": {
                        "type": ["number", "null"]
                      },
                      "checked_at": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["age_seconds", "checked_at"],
                    "type": "object"
                  },
                  "reason": {
                    "type": "string"
                  },
                  "retry_after": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["found", "not_found", "failed", "not_started", "unavailable"]
                  }
                },
                "required": ["status"],
                "type": "object"
              },
              "configuration": {
                "properties": {
                  "blockers": {
                    "items": {
                      "properties": {
                        "reason": {
                          "type": "string"
                        },
                        "setting": {
                          "type": "string"
                        }
                      },
                      "required": ["reason", "setting"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "legacy_mcp_servers": {
                    "items": {
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "uri": {
                          "type": "string"
                        }
                      },
                      "required": ["name", "uri"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "mcp_servers": {
                    "items": {
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "uri": {
                          "type": "string"
                        }
                      },
                      "required": ["name", "uri"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "oauth_settings": {
                    "additionalProperties": {
                      "type": "boolean"
                    },
                    "type": "object"
                  },
                  "status": {
                    "enum": ["configured", "not_configured", "migration_required"]
                  }
                },
                "required": ["blockers", "legacy_mcp_servers", "mcp_servers", "oauth_settings", "status"],
                "type": "object"
              },
              "end_to_end_verified": {
                "const": false
              },
              "instance_id": {
                "type": "string"
              },
              "mcp_server": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "uri": {
                    "type": "string"
                  }
                },
                "required": ["name", "uri"],
                "type": "object"
              },
              "next_steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "resource_url": {
                "type": "string"
              },
              "setup_prompt": {
                "type": "string"
              }
            },
            "required": ["application_id", "check", "configuration", "end_to_end_verified", "instance_id", "next_steps", "note"],
            "type": "object"
          },
