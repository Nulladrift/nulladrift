        {
          "name": "list_logs",
          "title": "List grouped application logs",
          "description": "Read application log metadata as groups and standalone events, newest first. limit counts entries, not individual events: each group or standalone event is one entry. entry_count, group_count, standalone_event_count, and represented_event_count describe this page, not all matching history. represented_event_count sums full group event_count plus standalone events, including group events outside the preview or event filters. Report entries separately from events; never describe limit: 50 as 50 individual events. Groups sort by start time and include up to 50 matching events, oldest first. first_event may be outside the event filters. Status is null until a flow concludes. Use list_log_group_events when has_more_events is true. An empty page with next_page_status=\"unknown\" can still be continued with cursor.starting_after. Retention metadata explains unavailable older history. Payload access is not supported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actor": {
                "description": "Match the event actor. Cannot combine with user_id or identifier.",
                "minLength": 1,
                "type": "string"
              },
              "application_id": {
                "description": "Clerk application ID (app_…).",
                "minLength": 1,
                "type": "string"
              },
              "client_id": {
                "minLength": 1,
                "type": "string"
              },
              "event_time_after": {
                "description": "Lower bound in Unix milliseconds. The grouped list selects by group start.",
