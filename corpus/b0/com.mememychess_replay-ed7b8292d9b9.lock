{
  "lockfileVersion": 2,
  "subjects": {
    "com.mememychess/replay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mememychess.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "mememychess",
        "title": "MemeMyChess",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Inspect user-supplied chess games, get legal replay positions, prepare a Chess Memes review, create a browser replay link, or call roast_my_game when a player asks for a funny moment to share (for example, “I played Black, roast my game”). roast_my_game creates one expiring, shareable link that opens directly into a short single-move meme replay; it does not put the PGN in the link. Meme reviews include only public viewer-facing moment descriptions and squares. No private media, catalog, session, or general sharing operations are exposed.",
      "tools": [
        {
          "name": "create_replay_link",
          "description": "Create a MemeMyChess browser replay URL carrying a PGN and selected game in its URL fragment. Anyone with the link can read the PGN.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "default": 1,
                "description": "One-based game number in the PGN.",
                "minimum": 1,
                "type": "integer"
              },
              "pgn": {
                "description": "A PGN up to 150,000 characters for a practical browser URL.",
                "maxLength": 150000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pgn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a replay link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee62dcc285ac63517f5312f4cbb7d8cb1dac32066ddc8ba4eeda12c51a0558ae"
        },
        {
          "name": "get_game_positions",
          "description": "Return legal board positions for one game in a user-supplied PGN. Each FEN is the board before the move in that row. Results omit engine and media details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "One-based game number in the PGN.",
                "minimum": 1,
                "type": "integer"
              },
              "pgn": {
                "description": "A user-supplied PGN. Maximum UTF-8 size is 5 MiB.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["game", "pgn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get replay positions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:45cb1969927561dd11a849a02fc3c3aed2c264b61823af8d5ed9185c4f03fff2"
        },
        {
          "name": "inspect_game_pgn",
          "description": "Parse a user-supplied PGN and return the games and public game headers. The PGN is sent to MemeMyChess for legal-game validation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pgn": {
                "description": "A user-supplied PGN. Maximum UTF-8 size is 5 MiB.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["pgn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect a PGN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5ad3bd51cd88272b767b46bf2d6453132a2cabfce1e857ed96b45e118ab1b14"
        },
        {
          "name": "open_meme_moment",
          "description": "Open one selected meme moment in the browser replay. The one-based moment number follows the ordered moments returned by review_meme_game. The URL includes the full PGN, selected game and moment, and anyone with the link can read the PGN.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "One-based game number in the PGN.",
                "minimum": 1,
                "type": "integer"
              },
              "moment": {
                "description": "One-based meme moment index from review_meme_game.",
                "minimum": 1,
                "type": "integer"
              },
              "pgn": {
                "description": "A user-supplied PGN. Maximum UTF-8 size is 5 MiB.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["game", "moment", "pgn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Open a meme moment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b0e240bd216d09cadeb1ad60d581efa3e4eacede0868987550b9b15da15f6433"
        },
        {
          "name": "review_meme_game",
          "description": "Prepare a Chess Memes review of one selected game using MemeMyChess story compilation. Returns only viewer-facing meme moments, their moves and board squares, a truthful summary, and a replay link when the PGN fits the browser-link limit. Games with no supported meme moments report zero moments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "One-based game number in the PGN.",
                "minimum": 1,
                "type": "integer"
              },
              "pgn": {
                "description": "A user-supplied PGN. Maximum UTF-8 size is 5 MiB.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["game", "pgn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Review a meme game"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c063ecf32846de99f563115b67e01c48c0146bf3d2b415a9bd68ba328f3789d"
        },
        {
          "name": "roast_my_game",
          "description": "Create one shareable, expiring friend link for a funny authored moment involving the side the user played, or a terminal loss to the other side. The link opens directly into a short single-move replay with its meme; the supplied PGN is not included. Games without a relevant authored reaction return no roast or link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "default": 1,
                "description": "One-based game number in the PGN.",
                "minimum": 1,
                "type": "integer"
              },
              "pgn": {
                "description": "A user-supplied PGN. Maximum UTF-8 size is 5 MiB.",
                "maxLength": 5242880,
                "minLength": 1,
                "type": "string"
              },
              "side": {
                "description": "The side the user played.",
                "enum": ["white", "black"],
                "type": "string"
              }
            },
            "required": ["pgn", "side"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Roast my game"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6d003e26e10970f4cda9999c1bb65cebc6ac9d386e4f0752d449b72f761c7f4"
        }
      ],
      "digest": "sha256:0ed591403bf58e35c8ee5e41c4829faa99dd0100f9f9a6b67d8b0e07f99ee2e2"
    }
  }
}
