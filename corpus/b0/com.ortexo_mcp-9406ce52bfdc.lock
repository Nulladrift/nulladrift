      "instructions": "Ortexo is a continuously updated database of Romanian law, tax and accounting rules, and Romanian, EU and Strasbourg case law. Article text is the consolidated version in force, carrying its version date, and every answer comes with the act title and article number so it can be cited.\n\nValues here move, and the current one is often not the widely-quoted one: the standard VAT rate became 21% on 1 August 2025, and the direct-award threshold in Legea 98/2016 has been 270.120 lei since Legea 208/2022 rather than the 132.519 lei figure as originally published.\n\nCONNECTING. The server is https://mcp.ortexo.com/mcp (remote MCP, OAuth sign-in, no API key). Claude Code adds it for every project with: claude mcp add --transport http --scope user ortexo https://mcp.ortexo.com/mcp (a new session picks it up). The person signs in once on Ortexo's screen: in Claude Code with /mcp (choose ortexo, then Authenticate) or in a terminal with: claude mcp login ortexo (it needs a real terminal); in Claude at claude.ai/customize/connectors . The steps for every assistant, as plain text, are at https://ortexo.com/mcp and the tool connection_guide returns them with no sign-in, with the fixes for a step that fails (for example a server held for one project folder that waits for approval) and the steps for an agent with a shell.\n\nUSING IT. START WITH describe_corpus, once per conversation: what the database covers, how far back snapshots reach and when it was last updated. The corpus is in Romanian, so queries are written in Romanian with diacritics; identifiers are text (\"17\", \"5^1\"). find_act says whether an act exists, search_semantic takes a described situation, search_lexical an exact term, lookup_article and lookup_articles read the text, lookup_article_at_date reads it as of a date, check_status says whether it is in force and verify_citations checks a draft.\n\nIS THE ACT THERE AT ALL. find_act searches the CATALOG rather than the text: it answers whether an act exists, its number, issuing body, publication date, Monitorul Oficial number, the date it entered into force and how many articles it has. `subject` is what the act is about, in Romanian and in any wording — title and subject line are both searched, in any word order and inflection. Every act comes back with a law=\"…\" handle that the other tools accept, and an approving order is listed with the separate act that holds its substance (an order \"pentru aprobarea Normelor …\" and the NORME themselves). It is also the tool for a very recent act: the catalog is populated the moment an act is ingested while its text becomes searchable later, so a zero from search_semantic on a new act is not evidence of absence.\n\nNAMING AN ACT. Every `law` argument takes the act however it is at hand: a citation (\"Legea 265/2022\", \"OUG 57/2019\", \"HG 1/2016\", \"Ordinul 2594/C/2008\"), a common name (\"Codul fiscal\", \"legea societăților\"), any title a tool printed, or \"normele de aplicare a X\" — which means X's norms, never X; when X has none, the reply says so and lists the norms the corpus holds on X's subject. An article of an order's annex cited through the order (\"art. 24 din Ordinul 2594/C/2008\") is read from the annex and labelled as the annex's.\n\nSTART WITH describe_corpus, once per conversation. It reports what the database covers, how far back point-in-time snapshots reach, and when it was last updated, so you know what can and cannot be answered from it.\n\nFINDING LAW. search_semantic takes a described concept or situation, written in Romanian with its diacritics: translate the question into Romanian legal terms first, because a query in English finds the right act but rarely the right article (4 of 4 acts, 1 of 4 articles, measured 16.10.2026). A question that names an act (\"Codul fiscal\", \"legea insolvenței\", \"OUG 195/2002\") is answered from that act first, and a query that is only a citation (\"art. 291 Codul fiscal\", \"Codul muncii art. 81\") returns that article as its first result. Results are one per article, the best paragraph of it; statutes, codes and ordinances rank above court decisions, aid schemes and orders unless the question asks for case law, and a row with a `code` is a note, not a document. search_lexical takes an exact term, phrase, figure or defined name, ranks by how many of your words a passage holds, and searches the principal codes in full. Both take a `sources` array — for Romanian court decisions, which is what disputes, deductibility challenges and 'has a court decided this' questions turn on, set it to [\"jurisprudence\"]: with both corpora the results are ranked together and may all be legislation. Accounting and OMFP questions are in the legislation corpus, reachable with search_semantic. The case law that `sources` reaches includes the Constitutional Court's decisions and the High Court's binding ones (RIL and HP). An order of ANAF or of a ministry is an act like any other: find_act finds it by what it is about. The two searches rank differently and find different passages: on 103 questions with a known answer (measured 2026-10-28), the answer was among the first 5 results of search_semantic for 67% of them, of search_lexical for 45%, of both for 41% and of at least one of the two for 71%.\n\nREADING LAW. lookup_article returns one article by number from a named act; lookup_articles fetches up to 25 at once, which is worth using because a legal answer commonly rests on ten or more provisions. `paragraph` narrows to one alineat and `point` to one punct; a full citation written into `article` (\"7 alin. (19)\") is read correctly. An article that the High Court's binding decisions cite — a recurs în interesul legii (RIL) or a hotărâre prealabilă (HP) — begins with a note naming them, saying whether the article was amended after each and how many newer versions of it there are; lookup_decision reads them (numar=\"RIL 27/2022\"). The note appears only when such decisions are attached, and its absence is not evidence that none exist, because the RIL/HP marking has gaps. When you need an article but do not know its number, get_act_structure returns the act's table of contents and, with `part`, the articles in one division with their headings. scan_act_for_terms answers the other shape of act-scoped question — WHICH articles of one act contain a literal term. It reads every node of the act with no relevance threshold and reports how many it read, so \"this act does not mention X\" becomes a citable finding rather than an absence of search results; the ranked searches cannot establish that, because they score relevance across the whole corpus. Romanian inflects, so pass the declined forms as separate terms.\n\nTIME. lookup_article returns today's text. For a past moment — a rate, rule or wording as it stood on some date — use lookup_article_at_date, which resolves the snapshot in force then and says so; it reports honestly when no snapshot covers the date, and warns when amendments landed between the snapshot and the date you asked about. compare_article returns only what changed between two dates, for ONE article (there is no whole-act diff: list the acts that changed an act with search_amending_acts, then compare the articles that matter). Both work on a REPEALED act too — they find its versions and say when it was repealed and by what — and an act with a single version answers every date of its life from its current text, unless something in the article is dated after the date asked; a refusal says why and which versions exist. lookup_article_historical reaches repealed acts, which the other tools exclude. check_status is short and cheap: whether an article is still in force, when it was last amended, and how many of the decisions interpreting it predate that amendment — a decision reasoning about a superseded text may no longer support the point it is cited for. search_amending_acts answers the other direction: WHICH act amended a given act (give `law`), or which hidden amending acts match some words (give `query`) — an act that only amends another is hidden from search on purpose, and this is the way to reach it.\n\nCASE LAW. Search with \"jurisprudence\" in `sources`, then lookup_decision to read a Romanian decision in full; `section` (\"dispozitiv\", \"considerente\", or a keyword) keeps a long judgment manageable. get_related maps an article's neighbourhood: what it refers to, what amended it, and which decisions interpret it, each tagged with the version the court was reading. get_related_batch does several articles at once. get_act_case_law lists the decisions linked to a whole act, the High Court's binding RIL and HP first, a page at a time, and get_act_case_law_map gives the number linked to each article, by division.\n\nTABLES. Many acts keep their substance in a table: a classification (the CAEN classes), a chart of accounts, a tariff, a list of products. list_tables lists the tables of an act with a handle for each, read_table reads one, rows under their column names a page at a time, get_cell gives one cell with its row and its neighbours, and search_tables finds the rows of an act's tables that hold the words or the code given. scan_act_for_terms reads the cells of an act's tables too, and lists the rows that hold a term. Drawings and pictures are not text and are not read; an answer says when the act has some. EU acts keep tables too (a list of goods by CN code, persons under restrictive measures, quotas): list_eu_tables, read_eu_table, get_eu_cell and search_eu_tables do for an EU act, given its CELEX, what those four do for a Romanian one, and say when an act holds tables with no cells in the database.\n\nEU AND STRASBOURG LAW ARE IN THIS DATABASE TOO. search_eu_law covers regulations, directives and decisions, held in their ROMANIAN versions: write its query in Romanian. Its full-text half matches Romanian words only, so an English question is matched by meaning alone and ranks lower (measured on 59 questions with known answers: the right article in the top five for 43 of the 51 Romanian questions, 5 of the 8 English ones). Name an act the way a lawyer does — \"GDPR\", \"Regulamentul 2016/679\", \"articolul 17 din GDPR\" — and its provisions, or that article, come first. lookup_eu_article reads one article by CELEX and follows a base act forward to the consolidated version. search_eu_jurisprudence covers CJEU case law — 41,305 rulings, orders and Advocate General opinions, held in Romanian, English or French, 19,382 of them ONLY in English or French — and 74,909 ECHR judgments and decisions, all in English or French, 5,041 of them against Romania: write `query` in Romanian AND pass the same question in English as `query_en` and in French as `query_fr`, which is how the judgments with no Romanian text are reached. It returns one row per case, the two courts interleaved; lookup_eu_decision then returns the judgment itself, taking a CJEU case number (C-131/12), a CELEX, an ECLI, a HUDOC id, an application number or a case name. When an answer turns on a DIRECTIVE, eu_transposition names the Romanian act that implements it, without which the directive alone is incomplete. eu_cited_in_romania shows which Romanian statutes and courts actually rely on an EU act, and get_eu_related maps what amended, replaced or interprets it.\n\nEU LAW NOW HAS EVERY TOOL ROMANIAN LAW DOES. lookup_eu_articles reads up to 25 EU articles in one call. get_eu_act_structure is the table of contents of an act — its titles, chapters and sections with the article range each holds — and with `part` it lists a division's articles by their opening words, which is what tells them apart because EU articles carry no headings. lookup_eu_article_at_date answers what an article SAID on a date: consolidated versions are collapsed by text, so an article consolidated thirty times with two actual wordings reports two, and you see when it really changed. compare_eu_article returns only the delta between two dates, and says plainly when nothing changed. eu_check_status answers at both levels at once — whether the ACT is in force, expired or repealed and by what, and whether the ARTICLE's text has been rewritten — because either alone misleads. lookup_eu_article_historical reaches a repealed act, which every other EU tool excludes: without it a repealed act reads as absent from the corpus, which is the opposite of the truth.\n\nCHECKING A DRAFT. verify_citations takes any text that cites Romanian or EU law — your own draft, a contract, an opinion someone else wrote — and reports each reference, down to the alineat, letter or point, as in force, repealed, or non-existent, in one call. Article numbers move and articles are repealed, so a citation that was correct when written may not be correct now. NEVERIFICAT means a reference could not be checked; it does not mean the reference is sound.\n\nWHEN A CALL FAILS it returns a code in brackets. LAW_NOT_RESOLVED means the act's name did not map to anything — rephrase it. LAW_NOT_IN_CORPUS means the act really is absent, which is worth saying plainly. ACT_HIDDEN means the act exists and is in force but is kept out of search, as a rule because it only amends another act whose consolidated text already carries the change: the reply names it, says how to read it and which act it changes, and search_amending_acts lists such acts. ARTICLE_NOT_FOUND and PARAGRAPH_NOT_FOUND mean the act was found but that subdivision was not. AMBIGUOUS means several acts share a number, and the reply lists a `law=\"…\"` handle for each — pick one and call again. NO_SNAPSHOT means point-in-time coverage does not reach that date, not that the rule did not exist.\n\nIDENTIFIERS ARE STRINGS. Article numbers, paragraphs, years and decision numbers are declared as text — send \"17\", \"2019\", \"170/2019\" — because they are not always numbers (\"5^1\", \"11a\") and a client that checks types refuses a bare 17.\n\nLANGUAGES, IN SHORT. Romanian legislation, Romanian case law and EU legislation are in Romanian: query them in Romanian, with diacritics. CJEU rulings are in Romanian, English or French, and ECHR judgments in English or French: query in Romanian and add query_en and query_fr.\n\nSIGN-IN. A connection is the person's own Ortexo account, signed in once on Ortexo's consent screen, and every query is drawn from that account's plan. The sign-in lapses when the person disconnects Ortexo in the app, when the account is suspended, or after 30 days without use; the connector stays listed and the next tool call is refused with 401, which is what makes the assistant prompt the person to sign in again, and only the person can do that: in Claude at https://claude.ai/customize/connectors, in Claude Code with /mcp (Re-authenticate) or, in a terminal, claude mcp login ortexo, and in any other assistant by following https://ortexo.com/mcp, which also gives the server URL https://mcp.ortexo.com/mcp.",
