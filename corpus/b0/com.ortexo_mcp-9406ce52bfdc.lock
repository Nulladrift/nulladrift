        {
          "name": "lookup_article",
          "description": "Fetch the exact, in-force text of one specific article by number from a named Romanian law or code (e.g. article 291 of 'codul fiscal', article 5 of 'codul penal'). Use this when you need a precise article verbatim, with its citation. Amendment history is returned separately under '— Modificări —', not mixed into the text. Set `paragraph` to fetch just one alineat (e.g. \"1\" → alin. (1)) instead of the whole article; a whole citation written into `article` (\"7 alin. (19)\", \"art. 169 alin. (1) lit. d)\", several letters at once: \"art. 291 alin. (2) lit. a) și c)\" or \"lit. a)-c)\") is read correctly too. An act with no articles — the norms of a code (law=\"normele de aplicare a Codului fiscal\"), an instruction, a procedure — is made of numbered POINTS: pass `article` as \"Titlul II pct. 3\", \"pct. 3.1\" or \"Anexa nr. 2 pct. 1\"; a bare \"291\" returns the points that CITE art. 291 of the code. Returns the IN-FORCE version; to read it as it stood on a past date pass `date` (the same result as lookup_article_at_date); for repealed/old law pass `include_repealed: true` (the same as lookup_article_historical).",
          "inputSchema": {
            "properties": {
              "article": {
                "type": "string"
              },
              "date": {
                "description": "Optional. YYYY-MM-DD: read the article as it stood on that date instead of today. The same as lookup_article_at_date.",
                "type": "string"
              },
              "include_repealed": {
                "description": "Optional. true: look in repealed / old law too (e.g. the old Cod fiscal, Legea 571/2003). The same as lookup_article_historical. With `date` as well, the dated read wins: it never drops a date.",
                "type": "boolean"
              },
              "law": {
                "description": "The act, however it is at hand: a citation ('Legea 265/2022', 'HG 1/2016', 'Ordinul 2594/C/2008'), a common name ('Codul fiscal'), a title any tool printed, or 'normele de aplicare a Legii X'.",
                "type": "string"
              },
              "paragraph": {
                "description": "Optional. One alineat to return, e.g. \"1\" or \"1^1\" — scopes the result to that paragraph and its litere/puncte, reducing noise.",
                "type": "string"
              },
              "point": {
                "description": "Optional. One point (pct.) to return, e.g. \"42\". Use this on definitions articles, where every point sits under a SINGLE alineat so `paragraph` returns the whole article. A large article comes back as a structure map listing its points — pass one of those ids here.",
                "type": "string"
