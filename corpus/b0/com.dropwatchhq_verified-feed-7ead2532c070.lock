{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/verified-feed": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://verified.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "verified-feed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "feed_status",
          "description": "Return the latest verification snapshot of a minted feed: per-record status + as-of date + stale flags (records past the feed's freshness SLA) + signed receipts. Try slug 'govcon-demo'.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:290bf550c1bd65ff4ccd3e0082fed900c17a713e1ce5d1a21d0c951317066e85"
        },
        {
          "name": "verify_receipt",
          "description": "Recompute + verify a verification receipt's hash-chain (proves the verification is unaltered since its as-of date). Pass the receipt id.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c170afcc264369655abea0a84645eaceb4aaa0a2d7bf20ad91e34b6a8bd7247e"
        },
        {
          "name": "verify_record",
          "description": "Run a contradiction-verified, signed verification on ONE record of a data owner's feed. Attaches a verification STATUS (VERIFIED / CONTRADICTED / EXCLUSION_HIT / UNVERIFIABLE), an AS-OF date, source links, and a tamper-evident hash-chain receipt — by re-checking the record's subject against the live contradiction-engine (SEC 10-K vs USAspending) and, for named entities, the live exclude-feed. A dated evidence statement, never a guarantee.",
          "inputSchema": {
            "properties": {
              "feed": {
                "description": "Feed slug the record belongs to (used for SLA + receipt scoping).",
                "type": "string"
              },
              "record": {
                "description": "{ id, subject:{ticker?, name?}, claim? }",
                "type": "object"
              }
            },
            "required": ["record"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:255637dd3e5dd72f0f0afc29605f723dd2c5f8a6bee9c5504230d14eff94b840"
        },
        {
          "name": "verify_subject",
          "description": "One-off contradiction-verified check of a single subject (ticker and/or named entity) against the live hubs, with an as-of date and signed receipt. Free preview shows status only; paid call returns full detail + receipt.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              },
              "ticker": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d67eba3a17281675eab9cb78f1b4158a10bc283c375177b7fd283b3f09db8be9"
        }
      ],
      "digest": "sha256:f873027c4ef50a3f7d1e196432aeaa090c5aaa34296b57e8edcba2ac4bde25ec"
    }
  }
}
