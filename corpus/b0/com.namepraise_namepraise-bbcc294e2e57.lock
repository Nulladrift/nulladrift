{
  "lockfileVersion": 2,
  "subjects": {
    "com.namepraise/namepraise": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://namepraise.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "namepraise",
        "title": "Namepraise",
        "version": "7"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools: evaluate_domain scores one domain 0-100; evaluate_domains batch-scores up to 10 with a summary; compare_domains ranks candidates; suggest_domains generates and scores available alternatives from keywords; check_availability is a free RDAP lookup. tools/call needs an API key (POST /v1/keys) as Authorization: Bearer; a Cloudflare Turnstile token also works. See /auth.md and /.well-known/mcp/server-card.json.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check domain availability",
          "description": "Best-effort RDAP registration check for one domain: available, taken (with registration date when the registry publishes it), or unknown. Free — requires a credential but costs no quota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name or URL to check.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3e50a69daca6c113408115a143a29085093f203635aef206f9f2364ac38e5ad"
        },
        {
          "name": "compare_domains",
          "title": "Compare candidate domains",
          "description": "Score 2-10 candidate domains and rank them: winner, score margin, and each name's strongest and weakest scoring group. Use when choosing between name options.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "default": "en",
                "description": "BCP-47 language tag.",
                "maxLength": 35,
                "type": "string"
              },
              "domains": {
                "description": "Domain names or URLs, 2-10 items.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "includeMarket": {
                "default": true,
                "description": "Include market-fit criteria in the score.",
                "type": "boolean"
              },
              "intent": {
                "description": "Optional intended use, sent to the scoring model.",
                "maxLength": 200,
                "type": ["string", "null"]
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:928309e339ff0ad66f0aa989dbd1a7d7b93b45e2cd8337c3d4f42954fd39636b"
        },
        {
          "name": "evaluate_domain",
          "title": "Evaluate a domain name",
          "description": "Score exactly one domain 0-100 across structure, phonetics, brand, meaning, and market, with a best-effort RDAP availability hint. The score is a brand-quality read, not a price appraisal or a legal opinion. For several names in one call use evaluate_domains instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "default": "en",
                "description": "BCP-47 language tag.",
                "maxLength": 35,
                "type": "string"
              },
              "domain": {
                "description": "Domain name or URL to score.",
                "maxLength": 2048,
                "type": "string"
              },
              "includeMarket": {
                "default": true,
                "description": "Include market-fit criteria in the score.",
                "type": "boolean"
              },
              "intent": {
                "description": "Optional intended use, sent to the scoring model.",
                "maxLength": 200,
                "type": ["string", "null"]
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:914688215a15ddc36628a0633fde31f34b1b044ed67eb499f4f8a5185c92b1a1"
        },
        {
          "name": "evaluate_domains",
          "title": "Evaluate several domains at once",
          "description": "Batch-score up to 10 domains in one call and get per-domain evaluations plus an aggregate summary (top scorer, mean score). Malformed entries come back as per-item errors. For a single name use evaluate_domain. Costs one quota unit per evaluated domain.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "default": "en",
                "description": "BCP-47 language tag.",
                "maxLength": 35,
                "type": "string"
              },
              "domains": {
                "description": "Domain names or URLs, 1-10 items.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "includeMarket": {
                "default": true,
                "description": "Include market-fit criteria in the score.",
                "type": "boolean"
              },
              "intent": {
                "description": "Optional intended use, sent to the scoring model.",
                "maxLength": 200,
                "type": ["string", "null"]
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:295fdd3eaee4a686c4db1a485f6aeb945e79d9c1648eb8b387c8e951b65ce08e"
        },
        {
          "name": "suggest_domains",
          "title": "Suggest alternative domain names",
          "description": "Generate candidate names from keywords, keep the ones RDAP reports as available, and score up to 8 of them. Use for brainstorming alternatives or when a name is taken.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "default": "en",
                "description": "BCP-47 language tag.",
                "maxLength": 35,
                "type": "string"
              },
              "count": {
                "default": 5,
                "description": "How many available candidates to score, up to 8.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "includeMarket": {
                "default": true,
                "description": "Include market-fit criteria in the score.",
                "type": "boolean"
              },
              "intent": {
                "description": "Optional intended use, sent to the scoring model.",
                "maxLength": 200,
                "type": ["string", "null"]
              },
              "keywords": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Seed word(s) for the product, company, or idea — a string or up to 8 words."
              },
              "tlds": {
                "default": ["com"],
                "description": "Suffixes to try: com, io, ai, app, dev, co, net, org, so, me, gg, xyz.",
                "items": {
                  "enum": ["com", "io", "ai", "app", "dev", "co", "net", "org", "so", "me", "gg", "xyz"],
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:64f27bdb9a15ddd7fb6f3d4fce9ace3ad905f02ddee9a0a5a335af69d53bfdec"
        }
      ],
      "digest": "sha256:cda31b86744312652357dbef8653072179f6307b04593b58ed4fd8087f421eb8"
    }
  }
}
