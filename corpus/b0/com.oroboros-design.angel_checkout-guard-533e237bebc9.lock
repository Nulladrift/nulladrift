{
  "lockfileVersion": 2,
  "subjects": {
    "com.oroboros-design.angel/checkout-guard": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://angel.oroboros-design.com/mcp/checkout-guard"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "angel-checkout-guard",
        "title": "Checkout Guard — pre-purchase check for shops, payment links and paid APIs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call preflight with the url before your agent buys, pays or calls an unknown paid endpoint: TLS, domain age, look-alike domains, redirects to foreign gateways, payment provider, card fields, text aimed at agents and, for x402, USDC contract, payTo and price traps. Verdict pay, caution or do_not_pay. On pay, a disclosed affiliate partner_link for the same merchant may be added (partner_link:false omits it). Free: 500 calls with a free key (no account, no card), 5 calls a day without one. Then €9 one-time for 5,000 calls by card for businesses (buy_pack_with_card), or 0.02 USDC per call via x402.",
      "tools": [
        {
          "name": "buy_pack_with_card",
          "title": "Angel: 5,000 calls by card",
          "description": "For businesses without USDC: 5,000 calls €9.00, one-time, 90 days, businesses only, paid in EUR by card or Link. Returns checkout_url for a person to open; the checkout asks for the company or freelance name. After payment the success page (Accept: application/json) returns the key, and it is e-mailed.\nAfter: any tool with bundle_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 5000,
                "enum": [5000],
                "type": "integer"
              },
              "email": {
                "description": "Where the key is sent (optional; Stripe asks otherwise).",
                "format": "email",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Angel: 5,000 calls by card"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c80d249dcf3d302254c8cdbc4203d557c5fade670f9d1d61cf10a831921ddb0"
        },
        {
          "name": "preflight",
          "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint — or for a need: find the offer and check it",
          "description": "Before an agent buys, pays or hires: send url (shop, checkout, payment link, API or x402 endpoint), need (what to buy in plain words; Angel takes the pick from the open sea at mareliberum.dev and checks it) or agent (mare:… resident: its trust score). One unpaid request each: TLS, domain age, look-alikes, redirects, payment provider, card fields, text aimed at agents and, for x402, USDC contract, payTo and price traps. Verdict pay, caution or do_not_pay, risk_score, reasons. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: input-guard on the page text you will act on (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "instead of a url: a resident of the open sea (mareliberum.dev) you want to pay or hire; Angel returns its trust score 0-100 from its work, notes, seals and own endpoint",
                "pattern": "^mare:[a-z2-9]{12}$",
                "type": "string"
              },
              "budget": {
                "description": "with need: highest price",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "currency": {
                "description": "with need: currency of the budget",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "max_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "method": {
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "need": {
                "description": "instead of a url: what your user wants to buy, in plain words (sizes, budget, place included), e.g. \"trail running shoes size 44 under 150 EUR, ships to Germany\". Angel takes the pick from the open sea (mareliberum.dev/decide) and checks it before you pay.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "partner_link": {
                "description": "default true: on verdict pay for a shop with an affiliate program, the answer adds partner_link (same merchant, disclosed: Angel may earn a commission, merchant sets the price); false omits it",
                "type": "boolean"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "region": {
                "description": "with need: country code or name",
                "type": "string"
              },
              "url": {
                "description": "the shop, checkout or payment link, API or x402 endpoint to check (public https domain, port 443). Send url or need.",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint — or for a need: find the offer and check it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aef32aa108c28bf37ae33996c46c24be6b9d8ab880d1180d863b3439063b7ac0"
        }
      ],
      "digest": "sha256:336398615cceda0fb1406c029913f8c204ec44c36521b02d0ad8a7becdfc66f1"
    }
  }
}
