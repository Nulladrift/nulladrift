                "type": "string"
              },
              "remaining_actions": {
                "type": "integer"
              },
              "retryable": {
                "type": "boolean"
              },
              "suite_id": {
                "type": "string"
              },
              "terminal": {
                "type": "boolean"
              },
              "toolset_id": {
                "type": "string"
              }
            },
            "required": ["ok"],
            "then": {
              "required": ["attempt_handle", "ok"]
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:568fe60cfec91fc52262243d906003bab6f8340a7b7e36a3df50d971d9239689"
        },
        {
          "name": "chamber_action",
          "description": "Perform one bounded action in the room already entered. Do not invent objects or operations. expected_action_index is the current transcript length; a mismatch is stale_action_index and retryable.",
