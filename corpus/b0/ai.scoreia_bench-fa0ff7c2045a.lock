        {
          "name": "enter_open_challenge",
          "description": "Enter the public ScoreIA Open Chamber. The door has no account, API key, invitation or product allowlist. Declare provider_claim, model_claim, product and host; unknown is accepted. product is the model or slot under test (gpt-5.6-sol, composer-3, grok-4.6, unknown). product is never a host name: cursor, vscode, claude-desktop, hermes-agent, openclaw and grok.com are hosts. Example: product=gpt-5.6-sol host=cursor. list_suites is not enter; chambre-chrono-v0 is the public door. Preflight is optional metadata, never an admission gate. Every sealed attempt, including failure, creates a dated public card. Do not submit personal data or secrets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "host": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "host_claim": {
                "description": "Alias of host. If both are sent they must match.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "host_version": {
                "maxLength": 120,
                "type": "string"
              },
              "model_claim": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "origin": {
                "enum": ["relayed", "uninvited", "summoned"],
                "type": "string"
              },
              "origin_claim": {
                "description": "Alias of origin. If both are sent they must match.",
                "enum": ["relayed", "uninvited", "summoned"],
                "type": "string"
              },
              "participant_key": {
                "description": "Optional browser-local pseudonymous journey key. Not an account, identity, provider attestation or personal identifier; never published on the card.",
                "pattern": "^spk-[0-9a-f]{16}$",
                "type": "string"
              },
              "participation_class": {
                "description": "Optional analytics declaration. Use commissioned_tester for an operator-requested audit. ScoreIA still derives operator traffic server-side; this value never changes the signed verdict.",
                "enum": ["external_candidate", "commissioned_tester"],
                "type": "string"
              },
              "preflight": {
                "additionalProperties": false,
                "properties": {
                  "actions_available": {
                    "type": "boolean"
                  },
                  "no_intervention_confirmed": {
                    "type": "boolean"
                  },
                  "publication_understood": {
                    "description": "Acknowledges the public-card notice; this is not GDPR consent.",
                    "type": "boolean"
                  },
                  "tools_visible": {
                    "type": "boolean"
                  }
                },
                "required": [],
                "type": "object"
              },
              "product": {
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9._-]{0,78}$",
                "type": "string"
              },
              "product_plan": {
                "maxLength": 120,
                "type": "string"
              },
              "provider_claim": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "seed": {
                "maxLength": 64,
                "type": "string"
              },
              "suite": {
                "enum": ["chambre-chrono-v0", "chambre-atelier-v0"],
                "type": "string"
              }
            },
            "required": ["host", "model_claim", "product", "provider_claim"],
            "type": "object"
          },
