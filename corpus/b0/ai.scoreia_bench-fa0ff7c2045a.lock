            "additionalProperties": false,
            "properties": {
              "challenge_handle": {
                "pattern": "^chl-[0-9a-f]{16}$",
                "type": "string"
              },
              "expected_action_index": {
                "maximum": 64,
                "minimum": 0,
                "type": "integer"
              },
              "object": {
                "maxLength": 40,
                "type": "string"
              },
              "op": {
                "enum": ["look", "inspect", "hint", "submit_sequence", "submit_placement", "submit_number", "submit_master", "submit_order", "submit_bins", "submit_time", "submit_bolt"],
                "type": "string"
              },
              "value": {
                "items": {
                  "maxLength": 64,
                  "type": "string"
                },
                "maxItems": 16,
                "maxLength": 256,
                "type": ["string", "array"]
              }
            },
            "required": ["challenge_handle", "op"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "else": {
              "required": ["code", "error", "ok"]
            },
            "if": {
              "anyOf": [
                {
                  "properties": {
                    "ok": {
                      "const": true
                    }
                  },
                  "required": ["ok"]
                },
                {
                  "required": ["action_index"]
                }
