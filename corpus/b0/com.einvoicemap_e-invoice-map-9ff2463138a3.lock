          "name": "providers",
          "title": "Tracked e-invoicing providers",
          "description": "E-invoicing providers we track in a country (two-letter code), alphabetical by product name, with a link to each provider's page. The order never depends on payment; ads and affiliate links are not included.",
          "inputSchema": {
            "properties": {
              "country": {
                "title": "Country",
                "type": "string"
              }
            },
