{
  "lockfileVersion": 2,
  "subjects": {
    "com.einvoicemap/e-invoice-map": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://einvoicemap.com/api/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "E-Invoice Map",
        "title": "E-Invoice Map",
        "version": "1",
        "description": "Free read-only e-invoicing data: mandate dates, providers, validation errors, foreign-supplier rules and Peppol network counts.",
        "websiteUrl": "https://einvoicemap.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "E-Invoice Map answers questions about e-invoicing mandates and the providers that serve them, from public data that anyone can read at the linked pages. All tools are read-only and free; nothing you send is stored.\n\n- Mandate dates, validation-error explanations and foreign-supplier rules come from official sources; every answer lists its source_url and the date it was checked (captured_at / checked_on). Quote the source when you cite a date.\n- Providers are listed alphabetically by product name. The order never depends on payment, and ads are not included.\n- Network counts come from the Peppol Directory (OpenPeppol AISBL); credit it when you quote them.\n- lookup_access_point is rate limited. When it says the limit is reached, send the user to the lookup page on the website.\n- Always give the user the page link from the answer: it shows the same facts with their sources.",
      "tools": [
        {
          "name": "deadlines",
          "title": "E-invoicing mandate dates",
          "description": "Dates when e-invoicing becomes mandatory, per country (or all countries), each with its official source_url and the date it was checked. Country is a two-letter code such as 'be', 'de', 'ae' or a country name; leave it out for all countries.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Country"
              }
            },
            "title": "deadlines_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "deadlines_toolDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0bc7499dbe57b85691e5a5eb87f2b5f153b462cfc6eb92b9121f2791cbad61e"
        },
        {
          "name": "directory_counts",
          "title": "Peppol Directory counts",
          "description": "How many businesses are listed in the Peppol network directory, per country, with the change since the last day (source: Peppol Directory (OpenPeppol AISBL)). Country is a two-letter code or 'all'; leave it out for every country.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Country"
              }
            },
            "title": "counts_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "counts_toolDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70e3c17edff3c1950a87a6a3f37f899473924f45405ff8c03f93af2066e89904"
        },
        {
          "name": "explain_validation_error",
          "title": "Explain an e-invoice validation error",
          "description": "Plain-language explanation of a common e-invoice validation rule such as 'BR-CO-10' or 'PEPPOL-EN16931-R120': what it means, usual causes, how to fix it and who fixes it.",
          "inputSchema": {
            "properties": {
              "code": {
                "title": "Code",
                "type": "string"
              }
            },
            "required": ["code"],
            "title": "explain_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "explain_toolDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91a31db4103bda99ec8c666be57e4080c499dd2095add72da33be750ad3cc83c"
        },
        {
          "name": "foreign_supplier_scope",
          "title": "Do foreign suppliers have to e-invoice?",
          "description": "Whether a supplier with no establishment in a country must e-invoice there, from our 47-country table: the system, the B2B status and what applies to foreign suppliers, with official sources. Country is a two-letter code or an English name.",
          "inputSchema": {
            "properties": {
              "country": {
                "title": "Country",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "foreign_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "foreign_toolDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b03019de533e21d7242ab3f5d289b1af3c2646393f1fa5800457cc22da281e65"
        },
        {
          "name": "lookup_access_point",
          "title": "Which provider receives a company's e-invoices?",
          "description": "For a business identifier you give (for example a Belgian company number or a Peppol ID such as 0208:0521875440), find the access-point provider that receives its e-invoices on the Peppol network: provider organisation, SMP host, document types, certificate validity. Provider metadata only. Limited per day; when the limit is reached the answer points to the free lookup on the website. Country is an optional two-letter hint.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Country"
              },
              "identifier": {
                "title": "Identifier",
                "type": "string"
              }
            },
            "required": ["identifier"],
            "title": "lookup_toolArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "lookup_toolDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:60ad6ddacf3dc378fcdf752162a3b3ebe84264d49f35f4058e6c20701c513891"
        },
        {
          "name": "provider",
          "title": "One provider's profile",
          "description": "Profile of one tracked provider by name or id (for example 'billit'): what it can do, formats, languages, free plan and prices, each price with its source and check date.",
          "inputSchema": {
            "properties": {
              "name_or_slug": {
                "title": "Name Or Slug",
                "type": "string"
              }
            },
