      "instructions": "MacTech Solutions CMMC / NIST SP 800-171 reference server. Provides the full 110-requirement catalog of NIST SP 800-171 Rev 2 with the official DoD Assessment Methodology (Annex A) point weights (deduction pool 313, score range -203 to 110), and computes exact SPRS scores. Also serves the official NIST SP 800-171A assessment objectives (320 objectives - how assessors test each control), framework crosswalks to NIST 800-53/FedRAMP Moderate, CSF 2.0, and SOC 2, CMMC level determination (FCI vs CUI), the 17 Level 1 practices, and structured POA&M generation for gaps. Use it for defense-contractor cybersecurity compliance questions: what a control requires, how it is assessed, how much it is worth, what a given implementation state scores, and how to plan remediation.\n\nAUTHORITY: this server answers for NIST SP 800-171 REVISION 2, deliberately. NIST withdrew Rev 2 on 14 May 2024 in favour of Rev 3, but DoD did not follow: class deviation 2024-O0013 R1 pins DFARS 252.204-7012 to Rev 2 until rescinded, and 32 CFR 170.14 names Rev 2 in the regulation itself. Rev 2 is what is contractually binding and what SPRS scores against. Do not answer a Rev 2 obligation with Rev 3 content; the identifiers collide (Rev 2's 3.1.1 sorts as 03.01.01, while Rev 3's 03.01.01 is a different requirement entirely).\n\nCURRENCY: CMMC Phase II was suspended on 13 July 2026 - C3PAO and DIBCAC assessments cannot currently be designated, though DFARS 252.204-7012 and the Rev 2 baseline remain in force. That is a fast-moving situation served from a static corpus; verify at https://dowcio.war.gov/CMMC/ before relying on it for a bid or contract decision.",
      "tools": [
        {
          "name": "calculate_sprs_score",
          "title": "Calculate an SPRS score",
          "description": "Compute an exact SPRS score per the DoD Assessment Methodology: start at 110 and subtract each unimplemented requirement's Annex A weight (floor −203). Pass the control numbers that are NOT implemented; optionally pass 3.5.3 and/or 3.13.11 as partially implemented for their sliding-scale values (MFA for privileged/remote only = −3; encryption present but not FIPS-validated = −3). Also reports whether the score clears the 88-point conditional CMMC Level 2 certification threshold and flags a missing SSP (3.12.4), which blocks SPRS submission entirely.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "not_implemented": {
                "description": "Rev 2 control numbers not implemented, e.g. [\"3.5.3\", \"3.11.2\"]. An empty array means all 110 implemented (score 110). Rev 3 identifiers are rejected - there is no DoD scoring methodology for Rev 3.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "partially_implemented": {
                "description": "Sliding-scale controls at their partial value: 3.5.3 (MFA for privileged and remote users only) and/or 3.13.11 (encryption employed but not FIPS-validated). Deducts 3 instead of 5.",
                "items": {
                  "enum": ["3.5.3", "3.13.11"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["not_implemented"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "conditional_note": {
                "type": "string"
              },
              "deductions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "points": {
                      "type": "number"
                    },
                    "requirement": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "points", "requirement"],
                  "type": "object"
                },
                "type": "array"
              },
              "meets_conditional_level_2_threshold": {
                "description": "Whether the score reaches 88. Clearing it is necessary but not sufficient - every open item must also be POA&M-eligible.",
                "type": "boolean"
              },
              "missing_ssp": {
                "description": "Present when 3.12.4 is unimplemented, in which case no score can be submitted to SPRS at all.",
                "type": "string"
              },
              "scale": {
                "type": "string"
              },
              "sprs_score": {
                "description": "The computed score, from 110 down to the -203 floor.",
                "type": "number"
              },
              "total_points_deducted": {
                "type": "number"
              },
              "unknown_controls": {
                "description": "Inputs that matched no requirement - treat as caller error, not as implemented.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["deductions", "meets_conditional_level_2_threshold", "scale", "sprs_score", "total_points_deducted"],
            "type": "object"
          },
