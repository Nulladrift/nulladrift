        {
          "name": "check_contract_type_eligibility",
          "title": "Can you accept this contract type?",
          "description": "Determine whether a contractor can legally be awarded a given contract type, based on the business systems that type requires. A cost-reimbursement contract may be awarded only if the accounting system is adequate for determining costs (FAR 16.301-3), and T&M billing cannot be substantiated without compliant timekeeping - so this is an eligibility gate, not a preference. Call this before a bid/no-bid, when a solicitation names a contract type, or when someone asks what a pre-award survey will examine. Also returns the SF1408 criteria and the six DFARS business systems whose deficiencies trigger payment withholding after award.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "contract_type": {
                "description": "The contract type named in the solicitation. Omit to compare all types.",
                "enum": ["firm-fixed-price", "fixed-price-incentive", "fixed-price-economic-price-adjustment", "time-and-materials", "labor-hour", "cost-plus-fixed-fee", "cost-plus-incentive-fee", "cost-plus-award-fee", "cost-sharing", "idiq"],
                "type": "string"
              },
              "include_sf1408": {
                "description": "Include the SF1408 pre-award accounting system survey criteria.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
