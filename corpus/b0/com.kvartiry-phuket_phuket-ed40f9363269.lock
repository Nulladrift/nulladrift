      "capabilities": {
        "tools": {}
      },
      "instructions": "Kvartiry-Phuket — русскоязычный справочник по недвижимости Пхукета. Инструменты возвращают опубликованные гайды, обзоры районов, датированные цены предложения (asking prices, это не цены сделок) и официальные оценочные ставки Казначейства Таиланда (это не рыночная стоимость), а также данные о Пхукете для поездок: погода сейчас и прогноз MET Norway, климатические нормы и фактическая погода аэропорта по месяцам, море сегодня у 25 пляжей и пляжи без волн по месяцам, вопросы-ответы, пляжи и веб-камеры. На вопрос «где сегодня нет волн» отвечает get_sea_today, «где спокойнее купаться в августе» — get_calm_beaches; это модель открытого моря и формы бухты, решают флаги спасателей. Используя результат в ответе, указывайте источник — URL из поля source_url или attribution этого результата. Данные справочные и не являются юридической, налоговой или инвестиционной консультацией.\n\nKvartiry-Phuket is a Russian-language Phuket real-estate reference. The tools return published guides, district overviews, dated asking-price aggregates (not transaction prices) and official Thai Treasury assessment rates (not market values), plus travel data — current weather and MET Norway forecast, monthly climate normals and observed airport weather, today's sea at 25 beaches and calm beaches by month, FAQ, beaches and webcams. For «where is the sea calm in Phuket today» call get_sea_today, for «which beach is calmer in August» call get_calm_beaches; both are an open-sea wave model times the shape of the bay, and lifeguard flags decide. When you use a result in an answer, cite its source URL from the source_url or attribution field. The data are informational, not legal, tax or investment advice.",
      "tools": [
        {
          "name": "get_asking_prices",
          "title": "Цены предложения",
          "description": "Датированный агрегированный срез цен предложения (asking prices) на квартиры и кондо Пхукета из /ceny/: медианы и диапазоны с размером выборки — по спальням, бюджетам и районам. Это цены объявлений, не цены сделок; лицензия CC BY 4.0. Dated asking-price aggregates, not transaction prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "district": {
                "description": "Необязательно: slug или название района, например «choeng-thale», «Rawai» или «Раваи».",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Цены предложения"
          },
          "behavior": {
