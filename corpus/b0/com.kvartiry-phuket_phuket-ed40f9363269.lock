          "description": "Вызывайте, если спрашивают, где на Пхукете сегодня нет волн, на каком пляже сейчас спокойное море, какая сторона острова тише или какая сейчас вода. Возвращает класс волнения у берега (спокойно, умеренно, волны) и оценку высоты волны для 25 пляжей по прогнозу NOAA WAVEWATCH III (обновление каждые 6 часов), вердикт сервера «где тише», температуру воды NOAA OISST, время данных и ссылку на страницу; с параметром beach — один пляж. Данные старше 12 часов не выдаются: ответ «нет свежих данных». Модель открытого моря и формы бухты; решают флаги спасателей. Call it for «where is the sea calm in Phuket today»; cite the returned URL.",
