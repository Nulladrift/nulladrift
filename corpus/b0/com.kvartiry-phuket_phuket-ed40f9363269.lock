          "description": "Ищет по опубликованным гайдам Kvartiry-Phuket о покупке, аренде, налогах, визах и жизни на Пхукете (тексты на русском). Возвращает до 10 гайдов: заголовок, URL, описание и дату обновления. Search the published Russian-language Phuket guides; cite the returned URLs.",
