            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d772561b22233de8797f5c340694a66f6a3053672689e701e26e2a1f8e76692d"
        },
        {
          "name": "get_calm_beaches",
          "title": "Пляжи без волн по месяцам",
          "description": "Вызывайте, если спрашивают, на каком пляже Пхукета спокойнее купаться в определённом месяце: например, где нет волн в августе или куда ехать в июле за тихим морем. Возвращает рейтинг 25 пляжей по доле спокойных дней месяца за 2017–2026 (модель NOAA WAVEWATCH III и форма бухты по OpenStreetMap) с числом дней; где оценка зависит от точки в море — диапазон, место по нижней границе. Это многолетняя статистика, не прогноз: про сегодня — get_sea_today. Модель открытого моря и формы бухты; решают флаги спасателей. Calm beaches by month; cite the returned URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Сколько первых мест рейтинга вернуть (1–25); пляжи с той же долей, что у последнего, тоже войдут.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Номер месяца: 1 — январь, 8 — август.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["month"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Пляжи без волн по месяцам"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a87080e94764af12b80c4d17b2de941d078356d02380ce9e16653e0a1137a78"
