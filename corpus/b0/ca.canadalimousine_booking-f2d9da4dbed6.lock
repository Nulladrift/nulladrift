      "instructions": "CanadaLimousine.ca: Chauffeured limousine, black car and airport transfer service in Toronto, Vancouver, Montreal, Calgary, Edmonton, Ottawa, Winnipeg, Halifax and ten more Canadian cities: fixed fare, flight-tracked, met at the door. Use search_coverage to find a page, get_page to read it and get_booking_options for services, vehicles, policies and the online booker. Never state a price that is not in get_booking_options or the booker. Only call request_booking after the traveller explicitly asked to book and gave their name, a contact (email or phone), pickup, drop-off, date and local time; send consent=\"yes\". The result is a request reference: tell the traveller the team will confirm by email or phone. Agents never take payment.",
      "tools": [
        {
          "name": "get_booking_options",
          "title": "Booking options",
          "description": "Services, vehicles, coverage, pricing rules, contact channels, the online booker link and booking policies.",
