  "subjects": {
    "com.appin60.submitcheck/launch-directories": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://submitcheck.appin60.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "submitcheck",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Find launch directories for a product and check whether a directory is dead. Data checked Oct 2026.",
      "tools": [
        {
          "name": "check_launch_directory",
          "description": "Check whether a launch directory domain (e.g. betapage.co) is live, dead, or now redirects elsewhere, from a live check of 516 directories in Oct 2026.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15779bef4f3fca4558f0d021d267721f8a1192477bc6de3bdaa1ff801f56bff6"
        },
        {
          "name": "find_launch_directories",
          "description": "Find live startup/SaaS/AI-tool launch directories (checked Oct 2026) that fit a product, with submit URL and whether the listing is free, free only with a badge, queued, or paid. Returns up to 10 (free tier).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "launch-platform, saas-directory, ai-directory, mcp-directory, open-source-directory, startup-database, b2b-reviews, alternatives, ...",
                "type": "string"
              },
              "free": {
                "description": "Free option filter (default yes)",
                "enum": ["yes", "yes-backlink", "queue", "no", "any"],
                "type": "string"
              },
              "no_account": {
                "description": "Only directories that do not need an account",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da50825a1b1eafb6e7c62a6fa0185822f679f7e41f9bcd9c03a5409cd34a7acd"
        }
      ],
      "digest": "sha256:2a6babf13c66e7a1d17d89601e022fb89c3bd89171031c56206bf10164fe9f3e"
    }
  }
