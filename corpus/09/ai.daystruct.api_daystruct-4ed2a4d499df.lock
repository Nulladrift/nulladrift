          "name": "acquire_daystruct_package",
          "description": "Acquire access to an inspected reusable source package at its exact discovered version and digest. With an API key: honors the explicit credit ceiling and key spending limit; repeating acquisition returns the same receipt; then use read_daystruct_package. Without a key, where x402 is enabled: returns x402 PaymentRequired (MCP transport); retry with _meta[\"x402/payment\"] to pay in USDC and receive the artifact. This is not provider task execution or proof of successful integration.",
