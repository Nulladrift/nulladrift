        {
          "name": "discover_daystruct_capabilities",
          "description": "Browse every public Daystruct capability without an account, or search using a task sentence or tool name. Lists default to eight compact descriptors. Set limit (1-100) and offset to follow meta.nextOffset until null; view: full returns up to 100 full metadata records per page. Category and delivery filters narrow the list. Responses carry live freshness, requirements, limitations, prices and profile links; inspect a reference for its full contract before using it. Provider availability is not proof a task will succeed. Licensing filters exclude entries with no licensing evidence; read a profile for its full receipt. Licensing findings are evidence against a configured policy, not legal advice. Private Data and Memory cards never appear here; list your account's cards with list_daystruct_cards. Each result's card field holds its image reference; show it with get_daystruct_card_image when you introduce that capability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bundleMembers": {
                "enum": ["all_validated"],
                "type": "string"
              },
              "category": {
                "maxLength": 200,
                "type": "string"
              },
              "delivery": {
                "maxLength": 200,
                "type": "string"
              },
              "licenseEvidence": {
                "items": {
                  "enum": ["verified-text", "verified-upstream-api", "declared", "unverified"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "licensePolicyState": {
                "items": {
                  "enum": ["current", "policy_outdated", "legacy_unvalidated"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "licenseReciprocal": {
                "enum": ["exclude", "only"],
                "type": "string"
              },
              "licenseSpdx": {
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "licenseStatus": {
                "items": {
                  "enum": ["validated", "review_required", "blocked", "legacy_unvalidated"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "licenseUnresolved": {
                "enum": ["none"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              },
              "reference": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "enum": ["source", "data", "memory"],
                "type": "string"
              },
              "view": {
                "enum": ["compact", "full"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
