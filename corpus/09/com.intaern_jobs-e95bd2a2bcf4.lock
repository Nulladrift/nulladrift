{
  "lockfileVersion": 2,
  "subjects": {
    "com.intaern/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://intaern.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "intaern-jobs",
        "title": "intaern jobs",
        "version": "1.0.0",
        "websiteUrl": "https://intaern.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open positions on https://intaern.com, in Germany. Start with search_jobs. Applications only via apply_url.",
      "tools": [
        {
          "name": "get_employer",
          "title": "Get employer",
          "description": "Everything about one employer as schema.org JSON-LD: the employer, its page and all open positions. Use employer_slug from search_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employer_slug": {
                "type": "string"
              }
            },
            "required": ["employer_slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1670a9174f3d0250c468f5ec7c680d462e464c8f0cee1308ba0082b276e88de4"
        },
        {
          "name": "get_job",
          "title": "Get job",
          "description": "One position as schema.org JobPosting with tasks, requirements, benefits and the application link. Use employer_slug and job_id from search_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employer_slug": {
                "type": "string"
              },
              "job_id": {
                "type": "string"
              }
            },
            "required": ["employer_slug", "job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3e68e98856580edd33edb24f6ecc094a4f2474133c8d3ae350c1054ce3d1331"
        },
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search open positions. All filters are optional and combined with AND. Returns title, employer, location, hours, salary if published, and links to the job page and the 60-second application (no CV needed).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "employment_type": {
                "description": "OTHER = apprenticeship",
                "enum": ["FULL_TIME", "PART_TIME", "TEMPORARY", "OTHER"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City or part of the address, e.g. 'Düsseldorf'",
                "type": "string"
              },
              "query": {
                "description": "Words from the job title or employer, German or English, e.g. 'Physiotherapeut' or 'physiotherapist'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:922a612595a7c2f0823d5300e359d6d11a50f07d092701dfa40d925061d1bdfb"
        }
      ],
      "digest": "sha256:5ebdaad563c702c691e483f2a7de43ad5b144c53eda77f6134e0251e05554eac"
    }
  }
}
