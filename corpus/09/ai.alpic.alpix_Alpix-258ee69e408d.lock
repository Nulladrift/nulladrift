        {
          "name": "stamp-grid",
          "description": "Draw a rectangular sprite on the shared 256x256 canvas by submitting an ASCII grid — the natural way to draw pixel art. Each line of the grid is one row of pixels; each character is one pixel. The grid's width and height set the drawing size. 'legend' maps single characters to palette color names. Characters NOT in the legend are transparent (existing canvas pixel under them is left untouched). The top-left of the grid is placed at (x, y) on the canvas. Coordinates: (0,0)=top-left, (255,255)=bottom-right. Available colors (32): dark_red, red, orange_red, orange, yellow, pale_yellow, dark_green, green, light_green, dark_teal, teal, light_teal, dark_blue, blue, light_blue, indigo, periwinkle, lavender, dark_purple, purple, pink_purple, magenta, pink, light_pink, dark_brown, brown, beige, black, dark_gray, gray, light_gray, white. Spatial structure is preserved in the grid string, so the drawing comes out as it looks. Max 4096 placed (non-transparent) pixels per call — for larger drawings, split into several adjacent stamp-grid calls. Example — a red plus sign with a yellow center at (10, 20):\n  x=10, y=20\n  legend={\"R\": \"red\", \"Y\": \"yellow\"}\n  grid=\".R.\\nRYR\\n.R.\"\n  (the '.' characters aren't in the legend, so those pixels are left as-is)If you ever need to draw a new version of the same shape, do not send a blank grid. Instead just draw above the existing shape. Always pass user_name (read from the canvas widget — the name the user picked) and model_name (your own model identifier, lowercase hyphen-separated, e.g. 'gpt-4o', 'claude-opus-4-7'). These are recorded so other users can see who drew it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "grid": {
                "description": "Multi-line ASCII grid. Each line is one row of pixels; each character is one pixel. Use newline ('\\n') between rows.",
                "minLength": 1,
                "type": "string"
              },
              "legend": {
                "additionalProperties": {
                  "enum": ["dark_red", "red", "orange_red", "orange", "yellow", "pale_yellow", "dark_green", "green", "light_green", "dark_teal", "teal", "light_teal", "dark_blue", "blue", "light_blue", "indigo", "periwinkle", "lavender", "dark_purple", "purple", "pink_purple", "magenta", "pink", "light_pink", "dark_brown", "brown", "beige", "black", "dark_gray", "gray", "light_gray", "white"],
                  "type": "string"
                },
                "description": "Map from single-character keys to palette color names, e.g. {\"R\": \"red\", \"B\": \"blue\"}. Any character in the grid not present here is treated as transparent (skipped).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "model_name": {
                "description": "Your model identifier. Use lowercase words separated by hyphens, followed by the version number — e.g. 'gpt-4o', 'claude-opus-4-7', 'gemini-2-5-pro'. Used for attribution.",
                "type": "string"
              },
              "user_intent": {
                "description": "A concise summary of the user's goal, based only on what they asked. The server uses this to decide whether to route the request to its internal agent or handle it with a deterministic workflow. Include only details needed for that decision. Before sending, strip all personally identifiable information (names, emails, phone numbers, addresses, dates of birth, ID numbers, payment details, credentials, IP addresses, and device identifiers) and sensitive personal data (such as health information, religion, or precise location). Do not ask follow-up questions solely to fill in this summary.",
                "type": "string"
              },
              "user_name": {
                "description": "The user's chosen name (read it from the canvas widget). Used for attribution.",
                "type": "string"
              },
              "x": {
                "description": "Column on the canvas where the top-left of the grid is placed.",
                "maximum": 255,
                "minimum": 0,
                "type": "integer"
              },
              "y": {
                "description": "Row on the canvas where the top-left of the grid is placed.",
                "maximum": 255,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["grid", "legend", "model_name", "user_name", "x", "y"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "drawing_id": {
                "description": "ID of the recorded drawing (absent when nothing was placed).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "height": {
                "description": "Grid height in pixels.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "placed": {
                "description": "Non-transparent pixels written.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "skipped": {
                "description": "Transparent cells skipped (no legend match).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "width": {
                "description": "Grid width in pixels.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["height", "placed", "skipped", "width"],
            "type": "object"
          },
