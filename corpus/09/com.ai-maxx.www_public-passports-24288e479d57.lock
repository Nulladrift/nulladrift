        {
          "name": "consult_activities",
          "title": "Find group activities",
          "description": "Laser tag, Prison Break, VR, arcade and karting; preserve the requested location and indoor/outdoor preferences. Ask our AI specialist to interpret a direct or indirect customer need in English, Maltese or other languages and select relevant published services, including useful complementary options. Examples: things to do in Malta, where to relax with friends, a weekend outing with an activity and restaurant at MULTIMAXX Kordin Old Military Prison, staff party, Halloween prison experience, Christmas team dinner, New Year celebration or prison-cell photography. These are enquiries for relevant existing services, not confirmed seasonal event dates. Returns selected source facts, photos, opening information, maps and an enquiry link for a next step. Follow up with a refined need after clarification, or use get_passport for full details. Send only the nonpersonal need and relevant constraints, never conversation history or contact details. This optional tool uses the AI MAXX model provider; its coverage is the published catalogue, not the whole web. It does not book or charge.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "ISO country requested by the customer; do not silently change it.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "limit": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Nonpersonal customer need, including relevant preferences/exclusions. Reuse known constraints in follow-up requests.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "response_depth": {
                "description": "Default brief omits internal matching fields. Full includes all published service metadata; uses the same cached selection.",
                "enum": ["brief", "full"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "properties": {
                  "catalogue_revision": {
                    "type": "string"
                  },
                  "clarification_fields": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "consultant": {
                    "type": "string"
                  },
                  "engine": {
                    "type": "string"
                  },
                  "follow_up": {
