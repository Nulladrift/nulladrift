          "title": "Search published business passports",
          "description": "Search AI MAXX published company, service and place records by a specific customer need or business name. Returns source links, review dates, arrival information and availability caveats. This catalogue is limited to its listed businesses; it does not search the whole web or guarantee availability. Specify country_code when the user names a country.",
