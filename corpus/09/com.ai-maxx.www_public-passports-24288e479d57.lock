                            "const": "POST"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["consultant", "method", "url"],
                        "type": "object"
                      },
                      "instructions": {
                        "type": "string"
                      },
                      "needed": {
                        "type": "boolean"
                      },
                      "questions": {
                        "items": {
                          "properties": {
                            "field": {
                              "type": "string"
                            },
                            "question": {
                              "type": "string"
                            }
                          },
                          "required": ["field", "question"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "state": {
                        "type": "string"
                      },
                      "tool": {
                        "type": "string"
                      }
                    },
                    "required": ["api", "instructions", "needed", "questions", "state", "tool"],
                    "type": "object"
                  },
                  "location_relationship": {
                    "type": "string"
                  },
                  "matches": {
                    "items": {
                      "properties": {
                        "passport": {
                          "properties": {
                            "arrival": {
                              "type": ["object", "null"]
