      "serverInfo": {
        "name": "campaignpack",
        "title": "Campaign Pack",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Campaign Pack turns a product photo and a brief into a complete marketing campaign — plan, ideas, ad and social scripts, a creator brief, stills and a client-ready PDF. Everything runs on Campaign Pack's own GPUs; no third-party model provider ever sees the user's product.\n\nYou write the brief. Interview the user about the product, the buyer and the positioning, then hand a specific, factual brief to start_campaign — it is the single biggest lever on how good the pack is. Never invent metrics, customers or prices.\n\nA run takes minutes, not seconds. start_campaign returns a job id immediately; poll check_campaign roughly every 20 seconds. There is one GPU, so runs serialise: never start a second campaign while one is going.\n\nA campaign is multiplayer. share_campaign lets a teammate open the same run from their own client while it is still going.",
      "tools": [
        {
          "name": "abort_campaign",
          "title": "Stop a campaign",
          "description": "Stop a running campaign.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id returned by start_campaign.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:45b059fa75289bbbaadd7dc91323c3191168ccf6b9827fdaade65c8300255c9d"
        },
        {
          "name": "answer_approval",
          "title": "Answer an approval prompt",
          "description": "Answer a paused run that wants to send the user's data somewhere outside Campaign Pack. Ask the person; never decide for them.",
          "inputSchema": {
            "properties": {
              "decision": {
                "description": "What the person said: 'allow' to let the run go ahead, 'refuse' to deny it. This must be their answer, not yours.",
                "enum": ["allow", "refuse"],
                "type": "string"
              },
              "job_id": {
                "description": "Job id returned by start_campaign.",
                "type": "string"
              }
            },
            "required": ["decision", "job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:347e083fe4f343a211f956464b8f1a3cd013b1498cb066306c1ed573d188b586"
        },
        {
          "name": "check_campaign",
          "title": "Check campaign progress",
          "description": "Progress of a running campaign: status, the tools it has just called, queue position, and whether it is waiting for a human approval. Poll about every 20 seconds.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "Job id returned by start_campaign.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:620411ca4a0fe9c987dd79344ac7ce835cef32733b1b1461dcff510fed00d3c1"
        },
        {
          "name": "get_download_url",
          "title": "Get a download link",
          "description": "A link the person can open to get one file — the campaign PDF, a product still, a video. Works for any file in the workspace, including ones too big or too binary to read as text. The link expires within the hour.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "File path relative to the workspace, as shown by list_workspace_files.",
                "type": "string"
              },
              "session_id": {
                "description": "Link a file from a campaign shared with this account rather than its own files. Omit for your own workspace.",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:86563afb54b2d81128edc3f55681775ea198857d85fff2f018f1e4dfa0a0bcac"
        },
        {
          "name": "get_pack",
