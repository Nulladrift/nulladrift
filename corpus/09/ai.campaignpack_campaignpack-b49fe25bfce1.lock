        },
        {
          "name": "share_campaign",
          "title": "Share a campaign",
          "description": "Give a teammate access to a campaign by email address — including while it is still running. They see the same live run from their own AI client or the website, can abort it, answer its approval prompts, and take the next turn. They must already have a Campaign Pack account; sharing does not create one.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email address of the person to let in. They must already have a Campaign Pack account under this address; sharing does not create one or send an invitation.",
                "type": "string"
              },
              "session_id": {
                "description": "Campaign to act on — the session id from start_campaign or check_campaign.",
                "type": "string"
              }
            },
            "required": ["email", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:15017e767d355d215a1bb0dc2bdbfcaee9164546a1454ce385e9ceba82570f01"
        },
        {
          "name": "start_campaign",
          "title": "Start a campaign",
          "description": "Start a marketing campaign pack on Campaign Pack's own GPUs. Produces a campaign plan, ideas, ad and social scripts, a creator brief, and a client-ready PDF — plus product stills on the image sizes. Returns immediately with a job id; the run itself takes minutes, so poll check_campaign rather than waiting. Write the brief yourself from what the user told you: the richer and more specific it is, the better the pack. Nothing is sent to any third-party model provider.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "The brand name, spelled exactly as the customer spells it. Every mention in the pack is rewritten to match this.",
                "type": "string"
              },
              "brief": {
                "description": "What the product is, who it is for, what matters about it. A few sentences to a few paragraphs. State only facts the user gave you — invented metrics or customers end up in the finished pack.",
                "type": "string"
              },
              "photo": {
                "description": "Workspace path from upload_product_photo. Required for the image sizes: the stills are edited from the real photo rather than generated from nothing.",
                "type": "string"
              },
              "size": {
                "description": "Pack size. Available here: 'text' (about a minute), 'lite' (about ten minutes).",
                "enum": ["text", "lite"],
                "type": "string"
              }
            },
            "required": ["brand", "brief"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2add317032b97890b7585d0e0e5b33866d71d9b4543685e3ab8211dd890f1f03"
        },
        {
          "name": "unshare_campaign",
          "title": "Remove someone's access",
          "description": "Revoke a collaborator's access. Takes effect on their next request.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email address of the collaborator to remove. The owner cannot be removed this way.",
                "type": "string"
              },
              "session_id": {
                "description": "Campaign to act on — the session id from start_campaign or check_campaign.",
                "type": "string"
              }
            },
            "required": ["email", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
