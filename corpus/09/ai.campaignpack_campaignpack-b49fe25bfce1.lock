        {
          "name": "read_workspace_file",
          "title": "Read a workspace file",
          "description": "Contents of a text file in the workspace — a script, the plan, the creator brief, a transcript. Large files are truncated. For a PDF, image or video call get_download_url instead.",
          "inputSchema": {
            "properties": {
              "path": {
