          "digest": "sha256:037957c2c34d6de5fb64106cce8a1152c50783967b5152eff73626be43b26bf9"
        },
        {
          "name": "upload_product_photo",
          "title": "Upload a product photo",
          "description": "Put a product photo into the user's workspace so a campaign can edit stills from the real thing. Base64 of the image bytes.",
          "inputSchema": {
            "properties": {
              "data_base64": {
                "description": "The image file's bytes, base64-encoded. The raw image, not a data: URL and not a path on your own machine.",
                "type": "string"
              },
              "filename": {
                "description": "Name to save it under, with the extension — 'bottle.jpg'. Reusing a name that is already there replaces that photo.",
                "type": "string"
              }
            },
            "required": ["data_base64", "filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
