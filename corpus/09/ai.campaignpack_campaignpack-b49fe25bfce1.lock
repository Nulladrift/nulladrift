        {
          "name": "list_campaigns",
          "title": "List past campaigns",
          "description": "Campaigns on this account, newest first, including ones shared with it. Start here when you do not already have an id — the ids from start_campaign only exist in the conversation that made them, so this is how you find a campaign from last week.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many to return, newest first. Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
