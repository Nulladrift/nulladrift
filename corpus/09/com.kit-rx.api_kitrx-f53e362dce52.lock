      "capabilities": {
        "tools": {}
      },
      "instructions": "Kit Rx serves compact JSON answers built from authoritative public sources and live checks: web page and document to Markdown; HTTP security headers graded A+ to F and website checks; domain WHOIS (RDAP), DNS, email authentication and due-diligence reports; SEC EDGAR filings, full-text search and 8-K events; company profiles (Wikidata, GLEIF LEI); ECB FX rates; onchain tools (multi-chain gas prices, calldata and EIP-712 signature safety checks, transaction decoding, verified ABIs, token risk scans, wallet balances, ENS); OFAC sanctions screening; x402 tools (pre-payment check of a paid endpoint, x402 API finder, payment receipt); US address geocoding and NWS weather; email address checks; and FDA drug data with CMS NADAC prices. Each call is a single x402 payment in USDC on Base, Polygon, Arbitrum, Avalanche or Sei, over HTTP or the MCP server at /mcp. Requests that fail or match nothing are not charged. Over MCP, kitrx_catalog is free and lists every tool with its price, parameters and equivalent HTTP x402 URL. Every other tool has the fixed USDC price shown in its description and is paid per call with x402 v2 over MCP: a call without _meta[\"x402/payment\"] returns isError true with an x402 PaymentRequired object (x402Version, resource, accepts, extensions) in structuredContent and content[0].text; a call carrying a signed PaymentPayload in _meta[\"x402/payment\"] is verified, run, and settled only when the tool succeeds, and the settlement receipt is returned in _meta[\"x402/payment-response\"].",
      "tools": [
        {
          "name": "chain_calldata_decode",
          "title": "EVM calldata decoder with pre-signing risk flags",
          "description": "Decodes EVM calldata before signing: function signature, selector, named arguments, candidate signatures for ambiguous selectors, one level of bundled calls (multicall, Multicall3, ERC-4337 execute, Safe execTransaction, multiSend), token symbol and decimals, and risk flags with reasons for unlimited approvals, setApprovalForAll, permits, transferFrom, admin calls and delegatecall. Sources: Sourcify ABIs and 4byte signatures, JSON-RPC via PublicNode. Price: $0.002 per successful call, paid in USDC with x402 v2; failed calls and calls that match nothing are not charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Chain of the transaction by name or id: base (8453), ethereum (1), arbitrum (42161), optimism (10), polygon (137), avalanche (43114). Default base when to is given.",
                "examples": ["base"],
                "type": "string"
              },
              "data": {
                "description": "Transaction calldata, 0x-prefixed hex with a 4-byte selector; at most 16,384 hex digits (8 KB).",
                "examples": ["0x095ea7b3000000000000000000000000000000000022d473030f116ddee9f6b43ac78ba3ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"],
                "type": "string"
              },
              "to": {
                "description": "Contract the transaction is sent to. When given, its Sourcify-verified ABI (following a proxy to its implementation) decodes the call, and token symbol, decimals and contract-code checks are added.",
                "examples": ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"],
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "EVM calldata decoder with pre-signing risk flags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
