                "type": "string"
              },
              "name": {
                "description": "Person, company, vessel or aircraft name, 2 to 120 characters, in Latin script; case, accents, punctuation and word order are ignored. Mutually exclusive with address.",
                "examples": ["Vladimir Putin"],
                "type": "string"
              },
              "threshold": {
                "description": "Minimum name match score from 70 to 100 (default 85); the score mainly reflects how closely every query word matches a word of the listed name. Name mode only.",
                "examples": [85],
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
