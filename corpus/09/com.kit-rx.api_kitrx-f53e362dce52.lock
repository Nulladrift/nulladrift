                "type": "string"
              },
              "cik": {
                "description": "SEC Central Index Key, 1 to 10 digits, instead of ticker.",
                "examples": ["320193"],
                "type": "string"
              },
              "compare_prior": {
                "description": "10-K/10-Q only: also read the prior filing of the same form and list new and removed risk factors (default false).",
                "enum": ["true", "false"],
                "examples": ["false"],
                "type": "string"
              },
              "form": {
                "description": "10-K, 10-Q or 8-K: required with ticker or cik (latest filing of that form).",
                "enum": ["10-K", "10-Q", "8-K"],
                "examples": ["10-K"],
                "type": "string"
