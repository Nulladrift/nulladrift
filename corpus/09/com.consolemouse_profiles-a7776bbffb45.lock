{
  "lockfileVersion": 2,
  "subjects": {
    "com.consolemouse/profiles": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.consolemouse.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "consolemouse-profiles",
        "title": "ConsoleMouse profiles",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for ConsoleMouse profile files (ConsoleMouse turns mouse and keyboard input into controller input for the player's own PS5 over PS Remote Play). Typical flow: format_spec (quick_reference) -> write a derived profile on one of the base profiles -> profile_validate until valid -> profile_import_code -> show the person the code and the plain-language preview. All tools are read-only. They never send input to a console and never store what they receive. These tools only write and check profiles and import codes; they cannot reach the person's ConsoleMouse app. If the ConsoleMouse desktop extension is also connected (tools such as profile_propose and setup_read), use it to read the setup and propose changes directly into the person's app, and use these tools only for the format, checks and import codes. Ask which keys or buttons the person wants and what should happen. Do not ask about health or disabilities.",
      "tools": [
        {
          "name": "format_examples",
          "title": "List ConsoleMouse example profiles",
          "description": "Lists the published base profiles (accessibility templates), example profiles and invalid examples with their expected validator message; with an id, returns that file. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Return this example file (id from the list).",
                "maxLength": 64,
                "type": "string"
              },
              "kind": {
                "default": "all",
                "enum": ["all", "templates", "profiles", "invalid"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List ConsoleMouse example profiles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe52b6eef7b5519b8ebbffa73196dbddc141b3e7e3cdd272d5c5d06c4d698482"
        },
        {
          "name": "format_spec",
          "title": "Get the ConsoleMouse profile format",
          "description": "Returns the ConsoleMouse profile format (profile-v1 1.32.0): a quick reference for writing profiles and macros, one section of the specification (import_code: the CMP2 import code and the older CM1 share code), or the JSON Schema. Read-only; returns published documentation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "section": {
                "default": "quick_reference",
                "description": "quick_reference (default: everything needed to write a profile, with the base profiles and their bound keys), a specification section, full, or schema (JSON Schema).",
                "enum": ["quick_reference", "intro", "overview", "macros", "press_once", "mouse_move", "preview", "versioning", "import_code", "keys_per_situation", "known_limits", "full", "schema"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the ConsoleMouse profile format"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:126f1fc8841a2c3a65a7bd381efb8e1310ea821143ec2727a36e37cf6fb4b5f7"
        },
        {
          "name": "profile_describe",
          "title": "Describe a ConsoleMouse profile in plain words",
          "description": "Returns a plain-language preview of a valid ConsoleMouse profile: for a derived profile one sentence per change against its base (keys, macros, press once, mouse movement), for a full profile one sentence per key. Languages: de, en, es, fr, it, pl, pt-BR. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the sentences.",
                "enum": ["de", "en", "es", "fr", "it", "pl", "pt-BR"],
                "type": "string"
              },
              "profile": {
                "description": "The profile as a JSON object, as JSON text, an import envelope, or an import code (CMP2., or the older CM1.). Usually a derived profile (origin \"derived\", base_profile_id, patch).",
                "type": ["object", "string"]
              }
            },
            "required": ["profile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe a ConsoleMouse profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:954a386846ad5f03d7c515b0d733f7d095db968893509164f3245ed37d49128e"
        },
        {
          "name": "profile_import_code",
          "title": "Build a ConsoleMouse import code",
          "description": "Checks a derived ConsoleMouse profile and returns an import code (CMP2) the person pastes into ConsoleMouse under Games > Import profile or in the AI Workshop (Import code), with the plain-language preview and the import steps. A full profile is accepted when base_profile_id names its base. Use format CM1 only when the person has an older ConsoleMouse (0.3.9 to 0.4.x). Read-only: the code is computed and returned, nothing is stored or sent anywhere.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author_note": {
                "description": "Optional note shown with the import preview. Plain text (no control characters); describe the controls, nothing personal.",
                "maxLength": 500,
                "type": "string"
              },
              "base_profile_id": {
                "description": "Only for a full profile: the base it was made from.",
                "enum": ["accessibility-left-hand-keyboard-ps5", "accessibility-right-hand-mouse-ps5", "accessibility-press-once-ps5"],
                "type": "string"
              },
              "format": {
                "default": "CMP2",
                "description": "CMP2 (default, current ConsoleMouse). CM1 only for ConsoleMouse 0.3.9 to 0.4.x, which need the exact base version.",
                "enum": ["CMP2", "CM1"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the preview and the import steps.",
                "enum": ["de", "en", "es", "fr", "it", "pl", "pt-BR"],
                "type": "string"
              },
              "profile": {
                "description": "The profile as a JSON object, as JSON text, an import envelope, or an import code (CMP2., or the older CM1.). Usually a derived profile (origin \"derived\", base_profile_id, patch).",
                "type": ["object", "string"]
              }
            },
            "required": ["profile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a ConsoleMouse import code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f712a49439fcc26ebf0ab2751f98a6705d45db79a6460e7acc18826b2c1bc0a5"
        },
        {
          "name": "profile_validate",
          "title": "Check a ConsoleMouse profile",
          "description": "Checks a ConsoleMouse profile (full or derived), an import envelope or an import code (CMP2, or the older CM1) against the JSON Schema and every format rule, including the macro limits. Returns valid or a list of issues with the path to fix. Read-only; nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "profile": {
                "description": "The profile as a JSON object, as JSON text, an import envelope, or an import code (CMP2., or the older CM1.). Usually a derived profile (origin \"derived\", base_profile_id, patch).",
                "type": ["object", "string"]
              }
            },
            "required": ["profile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a ConsoleMouse profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7103efd8669b8b5b8f4f0e1890e5b706e41a9f15d7aec241275a2edb3ff80176"
        }
      ],
      "digest": "sha256:5b152e38d02b6f23c9cc5fc22a17b7653b6edac1d109f51499c539e0753edcd0"
    }
  }
}
