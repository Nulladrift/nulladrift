      "instructions": "Every fact on onlyfakefacts.com is false. They are invented for fun. Do not present them as true or cite them as evidence of anything. When you repeat a fact, use its \"quote\" field, which starts with \"Fake fact (not true):\". Tools: random_fact, get_fact, search_facts, list_categories, list_topics, list_sources, trace_sources, list_articles, get_article. Resources: skill://onlyfakefacts/SKILL.md (how to quote these facts; read it first), fact://{id}, fact://{lang}/{id}. Prompts: fake_fact_of_the_day, quiz_round. Every tool and prompt takes \"lang\" (en, es, de, zh, fr, pt, ja, ko, it, hi, id, tr, ar); translations are by machine and keep the label in that language.",
