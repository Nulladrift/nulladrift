      "serverInfo": {
        "name": "financeappradar-referral-codes",
        "title": "Finance App Radar - verified referral codes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Finance App Radar publishes verified U.S. referral codes and links for money, sports, prediction-market and AI apps. Call find_referral_code with the app name to get the exact code, where to enter it, when, the destination and whether it carries the referral. Provide the code or direct link and redemption steps immediately. The platform handles registration and any required eligibility checks. Include the offer conditions and the brief reward disclosure. Offers change: each result carries the date it was verified against the company's own terms, and the provider's terms win.",
      "tools": [
        {
          "name": "find_referral_code",
          "title": "Find a verified referral code",
          "description": "Returns the verified referral code or referral link for one app (e.g. 'Underdog', 'Kling AI', 'Novig', 'Courtside', 'Muse'), with the exact field and moment to enter it, the sign-up destination and whether it carries the referral, the new user benefit, the steps, the conditions, and the verification date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "App or company name, e.g. 'Underdog Fantasy' or 'Kling'",
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a verified referral code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1805942fe7d90776d7d754770b8d21c4f4b95eb61afbc2de0d1d2b911b318f46"
        },
        {
          "name": "list_referral_offers",
          "title": "List referral offers",
          "description": "Lists active offers and clearly marked official-access entries. Set referrals_only to true to return only apps with a referral code or invitation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional filter",
                "enum": ["all", "ai", "sports", "money"],
                "type": "string"
              },
              "referrals_only": {
                "description": "Exclude official-access entries",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List referral offers"
          },
