        {
          "name": "list_sec_filings",
          "title": "List SEC EDGAR 10-K, 10-Q, 8-K, Form 4 & 13F-HR Filings with Markdown",
          "description": "List official SEC EDGAR filings (10-K, 10-Q, 8-K, Form 4 insider trades, 13F-HR institutional holdings) by ticker or CIK with direct EDGAR URLs and optional HTML-to-Markdown conversion. Cost: 2 Credits / filing returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extract_markdown": {
                "default": false,
                "description": "Convert latest matched filing HTML into clean LLM-ready Markdown.",
                "type": "boolean"
              },
              "form": {
                "default": "10-K,10-Q,8-K,4,13F-HR",
                "description": "Comma-separated SEC forms.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max filings to return (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "US stock ticker (e.g. \"TSLA\") or institutional CIK (e.g. \"0001067983\" for Berkshire Hathaway 13F-HR).",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Response status code (0 for success).",
                "type": "integer"
              },
              "data": {
                "description": "Official SEC EDGAR filing index and optional clean Markdown excerpt.",
                "properties": {
                  "cik": {
                    "description": "10-digit SEC CIK.",
                    "type": "string"
                  },
                  "company_name": {
                    "description": "Official SEC registered entity name.",
                    "type": "string"
                  },
                  "count": {
                    "description": "Number of matched SEC filings returned.",
                    "type": "integer"
                  },
                  "filings": {
                    "description": "SEC filing records with form type, dates, accession number, and primary EDGAR URLs.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "ticker": {
                    "description": "Normalized uppercase US stock ticker or CIK.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
