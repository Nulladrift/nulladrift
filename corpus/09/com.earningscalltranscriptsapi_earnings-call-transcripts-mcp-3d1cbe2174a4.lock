        "type": "http",
        "url": "https://api.earningscalltranscriptsapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "earningscalltranscriptsapi-mcp-server",
        "title": "Earnings & Fundamentals API — US Earnings Releases, XBRL Financials & SEC Filings MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Query official US public-company SEC 8-K Item 2.02 earnings releases (Markdown), EPS surprises, standardized SEC XBRL financial statements (income, balance, cashflow), earnings calendar, Delayed/EOD stock summaries, and 10-K/10-Q/8-K/Form 4/13F-HR filings. Handshake and tools/list are free; pass x-api-key (ec_live_...) or OAuth 2.1 Bearer token for tools/call. Claim 3,000 Free Credits ($0.30) on sign-up — No Card Required at https://earningscalltranscriptsapi.com/signup.",
      "tools": [
        {
          "name": "get_company_financials",
          "title": "Get Standardized SEC XBRL Income, Balance Sheet & Cash Flow Statements",
          "description": "Fetch official SEC EDGAR XBRL companyfacts normalized into clean Wall Street JSON (revenue, gross profit, operating income, net income, diluted EPS, cash, total debt, operating cash flow, CapEx, free cash flow) for quarterly or annual periods. Cost: 10 Credits / call (0 Credits if not found).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "Number of reporting periods (1–16).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "quarterly",
                "description": "Reporting period: quarterly (10-Q/10-K) or annual (10-K).",
                "enum": ["quarterly", "annual"],
                "type": "string"
              },
              "statement": {
                "default": "income",
                "description": "Financial statement type: income, balance, cashflow, or all.",
                "enum": ["income", "balance", "cashflow", "all"],
                "type": "string"
              },
              "ticker": {
                "description": "US stock ticker symbol (e.g. \"AAPL\", \"NVDA\", \"MSFT\") or SEC CIK.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Response status code (0 for success).",
                "type": "integer"
              },
              "data": {
                "description": "Standardized SEC XBRL financial statement periods.",
                "properties": {
                  "cik": {
                    "description": "10-digit zero-padded SEC CIK.",
                    "type": "string"
                  },
                  "company_name": {
                    "description": "Official SEC registered entity name.",
                    "type": "string"
                  },
                  "count": {
                    "description": "Number of fiscal periods returned.",
                    "type": "integer"
                  },
                  "period": {
                    "description": "Reporting cadence (quarterly or annual).",
                    "type": "string"
                  },
                  "periods": {
                    "description": "Normalized fiscal period statement rows.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "statement": {
                    "description": "Requested statement scope (income, balance, cashflow, or all).",
                    "type": "string"
                  },
                  "ticker": {
                    "description": "Normalized uppercase US stock ticker.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b0d01697a574dc106c3caae15abc04c01df759133efdc1a08d236e9c928d3289"
        },
        {
          "name": "get_earnings_calendar",
          "title": "Get Upcoming Earnings Dates & Latest EPS Surprise Calendar",
          "description": "Query upcoming earnings report windows, current-quarter EPS consensus estimates, latest reported EPS beat/miss surprises, and latest SEC 8-K Item 2.02 filing dates for a single ticker or watchlist. Cost: 2 Credits / ticker returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Single US stock ticker (e.g. \"MSFT\").",
                "type": "string"
              },
              "tickers": {
                "description": "Comma-separated watchlist up to 15 tickers (e.g. \"NVDA,AAPL,MSFT,GOOGL,AMZN\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Response status code (0 for success).",
                "type": "integer"
              },
              "data": {
                "description": "Upcoming earnings window and latest EPS surprise calendar entries.",
                "properties": {
                  "calendar": {
                    "description": "Per-ticker upcoming earnings dates and latest EPS surprise records.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "count": {
                    "description": "Number of calendar entries returned.",
                    "type": "integer"
                  },
                  "tickers": {
                    "description": "Resolved ticker symbols queried.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fc5a4a0784ac542c7ed4ae0a72fc7102ab4a5111cdd504f8da4c340fb13a23b5"
        },
        {
          "name": "get_earnings_releases",
          "title": "Get SEC 8-K Item 2.02 Quarterly Earnings Releases & EPS Surprises",
          "description": "Retrieve official SEC EDGAR Form 8-K Item 2.02 quarterly earnings releases & CFO commentary converted to clean LLM-ready Markdown, paired with historical EPS actual vs. consensus estimate and beat/miss surprise %. Cost: 10 Credits / call (0 Credits if not found).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_text": {
                "default": true,
                "description": "Include clean Markdown text extracted from official Exhibit 99.1.",
                "type": "boolean"
              },
              "limit": {
                "default": 4,
                "description": "Number of recent 8-K Item 2.02 releases (1–12).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "US stock ticker symbol (e.g. \"NVDA\", \"AAPL\", \"MSFT\") or 10-digit SEC CIK.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Response status code (0 for success).",
                "type": "integer"
              },
              "data": {
                "description": "Company metadata, SEC 8-K Item 2.02 earnings releases (with optional Markdown), and historical EPS surprises.",
                "properties": {
                  "cik": {
                    "description": "10-digit zero-padded SEC Central Index Key.",
                    "type": "string"
                  },
                  "company_name": {
                    "description": "Official SEC registered entity name.",
                    "type": "string"
                  },
                  "count": {
                    "description": "Number of 8-K earnings releases returned.",
                    "type": "integer"
                  },
                  "eps_surprises": {
                    "description": "Quarterly EPS estimate vs. actual beat/miss history.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "releases": {
                    "description": "Ordered list of SEC 8-K Item 2.02 earnings press releases.",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "ticker": {
                    "description": "Normalized uppercase US stock ticker.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
