            "readOnly": true
          },
          "digest": "sha256:444da11661bbde92dafde5e437b8fd37025b9fea99c0277752f5a9835bf092d6"
        },
        {
          "name": "get_stock_summary",
          "title": "Get Institutional Stock Summary & Valuation Multiples (Delayed/EOD)",
          "description": "Retrieve SEC entity metadata alongside Delayed/EOD reference price, enterprise value, forward P/E, EV/EBITDA, analyst price targets, margins, cash, total debt, and TTM free cash flow. Cost: 5 Credits / call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "US stock ticker symbol (e.g. \"MSFT\", \"NVDA\", \"AAPL\").",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "Response status code (0 for success).",
                "type": "integer"
              },
              "data": {
                "description": "Fundamental valuation multiples and Delayed/EOD reference quote summary.",
                "properties": {
                  "summary": {
                    "description": "Normalized entity profile, valuation multiples, margins, and quote disclaimer.",
                    "properties": {
                      "cik": {
                        "description": "10-digit SEC CIK.",
                        "type": "string"
                      },
                      "company_name": {
                        "description": "Official SEC registered entity name.",
                        "type": "string"
                      },
                      "quote_disclaimer": {
                        "description": "Compliance disclosure noting Delayed/EOD reference quote.",
                        "type": "string"
                      },
                      "quote_type": {
                        "description": "Explicit quote classification (\"delayed_eod_reference\").",
                        "type": "string"
                      },
                      "ticker": {
                        "description": "Normalized uppercase US stock ticker.",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "Response status label (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
          "annotations": {
