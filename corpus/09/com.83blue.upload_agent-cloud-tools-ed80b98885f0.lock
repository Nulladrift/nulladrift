      "serverInfo": {
        "name": "agent-cloud-tools",
        "title": "Free no-signup cloud tools for AI agents: file transfer, static site hosting, zero-knowledge WordPress backups, memory, conversation handoff",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free, no-signup file transfer for handing files between AI agents, machines, chat sessions and people. share_text / share_file upload content and return a capability url (one GET fetches it, no password) plus a share url + password. share_conversation packages a transcript and files into one bundle with HANDOFF.md at the root, and returns a handoff url that any model from any provider can fetch to pick up the whole context in one go. receive_file fetches any of these links, reads HANDOFF.md first for zip bundles, and verifies sha256. Files auto-delete after expires_days (default 30, max 180). It also works as durable scratchpad memory: stash text with share_text (kept up to 180 days) and fetch it back by url in any later session. deploy_site publishes a static website (HTML/CSS/JS/images) an agent has built to a live public url in one call, no signup: perfect for showing a user the site you just coded. list_sites and delete_site manage them. Free zero-knowledge WordPress backups too: the 83blue-backup plugin backs up a WP site encrypted with a key only the owner holds. To restore from a recovery code (83B1:install_id:token:key), a human pastes it at https://upload.83blue.com/restore (decrypts in the browser); an agent calls GET https://upload.83blue.com/api/wp/blist?install_id=ID then GET https://upload.83blue.com/api/wp/bget?backup_id=N (both with header X-Wp-Token: TOKEN) and decrypts the .enc locally with the key. Full format and decoders: https://upload.83blue.com/docs#backups. For large local files (up to 2 TB) use the HTTP API instead: https://upload.83blue.com/docs",
      "tools": [
        {
          "name": "delete_site",
          "title": "Take down a hosted site",
          "description": "Remove a site you deployed. Needs the site url/host/slug and its manage_key (returned by deploy_site).",
          "inputSchema": {
            "properties": {
              "manage_key": {
                "description": "The manage_key returned when the site was deployed",
                "type": "string"
              },
              "site": {
                "description": "The site url, host or slug",
                "type": "string"
              }
            },
            "required": ["manage_key", "site"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de013374727250f3079d398ec0c68467679e63919aa3dbbdc5bbe7333d79382e"
        },
        {
          "name": "deploy_site",
          "title": "Publish a static website to a live public url",
          "description": "Use this to put a static website you have built (HTML, CSS, JS, images, fonts) onto the public web in one call, with no signup, no account and no config. Give it the files (there must be an index.html at the root) and it returns a live https url, e.g. https://upload.83blue.com/s/brave-otter-482/, plus a manage_key you can reuse to update or delete it. Ideal when a person asks you to build them a website, landing page, demo, prototype or report and wants to see it live. IMPORTANT: the site is served from a subfolder, so use RELATIVE asset paths only (href=\"style.css\", src=\"img/logo.png\"), never root-absolute paths like \"/style.css\" which would break. Sites are served as pure static files (server-side code is never executed) and auto-expire after 30 days unless renewed. Each file is text or base64. Total site up to 50 MB, 300 files.",
          "inputSchema": {
            "properties": {
              "expires_days": {
                "default": 30,
                "description": "Days until the site is removed (1-30, default 30)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "files": {
                "description": "The site files. Must include an index.html at the root.",
                "items": {
                  "properties": {
                    "base64": {
                      "description": "Base64 content (for binary assets like images/fonts)",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path within the site, e.g. index.html, css/style.css, img/logo.png",
                      "type": "string"
                    },
                    "text": {
                      "description": "UTF-8 text content (for html/css/js/svg etc.)",
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "maxItems": 300,
                "minItems": 1,
                "type": "array"
              },
              "manage_key": {
                "description": "Pass the manage_key from a previous deploy together with the same slug to update that site in place.",
                "type": "string"
              },
              "slug": {
                "description": "Optional name for the site path (3-40 chars, a-z 0-9 and hyphens); it becomes /s/{name}/. A friendly one is generated when omitted.",
                "type": "string"
              },
              "title": {
                "description": "Optional short label for your own reference",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e93f7686834975f934d6a3e3ce1d22e26614171e300dee9df1001cbe20c274ee"
        },
        {
          "name": "list_sites",
          "title": "Look up a hosted site",
          "description": "Return the status, address, size and expiry of a site you deployed. Pass the url, host or slug.",
          "inputSchema": {
            "properties": {
              "site": {
                "description": "The site url (https://.../s/name/), path (/s/name) or bare name",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7eb62772d0939f7d78869a36696ea8723faf651d6228490329db8e41a415cb71"
        },
        {
          "name": "recall",
          "title": "Recall something you stored earlier, or fetch any 83blue url",
          "description": "Fetch back durable memory, or any shared file/text, by its 83blue url or token (a capability url, or a share url plus password). Use this to recall what you stored with remember in an earlier session, or to download a file another agent shared. Also callable as get_memory, download_file, fetch_file, get_file.",
          "inputSchema": {
            "properties": {
              "max_inline_bytes": {
                "default": 100000,
                "description": "Inline text content up to this many bytes",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "password": {
                "description": "Needed for share urls; not needed for capability urls",
                "type": "string"
              },
              "url_or_token": {
                "description": "The 83blue url or token to recall or fetch",
                "type": "string"
              }
            },
            "required": ["url_or_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b292fb7e5bb73b248aa8f50f41d99f23986ec0f61cff51c47780ce2f11ca3cbc"
        },
        {
          "name": "receive_file",
          "title": "Receive a file another agent shared",
          "description": "Use this when you have been given an 83blue link and need the file. Accepts a capability url (https://upload.83blue.com/f/...) on its own, or a share url plus password. Returns metadata including sha256, the file list for zip bundles, and the content inline when it is text within max_inline_bytes; otherwise returns a ready-made curl command to save the file locally.",
          "inputSchema": {
            "properties": {
              "max_inline_bytes": {
                "default": 100000,
                "description": "Inline text content up to this many bytes (max 1000000)",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "password": {
                "description": "Needed for share urls and bare tokens; not needed for capability urls",
                "type": "string"
              },
              "url_or_token": {
                "description": "Capability url (https://upload.83blue.com/f/TOKEN/KEY), share url (https://upload.83blue.com/d/TOKEN), or the bare token",
                "type": "string"
              }
            },
            "required": ["url_or_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f29946e4c795868820036e6c39202e856669bcb3308f86bac8d3524dbd7bb210"
        },
        {
          "name": "remember",
          "title": "Remember text, notes or JSON for a future session (durable agent memory)",
          "description": "Durable cross-session memory for AI agents: store notes, context, text or JSON now and recall it in a later session or from another machine by url. A free cloud scratchpad and shared key-value store for agents, no signup, no account, no API key. Also callable as save_memory, store_memory, save_note, stash. Returns a url; fetch it back later with recall.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The text or JSON to remember",
                "type": "string"
              },
              "expires_days": {
                "default": 30,
                "description": "Days until the file is deleted (1-180, default 30)",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "filename": {
                "default": "memory.md",
                "description": "Optional label/key for this memory, e.g. project-notes.md",
                "type": "string"
              },
              "password": {
                "description": "Optional custom password (8-64 chars); a strong one is generated when omitted",
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ae8586be76f6fbf8028165fc42e6b2c09da8206df478ef485418cda2266e4942"
        },
        {
          "name": "share_conversation",
          "title": "Hand a whole conversation to another model",
          "description": "Use this to hand your full working context to another AI: any provider, any model, any chat client. Packages a markdown transcript (instructions, conversation summary, task state) as HANDOFF.md at the root of a zip bundle together with any files, and returns a single handoff url. The receiving model just fetches that url: it gets a briefing, the file manifest and download commands in one go. Say to the next agent: \"Fetch this url to pick up where I left off.\"",
          "inputSchema": {
            "properties": {
              "expires_days": {
                "default": 30,
                "description": "Days until the file is deleted (1-180, default 30)",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "files": {
                "description": "Optional files the next agent needs alongside the transcript",
                "items": {
                  "properties": {
                    "content_base64": {
                      "type": "string"
                    },
                    "content_text": {
                      "type": "string"
                    },
                    "filename": {
                      "type": "string"
                    }
                  },
                  "required": ["filename"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "password": {
                "description": "Optional custom password (8-64 chars); a strong one is generated when omitted",
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              },
              "title": {
                "description": "Short name for the bundle, e.g. \"auth refactor handoff\"",
                "type": "string"
              },
              "transcript": {
                "description": "Markdown briefing for the next agent: context, instructions, conversation summary, task state. Becomes HANDOFF.md at the bundle root.",
                "type": "string"
              }
            },
            "required": ["transcript"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46b3f9ea2ca4d5af6f99ebb0daab62e297f547ec970da566a543cb250bfc40cb"
        },
        {
          "name": "share_file",
          "title": "Share one or more files with another agent",
          "description": "Use this when another AI agent (a different machine, model or chat session) or a person needs access to one or more files. Accepts text or base64-encoded binary content; multiple files are zipped into one bundle server-side, so a whole handoff (instructions plus code plus data) travels as one capability url. For large files already on local disk, prefer the HTTP API (one curl command, up to 2 TB): https://upload.83blue.com/docs",
          "inputSchema": {
            "properties": {
              "bundle_name": {
                "default": "handoff-bundle.zip",
                "description": "Zip name used when more than one file is sent",
                "type": "string"
              },
              "expires_days": {
                "default": 30,
                "description": "Days until the file is deleted (1-180, default 30)",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "files": {
                "items": {
                  "properties": {
                    "content_base64": {
                      "description": "Base64 content for binary files",
                      "type": "string"
                    },
                    "content_text": {
                      "description": "UTF-8 text content",
                      "type": "string"
                    },
                    "filename": {
                      "type": "string"
                    }
                  },
                  "required": ["filename"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "password": {
                "description": "Optional custom password (8-64 chars); a strong one is generated when omitted",
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1473099bdc0acce1be9f8668e025e9daa2ca4ec394dae77825178d76a7cbd8d2"
        },
        {
          "name": "share_text",
          "title": "Share text with another agent or person",
          "description": "Use this when another AI agent, chat session or person needs text you have: instructions, code, JSON, a prompt for another model. Uploads it as a downloadable file and returns a capability url (one GET fetches it) plus a share url and password. No account or API key needed.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The text to share",
                "type": "string"
              },
              "expires_days": {
                "default": 30,
                "description": "Days until the file is deleted (1-180, default 30)",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "filename": {
                "default": "handoff.md",
                "description": "File name for the download, e.g. instructions.md",
                "type": "string"
              },
              "password": {
                "description": "Optional custom password (8-64 chars); a strong one is generated when omitted",
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57941559f270be4a0545e266d9bfc78bf9438af1e1890a516217373e42207f45"
        }
      ],
      "digest": "sha256:447dff7ce189d60a792008b1fcfe30ae14d15e016966d0b3de1591fee87a52c0"
    }
  }
