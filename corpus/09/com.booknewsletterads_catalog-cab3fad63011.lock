{
  "lockfileVersion": 2,
  "subjects": {
    "com.booknewsletterads/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://booknewsletterads.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Book Newsletter Ads",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Book Newsletter Ads is a catalog of public newsletter sponsorship options and list prices. Use search_newsletters to find newsletters, get_newsletter for one title and its offers, and list_categories for the filter values that exist. send_inquiry records an advertiser inquiry. We pass that inquiry to the publisher, who replies to the advertiser directly with availability and booking. There is no buyer fee. Do not invent publisher email addresses, phone numbers, or contact names: they are not available here. An inquiry is not a confirmed placement.",
      "tools": [
        {
          "name": "get_newsletter",
          "title": "Get a newsletter",
          "description": "Full public details and ad offers for one newsletter.\n\n    Includes each offer's name, ad type, list price in USD, issue count, unit, and any public\n    specs, plus the newsletter page on booknewsletterads.com. Use an offer id with send_inquiry.\n    Publisher contact details are not part of this catalog. To ask about a placement, send an\n    inquiry through this server. We pass it to the publisher, who replies to the advertiser directly.\n    ",
          "inputSchema": {
            "properties": {
              "newsletter": {
                "description": "Newsletter id from search_newsletters, or the exact public name.",
                "title": "Newsletter",
                "type": "string"
              }
            },
            "required": ["newsletter"],
            "title": "get_newsletterArguments",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get a newsletter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:31d51e5585f63a2dcec7170e78ff6f44a3fb4882c70c733ca493019730aabe90"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List the categories, languages, ad types, and countries actually in the public catalog.\n\n    Counts are newsletters, not offers. Use the names and codes as search_newsletters filters.\n    Ad types: Primary is the header or lead slot, Mid is inside the issue, Dedicated is a full send,\n    Classified is a short text listing.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "list_categoriesArguments",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:592d83a20bb4203bbfa03a2ad42f464484301ea176e6692751711d91375ddf92"
        },
        {
          "name": "search_newsletters",
          "title": "Search newsletters",
          "description": "Search the public newsletter sponsorship catalog.\n\n    Returns id, name, a short description, audience, subscribers, language, countries,\n    categories, ad types, the USD price range, and the page URL on booknewsletterads.com.\n    Hidden and opted-out newsletters are not included. Publisher emails, phone numbers,\n    and contact names are not included. Prices are the publisher's public list prices in USD.\n    An inquiry is how an advertiser asks about a placement: call send_inquiry. We pass it\n    to the publisher, who replies to the advertiser directly.\n    ",
          "inputSchema": {
            "properties": {
              "ad_type": {
                "default": "",
                "description": "Primary (also called header), Mid, Dedicated (also called full-send), Classified, or Unknown.",
                "title": "Ad Type",
                "type": "string"
              },
              "audience_country": {
                "default": "",
                "description": "2-letter audience country code or GLOBAL, from list_categories.",
                "title": "Audience Country",
                "type": "string"
              },
              "category": {
                "default": "",
                "description": "Exact category from list_categories, for example Finance & CFO or Developer & Engineering.",
                "title": "Category",
                "type": "string"
              },
              "keyword": {
                "default": "",
                "description": "Words matched against the public name, description, audience, categories, and tags. Every word must match. Leave empty to browse.",
                "title": "Keyword",
                "type": "string"
              },
              "language": {
                "default": "",
                "description": "Language from list_categories, for example English or German.",
                "title": "Language",
                "type": "string"
              },
              "niche": {
                "default": "",
                "description": "Substring matched against categories, tags, and who the newsletter is relevant for.",
                "title": "Niche",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, starting at 1.",
                "minimum": 1,
                "title": "Page",
                "type": "integer"
              },
              "page_size": {
                "default": 15,
                "description": "Results per page, 1 to 40.",
                "maximum": 40,
                "minimum": 1,
                "title": "Page Size",
                "type": "integer"
              },
              "price_max": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum list price in USD for the matching offer.",
                "title": "Price Max"
              },
              "price_min": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum list price in USD for the matching offer.",
                "title": "Price Min"
              },
              "publisher_country": {
                "default": "",
                "description": "2-letter publisher country code or GLOBAL, from list_categories.",
                "title": "Publisher Country",
                "type": "string"
              },
              "sort": {
                "default": "auto",
                "description": "auto (relevance when a keyword is set, otherwise name), name, price_asc, price_desc, subscribers, or relevance.",
                "title": "Sort",
                "type": "string"
              },
              "subscribers_max": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Maximum subscriber count. Newsletters with no public count are excluded when this is set.",
                "title": "Subscribers Max"
              },
              "subscribers_min": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum subscriber count. Newsletters with no public count are excluded when this is set.",
                "title": "Subscribers Min"
              }
            },
            "title": "search_newslettersArguments",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search newsletters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:204d6d896f30267c730221cf54154f25f115335017ab9291df9d38dc91e948e1"
        },
        {
          "name": "send_inquiry",
          "title": "Send an inquiry",
          "description": "Send an advertiser inquiry for one public newsletter offer.\n\n    This creates the same lead the website inquiry form creates. An admin then passes it to the\n    publisher, who replies to the advertiser directly with availability and booking. We do not\n    take payment and we do not confirm the placement. No account is required. Identical inquiries\n    from the same email within 24 hours return the existing reference instead of a second lead.\n    The lead is marked source mcp so admin can filter it.\n    ",
          "inputSchema": {
            "properties": {
              "accept_terms": {
                "description": "Must be true only after the advertiser agrees that Book Newsletter Ads passes their name, email, and message to the publisher so the publisher can reply directly.",
                "title": "Accept Terms",
                "type": "boolean"
              },
              "advertiser_email": {
                "description": "Work email the publisher can reply to. Required. Disposable inboxes are rejected.",
                "title": "Advertiser Email",
                "type": "string"
              },
              "advertiser_name": {
                "description": "Person sending the inquiry. Required.",
                "title": "Advertiser Name",
                "type": "string"
              },
              "budget": {
                "default": "",
                "description": "Budget note, for example 1500 USD. Optional. Not a payment.",
                "title": "Budget",
                "type": "string"
              },
              "company": {
                "default": "",
                "description": "Advertiser company. Optional.",
                "title": "Company",
                "type": "string"
              },
              "dates": {
                "default": "",
                "description": "Preferred send window, for example the week of 1 March. Optional.",
                "title": "Dates",
                "type": "string"
              },
              "message": {
                "description": "What is being advertised, and any brief for the publisher. At least 20 characters. Required.",
                "title": "Message",
                "type": "string"
              },
              "newsletter": {
                "description": "Newsletter id or exact name from search_newsletters. Required.",
                "title": "Newsletter",
                "type": "string"
              },
              "offer": {
                "default": "",
                "description": "Offer id, or an ad type (Primary, Mid, Dedicated, Classified, header, full-send). Omit to use the newsletter's default offer.",
                "title": "Offer",
                "type": "string"
              },
              "website": {
                "default": "",
                "description": "Advertiser site or landing page, https address. Optional.",
                "title": "Website",
                "type": "string"
              }
            },
            "required": ["accept_terms", "advertiser_email", "advertiser_name", "message", "newsletter"],
            "title": "send_inquiryArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Send an inquiry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cbe5ce0cc8f24c30104e14d1cac8490092902600ffcf208dd873294d5d6c5136"
        }
      ],
      "digest": "sha256:0791dd72a8aab226572e46020c81d0ac2b7f63f75f74cb3850173dba2e1f4b82"
    }
  }
}
