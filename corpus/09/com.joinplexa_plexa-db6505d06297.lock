      "tools": [
        {
          "name": "contact_business",
          "description": "Get all contact information and actionable capabilities for a business. Best way to help a user reach out to a business.\n\nUSE WHEN:\n- User wants to contact, call, message, or book with a business\n- User says \"how do I reach them?\", \"can I WhatsApp them?\"\n- You need the direct action URLs (WhatsApp links, phone, email)\n- User is ready to take action (book, reserve, inquire)\n\nDO NOT USE WHEN:\n- User is still browsing/comparing (use search_businesses)\n- User needs full business details (use get_business)\n\nRETURNS: Phone number, WhatsApp URL (pre-filled message), email, website, and all capabilities with executable action_urls. Each capability has action_type (whatsapp/phone/url/email) and a ready-to-use action_url.\n\nBEST PRACTICES:\n- capabilities.action_url contains ready-to-use links — present these directly to the user\n- WhatsApp links (wa.me/...) include a pre-filled message mentioning Plexa for tracking\n- Prefer WhatsApp over phone for Mexican businesses — most prefer messaging over calls\n- If the business has a booking_url, present it as the primary action for reservations\n\nEXAMPLES:\n- contact_business(slug=\"harmony-dental-studio-tijuana\") -> returns whatsapp_url, phone, capabilities with action_urls",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Business slug (required) from search_businesses results",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3cfa4fda8c2c1450cb2903a56b5a32129bf5f8fb78a7e0012bbf405410c8a5c"
        },
        {
          "name": "get_business",
          "description": "Retrieve the complete profile of a specific business by its slug.\n\nUSE WHEN:\n- You already know the business slug from a previous search result\n- User asks for details about a specific business: hours, services, prices, contact info\n- You need the full profile including services, specialties, description, and all capabilities with action URLs\n\nDO NOT USE WHEN:\n- You don't know the slug (use search_businesses first to find it)\n- You only need contact info (use contact_business — lighter response)\n- You need to compare multiple businesses (use search_businesses)\n\nRETURNS: Complete business profile with all fields: name, description, hours, services with prices, specialties, capabilities with action_urls, trust_score, profile_completeness, languages, payment_methods, insurance_accepted, social_media, areas_served, agent_instructions, and faqs (owner-approved question/answer pairs — authoritative answers to common questions about this business), and offerings (tours). An offering that has a book_url has a 'Reservar' (book) link: the booking is completed on Viator through a Plexa affiliate link, Plexa may earn a commission, and the price for the traveler is the same.\n\nBEST PRACTICES:\n- The slug comes from search_businesses results (field: slug)\n- agent_instructions contains business-owner notes for agents — follow these when presenting the business\n- capabilities have action_type (whatsapp/phone/url/email) and action_url ready to use — pass directly to user\n- profile_completeness > 70% means reliable, complete data\n\nEXAMPLES:\n- get_business(slug=\"harmony-dental-studio-tijuana\")\n- get_business(slug=\"cabo-nature-cabo-san-lucas\")",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Business slug (required, e.g. 'alegra-dental-care-tijuana'). Get it from search_businesses results.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36a7da2c8113bf2b472d91846aba445fc4dabbb8285c3285d6cf0b853dedf1d5"
        },
        {
          "name": "get_business_faqs",
          "description": "Get the owner-approved FAQs (frequently asked questions with answers) for a business.\n\nUSE WHEN:\n- User asks a specific question about a business that an FAQ might answer (\"do they take walk-ins?\", \"is parking available?\", \"do they speak English?\")\n- You want authoritative, business-approved answers rather than inferring from other fields\n- User asks \"what do people usually ask about this place?\"\n\nDO NOT USE WHEN:\n- You already have faqs from get_business (it includes them)\n- The business has no FAQs (the answer will be an empty list — fall back to get_business fields)\n\nRETURNS: List of FAQs, each with question and answer (in the business's language). These are written/approved by the business owner and grounded in real ficha data — safe to quote directly.\n\nBEST PRACTICES:\n- If you already called get_business, faqs are included — don't call this separately\n- Quote the answer directly; it's the owner's authoritative wording\n- If the list is empty, the business hasn't published FAQs yet — use other profile fields\n\nEXAMPLES:\n- get_business_faqs(slug=\"clinica-dental-costa-azul-cabo-san-lucas\")",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Business slug (required) from search_businesses results",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac48ec98f9395d1765c96b2e225d925139e7888ef1e64178ca5b5cb4c0dda4de"
        },
        {
          "name": "get_business_hours",
          "description": "Get opening hours for a specific business by day of the week.\n\nUSE WHEN:\n- User asks \"are they open right now?\", \"what time do they close?\"\n- User needs to know hours for a specific day: \"open on Sunday?\"\n- Planning a visit and needs schedule info\n\nDO NOT USE WHEN:\n- You already have hours from get_business (it includes them)\n- You need more than just hours (use get_business for full profile)\n\nRETURNS: Opening hours organized by day, with open/close times. Includes today's hours highlighted.\n\nBEST PRACTICES:\n- If you already called get_business, hours are included — don't call this separately\n- Hours are in 24h format (09:00-18:00)\n- Some businesses have different weekend hours\n\nEXAMPLES:\n- get_business_hours(slug=\"california-s-dental-clinic-tijuana\")\n- get_business_hours(slug=\"cabo-nature-cabo-san-lucas\", day=\"sunday\")",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Business slug (required) from search_businesses results",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f59f618fec580a6faff662f6be8701379caefe8d0dbec407278f9530100b1591"
        },
        {
          "name": "get_business_services",
          "description": "Get the list of services offered by a business, with prices and duration when available.\n\nUSE WHEN:\n- User asks \"how much does X cost?\", \"what services do they offer?\"\n- Comparing prices between businesses\n- User needs to know duration of a service\n\nDO NOT USE WHEN:\n- You already have services from get_business (it includes them)\n- You need more than just services (use get_business for full profile)\n\nRETURNS: List of services with name, price (in local currency), and duration_minutes when available.\n\nBEST PRACTICES:\n- If you already called get_business, services are included — don't call this separately\n- Prices are in the local currency (usually MXN or USD)\n- Not all businesses have prices listed — recommend contacting for a quote if prices are missing\n\nEXAMPLES:\n- get_business_services(slug=\"harmony-dental-studio-tijuana\")",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Business slug (required) from search_businesses results",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7f5038600c8938892eb173e5362ae35635d1b9e3aa31565c7c8838ce0985b58"
        },
        {
          "name": "list_verticals",
          "description": "List all available business verticals (categories) with the count of businesses in each.\n\nUSE WHEN:\n- User asks \"what types of businesses do you have?\"\n- User is exploring: \"what can I find on Plexa?\"\n- You need to know which verticals are available before searching\n- User uses a category you're not sure maps to a vertical\n\nDO NOT USE WHEN:\n- You already know the vertical (go straight to search_businesses)\n- User named a specific service (search_businesses with that vertical)\n\nRETURNS: List of verticals with key (for search) and count of active businesses in each.\n\nCURRENT VERTICALS: dental, medical, veterinary, restaurant, realestate, professional, transport, insurance, tourism, wellness, events, automotive, hospitality, other\n\nBEST PRACTICES:\n- Use the vertical key (not display name) in search_businesses\n- \"dentist\" -> dental, \"hotel\" -> hospitality, \"spa\" -> wellness\n- Call this once at the start if you'll do multiple searches\n\nEXAMPLES:\n- list_verticals() -> [{key: \"dental\", count: 430}, {key: \"restaurant\", count: 801}, ...]",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7df1d3b82373cf7d1b8c918751d72fa2c40f6a7ddd673d7320f1033ec7e06123"
        },
        {
          "name": "search_businesses",
          "description": "Find real local businesses in Mexico by location, vertical, and capabilities.\n\nUSE WHEN:\n- User asks for a service: \"find me a dentist\", \"best restaurant\", \"tour in Cabo\"\n- Location-based queries: \"near me\", \"in Tijuana\", \"Cancun area\"\n- Comparing multiple options: \"top 3 dentists\", \"best rated hotels\"\n- Travel planning: \"things to do in Merida\", \"where to eat in CDMX\"\n- Medical tourism: \"affordable dental work near the border\"\n\nDO NOT USE WHEN:\n- User asks about a specific named business (use get_business instead)\n- User needs contact info for a known business (use contact_business)\n- User asks what types of businesses are available (use list_verticals)\n\nRETURNS: List of businesses ordered by tier (Connected/claimed first), then trust_score, then recency. Each result includes name, city, rating, vertical, trust_score, profile_completeness, and actionable capabilities with WhatsApp deep links. If no results, returns a message with alternative cities for that vertical.\n\nBEST PRACTICES:\n- Always include vertical for better results\n- Use city name in Spanish: \"Ciudad de Mexico\" not \"Mexico City\"\n- Combine vertical + city for best precision\n- The registry covers Mexico (businesses outside Mexico were archived in Nov 2026).\n  `country` (ISO 3166-1 alpha-2, e.g. 'MX') is optional.\n- Results include capabilities with action_urls — pass these directly to the user for booking/contact\n\nEXAMPLES:\n- \"dentist in Tijuana\" -> vertical=dental, city=Tijuana\n- \"restaurants in Cancun\" -> vertical=restaurant, city=Cancún\n- \"spa near Cabo\" -> vertical=wellness, city=Cabo San Lucas\n- \"hotel in Guadalajara\" -> vertical=hospitality, city=Guadalajara",
          "inputSchema": {
            "properties": {
              "capabilities": {
                "description": "Required capabilities (e.g. ['book_appointment', 'check_availability'])",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "city": {
                "description": "City name in Spanish (e.g. 'Tijuana', 'Ciudad de Mexico')",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 country code to restrict the search (e.g. 'MX', 'CO', 'AR'). Omit to search the entire registry across every country it covers.",
                "type": "string"
              },
              "lang": {
                "description": "Filter by language the business operates in (e.g. 'en', 'es')",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude for geo search (requires longitude and radius_km)",
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50)",
                "type": "integer"
              },
              "longitude": {
                "description": "Longitude for geo search",
                "type": "number"
              },
              "min_trust_score": {
                "default": 0,
                "description": "Minimum trust score (0-100)",
                "type": "integer"
              },
              "query": {
                "description": "Free text search query (e.g. 'dentist', 'italian restaurant')",
                "type": "string"
              },
              "radius_km": {
                "default": 15,
                "description": "Search radius in km (default 15)",
                "type": "number"
              },
              "state": {
                "description": "State name (e.g. 'Baja California')",
                "type": "string"
              },
              "vertical": {
                "description": "Business vertical slug. One of: dental, medical, veterinary, restaurant, realestate, professional, transport, insurance, tourism, wellness, events, automotive, hospitality, other. Invalid values return a self-healing error listing valid options.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2774dd3e1e73cedd759c2eba6d07c8643a990b41d835a5e237c63477274787e9"
        }
      ],
      "digest": "sha256:e792c036667bc57b1556f732b9bcebc2f1818fe3bb7b1c1c84c429aa9d53dc2b"
    }
