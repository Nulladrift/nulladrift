{
  "lockfileVersion": 2,
  "subjects": {
    "com.baebatteriesusa/product-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.baebatteriesusa.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "baebatteriesusa.com",
        "title": "BAE Batteries USA product catalogue",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public website of BAE Batteries USA (https://www.baebatteriesusa.com/): stationary batteries, chargers, DC power and their datasheets, discharge tables, manuals and SDS. The catalogue is rebuilt from the website every night. Link the source of every fact you give. Discharge-table figures are given only for tables checked against their datasheet; give the table, page and end voltage with each figure. For any other table, point to the PDF and page. Sizing is a starting point; the company's engineers confirm every size. For prices or a quote, quote_request says what to send and where. This connector only reads the website: it cannot send a message, place a request or run a calculation for anyone.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page or document",
          "description": "Read the full text of one result from search (a web page, a PDF, or a product series) with its link. A discharge table returns its figures once it has been checked against its datasheet, otherwise the link and page.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An id returned by search, find_series or get_documents.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page or document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c79270ec5357a20b8b412ceb0c4da48a6c865f84f183627c3716c5a4cbe9cae"
        },
        {
          "name": "find_series",
          "title": "Find a battery series",
          "description": "Find a stationary battery or product series that BAE Batteries USA offers by chemistry (VRLA gel, AGM, flooded, pure lead, lithium), nominal voltage (2 V, 6 V, 12 V, 48 V ...) or application (telecom, utility, solar, UPS, switchgear). Returns each series with its product page and documents.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "e.g. telecom, utility, solar, UPS, switchgear",
                "type": "string"
              },
              "chemistry": {
                "description": "e.g. gel, AGM, flooded, pure lead, lithium",
                "type": "string"
              },
              "include_discontinued": {
                "description": "Include series the site marks as discontinued (default false).",
                "type": "boolean"
              },
              "text": {
                "description": "Words from the series name or model, e.g. \"OPzV\" or \"NSB 190FT\"",
                "type": "string"
              },
              "voltage": {
                "description": "Nominal voltage, e.g. \"12 V\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a battery series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59aecfd544229d31f74f5aa1385ed5839929c67981d40f279a504ef696bdd732"
        },
        {
          "name": "get_documents",
          "title": "List datasheets, manuals and SDS",
          "description": "List the documents BAE Batteries USA publishes for a series, or of one type across the site: datasheet, discharge_table, manual, sds, certificate, standard, brochure, technical_paper, warranty. Third-party documents are linked at their source.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "A series id from find_series, or its name",
                "type": "string"
              },
              "type": {
                "enum": ["datasheet", "discharge_table", "manual", "sds", "certificate", "standard", "brochure", "technical_paper", "warranty", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List datasheets, manuals and SDS"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f0d6076d665b8af5b16422cef52f59e59d63e31a2448cb14bea497f2496ceab"
        },
        {
          "name": "quote_request",
          "title": "How to request a quote",
          "description": "How to ask BAE Batteries USA for a quote or price: the address to write to, and what to include so the engineers can answer without a round of questions. It sends nothing; the customer sends the request themselves.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "Optional: what it is for",
                "type": "string"
              },
              "series": {
                "description": "Optional: the series or product the quote is for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76f1837c863d44de7f92c758ed401b7a312e30ded0a9969e93307e14c8c444f6"
        },
        {
          "name": "search",
          "title": "Search BAE Batteries USA",
          "description": "Search the BAE Batteries USA website for stationary batteries, chargers and DC power: product pages, datasheets, discharge tables, manuals, SDS and technical articles. Ask in plain words, e.g. \"12 V gel battery for solar\" or \"OPzS 2V cell SDS\". Returns ids, titles and source links; read one with fetch.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to look for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search BAE Batteries USA"
          },
          "behavior": {
