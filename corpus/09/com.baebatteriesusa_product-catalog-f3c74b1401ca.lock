            "readOnly": true
          },
          "digest": "sha256:ddce195eee0e49071b5df63570ce08f75e8cfe411e77eecc091957ff610983c3"
        },
        {
          "name": "sizing_tool",
          "title": "Battery sizing tool",
          "description": "The link to the online tool BAE Batteries USA offers for sizing a battery system, and where the website links it. The customer runs it themselves; this connector cannot. A starting point only: engineers confirm every size before it is quoted.",
