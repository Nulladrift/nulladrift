{
  "lockfileVersion": 2,
  "subjects": {
    "com.baebatteriesusa/product-catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.baebatteriesusa.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "baebatteriesusa.com",
        "title": "BAE Batteries USA product catalogue",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the public website of BAE Batteries USA (https://www.baebatteriesusa.com/): stationary batteries, chargers and DC power, with their datasheets, discharge tables, installation and operating manuals, SDS, ISO certificates and technical papers. The catalogue is rebuilt from the website every night. Link the source of every fact you give. Discharge-table figures are given only for tables checked against their datasheet; give the table, page and end voltage with each figure. For any other table, point to the PDF and page. Sizing is a starting point; the company's engineers confirm every size. For prices or a quote, quote_request says what to send and where. This connector only reads the website: it cannot send a message, place a request or run a calculation for anyone.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page or document",
          "description": "Read the full text of one result from search, find_series or get_documents (a web page, a PDF, or a product series) with its link. A discharge table returns its figures once it has been checked against its datasheet, otherwise the link and page.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "An id returned by search, find_series or get_documents.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page or document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40ab3785f5281de679dca1812d8e76d6a4d47a430019a1f6a505a466b53bee5d"
        },
        {
          "name": "find_series",
          "title": "Find a battery series",
          "description": "Find a battery or product series that BAE Batteries USA offers by chemistry (VRLA gel, flooded, tubular plate), nominal voltage (2 V, 6 V, 12 V; 48 V only for the Oxbox system) or application (telecom, utility, solar, UPS, switchgear). Returns each series with its product page and documents.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "e.g. telecom, utility, solar, UPS, switchgear",
                "type": "string"
              },
              "chemistry": {
                "description": "e.g. VRLA gel, flooded, tubular plate",
                "type": "string"
              },
              "include_discontinued": {
                "description": "Include series the site marks as discontinued (default false).",
                "type": "boolean"
              },
              "text": {
                "description": "Words from the series name or model, e.g. \"OPzV\" or \"PVV\"",
                "type": "string"
              },
              "voltage": {
                "description": "Nominal voltage, e.g. \"2 V\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a battery series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef1dd0f4f9f13a14dc723d42a01895d06445ec9f1f8df553ed547b626ebdae13"
        },
        {
          "name": "get_documents",
          "title": "List datasheets, manuals, SDS and discharge tables",
          "description": "List the documents BAE Batteries USA publishes for a series, or of one type across the site: datasheets, discharge tables, installation and operating manuals, safety data sheets, ISO certificates, technical papers and flyers. Third-party documents (HindlePower charger manuals) are linked at their source.",
          "inputSchema": {
            "properties": {
              "series": {
                "description": "A series id from find_series, or its name",
                "type": "string"
              },
              "type": {
                "enum": ["datasheet", "discharge_table", "manual", "sds", "certificate", "brochure", "technical_paper", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List datasheets, manuals, SDS and discharge tables"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6e67417feece1a25e3d32ecf62bbe8afb593a44b7e74c223cccdc420acffb3f"
        },
        {
          "name": "quote_request",
          "title": "How to request a quote",
          "description": "How to ask BAE Batteries USA for a quote or price: the address to write to, and what to include so the engineers can answer without a round of questions. It sends nothing; the customer sends the request themselves.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "Optional: what it is for",
                "type": "string"
              },
              "series": {
                "description": "Optional: the series or product the quote is for",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How to request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76f1837c863d44de7f92c758ed401b7a312e30ded0a9969e93307e14c8c444f6"
        },
        {
          "name": "search",
          "title": "Search BAE Batteries USA",
          "description": "Search the BAE Batteries USA website for stationary batteries, chargers and DC power: its pages and their datasheets, discharge tables, installation and operating manuals, SDS, ISO certificates and technical papers. Ask in plain words, e.g. \"12 V gel battery for solar\" or \"OPzS 2V cell SDS\". Returns ids, titles and source links; read one with fetch.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to look for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
