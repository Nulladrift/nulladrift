      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fixed procurement workflows run a published sequence of stages; outputs become unverified context for later agents. Read structuredContent and isError, then inspect run.status or execution.status: a successful tool response can describe a running or failed saved run. Use procurement_run__get to poll source-free saved status, waiting its pollAfterSeconds when running, and procurement_artifact__get only when generated deliverable content is needed. Workflow summaries contain stage run IDs; retrieve each successful stage artifact separately. For a chain that may outlast your tool-call timeout, set runInBackground and poll procurement_workflow_execution__get; approvalGates pause before named paid stages until procurement_workflow_execution__approve, which needs the buyer to agree first. Direct prepaid stages need their own supplied invoices. Enabled native marketplace billing instead requires verified platform authorization and a caller spending ceiling. Paid agent/workflow calls require explicit external-processing consent and one stable idempotency key. Reconcile uncertain execution using that same key; never automatically start another paid request. Local document evidence requires agent:read; saved procurement record readers require p2p:read. Evidence files are processed temporarily on AIProcurement.club without inference or Gateway memory. No tool transfers money or purchases invoices.",
