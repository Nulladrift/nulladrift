      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fixed procurement workflows run a published sequence of stages; outputs become unverified context for later agents. Use procurement_run__get to poll source-free saved status, waiting its pollAfterSeconds when running, and procurement_artifact__get only when generated deliverable content is needed. Direct prepaid stages need their own supplied invoices. Enabled native marketplace billing instead requires verified platform authorization and a caller spending ceiling. Paid agent/workflow calls require explicit external-processing consent and one stable idempotency key. Local document evidence requires agent:read; saved procurement record readers require p2p:read. Evidence files are processed temporarily on AIProcurement.club without inference or Gateway memory. No tool transfers money or purchases invoices.",
      "tools": [
        {
          "name": "contracts",
          "title": "Contract review agent",
          "description": "Extract obligations, renewal deadlines, service levels, and commercial clause concerns for human legal review.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consentExternalProcessing": {
                "const": true,
                "description": "Explicit authorization to send these sources and prior-agent context to the selected inference provider.",
                "type": "boolean"
              },
              "idempotencyKey": {
                "description": "Stable caller key for exactly one logical service request.",
                "pattern": "^[A-Za-z0-9_.:-]{8,128}$",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": false,
                "description": "Original buyer inputs. Service-specific CSV/date/rubric validation and a combined 75,000-character limit also apply.",
                "maxProperties": 20,
                "properties": {
                  "constraints": {
                    "description": "Constraints and success criteria",
                    "maxLength": 45000,
                    "type": "string"
                  },
                  "context": {
                    "description": "Business context and decision needed — Describe the category, organization, geography, constraints, and outcome needed.",
                    "maxLength": 45000,
                    "type": "string"
                  },
                  "documents": {
                    "description": "Source documents and evidence — Paste contracts, spend extracts, supplier proposals, policies, or dated market evidence. Plain text only.",
                    "maxLength": 45000,
                    "type": "string"
                  }
                },
                "required": ["context"],
                "type": "object"
              },
              "maxChargeUsd": {
                "description": "Required only for enabled native marketplace token billing: authorize this maximum USD charge with at most six decimal places. Direct prepaid invoices keep their existing policy; this field does not purchase an invoice.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "paymentInvoiceId": {
                "description": "A separate confirmed service invoice when payment is required.",
                "format": "uuid",
                "type": "string"
              },
              "sourceFields": {
                "items": {
                  "enum": ["summary", "deliverable", "findings", "nextActions", "financialModel", "requirementCoverage", "knowledgeGraph"],
