              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:495c6d168bce041b3edbebc6ec1fdabe28c07e90d1a252c3041249627c1753de"
        },
        {
          "name": "deletion_clock",
          "title": "Last day to export from each business tool",
          "description": "For a company canceling its tools or closing: the last day to export from each tool once the account ends, by plan, from what each vendor's own terms say happens after cancellation (export window in days, kept with no export, or nothing). Each row quotes the vendor's words with the date read. With no plan given, the plan with the shortest window is used and flagged. Tool ids as in get_tool_terms.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ends": {
                "description": "Day the accounts end, YYYY-MM-DD, between 2000 and 2100. Default today (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "plans": {
                "additionalProperties": {
                  "maxLength": 60,
                  "type": "string"
                },
                "description": "Plan per tool as the vendor spells it, e.g. {\"slack\": \"Pro\"}. Keys are tool ids.",
                "type": "object"
              },
              "tools": {
                "description": "Tool ids, e.g. [\"slack\", \"google-workspace\", \"hubspot\"]. Omit for every tool.",
                "items": {
                  "enum": ["slack", "github", "intercom", "atlassian", "sentry", "vercel", "hubspot", "zendesk", "google-workspace", "notion", "microsoft-teams", "salesforce", "microsoft-365", "linear", "asana", "zoom", "gong", "freshdesk", "discord", "dropbox", "figma", "quickbooks", "xero"],
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/dataconto-deletion-clock-v4.html",
            "openai/toolInvocation/invoked": "Deadlines ready",
            "openai/toolInvocation/invoking": "Reading export windows",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/dataconto-deletion-clock-v4.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:fd130fa272016926a2fc87caa80f0a2041e63af2a6b05b8e7fdb992757daa5b7"
        },
        {
          "name": "estimate",
          "title": "Run three buyers' published payout estimators",
          "description": "What micro1's, Telegraph's and Grepped's own public estimators give for a company's records, from team size, years in business and headquarters. Grepped prices from the kinds of records held, so pass records for its figure. Each range is the buyer's formula, checked against its live page on the date given; none is an offer and Dataconto adds no figure of its own. Pass offer_usd (and offer_from) to place an offer the owner received against each range and the offering buyer's published range. Also returns the other listed buyers these answers don't rule out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Headquarters: us, uk, ca, au, eu4 (Ireland, Netherlands, Germany or France), eu (another EU country), in, sg, other. Default us.",
                "enum": ["us", "uk", "ca", "au", "eu4", "eu", "in", "sg", "other"],
                "type": "string"
              },
              "offer_from": {
                "description": "Who made the offer.",
                "enum": ["micro1", "mode", "scale", "turing", "telegraph", "handshake", "mercor-data", "grepped", "miro-advisory", "patronus", "sourcex", "maryah", "other"],
                "type": "string"
              },
              "offer_usd": {
                "description": "An offer the owner received, in US dollars.",
                "maximum": 10000000000,
                "minimum": 1,
                "type": "integer"
              },
              "records": {
                "description": "Kinds of records the company still has. Grepped's estimate needs at least one; without them it returns no figure.",
                "items": {
                  "enum": ["slackteams", "chat", "email", "calls", "tickets", "support", "docs", "databases", "crm", "accounting", "code"],
                  "type": "string"
                },
                "type": "array"
              },
              "staff": {
                "description": "People now, or at the peak.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Default operating. micro1's estimator covers running companies only.",
                "enum": ["operating", "closing", "closed"],
                "type": "string"
              },
              "years": {
                "description": "Years in business.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["staff", "years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/dataconto-estimate-v4.html",
            "openai/toolInvocation/invoked": "Estimates ready",
            "openai/toolInvocation/invoking": "Running published estimators",
            "openai/widgetAccessible": true,
            "ui": {
