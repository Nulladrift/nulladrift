      "serverInfo": {
        "name": "dataconto",
        "title": "Dataconto: data licensing opportunities from AI labs",
        "version": "1.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dataconto shows owners who would pay for what they have: AI companies and data buyers that license a company's business records (email, chat, support tickets, documents, CRM and databases), private source code and datasets. Many take records from companies that are winding down or have closed. Each program comes with the terms the buyer publishes for owners (who qualifies, what it takes, payout ranges and rates, when the owner is paid), quoted from the buyer's own page with the date it was read. Use list_buyers to find programs that fit an owner, get_buyer for one program and its facts, and get_market_facts for dated figures across programs. The fit check at https://dataconto.com/company (records) or https://dataconto.com/code (code) matches an owner against published terms. Dataconto doesn't hold, broker or price the data. A second dataset, get_tool_terms, answers what a business tool's own terms say about the customer's data (Slack, Microsoft 365, Google Workspace, Salesforce, Notion and others): who owns it, whether the vendor trains AI on it, what can be exported on which plan, and what happens after cancellation, each a dated quote from the vendor's page. Five tools run the site's checks for one owner: fit_check (which buyers' published criteria the owner's answers meet), estimate (three buyers' own public payout estimators side by side, and where an offer the owner received sits against them), code_value (private code priced at a buyer's published per-token rates), deletion_clock (the last day to export from each tool after the account ends) and rights_check (whether the records are ready to license, and what to settle before signing). Figures are the buyers' and vendors' own, each with the date it was checked; none is an offer. The data is free to use under CC BY 4.0, with no key and no account.",
      "tools": [
        {
          "name": "code_value",
          "title": "Price private code at a buyer's published per-token rates",
          "description": "Counts code the way pre.dev's public script does (code files in full, text files up to 10x the code, minified and bundle-named files skipped, 4 bytes per token) and prices it at Pangea's published non-exclusive list rates per million tokens of source and of git history. Give files (path and size in bytes, e.g. from `git ls-tree -r -l HEAD`), or code_bytes and text_bytes, or source_tokens. History is optional. A list price, not an offer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code_bytes": {
                "description": "Bytes of code files, if you summed them yourself.",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "integer"
              },
              "files": {
                "description": "Files at HEAD, paths relative to the repo root. Skip rules (node_modules, vendor, build output) are applied here.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "path": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "size": {
                      "maximum": 100000000000,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["path", "size"],
                  "type": "object"
                },
                "maxItems": 5000,
                "type": "array"
              },
              "history_tokens": {
                "description": "Git history tokens, if counted.",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "integer"
              },
              "source_tokens": {
                "description": "Source tokens, if already counted.",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "integer"
              },
              "text_bytes": {
                "description": "Bytes of text files (Markdown, JSON, YAML, HTML).",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
