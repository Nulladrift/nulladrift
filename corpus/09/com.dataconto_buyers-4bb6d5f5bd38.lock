        },
        {
          "name": "fit_check",
          "title": "Check which buyers fit a company's records or code",
          "description": "Runs Dataconto's fit check: each listed buyer's published criteria against the owner's answers. Returns, per buyer program, a verdict (strong = every criterion met, possible = none failed but some unknown, none = a criterion failed), each criterion as met, failed or unknown, the reasons for a miss, the buyer's published figure with the date checked and its Dataconto page. Unanswered questions count as unknown; `missing` lists the ones worth asking, and `questions` gives every question for this owner with its choices and the answer so far (the card view asks the open ones itself). Where the card shows, it is the answer: write one short sentence before it and nothing after. Don't repeat the companies, figures or questions in text, and don't promise a sale or a price: each company decides after reviewing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "Answer what you know; leave the rest out.",
                "properties": {
                  "access": {
                    "description": "Company side, closing or closed only. Can someone still sign in.",
                    "enum": ["yes", "some", "exports", "none"],
                    "type": "string"
                  },
                  "contents": {
                    "description": "Code side.",
                    "items": {
                      "enum": ["secrets", "customerdata", "thirdparty", "contractor"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "country": {
                    "description": "Company side. Headquarters: us, uk, ca, au, eu4 (Ireland, Netherlands, Germany or France), eu (another EU country), in, sg, other.",
                    "enum": ["us", "uk", "ca", "au", "eu4", "eu", "in", "sg", "other"],
                    "type": "string"
                  },
                  "english": {
                    "description": "Company side. How much of the records is in English.",
                    "enum": ["most", "some", "little"],
                    "type": "string"
                  },
                  "history": {
                    "description": "Code side. Git history.",
                    "enum": ["full", "partial", "none"],
                    "type": "string"
                  },
                  "industry": {
                    "description": "Company side. finance covers accounting, finance and medical.",
                    "enum": ["legal", "finance", "nonprofit", "other"],
                    "type": "string"
                  },
                  "origin": {
                    "description": "Code side.",
                    "enum": ["original", "fork", "mix"],
                    "type": "string"
                  },
                  "owner": {
                    "description": "Code side.",
                    "enum": ["me", "company", "client", "unsure"],
                    "type": "string"
                  },
                  "public": {
                    "description": "Code side. Was any of it ever public.",
                    "enum": ["never", "some", "unsure"],
                    "type": "string"
                  },
                  "repos": {
                    "description": "Code side. Number of repositories.",
                    "maximum": 10000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "sensitive": {
                    "description": "Company side.",
                    "items": {
                      "enum": ["pii", "health", "card", "contractor"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "signer": {
                    "description": "Company side, closing or closed only. Who can sign now.",
                    "enum": ["founder", "officeholder", "assignee", "unsure"],
                    "type": "string"
                  },
                  "staff": {
                    "description": "Company side. People now, or at the peak if closing or closed.",
                    "maximum": 100000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "status": {
                    "description": "Company side.",
                    "enum": ["operating", "closing", "closed"],
                    "type": "string"
                  },
                  "systems": {
                    "description": "Company side. slackteams = Slack or Microsoft Teams; tickets = Jira, Linear, Asana; support = Zendesk, Intercom.",
                    "items": {
                      "enum": ["slackteams", "chat", "email", "calls", "tickets", "support", "docs", "databases", "crm", "accounting", "code"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "written": {
                    "description": "Code side. Who wrote the code: people, people with AI tools helping, or mostly AI tools.",
                    "enum": ["people", "assisted", "ai"],
                    "type": "string"
                  },
                  "years": {
                    "description": "Company side. Years of records still held.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "side": {
                "description": "company = business records, code = private source code.",
                "enum": ["company", "code"],
                "type": "string"
              }
            },
            "required": ["side"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/dataconto-fit-check-v4.html",
            "openai/toolInvocation/invoked": "Fit check done",
            "openai/toolInvocation/invoking": "Checking who takes these records",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/dataconto-fit-check-v4.html",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:90ec8051ede32fa085ab23dfbf10a0d9cd8fd569ce299d9a004c6b78a1547df8"
        },
        {
          "name": "get_buyer",
          "title": "Get one buyer program",
          "description": "One program with its current facts: what it takes, who qualifies, payout, fees, exclusivity, payment timing and process, each quoted from the buyer's page with the date read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Program id from list_buyers, e.g. \"scale-data-partnerships\". A company name or its legal entity name (e.g. \"Cronus Technologies\" for AfterQuery) also works.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef6dafdbdb228cef67f42f2c20d3ae342495befbe03b7b3fb603dba1b6ff2cb9"
        },
        {
          "name": "get_market_facts",
          "title": "Dated market facts on data and code buyers",
          "description": "Dated, sourced facts across programs: payout ranges, per-token rates, payout caps, platform fees, payment timing, eligibility. History is kept when a term changes (current=false rows). Press-only figures are flagged with source_type press.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "current": {
                "description": "true = only terms in force; false = only superseded ones.",
                "type": "boolean"
              },
              "field": {
                "description": "Kind of fact.",
                "enum": ["payout_range", "payout_rate", "payout_cap", "payout_total", "platform_fee", "payment_timing", "exclusivity", "eligibility", "buys", "process", "deal", "ownership", "legal_entity"],
                "type": "string"
              },
              "limit": {
                "description": "Results to return, default 30.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "program": {
                "description": "Program id from list_buyers.",
                "type": "string"
              },
              "since": {
                "description": "Observed on or after this date, YYYY-MM-DD.",
                "type": "string"
              },
              "source_type": {
                "description": "primary = quoted from the buyer's own page.",
                "enum": ["primary", "press", "register"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8848eb40b844be5603ee97d6423643e1368b5a9ad47747ad6229557b8acaca5"
        },
        {
          "name": "get_tool_terms",
          "title": "What a business tool's terms say about customer data",
          "description": "For business tools companies keep records in (chat, email, tickets, docs, CRM, call recordings, code hosts): who owns the customer's data, whether the vendor trains AI on it (generative and other models, by plan), whether it keeps aggregated use, what can be exported on which plan and by whom, how much history the plan keeps, and how long data stays after cancellation. Each answer is quoted word for word from the vendor's own terms, AI page, data processing addendum or help article, with the date read. \"The terms don't say\" means every contract was read and none answers; \"Not read yet\" means a document is still unread. Answers marked inferred are a reading of the text, not its words. Without a tool id it returns a short index (each tool's headline answers and its Dataconto page); name a tool for the quoted facts. Not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "Keep tools whose headline answer has this token, e.g. opt_out with field=ai_training.",
                "enum": ["customer", "vendor", "shared", "not_stated", "no", "opt_in", "opt_out", "yes", "reserved", "not_reserved", "all", "partial", "none", "days", "export", "no_export"],
                "type": "string"
              },
              "facts": {
                "description": "false = headline answers only, no quoted facts. Default true when a tool is named, false otherwise.",
                "type": "boolean"
              },
              "field": {
                "description": "One question: ownership, ai_training, aggregate_use, export, retention or after_cancel.",
                "enum": ["ownership", "ai_training", "aggregate_use", "export", "retention", "after_cancel"],
                "type": "string"
              },
              "limit": {
                "description": "Tools to return, default 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "plan": {
                "description": "A plan name as the vendor spells it, e.g. \"Free\", \"Enterprise\".",
                "type": "string"
              },
              "record_type": {
                "description": "Kind of record: slack-and-teams, email, support-tickets, jira-and-linear, crm, call-recordings, documents-and-sops.",
                "type": "string"
              },
              "tool": {
                "description": "Tool id, e.g. \"slack\", \"microsoft-365\", \"google-workspace\", \"salesforce\", \"notion\". Omit for a short index of every tool's headline answers.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:757dfefeca4c1b48ab146383d421d903970a9344120402fe6e1776cc40d50845"
        },
        {
          "name": "list_buyers",
