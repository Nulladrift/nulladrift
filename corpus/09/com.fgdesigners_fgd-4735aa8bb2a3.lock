      },
      "transport": {
        "type": "http",
        "url": "https://fgdesigners.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fgd-designers",
        "title": "FGD Designers — fonts, mockups and design assets",
        "version": "1.0.0",
        "websiteUrl": "https://fgdesigners.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FGD Designers is an independent type foundry (Stockholm, since 2014) selling original fonts, design assets (mockups, icons, patterns, image packs) and a free in-browser 3D mockup editor.\nUse search_catalog to find fonts or assets for the person's project, get_item for the details, previews, licence and checkout link, get_licence for the licence terms, and mockup_link to open the live 3D mockup editor on a product and scene.\nBuying: you cannot pay or download here. Give the person the checkout_url (or page_url); they pay there with a card or PayPal and receive the files by email and download right away. Font files are never sent before purchase.\nFonts come with a thumb (the font's name set in the font itself) and preview images: show them to the person, so they can see the type before choosing.\nPrices are in USD. \"$0+\" means free for personal use, pay what you want for commercial use; \"$1+\" means pay what you want from $1.",
      "tools": [
        {
          "name": "get_item",
          "title": "Get an FGD item",
          "description": "Full details of one font, the bundle, an asset or a mockup by id (from search_catalog): description, styles, formats, languages, what is included, best uses, preview images, licence summary, price, page_url and checkout_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Item id, e.g. \"marsipan\", \"bundle\", \"mug\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:945d2d4ca5b932b5936ea53b733c50f33ddfa0b9cfc85a29fa9754e23028131d"
        },
        {
          "name": "get_licence",
          "title": "FGD licence terms",
          "description": "What the FGD licence allows for fonts and assets (personal, commercial, web, apps, logos, merchandise), what is not allowed, and the refund rule.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96a2e44ae94b923f5f5b6576359708641afcc5460b8df5c625ab5d7d3ed77060"
        },
        {
          "name": "mockup_link",
          "title": "Open the live 3D mockup editor",
          "description": "A link to the free in-browser 3D mockup editor on a product and scene, with a preview image. The person drops in their design, turns it, changes light and scene, animates it, and exports a free 1080 px image, or a 4K image or MP4 video for $3.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "enum": ["phone", "foldable-phone", "laptop", "mug", "poster", "billboard"],
                "type": "string"
              },
              "scene": {
                "description": "Optional. Not every product has every scene; the product's default scene is used when it has not.",
                "enum": ["desk", "studio", "black", "stones", "gradient", "window", "facade", "underpass", "metro"],
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93f2de2ac2d95edde99097a87674db5a62b879095ec674e392b15695d6d0e121"
        },
        {
          "name": "search_catalog",
          "title": "Search FGD fonts, assets and mockups",
          "description": "Search the FGD catalogue: fonts (display, retro, brush, handwritten, geometric, free), the 6 font bundle, design assets (mockups, icons, patterns, image packs) and live 3D mockups. Returns name, type, price, a short description, a preview image and links. Leave query empty to list everything of a type.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "free_only": {
                "default": false,
                "description": "Only items that are free for personal use.",
                "type": "boolean"
              },
              "limit": {
                "default": 8,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person needs, e.g. \"retro 80s logo font\", \"handwritten\", \"billboard mockup\", \"free icons\".",
                "type": "string"
              },
              "type": {
                "default": "any",
                "enum": ["any", "font", "bundle", "asset", "mockup"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b45d4343f093eea30af71582b98decd351dbb8805ad72ff0f66e36b98675897"
        }
      ],
      "digest": "sha256:cbc779c458553e19565d43b61e5dae64a349789ae061a0f03fda6f536846d975"
    }
  }
