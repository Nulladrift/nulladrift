            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Home country of the airline, ISO 3166-1 alpha-2 (GB, US, FR)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
