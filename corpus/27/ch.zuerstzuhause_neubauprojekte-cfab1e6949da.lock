{
  "lockfileVersion": 2,
  "subjects": {
    "ch.zuerstzuhause/neubauprojekte": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://zuerstzuhause.ch/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Zuerst zuhause",
        "version": "00ce7a166d3734d5407677695ae5da8bc1a00bd0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_project",
          "title": "Projekt abrufen",
          "description": "Ein einzelnes Bauprojekt anhand seiner id aus search_projects. Ohne Abo zeigt jedes frisch publizierte Projekt nur Beschrieb und Ort (detailsLocked=true); Adresse, Bauherrschaft und Quelle sind Abo-Inhalte.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ce3a652f705fb0b39a1cd48208b37c4022cda6af23f8fb809c19b5d0ad0c1fe"
        },
        {
          "name": "search_projects",
          "title": "Neubauprojekte suchen",
          "description": "Sucht amtlich publizierte Bauprojekte der Schweiz (Baugesuche) nach Gemeinde, Kanton, Kategorie und Zeitraum. Ohne Abo zeigt jedes frisch publizierte Projekt nur Beschrieb und Ort (detailsLocked=true); Adresse, Bauherrschaft und Quelle sind Abo-Inhalte. Private Bauherrschaften sind immer als «Privatperson» maskiert (Datenschutz). Liefert höchstens 50 Treffer pro Aufruf, neueste zuerst.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "allSegments": {
                "description": "Pro-Abo: auch Gewerbe, Infrastruktur usw. statt nur Wohnen",
                "type": "boolean"
              },
              "canton": {
                "description": "Kantonskürzel, z. B. ZH",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "category": {
                "enum": ["neubau", "umbau", "sanierung", "energetisch", "abbruch", "andere"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "marketType": {
                "description": "Angebot: Eigentum, Miete oder noch offen",
                "enum": ["kaufen", "mieten", "offen"],
                "type": "string"
              },
              "minUnits": {
                "description": "mindestens so viele Wohnungen",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "municipality": {
                "description": "Gemeinde, exakter Name, z. B. Winterthur",
                "maxLength": 80,
                "type": "string"
              },
              "offset": {
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Freitext: Gemeinde, PLZ, Kanton, Titel oder Bauherrschaft",
                "maxLength": 120,
                "type": "string"
              },
              "sinceDays": {
                "description": "nur Publikationen der letzten N Tage",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d155b07d0451c8a43b891616eee903955906948565034a27a758a3fa413f228"
        }
      ],
      "digest": "sha256:37fd412f28fb03d832bf5a33b45bd43ddc1d18d7f6090be981e9d00dfa40b7cc"
    }
  }
}
