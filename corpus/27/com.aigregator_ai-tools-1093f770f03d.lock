        },
        {
          "name": "recommend_tools",
          "title": "Recommend AI tools for a need",
          "description": "Describe what you need in natural language and get a ranked, explained shortlist of AI tools from Aigregator's advisor agent. Returns a summary plus recommendations (slug, name, why it fits, price, url, score). Answers in about two seconds. Prices and URLs come from the catalog and the 'why' is composed from typed judgments, not generated, so no field is invented. Free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional category to constrain results (e.g. 'Productivity', 'Image Generation').",
                "type": "string"
              },
              "freePlan": {
                "description": "Optional: only recommend tools that offer a free plan.",
                "type": "boolean"
              },
              "minRating": {
                "description": "Optional: minimum average rating (0-5) a tool must have to be recommended.",
                "type": "number"
              },
              "need": {
                "description": "What you want to accomplish, in natural language. E.g. 'transcribe and summarize Zoom meetings', 'generate product photos for an e-commerce store'.",
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Recommend AI tools for a need"
          },
          "behavior": {
            "destructive": false,
