        },
        {
          "name": "search_tools",
          "title": "Search AI tools (free discovery)",
          "description": "Search Aigregator's directory of 5,000+ AI tools by keyword, category, and filters. Returns only {slug, name} per result — this is a free existence check designed to feed the paid get_tool lookup. Use this to find candidate slugs, then call get_tool for full profiles (pricing, features, pros/cons, ratings). Free — no payment required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category filter (e.g., 'Productivity', 'Image Generation', 'Developer Tools')",
                "type": "string"
              },
              "has_free_plan": {
                "description": "Filter for tools that offer a free plan",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Max results to return (default 20, max 50)",
                "type": "number"
              },
              "query": {
                "description": "Search keyword (e.g., 'video editor', 'chatbot', 'SQL from natural language')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
