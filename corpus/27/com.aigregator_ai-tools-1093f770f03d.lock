        {
          "name": "compare_tools",
          "title": "Compare 2-5 AI tools side-by-side",
          "description": "Compare 2-5 AI tools side-by-side in a single request. Returns name, category, short description, pricing plans, features, pros/cons, alternatives, and stats for each tool — enough to make a recommendation without multiple get_tool calls. Free. Use search_tools first to discover candidate slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "Array of 2-5 tool slugs to compare, e.g., ['chatgpt', 'claude', 'gemini']. Use search_tools to discover valid slugs for free.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare 2-5 AI tools side-by-side"
