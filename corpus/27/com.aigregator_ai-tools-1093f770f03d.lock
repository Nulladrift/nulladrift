          "name": "get_tool",
          "title": "Get full AI tool profile",
          "description": "Get the full profile for a specific AI tool by slug. Returns name, description, pricing plans, features, pros/cons, ratings, alternatives, use cases, target audience, and more. Free — no payment or API key required. Use search_tools first to find slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The tool's URL slug, e.g., 'chatgpt', 'claude', 'midjourney', 'memo'. Slugs are lowercase with hyphens. Use search_tools to discover valid slugs for free.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
