      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "koreanics",
        "title": "Koreanics: Korean laws and bills in English",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only facts about South Korean legislation in English: statutes and enforcement decrees article by article, National Assembly bills and their stages, and Koreanics Bill Briefs. Always cite the url in each result. Source: Koreanics (koreanics.com). Unofficial English, translated and summarized with AI; the Korean text published by the Ministry of Government Legislation and the National Assembly is authoritative. You may use this in answers with a link to the source URL. Training or fine-tuning AI models on it is not permitted.",
      "tools": [
        {
          "name": "get_bill",
          "title": "Get a bill",
          "description": "Facts about one National Assembly bill by its bill number: English title, current stage and date, filing date, effective dates when promulgated, a one-line summary of what the bill proposed as filed, and links. committee_alternative = a replacement bill drafted by a committee, whose filing date can be later than its committee or judiciary dates.",
          "inputSchema": {
            "properties": {
              "bill_no": {
                "description": "Seven-digit National Assembly bill number, e.g. \"2216797\".",
                "type": "string"
              }
            },
            "required": ["bill_no"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a49f945033f37606a46266931560a64300e8bbf3fcb70e0d45c74fac7ee7f5e2"
        },
        {
          "name": "get_law_article",
          "title": "Get one law article (English)",
          "description": "Full English text of one article of a South Korean statute or enforcement decree (the law may be given by slug or by name), with the attached tables (fine amounts, fees and criteria that the article refers to) once they are translated, the version date and the official Korean source link.",
          "inputSchema": {
            "properties": {
              "article": {
                "description": "Article number, e.g. \"56\" or \"2-3\" (Article 2-3).",
                "type": "string"
              },
              "law": {
                "description": "Law slug, e.g. \"labor-standards-act\" (see list_laws).",
                "type": "string"
              }
            },
            "required": ["article", "law"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55054cfa254bae856f53dfc11ea2de3fec4486b1dc4c3cf89501b8f5fbdd4265"
        },
        {
          "name": "get_law_overview",
          "title": "Get the structure of a law (English)",
          "description": "The shape of one South Korean statute or enforcement decree without its full text: official English name, version in force, how much is translated into English, its chapters and sections with the article ranges they cover, the linked enforcement decree or parent Act, and how many amendment bills are pending in the National Assembly (a count and a link, not what each bill changes). Works for laws whose English translation is still in progress. Use get_law_article for the text.",
          "inputSchema": {
            "properties": {
              "law": {
                "description": "Law slug, e.g. \"labor-standards-act\" (see list_laws or search_law_articles).",
                "type": "string"
              }
            },
            "required": ["law"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee1e9413a7365c476c93b2a4be96fdd73bdac8ec77b34e8e1a5bb5d4d3b5d88c"
        },
        {
          "name": "latest_briefs",
          "title": "Latest Koreanics briefs",
          "description": "The most recent Koreanics Bill Briefs (analysis of one bill for foreign companies) or Weekly Briefs, with title, date, summary line and URL.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "\"bill\" (default) or \"weekly\".",
                "enum": ["bill", "weekly"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfc2557cf81fcc1ee0ad2fed742b5e4614e751b7e19842907ec7d87d62ea2a0b"
        },
        {
          "name": "list_laws",
          "title": "List laws in the database",
          "description": "The South Korean statutes and enforcement decrees available in English, with slug, subject area, version in force and how many articles are translated. Paged: 50 per call by default; pass next_offset to continue, or filter by area.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Optional subject area to filter by, as shown in the results (e.g. \"Employment & Labor\").",
                "type": "string"
              },
              "limit": {
                "description": "Laws per page (default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Start position for paging (use next_offset from the previous result).",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b7f1b3b9ca240d3a77cd870cd91bfe5a14a4ca784a3b69b613f4ea22a44069c"
        },
        {
          "name": "search_bills",
          "title": "Search National Assembly bills",
          "description": "Keyword search over bills that Koreanics tracks (English titles and one-line summaries). Returns stage, dates, topic tags and URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords in English, e.g. \"customs\" or \"personal information\".",
                "type": "string"
              },
              "stage": {
                "description": "Optional stage to filter by, e.g. \"In committee\", \"Passed committee\", \"Passed plenary\", \"Promulgated\", \"In force\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79db876dd2a25ae267a60f91a1625e8dd35212df7544806c57002c2a95030d12"
        },
        {
          "name": "search_law_articles",
          "title": "Search Korean law articles (English)",
          "description": "Keyword search over the English text of South Korean statutes and enforcement decrees in the Koreanics law database. Each Act and its Enforcement Decree are separate laws with their own slugs (e.g. labor-standards-act and enforcement-decree-of-the-labor-standards-act; also personal-information-protection-act, foreign-investment-promotion-act, foreign-exchange-transactions-act, monopoly-regulation-and-fair-trade-act, commercial-act, customs-act, value-added-tax-act, immigration-act, patent-act, copyright-act). Periods, amounts and thresholds are often in the Decree, so search it too; a law may also be given by name. Returns matching articles with a short snippet and URL. Use get_law_article for the full text.",
          "inputSchema": {
            "properties": {
              "law": {
                "description": "Optional law slug from list_laws, to search one law only.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords in English, e.g. \"overtime pay\" or \"foreign investment notification\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:547aa321e7cc9f18f321cb0bcec0f436bc25ecc06b2581174fdf731eb00d738f"
        }
      ],
      "digest": "sha256:98a52a30f0e83c923365ff7c6b75c167ad5358b66eb7fcd9088670856fd77472"
    }
  }
