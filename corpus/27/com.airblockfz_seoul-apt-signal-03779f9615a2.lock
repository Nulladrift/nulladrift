            "readOnly": false
          },
          "digest": "sha256:57e599aaf4ab7e63c33ae96588ef4d1be2b72a83f481b93231a2bd2bca69838d"
        },
        {
          "name": "rate",
          "description": "FREE feedback tool — after acting on our signals, leave a rating: score 1-10 plus pros and cons. No payment needed.",
          "inputSchema": {
            "properties": {
