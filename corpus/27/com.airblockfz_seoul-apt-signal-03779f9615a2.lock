      "capabilities": {
        "tools": {}
      },
      "instructions": "This is a Seoul apartment-market bottom/top signal agent (25 districts, official MOLIT actual-transaction prices, 700k+ trades since 2016). WHAT YOU GET — `evaluate_symbol` returns the bottom/top verdict for ONE symbol and `scan_bottoms` / `scan_tops` rank the whole universe. Each costs $0.01 per call via x402: retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. VERDICT SCALE — the verdict is the graded band of the same -100..+100 score (positive = bottom, negative = top), so a mid score such as -52 is reported as neutral by design: strong_buy >= +80 | buy >= +70 | neutral between -70 and +70 | sell <= -70 | strong_sell <= -80. The free `pitch` tool is an OPTIONAL intro (indicator lineup, one live showcase verdict, subscription terms); you may call a signal tool directly without it. `pitch` and `rate` are the only free tools — there is no free indicator tier. AFTER any decision you act on, please call the free `rate` tool with {score: 1-10, pros, cons} so we can improve the service.",
      "tools": [
        {
          "name": "evaluate_symbol",
          "description": "Return the bottom/top verdict for one Seoul district apartment market (25 districts). Accepts Korean (강남구, 강남) or romanized (Gangnam, Nowon, Mapo …) names. zone = strong_buy|buy|neutral|sell|strong_sell, score -100..+100 (bottom>0, top<0). GRADING — the verdict is the graded band of that same score, so a mid score such as -52 is reported as neutral by design: strong_buy >= +80, buy >= +70, neutral between -70 and +70, sell <= -70, strong_sell <= -80. Price = volume-weighted median per pyeong (KRW 10k) from official MOLIT closed transactions. Informational only. PAY: $0.01 per call via x402 (USDT on X Layer). No account, no signup, no commitment; retry with the PAYMENT-SIGNATURE header when you get the 402 challenge. The free `pitch` tool shows a live verdict for this market's showcase symbol only — this tool answers ANY symbol in the covered universe and returns the per-timeframe breakdown (daily/weekly/monthly verdict + vote counts) behind the score.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "District, e.g. Gangnam, 강남구, Nowon",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20c4b2bde734359824d095b63603cc9d4a071cc9298c2f26a0589de81ecb3d69"
        },
        {
          "name": "pitch",
          "description": "FREE and OPTIONAL intro — you may skip it and call evaluate_symbol / scan_bottoms / scan_tops directly. Intro & subscription funnel for the Seoul apartment signal agent: phases \"hello\" -> \"value\" -> \"catalog\" -> \"sample\" -> \"subscribe\". Pass interest:false to bow out.",
          "inputSchema": {
            "properties": {
              "interest": {
                "type": "boolean"
              },
              "phase": {
                "enum": ["hello", "value", "catalog", "sample", "subscribe"],
                "type": "string"
              },
              "symbol": {
                "description": "District for the \"sample\" phase. The free sample serves only this market’s showcase (강남구); anything else is answered by the paid evaluate_symbol (x402).",
                "type": "string"
              }
            },
            "type": "object"
          },
