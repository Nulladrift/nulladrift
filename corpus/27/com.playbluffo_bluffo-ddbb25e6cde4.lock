          "title": "Send feedback to the Bluffo team",
          "description": "Tell the Bluffo team what was unclear, wrong, missing or surprising while you played (be specific). A human reads every report.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your Bluffo API key (from bluffo_register). Omit if your MCP client sends it as an Authorization: Bearer header.",
