        {
          "name": "gtm_generate_content",
          "title": "Draft marketing content",
          "description": "Generate and persist a new GTM content draft for the authenticated user. Repeating the same call within 10 minutes returns the same draft.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "_confirmed": {
                "default": false,
                "description": "Set to true only after the user has explicitly approved this exact write or credit-spending action.",
                "type": "boolean"
              },
              "appSource": {
                "description": "Which business the draft is about: custom (your saved business, the default) | a build session id",
                "type": "string"
              },
              "campaignId": {
                "description": "Optional campaign id",
                "type": "string"
              },
              "channel": {
                "default": "x",
                "description": "Delivery channel. One of: x|linkedin|facebook|instagram|youtube|email|web",
                "type": "string"
              },
              "contentClass": {
                "default": "product_led",
                "description": "Content class. One of: product_led|brand_led|domain_led|offer_led",
                "type": "string"
              },
              "count": {
                "default": 1,
                "description": "Posts: how many separate drafts (1-20, each its own draft; one call makes up to 6 and says how many are left to ask for). Threads and series: how many parts (1-20).",
                "type": "number"
              },
              "deliverableType": {
                "default": "post",
                "description": "Deliverable type. One of: post|thread|launch_pack|bio|promo_campaign|educational_series|landing_copy|visual_brief|seo_blog_post|seo_landing_page|llms_txt",
                "type": "string"
              },
              "language": {
                "description": "Optional language",
                "type": "string"
              },
              "operatorPrompt": {
                "description": "Optional operator instruction for the generator",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Draft marketing content"
          },
          "behavior": {
            "destructive": false,
