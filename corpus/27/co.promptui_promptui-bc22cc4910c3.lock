        {
          "name": "build_app",
          "title": "Build a web app",
          "description": "Build a working web app from a prompt with PromptUI. Starts an asynchronous build (costs credits from the authenticated account) and returns a buildId — poll get_build_status for progress and the preview link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "_confirmed": {
                "default": false,
                "description": "Set to true only after the user has explicitly approved this exact write or credit-spending action.",
                "type": "boolean"
              },
              "framework": {
                "default": "react-spa",
                "description": "Output framework: 'react-spa' (default) or 'nextjs-app'",
                "type": "string"
              },
              "mode": {
                "default": "quality",
                "description": "Build mode: 'quality' (default) or 'fast'",
                "type": "string"
              },
              "prompt": {
                "description": "What to build, in plain language",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a web app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dae667bab8d89246a6045febc95150e24958fa278195a23017a6c32864ac79e1"
        },
