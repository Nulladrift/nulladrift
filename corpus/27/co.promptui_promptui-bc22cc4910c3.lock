        {
          "name": "shadcn_ui",
          "title": "Inspect UI components and official catalogues",
          "description": "Default action local retrieves the existing adapted components. action search discovers the official shadcn or magicui catalogue; action inspect reads source and bounded dependency/CSS/provenance information, never installs. Official upstream items require compatibility review and are not runtime verified. Get shadcn/ui component code pre-adapted for the Sandpack preview environment. Available components: accordion, dropdown_menu, dialog, sheet, tooltip, progress, separator, scroll_area, skeleton, alert. Returns ready-to-use JS code with correct imports. Use this instead of building complex UI primitives from scratch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "default": "local",
                "description": "local (default), search, or inspect",
                "type": "string"
              },
              "component": {
                "description": "Local component or official hyphenated item name. Local: accordion, dropdown_menu, dialog, sheet, tooltip, progress, separator, scroll_area, skeleton, alert",
                "type": "string"
              },
              "limit": {
                "description": "Search page size, 1–30",
                "type": "number"
              },
              "offset": {
                "description": "Search page offset",
                "type": "number"
              },
              "query": {
                "description": "Catalogue search text; empty lists all items",
                "type": "string"
              },
              "registry": {
                "description": "shadcn (default) or magicui",
                "type": "string"
              },
              "tailwindVersion": {
                "description": "Target Tailwind 3 (default) or 4. MagicUI current source targets 4.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect UI components and official catalogues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a6d10d97278ba59f15d402268720745ef3b4d26e096afa1656fce4c3e7c51e7c"
        },
