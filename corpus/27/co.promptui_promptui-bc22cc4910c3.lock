          "description": "Deploy a completed PromptUI build to a live URL. The first deploy of each app is charged; redeploying that same app is free. If publishing needs a paid plan (a Free account, when the publish gate is on), the tool returns how to start the Build free trial instead of deploying.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "_confirmed": {
