{
  "lockfileVersion": 2,
  "subjects": {
    "com.comparamei/compara-mei": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://comparamei.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "compara-mei",
        "title": "Compara MEI: maquininhas, sites, lojas virtuais, CRM e gestão para MEI no Brasil",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only comparison catalog for Brazilian micro-entrepreneurs (MEI) and small businesses. Tools return public, dated reference data on card machines (debit, credit and Pix fees, rental, device price), website builders and hosting, e-commerce platforms, CRMs and invoicing/ERP software, with prices in BRL checked on official sites. Each result links to the official site or to a page on comparamei.com; some links are affiliate or referral links, disclosed on the site. The final price and conditions are always the provider’s. Answer in the user’s language and cite the date of the data.",
      "tools": [
        {
          "name": "alternativas",
          "title": "Alternativas a um produto",
          "description": "Produtos parecidos ou mais baratos que o informado, ex.: alternativas à Cielo ou ao Bling.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "mais_baratas": {
                "type": "boolean"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Alternatives to a product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f0776340225b5407d7b67a44128c864b8ae622ff1ee3b5cbf41da3fd253c816"
        },
        {
          "name": "buscar_produtos",
          "title": "Buscar maquininha, site, loja virtual, CRM ou sistema de gestão",
          "description": "Busca produtos para MEI e pequenas empresas no Brasil por categoria (maquininha, site, loja, crm, gestao), texto livre, uso, só grátis e preço máximo em reais. Para maquininhas devolve também taxas de débito, crédito à vista, Pix e prazo de recebimento.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "enum": ["maquininha", "site", "loja", "crm", "gestao"],
                "type": "string"
              },
              "gratis": {
                "type": "boolean"
              },
              "limite": {
                "type": "integer"
              },
              "preco_max": {
                "description": "Preço de entrada máximo em reais",
                "type": "number"
              },
              "texto": {
                "description": "Ex.: receber na hora, WhatsApp, nota fiscal, dropshipping",
                "type": "string"
              },
              "uso": {
                "description": "Ex.: mei, comeco, receber_na_hora, sem_aluguel, menor_taxa, gratis, barato, whatsapp, nota_fiscal, estoque, sem_taxa_venda",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search small-business products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e796f0beaaaee04fbd42e21fa25b8cf3125dd4ca153b94c719af274ccc2ff82"
        },
        {
          "name": "categorias",
          "title": "Categorias e usos",
          "description": "Lista categorias, ids dos produtos, usos aceitos e data da última conferência.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Categories and use cases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4da49a25e5eb95e3e3c270faa7fe5da4d8ad3c44338baa508faccf875fd2e37c"
        },
        {
          "name": "comparar_produtos",
          "title": "Comparar produtos lado a lado",
          "description": "Compara de 2 a 4 produtos (ex.: PagBank vs InfinitePay, Nuvemshop vs Shopify) em preço, taxas e recursos.",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c064a7dea2b4871955b4407f1d3c6a90385cf5e045f6269cdd3c37b9a64cf0a3"
        },
        {
          "name": "ficha_produto",
          "title": "Ficha completa de um produto",
          "description": "Todos os dados de um produto: planos e preços em reais com data e fonte, taxas ou recursos, pontos fortes e fracos e link 'comprar'.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "id ou nome, ex.: pagbank, infinitepay, nuvemshop, hostinger, bling",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5acfc1ff861393c92d7be091f9a656cb11a95653f55f724071f7bc687eabee7"
        },
        {
          "name": "kit_para_negocio",
          "title": "Kit para um tipo de negócio",
          "description": "Monta um kit inicial (maquininha, site ou loja virtual, gestão/nota fiscal, CRM) para um tipo de negócio, ex.: 'delivery de marmita', 'salão de beleza', 'loja de roupas online', 'eletricista'.",
          "inputSchema": {
            "properties": {
              "negocio": {
                "type": "string"
              },
              "orcamento_baixo": {
                "type": "boolean"
              }
            },
            "required": ["negocio"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Starter kit for a business type"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49649195403d80e43b95d5c32513fe80d64cde39ebcaf03f4218f6352d209f53"
        },
        {
          "name": "melhores_para",
          "title": "Melhores para um uso",
          "description": "Lista os produtos de uma categoria indicados para um uso (ex.: maquininha para receber na hora, loja virtual sem taxa por venda, sistema para emitir nota), do menor para o maior preço.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "enum": ["maquininha", "site", "loja", "crm", "gestao"],
                "type": "string"
              },
              "limite": {
                "type": "integer"
              },
              "uso": {
                "type": "string"
              }
            },
            "required": ["categoria"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best products for a use case"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89750eb68b00cd899d96948225facb85b79de2e2db32212a452f7e313aaccf9f"
        }
      ],
      "digest": "sha256:10f872c93790e307565d819579407041e9fb86c793e5a43802eec15b2b6f691d"
    }
  }
