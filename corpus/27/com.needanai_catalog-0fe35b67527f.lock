      "instructions": "NeedAnAI is a directory of 15,000+ AI tools with pricing, pros/cons, FAQs, alternatives and an automated liveness scanner. Start with search_tools or recommend_for_task; use get_tool for detail and find_alternatives / compare_tools to choose. Every result carries a freshness label: fresh (site confirmed alive ≤30 days ago), aging (≤90), stale, or unknown. Tell users the date when it matters. Sponsored placements are always in a separate \"sponsored\" block with a disclosure and never mixed into ranked hits. Read tools need no key. watch_tool, submit_tool and export_tools need a free API key from https://needanai.com/profile?tab=api-keys sent as \"Authorization: Bearer nai_…\".",
      "tools": [
        {
