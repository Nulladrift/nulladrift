{
  "lockfileVersion": 2,
  "subjects": {
    "ai.harny/harness": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.harny.ai/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Harny",
        "version": "1.26.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Harny gives the agent inside your app, for each user: a memory of that user that stays accurate as facts change, their connected accounts (mail, calendar, files, notes, chat), actions on those accounts inside permissions you set, and a record of every action. One API key, your own model. The agent loop runs on your key in TypeScript or Python, and the Python harness also runs long jobs. Tools by job. Memory: ingest_text, assemble_context. Accounts: configure_oauth. Actions: calendar_create_event, email_send, ticket_create, slack_post_message, notion_create_page, undo_action. Record: action_history. Setup with no account: provision_app.",
      "tools": [
        {
          "name": "provision_app",
          "title": "Provision App",
          "description": "Set up Harny for an app with no account: memory, connected accounts, actions and the action record behind one key; makes a new app and its key, as `POST /v1/auth/provision` does. The answer carries the app key once, and the assistant is told to put it in the owner's secret store and nowhere else. Needs no key.",
          "inputSchema": {
            "properties": {
              "app_name": {
                "description": "A name for the new app, such as the product's name.",
                "maxLength": 255,
                "minLength": 1,
                "title": "App Name",
                "type": "string"
              },
              "assistant_name": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Your own name: the product you run as, the way you would say who you are. The app's owner sees it on their Home as who set the app up. Leave it out if you do not know it; Harny never fills it in for you.",
                "title": "Assistant Name"
              },
              "contact_email": {
                "anyOf": [
                  {
                    "format": "email",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. A contact address for platform messages. Leave it out when you do not have one: the app's owner gives their sign-in address when they claim the app.",
                "title": "Contact Email"
              },
              "customers": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Who the app's customers are, in one or two sentences. Stored with the app's objective; the owner can change it.",
                "title": "Customers"
              },
              "model_preset": {
                "anyOf": [
                  {
                    "enum": ["cost_first", "quality_first", "regulated"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. The model preset chosen for this app: cost_first, quality_first or regulated. It is stored with the app now, so Harny's own processing of what the app loads follows it from the first fact. The owner can change it after the claim.",
                "title": "Model Preset"
              },
              "objective": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What the app does, in one or two sentences, in the business's words. Stored as the app's objective; the owner can change it.",
                "title": "Objective"
              }
            },
            "required": ["app_name"],
            "title": "provision_appArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Provision App"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "anthropic/alwaysLoad": true,
            "anthropic/searchHint": "set up memory for an app, add long-term memory, create a memory store, get a key with no account"
          },
          "digest": "sha256:95af52f4b3707a979704f1104c5487683fc398f0804dd313c93433a861dd1fee"
        }
      ],
      "digest": "sha256:f120915e5e9056fe203ef5b7639e8d6d0eaa6d9125cbe412f64ff9339ff0a940"
    }
  }
}
