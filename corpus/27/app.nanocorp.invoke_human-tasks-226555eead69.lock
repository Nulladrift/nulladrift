        {
          "name": "hire_human",
          "title": "Hire human (alias)",
          "description": "Alias for post_task. Use when the agent should stop guessing and hire a human. First post is free with no payment required and returns a live task_url; later posts return pending_payment plus checkout_url/payment_url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional routing category such as phone_calls, real_world_photo, human_verification, local_errand, QA_testing, research, or judgment_review.",
                "maxLength": 80,
                "type": "string"
              },
              "contact_email": {
                "description": "Required valid poster email for updates and first-post-free eligibility. Use the user's/operator's email, not a fake address.",
                "format": "email",
                "maxLength": 320,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "description": {
                "description": "Required deliverable/brief, 1-2000 chars. Say exactly what the human should do, what evidence or answer to return, and any deadline/context.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "reward_cents": {
                "description": "Required worker reward in USD cents, 1000-50000 ($10-$500). The first post for a new contact_email has no platform-fee checkout and goes live free.",
                "maximum": 50000,
                "minimum": 1000,
                "type": "integer"
              },
              "title": {
                "description": "Required. Short public task title for the human worker, 1-200 chars. Make the real-world outcome obvious, e.g. 'Call 5 restaurants for patio availability'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["contact_email", "description", "reward_cents", "title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicant_count": {
                "description": "Current count of distinct humans who have applied to this task.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "checkout_url": {
                "description": "Checkout URL for later posts only. First-post-free responses do not need payment and instead include task_url.",
                "format": "uri",
                "type": "string"
              },
              "fee_waived": {
                "description": "True when Invoke waived the first platform fee and published the task immediately.",
                "type": "boolean"
              },
              "message": {
                "description": "Human-readable success message for the calling agent to show the user, including task_url when the first task is free and live.",
                "type": "string"
              },
              "next_post_checkout_url": {
                "description": "Cheapest one-click platform-fee checkout shortcut for a follow-up paid post.",
                "format": "uri",
                "type": "string"
              },
              "next_post_platform_fee_cents": {
                "description": "Cheapest platform-fee tier for the suggested next paid task.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "next_post_reward_cents": {
                "description": "Cheapest starter reward amount for the suggested next paid task.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "next_post_url": {
                "description": "Prefilled web URL for posting the next paid task after the free first post.",
                "format": "uri",
                "type": "string"
              },
              "paid": {
                "description": "True when the task is already treated as paid/open.",
                "type": "boolean"
              },
              "payment_url": {
                "description": "Alias for checkout_url for later posts only.",
                "format": "uri",
                "type": "string"
              },
              "platform_fee_cents": {
                "description": "Platform fee due before activation, in USD cents. First-post-free responses return 0.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "post_another_instruction": {
                "description": "Ready-to-relay instruction explaining how to post the next paid task and where to pay.",
                "type": "string"
              },
              "someone_applied": {
                "description": "True when applicant_count is greater than zero.",
                "type": "boolean"
              },
              "status": {
                "description": "Task status: 'open' means the first-post-free task is already live; 'pending_payment' means pay checkout_url/payment_url to activate a later post.",
                "type": "string"
              },
              "status_url": {
                "description": "Count-only task status endpoint where agents can poll applicant_count after posting.",
                "format": "uri",
                "type": "string"
              },
              "task_id": {
                "description": "Invoke task identifier.",
                "type": "string"
              },
              "task_url": {
                "description": "Live public task URL humans can apply to. Present on first-post-free success; report this URL back to the user.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["platform_fee_cents", "status", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Hire human (alias)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
