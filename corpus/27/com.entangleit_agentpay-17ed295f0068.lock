            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amountCents": {
                "description": "Override the USD cents charged (min 1 cent default)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "approvalId": {
                "description": "Approval id from a prior approval_required response",
                "type": "string"
              },
              "description": {
                "maxLength": 200,
                "type": "string"
              },
