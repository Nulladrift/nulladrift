        {
          "name": "extract",
          "title": "Extract typed fields",
          "description": "Extract typed values from messy text or receipts. Pays Fuse extract; agentpay settles the standard x402 v2 BSV 402 from this wallet. Prefer this over chat when you need structured fields with confidence scores and explicit nulls (p_null) instead of made-up answers. Types: text|number|date|time|datetime|duration|list|estimate|forecast (lists need items, e.g. \"text\"). fields is a name→{type} object. Tiers: S 3,500 sats (≤1,500 chars, ≤8 fields), M 15,000 (≤6,000 chars, ≤30 fields), L 50,000 (≤16,000 chars, ≤30 fields); images (base64 PNG/JPEG/WebP) are at least M. Oversized → 413, bad schema → 400. Returns answers, receipt, and txid. Pass dryRun to quote the tier and price without spending.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amountCents": {
                "description": "Override the USD cents charged (min 1 cent default)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "approvalId": {
                "description": "Approval id from a prior approval_required response",
                "type": "string"
              },
              "description": {
                "maxLength": 200,
                "type": "string"
              },
              "dryRun": {
                "description": "Quote the extract tier (S/M/L) and price only, no debit or settlement",
                "type": "boolean"
              },
              "fields": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "properties": {
                        "description": {
                          "type": "string"
                        },
                        "items": {
                          "anyOf": [
                            {
                              "enum": ["text", "number", "date", "time", "datetime", "duration", "list", "estimate", "forecast"],
                              "type": "string"
                            },
                            {
                              "properties": {
                                "description": {
                                  "type": "string"
                                },
                                "type": {
                                  "enum": ["text", "number", "date", "time", "datetime", "duration", "list", "estimate", "forecast"],
                                  "type": "string"
                                }
                              },
                              "required": ["type"],
                              "type": "object"
                            }
                          ],
                          "description": "Required when type is list, e.g. \"text\""
                        },
                        "type": {
                          "enum": ["text", "number", "date", "time", "datetime", "duration", "list", "estimate", "forecast"],
                          "type": "string"
                        }
                      },
                      "required": ["type"],
                      "type": "object"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "items": {
                      "properties": {
                        "description": {
                          "type": "string"
                        },
                        "items": {
                          "anyOf": [
                            {
                              "enum": ["text", "number", "date", "time", "datetime", "duration", "list", "estimate", "forecast"],
                              "type": "string"
                            },
                            {
                              "properties": {
                                "description": {
                                  "type": "string"
                                },
                                "type": {
                                  "enum": ["text", "number", "date", "time", "datetime", "duration", "list", "estimate", "forecast"],
                                  "type": "string"
                                }
                              },
                              "required": ["type"],
                              "type": "object"
                            }
                          ]
                        },
                        "name": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "type": {
                          "enum": ["text", "number", "date", "time", "datetime", "duration", "list", "estimate", "forecast"],
                          "type": "string"
                        }
                      },
                      "required": ["name", "type"],
                      "type": "object"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "Fuse wire format: object mapping field names to {type, items?}. An array of {name, type} is also accepted."
              },
              "images": {
                "description": "Base64 PNG, JPEG, or WebP (or data URI). Remote URLs are rejected. Image requests are at least M.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "key": {
                "description": "Agent key (agp_…). Optional when the MCP connection sends Authorization: Bearer.",
                "type": "string"
              },
              "ref": {
                "type": "string"
              },
              "reference_date": {
                "description": "YYYY-MM-DD (or ISO datetime) used to resolve relative dates like 'yesterday'",
                "type": "string"
              },
              "state": {
                "description": "Messy text, receipt, email, or notes. Required unless images are sent.",
                "type": "string"
              }
            },
            "required": ["fields"],
            "type": "object"
