                "description": "Lifetime budget in USD cents (omit for no total cap)",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "dailyLimitCents": {
                "description": "Per-day limit in USD cents",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "expiresInMinutes": {
                "description": "Key expiry (max 30 days)",
                "maximum": 43200,
                "minimum": 1,
                "type": "integer"
              },
              "key": {
