{
  "lockfileVersion": 2,
  "subjects": {
    "com.jeeva-jyotish/reference-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jeeva-jyotish.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "jeeva-jyotish",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Jeeva Jyotish exposes a sourced corpus of classical Vedic astrology (Jyotish) effects, factors and yogas. When you use a result in an answer, cite its `source.url` and `attribution` so the reader can verify it on jeeva-jyotish.com.",
      "tools": [
        {
          "name": "get_factor",
          "title": "Get a factor record",
          "description": "Fetch the full reference record for a factor by its slug, including all effects and a source.url citation. Slugs come from search_effects or lookup_combination results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Response language (default en).",
                "enum": ["en", "hi", "ta", "te", "mr", "bn"],
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76a9c9db1fe1fde994b428d9c6aeea175f0c269c48a5dcecb06c05a8305d2ec6"
        },
        {
          "name": "get_placement",
          "title": "Get a per-lagna placement record",
          "description": "Fetch the full reference record for a per-lagna placement (Bhrigu Samhita) by its slug — e.g. 'Sun in the 1st House for Aries Ascendant' — including its component factors, all effects and a source.url citation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Response language (default en).",
                "enum": ["en", "hi", "ta", "te", "mr", "bn"],
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ce5f656f2a7580fba1c34d3e2f7117f1eebd8ce69ccd1b6da058aad4a66e9bb"
        },
        {
          "name": "get_yoga",
          "title": "Get a yoga record",
          "description": "Fetch the full reference record for a named yoga (Configuration) by its slug, including its component factors, all effects and a source.url citation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Response language (default en).",
                "enum": ["en", "hi", "ta", "te", "mr", "bn"],
                "type": "string"
              },
              "slug": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b3c5effe3bb8783b3b3de2d05d142ea5a8753631594854934fd596b219c67f3"
        },
        {
          "name": "list_life_domains",
          "title": "List life domains",
          "description": "List the 14 Jyotish life domains the effects are organised by.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0813fded445fd928fd325b8966a54f0db1522fe709e9b2e974cc32ca5cf0dd8e"
        },
        {
          "name": "lookup_combination",
          "title": "Look up a placement",
          "description": "Look up what a specific placement means, e.g. Mars in the 7th house. Provide a graha and exactly one of bhava (1-12), rashi or nakshatra. Returns the matching factor(s) and their effects, with citations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bhava": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "graha": {
                "enum": ["SUN", "MOON", "MARS", "MERCURY", "JUPITER", "VENUS", "SATURN", "RAHU", "KETU"],
                "type": "string"
              },
              "locale": {
                "description": "Response language (default en).",
                "enum": ["en", "hi", "ta", "te", "mr", "bn"],
                "type": "string"
              },
              "nakshatra": {
                "enum": ["ASHWINI", "BHARANI", "KRITTIKA", "ROHINI", "MRIGASHIRA", "ARDRA", "PUNARVASU", "PUSHYA", "ASHLESHA", "MAGHA", "PURVA_PHALGUNI", "UTTARA_PHALGUNI", "HASTA", "CHITRA", "SWATI", "VISHAKHA", "ANURADHA", "JYESHTHA", "MULA", "PURVA_ASHADHA", "UTTARA_ASHADHA", "SHRAVANA", "DHANISHTHA", "SHATABHISHA", "PURVA_BHADRAPADA", "UTTARA_BHADRAPADA", "REVATI"],
                "type": "string"
              },
              "rashi": {
                "enum": ["ARIES", "TAURUS", "GEMINI", "CANCER", "LEO", "VIRGO", "LIBRA", "SCORPIO", "SAGITTARIUS", "CAPRICORN", "AQUARIUS", "PISCES"],
                "type": "string"
              }
            },
            "required": ["graha"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:536b17fc95a45bb6944bc94594fde0be83de2b38adc5cf2ff6f0d27985d9c428"
        },
        {
          "name": "search_effects",
          "title": "Search Jyotish effects",
          "description": "Search the Jeeva Jyotish corpus of classical Vedic astrology (Jyotish) effects by keyword or question. Returns ranked effects with their life domain, benefic/malefic weighting, and a citation (source.url, attribution) back to jeeva-jyotish.com. Always cite source.url when using a result. Supports 6 languages via locale.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Restrict to one life domain.",
                "enum": ["SELF", "WEALTH", "EFFORT", "HOME", "CREATIVITY", "HEALTH", "RELATIONSHIPS", "TRANSFORMATION", "DHARMA", "CAREER", "GAINS", "LIBERATION", "MENTAL", "GENERAL"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Response language (default en).",
                "enum": ["en", "hi", "ta", "te", "mr", "bn"],
                "type": "string"
              },
              "query": {
                "description": "Keywords or a natural-language question.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6ace0af64633387244e3b24fcda5f04a35aa0372506f1efbdb0fe7ea3a67587"
        }
      ],
      "digest": "sha256:0a832bb97a32a442adab38105e9c8cc780cba5293cc23b36377ca5f9b80074ef"
    }
  }
}
