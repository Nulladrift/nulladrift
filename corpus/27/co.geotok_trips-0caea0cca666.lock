{
  "lockfileVersion": 2,
  "subjects": {
    "co.geotok/trips": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geotok.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "geotok-trips",
        "title": "GeoTok Trips",
        "version": "1.0.0",
        "websiteUrl": "https://geotok.co/ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GeoTok Trips plans travel: flights, hotels, airport transfers, things to do, and food spots people saved from TikTok/Instagram food videos. For 'I have a budget, I fly from X, anywhere is fine', use find_trips_on_budget. Prices are never invented: fares come only from booking links or labelled cached fares. save_trip_to_geotok keeps a trip's places as a shareable trip page and on a GeoTok map, when the user wants to keep them.",
      "tools": [
        {
          "name": "find_food_spots",
          "title": "Food spots from food videos",
          "description": "Restaurants, cafés and bars in a city that people saved from TikTok, Instagram and YouTube food videos on GeoTok — verified places with the dish to order. Great for 'where should I eat in X'.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "craving": {
                "description": "Optional dish or cuisine, e.g. 'pastel de nata', 'ramen'.",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Food spots from food videos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39799b38d2dc364163acdff363917b07da1c11cc34242a1cbcdbf42c4b88ea30"
        },
        {
          "name": "find_things_to_do",
          "title": "Things to do",
          "description": "Top sights, museums, parks, viewpoints and other attractions in a city with coordinates, plus links to book tours and tickets.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "interests": {
                "description": "Optional focus, e.g. ['museums', 'beaches', 'nightlife', 'kids'].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Things to do"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1b90db24015705a4587d600ad219f375dad718e887739e96aeb01a378c5ff104"
        },
        {
          "name": "find_trips_on_budget",
          "title": "Trips anywhere on a budget",
          "description": "\"I have €500, I'm flying from Madrid, anywhere is fine\": finds destinations whose recently seen round-trip fare leaves enough of the budget for the hotel. For each: the fare, the money left per night for a hotel, flight and hotel booking links, and how many verified food spots from TikTok/Instagram food videos GeoTok already has there. Fares are cached prices seen recently, not live quotes; hotel prices are not included — the figure is the budget left per night.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Total budget for flights + hotel, for all travellers together.",
                "type": "number"
              },
              "currency": {
                "default": "EUR",
                "description": "3-letter currency of the budget.",
                "type": "string"
              },
              "depart_date": {
                "description": "Exact departure date, YYYY-MM-DD. Use this or 'month'.",
                "type": "string"
              },
              "direct_only": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 8,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Flexible: any departure in this month, YYYY-MM.",
                "type": "string"
              },
              "nights": {
                "default": 3,
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "Departure city or airport (name or IATA code), e.g. 'Madrid'.",
                "type": "string"
              },
              "travellers": {
                "default": 1,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["budget", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Trips anywhere on a budget"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:756dd02493c46a3c1d0c7d5dab7868d2c7992948216ab17f346a4b52a09dd295"
        },
        {
          "name": "plan_trip",
          "title": "Plan a trip",
          "description": "Everything for a day-by-day itinerary in one call: hotel options, sights and food spots with coordinates, plus hotel and tour booking links.",
          "inputSchema": {
            "properties": {
              "check_in": {
                "description": "YYYY-MM-DD (optional)",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "days": {
                "default": 3,
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "interests": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "travellers": {
                "default": 2,
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Plan a trip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dc8989e29e9d535f9f0a569f12d99983a72199beb5de230226a3f062acc1758e"
        },
        {
          "name": "save_trip_to_geotok",
          "title": "Save trip to GeoTok",
          "description": "Save a trip (hotel, sights, food spots — any places), plus the chosen flights and hotel bookings, to GeoTok and get a public link; the GeoTok app keeps the trip available offline. Opening the link on an iPhone with the GeoTok app puts each place on the user's map, and the app reminds them when they are near one. Each item needs a name; lat/lng, address, kind, note and day are optional, and places without coordinates are looked up by name. Items must not contain personal details.",
          "inputSchema": {
            "bookings": {
              "description": "Flights and hotels the user chose or booked in this chat, so GeoTok keeps them with the trip for offline use. Itinerary facts only — never confirmation codes, ticket numbers or traveller names (the trip link is shareable; the user adds those privately in the app).",
              "items": {
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "airline": {
                    "type": "string"
                  },
                  "arrive_at": {
                    "description": "Local time, YYYY-MM-DDTHH:MM.",
                    "type": "string"
                  },
                  "check_in": {
                    "description": "YYYY-MM-DD.",
                    "type": "string"
                  },
                  "check_out": {
                    "description": "YYYY-MM-DD.",
                    "type": "string"
                  },
                  "depart_at": {
                    "description": "Local time, YYYY-MM-DDTHH:MM.",
                    "type": "string"
                  },
                  "flight_number": {
                    "description": "e.g. 'TP1015'.",
                    "type": "string"
                  },
                  "from": {
                    "description": "Departure airport/city.",
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["flight", "hotel", "transfer", "other"],
                    "type": "string"
                  },
                  "name": {
                    "description": "Hotel or transfer name.",
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "terminal": {
                    "type": "string"
                  },
                  "to": {
                    "description": "Arrival airport/city.",
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "maxItems": 8,
              "type": "array"
            },
            "properties": {
              "city": {
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "day": {
                      "maximum": 30,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["hotel", "sight", "food", "activity", "transport", "other"],
                      "type": "string"
                    },
                    "lat": {
                      "type": "number"
                    },
                    "lng": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "description": "Short tip, e.g. 'order the bifana'.",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "trip_name": {
                "description": "e.g. 'Lisbon long weekend'.",
                "type": "string"
              }
            },
            "required": ["city", "items", "trip_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Save trip to GeoTok"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f42d53cb57c4203ddaa0191aded17938b931e94cb6290812aca90ddc1a11c601"
        },
        {
          "name": "search_flights",
          "title": "Search flights",
          "description": "Find flights between two cities or airports for given dates. Returns airport codes, booking links to compare live fares (Aviasales, Kiwi.com, Skyscanner, Google Flights) and, when available, recently seen cheapest fares. Flexible: without a date it returns the cheapest recently seen dates; without a destination it returns the cheapest destinations from the origin. Prices change constantly; the live price is on the booking site.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 1,
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "currency": {
                "default": "USD",
                "description": "3-letter currency for fares, e.g. EUR, USD.",
                "type": "string"
              },
              "depart_date": {
                "description": "Departure date, YYYY-MM-DD. Omit for flexible dates: returns the cheapest recently seen dates.",
                "type": "string"
              },
              "destination": {
                "description": "Arrival city or airport (name or IATA code), e.g. 'Lisbon'. Omit for 'anywhere': returns the cheapest destinations.",
                "type": "string"
              },
              "month": {
                "description": "Flexible dates within this month, YYYY-MM (used when depart_date is omitted).",
                "type": "string"
              },
              "origin": {
                "description": "Departure city or airport (name or IATA code), e.g. 'Madrid' or 'MAD'.",
                "type": "string"
              },
              "return_date": {
                "description": "Return date, YYYY-MM-DD. Omit for one-way.",
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search flights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79516e39e6a4fbc137e3d2ef51ec48757bcb19471b54c181b165f6e5eea827dc"
        },
        {
          "name": "search_hotels",
          "title": "Search hotels",
          "description": "Find hotels in a city (optionally near an area or landmark) with addresses and map coordinates, plus booking links prefilled with the dates. Does not show prices — the booking links do.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "city": {
                "description": "City, e.g. 'Lisbon'.",
                "type": "string"
              },
              "near": {
                "description": "Optional area or landmark to stay near, e.g. 'Alfama' or 'Sagrada Familia'.",
                "type": "string"
              },
              "style": {
                "default": "any",
                "enum": ["any", "budget", "boutique", "luxury", "family"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search hotels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b48d46c683461cb81cfb8b3760887e781f1fa47f9358596be747971f5e2deeba"
        },
        {
          "name": "search_transfers",
          "title": "Airport & city transfers",
          "description": "Get from A to B on arrival — e.g. airport to hotel. Resolves both ends, gives the straight-line distance, public-transport and driving directions links, and links to pre-book a private transfer.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City the transfer is in (helps find the right place).",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD (optional)",
                "type": "string"
              },
              "from": {
                "description": "Start: airport code/name, hotel or address, e.g. 'LIS' or 'Lisbon airport'.",
                "type": "string"
              },
              "passengers": {
                "default": 2,
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "Destination: hotel, address or landmark.",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Airport & city transfers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:df9ca9a5e9a1516ab4883b4c95eee9d715ebd02467c95ccff04fa83336afe0bd"
        }
      ],
      "digest": "sha256:d5cdd3acde6d8855e75dddfd9859867317ee25385fe4a83e964b0b06bcfab5b8"
    }
  }
}
