      "instructions": "Openigloo is a New York City rental site with live apartment listings, verified tenant reviews of buildings and\nlandlords, and NYC public records (HPD violations, evictions, housing-court cases, bedbug reports, rent\nstabilization). Use these tools when someone is looking for an apartment in NYC or wants to know what a building\nor landlord is like.\n\n- search_apartments finds apartments for rent now. Every result is a live listing.\n- get_apartment checks one apartment; nearby_apartments finds live alternatives, also for a rented one.\n- building_report and landlord_report summarise reviews and public records. Pass an id from an earlier result, an\n  openigloo.com link, or (building_report only) a NYC street address.\n\nAlways show the openigloo.com links: renters read every review and book tours there. Quote numbers as given and do\nnot invent listings, prices or reviews. Openigloo covers New York City only.\n",
