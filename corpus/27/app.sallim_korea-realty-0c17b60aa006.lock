        {
          "name": "realty_policy_rules",
          "title": "법령·규제 규범 — 세율표·규제지역·대출·임대차·청약·정비사업 규칙",
          "description": "단지에 종속되지 않는 일반 규범(세율·규제·대출·임대차)을 근거 조문과 함께 준다.\n\n    근거 조문·확인일이 붙는다 — 취득세율표,\n    규제지역 **현재** 지정 현황, 주담대 규제 원표, 개인회생×대출, 주택임대차 갱신(갱신권·\n    5% 상한·매수인 실거주 거절), 양도세(세율·필요경비·중과·개편 계류), 청약통장·가점\n    배점표, 정비구역 요건·조합원 지위양도, 재개발 분양자격 갈림길(서울). \"취득세 얼마야?\",\n    \"갱신권 썼는데 집주인이 팔면?\", \"지금 팔면 중과야?\"류 질문의 자리다. 특정 조건의\n    상한 **계산**은 realty_loan_limit, 가점 점수 계산은 realty_subscription_score,\n    비례율·분담금 계산은 realty_redevelopment_burden, 양도세 시나리오 계산은\n    realty_capital_gains_tax, 조합원 지위양도 가능 판정은 realty_member_transfer_check —\n    이 표가 그 계산기들의 진실원이다.\n\n    클라이언트에 세율을 하드코딩하지 마라 — \"85㎡ 이하 1.1%\"는 6억 이하일 때만 맞고,\n    9억 초과에 그대로 쓰면 수천만원 틀린다(실측: 16.9억 84타입에서 3,700만원 차).\n\n    **판정은 하지 않는다**: \"이 사람이 1주택인가\"는 분양권·상속지분·일시적 2주택 특례가\n    얽힌 사실판단이다 — 표의 applicable_if·exceptions를 보고 사용자에게 확인 질문을\n    던져라. 개별 공고의 규제 플래그는 realty_presale, 공고 원문 값은\n    realty_notice_facts, 이 표로 총 소요자금 계산은 realty_presale_cost.\n    응답의 uncertainties(확인 못 한 것)와 disclaimer를 함께 전하라.\n\n    개별 사건·임차인 판단은 다른 도구: 재매각 보증금→realty_get_auction_case, 날짜로 묻는\n    대항력→realty_small_deposit_check, 빌라 지분 입찰가 시세→realty_nonapt_prices.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "**자유문으로 토픽을 찾는다** — 어느 topic인지 모를 때 사용자 말을 그대로 넣어라(예: '종부세 얼마부터 내요'→topic='comprehensive_real_estate_tax', '부모님이 보태주는 돈'→topic='gift_tax_and_funding_source', '전입은 빠른데 확정일자가 늦으면'→topic='auction_rights'). topic 없이 query만 주면 **후보 토픽 목록**이 오고, 후보가 하나면 그 토픽 본문까지 함께 온다. topic과 함께 주면 그 토픽을 그대로 주되 다른 후보가 있으면 알려준다. **아무것도 안 걸리면 지어내지 않고 0건이라고 답한다** — 그때는 이 서버에 그 축이 없는 것이니 표를 추측하지 마라",
                "title": "Query"
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "**토픽의 하위 항목만 골라 받는다** — 미지정이면 종전과 같이 토픽 전체가 온다. 큰 토픽(auction_rights·unit_alteration_rules·loan_rules)에서 필요한 축만 집을 때 쓴다. 예: topic='auction_rights', section='assumed_regardless_of_rank' → 순위 무관 인수(유치권·법정지상권)만. 쉼표로 여러 개(section='tenant_opposing_power,tenant_priority_payment')도 된다. **없는 이름을 주면 조용히 무시하지 않고 거절하며 유효 목록을 값으로 돌려준다** — 이름을 모르면 section 없이 한 번 부르면 응답 meta.sections_available에 전 목록이 있다. topic='list'에는 하위 항목이 없다",
                "title": "Section"
              },
