        {
          "name": "realty_area_price_bands",
          "title": "지역 평형대별 시세 구간",
          "description": "지역의 매매 시세를 평형대 4구간(소형/중소형/중형/대형, 전용면적 기준)으로 조회한다.\n    \"○○구에서 무슨 평수대가 얼마쯤 해?\"류 질문용 — 특정 단지는 realty_search_complexes를 쓰라.\n\n    **이 축의 자리(시세 도구 3종 중)**: 지역의 가격 **수준** 비교는 이게 기본값이다.\n    이상치 필터(계약해제 제외 + **직거래 중** 같은 평형대 중개거래 중앙값의 50% 미만만 제외)가\n    적용돼 realty_region_price_stats의 미필터 평균과\n    값이 다르며, **수준이 갈리면 이쪽을 우선하라**. 월별 **추이**가 필요하면\n    region_price_stats, 단지가 특정되면 search_complexes.\n\n    구간 라벨의 평수는 **전용평**이다. 사용자의 분양평 감각으로는 소형<60㎡≈분양 24평 미만,\n    중소형 60~85㎡≈분양 24~34평, 중형 85~115㎡≈분양 34~47평, 대형 115㎡+≈분양 47평 이상.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "by_dong": {
                "default": false,
                "description": "법정동 × 평형대 중앙값을 함께 낸다. '이 구에서 어디가 싼가'류 질문의 자리다 — 실측(마포구 6개월, 전용 60~84㎡): 서교동 6.8억 ~ 용강동 27.1억으로 한 구 안에서 4배 갈린다. 표본 3건 이상 칸만 나오고 뺀 칸 수(by_dong_hidden_cells)를 공시한다. 평형 하나(전용 84㎡ 등)로 좁힌 동별 값은 realty_region_price_stats(by_dong=true, 평형 인자)가 같은 산식으로 준다",
                "title": "By Dong",
