                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "비례율(%, 예: 102.5) — 조합 총회 자료·관리처분계획의 값을 선언. 없으면 아래 사업 전체 3종으로 계산한다 (허용 범위 0 초과~300)",
                "title": "Proportion Rate Pct"
              },
              "total_post_asset_10k": {
