      "instructions": "한국 부동산 질문 전반을 다루는 도구 모음이다 — 법원경매·공매, 아파트 실거래 시세·단지 분석,\n**청약 분양(공고 원문 + 분양가 적정성 계산)**, 규범 표, 지역 순위·인구·거시지표.\n이 서버가 잘하는 것은 웹검색이 못 하는 정형 조인·계산이다(분양가 대 실거래, 경매가 대 시세,\n단지·평형별 시계열). 뉴스·정책 동향·단지 평판처럼 이 데이터에\n없는 것은 웹검색이 맞다 — 도구를 억지로 끼워 맞추지 말고, 없는 값은 없다고 답하라.\n\n도구 지도 — 전체 57종이 9개 축에 있다. 축을 먼저 고르고 그 안에서 도구를 골라라.\n· **법원경매**(10) 민사집행법 경매 물건·사건·낙찰 통계(캠코 공매는 별도 축)\n    search·fetch·realty_search_auctions·realty_get_auction_case·realty_auction_history·realty_auction_alerts·realty_auction_sale_rate·realty_compare_auction_vs_market·realty_small_deposit_check·realty_auction_rights_analysis\n· **공매**(2) 온비드(캠코) 공매 물건·회차별 최저가·낙찰가율 — 법원경매와 별개 원장이다\n    realty_search_onbid·realty_onbid_sale_rate\n· **실거래·단지**(10) 아파트 매매·전월세 실거래와 단지·평형별 시세\n    realty_search_complexes·realty_complex_pyeong_price·realty_complex_rent_by_pyeong·realty_complex_report·realty_region_price_stats·realty_region_trend_basket·realty_area_price_bands·realty_nonapt_prices·realty_rental_yield·realty_predict_price\n· **청약·분양**(12) 분양 공고 원문·분양가 적정성·**공고 간 견주기(대지비 비중·옵션·중도금·층 프리미엄·㎡단가)**·경쟁률·자금계획·회사별 성적·공공임대 모집공고\n    realty_presale·realty_presale_vs_market·realty_presale_cost·realty_presale_funding_plan·realty_presale_price_trend·realty_presale_context·realty_notice_facts·realty_notice_text·realty_subscription_odds·realty_subscription_score·realty_builder_presale_record·realty_public_rental_notices\n· **규범·계산**(6) 대출·세금·정비사업 규제의 표 조회와 조건 계산, **세대 개조 가능성(벽 헐기·욕실 이동)**\n    realty_policy_rules·realty_remodel_feasibility·realty_loan_limit·realty_loan_eligibility·realty_capital_gains_tax·realty_member_transfer_check\n· **지역·거시·공급**(9) 지역 순위·인구·금리 등 거시지표·입주 물량·**시군구 수급 균형(입주 대 세대 증가)**·빈집\n    realty_region_rankings·realty_compare_regions·realty_demographics·realty_macro_indicators·realty_market_signals·realty_move_in_supply·realty_supply_pipeline·realty_supply_demand_balance·realty_vacant_housing\n· **입지·인프라**(3) 최근접역 거리·반경 안 학교·정류장·병원 수 등 주변 시설 원시값(점수는 미검증 참고값)\n    realty_location_scores·realty_poi_nearby·realty_poi_stats\n· **정비사업**(4) 재개발·재건축 구역과 분담금·투자위험\n    realty_redevelopment·realty_reconstruction·realty_redevelopment_burden·realty_invest_risk\n· **제보**(1) 사용자가 제보·개선 요청을 부탁할 때만 쓰는 쓰기 도구\n    report_issue\n\n**규범 표 색인 — realty_policy_rules(topic=…) 25종.** 아래 낱말이 질문에 보이면 그 표가 있다(기억·웹검색으로 때우지 마라 — 조문·시행일과 함께 나온다): 상품별 차이=axes·취득세=acquisition_tax·규제지역=regulated_area·주담대=loan_rules·개인회생=credit_rehab·개인회생 중인데 집 살 수 있나=credit_rehab_property·전월세=lease_rules·경매 권리분석=auction_rights·양도세=capital_gains_tax·청약통장=subscription_account·정비구역 지정=redevelopment_rules·재개발 입주권=redevelopment_entitlement·리모델링 조합=remodeling_rules·1세대1주택 비과세=one_home_exemption_map·종부세=comprehensive_real_estate_tax·증여세=gift_tax_and_funding_source·재산세=property_tax·전세자금대출=jeonse_loan_rules·중도금대출=interim_collective_loan·생활안정자금=living_expense_mortgage·전세퇴거자금=jeonse_return_mortgage·경락잔금대출=auction_balance_loan·자금조달계획서=funding_plan_report·방공제=room_deduction_and_mci·내력벽 철거=unit_alteration_rules. 낱말은 토픽마다 하나만 폈다 — 나머지 낱말과 각 표의 범위는 topic 파라미터 설명과 topic='list'에 있다.\n\n사건번호(case_no)는 법원 간 유일하지 않다. 물건은 반드시 법원명과 함께 특정한다.\n\n단지(\"○○아파트\") 질문은 realty_search_complexes부터 — 평형별 시세가 같이 오고,\n응답의 complex_key가 전월세·유료 단지 도구들의 입력 키다.\n\n빌라(다세대·연립)·오피스텔·단독주택 질문은 realty_nonapt_prices — 이 축은 **매매만** 있다.\n비아파트 전월세를 물으면 데이터가 없다고 답하라(아파트 전월세는 rental 축이 담당).\n\n티어: 경매·시세·단지·청약·순위·거시 기본 도구는 무료(IP당 일한도)다. 설명에 [유료]가 붙은\n도구는 API 키가 필요하다 — 키 없이는 하루 3회 맛보기 뒤 거절된다(유료 이용권: 현재 판매하지 않습니다 — 사업자등록·결제 개통 준비 중). 지금은 개통 알림 신청만 받는다.\n**키가 있으면 [유료] 도구도 즉시 동작하니 [유료] 표시로 회피하지 마라.**\n\n평수: 이 데이터의 평수는 전부 **전용면적 기준 실평수**다. 사용자가 말하는 \"34평\"은\n보통 분양평수(공급면적)다. 실평수 ≈ 분양평수 × 0.745\n(분양 34평 ≈ 전용 84㎡ ≈ 실평수 25.4평). 평수 인자는 `pyeong_supply`(분양)와\n`pyeong_exclusive`(전용)로 갈리니 사용자가 쓴 쪽에 넣어라.\n\n**겹쳐 보이는 두 쌍 — 부르는 법이 갈린다**:\n· `search`(자연어 한 줄) ↔ `realty_search_auctions`(구조화 인자). 지역·종류·감정가·유찰횟수를\n  이미 **값으로 알 때**는 뒤쪽이다. search가 못 뽑은 조건은\n  `unapplied_conditions`에 적히니 realty_search_auctions로 다시 걸되 면적·층·기일은 거기도 없다.\n· `fetch`(search가 준 `\"법원명|사건번호\"` id 그대로) ↔ `realty_get_auction_case`(사건번호+\n  법원명 따로). 앞은 **문서형 텍스트**, 뒤는 **구조화 필드**다.\n\n**무접두 이름은 절충이다**(고치지 마라): `search`·`fetch`는 **ChatGPT 커넥터 규격이 요구하는\n정확한 이름**이고 `report_issue`는 유일한 쓰기 도구라 읽기 축과 갈랐다. 나간 이름은 개명하지\n않는다(클라이언트가 캐시한다).\n\n**\"경매\"는 두 제도다 — 둘 다 있으니 갈라서 답하라**.\n· **법원경매**(민사집행법·사건번호 `2025타경1234`) = realty_search_auctions 계열.\n· **공매**(국세징수법 등·캠코 온비드·물건관리번호 `2026-0600-031235`)\n  = realty_search_onbid·realty_onbid_sale_rate.\n근거법·주관기관·**권리 인수 규칙**·저감 방식이 다르니 **두 원장을 합쳐 세거나 낙찰가율을\n섞어 평균내지 마라.** \"경매\"라고만 하면 어느 쪽인지 되물어라 — 번호에 '타경'이 있으면\n법원경매다. 임차인 권리(realty_policy_rules topic=auction_rights)는 **민사집행법 기준**이라\n공매에 그대로 옮기면 안 된다.\n공매 원장의 경계(함께 전하라): **부동산만**(자동차·동산 없음)·**낙찰 결과는\n2026-06-01분부터 누적**·**압류재산 주소는 번지 마스킹**(시군구까지만 유효)·**행이 물건이 아니라\n공매조건(회차)**·**최저입찰가에 '비공개'가 있고 그건 0이 아니라 null**. 공고 원문·감정평가서·\n권리분석은 없다(온비드에서 물건관리번호로 연다).\n\n청약 라우팅: 공고 목록 = realty_presale → \"넣을 만해?\" = realty_presale_vs_market\n(분양가×실거래 대조) → **공고 내용(전매제한·재당첨제한·거주의무·청약 자격·층별 분양가표·\n발코니 확장/유상옵션 가격·중도금 납부일정) = realty_notice_facts, 자격 세부·유의사항 원문 =\nrealty_notice_text** → 경쟁률·가점 커트라인 = realty_subscription_odds → 주변 시세 기준선 =\nrealty_region_price_stats. 공고 내용을 웹검색·추정으로 답하지 마라(원문 값이 쪽 번호와 함께 온다).\n\n**\"얼마야\"엔 네 가격이 있다**: ①매매 실거래가 ②분양가·무순위\n공급가 ③분양권·입주권 전매가(프리미엄 포함, 매매가 아니다) ④경매 감정가·최저가. 분양 연결\n단지(신축·분양 중)에 맨 \"얼마야\"면 두 축을 함께 보이거나 어느 가격인지 되물어라. **한 축의 값을\n다른 축 이름으로 부르지 마라**(분양가·경매가를 '시세'로, 전매가를 '매매가'로).\n\n금액 단위: 모든 `*_10k` 필드는 **만원** 단위다(283000=28억 3천만원).\n답변엔 맨 숫자 대신 **`*_text` 필드를 그대로 인용하라** — 억/만원\n표기와 원 단위 정확값이 함께 들어 있다(`min_bid_price_10k: 520.2` →\n`min_bid_price_10k_text: \"최저입찰가 약 520만원(=5,202,000원)\"`). 백엔드가 주는 `*_display`\n(\"0.05억원\"·\"21.70억원\")는 소수 2자리로 뭉갠 값이라 작은 금액은 0에 눌리고 큰 금액은\n소수점이 밀려 읽힌다 — 같은 값의 `*_text`가 정본이다.\n평당가는 특히 조심하라: `avg_price_per_py: 12095`는 **평당 1억 2,095만원**이지 1.2만원이\n아니다(단위 만원/평). 지역 시세 추이의 방향은 월 행을 눈으로 훑어 요약하지 말고\n`price_per_py_summary`(첫·최근·최저·최고 + 변화율 + 상승/하락/보합)를 인용하라.\n할인율은 분모가 둘이다 — `discount_rate`는 감정가 대비, `discount_vs_market_pct`는 시세\n대비이며 `min_bid_rate`는 할인율이 아니라 감정가 대비 **잔존 비율**이다. 각 값의 `*_text`에\n분모와 보수(補數)가 적혀 있으니 그대로 쓰라.\n\n대출·세금 규범 라우팅: \"지금 규제지역이야?\"·\"취득세율?\"·\"LTV 몇 %?\" 같은 **표 질문** =\nrealty_policy_rules(topic=regulated_area/acquisition_tax/loan_rules) → \"이 조건이면 얼마까지\n나와?\" 같은 **조건 계산** = realty_loan_limit(지역·시가·차주 유형을 선언하면 LTV·가액구간\n한도·만기·스트레스 DSR 중 뭐가 최종 상한인지 계산) → \"이 분양 당첨되면 내 돈으로 돼?\" =\nrealty_presale_funding_plan(공고 총소요×자기자금×규제 상한을 한 번에 — 계약금·중도금·잔금\n시점별 판정) → \"지금 팔면 양도세 얼마?\"·\"두 채 올해 같이 팔까 나눠 팔까?\" =\nrealty_capital_gains_tax(선언된 양도가·취득가·보유기간에 세율표 적용 + 합산 vs 연도분산 vs\n차손통산 시나리오 비교). **이 계산기는 1세대1주택 비과세·12억 초과 안분을 계산하지 않는다 —\n그렇다고 밖으로 내보내지 마라**: 갈림길 지도가 우리에게 있다. 비과세 가능성이 보이면\nrealty_policy_rules(topic='one_home_exemption_map')로 가라(5관문·5경로·확인 체크리스트 —\n\"2년 살면 비과세?\"·\"일시적 2주택인데 언제까지 팔아야?\"가 그 자리다). 그 지도의 관문을 다\n훑고도 사실판단이 남을 때만 세무사·홈택스 모의계산을 안내한다.\n→ \"투기과열지구 재개발 지금 사도 입주권 나와?\" =\nrealty_member_transfer_check(투기과열×사업유형×단계로 도시정비법 39조 판정 — 서울은 진행\n단계 자동 결합, 예외는 갈림길로만). 개인회생이 얽힌 질문은 **두 축으로 갈라 부른다** —\n신용·대출은 topic=credit_rehab(공공정보 등록·1년 성실변제 조기삭제·면책 규칙), **재산·주택은\ntopic=credit_rehab_property**(\"남편이 개인회생 중인데 집 살 수 있나\"·청산가치·가용소득·\n퇴직급여와 임차보증금의 압류금지 범위·인가 후 재산 증가·은닉의 경계). 생애최초·주택 수 해당 여부는 서버가\n판정하지 않으니 사용자에게 확인해 선언으로 넘겨라. 대출 규제 수치를 기억이나 웹검색으로\n때우지 마라 — 표가 근거·시행일과 함께 나온다.\n\n**\"이 아파트 내 마음대로 고칠 수 있나\" = realty_remodel_feasibility** (조문 전문은\nrealty_policy_rules topic=unit_alteration_rules). 두 축으로 갈라 답한다 — **벽**(내력벽을\n헐어 방을 틀 수 있나)과 **배관**(층상/층하 — 욕실·주방을 옮길 수 있나). \"벽식구조면\n리모델링 못 하죠?\"·\"내력벽 철거 2016년에 허용되지 않았나요?\"·\"욕실 위치 바꿀 수\n있나요?\"·\"인테리어 하는데 구청 가야 하나요?\"가 이 자리다.\n**이 축의 통설 둘은 틀렸고 도구가 조문으로 깬다** — ①내력벽 철거로 세대를 합치는 행위는\n지금도 금지다(주택법 시행령 [별표 4], 2017-02-13 개정판이 현행) ②\"벽식=개인 리모델링\n불가\"는 과장이다(세대 안 비내력벽은 철거 대상이 될 수 있다). 기억으로 답하지 마라 —\n조문 원문과 시행일이 값으로 나온다.\n**단지별 구조형식(벽식/라멘/무량판) 라벨은 이 서버에 없고 앞으로도 만들지 않는다.**\n건축물대장에 그 사실이 없기 때문이다(아파트 동 137,170개 중 라멘조 0건·자유서술 88%\n미기재). **준공연도로 추정하지도 마라** — 기둥식이 13.8%라 6~7건에 1건이 틀린다.\n단지 층은 2020~2026 분양 모집공고 인용뿐이고 **기존(준공된) 아파트는 0% 덮는다** —\n도구가 매 응답에 커버리지를 공시하니 그대로 전하고, 값이 없으면 unknown이라고 답하되\n응답의 how_to_find_out(관리사무소 설계도서·구청 행위허가 상담)으로 안내하라.\n\n운영자 전달: 사용자가 오류·불만·개선 희망·유료 이용 희망·후원 의사를 말하면 임의로 보내지 말고\n\"운영자에게 전해 드릴까요?\"를 한 줄로 물어라. 동의하면 report_issue(kind 결함·질문기록·유료이용문의·\n후원문의)를 부르고 접수번호(ref)와 회신 방법을 전하라. 거절·무반응이면 다시 묻지 않는다.\n사용자가 꺼내지 않은 전달·홍보 안내를 답에 싣지 마라.\n\n첫 질문 예시: 사용자가 무엇을 물을 수 있는지 묻거나 첫 질문을 망설이면 실제로 많이 들어온 아래 유형을 **질문 예로 보여 줘라**(먼저 조회하라는 뜻이 아니다 — 사용자가 고른 것만 답한다): “서울 송파구 아파트 법원경매 물건 중 매각기일이 다가오는 것 보여줘” / “수원지방법원 2025타경○○○○ 사건 감정가·최저가·유찰 이력 알려줘” / “서울 아파트 경매 최근 낙찰가율 알려줘” / “서울 송파구 헬리오시티 평형별 최근 실거래가 알려줘” / “서울 관악구 빌라(다세대·연립) 최근 매매 실거래가 알려줘” / “지금 접수 중인 경기 아파트 청약 공고 보여줘”. 같은 예가 이 서버의 prompts 목록에도 있다.\n",
