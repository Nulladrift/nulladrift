                "title": "Min Bid Count",
                "type": "integer"
              },
              "min_discount_pct": {
                "default": 30,
                "description": "감정가 대비 최소 할인율(%) (허용 범위 0~100)",
                "maximum": 100,
                "minimum": 0,
                "title": "Min Discount Pct",
                "type": "integer"
              },
              "sido": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "시도 (예: 세종, 경기도) ⚠️ '광주'는 광주광역시와 경기도 광주시 둘 다라 **한쪽으로 읽지 않고 거절한다**(error='sido_ambiguous') — 광역시면 '광주광역시', 경기도 광주시면 sido='경기도'·sigungu='광주시'로 갈라 넣어라.",
                "title": "Sido"
              },
              "sigungu": {
                "anyOf": [
                  {
                    "type": "string"
