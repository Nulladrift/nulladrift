          "description": "시군구 순위를 가격·상승률·전세가율 같은 축으로 조회한다.\n\n    지역(시군구) 순위를 조회한다 — \"제일 비싼 동네 어디야?\", \"요즘 많이 오른 지역은?\",\n    \"전세가율 높은 곳은?\"류 질문용.\n\n    price=거래량 가중 전용 평당가(최소 5건, 최신월은 집계 진행 중일 수 있음) ·\n    growth=면적대 하나 안의 YoY(기본 전용 60-85㎡, area_bucket으로 under60·85-115·over115 —\n    평형 구성 왜곡 제거). 응답 methodology의 산식·단위를\n    답변에 반영하라. investment=전세가율(시군구×전용평 셀로 매매·전세를 **같은 평형끼리** 짝지어\n    산출, 전 행이 같은 기준월·짝지은 건수 공시). 같은 평형·단지 수준은 realty_rental_yield.\n    **transit·school도 보류다**(2026-09-26, D-2026W39-16) — 입지 점수는 90점 이상이 86.7%라\n    변별력이 없어 지역 순위를 내지 않는다. \"교통 좋은 동네\"는 단지를 특정해\n    realty_location_scores의 location_facts(최근접역 거리·반경 안 정류장·학교 수)로 답하라.\n    비교 대상이 두어 곳으로 정해진 질문(\"A vs B 어디가 나아?\")은 [유료]\n    realty_compare_regions가 시세·추이를 나란히 준다 — 이 도구는 순위·탐색용이다.\n    ",
