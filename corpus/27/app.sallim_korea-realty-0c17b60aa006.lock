        {
          "name": "realty_vacant_housing",
          "title": "빈집(미거주주택) — 시군구 빈집 수·비율·건축연도·원인 유형",
          "description": "통계청 빈집(미거주주택) — 빈집 수·빈집 비율·전체 주택, 아파트/비아파트, 건축연도 구간, 원인 유형.\n\n    \"○○ 빈집 몇 채야\", \"빈집 왜 늘었어\", \"빈집률 높은 시\", \"과천 빈집\", \"지방 빈집\"류 질문의 자리다.\n    시군구를 주면 연도 시계열(2015~)·아파트/비아파트 분리·건축연도 구간(최근 2년 준공·1980년대·1979 이전 등)·\n    재고 대 세대 증감 분해·준공후 미분양 몫·**같은 유형(시·구·군) 안 백분위**·원인 유형 라벨\n    (정비사업 이주형·공급·입주형·인구유출·노후형·관광·세컨드형(추정), 규칙과 근거 수치 동봉)을 준다.\n\n    **결론에 반드시 옮길 것**:\n    · `definition` — 통계청 미거주주택은 조사 시점(11월 1일) 비어 있는 집 전부(매매·이사 대기·미분양 포함)이고\n      **법정 빈집(1년 이상 미사용)과 다르다.** 지자체 법정 빈집 실태조사 수치는 이 도구에 없다.\n    · 빈집 수(vacant_housing_count)와 빈집 비율(vacancy_rate_pct)을 섞지 마라.\n    · 원인 유형은 우리 규칙의 라벨이고, 빈집률로 가격을 내다보지 마라 — 같은 기간 동행 관측만 있다\n      (meta.findings_not_prediction).\n    · null 값은 0이 아니다 — null_reasons(KOSIS 비공개 'X' 등)를 옮겨라.\n    ",
