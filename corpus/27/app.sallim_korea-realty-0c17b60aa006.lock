          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5f951f065198dd7c3c94b613c0783737ffeaff8344515524f2a3066aa73c6bf"
        },
        {
          "name": "realty_auction_rights_analysis",
          "title": "경매 권리분석 — 낙찰받으면 뭘 떠안나(말소기준·인수/소멸·임차인·인수액)",
          "description": "이 경매 물건 낙찰받으면 뭘 떠안나 — 말소기준·인수/소멸·임차인 대항력·인수액.\n\n    법원 원장(매각물건명세서의 최선순위 설정·인수되는 권리 문구)에 사용자가 준 등기부 권리·임차인을\n    더해 **규칙으로 정해지는 부분만** 판정한다(LLM 없음): 권리 타임라인과 말소기준권리, 권리별\n    인수/소멸, 임차인별 대항력(전입 다음 날 0시 경계)·우선변제(확정일자 순위)·최우선변제(금액표는\n    말소기준이 아니라 최선순위 담보물권 설정일 기준), 예상 낙찰가를 주면 인수액 범위.\n\n    사용법: 사용자가 등기부등본을 첨부했으면 **그 문서를 읽어** registry_entries에 갑구·을구 권리를\n    순서대로 넣어라(이름·주민번호 제외). 임차인 정보가 있으면 tenants에. 둘 다 없으면 법원 원장만으로\n    돌리고 `on_hold`에 못 본 것이 적힌다.\n\n    경계 — 그대로 전하라: ①**법원 문구가 엔진 판정보다 앞선다**(충돌은 `conflicts`). ②명세서 칸이\n    공란이면 '인수 없음'이 아니라 **못 봄**이다(`assumption.verdict='not_seen'`). ③유치권·법정지상권·\n    분묘기지권·가처분의 피보전권리는 사실판단이라 **판정하지 않고** `on_hold`에 점검표로 준다.\n    ④등기부↔명세서 말소기준이 다르면 `cross_check` 경고. ⑤결과는 **정보 제공이지 법률 자문이\n    아니다** — 등기부·현황조사서·매각물건명세서 원문 대조를 권하라(`disclaimer`).\n    등기부 없이 원장만이면 realty_get_auction_case(rights_analysis=true)와 같은 결과다.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_no": {
