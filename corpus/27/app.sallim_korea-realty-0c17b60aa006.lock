        {
          "name": "realty_builder_presale_record",
          "title": "시공사·시행사별 분양 성적 — 공급·무순위·청약 배수",
          "description": "시공사·시행사별 분양 성적 — 공고 수·공급 세대·무순위(줍줍) 세대와 비율·청약 1순위 배수·미달 세대.\n\n    \"○○건설 분양 성적\", \"GS건설 현장 무순위 많이 나왔나\", \"대전 시공사별 분양\", \"이 시행사 다른 현장은\"류\n    질문의 자리다. builder(또는 developer)를 주면 그 회사 행과 **현장 목록**(단지·지역·공고일·공급·\n    무순위·비율·시행사)을, 아무것도 안 주면 공급 상위 N개 회사 순위를, region(시도)을 주면 그 시도로 좁힌다.\n    행마다 같은 창의 **전국 비율(baseline)**이 비교 기준으로 붙는다.\n\n    **결론에 반드시 옮길 것**(meta.disclosures):\n    · 무순위 세대는 **최종 미분양이 아니다**(당첨 후 계약 포기분 재공급). 무순위 뒤 남은 것은 별도 필드.\n    · 청약홈 밖 공급(지주택·자체분양·선착순·임의공급)은 없다 — 대구처럼 선착순으로 빼는 지역은 비율이 낮게 나온다.\n    · **재무 건전성 판정이 아니다** — PF·부채·보증은 DART 영역. \"위험\"·\"부실\" 같은 낙인을 붙이지 말고\n      수치와 전국 비율만 전하라.\n    · 공동시공은 각 사에 전량 귀속, 회사명 묶음은 우리 규칙, 무순위 연결률은 meta.match_rate.\n\n    view='sites'는 \"무순위 청약에서도 신청이 모자란 단지\" 목록이다 — 최근 회차 미달 세대(청약 미달이지 미판매·\n    계약 결과가 아니다)와 시군구 미분양 추이. 그 뒤 선착순 판매 여부는 모른다(meta.disclosures).\n    **브랜드명(자이·래미안)으로 공고 개수를 세는 질문은 이 도구가 아니다** — realty_notice_facts(keyword).\n    ",
