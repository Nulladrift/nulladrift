        {
          "name": "realty_subscription_score",
          "title": "청약 가점 계산 — 선언된 기간·인원에 배점표(84점) 적용",
          "description": "민영주택 일반공급 청약 가점(만점 84)을 배점표로 계산한다.\n\n    민영주택 일반공급 가점제 점수(만점 84)를 **선언된 값**에 배점표를 적용해 계산한다 —\n    무주택기간 32 + 부양가족 35 + 통장 가입기간 17. \"내 청약 가점 몇 점이야?\"의 자리다.\n\n    경계를 지켜라: ① 세 입력 전부 **선언**이다 — 기산점·부양가족 인정은 등본·혼인관계\n    사실판단이라 서버가 판정하지 않고, 응답 traps(오기입=부적격 당첨 취소 사유)를 반드시\n    함께 전하라. ② 산출 점수는 realty_subscription_odds의 my_score로 넘겨 당첨 커트라인과\n    비교하는 것이 다음 수다. ③ 배점표 원문·기산 규칙은\n    realty_policy_rules(topic=subscription_account)가 진실원이다.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_years": {
                "description": "청약통장 가입기간(년, 소수 허용 — 예: 0.4=약 5개월). 전환 통장은 종전 통장 최초 가입일 기준 (허용 범위 0~60)",
                "maximum": 60,
                "minimum": 0,
                "title": "Account Years",
                "type": "number"
              },
              "dependents_count": {
                "description": "부양가족 수(본인 제외). 직계존속 3년 동거·30세 이상 미혼자녀 1년 동거 등 인정 요건은 사실판단 — 확정해 선언한다 (허용 범위 0~20)",
                "maximum": 20,
                "minimum": 0,
                "title": "Dependents Count",
                "type": "integer"
              },
              "is_homeowner": {
