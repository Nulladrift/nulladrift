        {
          "name": "search",
          "title": "경매 물건 검색",
          "description": "법원경매 물건을 자연어 문장으로 검색한다(경매 전용 — 청약·시세는 다른 도구다).\n\n    법원경매 물건을 자연어로 검색한다. **경매 전용** — 청약·분양 공고는 realty_presale,\n    분양가 적정성은 realty_presale_vs_market, 시세 통계는 realty_region_price_stats.\n\n    지역·물건종류·유찰횟수·감정가를 질의에서 뽑아 필터링한다.\n    예: \"서울 강남구 아파트\", \"유찰 2회 이상인 경기도 오피스텔\", \"서울 아파트 감정가 5억 이하\".\n\n    이 파서는 최소 어댑터라 못 쓰는 축(면적·기일·층 등)이 있다. 못 쓴 조건은 응답의\n    `unapplied_conditions`에 적히므로, 그게 비어 있지 않으면 결과 범위를 좁게 오인하지 말라.\n    지역·종류·감정가·유찰횟수라면 `realty_search_auctions`로 값을 직접 지정해 다시 조회하면\n    되지만, **면적·층·기일 범위는 그 도구에도 인자가 없다**(외부 QA 2026-10-04 ③) — 기일은\n    `exclude_past=true`(오늘 이후만)·`sort=\"date_asc\"`까지만 되고, 면적·층은 결과 행과\n    `fetch` 상세의 값을 보고 직접 걸러야 한다. 없는 인자로 재호출하라고 안내하지 마라.\n\n    각 결과의 id는 이어서 fetch(id)에 그대로 넣으면 상세를 볼 수 있다.\n\n    **이 축의 자리** — 경매 검색은 둘이고 입력 형태로 갈린다. 사용자의 말을 문장 그대로\n    넘길 때가 이 도구(`search`)이고, 지역·종류·감정가·유찰횟수를 **값으로 이미 알 때**는\n    `realty_search_auctions`다(면적·층·기일 범위는 **어느 쪽에도 필터가 없다** — 위 참조).\n    상세는 `fetch`로 이어간다 — 여기 나온 id를 그대로 넣으면 된다.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "경매 물건을 찾는 **자연어 한 줄**. 예: '서울 강남구 아파트' · '유찰 2회 이상인 경기도 오피스텔' · '서울 아파트 감정가 5억 이하'. 이 파서가 읽는 축은 넷뿐이다 — 지역(시도는 '서울'·'서울특별시' 둘 다 되고, 시군구는 '강남구'·'평택시'처럼 원장 표기, 특례시는 '수원시 권선구'), 물건종류(아파트·오피스텔·다세대·연립주택·단독주택·근린시설·상가·대지·임야·전답 등), 유찰횟수, 감정가(억/만원 표기). 면적·기일·층은 못 읽고 unapplied_conditions로 실토한다 — **realty_search_auctions에도 면적·층·기일 범위 인자는 없다**(기일은 exclude_past=true로 오늘 이후만 남기고 sort=date_asc로 가까운 순 정렬까지만 된다). 면적·층은 결과 행·fetch 상세의 값을 보고 직접 걸러라. 사건번호를 이미 아는 경우는 검색이 아니라 realty_get_auction_case다",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
