          "name": "realty_supply_demand_balance",
          "title": "시군구 수급 균형 — 입주 예정 대 세대 증가",
          "description": "시군구마다 앞으로 들어올 아파트와 늘어나는 세대를 같은 창으로 나눠 수급을 판정한다.\n\n    \"○○ 공급 과잉이야?\", \"세종 대전 서울 경기 수급\", \"어디가 입주 대비 수요가 많아?\"류 질문의\n    자리 — 입주(청약홈 공고, 향후 N개월)를 연 단위로 환산해 최근 12개월 세대 증가로 나눈\n    **비율**과 판정(과잉 >1.5 · 공급 우위 1~1.5 · 균형 0.5~1 · 부족 <0.5 · 세대 감소 중)을 주고,\n    같은 행에 교차검증 신호(순이동·매매 거래량 증감·전세/월세 증감과 월세 비중·1순위 경쟁률·\n    낙찰가율·미분양)를 싣는다. 판정과 신호가 엇갈리면 `conflict`에 적는다.\n\n    **결론에 반드시 옮길 것**:\n    · 입주는 **하한**이다 — 정비사업 조합원분이 공고에 없어 서울처럼 재건축 비중이 큰 곳은\n      '부족'이 실제보다 과장된다. `meta.disclosures`를 그대로 전하라.\n    · `permit_pipeline_households`(사업승인 기준)는 **입주에 더하지 마라**(이중계상).\n    · `denominator_unstable=true`면 비율이 분모 탓에 흔들린다 — 배수를 단정하지 마라.\n    · 판정 구간은 **우리 규칙**이지 공식 기준이 아니다. 호가 매물·비아파트는 데이터에 없다.\n    · 지표마다 기준 시점이 다르다 — `meta.series_as_of`로 밝혀라.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "horizon_months": {
                "default": 24,
                "description": "입주를 **다음 달부터 몇 개월** 볼지(기본 24). 비율은 이 창을 연 단위로 환산해 12개월 세대 증가와 나눈다. 30개월을 넘기면 뒤쪽은 아직 공고 전이라 과소로 나온다 (허용 범위 6~60)",
                "maximum": 60,
                "minimum": 6,
