              "region": {
                "description": "시도(예: '경기', '서울', '세종') 또는 시군구(예: '평택시', '서울 강남구'). 시도를 주면 소속 시군구 표 + 시도 합계, 시군구를 주면 그 행 + 시도 합계. 동명 시군구('중구')는 시도를 붙여라 — 안 붙이면 후보를 돌려준다. '광주'는 광역시·경기 광주시가 갈려 '광주광역시' 또는 '광주시'로 줘라",
