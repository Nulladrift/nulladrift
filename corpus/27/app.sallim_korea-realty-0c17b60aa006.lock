        {
          "name": "realty_move_in_supply",
          "title": "입주 예정 물량 — 입주장 리스크",
          "description": "지역의 입주 예정 물량을 연월별로 집계한다.\n\n    지역의 입주 예정 물량을 연월별로 집계한다 — \"○○ 입주장 리스크 있어?\", \"내년에\n    입주 물량 얼마나 쏟아져?\"류 질문용. 입주 몰림은 전세가 하락·역전세 압력 신호다.\n    **region·sigungu를 둘 다 비우면 전국 호출**이고 응답에 `by_sido`(시도별 세대·공고 수,\n    세대 내림차순, 시도 미상 공고는 sido=null로 따로)가 실린다 — 시도 비교에 시도마다\n    따로 부르지 마라.\n\n    **기본 창은 오늘부터 앞이다** — from_ym을 안 주면 이번 달에서 시작하므로 months=12는\n    \"앞으로 12개월\"이지 \"최근 12개월\"이 아니다. **과거를 물었으면 from_ym을 과거로 줘라**\n    (최근 12개월 = from_ym='YYYYMM'(12개월 전) + months=12). 응답 meta.window_direction이\n    그 회차의 창이 과거인지 미래인지를 라벨로 실토하니 결론에 기간을 그대로 밝혀라.\n\n    **하한 집계다** — 청약홈 공고(2020-02 이후) 기반이라 공고 없는 공급(민간임대·후분양\n    일부)이 빠지고, 무엇보다 **공고는 입주 평균 30개월 전에 난다**(전국 실측). 그래서\n    조회 구간이 오늘+30개월을 넘어가면 그 구간 입주분은 아직 공고조차 안 된 것이 대부분이다.\n    실사고: 세종 2028~2030 조회에 676세대가 나오자 \"입주장 리스크 없음\"으로 답했으나\n    실제 계획은 그 6배였다.\n\n    응답의 **`reading` 문장을 결론에 그대로 반영하라** — `interpretation`이 `lower_bound`면\n    \"물량 없음/적음\"이라 말하지 말고 \"공고된 것만 N세대(하한)\"라고 답해야 한다.\n    `coverage.region_recent_annual_rate`(그 지역 최근 공고 실적)와 비교해 값이 크게 낮으면\n    공급이 끊긴 게 아니라 공고 시차다. **그때는 realty_supply_pipeline을 이어서 부르거나 include_pipeline=true로 함께 받아라** —\n    사업승인은 났지만 아직 공고 안 난 물량이 거기 있다(세종 실측: 이 도구 676세대 →\n    파이프라인 3,483세대). 단 **두 축의 세대수를 더하지 마라**(이중계상) — 공고가 난\n    단지는 승인 목록에도 남아 양쪽에 다 잡힌다. 파이프라인 쪽 값이 상위 집합에 가깝다.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_ym": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "조회 창의 **시작** 월, YYYYMM 6자리(예: 202508). 생략하면 **이번 달**이라 창이 전부 미래가 된다 — 이 도구의 기본 방향은 '입주 **예정**'이라서다. **'최근 N개월'·'지난해'처럼 지나간 물량을 물었으면 여기를 과거로 줘라**: 최근 12개월 = from_ym='202508' + months=12, 작년 한 해 = from_ym='202501' + months=12. 과거 조회도 그대로 된다(원장은 2020-02 공고분부터)",
                "title": "From Ym"
              },
              "include_pipeline": {
                "default": false,
                "description": "true면 **아직 모집공고 전인** 예정 공급(사업계획승인 기준 — realty_supply_pipeline과 같은 값, 같은 지역·같은 창)을 `pipeline`에 함께 싣는다. 두 축은 더하지 마라(이중계상)",
                "title": "Include Pipeline",
                "type": "boolean"
              },
              "months": {
