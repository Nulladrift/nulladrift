        {
          "name": "realty_complex_pyeong_price",
          "title": "단지 평형별 매매 실거래 내역",
          "description": "특정 단지·특정 평형의 최근 6개월 매매 실거래를 건별(계약일·층·가격)로 조회한다.\n    평형별 시세 요약만 필요하면 realty_search_complexes의 prices_by_area로 충분하다.\n\n    응답에는 **층 밴드별 시세 집계 `price_by_floor_band`**(저층~초고층 밴드별 평균가·건수·\n    최저 밴드 대비 프리미엄 %)가 함께 온다 — \"저층 사면 손해야?\", \"고층 프리미엄 얼마야?\"류\n    **층별 시세 질문은 이 도구가 담당**이다(한 단지·건별). 여러 단지 층 분해·기준일 전후 비교·\n    6개월 넘는 창은 realty_region_price_stats(compare_from) 한 번으로.\n\n    transactions는 **계약일 내림차순**이고, average_price·median_price는 그 정렬 기준\n    최근 5건(summary_basis에 그 5건을 그대로 싣는다)이다. 이상 거래는 지우지 않고\n    `outlier=true`로 표시만 하며(판정 근거는 outliers.method), 층 밴드에는 이상치 제외 값을\n    `*_ex_outliers`로 병기한다 — **밴드 프리미엄이 몇 건의 산물인지 확인하고 말하라.**\n\n    **이름이 더 긴 이웃 단지는 분리해서 뺀다**('○○센트레빌'에서 '○○센트레빌Ⅱ'). 무엇을 뺐는지·못 가른\n    면적이 무엇인지는 `meta.complex_isolation`에 그대로 실린다. **못 가른 것은 빼지 않고\n    못 갈랐다고 적는다** — 그 평형 수치는 단정하지 말고 그 사실을 함께 전하라.\n\n    **면적은 사용자가 말한 단위 그대로 넣어라 — 환산은 서버가 한다**:\n    - ㎡로 말했으면 → area_m2_exclusive(전용 84㎡ → 84) / area_m2_supply(공급 112.8㎡ → 112.8)\n    - 평으로 말했으면 → pyeong_supply(분양 \"34평\") / pyeong_exclusive(전용 실평수 25.4평)\n    **평형을 모르면 면적 없이 불러라** — 거절하지 않고 이 단지의 평형별 요약과 평형마다\n    다시 부를 인자를 준다(평형을 추측해 넣지 마라). '최근 거래 있었나'는 그 요약의 latest_contract로 답한다. ㎡ 값을 평 인자에 넣으면 조용히 환산하지 않고 사유와 두\n    방향 출구를 값으로 적어 거절한다.\n    이 도구는 매매 전용이다 — 전월세는 realty_complex_rent_by_pyeong을 쓴다. 매매 창이 얇은\n    신축은 분양권·입주권 전매 거래를 `presale_rights_trades`에 **따로** 싣는다(전매가 — 매매 시세 아님).\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
