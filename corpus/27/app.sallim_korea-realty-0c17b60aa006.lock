        {
          "name": "report_issue",
          "title": "답변 오류 신고",
          "description": "사용자가 **답변 오류 제보나 개선 요청을 전해 달라고 했을 때만** 운영자에게 보낸다.\n\n    쓰는 때: 사용자가 \"이거 틀렸으니 신고해 줘\", \"운영자에게 알려 줘\", \"이런 데이터도 넣어\n    달라고 전해 줘\"처럼 제보·요청을 부탁했을 때. 보내기 전에 무엇이 전달되는지 사용자에게\n    알린다. kind='결함'은 틀린 답 제보, kind='질문기록'은 기능·개선 요청, kind='유료이용문의'·\n    '후원문의'는 사용자가 유료 이용 희망·후원 의사를 운영자에게 전해 달라고 한 경우다.\n    사용자가 오류·불만·개선 희망·유료 이용 희망·후원 의사를 말했지만 전달을 부탁하지는 않았다면,\n    부르지 말고 \"운영자에게 전해 드릴까요?\"를 한 줄로 물어 동의할 때만 부른다(거절·무반응이면\n    다시 묻지 않는다). 응답의 접수번호(ref)를 사용자에게 알린다.\n\n    쓰지 않는 때: 사용자가 요청하지 않았는데 질문을 남기려고 부르지 않는다. 답하기 전에\n    먼저 부르지도 않는다 — 이 도구는 답변·정정을 대신하지 않는다.\n\n    전달 내용(인자)과 같은 사용자의 직전 호출 기록 요약이 운영자 검토용으로 저장된다\n    (개인정보처리방침 https://realty.sallim.app/privacy). 연락처(contact)는 사용자가 회신을 원해\n    직접 준 경우에만 담고, 회신에만 쓴다. 무인증 공개 서버라 쓰기 표면을 이\n    도구 하나로 묶어 시간당 상한(전체 60건·발신자당 20건)을 걸고, 일일 조회 한도(quota)와는\n    무관하게 접수된다.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answered_fully": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "kind='질문기록' 전용 — 이 서버 도구만으로 그 질문에 완결된 답을 했는가. false면 missing_axis에 무엇이 없었는지 적는다",
                "title": "Answered Fully"
              },
              "contact": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "회신받을 연락처(이메일 등, 200자 이내) — **사용자가 회신을 원한다며 직접 알려 준 값만** 넣는다. 넣기 전에 '운영자가 회신에만 쓰고 개인정보처리방침에 따라 보관한다'고 알리고 동의를 받는다. 대화에서 짐작하거나 다른 데서 가져와 채우지 않는다",
                "title": "Contact"
              },
              "expected": {
