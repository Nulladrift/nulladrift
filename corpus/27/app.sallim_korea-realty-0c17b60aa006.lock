        {
          "name": "realty_presale_vs_market",
          "title": "분양가 적정성 분석 — 분양가 vs 주변 실거래 시세",
          "description": "청약(분양) 공고의 분양가가 주변 실거래 시세 대비 싼지/비싼지를 주택형별로 계산한다.\n    \"이 청약 넣을 만해?\", \"분양가 적정해?\"류 질문의 정량 근거 — 웹검색으로는 못 하는\n    분양가×실거래 조인 계산이 이 도구의 존재 이유다.\n\n    공고 특정: house_manage_no가 없으면 region+keyword로 검색하고, 여러 건이면\n    후보 목록을 돌려주니 하나를 골라 다시 호출하라(추측해서 고르지 않는다).\n    기준선: 평형 행의 gap_pct는 gap_basis가 말하는 기준 대비다 — 인근 비교단지가 충분하면\n    **공고 좌표 반경·준공 연도 조건·같은 평형대 비교군**(nearby_baseline) 대비이고, 아니면\n    지역(공고 시군구, 없으면 시도) 실거래 평균(구축·외곽 포함, 이상치 미필터) 대비다. 지역 평균 대비 값은\n    gap_pct_region_avg에 늘 따로 있고, 두 기준선이 크게 갈리면 baseline_divergence가\n    붙는다 — 그때 지역 평균 대비 수치로 '비싸다'를 말하지 마라. 청약 경쟁률·당첨 가점\n    커트라인은 realty_subscription_odds에 있다(\"넣을 만해?\"엔 둘을 같이 써라).\n    지역 수준 교차확인은 realty_area_price_bands(이상치 필터·중앙값)로 하라.\n    이 도구는 **현재 공고 1건의 적정성**이다 — 같은 지역 공고들의 분양가 시계열\n    (\"기다릴수록 얼마씩 올랐나\")은 realty_presale_price_trend.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
