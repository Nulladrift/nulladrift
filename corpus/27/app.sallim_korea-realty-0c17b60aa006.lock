        {
          "name": "realty_auction_alerts",
          "title": "급매 경매 물건",
          "description": "유찰이 쌓여 최저입찰가가 크게 떨어진 경매 물건을 골라낸다.\n\n    유찰이 누적돼 최저입찰가가 크게 떨어진 물건을 찾는다. \"○○에서 유찰 많은 물건\"은\n    sido/sigungu로 좁혀라.\n\n    유찰이 많다는 건 싸다는 뜻이기도 하지만 권리관계·물건 하자 등 팔리지 않는 이유가\n    있다는 뜻이기도 하다. 결과를 추천으로 제시하지 말고 확인이 필요한 후보로 제시하라.\n\n    **같은 축의 다른 문**: realty_search_auctions(min_bid_count)로도 유찰 물건을 거를 수\n    있다 — 조건 필터·목록이 목적이면 그쪽, 저감 큰 후보 발굴(극단 할인 컷 포함)이면 이쪽.\n    둘을 합쳐 세지 마라(같은 물건이 양쪽에 나온다).\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "반환 개수 (최대 50) (허용 범위 1~50)",
                "maximum": 50,
                "minimum": 1,
