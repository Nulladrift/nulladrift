          "name": "realty_location_scores",
          "title": "단지 입지 원시값(역 거리·주변 학교·정류장 수) + 참고 점수",
          "description": "단지 입지를 **원시값**으로 답한다 — \"역세권이야? 학군 어때? 병원 가까워?\" 담당.\n\n    **답은 행마다 맨 앞의 location_facts로 하라**: 최근접 지하철역 이름·노선·직선거리(m,\n    상한 없음 — 시골 단지는 30km도 그대로 나온다), 반경 500m·1km 안 역·버스 정류장 수,\n    1km 안 초·중·고 수와 최근접 초등학교 거리, 반경 안 병원(전 의료기관·병원급 분해)·마트\n    수. 전부 poi 원장에서 직접 센 값이라 재현할 수 있다. \"역세권이야?\"는\n    subway.nearest_distance_m와 walk_band로, \"초품아야?\"는 schools.nearest_elementary로 답하라.\n\n    같은 행의 transit_score·school_score는 **미검증 참고값**이다(응답 score_demotion) —\n    transit 90점 이상이 82%(2026-10-17)이고 역이 5km 넘게 떨어진 단지도 90점이 나와 변별력이 없다.\n    **점수로 순위를 매기거나 '역세권·학군 좋음'을 판정하지 마라.** 점수가 null이면 미측정이지\n    0점이 아니다. 학군 점수는 진학률·학원·학교 수 합성(v5)이지 학교 배정이 아니다.\n\n    complex_key/complex_name이면 단지 행(원시값은 앞 5개 단지), region만 주면 지역 집계 +\n    점수 상위 5 단지(점수 순이라 순위로 인용 금지). 여러 단지는 단지마다 부르지 말고\n    realty_search_complexes 한 번으로 받되 순위는 price_per_exclusive_m2로. 점수가 없는 단지도 색인에 좌표가 있으면\n    원시값을 준다. 없는 단지는 not_found — 지어내지 말고 realty_search_complexes로 실존부터\n    확인하라. complex_key는 공백 1칸으로 정규화돼 다른 도구에 그대로 넣을 수 있다.\n    시설 **목록**(이름별 거리)이 필요하면 [유료] realty_poi_nearby.\n    **거주 후기·평판(\"살기 좋대?\"·\"주민들 평 어때?\")은 이 데이터에 없다** — 시설 개수는 평판의\n    대용이 아니니 그런 질문에는 이 도구를 부르지 말고 데이터에 없다고 답하라.\n    ",
