        {
          "name": "realty_search_complexes",
          "title": "아파트 단지 검색·평형별 시세",
          "description": "아파트 단지를 이름·지역으로 검색하고 **평형별 실거래 시세**를 함께 돌려준다.\n    \"○○아파트 34평 얼마야\"류 단지 질문의 1차 도구다. query·region 중 하나는 필수.\n\n    **이 축의 자리(시세 도구 3종 중)**: 단지가 특정되면 **이게 기본**이다. 지역 평균\n    도구들(realty_region_price_stats·realty_area_price_bands)은 단지 간 편차를 뭉개므로\n    단지 질문에 쓰지 마라 — 같은 동 같은 평형에서 단지 평균이 24% 벌어진 실측이 있다.\n    반대로 지역 전체의 수준·추이 질문이면 저 둘로 가라.\n\n    prices_by_area가 평형별 시세다 — pyeong_exclusive(전용평)와 pyeong_supply_est(분양평\n    어림)를 병기하므로, 사용자가 말한 \"34평\"(보통 분양평)은 pyeong_supply_est로 맞춰 답하라.\n    단지 수준 avg_price는 전 평형이 섞인 평균이니 평수 질문에 쓰지 말 것.\n    층별(저층/고층/RR) 시세·프리미엄 질문은 realty_complex_pyeong_price로 —\n    거기 층 밴드별 집계(price_by_floor_band)가 있다(이 도구엔 층 축이 없다).\n    응답의 complex_key는 realty_complex_rent_by_pyeong·[유료] 단지 도구들에 그대로 넣는 키다.\n\n    **단지끼리 급을 견줄 때는 price_per_exclusive_m2(전용 ㎡당 실거래 단가)를 축으로 쓰라**\n    — 행마다 실리고, **sort='unit_price'로 그 순서대로 받을 수 있다**(백엔드에 없는 축이라\n    이 응답에 실린 행만 다시 세운 것이다 — sort_applied.scope 참조). 행의 scores\n    (composite·convenience)는 걸어서 닿는 **시설의 개수**이지 선호도가 아니다(직선거리만\n    세어 간선도로 횡단 같은 보행 장벽을 못 본다) — 그 점수로 단지에 줄을 세워 추천하지\n    마라. 입지 점수는 **미검증 참고값**이다(scores_meaning.status — transit 90점 이상 82%, 2026-10-17).\n    \"역세권이야?\"는 행의 nearest_station·subway_distance_m(직선 m)으로 답하라.\n    응답의 scores_meaning·unit_price_axis에 근거가 있다.\n\n    **견줄 때는 조건을 맞춰라 — 두 인자가 그 수단이다.** ㎡단가는 평형이 작을수록,\n    준공이 새로울수록 높다(⚠️ **전국 중앙값 이야기다** — 서울은 구축이 더 비싼 동이 30.1%다).\n    `area_band_m2=59`면 각 단지의 대표 단가가 **전용 59±3㎡ 행만으로** 다시 계산되고,\n    `construction_year_band=2018`이면 2013~2023년 준공 단지가 비교군으로 표시된다\n    (in_year_band). 연식이 더 지배적이다 — 법정동 안 ρ 중앙값이 연식 +0.7381 대\n    평형 +0.2143이라, 연식이 섞인 ㎡단가 순위는 **사실상 신축 순**이 되기 쉽다. 두 인자 모두\n    **가격 계산·비교군 표시에만** 걸리고 단지 검색을 거르지 않는다(못 잰 단지는 목록에\n    남고 값이 null + 사유다). 몇 개를 쟀고 몇 개를 못 쟀는지는 응답의 coverage가 적는다.\n\n    **0.84.0부터 scores.composite는 school + convenience다**(transit을 뺐다 — 전국 실측에서\n    고유값의 83.5%가 90~100에 몰려 변별력이 없고, 합산에 넣으면 법정동 격자 ρ 중앙값이\n    0.1028→0.0857로 떨어진다 · 2026-11-05 재측정). 백엔드 원장의 옛 가중평균 값은 **composite_legacy로 병기**하니 이전 응답과\n    견줄 때 그쪽을 쓰라 — 두 값은 척도가 다르다(가중평균 대 단순합).\n\n    **세대수 조건은 min_households·max_households가 받는다**: \"500세대 이상\", \"1,000세대 넘는 대단지\", \"300세대 이하 소규모\"는\n    이 인자로 넣어라 — 종전엔 전달할 자리가 없어 그 질문이 통째로 실패했다. 행마다\n    households가 실린다. **households가 null인 단지는 세대수가 원장에 없는 것이지\n    작은 단지가 아니다** — 그래서 세대수 조건을 걸면 그 단지들은 크든 작든 제외되고,\n    몇 건이 그렇게 빠졌는지는 meta.households_scope가 적는다.\n\n    **'3억 이하 오래된 아파트'는 max_trade_price_10k·max_construction_year·sort='year_asc'가\n    받는다**: 예) region='노원구',\n    max_trade_price_10k=30000, max_construction_year=1996, sort='year_asc', period_months=12.\n    거래가 상한은 평균가가 아니라 **창 안 최저 실거래가**로 판정한다(행의 min_trade_price).\n    '재개발 호재'는 이 도구 축이 아니다 — 정비사업 구역은 realty_redevelopment(전체 표면).\n    단지 평판·거주 후기(\"살기 좋대?\")는 원장에 없다 — 부르지 마라.\n\n    **거래 적은(환금성 낮은) 단지 확인 = sort='turnover_asc'** — 행마다 turnover_pct(창 안 매매\n    건수 ÷ 세대수 × 100, 창 그대로)와 turnover_pct_annualized(12개월 환산)가 실린다. 사실값이다 —\n    회전율이 낮다고 투자 부적격이라 판정하지 않는다. 세대수 미상이면 null + 사유(미상 ≠ 저회전).\n    ",
