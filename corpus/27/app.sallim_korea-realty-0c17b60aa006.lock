        {
          "name": "realty_complex_report",
          "title": "[유료] 단지 통합 리포트",
          "description": "[유료] 단지 하나의 시세·전세·기본정보를 통합 조회한다.\n\n    입지는 **location.facts(원시값)로 답하라** — 최근접역 이름·직선거리, 반경 500m·1km 안\n    정류장·병원·마트 수와 1km 안 초·중·고 수를 poi 원장에서 직접 센 값이다. location.overall_score·scores는\n    미검증 참고값이라(location.score_demotion) 순위·비교·'입지 좋음' 판정에 쓰지 마라.\n    응답에 좌표(latitude/longitude)와 complex_key가 들어 있다 — 이어서\n    realty_poi_nearby(시설 목록)·realty_predict_price(예측)에 그대로 넣어 심층 분석하라.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "complex_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
