          "name": "realty_onbid_sale_rate",
          "title": "공매 낙찰가율·개찰 결과 통계",
          "description": "공매가 \"보통 감정가의 몇 %에 낙찰되나\"와 \"얼마나 유찰되나\"를 실제 개찰 결과로 답한다.\n\n    **법원경매의 realty_auction_sale_rate와 같은 이름의 다른 지표다.** 분모가 둘 다\n    감정가지만 평가 주체·저감 규칙·매물 성격이 달라 **두 %를 한 문장에 섞으면 안 된다**.\n    \"경매 낙찰가율\"을 물었으면 어느 쪽인지 확인하라.\n\n    **이 축의 자리** — 공매 축 2종 중 통계 쪽이다. 개별 물건과 회차별 최저가는\n    realty_search_onbid다. 낙찰가율은 재산구분별로 갈라 읽어라(`by_property_type`).\n\n    ⚠️ **낙찰가율은 처분방식이 '매각'인 낙찰만 센다.** 임대(임대료 입찰) 낙찰은 같은 축이\n    아니라 `lease_bids`에 건수·중앙값을 따로 낸다 — 둘을 합쳐 인용하지 마라.\n\n    ⚠️ **표본은 2026-06-01 개찰분부터 누적이고, 그중 '낙찰' 건만 낙찰가율에 든다.**\n    범위·행 수는 응답 `sample_period`(`ledger`)가 정본이다 — 고정 기간이 아니다.\n    낙찰 외 행은 유찰·취소·개찰중이다. `outcome_mix`가 그 분포이고 여기서 나온 낙찰 비율은\n    **성립률이지 낙찰가율이 아니다**.\n\n    ⚠️ **낙찰가율은 원천이 준 값을 그대로 쓴다**(`apslPrcCtrsScfbPrcRto` = 감정가 대비\n    낙찰가율). 낙찰 건 일부에는 이 값이 없다 — 감정가가 원장에\n    없는 건이라 **모르는 것이지 0이 아니다**(그 수가 `ratio_missing`).\n\n    ⚠️ **평균이 아니라 중앙값을 인용하라.** 지분·산지 물건이 감정가의 몇 배에 팔리는 사례가\n    있어(공유자 경합) 평균이 위로 끌린다. `median_pct`가 정본이고 `p25_pct`·\n    `p75_pct`로 폭을 함께 전하라.\n\n    ⚠️ **지역은 물건명에서 되찾은 것이다.** 입찰결과 원장에 지역 컬럼이 아예 없어서,\n    물건 목록과 붙여 보려 했으나 **낙찰 건 중 물건 목록에서 찾아지는 것은 극히 일부다**\n    (2026-08-22 실측 2.2%) — 물건 목록은 현재 진행분 스냅샷이라 이미 팔린 물건이 빠져 있다.\n    그래서 물건명 접두의 시도·시군구 표기를 파싱해 쓴다(2026-08-22 실측 전체 96.1%·낙찰 90.0%에서 잡힌다).\n    파싱이 안 된 건은 지역 필터에서 **조용히 빠지므로** 응답의 `region_basis`를 함께 전하라.\n    ",
          "inputSchema": {
