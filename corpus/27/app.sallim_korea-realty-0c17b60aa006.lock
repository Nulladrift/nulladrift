        {
          "name": "realty_public_rental_notices",
          "title": "공공임대 모집공고 — LH 행복주택·국민임대·매입임대 등 마감 전 공고(접수 예정 포함)",
          "description": "마감 전 공공임대 모집공고(접수 예정 포함) — LH 행복주택·국민임대·영구임대·통합공공임대·공공임대·매입임대·전세임대.\n\n    \"행복주택 모집 공고 있어?\", \"서울 청년 전세임대 지금 신청돼?\", \"경기 매입임대 모집\", \"LH 임대 공고\"류\n    질문의 자리다. 공고마다 유형·지역·진행상태·마감일·남은 일수와 **원문 공고 주소(source_url)**를 준다.\n    마감 임박 순이고 총계(meta.total_matched)·잘림(meta.truncated)이 함께 나온다.\n\n    **결론에 반드시 옮길 것**:\n    · 원천은 LH 공고(+마이홈의 LH 밖 공급기관 일부)다. **SH·GH·iH 등 지방공사 자체 공고와 장기전세는 없다**\n      — 0건이나 적은 건수를 '모집이 없다'로 말하지 마라(meta.coverage.not_covered).\n    · 자격(소득·자산·무주택) 판정은 하지 않는다 — 신청 가능 여부는 source_url 공고문으로 안내하라.\n    · 수집 시각은 meta.freshness다 — 캐시라 그 뒤 공고는 없다.\n    · 마감 전이면 **접수 시작 전 공고도 든다**(LH 공고중·status 접수예정) — '지금 신청 가능'으로 말하지 말고\n      접수 기간은 공고문으로 확인하라. 지금 접수 중이 확실한 것은 status 접수중뿐이다.\n    ",
