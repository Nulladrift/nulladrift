        {
          "name": "realty_get_auction_case",
          "title": "경매 사건 상세 조회",
          "description": "사건번호로 경매 물건의 상세를 조회한다.\n\n    재매각 사건의 입찰보증금처럼 **사건마다 다른 매각조건** 질문도 사건을 특정하는 여기서 시작한다.\n    사건번호는 법원 간 유일하지 않다(전국 평균 2.8개 법원에서 중복). court_name을 생략하면\n    중복 시 오류와 함께 후보 법원 목록이 돌아오니, 그걸 보고 법원을 지정해 다시 호출하라.\n\n    `rights` = 매각물건명세서 핵심(최선순위 설정·인수되는 권리 원문·위험 플래그·배당요구종기).\n    `rights` 자체는 법원 공시의 전달이다 — 답할 때 rights.disclaimer를 함께 전하고, 등기부·임차인\n    현황 전체가 아님을 밝혀라. 규칙으로 판정한 권리분석(말소기준·인수/소멸·대항력)이 필요하면\n    `rights_analysis=true`(원장만) 또는 realty_auction_rights_analysis(등기부·임차인 입력)를 써라. rights가 null이면 명세서 미수집·보류\n    상태(rights_note에 사유)이므로 권리관계를 절대 지어내지 말 것.\n    ⚠️ `rights.claim_amt_10k`는 **경매신청 채권자의 청구금액**(만원)이다 — 임차인\n    보증금이 아니다(claim_amt_note 참조). 보증금 액수는 이 데이터에 없다.\n    `min_bid_source`가 item_list면 최저가가 낡았을 수 있다 — 함께 오는 `min_bid_note`를\n    사용자에게 전하고 단정하지 마라(목록 도구와 같은 경고다).\n    유찰 이력·기일별 저감·사진은 realty_auction_history가 담당이다.\n    재매각 보증금 비율은 법원이 사건마다 정하는 특별매각조건이라 규범 표에 없다 — 응답에 그 값이\n    없으면 매각물건명세서·매각기일 공고에서 확인하라고 전하라(비율을 기억으로 단정하지 말 것).\n\n    **이 축의 자리** — 사건번호·법원명을 **따로 받아 구조화 필드**로 돌려주는 상세가 이\n    도구다. `search` 결과의 id(`\"법원명|사건번호\"`)를 그대로 들고 있다면 `fetch`가 그 덩어리를\n    쪼개지 않고 받아 문서형 텍스트로 준다 — 둘은 대체재가 아니라 입력·응답 형태가 다른\n    짝이다. 조건으로 여러 건을 훑는 것은 `realty_search_auctions`다.\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_no": {
                "description": "사건번호 — `2026타경3571` 꼴이다(연도 4자리 + '타경' + 일련번호 1~6자리). 원장 전수가 '타경' 접두이고 '2024타경101026'처럼 6자리도 있다. '2026-3571'처럼 하이픈으로 써도 서버가 '타경'으로 펴고 무엇을 폈는지 응답에 적는다. 다만 '3571'처럼 **연도가 없으면 못 편다**(연도를 지어내면 다른 사건이 된다) — 사용자에게 연도를 물어라",
                "title": "Case No",
