        {
          "name": "realty_auction_history",
          "title": "경매 유찰 이력·가격 저감·사진",
          "description": "경매 사건 하나의 유찰 이력·가격 변동·물건 사진을 조회한다.\n\n    경매 사건의 유찰 이력(기일별 최저가 저감 시계열)·가격 변동 이벤트·물건 사진 URL을\n    조회한다. \"몇 번 유찰됐어? 얼마나 떨어진 거야? 사진 있어?\"류 질문의 담당 도구.\n    사진은 법원 원천에서 기일 후 소멸해 **수집 시점 보존본만 존재**한다(국내 공개 API에 드문 축).\n\n    court_schedule에서 result='유찰'인 행이 유찰 이력, min_bid_10k의 저감이 가격 흐름이다.\n    result가 null인 행은 미래 기일이거나 미해독 법원 코드(result_code 원문 병기)다 —\n    의미를 지어내지 말고 그대로 전하라. **최저가(min_bid_10k)가 없는 행에는 `kind_note`가\n    붙는다 — 그 행은 입찰 기일이 아니다**(원천 전수에서 최저가·유찰 표기는 kind_code=01에만\n    붙는다). fail_count가 기일표의 유찰 행 수와 다르면 `fail_count_note`가 그 이유를 댄다\n    (출처가 목록 원천 vs 기일표로 갈린다) — 둘을 합쳐 세지 마라. tracking·price_events는 2026-07-23 이후 일일\n    스냅샷 비교분이라 비어 있을 수 있다(비어 있음 ≠ 변동 없음, court_schedule이 정본).\n    ⚠️ court_schedule이 빈 물건(기일표 미수집)의 `current_min_bid_10k`는 건별\n    `min_bid_source`를 봐야 한다 — item_list면 낡았을 수 있어 min_bid_note가 함께 온다.\n    그 경우 현재 최저가를 단정하지 말고 note를 사용자에게 전하라(목록·상세와 같은 경고).\n    ",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "case_no": {
                "description": "사건번호 — `2026타경3571` 꼴이다(연도 4자리 + '타경' + 일련번호 1~6자리). 원장 전수가 '타경' 접두이고 '2024타경101026'처럼 6자리도 있다. '2026-3571'·'3571'처럼 접두 없이 넣지 마라",
                "title": "Case No",
                "type": "string"
              },
              "court_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "법원명 — '서울동부지방법원'·'인천지방법원'처럼 정식명으로 넣는다('진주지원'처럼 지원명만인 행도 있다). 사건번호는 법원 간 유일하지 않아(전국 평균 2.8개 법원에서 중복) 생략하면 후보 목록이 돌아온다",
                "title": "Court Name"
              }
            },
            "required": ["case_no"],
            "title": "realty_auction_historyArguments",
            "type": "object"
