          "title": "[유료] 서울 재개발·재건축 사업장",
          "description": "[유료] 서울시 정비사업(재개발·재건축·가로주택) 사업장 목록을 조회한다.\n\n    [유료] 서울시 정비사업(재개발·재건축·가로주택 등) 사업장 목록 — 사업명·유형·\n    진행 단계·위치. \"○○구 재개발 어디까지 진행됐어?\"·\"면목동 재개발 어디 있어?\"류 질문용.\n    구(region)·동(dong)·유형(project_type)·진행 단계(stage)로 거를 수 있다.\n\n    **커버리지는 서울 한정**(정보몽땅 원천) — 타 시도는 이 도구로 답할 수 없다고 밝혀라.\n    세대수·준공예정은 원천 목록이 제공하지 않아 null이다(지어내지 말 것). 원천이 진행\n    단계를 비워 둔 사업장이 있다(약 2%) — stage가 빈 행은 '단계 미상'이지 '진행 없음'이 아니다.\n    재건축 **유망도 점수**는 이 도구가 아니라 realty_reconstruction이 담당하고,\n    \"지금 사면 조합원 지위 승계돼?\"는 realty_member_transfer_check(무료)가 담당한다.\n    ",
