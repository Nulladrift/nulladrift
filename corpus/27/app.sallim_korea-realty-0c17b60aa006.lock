                "title": "Include Footnotes",
                "type": "boolean"
              },
              "include_price_trend": {
                "default": false,
                "description": "true면 같은 지역(공고의 시도·시군구) 분양 공고들의 **연도별 평당 분양가 추이**(realty_presale_price_trend와 같은 값)를 `price_trend`에 함께 싣는다 — '지금 넣을까, 기다릴까'",
                "title": "Include Price Trend",
                "type": "boolean"
              },
              "keyword": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
