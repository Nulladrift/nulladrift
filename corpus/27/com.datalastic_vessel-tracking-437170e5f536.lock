        {
          "name": "report_request",
          "title": "Request an async report",
          "description": "Submit an async report job. Reports are generated in the background and can take a while (seconds to many minutes), so this returns a report_id and an initial status (_PENDING_) — it does NOT wait. Submit ONCE, then poll report_status with the returned report_id until _DONE_, which yields a result_url. Do not resubmit while a job is running. If a report comes back _FAILED_, do not automatically submit a replacement — report the message to the user first. At most 10 reports may be pending per account at once; further submissions are rejected until some finish. When done, give the user the result_url to download; the server never downloads report files itself.\n\nSupported report_type values:\n- request_usage: a FREE log of your account's API usage (endpoint, credits, timestamp); optional from/to (<=31 days), default last month.\n- vessel_list: the full vessel database (no other parameters).\n- port_list: the full ports database (no other parameters).\n- inradius_history: all vessels that passed through an area in a time window; REQUIRES lat, lon, radius (<=50 NM), from and to (<=7 days apart).\n\nNote: vessel_list, port_list and inradius_history consume API credits (vessel_list and inradius_history can be substantial) — it's good to tell the user before submitting. For the add-on bulk datasets (ownership, inspections, etc.) use intel_report_request instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Start date YYYY-MM-DD. Optional for request_usage; required for inradius_history.",
                "type": "string"
              },
              "lat": {
                "description": "Center latitude. Required for inradius_history.",
                "type": ["null", "number"]
              },
              "lon": {
                "description": "Center longitude. Required for inradius_history.",
                "type": ["null", "number"]
              },
              "radius": {
                "description": "Radius in nautical miles, max 50. Required for inradius_history.",
                "type": ["null", "number"]
              },
              "report_type": {
                "description": "Which report to generate: request_usage, vessel_list, port_list, or inradius_history.",
                "type": "string"
              },
              "to": {
                "description": "End date YYYY-MM-DD. Optional for request_usage (<=31 days after from); required for inradius_history (<=7 days after from).",
                "type": "string"
              }
            },
            "required": ["report_type"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "created_at": {
                "type": ["null", "string"]
              },
              "message": {
                "type": ["null", "string"]
              },
              "report_id": {
                "type": "string"
              },
              "report_type": {
                "type": ["null", "string"]
              },
