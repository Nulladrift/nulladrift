                "type": ["null", "number"]
              },
              "name": {
                "description": "Vessel name to search for. Combine with fuzzy for similar-name matching.",
                "type": "string"
              },
              "next": {
                "description": "Pagination token from a previous response's next field, to fetch the next page (up to 500 results per page).",
