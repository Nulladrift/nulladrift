        {
          "name": "report_status",
          "title": "Check an async report",
          "description": "Check an async report job by report_id (from report_request or report_list). Returns its status: _PENDING_ or _IN_PROGRESS_ (still generating — wait and check again), _DONE_, or _FAILED_.\n\nWhen _DONE_, result_url is a download link for the result ZIP; hand it to the user. Links are time-limited — if one has expired, run report_status again for a fresh link. The server never downloads the file itself.\n\n_FAILED_ is terminal. Stop polling: it will never become _DONE_ and there will be no result_url. Read the message field and relay it to the user — it is written for a person and explains the cause. Do not resubmit on your own: tell the user what failed and let them decide. If the message points at a parameter the user can correct, offer the corrected submission rather than making it silently.\n\nA report going from _IN_PROGRESS_ back to _PENDING_ is an automatic retry, not a failure. Keep polling.\n\nFailed reports are not charged, and polling is free — it never re-runs the report or deducts credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "report_id": {
                "description": "The report_id returned by report_request (or seen in report_list).",
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "created_at": {
                "type": ["null", "string"]
              },
