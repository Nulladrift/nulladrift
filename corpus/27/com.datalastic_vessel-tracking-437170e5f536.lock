        {
          "name": "find_vessels",
          "title": "Find vessels (registry search)",
          "description": "Search the vessel registry by any combination of name (optionally fuzzy), type, flag country, dimensions, tonnage, or year built — no MMSI or IMO needed. Returns up to 500 static specification records per page (tonnage, dimensions, year built, home port, callsign, etc.) — this is reference data, NOT live position. Provide at least one search criterion; use the response's next token via the next argument to page. Credits: 1 per vessel found. For a vessel's live position use get_vessel; for vessels currently in an area use get_vessels_in_radius.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "breadth_max": {
                "description": "Maximum breadth (meters).",
                "type": ["null", "number"]
              },
              "breadth_min": {
                "description": "Minimum breadth (meters).",
                "type": ["null", "number"]
              },
              "country_iso": {
                "description": "Filter by flag country, 2-letter ISO code (e.g. MT).",
                "type": "string"
              },
              "deadweight_max": {
                "description": "Maximum deadweight (tonnes).",
                "type": ["null", "integer"]
              },
              "deadweight_min": {
                "description": "Minimum deadweight (tonnes).",
                "type": ["null", "integer"]
              },
              "fuzzy": {
                "description": "If true, match similar/approximate names; if false (default) the name must match exactly. Only meaningful together with name.",
                "type": "boolean"
              },
              "gross_tonnage_max": {
                "description": "Maximum gross tonnage.",
                "type": ["null", "integer"]
              },
              "gross_tonnage_min": {
                "description": "Minimum gross tonnage.",
                "type": ["null", "integer"]
              },
              "include_unknown_type": {
