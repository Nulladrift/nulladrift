        {
          "name": "find_ports",
          "title": "Search for ports",
          "description": "Search the port registry and return matching ports (identity, country, UN/LOCODE, classification, coordinates, maritime area). Search by name (optionally fuzzy), UN/LOCODE, classification, country, or geographically (lat + lon + radius in nautical miles). Always returns a list, even for a single match. Use this to discover ports or resolve a name to a UN/LOCODE/uuid; for full detail on one known port (including terminals) use get_port.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country_iso": {
                "description": "2-letter ISO country code (e.g. GB).",
                "type": "string"
              },
              "fuzzy": {
                "description": "Match the name approximately instead of exactly.",
                "type": "boolean"
              },
              "lat": {
                "description": "Center latitude for a geographic search (use with lon and radius).",
                "type": ["null", "number"]
              },
              "lon": {
                "description": "Center longitude for a geographic search (use with lat and radius).",
                "type": ["null", "number"]
              },
              "name": {
                "description": "Port name to search for (set fuzzy for approximate matching).",
                "type": "string"
              },
              "port_type": {
