          "title": "Get vessels in radius (area scan)",
          "description": "Scan a circular area and return all vessels currently within a given radius (nautical miles, greater than 0 and at most 50). Specify the center in exactly one way: lat+lon coordinates, a port (port_unlocode or port_uuid), or a vessel to center on (mmsi/imo/uuid). Optional filters: type, type_specific, exclude, nav_status, and include_unknown_type. Returns up to 500 vessels per page, each with its distance (nautical miles) from the center; if more remain, pass the response's 'next' token via the 'next' argument to page through them. Credits are charged per vessel found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exclude": {
                "description": "Optional: exclude vessels of this type.",
