        {
          "name": "estimated_vessel_position",
          "title": "Estimate a vessel's current position (SAT-E)",
          "description": "Estimate where a vessel is right now when its last AIS position is stale — Datalastic uses terrestrial AIS only, so a ship in open ocean can be many hours old. The position is calculated from the last known fix, the recognized destination port, and the route-based ETA. It is an ESTIMATE, not an observed position.\n\nTool selection — use this LAST: prefer get_vessel for a live position (cheapest); prefer get_vessel_pro when the user wants the ETA or recognized destination. Only reach for this tool when BOTH hold: (1) a prior get_vessel/get_vessel_pro lookup shows the last known position is old, and (2) the vessel has a destination and an ETA. It is the heaviest call (it builds a route) and adds nothing when get_vessel already returns a recent position.\n\nBecause it is an estimate, OFFER it to the user first rather than calling it silently, and when you present the result make clear it is an estimated position, not a real fix. If estimated_position equals the last known lat/lon, the system could not extrapolate (the position is recent, or the ETA is missing/outdated) — say so instead of implying movement.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "imo": {
                "description": "Vessel IMO number, exactly 7 digits. Provide exactly one of mmsi, imo, or uuid.",
                "type": "string"
              },
              "mmsi": {
                "description": "Vessel MMSI identifier, exactly 9 digits. Provide exactly one of mmsi, imo, or uuid.",
                "type": "string"
              },
              "uuid": {
                "description": "Datalastic internal vessel UUID. Provide exactly one of mmsi, imo, or uuid.",
                "type": "string"
              }
            },
            "type": "object"
          },
