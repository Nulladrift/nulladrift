      "serverInfo": {
        "name": "couponpriceadjustment",
        "title": "Coupon Price Adjustment",
        "version": "1.0.0",
        "websiteUrl": "https://www.couponpriceadjustment.com/agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Checks Costco warehouse receipts for price adjustments: items bought in the last 30 days that went on sale since. Find a warehouse number with find_warehouse if the receipt is not at hand, list a warehouse's current deals with warehouse_deals, and check a receipt with check_receipt. Send only the warehouse number, purchase date, item numbers, prices, quantities and instant savings; never the member number, name, email, payment details or the receipt image. The site only finds price adjustments: the member asks for them at the Costco membership desk. Full instructions: https://www.couponpriceadjustment.com/agents",
      "tools": [
        {
          "name": "check_receipt",
          "title": "Check a Costco receipt for price adjustments",
          "description": "Check one Costco warehouse receipt for price adjustments. An item can get one when it was bought in the last 30 days and a sale on the same item number started after the purchase and is running today, at the warehouse where it was bought (a sale only at another warehouse within 15 miles is reported as \"nearby\": up to the store).\n\nReading the receipt:\n- warehouse: printed as \"Whse: 111\", or after the city name, as in \"TIGARD #111\".\n- date: the purchase date, YYYY-MM-DD.\n- item: the number at the start of each item line.\n- price: the price paid for ONE unit. A line like \"2 @ 10.99\" before an item means quantity 2 at 10.99 each; the item line shows the total.\n- instant_savings: a line like \"390305 / 1172471 4.00-\". The number after the slash is the item it belongs to; 4.00 is the savings already taken on that line. Give it on that item.\nOne receipt per call, at most 100 items. Repeat an item number if it is on the receipt twice.\n\nPrivacy: send only these values. Never send the member number, name, email address, payment details, or the receipt image or PDF.\n\nThe answer is JSON: for each item adjustment_available and, when true, amount_owed, redeem_by, sale dates and a plain note; totals; deals_as_of (when the warehouse's deals were last fetched) and status (fresh, stale, not_cached or outside_window). Tell the user each item with its amount and redeem-by date, and: bring the receipt (or membership card) to the Costco membership desk and ask for a price adjustment. This site only finds price adjustments; it cannot claim them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "The purchase date, YYYY-MM-DD. Within the last 30 days to find anything.",
                "type": "string"
              },
              "items": {
                "description": "The receipt's item lines, at most 100.",
                "items": {
                  "properties": {
                    "instant_savings": {
                      "description": "The total instant savings already taken on this line at checkout, e.g. 4.00. Default 0.",
                      "type": ["number", "string"]
                    },
                    "item": {
                      "description": "The item number at the start of the item line, e.g. 1207907.",
                      "type": ["number", "string"]
                    },
                    "price": {
                      "description": "The price paid for one unit, e.g. 10.99.",
                      "type": ["number", "string"]
                    },
                    "quantity": {
                      "description": "How many were bought on this line. Default 1.",
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["item", "price"],
                  "type": "object"
                },
                "type": "array"
              },
              "warehouse": {
                "description": "The warehouse number printed on the receipt, e.g. 111.",
                "type": ["number", "string"]
              }
            },
            "required": ["date", "items", "warehouse"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b32319cdfc01c7399e2efe4c33c1ef64d70f24f60054d1b321caa9976c9d8234"
        },
        {
          "name": "find_warehouse",
          "title": "Find a Costco warehouse number",
          "description": "Find a Costco warehouse number by city name and/or US state (name or two-letter code). Each result has the warehouse number, city, state, its page on this site and how fresh its deals are. There is no zip code search; use the city name. The warehouse number is also printed on the receipt.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "q": {
                "description": "Part of the city name, at least 2 letters, e.g. tigard.",
                "type": "string"
              },
              "state": {
                "description": "A US state name or its two-letter code, e.g. OR.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1650350d00e34527b665ad1edab170da9a049a57224b5ff24f46f0db4109d674"
        },
        {
          "name": "track_receipt",
          "title": "Email the user price-adjustment alerts for a Costco receipt (they confirm by email)",
          "description": "Sign the user up for 30 days of email alerts on one Costco receipt: the site emails them when something on it goes on sale, the same as forwarding the receipt to the site. Use it ONLY when the user has asked for ongoing alerts and has given you their email address themselves; never guess or look up an address.\n\nThe site emails that address a link to confirm. Nothing is saved under the address until its owner opens that email and presses Confirm; the link lasts 7 days, and receipts not confirmed by then are deleted. Tell the user to open the email from couponpriceadjustment.com and confirm. One confirmation covers every receipt waiting for the address, so several receipts can be sent in a row (at most 10 waiting; at most 3 confirmation emails per address a day).\n\nRead the receipt as for check_receipt (warehouse, date, items with price per unit, quantity and instant savings), and the purchase must be in the last 30 days. Optionally give each item's name as printed on the receipt (plain text, at most 60 characters, shown only to the confirmed owner) and the register transaction number (\"Trn: 391\"), which lets the site recognise a receipt already on file.\n\nUnlike the other tools, this stores what it is sent: the email address and the receipt's warehouse, date, items, prices and quantities, as forwarding a receipt does. Never send the member number, payment details or the receipt image. The user can delete everything with the link in any email from the site. It does not check the receipt: call check_receipt for today's answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "The purchase date, YYYY-MM-DD, within the last 30 days.",
                "type": "string"
              },
              "email": {
                "description": "The email address the user gave you for the alerts. Never guess one.",
                "type": "string"
              },
              "items": {
                "description": "The receipt's item lines, at most 100.",
                "items": {
                  "properties": {
                    "instant_savings": {
                      "description": "The total instant savings already taken on this line at checkout. Default 0.",
                      "type": ["number", "string"]
                    },
                    "item": {
                      "description": "The item number at the start of the item line, e.g. 1207907.",
                      "type": ["number", "string"]
                    },
                    "name": {
                      "description": "The item's description as printed on the receipt, e.g. KS BUTTER. Optional, at most 60 characters.",
                      "type": "string"
                    },
                    "price": {
                      "description": "The price paid for one unit, e.g. 10.99.",
                      "type": ["number", "string"]
                    },
                    "quantity": {
                      "description": "How many were bought on this line. Default 1.",
                      "type": ["number", "string"]
                    }
                  },
                  "required": ["item", "price"],
                  "type": "object"
                },
                "type": "array"
              },
              "transaction": {
                "description": "The register transaction number printed as \"Trn: 391\". Optional; lets the site recognise a receipt already on file.",
                "type": ["number", "string"]
              },
              "warehouse": {
                "description": "The warehouse number printed on the receipt, e.g. 111.",
                "type": ["number", "string"]
              }
            },
            "required": ["date", "email", "items", "warehouse"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9937a0ace63abbbe39791c758f5264f037942a2b6b8c318ce3b6dc3f9f4db324"
        },
        {
          "name": "warehouse_deals",
          "title": "Current deals at a Costco warehouse",
          "description": "List the current in-warehouse deals (instant savings) at one Costco warehouse, from the site's copy of that warehouse's deals: item number, name, discount, regular price, price after the discount, dates, stock and department. Use it to answer \"what is on sale at my Costco?\". It does not fetch from Costco; status says how fresh the copy is (not_cached means the site has none: checking a receipt for that warehouse fetches them).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "warehouse": {
                "description": "The warehouse number, e.g. 111.",
                "type": ["number", "string"]
              }
            },
            "required": ["warehouse"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75a108cf09fb6f400ae27bf05e793a9a2e92bd5856fe89bc15c70c7395874d6b"
        }
      ],
      "digest": "sha256:13bf836ed4d6fc78567e73448ec62f40ebc2e03fd277a85439a759bc258bcb5c"
    }
  }
