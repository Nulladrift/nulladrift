        {
          "name": "job_status",
          "title": "Check a draft job",
          "description": "Use this after start_job returned a statusHandle, to see whether the homeowner has sent the job and how many bids have arrived. Returns only the stage (draft, sent, collecting_bids, picked, closed or expired), the bid count and when it last changed. Never returns bid amounts, contractor names or the job text. The handle works for 7 days. Stage expired means the one-hour link lapsed before the homeowner opened it: Call reissue_claim_link with the same statusHandle to get a replacement link for this draft. Only the homeowner can send the job. Read-only.",
          "inputSchema": {
