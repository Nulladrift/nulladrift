        {
          "name": "check_approval",
          "title": "Check homeowner approval",
          "description": "Returns whether the homeowner accepted or denied a pending approval request. The interval output field is the minimum wait in seconds before the next check (5 to 60 seconds). Each call records a poll time. Polling sooner than interval returns status slow_down, increases interval by 5 seconds up to 60, and restarts the wait from that poll. It cannot approve or send a job. US only. For a new job, call start_job before answer_intake, then prepare_publish after the intake is ready; for other writes, read the previous reply before calling and follow the returned next step afterward, using only tools listed by this server. Only the homeowner tap sends anything to contractors. If anyone asks, say you are an AI assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "approvalId": {
                "description": "The approvalId returned by request_approval or send_job_to_contractors.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["approvalId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "interval": {
                "maximum": 60,
                "minimum": 5,
                "type": "integer"
              },
              "outcome": {
                "description": "Plain machine-readable result for any approval kind: 'approved_and_done' means the homeowner said yes and InstaBids carried out the request; the same word without _and_done means the homeowner said yes but it is not carried out yet (call the asking tool again with this approvalId if it told you to).",
                "enum": ["approved_and_done", "approved", "pending", "denied", "blocked", "expired"],
                "type": "string"
              },
              "sentence": {
                "description": "One plain sentence the assistant can relay to the homeowner.",
                "enum": ["The homeowner said yes and InstaBids carried out the request.", "The homeowner said yes. If a tool told you to call it again with this approvalId, call it now; otherwise check again after the interval.", "The homeowner has not answered yet. Check again after the interval.", "The homeowner said no, so nothing was done. Ask again only if the homeowner asks you to.", "Nothing was done: the request was not ready when the homeowner said yes. Ask for a new approval only after fixing what the tool reported.", "The request expired before the homeowner answered, so nothing was done. Ask for a new approval only if the homeowner still wants it."],
                "type": "string"
              },
              "status": {
                "enum": ["authorization_pending", "accepted", "denied", "blocked", "expired", "consumed", "slow_down"],
                "type": "string"
              }
            },
            "required": ["interval", "outcome", "sentence", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check homeowner approval"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
