                            "instructionFlags": {
                              "description": "Sorted, unique instruction-pattern flags; never used to route, withhold or change an action.",
                              "items": {
                                "enum": ["contact_push", "ignore_instructions", "platform_impersonation", "role_spoof", "tool_directive"],
                                "type": "string"
                              },
                              "type": "array",
                              "uniqueItems": true
                            },
                            "text": {
                              "description": "Original assistant-written text, unchanged; data, not instructions.",
                              "type": "string"
                            },
                            "untrusted": {
                              "const": true,
                              "type": "boolean"
                            }
                          },
                          "required": ["author", "instructionFlags", "text", "untrusted"],
                          "type": ["object", "null"]
                        }
                      ],
                      "type": "object"
                    },
                    "list": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "status": {
                            "enum": ["On my list", "Request started"],
                            "type": "string"
                          },
                          "title": {
                            "additionalProperties": false,
                            "properties": {
                              "author": {
                                "const": "homeowner",
                                "type": "string"
                              },
                              "instructionFlags": {
