        {
          "name": "permit_facts",
          "title": "Published local permit facts",
          "description": "Read sourced local permit facts, with the date each rule was checked; unpublished rules get guidance to ask your bidder and confirm local requirements. Homeowners anywhere in the US can post a job; once you send it, InstaBids finds contractors to bid on it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "town": {
                "description": "a five-digit ZIP or a town name",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^(?:[0-9]{5}|[\\p{L}][\\p{L}\\p{M} ,.'’-]{0,79})$",
                "type": "string"
              },
              "trade": {
                "description": "optional trade key; one of: ac, pool_repair",
                "enum": ["ac", "pool_repair"],
                "type": "string"
              }
            },
            "required": ["town"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "guidance": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "note": {
                      "type": "string"
                    },
                    "trade": {
                      "enum": ["ac", "pool_repair"],
                      "type": "string"
                    }
