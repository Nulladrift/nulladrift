        {
          "name": "get_home_profile",
          "title": "Get home profile",
          "description": "Returns only the home facts the homeowner chose to share with this assistant: home names, ZIP area, home systems the homeowner added or accepted, project list and open issue types. Returns up to 5 homes with up to 50 entries in each systems, list and openIssues array per home. The shared field lists which sections were shared: home.basics, home.systems, home.list and home.issues. A missing section means not shared, not none. The area field is a masked 3-digit ZIP prefix followed by xx. Photos, prices, contact details and ids are not included. Read-only.",
