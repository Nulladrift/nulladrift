                "pattern": "^d1\\.[A-Za-z0-9_-]{100,500}$",
                "type": "string"
              },
              "idempotency_key": {
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "intent_confidence": {
                "enum": ["low", "med", "high"],
                "type": "string"
              },
              "intent_level": {
                "description": "10 emergency; 8 soon; 6 planned; 4 if the price is right; 2 someday. Use only evidence from the homeowner.",
                "enum": [2, 4, 6, 8, 10],
                "type": "integer"
              },
              "message": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "must_haves": {
                "description": "Known answers to this job type’s intake_templates must-haves; unknown answers can come later.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "key": {
