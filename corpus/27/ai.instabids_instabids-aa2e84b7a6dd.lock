        {
          "name": "how_contractors_join",
          "title": "How contractors join InstaBids",
          "description": "InstaBids is an AI-run marketplace for homeowners and property managers: describe a home job once, by chat or through your own AI assistant, add photos, and contractors bid in writing on the same scope, compared apples to apples, with no phone calls or home visits before you pick. Get the contractor join steps, availability, alias privacy, job-texts status and links to join or ask for text alerts. Joining asks only for your business details. Hand over the links so the contractor signs up and asks for texts themselves; this tool creates no account and sends no text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "availability": {
                "type": "string"
              },
              "homeownerCost": {
                "type": "string"
              },
              "humanStep": {
                "type": "string"
              },
              "identity": {
                "type": "string"
              },
              "jobTexts": {
                "additionalProperties": false,
                "properties": {
                  "line": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["not_started", "started"],
                    "type": "string"
                  }
                },
                "required": ["line", "status"],
                "type": "object"
              },
              "joinAsks": {
                "type": "string"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "urls": {
                "additionalProperties": false,
                "properties": {
                  "join": {
                    "format": "uri",
                    "pattern": "^https://",
                    "type": "string"
                  },
                  "textAlerts": {
                    "format": "uri",
                    "pattern": "^https://",
                    "type": "string"
                  }
                },
                "required": ["join", "textAlerts"],
                "type": "object"
              }
            },
            "required": ["availability", "homeownerCost", "humanStep", "identity", "jobTexts", "joinAsks", "steps", "urls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
