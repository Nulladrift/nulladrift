                "description": "Optional photos; attachment still requires the existing scan and photo permissions.",
                "items": {
                  "maxLength": 2048,
                  "pattern": "^https://",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "project_completion_deadline": {
                "description": "ISO date, or null for no deadline; never a price.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "quotes_by": {
                "description": "ISO date, or null for no deadline; never a price.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "trade": {
                "description": "Optional. The kind of work in plain words, for example plumbing, electrical, roofing, handyman or general home repair. Leave it out when unsure; InstaBids works out the trade from the message.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "walk_clip": {
                "description": "Description or transcript of a 20–60 s walk clip. This tool does not upload video bytes or fetch video URLs.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "zip": {
                "maxLength": 5,
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["message", "zip"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "card": {
                "additionalProperties": false,
                "description": "Saved in-chat card, present only when available.",
                "properties": {
                  "locationZip": {
                    "pattern": "^[0-9]{5}$",
                    "type": ["string", "null"]
                  },
                  "photoCount": {
                    "maximum": 50,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "projectType": {
                    "maxLength": 600,
                    "type": ["string", "null"]
                  },
