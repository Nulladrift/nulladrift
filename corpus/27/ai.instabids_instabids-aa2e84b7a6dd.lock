                },
                "type": "array"
              }
            },
            "required": ["canPost", "message", "status", "towns"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
