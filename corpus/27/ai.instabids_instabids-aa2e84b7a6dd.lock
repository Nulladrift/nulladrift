      },
      "serverInfo": {
        "name": "instabids",
        "title": "InstaBids",
        "version": "0.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "These public tools explain InstaBids, bid checklists, ZIP checks before posting and published permit facts. They do not access jobs or accounts. Private tools need an InstaBids homeowner sign-in. Only the homeowner tap sends anything to contractors. If anyone asks, say you are an AI assistant. Photos can be added on the job page. When photo tools are not listed, give the homeowner the job link returned by the tools; photos are still supported there. Never state, guess or compare a price, fee or cost; bids and fees come only from InstaBids records, quoted exactly; contractors stay anonymous (Contractor A, B, C) until the homeowner picks. start_job saves a private draft and returns a one-hour link for the homeowner to open in their own browser; it cannot send the job to contractors. The job order is describe, start_job, the homeowner sends, bids, compare, pick. start_job needs no sign-in and saves a private draft plus a one-hour link for the homeowner. Keep the statusHandle and call job_status to see the stage and bid count. Only the homeowner can send the job. If job_status returns stage expired, call reissue_claim_link with the same statusHandle to replace the lapsed link and keep the draft. Only the homeowner can send the job.",
      "tools": [
        {
          "name": "add_home_photo",
          "title": "Add home photo",
          "description": "Adds a photo to one of the homeowner's homes after InstaBids scans it; the scan may refuse it. Use the homeId from list_homes. Requires home:write and photos:write. imageBase64 accepts up to 60000 base64 characters (about 45000 bytes). roomTag is optional and defaults to unknown. Add only a photo the homeowner shared and asked you to add. The homeowner makes this choice: show it to them and wait for their own reply. Never choose, pre-select, suggest a default, guess or send for them; call this tool only for what the homeowner chose in this conversation. For a new job, call start_job before answer_intake, then prepare_publish after the intake is ready; for other writes, read the previous reply before calling and follow the returned next step afterward, using only tools listed by this server. Only the homeowner tap sends anything to contractors. If anyone asks, say you are an AI assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "homeId": {
                "description": "The homeId from list_homes.",
                "format": "uuid",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Reuse the same key to retry a write once; a new key makes a new request. 1-123 characters.",
                "pattern": "^[A-Za-z0-9._:-]{1,123}$",
                "type": "string"
              },
              "imageBase64": {
                "description": "The home photo encoded as base64, without a data URL prefix; up to 60000 base64 characters (about 45000 bytes) before scanning.",
                "maxLength": 60000,
                "minLength": 4,
                "pattern": "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$",
                "type": "string"
              },
              "roomTag": {
                "description": "Optional room label: unknown, kitchen, bathroom, bedroom, living_room, laundry, garage, exterior, other. Defaults to unknown.",
                "enum": ["unknown", "kitchen", "bathroom", "bedroom", "living_room", "laundry", "garage", "exterior", "other"],
                "type": "string"
              }
            },
            "required": ["homeId", "imageBase64"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "author": {
                "const": "assistant",
                "type": "string"
              },
              "homeId": {
                "format": "uuid",
                "type": "string"
              },
              "id": {
                "format": "uuid",
                "type": "string"
              },
              "roomTag": {
                "enum": ["unknown", "kitchen", "bathroom", "bedroom", "living_room", "laundry", "garage", "exterior", "other"],
                "type": "string"
              },
              "untrusted": {
                "const": true,
                "type": "boolean"
              }
            },
            "required": ["author", "homeId", "id", "roomTag", "untrusted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add home photo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6f4e17cd6a9d92f427b2a0edd35b544c11fae097f87bd3290ca3e1e628c33e7d"
        },
        {
          "name": "answer_intake",
          "title": "Answer draft question",
          "description": "fill what you can; everything else can come later. Start with the homeowner’s description and ZIP (trade is optional), plus a photo or a good description. Optional: photos, a description or transcript of a 20–60 s walk clip, timing and the job type’s must-haves from intake_templates. Never invent answers. ZIP only; never send a street address or a price. Nothing reaches contractors before the homeowner sends the card. For anonymous draftHandle intake, fixes: [{gapKey, value}] corrects an engine-named field through intake. Use engine-returned keys only; unknown keys return INVALID_INPUT with details.field gapKey. Nothing is sent to contractors. Continue this private draft with draftHandle. Supply message, fixes, or both to answer_intake. Use the new draftHandle returned each time; the old handle expires immediately. Send only the homeowner actual reply; never answer for them. If a call fails, do not guess; ask the homeowner again. Nothing is sent to contractors. Continue with the returned question until readiness.canSend or readiness.homeownerActionRequired is true, then show sendUrl to the homeowner. The homeowner completes their insurance answer and send confirmation on that sheet; never claim the job was sent. Never invent answers. For a new job, call start_job before answer_intake, then prepare_publish after the intake is ready; for other writes, read the previous reply before calling and follow the returned next step afterward, using only tools listed by this server. Only the homeowner tap sends anything to contractors. If anyone asks, say you are an AI assistant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deadline_hard": {
                "type": "boolean"
              },
              "deadline_reason": {
                "description": "Optional reason for the date, without names or contact details.",
                "maxLength": 300,
                "type": "string"
              },
              "draftHandle": {
                "pattern": "^d1\\.[A-Za-z0-9_-]{100,500}$",
                "type": "string"
              },
              "fixes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "gapKey": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "value": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["gapKey", "value"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "intent_confidence": {
                "enum": ["low", "med", "high"],
                "type": "string"
              },
              "intent_level": {
                "description": "10 emergency; 8 soon; 6 planned; 4 if the price is right; 2 someday. Use only evidence from the homeowner.",
                "enum": [2, 4, 6, 8, 10],
                "type": "integer"
              },
              "message": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "must_haves": {
                "description": "Known answers to this job type’s intake_templates must-haves; unknown answers can come later.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "key": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["answer", "key"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "photoUrls": {
                "description": "Optional photos; attachment still requires the existing scan and photo permissions.",
                "items": {
                  "maxLength": 2048,
                  "pattern": "^https://",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "project_completion_deadline": {
                "description": "ISO date, or null for no deadline; never a price.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "quotes_by": {
                "description": "ISO date, or null for no deadline; never a price.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": ["string", "null"]
              },
              "trade": {
                "description": "Optional. The kind of work in plain words, for example plumbing, electrical, roofing, handyman or general home repair. Leave it out when unsure; InstaBids works out the trade from the message.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "walk_clip": {
                "description": "Description or transcript of a 20–60 s walk clip. This tool does not upload video bytes or fetch video URLs.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["draftHandle"],
            "type": "object"
          },
