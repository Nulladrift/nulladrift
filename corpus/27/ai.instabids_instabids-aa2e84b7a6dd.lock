        {
          "name": "save_home_fact",
          "title": "Save home fact",
          "description": "Saves the nickname or ZIP code on one of the homeowner's homes identified by homeId. Set field to nickname or zip and value to the replacement text (1–60 characters); for zip, value must be a 5-digit ZIP. A different saved value requires homeowner confirmation. Use the homeId from list_homes. Requires home:write. When home-fact idempotency is enabled, an optional idempotencyKey replays the first successful write without writing again; without a key, retries of the same grant, home, field and value share a derived key. Reusing a key for different input is refused. Assistant text remains labelled as untrusted and private to the homeowner. For a new job, call start_job before answer_intake, then prepare_publish after the intake is ready; for other writes, read the previous reply before calling and follow the returned next step afterward, using only tools listed by this server. Only the homeowner tap sends anything to contractors. If anyone asks, say you are an AI assistant.",
