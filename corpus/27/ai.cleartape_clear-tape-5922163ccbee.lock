            "readOnly": true
          },
          "digest": "sha256:81cdb1b4cb882d71506225baa48b8170f95d990ab239d604c71ddb0ef120d755"
        },
        {
          "name": "search_learning",
          "title": "Search trading lessons",
          "description": "Searches Clear Tape's free trading education by keyword: the Learn articles, the Academy lessons, the trading-strategy pages and the calculators, in English or Chinese. Returns titles, one-line summaries and links to read the full page. No market data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
