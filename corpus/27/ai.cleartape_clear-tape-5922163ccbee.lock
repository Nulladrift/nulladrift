            "readOnly": true
          },
          "digest": "sha256:e0bb268dd7474a0578b41233aaae136accea16a2365a4deca27f06f5c8ee3575"
        },
        {
          "name": "calculate_drawdown_recovery",
          "title": "Drawdown recovery calculator",
          "description": "The gain needed to recover from a drawdown and, optionally, how many losing trades in a row at a fixed risk per trade cause it. Computed with the same function as Clear Tape's free drawdown recovery calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "loss": {
                "description": "Drawdown in percent of the account (20 = 20%). Above 0, below 100.",
                "exclusiveMaximum": 100,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "riskPct": {
                "description": "Optional: risk per trade in percent of the account. Above 0, below 100.",
                "exclusiveMaximum": 100,
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["loss"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Drawdown recovery calculator"
          },
          "behavior": {
