        {
          "name": "calculate_risk_reward",
          "title": "Risk/reward and R-multiple calculator",
          "description": "Risk/reward ratio of a planned trade, the win rate it needs to break even, and (optionally) an exit expressed as an R multiple. Computed with the same function as Clear Tape's free risk/reward and r-multiple calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entry": {
                "description": "Entry price per share in USD.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "exit": {
                "description": "Optional: an actual or planned exit price in USD, returned as an R multiple.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "stop": {
                "description": "Stop price per share in USD; not equal to the entry.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "target": {
                "description": "Target price per share in USD, on the other side of the entry from the stop.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              }
            },
            "required": ["entry", "stop", "target"],
            "type": "object"
          },
          "annotations": {
