        },
        {
          "name": "calculate_losing_streak",
          "title": "Losing streak calculator",
          "description": "The exact probability of at least one losing streak of a given length over a number of independent trades, the expected longest streak and the streak 95% of sequences stay within. Computed with the same function as Clear Tape's free losing streak calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "streak": {
                "description": "Losing streak length to test, a whole number no larger than trades.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "trades": {
                "description": "Number of trades, a whole number from 1 to 2000.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "winRate": {
                "description": "Win rate in percent. Above 0, at most 100.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              }
            },
            "required": ["streak", "trades", "winRate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
