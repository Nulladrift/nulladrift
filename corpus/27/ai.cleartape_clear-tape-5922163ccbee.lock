        {
          "name": "calculate_trading_cost",
          "title": "Trading cost calculator",
          "description": "The cost of one round trip (commissions, bid-ask spread, slippage) in USD, in R, as a share of the target move and of the position, and over a year of trades. Computed with the same function as Clear Tape's free trading cost calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "commission": {
                "description": "Commission per order (each side) in USD; 0 if none.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "entry": {
                "description": "Entry price per share in USD.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "shares": {
                "description": "Number of shares.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "slippage": {
                "description": "Slippage per share per side in USD.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "spread": {
                "description": "Bid-ask spread per share in USD (paid once per round trip, half on each side).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "stop": {
                "description": "Stop price per share in USD; not equal to the entry.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "target": {
                "description": "Optional: target price per share in USD, on the other side of the entry from the stop.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "trades": {
                "description": "Optional: round trips per year, for the annual cost.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              }
            },
            "required": ["commission", "entry", "shares", "slippage", "spread", "stop"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
