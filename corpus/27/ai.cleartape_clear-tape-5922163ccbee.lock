        {
          "name": "calculate_position_size",
          "title": "Position size calculator",
          "description": "Position size from the stop: how many shares to buy (or short) so that a stop-out loses a set percentage of the account. Computed with the same function as Clear Tape's free position size calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "description": "Account size in USD.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "entry": {
                "description": "Entry price per share in USD.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "riskPct": {
                "description": "Risk per trade, percent of the account (1 = 1%). Above 0, at most 100.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "stop": {
                "description": "Stop price per share in USD. Below the entry for a long, above it for a short; not equal to the entry.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              }
            },
            "required": ["account", "entry", "riskPct", "stop"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
