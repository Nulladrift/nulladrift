          "digest": "sha256:8d55fb96e0ec6ac26a1b509ec9f453a62acefdcbfa07887e9a2e1c9752575b03"
        },
        {
          "name": "calculate_expectancy",
          "title": "Trading expectancy calculator",
          "description": "Expectancy per trade, per 100 trades, payoff ratio, break-even win rate and profit factor from a win rate and average win and loss. Computed with the same function as Clear Tape's free trading expectancy calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "avgLoss": {
                "description": "Average losing trade as a positive amount, in the same unit as avgWin.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "avgWin": {
                "description": "Average winning trade as a positive amount, in USD or in R.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "winRate": {
                "description": "Win rate in percent (40 = 40%). Above 0, at most 100.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              }
            },
            "required": ["avgLoss", "avgWin", "winRate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trading expectancy calculator"
          },
          "behavior": {
