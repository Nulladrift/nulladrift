        {
          "name": "get_trading_system_rules",
          "title": "Trading system rules",
          "description": "Without id: lists Clear Tape's eleven preset trading systems (trend, breakout, momentum and volume) with their style, holding period and one-line entry, stop and exit. With id: one system's exact written rules (entry, stop, exit, target, parameters, the data it needs, terms, where it differs from the published method), its strengths, weaknesses, who it suits and its sources, worded exactly as on its strategy page. Rules only: no signals, no prices, no performance figures. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The system to describe; leave out to list them all.",
                "enum": ["leader-trend-filter", "20-day-breakout", "52-week-high-breakout", "volume-base-breakout", "21-ema-pullback", "10-20-ema-crossover", "rsi-2-strategy", "bollinger-band-squeeze", "pocket-pivot", "nr7-inside-day-breakout", "rs-line-new-high"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trading system rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cf41ba1d1bebdd4a4043b84e968eb8bc63a35daca48bbf6360fd2d75cd5b075"
        },
        {
          "name": "lookup_glossary_term",
          "title": "Trading glossary",
          "description": "Looks up a trading term in Clear Tape's bilingual (English and Simplified Chinese) glossary of about 70 terms, such as \"R multiple\", \"ATR\", \"drawdown\" or \"止损\". Matches names, abbreviations and pinyin, and tolerates misspellings. Returns the definition, the term in the other language, close matches and links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "term": {
                "description": "The term to look up, in English or Chinese.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trading glossary"
          },
          "behavior": {
            "destructive": false,
