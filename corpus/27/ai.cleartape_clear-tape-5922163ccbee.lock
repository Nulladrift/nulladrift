                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Most results to return (1 to 20, default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. \"position sizing\" or \"均值回归\".",
