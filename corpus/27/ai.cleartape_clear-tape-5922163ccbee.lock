          },
          "digest": "sha256:4a87e250e3520abb5a5e3ba338004fe0ddb22b63a44ef9567587186dd05e7bc5"
        },
        {
          "name": "calculate_kelly_criterion",
          "title": "Kelly criterion calculator",
          "description": "Full and fractional Kelly risk per trade from a win rate and payoff ratio, with the edge per 1R and the break-even win rate. Computed with the same function as Clear Tape's free kelly criterion calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fraction": {
                "description": "Share of full Kelly to use, in percent: 25 = quarter Kelly, 50 = half, 100 = full. Above 0, at most 100.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "payoff": {
                "description": "Payoff ratio: average win divided by average loss (2 = winners twice the size of losers).",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "winRate": {
                "description": "Win rate in percent. Above 0, below 100.",
                "exclusiveMaximum": 100,
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["fraction", "payoff", "winRate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kelly criterion calculator"
