      },
      "instructions": "Clear Tape's free trading-education tools. The calculate_* tools run the same formulas as the calculators on cleartape.ai and return exact results with units; get_trading_system_rules gives the written rules of 11 preset trading systems; lookup_glossary_term and search_learning find definitions and lessons (English or Chinese: lang \"zh\"). There is no market data (no prices, quotes, charts or signals). Quote numbers from the results rather than estimating them, link the page each result names, and present results as education, not investment advice.",
      "tools": [
        {
          "name": "calculate_atr_stop",
          "title": "ATR stop-loss calculator",
          "description": "A volatility (ATR) stop: entry minus (long) or plus (short) a multiple of the average true range. Give atr, or at least five recent daily ranges (high minus low). Computed with the same function as Clear Tape's free atr stop-loss calculator page (linked in the result), not estimated. Returns the inputs, each result with its unit, the formula and the page link. Educational, not investment advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "atr": {
                "description": "Average true range in USD (e.g. the 14-day ATR). Give this or ranges.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "entry": {
                "description": "Entry price per share in USD.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "number"
              },
              "lang": {
                "default": "en",
                "description": "Language of the returned text: \"en\" (default) or \"zh\" (Simplified Chinese).",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "multiple": {
                "description": "ATR multiple for the stop distance, commonly 1.5 to 3.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "ranges": {
                "description": "Alternative to atr: 5 to 500 recent daily ranges (high minus low) in USD; their average stands in for the ATR.",
                "items": {
                  "description": "One daily range in USD.",
                  "exclusiveMinimum": 0,
                  "maximum": 10000000,
                  "type": "number"
                },
                "maxItems": 500,
                "minItems": 5,
                "type": "array"
              },
              "side": {
                "default": "long",
                "description": "Trade direction: \"long\" (default) or \"short\".",
                "enum": ["long", "short"],
                "type": "string"
              }
            },
            "required": ["entry", "multiple"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ATR stop-loss calculator"
          },
          "behavior": {
            "destructive": false,
