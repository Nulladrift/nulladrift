          "name": "buy_shelf_pass",
          "title": "Shelf Pass — 110 prepaid credits",
          "description": "Shelf Pass — 110 prepaid credits. 110 prepaid credits for $0.99 ($1.10 of calls). 1 credit = $0.01 of list price: a $0.03 carrier check uses 3 credits, a $0.02 sanctions screen uses 2. Valid on data shelves priced at $0.25 or less (FX, carrier, broker and sanctions checks, Texas CE, the load-vet pack, instant Swahili localization). The pass token travels in the X-SHELF-PASS header, so a call needs no separate wallet payment. $0.99 USDC on Base. Returns the x402 URL to GET (402 → PAYMENT-SIGNATURE → delivery). Free to call this tool; payment happens on the URL.",
