                "maxLength": 120,
                "type": "string"
              },
              "delivery": {
                "description": "lagos_office | lagos_home | other_state_home (optional, default lagos_office)",
                "maxLength": 120,
                "type": "string"
              },
              "destination": {
                "description": "NG (required)",
                "maxLength": 120,
