        {
          "name": "list_events",
          "title": "Recent announcements across funds",
          "description": "Lists recent announcements across all U.S. closed-end funds (buy-back offers, votes, closings, mergers, offers of new shares, payout notices), newest first, each with the fund, the deadline and what to do, from SEC filings, with as-of dates and links to the original documents. Results are informational, read automatically from public filings and may contain errors; always show the source link and never present results as personal investment advice.",
          "inputSchema": {
            "properties": {
              "kind": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only one kind of announcement, written as its code: tender_offer (offer to buy back shares), tender_update (buy-back offer updated), tender_result (buy-back offer results), proxy_contest (a fight over the shareholder vote), liquidation (closing down), open_ending (vote on becoming a regular mutual fund), term_change (vote on the fund's planned closing date), merger (folding into another fund), merger_acquirer (taking in another fund), rights_offering (offer of more shares to holders), share_offering (may sell new shares), managed_distribution (fixed payout notice), preferred_redemption (repaying borrowed money), deregistration (stopped reporting to the regulator), delisting (shares no longer trade).",
                "title": "Kind"
              },
              "only_open": {
                "default": false,
                "description": "True = only announcements a holder can still act on.",
                "title": "Only Open",
                "type": "boolean"
              },
              "since": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only announcements filed on or after this date, written YYYY-MM-DD.",
                "title": "Since"
              }
            },
