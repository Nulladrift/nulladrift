      "instructions": "CEF Radar answers questions about U.S. closed-end funds from public filings at the U.S. Securities and Exchange Commission: whether a large investor is pushing for changes at a fund, whether the fund has announced something a holder must act on and by when, what the fund costs, how much it borrows and what it holds. The person asking is usually a retiree who holds a few funds. Answer in plain words, repeat the as-of date of every number and give the link to the original document. Never use form codes or regulator jargon; say 'notice', 'the fund's yearly report', 'the value of the fund's holdings'. Nothing here is investment advice. Start with search_funds when you only have a name, then get_fund for the full picture. Results are informational, read automatically from public filings and may contain errors; always show the source link and never present results as personal investment advice.",
      "tools": [
        {
          "name": "get_activist",
          "title": "One large investor",
          "description": "Describes one large investor in plain words: how many funds it is in and where it is pushing for changes, what it usually does, the funds it has left and its recent moves, from SEC filings, with as-of dates and links to the original documents. Results are informational, read automatically from public filings and may contain errors; always show the source link and never present results as personal investment advice.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The investor's short name from list_activists, e.g. saba.",
                "maxLength": 80,
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "title": "get_activistArguments",
            "type": "object"
