          "title": "One fund: who is targeting it, what to act on, costs",
          "description": "Tells you, in plain words, whether a large investor is targeting a U.S. closed-end fund, whether the fund has announced something you must act on and by when, what it costs, how much it borrows, how big it is and what it holds, from SEC filings, with as-of dates and links to the original documents. Results are informational, read automatically from public filings and may contain errors; always show the source link and never present results as personal investment advice.",
