      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "linkhatch",
        "title": "LinkHatch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LinkHatch sells editorial link building, digital PR and outreach, each with a receipt. Packages are billed monthly in advance as credits. A link uses its credits when its receipt shows it live, indexed and dofollow. PR is invoiced when it runs. You approve every site (DR, traffic, page and credit cost) before any outreach. Use get_catalog first, estimate_price to quote, and place_order only after your user confirms. The order starts once its owner confirms from the email we send them.",
      "tools": [
        {
          "name": "estimate_price",
          "title": "Estimate an order",
          "description": "Indicative price for an order before placing it. Final prices are confirmed when the sites are approved.",
          "inputSchema": {
            "properties": {
              "addons": {
                "description": "Monthly plans only. outreach = Relationship outreach: genuine article swaps; each live earned link uses plan credits by site tier (2 Standard, 3 Plus, 5 Premium), no extra fee, no fixed link count.",
                "items": {
                  "enum": ["outreach"],
                  "type": "string"
                },
                "type": "array"
              },
              "content_item": {
                "description": "kind=content only. article = one-off, set quantity (1 to 20); content-package = monthly, 5 articles.",
                "enum": ["article", "content-package"],
                "type": "string"
              },
              "credits": {
                "description": "Agency plan only: credits a month (10+, $135 each at 25+).",
                "minimum": 10,
                "type": "integer"
              },
              "kind": {
                "description": "audit = free link plan (pages to push, competitor links you lack, costs); plan = monthly credit plan (plans only: LinkHatch does not sell single links, the smallest plan is Starter, 5 links a month); content = content writing ($250 an article up to 1,500 words, or the $1,250 monthly package of 5); pr = PR item; outreach = cold email campaign; quote = anything else",
                "enum": ["audit", "plan", "content", "pr", "outreach", "quote"],
                "type": "string"
              },
              "plan": {
                "enum": ["starter", "growth", "agency"],
                "type": "string"
              },
              "pr_item": {
                "enum": ["expert-quote", "press-release", "story-campaign"],
                "type": "string"
              },
              "quantity": {
                "description": "PR items only.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfd9c875e9bc41aca6a03df5a8bc85db4a02ac57e853b0dcd47436a1d2c02597"
        },
        {
          "name": "get_catalog",
          "title": "LinkHatch catalog",
          "description": "Services, link tiers (DR and traffic floors), monthly plans, agency rates, PR prices and policies (billing, 6-month replacement, approval, exclusions). Prices in USD.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24f5db4f7a7b941a33d18e2ec15b4b839d51f700f51ae675e7425ec1afdf2aac"
        },
        {
          "name": "place_order",
          "title": "Place an order or request",
          "description": "Send LinkHatch an order or request. We email the owner of `email` a link to confirm it (status awaiting_confirmation); nothing is placed, charged or sent to anyone until they press Confirm. After that, we reply to that address with the site shortlist for approval or a quote, and monthly plans go straight to Stripe checkout. Confirm the details with your user before calling, and tell them to look for the email.",
          "inputSchema": {
            "properties": {
              "addons": {
                "description": "Monthly plans only. outreach = Relationship outreach: genuine article swaps; each live earned link uses plan credits by site tier (2 Standard, 3 Plus, 5 Premium), no extra fee, no fixed link count.",
                "items": {
                  "enum": ["outreach"],
                  "type": "string"
                },
                "type": "array"
              },
              "agent_name": {
                "description": "Name of the agent placing the order.",
                "type": "string"
              },
              "budget_usd": {
                "type": "number"
              },
              "company": {
                "type": "string"
              },
              "competitors": {
                "description": "Two or more competitor domains, comma separated.",
                "type": "string"
              },
              "content_item": {
                "description": "kind=content only. article = one-off, set quantity (1 to 20); content-package = monthly, 5 articles.",
                "enum": ["article", "content-package"],
                "type": "string"
              },
              "credits": {
                "description": "Agency plan only: credits a month (10+, $135 each at 25+).",
                "minimum": 10,
                "type": "integer"
              },
              "deadline": {
                "type": "string"
              },
              "email": {
                "description": "Contact email for the human who owns the order. We reply here.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Reuse it when retrying the same order so the owner gets one confirmation email, not two.",
                "type": "string"
              },
              "kind": {
                "description": "audit = free link plan (pages to push, competitor links you lack, costs); plan = monthly credit plan (plans only: LinkHatch does not sell single links, the smallest plan is Starter, 5 links a month); content = content writing ($250 an article up to 1,500 words, or the $1,250 monthly package of 5); pr = PR item; outreach = cold email campaign; quote = anything else",
                "enum": ["audit", "plan", "content", "pr", "outreach", "quote"],
                "type": "string"
              },
              "min_dr": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "niche": {
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Person or company the agent acts for.",
                "type": "string"
              },
              "plan": {
                "enum": ["starter", "growth", "agency"],
                "type": "string"
              },
              "pr_item": {
                "enum": ["expert-quote", "press-release", "story-campaign"],
                "type": "string"
              },
              "quantity": {
                "description": "PR items only.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "site": {
                "description": "Domain to build links to (required for audit and plan).",
                "type": "string"
              },
              "target_pages": {
                "description": "Pages the links should point to.",
                "type": "string"
              }
            },
            "required": ["email", "kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
