        {
          "name": "freelance_rate_floor",
          "title": "Freelance Rate Floor",
          "description": "Freelance Rate Floor — Calculates the hourly rate a freelancer must bill to match a given salary after self-employment tax and lost benefits. Returns a one-line verdict plus a link to the full interactive page with the numbers pre-filled. Accepts only numbers and enums.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annualBenefitsValue": {
                "description": "A non-negative number (US dollars unless the field name says otherwise).",
                "minimum": 0,
                "type": "number"
              },
              "billableHoursPerYear": {
                "description": "A non-negative number (US dollars unless the field name says otherwise).",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "currentSalary": {
                "description": "A non-negative number (US dollars unless the field name says otherwise).",
                "minimum": 0,
                "type": "number"
              },
              "filingStatus": {
                "description": "One of: single, married_joint, married_separate, head_of_household.",
                "enum": ["single", "married_joint", "married_separate", "head_of_household"],
                "type": "string"
              },
              "stateCode": {
                "description": "Two-letter US state code, e.g. CA, TX, NY.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "year": {
                "description": "Tax year, e.g. 2026. Omit to use the current tax year.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "required": ["annualBenefitsValue", "currentSalary", "filingStatus", "stateCode"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
