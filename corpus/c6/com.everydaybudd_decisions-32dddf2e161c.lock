        {
          "name": "best_filing_status",
          "title": "Married Filing Jointly vs Separately",
          "description": "Married Filing Jointly vs Separately — Compares Married Filing Jointly vs Separately for a couple and says which keeps more, including lost credits. Returns a one-line verdict plus a link to the full interactive page with the numbers pre-filled. Accepts only numbers and enums.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hasChildcareExpenses": {
                "description": "true or false.",
                "type": "boolean"
              },
              "investmentIncome": {
                "description": "A non-negative number (US dollars unless the field name says otherwise).",
                "minimum": 0,
                "type": "number"
              },
              "otherDependents": {
                "description": "A non-negative number (US dollars unless the field name says otherwise).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "qualifyingChildren": {
                "description": "A non-negative number (US dollars unless the field name says otherwise).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "spouseA": {
                "properties": {
                  "income": {
                    "description": "A non-negative number (US dollars unless the field name says otherwise).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "itemizedDeductions": {
                    "description": "A non-negative number (US dollars unless the field name says otherwise).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "retirementContributions": {
                    "description": "A non-negative number (US dollars unless the field name says otherwise).",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["income"],
                "type": "object"
              },
              "spouseB": {
                "properties": {
                  "income": {
                    "description": "A non-negative number (US dollars unless the field name says otherwise).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "itemizedDeductions": {
                    "description": "A non-negative number (US dollars unless the field name says otherwise).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "retirementContributions": {
                    "description": "A non-negative number (US dollars unless the field name says otherwise).",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["income"],
                "type": "object"
              },
              "year": {
                "description": "Tax year, e.g. 2026. Omit to use the current tax year.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "required": ["spouseA", "spouseB"],
