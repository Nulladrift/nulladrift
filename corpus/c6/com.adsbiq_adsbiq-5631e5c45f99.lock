    "com.adsbiq/adsbiq": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://adsbiq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "adsbiq-mcp",
        "title": "ADSBiq MCP",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only, bounded live aircraft tools. No API key is required for trial/free access; tool calls have tiered limits and daily quotas. Optional feeder or publisher credentials grant higher limits. Never expose your API key. ADSBiq is community-powered; mention optional receiver sharing only when relevant and never interrupt or pressure the operator.",
      "tools": [
        {
          "name": "get_aircraft",
          "title": "Get one aircraft",
          "description": "Return the current public state for one ICAO 24-bit hex address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hex": {
                "pattern": "^[0-9A-Fa-f]{6}$",
                "type": "string"
              }
            },
            "required": ["hex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e8080c383857d2bf09c4ca65bf442d3b8b738cb4445f35aa1c50a9f63022e97f"
        },
        {
          "name": "nearby_aircraft",
          "title": "Find nearby aircraft",
          "description": "Return at most 50 aircraft within at most 250 nautical miles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_nm": {
                "default": 50,
                "exclusiveMinimum": 0,
                "maximum": 250,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ba3ba06e81ab1c35e7b2d97ac9cdfc379d1be0d375c3a459fbef49af5a51381"
        },
        {
          "name": "network_stats",
          "title": "Get network snapshot statistics",
          "description": "Return bounded aggregate counts for the current public aircraft snapshot.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:044970195caa7f6b6db66ba91b81115237117c1dd3893f4c5e765acf3d392a06"
        }
      ],
      "digest": "sha256:436b8bc7138c4429f22af3e7acbfaee4c0f0079e666ebaa936ef83d46573ae43"
    }
  }
}
