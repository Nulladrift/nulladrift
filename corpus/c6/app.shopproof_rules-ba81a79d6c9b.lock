{
  "lockfileVersion": 2,
  "subjects": {
    "app.shopproof/rules": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shopproof.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "shopproof",
        "title": "Shopproof EU shop rules",
        "version": "0.1.0",
        "websiteUrl": "https://shopproof.app/mcp/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Shopproof answers what an online shop must do to sell to consumers in the EU, with full detail for Austria, Germany, France, Italy and the Netherlands. Start with what_applies for a shop's countries, use get_rule or search_rules for one rule, upcoming_deadlines for what starts soon, withdrawal_wording for button texts, check_shop to look at a live shop, get_guide for step-by-step guides and install_links for the free app or plugin. Every answer names the official source: cite it. This is technical help, not legal advice; say so when you pass answers on, and never call a shop \"compliant\".",
      "tools": [
        {
          "name": "check_shop",
          "title": "Check a shop",
          "description": "Runs the free Shopproof shop check on a public shop address: withdrawal button and information, legal notice, dispute statement, price display, product safety details, accessibility basics and more, for customers in AT, DE, FR, IT or NL. Reads only public pages and takes up to 30 seconds. Limited to a few checks per hour. Technical help, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Customers' country; guessed from the shop if left out",
                "enum": ["AT", "DE", "FR", "IT", "NL"],
                "type": "string"
              },
              "url": {
                "description": "The shop address, such as example-shop.de",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:178d3c79b965c5fa107a4caf6dbc9e7f172e38a98690277f38a4b4b3657cb9f1"
        },
        {
          "name": "get_guide",
          "title": "Find a guide",
          "description": "Finds the shopproof.app guide for a topic (withdrawal button, guarantee notice, GPSR, accessibility, batteries, packaging, IOSS, EU responsible person and more), optionally step by step for Shopify, WooCommerce or Shopware, in English, German, French, Italian or Dutch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["en", "de", "fr", "it", "nl"],
                "type": "string"
              },
              "platform": {
                "enum": ["shopify", "woocommerce", "shopware", "jtl"],
                "type": "string"
              },
              "topic": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd9f9fd8bd1689c7ff6d24d29889dd4bb9bc57da102bb5a6d41ede1f6dbeda6a"
        },
        {
          "name": "get_rule",
          "title": "Get one rule",
          "description": "One Shopproof rule by its ID (such as DE-WD-01 or EU-PS-01): the requirement, what the shop must do, the date, the legal basis and the official source. Technical help, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Rule ID such as DE-WD-01",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:344a108e6e05a934da071f06fe12ad2c640018f3b5df40b540f5a29ece1dd02b"
        },
        {
          "name": "install_links",
          "title": "Free install links",
          "description": "Links to install the free Shopproof app or plugin for Shopify, WooCommerce, Shopware or JTL-Shop, and the free Shopproof Accessibility and Restock plugins for WooCommerce.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "platform": {
                "enum": ["shopify", "woocommerce", "shopware", "jtl"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Free install links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc79634d84c206e93340f398e2e9307c589f97c18fdada2accc47566d15932f1"
        },
        {
          "name": "search_rules",
          "title": "Search rules",
          "description": "Search the published Shopproof rules for EU online shops by words (for example \"withdrawal button\", \"GPSR manufacturer\", \"battery take-back\"), optionally for one country. Returns IDs, titles, dates and official sources. Technical help, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code, or EU for EU-wide rules only",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A few words",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef1f45ef4a2b62b7f413f93df94dc18166037cbb51f5e2854c08193a530e2024"
        },
        {
          "name": "upcoming_deadlines",
          "title": "Upcoming deadlines",
          "description": "Rules for EU online shops that start applying in the coming days (default 90), for the EU and optionally chosen countries, each with the date and the official source. Technical help, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Countries to include besides the EU-wide rules; all if left out",
                "items": {
                  "description": "Two-letter country code, such as DE",
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "How far ahead to look, default 90",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Upcoming deadlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:feb587ac9bd5642d796bb068bc3d7227c99aa28899c4f89a6a3f2912125397fe"
        },
        {
          "name": "what_applies",
          "title": "What applies to my shop",
          "description": "Which EU and national consumer rules apply to an online shop that sells to consumers in the given EU countries, with what the shop must show, the date each rule applies from, the official source, and the free Shopproof feature that covers it. Full detail for the EU and Austria, Germany, France, Italy and the Netherlands. Rules that depend on what the shop sells come under check_if unless \"sells\" is given. Technical help, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "established_in": {
                "description": "Where the shop business is established: a two-letter country code, or \"outside_eu\"",
                "type": "string"
              },
              "sell_to": {
                "description": "EU countries the shop sells to, such as [\"DE\", \"FR\"]",
                "items": {
                  "description": "Two-letter country code, such as DE",
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "maxItems": 27,
                "minItems": 1,
                "type": "array"
              },
              "sells": {
                "description": "What the shop sells, to leave out rules that do not apply",
                "items": {
                  "enum": ["physical_goods", "digital_content", "services", "subscriptions", "batteries", "electrical_goods", "textiles", "hazardous_chemicals"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["sell_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What applies to my shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78d70b1e75bd0ba32ea4232280d6b258db9ceabb8ad9067fb4f1d4c54ec1fffc"
        },
        {
          "name": "withdrawal_wording",
          "title": "Withdrawal button wording",
          "description": "The wording for the EU withdrawal button and its confirmation button (Directive (EU) 2023/2673): the reviewed national wording for Austria, Germany, France, Italy and the Netherlands with alternatives, or the directive wording in any of the 24 official EU languages, each with the official source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Two-letter EU language code, such as de or sv",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Withdrawal button wording"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f99a812bd14eca7c563a84de80f96844ee801b9bd8bc0e2fbad59fa844bda1c"
        }
      ],
      "digest": "sha256:70f39238fe48ad92eb6342aa35b445b9d83afb0d4c01af6267047dcea127338f"
    }
  }
