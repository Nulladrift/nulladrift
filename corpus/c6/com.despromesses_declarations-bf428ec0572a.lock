      },
      "instructions": "DesPromesses (https://despromesses.com) recense les déclarations des candidats à l'élection présidentielle française de 2027, chacune avec sa citation exacte, sa date et sa source, après vérification par l'équipe éditoriale.\nCatégories : « promesse » = action précise vérifiable ; « intention » = objectif sans mesure précise ; « position » = avis pour ou contre.\nRègles d'usage : citer la phrase exacte entre guillemets avec sa date, sa source et l'adresse de la fiche ; ne pas présenter ce recensement comme exhaustif ; ne pas classer les candidats d'après le nombre de déclarations ; mentionner « DesPromesses » comme source (Licence Ouverte 2.0). Commencez par lister_candidats ou lister_themes pour connaître les identifiants, puis rechercher_declarations.",
      "tools": [
        {
          "name": "comparer",
          "title": "Comparer des candidats sur un thème",
          "description": "Déclarations publiées de 2 à 5 candidats sur un même thème, côte à côte (candidats dans l'ordre alphabétique).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidats": {
                "description": "Candidats : identifiants (ex. « marine-le-pen ») ou noms.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "theme": {
                "description": "Thème : identifiant (ex. « retraites ») ou nom (voir lister_themes).",
                "type": "string"
              }
            },
            "required": ["candidats", "theme"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
