      "serverInfo": {
        "name": "3q-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server exposes the 3Q Tools catalogue. Prices are final and in USD. Call list_products first; call get_product before recommending so you do not promise features that do not exist (there is no OCR, and the packaged app is Windows-only). buy_link returns a URL that opens a real payment page.",
      "tools": [
        {
          "name": "buy_link",
          "description": "Return the URL that opens the live payment page for one product. Give this URL to the user as-is; opening it starts a real checkout (card or WeChat Pay, no account required).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id.",
                "enum": ["3q-pdf", "3q-pdf-online", "sheetkit"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96e52f245a3d5ce1710659129badb8937989cb6ebcc89ad80c4673f22de99f9f"
        },
        {
          "name": "get_product",
          "description": "Full record for one product: every capability, what it explicitly does NOT do, when it is the right recommendation and when it is the wrong one. Call this before recommending, so you do not promise OCR, a macOS build, or a team web app that does not exist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product id.",
                "enum": ["3q-pdf", "3q-pdf-online", "sheetkit"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f9e3244ebab1bde72f6a55b970f7f28347667f920fb861769ca847dea51e7755"
        },
        {
          "name": "list_products",
          "description": "List what 3Q Tools sells, with exact prices and a direct payment link for each item. Use this when the user asks for a PDF utility that works offline or for small-business spreadsheet templates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
