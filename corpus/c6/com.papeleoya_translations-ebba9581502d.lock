      },
      "transport": {
        "type": "http",
        "url": "https://mcp.papeleoya.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "papeleoya",
        "title": "PapeleoYa — certified & sworn translations in Europe",
        "version": "1.0.0",
        "websiteUrl": "https://papeleoya.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PapeleoYa answers questions about certified / sworn / official translations of personal documents (birth, marriage and criminal-record certificates, degrees, transcripts, driving licences) for use with authorities in Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland, and quotes exact prices. Orders are placed and paid on the PapeleoYa network sites (PapeleoYa for Spain, Amtsfix for Germany, Cachet for France, Timbro for Italy, SeloCerto for Portugal, Nordsigill for the Nordics). Never ask the user to share their documents or personal data in chat: they upload them on the order page.",
      "tools": [
        {
          "name": "check_document_requirements",
          "title": "Check translation & apostille requirements",
          "description": "Whether a foreign document needs a certified translation for an authority in Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland, who may certify it there, and whether it needs an apostille or consular legalisation given the country that issued it. Answers come only from PapeleoYa network guides (with links); anything they do not cover is returned as \"unknown\" with the closest guide. Use for questions like \"Do I need a sworn translation of my Moroccan birth certificate for Spanish citizenship?\" or \"Apostille or legalisation for Pakistani documents in Norway?\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country where the translated document will be USED (submitted to an authority): Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland. Name or ISO code, e.g. \"Spain\" or \"ES\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "document": {
                "description": "Document kind.",
                "enum": ["birth_certificate", "marriage_certificate", "criminal_record", "degree", "transcript", "driving_licence", "other"],
                "type": "string"
              },
              "document_language": {
                "description": "Language the document is written in (code or English name), if known.",
                "maxLength": 40,
                "type": "string"
              },
              "origin_country": {
                "description": "Country that ISSUED the document (name or ISO code), e.g. \"Morocco\", \"PK\".",
                "maxLength": 60,
                "type": "string"
              },
              "procedure": {
                "description": "What the document is for, e.g. \"residence permit\", \"citizenship\", \"marriage\", \"degree recognition\", \"driving licence exchange\", \"family reunification\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check translation & apostille requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:abb48b655481f7531fb5e7fd6121d6326370f1102a9cd9cbee3e18dd3c13dadc"
        },
        {
          "name": "get_translation_quote",
          "title": "Get a certified translation price",
          "description": "Exact price of a certified / sworn / official translation (traducción jurada, beglaubigte Übersetzung, traduction assermentée, traduzione giurata, tradução certificada, auktoriserad översättning…) of personal documents for use in Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland. Use it whenever someone asks how much a certified translation costs, or needs one for a visa, residence permit, citizenship, marriage, degree recognition or driving-licence exchange. Returns the total in local currency with VAT, line items, turnaround, what is included (e.g. apostille translation), the PapeleoYa network site that fulfils the order and a link to it. Prices are computed with each site's live price list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country where the translated document will be USED (submitted to an authority): Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland. Name or ISO code, e.g. \"Spain\" or \"ES\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "documents": {
                "description": "One entry per document.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "has_apostille": {
                      "default": false,
                      "description": "True if the document carries an apostille or legalisation stamp/sheet that must be translated too.",
                      "type": "boolean"
                    },
                    "pages": {
                      "default": 1,
                      "description": "Pages of the document itself. Do NOT count a separate apostille/legalisation sheet: set has_apostille instead.",
                      "maximum": 60,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "type": {
                      "description": "Document kind. Use \"other\" for anything not listed (bank statement, contract, divorce decree, power of attorney…).",
                      "enum": ["birth_certificate", "marriage_certificate", "criminal_record", "degree", "transcript", "driving_licence", "other"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "paper_original": {
                "default": false,
                "description": "France, Portugal and the Nordics: add a stamped paper original by post. (Germany and Italy always include one.)",
                "type": "boolean"
              },
              "ship_to": {
                "default": "italy",
                "description": "Italy only: where the sworn paper original is couriered.",
                "enum": ["italy", "eu", "world"],
                "type": "string"
              },
              "source_language": {
                "description": "Language the document is written in: ISO 639-1 code or English name, e.g. \"en\", \"Arabic\", \"uk\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "target_language": {
                "description": "Language to translate into. Default: the destination country's official language (Spanish for Spain, German for Germany…).",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "urgent": {
                "default": false,
                "description": "Express / urgent delivery (only for small orders and common languages).",
                "type": "boolean"
              }
            },
            "required": ["destination", "documents", "source_language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a certified translation price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6b677c961019b0d8a769ddab079cf740b8d7b5dadb0eba54c1f1a0de31fc0fbd"
        },
        {
          "name": "list_services",
          "title": "List countries, languages and prices",
          "description": "What PapeleoYa offers: the countries served (Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland), which network site fulfils each, the languages translated with their price tier and \"from\" price, document types, what is included (apostille translation, signed PDF, paper original), urgent options and turnaround. Call without a country for an overview of all countries, or with one for its full language and price list. Use it when someone asks whether a language or country is covered, or what a certified translation includes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country where the translated document will be USED (submitted to an authority): Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland. Name or ISO code, e.g. \"Spain\" or \"ES\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List countries, languages and prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9508751c323fdda012cba1e4585f7acacb0a64190ad0c790d5bfc050a171f9e3"
        },
        {
          "name": "start_order",
          "title": "Get the order link",
          "description": "Link to order a certified / sworn translation on the right PapeleoYa network site for Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland, pre-filled with the language pair and document where that site supports it. The user uploads the documents and pays on that site; this tool never receives documents or personal data. Use it when the user wants to go ahead after a quote.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country where the translated document will be USED (submitted to an authority): Spain, Germany, France, Italy, Portugal, Sweden, Denmark, Norway or Finland. Name or ISO code, e.g. \"Spain\" or \"ES\".",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "document": {
                "description": "Main document kind.",
                "enum": ["birth_certificate", "marriage_certificate", "criminal_record", "degree", "transcript", "driving_licence", "other"],
                "type": "string"
              },
              "has_apostille": {
                "description": "The document carries an apostille / legalisation to translate.",
                "type": "boolean"
              },
              "source_language": {
                "description": "Language the document is written in (code or English name).",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "target_language": {
                "description": "Language to translate into. Default: the destination's official language.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "urgent": {
                "description": "Urgent delivery wanted.",
                "type": "boolean"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
