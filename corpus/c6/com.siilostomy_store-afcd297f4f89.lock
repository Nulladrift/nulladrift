        {
          "name": "get_checkout_link",
          "description": "Get a SIIL checkout link for one shopper-selected product and size/colour.\n\n    Read-only: returns a URL, creates no order/cart and takes no payment. The shopper\n    opens the link and reviews current availability, total, delivery and pays on SIIL.\n    Opening it starts a new cart and can replace an existing cart. Ask for size/colour\n    before selecting a variant. Never request personal, address or card data in chat.\n\n    Args:\n        store: com (WooCommerce) or org (Medusa).\n        product_id: Product ID from get_product or get_org_product, not a variant ID.\n        variant_id: Exact variation ID from that product; required for all size choices.\n        quantity: Integer 1-10.\n        lang: com: en, en-gb, es, fr, de. org: it, pl, cs, sk, sv, da, nb, fi, nl, el, hu, ro, pt, ja.\n        handle: org product slug from get_org_product, in the same language.\n    ",
          "inputSchema": {
            "properties": {
              "handle": {
                "default": "",
                "title": "Handle",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "title": "Lang",
                "type": "string"
              },
              "product_id": {
                "default": 0,
                "title": "Product Id",
                "type": "integer"
              },
              "quantity": {
                "default": 1,
                "title": "Quantity",
                "type": "integer"
              },
              "store": {
                "default": "com",
                "title": "Store",
                "type": "string"
              },
              "variant_id": {
                "default": 0,
                "title": "Variant Id",
                "type": "integer"
