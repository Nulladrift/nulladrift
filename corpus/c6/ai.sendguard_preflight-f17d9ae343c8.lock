{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sendguard/preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.sendguard.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "sendguard",
        "title": "SendGuard",
        "version": "1.0.1"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call preflight_email before your agent sends an email. Send only when decision is \"allow\". On \"requires_approval\" ask a human, on \"delay\" wait delay_seconds, on \"block\" do not send. SendGuard never sends email itself.",
      "tools": [
        {
          "name": "preflight_email",
          "title": "Preflight an outbound email",
          "description": "Check an AI-written email before sending. Returns allow, delay, requires_approval or block with reason codes (recipient validity, sender authentication, content risk, sensitive industries, volume limits) and recommendations. Does not send email. Without an API key: 3 free checks per day per IP.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Your agent identifier (API key callers); used for per-agent limits",
                "type": "string"
              },
              "body": {
                "description": "Email body as plain text",
                "type": "string"
              },
              "campaign_id": {
                "description": "Campaign or sequence identifier (optional); keep it the same for every step of one sequence",
                "type": "string"
              },
              "from_email": {
                "description": "Sender address the agent will send from",
                "type": "string"
              },
              "intent": {
                "description": "Purpose, for example cold_outbound or follow_up",
                "type": "string"
              },
              "policy": {
                "description": "Policy: default, balanced, strict, growth, enterprise, healthcare or recruiting",
                "type": "string"
              },
              "recipient_company": {
                "description": "Recipient company name",
                "type": "string"
              },
              "recipient_country": {
                "description": "Recipient country as ISO 3166-1 alpha-2, for example DE",
                "type": "string"
              },
              "recipient_industry": {
                "description": "Recipient industry, for example healthcare",
                "type": "string"
              },
              "recipient_source": {
                "description": "Where the address came from, for example apollo, website, referral",
                "type": "string"
              },
              "relationship": {
                "description": "Relationship, for example new_prospect or existing_customer",
                "type": "string"
              },
              "sequence_step": {
                "description": "Step of a multi-step sequence: 1 or omitted for the first touch, 2+ for follow-ups. With campaign_id, follow-ups are checked for spacing and a step cap instead of being treated as duplicates",
                "type": "integer"
              },
              "subject": {
                "description": "Email subject",
                "type": "string"
              },
              "to_email": {
                "description": "Recipient address",
                "type": "string"
              },
              "workspace_id": {
                "description": "Your workspace identifier (API key callers)",
                "type": "string"
              }
            },
            "required": ["from_email", "to_email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "approval": {
                "additionalProperties": false,
                "properties": {
                  "queue": {
                    "type": "string"
                  },
                  "reason": {
                    "type": "string"
                  }
                },
                "required": ["queue", "reason"],
                "type": ["null", "object"]
              },
              "billing": {
                "additionalProperties": false,
                "properties": {
                  "balance_remaining": {
                    "type": ["null", "integer"]
                  },
                  "charged": {
                    "type": "boolean"
                  },
                  "mode": {
                    "description": "api_key or anonymous_trial",
                    "type": "string"
                  },
                  "trial_remaining_today": {
                    "type": ["null", "integer"]
                  }
                },
                "required": ["charged", "mode"],
                "type": "object"
              },
              "confidence": {
                "type": "number"
              },
              "decision": {
                "description": "allow, delay, requires_approval or block",
                "type": "string"
              },
              "delay_seconds": {
                "type": "integer"
              },
              "next_step": {
                "type": "string"
              },
              "reasons": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "severity": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "severity"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "recipient_status": {
                "type": "string"
              },
              "recommendations": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "risk_score": {
                "type": "integer"
              },
              "suggested_email": {
                "type": "string"
              }
            },
            "required": ["billing", "confidence", "decision", "next_step", "risk_score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b26452143b8a21ff031201cbc150c4a17a4758f75879d9faecada50372fb278"
        }
      ],
      "digest": "sha256:e2001565ce4316ae02afaabe5d0d8ae9e61a0ee4a73c8ddf4bd5e0b36e38db1b"
    }
  }
}
