{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sendguard/preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.sendguard.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "sendguard",
        "title": "SendGuard Email Preflight API",
        "version": "1.0.1"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Call preflight_email before your agent sends an email. Send only when decision is \"allow\". On \"requires_approval\" hold for trusted human review, on \"delay\" wait delay_seconds and retry preflight, on \"block\" do not send. Your sender must enforce the decision; SendGuard never sends email itself. Without an API key, call start_signup and have a human approve it; use get_pricing, get_account and create_topup_link to manage credits. Tool errors are JSON objects with error and next_action fields.",
      "tools": [
        {
          "name": "create_topup_link",
          "title": "Create a top-up payment link",
          "description": "Create a hosted Stripe checkout link for a prepaid top-up. A human must open the link and pay; no money moves until they do. Needs an API key with the billing:topup scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Optional key; retries with the same key return the same link instead of creating a new one",
                "type": "string"
              },
              "package_id": {
                "description": "Top-up package from get_pricing, for example pilot or growth. Defaults to pilot",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkout_url": {
                "type": "string"
              },
              "credits": {
                "type": "integer"
              },
              "expires_at": {
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "package_id": {
                "type": "string"
              },
              "price_usd_cents": {
                "type": "integer"
              }
            },
            "required": ["checkout_url", "credits", "next_step", "package_id", "price_usd_cents"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc5c7a9dd53c77b95e6d654b3baaec46f4606c706d08393ff2d16a046223eb90"
        },
        {
          "name": "get_account",
          "title": "Get account balance",
          "description": "Show the plan, remaining credits and auto-recharge settings for the connected API key's account.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["account"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:70ef580a5cb3ea4a38ba73b9f00d55c5ce655e252cd7846d5d8f758dea73c74e"
        },
        {
          "name": "get_pricing",
          "title": "Get SendGuard pricing",
          "description": "List subscription plans and prepaid top-up packages with prices. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "notes": {
                "type": "string"
              },
              "plans": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "top_ups": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["notes", "plans", "top_ups"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d5d772e3eedd2977ee39d5b64ac9499083785cc0ff43006e478efddf7137405"
        },
        {
          "name": "poll_signup",
          "title": "Check signup approval",
          "description": "Check whether a human approved the request from start_signup. Returns the API key exactly once when approved; store it securely.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "device_code": {
                "description": "device_code returned by start_signup",
                "type": "string"
              }
            },
            "required": ["device_code"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "scopes": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "status": {
                "description": "pending, approved, denied or expired",
                "type": "string"
              }
            },
            "required": ["next_step", "status"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18ca18d560291bb112e8fb7d40638b795901b6a4d411c0b539fcfb289ab790f0"
        },
        {
          "name": "preflight_email",
          "title": "Preflight an outbound email",
          "description": "Check an email before an AI agent sends it using SendGuard's Email Preflight API. Returns allow, delay, requires_approval or block with reason codes (recipient validity, sender authentication, content risk, sensitive industries, volume limits) and recommendations. Your sender or workflow must enforce the decision. Does not send email. Without an API key: 3 free checks per day per IP.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Your agent identifier (API key callers); used for per-agent limits",
                "type": "string"
              },
              "body": {
                "description": "Email body as plain text",
                "type": "string"
              },
              "campaign_id": {
                "description": "Campaign or sequence identifier (optional); keep it the same for every step of one sequence",
                "type": "string"
              },
              "from_email": {
                "description": "Sender address the agent will send from",
                "type": "string"
              },
              "intent": {
                "description": "Purpose, for example cold_outbound or follow_up",
                "type": "string"
              },
              "policy": {
                "description": "Policy: default, balanced, strict, growth, enterprise, healthcare or recruiting",
                "type": "string"
              },
              "recipient_company": {
                "description": "Recipient company name",
                "type": "string"
              },
              "recipient_country": {
                "description": "Recipient country as ISO 3166-1 alpha-2, for example DE",
                "type": "string"
              },
              "recipient_industry": {
                "description": "Recipient industry, for example healthcare",
                "type": "string"
              },
              "recipient_source": {
                "description": "Where the address came from, for example apollo, website, referral",
                "type": "string"
              },
              "relationship": {
                "description": "Relationship, for example new_prospect or existing_customer",
                "type": "string"
              },
              "sequence_step": {
                "description": "Step of a multi-step sequence: 1 or omitted for the first touch, 2+ for follow-ups. With campaign_id, follow-ups are checked for spacing and a step cap instead of being treated as duplicates",
                "type": "integer"
              },
              "subject": {
                "description": "Email subject",
                "type": "string"
              },
              "to_email": {
                "description": "Recipient address",
                "type": "string"
              },
              "workspace_id": {
                "description": "Your workspace identifier (API key callers)",
                "type": "string"
              }
            },
            "required": ["from_email", "to_email"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "approval": {
                "additionalProperties": false,
                "properties": {
                  "queue": {
                    "type": "string"
                  },
                  "reason": {
                    "type": "string"
                  }
                },
                "required": ["queue", "reason"],
                "type": ["null", "object"]
              },
              "billing": {
                "additionalProperties": false,
                "properties": {
                  "balance_remaining": {
                    "type": ["null", "integer"]
                  },
                  "charged": {
                    "type": "boolean"
                  },
                  "mode": {
                    "description": "api_key or anonymous_trial",
                    "type": "string"
                  },
                  "trial_remaining_today": {
                    "type": ["null", "integer"]
                  }
                },
                "required": ["charged", "mode"],
                "type": "object"
              },
              "confidence": {
                "type": "number"
              },
              "decision": {
                "description": "allow, delay, requires_approval or block",
                "type": "string"
              },
              "delay_seconds": {
                "type": "integer"
              },
              "next_step": {
                "type": "string"
              },
              "reasons": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "severity": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "severity"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "recipient_status": {
                "type": "string"
              },
              "recommendations": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "risk_score": {
                "type": "integer"
              },
              "suggested_email": {
                "type": "string"
              }
            },
            "required": ["billing", "confidence", "decision", "next_step", "risk_score"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:809f80c104d879d93318b152567f43d44f9d9bb5d40530e6fd7751278b771bcb"
        },
        {
          "name": "start_signup",
          "title": "Request an API key",
          "description": "Start the device signup flow. Returns a user_code and verification_url for a human to approve in the SendGuard dashboard, and a device_code to pass to poll_signup. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "monthly_spend_cap_usd": {
                "description": "Optional monthly cap on purchases made with the key, in USD",
                "type": ["null", "number"]
              },
              "scopes": {
                "description": "Requested scopes: preflight:read, verify:create, billing:topup, billing:autorecharge. Defaults to preflight:read and verify:create",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "device_code": {
                "type": "string"
              },
              "expires_in": {
                "type": "integer"
              },
              "interval": {
                "type": "integer"
              },
              "next_step": {
                "type": "string"
              },
              "user_code": {
                "type": "string"
              },
              "verification_url": {
                "type": "string"
              }
            },
            "required": ["device_code", "expires_in", "interval", "next_step", "user_code", "verification_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:88dc917deb493822db27f8ef3f83aebc661056f20657f8ffa8d738378ad6df92"
        }
      ],
      "digest": "sha256:2e3c5d7dab39a749589dbdae715ef5d416c7f7cb926517336576f32805b99cb8"
    }
  }
}
