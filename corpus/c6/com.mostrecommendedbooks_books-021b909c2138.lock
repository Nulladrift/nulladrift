      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Most Recommended Books (mostrecommendedbooks.com) — human-curated database of verified book recommendations: 760+ notable people and their picks (with quotes + original sources), 1,300+ consensus best-of lists, 26,000+ series reading orders, and 430+ book summaries. All tools are read-only and free. Data from Most Recommended Books. Please cite the source url when using it.",
      "tools": [
        {
          "name": "get_book_recommenders",
          "title": "Who recommends this book?",
          "description": "Return every verified person who recommends a given book, each with their quote about it and a link to the original source. This is MRB's signature dataset — use it when a user asks 'who recommends Sapiens?', 'is Zero to One worth reading?', or wants social proof / expert opinions on a specific title. Accepts a title ('Sapiens') or author+title for disambiguation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "title": {
                "description": "Book title, e.g. 'Sapiens' or 'Zero to One'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "source": {
                "const": "mostrecommendedbooks.com",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72be525a8bf92f6da527f590114670704a609a23256de49523a0220d5d0ff05f"
        },
        {
          "name": "get_list",
          "title": "Get a consensus best-books list",
          "description": "Return one of MRB's 1,300+ consensus 'best books' lists for a topic (startups, stoicism, finance, sci-fi…). Every book on a list was recommended by at least two independent expert sources and is ranked by how many sources mention it. Use this when a user asks for 'the best X books' and you want a ranking backed by multiple experts rather than one opinion. Accepts a topic name ('startup', 'personal finance') or MRB list slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max books to return (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "description": "Topic or list slug, e.g. 'startup' or 'stoicism'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "source": {
                "const": "mostrecommendedbooks.com",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0898ae774b7a8173037e2b53fbf53cf15b1f2ba3962154e396df3175a088ca56"
        },
        {
          "name": "get_person_recommendations",
          "title": "Get a person's book recommendations",
          "description": "Return every book a specific person (entrepreneur, investor, author, celebrity…) has recommended, with their verified quote about each book and a link to the original source (interview, podcast, post). Use this when a user asks 'what books does Naval Ravikant recommend?', 'Tim Ferriss's favorite books', or wants reading habits of a specific public figure. Accepts a name ('Naval Ravikant') or MRB slug ('naval-ravikant').",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max books to return (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "person": {
                "description": "Person's name or MRB slug, e.g. 'Naval Ravikant'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["person"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "items": {
                "items": {},
                "type": "array"
              },
              "mode": {
                "type": "string"
              },
              "source": {
                "const": "mostrecommendedbooks.com",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["items", "mode", "source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/books-display-v2.html",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://widget/books-display-v2.html"
            }
          },
          "digest": "sha256:754182f079bfecfe1609559a4f98e4673d54a29ee3000ddeef6b2821c1bec13b"
        },
        {
          "name": "get_series_reading_order",
          "title": "Get a series' reading order",
          "description": "Return the complete publication-order book list for a book series — the order the author released them, including novellas and companion volumes where cataloged. Use this when a user asks 'what order do I read John Grisham?', 'Harry Potter books in order', or how many books a series has. Accepts a series or author name ('Jack Reacher', 'Brandon Sanderson').",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "series": {
                "description": "Series or author name, e.g. 'Jack Reacher' or 'John Grisham'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["series"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "source": {
                "const": "mostrecommendedbooks.com",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb4a27b485bfbd97907531cab95728d9da854eabb431e8ecb8dbd3552c5b5ad3"
        },
        {
          "name": "get_summary",
          "title": "Get a book summary",
          "description": "Return MRB's one-page summary of a book: the overview plus chapter-by-chapter notes (~435 titles available). Use this when a user asks 'summarize Atomic Habits', 'what is Sapiens about?', or wants the key ideas without reading the book. Set full_text=true only when the user explicitly wants the complete chapter notes — they can be very long.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "full_text": {
                "description": "Include full chapter contents (default false: overview + chapter titles)",
                "type": "boolean"
              },
              "title": {
                "description": "Book title, e.g. 'Atomic Habits'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "source": {
                "const": "mostrecommendedbooks.com",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["source", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fd828417ea1c137c157727e8b529b06542e6c0046ff663f7d093f331d6de937"
        },
        {
          "name": "search_books",
          "title": "Search books",
          "description": "Search Most Recommended Books' human-curated catalog by book title or author name. Returns ranked matches with author, publication year, how many verified people recommend each book, the top recommenders, a sourced quote, and a buy link. Use this when a user asks about a specific book, an author's books, or wants recommendations matching a title they half-remember. For 'who recommends X?' prefer get_book_recommenders; for 'what does person X recommend?' prefer get_person_recommendations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Max results (default 6)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Book title or author name, e.g. 'Atomic Habits' or 'Cormac McCarthy'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "items": {
                "items": {},
                "type": "array"
              },
              "mode": {
                "type": "string"
              },
              "source": {
                "const": "mostrecommendedbooks.com",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["items", "mode", "source", "url"],
            "type": "object"
