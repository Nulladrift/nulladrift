                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "streak",
                "description": "Sort order: streak=longest streaks first, volume=highest volume, callput=most extreme C/P, premium=biggest dollar",
                "enum": ["streak", "volume", "callput", "premium"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
