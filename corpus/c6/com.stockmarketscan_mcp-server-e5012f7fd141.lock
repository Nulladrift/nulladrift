        "description": "20 tools for US stock screeners, chart patterns, options flow signals and equities research.",
        "websiteUrl": "https://stockmarketscan.com/mcp"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "StockMarketScan exposes US equity screeners, chart patterns, options flow and per-stock research.\n\nTool selection tips:\n- One stock, broad question (\"what's going on with NVDA\") -> get_stock_report. It bundles quote, patterns, options flow, candles and screener membership in one call. Do not assemble that yourself from four tools.\n- \"Which stocks match X\" -> search_setups or search_stocks_in_screeners. Never loop get_screener_data over symbols.\n- Stock-level options flow (aggregated per symbol/day) -> get_options_flow_overview or get_options_flow_timeline.\n  Contract-level detail (one row per option contract) -> get_unusual_options_activity.\n- list_screeners first when you don't know the screener slugs; the list is stable and cached.\n- explain_concept answers \"what is RSI / golden cross / vol-OI ratio\" without spending an API call quota.\n\nAccess: most tools need a paid plan. Anonymous clients get list_screeners, get_stock_info, explain_concept and ping; everything else returns NEEDS_SUBSCRIPTION with a signup link. The Basic plan has no API or MCP access and gets TIER_UPGRADE_REQUIRED.\n\nData is end-of-day/scan based US market data, not tick-level, and it is not investment advice.",
      "tools": [
        {
          "name": "explain_concept",
          "description": "Return a plain-language explanation of a platform-specific term, metric, or screener. Use ONLY for terms that are specific to StockMarketScan (e.g. 'strength_score' which is our internal scoring, or 'hot_prospects' which is our curated screener). Do NOT use for generic finance terms the model already knows: answer those directly. Returns { term, title, explanation, interpretation, related_terms }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "term": {
                "description": "Term to explain, e.g. 'call_put_ratio', 'golden_cross', 'consecutive_days', 'strength_score', 'vol_oi_ratio', 'streak'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
