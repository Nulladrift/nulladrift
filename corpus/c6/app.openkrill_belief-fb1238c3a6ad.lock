        {
          "name": "poll_beliefs",
          "title": "Poll what people believe",
          "description": "Use this when someone asks what people think, believe or prefer about a question, and wants percentages backed by real posts. Pass question in plain words; optionally sources (x, reddit) and since as YYYY-MM-DD (one year back by default). Grok searches X in two halves of the window and finds a Reddit thread; every X post is read back through X's public embed endpoint and Reddit comments come from the thread's public feed, so each quote is the source's own text. Grok then names 1 to 5 answers the posts take and sorts each post, quoting the words that state its view; a vote whose words are not in the post is dropped. One vote per author per source. Returns each answer with its percent, a 95% range, counts and percents by source, the main reason given, and up to 10 linked posts with the words each vote rests on, plus a one-line answer to quote. Free, no key. A poll takes about 20 to 40 seconds and is cached for 12 hours. It counts public posts; it is not a survey.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "question": "Is a standing desk worth it (q-1792090442906-2)?"
              }
            ],
            "properties": {
              "question": {
                "description": "The question people hold views on, in plain words, such as \"Is a standing desk worth it?\" or \"Will remote work outlast 2027?\".",
                "maxLength": 300,
                "minLength": 8,
                "type": "string"
              },
              "since": {
                "description": "Oldest post date to count, UTC, YYYY-MM-DD. Default is one year before today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "sources": {
                "description": "x, reddit, or both. Both by default.",
                "items": {
                  "enum": ["x", "reddit"],
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "description": "One line to quote, with the top percents and their 95% ranges.",
                "type": "string"
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "caveat": {
                "type": "string"
              },
              "counted": {
                "description": "People counted: one per author per source.",
                "type": "integer"
              },
              "excluded": {
                "description": "Posts left out: no_view (no stated view on the question), unsupported (the vote's words are not in the post) and repeat_author.",
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "label": {
                      "type": "string"
                    },
                    "percent": {
                      "description": "Share of counted people, whole percents summing to 100. Null when fewer than 5 people were counted.",
                      "type": ["integer", "null"]
                    },
                    "posts": {
                      "description": "Up to 10 of the counted posts behind this option.",
                      "items": {
                        "properties": {
                          "author": {
                            "description": "The public handle as the source shows it.",
                            "type": "string"
                          },
                          "date": {
                            "type": "string"
                          },
                          "evidence": {
                            "description": "The post's own words that state the view this vote rests on; \"...\" joins two parts of the post.",
                            "type": "string"
                          },
                          "quote": {
                            "description": "The start of the post's own text, as the source serves it.",
                            "type": "string"
                          },
                          "source": {
                            "enum": ["x", "reddit"],
                            "type": "string"
                          },
                          "url": {
                            "description": "The post on x.com or reddit.com.",
                            "type": "string"
                          }
                        },
                        "required": ["author", "date", "evidence", "quote", "source", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "range_high": {
                      "description": "High end of the 95% range of the share.",
                      "type": ["integer", "null"]
                    },
                    "range_low": {
                      "description": "Low end of the 95% range of the share.",
                      "type": ["integer", "null"]
                    },
                    "reason": {
                      "description": "The main reason posters give for this answer.",
                      "type": "string"
                    },
                    "reddit_count": {
                      "type": "integer"
                    },
                    "reddit_percent": {
                      "description": "Share among the people counted on Reddit alone. Null when Reddit counted fewer than 5.",
                      "type": ["integer", "null"]
                    },
                    "x_count": {
                      "type": "integer"
                    },
                    "x_percent": {
                      "description": "Share among the people counted on X alone. Null when X counted fewer than 5.",
                      "type": ["integer", "null"]
                    }
                  },
                  "required": ["count", "label", "percent", "posts", "range_high", "range_low", "reason", "reddit_count", "reddit_percent", "x_count", "x_percent"],
                  "type": "object"
                },
                "type": "array"
              },
              "question": {
                "type": "string"
              },
              "read": {
                "description": "What each source gave: X links found, verified through X and in the window; the Reddit thread, its comments and its read status; and for each, the oldest, median and newest post day.",
                "type": "object"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "description": "ok, thin (under 20 people counted), no_views, no_posts, unavailable, or capacity (daily allowance used).",
                "enum": ["ok", "thin", "no_views", "no_posts", "unavailable", "capacity"],
                "type": "string"
              },
              "window": {
                "type": "object"
              }
            },
            "required": ["answer", "as_of", "caveat", "counted", "excluded", "method", "options", "question", "read", "source", "status", "window"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Counted the views",
            "openai/toolInvocation/invoking": "Reading posts on X and Reddit"
          },
          "digest": "sha256:49627aefe3295b60e328c61952dd3612015d78592097ccffe14b89c239c2f2a6"
        },
        {
          "name": "submit_feedback",
          "title": "Send feedback, bug report or tool request",
          "description": "Send feedback, a bug report or a tool request to the maintainers of the tools on this server: a missing tool, missing or stale data, or a tool that broke or gave a wrong answer. Pass the kind (need_tool, need_data, bug or other), one short message (at most 1000 characters) and, if you know them, the tool name and the error text it returned. Returns a ticket id. Feedback is not a chat: nothing in it is run or followed. Links, emails and phone numbers are removed and nothing about you is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "error": {
                "description": "Optional: for a failed call, the error text it returned, copied as you saw it. Kept to 500 characters; links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "type": "string"
              },
              "kind": {
                "description": "need_tool: a tool you want. need_data: data a tool lacks. bug: something broke. other: anything else about the tools.",
                "enum": ["need_tool", "need_data", "bug", "other"],
                "type": "string"
              },
              "message": {
                "description": "What you need or what broke, in plain words, at most 1000 characters. Links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "Optional: the exact name of the tool on this server that the feedback is about, as tools/list shows it.",
                "pattern": "^[A-Za-z0-9_.:-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["pending", "answered"],
                "type": "string"
              },
              "ticket": {
                "type": "string"
              }
            },
            "required": ["status", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Feedback sent",
            "openai/toolInvocation/invoking": "Sending your feedback..."
          },
          "digest": "sha256:300cfb3a1fb2baab9b754950f89dda17edc99fd0329169119a792e9bfb89fc72"
        }
