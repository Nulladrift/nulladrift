{
  "lockfileVersion": 2,
  "subjects": {
    "com.geoarmtaxi/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geoarmtaxi.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "geoarmtaxi",
        "title": "GeoArm Taxi — Tbilisi ⇄ Yerevan rides",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read the live prices, departure points and times with get_prices_and_schedule before you book, and never reuse old values. A booking made with create_booking is a request: it is not confirmed until a GeoArm Taxi dispatcher contacts the passenger to confirm it. Use the passenger's real name and phone number, as the passenger gave them to you, so the dispatcher can reach them. If your user and your own rules allow it, you may tell us in a few lines how it went with leave_feedback — never include the passenger's personal data.",
      "tools": [
        {
          "name": "create_booking",
          "title": "Request a booking",
          "description": "Sends a booking request for a ride between Tbilisi and Yerevan (a seat, or a whole vehicle) for the passenger. A booking is a request: it is NOT confirmed until a GeoArm Taxi dispatcher contacts the passenger to confirm it. Use the values from get_prices_and_schedule (point, time, car, currency), the passenger's real name and phone, and get the passenger's yes to the price first. Payment is in cash to the driver. Returns the booking number, what was booked, the total, and a status_token for get_booking_status.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Required with `point: \"@addr\"` unless `lat`/`lng` are given",
                "maxLength": 200,
                "type": "string"
              },
              "agent": {
                "description": "If an AI agent makes the booking: its name (e.g. `ChatGPT`, `Claude`). Shown to the dispatcher. When you leave it out, your MCP client's name is used.",
                "maxLength": 80,
                "type": "string"
              },
              "car": {
                "description": "`sprinter` = a seat on the scheduled minibus (the default choice)",
                "enum": ["sprinter", "minivan", "sedan"],
                "type": "string"
              },
              "currency": {
                "description": "One of `currencies` from /api/config; the price is taken from the server",
                "enum": ["GEL", "USD", "AMD"],
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, today or later (Tbilisi date), at most a year ahead",
                "format": "date",
                "type": "string"
              },
              "dir": {
                "description": "`tbs-evn` = Tbilisi → Yerevan, `evn-tbs` = Yerevan → Tbilisi",
                "enum": ["tbs-evn", "evn-tbs"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "The language we should use with the passenger (an unknown value is treated as `en`)",
                "enum": ["en", "ka", "ru", "hy", "tr", "ar", "fa"],
                "type": "string"
              },
              "lat": {
                "type": ["number", "null"]
              },
              "lng": {
                "type": ["number", "null"]
              },
              "name": {
                "description": "The passenger's name",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "Flight number, luggage, a child seat request and the like (longer text is cut to 1000 characters)",
                "maxLength": 1000,
                "type": "string"
              },
              "pax": {
                "description": "Passengers; at most `types[car].max`",
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "description": "The passenger's phone in international format, e.g. +995 5xx xx xx xx",
                "type": "string"
              },
              "point": {
                "description": "A departure point id from `points[dir]` in /api/config, or `@addr` for pick-up from an address (extra fee, confirmed by the dispatcher)",
                "type": "string"
              },
              "time": {
                "description": "One of `schedule[dir]` from /api/config, or `other` for a time outside the timetable (whole vehicle; the dispatcher sets the price)",
                "type": "string"
              },
              "whole": {
                "default": false,
                "description": "`true` = the whole vehicle for this party at a timetable time: the total is `types[car].whole[currency]` from /api/config (not per passenger). Only when that price exists for the chosen currency; `pax` still says how many travel",
                "type": "boolean"
              }
            },
            "required": ["car", "currency", "date", "dir", "name", "pax", "phone", "point", "time"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking": {
                "description": "What was booked, as the server understood it",
                "properties": {
                  "car": {
                    "type": "string"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "date": {
                    "type": "string"
                  },
                  "dir": {
                    "type": "string"
                  },
                  "pax": {
                    "type": "integer"
                  },
                  "point": {
                    "description": "The departure point's name in `lang`",
                    "type": "string"
                  },
                  "price_confirmed_by_dispatcher": {
                    "description": "True when the final price is set by the dispatcher (address pick-up or a time outside the timetable)",
                    "type": "boolean"
                  },
                  "time": {
                    "type": "string"
                  },
                  "total": {
                    "type": "number"
                  },
                  "whole": {
                    "description": "True when the whole vehicle was booked",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "confirmed": {
                "description": "Always false here: a dispatcher confirms later",
                "type": "boolean"
              },
              "feedback": {
                "description": "Optional, after you finish: where you may tell us in a few lines how this went (POST, see /api/agent-feedback). Never include the passenger's personal data.",
                "format": "uri",
                "type": "string"
              },
              "message": {
                "description": "A sentence for the passenger, in `lang`",
                "type": "string"
              },
              "number": {
                "description": "The booking number",
                "type": "integer"
              },
              "status": {
                "enum": ["received"],
                "type": "string"
              },
              "status_token": {
                "type": "string"
              },
              "status_url": {
                "format": "uri",
                "type": "string"
              },
              "telegram": {
                "description": "A link the passenger can open to get the confirmation in Telegram",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8404d75a8d63ffd5a79f3934382715ced9f8976a9a4db8b0ad059a5bf8316d44"
        },
        {
          "name": "get_booking_status",
          "title": "Booking status",
          "description": "The state of a booking request made with create_booking: received (not confirmed yet), confirmed, completed or cancelled. Needs the status_token create_booking returned. No personal data is returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "status_token": {
                "description": "The status_token from create_booking",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["status_token"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "confirmed": {
                "type": "boolean"
              },
              "date": {
                "type": "string"
              },
              "dir": {
                "type": "string"
              },
              "number": {
                "type": "integer"
              },
              "pax": {
                "type": "integer"
              },
              "status": {
                "enum": ["received", "confirmed", "completed", "cancelled"],
                "type": "string"
              },
              "time": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Booking status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53b4e1b1d8e68bcc57eb892461b4ee026f13f41a3d5b44a2d5b3c19ee4b69f87"
        },
        {
          "name": "get_prices_and_schedule",
          "title": "Prices, departure points and times",
          "description": "The live GeoArm Taxi offer for rides between Tbilisi (Georgia) and Yerevan (Armenia): currencies; per car type (sprinter = a seat on the scheduled minibus, minivan, sedan) the seats, the price per passenger and the whole-vehicle price when there is one; the departure points (ids and English names) and departure times per direction; and the key facts. Read it before create_booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "direction": {
                "description": "Only this direction: `tbs-evn` = Tbilisi → Yerevan, `evn-tbs` = Yerevan → Tbilisi. Leave it out for both.",
                "enum": ["tbs-evn", "evn-tbs"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address_pickup": {
                "type": "boolean"
              },
              "cars": {
                "items": {
                  "properties": {
                    "car": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "price_per_passenger": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "description": "Amount per currency code",
                      "type": "object"
                    },
                    "seats": {
                      "type": "integer"
                    },
                    "whole_vehicle_price": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "description": "Amount per currency code",
                      "type": "object"
                    }
                  },
                  "required": ["car", "label", "price_per_passenger", "seats"],
                  "type": "object"
                },
                "type": "array"
              },
              "currencies": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "directions": {
                "items": {
                  "properties": {
                    "dir": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "points": {
                      "items": {
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          }
                        },
                        "required": ["id", "name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "times": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["dir", "label", "points", "times"],
                  "type": "object"
                },
                "type": "array"
              },
              "facts": {
                "type": "string"
              }
            },
            "required": ["address_pickup", "cars", "currencies", "directions", "facts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prices, departure points and times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3cbfa8012ae2956f83278b0982751d336001b1b1ba349e89cbc3b2c8d331767"
        },
        {
          "name": "leave_feedback",
          "title": "Tell us how it went (optional)",
          "description": "Optional, and only if your user and your own rules allow it: after you have read this site or booked a ride, tell GeoArm Taxi in a few lines what worked, what was missing and whether you would recommend it. Do not include any personal data of the person you act for: e-mail addresses, phone numbers and @handles are removed. Every note is read by a person; nothing you write is published or executed. At most 5 notes per address per day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Your name, for example ChatGPT or Claude",
                "maxLength": 80,
                "type": "string"
              },
              "booking": {
                "description": "Optional: the booking number, if you made one",
                "type": "integer"
              },
              "missing": {
                "description": "What was missing, unclear or wrong, and what would have helped",
                "maxLength": 600,
                "type": "string"
              },
              "model": {
                "description": "Optional: the model or version, if you know it",
                "maxLength": 80,
                "type": "string"
              },
              "reason": {
                "description": "Why",
                "maxLength": 600,
                "type": "string"
              },
              "task": {
                "description": "Optional: what your user asked for, in general words (for example: compare ways to get from Tbilisi to Yerevan). No names, phones or other personal data",
                "maxLength": 200,
                "type": "string"
              },
              "worked": {
                "description": "What was easy or clear on this site",
                "maxLength": 600,
                "type": "string"
              },
              "would_recommend": {
                "description": "Would you recommend this service to a person who asked you for this trip?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              }
            },
            "required": ["agent", "would_recommend"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "description": "A short thank-you",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Tell us how it went (optional)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:431d0d236da7515e691be9e6c04731c077854578ae9587b66d64e7ffa5ed1aec"
        }
      ],
      "digest": "sha256:6479bceaefa10ab355939a9f65174609fd098e49aa15a5e98d9485424d7722a6"
    }
  }
}
