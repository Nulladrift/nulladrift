      },
      "instructions": "OkkMax tracks AI API relay services. Data covers only the relays OkkMax currently tracks. All tools are read-only. Quote OkkMax measurements together with their dataAsOf timestamp (generatedAt is only the response time), the currency and the billing unit, and link the returned OkkMax page. State the applied filters with every price claim. Never describe a result as cheapest overall, safest, or best. Purity fields that are n/a or not measured mean not tested; never describe them as safe or clean. For anything not in the data (current promotions, exact terms, whether a relay still operates), say it is unverified. If a tool errors or returns nothing, say so; do not estimate values. OkkMax's leaderboard metrics and ordering are not affected by Sponsor ad placements; Sponsor is a separate advertising display and does not enter the ranking calculation.",
      "tools": [
        {
          "name": "explain_methodology",
          "title": "Explain OkkMax scoring methodology",
          "description": "Explain how OkkMax measures and scores relay stations: the rank score formula, the three purity tiers (pureblood, downgrade, counterfeit), how availability and speed are probed, detection cadence, how Sponsor ad placements relate to ranking, and the limits of the data. Returns markdown with a data timestamp. Call this before explaining a score to a user.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain OkkMax scoring methodology"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46fe4efcb66f3a6ae3d61ffe149e075fa38960d754c8991d6abb69afca9fbbed"
        },
        {
          "name": "find_cheapest_relay",
          "title": "Find the lowest-priced relay for a model",
          "description": "Find the relay with the lowest observed input price for one model, under these conditions: CNY-priced relays whose 24h uptime is at least minUptime24hPercent (default 90; pass the user's number when they name an uptime requirement), excluding first-top-up, trial and free promotional groups. Returns that one relay with its slug, group, price per 1M input tokens, 24h uptime, the filter criteria, the data time (dataAsOf) and the only wording the result supports for a price claim. It is a single filtered candidate, not an overall ranking: to compare several relays use get_model_board, and check purity with get_station before recommending.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language of the human-readable text (statement, reason, notes, suggestions) and of the OkkMax page links. Pass zh when the user writes Chinese, otherwise en. Field names and data values are the same either way.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "minUptime24hPercent": {
                "default": 90,
                "description": "Minimum 24h uptime in percent (0-100, default 90). Set it to the uptime the user asked for, for example 99. Groups whose uptime is below it or not measured are excluded.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "model": {
                "description": "Model slug as used on OkkMax, e.g. claude-opus-5-5 or gpt-6-astra. Dated aliases and other spellings of the same version (4.6 for 4-6) are accepted and resolved to the canonical slug. Use search_models to find slugs.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aliasNotice": {
                "type": "string"
              },
              "criteria": {
                "additionalProperties": false,
                "properties": {
                  "billingUnit": {
                    "type": "string"
                  },
                  "currency": {
                    "const": "CNY",
                    "type": "string"
                  },
                  "excludes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "minUptime24hPercent": {
                    "type": "number"
                  },
                  "priceBasis": {
                    "type": "string"
                  },
                  "scope": {
                    "type": "string"
                  }
                },
                "required": ["billingUnit", "currency", "excludes", "minUptime24hPercent", "priceBasis", "scope"],
                "type": "object"
              },
              "dataAsOf": {
                "description": "ISO 8601 time the underlying OkkMax data was last updated (not the time of this response). null when unavailable.",
                "type": ["string", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "model": {
                "type": "string"
              },
              "modelBoardUrl": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "relay": {
                "additionalProperties": false,
                "properties": {
                  "billingUnit": {
                    "type": "string"
                  },
                  "cachePricePer1M": {
                    "type": ["number", "null"]
                  },
                  "currency": {
                    "const": "CNY",
                    "type": "string"
                  },
                  "group": {
                    "type": "string"
                  },
                  "inputPricePer1M": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "outputPricePer1M": {
                    "type": ["number", "null"]
                  },
                  "slug": {
                    "type": "string"
                  },
                  "uptime24hPercent": {
                    "type": ["number", "null"]
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["billingUnit", "cachePricePer1M", "currency", "group", "inputPricePer1M", "name", "outputPricePer1M", "slug", "uptime24hPercent", "url"],
                "type": "object"
              },
              "requestedModel": {
                "type": "string"
              },
              "statement": {
                "description": "The only wording this result supports for a price claim; it carries the filter, currency, unit and data time.",
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["criteria", "dataAsOf", "found", "model", "modelBoardUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the lowest-priced relay for a model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1040abb197a635e7ea9137117101456c4609282e3bbb939f525e5f3dd392f8b1"
        },
        {
          "name": "get_model_board",
          "title": "Get relay leaderboard for a model",
          "description": "For one model, list the monitored relays that sell it, one row per relay using its highest-uptime group: input/output/cache price per 1M tokens in the relay's own currency (CNY or USD), 24h uptime and latency. Sorted by uptime, then price. Paged with limit and offset: total, returned, hasMore and nextOffset say whether the page is complete, and coversAllRelays is true only when it holds the whole board. This is not a price ranking and includes USD-priced relays and promotional groups; for the lowest price under an uptime condition use find_cheapest_relay.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the human-readable text (statement, reason, notes, suggestions) and of the OkkMax page links. Pass zh when the user writes Chinese, otherwise en. Field names and data values are the same either way.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "model": {
                "description": "Model slug as used on OkkMax, e.g. claude-opus-5-5 or gpt-6-astra. Dated aliases and other spellings of the same version (4.6 for 4-6) are accepted and resolved to the canonical slug. Use search_models to find slugs.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip, for paging. Use nextOffset from the previous response while hasMore is true.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "aliasNotice": {
                "type": "string"
              },
              "billingUnit": {
                "type": "string"
              },
              "contextLength": {
                "type": ["number", "null"]
              },
              "coversAllRelays": {
                "description": "true only when this response contains every relay on the board (offset 0 and hasMore false). Only then may the rows be treated as the full candidate set.",
                "type": "boolean"
              },
              "dataAsOf": {
                "description": "ISO 8601 time the underlying OkkMax data was last updated (not the time of this response). null when unavailable.",
                "type": ["string", "null"]
              },
              "hasMore": {
                "description": "true when more rows exist after this page. Request nextOffset to continue.",
                "type": "boolean"
              },
              "model": {
                "type": "string"
              },
              "nextOffset": {
                "type": ["number", "null"]
              },
              "note": {
                "type": "string"
              },
              "officialPriceUsdPer1M": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "input": {
                        "type": ["number", "null"]
                      },
                      "output": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["input", "output"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "offset": {
                "type": "number"
              },
              "relays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cachePricePer1M": {
                      "type": ["number", "null"]
                    },
                    "currency": {
                      "enum": ["CNY", "USD"],
                      "type": "string"
                    },
                    "group": {
                      "type": "string"
                    },
                    "inputPricePer1M": {
                      "type": ["number", "null"]
                    },
                    "latencyMs": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "otherGroups": {
                      "type": "number"
                    },
                    "outputPricePer1M": {
                      "type": ["number", "null"]
                    },
                    "position": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "uptime24hPercent": {
                      "type": ["number", "null"]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["cachePricePer1M", "currency", "group", "inputPricePer1M", "latencyMs", "name", "otherGroups", "outputPricePer1M", "position", "slug", "uptime24hPercent", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "requestedModel": {
                "description": "Present only when the requested slug was another spelling of the canonical model; model then holds the canonical slug.",
                "type": "string"
              },
              "returned": {
                "type": "number"
              },
              "title": {
                "type": "string"
              },
              "total": {
                "type": "number"
              },
              "totalRelays": {
                "description": "Number of relays on the whole board (same as total).",
                "type": "number"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["billingUnit", "contextLength", "coversAllRelays", "dataAsOf", "hasMore", "model", "nextOffset", "note", "officialPriceUsdPer1M", "offset", "relays", "returned", "title", "total", "totalRelays", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get relay leaderboard for a model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8922dc8b36f4f6dc3adf5e165b473a62cc8dee99eea2236c2f3d84c5454e260"
        },
        {
          "name": "get_station",
          "title": "Get a relay station report",
          "description": "OkkMax report for one relay station. Without model: the full report as markdown: rank and score breakdown, station-wide purity, per-channel availability and latency, groups and prices for every model, payment/refund terms and user review summary. With model (and optionally group): a compact JSON result for that one model only: the groups selling it with prices, each group's purity, and whether this model was directly probed in that group (selectedModelDirectlyVerified, actualModelSeen, detectedAt). Station-wide purity does not prove a specific model or group is genuine: when the user cares about one model, pass model. Promotions, invitation codes and invite links are not included. Use the slug from search_stations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "group": {
                "description": "Group name; only with model. Narrows the result to that one group.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language of the human-readable text (statement, reason, notes, suggestions) and of the OkkMax page links. Pass zh when the user writes Chinese, otherwise en. Field names and data values are the same either way.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "model": {
                "description": "Model slug, e.g. claude-sonnet-5-5 (from search_models). Returns only this model's groups, prices and purity evidence as JSON. Omit for the full markdown report.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Station slug, e.g. from search_stations.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a relay station report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2a74c836b0a141bbe945904b9b9603e79640ce677f687f49890b686b1268936"
        },
        {
          "name": "search_models",
          "title": "Search models",
          "description": "Search the AI models that relays resell (Claude, GPT/Codex, Gemini, and others) with OkkMax model pages. Returns the canonical slug to pass to get_model_board or find_cheapest_relay, how many monitored relays sell the model, and the official vendor price in USD per 1M tokens. Other spellings of the same version (for example claude-sonnet-4.6 for claude-sonnet-4-6) are listed in aliases, not as separate models; their relay counts are not merged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the human-readable text (statement, reason, notes, suggestions) and of the OkkMax page links. Pass zh when the user writes Chinese, otherwise en. Field names and data values are the same either way.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. opus, gpt, gemini. Omit to list popular models first.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dataAsOf": {
                "description": "ISO 8601 time the underlying OkkMax data was last updated (not the time of this response). null when unavailable.",
                "type": ["string", "null"]
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "aliases": {
                      "description": "Other spellings of the same version (for example 4.6 for 4-6) that OkkMax lists as separate pages. Relays under an alias are not in this model's board or in find_cheapest_relay.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "relayCount": {
                            "type": "number"
                          },
                          "slug": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["relayCount", "slug", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "contextLength": {
                      "type": ["number", "null"]
                    },
                    "family": {
                      "type": "string"
                    },
                    "officialPriceUsdPer1M": {
                      "additionalProperties": false,
                      "properties": {
                        "input": {
                          "type": ["number", "null"]
                        },
                        "output": {
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["input", "output"],
                      "type": "object"
                    },
                    "relayCount": {
                      "description": "Relays listed under exactly this slug. Alias slugs are counted separately in aliases, never merged in.",
                      "type": "number"
                    },
                    "released": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "description": "Canonical slug: pass this to get_model_board and find_cheapest_relay.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["aliases", "contextLength", "family", "officialPriceUsdPer1M", "relayCount", "released", "slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "suggestions": {
                "description": "Present when nothing matched: what to try next.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["dataAsOf", "models", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:584c4db88329583f88ecd04169e4069b8ef9187e357fadcf2afa9f9a1d52a9ab"
        },
        {
          "name": "search_stations",
          "title": "Search relay stations",
          "description": "Search relay services tracked by OkkMax by station name, slug, domain, URL, or model ID. Returns matching relays in leaderboard order with their current metrics. Use get_station for a full report.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the human-readable text (statement, reason, notes, suggestions) and of the OkkMax page links. Pass zh when the user writes Chinese, otherwise en. Field names and data values are the same either way.",
                "enum": ["zh", "en"],
                "type": "string"
              },
              "query": {
                "description": "Free text: a relay name, slug, domain or URL, or a model ID such as claude-opus. Omit to list the top of the leaderboard.",
                "maxLength": 100,
                "type": "string"
