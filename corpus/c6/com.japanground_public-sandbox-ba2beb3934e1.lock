        {
          "name": "jgn_preview_request",
          "description": "Validate a fixed synthetic request example against the local request schema. Does not persist a draft, submit, quote, book, pay or dispatch. Only enum selections and bounded integers are accepted.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "access_basis": {
                "enum": ["public_vantage_point", "documented_permission", "unverified"],
                "type": "string"
              },
              "budget_cap_jpy": {
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "integer"
              },
              "checklist_codes": {
                "items": {
                  "enum": ["target_match", "front_view", "side_view", "entrance_view", "signage", "frontage_road", "limitations", "permission", "model_number", "all_sides", "damage", "accessories"],
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "report_locale": {
                "enum": ["en", "ja"],
                "type": "string"
              },
              "service_code": {
                "enum": ["site_photo_check", "item_condition_record"],
                "type": "string"
              },
              "target_id": {
                "enum": ["demo-osaka-building", "demo-osaka-item"],
                "type": "string"
              },
              "worker_id": {
                "enum": ["demo-operator-a", "demo-operator-b"],
                "type": "string"
              }
            },
            "required": ["access_basis", "budget_cap_jpy", "checklist_codes", "report_locale", "service_code", "target_id", "worker_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "actual_availability_checked": {
                "const": false,
                "type": "boolean"
              },
              "booked": {
                "const": false,
                "type": "boolean"
              },
              "environment": {
                "const": "public_synthetic_sandbox",
                "type": "string"
              },
              "example_date_only": {
                "const": true,
                "type": "boolean"
              },
              "human_handoff": {
                "type": "string"
              },
              "inquiry_guide": {
                "type": "string"
              },
              "local_request_schema_valid": {
                "type": "boolean"
              },
              "paid": {
                "const": false,
                "type": "boolean"
              },
              "persisted": {
                "const": false,
                "type": "boolean"
              },
              "preview": {
                "additionalProperties": false,
                "properties": {
                  "access_basis": {
                    "enum": ["public_vantage_point", "documented_permission", "unverified"],
                    "type": "string"
                  },
                  "additional_questions": {
                    "default": [],
                    "items": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "budget_cap_minor": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000,
                    "type": "integer"
                  },
                  "checklist_codes": {
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "currency": {
                    "const": "JPY",
                    "type": "string"
                  },
                  "permission": {
                    "additionalProperties": false,
                    "properties": {
                      "controller": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "reference": {
                        "maxLength": 1000,
                        "type": "string"
                      },
                      "scope": {
                        "maxLength": 1000,
                        "type": "string"
                      },
                      "valid_from": {
                        "format": "date-time",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                        "type": "string"
                      },
                      "valid_until": {
                        "format": "date-time",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                        "type": "string"
                      }
                    },
                    "required": ["controller", "reference", "scope", "valid_from", "valid_until"],
                    "type": "object"
                  },
                  "preferred_window": {
                    "additionalProperties": false,
                    "properties": {
                      "end": {
                        "format": "date-time",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                        "type": "string"
                      },
                      "start": {
                        "format": "date-time",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                        "type": "string"
                      },
                      "timezone": {
                        "const": "Asia/Tokyo",
                        "type": "string"
                      }
                    },
                    "required": ["end", "start", "timezone"],
                    "type": "object"
                  },
                  "requested_report_locale": {
                    "default": "en",
                    "enum": ["en", "ja"],
                    "type": "string"
                  },
                  "selection": {
                    "additionalProperties": false,
                    "properties": {
                      "mode": {
                        "enum": ["specific_worker", "platform_match"],
                        "type": "string"
                      },
                      "worker_id": {
                        "format": "uuid",
                        "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                        "type": "string"
                      }
                    },
                    "required": ["mode"],
                    "type": "object"
                  },
                  "service_code": {
                    "enum": ["site_photo_check", "item_condition_record"],
                    "type": "string"
                  },
                  "service_version": {
                    "const": 1,
                    "type": "number"
                  },
                  "target": {
                    "additionalProperties": false,
                    "properties": {
                      "address_text": {
                        "maxLength": 500,
                        "minLength": 8,
                        "type": "string"
                      },
                      "city_code": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "country": {
                        "const": "JP",
                        "type": "string"
                      },
                      "description": {
                        "maxLength": 2000,
                        "minLength": 10,
                        "type": "string"
                      },
                      "reference_url": {
                        "anyOf": [
                          {
                            "format": "uri",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "residential": {
                        "default": false,
                        "type": "boolean"
                      }
                    },
                    "required": ["address_text", "city_code", "country", "description", "residential"],
                    "type": "object"
                  }
                },
                "required": ["access_basis", "additional_questions", "budget_cap_minor", "checklist_codes", "currency", "preferred_window", "requested_report_locale", "selection", "service_code", "service_version", "target"],
                "type": "object"
              },
              "reasons": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "valid_example": {
                "type": "boolean"
              }
            },
            "required": ["actual_availability_checked", "booked", "environment", "example_date_only", "human_handoff", "inquiry_guide", "local_request_schema_valid", "paid", "persisted", "preview", "reasons", "valid_example"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c30c68669b80fe809f942fd65ed0f9d9eca54441850d015ae686324e4dcf838f"
        },
