        {
          "name": "find_api_for_task",
          "title": "Find API for Task",
          "description": "Find the best APIs for a natural-language physical-world task. Use this for open-ended task or outcome-based recommendations; use search_apis when you already know exact filters, get_api for one known API, or compare_apis for known candidates. Returns an authoritative canonical structured_results shortlist plus a best-effort AI comparison restricted to that shortlist. The canonical engine now applies Verified/High capability evidence before ranking: explicit hard requirements expressed with terms such as must, required, no or without can exclude a candidate only when verified evidence contradicts them. Unknown evidence remains eligible and is surfaced as uncertainty. requirements.mcp, openapi and auth are translated into explicit requirements; categories and capabilities remain task-shaping hints. free_tier and min_readiness are accepted for compatibility but are not hard filters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Backward-compatible parameter. The canonical browser-parity workflow always produces five structured candidates before the AI comparison, even when another value is supplied.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "requirements": {
                "additionalProperties": false,
                "description": "Optional task requirements appended before canonical ranking. categories and capabilities shape task intent. mcp=Yes, openapi=Yes and auth are expressed as hard task requirements and are evaluated against verified evidence; Unknown does not count as a confirmed contradiction and remains eligible with an uncertainty. free_tier and min_readiness are accepted for backward compatibility but are not hard filters.",
                "properties": {
                  "auth": {
                    "description": "Authentication requirement appended as an explicit task requirement. The canonical engine excludes only when the verified API authentication methods contradict it.",
                    "enum": ["none", "api_key", "oauth", "client_credentials", "bearer", "jwt", "basic"],
                    "type": "string"
                  },
                  "capabilities": {
                    "description": "Desired agent capability dimensions. These are appended as ranking hints, not strict filters.",
                    "items": {
                      "enum": ["observe", "locate", "predict", "plan", "control", "act"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "categories": {
                    "description": "Preferred catalog categories, such as Geospatial, Weather or Mobility. These are ranking hints, not strict filters.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "free_tier": {
                    "description": "Backward-compatible field only. The canonical recommendation engine does not currently hard-filter on free-tier availability.",
                    "type": "boolean"
                  },
                  "mcp": {
                    "description": "When set to Yes, becomes an explicit 'Must support MCP' requirement. Verified No excludes; Unknown remains eligible with an uncertainty. Use search_apis for exact status filtering.",
                    "enum": ["Yes", "No", "Unknown"],
                    "type": "string"
                  },
                  "min_readiness": {
                    "description": "Backward-compatible field only. It does not hard-filter the canonical top five; use search_apis for a strict minimum readiness threshold.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "openapi": {
                    "description": "When set to Yes, becomes an explicit OpenAPI requirement. Verified No excludes; Unknown remains eligible with an uncertainty. Use search_apis for exact status filtering.",
                    "enum": ["Yes", "No", "Unknown"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "task": {
                "description": "Required natural-language goal or workflow, for example 'connect to a car and predict weather on the route'. Describe the desired outcome rather than naming a specific API.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "ai": {
                "additionalProperties": true,
                "type": "object"
              },
              "ai_comparison": {
                "additionalProperties": true,
                "description": "Best-effort grounded explanation of only the structured_results candidates.",
                "type": ["object", "null"]
              },
              "compatibility_warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "coverage_status": {
                "type": "string"
              },
              "coverage_warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "effective_query": {
                "type": "string"
              },
              "engine_version": {
                "type": "string"
              },
              "grounding_policy": {
                "additionalProperties": true,
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "snapshot_date": {
                "type": ["string", "null"]
              },
              "source_endpoints": {
                "additionalProperties": true,
                "type": "object"
              },
              "structured_results": {
                "description": "Canonical deterministic shortlist. This is the authoritative result set.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "task": {
                "type": "string"
              },
              "timing_ms": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["ai", "grounding_policy", "name", "structured_results", "task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find API for Task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88aa8c1b5f1138ecd64bb68795acd067467affa1a5e8a2e7b02870f81e003b74"
        },
        {
