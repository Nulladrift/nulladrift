      "serverInfo": {
        "name": "realworldapis",
        "title": "RealWorldAPIs",
        "version": "3.5.2",
        "description": "Evidence-first API discovery, decision and requirement-verification and planning-only workflow layer for AI agents connecting to the physical world, with Verified/High capabilities plus assertion-backed execution evidence.",
        "websiteUrl": "https://realworldapis.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RealWorldAPIs exposes seven read-only discovery, decision and planning tools: find_api_for_task for open-ended task selection, search_apis for API-level filtering, search_capabilities for direct Verified/High capability-graph filtering, verify_requirement for evidence-backed requirement adjudication, get_api for one full decision profile, and compare_apis for deterministic side-by-side comparison. compose_workflow adds planning-only structured workflow recommendations, unverified handoffs and bounded alternatives without AI drafting or provider actions. Canonical structured evidence remains authoritative and Unknown remains Unknown.",
      "tools": [
        {
          "name": "compare_apis",
          "title": "Compare APIs",
          "description": "Compare 2–8 already-known APIs side by side using canonical catalog fields plus capability-graph summary fields such as verified capability count, physical consequences, approval relevance and irreversibility. Use get_api for the full decision profile of one API and search_capabilities for capability-level filtering. No missing value is inferred and Unknown remains Unknown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apis": {
                "description": "Required list of 2–8 API slugs or names. Exact matches are preferred; unique partial matches are accepted. Unresolved identifiers are reported separately, and the call fails if fewer than two records resolve.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 2,
                "type": "array"
              },
              "fields": {
                "description": "Optional fields to compare. The default includes core catalog fields plus verified capability count, physical-consequence count, approval-relevant count, irreversible/high-consequence count and the decision-profile URL.",
                "items": {
                  "enum": ["provider", "category", "description", "capabilities", "agent_capabilities", "auth_methods", "openapi", "mcp", "a2a", "x402", "llms_txt", "agent_readiness_score", "public_documentation", "authentication_verified", "agent_actionable", "website", "docs_url", "verified_capability_count", "information_only_count", "physical_consequence_count", "irreversible_high_consequence_count", "approval_relevant_count", "capability_profile_url"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["apis"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability_graph": {
                "type": "string"
              },
              "evidence_policy": {
                "type": "string"
              },
              "fields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "method": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "records": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "values": {
                      "additionalProperties": true,
                      "type": "object"
                    }
                  },
                  "required": ["name", "slug", "values"],
                  "type": "object"
                },
                "type": "array"
              },
              "unresolved": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["evidence_policy", "fields", "method", "name", "records", "unresolved"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare APIs"
          },
