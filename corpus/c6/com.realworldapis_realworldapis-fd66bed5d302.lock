        {
          "name": "compose_workflow",
          "title": "Compose workflow",
          "description": "Propose a planning-only API workflow from 1–8 structured steps. Include the complete original goal and restrictions. Returns canonical candidates, evidence, Unknown requirements and bounded alternatives. Does not draft with AI, verify execution readiness, implement processing or execute provider operations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "workflow": {
                "additionalProperties": false,
                "properties": {
                  "goal": {
                    "maxLength": 800,
                    "minLength": 1,
                    "type": "string"
                  },
                  "schema_version": {
                    "enum": ["rwapis-composer-workflow-v1"],
                    "type": "string"
                  },
                  "steps": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "id": {
                          "pattern": "^[a-z][a-z0-9_-]{0,63}$",
                          "type": "string"
                        },
                        "inputs": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "from": {
                                "pattern": "^[a-z][a-z0-9_-]{0,63}$",
                                "type": "string"
                              },
                              "name": {
                                "pattern": "^[a-z][a-z0-9_-]{0,63}$",
                                "type": "string"
                              },
                              "output": {
                                "pattern": "^[a-z][a-z0-9_-]{0,63}$",
                                "type": "string"
                              },
                              "type": {
                                "maxLength": 90,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["name"],
                            "type": "object"
                          },
                          "maxItems": 12,
                          "type": "array"
                        },
                        "match": {
                          "additionalProperties": false,
                          "properties": {
                            "action_type": {
                              "maxLength": 100,
                              "minLength": 1,
                              "type": "string"
                            },
                            "object": {
                              "maxLength": 100,
                              "minLength": 1,
                              "type": "string"
                            },
                            "primitive": {
                              "maxLength": 100,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "type": "object"
                        },
                        "outputs": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "name": {
                                "pattern": "^[a-z][a-z0-9_-]{0,63}$",
                                "type": "string"
                              },
                              "type": {
                                "maxLength": 90,
                                "minLength": 1,
                                "type": "string"
                              }
                            },
                            "required": ["name"],
                            "type": "object"
                          },
                          "maxItems": 12,
                          "type": "array"
                        },
                        "query": {
                          "maxLength": 400,
                          "minLength": 1,
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 120,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["id", "query"],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": ["goal", "steps"],
                "type": "object"
              }
            },
            "required": ["workflow"],
            "type": "object"
          },
