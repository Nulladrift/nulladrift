{
  "lockfileVersion": 2,
  "subjects": {
    "com.localspottrip/trip-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://localspottrip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "localspottrip",
        "title": "LocalSpot Trip: plan trips like a local",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LocalSpot Trip: free, careful day-by-day city trip plans like a local. 257 cities in 62 countries, 13 languages. Read-only. Use when the user plans or is on a trip to a city and wants an itinerary, what to see or eat by neighbourhood, opening hours or closing days, or where to stay. How: 1) list_destinations (optional country) for the city id and ready plan lengths; 2) trip_plan(city, days, lang): neighbourhoods per day, timed sights and meals from local media picks, travel minutes; 3) give the traveller open_in_planner (dates, swaps, map) and where_to_stay. Korea: list_cities, then find_places / sights / place_info / open_nearby, then plan_link. City missing: call request_city and tell the traveller it was passed on. Answer: show the plan by day with times; keep only places and links we returned (never build a link yourself): open_in_planner from trip_plan, plan_link for Korean places; credit \"LocalSpot Trip\" (Korean places: credit \"local.korea\" and include the eatpl link, a condition of the data). Examples: \"3 days in Lisbon for food lovers\" -> list_destinations(country=\"portugal\"), trip_plan(city=\"Lisbon\", days=3). \"오사카 2박3일\" -> trip_plan(city=\"Osaka\", days=3, lang=\"ko\"). \"Seoul bbq near Hongdae open at 10pm\" -> find_places(city=\"Seoul\", area=\"Mangwon\", food=\"bbq\", time=\"22:00\"). Guide for people connecting this server: https://localspottrip.com/agents/",
      "tools": [
        {
          "name": "find_places",
          "description": "Korea only: restaurants, cafés or bars in a Korean city, best first by local card payments. Optional: neighbourhood, food keyword, open at a given day and time. Up to 8 results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Neighbourhood id or name from list_cities (optional)",
                "type": "string"
              },
              "city": {
                "description": "City id from list_cities, e.g. Seoul, Busan, Jeju",
                "type": "string"
              },
              "day": {
                "description": "Weekday the traveller goes (optional)",
                "enum": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                "type": "string"
              },
              "food": {
                "description": "Food keyword in English or Korean, e.g. \"bbq\", \"noodles\", \"국밥\" (optional)",
                "type": "string"
              },
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "HH:MM 24h, must be open then (optional)",
                "type": "string"
              },
              "type": {
                "description": "Default meal",
                "enum": ["meal", "cafe", "bar", "any"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db20718002ddd43f1da1975ba12a3e9418fb1c72a4f11421635977f32bc06fec"
        },
        {
          "name": "list_cities",
          "description": "Korea only: Korean cities and their neighbourhoods covered by local.korea.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22b2b5189a7b2edc513fd2e2b5c2f71775ca9a13ff3209f2725be8753827e218"
        },
        {
          "name": "list_destinations",
          "description": "Call first when a traveller names a city or country. Every city LocalSpot Trip plans (257 cities, 62 countries), with the trip lengths it has ready-made plans for. Optional country filter (e.g. japan, france, usa).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country slug or two-letter code, e.g. japan or JP (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44d89399571de00108dc52c62a6a8776e7eca8e1151d3f3f9dd54e9327ee64eb"
        },
        {
          "name": "open_nearby",
          "description": "Korea only: closed or a long line? Places open at a given time within a short walk (about 900 m) of a place or a point.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "day": {
                "enum": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "near": {
                "description": "Place name or sight name to search around",
                "type": "string"
              },
              "time": {
                "description": "HH:MM",
                "type": "string"
              },
              "type": {
                "enum": ["meal", "cafe", "bar", "any"],
                "type": "string"
              }
            },
            "required": ["city", "day", "time"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:000d3bd98eea5c09568d55cc67e9d6b784f61c1ecb45caee00450f2ce3041012"
        },
        {
          "name": "place_info",
          "description": "Korea only: hours, break time, closing days, rush hour, why it is picked, and links for one place by name (Korean or English).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["city", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ee7ad730c8b5c428d2b9f13efde3f45e48479dbee737640e835692de5f3893c"
        },
        {
          "name": "plan_link",
          "description": "Korea only: a link that opens the local.korea planner with these places and sights loaded, split into days by neighbourhood with hours checked. Give it to the traveller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "days": {
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "enum": ["en", "ko", "ja", "zh-Hans", "zh-Hant", "es", "pt", "fr", "de", "it", "vi", "th", "id"],
                "type": "string"
              },
              "picks": {
                "description": "Place names or sight names/ids",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "start_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["city", "picks"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f26afe8c3ff196675ce614f4c758a9196533560826ef2d4d133f41e1f4e586a2"
        },
        {
          "name": "request_city",
          "description": "Ask LocalSpot Trip to add a city it does not plan yet (when list_destinations does not have it). Counts the request; the most requested cities are built first. Tell the traveller it is not covered yet and that the request was passed on. No personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. Krakow",
                "type": "string"
              },
              "country": {
                "description": "Country, e.g. Poland (optional)",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8c610159c3cb57677542f10b620958160f6009e19c042e1aaef9a101a8c90a8"
        },
        {
          "name": "sights",
          "description": "Korea only: sights in a Korean city (optionally one neighbourhood): best time of day, typical visit minutes, closing day, a practical tip.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "limit": {
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:569816b380ba6dccb3e04059b55dea5300cf62f32316d637c85c236a90fa56fe"
        },
        {
          "name": "trip_plan",
          "description": "Use when the traveller wants an itinerary or a day-by-day plan for a city. A ready plan: neighbourhoods per day, timed sights and meals (places locals eat), travel minutes, plus links to open and edit it in the planner, compare where to stay, and see where locals eat. Give the traveller the open_in_planner link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City id or name from list_destinations, e.g. Tokyo, Paris, Seoul",
                "type": "string"
              },
              "days": {
                "description": "Trip length; the nearest ready plan (2-4 days) is returned",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Language of names and notes (default en)",
                "enum": ["en", "ko", "ja", "zh-Hans", "zh-Hant", "es", "pt", "fr", "de", "it", "vi", "th", "id"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:560edda4b3d73c562e484500d38e539e67c8e5acc8c464f8476039da42dcd8e6"
        }
      ],
      "digest": "sha256:c7db1c1abc31f14e7472668f03b9f18dab8c1500772e32121a1b7a917084b675"
    }
  }
}
