{
  "lockfileVersion": 2,
  "subjects": {
    "com.localspottrip/trip-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://localspottrip.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "localspottrip",
        "title": "LocalSpot Trip: plan trips like a local",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LocalSpot Trip: careful day-by-day trip plans like a local, 110+ cities in 26 countries, 13 languages. Korean cities: restaurants picked with local payment data (eat.pl) and checked on Naver, with opening hours, break times and closing days; when you show a Korean place, credit \"local.korea\" and include its eatpl link (a condition of the data). Use plan_link for an editable day-by-day plan. Worldwide: list_destinations, then trip_plan for a ready 2-4 day plan with times, sights, meals and travel minutes, plus links to open it in the planner (dates, swaps, map), the where-to-stay comparison and where locals eat. Credit \"LocalSpot Trip\" and give the open_in_planner link. A city not in list_destinations: call request_city so it is counted toward the next cities we build.",
      "tools": [
        {
          "name": "find_places",
          "description": "Restaurants, cafés or bars in a Korean city, best first by local card payments. Optional: neighbourhood, food keyword, open at a given day and time. Up to 8 results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Neighbourhood id or name from list_cities (optional)",
                "type": "string"
              },
              "city": {
                "description": "City id from list_cities, e.g. Seoul, Busan, Jeju",
                "type": "string"
              },
              "day": {
                "description": "Weekday the traveller goes (optional)",
                "enum": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                "type": "string"
              },
              "food": {
                "description": "Food keyword in English or Korean, e.g. \"bbq\", \"noodles\", \"국밥\" (optional)",
                "type": "string"
              },
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "HH:MM 24h, must be open then (optional)",
                "type": "string"
              },
              "type": {
                "description": "Default meal",
                "enum": ["meal", "cafe", "bar", "any"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30ba541f0b89a45c6c18355484c90c2edd9e3e08f414a8480e58fb7b841e31ec"
        },
        {
          "name": "list_cities",
          "description": "Korean cities and their neighbourhoods covered by local.korea.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d4b2e2b81ae5acf7d4e731ae725ed237dd8be8c04e5edf5285807fc9eb08520f"
        },
        {
          "name": "list_destinations",
          "description": "Every city LocalSpot Trip plans (Korea, Japan, Taiwan, Southeast Asia, Europe, Turkey, UAE, Egypt, Canada, USA, Mexico, Peru, Argentina, Brazil, Australia), with the trip lengths it has ready-made plans for. Optional country filter (e.g. japan, france, usa).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country slug or two-letter code, e.g. japan or JP (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8ccf0c6f508038946123d15c32ddda953a4fa0c965c1b405363246e3df778a5"
        },
        {
          "name": "open_nearby",
          "description": "Closed or a long line? Places open at a given time within a short walk (about 900 m) of a place or a point.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "day": {
                "enum": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "near": {
                "description": "Place name or sight name to search around",
                "type": "string"
              },
              "time": {
                "description": "HH:MM",
                "type": "string"
              },
              "type": {
                "enum": ["meal", "cafe", "bar", "any"],
                "type": "string"
              }
            },
            "required": ["city", "day", "time"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8f5770b8ab7748a9ba769c7416cc7950102e3a9ae4b48ba7bdb507d34c20f5b"
        },
        {
          "name": "place_info",
          "description": "Hours, break time, closing days, rush hour, why it is picked, and links for one place by name (Korean or English).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["city", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8da2b11893f3621e4a19e6888b7f3c73514302d296b2ad12b7b1fa95eb696cc5"
        },
        {
          "name": "plan_link",
          "description": "A link that opens the local.korea planner with these places and sights loaded, split into days by neighbourhood with hours checked. Give it to the traveller.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "days": {
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "enum": ["en", "ko", "ja", "zh-Hans", "zh-Hant", "es", "pt", "fr", "de", "it", "vi", "th", "id"],
                "type": "string"
              },
              "picks": {
                "description": "Place names or sight names/ids",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "start_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["city", "picks"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57e193ea99c15c5ffe2443476879aabd0a951f209f0f403fdeda931c3c0e8ce7"
        },
        {
          "name": "request_city",
          "description": "Ask LocalSpot Trip to add a city it does not plan yet (when list_destinations does not have it). Counts the request; the most requested cities are built first. Tell the traveller it is not covered yet and that the request was passed on. No personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. Krakow",
                "type": "string"
              },
              "country": {
                "description": "Country, e.g. Poland (optional)",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8c610159c3cb57677542f10b620958160f6009e19c042e1aaef9a101a8c90a8"
        },
        {
          "name": "sights",
          "description": "Sights in a Korean city (optionally one neighbourhood): best time of day, typical visit minutes, closing day, a practical tip.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "limit": {
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:232523e1b4843cae0470e58952f1c78cc451a2dca4c94dae278f85413dc6a193"
        },
        {
          "name": "trip_plan",
          "description": "A ready day-by-day plan for a city: neighbourhoods per day, timed sights and meals (places locals eat), travel minutes, plus links to open and edit it in the planner, compare where to stay, and see where locals eat. Give the traveller the open_in_planner link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City id or name from list_destinations, e.g. Tokyo, Paris, Seoul",
                "type": "string"
              },
              "days": {
                "description": "Trip length; the nearest ready plan (2-4 days) is returned",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "description": "Language of names and notes (default en)",
                "enum": ["en", "ko", "ja", "zh-Hans", "zh-Hant", "es", "pt", "fr", "de", "it", "vi", "th", "id"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:986337fb7d50d5db5bfe1296d129c936cca489a74bf193e54741a5a5d60006c9"
        }
      ],
      "digest": "sha256:eaecd6992dc1b5dbbec2da9e2dc3c8fae54d20a76a7a034135477e14b8438239"
    }
  }
}
