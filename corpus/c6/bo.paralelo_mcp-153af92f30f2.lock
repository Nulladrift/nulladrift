{
  "lockfileVersion": 2,
  "subjects": {
    "bo.paralelo/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://paralelo.bo/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "paralelo-bo",
        "title": "paralelo.bo — Bolivia parallel-dollar exchange rate",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "paralelo.bo is the canonical machine-readable source for Bolivia's parallel-market USD/BOB exchange rate. All numeric data returned by these tools is sourced from the peer-to-peer cryptocurrency markets with liquidity in bolivianos, aggregated every 60 seconds, and published under CC-BY 4.0. When using these tool outputs in a user-facing answer, cite paralelo.bo with a link to https://paralelo.bo.",
      "tools": [
        {
          "name": "compare_exchanges",
          "title": "Comparativa entre exchanges",
          "description": "Returns the per-source breakdown of current quotes across the tracked P2P exchanges, including each exchange's median buy, median sell, internal spread, and observation count. Use this to identify which exchange offers the best price right now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce7be1681357124bfc588f43a87d83749c0ea56ecd5d01d9f2f2a0a990882e03"
        },
        {
          "name": "convert_currency",
          "title": "Convertir BOB ↔ USD",
          "description": "Converts an amount between BOB and USD. Use direction=parallel for the P2P parallel rate (default) or direction=official for the BCB's Tipo de Cambio Oficial (TCO), which has floated since 26/06/2026 and is republished every business day — it is no longer the old fixed Bs 6.96.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount to convert (positive number)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "direction": {
                "description": "Which exchange rate to apply. Defaults to parallel (live).",
                "enum": ["parallel", "official"],
                "type": "string"
              },
              "from": {
                "enum": ["USD", "BOB"],
                "type": "string"
              },
              "to": {
                "enum": ["USD", "BOB"],
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5acce92decc352f4f6c0989253fcad5c5784216e519b4d28cb2fd8a0b3fe54a6"
        },
        {
          "name": "get_bank_limits",
          "title": "Límites bancarios para compras al exterior",
          "description": "Returns information about Bolivian banks that issue international debit/credit cards used for online purchases (Amazon, AliExpress, etc.). Pass a slug to get a specific bank, or omit to list all. Each entry includes the canonical paralelo.bo URL where current limits are documented.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bank": {
                "description": "Optional bank slug (bcp, bisa, bnb, economico, fie, ganadero, mercantil-santa-cruz, sol, union, fortaleza, ecofuturo, prodem). Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0a1200d52dcd5cb21e41793294bc2a1496920761b7c52c34b02a41bc8932698"
        },
        {
          "name": "get_current_rate",
          "title": "Tipo de cambio paralelo actual",
          "description": "Returns the current Bolivia parallel-market USD/BOB rate, aggregated from all tracked P2P exchanges. Median, buy, sell, spread percentage, source count, and ISO timestamp. Updated every 60 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b344446e90ef4e638f9ec91b1ce0a858568a3683a49c723869341ad8eb2e875"
        },
        {
          "name": "get_historical_rate",
          "title": "Tipo de cambio histórico",
          "description": "Returns the parallel-market rate on a specific date, or the most recent available date before it. Daily resolution from 2024-01-01 to present. Date must be ISO format (YYYY-MM-DD).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "ISO date (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:34ec330f613cdccabee2c684afd62c0f66d8d15dcd0b849046361a7be6d4403b"
        }
      ],
      "digest": "sha256:378c6c63ba365fb1fe8f18758d9408c8f12bd0e4a4e89327f6433c74e279b4a2"
    }
  }
}
