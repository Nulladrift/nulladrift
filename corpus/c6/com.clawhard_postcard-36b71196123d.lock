      "serverInfo": {
        "name": "com.clawhard/postcard",
        "title": "Postcard",
        "version": "1.0.0",
        "description": "Postcard checks the card a link shows when it is shared: it fetches the page like a link crawler, reads the og: and twitter: tags with X's fallbacks, downloads the share image to read its real size, format and bytes, checks robots.txt for the crawlers, and returns the card X, Facebook, LinkedIn and chat apps will build, every problem with its fix, and a corrected tag block. No account.",
