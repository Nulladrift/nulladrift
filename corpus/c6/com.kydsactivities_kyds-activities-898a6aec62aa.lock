      },
      "instructions": "Kyds Activities is the free youth-programs and daycare directory for the California cities it serves, built city by city (Lodi Kids Activities is its Lodi site). Call list_cities for the live list and pass the city slug to the search tools. Use these tools to search programs, daycares, and family events. Searching needs no account and only reads public listings. Signed-in parents can also save programs, manage their kids and household, and request daycare tours; organizations can update their own listings. Those tools ask the person to sign in and change only that person's own data. Always cite the program or daycare URL when surfacing results so the parent can click through.",
      "tools": [
        {
          "name": "city_stats",
          "title": "City stats",
          "description": "Totals for one city: number of programs and licensed daycares, share claimed by their owners, share with a Spanish description, share free, and programs by category.",
          "inputSchema": {
            "properties": {
              "city_slug": {
                "description": "City slug (e.g. 'lodi'). Defaults to 'lodi' if omitted.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "City stats"
          },
          "behavior": {
