        },
        {
          "name": "submit_listing",
          "title": "List an AI tool",
          "description": "Submit an AI tool for the list. Free listings wait for review. For fasttrack and featured you get checkoutUrl: give it to the person, who pays on Stripe.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["llms-and-apis", "assistants-and-chatbots", "coding", "agents-and-automation", "image-and-design", "video", "audio-and-voice", "writing-and-marketing", "language-and-documents", "computer-vision", "ml-platforms", "data-and-search", "healthcare", "security-and-legal", "research-and-education", "productivity"],
                "type": "string"
              },
              "description": {
                "maxLength": 600,
                "type": "string"
              },
              "email": {
                "description": "The maker's email, for questions about the listing. Never shown.",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              },
              "launchAt": {
                "description": "Only for a tool that isn't out yet: its launch day (UTC), YYYY-MM-DD, up to six months ahead. It shows as upcoming until then.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "logoUrl": {
                "description": "A link to the tool's logo (square PNG, SVG or JPEG). Without it we take the icon from the tool's site.",
                "maxLength": 300,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "plan": {
                "enum": ["free", "fasttrack", "featured"],
                "type": "string"
              },
              "pricingModel": {
                "enum": ["free", "freemium", "paid", "open-source", "usage-based"],
                "type": "string"
              },
              "sharedPaymentToken": {
                "description": "Pay by card now, as the agent: a Stripe shared payment token (spt_...) granted to our seller profile (see get_plans) for at least the plan price in USD. Charged once; without it, paid plans return a checkoutUrl for a person.",
                "pattern": "^spt_[A-Za-z0-9]{6,64}$",
                "type": "string"
              },
              "tagline": {
                "description": "One line about the tool, no links",
                "maxLength": 160,
                "minLength": 10,
                "type": "string"
              },
              "url": {
                "description": "The tool's website",
                "maxLength": 300,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["category", "email", "name", "plan", "tagline", "url"],
            "type": "object"
          },
