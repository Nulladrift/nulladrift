      "instructions": "AI Platforms List (https://aiplatformslist.com) is a hand-checked list of AI tools. Descriptions are quoted from each tool's own site; there are no ratings. Sponsored tools and our own products (madeByUs) are marked.\n\nFind tools with search_tools (a query, a category, or both) and get_tool. list_categories shows the categories. list_upcoming shows tools that launch on a set day.\n\nBlack Friday 2026: list_deals gives the AI tool deals a person checked, with the price, the code, the end time and what a year costs against paying yearly on a normal day (also at https://aiplatformslist.com/api/v1/deals).\n\nA maker can list a tool: free (a person reviews it within 7 days), fasttrack ($29 once, live within 24 hours) or featured ($19 a month, at the top of its category, at most 3 per category taking turns each day, marked Sponsored).\n\nsubmit_listing returns checkoutUrl for paid plans: give that link to the person, who pays on Stripe. You can't pay for them, and nothing is charged before they do. Then call check_listing with the listingId until it says live. From then on check_listing also gives the badge and share links and the last 30 days of numbers.\n\nAgents with a USDC wallet on Base can pay themselves with x402 at POST https://aiplatformslist.com/api/v1/listings/x402 (docs: https://aiplatformslist.com/developers#x402).\n\nAgents can also pay by card themselves: get a Stripe shared payment token granted to seller profile profile_61VeyR3hCkiQhotJjA6VeyR2QXSQA1bh0Ss0fmIHwIEa for the plan price in USD, and pass it to submit_listing as sharedPaymentToken (docs: https://aiplatformslist.com/developers#card).\n\nStatuses: awaiting_payment: Waiting for the payment. payment_processing: The payment is still processing at the bank. pending_review: Free listing: a person reviews it within 7 days. held: Paid. A person checks this one by hand within 24 hours. live: The listing is live. rejected: Not approved. A paid listing gets a full refund. payment_failed: The payment failed. Nothing was charged. charging: The USDC payment is being settled. refund_due: The payment may have gone through but the listing could not be placed. A person checks and sends the USDC back. expired: Not completed. Nothing was charged.\n\nQuestions: info@aiplatformslist.com.",
      "tools": [
        {
          "name": "check_listing",
          "title": "Check a listing",
          "description": "The status of a listing from submit_listing. Once it is live, also its badge and share links and the last 30 days of numbers: page views, clicks to the site, times AI agents got it, and sites showing its badge.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
