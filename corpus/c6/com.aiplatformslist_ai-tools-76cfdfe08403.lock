        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Search the hand-checked list of AI tools by words, by category, or both. Sponsored tools (at most 3 per category, taking turns each day) come at the top of a category and are marked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["llms-and-apis", "assistants-and-chatbots", "coding", "agents-and-automation", "image-and-design", "video", "audio-and-voice", "writing-and-marketing", "language-and-documents", "computer-vision", "ml-platforms", "data-and-search", "healthcare", "security-and-legal", "research-and-education", "productivity"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. \"video editor\"",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
