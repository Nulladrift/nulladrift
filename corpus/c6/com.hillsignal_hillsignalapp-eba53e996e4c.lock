                "type": "string"
              },
              "cycle": {
                "description": "Two-year election cycle (default: current)",
                "type": "number"
              },
              "limit": {
                "description": "Max rows, 1-25 (default 10)",
                "type": "number"
              },
              "min_committees": {
                "description": "With shared_vendors: minimum committees sharing a vendor (default 2)",
                "type": "number"
              },
              "public_companies": {
