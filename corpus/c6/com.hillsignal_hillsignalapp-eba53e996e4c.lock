        {
          "name": "federal_register",
          "title": "Federal Register: rules, proposals, presidential documents, with full text",
          "description": "Search Federal Register documents (final rules, proposed rules, notices, presidential documents) and the passages of their full text. Each passage carries a precise citation (FR page, CFR section and paragraph, and whether it is the rule text, proposed text, presidential text or the agency explanation). Each document carries its status and legal effect from its own dates, and coverage says what has full text. Say what a document requires, authorizes or prohibits only from the passages returned.",
          "inputSchema": {
            "properties": {
              "agency": {
                "description": "Agency name or slug fragment",
                "type": "string"
              },
              "limit": {
                "description": "Max rows, 1-25 (default 10)",
                "type": "number"
              },
              "parts": {
                "description": "all | operative | regulatory_text | proposed_regulatory_text | presidential_text | explanation | preamble",
                "type": "string"
              },
              "query": {
                "description": "Words to find in the documents and their text",
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD); only rows on or after this date",
                "type": "string"
              },
              "status": {
                "description": "Status prefix, e.g. proposed, final, final: in effect",
                "type": "string"
              },
              "type": {
                "description": "any | rule | proposed_rule | notice | presidential_document",
                "type": "string"
              },
              "until": {
                "description": "ISO date (YYYY-MM-DD); only rows on or before this date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
