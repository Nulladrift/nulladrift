        {
          "name": "super_pacs",
          "title": "Super PACs: the biggest, and who is behind one",
          "description": "Which super PACs are pulling the strings: the largest by money raised, spent or on hand for a cycle, from the FEC's own committee totals. With query or committee_id, one committee's profile: its top donors, what it spent for and against which candidates, and the vendors it paid for campaign work. With shared_vendors, the media buyers and consultancies working for more than one committee. With public_companies, listed companies ranked by the political money they give, resolved to tickers. A committee profile also names the public companies behind its money. Answers \"biggest super PACs this cycle\", \"who funds MAGA Inc\", \"what is America PAC spending on\", \"which firms work for both sides\", \"which public companies give the most\".",
          "inputSchema": {
            "properties": {
              "committee_id": {
