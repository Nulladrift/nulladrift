        {
          "name": "money_trail",
          "title": "Follow one donor's money",
          "description": "How much a person or organization gave, through which entities, to which committees, and what those committees did with it. Answers \"how much did Elon Musk give to Trump\", \"who did Timothy Mellon fund\", \"where did Uline's money go\". Returns donor_identity (the resolved person or organization, every employer spelling folded into one, with lifetime totals), given_via (the LLCs, trusts and partnerships the cheques were actually written under — how the money reached the committee), the recipient committees, and each super PAC's independent spending for and against candidates. Names go in as written (\"Elon Musk\"); the FEC form (\"MUSK, ELON\") is handled. Ambiguous names return matched_as; narrow with employer.",
          "inputSchema": {
            "properties": {
