      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HillSignal answers questions about the U.S. federal government and the market from the public record: contract awards, what agencies are about to buy, congressional stock trades and board seats, PAC and super PAC money, insider trades, private raises, bills and executive orders, themes, and its own verified track record. Companies are matched to tickers by exact match only; a miss is reported as a miss. Every row carries a source URL and a date. Cite the URLs. Start with resolve_entity or get_entity for a company, get_politician for a member of Congress, search_awards for specific contracts and award_totals for \"who won the most\" questions (verified totals of money obligated in the dates asked where available; otherwise it says so and gives no total. An award amount from search_awards is a lifetime value: never add those up as a period total), search_opportunities for upcoming purchases and get_opportunity for the full analysis of one (who won similar work and how big, competitor lobbying and money, insider sales with 10b5-1 counts, revenue for scale), latest_events for what just happened. Money questions: money_trail for one donor (\"how much did Musk give\"), super_pacs for the biggest super PACs or one committee's donors and spending, outside_money for who is spending for or against a candidate, pac_lookup and pac_totals for corporate PACs. search_awards returns total_matching; page with offset when it exceeds what was returned. Federal Register (federal_register, federal_register_document): rules, proposed rules and presidential documents with full text. Use them whenever a question about a topic, sector, program, spending or a company's regulatory environment could depend on what a rule or presidential document says, even if the user does not mention the Federal Register. State what a document requires only from returned passages and cite them; give its dates and legal effect; label economic consequences as possible, not established; respect the coverage dates returned; and never treat a document that names an industry as evidence about a particular company or ticker.",
      "tools": [
        {
          "name": "award_totals",
          "title": "Award totals by recipient, ticker or agency",
          "description": "Verified totals of money obligated in the dates asked, per recipient or agency, where verified figures are available. Where they are not, it says so, gives no total, and lists the largest matching awards with their lifetime values labelled. Never present a lifetime value or a sum of them as a period total.",
