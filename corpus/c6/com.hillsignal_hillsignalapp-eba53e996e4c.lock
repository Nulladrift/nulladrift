        {
          "name": "foreign_agents",
          "title": "Who works for a foreign government, and for how much",
          "description": "Who is paid to represent a foreign government or party inside the United States, and HOW MUCH, from the Justice Department's FARA register and the contracts filed with it. Pass top=\"contracts\" for the biggest deals — the largest contract prices, who pays whom, and who owns the client in the filer's own sworn words. Pass country= to LIST THAT COUNTRY'S AGENTS BY NAME: registered_agents is the full current roster, each with its foreign principal, registration number and dates, plus former_agents and the counts. Answer \"how many agents does Israel have and who are they\" from that roster. Pass bill= for the foreign interests that lobbied a bill, or nothing for the country leaderboard. A country response also carries also_in_lobbying_data, the minority of those agents that additionally file under the Lobbying Disclosure Act, split into DIRECT, where the lobbying client IS the foreign principal and bills are named, and SHARED_FIRM, where one firm holds a foreign registration and separate domestic clients — context, never a claim about those clients. That subset is never the roster. Countries are spelled as the register spells them. A country roster also carries the MONEY per agent: agreed_price is the contract price from the agreement exhibit filed at registration, always with the rate it is stated at, and reported_receipts is what the agent later reported actually receiving, as a floor rather than earnings. Both are null where no figure could be proved. Each agent may also carry foreign_principal_owned_by — the filer's sworn words on who owns the foreign principal, which is how a US-registered company names its foreign parent.",
          "inputSchema": {
            "properties": {
              "bill": {
                "description": "Bill number, e.g. HR1234 — returns foreign principals that lobbied it",
                "type": "string"
              },
              "country": {
                "description": "Country as the register spells it, e.g. \"ISRAEL\", \"SAUDI ARABIA\", \"KOREA, SOUTH\"",
                "type": "string"
              },
              "limit": {
                "description": "Max rows, 1-100 (default 20)",
                "type": "number"
              },
              "rate": {
                "description": "With top=contracts: the rate to rank, \"month\" (default) or \"year\", \"quarter\", \"hour\", \"one-time\". Rates are never mixed or converted.",
                "type": "string"
              },
              "top": {
                "description": "Pass \"contracts\" to rank the BIGGEST foreign-agent contract prices on file — who is paid the most, by whom. Combine with country= to narrow it.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78b9d461241fcd6a934b844ff3df595afc2dfa65bfd4b2eb78d84f9dc5cbaa81"
        },
