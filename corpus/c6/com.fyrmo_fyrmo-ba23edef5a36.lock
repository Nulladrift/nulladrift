        {
          "name": "search_businesses",
          "title": "Search businesses",
          "description": "Search businesses in Costa Rica (or Panama with country: 'PA', Guatemala with 'GT', the Dominican Republic with 'DO') by industry, category, place, name and contact channel. Costs no credits: says which contacts each business has without revealing them, sorted by record quality. Combine industry and place with website, social, booking, min_rooms, email_type, ad_pixel, online_store, built_with and outdated_site to find the right target (spas that book on WhatsApp, businesses on Instagram with no website, stores that use Gmail, Wix sites not updated in years). Each result has signals with the same words: website, social, booking, booking_systems, rooms, email_type, ad_pixels, online_store, built_with, site_year (last update), no_mobile_version, no_https and opening_hours (OpenStreetMap format). Returns total and next_offset (null on the last page). Up to 3,000 results a day (100 until the account buys credits) and the first 1,000 of each search. detail: 'summary' drops signals and categories to save tokens.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ad_pixel": {
                "description": "true: its own website has a Meta or TikTok ad pixel",
                "type": "boolean"
              },
              "booking": {
                "description": "How they take bookings: through WhatsApp, without a booking system (phone, email, form) or with one. Known for about 1,500 businesses, mostly spas, salons and hotels",
                "enum": ["whatsapp", "no_booking_system", "booking_system"],
                "type": "string"
              },
              "built_with": {
                "description": "Only businesses whose own website is built with this CMS or site builder",
                "enum": ["wordpress", "wix", "godaddy", "squarespace", "shopify", "google_sites", "webflow", "joomla"],
                "type": "string"
              },
              "category": {
                "description": "Category slug inside the industry, e.g. barberia, odontologia, pulperia_minisuper, taller_mecanico, hotel. list_categories has them all; an unknown one comes back with the valid ones",
                "maxLength": 40,
                "type": "string"
              },
              "channel": {
                "description": "Only businesses with this contact (mobile: a mobile number published as a phone, likely WhatsApp)",
                "enum": ["whatsapp", "phone", "email", "website", "mobile"],
                "type": "string"
              },
              "country": {
                "description": "CR (Costa Rica, the default), PA (Panama), GT (Guatemala) or DO (Dominican Republic)",
                "enum": ["CR", "PA", "GT", "DO"],
                "type": "string"
              },
              "detail": {
                "description": "full (default) or summary",
                "enum": ["full", "summary"],
                "type": "string"
              },
              "email_type": {
                "description": "own_domain: email on the business's own domain; free: Gmail, Hotmail, Outlook, Yahoo, iCloud and similar",
                "enum": ["own_domain", "free"],
                "type": "string"
              },
              "independent_only": {
                "description": "true: small businesses only, no chain locations",
                "type": "boolean"
              },
              "industry": {
                "description": "Industry: tienda (Retail and convenience stores), restaurante (Restaurants and cafés), hospedaje (Hotels and lodging), automotriz (Auto repair and parts), salon_belleza (Beauty salons and barbers), gimnasio (Gyms and fitness), spa (Spas), salud (Clinics, doctors and labs), veterinaria (Veterinary clinics), educacion (Private schools and academies), servicios (Professional services), construccion_hogar (Construction and home services), eventos (Events and parties), industria (Manufacturers and distributors), agro (Farms and agriculture), imprenta_medios (Printing, signs and media), transporte (Transport, freight and car rental), entretenimiento (Entertainment, sports and recreation), finanzas (Banks, lenders and credit unions), otros (Other businesses)",
                "enum": ["tienda", "restaurante", "hospedaje", "automotriz", "salon_belleza", "gimnasio", "spa", "salud", "veterinaria", "educacion", "servicios", "construccion_hogar", "eventos", "industria", "agro", "imprenta_medios", "transporte", "entretenimiento", "finanzas", "otros"],
                "type": "string"
              },
              "limit": {
                "description": "Results per page (max 50, default 20)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_rooms": {
                "description": "Hotels: at least this many rooms",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "min_whatsapp_confidence": {
                "description": "Minimum WhatsApp confidence, 0 to 1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "name": {
                "description": "Part of the business name",
                "maxLength": 120,
                "type": "string"
              },
              "offset": {
                "description": "Skip this many results (use next_offset)",
                "maximum": 999,
                "minimum": 0,
                "type": "integer"
              },
              "online_store": {
                "description": "true: its own website is an online store (Shopify, WooCommerce with products, PrestaShop…)",
                "type": "boolean"
              },
              "outdated_site": {
                "description": "true: its own website shows no update in two years or more (copyright year or page dates)",
                "type": "boolean"
              },
              "place": {
                "description": "Province, canton or district in Costa Rica (e.g. 'Escazú', 'La Fortuna', 'Heredia'); in Panama, province, district or corregimiento (e.g. 'Chiriquí', 'David', 'Bella Vista'); in Guatemala, department or municipality (e.g. 'Quetzaltenango', 'Mixco'); in the Dominican Republic, province or municipality (e.g. 'La Vega', 'Santo Domingo Este'). Accents optional",
                "maxLength": 80,
                "type": "string"
              },
              "social": {
                "description": "Only businesses with this social profile",
                "enum": ["instagram", "facebook", "tiktok", "youtube", "linkedin", "x"],
                "type": "string"
              },
              "website": {
                "description": "none: no website (or it is down or parked); has: a working website",
                "enum": ["none", "has"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b7b6f1efc80430125d7f42bb2fae156dfdffc1869039140ffb54d23ea236551"
        },
