          "digest": "sha256:d4dfc88f40991bbb64f2109703305815e7f611583c67fa1af591a0fb775d7689"
        },
        {
          "name": "search_deals",
          "title": "Search deals",
          "description": "Search current, verified consumer-tech deals on MoneyDeals (US) by product name, model, brand or category. Each deal has a condition field (subscriber_exclusive, members_only, refurbished, open_box, bundle or null) — mention it so prices are compared fairly. Marketplace offers are labeled (is_marketplace, marketplace, ships_from, delivery_days_max, shipping_cost, seller_type, store_rating); mention ships_from and delivery time to the user. AliExpress offers include best_coupon {code, amount, min_spend, ends_at} when a current code applies. US retailers and brand stores rank before marketplace offers shipping from China, which only appear when at least 15% cheaper than the best US offer of the same model. Coverage: 155+ brands with their own MoneyDeals brand page, e.g. EcoFlow, Anker, Anker SOLIX, Jackery, BLUETTI, DJI, Insta360, Roborock, Dreame, ECOVACS, Shark, Bambu Lab, Anycubic, Creality, Ninja, Levoit, Nanoleaf, Govee, Garmin, Sonos, Samsung. 8 categories: Robot Vacuums, Power Stations & Solar, E-Bikes & E-Scooters, Smart Home & Security, 3D Printers, Power Banks, Beauty Tech, Kitchen Gadgets. Use list_brands for the full list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "include_marketplace": {
                "default": true,
                "description": "Include marketplace offers (AliExpress).",
                "type": "boolean"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "default": "us",
                "description": "Market code. Only 'us' is supported today.",
                "enum": ["us"],
                "type": "string"
              },
              "max_price": {
                "type": "number"
              },
              "min_discount": {
                "description": "Minimum % below the 90-day average",
                "type": "number"
              },
              "query": {
                "minLength": 2,
                "type": "string"
              },
              "retailer": {
                "type": "string"
              },
              "ships_from": {
                "description": "Only offers shipping from this country (US retailers count as US).",
                "enum": ["US", "CN"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
