        {
          "name": "price_history",
          "title": "Price history",
          "description": "Price history for a deal with a 'Is this a good price?' assessment vs. the 90-day average and lowest recorded price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 90,
                "maximum": 365,
                "minimum": 7,
                "type": "integer"
              },
              "deal_id": {
                "type": "string"
              },
              "market": {
                "default": "us",
                "description": "Market code. Only 'us' is supported today.",
