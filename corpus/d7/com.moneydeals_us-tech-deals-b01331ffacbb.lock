      "serverInfo": {
        "name": "moneydeals-deals",
        "title": "MoneyDeals Deals",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to verified US consumer-tech deals from moneydeals.com. Always show the disclosure field to the user and link via click_url. Prices with price_state 'last_seen' are not current. Mention a deal's condition (refurbished, bundle, members_only, subscriber_exclusive, open_box) when set. Marketplace offers (AliExpress) may ship from China with longer delivery; always state ships_from and delivery_days_max. Coverage: 155+ brands with their own MoneyDeals brand page, e.g. EcoFlow, Anker, Anker SOLIX, Jackery, BLUETTI, DJI, Insta360, Roborock, Dreame, ECOVACS, Shark, Bambu Lab, Anycubic, Creality, Ninja, Levoit, Nanoleaf, Govee, Garmin, Sonos, Samsung. 8 categories: Robot Vacuums, Power Stations & Solar, E-Bikes & E-Scooters, Smart Home & Security, 3D Printers, Power Banks, Beauty Tech, Kitchen Gadgets. Use list_brands for the full list.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare deals",
          "description": "Side-by-side comparison of up to 4 deals by id. Marketplace offers are labeled (is_marketplace, marketplace, ships_from, delivery_days_max, shipping_cost, seller_type, store_rating); mention ships_from and delivery time to the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "market": {
                "default": "us",
                "description": "Market code. Only 'us' is supported today.",
                "enum": ["us"],
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:262b9e1fe9793f9040379c47c3497892a480f8a0b07f87a63cf518acd4f15b39"
        },
        {
          "name": "get_coupons",
          "title": "Get coupons",
          "description": "Verified, currently valid US coupons (type 'code') and code-free promotions (type 'promotion'). Brand is optional: without it, returns the newest verified coupons, optionally filtered by category. Brand/retailer 'aliexpress' returns AliExpress US code tiers with min_spend and ends_at. If a brand has no coupons, suggested_deals lists current deals of that brand. Coverage: 155+ brands with their own MoneyDeals brand page, e.g. EcoFlow, Anker, Anker SOLIX, Jackery, BLUETTI, DJI, Insta360, Roborock, Dreame, ECOVACS, Shark, Bambu Lab, Anycubic, Creality, Ninja, Levoit, Nanoleaf, Govee, Garmin, Sonos, Samsung. 8 categories: Robot Vacuums, Power Stations & Solar, E-Bikes & E-Scooters, Smart Home & Security, 3D Printers, Power Banks, Beauty Tech, Kitchen Gadgets. Use list_brands for the full list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Optional brand name, e.g. Samsung",
                "minLength": 2,
                "type": "string"
              },
              "category": {
                "description": "Optional category filter (used when no brand is given), e.g. vacuums",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "default": "us",
                "description": "Market code. Only 'us' is supported today.",
                "enum": ["us"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get coupons"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d415b81110b1a5f8dd633d7d17ee9ec502af2eaa26443db89f09b740e2d9acda"
        },
        {
          "name": "get_deal",
          "title": "Get deal",
          "description": "Get one deal by its id or moneydeals.com deal URL. Includes the condition field (refurbished, bundle, members_only …). Marketplace offers are labeled (is_marketplace, marketplace, ships_from, delivery_days_max, shipping_cost, seller_type, store_rating); mention ships_from and delivery time to the user. Docs: https://www.moneydeals.com/developers/mcp",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deal_id": {
                "type": "string"
              },
              "market": {
                "default": "us",
                "description": "Market code. Only 'us' is supported today.",
                "enum": ["us"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93ba5e7f566c58c05d34f816e47b3938ab0c121a44b4c2a568194dae67772df2"
        },
        {
          "name": "list_brands",
          "title": "List brands",
          "description": "List the brands MoneyDeals covers with the number of active deals and verified coupons, optionally filtered by category. Use it for questions like 'Which brands do you cover?'. Coverage: 155+ brands with their own MoneyDeals brand page, e.g. EcoFlow, Anker, Anker SOLIX, Jackery, BLUETTI, DJI, Insta360, Roborock, Dreame, ECOVACS, Shark, Bambu Lab, Anycubic, Creality, Ninja, Levoit, Nanoleaf, Govee, Garmin, Sonos, Samsung. 8 categories: Robot Vacuums, Power Stations & Solar, E-Bikes & E-Scooters, Smart Home & Security, 3D Printers, Power Banks, Beauty Tech, Kitchen Gadgets. Use list_brands for the full list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter, e.g. power-stations",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "default": "us",
                "description": "Market code. Only 'us' is supported today.",
                "enum": ["us"],
                "type": "string"
              },
              "with_offers_only": {
                "default": false,
                "description": "Only brands with at least one active deal or coupon",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
