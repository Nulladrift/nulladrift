{
  "lockfileVersion": 2,
  "subjects": {
    "com.adrenalinelist/adventures": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.adrenalinelist.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "adrenalinelist",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Catalogue of adrenaline activities on adrenalinelist.com. Without sign-in: search and get adventures, list destination and category slugs, and read first-party rankings (list_rankings): Adrenaline Index, best value per hour, top rated by members, most visited and type 1 fun. Members who sign in with their Adrenaline List account can also read and update their own bucket list and done list (list_my_adventures, mark_adventure, unmark_adventure) and read their stats (get_my_stats); calling one of these starts sign-in. Use slugs from search_adventures with mark_adventure.",
      "tools": [
        {
          "name": "get_adventure",
          "title": "Get adventure",
          "description": "Get full public details for one published adventure by slug, including requirements, review summary and the operator contact shown on the public page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get adventure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ae25eead2dfe266e04fb7b3d4846e92027298e7f54aeda5d805cb1536956fd2"
        },
        {
          "name": "get_my_stats",
          "title": "Get my stats",
          "description": "The signed-in member's Adrenaline List stats: adventures done, bucket list size and countries visited, plus their profile URL when they have a public profile with a username. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get my stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d464e7fa0ef60d749bb1211af0f2e11e3726678d835981562240e6bbaba714c"
        },
        {
          "name": "list_my_adventures",
          "title": "List my adventures",
          "description": "List the signed-in member's own adventures on Adrenaline List: their bucket list and the adventures they have done, with slug, title, status, visibility, notes and completion date. Filter by status (done or bucket_list); 50 per page. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "enum": ["done", "bucket_list"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my adventures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0c7492b59f7ba988943b2d1388e79aa9975fc658f0178c46f3d7e5acc09da54"
        },
        {
          "name": "list_rankings",
          "title": "List rankings",
          "description": "Adrenaline List's own ranking lists: most-adrenaline (Adrenaline Index 1-10, category estimate where unrated), best-value (USD per hour), top-rated (approved member reviews), most-visited (page views, last 30 days) and type-1-fun (fun in the moment). Returns ranked published adventures with their score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "enum": ["most-adrenaline", "best-value", "top-rated", "most-visited", "type-1-fun"],
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List rankings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2f354de2d3dff50af6c819475964c0d6be5c566ad2c0ff727585a150a8220a5"
        },
        {
          "name": "list_search_options",
          "title": "List search options",
          "description": "List destination (country) and category slugs with published activity counts, for use with search_adventures.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories_limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "destinations_limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List search options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24db8874f36ececc5ea84a3d8eb02cfd4da6eb38b9562502d8d0d76984128023"
        },
        {
          "name": "mark_adventure",
          "title": "Mark an adventure",
          "description": "Add a published adventure to the signed-in member's bucket list or mark it as done, by slug (from search_adventures). Optional notes, completed_at (for done) and visibility (public, profile_only or private). Anything omitted keeps what is stored: visibility (public for a new entry), notes and the completion date. Repeating a call changes nothing. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "completed_at": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "type": "string"
                  }
                ]
              },
              "notes": {
                "maxLength": 1000,
                "type": "string"
              },
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              },
              "status": {
                "enum": ["done", "bucket_list"],
                "type": "string"
              },
              "visibility": {
                "enum": ["public", "profile_only", "private"],
                "type": "string"
              }
            },
            "required": ["slug", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mark an adventure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:49eb54090b6daacca562a047b5afe09fd235480021df3172bcc20db5da313c92"
        },
        {
          "name": "search_adventures",
          "title": "Search adventures",
          "description": "Search published adrenaline activities on Adrenaline List by text, destination slug, category slug, adrenaline rating (1-10), months and maximum duration. Use list_search_options for valid slugs. Prices are indicative.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              },
              "destination": {
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              },
              "max_adrenaline": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_duration_minutes": {
                "maximum": 20160,
                "minimum": 1,
                "type": "integer"
              },
              "min_adrenaline": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "months": {
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search adventures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:032aa2a2a34e3508851431d9b121457ec34d3b4c251f8009a7f0c50a63bf1b16"
        },
        {
          "name": "unmark_adventure",
          "title": "Unmark an adventure",
          "description": "Remove an adventure from the signed-in member's bucket list or done list, by slug, including one that is no longer published. Removing one that is on neither list changes nothing. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Unmark an adventure"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ed870c1183eddaaffeedfc4df43b4ffc1ccdc195fb8aff9d22d283b5f0e505a4"
        }
      ],
      "digest": "sha256:fcdcf82d211038683423303351ea31d93d377a9de6f2d4b1be1d1ffd51d1ab82"
    }
  }
}
