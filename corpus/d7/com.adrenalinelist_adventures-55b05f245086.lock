    "com.adrenalinelist/adventures": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.adrenalinelist.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "adrenalinelist",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Catalogue of adrenaline activities on adrenalinelist.com. Without sign-in: search and get adventures, list destination and category slugs, and read first-party rankings (list_rankings): Adrenaline Index, best value per hour, top rated by members, most visited and type 1 fun. Members who sign in with their Adrenaline List account can also read and update their own bucket list and done list (list_my_adventures, mark_adventure, unmark_adventure) and read their stats (get_my_stats); calling one of these starts sign-in. Use slugs from search_adventures with mark_adventure.",
      "tools": [
        {
          "name": "get_adventure",
          "title": "Get adventure",
          "description": "Get full public details for one published adventure by slug, including requirements, review summary and the operator contact shown on the public page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get adventure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1d76f20a5c60d3d042a6c6305b5d8ab0b138c5f4e9db488fd0eb7bef70c39477"
        },
        {
          "name": "get_my_stats",
          "title": "Get my stats",
          "description": "The signed-in member's Adrenaline List stats: adventures done, bucket list size and countries visited, plus their profile URL when they have a public profile with a username. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get my stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3d702b39444ba9f1df202e62736c3b397f880f8c4eb4da18fcb430d49baf232e"
        },
        {
          "name": "list_my_adventures",
          "title": "List my adventures",
          "description": "List the signed-in member's own adventures on Adrenaline List: their bucket list and the adventures they have done, with slug, title, status, visibility, notes and completion date. Filter by status (done or bucket_list); 50 per page. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "enum": ["done", "bucket_list"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my adventures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:41cb91cbf93bb34596ec7bf5892993305e94a8d79cbc04bae51419e04241d3b3"
        },
        {
          "name": "list_rankings",
          "title": "List rankings",
          "description": "Adrenaline List's own ranking lists: most-adrenaline (Adrenaline Index 1-10, category estimate where unrated), best-value (USD per hour), top-rated (approved member reviews), most-visited (page views, last 30 days) and type-1-fun (fun in the moment). Returns ranked published adventures with their score.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "list": {
                "enum": ["most-adrenaline", "best-value", "top-rated", "most-visited", "type-1-fun"],
                "type": "string"
              }
            },
            "required": ["list"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List rankings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d4798908d66aaf35c19610c8dc500dfc8cda24887d387f3af1d5ea1ee28e24bb"
        },
        {
          "name": "list_search_options",
          "title": "List search options",
          "description": "List destination (country) and category slugs with published activity counts, for use with search_adventures.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "categories_limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "destinations_limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List search options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:daf98509375fa41f897a93314e179cd24f0cbab7d42d2142d5654d4c3d236e05"
        },
        {
          "name": "mark_adventure",
          "title": "Mark an adventure",
          "description": "Add a published adventure to the signed-in member's bucket list or mark it as done, by slug (from search_adventures). Optional notes, completed_at (for done) and visibility (public, profile_only or private). Anything omitted keeps what is stored: visibility (public for a new entry), notes and the completion date. Repeating a call changes nothing. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "completed_at": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "type": "string"
                  }
                ]
              },
              "notes": {
                "maxLength": 1000,
                "type": "string"
              },
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              },
              "status": {
                "enum": ["done", "bucket_list"],
                "type": "string"
              },
              "visibility": {
                "enum": ["public", "profile_only", "private"],
                "type": "string"
              }
            },
            "required": ["slug", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mark an adventure"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:97bf9a683605d5dd70eae9dcad41e1f4c438312a6c2d9d59db0787166661d834"
        },
        {
          "name": "search_adventures",
          "title": "Search adventures",
          "description": "Search published adrenaline activities on Adrenaline List by text, destination slug, category slug, adrenaline rating (1-10), months and maximum duration. Use list_search_options for valid slugs. Prices are indicative.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              },
              "destination": {
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              },
              "max_adrenaline": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_duration_minutes": {
                "maximum": 20160,
                "minimum": 1,
                "type": "integer"
              },
              "min_adrenaline": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "months": {
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "page": {
                "default": 1,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search adventures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:871e6a4c4b74c857d0a81b39973b4c856a6ad493e618ff9f5ac3a0a4ee22f217"
        },
        {
          "name": "unmark_adventure",
          "title": "Unmark an adventure",
          "description": "Remove an adventure from the signed-in member's bucket list or done list, by slug, including one that is no longer published. Removing one that is on neither list changes nothing. Requires sign-in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9-]{1,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Unmark an adventure"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:40d5902effddeba7eb7f69ddd2bb0286b3439c87eadb527418f26c443ad4b042"
        }
      ],
      "digest": "sha256:9192b2a405d7939ac7939e9d6a6c41276777b77834bf6735683e2a61e3a6ba1e"
    }
  }
