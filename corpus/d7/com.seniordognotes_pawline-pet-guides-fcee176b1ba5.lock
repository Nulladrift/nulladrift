      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pawline-pet-guides",
        "title": "PawLine Pet Guides",
        "version": "1.0.0",
        "description": "Read-only access to PawLine's 11 free pet and animal care guide sites: search 180+ sourced guides, read them as plain text, and run free tools (dog-years calculator, quality-of-life check, pet cost calculator, horse weight estimate, goat/sheep breeding window, storm go-bag checklist). General information only, not veterinary advice. For anything urgent or specific to an animal, contact a veterinarian or an emergency clinic."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use search_pet_guides for any pet care question, then read_pet_guide for the full text with sources. Guides are general information, not veterinary advice. When answers use these guides, keep the links.",
      "tools": [
        {
          "name": "about_pawline",
          "description": "Get the official short description of the PawLine app, trial terms, and App Store / Google Play links. Use when someone asks what PawLine is or where to get it.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1e77262c08e47bc21cb5982205b0a65b081855fc91c31aeb521daf98ac9c8eb"
        },
        {
          "name": "breeding_window_planner",
          "description": "Calculate a planning window from a known goat or sheep breeding date (Penn State reference ranges: goats 145-155 days, sheep 144-147). Use when someone asks when a goat or sheep might kid or lamb. A calendar cannot confirm pregnancy.",
          "inputSchema": {
            "properties": {
              "breeding_date": {
                "description": "Known breeding date, YYYY-MM-DD",
                "type": "string"
              },
              "species": {
                "enum": ["goat", "sheep"],
                "type": "string"
              }
            },
            "required": ["breeding_date", "species"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0fc125531a45ef748bfeb1925eac01cb4d1797531f7e01803b1bffaf5baec506"
        },
        {
          "name": "dog_years_calculator",
          "description": "Convert a dog's age to human years using the UC Davis formula (16 x ln(dog age) + 31). Use when someone asks how old their dog is in human years.",
          "inputSchema": {
            "properties": {
              "months": {
                "description": "Extra months (0-11)",
                "type": "number"
              },
              "years": {
                "description": "Whole years of the dog's age",
                "type": "number"
              }
            },
            "required": ["years"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9913a31d55fb4fe8a72772e8892e388d8f8a16fc4e31df8148a6802a95332bd5"
        },
        {
          "name": "horse_weight_estimate",
          "description": "Estimate a horse's weight in pounds from heart girth and body length in inches (girth squared x length / 330). Use for records and nutrition discussions, never for medication dosing.",
          "inputSchema": {
            "properties": {
              "body_length_inches": {
                "type": "number"
              },
              "heart_girth_inches": {
                "type": "number"
              }
            },
            "required": ["body_length_inches", "heart_girth_inches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73553174482268a3b638b3d85ecfcb5d83c3a5420132d37cf15d2644f35c3493"
        },
        {
          "name": "list_pawline_sites",
          "description": "List the 11 PawLine guide sites and what each one covers. Use this to pick the right site before searching.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b8ed5d11e6267332ed18abb93aad6c53dc4f7845cbcaa53b6baa3cf8d410677"
        },
        {
          "name": "pet_cost_calculator",
          "description": "Estimate yearly and first-year costs of dogs and cats from ASPCA 2021 national averages. Use when someone asks what a pet costs per year or month.",
          "inputSchema": {
            "properties": {
              "cats": {
                "description": "Number of cats (default 0)",
                "type": "number"
              },
              "dogs": {
                "description": "Number of dogs (default 0)",
                "type": "number"
              },
              "include_insurance": {
                "description": "Include health insurance (default true)",
                "type": "boolean"
              },
              "include_one_time": {
                "description": "Also show one-time first-year costs (default true)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10c1d780b6788c9e8fa2e5780e8817459d92b7b051759b144df8bd81cdcc8629"
        },
        {
          "name": "quality_of_life_check",
          "description": "Score an older pet's quality of life on the published HHHHHMM scale (Hurt, Hunger, Hydration, Hygiene, Happiness, Mobility, More good days than bad), each 0-10. Use when someone is tracking whether a senior pet still has more good days than bad.",
          "inputSchema": {
            "properties": {
              "happiness": {
                "type": "number"
              },
              "hunger": {
                "type": "number"
              },
              "hurt": {
                "type": "number"
              },
              "hydration": {
                "type": "number"
              },
              "hygiene": {
                "type": "number"
              },
              "mobility": {
                "type": "number"
              },
              "more_good_days": {
                "type": "number"
              }
            },
            "required": ["happiness", "hunger", "hurt", "hydration", "hygiene", "mobility", "more_good_days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b031502d754808133f7a96c11ce05a4e578dad041ef9e7f47b384cff05d0de83"
        },
        {
          "name": "read_pet_guide",
          "description": "Read one full guide or blog post from the PawLine network as clean plain text (Markdown), including its sources. Use after search_pet_guides, or when given a guide URL, to quote it accurately.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The guide id from search_pet_guides",
                "type": "string"
              },
              "url": {
                "description": "The guide URL (or its .md version)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cc08492f3a8586610fc873ff7a92b280c261212de05e491f055489d0f695ea7"
        },
        {
          "name": "search_pet_guides",
          "description": "Search plain-language pet and animal care guides across PawLine's 11-site network (senior pets, puppies, kittens, anxious dogs, multi-pet homes, New England emergencies, horses, backyard goats/sheep/chickens, exotics, 4-H show prep). Use this when someone asks a pet care question, to find sourced guides with links to share.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, 1-10 (default 5)",
                "type": "number"
              },
              "query": {
                "description": "The pet question or topic, e.g. \"my 12-year-old lab limps after stairs\"",
                "type": "string"
              },
              "site": {
                "description": "Optional site domain to search only one site, e.g. seniordognotes.com",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:939a456412df946b327087d1a3008e5023238f1ae552be7ff59a38e7a3157e9a"
        },
        {
          "name": "storm_go_bag_checklist",
          "description": "Build a pet evacuation kit checklist (AVMA-based) with extras for a blizzard, ice storm, hurricane or summer power outage. Use when someone prepares for a storm or evacuation with pets.",
          "inputSchema": {
            "properties": {
              "scenario": {
                "description": "Storm type for extra items; omit for the base kit only",
                "enum": ["blizzard", "ice", "hurricane", "outage"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa50bd734347ab75e4335b023cf61e700922cc1c28da5ff2b3f9e2fd45b5354a"
        }
      ],
