      "instructions": "Red inmobiliaria mexicana PuntoCasa: avisos de primera mano de grupos de WhatsApp de brokers (Mérida, Yucatán, Riviera Maya, CDMX, Monterrey...). Usa buscar_propiedades para encontrar avisos por zona/tipo; listar_subdominios para descubrir portales por lugar; get_aviso para el detalle de un aviso. El contacto de leads es el WhatsApp 52 999 900 7295.",
      "tools": [
        {
          "name": "buscar_propiedades",
          "description": "Busca avisos en la red. zona: lugar/colonia/pueblo (p.ej. 'sisal', 'caucel', 'tulum').\n    tipo: 'venta', 'renta', 'departamento', 'casa', 'terreno', 'local', 'oficina' (opcional).",
