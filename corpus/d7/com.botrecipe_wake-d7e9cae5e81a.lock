{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/wake": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wake.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-wake",
        "title": "Agent Wake",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Your AI agent picks up where it left off. Schedule a wake-up with its notes and next step; we POST it back on time or hold it for the next session. Free 50 calls a day, then $9 a month. Free 50 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "cancel_wake",
          "description": "Cancel a pending wake-up by wake_id. Call once without confirm to preview, then with confirm=true.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "type": "boolean"
              },
              "inbox": {
                "description": "Your private inbox name (12+ chars, keep it secret, reuse it every session). Optional if you send an API key: then the key is your inbox.",
                "type": "string"
              },
              "wake_id": {
                "type": "string"
              }
            },
            "required": ["wake_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:539f97bb3279f6f45619e2e8c146fb5ac08cd0212d09f45209d2f8ddff802de6"
        },
        {
          "name": "check_wakes",
          "description": "Collect wake-ups that are due for your inbox (each returned once, with its saved state and thread ID) and list upcoming ones. Call this at the start of a session.",
          "inputSchema": {
            "properties": {
              "inbox": {
                "description": "Your private inbox name (12+ chars, keep it secret, reuse it every session). Optional if you send an API key: then the key is your inbox.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a7eba90823c90af3c651293729e6b4895712b96df35452f98445bc3364974bc5"
        },
        {
          "name": "schedule_wake",
          "description": "Schedule a wake-up for your agent. At the time you pick, Agent Wake POSTs your saved state (notes, thread ID, next step) to your callback URL, or holds it for check_wakes. Use it so a later, fresh session picks up where this one stopped. Call once without confirm to preview what will be saved, show the user, then call again with confirm=true.",
          "inputSchema": {
            "properties": {
              "callback_url": {
                "description": "Optional public https URL to POST the wake to (for example your agent runner webhook). Without it, collect wakes with check_wakes.",
                "type": "string"
              },
              "confirm": {
                "description": "false or missing = preview only, nothing saved. true = save the wake.",
                "type": "boolean"
              },
              "inbox": {
                "description": "Your private inbox name (12+ chars, keep it secret, reuse it every session). Optional if you send an API key: then the key is your inbox.",
                "type": "string"
              },
              "repeat_minutes": {
                "description": "Optional. Repeat every N minutes after the first wake (free: 60+, Pro: 5+).",
                "type": "integer"
              },
              "state": {
                "description": "What your future session needs: goal, progress, next step, IDs. Free up to 8 KB, Pro up to 64 KB.",
                "type": "object"
              },
              "thread_id": {
                "description": "Optional conversation or task ID to resume.",
                "type": "string"
              },
              "when": {
                "description": "When to wake: \"in 30 minutes\", \"in 2 hours\", \"in 3 days\", or an ISO time like 2026-10-16T14:00:00Z. Between 1 minute and 365 days out.",
                "type": "string"
              }
            },
            "required": ["when"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:feecfba0c01ec6ee6e5c3b8ffd6825b15f47b99be7f9fa411b235f3a7299f595"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 50 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e5d8e6e650efaef1a182c6ee31561044f3d244d61647ca3fb50d9a374bc87c5d"
        }
      ],
      "digest": "sha256:c54922b5e4ee171a22791c622dddbce77fb554ed12caa6f25e45d8dc4268d9e9"
    }
  }
}
