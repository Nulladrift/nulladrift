{
  "lockfileVersion": 2,
  "subjects": {
    "ch.opendata/transport": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://transport.opendata.ch/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "transport.opendata.ch",
        "title": "Swiss public transport (transport.opendata.ch)",
        "version": "2c28784a",
        "description": "Stations, connections and departures of Swiss public transport.",
        "websiteUrl": "https://transport.opendata.ch",
        "icons": [
          {
            "src": "https://transport.opendata.ch/favicon.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Swiss public transport timetable with real-time delays, from the national timetable (opentransportdata.swiss), run by the association Opendata.ch. Times are Swiss local time (Europe/Zurich). Station names can be given as people say them ('Bern', 'Zürich HB', 'Lausanne, gare'); when a name is ambiguous, call find_stations first and use the exact name or id it returns. Addresses and places of interest work as start and destination of a connection too. Coverage is Switzerland (and border stations); for journeys abroad say that the data ends at the border. The timetable covers the days from a week ago to about three months ahead; nothing found for a date outside that range means no data, not no service.",
      "tools": [
        {
          "name": "connections",
          "title": "Connections",
          "description": "Public transport connections from A to B: times, platforms, delays, changes, lines.",
          "inputSchema": {
            "properties": {
              "arrive_by": {
                "default": false,
                "description": "True if `time` is the latest arrival rather than departure.",
                "title": "Arrive By",
                "type": "boolean"
              },
              "date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "YYYY-MM-DD; today if left out.",
                "title": "Date"
              },
              "destination": {
                "description": "Destination, like origin.",
                "title": "Destination",
                "type": "string"
              },
              "limit": {
                "default": 4,
                "description": "Number of connections.",
                "maximum": 8,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "origin": {
                "description": "Start: station name or id, address or place.",
                "title": "Origin",
                "type": "string"
              },
              "time": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "hh:mm, Swiss local time; now if left out.",
                "title": "Time"
              },
              "via": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Up to two stations the journey must pass.",
                "title": "Via"
              }
            },
            "required": ["destination", "origin"],
            "title": "connectionsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ac4569b3ff33d356fe1c74fb2352876aedd22a8925606b65574231df957b4a4d"
        },
        {
          "name": "departures",
          "title": "Departures",
          "description": "The departure (or arrival) board of a station, with platforms, delays and cancellations.",
          "inputSchema": {
            "properties": {
              "arrivals": {
                "default": false,
                "description": "True for arrivals instead of departures.",
                "title": "Arrivals",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Number of entries.",
                "maximum": 40,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "station": {
                "description": "Station name or id.",
                "title": "Station",
                "type": "string"
              },
              "when": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "'YYYY-MM-DD hh:mm', Swiss local time; now if left out.",
                "title": "When"
              }
            },
            "required": ["station"],
            "title": "departuresArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c8c329944f74db5f32e132ba8bf7bcf07f7658a020243135c7f556e5fbb3a46"
        },
        {
          "name": "find_stations",
          "title": "Find stations",
          "description": "Find stations and stops by name. Returns their exact names and ids, best match first.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Name or part of a name, e.g. 'Bern' or 'Basel, Bank'.",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "find_stationsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40a73e88d0ad2f165315f0150a5d149b0524335878ece12868ce2234b1058330"
        },
        {
          "name": "stations_nearby",
          "title": "Stops nearby",
          "description": "The stops closest to a point, with their distance in metres.",
          "inputSchema": {
            "properties": {
              "latitude": {
                "description": "WGS84 latitude, e.g. 46.9488.",
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "description": "WGS84 longitude, e.g. 7.4391.",
                "title": "Longitude",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "title": "stations_nearbyArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:246c936ddad16e1c6795d18d9718c22c6b812fb5b9cdcb51320395216b42c442"
        }
      ],
      "digest": "sha256:85f9ea04993c90d6d8efa1756121090e61119f9f22ae606db69fba753a673b43"
    }
  }
}
