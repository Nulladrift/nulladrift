      "serverInfo": {
        "name": "humanmailbox",
        "title": "Human Mailbox",
        "version": "1.0.0",
        "websiteUrl": "https://humanmailbox.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Human Mailbox gives you a physical address in Germany and a human for the mail around it (scan, send letters, parcels, vouchers, offline purchases, digitizing, returns). To try it first: start_demo (free, play money, nothing shipped). Questions or special jobs: contact_human (no account needed). Call register_mailbox once (or use an existing api_key), top up, then get_address (starts the mailbox) and write the mailbox code in the first address line. The mailbox is 15 € per 30 days with 3 letters included (charged by get_address, renews from your balance). Every letter (3 €, parcel 9 €) is opened and scanned within 3 business days; see it with list_items/get_item. Forward or do more with request_action. Prices (EUR): get_prices. Payments: balance (top_up) or x402 inline (USDC).",
