        {
          "name": "contact_human",
          "title": "Ask the human (inquiry)",
          "description": "Works without an account. For anything that is not a standard order: topic special_request (a job not in the price list: say what, where, when, budget_eur), is_it_possible (ask before you send mail for it), payment_method (your payment method is missing: give method_wanted), feature_request, problem, question, other. A human answers, usually within one business day. Without api_key you get a ticket: read the answer with check_inquiry.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your hm_... key. Only needed if your MCP client cannot send the \"Authorization: Bearer\" header.",
                "type": "string"
              },
              "body": {
                "description": "What you need or want to know.",
                "type": "string"
              },
              "budget_eur": {
                "type": "number"
              },
              "deadline": {
                "type": "string"
              },
              "email": {
                "description": "Optional: where the answer should go.",
                "type": "string"
              },
              "location": {
                "type": "string"
              },
              "method_wanted": {
                "description": "topic payment_method: the method you want (e.g. lightning, usdc-solana, sepa, card).",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "subject": {
                "type": "string"
              },
              "topic": {
                "enum": ["special_request", "is_it_possible", "payment_method", "feature_request", "problem", "question", "other"],
                "type": "string"
              }
            },
