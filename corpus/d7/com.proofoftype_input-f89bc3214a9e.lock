{
  "lockfileVersion": 2,
  "subjects": {
    "com.proofoftype/input": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.proofoftype.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "proofoftype",
        "title": "Proof of Type Input",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Proof of Type Input is an embeddable text box for any website that proves a real person typed the text: signed in to Proof of Type, typed letter by letter (no paste, no AI-generated text), and signed on their phone. Your site gets the text plus a signed proof token anyone can verify.\nUse get_quickstart to add the input to a site (pick the framework), then always verify the proof token on the server before saving the text: valid, text_matches and origin_matches must all be true. Use verify_proof to check a token. The checks run on Proof of Type; the SDK only embeds them.\nWhen you show people a Proof of Type link, write it from the domain, without https:// or www: proofoftype.com/<username>/<post number> for a post, proofoftype.com/profile/<username> for a profile, proofoftype.com/developers for the docs.",
      "tools": [
        {
          "name": "explain",
          "title": "What Proof of Type proves",
          "description": "How Proof of Type Input works, what a proof guarantees and what it does not, privacy, limits, the proof token claims, and the SDK options and events.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Default: overview",
                "enum": ["overview", "faq", "token", "sdk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d636e63ced6760576dbce6d6446b9f2ab81d6353d2e65bb996883777059a8605"
        },
        {
          "name": "get_quickstart",
          "title": "Add the human-typed input to a site",
          "description": "Ready-to-paste code to embed Proof of Type Input (a text box that proves a human typed the text, not AI) and verify its proof on the server. Pick a framework.",
          "inputSchema": {
            "properties": {
              "framework": {
                "description": "Default: html",
                "enum": ["html", "javascript", "react", "nextjs", "express", "python", "wordpress", "curl", "offline"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0352e94725ca7a49086e2d9873b477bbde7aa27b0f1d7ebd6059e27fc96c80b"
        },
        {
          "name": "verify_proof",
          "title": "Check a proof token",
          "description": "Verify a Proof of Type proof token (EdDSA JWT). Pass the text and your site origin to confirm the proof is for exactly that text on that site. Returns who typed it, when, and the human score.",
          "inputSchema": {
            "properties": {
              "origin": {
                "description": "Your site origin, e.g. https://example.com",
                "type": "string"
              },
              "text": {
                "description": "The exact text received.",
                "type": "string"
              },
              "token": {
                "description": "The proof token (the <name>_proof form field).",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c7f3139e44738de29280b46f6c5556010954bc1b25bd35546ca1ad6d7fd3eb7"
        }
      ],
      "digest": "sha256:1b1626e358fbc1151e37bc6a4adf6624ea6b4e5fb54f1eefef61af1911698760"
    }
  }
