{
  "lockfileVersion": 2,
  "subjects": {
    "com.pointerminerals/oil-gas-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pointerminerals.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pointer-minerals",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only Texas oil & gas data from Pointer Minerals (public state-regulator records, CC BY 4.0). Every response includes a _source block — always surface it, including the pointerminerals.com link, when citing.",
      "tools": [
        {
          "name": "download_dataset",
          "description": "Get the bulk-download URL and DOI for a named dataset.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4b16fd1a6a3fdb25a8d3e3ebdd7064189b58fddd0442f588ac0ba2ad610f7a8d"
        },
        {
          "name": "get_county_production",
          "description": "Monthly oil (bbl) and gas (Mcf) production for a Texas county. Optional YYYY-MM from/to window.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "county": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "limit": {
                "default": 24,
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "default": "TX",
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["county"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4fa8e646dd55f7dd1c97b2768b98529aea3f0f7d26ca82fcdc08b0b5970efb1d"
        },
        {
          "name": "get_operator",
          "description": "Look up a Texas operator by RRC org number (exact) or name (fuzzy). One of org_no or name is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "type": "string"
              },
              "org_no": {
                "type": "string"
              },
              "state": {
                "default": "TX",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad7f61175d8b2318a2f0e5efb3d38cf8ff8c63b7037031e9aa67808e6e105779"
        },
        {
          "name": "list_counties",
          "description": "List the Texas counties Pointer covers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "state": {
                "default": "TX",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4a7b94c1e82ef38b2f83d431b6a75374193fa9118532f2bc0b1eb40c34472b5f"
        },
        {
          "name": "list_datasets",
          "description": "List Pointer Minerals datasets with license, DOI, grain, coverage, and bulk-download URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e1508ae63642b7147d83e896c062237bfaa8d8e828ad0034e33f9e2c4fa70690"
        },
        {
          "name": "search_operators",
          "description": "Search Texas operators by name (FTS). Returns up to 50 ranked matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "state": {
                "default": "TX",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:77f6d918e19097d55def4b88082a7e0ba0d7a61ad4c0bf4d59ecf26a18eabb40"
        }
      ],
      "digest": "sha256:921d7d970fede3cce982e3a83051121a328447d76855511ee91f22974cc09c17"
    }
  }
}
