{
  "lockfileVersion": 2,
  "subjects": {
    "com.pointerminerals/oil-gas-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.pointerminerals.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pointer-minerals",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only Texas oil & gas data from Pointer Minerals (public state-regulator records, CC BY 4.0). Every response includes a _source block — always surface it, including the pointerminerals.com link, when citing.",
      "tools": [
        {
          "name": "download_dataset",
          "description": "Get the bulk-download URL and DOI for a named dataset.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:206259296a4323dd70612a89e7899ee0c6bdd3693fd59d05cbfac6fc413d68e2"
        },
        {
          "name": "get_county_production",
          "description": "Monthly oil (bbl) and gas (Mcf) production for a Texas county. Optional YYYY-MM from/to window.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "county": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "limit": {
                "default": 24,
                "maximum": 600,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "default": "TX",
                "type": "string"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["county"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d81299241761291d2e7a700fa88d545379a8e51057d7d408c64c7aee3f3dcd9e"
        },
        {
          "name": "get_operator",
          "description": "Look up a Texas operator by RRC org number (exact) or name (fuzzy). One of org_no or name is required.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "name": {
                "type": "string"
              },
              "org_no": {
                "type": "string"
              },
              "state": {
                "default": "TX",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:134a0a2abee0df63fa4b34e917271f6d7867b4aa356c0ff9e7268a81c8ee928a"
        },
        {
          "name": "list_counties",
          "description": "List the Texas counties Pointer covers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "state": {
                "default": "TX",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a5b0beb40b88dfce66505bb2b53074f4ce269faa64465aa1ad9b1ca3c1f938e"
        },
        {
          "name": "list_datasets",
          "description": "List Pointer Minerals datasets with license, DOI, grain, coverage, and bulk-download URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9753705f1f7d944414a393e1255684283dc44819337f83187cc506a621ee6253"
        },
        {
          "name": "search_operators",
          "description": "Search Texas operators by name (FTS). Returns up to 50 ranked matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "state": {
                "default": "TX",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:602da1dc40156a5bc2910b16ebf631ff29a1534512e196955194596e6a13a8d8"
        }
      ],
      "digest": "sha256:01477c32f1748bbfcaf225600e1021902ea92031dc913abe54efdecf859c9a68"
    }
  }
}
