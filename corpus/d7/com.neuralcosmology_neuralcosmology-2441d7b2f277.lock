      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Neural Cosmology by Mikhail Savchenko: answers, essays, experiments and books on consciousness, cosmology and computation, in English, Russian, Portuguese and Spanish. Use search, then read. Paid book chapters show an open opening; create_checkout opens a payment link for a reader. To act as a signed-in reader, connect to /mcp/account instead.",
      "tools": [
        {
          "name": "create_checkout",
          "title": "Open a checkout",
          "description": "Open a checkout for online access to a book (or the whole library) for a reader, tied to their email. Returns a payment link to give to the reader; nothing is charged until they pay. After paying, the reader signs in on the site with that email and the book is theirs.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "USD, RUB or BRL. Default: by language.",
                "type": "string"
              },
              "email": {
                "description": "The reader's email.",
                "type": "string"
              },
              "item": {
                "description": "A book slug from list_books, or \"library\".",
                "type": "string"
              },
              "locale": {
                "description": "Language: en, ru, pt or es.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              }
            },
            "required": ["email", "item"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Open a checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://neuralcosmology/order-v1.html",
            "openai/toolInvocation/invoked": "Order",
            "openai/toolInvocation/invoking": "Opening the order…",
            "ui": {
              "resourceUri": "ui://neuralcosmology/order-v1.html"
            }
          },
          "digest": "sha256:91b70e81d38902c3259cd65ea4dad69fca68743089117611179adac3e79b5f24"
        },
