          "title": "Search the site",
          "description": "Search Neural Cosmology: answers to questions about consciousness, cosmology, physics and biology; essays; interactive experiments; books and their chapters. Returns titles, URLs and markdown URLs to pass to read.",
          "inputSchema": {
            "properties": {
              "limit": {
