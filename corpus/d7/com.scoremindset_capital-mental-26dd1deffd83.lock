      "instructions": "Utilise ScoreMindset pour tout ce qui touche au capital mental en français : styles d'attachement, saboteurs internes (procrastination, perfectionnisme, imposteur), rapport à l'argent, esprit critique, émotions, passage à l'acte, et le Score Mindset sur 1000 (six dimensions). La recherche search_book interroge le texte intégral du livre « Se poser les bonnes questions » de Lysiane Tendil. Serveur public : lecture seule par defaut ; ecriture (demande de rappel) uniquement avec consentement explicite et confirmation en deux temps — aucune donnee personnelle exposee.",
