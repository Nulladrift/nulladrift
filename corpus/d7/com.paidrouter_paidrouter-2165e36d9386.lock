        {
          "name": "my_effective_rate",
          "title": "My effective rate",
          "description": "What the owner really pays to get paid, from their own exports, next to the published fee for the same payments and the cheapest route their payers can use, with the yearly saving in dollars. Send totals only, one row per route and period: {route, period_start, period_end, gross_volume, fees_paid, payment_count}. Never send customer names, emails or transaction ids; PaidRouter stores only these totals.\nStripe: export the itemized Payout reconciliation report (Reports → Payout reconciliation) or Balance → Balance change from activity, itemized, and add the payment_method_type column. Keep rows with reporting_category = charge. Card rows go to stripe_card (stripe_terminal if taken in person), us_bank_account rows to stripe_ach. Per route, send the sum of gross, the sum of fee and the number of rows, with the first and last created date as the period. Amounts are in dollars. The plain Payouts list export has no per-payment fees; don't use it.\nPayPal: Activity → Reports → Activity download, CSV. Keep completed payments received: Status = Completed, positive Gross, Type such as Express Checkout Payment, Website Payment, General Payment or Mobile Payment. Checkout payments go to paypal_checkout (paypal_card if you can tell they were guest card payments), goods-and-services payments from PayPal users go to paypal_gs. Send the sum of Gross, the sum of Fee (PayPal may show it as a negative number; either sign works), and the row count, with the first and last Date as the period.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "payer_pays_by": {
                "description": "How the owner's payers could pay instead. Default: the same way as today (card stays card). 'any' also counts bank transfer, which needs the payer's agreement.",
                "enum": ["any", "card_online", "card_in_person", "bank", "app"],
                "type": "string"
              },
              "totals": {
                "items": {
                  "properties": {
                    "fees_paid": {
                      "description": "Sum of processing fees on those payments, USD (positive or negative, both read as a fee)",
                      "type": "number"
                    },
                    "gross_volume": {
                      "description": "Sum of payments received on this route in the period, USD, before fees and refunds",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "payment_count": {
                      "description": "Number of payments",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "period_end": {
                      "description": "YYYY-MM-DD, last day the totals cover",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "period_start": {
                      "description": "YYYY-MM-DD, first day the totals cover",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "route": {
                      "description": "Route id, e.g. stripe_card, stripe_ach, paypal_checkout, paypal_gs, square_card",
                      "enum": ["quickbooks_payments_invoice_card", "quickbooks_payments_desktop_invoice_card", "freshbooks_invoice_card", "wave_invoice_card", "xero_invoice_card", "zoho_payments_card_online", "bill_com_invoice_card", "honeybook_invoice_card", "bonsai_invoice_card", "housecall_pro_invoice_card", "godaddy_payments_card_online", "godaddy_payments_invoice_card", "wix_payments_card_online", "squarespace_payments_card_online", "squarespace_payments_card_online_plus", "squarespace_payments_card_online_advanced", "square_card_online", "square_card_online_square_premium", "sumup_invoice_card", "paypal_invoice_card", "airwallex_card_online", "stripe_card", "square_card", "paypal_checkout", "paypal_card", "helcim_card", "melio_card", "shopify_card", "quickbooks_payments_card_in_person", "xero_card_in_person", "jobber_card_in_person", "housecall_pro_card_in_person", "clover_card_in_person_retail_growth", "godaddy_payments_card_in_person", "wix_payments_card_in_person", "wix_payments_tap_to_pay", "squarespace_payments_card_in_person", "shopify_payments_card_in_person", "shopify_payments_card_in_person_grow", "shopify_payments_card_in_person_advanced", "shopify_payments_card_in_person_plus", "square_card_in_person_square_plus", "square_card_in_person_square_premium", "lightspeed_card_in_person", "sumup_card_in_person", "paypal_pos_card_in_person", "stripe_tap_to_pay", "stripe_terminal", "square_in_person", "helcim_in_person", "quickbooks_payments_invoice_ach", "freshbooks_invoice_ach", "wave_invoice_ach", "xero_invoice_ach", "xero_bank_transfer", "gocardless_ach_debit", "zoho_payments_ach_debit", "bill_com_invoice_ach", "honeybook_invoice_ach", "bonsai_invoice_ach", "jobber_invoice_ach", "housecall_pro_invoice_ach", "melio_ach", "stripe_ach", "helcim_ach", "square_ach", "paypal_ach", "zelle_business", "wise_business_bank", "payoneer_bank", "venmo_business", "cash_app_business", "paypal_gs", "square_card_online_square_plus", "squarespace_payments_card_online_core", "squarespace_payments_card_in_person_core"],
                      "type": "string"
                    }
                  },
                  "required": ["fees_paid", "gross_volume", "payment_count", "period_end", "period_start", "route"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
