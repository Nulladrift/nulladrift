        {
          "name": "request_route",
          "title": "Request coverage",
          "description": "When the owner needs a provider, method, country or corridor PaidRouter doesn't cover yet (get_fees came back empty, or compare_send_money doesn't know the corridor), send what they need. PaidRouter records it, counts it on https://paidrouter.com/coverage, and adds the most-requested coverage every week with the date. Returns what is covered today that comes closest.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Country or currency involved, if any",
                "maxLength": 60,
                "type": "string"
              },
              "kind": {
                "description": "What the owner is trying to do",
                "enum": ["receive", "pay", "send", "withdraw", "marketplace", "other"],
                "type": "string"
              },
              "note": {
                "description": "Anything that helps, e.g. the amount or how often",
                "maxLength": 300,
                "type": "string"
              },
              "what": {
                "description": "Provider, method or corridor, e.g. 'QuickBooks Payments', 'Wise → Philippines', 'paying a supplier by ACH', 'GBP receiving'",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["what"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
