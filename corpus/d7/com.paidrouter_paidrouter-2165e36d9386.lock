      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PaidRouter answers one question: what is the cheapest way for a US business or freelancer to get paid, or to send money abroad. Every fee comes from the provider's own pricing page, with the source URL and the date it was verified, and is re-checked within 30 days. Routes are ranked by fee only; no provider pays for placement.\nUse cheapest_way_to_get_paid when the owner is about to invoice, accept a payment, or asks whether they are overpaying in fees. Use my_effective_rate when you can read the owner's own Stripe, PayPal or Square exports: it compares what they really paid with the published fee and the cheapest route. Use explain_fees when they ask why a provider took a given amount. Call watch_routes once with the routes the owner uses; later answers then start with what changed since your last call. Use compare_send_money for sending USD to Mexico or India. Use get_fees for the raw sourced entries. PaidRouter does not hold or move money; route_it_for_me records a request to have the switch set up.",
      "tools": [
        {
          "name": "cheapest_way_to_get_paid",
          "title": "Cheapest way to get paid",
          "description": "Ask this before the owner invoices or accepts a payment, or when they wonder if they overpay in fees. Give the amount and how the payer can pay (card online, card in person, bank transfer, payment app, or any). Returns every route ranked by fee, cheapest first: provider, method, fee in dollars, what the owner keeps, how to set it up, and whether the number is exact or an estimate. Pass current_route to get the saving per payment and per year. Example: a $1,000 invoice costs $35.39 on PayPal Checkout, $29.30 on Stripe card, $5.00 on Stripe ACH and $0 on a Melio bank-transfer request. Fees are from the providers' own pricing pages, dated, US only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Payment amount in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "current_route": {
                "description": "How the owner gets paid today (e.g. paypal_checkout, stripe_card), to compute savings",
                "enum": ["quickbooks_payments_invoice_card", "quickbooks_payments_desktop_invoice_card", "freshbooks_invoice_card", "wave_invoice_card", "xero_invoice_card", "zoho_payments_card_online", "bill_com_invoice_card", "honeybook_invoice_card", "bonsai_invoice_card", "housecall_pro_invoice_card", "godaddy_payments_card_online", "godaddy_payments_invoice_card", "wix_payments_card_online", "squarespace_payments_card_online", "squarespace_payments_card_online_plus", "squarespace_payments_card_online_advanced", "square_card_online", "square_card_online_square_premium", "sumup_invoice_card", "paypal_invoice_card", "airwallex_card_online", "stripe_card", "square_card", "paypal_checkout", "paypal_card", "helcim_card", "melio_card", "shopify_card", "quickbooks_payments_card_in_person", "xero_card_in_person", "jobber_card_in_person", "housecall_pro_card_in_person", "clover_card_in_person_retail_growth", "godaddy_payments_card_in_person", "wix_payments_card_in_person", "wix_payments_tap_to_pay", "squarespace_payments_card_in_person", "shopify_payments_card_in_person", "shopify_payments_card_in_person_grow", "shopify_payments_card_in_person_advanced", "shopify_payments_card_in_person_plus", "square_card_in_person_square_plus", "square_card_in_person_square_premium", "lightspeed_card_in_person", "sumup_card_in_person", "paypal_pos_card_in_person", "stripe_tap_to_pay", "stripe_terminal", "square_in_person", "helcim_in_person", "quickbooks_payments_invoice_ach", "freshbooks_invoice_ach", "wave_invoice_ach", "xero_invoice_ach", "xero_bank_transfer", "gocardless_ach_debit", "zoho_payments_ach_debit", "bill_com_invoice_ach", "honeybook_invoice_ach", "bonsai_invoice_ach", "jobber_invoice_ach", "housecall_pro_invoice_ach", "melio_ach", "stripe_ach", "helcim_ach", "square_ach", "paypal_ach", "zelle_business", "wise_business_bank", "payoneer_bank", "venmo_business", "cash_app_business", "paypal_gs", "square_card_online_square_plus", "squarespace_payments_card_online_core", "squarespace_payments_card_in_person_core"],
                "type": "string"
              },
              "fresh": {
                "default": false,
                "description": "Re-read the provider's pricing page (or the live FX quote) now instead of using the last check. Slower. Up to 20 page reads per key per day. Use when the owner is about to act on the number.",
                "type": "boolean"
              },
