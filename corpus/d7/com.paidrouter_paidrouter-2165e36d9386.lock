        {
          "name": "report_observed_fee",
          "title": "Report an observed fee",
          "description": "When the owner was charged a fee and you can see it (a Stripe, PayPal or Square payment detail, a statement line), send the route, the payment amount, the fee charged and the date. Returns the published fee for that payment, the difference, and a one-line reading: matches, promo (fee waived or reduced for a while), likely_negotiated (lower than published), or possible_hidden_extra (higher; names the published extra that explains it, such as an international card, when one does). Use it to answer 'was I overcharged?'. Each report also tells PaidRouter how real fees compare to published ones. Send only these numbers; nothing about the payer. Up to 100 reports per key per day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Payment amount in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "charged_on": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "extras": {
                "description": "Anything the statement says about the fee, e.g. 'international card', 'promo rate'. Not stored.",
                "maxLength": 200,
                "type": "string"
              },
              "fee_charged": {
                "description": "Fee the provider took on that payment, USD",
                "type": "number"
              },
              "route": {
                "description": "Route id, e.g. stripe_card, paypal_checkout, venmo_business",
                "enum": ["quickbooks_payments_invoice_card", "quickbooks_payments_desktop_invoice_card", "freshbooks_invoice_card", "wave_invoice_card", "xero_invoice_card", "zoho_payments_card_online", "bill_com_invoice_card", "honeybook_invoice_card", "bonsai_invoice_card", "housecall_pro_invoice_card", "godaddy_payments_card_online", "godaddy_payments_invoice_card", "wix_payments_card_online", "squarespace_payments_card_online", "squarespace_payments_card_online_plus", "squarespace_payments_card_online_advanced", "square_card_online", "square_card_online_square_premium", "sumup_invoice_card", "paypal_invoice_card", "airwallex_card_online", "stripe_card", "square_card", "paypal_checkout", "paypal_card", "helcim_card", "melio_card", "shopify_card", "quickbooks_payments_card_in_person", "xero_card_in_person", "jobber_card_in_person", "housecall_pro_card_in_person", "clover_card_in_person_retail_growth", "godaddy_payments_card_in_person", "wix_payments_card_in_person", "wix_payments_tap_to_pay", "squarespace_payments_card_in_person", "shopify_payments_card_in_person", "shopify_payments_card_in_person_grow", "shopify_payments_card_in_person_advanced", "shopify_payments_card_in_person_plus", "square_card_in_person_square_plus", "square_card_in_person_square_premium", "lightspeed_card_in_person", "sumup_card_in_person", "paypal_pos_card_in_person", "stripe_tap_to_pay", "stripe_terminal", "square_in_person", "helcim_in_person", "quickbooks_payments_invoice_ach", "freshbooks_invoice_ach", "wave_invoice_ach", "xero_invoice_ach", "xero_bank_transfer", "gocardless_ach_debit", "zoho_payments_ach_debit", "bill_com_invoice_ach", "honeybook_invoice_ach", "bonsai_invoice_ach", "jobber_invoice_ach", "housecall_pro_invoice_ach", "melio_ach", "stripe_ach", "helcim_ach", "square_ach", "paypal_ach", "zelle_business", "wise_business_bank", "payoneer_bank", "venmo_business", "cash_app_business", "paypal_gs", "square_card_online_square_plus", "squarespace_payments_card_online_core", "squ