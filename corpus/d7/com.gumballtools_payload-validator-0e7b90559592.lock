            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fcfcdbf6ca3e9e552ec3053b34166f9292da6e7adf7bfedc7709e98eaa5e8609"
        },
        {
          "name": "validate_csv",
          "title": "Validate CSV",
          "description": "Validates CSV text against RFC 4180 and reports ragged rows individually, with both field counts.\n\nUse this before loading a CSV, and whenever a CSV-derived number looks wrong.\n\nDo not attempt this by reading the file, and be aware that loading it successfully proves nothing. The failure that matters is the ragged row: a file where one row has six fields and the header has five loads without complaint almost everywhere — pandas pads or throws depending on the engine, Excel shifts the columns, and `split(\",\")` silently mis-assigns every field after the extra one. Nobody notices until a figure is wrong in a report. This reports it as \"row 4813 has 6 fields; the header has 5\", per row.\n\nThe other half is the delimiter. A European CSV is semicolon-separated because the comma is the decimal separator; reading it as comma-separated yields one column of nonsense and no error. The delimiter is sniffed from the header — ignoring quoted regions so their contents cannot vote — and always reported, with a warning when the guess was a close call. Pass `delimiter` to remove the guess entirely.\n\nAlso reports: unterminated quotes (which swallow the rest of the file into one field, which is why one typo can make thousands of rows look ragged), text after a closing quote, stray quotes in unquoted fields, duplicate column names, unnamed columns, column names with invisible leading or trailing whitespace, mixed CRLF/LF line endings, CR-only endings, and a byte order mark — which becomes part of the first column's name, so a lookup for \"id\" fails against a column that prints identically.\n\nInput: `input`, the raw CSV text. Optional `delimiter` (a single character) and `hasHeader` (default true; pass false and rows are compared against the first row instead, and header checks are skipped). Up to 1,000,000 bytes.\n\nReturns: `valid` (no errors), `parseable` (whether a conforming parser would accept it — deliberately separate, because a duplicate key parses fine and still means two different things), a `diagnostics` array where each entry has a 1-based `line` and `column`, a stable `rule` code, a `message`, an `excerpt` showing the offending line with a caret under the column, a `fixHint`, and `blocksParse`; plus `counts` and format-specific `stats`. Rule codes are stable and safe to branch on; messages are not.\n\nSafety: nothing is resolved, fetched or expanded. External XML entities are reported, never retrieved; alias bombs are detected without being expanded; no schema or DTD is fetched over the network. Payloads are validated in memory and never stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "delimiter": {
                "description": "Field delimiter, as a single character. Omit to sniff it from the header. Pass it when you know it — a semicolon-separated European export read as comma-separated produces one column and no error.",
                "maxLength": 1,
                "minLength": 1,
                "type": "string"
              },
              "hasHeader": {
                "description": "Whether the first row names the columns. Default true. Pass false and rows are compared against the first row instead, and header checks are skipped.",
                "type": "boolean"
              },
              "input": {
                "description": "The raw document text, not a parsed object — the findings are properties of the text. Up to 1,000,000 bytes.",
                "type": "string"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1125aebaa929ac778d62018e2c0fbe5fed1671775c2054dbde88dd31f4c3081e"
        },
        {
          "name": "validate_json",
          "title": "Validate JSON",
          "description": "Validates a JSON document and reports every problem with an exact line and column.\n\nUse this whenever you need to know why a JSON payload is failing, or to check a JSON document you or a user produced before sending it somewhere that will reject it.\n\nDo not do this by reading the JSON yourself. Three of the findings are invisible to inspection and to JSON.parse alike:\n(1) Duplicate keys. `{\"port\":8080,\"port\":9090}` is accepted by every mainstream parser, which keeps the last value and discards the first without a word. Reading it, you cannot see which one the consumer will use, because the answer differs by language.\n(2) Integer precision loss. `9007199254740993` parses as `9007199254740992` — quietly, because JSON numbers are IEEE-754 doubles in nearly every parser, exact only to 2^53-1. Any 64-bit ID (Twitter, Discord, most database bigints) is in the lossy range. This tool proves the loss with exact BigInt arithmetic rather than estimating it.\n(3) Lone surrogates. `\"\\ud83d\"` alone is syntactically legal and cannot be encoded as UTF-8, so the document parses here and fails somewhere else entirely.\n\nIt also reports, with positions: trailing commas, comments, single-quoted strings, unquoted keys, Python literals (True/None/NaN/Infinity), leading zeros, hex numbers, unescaped control characters, raw line breaks inside strings, byte order marks, and trailing content — including recognising when the input is actually NDJSON being read as one document.\n\nInput: `input`, the raw JSON text as a string. Not a parsed object — the text, because the findings are properties of the text. Up to 1,000,000 bytes.\n\nReturns: `valid` (no errors), `parseable` (whether a conforming parser would accept it — deliberately separate, because a duplicate key parses fine and still means two different things), a `diagnostics` array where each entry has a 1-based `line` and `column`, a stable `rule` code, a `message`, an `excerpt` showing the offending line with a caret under the column, a `fixHint`, and `blocksParse`; plus `counts` and format-specific `stats`. Rule codes are stable and safe to branch on; messages are not.\n\nSafety: nothing is resolved, fetched or expanded. External XML entities are reported, never retrieved; alias bombs are detected without being expanded; no schema or DTD is fetched over the network. Payloads are validated in memory and never stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
