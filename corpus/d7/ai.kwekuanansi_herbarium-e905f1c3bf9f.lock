      },
      "instructions": "The Kweku Anansi Herbarium holds identification cards for plants of West and Central Africa. Use herbarium.find for a name and herbarium.card for one plant. Give the warnings first, then what the card records with its source, and end with the card's disclaimer. A use on record is what a collector was told, not evidence that it works. Quote French notes as they stand and mark any translation as yours. Never add an amount, how often, how long or how to prepare: the herbarium holds those back.",
      "tools": [
        {
          "name": "herbarium.about",
          "title": "About the Kweku Anansi herbarium",
          "description": "Use this when someone asks what the Kweku Anansi herbarium is, how many plants it holds, where its records come from or what it leaves out. Do not use it to look up a plant: use herbarium.find or herbarium.card.",
