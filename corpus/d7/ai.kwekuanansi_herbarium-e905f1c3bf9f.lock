        {
          "name": "herbarium.find",
          "title": "Find a plant in the Kweku Anansi herbarium",
          "description": "Use this when someone names a plant of West or Central Africa by its scientific name or a common name (for example \"Azadirachta indica\", \"sobolo\" or \"prekese\") and you need to know whether the Kweku Anansi herbarium has a card for it. It returns the matching cards with family and rank, and says plainly when a plant is not in the herbarium yet. Do not use it to identify a plant from a description or a photograph, or for a plant from outside Africa: it matches names as written, and a plant that is not found may be there under another name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The plant's scientific name (\"Vernonia amygdalina\") or a common name (\"bitter leaf\").",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
