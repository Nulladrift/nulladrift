        {
          "name": "herbarium.card",
          "title": "What the herbarium records about one plant",
          "description": "Use this when someone asks what is recorded about one named plant of West or Central Africa: its names, family, warnings, the uses a collector or a desk note recorded, and how many notes are held back. Give the warnings first and say where each row comes from. Do not use it to recommend a remedy, and do not add an amount, how often, how long or a way to prepare one: the herbarium holds such notes back, and a use on record is not evidence that it works or that it is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
