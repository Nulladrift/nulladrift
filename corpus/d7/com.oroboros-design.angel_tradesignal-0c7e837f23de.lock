        },
        {
          "name": "buy_signal_pack",
          "title": "Angel: prepaid pack",
          "description": "Prepaid calls for every Angel tool: 50000 calls 299.00 · 5000 calls 39.00 · 500 calls 5.00 USDC (default 50,000); returns a bundle_token. Paid via x402 (params._meta[\"x402/payment\"]) or payment_tx.\nAfter: get_signals with bundle_token — no per-call signing.",
