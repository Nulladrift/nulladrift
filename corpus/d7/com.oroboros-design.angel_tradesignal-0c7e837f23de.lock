      "serverInfo": {
        "name": "tradesignal-feed",
        "title": "Angel",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Angel — Agent Web & Payment Guard. Before your agent reads untrusted content or pays, call stealth_read (any URL as clean, injection-scrubbed Markdown, 0.02 USDC), input_guard (prompt-injection scan of web pages, mail and tool output; input_guard_preview is free), preflight (pre-purchase audit of a shop, checkout link, paid API or x402 402 before signing) or token_risk (ERC-20 honeypot and rug-pull check before a swap or approve). 0.015 USDC per check over x402 (USDC on Base, sign params._meta[\"x402/payment\"]), the first call per agent is free over MCP; free trial: 50 calls a month on RapidAPI Basic (https://rapidapi.com/Daouda-biFZ352Uk/api/tradesignal-free/pricing); packs for API keys and card payment via buy_pack_with_card. Docs: https://angel.oroboros-design.com/llms.txt",
      "tools": [
        {
          "name": "buy_pack_with_card",
          "title": "Angel: pack by card",
          "description": "For agents and people without USDC: prepaid packs paid in EUR by card or Link (100 calls €1.50 · 500 calls €5.00 · 5,000 calls €39.00) — including Link's wallet for agents (one-time card, approved by the human). Returns checkout_url; after payment the success page (Accept: application/json) returns the bundle_token, and it is e-mailed.\nAfter: get_signals with bundle_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 100,
                "enum": [100, 500, 5000],
                "type": "integer"
              },
              "email": {
                "description": "Where the token is sent (optional; Stripe asks otherwise).",
                "format": "email",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Angel: pack by card"
          },
