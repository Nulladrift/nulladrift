{
  "lockfileVersion": 2,
  "subjects": {
    "com.oroboros-design.angel/tradesignal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://angel.oroboros-design.com/agenten/signal/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tradesignal-feed",
        "title": "Angel",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Angel — clean web reading for agents. stealth_read returns any public page as clean Markdown, strips what people cannot see and flags text aimed at the model; input_guard removes hidden content from text you already have and flags text aimed at the model; preflight looks at a shop, checkout link, paid API or x402 endpoint before a payment; token_risk reads an ERC-20 contract before a swap or approve; shield_check applies your spend rules before a payment; input_guard_preview is a free short version. Free: 500 calls with a free key, no account, no card (https://angel.oroboros-design.com/key); without a key 5 calls a day over MCP and A2A. More: €9 one-time by card for 5,000 calls, 90 days, businesses only (https://angel.oroboros-design.com/buy), or 0.02 USDC per call via x402 (USDC on Base). Price sheet: https://angel.oroboros-design.com/pricing. A key goes in the connection header X-Bundle-Token or in the tool argument bundle_token; x402 payments go in params._meta[\"x402/payment\"]. Docs: https://angel.oroboros-design.com/llms.txt",
      "tools": [
        {
          "name": "buy_pack_with_card",
          "title": "Angel: 5,000 calls by card",
          "description": "For businesses without USDC: 5,000 calls €9.00, one-time, 90 days, businesses only, paid in EUR by card or Link. Returns checkout_url for a person to open; the checkout asks for the company or freelance name. After payment the success page (Accept: application/json) returns the key, and it is e-mailed.\nAfter: any tool with bundle_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 5000,
                "enum": [5000],
                "type": "integer"
              },
              "email": {
                "description": "Where the key is sent (optional; Stripe asks otherwise).",
                "format": "email",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Angel: 5,000 calls by card"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c80d249dcf3d302254c8cdbc4203d557c5fade670f9d1d61cf10a831921ddb0"
        },
        {
          "name": "input_guard",
          "title": "Remove hidden content from untrusted text and flag text aimed at the model",
          "description": "Removes hidden content and flags text aimed at the model, for untrusted input before an agent acts on it: web pages, emails, RAG chunks, tool and MCP responses. Strips invisible Unicode (tag smuggling decoded, zero-width, bidi) and HTML hidden from people; flags role takeover, forged system or tool turns, requests for keys, the prompt or payments, exfiltration links, homoglyphs and base64 payloads, in 17 languages. Rule-based. Verdict clean, caution or hostile, score, findings, cleaned text. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: preflight before your agent pays anything the content pointed to (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "text": {
                "description": "the content to check (send text or url)",
                "maxLength": 100000,
                "type": "string"
              },
              "url": {
                "description": "a public https page to fetch once and check (256 KB)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Remove hidden content from untrusted text and flag text aimed at the model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e3573730f06d39dca14c200f5111da8c9dada9106195b997fd56020212c5043c"
        },
        {
          "name": "input_guard_preview",
          "title": "Prompt-injection quick scan (free)",
          "description": "Free prompt-injection quick scan for untrusted input: up to 4,000 characters of text, or one https page, checked for hidden instructions aimed at agents (role override, invisible Unicode, hidden HTML) in 17 languages incl. Chinese, Japanese, Korean, Hindi, Arabic. Returns verdict, score and the top 3 findings.\nAfter: input_guard for every finding and the cleaned text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "maxLength": 4000,
                "type": "string"
              },
              "url": {
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Prompt-injection quick scan (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:953dc464c99fd1d00463e5e75102ac25d09ed31f9f72b2c8f85f641406e76e1a"
        },
        {
          "name": "preflight",
          "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint — or for a need: find the offer and check it",
          "description": "Before an agent buys, pays or hires: send url (shop, checkout, payment link, API or x402 endpoint), need (what to buy in plain words; Angel takes the pick from the open sea at mareliberum.dev and checks it) or agent (mare:… resident: its trust score). One unpaid request each: TLS, domain age, look-alikes, redirects, payment provider, card fields, text aimed at agents and, for x402, USDC contract, payTo and price traps. Verdict pay, caution or do_not_pay, risk_score, reasons. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: input-guard on the page text you will act on (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "instead of a url: a resident of the open sea (mareliberum.dev) you want to pay or hire; Angel returns its trust score 0-100 from its work, notes, seals and own endpoint",
                "pattern": "^mare:[a-z2-9]{12}$",
                "type": "string"
              },
              "budget": {
                "description": "with need: highest price",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "currency": {
                "description": "with need: currency of the budget",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "max_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "method": {
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "need": {
                "description": "instead of a url: what your user wants to buy, in plain words (sizes, budget, place included), e.g. \"trail running shoes size 44 under 150 EUR, ships to Germany\". Angel takes the pick from the open sea (mareliberum.dev/decide) and checks it before you pay.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "partner_link": {
                "description": "default true: on verdict pay for a shop with an affiliate program, the answer adds partner_link (same merchant, disclosed: Angel may earn a commission, merchant sets the price); false omits it",
                "type": "boolean"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "region": {
                "description": "with need: country code or name",
                "type": "string"
              },
              "url": {
                "description": "the shop, checkout or payment link, API or x402 endpoint to check (public https domain, port 443). Send url or need.",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint — or for a need: find the offer and check it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aef32aa108c28bf37ae33996c46c24be6b9d8ab880d1180d863b3439063b7ac0"
        },
        {
          "name": "shield_check",
          "title": "Spend firewall: allow, hold or block an agent payment before it happens",
          "description": "Spend firewall for AI agents with a wallet or card, called before every payment: checks your rules (per-payment cap, daily budget reserved atomically, allow/block lists, chains, tokens, approval threshold, new merchants, kill switch), the merchant or checkout URL (preflight), the text that triggered the payment (input-guard: hidden instructions) and non-USDC tokens (token-risk). Returns allow, hold or block with reasons; with a stored policy the amount is reserved until confirm or release. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: pay, then POST /shield/confirm with the reservation_id (or /shield/release if you did not pay) (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "hold_seconds": {
                "description": "how long an allowed amount stays reserved (default 900)",
                "maximum": 3600,
                "minimum": 60,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "same key = same reservation, never reserved twice",
                "pattern": "^[A-Za-z0-9._:-]{8,120}$",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment": {
                "properties": {
                  "amount_usd": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "asset": {
                    "description": "USDC or a token address",
                    "type": "string"
                  },
                  "chain": {
                    "description": "base, ethereum or eip155:<id>",
                    "type": "string"
                  },
                  "merchant_url": {
                    "description": "shop, checkout or payment link, API or x402 endpoint the agent is about to pay",
                    "maxLength": 2048,
                    "pattern": "^https://",
                    "type": "string"
                  },
                  "method": {
                    "enum": ["GET", "POST"],
                    "type": "string"
                  },
                  "pay_to": {
                    "description": "recipient address, when there is no URL",
                    "pattern": "^0x[0-9a-fA-F]{40}$",
                    "type": "string"
                  }
                },
                "required": ["amount_usd"],
                "type": "object"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "policy": {
                "description": "inline rules (stateless); for a daily budget and remembered merchants store them with POST /shield/policy and send policy_id",
                "properties": {
                  "allow_merchants": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_assets": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_chains": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "block_merchants": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "hold_above_usd": {
                    "type": "number"
                  },
                  "kill": {
                    "type": "boolean"
                  },
                  "max_per_payment_usd": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "policy_id": {
                "description": "a stored policy (needs your key as X-Bundle-Token or bundle_token)",
                "pattern": "^pol_[A-Za-z0-9]{8,40}$",
                "type": "string"
              },
              "trigger": {
                "description": "the instruction, message or page that made the agent want to pay",
                "properties": {
                  "text": {
                    "maxLength": 100000,
                    "type": "string"
                  },
                  "url": {
                    "maxLength": 2048,
                    "pattern": "^https://",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["payment"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Spend firewall: allow, hold or block an agent payment before it happens"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:549b9673f0ba9825f876a15a574a8c96c68b00db3d426abdb198c71c00961fd9"
        },
        {
          "name": "stealth_read",
          "title": "Read any public page as clean Markdown, with hidden text removed",
          "description": "Returns a public https page as clean Markdown for an agent (headings, lists, tables kept; navigation, cookie banners, scripts and everything hidden from people removed), strips invisible Unicode and flags text aimed at the model — with verdict, score, findings, title and language. JSON and text pass through. One GET as a declared bot, no login or bot-protection bypass; a blocked page is never charged. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: preflight before your agent buys or pays anything the page offers (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "url": {
                "description": "the public https page to read (1 MB, 10 s)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read any public page as clean Markdown, with hidden text removed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5344b403bdce1fe78bfe48a24ec27efdcd09ee6040eee238174c32dea6b2b90f"
        },
        {
          "name": "token_risk",
          "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve",
          "description": "Honeypot and rug-pull check for an ERC-20 on Base or Ethereum before a swap, approval or signature, read straight from the contract: upgradeable proxy (EIP-1967, beacon, clone), owner powers in the bytecode (mint, pause, blacklist, fee or max-tx setters, trading switch, burn from any address), owner renounced or active and the owner's share of supply; known issuers labeled. Risk low, medium or high with reasons. Signals, not investment advice. Free with a key (500 calls) or 5 calls a day without one; then 0.02 USDC per call via x402, or 1 call from a key.\nAfter: preflight before your agent pays or signs on the site that offers this token (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Your key instead of paying per call: free (500 calls, POST /key) or bought by card. The connection header X-Bundle-Token works too.",
                "type": "string"
              },
              "chain": {
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from (optional; the x402 price is the same for every address).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a752c8c1c11ae8ce6e73d28253673b0bfb963aed713811120cb25e18d690c428"
        }
      ],
      "digest": "sha256:d7889a511fc92c488cbf7a3e94d8a26ad9d07f188be8a20e046ab26247e40345"
    }
  }
}
