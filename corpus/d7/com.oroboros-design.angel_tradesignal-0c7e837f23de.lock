          "name": "input_guard",
          "title": "Prompt-injection scan for untrusted web, email and tool content",
          "description": "Prompt-injection and hidden-instruction scan for untrusted input before an agent acts on it: web pages, emails, RAG chunks, tool and MCP responses. Flags text aimed at the model (role takeover, forged system or tool turns, requests for keys, the prompt, history or payments, exfiltration links), invisible Unicode (tag smuggling decoded, zero-width, bidi), homoglyphs, base64 payloads and HTML hidden from humans, in 17 languages. Verdict clean, caution or hostile, score, findings, cleaned text. 0.05 USDC base (new payers 0.05, >10 payments 0.035; 1 pack call).\nAfter: preflight before your agent pays anything the content pointed to (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
