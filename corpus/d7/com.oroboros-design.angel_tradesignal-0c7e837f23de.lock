      "instructions": "Angel — Agent Web & Payment Guard. Before your agent reads untrusted content or pays, call stealth_read (any URL as clean, injection-scrubbed Markdown, 0.02 USDC), input_guard (prompt-injection scan of web pages, mail and tool output; input_guard_preview is free), preflight (pre-purchase audit of a shop, checkout link, paid API or x402 402 before signing) or token_risk (ERC-20 honeypot and rug-pull check before a swap or approve). 0.015 USDC per check over x402 (USDC on Base, sign params._meta[\"x402/payment\"]), the first 3 calls per agent free; packs for API keys and card payment via buy_pack_with_card. The other tools on this server stay available. Docs: https://angel.oroboros-design.com/llms.txt",
