        },
        {
          "name": "exchange_route",
          "title": "Find the best verified paid API or agent for a task (x402 exchange)",
          "description": "Describe a task and get up to 5 paid endpoints that can do it, ranked on merit only (match, trust, latency, price): each listed seller was checked by preflight (real 402, price, payTo, domain, TLS) and the top picks are re-probed live. Every offer carries the exact call, the live price and a ready shield-check body for before you pay. You pay the seller directly; Angel never holds funds. 0.01 USDC base (new payers 0.01, >10 payments 0.007; 1 pack call).\nAfter: shield-check before paying the offer you pick, then call it (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack or buy_pack_with_card instead of paying per call.",
                "type": "string"
              },
              "limit": {
                "description": "how many offers (default 3)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "max_usd": {
                "description": "highest price per call you accept",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "method": {
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "need": {
                "description": "the task in plain words",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "tags": {
                "description": "optional keywords, e.g. [\"security\",\"token\"]",
                "items": {
                  "pattern": "^[a-z0-9-]{1,32}$",
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find the best verified paid API or agent for a task (x402 exchange)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1b3e48a2254cf6838d290a49be863212d5f3bc615fea70cb77a1424008f5fb63"
        },
        {
          "name": "input_guard",
          "title": "Prompt-injection scan for untrusted web, email and tool content",
          "description": "Prompt-injection and hidden-instruction scan for untrusted input before an agent acts on it: web pages, emails, RAG chunks, tool and MCP responses. Flags text aimed at the model (role takeover, forged system or tool turns, requests for keys, the prompt, history or payments, exfiltration links), invisible Unicode (tag smuggling decoded, zero-width, bidi), homoglyphs, base64 payloads and HTML hidden from humans, in 17 languages. Verdict clean, caution or hostile, score, findings, cleaned text. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: preflight before your agent pays anything the content pointed to (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack or buy_pack_with_card instead of paying per call.",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "text": {
                "description": "the content to check (send text or url)",
                "maxLength": 100000,
                "type": "string"
              },
              "url": {
                "description": "a public https page to fetch once and check (256 KB)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Prompt-injection scan for untrusted web, email and tool content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2ff5130e31bfecd06916191207ca816c8c8ace3504a783d09d448c5925c1bf63"
        },
        {
          "name": "input_guard_preview",
          "title": "Prompt-injection quick scan (free)",
          "description": "Free prompt-injection quick scan for untrusted input: up to 4,000 characters of text, or one https page, checked for hidden instructions aimed at agents (role override, invisible Unicode, hidden HTML) in 17 languages incl. Chinese, Japanese, Korean, Hindi, Arabic. Returns verdict, score and the top 3 findings.\nAfter: input_guard for every finding and the cleaned text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "maxLength": 4000,
                "type": "string"
              },
              "url": {
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Prompt-injection quick scan (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:953dc464c99fd1d00463e5e75102ac25d09ed31f9f72b2c8f85f641406e76e1a"
        },
        {
          "name": "preflight",
          "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint",
          "description": "Before an agent buys, pays or calls an unknown endpoint: one unpaid request to any https shop, checkout or payment link (Stripe, Shopify, PayPal and others), API or x402 endpoint. Checks TLS, domain age, look-alike domains, redirects to foreign gateways, the payment provider, card fields in the page, http forms, text aimed at agents in the page and, for x402, USDC contract, payTo, EIP-712 domain and price traps. Verdict pay, caution or do_not_pay, risk_score, merchant_signals. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: input-guard on the page text you will act on (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack or buy_pack_with_card instead of paying per call.",
                "type": "string"
              },
              "max_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "method": {
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "partner_link": {
                "description": "default true: on verdict pay for a shop with an affiliate program, the answer adds partner_link (same merchant, disclosed: Angel may earn a commission, merchant sets the price); false omits it",
                "type": "boolean"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "url": {
                "description": "the shop, checkout or payment link, API or x402 endpoint to check (public https domain, port 443)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a438594746839f6c1c57004cf31723405905ae25fa91545322713e0ce2cdde9b"
        },
        {
          "name": "recommend",
          "title": "Angel Picks: where to get it (free)",
          "description": "Free: describe what your agent needs outside paid APIs — hosting or a database, GPUs, a product to buy, a hotel or tour, a domain, website or online store, a human freelancer, a voice or AI tool, paying an invoice abroad, cheaper electricity — and get up to 5 providers ranked by match only, each with a link and a ready preflight check. Partner links are marked (tracked) and disclosed.\nAfter: preflight the link before paying; paid APIs and agents: exchange_route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["hosting", "gpu", "shopping", "travel", "website", "freelance", "ai_tools", "payments_abroad", "energy", "onramp"],
                "type": "string"
              },
              "limit": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Angel Picks: where to get it (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aaf7a6afdfca982126f5563836380e01ab9cd15f50e85b0c3ed1f0232f7abcb6"
        },
        {
          "name": "shield_check",
          "title": "Spend firewall: allow, hold or block an agent payment before it happens",
          "description": "Spend firewall for AI agents with a wallet or card, called before every payment: checks your rules (per-payment cap, daily budget reserved atomically, allow/block lists, chains, tokens, approval threshold, new merchants, kill switch), the merchant or checkout URL (preflight), the text that triggered the payment (input-guard: hidden instructions) and non-USDC tokens (token-risk). Returns allow, hold or block with reasons; with a stored policy the amount is reserved until confirm or release. 0.02 USDC base (new payers 0.02, >10 payments 0.014; 1 pack call).\nAfter: pay, then POST /shield/confirm with the reservation_id (or /shield/release if you did not pay) (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack or buy_pack_with_card instead of paying per call.",
                "type": "string"
              },
              "hold_seconds": {
                "description": "how long an allowed amount stays reserved (default 900)",
                "maximum": 3600,
                "minimum": 60,
                "type": "integer"
              },
              "idempotency_key": {
                "description": "same key = same reservation, never reserved twice",
                "pattern": "^[A-Za-z0-9._:-]{8,120}$",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment": {
                "properties": {
                  "amount_usd": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "asset": {
                    "description": "USDC or a token address",
                    "type": "string"
                  },
                  "chain": {
                    "description": "base, ethereum or eip155:<id>",
                    "type": "string"
                  },
                  "merchant_url": {
                    "description": "shop, checkout or payment link, API or x402 endpoint the agent is about to pay",
                    "maxLength": 2048,
                    "pattern": "^https://",
                    "type": "string"
                  },
                  "method": {
                    "enum": ["GET", "POST"],
                    "type": "string"
                  },
                  "pay_to": {
                    "description": "recipient address, when there is no URL",
                    "pattern": "^0x[0-9a-fA-F]{40}$",
                    "type": "string"
                  }
                },
                "required": ["amount_usd"],
                "type": "object"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "policy": {
                "description": "inline rules (stateless); for a daily budget and remembered merchants store them with POST /shield/policy and send policy_id",
                "properties": {
                  "allow_merchants": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_assets": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_chains": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "block_merchants": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "hold_above_usd": {
                    "type": "number"
                  },
                  "kill": {
                    "type": "boolean"
                  },
                  "max_per_payment_usd": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "policy_id": {
                "description": "a stored policy (needs your key as X-Bundle-Token or bundle_token)",
                "pattern": "^pol_[A-Za-z0-9]{8,40}$",
                "type": "string"
              },
              "trigger": {
                "description": "the instruction, message or page that made the agent want to pay",
                "properties": {
                  "text": {
                    "maxLength": 100000,
                    "type": "string"
                  },
                  "url": {
                    "maxLength": 2048,
                    "pattern": "^https://",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["payment"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Spend firewall: allow, hold or block an agent payment before it happens"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c4dd9767580c509ec8623ed44ff15b618d9adfd1514611cfc99be1138c50a86"
        },
        {
          "name": "stealth_read",
          "title": "Read any URL as clean, injection-scrubbed Markdown for an LLM",
          "description": "Read a public https page for an agent: the main content as clean Markdown (headings, lists, tables kept; navigation, cookie banners, scripts and everything hidden from humans removed), scrubbed by the input guard — instructions aimed at the model replaced, invisible Unicode stripped — with verdict, score, findings, title and language. JSON and text pass through. One GET as a declared bot, no login or bot-protection bypass; a blocked page is never charged. 0.02 USDC base (new payers 0.02, >10 payments 0.014; 1 pack call).\nAfter: preflight before your agent buys or pays anything the page offers (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack or buy_pack_with_card instead of paying per call.",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "url": {
                "description": "the public https page to read (1 MB, 10 s)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read any URL as clean, injection-scrubbed Markdown for an LLM"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:926981079184d5489607781cb635ad613a84f0ab1ddac7aff16dd687ac6aa1cb"
        },
        {
          "name": "token_risk",
          "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve",
          "description": "Honeypot and rug-pull check for an ERC-20 on Base or Ethereum before a swap, approval or signature, read straight from the contract: upgradeable proxy (EIP-1967, beacon, clone), owner powers in the bytecode (mint, pause, blacklist, fee or max-tx setters, trading switch, burn from any address), owner renounced or active and the owner's share of supply; known issuers labeled. Risk low, medium or high with reasons. Signals, not investment advice. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: preflight before your agent pays or signs on the site that offers this token (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack or buy_pack_with_card instead of paying per call.",
                "type": "string"
              },
              "chain": {
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2ca0bc415d4e9ef55c49e0b06b0863b8404328b01c6cf60c727875f7a7271c1e"
