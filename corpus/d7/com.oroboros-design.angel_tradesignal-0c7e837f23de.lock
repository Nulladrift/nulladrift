      },
      "instructions": "Safety and data checks for agents, paid per call over x402 (USDC on Base): input_guard (prompt-injection scan of untrusted web, mail or tool content), token_risk (honeypot/rug-pull check before a swap or approve), preflight (check a 402 before signing a payment), reconciliation (did a USDC payment arrive), gas_window, slippage, plus crypto setups and market data. Concrete entry, stop and target levels when a trading agent needs a crypto setup now: up to 10 long or short setups for Binance spot pairs with entry, stop-loss, two take-profit targets, reward-to-risk, confidence and expiry, filtered by EMA20/50 trend agreement on 1h and 4h, RSI14, volume and range expansion; an empty list when no setup qualifies. Docs: https://angel.oroboros-design.com/agenten/signal/agent.md",
      "tools": [
        {
          "name": "buy_enterprise",
          "title": "TradeSignal: enterprise",
          "description": "TradeSignal enterprise package bought in one x402 call: 499 USDC for 30 days and 20,000 calls, 2,500 for 90 days and 150,000 calls, or 9,900 for a year and 750,000 calls, all with a priority slot that is never rate limited and desk-level /watch included.\nAfter: use the bundle_token on every tool (priority slot, never 429) and poll /watch with the subscription token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
