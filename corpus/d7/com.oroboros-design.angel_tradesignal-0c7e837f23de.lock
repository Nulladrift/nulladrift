  "subjects": {
    "com.oroboros-design.angel/tradesignal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://angel.oroboros-design.com/agenten/signal/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tradesignal-feed",
        "title": "TradeSignal Feed",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Angel — Agent Web & Payment Guard. Before your agent reads untrusted content or pays, call stealth_read (any URL as clean, injection-scrubbed Markdown, 0.02 USDC), input_guard (prompt-injection scan of web pages, mail and tool output; input_guard_preview is free), preflight (pre-purchase audit of a shop, checkout link, paid API or x402 402 before signing) or token_risk (ERC-20 honeypot and rug-pull check before a swap or approve). 0.015 USDC per check over x402 (USDC on Base, sign params._meta[\"x402/payment\"]), the first call per agent is free over MCP; free trial: 50 calls a month on RapidAPI Basic (https://rapidapi.com/Daouda-biFZ352Uk/api/tradesignal-free/pricing); packs for API keys and card payment via buy_pack_with_card. Docs: https://angel.oroboros-design.com/llms.txt",
      "tools": [
        {
          "name": "buy_pack_with_card",
          "title": "TradeSignal: pack by card",
          "description": "For agents and people without USDC: prepaid packs paid in EUR by card or Link (100 calls €1.50 · 500 calls €5.00 · 5,000 calls €39.00) — including Link's wallet for agents (one-time card, approved by the human). Returns checkout_url; after payment the success page (Accept: application/json) returns the bundle_token, and it is e-mailed.\nAfter: get_signals with bundle_token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 100,
                "enum": [100, 500, 5000],
                "type": "integer"
              },
              "email": {
                "description": "Where the token is sent (optional; Stripe asks otherwise).",
                "format": "email",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de5c3d3a6f983d6d260b2211850cda478c073cf392aaf1329407c0b11c209329"
        },
        {
          "name": "buy_signal_pack",
          "title": "TradeSignal: prepaid pack",
          "description": "Prepaid calls for every TradeSignal tool: 50000 calls 299.00 · 5000 calls 39.00 · 500 calls 5.00 USDC (default 50,000); returns a bundle_token. Paid via x402 (params._meta[\"x402/payment\"]) or payment_tx.\nAfter: get_signals with bundle_token — no per-call signing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "default": 50000,
                "enum": [500, 5000, 50000],
                "type": "integer"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cad2476f6388eced785fba895e8706c7fd948dfa36a63bb102643b704a5bbb4a"
        },
        {
          "name": "input_guard",
          "title": "Prompt-injection scan for untrusted web, email and tool content",
          "description": "Prompt-injection and hidden-instruction scan for untrusted input before an agent acts on it: web pages, emails, RAG chunks, tool and MCP responses. Flags text aimed at the model (role takeover, forged system or tool turns, requests for keys, the prompt, history or payments, exfiltration links), invisible Unicode (tag smuggling decoded, zero-width, bidi), homoglyphs, base64 payloads and HTML hidden from humans, in 17 languages. Verdict clean, caution or hostile, score, findings, cleaned text. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: preflight before your agent pays anything the content pointed to (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack, buy_subscription (pro/desk) or buy_enterprise instead of paying per call.",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "text": {
                "description": "the content to check (send text or url)",
                "maxLength": 100000,
                "type": "string"
              },
              "url": {
                "description": "a public https page to fetch once and check (256 KB)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3bee045346d97bb573189c24213dadcd4374c5fbd81ddc636860556f32765c1"
        },
        {
          "name": "input_guard_preview",
          "title": "Prompt-injection quick scan (free)",
          "description": "Free prompt-injection quick scan for untrusted input: up to 4,000 characters of text, or one https page, checked for hidden instructions aimed at agents (role override, invisible Unicode, hidden HTML) in 17 languages incl. Chinese, Japanese, Korean, Hindi, Arabic. Returns verdict, score and the top 3 findings.\nAfter: input_guard for every finding and the cleaned text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "text": {
                "maxLength": 4000,
                "type": "string"
              },
              "url": {
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b73e38985f37cd47e765487e8f3286dc3d7e44618e23c9665d6e0eaba18fc5e4"
        },
        {
          "name": "preflight",
          "title": "Pre-purchase check for any shop, checkout link, payment page, API or x402 endpoint",
          "description": "Before an agent buys, pays or calls an unknown endpoint: one unpaid request to any https shop, checkout or payment link (Stripe, Shopify, PayPal and others), API or x402 endpoint. Checks TLS, domain age, look-alike domains, redirects to foreign gateways, the payment provider, card fields in the page, http forms, text aimed at agents in the page and, for x402, USDC contract, payTo, EIP-712 domain and price traps. Verdict pay, caution or do_not_pay, risk_score, merchant_signals. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: input-guard on the page text you will act on, gas-window before you settle on Base (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack, buy_subscription (pro/desk) or buy_enterprise instead of paying per call.",
                "type": "string"
              },
              "max_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "method": {
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "partner_link": {
                "description": "default true: on verdict pay for a shop with an affiliate program, the answer adds partner_link (same merchant, disclosed: Angel may earn a commission, merchant sets the price); false omits it",
                "type": "boolean"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "url": {
                "description": "the shop, checkout or payment link, API or x402 endpoint to check (public https domain, port 443)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:35c35f798e20a2ccff7003bd9d814f08da5334e96c8bad899397f9138fa9caf5"
        },
        {
          "name": "stealth_read",
          "title": "Read any URL as clean, injection-scrubbed Markdown for an LLM",
          "description": "Read a public https page for an agent: the main content as clean Markdown (headings, lists, tables kept; navigation, cookie banners, scripts and everything hidden from humans removed), scrubbed by the input guard — instructions aimed at the model replaced, invisible Unicode stripped — with verdict, score, findings, title and language. JSON and text pass through. One GET as a declared bot, no login or bot-protection bypass; a blocked page is never charged. 0.02 USDC base (new payers 0.02, >10 payments 0.014; 1 pack call).\nAfter: preflight before your agent buys or pays anything the page offers (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack, buy_subscription (pro/desk) or buy_enterprise instead of paying per call.",
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "url": {
                "description": "the public https page to read (1 MB, 10 s)",
                "maxLength": 2048,
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:416f82fa8058cfb0fdc678eda52913f8ade60b91aa962aa5a305cc00c3f3389f"
        },
        {
          "name": "token_risk",
          "title": "Honeypot and rug-pull check for an ERC-20 before swap or approve",
          "description": "Honeypot and rug-pull check for an ERC-20 on Base or Ethereum before a swap, approval or signature, read straight from the contract: upgradeable proxy (EIP-1967, beacon, clone), owner powers in the bytecode (mint, pause, blacklist, fee or max-tx setters, trading switch, burn from any address), owner renounced or active and the owner's share of supply; known issuers labeled. Risk low, medium or high with reasons. Signals, not investment advice. 0.015 USDC base (new payers 0.015, >10 payments 0.0105; 1 pack call).\nAfter: gas-window before you trade on that chain (the result's next field has the exact call).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle_token": {
                "description": "Token from buy_signal_pack, buy_subscription (pro/desk) or buy_enterprise instead of paying per call.",
                "type": "string"
              },
              "chain": {
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "payer_address": {
                "description": "Wallet you pay from: the payment-required error quotes your tier (0 payments base price (new-payer surcharge paused), 1-10 base, >10 -30 %) and, from the third payment, an upgrade with your own spend.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "payment_tx": {
                "description": "Hash of a USDC transfer on Base to payTo (≥ the price, ≤ 72 h old) instead of an x402 signature.",
                "type": "string"
              },
              "token": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:22b5cf1d1823f7139a7bf133474dbaa87a7d094d30ad0656d911e766a6033c37"
        }
      ],
      "digest": "sha256:f2bb83480825923c76c74d93e2c902ee564469e8aec0ea18637ad74d51520a51"
    }
