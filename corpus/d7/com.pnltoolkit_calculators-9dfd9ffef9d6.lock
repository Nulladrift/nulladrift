                          "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "through": {
                          "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                          "type": "string"
                        },
                        "url": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["asset", "from", "name", "through", "url"],
                      "type": "object"
