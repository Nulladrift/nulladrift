              },
              "results": {
                "additionalProperties": {
                  "type": ["number", "string", "boolean", "null"]
                },
                "type": "object"
              },
              "share_url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["assumptions", "calculator", "conditions", "data", "disclaimer", "edit_url", "image_url", "metrics", "results", "share_url"],
            "type": "object"
          },
