        {
          "name": "dca_backtest",
          "description": "Dollar-cost-averaging backtest using installed monthly closes, not live quotes. Asset ticker, start/end months YYYY-MM, initial deposit in USD, monthly in USD per purchase, frequency in months (1, 3 or 12), buying fee in percent, optional benchmark and total/price return basis. Initial deposit and first recurring purchase occur at the selected start month-end. Omitted dates use calculator defaults clamped to coverage. Returns data metadata and the free calc-dca PNG. Returns results, conditions, assumptions, an editable link, share page and PNG. No account access or order execution.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "default": "QQQ",
                "description": "Asset ticker. Available historical start dates vary by asset.",
                "enum": ["BTC", "ETH", "SOL", "SPY", "QQQ", "VTI", "VXUS", "GLD", "TLT", "AAPL", "MSFT", "NVDA", "TSLA"],
                "type": "string"
              },
              "benchmark": {
                "default": "none",
                "description": "Optional benchmark asset.",
                "enum": ["none", "SPY", "QQQ", "BTC"],
                "type": "string"
              },
              "buyFee": {
                "default": 0,
                "description": "Buying fee as a percentage, e.g. 0.1 means 0.1%.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "end": {
                "default": "2026-09",
                "description": "End month, YYYY-MM. Must be within the installed data snapshot.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "frequency": {
                "default": 1,
                "description": "Contribution interval in months: 1, 3 or 12.",
                "enum": [1, 3, 12],
                "type": "number"
              },
              "include_image": {
                "default": false,
                "description": "Also inline a PNG no wider than 1000 pixels. Image URL is always returned.",
                "type": "boolean"
              },
              "initial": {
                "default": 0,
                "description": "Initial deposit in dollars.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "monthly": {
                "default": 200,
                "description": "Contribution in dollars per chosen frequency (DCA), or per month (compound interest).",
                "maximum": 10000000,
                "minimum": 1,
                "type": "number"
              },
              "returnBasis": {
                "default": "total",
                "description": "total reinvests distributions; price excludes distributions.",
                "enum": ["total", "price"],
                "type": "string"
              },
              "start": {
                "default": "2016-10",
                "description": "Start month, YYYY-MM.",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "type": "object"
          },
