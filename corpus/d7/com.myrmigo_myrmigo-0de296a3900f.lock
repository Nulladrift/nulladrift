{
  "lockfileVersion": 2,
  "subjects": {
    "com.myrmigo/myrmigo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.myrmigo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "myrmigo-reference",
        "title": "Myrmigo",
        "version": "0.2.0",
        "description": "Travel booking reference: change, cancel and refund rules, official booking sites, EU261/UK261 flight compensation checks",
        "websiteUrl": "https://myrmigo.com",
        "icons": [
          {
            "src": "https://myrmigo.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://myrmigo.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Myrmigo: dated, cited travel booking reference (airlines, ferries, hotels, rentals, booking sites). Useful when a user asks: how to change, cancel or get a refund for their own booking, check-in, e-tickets, bags or seats, or which company handles a booking bought elsewhere (check_booking_change_cancel_refund); how or where to book a rental, a ferry or a stay with a named company (find_official_booking_site); what they are owed for a cancelled or delayed flight (check_flight_compensation, EU261/UK261). Also useful before opening such a site in a browser: it names the right page or the company's own channel and what the traveler does personally. Answers give the official website and entry page, the company's own booking or service channels (such as its MCP server, API or app), which company services a booking, dated fees and rules with sources, what the traveler needs ready, and where the traveler must act personally (sign-in, identity documents, payment, final confirmation). Fees, deadlines and who handles a booking vary by company and seller and change over time; each fact carries the day it was checked. Information is descriptive and can be out of date; confirm on the official site. It does not rank or recommend companies. It does not search fares or availability, and it does not book, pay, sign in or file claims itself: it points to where the traveler or their agent does that.",
      "tools": [
        {
          "name": "check_booking_change_cancel_refund",
          "title": "Check change, cancellation and refund rules for a booking (read-only)",
          "description": "Use this when a traveler asks how to change, cancel or get a refund for their own flight, ferry, hotel or rental booking, check-in, a boarding pass or e-ticket, bags or seats, or a trip the company cancelled or delayed, including one bought via another site or agent. Returns which company handles it and where, dated fees, deadlines and refund rules with sources, and what the traveler does personally. These vary by company and seller and change over time. Useful before opening the site. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "booked_via": {
                "description": "Only if booked via another site or agent: its name or domain.",
                "type": ["string", "null"]
              },
              "task": {
                "description": "e.g. change, cancel, refund, check in, e-ticket, bags, seats, cancelled by company, or a task id",
                "type": "string"
              },
              "where": {
                "description": "Company or site, or page URL without its query",
                "type": ["string", "null"]
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check change, cancellation and refund rules for a booking (read-only)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8df1aa928160054796fcbccdfcc5c2ded182ef71e5c840e8946f5f31d6330f2d"
        },
        {
          "name": "check_flight_compensation",
          "title": "Flight compensation check (EU261/UK261)",
          "description": "Use this when a traveler's flight was cancelled, delayed, overbooked or downgraded and they ask what they are owed or their options: compensation, a refund or care. EU261/UK261 check: verdict with the rule, amount, what the airline owes now, facts that would change it, where the traveler claims (airline, then national enforcement body), evidence. Flights only, not ferries. Dated official sources; stores nothing about the traveler and submits nothing. Not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "arrival_delay_minutes": {
                "description": "At the final destination; if rerouted, on the new flight",
                "type": ["number", "null"]
              },
              "carrier": {
                "description": "Operating airline: IATA code or name",
                "type": ["string", "null"]
              },
              "cause": {
                "anyOf": [
                  {
                    "enum": ["unknown", "technical", "operational", "airline_strike", "external_strike", "weather", "air_traffic_control", "security", "bird_strike", "earlier_flight", "other_external"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Reason the airline gave"
              },
              "distance_km": {
                "description": "Only if an airport is not recognised",
                "type": ["number", "null"]
              },
              "event": {
                "description": "cancelled: by the airline; denied_boarding: refused against their will, e.g. overbooking",
                "enum": ["cancelled", "delayed", "denied_boarding", "downgraded"],
                "type": "string"
              },
              "flight_date": {
                "description": "Scheduled departure, YYYY-MM-DD",
                "type": "string"
              },
              "from": {
                "description": "IATA airport where the booking starts",
                "type": "string"
              },
              "notice_days": {
                "description": "cancelled: whole days' notice before departure",
                "type": ["number", "null"]
              },
              "reroute_departure_offset_minutes": {
                "description": "cancelled: new minus original departure (negative: earlier)",
                "type": ["number", "null"]
              },
              "to": {
                "description": "IATA airport, final destination",
                "type": "string"
              }
            },
            "required": ["event", "flight_date", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Flight compensation check (EU261/UK261)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a23120c5b3d798b03f86c24d462657052b733c63effb0a29b89e1b0117af63e7"
        },
        {
          "name": "find_official_booking_site",
          "title": "Find a travel company's official booking site (read-only)",
          "description": "Use this when a traveler asks how or where to book with a named airline, ferry, hotel, vehicle-rental or booking company. Returns its official site and booking page and, where listed, its own booking channels (app, API, MCP), dated rules with sources and what the traveler does personally. Flags sites not on the company's listed domains. It does not search fares or availability, or book.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "where": {
                "description": "Company or site, or page URL without its query",
                "type": "string"
              }
            },
            "required": ["where"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a travel company's official booking site (read-only)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf7de5908acc287ec1db1102aa031d16f7f8d2680ab052f0cbf57e92068f2563"
        }
      ],
      "digest": "sha256:c702b6d13652c4bbf88e890eb2711e6bf72fdc908a39720cee6c29495efc33b1"
    }
  }
}
