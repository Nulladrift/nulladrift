{
  "lockfileVersion": 2,
  "subjects": {
    "com.kroelgraphics/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kroelgraphics.com/docs/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.kroelgraphics/docs",
        "title": "Kroel Graphics Docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Documentación de Kroel Graphics en Markdown. Usa list_pages para ver qué páginas hay, read_page para leer una completa (servicios, clientes, trayectoria, contacto, privacidad) y search_docs para encontrar los párrafos que mencionan un tema. Para acciones como preparar una cotización usa el otro servidor: https://kroelgraphics.com/mcp",
      "tools": [
        {
          "name": "list_pages",
          "title": "Listar páginas",
          "description": "Lista las páginas del sitio de Kroel Graphics que se pueden leer en Markdown. Úsala primero para saber qué identificadores acepta read_page. Devuelve, por cada página, su identificador, título y URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "paginas": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "titulo": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "titulo", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["paginas"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd8273c63925713786860b485086b9bfa4f35fa9000cee8e7a5cfb643b467961"
        },
        {
          "name": "read_page",
          "title": "Leer página",
          "description": "Devuelve el contenido completo en Markdown de una página de Kroel Graphics. Úsala cuando necesites el detalle de servicios, clientes, trayectoria, contacto o privacidad. Devuelve el identificador, la URL y el texto en Markdown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pagina": {
                "description": "Identificador de la página (ver list_pages).",
                "enum": ["index", "about", "contact", "pricing", "faq", "auth", "privacy", "developers"],
                "type": "string"
              }
            },
            "required": ["pagina"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "markdown": {
                "description": "Contenido de la página.",
                "type": "string"
              },
              "pagina": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["markdown", "pagina"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c52d3e229d960ed743264f70689ddd556f3e9fbf429dfdddda4ab299dbb8a46"
        },
        {
          "name": "search_docs",
          "title": "Buscar en las páginas",
          "description": "Busca palabras en todas las páginas de Kroel Graphics. Úsala para preguntas puntuales (un cliente, un servicio, privacidad) sin leer páginas completas. Devuelve hasta 12 párrafos donde aparece la consulta, cada uno con su página y URL, y el total encontrado.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consulta": {
                "description": "Palabras a buscar, por ejemplo \"portadas\" o \"privacidad\".",
                "type": "string"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "resultados": {
                "items": {
                  "properties": {
                    "pagina": {
                      "type": "string"
                    },
                    "texto": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["pagina", "texto", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["resultados", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e7de9c60fc3a64c906d0ee34572abe470ad3551daac56c2bdab3e500e574740"
        }
      ],
      "digest": "sha256:70c76953ac558b02f97b62aedd7fbef10a3a4bde6a56a1407c9e78461044fca5"
    }
  }
}
