                "description": "The line above the name on share cards.",
                "maxLength": 40,
                "type": "string"
              },
              "counterQrEnabled": {
                "description": "Offer the printable counter QR, which carries no amount and no message.",
                "type": "boolean"
              },
              "showSupporterCount": {
                "description": "Show how many people have given.",
                "type": "boolean"
              },
              "showTotalRaised": {
                "description": "Show the total amount received.",
                "type": "boolean"
