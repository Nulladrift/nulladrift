      "instructions": "Kulhad is a support page for creators in India, paid over UPI. Money moves bank to bank between a supporter and the creator, and never through Kulhad, so nothing here can send, receive or refund a payment. A supporter marks a payment as sent and the creator approves it after checking their own bank app; never tell a creator that a payment has been confirmed, only that somebody marked it as sent.",
      "tools": [
        {
          "name": "add_upi_id",
          "title": "Add a UPI ID",
          "description": "Add a UPI ID for supporters to pay into. Kulhad cannot check that an address is real or that it belongs to the creator, so tell them to send one rupee to it themselves and confirm it arrived before sharing the page. Duplicates are not checked. The free plan keeps one ID active at a time.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "label": {
                "description": "What to call it, such as Personal or Shop.",
                "maxLength": 40,
                "type": "string"
              },
              "makeDefault": {
                "default": false,
                "description": "Quote this one first.",
                "type": "boolean"
              },
              "vpa": {
                "description": "The UPI address, as in priya@okhdfc.",
                "type": "string"
              }
            },
            "required": ["vpa"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "number"
              },
              "nextStep": {
                "type": "string"
              },
              "vpa": {
                "type": "string"
              }
            },
            "required": ["id", "nextStep", "vpa"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a UPI ID"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["upi:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:a3eb936d5be2fc07ced6260a93ae8126af5068013231252e8ee3760eb74f37a1"
        },
        {
          "name": "approve_support",
          "title": "Approve a supporter",
          "description": "Approve one supporter after the creator has found the payment in their own bank app. This cannot be undone. The supporter's name and amount then show on the creator's page and stream overlays and count toward totals and the active goal; if that fills the goal, the goal is marked complete and taken off the page. With hidden set, the message and any voice recording stay private while the name and amount still show. A thank-you reply (up to 280 characters, word-filtered) can be set at the same time and replaces any existing reply. Nothing is sent to the supporter. Only the creator can know whether the money arrived, so never approve without being asked to for that specific supporter.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hidden": {
                "default": false,
                "description": "Keep the message and any voice recording private. The name and amount still show on the page.",
                "type": "boolean"
              },
              "id": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "reply": {
                "description": "A thank-you shown beside them on the page, up to 280 characters. Replaces any existing reply. Refused if the word filter flags it.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "number"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Approve a supporter"
          },
          "behavior": {
