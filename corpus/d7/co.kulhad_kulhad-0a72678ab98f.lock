              "streamAlertOn": {
                "description": "When the stream alert overlay fires. \"approved\" waits until you have looked at a support, which is how every other surface behaves. \"claimed\" fires as soon as someone marks a payment as sent, which is faster but puts a message nobody has read yet on the stream. Only change this to \"claimed\" if the creator has said they want that.",
