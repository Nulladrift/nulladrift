      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search Israeli supermarket prices in Hebrew, English, or by barcode. All exposed tools are free and read-only. Search returns up to 20 products and branch-level offers in ILS. Coverage is partial; cite product citation_url and distinguish fetched_at from the retailer price-change date. Use get_data_status when freshness matters. Never infer live stock or nationwide cheapest prices. Search shares the website's fair-use allowance of 60 requests per minute and 500 per UTC day per network address. A tool error is a failed request, not evidence that no products exist.",
      "tools": [
        {
          "name": "get_data_status",
          "title": "Check source freshness and branch coverage",
          "description": "Return the actual covered branches and the freshness of their retailer price files. A fresh branch needs a successful fetch within 12 hours and a source file published within 72 hours. No live-stock guarantee. Free and read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked_at": {
                "type": "string"
              },
              "citation_url": {
                "format": "uri",
                "type": "string"
              },
              "coverage_note": {
                "type": "string"
              },
              "fresh_stores": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "chain_id": {
                      "type": "string"
                    },
                    "chain_name": {
                      "type": "string"
                    },
                    "last_attempt_at": {
                      "type": ["string", "null"]
                    },
                    "last_error": {
                      "type": ["string", "null"]
                    },
                    "last_success_at": {
                      "type": ["string", "null"]
                    },
                    "price_count": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "source_file": {
                      "type": ["string", "null"]
                    },
                    "source_published_at": {
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "type": "string"
                    },
                    "store_id": {
                      "type": "string"
                    }
                  },
                  "required": ["chain_id", "chain_name", "last_attempt_at", "last_error", "last_success_at", "price_count", "source_file", "source_published_at", "source_url", "status", "store_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "stale_stores": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "total_stores": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "updated_at": {
                "type": ["string", "null"]
              }
            },
