            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read source freshness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:761c5f4eba30f230c756053ba4bfb5a3e3a6e4a959b852b093c0d90e46e25987"
        },
        {
          "name": "search_products",
          "title": "Compare Israeli supermarket prices",
          "description": "Search actual branch-level grocery prices by a Hebrew or English product name, manufacturer, or barcode string. Returns up to 20 matching products with retailer source/fetch times and citation URLs. Free; shared fair-use limits apply. Does not check live stock or take payments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of matching products, from 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Product name, manufacturer, or barcode. Keep leading zeros in barcodes; Hebrew is supported.",
                "maxLength": 100,
                "minLength": 2,
                "pattern": "^[^\\u0000-\\u001f\\u007f]+$",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked_at": {
                "type": "string"
              },
              "citation_url": {
                "format": "uri",
                "type": "string"
              },
              "count": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "coverage_note": {
                "type": "string"
              },
              "currency": {
                "const": "ILS",
                "type": "string"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "barcode": {
                      "type": "string"
                    },
                    "citation_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "image_url": {
                      "type": ["string", "null"]
                    },
                    "manufacturer": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "offers": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "chain_id": {
                            "type": "string"
                          },
                          "chain_name": {
                            "type": "string"
                          },
                          "fetched_at": {
                            "type": ["string", "null"]
                          },
                          "price": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "refresh_status": {
                            "type": ["string", "null"]
                          },
                          "source_file": {
                            "type": ["string", "null"]
                          },
                          "source_published_at": {
                            "type": ["string", "null"]
                          },
                          "source_url": {
                            "type": ["string", "null"]
                          },
                          "store_city": {
                            "type": ["string", "null"]
                          },
                          "store_id": {
                            "type": "string"
                          },
                          "store_name": {
                            "type": ["string", "null"]
                          },
                          "update_date": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["chain_id", "chain_name", "fetched_at", "price", "refresh_status", "source_file", "source_published_at", "source_url", "store_city", "store_id", "store_name", "update_date"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "unit_of_measure": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["barcode", "citation_url", "image_url", "manufacturer", "name", "offers", "unit_of_measure"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              }
            },
