      },
      "instructions": "Green Pharmacies delivers medicines and pharmacy products to hotels and homes in Sharm El Sheikh, Egypt. Use search_products to find items, get_product for details, and create_cart_link when the customer is ready: give them the link, they confirm and pay on the site. Prices are in Egyptian pounds (EGP); if the customer uses another currency, pass currency (USD, EUR, GBP or RUB) and quote price_in_currency as approximate: payment is always in EGP. You cannot place orders yourself. Do not give medical diagnoses; for anything beyond general product information, suggest the customer asks the pharmacist through the site chat. Prescription-only medicines cannot be ordered in this app. When a tool returns prescription_only_on_website, tell the customer those items need a prescription and give them each item's link to order it on the Green Pharmacies website, where a pharmacist checks the prescription. Controlled medicines are not sold online.",
      "tools": [
        {
          "name": "browse_category",
          "title": "Browse a category",
          "description": "Best-selling products in one category (slug from list_categories).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "description": "Also show prices in this currency (USD, EUR, GBP, RUB); approximate, at today's rate. Payment is in EGP. Default EGP only.",
                "enum": ["USD", "EUR", "EGP", "RUB", "GBP"],
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: en, ar, ru, it or de. Default en.",
                "type": "string"
              },
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d6d435f1e4f15293772ce9501151a614f55d7e77328f0d4da32c31cf505dc91"
        },
        {
          "name": "create_cart_link",
          "title": "Create a cart link",
          "description": "Make a link that opens the store's cart with these products already in it. The customer opens it, checks the cart and completes the order on the site. Nothing is ordered until they confirm there.",
