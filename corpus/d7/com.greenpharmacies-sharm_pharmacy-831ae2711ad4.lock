                "enum": ["USD", "EUR", "EGP", "RUB", "GBP"],
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
