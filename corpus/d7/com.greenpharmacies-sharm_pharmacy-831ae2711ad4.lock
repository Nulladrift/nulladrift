      "serverInfo": {
        "name": "green-pharmacies",
        "title": "Green Pharmacies",
        "version": "1.0.0",
        "websiteUrl": "https://greenpharmacies-sharm.com/en/ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Green Pharmacies delivers medicines and pharmacy products to hotels and homes in Sharm El Sheikh, Egypt. Use search_products to find items, get_product for details, and create_cart_link when the customer is ready: give them the link, they confirm and pay on the site. Prices are in Egyptian pounds (EGP). You cannot place orders yourself. Do not give medical diagnoses; for anything beyond general product information, suggest the customer asks the pharmacist through the site chat. Prescription-only products need a prescription at checkout; controlled medicines are not sold online.",
      "tools": [
        {
          "name": "browse_category",
          "title": "Browse a category",
          "description": "Best-selling products in one category (slug from list_categories).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Language of the answer: en, ar, ru, it or de. Default en.",
                "type": "string"
              },
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse a category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfd84b6963c9307c3d4c9e59b43a27c939d434b0fc98032ec064ebc7a4c17147"
        },
        {
          "name": "create_cart_link",
          "title": "Create a cart link",
          "description": "Make a link that opens the store's cart with these products already in it. The customer opens it, checks the cart and completes the order on the site. Nothing is ordered until they confirm there.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "slug"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Language of the answer: en, ar, ru, it or de. Default en.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a cart link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd4f5ca79b7d21cd74cf902a2693309466daca0664cb03ca5bcec31bee579710"
        },
        {
          "name": "current_deals",
          "title": "Current deals",
          "description": "Products on offer right now, with the discount.",
