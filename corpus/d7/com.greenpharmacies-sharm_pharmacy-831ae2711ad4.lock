                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "slug"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Language of the answer: en, ar, ru, it or de. Default en.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
