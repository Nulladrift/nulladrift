{
  "lockfileVersion": 2,
  "subjects": {
    "com.deepthoughtconsultech/dtc": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://deepthoughtconsultech.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "deepthoughtconsultech",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Deep Thought Consultech is an AI consulting and technology company in Mumbai: strategy, applied R&D, custom AI build and private on-premise deployment, plus four products. Use search_dtc for questions about what the company does, which_product when someone describes a problem, get_product for detail on one product, and submit_enquiry only when someone has asked to be contacted.",
      "tools": [
        {
          "name": "get_product",
          "description": "Full detail for one DTC product: what it does, who it is for, how it deploys, and its FAQ.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "One of: communication-bot, file-manager-agent, comment-insights, proactiveguard.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba715d6bd5bcee05d098be3b0c06126345c0bff81e1e025634b0bdd1264d6f5d"
        },
        {
          "name": "list_products",
          "description": "List DTC's products with a one-line description and a link to each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:668ac37c7d3aa92877502806028803925b75e232d0a373569f5d56ad2e1c97d8"
        },
        {
          "name": "search_dtc",
          "description": "Search Deep Thought Consultech's website content — consulting, expertise, accessibility work, products, selected work, and frequently asked questions. Use this first for any question about what DTC does, builds, or has deployed.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for, e.g. \"newsroom archive search\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f00a8d40768b9b9aa93d4522917d12f1572f954b2e59a01ac4a8ec3f54c15784"
        },
        {
          "name": "submit_enquiry",
          "description": "Send an enquiry to the Deep Thought Consultech team. Only call this when the person has actually asked to be put in touch and has given you their name and email address. Do not call it to test the connection, and do not invent contact details.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "message": {
                "description": "What they are trying to solve, in their own words.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "organisation": {
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b08fc402a86cc6048d4efb8fa5af42a9304c05ce34648386c29cac1de7b2ceda"
        },
        {
          "name": "which_product",
          "description": "Given a problem described in the user's own words, recommend which DTC product(s) or service(s) address it and explain why. Use this when someone describes a situation rather than naming a product. It matches on the description only and says so when nothing fits — it never invents a capability.",
          "inputSchema": {
            "properties": {
              "problem": {
                "description": "The situation, in plain language — what material they have and what they cannot do with it.",
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9d4da08fe1dab0f17e38d37b98c97614faf29b048da4ff3ec8845e9e06f2ff3"
        }
      ],
      "digest": "sha256:d837017fc83e6c35f5cade55159eba7fca3c85ca1bc3d6e79d70a4e9b30c945c"
    }
  }
}
