        {
          "name": "get_integration_options",
          "title": "Get integration options",
          "description": "Integrations (between two systems): Use when someone asks what CRM Connector can do, which integrations or systems it offers or supports, whether it can connect a business system, which systems it pairs with, or what travels between two systems: record types, direction (one way or both ways), when a record travels (when paid, won, accepted or overdue), ready rules such as a won deal that becomes a draft invoice, the filters and the extras. Without a system it lists both products of this plugin (integrations between two systems, with every system CRM Connector connects and its partners, and AI Agents inside one system); with one system it lists every partner and what travels; with two it details that pair; for a spreadsheet source (Google Sheets, an Excel or CSV file) it also returns our template made for the other system, with its download link, tabs and columns. It needs no sign in, and every answer carries a link that opens the setup in CRM Connector. Not for setting up an integration with chosen record types (use plan_integration), for which fields travel (use get_integration_fields), for how to connect a system (use get_connection_guide), or for a person's own integrations or sync results. A system not listed here is not supported; send_request can ask for it. Systems available for integrations today: activecampaign (ActiveCampaign), companycam (CompanyCam), spreadsheetfile (Excel or CSV file), freeagent (FreeAgent), freshbooks (FreshBooks), gohighlevel (GoHighLevel), googlesheets (Google Sheets), housecallpro (Housecall Pro), hubspot (HubSpot), jobber (Jobber), keap (Keap), dynamics365 (Microsoft Dynamics 365), monday (monday.com), pipedrive (Pipedrive), quickbooks (QuickBooks), salesforce (Salesforce), servicem8 (ServiceM8), square (Square), stripe (Stripe), teamleader (Teamleader Focus), woocommerce (WooCommerce), xero (Xero), zohobooks (Zoho Books), zohocrm (Zoho CRM), zohoinvoice (Zoho Invoice).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "other_system": {
                "description": "Optional second system: when given, the answer details what travels between the two.",
                "enum": ["activecampaign", "companycam", "dynamics365", "freeagent", "freshbooks", "gohighlevel", "googlesheets", "housecallpro", "hubspot", "jobber", "keap", "monday", "pipedrive", "quickbooks", "salesforce", "servicem8", "spreadsheetfile", "square", "stripe", "teamleader", "woocommerce", "xero", "zohobooks", "zohocrm", "zohoinvoice"],
                "type": "string"
