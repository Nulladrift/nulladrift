      "serverInfo": {
        "name": "crm-connector",
        "title": "CRM Connector",
        "version": "1.4.2",
        "description": "The integration hub for your business systems, in two parts: integrations that keep two of your systems in sync by themselves, and AI agents that read, change and automate the records of one system.",
        "websiteUrl": "https://crm-connector.com/platform/mcp",
        "icons": [
          {
            "src": "https://platform-mcp.crm-connector.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "instructions": "CRM Connector holds two products: AI Agents read, change and automate records inside one system and come first; integrations keep records in step between two systems. Keep them apart. Ask which integration or AI agent they mean before using a tool on one. Say what a change will do and get a yes first. Never name amounts or costs. When a tool refuses, tell the person why and what to do; if stuck, offer send_request so we can fix it. Offer a test before someone commits: it writes nothing.",
      "tools": [
        {
          "name": "apply_proposal",
          "title": "Apply proposed changes",
          "description": "AI Agents (inside one system): Use only after the customer saw the changes of a proposal and said yes. It writes exactly what one proposal of propose_changes showed, and nothing else. CRM Connector reads every record again, refuses one that changed since the proposal, writes the rest and keeps each change with an undo where the system allows it. A proposal that needs the customer's own approval is refused here with its approve link. Calling it again answers what was done.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "proposal_id": {
                "description": "The proposal id propose_changes returned.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["proposal_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changes": {
                "items": {
                  "properties": {
                    "at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "canUndo": {
                      "type": "boolean"
                    },
                    "error": {
                      "type": ["string", "null"]
                    },
                    "fields": {
                      "items": {
                        "properties": {
                          "after": {},
                          "before": {},
                          "field": {
                            "type": "string"
                          },
                          "label": {
                            "type": "string"
                          }
                        },
                        "required": ["after", "before", "field", "label"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "note": {
                      "type": ["string", "null"]
                    },
                    "operation": {
                      "type": ["string", "null"]
                    },
                    "proposalId": {
                      "type": ["string", "null"]
                    },
                    "recordId": {
                      "type": ["string", "null"]
                    },
                    "sendsMessage": {
                      "type": "boolean"
                    },
                    "status": {
                      "type": "string"
                    },
                    "systemId": {
                      "type": ["string", "null"]
                    },
                    "systemName": {
                      "type": ["string", "null"]
                    },
                    "type": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["at", "fields", "id", "kind", "label", "operation", "recordId", "status", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "proposalId": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["changes", "proposalId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply proposed changes"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
