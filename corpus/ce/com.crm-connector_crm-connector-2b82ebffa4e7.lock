                },
                "maxItems": 8,
                "type": "array",
                "uniqueItems": true
              },
              "system": {
                "description": "The system the agent works in, by its key.",
                "enum": ["hubspot", "gohighlevel", "quickbooks", "xero", "housecallpro", "zohocrm", "zohobooks", "zohoinvoice", "monday", "pipedrive", "teamleader", "salesforce", "dynamics365"],
                "type": "string"
              }
            },
            "required": ["system"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "actionGroups": {
                "items": {
                  "type": "string"
                },
                "type": "array"
