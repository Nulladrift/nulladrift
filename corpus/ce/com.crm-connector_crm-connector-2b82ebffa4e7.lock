        {
          "name": "describe_record_type",
          "title": "Describe a record type",
          "description": "AI Agents: Use before searching or changing records of one type in an AI agent's system: its fields and the system's own fields. Optional include: fields (all own fields), stages, users or products; field_names for the meaning and options of some. Not for reading records (use search_records).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "field_names": {
                "description": "Optional: names of the system's own fields to describe in full, with the options of a dropdown; at most 100.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "include": {
                "description": "Optional: fields for every one of the system's own fields, stages for the pipelines and their stages, users for the people records can be assigned to, products for the products and services a line can hold.",
                "items": {
                  "enum": ["fields", "stages", "users", "products"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array",
                "uniqueItems": true
              },
              "system": {
                "description": "The AI agent: its system or connection name.",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "The record type, such as contact or invoice.",
                "maxLength": 40,
                "type": "string"
              },
              "user_email": {
                "description": "Optional, with include users: only the user with this email address.",
                "maxLength": 320,
                "type": "string"
              },
              "users_cursor": {
                "description": "Optional, with include users: the cursor of the page before, to read the next page.",
                "maxLength": 400,
                "type": "string"
              },
              "users_limit": {
                "default": 100,
                "description": "Optional, with include users: how many users per page, 1 to 100.",
