                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array",
                "uniqueItems": true
              },
              "change_record_types": {
                "description": "Optional record types the assistant may read and write, each change shown to the person first.",
                "items": {
                  "enum": ["contact", "appointment", "job", "estimate", "invoice", "opportunity", "deal", "ticket"],
                  "type": "string"
                },
                "maxItems": 8,
