        {
          "name": "plan_ai_agent",
          "title": "Plan an AI agent",
          "description": "AI Agents (inside one system): Use when someone wants an AI agent inside one of their systems, for example \"let the assistant read my contacts and deals and add follow-up tasks\". It checks the wish against what an agent can do in that system and returns the record types it would read or change, the groups of actions, and a link that opens the setup in CRM Connector filled in, where the person signs in to the system and reviews everything. Every plan is saved as a new concept: a setup kept for later, not an AI agent, so nothing works until the person opens the link and finishes it in CRM Connector, where a signed in account also finds it under AI Agents. Nothing saved earlier is changed: a changed plan is a new concept with its own link, so share the newest one. Without record types it plans reading every record type the system offers. Call get_ai_agent_options with the system first when you do not know what it offers. Not for syncing records between two systems (use plan_integration).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_groups": {
                "description": "Optional groups of the system's own actions to switch on, as get_ai_agent_options names them for that system, for example adding notes and tasks.",
