        {
          "name": "propose_automation",
          "title": "Propose an automation",
          "description": "AI Agents (inside one system): Use when the customer wants something to keep happening by itself inside one system on AI Agent (not for a one-off change: use propose_changes or another propose_ tool), such as \"when a deal is won and the amount is above 5,000, add a kick-off task for the owner and a note\". It turns that into one fixed rule on one record type: when (trigger), only if (conditions), then (actions). Before calling it, describe the rule in plain words (when, only if, then, and whether it also acts on records that already match) and get a yes. Nothing runs yet: the answer gives the rule as one sentence, how many records it would have acted on in the last 30 days with examples, and an approval link. Show that to the customer and ask whether to switch it on: after their yes, call set_automation_status with approve. A rule that sends something is only switched on through the link. Once on, the platform runs it again and again without asking. Use describe_record_type for the field keys; each action is set_fields, create_record (a record of another type, such as a deal for a contact), notify (tells the account owners or a member of the CRM Connector account, in the app and by email), or a change action named as its propose_ tool without the prefix (add_note, add_task, assign_owner over users that take turns, and so on) with the values of one item of that tool. An action may carry a value of the record that fired, act on its contact, deal or job, or on the record an earlier action of the rule made. Pass replaces with an automation id to change an existing rule. A rule only acts inside that one system: to sync records between two systems, use an integration (plan_integration). It never deletes, and records a payment only after the person approves it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "Then: 1 to 3 actions, run in this order on the record that met the rule.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arguments": {
                      "description": "For a change action: one item of that action's propose_ tool, for the record that met the rule. Use {record.id} as its id and leave type out for the rule's own record type. To act on the contact of a record, give type contact with {record.contact} as its id; on its deal, type opportunity with {record.deal}; on its job, {record.job}. To act on what an earlier action of the rule made (create_record, convert_estimate, convert_lead), use {action1.id} for the first action. To give a task or record to the owner of the record that met the rule, use {record.owner} as its user. For assign_owner, users is a list of user ids that take turns, one per record. For notify: to is owners or the emails of members of the CRM Connector account (at most 5), text what to tell (at most 900 characters) and optionally subject; it tells at most 50 times a day. A date may be {today} or {today+3} (three days after the rule acts). {record.field:Amount} is the value a field of the record that fired holds when the rule acts. For email_contact: subject, body, sender_name (the From name shown, 2 to 60 characters) and reply_to (the address replies go to), both required. The subject and body may use {contact.first_name}, {contact.name}, {record.name}, {organisation}; the address it goes to is always the contact's own.",
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "clear": {
                      "description": "For set_fields: field keys to empty.",
                      "items": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "maxItems": 40,
                      "minItems": 1,
                      "type": "array"
                    },
                    "kind": {
                      "description": "The action the rule applies by itself: set_fields to set or empty fields of the record, create_record to make a record of another type, notify to tell people of the CRM Connector account in the app and by email, or a change action named as its propose_ tool without the prefix (update_fields, move_stage, assign_owner, add_note, add_task, update_task, log_activity, add_line_item, link_records, unlink_records and the others). One more is carried out by CRM Connector itself and is only switched on through the approval page: email_contact (a short email to the email address of the record's contact).",
                      "enum": ["set_fields", "create_record", "notify", "update_fields", "move_stage", "assign_owner", "add_note", "add_task", "update_task", "log_activity", "add_line_item", "send_record", "convert_estimate", "convert_lead", "link_records", "unlink_records", "create_item", "update_item", "set_item_state", "move_item", "add_tag", "remove_tag", "add_follower", "remove_follower", "add_to_workflow", "remove_from_workflow", "update_note", "send_message", "update_conversation", "record_payment", "change_consent", "void_record", "send_document", "email_contact"],
                      "type": "string"
                    },
                    "set": {
                      "additionalProperties": true,
                      "description": "For set_fields: field keys and their new values. For create_record: the fields of the new record, such as its contact as {record.id}. A date may be {today} or {today+3} (three days after the rule acts). {record.field:Amount} is the value a field of the record that fired holds when the rule acts.",
                      "type": "object"
                    },
                    "type": {
                      "description": "For create_record: the record type to make, such as opportunity.",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["kind"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "apply_to_existing": {
                "default": false,
                "description": "Also act once on the records that already match when the rule is switched on. Off by default: the rule then only acts on what happens from now on.",
                "type": "boolean"
              },
              "conditions": {
