        {
          "name": "set_automation_status",
          "title": "Approve, pause, resume or remove an automation",
          "description": "AI Agents (inside one system): Use when the customer asks to approve, pause, resume or remove one automation, after they confirmed. approve switches on a rule propose_automation wrote, only after the customer said yes to that rule in this conversation; a rule that sends something answers with its approval link instead. pause stops it until it is resumed; resume switches a paused rule on again; remove stops it for good. Nothing is deleted in the system, and every change the rule made stays in the change log with its undo. Needs the id from list_automations. Not for changing what a rule does (use propose_automation with replaces).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "automation_id": {
                "description": "The automation's id, as list_automations or propose_automation returns it.",
                "maxLength": 200,
                "type": "string"
              },
              "command": {
                "description": "approve, pause, resume or remove.",
                "enum": ["approve", "pause", "resume", "remove"],
                "type": "string"
              }
            },
            "required": ["automation_id", "command"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "approveUrl": {
                "type": ["string", "null"]
              },
              "examples": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "firings30Days": {
                "type": "integer"
              },
              "id": {
                "type": "string"
              },
              "lastRunAt": {
                "format": "date-time",
                "type": ["string", "null"]
              },
              "matchedLast30Days": {
                "type": ["integer", "null"]
              },
              "name": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "pauseReason": {
                "type": ["string", "null"]
              },
              "rule": {
                "properties": {
                  "actions": {
                    "items": {
                      "properties": {
                        "arguments": {},
                        "clear": {
                          "items": {
                            "type": "string"
