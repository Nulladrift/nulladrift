        {
          "name": "update_ai_agent",
          "title": "Change an AI agent's settings",
          "description": "AI Agents (inside one system): Use when the customer asks to change what one AI agent may do: which record types it reads or reads and writes, which groups of actions are switched on (for example when a tool answered that a group is switched off), read only, or pausing and resuming it. Call it first without confirm: it answers the agent's settings now and what would change, and saves nothing. Show that to the customer, and call again with the same settings and confirm true only after they said yes. Only an Owner or Administrator can change settings. Not for removing an agent or switching a saved one on (both in CRM Connector), and not for automations (use propose_automation and set_automation_status).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "default": false,
                "description": "Leave it out to review the change. True saves it, only after the customer said yes to that review in this conversation.",
                "type": "boolean"
              },
              "read_only": {
                "default": false,
                "description": "Optional: true to let the agent only read until it is switched off again, false to let it change records again.",
                "type": "boolean"
              },
              "record_types": {
                "additionalProperties": {
                  "description": "off, read or read_write.",
                  "enum": ["off", "read", "read_write"],
                  "type": "string"
                },
                "description": "Optional: record types to change, as get_ai_agent_options lists them, each to off, read or read_write. Types left out stay as they are.",
                "maxProperties": 12,
                "type": "object"
              },
              "status": {
                "description": "Optional: paused to stop the agent until it is resumed, active to resume it.",
                "enum": ["active", "paused"],
                "type": "string"
              },
              "system": {
                "description": "Which AI agent: the system's id from get_ai_agent_options, or the name of the system or its connection. Ask the person which AI agent they mean unless they named it in this conversation; never pick one yourself.",
                "maxLength": 200,
                "type": "string"
              },
              "turn_off_actions": {
                "description": "Optional: names of groups of actions to switch off.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "turn_on_actions": {
                "description": "Optional: names of groups of actions to switch on, as this tool or get_ai_agent_options lists them. A group that is on already takes on the actions added to it since.",
