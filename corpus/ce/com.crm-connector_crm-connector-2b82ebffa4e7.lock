                "description": "Opaque profile identifier, unique within this app and unchanged across token refresh, reconnection and display changes. Never reassigned to another profile.",
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "name": {
                "description": "The organisation the account belongs to.",
                "type": "string"
