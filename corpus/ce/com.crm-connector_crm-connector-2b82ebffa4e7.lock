        {
          "name": "get_integration_health",
          "title": "Get integration health",
          "description": "Integrations (between two systems): Use when a signed in CRM Connector customer asks how their syncs are doing: what failed, why records did not arrive, what is waiting, when an integration last ran or which conflicts wait for a choice. Returns, for all integrations or one, the failed records grouped by reason with a count per integration and record type, the records waiting on a related record, and totals. With an integration_id, include recent_syncs adds its latest syncs (moment, outcome and per record type what was read, written, skipped and failed) and include conflicts adds the conflicts waiting: two records that match one record, of which only one can sync, named only to a person who allowed managing integrations. Failure reasons never quote record contents. Not for listing integrations (use list_integrations) or for fixing anything: it only reads; resolve a conflict with resolve_integration_conflict and start a sync with run_integration.",
