        {
          "name": "propose_automation",
          "title": "Propose an automation",
          "description": "AI Agents: Use when the person wants something to keep happening by itself in one system, such as \"when a deal is won, add a kick-off task\". Writes one rule (when, only if, then) on one record type and returns it as a sentence, what it would have done in the last 30 days and an approval link; nothing runs yet. After their yes, call set_automation_status with approve; a rule that sends something is only switched on through the link. Field keys come from describe_record_type. Not for a one-off change (use a propose_ tool) or for syncing two systems (use plan_integration).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actions": {
                "description": "Then: the actions, in order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arguments": {
                      "description": "For a propose_ action: one item of that tool with {record.id} as its id; {record.contact}, {record.deal}, {record.job}, {record.owner} and {action1.id} name other records. notify: to, text, subject. email_contact: subject, body, sender_name and reply_to; ask the person for the last two.",
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "clear": {
                      "description": "For set_fields: field keys to empty.",
                      "items": {
                        "maxLength": 80,
                        "type": "string"
                      },
                      "maxItems": 40,
                      "minItems": 1,
                      "type": "array"
                    },
                    "kind": {
                      "description": "set_fields, create_record, notify, email_contact (approved on its page only), or a propose_ tool's action without the prefix, such as add_task.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "set": {
                      "additionalProperties": true,
                      "description": "For set_fields and create_record: field keys and values. Values may use {record.id}, {today}, {today+3} and {record.field:Amount}.",
                      "type": "object"
                    },
                    "type": {
                      "description": "For create_record: the record type to make.",
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["kind"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "apply_to_existing": {
                "default": false,
                "description": "Also act once on records that already match.",
                "type": "boolean"
              },
              "conditions": {
                "description": "Only if: conditions that must all hold.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "The field key.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "operator": {
                      "description": "How the field is compared.",
                      "enum": ["equals", "not_equals", "contains", "empty", "not_empty", "above", "below", "one_of"],
                      "type": "string"
                    },
                    "value": {
                      "description": "Not for empty and not_empty; a number for above and below."
                    },
                    "values": {
                      "description": "For one_of.",
                      "maxItems": 50,
                      "type": "array"
                    }
                  },
                  "required": ["field", "operator"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "name": {
                "description": "A short name for the rule.",
                "maxLength": 120,
                "type": "string"
              },
              "replaces": {
                "description": "Optional id of an automation this rule replaces once approved.",
                "maxLength": 200,
                "type": "string"
              },
              "system": {
                "description": "The AI agent: its system or connection name.",
                "maxLength": 200,
                "type": "string"
              },
              "trigger": {
                "additionalProperties": false,
                "description": "When the rule acts.",
                "properties": {
                  "days": {
                    "description": "For date_reached: days after the date, negative for before. For unchanged_for: days without a change.",
                    "maximum": 365,
                    "minimum": -365,
                    "type": "integer"
                  },
                  "field": {
                    "description": "The field key. For becomes, changes and date_reached.",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "kind": {
                    "description": "created, becomes (a field gets a value), changes, date_reached, unchanged_for, tag_added or tag_removed.",
                    "enum": ["created", "becomes", "changes", "date_reached", "unchanged_for", "tag_added", "tag_removed"],
                    "type": "string"
                  },
                  "value": {
                    "description": "For becomes: the value it gets. For unchanged_for: the value it holds. For a tag trigger: the tag."
                  },
                  "yearly": {
                    "description": "For date_reached: every year, such as a birthday.",
                    "type": "boolean"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "type": {
                "description": "The record type, such as contact or invoice.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["actions", "name", "system", "trigger", "type"],
            "type": "object"
          },
