        {
          "name": "find_free_slots",
          "title": "Find free calendar slots",
          "description": "AI Agents: Use to see when a calendar of an AI agent's system still has room, such as before proposing a time to a customer, for at most 31 days at a time. Not for what is booked already (use search_records on appointments).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "The id of the calendar, as describe_record_type gives it with include stages on appointments; leave it out where the system keeps one schedule for the whole company.",
                "maxLength": 200,
                "type": "string"
              },
              "duration_minutes": {
                "description": "How long the visit or meeting takes, in minutes, where the system works slots out by length.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "The first day or moment, ISO 8601, such as 2026-11-02.",
                "maxLength": 40,
                "type": "string"
              },
              "system": {
                "description": "The AI agent: its system or connection name.",
                "maxLength": 200,
                "type": "string"
              },
              "time_zone": {
                "description": "The IANA time zone to give the slots in, such as Europe/Amsterdam.",
                "maxLength": 60,
                "type": "string"
              },
              "to": {
                "description": "The last day or moment, ISO 8601, at most 31 days later; a day counts in full.",
                "maxLength": 40,
                "type": "string"
              },
              "user": {
                "description": "Only the slots of this user, by the id describe_record_type gives with include users.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["from", "system", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "notice": {
                "type": "string"
              },
              "operation": {
                "type": "string"
              },
              "result": {},
              "status": {
                "type": "integer"
              },
              "systemId": {
                "type": "string"
              },
              "systemName": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["notice", "operation", "result", "status", "systemId", "systemName", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find free calendar slots"
