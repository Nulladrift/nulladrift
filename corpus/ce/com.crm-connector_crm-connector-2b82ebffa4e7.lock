              {
                "scopes": ["records.read", "records.write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bb7f1e2c2b92b48ad94755b0abc1653d1b144eadff62fa51330cafcdd5d06b80"
        },
        {
          "name": "describe_record_type",
          "title": "Describe a record type",
          "description": "AI Agents (inside one system): Use before searching or changing records of one type in an AI agent's system: everything about the type in one answer. Returns the fields CRM Connector reads the same way in every system (fields: which may be changed, set only on a new record, or emptied) and the system's own fields (systemFields, custom fields included). Optional: include fields for every one of the system's own fields as the system lists them, field_names for the meaning and dropdown options of some of them, include stages for the pipelines and their stages (which count as won or lost), include users for the people records can be assigned to, page by page, include products for the products and services a line can hold. Not for reading records (use search_records or get_record).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "field_names": {
                "description": "Optional: names of the system's own fields to describe in full, with the options of a dropdown; at most 100.",
                "items": {
                  "maxLength": 120,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "include": {
                "description": "Optional: fields for every one of the system's own fields, stages for the pipelines and their stages, users for the people records can be assigned to, products for the products and services a line can hold.",
                "items": {
                  "enum": ["fields", "stages", "users", "products"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array",
                "uniqueItems": true
              },
              "system": {
                "description": "Which AI agent: the system's id from get_ai_agent_options, or the name of the system or its connection. Ask the person which AI agent they mean unless they named it in this conversation; never pick one yourself.",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "The record type, as get_ai_agent_options lists it: contact, opportunity, invoice, estimate, job, appointment.",
                "maxLength": 40,
                "type": "string"
              },
              "user_email": {
                "description": "Optional, with include users: only the user with this email address.",
                "maxLength": 320,
                "type": "string"
              },
              "users_cursor": {
                "description": "Optional, with include users: the cursor of the page before, to read the next page.",
                "maxLength": 400,
                "type": "string"
              },
              "users_limit": {
                "default": 100,
                "description": "Optional, with include users: how many users per page, 1 to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["system", "type"],
            "type": "object"
          },
