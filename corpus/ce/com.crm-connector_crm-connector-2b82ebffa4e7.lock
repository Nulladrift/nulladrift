        {
          "name": "get_ai_agent_options",
          "title": "Get AI agent options",
          "description": "AI Agents (inside one system): Use when someone asks what AI Agents is, which systems it works with, what an agent can do in one of their business systems, or which AI agents their account has. Returns the systems an agent works in, what it reads, what it can do after the person approves it and what it never does. With a system it also returns that system's record types, actions and automation options. For a signed in customer it also returns this account's AI agents, each with its id, its access per record type and whether it runs. It changes nothing. Not for setting one up (use plan_ai_agent) or for syncing records between two systems (use get_integration_options).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "system": {
                "description": "Optional system to look up. With one, the answer lists exactly what an AI agent can do there.",
