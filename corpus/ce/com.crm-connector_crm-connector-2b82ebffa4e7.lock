      "serverInfo": {
        "name": "crm-connector",
        "title": "CRM Connector",
        "version": "1.5.5",
        "description": "The integration hub for your business systems, in two parts: integrations that keep two of your systems in sync by themselves, and AI agents that read, change and automate the records of one system.",
        "websiteUrl": "https://crm-connector.com/platform/mcp",
        "icons": [
          {
            "src": "https://platform-mcp.crm-connector.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "instructions": "CRM Connector has two products: AI agents read, change and automate the records of one system; integrations keep two systems in sync. Keep answers short and plain. When they want either, ask which system (or two), check it with get_ai_agent_options or get_integration_options; plan an agent at once, offer to plan an integration; if missing, offer send_request. Ask which agent or integration they mean. Get a yes before any change. Never name amounts or costs. Say what it can do; never list limitations.",
      "tools": [
        {
          "name": "apply_proposal",
          "title": "Apply proposed changes",
          "description": "AI Agents: Use only after the person saw a proposal of a propose_ tool and said yes; say first when something would be sent to people in their system. Writes exactly what the proposal showed, skips a record that changed since, and keeps an undo where the system allows it. A proposal that needs approval in CRM Connector is refused with its approve link. Not for a change nobody proposed (use a propose_ tool first).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "proposal_id": {
                "description": "The proposal id a propose_ tool returned.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["proposal_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changes": {
                "items": {
                  "properties": {
                    "at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "canUndo": {
                      "type": "boolean"
                    },
                    "error": {
                      "type": ["string", "null"]
                    },
                    "fields": {
                      "items": {
                        "properties": {
                          "after": {},
                          "before": {},
                          "field": {
                            "type": "string"
                          },
                          "label": {
                            "type": "string"
                          }
                        },
                        "required": ["after", "before", "field", "label"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "note": {
                      "type": ["string", "null"]
                    },
                    "operation": {
                      "type": ["string", "null"]
                    },
                    "proposalId": {
                      "type": ["string", "null"]
                    },
                    "recordId": {
                      "type": ["string", "null"]
                    },
                    "sendsMessage": {
                      "type": "boolean"
                    },
                    "status": {
                      "type": "string"
                    },
                    "systemId": {
                      "type": ["string", "null"]
                    },
                    "systemName": {
                      "type": ["string", "null"]
                    },
                    "type": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["at", "fields", "id", "kind", "label", "operation", "recordId", "status", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "proposalId": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["changes", "proposalId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply proposed changes"
