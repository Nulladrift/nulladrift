          "name": "lookup_compensation_rate",
          "title": "Look up monthly compensation rate",
          "description": "Use this when a veteran wants the monthly VA disability compensation amount for a given rating percentage and dependent situation. It gives the published rate for that combination, not what a specific veteran is paid, and it is not a back-pay calculation for a past period. Returns the monthly and annual amounts from the VA compensation rate table in effect, with the rate year and effective date. The rating is read to the nearest 10 percent, and dependents change the amount only at 30 percent and above. Children are counted as children under 18; school-age children 18 to 23, dependent parents and aid and attendance are outside what it models.",
          "inputSchema": {
