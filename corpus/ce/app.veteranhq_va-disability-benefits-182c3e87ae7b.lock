      "instructions": "VeteranHQ answers questions about U.S. veterans' VA disability benefits. Numeric results (combined ratings, compensation amounts, projections, eligibility screens) are computed by VeteranHQ's production engines from 38 CFR, 10 USC and official VA rate tables: do not recompute, adjust, or second-guess a returned value from memory, and do not substitute your own arithmetic. Precision differs by tool, and each result says which it is. Some are exact table lookups; others are estimates that rest on stated assumptions. Repeat every assumption, estimate marker, confidence note and disclaimer a result carries in the same answer you give the veteran, and describe an estimate as an estimate, never as a decision. Only VA decides ratings, effective dates and payment amounts. This server provides educational information, not legal advice, and does not prepare or file claims. No veteran personal data is accessible through this server. VeteranHQ provides educational information about VA disability benefits through read-only tools; it does not provide legal advice or prepare or file claims. Available account tools depend on this connection's permissions and membership. Use returned calculations rather than substituting arithmetic from memory, and retain their assumptions, estimate markers, confidence notes, and limitations. Only VA determines ratings, effective dates, and payments. Results describe their stated sources and dates; unavailable records do not establish that no claim or evidence exists. VeteranHQ never asks for, accepts, stores, uses or repeats a password, a one-time code or any other login detail in a conversation; login details are typed only on official sites.",
      "tools": [
        {
          "name": "analyze_rating_gap",
          "title": "Analyze a rating gap",
          "description": "Use this when a veteran gives a condition name and the VA disability percentage currently assigned for it, and wants that percentage compared against the VASRD criteria. It describes what the criteria require; only VA decides a rating. Returns the tier that matches the current percentage, the next tier above it, and every higher tier on file for that condition, with the criteria each one requires. It reports when the condition is already at the highest documented tier, and when no criteria are on file for that condition name. documentedTiers lists the tier percentages on file for the condition, and currentPercentIsDocumentedTier says whether the percentage supplied is one of them: false means the figure does not correspond to a tier in the criteria on file, which happens when the rating came from a formula or a code this search did not resolve. For a veteran at zero percent, zeroPercentBasis is \"documented\" when a zero percent row for the code is on file and \"unresolved\" when the complete tier set could not be established, and zeroPercentUnderFourThirtyOne answers whether 38 CFR 4.31 is what assigns that zero: false where the schedule on file provides a zero percent evaluation or the rating is compensable, and null where the question is open. A null there is an unanswered question rather than a finding that 4.31 applies, because the rule turns on what the schedule provides for the code and this tool reads the criteria on file rather than the omissions in the schedule.",
          "inputSchema": {
            "properties": {
              "conditionName": {
                "description": "Condition to analyze (e.g., \"PTSD\", \"Lumbar strain\").",
                "type": "string"
              },
              "currentPercent": {
                "description": "Current VA rating percentage for this condition (e.g., 30, 50, 70).",
                "type": "number"
              }
            },
            "required": ["conditionName", "currentPercent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze a rating gap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18d849c45f931b9f54810ed44ec932cdc93de91e58028cfb445f62e6bcf65436"
        },
        {
          "name": "calculate_combined_rating",
          "title": "Calculate combined VA rating",
          "description": "Use this when a veteran has two or more VA disability rating percentages and wants the combined rating. It reports what 38 CFR 4.25 and 4.26 yield for the percentages supplied, not what VA has assigned, and it does not evaluate special monthly compensation. Applies the 38 CFR 4.25 Combined Ratings Table procedure: pairwise combination in severity order, whole-percent rounding after each step, then conversion to the nearest 10. Returns combinedRating as an object holding both figures under their own names: rounded is the rating after that conversion, raw is the Combined Ratings Table value before it. The arithmetic for each step comes back alongside them. The optional bilateral argument tags the ratings that affect both arms or both legs; when it is supplied and one pair has a compensable rating on each side, 38 CFR 4.26 applies to those ratings first: they combine with each other, 10 percent of that value is added rather than combined, and the result enters the 4.25 combination as one disability. Without that argument no bilateral factor is applied. The 38 CFR 4.26(d) comparison across eligible groupings is exhaustive here for up to 16 tagged compensable ratings; past that the response carries combinedRatingWithoutBilateralFactor in place of combinedRating, labelled as a figure the bilateral factor has not been applied to, with a note that VA and accredited representatives compute that factor. The result differs from adding the percentages and from a simple product.",
          "inputSchema": {
            "properties": {
              "bilateral": {
                "description": "Optional. Tags the ratings that affect a paired extremity, so 38 CFR 4.26 can be applied: those ratings are combined with each other first, 10 percent of that value is added (not combined), and the result enters the 4.25 combination as one disability. The factor needs a compensable rating on both sides of one pair (both arms or both legs); tag every rating that affects an arm or a leg and the tool applies the factor only where the regulation allows it. Tagging more than 16 compensable ratings is accepted and answered, but past that the 38 CFR 4.26(d) comparison across eligible groupings is not exhaustive here, so the result carries the 4.25 combination of every rating supplied under combinedRatingWithoutBilateralFactor instead of a combined rating, and says where the complete calculation comes from.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "extremity": {
                      "description": "The extremity that rating affects.",
                      "enum": ["left-arm", "right-arm", "left-leg", "right-leg"],
                      "type": "string"
                    },
                    "index": {
                      "description": "Position in the ratings array of the rating this entry describes (0-based).",
                      "maximum": 19,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["extremity", "index"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "ratings": {
                "description": "Array of individual disability rating percentages (0-100), e.g., [70, 50].",
                "items": {
                  "maximum": 100,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["ratings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate combined VA rating"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dba50a41063b221d8896985f72eb9889fd79f6faee161bccc2b4ce770d7b2a54"
        },
        {
          "name": "calculate_rolling_window",
          "title": "Check a 12-month absence window",
          "description": "Use this when a veteran supplies dates of incapacitating episodes and the question involves the 38 CFR 4.71a formula VA uses to rate intervertebral disc syndrome on incapacitating episodes, diagnostic code 5243. The tier it reports is an estimate from the episodes supplied, and it does not decide FMLA entitlement or apply to conditions rated outside diagnostic code 5243. Totals the calendar duration of those episodes inside the 12 months ending on a reference date: the window opens the day after the same date one year earlier and closes on the reference date, with both ends counted, so an episode that began exactly 12 months before that date falls outside it by one day. That formula bands on total calendar duration in weeks, so weekend and holiday days inside an episode count, and only periods flagged as bed rest prescribed by a physician count toward a tier. Returns the window, a per-period breakdown, the tier the flagged episodes would support, and a separate employer-leave workday count that plays no part in that tier. Inside ivdsThresholdAnalysis, calendarDaysBelow60PercentThreshold and weeksBelow60PercentThreshold report how far the counted episodes fall below the 6-week duration that bands at 60 percent under that formula. They measure the reported history against a threshold in the regulation; they are not a target, since a veteran does not accumulate bed rest to reach a rating.",
          "inputSchema": {
            "properties": {
              "absencePeriods": {
                "description": "Array of absence periods. Each must have at least a startDate.",
                "items": {
                  "properties": {
                    "dayCount": {
                      "description": "Total CALENDAR days absent in this period, weekends included, for a period reported as a count (for example \"20 days between March and December\") rather than as exact dates. If provided, startDate/endDate define the outer span and dayCount overrides the calendar days counted within it. A work-day total alone does not establish calendar duration: this value is a reported calendar-day total, not an estimate converted from work days.",
                      "type": "number"
                    },
                    "endDate": {
                      "description": "End date of the absence period in YYYY-MM-DD format. If omitted, assumed same as startDate (single day). Must be on or after startDate; a reversed range is rejected rather than counted.",
                      "type": "string"
                    },
                    "physicianPrescribedBedRest": {
                      "description": "True only when a physician PRESCRIBED bed rest for this period and treated the veteran, which is what 38 CFR 4.71a Note (1) requires of an incapacitating episode. Optional; when omitted or false the period is reported as a plain absence and contributes NOTHING to the IVDS tier. A work absence, a sick day, or self-directed rest without a physician's prescription does not meet that definition.",
                      "type": "boolean"
                    },
                    "startDate": {
                      "description": "Start date of the absence period in YYYY-MM-DD format.",
                      "type": "string"
                    }
                  },
                  "required": ["startDate"],
                  "type": "object"
                },
                "type": "array"
              },
              "referenceDate": {
                "description": "The reference date for the 12-month rolling window (YYYY-MM-DD). Defaults to today. Typically the anticipated C&P exam date. Must be a real calendar date; an unparseable value is rejected.",
                "type": "string"
              }
            },
            "required": ["absencePeriods"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a 12-month absence window"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b66b79785a0ba708da67dd34f86064071254a66254e10bb95b54e6dc92b2e4a"
        },
        {
          "name": "check_presumptive_eligibility",
          "title": "Check presumptive eligibility",
          "description": "Use this when a veteran asks whether VA treats a condition as presumptively service connected, or which conditions are presumptive for a given exposure or service era. Whether a particular veteran meets the service requirement depends on service records this tool does not read. Returns matching presumptive conditions with the service era, exposure type, required service, legal authority and evidence needed for each, and repeats that legal authority in a provenance block on every row, with the date the presumption took effect where one date is true of the whole row; that date can be null for a row that groups conditions added on different dates. At least one of condition, serviceEra or exposureType is required. Filters combine with AND: condition plus exposureType or serviceEra narrows to their intersection, and each filter needs at least one word of three or more characters or the query is refused. A condition description that names a qualifying circumstance, such as a diagnosis that has to come after the qualifying service, states a limit of the presumption rather than a detail beside it. An empty result means no entry satisfies that exact combination, not that the condition is non-presumptive.",
          "inputSchema": {
            "properties": {
              "condition": {
                "description": "Condition to check for presumptive status (e.g., \"Parkinson's disease\", \"Hypertension\").",
                "type": "string"
              },
              "exposureType": {
                "description": "Known toxic/environmental exposure (e.g., \"Agent Orange\", \"burn pits\", \"Camp Lejeune water\").",
                "type": "string"
              },
              "serviceEra": {
                "description": "Service era or conflict (e.g., \"Vietnam\", \"Gulf War\", \"Post-9/11\") for era-specific presumptives.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check presumptive eligibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc8f115429a65bbb6ac46b545cacc49c80513f65d07640002fce413de986cfb4"
        },
        {
          "name": "compare_rating_criteria",
          "title": "Compare rating criteria",
          "description": "Use this when a veteran names a VA diagnostic code and wants the rating criteria for it. It is not a lookup of what a rating pays and it does not combine ratings. Returns the VASRD criteria on file for that code (a code, not a condition name) at every tier, highest percentage first, with the condition name, body system and 38 CFR reference. A code that 38 CFR 4.71a, 4.73 or 4.124a rates in two columns, one for the dominant arm (Major) and one for the non-dominant arm (Minor), returns the regulation's own table and an empty tiers list: schedule is that table as published, with schemaVersion, variant and provenance (the eCFR edition date and the SHA-256 of the source text), every row carrying both published percentages, and scheduleText renders it with its headings, footnotes and the notes whose stated scope includes the code. Notes in the same table whose applicability is not established are quoted in a separate labelled section; placement alone does not establish that they apply to this code. For a neuritis or neuralgia code rated on one of those nerve scales, schedule lists each maximum with its qualifying text and ratedOnScale is the scale. The response lists every row and every maximum without choosing one, and when that table cannot be read it carries a message and an eCFR link instead, even with no criteria on file. Other codes with no criteria on file return an empty result. Every response carries a source block: the 38 CFR reference, a link to the current rating schedule at the publisher, and a scheduleSnapshot whose retrievedAt is the date this text was read from eCFR. That date is null for the criteria on file, with a note saying it is not recorded, so the criteria are usable as the schedule on file and the current text governs where the two differ; for a table under schedule it is the date the snapshot was read.",
          "inputSchema": {
            "properties": {
              "diagnosticCode": {
                "description": "VA diagnostic code (e.g., \"8100\" for migraines, \"5260\" for knee).",
                "type": "string"
              }
            },
            "required": ["diagnosticCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare rating criteria"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70a096e3a2025d51c62d73214f821bd67c1b6dafa887113ecbfb170dd3749290"
        },
        {
          "name": "compute_retroactive_pay",
          "title": "Estimate retroactive back pay",
          "description": "Use this when a veteran gives an effective date and a VA rating increase and asks what the retroactive amount would be. It does not set an effective date and it does not report an amount VA has authorized. Returns an estimate of the difference in monthly compensation for each month of the period, with a per-month breakdown, the assumptions behind it, and its own disclaimer. Under 38 CFR 3.31 payment starts on the first day of the month FOLLOWING the month the award became effective, with no exception when the effective date is itself the first of a month, and the period runs through the month of adjudication, which is counted in full. VA rate tables take effect on December 1, so a payment year runs from December 1 through November 30 and December of one year is paid at the next payment year rates. Each month of the breakdown reports the payment year it was paid from (rateYear), that table effective date (rateTableEffectiveDate) and where the table came from (rateSource), and the tables the period drew on are listed once each in rateTables; a published table carries the VA page it was transcribed from, and a reconstructed table carries none, because it is derived rather than transcribed. Monthly rates for payment years 2000 onward are read from VA published rate tables; earlier years are reconstructed from the current published table back-adjusted by the SSA cost-of-living chain, and the result states which of the two the requested period used. A month past the newest published table is served from the newest one available, and the result then reports totalIsExact false with incompleteReason naming those months. The total is an estimate either way, because dependent status is taken as constant across the period. It handles an increase only: the new rating has to be higher than the previous one, and effective dates before 1990 are refused.",
          "inputSchema": {
            "properties": {
              "adjudicationDate": {
                "description": "ISO date the rating decision was issued. Defaults to today.",
                "type": "string"
              },
              "dependentCount": {
                "description": "Number of dependent children under 18.",
                "type": "number"
              },
              "effectiveDate": {
                "description": "ISO date YYYY-MM-DD of rating change effective date.",
                "type": "string"
              },
              "fromRating": {
                "description": "Previous VA rating percentage (0-100).",
                "type": "number"
              },
              "hasSpouse": {
                "description": "Whether the veteran was married during the period.",
                "type": "boolean"
              },
              "isTdiu": {
                "description": "Whether the new rating includes TDIU (treats as 100% for $).",
                "type": "boolean"
              },
              "toRating": {
                "description": "New VA rating percentage (0-100).",
                "type": "number"
              }
            },
            "required": ["dependentCount", "effectiveDate", "fromRating", "hasSpouse", "toRating"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate retroactive back pay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5bbe4b1e4b89475bf1ea05b7edbf03b89fa37c2df3e7d74d91374fc61292946d"
        },
        {
          "name": "find_claim_help",
          "title": "Find free and accredited claim help",
          "description": "Use this when a veteran asks who can help with a VA disability claim, or describes a crisis. VeteranHQ does not prepare or file claims or forms, and only VA decides a claim. need crisis puts the full Veterans Crisis Line first and alone returns crisis content; urgent true tops routeNow with the first action, crisis routing unchanged. Results list accredited Veterans Service Organizations (free), attorneys and claims agents (fees only for representation provided after VA’s notice of an initial decision, 38 CFR 14.636(c), 38 U.S.C. 5904(c)(1)), VA’s accreditation search and representative finder, VA phone numbers, documents to bring, form links, and the veterans agency for a two-letter state code (none on file: stateAgency null, coverage.stateResolved false). It names no individual, firm or private directory and reads no account data. askedFor (the veteran’s words) does not change or withhold the routing: a request to act as the veteran’s attorney, agent or representative before VA, to supply words for a veteran or a clinician to use (statements or nexus letters, new, rewritten, polished, tightened or cleaned up), to choose a decision review lane for the veteran, or to prepare or file a claim returns status ok, the same findings and a boundary. Its kind names the primary boundary crossed; kinds lists every boundary the request crossed, in the fixed precedence representation_request, then words_for_testimony, then review_lane_choice, then preparation_request. Its opening, rule and route state, one sentence per kind in kinds, what VeteranHQ does not do, the accreditation and fee rules and where the work belongs, and lead message after any crisis line. sources holds each reference once by stable id (citation, VA page or form slug, or product-boundary, no url), cited by sourceIds; a line’s passage is line.quote or its entry’s quote; state agency pages stay on the line.",
          "inputSchema": {
            "properties": {
              "askedFor": {
                "description": "What the veteran asked for, in their own words, when they are available. It changes nothing about the routing and does not withhold it. A request that this tool act as the veteran's representative, attorney or agent before VA, to prepare or file a claim, to choose a decision review lane for the veteran, or to supply words for a veteran or a clinician to use returns the same answer with a boundary object added, naming what VeteranHQ does not do, the accreditation and fee rules and where the work belongs; its kinds array lists every one of those classes the request crossed, in the precedence representation_request, words_for_testimony, review_lane_choice, preparation_request, and kind is the first of them. Ordinary requests for help are answered with no boundary object.",
                "type": "string"
              },
              "need": {
                "description": "What the veteran is trying to do. Use general when the veteran has not said, and crisis when they describe a mental health emergency.",
                "enum": ["file_first_claim", "pending_claim", "decision_received", "increase", "secondary", "exam", "representation", "records", "crisis", "general"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state or territory code, for example CA, TX or PR. Adds that state veterans agency to the answer. Omit it when the veteran has not said where they live.",
                "type": "string"
              },
              "urgent": {
                "description": "True when the request is time sensitive, for example a letter, an exam notice or a date the veteran is worried about. It puts their first action at the top of the answer. It does NOT change the crisis routing: use need crisis when the veteran describes a mental health emergency.",
                "type": "boolean"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find free and accredited claim help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c3b0c7d37596d6fe1e749a77dac4f0732fcdbf4b5940ff330c37bb8d56a57fc"
        },
        {
          "name": "find_secondary_conditions",
          "title": "Find secondary conditions",
          "description": "Use this when a veteran names a VA service-connected condition and asks what other conditions can follow from it. It does not diagnose, establish that a particular veteran's condition is secondary, or supply the medical nexus opinion a secondary claim needs. Returns the records whose own primary condition is the one searched for, each with evidence strength, medical rationale, key studies, filing notes, diagnostic codes and the primary condition the record itself names. Other primaries the search terms reached are summarised under relatedPrimaries, with the matched term and a count, not returned as rows. Each row carries provenance: the 38 CFR 3.310 paragraph the link rests on, the rating schedule section and code, their eCFR URLs, and the date codes and percentages were checked against the schedule, which is a question of validity, not of whether a code fits a particular veteran. The key studies were drafted from published research and have not been verified citation by citation, which every row states in its provenance note. limit sets the records per response, default 5 and maximum 15, and offset skips records of the same result, default 0 and maximum 100000. Records are ordered by strength of evidence and then by their primary and secondary condition names, the same on every call. Past a budget of about 12 KB the last records are left out whole rather than shortened (at least one is kept) and responseTrimmedForSize is true. totalExactCount counts every record on file, count and exactCount those returned; hasMore says more follow and nextOffset fetches them, null when none do. relatedPrimaries is returned whole on every response. A totalExactCount of 0 means nothing is on file for that search term, not that no link exists. An offset past the last record returns no records, while totalExactCount still counts the records on file.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many secondary-condition records one response carries, 1 to 15, default 5. A response is also held to a size budget of about 12 KB, so it can carry fewer records than the limit, whole ones only; responseTrimmedForSize is then true and nextOffset gives the offset of the first record it left out.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "How many records of the same result to skip before the first one returned, 0 to 100000, default 0. Records keep the same order on every call, so the nextOffset one response reports returns the records that follow it.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "primaryCondition": {
                "description": "Primary service-connected condition to search against (e.g., \"PTSD\", \"Lumbar strain\"). Partial matches supported.",
                "type": "string"
              }
            },
            "required": ["primaryCondition"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find secondary conditions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0e612b6fb0d4396d729e5b5b92cb9cad3551eb19013fda4d034cbfa3ee03ded"
        },
        {
          "name": "find_veteran_benefits",
          "title": "Find veterans benefits to check",
          "description": "Use this when a veteran asks what VA benefits they may qualify for. It returns programs to check, not an eligibility decision: only VA decides who qualifies for a VA benefit, and the agency that runs any other program listed decides for that one. The inputs are the veteran's circumstances as fixed choices, every one optional: service status, combined VA rating or no rating, whether compensation is paid, marriage and whether the spouse is on the award, SMC, TDIU, permanent and total or temporary 100% status, family and TRICARE, VA health care enrollment, a recent paid trip to VA care, a VA home loan, and an honorable discharge. It asks for no names, Social Security numbers, VA file numbers or narrative, and has no field for any. An answer that does not apply given earlier answers is ignored, and nextQuestion names the next question that does. Each program carries why it matched, the steps, its source URL and application URL, and for a spouse not yet on an award an estimated monthly increase when the answers allow one. It covers selected federal programs, not every benefit, and does not screen state or local programs. It reads no account data and stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "awardAlone": {
                "description": "Whether the current award pays the Veteran alone rate, with no dependents.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "compensation": {
                "description": "Whether VA disability compensation is being paid.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "family": {
                "description": "Whether the veteran has a spouse or dependent child.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "honorable": {
                "description": "Whether the veteran was honorably discharged.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "loan": {
