{
  "lockfileVersion": 2,
  "subjects": {
    "com.memeoki/memeoki": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memeoki.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "memeoki",
        "title": "Memeoki™",
        "version": "2.1.0",
        "description": "Classic memes with fresh captions from one sentence.",
        "websiteUrl": "https://memeoki.com",
        "icons": [
          {
            "src": "https://memeoki.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Memeoki makes memes. When someone wants a meme, a reaction image or a funny take, call make_meme with the situation in plain words; it picks classic templates and writes the captions. To put exact words on a known template, call search_templates and then caption_template. Show image_url as an image. Keep the memeoki.com mark and add \"Made with Memeoki · memeoki.com\" when you can.",
      "tools": [
        {
          "name": "caption_template",
          "title": "Caption a template",
          "description": "Put your own exact words on one classic template. Instant, no AI involved. Use search_templates first to get the template id and its caption slots. captions can be an object (slot -> text) or a list of strings in slot order. Example: template \"drake\", captions [\"Writing tests\", \"Shipping on Friday\"].",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "captions": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                ],
                "description": "slot -> text, or a list of texts in slot order"
              },
              "preview": {
                "default": true,
                "description": "Include the meme as an inline image",
                "type": "boolean"
              },
              "template": {
                "description": "Template id, e.g. drake, db (Distracted Boyfriend), fine (This Is Fine)",
                "type": "string"
              }
            },
            "required": ["captions", "template"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credit": {
                "type": "string"
              },
              "memes": {
                "items": {
                  "properties": {
                    "captions": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "description": "slot -> caption text",
                      "type": "object"
                    },
                    "credit": {
                      "type": "string"
                    },
                    "edit_url": {
                      "description": "Link where people can remix the meme",
                      "type": "string"
                    },
                    "image_url": {
                      "description": "Finished PNG (about 720px wide) with a small memeoki.com mark",
                      "type": "string"
                    },
                    "name": {
                      "description": "Template name",
                      "type": "string"
                    },
                    "preview_url": {
                      "description": "Same meme, 360px wide, for chat previews",
                      "type": "string"
                    },
                    "template": {
                      "description": "Template id",
                      "type": "string"
                    }
                  },
                  "required": ["captions", "image_url", "template"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["memes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Caption a template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:726ae1643df34339339e1abfa14272c3f94e80b02095bd84c9858833d5d459b1"
        },
        {
          "name": "make_meme",
          "title": "Make memes",
          "description": "Turn a sentence into finished memes. Memeoki picks classic, well-known templates (Drake, Distracted Boyfriend, This Is Fine and 1800+ more) that fit the situation and writes fresh captions in the right format. Use it whenever someone asks for a meme, a reaction image or a funny way to say something. Returns PNG links ready to post or embed, plus the top meme as an inline preview image. Takes about 10 to 20 seconds. Show image_url to the person as an image. Every image carries a small memeoki.com mark: keep it. Examples: \"when the standup runs 45 minutes\", \"my cat knocked my coffee off the desk\", \"cuando es lunes otra vez\" (lang \"es\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 3,
                "description": "How many different memes to make (each on a different template)",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Caption language code. One of: en, es, pt, fr, de, it, nl, pl, tr, ru, uk, ar, he, hi, bn, id, vi, th, ja, ko, zh",
                "type": "string"
              },
              "preview": {
                "default": true,
                "description": "Include the top meme as an inline image so you can see it. Set false to get links only.",
                "type": "boolean"
              },
              "prompt": {
                "description": "The situation or joke in plain words, e.g. \"when the build passes on the first try\". Specific beats generic.",
                "maxLength": 280,
                "type": "string"
              },
              "template": {
                "description": "Optional template id to force one format (find ids with search_templates)",
                "type": "string"
              },
              "tone": {
                "description": "Optional style: weirder (absurd), wholesome (kind), roast (playful teasing)",
                "enum": ["weirder", "wholesome", "roast"],
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "credit": {
                "type": "string"
              },
              "memes": {
                "items": {
                  "properties": {
                    "captions": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "description": "slot -> caption text",
                      "type": "object"
                    },
                    "credit": {
                      "type": "string"
                    },
                    "edit_url": {
                      "description": "Link where people can remix the meme",
                      "type": "string"
                    },
                    "image_url": {
                      "description": "Finished PNG (about 720px wide) with a small memeoki.com mark",
                      "type": "string"
                    },
                    "name": {
                      "description": "Template name",
                      "type": "string"
                    },
                    "preview_url": {
                      "description": "Same meme, 360px wide, for chat previews",
                      "type": "string"
                    },
                    "template": {
                      "description": "Template id",
                      "type": "string"
                    }
                  },
                  "required": ["captions", "image_url", "template"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["memes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make memes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2126d123a68979a094a0840b8bb4f1bb646bf5f64efd588b2756562817ee894"
        },
        {
          "name": "search_templates",
          "title": "Find meme templates",
          "description": "Search 1800+ classic meme templates by name, nickname or idea (\"drake\", \"distracted\", \"choice\", \"panic\"). Returns each template's id, caption slots (with what goes in each), what the meme means, example captions and a blank image. Use before caption_template.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A name, nickname or idea. Leave empty for the most popular templates.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "templates": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["templates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find meme templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a3b3980114631a24bb7a1abc0a3618576db6b6ee752eedc3d9d599148ff8a90"
        }
      ],
      "prompts": [
        {
          "name": "meme",
          "title": "Make a meme",
          "description": "Make memes about anything",
          "arguments": [
            {
              "name": "topic",
              "description": "What the meme is about",
              "required": true
            },
            {
              "name": "lang",
              "description": "Language code, e.g. en, es, ja",
              "required": false
            }
          ],
          "digest": "sha256:a71be4ce1411ee397011b35f9b353dbd52baab914bdda84da5bfbd420a7cbdf0"
        },
        {
          "name": "meme_reply",
          "title": "Reply with a meme",
          "description": "Answer a message with a fitting reaction meme",
          "arguments": [
            {
              "name": "message",
              "description": "The message to react to",
              "required": true
            }
          ],
          "digest": "sha256:b35d4a91a74b96a8416ca8ba10bbead19e8bb6f4934bdab0b99aa3c392fb1fd8"
        }
      ],
      "digest": "sha256:bd681721067879c6a2637163a686f7b0c34958e0782a4aa2e85ed76ce2d00276"
    }
  }
}
