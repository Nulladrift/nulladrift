        {
          "name": "get_county_employment",
          "description": "Get county-level unemployment rate, employment, and labor force data.\n\n    Returns three time series for a specific county: unemployment rate (percent),\n    employment count, and labor force size.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA', 'NY').\n        county_fips: Three-digit county FIPS code as a string (e.g. '033' for King County, WA).\n        start_year: Start year for data (default 2020).\n        end_year: End year for data (default 2025).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "end_year": {
                "default": 2025,
                "title": "End Year",
                "type": "integer"
              },
              "start_year": {
                "default": 2020,
                "title": "Start Year",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["county_fips", "state"],
            "title": "get_county_employmentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_employmentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fe33b680ae17beb785460b0dfc754bd055a4482c63294a351ba352cd2c920df"
        },
        {
          "name": "get_cpi_data",
          "description": "Get national Consumer Price Index (CPI) data.\n\n    Returns the CPI-U (All Urban Consumers, All Items) monthly time series.\n    This is the headline CPI measure used for inflation tracking.\n    Base period: 1982-84=100.\n\n    Args:\n        start_year: Start year for data (default 2020).\n        end_year: End year for data (default 2025).\n    ",
          "inputSchema": {
            "properties": {
              "end_year": {
                "default": 2025,
                "title": "End Year",
                "type": "integer"
              },
              "start_year": {
                "default": 2020,
                "title": "Start Year",
                "type": "integer"
              }
            },
            "title": "get_cpi_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_cpi_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0aa7782c5461caafbaa75dd59df9d6c6925a1422c2e2a507f9adb6ae0f083491"
        },
        {
          "name": "get_labor_force_data",
          "description": "Get labor force participation, employment, and unemployment counts for a state.\n\n    Returns three time series: labor force size, employment count, and\n    unemployment count. All values are in thousands of persons.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA', 'NY').\n        start_year: Start year for data (default 2020).\n        end_year: End year for data (default 2025).\n    ",
          "inputSchema": {
            "properties": {
              "end_year": {
                "default": 2025,
                "title": "End Year",
                "type": "integer"
              },
              "start_year": {
                "default": 2020,
                "title": "Start Year",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_labor_force_dataArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_labor_force_dataOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:824c9f9b84488a9e6ad68ed577d06d54a8c86d43df7d19dfc7465628158fa885"
        },
        {
          "name": "get_unemployment_rate",
          "description": "Get unemployment rate time series from BLS LAUS data.\n\n    Returns monthly unemployment rates for a state or county. Data is returned\n    in chronological order with year, period, and percentage value.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA', 'NY').\n        county_fips: Optional 3-digit county FIPS code (e.g. '033' for King County).\n                     If provided, returns county-level data; otherwise state-level.\n        start_year: Start year for data (default 2020, min 4-digit year).\n        end_year: End year for data (default 2025).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "end_year": {
                "default": 2025,
                "title": "End Year",
                "type": "integer"
              },
              "start_year": {
                "default": 2020,
                "title": "Start Year",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_unemployment_rateArguments",
            "type": "object"
          },
          "outputSchema": {
