      "tools": [
        {
          "name": "idem.begin",
          "title": "Begin idempotency",
          "description": "Start an idempotency key or return the prior outcome. fingerprint is a hex hash. Call keys.create once. Pass caller_key on every later tools/call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "caller_key": {
                "description": "pf_ key from keys.create. Pass this on tools/call when Authorization and X-Caller-Key are not set. A header key wins if both are set.",
                "type": "string"
              },
              "fingerprint": {
                "pattern": "^[a-f0-9]{32,128}$",
                "type": "string"
              },
              "key": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "scope": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "ttl_s": {
                "maximum": 86400,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["fingerprint", "key", "scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c11424e0af8c05bc9be11526f34f99ea76ff1e9453c0e8c5baa9055be3cbae4b"
        },
        {
          "name": "idem.commit",
          "title": "Commit idempotency",
          "description": "Store the outcome reference for an idempotency key. scope (max 64) and owner are optional. When owner is omitted, the caller key hash is sent. Call keys.create once. Pass caller_key on every later tools/call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "caller_key": {
                "description": "pf_ key from keys.create. Pass this on tools/call when Authorization and X-Caller-Key are not set. A header key wins if both are set.",
                "type": "string"
              },
              "key": {
                "type": "string"
              },
              "owner": {
                "type": "string"
              },
              "result_ref": {
                "type": "string"
              },
              "scope": {
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["key", "result_ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:907eb9a900731123a32361d0dfdc2814f6d4b9e78b3d9f6e4307f3429805b0c3"
        },
