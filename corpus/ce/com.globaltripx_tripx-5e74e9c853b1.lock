{
  "lockfileVersion": 2,
  "subjects": {
    "com.globaltripx/tripx": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://globaltripx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "globaltripx",
        "title": "Global TripX",
        "version": "1.0.1",
        "websiteUrl": "https://globaltripx.com/ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Global TripX is a Korean/English/Japanese travel site. Use ask_tripx for travel questions, search_tripx_guides to find guides, and country_entry_check before international trips. Always show the returned links to the user so they can open the full page; mention the affiliate note when you recommend booking.",
      "tools": [
        {
          "name": "ask_tripx",
          "title": "Ask the Global TripX travel helper",
          "description": "Answer a travel question (destination, season, what to pack, entry rules, money, safety, food, airports) using only Global TripX guides, in Korean, English or Japanese. Returns a short answer plus the source pages. Covers 199 countries entry checks and 43,000+ places. Use it for trips from or to Korea and Japan especially.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Answer language: ko, en or ja (default: guessed from the question)",
                "enum": ["ko", "en", "ja"],
                "type": "string"
              },
              "question": {
                "description": "The traveller question, any language",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dcef419ebd767684fe21c0a2f7328798ae1b3c0d4f757314e417b081b3bdd929"
        },
        {
          "name": "country_entry_check",
          "title": "Before-you-fly check for a country",
          "description": "Get the Global TripX before-departure page for a country (entry/visa notes, travel advisories, health notes from Korean public data). Give a country name in any language.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Destination country name in any language (e.g. \"Vietnam\", \"베트남\", \"ベトナム\")",
                "type": "string"
              },
              "lang": {
                "description": "Language of the page: ko, en or ja (default: guessed from the country name). The 199-country check page is fullest in ko.",
                "enum": ["ko", "en", "ja"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a02c4b5255475c74d480df7a5319a92ef6931d7b4b3480783bc6dddd25dcba1"
        },
        {
          "name": "search_tripx_guides",
          "title": "Search Global TripX guides",
          "description": "Search Global TripX travel guides and tools (destination hubs, trip checklists, weather by month, safety numbers, food, holiday planner, airport tips). Returns titles, one-line summaries and links.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the guides to search: ko, en or ja (default: guessed from the query)",
                "enum": ["ko", "en", "ja"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return, 1-10 (default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, any language (e.g. \"Sapporo December packing\", \"오사카 아이랑\", \"台湾 SIM\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01e822ce214c08ce6670f39bd19bc6a8de72e632353c4e06977fdadb17bb19d4"
        }
      ],
      "digest": "sha256:5823660f8a9b763b20b1c865ac0179b3476bc5a864f1c67db7ab11e575d60f13"
    }
  }
}
