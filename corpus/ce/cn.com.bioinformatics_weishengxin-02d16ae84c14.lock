            "additionalProperties": true,
            "title": "draw_plotDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca206330aa1ecb4abafe3f0224e0c4393d2597c17c2d42c80c77cbc909e5e149"
        },
