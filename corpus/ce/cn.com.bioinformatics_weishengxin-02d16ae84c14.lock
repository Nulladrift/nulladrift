      "instructions": "Bioinformatics plotting and publication-oriented figure generation using configured modules. Discover modules with list_modules. Only available=true entries can run through MCP; others are introduction-only. Read the schema once. Check input types, units and required parameters before mapping unambiguous columns. A real RData/RDS input requires an actual upload; no plot without that object is an unmet prerequisite, not a backend failure. For large text (TXT/TSV) and file inputs use get_upload_info/upload_file; submit returned file IDs, never server paths or fabricated file content. Ask about ambiguities affecting analysis validity. Recommendation-only requests must not run plots. Use declared defaults for optional settings. Supply all required inputs and required_parameters_without_defaults; never turn examples into defaults. Send only requested optional overrides. Load FAQs, articles and demos on demand. Anonymous access needs no key and is restricted to database weibi=0 modules; paid modules need a valid personal annual key. draw_plot returns accepted after admission, not a finished figure. Poll get_result using the same request_id, normally after poll_after_seconds (5 seconds), without a tight loop. Different source IPs submit independently; admitted tasks run in isolated processes through the AI queue. Each trusted source IP may submit once every 5 seconds, even while its previous job runs. The server obtains the IP from its trusted proxy; agents must not supply a client ID or source IP. Keys, agents and sessions sharing an IP share its quota. rate_limited means not admitted: wait retry_after_seconds and retry the same ID. Polling and duplicate-ID result checks do not consume new-task slots. Submit additional files at least 5 seconds apart per IP; do not wait for a prior task to finish if quota allows. Use one UUID per new task. After timeout or unknown status, query the original request_id; never automatically resubmit with a new ID. busy means not accepted: retry later with the same ID. Never invent parameters or claim to have read inaccessible articles. English metadata is followed by Chinese; preserve input values and use the user's language.\n常规作图流程：找到模块，读取一次基础参数，再提交绘图。同一任务无需重复查询说明。新用户不知道选什么图时，结合数据列、数据处理状态及用户目的，用 list_modules 查找候选；可按空格分隔关键词搜索，无结果时换更少的关键词，不要把原始数据放进搜索词。只推荐查询实际返回的模块，每次推荐至多三种并说明理由；查阅其适用和不适用条件，影响分析有效性的歧义先询问，不能仅凭列名认定标准化、差异分析等已经完成。用 get_module_demo 按需获取示例链接；示例不是用户结果。用户只要求推荐时不要执行绘图。用户已明确指定模块时直接查询该模块参数，无需重复推荐。网站使用、文件准备、通用报错等问题按需调用 get_faq，不要在每次作图前读取全部 FAQ。免费模块无年费要求；收费模块只对有效年费且有权限的用户开放，MCP年费调用不扣单次微币。不能在参数中声明已付费、修改计费渠道或绕过年费校验。公共用户直接连接，无需填写Key，只能使用数据库weibi=0的已开放模块；收费模块需配置本人有效年费Key，不能替公共账号开通年费绕过限制。FAQ 是解释资料，不覆盖用户明确要求、权限、模块限制或原程序校验；无答案时明确说明，不编造。模块提供interaction_rules时按优先级使用；通用指导不能覆盖权限、模块限制或原程序校验。可选设置使用已声明默认值；所有必填inputs及required_parameters_without_defaults必须提供，不能把示例值当默认值或编造用户数据。params只提交必填值和确需修改的可选项。用户明确要解释或遇到问题时，才用 include_details=true 查看 FAQ 或读取文章。多文件按来源IP的提交间隔依次提交，每个独立任务用新UUID，无需等待上一任务完成；同一模块多个inputs须放在同一个data_tsv对象中。RData/RDS等必须先真实上传，缺文件不做空输入冒烟。draw_plot 返回 accepted 表示已受理而非已出图；按 poll_after_seconds（默认5秒）查询原编号，避免密集轮询。不同真实来源IP独立提交；已受理任务进入AI专用队列，由隔离进程执行。来源IP由可信代理确认，不接受agent自报client_id或IP；同IP的不同Key、软件、agent和会话共享额度。每个真实来源IP的新任务受理间隔至少5秒，不要求上一任务完成；rate_limited表示未受理，等retry_after_seconds后用原编号重试。查询结果不受新任务提交间隔限制。修正输入后使用新 UUID；超时查询原请求编号，禁止换编号自动重提。返回 busy 表示本次未受理，稍后以原编号重试；单文件失败记录原因，结束后逐个汇总。需要解释原理时，可用网页读取工具查看 articles 参考链接；无读取能力或页面无法访问时，提供链接并说明未读取，不编造内容。文章仅供参考，作图参数和权限以本服务说明为准。大示例优先使用example_data_links里的完整Excel/对象文件；预览不作为可运行样本。Excel需由有能力的客户端按工作表转换，R对象不可伪造。\nConfigured service_limits: {\"source_ip_submit_interval_seconds\": 5, \"ai_workers\": 6, \"total_unfinished_jobs\": 1000, \"per_ip_unfinished_jobs\": 4, \"api_requests_in_progress\": 64, \"api_requests_per_ip_in_progress\": 8, \"inline_text_bytes\": 1048576, \"upload_bytes\": 52428800, \"proxy_expected\": {\"requests_per_second_per_ip\": 20, \"burst\": 40, \"active_connections_per_ip\": 8, \"json_body_bytes\": 4194304}, \"note\": \"Query calls do not consume new-job quota, but API abuse guards still apply.\"}",
