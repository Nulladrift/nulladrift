        {
          "name": "draw_plot",
          "description": "Submit to the AI queue; each trusted source IP once per 5s. Agents cannot supply an identity. / 每个真实来源IP每5秒提交一次，不接受自报客户端标识；受理后排队执行，查询原编号获取结果。",
          "inputSchema": {
            "properties": {
              "data_tsv": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "Follow schema inputs: text/TSV for one input, or a name-to-text/reference object for multiple inputs. Supply all required inputs. File inputs require real uploaded IDs; total inline text <=1MiB. / 按inputs提交文本、TSV或上传引用，多个输入用同一个对象，必须满足全部必填输入；input_mode=none传空字符串或{}，文件输入须真实上传后传ID。内联文本合计最多1MiB。",
                "title": "Data Tsv"
              },
              "module_id": {
                "description": "Exact available module ID. / 当前可用的准确模块编号。",
                "title": "Module Id",
                "type": "string"
              },
              "params": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Supply required_parameters_without_defaults and requested optional overrides. Omit only values with defaults or optional fields. / 必须提供无默认值的必填参数；可选项才可省略或使用默认值，不得编造科学输入。",
                "title": "Params"
              },
              "request_id": {
                "description": "New UUID for a new task. On timeout query this ID; do not generate another automatically. / 新任务用新UUID，超时查询原编号，不自动换编号重提。",
                "title": "Request Id",
                "type": "string"
