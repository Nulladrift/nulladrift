          "description": "Finalize file_id for the same module_id and input_name. Return bytes, sha256, file_id and the data_tsv mapping. Compare bytes and sha256 with the local file before plotting. / 完成上传，返回字节数、哈希、文件编号和 data_tsv 映射；绘图前核对本地文件。",
          "inputSchema": {
