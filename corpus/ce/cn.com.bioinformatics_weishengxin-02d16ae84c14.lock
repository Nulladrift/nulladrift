      "instructions": "Bioinformatics plotting and publication-oriented figure generation using configured modules. Discover modules with list_modules. Only available=true entries can run through MCP; others are introduction-only. Read the schema once. Check input types, units and required parameters before mapping unambiguous columns. A real RData/RDS input requires an actual upload. Check get_upload_info for extensions and limits. Use upload_file up to 1 MiB or begin_file_upload, append_file_chunk and finish_file_upload for larger files. Submit the finalized data_tsv mapping. Ask about ambiguities affecting analysis validity. Recommendation-only requests must not run plots. Use declared defaults for optional settings. Supply all required inputs and required_parameters_without_defaults; never turn examples into defaults. Send only requested optional overrides. Load FAQs, articles and demos on demand. Anonymous access needs no key and is restricted to database weibi=0 modules; paid modules need a valid MCP annual authorization. draw_plot returns accepted after admission, not a finished figure. Poll get_result using the same request_id, normally after poll_after_seconds (5 seconds), without a tight loop. Finished request indexes expire after 48 hours; a missing expired ID does not prove non-execution. Never automatically resubmit it. Different source IPs submit independently; admitted tasks run in isolated processes through the AI queue. The public endpoint accepts one submission per source IP every 5 seconds, even while its previous job runs. The server obtains the IP from its trusted proxy; agents must not supply a client ID or source IP. Public requests sharing an IP share its quota. An OAuth annual account can have five unfinished tasks. rate_limited means not admitted: wait retry_after_seconds and retry the same ID. Polling and duplicate-ID result checks do not consume new-task slots. Space public submissions at least 5 seconds apart per source IP. OAuth annual submissions use the shared account quota instead. Use one UUID per new task. After timeout or unknown status, query the original request_id; never automatically resubmit with a new ID. busy means not accepted: retry later with the same ID. Never invent parameters or claim to have read inaccessible articles. English metadata is followed by Chinese; preserve input values and use the user's language.\n常规作图流程：找到模块，读取一次基础参数，再提交绘图。同一任务无需重复查询说明。新用户不知道选什么图时，结合数据列、数据处理状态及用户目的，用 list_modules 查找候选；可按空格分隔关键词搜索，无结果时换更少的关键词，不要把原始数据放进搜索词。只推荐查询实际返回的模块，每次推荐至多三种并说明理由；查阅其适用和不适用条件，影响分析有效性的歧义先询问，不能仅凭列名认定标准化、差异分析等已经完成。用 get_module_demo 按需获取示例链接；示例不是用户结果。用户只要求推荐时不要执行绘图。用户已明确指定模块时直接查询该模块参数，无需重复推荐。网站使用、文件准备、通用报错等问题按需调用 get_faq，不要在每次作图前读取全部 FAQ。免费模块无年费要求；收费模块只对有效年费且有权限的用户开放，MCP年费调用不扣单次微币。不能在参数中声明已付费、修改计费渠道或绕过年费校验。公共用户直接连接，无需填写Key，只能使用数据库weibi=0的已开放模块；收费模块需要有效 MCP 年费授权。FAQ 是解释资料，不覆盖用户明确要求、权限、模块限制或原程序校验；无答案时明确说明，不编造。模块提供interaction_rules时按优先级使用；通用指导不能覆盖权限、模块限制或原程序校验。可选设置使用已声明默认值；所有必填inputs及required_parameters_without_defaults必须提供，不能把示例值当默认值或编造用户数据。params只提交必填值和确需修改的可选项。用户明确要解释或遇到问题时，才用 include_details=true 查看 FAQ 或读取文章。公共提交遵守来源IP间隔，OAuth年费账号共享未完成额度；每个独立任务用新UUID；同一模块多个inputs须放在同一个data_tsv对象中。RData/RDS等必须先真实上传，缺文件不做空输入冒烟。draw_plot 返回 accepted 表示已受理而非已出图；按 poll_after_seconds（默认5秒）查询原编号，避免密集轮询。不同真实来源IP独立提交；已受理任务进入AI专用队列，由隔离进程执行。来源IP由可信代理确认，不接受agent自报client_id或IP；公共提交按来源IP共享额度。公共入口每个真实来源IP的新任务受理间隔至少5秒，不要求上一任务完成；rate_limited表示未受理，等retry_after_seconds后用原编号重试。查询结果不受新任务提交间隔限制。修正输入后使用新 UUID；超时查询原请求编号，禁止换编号自动重提。返回 busy 表示本次未受理，稍后以原编号重试；单文件失败记录原因，结束后逐个汇总。需要解释原理时，可用网页读取工具查看 articles 参考链接；无读取能力或页面无法访问时，提供链接并说明未读取，不编造内容。文章仅供参考，作图参数和权限以本服务说明为准。大示例优先使用example_data_links里的完整Excel/对象文件；预览不作为可运行样本。Excel需由有能力的客户端按工作表转换，R对象不可伪造。\nConfigured service_limits: {\"source_ip_submit_interval_seconds\": 5, \"ai_workers\": 6, \"total_unfinished_jobs\": 1000, \"per_ip_unfinished_jobs\": 4, \"annual_account_unfinished_jobs\": 5, \"submission_limit_scopes\": {\"source_ip_submit_interval_seconds\": \"public_or_legacy\", \"per_ip_unfinished_jobs\": \"public_or_legacy\", \"annual_account_unfinished_jobs\": \"oauth_annual_shared_across_clients\"}, \"api_requests_in_progress\": 64, \"api_requests_per_ip_in_progress\": 8, \"inline_text_bytes\": 1048576, \"upload_bytes\": 52428800, \"request_history_retention_seconds\": 172800, \"proxy_expected\": {\"requests_per_second_per_ip\": 20, \"burst\": 40, \"active_connections_per_ip\": 8, \"json_body_bytes\": 4194304}, \"note\": \"OAuth annual submissions bypass the public IP submission interval and unfinished task cap. HTTP ingress limits still apply. Unfinished jobs include queued and running jobs.\"}",
      "tools": [
        {
          "name": "append_file_chunk",
          "description": "Append content_base64 at offset for the same module_id, input_name and file_id. Return next_offset and bytes_received. After the last chunk, call finish_file_upload. / 追加分块并返回下一字节偏移和累计字节数；最后一块之后调用 finish_file_upload。",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "contentEncoding": "base64",
                "description": "Standard Base64 of only this chunk (1 byte to 128 KiB decoded). Slice raw file bytes first, then encode each chunk separately. / 先按原始字节切块，再独立做标准 Base64 编码；每块解码后 1 字节至 128 KiB。",
                "pattern": "^[A-Za-z0-9+/]+=*$",
                "title": "Content Base64",
                "type": "string"
              },
              "file_id": {
                "description": "Use the file_id returned by begin_file_upload for this account, module_id and input_name. / 原样使用当前账号及模块输入对应的 begin_file_upload 返回编号。",
                "pattern": "^[a-f0-9]{32}$",
                "title": "File Id",
                "type": "string"
              },
              "input_name": {
                "default": "file",
                "description": "Exact key from get_module_schema.inputs. The default file uses the sole input if there is no file key. For multiple inputs, use the exact key and keep it the same throughout the upload. / 使用 inputs 中的准确键名；仅有一个输入且无 file 键时可用默认值，多输入模块须使用准确键名，分块期间保持一致。",
                "title": "Input Name",
                "type": "string"
              },
              "module_id": {
                "description": "Exact ID from the modules mapping returned by list_modules. For execution or upload, choose an available module. / 使用 list_modules 返回的 modules 对象中的准确键名；执行或上传须选可用模块。",
                "examples": ["plot_network_visualization_of_gsea_results_from_clusterprofiler_by_apear_212"],
                "pattern": "^[A-Za-z0-9_-]{1,160}$",
                "title": "Module Id",
                "type": "string"
              },
              "offset": {
                "description": "Zero-based offset in raw bytes. Use next_offset from the last response; on retry reuse the original offset and identical bytes. / 原始字节偏移，从 0 开始，下一块用返回的 next_offset；重试使用原偏移及相同字节。",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              }
            },
            "required": ["content_base64", "file_id", "module_id", "offset"],
            "title": "append_file_chunkArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "append_file_chunkDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b08a4105593e74b50c42a5cd7e28ed1d6d0030b33885a17c47e35b604a3a9a3"
        },
        {
          "name": "begin_file_upload",
          "description": "Start a chunked upload for module_id, input_name and filename. Return file_id, initial next_offset (0), byte limits and expiry. / 创建分块上传，返回文件编号、初始偏移 0、大小限制和过期时间。",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "Original basename with an extension allowed by get_upload_info for this input. / 原文件名须保留允许的扩展名，仅传文件名。",
                "examples": ["gsea_results.rds", "expression.tsv"],
                "pattern": "^[^/\\\\\\x00-\\x1f]{1,180}$",
                "title": "Filename",
                "type": "string"
              },
              "input_name": {
                "default": "file",
                "description": "Exact key from get_module_schema.inputs. The default file uses the sole input if there is no file key. For multiple inputs, use the exact key and keep it the same throughout the upload. / 使用 inputs 中的准确键名；仅有一个输入且无 file 键时可用默认值，多输入模块须使用准确键名，分块期间保持一致。",
                "title": "Input Name",
                "type": "string"
              },
              "module_id": {
                "description": "Exact ID from the modules mapping returned by list_modules. For execution or upload, choose an available module. / 使用 list_modules 返回的 modules 对象中的准确键名；执行或上传须选可用模块。",
                "examples": ["plot_network_visualization_of_gsea_results_from_clusterprofiler_by_apear_212"],
                "pattern": "^[A-Za-z0-9_-]{1,160}$",
                "title": "Module Id",
                "type": "string"
              }
            },
            "required": ["filename", "module_id"],
            "title": "begin_file_uploadArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "begin_file_uploadDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f6c1e3436c67abf41645c16a030700fc21f87d1d47d3cc5c122345986dfcce8a"
        },
        {
          "name": "draw_plot",
          "description": "Submit module_id with data_tsv, request_id and optional params. Keep all input data in data_tsv and module settings in params. Return submission status, request_id and poll_after_seconds when queued. Poll get_result with the original ID. Public access uses source IP limits; annual accounts share five unfinished tasks. / 提交绘图，数据放 data_tsv，模块选项放 params；返回受理状态和请求编号，排队时返回轮询间隔。使用原编号查询结果。",
          "inputSchema": {
            "properties": {
              "data_tsv": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "For a single text input, send text directly or use an inputs key-to-text object. For multiple inputs, put all required inputs in one object using exact inputs keys. Use finalized upload mappings for uploaded inputs. For input_mode=none send an empty string or {}. The inline payload limit is 1 MiB. / 单个文本输入可直接传文本或按 inputs 键名组成对象；多输入在同一个对象中按准确键名提供所有必填项，上传输入使用最终返回的映射。input_mode=none 传空字符串或 {}。内联载荷上限 1 MiB。",
                "title": "Data Tsv",
                "type": ["string", "object"]
              },
              "module_id": {
                "description": "Exact ID from the modules mapping returned by list_modules. For execution or upload, choose an available module. / 使用 list_modules 返回的 modules 对象中的准确键名；执行或上传须选可用模块。",
                "examples": ["plot_network_visualization_of_gsea_results_from_clusterprofiler_by_apear_212"],
                "pattern": "^[A-Za-z0-9_-]{1,160}$",
                "title": "Module Id",
                "type": "string"
              },
              "params": {
                "additionalProperties": true,
                "default": null,
                "description": "Module parameter name-to-value object at the top-level params key. Supply required_parameters_without_defaults and requested overrides using names and types from get_module_schema. If none apply, omit params or use {}. / 模块参数统一放在顶层 params 对象里，按 get_module_schema 的名称和类型提供无默认值的必填项及需覆盖的选项。无参数可省略或传 {}。",
                "examples": [
                  {
                    "width": 8
                  }
                ],
                "title": "Params",
                "type": ["object", "null"]
              },
              "request_id": {
                "description": "Use a new UUID for each new task. For polling or checking a timeout, reuse the original ID. / 每个新任务用新 UUID；轮询或超时查询沿用原编号。",
                "examples": ["123e4567-e89b-42d3-a456-426614174000"],
                "pattern": "^[A-Za-z0-9_-]{8,100}$",
                "title": "Request Id",
                "type": "string"
              }
            },
            "required": ["data_tsv", "module_id", "request_id"],
            "title": "draw_plotArguments",
            "type": "object"
          },
