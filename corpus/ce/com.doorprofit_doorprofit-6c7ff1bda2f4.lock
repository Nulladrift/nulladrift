          "digest": "sha256:8160429ae489ebd792f66680dcfb3cbb4c10d00ec6121daef57c1bbdad25310f"
        },
        {
          "name": "get_neighborhood_data",
          "title": "Get Neighborhood Demographics & Economics",
          "description": "Profile of the neighborhood (or census block group) containing one US address or coordinate pair: demographics, median household income, home values, rent by bedroom count, education attainment, cost-of-living indices, climate and natural-disaster risk. Use this when the question is about who lives in an area or what it costs to live there. Do NOT use it for crime or safety scores (use get_crime_data) — no crime data is returned here. Pass either address or lat+lng, not both. The neighborhood field is null where no data exists for the location. US locations only; requires a DoorProfit API key and consumes 1 call from that key's quota, except for the free test address \"500 Main St, Dallas, TX 75202\".",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full US street address, e.g. \"500 Adams St, Tulsa, OK\". Provide either address OR lat+lng.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (use together with lng, as an alternative to address).",
                "type": "number"
              },
              "lng": {
                "description": "Longitude (use together with lat, as an alternative to address).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "location": {
                "additionalProperties": true,
                "description": "The resolved location for the query.",
                "properties": {
                  "address": {
                    "description": "Formatted address.",
                    "type": ["string", "null"]
                  },
                  "city": {
                    "type": ["string", "null"]
                  },
                  "county": {
                    "type": ["string", "null"]
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "state": {
                    "description": "Two-letter state code.",
                    "type": ["string", "null"]
                  },
                  "zipcode": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "neighborhood": {
                "additionalProperties": true,
                "description": "Neighborhood data; null when no data exists for the location.",
                "properties": {
                  "cost_of_living": {
                    "additionalProperties": true,
                    "description": "Cost indices (100 = national average).",
                    "type": "object"
                  },
                  "data_source": {
                    "description": "\"neighborhood\" or \"block_group\".",
                    "type": "string"
                  },
                  "demographics": {
                    "additionalProperties": true,
                    "description": "Population, density, median age, gender, race, and age distribution.",
                    "type": "object"
                  },
                  "education": {
                    "additionalProperties": true,
                    "description": "Education attainment percentages.",
                    "type": "object"
                  },
                  "housing": {
                    "additionalProperties": true,
                    "description": "Median home value, households, year built, occupancy.",
                    "type": "object"
                  },
                  "income": {
                    "additionalProperties": true,
                    "description": "Median/average household income and income distribution.",
                    "type": "object"
                  },
                  "name": {
                    "description": "Named neighborhood, when one exists.",
                    "type": ["string", "null"]
                  },
                  "rent": {
                    "additionalProperties": true,
                    "description": "Median/average rent, by bedroom count.",
                    "type": "object"
                  },
                  "weather": {
                    "additionalProperties": true,
                    "description": "Temperatures, precipitation, and natural disaster risk indices.",
                    "type": "object"
                  }
                },
                "type": ["object", "null"]
              },
              "success": {
                "type": "boolean"
              },
              "test_mode": {
                "description": "True when querying the free test address.",
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
