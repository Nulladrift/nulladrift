        },
        {
          "name": "search_offenders",
          "title": "Search Registered Offenders",
          "description": "Search US registered offenders in one of two modes. Location mode: pass address or lat+lng, plus an optional radius in miles (default 1, capped at 3); results include each offender's distance from the search point. Name mode: pass at least one of first_name, last_name or dob, optionally narrowed by city/state/zipcode — those three filters alone are not accepted. Location parameters take precedence when both are supplied. Use this only for registered-offender questions; for an overall safety grade use get_crime_data instead. Results are paginated (page, limit, max 100 per page) and each page requested requires a DoorProfit API key and consumes 1 call from that key's quota.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full US street address, e.g. \"500 Adams St, Tulsa, OK\". Provide either address OR lat+lng.",
                "type": "string"
              },
              "city": {
                "description": "City filter for name-based searches.",
                "type": "string"
              },
              "dob": {
                "description": "Date of birth, YYYY-MM-DD.",
                "type": "string"
              },
              "first_name": {
                "description": "First name for name-based searches.",
                "type": "string"
              },
              "last_name": {
                "description": "Last name for name-based searches.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (use together with lng, as an alternative to address).",
                "type": "number"
              },
              "limit": {
                "description": "Results per page (default 50, max 100).",
                "type": "integer"
              },
              "lng": {
                "description": "Longitude (use together with lat, as an alternative to address).",
                "type": "number"
              },
              "page": {
                "description": "Page number (default 1).",
                "type": "integer"
              },
              "radius": {
                "description": "Search radius in miles for location searches (default 1, max 3).",
                "type": "number"
              },
              "state": {
                "description": "Two-letter state code filter, e.g. \"OK\".",
                "type": "string"
              },
              "zipcode": {
                "description": "Zipcode filter for name-based searches.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "offenders": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "address": {
                      "type": ["string", "null"]
                    },
                    "age": {
                      "type": ["integer", "string", "null"]
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "distance": {
                      "description": "Miles from the search point.",
                      "type": ["number", "null"]
                    },
                    "lat": {
                      "type": ["number", "null"]
                    },
                    "lng": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "offense": {
                      "description": "Primary offense description.",
                      "type": ["string", "null"]
                    },
                    "photo": {
                      "description": "Photo URL.",
                      "type": ["string", "null"]
                    },
                    "risk_level": {
                      "type": ["string", "null"]
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "zipcode": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "offenders_count": {
                "description": "Results on this page.",
                "type": "integer"
              },
              "page": {
                "type": "integer"
              },
              "radius": {
                "description": "Search radius in miles (location searches only).",
                "type": ["number", "null"]
              },
              "search_type": {
                "description": "\"gis\" for location searches, \"name\" for name searches.",
                "type": "string"
              },
              "success": {
                "type": "boolean"
              },
              "test_mode": {
                "type": "boolean"
              },
              "total_count": {
                "description": "Total matching results.",
                "type": "integer"
              },
              "total_pages": {
                "type": "integer"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
