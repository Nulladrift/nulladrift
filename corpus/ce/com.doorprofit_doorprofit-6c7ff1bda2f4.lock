      "serverInfo": {
        "name": "doorprofit",
        "title": "DoorProfit Crime & Neighborhood Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "DoorProfit provides US crime, safety, neighborhood, and registered-offender data. Authentication: a DoorProfit API key is required for tool calls, sent as \"Authorization: Bearer <key>\" (get a free key at https://api.doorprofit.com/signup). Quotas: every data tool call consumes 1 API call from the key's monthly/daily plan quota; get_api_usage is free and reports remaining quota. If a call fails with QUOTA_EXCEEDED or DAILY_LIMIT_EXCEEDED, tell the user their DoorProfit quota is exhausted and they can upgrade at https://api.doorprofit.com/billing. The address \"500 Main St, Dallas, TX 75202\" is a free test address that never consumes quota. Docs: https://api.doorprofit.com/docs/",
      "tools": [
        {
          "name": "get_api_usage",
          "title": "Check API Usage & Quota",
          "description": "Report the plan, monthly and daily call usage, remaining quota, reset times, rate limit and overage status for the DoorProfit API key authenticating this session. Takes no arguments — it always describes the calling key, never another account. Call it when the user asks how many calls they have left, or after any other tool returns QUOTA_EXCEEDED or DAILY_LIMIT_EXCEEDED, to confirm the limit and reset time before suggesting an upgrade. This is the only tool that never consumes quota.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data": {
                "additionalProperties": true,
                "properties": {
                  "account": {
                    "additionalProperties": true,
                    "description": "Account and subscription status.",
                    "type": "object"
                  },
                  "daily": {
                    "additionalProperties": true,
                    "description": "Daily limit, used, remaining, and reset time.",
                    "type": "object"
                  },
                  "monthly": {
                    "additionalProperties": true,
                    "description": "Monthly limit, used, remaining, and reset time.",
                    "type": "object"
                  },
                  "overage": {
                    "additionalProperties": true,
                    "description": "Overage billing status (paid plans).",
                    "type": "object"
                  },
                  "plan": {
                    "additionalProperties": true,
                    "description": "Plan type, name, and monthly price.",
                    "type": "object"
                  },
                  "rate_limit": {
                    "additionalProperties": true,
                    "description": "Requests-per-second limit.",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:af6a5a891e4c3ed4a20c9acca5f466a98505077e63d7bb388cdf25c0b45d3e2c"
        },
        {
          "name": "get_crime_data",
          "title": "Get Crime Data & Safety Score",
          "description": "Crime safety grade and nearby incident counts for one US address or coordinate pair. Returns a letter score (A+ safest through F), a short description of that grade, and — in cities where police publish incident data — counts by crime type within 1000ft for the same period the grade was built from (date_from/date_to; this varies by city and is not a live feed). incidents is null where we do not have incident data; a count of 0 means none were reported in that period. There is no national-average breakdown and no list of individual incidents. Use this for \"is this address/neighborhood safe?\" questions. Do NOT use it for demographics, income, rent or schools (use get_neighborhood_data) or for registered offenders (use search_offenders) — neither is included here. Pass either address or lat+lng, not both. US locations only; requires a DoorProfit API key and consumes 1 call from that key's quota, except for the free test address \"500 Main St, Dallas, TX 75202\".",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Full US street address, e.g. \"500 Adams St, Tulsa, OK\". Provide either address OR lat+lng.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (use together with lng, as an alternative to address).",
                "type": "number"
              },
              "lng": {
                "description": "Longitude (use together with lat, as an alternative to address).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "crime_description": {
                "description": "Human-readable explanation of the score.",
                "type": ["string", "null"]
              },
              "crime_numeric": {
                "description": "0-1 scale where 1 is safest.",
                "type": ["number", "null"]
              },
              "crime_score": {
                "description": "Letter safety grade from A+ (safest) to F.",
                "type": ["string", "null"]
              },
              "crime_score_source": {
                "description": "\"incidents\" when the grade comes from reported incidents on that block, \"block_group\" otherwise.",
                "type": ["string", "null"]
              },
              "incidents": {
                "additionalProperties": false,
                "description": "Incident counts within radius_feet for date_from through date_to. Null when this city does not publish incident data.",
                "properties": {
                  "by_type": {
                    "additionalProperties": false,
                    "description": "Counts for the 12 types the grade uses. Every key is present; 0 means none reported.",
                    "properties": {
                      "arson": {
                        "type": "integer"
                      },
                      "assault": {
                        "type": "integer"
                      },
                      "burglary": {
                        "type": "integer"
                      },
                      "drug_offense": {
                        "type": "integer"
                      },
                      "kidnapping": {
                        "type": "integer"
                      },
                      "murder": {
                        "type": "integer"
                      },
                      "robbery": {
                        "type": "integer"
                      },
                      "sexual_offense": {
                        "type": "integer"
                      },
                      "shooting": {
                        "type": "integer"
                      },
                      "theft": {
                        "type": "integer"
                      },
                      "vandalism": {
                        "type": "integer"
                      },
                      "weapons": {
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "count": {
                    "description": "Sum of by_type.",
                    "type": "integer"
                  },
                  "date_from": {
                    "description": "YYYY-MM-DD start of the city scoring period.",
                    "type": "string"
                  },
                  "date_to": {
                    "description": "YYYY-MM-DD end of the city scoring period.",
                    "type": "string"
                  },
                  "radius_feet": {
                    "type": "integer"
                  }
                },
                "type": ["object", "null"]
              },
              "location": {
                "additionalProperties": true,
                "description": "The resolved location for the query.",
                "properties": {
                  "address": {
                    "description": "Formatted address.",
                    "type": ["string", "null"]
                  },
                  "city": {
                    "type": ["string", "null"]
                  },
                  "county": {
                    "type": ["string", "null"]
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "state": {
                    "description": "Two-letter state code.",
                    "type": ["string", "null"]
                  },
                  "zipcode": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "success": {
                "type": "boolean"
              },
              "test_mode": {
                "description": "True when querying the free test address.",
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
