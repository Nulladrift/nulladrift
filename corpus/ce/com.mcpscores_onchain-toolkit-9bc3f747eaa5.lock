{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/onchain-toolkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://onchain-toolkit.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/onchain-toolkit",
        "title": "MCPFax On-Chain Toolkit",
        "version": "1.0.2",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "On-chain facts for the seconds before you transact: live gas across Ethereum, Base, Arbitrum, Optimism and Polygon; an ERC-20's decimals and symbol read from the contract; whether a transaction actually succeeded; and an address's balance and next nonce. Tool calls are x402-paid in USDC on Base — send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). gas_now, token_info and tx_status cost $0.005; address_info $0.008. An unpaid call returns a PaymentRequired result and settles nothing; initialize, ping and tools/list are free, as are request_data and demand_report. An unknown transaction or an address with no contract code is reported honestly and is NOT charged. These values are perishable: call again rather than caching.",
      "tools": [
        {
          "name": "address_info",
          "title": "Balance, next nonce, and whether an address is a contract",
          "description": "Native balance, the next nonce to use, and whether the address holds contract code — the three things needed before sending from or to an address. Pass 'token' as well to read an ERC-20 balance for the same address in the same call. Values are read at the latest block, so a reorg can change them. Costs $0.008 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "0x-prefixed 20-byte address.",
                "examples": ["0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"],
                "type": "string"
              },
              "chain": {
                "description": "ethereum, base, arbitrum, optimism or polygon. Defaults to base.",
                "examples": ["base"],
                "type": "string"
              },
              "token": {
                "description": "Optional ERC-20 contract address to also report that token's balance.",
                "examples": ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f11169858f1b3d2c5b09115699d7f48e5e5303ebe638229227efe97c12759353"
        },
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:461261ad42bf84d61377fdd16143b94cfa57291dcfeff96122da0471054405cb"
        },
        {
          "name": "gas_now",
          "title": "Current gas price on one or several chains",
          "description": "Live gas price on Ethereum, Base, Arbitrum, Optimism or Polygon — in wei and gwei, plus what a plain 21,000-gas transfer would cost in the native token, which is the number you actually budget with. Pass several chains comma-separated to compare where to execute. Call this immediately before sending a transaction: gas moves every block, so the answer is good for seconds, not minutes. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "One or more of ethereum, base, arbitrum, optimism, polygon — comma-separated, e.g. 'base,ethereum'. Defaults to base.",
                "examples": ["base"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ae548610bb93e8c468a0dda2faa819e6be0508d66fde3bd8709711ce9cd983a"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just on-chain data — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so repeatedly-requested data gets built. Nothing identifying is stored, only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c17e2e679361ce1d2c68f843d383647872155179057bb6bcdda11e3560b45623"
        },
        {
          "name": "token_info",
          "title": "ERC-20 token details by contract address",
          "description": "Read an ERC-20's name, symbol, decimals and total supply straight from the contract on the chain you name, and confirm the address actually has code there. Use before quoting an amount or building a transfer: getting decimals wrong is the classic way to send 1,000,000x the intended value. An address with no code, or a contract that is not an ERC-20, is reported as such and is NOT charged. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "0x-prefixed 20-byte contract address.",
                "examples": ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"],
                "type": "string"
              },
              "chain": {
                "description": "ethereum, base, arbitrum, optimism or polygon. Defaults to base.",
                "examples": ["base"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28a2ca6b03c6579def7793ef8295708b5c2c04185391981dab30192bdf8ddfaa"
        },
        {
          "name": "tx_status",
          "title": "Did this transaction succeed?",
          "description": "Status of a transaction by hash: success, failed or still pending, with the block it landed in, sender and recipient, value moved, gas used, the fee actually paid, and how many logs it emitted. Use to confirm an action you took really settled rather than assuming it did. An unknown hash is reported as not_found and is NOT charged. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "ethereum, base, arbitrum, optimism or polygon. Defaults to base.",
                "examples": ["base"],
                "type": "string"
              },
              "hash": {
                "description": "0x-prefixed 32-byte transaction hash.",
                "examples": ["0x08001b920b214572ff2e7a4fc4560bafa717619b00b91561425ef6a325fdfedb"],
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d967e5b225b505b2f404d1a73f45f5ec61077a00654a5ddce6af4b424c03629c"
        }
      ],
      "digest": "sha256:aa7aabad483522b9897310cdb954b8963d8d4898f57c0f536ed657662b6c21d4"
    }
  }
}
