      "serverInfo": {
        "name": "com.answeringprices/pricing",
        "title": "AnsweringPrices.com pricing",
        "version": "1.0.0",
        "websiteUrl": "https://www.answeringprices.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "category_range",
          "title": "Price range and median for a type of answering service",
          "description": "The range and median comparison cost of live, AI or hybrid answering services at a call volume (3-minute calls), the all-in rate per minute, the published overage range, and which narrower service sets an end of the range. AnswerAmerica's cost is the upfront prepaid purchase with credit rollover. Source: AnsweringPrices.com, prices checked November 8, 2026, https://www.answeringprices.com/answering-service-statistics/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "default": 100,
                "description": "Calls a month",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "category": {
                "description": "Type of service",
                "enum": ["live", "ai", "hybrid"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:403bd7f58ae02691e09e582d2eabd8d49fd3807803a08168c4395e10aef47a02"
        },
        {
          "name": "compare_at_volume",
          "title": "Compare answering services at a call volume",
          "description": "Comparison cost of every answering service at a call volume and call length, lowest first: monthly plans, or the minimum upfront package purchase for AnswerAmerica's prepaid credits. Quote-only vendors are listed separately. Defaults: live services, 3-minute calls. AnswerAmerica and ReceptionHQ MessageExpress take messages only; Alert Communications serves law firms only. Source: AnsweringPrices.com, prices checked November 8, 2026, https://www.answeringprices.com/answering-service-cost/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "description": "Calls a month",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "category": {
                "default": "live",
                "description": "live includes hybrid services",
                "enum": ["live", "ai", "all"],
                "type": "string"
              },
              "minutes_per_call": {
                "default": 3,
                "description": "Average billed minutes per call",
                "maximum": 60,
                "minimum": 0.5,
                "type": "number"
              },
              "vendors": {
                "description": "Only these vendors (ids or names)",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["calls"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/answeringprices-table.html",
            "openai/toolInvocation/invoked": "Prices ready",
            "openai/toolInvocation/invoking": "Reading the price index",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:0c1a425a4957fcf8c9c347a0e25f27083bcf8ea5f3e66bc8f5e0e3686c5757c6"
        },
        {
          "name": "get_vendor_pricing",
          "title": "A vendor's prices and billing terms",
          "description": "One answering service's published plans, overage, comparison cost at 50, 100 and 200 three-minute calls, and its billing terms (rounding, time billed beyond the call, spam, setup fee, contract, trial) summarized from its own terms page, each with the URL and the date it was read. AnswerAmerica uses upfront prepaid package purchases with credit rollover. Accepts an id or a name, e.g. \"PATLive\", \"Ruby\", \"VoiceNation\". Source: AnsweringPrices.com, prices checked November 8, 2026, https://www.answeringprices.com/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vendor": {
                "description": "Vendor id or name",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/answeringprices-table.html",
            "openai/toolInvocation/invoked": "Prices ready",
            "openai/toolInvocation/invoking": "Reading the price index",
            "openai/widgetAccessible": false
          },
          "digest": "sha256:f71c889f66161f85e9bf62926f7cb6b3ea7be21b9b1507c806140284c2191165"
        },
        {
          "name": "list_vendors",
          "title": "List answering services in the price index",
          "description": "Every answering service AnsweringPrices.com prices (live, AI and hybrid), with its entry plan, whether it publishes prices, and the date its pricing page was read. Use it to find a vendor's id. Source: AnsweringPrices.com, prices checked November 8, 2026, https://www.answeringprices.com/pricing/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "default": "all",
                "description": "Filter by service type",
                "enum": ["live", "ai", "hybrid", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
