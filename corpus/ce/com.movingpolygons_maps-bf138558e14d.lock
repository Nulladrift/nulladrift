          "digest": "sha256:5d9ef8ed876d40e3282fea5dd0f58f6c58e348141552e4d45452b85e7444c78e"
        },
        {
          "name": "create_upload_link",
          "title": "Create an upload link",
          "description": "A one-off link (valid 15 minutes) for uploading a map JSON file of up to 40 MB with curl. It creates a new draft map, or with mode replace overwrites an existing map's content. The curl output reports the result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mapId": {
                "description": "Required for mode replace",
                "type": "string"
              },
              "mode": {
                "description": "create (default): a new map. replace: overwrite mapId's content",
                "enum": ["create", "replace"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c7e5c376528f98b83a02b350d01d662c7f731b655acd0cd728b13429d640e217"
        },
