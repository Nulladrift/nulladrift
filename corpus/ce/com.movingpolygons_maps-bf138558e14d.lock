        {
          "name": "replace_map_content",
          "title": "Replace a map's content",
          "description": "Overwrite an existing map's layers, markers, name, description and casualty bar (and style, if given) with an import JSON of up to about 1 MB. The link and publish state stay; the old content is backed up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
