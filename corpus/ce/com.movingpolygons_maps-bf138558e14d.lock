        },
        {
          "name": "get_import_format",
          "title": "Get the map import format",
          "description": "The JSON format for maps: layers with timed polygon keyframes, point markers and a style.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d133559ff72feb7c49b5ca115ce04485488de6cc20c94c4746e85c378443b541"
        },
        {
          "name": "get_map",
          "title": "Get a map",
          "description": "A summary of one of the user's maps (layers, keyframe dates, markers) and a 15-minute download link for its full import JSON, which can be several MB.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mapId": {
                "description": "The map id",
                "type": "string"
              }
            },
            "required": ["mapId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:343bfe6ec979104d2b5f2d71431a6ee59911c39408c7eef295841d0a9935c66a"
        },
        {
          "name": "get_public_map",
          "title": "Get a published map",
          "description": "One published map as Markdown: description and sources, the timeline of keyframes (date and caption), layers, events, and the iframe code to embed the interactive map. Pass its URL, or the handle and slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The last part of the map's URL, e.g. the-ottoman-empire-12991923",
                "type": "string"
              },
              "url": {
                "description": "e.g. https://www.movingpolygons.com/map/chrisjager/the-ottoman-empire-12991923",
                "type": "string"
              },
              "username": {
                "description": "The map owner's handle, e.g. chrisjager (with slug, instead of url)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a8280ea14e23369ee049436a0fa0a9d84348840b8f0e2da9942e19a6ecb4a2c"
        },
        {
          "name": "list_maps",
          "title": "List my maps",
          "description": "The user's maps, most recently changed first, with their ids and links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Default 50",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Only maps whose name contains this text",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4755c8889cc6804adf844dbb4073dc0091652701f3aba461da3c824bd4ab03f6"
        },
        {
          "name": "publish_map",
          "title": "Publish a map",
          "description": "Make one of the user's maps public at its /map/<handle>/<slug> link, where anyone can view it. The user must first choose a username at https://www.movingpolygons.com/settings; until then this fails and says so.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mapId": {
                "type": "string"
              }
            },
            "required": ["mapId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:524f18c70f290a8fa3d1a0f16243cf9c11dea9852e87f113319689f9f1416687"
        },
        {
          "name": "replace_map_content",
          "title": "Replace a map's content",
          "description": "Overwrite an existing map's layers, markers, name, description and casualty bar (and style, if given) with an import JSON of up to about 1 MB. The link and publish state stay; the old content is backed up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "map": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "The map in the Moving Polygons import format, as a JSON object or a JSON string"
              },
              "mapId": {
                "type": "string"
              }
            },
            "required": ["map", "mapId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba26e23c190bec86c3a9ecd45df93be06aca75329f41e5038c143a6afa272111"
        },
        {
          "name": "search_maps",
          "title": "Search published maps",
          "description": "Find published animated maps on Moving Polygons (history, wars, empires, borders, epidemics, sea ice…) by words in their title or description and/or a year they cover. Returns links to the interactive map, its text version and its article.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. 'Ottoman', 'Holy Roman Empire', 'Ukraine war'",
                "type": "string"
              },
              "year": {
                "description": "Only maps whose timeline includes this year; negative for BC (-44 = 44 BC)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51c80ce4e1254d465b54eab33437d8401397b17a95fa4aa30cc688a39b9d6b85"
        },
        {
          "name": "start_map_upload",
          "title": "Start a chunked map upload",
          "description": "Opens an upload (valid 2 hours) for a map JSON text that is sent in numbered parts through tool calls rather than over the network. It creates a new draft map, or with mode replace overwrites an existing map's content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mapId": {
                "description": "Required for mode replace",
                "type": "string"
              },
              "mode": {
                "description": "create (default): a new map. replace: overwrite mapId's content",
                "enum": ["create", "replace"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01deb563fbbc1d966e8a03a5aaf9e9f133e8d6d2a78376b6fb31778495a096fd"
        },
        {
          "name": "unpublish_map",
          "title": "Unpublish a map",
          "description": "Make one of the user's maps private again (its public link stops working).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mapId": {
                "type": "string"
              }
            },
            "required": ["mapId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c23592ecf8ec62ab24bd157524afa6b6386b85f7901f3e05798bc46cbefe179f"
        },
        {
          "name": "upload_map_part",
          "title": "Upload one part of a map",
          "description": "Stores one numbered piece of a chunked map upload. The pieces are joined in part order with nothing in between; sending a part number again replaces that part. Returns the piece's length and SHA-256.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "part": {
                "description": "1 for the first piece",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "This piece of the map JSON text, verbatim",
                "maxLength": 250000,
                "type": "string"
              },
              "uploadId": {
                "type": "string"
              }
            },
            "required": ["part", "text", "uploadId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fbfdf227d2baf5116a8fa60e79e33cef013e277aa5899e3a9b0b7b943cca6c1"
        }
      ],
      "resources": [
        {
