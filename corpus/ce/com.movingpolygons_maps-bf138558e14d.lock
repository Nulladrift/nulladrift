        {
          "name": "upload_map_part",
          "title": "Upload one part of a map",
          "description": "Stores one numbered piece of a chunked map upload. The pieces are joined in part order with nothing in between; sending a part number again replaces that part. Returns the piece's length and SHA-256.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "part": {
                "description": "1 for the first piece",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "This piece of the map JSON text, verbatim",
                "maxLength": 250000,
                "type": "string"
              },
              "uploadId": {
                "type": "string"
              }
            },
            "required": ["part", "text", "uploadId"],
            "type": "object"
          },
