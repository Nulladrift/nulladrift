          "title": "Map import format",
          "description": "The JSON format for Moving Polygons maps",
          "mimeType": "text/markdown",
          "digest": "sha256:9781782131bf0fb7adb1701ae27976aa5f26514dfb4793213b6a270ae017e20c"
