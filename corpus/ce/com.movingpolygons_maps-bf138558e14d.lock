              "uploadId": {
                "type": "string"
              }
            },
            "required": ["parts", "uploadId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
