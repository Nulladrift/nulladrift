      },
      "instructions": "Moving Polygons (movingpolygons.com) turns timed polygons into animated maps: borders that morph between keyframes, plus point markers. Most tools act on the user's own account; the first call to one of them asks the user to sign in. search_maps, get_public_map and get_import_format work without signing in.\n\nWorkflow for a new map:\n1. Call get_import_format once and follow it exactly (geometry is a list of closed rings, not GeoJSON; labels ≤ 50 chars; colours #RRGGBB).\n2. Small maps (under ~1 MB of JSON): pass the JSON object to create_map.\n3. Bigger maps, or a map file you built in a sandbox or on disk: call create_upload_link, then run the returned curl command. Never paste a large file into a single tool call.\n   If curl cannot reach this site (the claude.ai sandbox blocks it unless the user allowlists www.movingpolygons.com), send the minified JSON in parts of about 30,000 characters: start_map_upload, then upload_map_part for each piece in order, then finish_map_upload.\n4. Give the user the editor or preview link. New maps are private drafts.\n\nTo find maps other people published (any topic or period), use search_maps and get_public_map.\n\nNever call publish_map unless the user asked to publish: it makes the map public. replace_map_content overwrites a map (a backup is kept); confirm with the user first when the map is published.",
      "tools": [
        {
          "name": "create_map",
          "title": "Create a map",
          "description": "Create a new private draft map from an import JSON of up to about 1 MB.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "map": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "The map in the Moving Polygons import format, as a JSON object or a JSON string"
              }
            },
            "required": ["map"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59f433029c5f37352ff0ed9d0b84219f098e599d9c5aa8ab2349eca44b439449"
        },
        {
          "name": "create_upload_link",
          "title": "Create an upload link",
          "description": "A one-off link (valid 15 minutes) for uploading a map JSON file of up to 40 MB with curl. It creates a new draft map, or with mode replace overwrites an existing map's content. The curl output reports the result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mapId": {
                "description": "Required for mode replace",
                "type": "string"
              },
              "mode": {
                "description": "create (default): a new map. replace: overwrite mapId's content",
                "enum": ["create", "replace"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:935e26130e49f7132dcc300ba15f721ff496c916bd3b720c4e1a8a93648663aa"
        },
        {
          "name": "finish_map_upload",
          "title": "Finish a chunked map upload",
          "description": "Joins parts 1 to the given count of a chunked upload, validates the map and creates the draft map (or replaces the map's content, keeping a backup). Reports missing parts or where the JSON breaks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "parts": {
                "description": "How many parts were sent",
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "uploadId": {
                "type": "string"
              }
            },
            "required": ["parts", "uploadId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9780a3d1f5015b295b66b1c3ed61bcd3991b8e5165e33b2ca8e5d864a5e9002"
        },
        {
          "name": "get_account",
