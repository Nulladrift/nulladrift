        {
          "name": "list_events",
          "title": "SEC filing events with filters",
          "description": "Classified SEC filings of US companies (bankruptcies, debt defaults, delisting notices, late filings, restatements, leadership changes, IPOs, Form D raises, annual and quarterly reports…) filtered by type, day or date range and state; newest first, with paging. Each item: dates, type, form, 8-K items, detail, amount, link to the filing on EDGAR, company and url of its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "One EDGAR business day (edition date).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "From this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "state": {
                "description": "State of the business address: slug (\"california\") or USPS code (\"CA\").",
                "maxLength": 30,
                "type": "string"
              },
              "to": {
                "description": "To this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "type": {
                "description": "Event type (list_event_types).",
                "enum": ["bankruptcy", "revocation", "bankruptcy_update", "debt_default", "delisting_notice", "late_filing", "restatement", "going_dark", "form15_class", "delisting", "cyber", "restructuring", "impairment", "auditor", "control", "leadership", "ma", "activist", "ipo", "raise", "earnings", "annual", "quarterly"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "events": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["events", "total"],
            "type": "object"
