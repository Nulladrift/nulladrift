            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Company name, ticker or CIK, e.g. \"Apple\", \"AAPL\", \"320193\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
