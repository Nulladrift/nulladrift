        {
          "name": "search_companies",
          "title": "Search US companies",
          "description": "Finds US companies in the Companies Daily database by name, ticker or SEC CIK: name, CIK, tickers, exchanges, kind of filer, status, city and state, url of the company page. The database holds every listed company and every company with a classified SEC filing since Oct 1, 2026. Details and filing history: get_company.",
