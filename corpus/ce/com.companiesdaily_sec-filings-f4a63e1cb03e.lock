      "serverInfo": {
        "name": "com.companiesdaily/sec-filings",
        "title": "Companies Daily – SEC filings of US companies",
        "version": "1.1.0",
        "websiteUrl": "https://companiesdaily.com/for-agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only server with the data of Companies Daily (companiesdaily.com): what US companies file with the SEC, from SEC EDGAR — company pages with classified filing histories and XBRL totals, events by type, day and state, daily editions. Every result has url (the page with the same data), as_of (date of the data), attribution (source SEC EDGAR, not investment advice) and cite (a ready attribution line). The data describe what companies filed, not their creditworthiness or the value of their stock. Names of people from filings are not published. Companies outside the database are not fetched from EDGAR by this server. Documentation: https://companiesdaily.com/for-agents/. Limit: 60 requests per minute per IP. The tools list_followed_companies, follow_company and unfollow_company work on the list of companies a particular reader follows and need OAuth 2.1 sign-in (without a token: HTTP 401 with WWW-Authenticate). Use them only when the reader asks. How to get a token: https://companiesdaily.com/auth.md.",
      "tools": [
        {
          "name": "follow_company",
          "title": "Follow a company",
          "description": "Needs sign-in (OAuth, scope watchlist:write). Adds a company from the Companies Daily database (by CIK or ticker) to the companies the reader follows, at most 50. When each edition closes, the reader gets one email with the new SEC filings of the followed companies. Use only when the reader asks for it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cik": {
                "description": "SEC CIK of the company (search_companies), leading zeros optional, e.g. \"320193\".",
                "pattern": "^(CIK)?\\d{1,10}$",
                "type": "string"
              },
              "ticker": {
                "description": "Ticker symbol, e.g. \"AAPL\" (used when cik is empty).",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "companies": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              }
            },
            "required": ["companies", "count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
