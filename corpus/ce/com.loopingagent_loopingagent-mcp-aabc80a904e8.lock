{
  "lockfileVersion": 2,
  "subjects": {
    "com.loopingagent/loopingagent-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://loopingagent.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "loopingagent-mcp",
        "version": "0.3.1"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "book_call",
          "description": "Get the booking link to schedule a free 30-minute call with Laurent Knauss (Cal.com). The agent should present this link to the user so they can pick a slot. Optional topic hint is allowed but the actual slot selection happens on Cal.com.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Optional topic for the call (e.g. 'agentic AI project').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:623522b8f3a02796317a1d9215de9a37c938678a371c6fc54952badf7cfacc1a"
        },
        {
          "name": "get_article",
          "description": "Get a single article from loopingagent.com: metadata (category, description, cover, canonical URL), the FULL plain-text content (so the agent can quote and cite it accurately) and 3 related articles. Use list_articles or search_articles first to find the slug.",
          "inputSchema": {
            "properties": {
              "include_content": {
                "description": "Include the full article text (default: true). Set to false for metadata only, which is cheaper.",
                "type": "boolean"
              },
              "slug": {
                "description": "Article slug. Ex: browser-automation, agentic-commerce-protocol, langgraph-generative-ui",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22769c0c8ad3180617fdab803490e1c5658eb7eb0671ef7d69eeb31a4f354f42"
        },
        {
          "name": "get_profile",
          "description": "Full professional profile of Laurent Knauss: title, location, availability, contact email, social profiles (GitHub, LinkedIn, X), certifications, and Cal.com booking link. Use this first to understand who he is and how to reach him.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0d6102360a7b52b2fc226db125eb308303d5f07e85c6a066dc5046423215491"
        },
        {
          "name": "get_project",
          "description": "Full details of one project shipped by Laurent Knauss: positioning, complete description, tech stack, live URL and status. Use list_projects first for the exact names.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Project name. Ex: AgentRecruteur, BullionRadar, ActionArgent, StreetBodies, VersatileAgent",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f30ebca9e2c07ce99d9c3cbe0b1512d9ebcd1262f6407ef17e2e3f8d16f2db5"
        },
        {
          "name": "get_skill",
          "description": "Laurent Knauss' technical skills, grouped by domain (Agentic AI, RAG & Voice AI, Software engineering & Cloud, Automation & tooling). Each skill has a label and an optional short detail. Use this to assess fit for AI/agentic development roles.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8405a16e238b2ba809b683bac427f98ecf146560cf24ece5aedac7b8da11328b"
        },
        {
          "name": "list_articles",
          "description": "List articles published on loopingagent.com (English technical blog: agentic AI, MCP, LangGraph, TypeScript, blockchain). Returns slug, title, category and description for each. Use search_articles to find articles on a topic, and get_article to read one in full.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter articles by category.",
                "enum": ["agentic-ai", "blockchain"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of articles to return (default: all of them).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe18de6968a570d5f8591c43cedd0ac2d99eaef0e6dd62d91cdc31cf197e6580"
        },
        {
          "name": "list_categories",
          "description": "List the loopingagent.com article categories with their article counts and slugs. Use it to browse the blog by theme (Agentic AI, blockchain) before fetching an article.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12eaa7fa5f0e261c1d9dbcc502948ae8ad1b5561bcad427c5ed1762c1d875625"
        },
        {
          "name": "list_projects",
          "description": "Projects built and shipped by Laurent Knauss (agentic AI products and full-stack web apps), with domain, live status, one-line positioning and tech stack. Use it to assess his delivery track record — get_project returns the full description.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by project family: ai (agentic AI) or web.",
                "enum": ["ai", "web"],
                "type": "string"
              },
              "status": {
                "description": "Filter by status: live (deployed in production) or oss (open source, not deployed).",
                "enum": ["live", "oss"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a11b8f62c0e4e0defa9fa7541b3614b946404a2f20dae4e217cba915c427fffd"
        },
        {
          "name": "search_articles",
          "description": "Full-text search across every article on loopingagent.com (title, description and body text). Returns the most relevant matches with a snippet of the matching passage, ranked by relevance. Use this to find an article to quote or cite on a topic — ex. 'ERC-4337 paymaster', 'Golang pointers', 'evaluating LLM applications', 'MCP server'.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Restrict the search to one category.",
                "enum": ["agentic-ai", "blockchain"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default: 5, max: 20).",
                "type": "number"
              },
              "query": {
                "description": "Search terms (keywords, topic or technology). Multi-word queries are scored per term.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f6dbf800c4f1f052eadfbb7ede86475ae0d2b3080f9ff01cc6b98e962933ae4"
        }
      ],
      "digest": "sha256:8f7feb9132200e16d7f3373b432ef90457315df83697de859909475b0da93b55"
    }
  }
}
