        {
          "name": "contacts_erase",
          "description": "Admins: permanently erase one person's personal data from this workspace — by contact id or by phone number (destination), including inbound callers who are not contacts. Removes the contact, its activity history, and every call's recording, transcript, outcome, number and linked action/handoff content. Calls keep only time, status, duration and cost. Refused while a call with them is active or one of their actions is unresolved. With doNotCall (always, if they had opted out) a one-way fingerprint of the number keeps them from being called or answered again. Use for data-subject erasure requests; download the audit first if you need to answer an access request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "destination": {
                "anyOf": [
                  {
                    "maxLength": 320,
                    "pattern": "^(?:[a-zA-Z0-9_-]{1,64}|sip:[a-zA-Z0-9_.-]{1,64}@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,63})$",
                    "type": "string"
                  },
                  {
                    "pattern": "^\\+[1-9][0-9]{6,14}$",
                    "type": "string"
                  }
                ],
                "description": "Erase by number, e.g. an inbound caller who is not a contact."
              },
              "doNotCall": {
                "default": false,
                "description": "Keep the number on this workspace's do-not-call list as a one-way fingerprint. Always kept when the contact had opted out.",
                "type": "boolean"
              },
              "id": {
                "description": "The contact to erase. Give this or destination, not both.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "workspaceId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["workspaceId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9af24392b0b858662056938ebcb030a04646e8b00797fbdef48a76df616c822"
        },
