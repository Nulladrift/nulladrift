        {
          "name": "business_ratios",
          "description": "Compute cash runway in months, cash buffer days, current ratio, quick ratio, debt to equity, DSO, DIO, DPO and cash conversion cycle from any subset of a business's own cash, monthly flow and balance sheet figures. Arithmetic only, no network. Each value carries its formula and the inputs it used; a value that cannot be computed is null with a reason. Use it to check a company's liquidity, leverage or working-capital cycle from figures you already have; it does not fetch filings or market data. All inputs are optional numbers in one currency unit (monthly figures per month, annual figures for the last twelve months); pass only what you know. Returns inputs, ratios (each with value, unit, formula, inputs and, when null, reason), rounded_to_decimals (4) and about (provider, contact, description). Same input, same output. Price: 10 sats per call.",
          "inputSchema": {
            "properties": {
