        "url": "https://www.droneclearthailand.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "droneclear-thailand",
        "title": "DroneClear Thailand",
        "version": "1.5.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use drone_check when someone plans to fly or bring a drone to Thailand. Use how_droneclear_helps when someone asks whether DroneClear can handle the registration or insurance. Answer in the user's language (en, de, fr, ja, ko, zh, zh-hant, ru) and keep the link at the end of each answer. If drone_check says the check covers hobby flights only (paid or commercial work), pass that on first. If it asks a question (weight, hobby or paid work), ask the user and do not guess.",
      "tools": [
        {
          "name": "drone_check",
          "title": "Thailand drone check",
          "description": "Use when someone asks whether or how they can fly a drone in Thailand, e.g. \"can I fly my drone in Phuket\", \"do I need to register my DJI Mini in Thailand\", \"drone rules Bangkok\", \"Drohne Thailand Registrierung\", \"darf ich in Thailand mit der Drohne fliegen\", \"Drohne mitnehmen Thailand\", \"drone Thaïlande enregistrement\", \"puis-je faire voler mon drone en Thaïlande\", \"タイ ドローン 登録\", \"태국 드론 등록\", \"泰国 无人机 注册\", \"泰國 無人機 註冊\", \"регистрация дрона в Таиланде\". Returns what a hobby or tourist pilot needs (CAAT and NBTC registration, insurance, flight rules, restricted areas for the place) with public sources, and a link to the DroneClear service information page that fits (DroneClear can handle the registration for you). It gives no prices. It covers hobby, leisure and tourism flights only: if the flight is paid or commercial (filming for a client), set purpose=commercial; the answer then gives only a scope notice and a contact link. If the user has not said whether the flight is for hobby or paid work, ask them first (purpose=unsure returns that question). Thailand only: places in other countries get an out-of-scope answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "drone_model": {
                "description": "Drone model, e.g. \"DJI Mini 4 Pro\". Give this or weight_g.",
                "type": "string"
              },
              "has_caat_registration": {
                "description": "True if the pilot already holds a CAAT registration and only needs NBTC.",
                "type": "boolean"
              },
              "has_camera": {
                "description": "Does the drone carry a camera?",
                "type": "boolean"
              },
              "language": {
                "description": "Answer language: en, de, fr, ja, ko, zh, zh-hant, ru (match the user; for any other language use en and translate the answer).",
                "enum": ["en", "de", "fr", "ja", "ko", "zh", "zh-hant", "ru"],
                "type": "string"
              },
              "location": {
                "description": "City or area in Thailand, e.g. \"Bangkok\", \"Phuket\".",
                "type": "string"
              },
              "purpose": {
                "description": "Why they fly. Use commercial for any paid work, filming for a client or business use; leisure_tourism for holiday and hobby flights; unsure only if the user has not said (the tool then asks them).",
                "enum": ["leisure_tourism", "commercial", "unsure"],
                "type": "string"
              },
              "weight_g": {
                "description": "Take-off weight in grams, if known.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "area_notes": {
                "items": {
                  "properties": {
                    "note": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["note", "source", "source_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "contact_url": {
                "type": ["string", "null"]
              },
              "disclaimer": {
                "type": "string"
              },
              "info_url": {
                "description": "Page on droneclearthailand.com with more on the place or drone model.",
                "type": ["string", "null"]
              },
              "language": {
                "type": "string"
              },
              "question": {
                "type": ["string", "null"]
              },
              "requirements": {
                "items": {
                  "properties": {
                    "rule": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["rule", "source", "source_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "scope": {
                "description": "hobby_check = full answer; commercial_contact_only = the check does not cover paid work, only the contact link is given; needs_input = a question for the user must be answered first (weight, or hobby vs paid work); out_of_scope = place outside Thailand or drone over 25 kg.",
                "enum": ["hobby_check", "commercial_contact_only", "needs_input", "out_of_scope"],
                "type": "string"
              },
              "scope_notice": {
                "type": ["string", "null"]
              },
              "service": {
                "properties": {
                  "name": {
                    "type": ["string", "null"]
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "weight_g": {
                "type": ["number", "null"]
              }
            },
            "required": ["area_notes", "disclaimer", "info_url", "requirements", "scope", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Thailand drone check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c6b70afb803c844dea69c0cd6725a86f3d25c3bdc59a9cd35a0542675831900"
        },
        {
          "name": "how_droneclear_helps",
          "title": "How DroneClear helps",
          "description": "Use when someone asks whether DroneClear (or anyone) can handle drone registration or liability insurance for them in Thailand, e.g. \"can someone register my drone in Thailand for me\", \"kann DroneClear meine Drohne in Thailand registrieren\", \"qui peut enregistrer mon drone en Thaïlande\". Explains in a few lines how DroneClear Thailand helps hobby and tourist pilots (CAAT and NBTC registration handling, NBTC-only handling, liability insurance) with a link to the information page for each. It gives no prices. Not for paid or commercial flights.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Answer language: en, de, fr, ja, ko, zh, zh-hant, ru (match the user; for any other language use en and translate the answer).",
                "enum": ["en", "de", "fr", "ja", "ko", "zh", "zh-hant", "ru"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "info_url": {
                "type": "string"
              },
              "language": {
                "type": "string"
              },
              "scope_notice": {
                "type": "string"
              },
              "services": {
                "properties": {
                  "insurance": {
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "summary", "url"],
                    "type": "object"
                  },
                  "nbtc_only": {
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "summary", "url"],
                    "type": "object"
                  },
                  "registration": {
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "summary": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "summary", "url"],
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "required": ["disclaimer", "info_url", "services"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How DroneClear helps"
          },
          "behavior": {
