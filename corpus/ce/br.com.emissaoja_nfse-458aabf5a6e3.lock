          },
          "digest": "sha256:43f1461f8418eb6ac7dfdd80ee847512168895d1f6ca5a762f2cd35768cd63e7"
        },
        {
          "name": "cancelar_nota",
          "title": "Cancelar NFS-e",
          "description": "Cancela uma nota emitida, dentro do prazo do Emissor Nacional. Irreversível: confirme com a pessoa a nota (número, tomador, valor) e o motivo antes. Responde com a operação; acompanhe com acompanhar_operacao (processando → concluida ou falhou).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "justificativa": {
                "maxLength": 255,
                "minLength": 15,
                "type": "string"
              },
              "motivo": {
                "description": "1 = erro na emissão, 2 = serviço não prestado",
                "enum": ["1", "2"],
                "type": "string"
              },
              "nota_id": {
                "description": "UUID",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "origem": {
                "enum": ["local", "importada"],
                "type": "string"
              }
            },
            "required": ["motivo", "nota_id", "origem"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancelar NFS-e"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df195786256f367ac1c64638f1691cac25d4c9ef0a53d7fb2da7b2760efbc027"
        },
        {
          "name": "configurar_credencial",
          "title": "Conectar a empresa (CNPJ e senha do Emissor Nacional)",
          "description": "Conecta a empresa da conta ao Emissor Nacional com o CNPJ e a senha do portal (não é a conta gov.br). A senha é conferida no portal, nunca guardada nem devolvida. Depois o emissaoja lê o cadastro fiscal e traz as notas dos últimos 90 dias. Só use quando a pessoa pedir e informar a senha ela mesma; são no máximo 3 tentativas erradas por dia (regra do portal, para não bloquear a conta da empresa). Responde na hora com a tentativa; acompanhe com situacao_credencial até proximo_passo sair de \"aguardar\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ciente_ultima_tentativa": {
                "default": false,
                "description": "true quando a pessoa confirma que é a última tentativa do dia (situacao_credencial avisa)",
                "type": "boolean"
              },
              "cnpj": {
                "description": "CNPJ da empresa",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "senha": {
                "description": "Senha do Emissor Nacional (nfse.gov.br), informada pela pessoa",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cnpj", "senha"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Conectar a empresa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a0006a8ae79f86a27c9655ec91603006cb680d9923592a9d2655763257d7d2d"
        },
        {
          "name": "consultar_cnpj",
          "title": "Consultar CNPJ na Receita",
          "description": "Dados cadastrais de um CNPJ na Receita Federal (razão social, situação, CNAEs, endereço, Simples/MEI, sócios com CPF mascarado). Não cria tomador; para emitir para esse CNPJ use criar_tomador.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cnpj": {
                "description": "CNPJ com ou sem pontuação",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["cnpj"],
            "type": "object"
          },
          "annotations": {
