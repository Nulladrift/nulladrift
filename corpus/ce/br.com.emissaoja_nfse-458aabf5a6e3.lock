                "maxLength": 100,
                "type": "string"
              },
              "limite": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "periodo": {
                "default": "12_meses",
                "enum": ["mes_atual", "mes_anterior", "ano_atual", "12_meses"],
                "type": "string"
              },
              "situacao": {
                "default": "todas",
