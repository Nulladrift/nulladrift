      "serverInfo": {
        "name": "emissaoja",
        "title": "emissaoja · NFS-e no Emissor Nacional",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Emissão de Nota Fiscal de Serviço (NFS-e) no Emissor Nacional para MEI e empresas do Simples Nacional, com CNPJ e senha do portal, sem certificado digital. Comece por minha_empresa. Emitir e cancelar têm efeito fiscal real: confirme com a pessoa tomador, valor, descrição e motivo antes de chamar emitir_nota ou cancelar_nota, e passe sempre uma referencia única por nota. status e validar_cnpj funcionam sem conta; as demais ferramentas usam a chave de API da conta.",
      "tools": [
        {
          "name": "acompanhar_operacao",
          "title": "Acompanhar operação",
          "description": "Estado de uma operação (cancelamento): processando, concluida ou falhou (com o erro).",
