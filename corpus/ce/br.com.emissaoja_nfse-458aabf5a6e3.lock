        },
        {
          "name": "criar_tomador",
          "title": "Criar tomador (cliente)",
          "description": "Cadastra um cliente pelo CNPJ (nome e endereço vêm da Receita) ou pelo CPF com o nome completo. Se já existir, devolve o existente (ja_existia). Devolve tipo + id para emitir_nota.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "documento": {
                "description": "CNPJ ou CPF, com ou sem pontuação",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "nome": {
                "description": "Nome completo (obrigatório para CPF)",
                "maxLength": 150,
                "type": "string"
              }
            },
            "required": ["documento"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Criar tomador"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:367b73ff99553e4967034ba657b675efcffa1dfd7369adb241d99eeaca74813d"
        },
        {
          "name": "emitir_nota",
          "title": "Emitir NFS-e",
          "description": "Emite uma nota fiscal de serviço no Emissor Nacional para um tomador já cadastrado (use listar_tomadores ou criar_tomador antes). Faz a prévia e, sem bloqueio, pede a emissão: responde com o pedido (acompanhe com acompanhar_pedido até autorizada, recusada ou incerta). Com bloqueio, devolve o que falta (bloqueios com code, mensagem e acao) em vez de emitir. Passe sempre uma referencia única por nota que a pessoa quer emitir (ex.: \"pedido-123\"): repetir a mesma referencia devolve o mesmo pedido e nunca emite duas vezes. Confirme com a pessoa tomador, valor e descrição antes de chamar; a nota tem efeito fiscal real.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competencia": {
                "description": "AAAA-MM-DD (omitida: hoje)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "confirmo_repeticao": {
                "default": false,
                "description": "Quando a resposta anterior foi emissao_repetida_recente e a pessoa confirmou",
                "type": "boolean"
              },
              "descricao": {
                "description": "Discriminação do serviço na nota (omitida: a do serviço)",
                "maxLength": 2000,
                "type": "string"
              },
              "permitir_repetida_de": {
                "description": "Quando a resposta anterior foi possivel_duplicada e a pessoa confirmou que é outra nota: o pedido_id informado",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "referencia": {
                "description": "Identificador único desta nota no seu lado (Idempotency-Key)",
                "maxLength": 64,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "servico_id": {
                "description": "UUID do serviço (omitido: o principal)",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "tomador_id": {
                "description": "UUID",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "tomador_tipo": {
                "description": "pj (CNPJ) ou pf (CPF)",
                "enum": ["pj", "pf"],
                "type": "string"
              },
              "valor": {
                "description": "Valor do serviço em reais, até 2 casas",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["tomador_id", "tomador_tipo", "valor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Emitir NFS-e"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9347ffb8173eb9db05bfe56dc3a71dd7f1f2699b40725e0c06bd4d5829ff382"
        },
