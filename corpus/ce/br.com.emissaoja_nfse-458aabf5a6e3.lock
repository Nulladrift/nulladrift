        },
        {
          "name": "acompanhar_pedido",
          "title": "Acompanhar pedido de emissão",
          "description": "Estado de um pedido de emissão: na_fila, emitindo, confirmando, autorizada (com numero e chave_acesso), recusada (com motivo) ou incerta. Consulte de novo depois de proxima_consulta_ms enquanto não for terminal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pedido_id": {
                "description": "UUID",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              }
            },
            "required": ["pedido_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Acompanhar pedido"
          },
          "behavior": {
            "destructive": false,
