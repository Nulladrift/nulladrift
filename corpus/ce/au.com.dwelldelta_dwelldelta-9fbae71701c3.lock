                "description": "NSW, TAS: a postcode, or a suburb (answered for its whole postcode; TAS: a name its bonds were lodged under). QLD, SA: a suburb. WA: a locality. QLD, WA, SA, TAS: part of a name works",
                "type": "string"
              },
              "bedrooms": {
                "description": "NSW and QLD only: a number of bedrooms, as '2' or '2 bedrooms'. NSW also has Bedsitter, and 4 means DCJ's '4 or more Bedrooms'; a number above 4 is answered under that label too, and the answer says it is not for that number alone. QLD: the RTA publishes flats of 1 to 3, houses of 2 to 4 and town houses of 2 to 3, and does not define its labels - reading the number as bedrooms is DwellDelta's. A plus means 'or more', which only DCJ's 4 has: '3+', and any 'N+' for QLD, is refused, not answered as exactly N. Without dwelling_type, every type the publisher reports at that size is given",
                "type": "string"
              },
              "council": {
                "description": "A council (NSW or QLD), or part of its name",
                "type": "string"
              },
              "dwelling_type": {
                "description": "NSW and QLD only. NSW (DCJ's labels): House, Townhouse, Flat/Unit, Other. QLD (the RTA's): Flat, House, Townhouse. 'unit' and 'apartment' are read as flat/unit. Without bedrooms, every size the publisher reports for that type is given",
                "type": "string"
              },
