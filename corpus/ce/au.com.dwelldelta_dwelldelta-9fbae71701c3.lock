        {
          "name": "nsw_sale_prices",
          "title": "NSW median sale prices by postcode or council",
          "description": "Median sale price of the dwellings sold in the latest reported quarter in NSW, with the quartiles, the number of sales and the change on a year before, by postcode or council and by dwelling type - all dwellings, non_strata (separate houses) and strata (units, town houses, villas). From the NSW Department of Communities and Justice's Rent and Sales Report (CC BY 4.0). area or council names the place the question is about; with neither, the answer is the state's own figures. These are medians of homes sold: not asking prices, not valuations, and never what any one home sold for or is worth. A line marked UNUSUAL was set by a few very large sales or by many sales at one identical price, and is not a going price. A total noted as mostly a marked row's sales may be moved by them, and the file shows nothing more about it. A line with any other mark or note is not a going price either, and the file does not say why. Each answer names the dwelling type, the quarter and the source line, and states the limits. For questions such as \"house prices in Coogee\".",
