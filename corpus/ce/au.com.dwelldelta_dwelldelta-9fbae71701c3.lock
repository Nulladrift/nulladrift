          "description": "Compares a weekly rent, and any proposed new rent, with how the ABS rents index for the tenant's Australian capital city has moved since the lease began. city is one of the eight capital cities, whose index is city-wide, not suburb-level. The answer is information, not advice, and carries the months compared, the source and the index's limits. Without lease_start, place (a suburb, locality or postcode in NSW, VIC, QLD, WA, SA or TAS) gives instead where the rent sits against that place's median of new bonds, and between its quartiles where the publisher gives them.",
          "inputSchema": {
