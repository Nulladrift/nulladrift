                "enum": ["Adelaide", "Brisbane", "Canberra", "Darwin", "Hobart", "Melbourne", "Perth", "Sydney"],
                "type": "string"
              },
              "current_rent": {
                "description": "Current weekly rent in Australian dollars",
                "exclusiveMinimum": 0,
