      "instructions": "DwellDelta answers Australian property questions from public data. Held: median weekly rents of new bonds by area for NSW (postcode or council), Queensland (suburb or council), WA (locality), SA (suburb), Tasmania (postcode, one month) and Victoria (suburb group, vic_rents); NSW median sale prices by postcode or council; ABS and RBA indicators by capital city and state; and a check of a rent against the ABS rents index for its capital city, or, given a place instead of a lease start, against that place's median of new bonds. It applies to questions about what a place rents or sells for, how rents or prices have changed, and whether a rent is in line. A suburb name works for NSW and Tasmania: one in a single postcode is answered for that whole postcode. Each answer carries its quarter (Tasmania: month), source, licence and limits; area_rents and nsw_sale_prices answers also carry a page_url to cite where the place has a page on tools.dwelldelta.com.au, and a cite_as line. From property_rents also: New Zealand councils and regions (MBIE's new bonds for one month, in NZ$, provisional, no change on a year), and interim ABS cover for ACT and NT postcodes and Tasmanian postcodes without a bond median (the rent paid at the 2021 Census, the capital's rents index and sale prices - not new-bond medians); nothing is compared across states or countries. Not held: new-bond medians for the ACT and the Northern Territory; sale prices by area outside NSW (property_rents gives the ABS's medians for the ACT, NT and Tasmania's capital and the rest of the state only); property listings; any one home's price or rent. Figures are information, not financial or tenancy advice. Of the rent tools: property_rents answers one place by whole name or postcode, in Australia or New Zealand, with no state needed; area_rents one known state of NSW, Queensland, WA, SA or Tasmania - its own figure, a council (NSW, QLD), or part of a name (QLD, WA, SA, TAS); vic_rents Victoria's regions and suburb groups; rent_check a given rent. property_rents takes a place with no state - a suburb, locality or postcode - and answers from the state that holds it; a name held in more than one state is listed, not chosen.",
      "tools": [
        {
          "name": "area_rents",
          "title": "NSW, QLD, WA, SA and TAS rents by postcode, suburb or locality",
          "description": "One known state - NSW, QLD, WA, SA or TAS: its own figure, a council (NSW, QLD), or areas by part of a name (QLD, WA, SA, TAS); property_rents takes one place by whole name, no state needed, and Victoria is in vic_rents. Median weekly rent of new bonds lodged in the latest quarter (TAS: month), all dwellings together, with the bond count and the change on a year before: NSW by postcode or council (NSW Department of Communities and Justice), QLD by suburb or council (Residential Tenancies Authority), WA by locality (calculated by DwellDelta from the Government of Western Australia's bond records), SA by suburb (SA Housing Trust, Private Rent Report; its page states no licence, the catalogues list CC BY), TAS by postcode (calculated by DwellDelta from Department of Justice bond records, private housing; licence as data.gov.au lists it); SA and TAS hold one period, so no change on a year. Each file states CC BY 4.0. The figures are new-bond medians, not advertised rents. Each state measures in its own way: the states are not one series, and their figures cannot be added or compared as one. Each answer states its period, its source line and the source's limits. For NSW and QLD, dwelling_type or bedrooms (or both) give the publisher's figure for that kind of home instead - a two-bedroom unit, a three-bedroom house. Only combinations the publisher reports are answered: one with no published median is said to have none, and neither another area's figure nor the all-dwellings figure stands in for it. Many such figures rest on few bonds. WA and SA have no figures by dwelling type or bedrooms; TAS has them for the state alone.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
