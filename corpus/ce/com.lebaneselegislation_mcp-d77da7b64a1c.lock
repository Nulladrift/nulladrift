        {
          "name": "get_law",
          "title": "Get a law",
          "description": "Get a law, decree or similar text's metadata (kind, number, date, status), its table of contents (the chapters: id, parent_id, depth, heading), its articles in order (number, and the section_id of the chapter each sits under) and the texts it amended or was amended by (amended_by / amended: one entry per text and relation, with articles listing the articles of this law it touches, or of the other law for amended; no articles means the whole law). Use get_article to read one article's verbatim text, or get_law_texts to read all of them. title_en is an unofficial English title (a model's rendering of the Arabic one); the Arabic title and text are official and more accurate. Not legal advice.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "the law's numeric id, from search_legislation or its URL",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:937a4a72c829ea9d21e86ce9a6c0786275b1d7cbee51b55cd924655cc9e5ac2d"
        },
        {
          "name": "get_law_texts",
          "title": "Get a law's article texts",
          "description": "When calculated_current is present, use its text_ar for current monetary amounts and cite its authority.url. Identify this as calculated under the authority, never as verbatim published wording. The article text_ar and source fields remain published wording. Get the verbatim texts of a law's articles in order, a page at a time: for each article its number, section_id, note, and the same text fields as get_article (text_ar in force today, text_fr, centre_text_ar when an amendment replaced the wording, version, repealed). To read the whole law, pass each answer's next_cursor as cursor until next_cursor is absent. Amendment history stays in get_article. Not legal advice.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "next_cursor of the previous answer; omit for the first page",
                "type": "string"
              },
              "law_id": {
                "description": "the law's numeric id",
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "description": "articles per page, at most 200",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["law_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee8cad2036461dd8019de662a7f2d7b7176edc4d77be662411dd49c4c1873022"
        },
        {
          "name": "get_links",
          "title": "Get citations and amendments",
          "description": "Get the graph edges into or out of one item: a law, an article, a ruling, an opinion, a research study or a Gazette issue. Use this to walk citations and amendments directly, instead of only what get_law and get_article attach automatically. For a law key (\"law/<id>\") the default scope \"all\" includes the edges of its articles too (each link keeps its real to_key, e.g. \"law/244611/art/37\"); scope \"law\" is the law itself only. Newest first by the date of the text each edge comes from. For the next page pass next_cursor as cursor (it is absent on the last page); total is the number of edges. Not legal advice.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "next_cursor of the previous answer; omit for the first page",
                "type": "string"
              },
              "direction": {
                "default": "to",
                "description": "\"to\" (edges that name this item as their target) or \"from\" (edges this item itself carries)",
                "enum": ["to", "from"],
                "type": "string"
              },
              "key": {
                "description": "the item's key: \"law/<id>\", \"law/<id>/art/<number>\", \"ruling/<id>\", \"opinion/<id>\", \"research/<id>\" or \"gazette/<id>\"",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "at most this many edges. quote is cut to 600 characters when longer (quote_truncated: true); get_article has the full wording",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "default": "newest",
                "description": "by the date of the text the edge comes from (Gazette date, else issue date)",
                "enum": ["newest", "oldest"],
                "type": "string"
              },
              "relation": {
                "description": "narrow to one relation (e.g. \"cites\", \"amend\", \"repeal\"); omit for all",
                "type": "string"
              },
              "scope": {
                "description": "for a law key only: \"all\" (default) adds the edges to or from its articles, \"law\" is the law itself only",
                "enum": ["all", "law"],
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
