      "capabilities": {
        "tools": {}
      },
      "instructions": "Lebanese Legislation: every law, article, court ruling and Official Gazette issue published by the Lebanese University's Centre for Research and Studies in Legal Informatics. Published source text is copied verbatim from that database; nothing here is written or rewritten by a model. When calculated_current is present, use its text_ar for current monetary amounts and cite its authority.url. Identify this as calculated under the authority, never as verbatim published wording. The article text_ar and source fields remain published wording. Long lists come a page at a time: for the next page pass the answer's next_cursor as cursor, unchanged, with the same other arguments; next_cursor is absent on the last page. offset was removed in version 2.0.0. Not legal advice. Official texts from the Lebanese University's Centre for Research and Studies in Legal Informatics.",
      "tools": [
        {
          "name": "get_article",
          "title": "Get an article",
          "description": "When calculated_current is present, use its text_ar for current monetary amounts and cite its authority.url. Identify this as calculated under the authority, never as verbatim published wording. The article text_ar and source fields remain published wording. Get one article's verbatim Arabic text as in force today (and French, when the Centre published it and no amendment has replaced it), its in-force status, amendment history, and the canonical and source URLs. When an amendment replaced the wording, text_ar is the new wording and centre_text_ar the earlier one the Centre's site still shows. centre_error, when present, notes an error in the Centre's own text (one article repeating another, a stray letter); the text itself is left as published. The text is copied exactly from the database; nothing here is AI-written. Laws with ids from 2000000000 are ones the Lebanese University has not published yet, read by machine from scans of the Official Gazette's pages (unofficial copies; the law's page links the original Gazette PDF on SaderLex); where the two readings differ the text shows both as ⟦reading one | reading two⟧: quote neither as certain. Not legal advice.",
          "inputSchema": {
            "properties": {
              "law_id": {
                "description": "the law's id (see get_law)",
                "type": "integer"
              },
              "number": {
                "description": "the article's printed number, e.g. \"212\", \"12 مكرر\" or \"586-1\" (an article numbered under another; \"586 (1)\" works too)",
                "type": "string"
              }
            },
            "required": ["law_id", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
