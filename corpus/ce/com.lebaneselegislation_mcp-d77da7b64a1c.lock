        {
          "name": "search_legislation",
          "title": "Search Lebanese legislation",
          "description": "When calculated_current is present, use its text_ar for current monetary amounts and cite its authority.url. Identify this as calculated under the authority, never as verbatim published wording. The article text_ar and source fields remain published wording. Search Lebanese legislation (laws, decrees, decisions), their articles, court rulings, or Official Gazette issues, by keyword: Arabic words, French words (articles the Centre published in French, and the codes' French or English names), or a law's numeric id. Returns verbatim snippets from the Lebanese University's database, never an AI-written summary. A ruling hit's pdf_url is its full judgment's scan on the Lebanese University's site: always pass it on with any answer that cites the ruling. English words work too: they are read into Arabic through a glossary, matched against the unofficial English titles, and when nothing matches the result says what was searched instead (searched_instead). Each word also matches its stem and its form without a leading و or ف. Texts holding every word come first; when none does, the texts holding the rarest words follow and partial_match is true. A code named in the query (\"قانون العقوبات 670\", \"أصول محاكمات مدنية صورية\") narrows the articles to that code; when none of its articles holds the other words, articles_not_in_code names it and the articles listed are from other texts. Each law carries title_en, an unofficial English title a model wrote from the Arabic title alone: the Arabic title and text are official and more accurate; cite the Arabic. A search of the gazette category with a bare year (\"2025\") lists that year's issues, and \"22/2025\" is issue 22 of 2025; to list texts by date use list_legislation instead. Not legal advice.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "narrow to one category; omit to search all four",
                "enum": ["laws", "articles", "rulings", "gazette"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "results per category, at most 20",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "words to search for, Arabic, English or French, or a law's id",
                "type": "string"
              },
              "year": {
                "description": "only laws issued this year; for the gazette category, only issues published this year",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
