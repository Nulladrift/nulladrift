  "subjects": {
    "app.dengdeng/dictionary": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dengdeng.app/dictionary/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dengdeng-dictionary",
        "title": "Dengdeng Chinese Dictionary",
        "version": "1.0.0",
        "websiteUrl": "https://dengdeng.app/dictionary/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Dengdeng Chinese–English dictionary (https://dengdeng.app/dictionary/). Use look_up_word for one Chinese word or character, search_dictionary to find words from pinyin, English or partial Chinese, hsk_word_list for the HSK 3.0 vocabulary lists, and get_embed_code when someone wants a dictionary widget on their own website. To find the HSK band of a word, use look_up_word or search_dictionary; do not scan the HSK lists, which are ordered by pinyin. Give the word page URL so the user can read more, hear the word and see examples. Definitions come from CC-CEDICT (CC BY-SA 4.0); keep the credit when you quote them at length.",
      "tools": [
        {
          "name": "get_embed_code",
          "title": "Get dictionary widget code",
          "description": "Get the HTML code to put a free Dengdeng dictionary widget on a website, for example a teacher's class page or a blog. Widgets: word_card (a word with pinyin, meanings, a sound button and a link to the word's cartoon when it has one), word_of_the_day (a new common word every day) and search_box (a dictionary search form). The code is an iframe plus a plain credit link; tell the user to paste both into an HTML or embed block. Returns the code, the frame URL and size, and the widgets page with instructions for WordPress and Google Sites.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "widget": {
                "description": "Which widget to embed.",
                "enum": ["word_card", "word_of_the_day", "search_box"],
                "type": "string"
              },
              "word": {
                "description": "The Chinese word for word_card, for example 谢谢. Not used by word_of_the_day and search_box.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["widget"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get dictionary widget code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:847e71ea17908a0b481bb3c155433be2b7349a4543b15fe08e8a20813f18d943"
        },
        {
          "name": "hsk_word_list",
          "title": "HSK 3.0 word list",
          "description": "One page (100 words) of an HSK 3.0 vocabulary list (the 2021 standard, also called the new HSK), ordered by pinyin, with pinyin, a short English meaning and the word page URL for each word. Bands 1–6 are separate lists; 7-9 is the combined advanced band. Returns the number of pages, so ask for later pages with the page argument. To find the band of one word, use look_up_word or search_dictionary instead of scanning the lists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "band": {
                "description": "The HSK 3.0 band: 1, 2, 3, 4, 5, 6 or 7-9.",
                "enum": ["1", "2", "3", "4", "5", "6", "7-9"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "The page of the list, 100 words per page. The first page is 1.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["band"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "HSK 3.0 word list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:08512928520354aa916aa868eaf78fe299d3e61378e67869dd9c4fbbc5c8428f"
        },
        {
          "name": "look_up_word",
          "title": "Look up a Chinese word",
          "description": "Look up one Chinese word or character in the Dengdeng Chinese–English dictionary. Returns the simplified and traditional forms, tone-marked pinyin for each reading, the English meanings, the HSK 3.0 band, measure words, and, when the word has them, two example sentences with pinyin and English, an audio URL and a short cartoon. Also returns the URL of the word's dictionary page and links to its sections: the cartoon, stroke order, example sentences and, for some words, a slang, idiom or measure-word guide. Use it for questions such as “what does 加油 mean” or “how do you pronounce 银行”. The word must be written in Chinese characters; use search_dictionary for pinyin or English. It looks up dictionary entries only and does not translate sentences.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "word": {
                "description": "One Chinese word or character in simplified or traditional characters, for example 你好 or 學習.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a Chinese word"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d717562985cd0fbf3110a07841357c1086f07124bd9cbb9c7c62696545a23f0a"
        },
        {
          "name": "search_dictionary",
          "title": "Search the Chinese dictionary",
          "description": "Search the Dengdeng Chinese–English dictionary by pinyin (with or without tone marks, for example “xuexi” or “xué xí”), by English meaning (for example “library”), or by Chinese characters. Returns up to 10 matching words with pinyin, a short meaning, the HSK 3.0 band and the URL of each word page, plus the URL of the full results. Use look_up_word afterwards for the full entry of one result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "default": "all",
                "description": "Limit the search to one field: pinyin, simplified, traditional or english. Use all (the default) when unsure.",
                "enum": ["all", "pinyin", "simplified", "traditional", "english"],
                "type": "string"
              },
              "query": {
                "description": "Pinyin, English or Chinese characters, up to 100 characters.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Chinese dictionary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a71decf21b7ad9f9bfc08113d3b9af3bfc3d1db6080e01ff1e629e5f1e5ee85"
        }
      ],
      "digest": "sha256:bcc8207ee105ed689826e059ac20118e3c1b9819b93b77a00c08b57793cc123d"
    }
  }
