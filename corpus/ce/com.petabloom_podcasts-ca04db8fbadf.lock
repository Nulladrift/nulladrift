        {
          "name": "search_episodes_by_topic",
          "title": "Search Episodes by Topic",
          "description": "Semantic topic search across the podcast catalog. Unlike `search_episodes` (which does lexical/keyword matching), this tool understands meaning: a query for 'AI safety' will match episodes about 'AI alignment', 'AGI risk', or 'frontier model evaluation' even if they don't contain the exact phrase. Returns ranked episodes with the matched topic phrases so you can explain *why* each result is relevant before fetching the transcript. Best for conceptual or thematic queries — use `search_episodes` instead when the user is looking for a specific person, product, or verbatim phrase.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "default": 0,
                "description": "Zero-based episode offset for pagination. Use the `next_cursor` returned by a prior search/listing call to fetch the next page of results.",
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of episodes to return. Must be between 1 and 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "published_after": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inclusive lower publication-date bound. Accepts YYYY-MM-DD or ISO 8601 datetime."
              },
              "published_before": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inclusive upper publication-date bound. Accepts YYYY-MM-DD or ISO 8601 datetime."
              },
              "show_guid": {
                "default": "",
                "description": "Optional canonical show GUID (as returned by `search_episodes` or `get_latest_episodes` in the `show_guid` field) to restrict topic search to a single podcast. Leave empty to search across all shows.",
                "type": "string"
              },
              "topic": {
                "description": "Semantic topic to find episodes about. Free-form phrasing welcome — the server embeds this string and finds episodes whose extracted topic phrases are closest in meaning. Good examples: 'AI safety', 'EU AI Act regulation', 'GPU supply constraints', 'Theo Epstein on roster construction'. Distinct from `search_episodes`, which performs lexical keyword matching.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Number of episodes returned on this page.",
                "type": "integer"
              },
              "episodes": {
                "description": "Episodes ranked by best topic-phrase similarity to the query.",
                "items": {
                  "properties": {
                    "best_similarity": {
                      "description": "Similarity of the strongest topic match — the value the episodes were sorted by.",
                      "type": "number"
                    },
                    "description": {
                      "description": "Episode description, truncated for search result display.",
                      "type": "string"
                    },
                    "duration_seconds": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Episode duration in seconds when available from the source feed."
                    },
                    "episode_guid": {
                      "description": "Podcast episode GUID.",
                      "type": "string"
                    },
                    "episode_title": {
                      "description": "Podcast episode title.",
                      "type": "string"
                    },
                    "matched_topics": {
                      "description": "Topic phrases from this episode that matched the query, ordered by similarity (best first). Use these to summarize *why* the episode is relevant before fetching the full transcript.",
                      "items": {
                        "properties": {
                          "phrase": {
                            "description": "The extracted topic phrase that matched. Useful for explaining to the user why this episode came back for their query.",
                            "type": "string"
                          },
                          "similarity": {
                            "description": "Cosine similarity between the query and this topic phrase, in [0.0, 1.0]. Higher is more semantically similar.",
                            "type": "number"
                          }
