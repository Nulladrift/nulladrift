        {
          "name": "get_transcript",
          "title": "Get Transcript",
          "description": "Fetch a bounded transcript chunk for a specific episode using its show and episode GUIDs. Use `next_cursor` to continue reading.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "default": 0,
                "description": "Zero-based character offset into the transcript. Use the `next_cursor` returned by a prior get_transcript call to fetch the next chunk.",
                "minimum": 0,
                "type": "integer"
              },
              "episode_guid": {
                "description": "Episode GUID returned by `search_episodes` or `get_latest_episodes`.",
                "minLength": 1,
                "type": "string"
              },
              "max_chars": {
                "default": 12000,
                "description": "Target maximum number of transcript characters to return. Chunks prefer natural boundaries and may be slightly shorter. Must be between 100 and 20000.",
                "maximum": 20000,
                "minimum": 100,
                "type": "integer"
              },
              "show_guid": {
                "description": "Podcast show GUID returned by `search_episodes` or `get_latest_episodes`.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["episode_guid", "show_guid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "char_end": {
                "description": "Exclusive zero-based end offset of this chunk in the complete transcript.",
                "type": "integer"
              },
              "char_start": {
                "description": "Inclusive zero-based start offset of this chunk in the complete transcript.",
                "type": "integer"
              },
              "duration_seconds": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Episode duration in seconds when available from the source feed."
              },
              "episode_guid": {
                "description": "Podcast episode GUID requested by the client.",
                "type": "string"
              },
              "episode_title": {
                "description": "Podcast episode title.",
                "type": "string"
              },
              "has_more": {
                "description": "Whether another get_transcript call is needed to continue reading.",
                "type": "boolean"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cursor to pass to the next get_transcript call, or null at the end."
              },
              "published_date": {
                "description": "Episode publication timestamp in ISO 8601 format.",
                "type": "string"
              },
              "rss_feed_url": {
                "description": "RSS feed URL for the podcast show.",
                "type": "string"
              },
              "show_guid": {
                "description": "Podcast show GUID requested by the client.",
                "type": "string"
              },
              "show_title": {
                "description": "Podcast show title.",
                "type": "string"
              },
              "text": {
                "description": "Transcript chunk text.",
                "type": "string"
              },
              "total_chars": {
                "description": "Total character count of the complete transcript text.",
                "type": "integer"
              }
            },
            "required": ["char_end", "char_start", "episode_guid", "episode_title", "has_more", "published_date", "rss_feed_url", "show_guid", "show_title", "text", "total_chars"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
