                        "required": ["phrase", "similarity"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "published_date": {
                      "description": "Episode publication timestamp in ISO 8601 format.",
                      "type": "string"
                    },
                    "rss_feed_url": {
                      "description": "RSS feed URL for the podcast show.",
                      "type": "string"
                    },
                    "show_guid": {
                      "description": "Podcast show GUID.",
                      "type": "string"
                    },
                    "show_title": {
                      "description": "Podcast show title.",
                      "type": "string"
                    }
                  },
                  "required": ["best_similarity", "description", "episode_guid", "episode_title", "matched_topics", "published_date", "rss_feed_url", "show_guid", "show_title"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cursor to pass to the next search call to retrieve the next page of results, or null if there are no more pages."
              },
              "query": {
                "description": "The topic query that was embedded and searched.",
                "type": "string"
              },
              "total_count": {
                "description": "Number of matching episodes, counted over the nearest-match candidate window rather than the whole catalog. When `total_count_is_approximate` is true, treat this as a lower bound — broad queries may have more matches than reported.",
                "type": "integer"
              },
              "total_count_is_approximate": {
                "default": false,
                "description": "True when the candidate window was exhausted, so `total_count` undercounts the true number of matches. When false, `total_count` is exact. Refine the query for tighter results if this is true and you need a complete set.",
                "type": "boolean"
