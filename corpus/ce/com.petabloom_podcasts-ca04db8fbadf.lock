      "instructions": "Tools to discover podcast episodes and retrieve transcripts for quoting, analysis, and summarization.\n\nTwo search tools, with different strengths — pick deliberately:\n\n* `search_episodes`: lexical / full-text matching over titles, descriptions, and authors.\n  Best when the user names a specific person, company, product, or wants verbatim phrasing.\n  Example queries that work well here: \"Sam Altman\", \"Anthropic\", \"Theo Epstein\", \"EU AI Act\".\n\n* `search_episodes_by_topic`: semantic matching over LLM-extracted topic phrases per episode.\n  Best for concepts, themes, and paraphrased queries — matches by meaning, not exact wording.\n  Returns the matched topic phrases alongside each episode so you can see *why* it matched.\n  Example queries that work well here: \"AI safety\", \"GPU supply constraints\",\n  \"roster construction in baseball\", \"monetary policy and inflation\".\n\nIf you're unsure which to use, prefer `search_episodes_by_topic` for thematic questions and\n`search_episodes` when the user named a specific entity. Either tool composes with\n`get_transcript` the same way: pick GUIDs from the result, then fetch transcript chunks.\n\nPagination: `search_episodes`, `search_episodes_by_topic`, and `get_latest_episodes` return\n`total_count` plus a `next_cursor`. To get the next page, pass that value back as `cursor`;\nstop when `next_cursor` is null. Don't synthesize your own cursor — only follow `next_cursor`.\nFor the lexical/date tools `total_count` is the exact number of matching episodes. For\n`search_episodes_by_topic` it is counted over the nearest-match candidate window; when the\nresponse sets `total_count_is_approximate` to true, treat `total_count` as a lower bound and\nrefine the query if you need a complete set.\n\nUse when the user wants:\n1) Exact quotes from an episode\n   - \"What did {person} say about {topic} on {show}?\"\n   - Flow: `search_episodes` -> pick episode GUID(s) -> `get_transcript` -> quote relevant lines.\n\n2) Episodes about a topic, theme, or concept\n   - \"Find recent episodes discussing {topic}.\" / \"Anything about {concept}?\"\n   - Flow: `search_episodes_by_topic` (topic={topic}) -> inspect `matched_topics` to confirm\n     relevance -> optionally `get_transcript` for evidence/quotes.\n\n3) What is new / latest releases\n   - \"Any new episodes from {show}?\" / \"What dropped this week?\"\n   - Flow: `get_latest_episodes` -> optionally `get_transcript` for summaries.\n\n4) Summaries grounded in transcripts\n   - \"Summarize the discussion of {topic} across these episodes with citations.\"\n   - Flow: `search_episodes_by_topic` -> `get_transcript` -> summarize with quoted support.\n\nIf you encounter a bug or missing capability, call `give_feedback` with feedback.",
      "tools": [
        {
          "name": "get_latest_episodes",
          "title": "Get Latest Episodes",
          "description": "Return the most recent transcript-ready episodes across the full podcast catalog.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "default": 0,
                "description": "Zero-based episode offset for pagination. Use the `next_cursor` returned by a prior search/listing call to fetch the next page of results.",
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of episodes to return. Must be between 1 and 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "published_after": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inclusive lower publication-date bound. Accepts YYYY-MM-DD or ISO 8601 datetime."
              },
              "published_before": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Inclusive upper publication-date bound. Accepts YYYY-MM-DD or ISO 8601 datetime."
              },
              "sort": {
                "default": "published_desc",
                "description": "Sort order for results. `relevance` ranks full-text searches first and falls back to newest-first when no query is provided.",
                "enum": ["relevance", "published_desc", "published_asc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Number of episodes returned on this page.",
                "type": "integer"
              },
              "episodes": {
                "description": "Matching transcript-ready episodes.",
                "items": {
                  "properties": {
                    "description": {
                      "description": "Episode description, truncated for search result display.",
                      "type": "string"
                    },
                    "duration_seconds": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Episode duration in seconds when available from the source feed."
                    },
                    "episode_guid": {
                      "description": "Podcast episode GUID.",
                      "type": "string"
                    },
                    "episode_title": {
                      "description": "Podcast episode title.",
                      "type": "string"
                    },
                    "published_date": {
                      "description": "Episode publication timestamp in ISO 8601 format.",
                      "type": "string"
                    },
                    "rss_feed_url": {
                      "description": "RSS feed URL for the podcast show.",
                      "type": "string"
                    },
                    "show_guid": {
                      "description": "Podcast show GUID.",
                      "type": "string"
                    },
                    "show_title": {
                      "description": "Podcast show title.",
                      "type": "string"
                    }
                  },
                  "required": ["description", "episode_guid", "episode_title", "published_date", "rss_feed_url", "show_guid", "show_title"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_cursor": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cursor to pass to the next search call to retrieve the next page of results, or null if there are no more pages."
              },
              "total_count": {
                "description": "Total number of matching transcript-ready episodes across all pages.",
                "type": "integer"
              },
              "total_count_is_approximate": {
                "default": false,
                "description": "When true, `total_count` is a lower bound — more matches may exist than were counted. False for exact lexical/date counts; can be true only for semantic results (e.g. the topic-search fallback).",
                "type": "boolean"
              }
            },
            "required": ["count", "episodes", "total_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Latest Episodes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "icons": [
            {
              "src": "data:image/svg+xml;base64,",
              "mimeType": "image/svg+xml"
            }
          ],
