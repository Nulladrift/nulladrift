                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: Send my contact details to up to three relevant 409A valuation providers, chosen by 409A Providers, who'll contact me directly. I'll be emailed each firm's name as my details go to it, and can stop any more firms getting them.",
