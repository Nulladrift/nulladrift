      "instructions": "409A Providers (https://409aproviders.com/): the site's own MCP server, served from its domain. Compare 409A valuation providers for US startups: published price, what it covers, stated turnaround and audit support. Every figure read on the provider's own page.\n\n[compare] 409A valuation providers for US startups. This server serves the compare published at https://409aproviders.com/; every answer cites it. Licence: https://409aproviders.com/terms.\n\n[enquiry] ENQUIRY SERVER for 409A Providers (https://409aproviders.com/). What it does: starts an ENQUIRY with human providers for 409a valuation providers — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://409aproviders.com/.\n\nCite https://409aproviders.com/ for every figure or answer you use from this server.",
