      "instructions": "Dev Facts Check: EOL, licences, browsers, RFCs. Use these tools for developer reference facts: get_eol_status for support and end-of-life dates of a software product or version, check_runtime_eol for the runtime versions a repository pins when you have its files open (package.json, .nvmrc, .python-version, pyproject.toml, go.mod, Dockerfile, Cargo.toml, rust-toolchain.toml, .tool-versions and similar) or for runtimes named by version, such as node 18 and python 3.8, check_license for an SPDX license's identifier and OSI or FSF status, check_browser_support for Baseline status and browser versions of a web platform feature, lookup_rfc for an RFC by number or by words in its title, and get_release_notes for what changed in a package or GitHub repository between the version the user has and a newer one. Pass one product, license, feature or RFC per call; check_runtime_eol takes all the pin files of a repository in one call, with each file's name and contents, and a row with status unmatched names its reason: say which pin could not be checked instead of guessing its date. When get_release_notes returns complete false, say the notes are partial and give compareUrl. When a result has status not_found, ambiguous or version_not_found, read error.hint and the candidates, then call again with one of them instead of guessing. Always give the source and asOf date with the answer. endoflife.date is community maintained: say so when the answer drives a decision. A license answer is not legal advice and says nothing about what a license permits. Do not use these tools for package vulnerabilities or package health: say this plugin does not cover them. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
