                      "type": "string"
                    },
                    "product": {
                      "description": "The endoflife.date product",
                      "type": ["string", "null"]
                    },
                    "range": {
                      "description": "True when the pin is a range; the row is then the oldest version the range allows",
                      "type": "boolean"
                    },
                    "reason": {
                      "description": "Why the row has no cycle: no_product, no_version, floating, no_lower_bound, cycle_not_found, too_many_products or source_unavailable",
                      "properties": {
                        "code": {
                          "type": "string"
                        },
                        "message": {
                          "type": "string"
                        }
                      },
                      "required": ["code", "message"],
                      "type": "object"
                    },
                    "runtime": {
                      "description": "The runtime or image name as the file writes it",
                      "type": "string"
                    },
                    "status": {
                      "description": "ok when the pin matched a release cycle; unmatched with a reason when it did not",
                      "enum": ["ok", "unmatched", "unavailable"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "version": {
                      "description": "The version checked, such as 18 for >=18",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["field", "file", "pin", "product", "range", "runtime", "status", "version"],
                  "type": "object"
                },
                "type": "array"
              },
              "skippedFiles": {
                "items": {
                  "properties": {
                    "file": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "Where the data comes from",
                "type": "string"
              },
              "status": {
                "enum": ["ok", "no_pins", "unavailable"],
                "type": "string"
              },
              "summary": {
                "description": "One line: how many pins are past end of life, ending soon, supported and unmatched",
                "type": "string"
              },
              "truncated": {
