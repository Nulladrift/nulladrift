        {
          "name": "get_release_notes",
          "title": "Get release notes",
          "description": "Get release notes. Use this when the user asks what changed between two versions of a package, or what to watch for in an upgrade, such as \"what changed in express between 4.18.2 and 5.1.0?\" or \"are there breaking changes from requests 2.28 to 2.32?\". Pass the npm or PyPI package name (or a GitHub repo) and fromVersion, the version the user has; toVersion defaults to the latest release. Returns each release after fromVersion up to toVersion, newest first, with its date, link, a short excerpt of its notes and a breaking flag, plus a GitHub compare link. Notes come from GitHub releases and, when those do not reach back far enough, from the repository's changelog file; complete is false when neither covers the whole range. Not for vulnerabilities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "npm (the default) or pypi; used with name",
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "fromVersion": {
                "description": "The version you have now, such as 4.18.2. Notes start after it.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[vV]?\\d",
                "type": "string"
              },
              "name": {
                "description": "Public package name, such as \"express\" or \"requests\". Its latest release names the GitHub repository.",
                "maxLength": 214,
                "minLength": 1,
                "pattern": "^(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9._~-]+$",
                "type": "string"
              },
              "repo": {
                "description": "A GitHub repository instead of, or with, a package name: \"owner/repo\" or its github.com url",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "toVersion": {
                "description": "The version to upgrade to; the package's latest release when left out",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[vV]?\\d",
                "type": "string"
              }
            },
            "required": ["fromVersion"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "type": "string"
              },
              "breakingVersions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "changelogUrl": {
                "type": ["string", "null"]
              },
              "compareUrl": {
                "type": ["string", "null"]
              },
              "complete": {
                "description": "False when the newest 10 GitHub releases and the changelog do not reach back to fromVersion",
                "type": "boolean"
              },
              "ecosystem": {
                "type": "string"
              },
              "error": {
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "hint": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["code", "hint", "message"],
                "type": "object"
              },
              "fromVersion": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "omittedVersions": {
                "description": "Older releases in the range left out to keep the answer short",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "releaseCount": {
                "type": "integer"
              },
              "releases": {
                "description": "Releases after fromVersion up to toVersion, newest first",
                "items": {
                  "properties": {
                    "breaking": {
                      "description": "The notes mention a breaking change or this release starts a new major version",
                      "type": "boolean"
                    },
                    "date": {
                      "type": ["string", "null"]
                    },
                    "notes": {
                      "description": "The release notes as plain text, cut to a short excerpt",
                      "type": "string"
                    },
                    "notesCut": {
                      "type": "boolean"
                    },
