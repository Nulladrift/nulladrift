        {
          "name": "check_runtime_eol",
          "title": "Check runtime end of life",
          "description": "Use this when the user asks whether a runtime version or a project's runtimes are still supported, such as \"is Node 18 past end of life?\" or \"is the Node version in our Dockerfile still supported?\". Pass runtimes by name and version, such as [{\"runtime\": \"node\", \"version\": \"18\"}], or the repository's pin files with their contents: package.json, .nvmrc, .node-version, .python-version, pyproject.toml, Pipfile, runtime.txt, go.mod, .go-version, Dockerfile, compose.yaml, .tool-versions, mise.toml, .ruby-version, Gemfile, composer.json or global.json. Returns one row per pin, past end of life first: the endoflife.date release cycle, end-of-life date, whether it passed, days left, latest patch and next supported cycle. A range such as >=18 is checked at its oldest version; an image tag such as python:3.11-slim at its version, plus its Debian or Alpine base. A pin it cannot match comes back as unmatched with the reason. Data comes from endoflife.date, maintained by volunteers. Not for package vulnerabilities.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Pass runtimes, files, or both; at least one entry in all",
            "properties": {
              "files": {
                "description": "The repository files that pin runtime versions, each with its name and full contents: package.json, .nvmrc, .node-version, .python-version, pyproject.toml, Pipfile, runtime.txt, go.mod, .go-version, Dockerfile, compose.yaml, .tool-versions, mise.toml, .ruby-version, Gemfile, composer.json, global.json, Cargo.toml (rust-version) or rust-toolchain.toml",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "description": "The file's contents as text",
                      "maxLength": 200000,
                      "type": "string"
                    },
                    "name": {
                      "description": "File name or path in the repository, such as \"package.json\", \".nvmrc\" or \"docker/api.Dockerfile\"",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["content", "name"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "runtimes": {
                "description": "Runtimes to check by name and version, when no repository files are open, such as [{\"runtime\": \"node\", \"version\": \"18\"}, {\"runtime\": \"python\", \"version\": \"3.8\"}]",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "runtime": {
                      "description": "Runtime, language or image name as people write it, such as \"node\", \"python\", \"go\", \"ruby\" or \"postgres\"",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "version": {
                      "description": "Version or release cycle, such as \"18\", \"3.8.10\", \"1.22\", \">=20\" or \"lts\"",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["runtime", "version"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "Date of the source data when it states one, otherwise the date it was read (UTC, YYYY-MM-DD)",
                "type": "string"
              },
              "counts": {
                "properties": {
                  "endOfLife": {
                    "type": "integer"
                  },
                  "endingSoon": {
                    "description": "Supported pins that reach end of life within 180 days",
                    "type": "integer"
                  },
                  "pins": {
                    "type": "integer"
                  },
                  "supported": {
                    "type": "integer"
                  },
                  "unmatched": {
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "error": {
                "description": "Present when status is not ok: a stable code, what went wrong and what to do next.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "hint": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["code", "hint", "message"],
                "type": "object"
              },
              "notice": {
                "type": "string"
              },
              "runtimes": {
                "description": "One row per runtime pin: past end of life first, then ending soon, supported, and unmatched last",
                "items": {
                  "properties": {
                    "cycle": {
                      "description": "The release cycle the pin belongs to",
                      "type": "string"
                    },
                    "daysLeft": {
                      "description": "Days until end of life; negative once it has passed, null when no date is announced",
                      "type": ["integer", "null"]
                    },
                    "eolFrom": {
                      "type": ["string", "null"]
                    },
                    "field": {
                      "description": "Where the pin is in the file, such as engines.node, FROM, line 3 or go directive",
                      "type": "string"
                    },
                    "file": {
                      "description": "The file the pin came from, or \"runtimes\" for a runtime named in the runtimes input",
                      "type": "string"
                    },
                    "isEol": {
                      "description": "True once the end-of-life date has passed; null when none is announced",
                      "type": ["boolean", "null"]
                    },
                    "isLts": {
                      "type": "boolean"
                    },
                    "label": {
                      "type": "string"
                    },
                    "latest": {
                      "description": "The latest patch release of the cycle",
                      "type": ["string", "null"]
                    },
                    "latestDate": {
                      "type": ["string", "null"]
                    },
                    "nextSupportedCycle": {
                      "description": "The closest newer cycle that is still supported, long-term-support first; null when there is none",
                      "properties": {
                        "cycle": {
                          "type": "string"
                        },
                        "eolFrom": {
                          "type": ["string", "null"]
                        },
                        "isLts": {
                          "type": "boolean"
                        },
                        "latest": {
