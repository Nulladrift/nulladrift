        {
          "name": "get_eol_status",
          "title": "Get end-of-life status",
          "description": "Get end-of-life status. Use this when the user asks whether a software version is still supported or when it reaches end of life, such as \"is Node.js 20 still supported?\" or \"which Python versions get security fixes?\". Pass the product (nodejs, python, ubuntu, postgresql and so on) and optionally a version or release cycle. With a version it returns that cycle's end-of-life date, whether it has passed, LTS dates and the latest patch. Without one it returns the release cycles that are still supported. Data comes from endoflife.date, maintained by volunteers: confirm with the vendor for contract or compliance decisions. Not for package vulnerabilities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product name as people write it, such as \"nodejs\", \"python\", \"ubuntu\" or \"postgresql\"",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Optional version or release cycle, such as \"20\", \"3.12\" or \"22.04.3\". Leave out to list the supported cycles",
                "maxLength": 30,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "Date of the source data when it states one, otherwise the date it was read (UTC, YYYY-MM-DD)",
                "type": "string"
              },
