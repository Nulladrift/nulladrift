          "description": "Use this when the user asks about an open-source license, such as \"is the MIT license OSI approved?\" or \"what is the SPDX id of Apache License 2.0?\". Pass an SPDX identifier or the license name. Returns the SPDX id, full name, whether it is OSI approved, whether the FSF lists it as free, whether the id is deprecated, and the SPDX page. If the name matches several licenses it returns candidates to choose from. It identifies a license and does not say what the license permits or requires. It is not legal advice.",
