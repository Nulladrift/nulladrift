        {
          "name": "check_authoritative_dns_infra",
          "description": "Measure a hostname's authoritative DNS posture by querying its nameservers directly over TCP/53 from one vantage: reachability, AA flag, recursion exposure, SOA serial consistency, DNSKEY/RRSIG presence (not validation), IPv4/IPv6 parity. Authenticated callers also get a zone-transfer refusal test (no zone data retrieved) and CHAOS disclosure. UDP, BGP, RPKI, anycast not measured.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "force_refresh": {
                "description": "Skip cache.",
                "type": "boolean"
              },
              "format": {
                "description": "compact: less text",
                "enum": ["full", "compact"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "category": {
                "type": "string"
              },
              "checkStatus": {
                "type": "string"
              },
              "findings": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
