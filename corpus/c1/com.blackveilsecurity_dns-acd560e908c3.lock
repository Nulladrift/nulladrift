      "serverInfo": {
        "name": "Blackveil DNS",
        "version": "3.120.0",
        "description": "Source-available DNS & email security scanner — 82 MCP tools (36 check_* checks) across 19 scan categories, with scoring, grading, and remediation guidance"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DNS and email security scanner. Use scan_domain for comprehensive audits (score, grade, findings). Use individual check_* tools for targeted investigation. Use explain_finding for remediation guidance. Use compare_baseline for policy enforcement. Checks are read-only and never modify a target. Most are passive lookups; check_authoritative_dns_infra and check_root_server_set query authoritative and root nameservers directly over TCP/53, and for authenticated callers check_authoritative_dns_infra also tests whether a domain's nameservers refuse a zone transfer (no zone data is retrieved). Long jobs run asynchronously: a *_start tool returns a handle at once (jobId, auditId, scanId or investigationId); pass it to the matching *_status tool until the job completes, then fetch the results with the findings or report tool that the start tool names. Some tools, mainly multi-domain, brand-discovery and reconnaissance tools, need a paid tier (developer or above; a few need enterprise): tools/list marks each with _meta.paidOnly, and an anonymous, free or agent-tier caller gets a 401 or 403 from them. get_access_context reports your own tier. format: \"compact\" returns shorter text and is the default for interactive clients; \"full\" returns everything. Most results are cached for a few minutes and some slower lookups for up to an hour; set force_refresh to rescan, which is limited per day on the free tier.",
      "tools": [
        {
          "name": "analyze_drift",
          "description": "Measure whether a domain's DNS security posture improved or regressed versus a prior scan snapshot; returns a drift classification (improving/stable/regressing/mixed), score delta, and lists of improvements and regressions. Use for \"did our score improve or regress since last time?\"; not compare_baseline, which checks compliance with a fixed policy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baseline": {
                "default": "cached",
                "description": "Prior ScanScore JSON string, or \"cached\" (default) for the last cached scan. Not a policy object.",
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "Domain to analyze drift for",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "force_refresh": {
                "description": "Skip cache.",
                "type": "boolean"
              },
              "format": {
                "description": "compact: less text",
                "enum": ["full", "compact"],
                "type": "string"
              }
            },
            "required": ["baseline", "domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyze Drift"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "group": "intelligence",
            "scanIncluded": false
          },
          "digest": "sha256:c724aab55db262a270d1a505e95ac6e95e8b7d5e53fc9654c312f5cbbc078c1a"
        },
