        {
          "name": "generate",
          "description": "Generate a DNS/email security remediation artifact. Artifact types: spf_record (build a new SPF record), dmarc_record (create a DMARC policy), dkim_config (DKIM key setup), mta_sts_policy (generate an MTA-STS policy file), fix_plan (prioritized remediation plan for all findings), or rollout_plan (phased DMARC enforcement timeline). Use when asked to generate or create a record or policy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artifact": {
                "description": "Which artifact to generate (e.g., \"dmarc_record\", \"fix_plan\").",
                "enum": ["fix_plan", "spf_record", "dmarc_record", "dkim_config", "mta_sts_policy", "rollout_plan"],
                "type": "string"
              },
              "domain": {
                "description": "e.g. example.com",
                "maxLength": 253,
                "minLength": 1,
                "type": "string"
              },
              "force_refresh": {
                "description": "fix_plan: bypass cache and run a fresh scan.",
                "type": "boolean"
              },
              "format": {
                "description": "compact: less text",
                "enum": ["full", "compact"],
                "type": "string"
              },
              "include_providers": {
                "description": "spf_record: providers to include (e.g., [\"google\"]).",
                "items": {
                  "maxLength": 253,
                  "minLength": 1,
                  "pattern": "^[a-z0-9._-]+$",
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "mx_hosts": {
                "description": "mta_sts_policy: MX hosts. Omit to detect from DNS.",
                "items": {
                  "maxLength": 253,
                  "minLength": 1,
                  "pattern": "^[^\\s\\x00-\\x1f\\x7f]*$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "policy": {
                "description": "dmarc_record: policy (default \"reject\").",
                "enum": ["none", "quarantine", "reject"],
                "type": "string"
              },
              "provider": {
                "description": "dkim_config: provider (e.g., \"google\"). Omit for generic.",
                "maxLength": 100,
                "type": "string"
              },
              "rua_email": {
                "description": "dmarc_record: report email. Default: dmarc-reports@{domain}.",
                "maxLength": 254,
                "pattern": "^[^\\s;,@\\x00-\\x1f\\x7f]+@[^\\s;,@\\x00-\\x1f\\x7f]+\\.[^\\s;,@\\x00-\\x1f\\x7f]+$",
                "type": "string"
              },
              "target_policy": {
                "description": "rollout_plan: target DMARC policy (default: reject).",
                "enum": ["quarantine", "reject"],
