{
  "lockfileVersion": 2,
  "subjects": {
    "app.weekendflights/weekendflights": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://weekendflights.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "weekendflights",
        "version": "0.1.0",
        "icons": [
          {
            "src": "https://weekendflights.app/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "weekendflights.app prices the cheapest round trip for every weekend of the next 12 months on any airport pair. weekend_prices answers from the cache at once and searches the unpriced weekends live during the call, like a page visit; allow up to a minute for a route nobody has opened yet. Every answer carries \"url\" (the human page). The tools take every filter the route page has: trip shape (combo), cabin, stops, passengers, departure and return time windows, currency. Defaults are one adult, economy, any stops, Friday-Sunday, native currency. Present prices as current and say that the booking site shows the final price. Link the url. A status of \"not_priced_yet\" after a call means the live search did not finish or was capped; the \"note\" says why and whether to call again.",
      "tools": [
        {
          "name": "cheapest_weekends",
          "title": "Cheapest cached weekends from one origin",
          "description": "The cheapest weekends from one origin across every destination that has a calendar under these filters, sorted by price. Optional month filter (yyyy-mm). Takes the same filters as weekend_prices. This tool reads what is already priced; it does not search every destination. A destination that is absent can be priced with one weekend_prices call for that pair. Pro only: this tool is Anywhere (every destination from one origin). Without Pro it answers pro_required with the Anywhere page url. One route at a time is free with weekend_prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Default 1.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "cabin": {
                "description": "Default \"economy\".",
                "enum": ["economy", "premium-economy", "business", "first"],
                "type": "string"
              },
              "children": {
                "description": "Default 0.",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "combo": {
                "description": "Trip shape. Default \"fri-sun\".",
                "enum": ["mon-mon", "mon-tue", "mon-wed", "mon-thu", "mon-fri", "mon-sat", "mon-sun", "tue-tue", "tue-wed", "tue-thu", "tue-fri", "tue-sat", "tue-sun", "tue-mon", "wed-wed", "wed-thu", "wed-fri", "wed-sat", "wed-sun", "wed-mon", "wed-tue", "thu-thu", "thu-fri", "thu-sat", "thu-sun", "thu-mon", "thu-tue", "thu-wed", "fri-fri", "fri-sat", "fri-sun", "fri-mon", "fri-tue", "fri-wed", "fri-thu", "sat-sat", "sat-sun", "sat-mon", "sat-tue", "sat-wed", "sat-thu", "sat-fri", "sun-sun", "sun-mon", "sun-tue", "sun-wed", "sun-thu", "sun-fri", "sun-sat"],
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 code. Default: the native currency of the origin.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "infants": {
                "description": "Default 0.",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "How many weekends to return. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "Limit to one month, format yyyy-mm.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "origin": {
                "description": "Departure airport IATA code, e.g. \"ZRH\".",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "out_from": {
                "description": "Earliest outbound departure, \"HH:MM\".",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "out_to": {
                "description": "Latest outbound departure, \"HH:MM\".",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "ret_from": {
                "description": "Earliest return departure, \"HH:MM\".",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "ret_to": {
                "description": "Latest return departure, \"HH:MM\".",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "stops": {
                "description": "\"any\" (default) or \"nonstop\".",
                "enum": ["any", "nonstop"],
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a641a2d95ca33846d9b5567fe0450f21f3d4eb44068cf3f227f67cd18783cd1e"
        },
        {
          "name": "list_origins",
          "title": "List departure airports with a cached weekend calendar",
          "description": "Returns the departure airports (IATA) that have at least one priced weekend calendar, with the count of priced destinations per origin. Start here to learn what cheapest_weekends can answer at once. weekend_prices works for any airport pair and searches live when needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b260cf674df11ba20df318d5d0ac61301b21d7d8769e4818373a29bf5ff66b2"
        },
        {
          "name": "weekend_prices",
          "title": "Weekend round-trip prices for one route",
          "description": "Every weekend of the next 12 months for one origin-destination pair, with the cheapest round-trip price per weekend Prices answer at once; weekends not priced yet are searched live during the call, the way a page visit searches them (usually 10-40 s, at most ~55 s). If the search does not finish, the answer says which weekends are still open and to call again. Takes every filter the route page has: trip shape (combo), cabin, stops, passengers, departure and return time windows, currency. Free: fri-sun, economy, any stops, any passenger mix, no time window. Pro session cookie: other combos, other cabins, time windows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Default 1. Free. At most 9 travellers in total.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "cabin": {
                "description": "Default \"economy\" (free). Other cabins need a Pro session cookie.",
                "enum": ["economy", "premium-economy", "business", "first"],
                "type": "string"
              },
              "children": {
                "description": "Ages 2-11. Default 0. Free.",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "combo": {
                "description": "Trip shape: out day and back day as \"{out}-{back}\" with 3-letter days (\"tue-thu\"); the same day twice is a day trip. Default \"fri-sun\" (free). Other shapes need a Pro session cookie.",
                "enum": ["mon-mon", "mon-tue", "mon-wed", "mon-thu", "mon-fri", "mon-sat", "mon-sun", "tue-tue", "tue-wed", "tue-thu", "tue-fri", "tue-sat", "tue-sun", "tue-mon", "wed-wed", "wed-thu", "wed-fri", "wed-sat", "wed-sun", "wed-mon", "wed-tue", "thu-thu", "thu-fri", "thu-sat", "thu-sun", "thu-mon", "thu-tue", "thu-wed", "fri-fri", "fri-sat", "fri-sun", "fri-mon", "fri-tue", "fri-wed", "fri-thu", "sat-sat", "sat-sun", "sat-mon", "sat-tue", "sat-wed", "sat-thu", "sat-fri", "sun-sun", "sun-mon", "sun-tue", "sun-wed", "sun-thu", "sun-fri", "sun-sat"],
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 code. Default: the native currency of the origin (ZRH → CHF, BCN → EUR).",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "dest": {
                "description": "Arrival airport IATA code, e.g. \"BCN\".",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "infants": {
                "description": "Under 2. Default 0. Free.",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              },
              "origin": {
                "description": "Departure airport IATA code, e.g. \"ZRH\".",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "out_from": {
                "description": "Earliest outbound departure, \"HH:MM\" local. Pro. Cached only for weekends whose flight detail is stored.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "out_to": {
                "description": "Latest outbound departure, \"HH:MM\". Pro.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "ret_from": {
                "description": "Earliest return departure, \"HH:MM\". Pro.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "ret_to": {
                "description": "Latest return departure, \"HH:MM\". Pro.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "stops": {
                "description": "\"any\" (default) or \"nonstop\". Free.",
                "enum": ["any", "nonstop"],
                "type": "string"
              }
            },
            "required": ["dest", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c32dc0e9fe0455720fa9c89cfc72f5f0ad64dcf00287b28e2e064cf93645bbc"
        }
      ],
      "digest": "sha256:55d094c465d0e5d5b5804b1db5b54027ced9e6572826a809dd982b318f1a1cdf"
    }
  }
}
