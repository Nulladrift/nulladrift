{
  "lockfileVersion": 2,
  "subjects": {
    "com.minradar/minradar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://minradar.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "demand-radar",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Demand Radar mines public App Store data for buildable opportunities. Typical flow: find_unmet_demand (or find_solo_buildable) -> get_opportunity_brief -> generate_app_brief. Tool names here are exactly the names tools/list returns.",
      "tools": [
        {
          "name": "explain_method",
          "description": "Explain the scoring formulas, weights, and the honest limitations of the data. Use when a user questions the numbers.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7438f4e019b04e94a98c0048f2905fe6309b48f76cbddf9c18798527efc50d60"
        },
        {
          "name": "find_solo_buildable",
          "description": "Find opportunities a single developer can realistically build: clear winnability plus an explicit single-user, local or offline core. Use when solo feasibility is the primary constraint.",
          "inputSchema": {
            "properties": {
              "genre": {
                "description": "Restrict to one App Store category, e.g. Productivity.",
                "type": "string"
              },
              "include_institutional": {
                "default": false,
                "description": "Include institution-locked products that a solo dev cannot win.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return.",
                "maximum": 200,
                "type": "integer"
              },
              "max_rating": {
                "description": "Only include apps at or below this average rating, e.g. 4.0.",
                "type": "number"
              },
              "max_rating_count": {
                "default": 0,
                "description": "Optional ceiling to exclude unassailable giants.",
                "type": "integer"
              },
              "min_rating_count": {
                "default": 5000,
                "description": "Rating volume is the install proxy. On /api/lens this remains a legacy alias for the scaled value; /api/hotspots uses it literally.",
                "type": "integer"
              },
              "min_rating_count_scaled": {
                "default": 5000,
                "description": "Pre-scaled rating volume filter. /api/lens applies max(300, floor(value / 3)); /api/paying applies max(200, floor(value / 5)).",
                "type": "integer"
              },
              "storefront": {
                "default": "us",
                "description": "Two-letter App Store region. The value is region identity, never a label.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5722c0f1712b0140427907f9d40cfdd63ca1a33d3503460d59d317ae1fa7f53"
        },
        {
          "name": "find_unmet_demand",
          "description": "Rank App Store opportunities in apps that already have a large user base but whose users are clearly unhappy (unmet demand). Returns a ranked table with tier, score, rating and scale. Use this first when deciding what app to build.",
          "inputSchema": {
            "properties": {
              "genre": {
                "description": "Restrict to one App Store category, e.g. Productivity.",
                "type": "string"
              },
              "include_institutional": {
                "default": false,
                "description": "Include institution-locked products that a solo dev cannot win.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return.",
                "maximum": 200,
                "type": "integer"
              },
              "max_rating": {
                "description": "Only include apps at or below this average rating, e.g. 4.0.",
                "type": "number"
              },
              "max_rating_count": {
                "default": 0,
                "description": "Optional ceiling to exclude unassailable giants.",
                "type": "integer"
              },
              "min_rating_count": {
                "default": 5000,
                "description": "Rating volume is the install proxy. On /api/lens this remains a legacy alias for the scaled value; /api/hotspots uses it literally.",
                "type": "integer"
              },
              "min_rating_count_scaled": {
                "default": 5000,
                "description": "Pre-scaled rating volume filter. /api/lens applies max(300, floor(value / 3)); /api/paying applies max(200, floor(value / 5)).",
                "type": "integer"
              },
              "storefront": {
                "default": "us",
                "description": "Two-letter App Store region. The value is region identity, never a label.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c46a4dee8e45ade6707b0eb4180c547208daae534f2ea766ab2cf59192d6a00"
        },
        {
          "name": "generate_app_brief",
          "description": "Produce a ready-to-build product specification for an opportunity, formatted for a specific AI coding agent (codex, claude, or cursor). Includes the wedge, the verbatim complaints to fix, verified open-source accelerators, and a verification plan.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store track id.",
                "type": "integer"
              },
              "storefront": {
                "default": "us",
                "description": "Two-letter App Store region. The value is region identity, never a label.",
                "type": "string"
              },
              "target": {
                "default": "codex",
                "description": "AI coding agent that will receive the brief.",
                "enum": ["codex", "claude", "cursor"],
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e466abf6126c1ca94cb9f591b2b144c0924776f8542b98f0c8944c397f9988b"
        },
        {
          "name": "get_opportunity_brief",
          "description": "Full evidence dossier for one app: score breakdown, plain-language diagnosis, complaint themes with verbatim user quotes, review provenance, and matching open-source accelerators. Use after find_low_hanging_fruit to inspect a specific candidate.",
          "inputSchema": {
            "properties": {
              "app_id": {
                "description": "App Store track id.",
                "type": "integer"
              },
              "include_github": {
                "default": true,
                "description": "MCP name for the REST with_github switch.",
                "type": "boolean"
              },
              "storefront": {
                "default": "us",
                "description": "Two-letter App Store region. The value is region identity, never a label.",
                "type": "string"
              }
            },
            "required": ["app_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a524490c63bb08b57ce33e514dccef1d112913e6fece4a3792ed5edfa1b02d50"
        },
        {
          "name": "market_stats",
          "description": "Report local data coverage (apps, reviews, chart snapshots) and the last ingest run.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25601067d368a6e8ac259854b80aea53aa9cd9cc8fa76a3343449ceed9b636e6"
        },
        {
          "name": "search_open_source_accelerators",
          "description": "Find maintained, commercially reusable open-source projects for a niche, with license posture. Use to avoid rebuilding infrastructure and to check whether a dependency is safe to ship.",
          "inputSchema": {
            "properties": {
              "genre": {
                "description": "Restrict to one App Store category, e.g. Productivity.",
                "type": "string"
              },
              "limit": {
                "default": 6,
                "description": "Maximum number of results to return.",
                "maximum": 200,
                "type": "integer"
              },
              "theme": {
                "description": "Complaint theme key, e.g. data_loss_sync, paywall_aggressive, ai_quality.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d18822bcf380641a88a7bb7ef7023b801ec39feebac5a96e1059b6441a69f9e5"
        },
        {
          "name": "validate_paying_market",
          "description": "Rank app categories by evidence that users already pay inside them: how many of its apps reach the store-wide Top-Grossing chart, how many charge upfront, paywall language in sampled reviews, and review depth. Call this before building to confirm a market monetises.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return.",
                "maximum": 200,
                "type": "integer"
              },
              "min_rating_count": {
                "default": 5000,
                "description": "Rating volume is the install proxy. On /api/lens this remains a legacy alias for the scaled value; /api/hotspots uses it literally.",
                "type": "integer"
              },
              "storefront": {
                "default": "us",
                "description": "Two-letter App Store region. The value is region identity, never a label.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79d672bddeffaedabbaab4ec7436f923df6886116a5e7aa10ea55b7515cc9d67"
        }
      ],
      "digest": "sha256:d06f7c04e4dd556e7f998176ac5f65da2d8d6f5469375941b33ade198e3bd191"
    }
  }
}
