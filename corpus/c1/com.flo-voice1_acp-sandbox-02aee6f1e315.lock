        },
        {
          "name": "request_paypal_payment",
          "title": "Ask the user to pay with PayPal",
          "description": "Create a PayPal (sandbox) payment for the checkout's exact total. Returns approve_url, the PayPal link where the user approves the payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask the user to pay with PayPal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a4a377c315778490afd0e1af5bfe8655c13fa2096a295ff432cd60fe5fbe0f59"
        },
        {
          "name": "update_checkout",
          "title": "Change the cart",
          "description": "Replace the items in an open checkout (e.g. the user changed their mind). Any PayPal payment created for the old total is dropped.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "product_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "maximum": 99,
                      "type": "integer"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["items", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change the cart"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9c07d202addf0a157d01b54659b3cf0860ab79afe8687dbda46b5f9f524c7284"
        },
        {
          "name": "wait_for_payment_approval",
          "title": "Wait for the user to approve the PayPal payment",
          "description": "Wait (up to 45s per call) until PayPal reports the user approved the payment. Returns still_waiting if the user has not approved yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "session_id": {
                "type": "string"
              },
              "timeout_seconds": {
                "default": 45,
                "maximum": 45,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Wait for the user to approve the PayPal payment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:178843baad7dcc33865bc099dd766c78654e5a7cd6b8804b5478e613b055ee93"
        }
      ],
      "digest": "sha256:33b684511abda7ce1e7076a1ff7140f150e9d8deb98d4fda994460037eb48afe"
    }
  }
