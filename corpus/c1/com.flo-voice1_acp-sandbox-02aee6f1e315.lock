          },
          "digest": "sha256:d7095d9d799b34b487a964c4f78cbf9b6ac75b6057358f3f9a9a621808d17d24"
        },
        {
          "name": "complete_checkout",
          "title": "Complete the checkout",
          "description": "Place the order. With payment \"paypal\" the approved PayPal payment is captured first, and the order only goes through if PayPal confirms the money for the exact total. \"mock\" skips real payment (testing only).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "payment": {
                "default": "paypal",
                "enum": ["paypal", "mock"],
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Complete the checkout"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9ac474188477469106ad79fa094b47bd525063e48e1478dcced12ddfc7809bf7"
        },
        {
          "name": "create_checkout",
          "title": "Create a checkout",
          "description": "Start a checkout (an Agentic Commerce Protocol checkout session) with the products and quantities the user wants. Returns the session id, the cart and its total. If no api_key is given, a sandbox key is created and returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "buyer_email": {
                "description": "The buyer's email, if the user gave one.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "items": {
                "description": "Products to buy, by product_id from list_products.",
                "items": {
                  "properties": {
                    "product_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "maximum": 99,
                      "type": "integer"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:97cfb6bef1a3d13e8ac959017a23c3913226eb401c5563c3bc8d6b7050d310f4"
        },
        {
          "name": "get_checkout",
          "title": "Get a checkout",
          "description": "Read the current cart, total, payment status and order of a checkout.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:97342748b98ded712c2abea49feb08f1dd56ec417a49a691e40d56972ee49c58"
        },
        {
          "name": "list_products",
          "title": "List products",
          "description": "List everything the demo store sells, with product ids and prices. Prices are in USD.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
