          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "cancel_checkout",
          "title": "Cancel a checkout",
          "description": "Cancel an open checkout. Nothing is charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "Sandbox key from create_checkout (not needed if the connection already carries one).",
                "type": "string"
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel a checkout"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
