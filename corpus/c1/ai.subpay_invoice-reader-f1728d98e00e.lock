      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "subpay-invoice-reader",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Reads invoices, bills and receipts from PDF into structured JSON — vendor, customer, dates, PO, line items, discount, tax, shipping, total, balance due — and checks the arithmetic: quantity × unit price, lines to subtotal, tax rate, total and balance due. The response says exactly which figures don't add up. Call extract_invoice with the PDF base64-encoded; it costs $0.04 per page (up to 25 pages) in USDC per successful read over x402 (Base or Solana) — the payment request quotes the exact amount — and failed reads are not charged. First 3 reads a day are free (documents up to 10 pages, no payment needed); after that, the usual price. Check `checks` and `warnings` before paying an invoice: a failed check means its printed figures don't add up. Terms: https://subpay.ai/api-terms",
      "tools": [
        {
          "name": "about",
          "title": "About this service",
          "description": "Free. What extract_invoice reads, the arithmetic checks, price, payment networks and terms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:60352cbeb82a955ecee085ce1d40430f629c12a9e13e1f99bc232c539b583dd6"
        },
        {
          "name": "extract_invoice",
          "title": "Read an invoice and check that it adds up",
          "description": "Reads invoices, bills and receipts from PDF into structured JSON — vendor, customer, dates, PO, line items, discount, tax, shipping, total, balance due — and checks the arithmetic: quantity × unit price, lines to subtotal, tax rate, total and balance due. The response says exactly which figures don't add up. Returns vendor, customer, invoice number, dates, PO, line items, subtotal, discount, taxes, shipping, total, amount paid and balance due, plus checks (passed true/false, or null when the figures aren't printed). $0.04 per page (up to 25 pages) in USDC per successful read via x402, quoted before you pay; failed reads are free. First 3 reads a day are free (documents up to 10 pages, no payment needed); after that, the usual price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "document": {
                "description": "The PDF, base64-encoded (a data: URL prefix is fine). Max about 3 MB and 25 pages.",
                "type": "string"
              },
              "fileName": {
                "description": "Original file name, if known.",
                "type": "string"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
