        "name": "com.clawhard/ripe",
        "title": "Ripe",
        "version": "1.0.0",
        "description": "Ripe checks the versions in a Dockerfile, compose file, CI workflow, package.json, pyproject, go.mod or .nvmrc against live release data: which ones are end of life, which get security fixes only, which are behind the latest patch, and whether each Docker tag really exists. It returns each problem with its line and a fix, with replacement tags it confirmed on the registry. No account.",
