{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kwekuanansi/ghana-translate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kwekuanansi.ai/mcp/ghana-translate"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kweku-anansi-ghana-translate",
        "title": "Ghana Translate",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ghana Translate turns short text between English and Twi, Ewe or Ga, using the Khaya service of Ghana NLP. It is machine translation: give the result with the caution it returns, and do not present it as checked by a speaker. It does not handle long documents or text where a mistake could cause harm.",
      "tools": [
        {
          "name": "translate.languages",
          "title": "Languages this can translate",
          "description": "Use this when you need to know which languages and how much text the Ghana translation tool handles before calling it. Do not use it to translate: use translate.text for that.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "by": {
                "type": "string"
              },
              "caution": {
                "type": "string"
              },
              "max_characters": {
                "type": "integer"
              },
              "pairs": {
                "type": "array"
              }
            },
            "required": ["by", "caution", "max_characters", "pairs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f2faf623a41b982f79ddd33da20446afca83e065ae6f3fdc3ea75f4aa458b34"
        },
        {
          "name": "translate.text",
          "title": "Translate between English and Twi, Ewe or Ga",
          "description": "Use this when someone wants a short text translated between English and one of Twi, Ewe or Ga, three languages of Ghana: a greeting, a sign, a message to a relative, a line for a card. The text may be up to 300 characters and one side must be English. Do not use it for long documents, for legal, medical or other text where a mistake could cause harm, for names or passwords, or between two Ghanaian languages directly. The text is sent to the Khaya translation service.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "The language the text is in.",
                "enum": ["english", "twi", "ewe", "ga"],
                "type": "string"
              },
              "text": {
                "description": "The text to translate.",
                "maxLength": 300,
                "type": "string"
              },
              "to": {
                "description": "The language to translate into.",
                "enum": ["english", "twi", "ewe", "ga"],
                "type": "string"
              }
            },
            "required": ["from", "text", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "by": {
                "type": "string"
              },
              "caution": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "translation": {
                "type": "string"
              }
            },
            "required": ["by", "caution", "from", "text", "to", "translation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:610e53f298382645ed8f1a4ccb5d33639500d51c8e690265a4d02fb1da8eecd7"
        }
      ],
      "digest": "sha256:f39c600ee48dcdace0288ae0e0f1de321a605afed7e39e8465f084d4b23c5a56"
    }
  }
