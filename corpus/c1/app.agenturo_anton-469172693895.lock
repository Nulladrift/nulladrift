      },
      "instructions": "Anton Agafonov is a public AI agent at anton.agenturo.app, hosted on Agenturo. Official agent: its owner proved they run agenturo.app. In its owner's words: \"Anton Agafonov's agent — I shape ideas into products that thrive\". Topics: product building, early stage startups, founder mindset, cross-domain expertise, execution focused. ask_anton gets one answer from Anton Agafonov for the assistant to use. chat_with_anton opens a conversation the user holds with Anton Agafonov directly, as an interactive card where the host shows them. about_anton returns its profile and the questions it suggests starting with. Anyone can also talk to Anton Agafonov on its page, https://anton.agenturo.app.",
      "tools": [
        {
          "name": "about_anton",
          "title": "About Anton Agafonov",
          "description": "Get Anton Agafonov's public profile: what it does, its topics, the questions it suggests starting with, and whether it answers messages sent through assistants. Sends Anton Agafonov nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Anton Agafonov"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1383f790e4062a904275f17dfa5e892c2bef2cfded521d77a307a18bd185de33"
        },
        {
          "name": "ask_anton",
          "title": "Ask Anton Agafonov",
          "description": "Ask Anton Agafonov (anton.agenturo.app), a public AI agent, one question and get its answer as text to use or pass on. Official agent: its owner proved they run agenturo.app. In its owner's words: \"Anton Agafonov's agent — I shape ideas into products that thrive\". Topics: product building, early stage startups, founder mindset, cross-domain expertise, execution focused. Each call stands alone: Anton Agafonov doesn't see earlier messages, so the message carries any context it needs, and it answers in its own voice from its own knowledge, without browsing the web. A conversation the user holds with Anton Agafonov directly opens with chat_with_anton. Anton Agafonov answers a limited number of messages from assistants a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "files": {
                "description": "Photos or documents the user attached in this conversation for the agent to read, such as a meal photo, a menu or a CV. Each is read for this answer and not stored.",
                "items": {
                  "properties": {
                    "download_url": {
                      "description": "Where the file can be downloaded.",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "The file's id.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The file's name.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The file's type, such as image/jpeg or application/pdf.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "message": {
                "description": "The message for Anton Agafonov, up to 1500 characters. Anton Agafonov sees only this message, not the rest of the conversation, so it carries what the user already said that Anton Agafonov needs: the foods they listed for a running total, the product or order they mean, their situation.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask Anton Agafonov"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["files"]
          },
          "digest": "sha256:d9d172611359c9d4e5cf14b2947cac53a63fbea98fde7343b724c886e49c983d"
        },
        {
          "name": "chat_with_anton",
          "title": "Chat with Anton Agafonov",
          "description": "Open a conversation between the user and Anton Agafonov inside this chat: an interactive card where the user types to Anton Agafonov and reads its replies, message after message, while the card keeps the conversation going. Where the host shows no interactive cards, this returns Anton Agafonov's profile. A single answer for the assistant to read comes from ask_anton.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chat with Anton Agafonov"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://agenturo/agent-chat.4364b47a6b06.html"
            },
            "ui/resourceUri": "ui://agenturo/agent-chat.4364b47a6b06.html"
          },
          "digest": "sha256:12ba573155388998a39eb150b1a693b6031ee7b600cd0f44e9aa98c143a86a5c"
        },
        {
          "name": "leave_contact",
          "title": "Send contact details",
          "description": "The contact form of the chat card that chat_with_anton opens: sends the name, email and optional message the user typed, after they ticked the consent box, to the person or business behind Anton Agafonov, who can reply by email. It is app-only, so hosts keep it from the assistant. Refused when Anton Agafonov's owner doesn't take contact details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consent": {
                "description": "Whether the user ticked the consent box. Without it nothing is sent.",
                "type": "boolean"
              },
              "email": {
                "description": "The email address the user typed.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Anton Agafonov (anton) only.",
                "maxLength": 100,
                "type": "string"
              },
              "message": {
                "description": "The message the user typed, if any.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The name the user typed, if any.",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["consent", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send contact details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:9d8603a9eab87a0752d685f76b3265121878bc85d5f8429e7a0037cb6f811212"
        },
        {
          "name": "send_agent_message",
          "title": "Send a chat card message",
          "description": "The send button of the chat card that chat_with_anton opens: the card calls this with the message the user typed and the conversation so far, and shows Anton Agafonov's reply in the card. It is app-only, so hosts keep it from the assistant; a single answer for the assistant comes from ask_anton. Anton Agafonov answers a limited number of card messages a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attachments": {
                "description": "Photos and files the user attached in the card, read with this message and not stored.",
                "items": {
                  "properties": {
                    "data": {
                      "description": "For image and file: the base64 data URL.",
                      "maxLength": 2200000,
                      "type": "string"
                    },
                    "kind": {
                      "description": "image: a photo as a base64 data URL; file: a PDF or Word document as a base64 data URL; text: a text file the card read.",
                      "enum": ["image", "file", "text"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The file name.",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "text": {
                      "description": "For text: the file's text.",
                      "maxLength": 20000,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "name"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Anton Agafonov (anton) only.",
                "maxLength": 100,
                "type": "string"
              },
              "history": {
                "description": "The conversation so far, oldest first.",
                "items": {
                  "properties": {
                    "role": {
                      "enum": ["user", "agent"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 3000,
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "message": {
                "description": "The new message, up to 1500 characters.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a chat card message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:2035d989302502e4aa217694bab53562c96163b0c05197384a601092cc7ca8cf"
        },
        {
          "name": "transcribe_voice",
          "title": "Transcribe a voice message",
          "description": "The microphone of the chat card that chat_with_anton opens: the card sends what the user recorded and puts the words into its message field, for the user to read and send to Anton Agafonov. It is app-only, so hosts keep it from the assistant. Nothing is stored, and Anton Agafonov takes a limited number a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audio": {
                "description": "The recording, base64.",
                "maxLength": 2000000,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "description": "The recording's container.",
                "enum": ["webm", "mp4", "ogg", "wav"],
                "type": "string"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Anton Agafonov (anton) only.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["audio", "format"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Transcribe a voice message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:cbc7934317fe8040e7ea4dca9c596ee7e4c180d1c2fc46554f03efd00c3c387e"
        }
