      },
      "instructions": "Anton is a public AI agent at anton.agenturo.app, hosted on Agenturo. Official agent: its owner proved they run agenturo.app. In its owner's words: \"Anton Agafonov's agent — I shape ideas into products that thrive\". Topics: product building, early stage startups, founder mindset, cross-domain expertise, execution focused. ask_anton gets one answer from Anton for the assistant to use. chat_with_anton opens a conversation the user holds with Anton directly, as an interactive card where the host shows them. about_anton returns its profile and the questions it suggests starting with. Anyone can also talk to Anton on its page, https://anton.agenturo.app.",
      "tools": [
        {
          "name": "about_anton",
          "title": "About Anton",
          "description": "Get Anton's public profile: what it does, its topics, the questions it suggests starting with, and whether it answers messages sent through assistants. Sends Anton nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Anton"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c82b31ffa4bd61cc8c4d27d56b1d19c88f1938ddc75aca1ff547bac2fea06f36"
        },
        {
          "name": "ask_anton",
          "title": "Ask Anton",
          "description": "Ask Anton (anton.agenturo.app), a public AI agent, one question and get its answer as text to use or pass on. Official agent: its owner proved they run agenturo.app. In its owner's words: \"Anton Agafonov's agent — I shape ideas into products that thrive\". Topics: product building, early stage startups, founder mindset, cross-domain expertise, execution focused. Each call stands alone: Anton doesn't see earlier messages, so the message carries any context it needs, and it answers in its own voice from its own knowledge, without browsing the web. A conversation the user holds with Anton directly opens with chat_with_anton. Anton answers a limited number of messages from assistants a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "message": {
                "description": "The message for Anton, up to 1500 characters. Include any context it needs, since it does not see the rest of the conversation.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask Anton"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db8e5e68530aee62d27093623775fc9e0e5f63acedbbcabcfd0966fd9cc7f189"
        },
        {
          "name": "chat_with_anton",
          "title": "Chat with Anton",
          "description": "Open a conversation between the user and Anton inside this chat: an interactive card where the user types to Anton and reads its replies, message after message, while the card keeps the conversation going. Where the host shows no interactive cards, this returns Anton's profile. A single answer for the assistant to read comes from ask_anton.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chat with Anton"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://agenturo/agent-chat.92c3bd82100a.html"
            },
            "ui/resourceUri": "ui://agenturo/agent-chat.92c3bd82100a.html"
          },
          "digest": "sha256:1be9d5a64764db6eaa45a9149438010f0c1a7bb1c3c3f55bc19b421714da44e2"
        },
        {
          "name": "leave_contact",
          "title": "Send contact details",
          "description": "The contact form of the chat card that chat_with_anton opens: sends the name, email and optional message the user typed, after they ticked the consent box, to the person or business behind Anton, who can reply by email. It is app-only, so hosts keep it from the assistant. Refused when Anton's owner doesn't take contact details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "consent": {
                "description": "Whether the user ticked the consent box. Without it nothing is sent.",
                "type": "boolean"
              },
              "email": {
                "description": "The email address the user typed.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "handle": {
                "description": "The agent's handle. This connector talks to Anton (anton) only.",
                "maxLength": 100,
                "type": "string"
              },
              "message": {
                "description": "The message the user typed, if any.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The name the user typed, if any.",
                "maxLength": 255,
                "type": "string"
              }
            },
            "required": ["consent", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send contact details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:9be56268abbd5cfeb8d4f3f28f40243edbb9ec4517d1a4ef054b05428ce4ecd3"
        },
        {
          "name": "send_agent_message",
          "title": "Send a chat card message",
          "description": "The send button of the chat card that chat_with_anton opens: the card calls this with the message the user typed and the conversation so far, and shows Anton's reply in the card. It is app-only, so hosts keep it from the assistant; a single answer for the assistant comes from ask_anton. Anton answers a limited number of card messages a day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "handle": {
                "description": "The agent's handle. This connector talks to Anton (anton) only.",
                "maxLength": 100,
                "type": "string"
              },
              "history": {
                "description": "The conversation so far, oldest first.",
                "items": {
                  "properties": {
                    "role": {
                      "enum": ["user", "agent"],
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 3000,
                      "type": "string"
                    }
                  },
                  "required": ["role", "text"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "message": {
                "description": "The new message, up to 1500 characters.",
                "maxLength": 1500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a chat card message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
