        {
          "name": "calculate_deposit_restitution",
          "title": "Calculer la restitution du depot de garantie",
          "description": "Compute the security deposit legal cap, restitution deadline, allowed retentions and any late penalty (art. 22 loi 89-462). FR: depot de garantie, restitution, retenues, delais.",
