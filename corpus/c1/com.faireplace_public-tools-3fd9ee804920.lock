          "description": "Create a French residential lease draft (bail / contrat de location) from the provided info, and return a link to finalize, adjust and E-SIGN it (advanced eIDAS signature, legally binding) on FairePlace. Use whenever a user wants to create, draft or generate a lease / rental contract. Link valid 30 minutes. FR: creer / rediger / generer un bail de location.",
