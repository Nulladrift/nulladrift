                "type": "number"
              },
              "exit_inspection_conformity": {
                "description": "L'etat des lieux de sortie est-il conforme a celui d'entree ?",
                "type": "boolean"
              },
              "lease_end_date": {
                "description": "Date de fin de bail, format YYYY-MM-DD",
                "type": "string"
              },
              "lease_type": {
                "description": "Type de bail : 'vide' ou 'meuble'",
                "type": "string"
              },
