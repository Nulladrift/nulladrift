      "serverInfo": {
        "name": "gather-reports",
        "title": "GatherHQ",
        "version": "1.3.0",
        "description": "Turn a business question into a customer research report from simulated interviews with your target audience.",
        "websiteUrl": "https://synthetic.gatherhq.com/docs/reports-mcp",
        "icons": [
          {
            "src": "https://www.gatherhq.com/favicon-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
