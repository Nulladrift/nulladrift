                    "media_type": {
                      "description": "With data: image/jpeg, image/png, image/webp or image/gif.",
                      "type": "string"
                    },
                    "url": {
                      "description": "https URL of the image.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "A name for the test, 3 to 120 characters.",
                "type": "string"
              },
              "persona_ids": {
                "description": "Up to 10 persona ids (from gather_list_personas) instead of the workspace's default personas. Not with audience.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "respondents": {
                "description": "Simulated respondents, 5 to 100 (default 30).",
                "maximum": 9007199254740991,
