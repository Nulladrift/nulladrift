        {
          "name": "gather_report_start",
          "title": "Start a GatherHQ research report",
          "description": "Use this when someone wants to know how their target buyers or customers would react before they decide: which message, tagline, name, price, feature or concept wins and why, what would make buyers switch, or what they think of a positioning. Works for any company, even one with no research of its own. GatherHQ researches the company, writes the interview guide, runs simulated interviews with the target audience (default 30) and writes a branded report: findings, the option chosen and by how many, themes and quotes. Returns an id and a report link at once (the link shows live progress); then call gather_report_check until it is done: each check waits a while for the report, so call it again right away, without writing to the user in between. Takes about 10 minutes for 10 interviews and 16 for 30 or 50. Results are simulated and directional: not real people's answers, and not live ad or campaign metrics. Do not use it to write or rewrite copy, to look up market data, benchmarks or news, or to answer from research the workspace already has (gather_research_answer). For images such as ads, use gather_test_creatives.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience": {
                "description": "Who to simulate (titles, company size, industry, geography, or consumer profile), up to 1200 characters. If omitted, GatherHQ picks the buyers whose answer settles the question.",
                "maxLength": 1200,
                "minLength": 10,
                "type": "string"
              },
              "audience_type": {
                "description": "b2b for business buyers, b2c for consumers.",
                "enum": ["b2b", "b2c"],
                "type": "string"
              },
              "company": {
                "description": "Company the study is for, e.g. \"Ory\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional, 8 to 100 characters: letters, digits, _ . : -. Reusing it with the same request never starts a second report.",
                "type": "string"
              },
              "key_questions": {
                "description": "Up to 6 questions that must be asked, each 10 to 300 characters.",
                "items": {
                  "maxLength": 300,
                  "minLength": 10,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "options": {
                "description": "2 to 4 options to compare, exactly as the user wrote them (for example two messages or three taglines), each up to 300 characters. GatherHQ tests these word for word, plus \"None of these\". Omit when the user names no specific options.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "question": {
                "description": "The question or decision to inform, 10 to 600 characters, e.g. \"Which message do our target buyers care about most, what would make them switch, and how should we change our positioning?\"",
                "maxLength": 600,
                "minLength": 10,
                "type": "string"
              },
              "respondents": {
                "description": "Number of simulated respondents, 10 to 50 (default 30).",
                "maximum": 50,
                "minimum": 10,
                "type": "integer"
              },
              "website": {
                "description": "Company website, e.g. \"https://www.ory.com\". Improves research and brand colors.",
                "maxLength": 300,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["company", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a GatherHQ research report"
