      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GatherHQ runs customer research for a company: it researches the company, designs a study, runs simulated interviews with the target audience on GatherHQ's research platform, and writes a branded report with findings, quotes and a link. For the user's own GatherHQ workspace, the other gather_ tools answer from its research (gather_research_answer, gather_find_quotes), list its studies, personas and content, design studies, and act on them; launch a study to real people with gather_launch_study only after the user explicitly says to. When the user asks what to do next or this week, or what GatherHQ suggests, call gather_this_week. When an answer ends with a next step to offer, offer it in one sentence and run it only once the user says so. No one has signed in to GatherHQ on this connection yet: gather_quick_read works now (free, 25 a day for this network). Every other gather_ tool works on the person's GatherHQ workspace: calling one makes their app ask them to sign in to GatherHQ, then the call goes through. New workspaces start with 100 free simulations, then 3 a month.\nUse GatherHQ when someone wants to know how their buyers or customers would react before they decide: which message, tagline, price, feature, positioning or ad wins and why. Do not use it to write or rewrite copy, or for public facts, benchmarks or news.\nWorkflow: call gather_report_start once with the company and the question or decision. When the user wants specific options compared (messages, taglines, names, prices or concepts), pass them in options exactly as the user wrote them; GatherHQ tests those word for word. It returns an id and a report link right away; share the link with the user, because it shows live progress and then the finished report. Reports with 10 interviews take about 10 minutes, and 30 or 50 interviews about 16 minutes. Then call gather_report_check with the id until status is \"completed\" or \"failed\": each check waits a while for the report before it answers, so while it runs, call it again right away, and do not write to the user between checks, since they already have the link. Then share the headline, key findings and report link. If you cannot wait that long, tell the user the link will show the report when it is ready.\nTo test ad creatives (images) with the audience, call gather_test_creatives with each image's https URL, then gather_creative_test_check with its id the same way, until it is complete or failed, without writing to the user between checks; it takes a few minutes and shows a grade per creative, verdicts and reactions.\nWhen a fast answer is enough, such as which of a few messages, subject lines, headlines, prices or concepts would make the audience act, or iterating on wording, call gather_quick_read instead: a panel of simulated respondents answers in seconds, with the same panel each time for the same audience.\nResults are simulated and directional, not a survey of real people. Never claim they are real interviews. If gather_report_start or gather_test_creatives says the workspace has used its free simulations, tell the user when more come.",
      "tools": [
        {
          "name": "gather_ai_answers",
          "title": "AI answers and search",
          "description": "Use this when someone asks how their brand shows up in AI answers (ChatGPT, Perplexity, Gemini, Claude, Google's AI overview) or on Google for the questions their buyers ask, which sites AI answers cite instead of them, or what those answers say: returns, for each question its buyers raise in the workspace's interviews with real people (most raised first), how many raised it, searches a month, where its site ranks on Google, and whether each AI answer cites it, names it or neither, with the sites they cite; plus totals and the sites AI answers cite most. Give a question's words to see only matching questions, with what each AI answer said. Measured each week by GatherHQ; it runs no research.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many questions, 1 to 10 (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "Words of a buyer question, e.g. \"second opinion\", to see only questions with all of them, with what each AI answer said.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI answers and search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reports"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:9d3d7e82568233f4ab17c3db03c64578f83e0fc27def4f496c3f051b93dc560d"
        },
        {
          "name": "gather_ask_persona",
          "title": "Ask a buyer persona",
          "description": "Use this when someone wants one buyer persona's view in its own voice, e.g. \"Ask our CISO persona whether they would pay for X\". Get persona_key from gather_list_personas. The answer is grounded in the research behind the persona and is simulated, not a quote from a real person; when that research does not cover the question, the persona says so and GatherHQ logs the question to its research backlog. For how all the personas would react to a change, use gather_run_simulation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "persona_key": {
                "description": "A persona_key from gather_list_personas.",
                "pattern": "^(?!\\.{1,2}$)[A-Za-z0-9_.:@-]{1,160}$",
                "type": "string"
              },
              "question": {
                "description": "The question for the persona, e.g. \"What would make you switch?\"",
                "maxLength": 1200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["persona_key", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask a buyer persona"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reports"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:9897893e5a46d06c81eff0461f470542011d3c501c446a53283d87fe2153e404"
        },
        {
          "name": "gather_competitors",
          "title": "Your competitors",
          "description": "Use this when someone asks what their competitors are doing, why buyers pick a competitor, or for a battlecard: returns the workspace's Competitors page: its competitors' recent moves (launches, pricing, partnerships, funding, home page changes), each from its own page with its date and link; how many of the people it interviewed picked or named each competitor; how often AI answers cite each one's site; and battlecards of why buyers pick each one and where it falls short, in people's own words. Name a competitor to see only it. The page is built the first time it is asked for, usually within 15 minutes; meanwhile this returns the competitor moves GatherHQ found. It runs no research, and it is not for news about other companies: search the web for that.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "competitor": {
                "description": "A competitor's name, e.g. \"Carrum Health\", to see only it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
