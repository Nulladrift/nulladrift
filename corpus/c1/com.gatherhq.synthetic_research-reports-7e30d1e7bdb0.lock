                  "properties": {
                    "data": {
                      "description": "Or the image as base64 (or a data: URL), for small images only.",
                      "type": "string"
                    },
                    "label": {
                      "description": "A short name for the creative, e.g. \"Headline A\". Defaults to \"Creative 1\", \"Creative 2\"...",
                      "type": "string"
