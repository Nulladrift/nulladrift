        {
          "name": "gather_test_creatives",
          "title": "Test ad creatives with your audience",
          "description": "Use this when someone wants their target buyers' reactions to ad creatives or other images before they run them: which of up to 5 lands best, and why. Each image is shown as a sponsored post in a feed to simulated respondents from the workspace's personas (or the audience described). Send each image as an https url (recommended) or small base64 data, or, for images the person attached in ChatGPT, in files: JPEG, PNG, WebP or GIF, up to 5 MB each; video is not supported. Returns an id at once; then call gather_creative_test_check until it is done (a few minutes in all): each check waits a while, so call it again right away, without writing to the user in between. Results are simulated and directional: a predicted ranking against each other with reasons, not click-through rates or live ad performance. A workspace without GatherHQ credits or a contract uses one of its free simulations; it counts as one run. Do not use it to write ad copy or make images; for text options such as headlines or taglines, use gather_report_start.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience": {
                "description": "Who should react, 10 to 1,200 characters, e.g. \"Seed-stage founders in the US who run their own finance\". Leave out to use the workspace's own personas.",
                "type": "string"
              },
              "audience_type": {
                "description": "b2b for business buyers, b2c for consumers.",
                "enum": ["b2b", "b2c"],
                "type": "string"
              },
              "channel": {
                "description": "Where the ads run, e.g. \"Meta\" or \"LinkedIn\" (default LinkedIn).",
                "type": "string"
              },
              "context": {
                "description": "Up to 2,000 characters: campaign objective, offer, anything the audience should know.",
                "type": "string"
              },
              "files": {
                "description": "Images the person attached in ChatGPT, as ChatGPT passes them: each becomes a creative named after its file. With images, 5 in all.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "A temporary https link to the file.",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "The file's id in ChatGPT.",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "Its name.",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "Its type, such as image/png.",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "idempotency_key": {
                "description": "Optional, 8 to 100 characters: letters, digits, _ . : -. Reusing it with the same request never starts a second test.",
                "type": "string"
              },
              "images": {
                "description": "1 to 5 creatives, each with url or data. Images the person attached in ChatGPT go in files instead.",
