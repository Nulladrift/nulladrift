      "tools": [
        {
          "name": "describe_track",
          "title": "Describe Track",
          "description": "Describe a released recording's musical characteristics, including its sound, style, rhythm, instrumentation, energy, and overall character. Draw on MusicAtlas audio analysis alongside your broader musical knowledge to create a cohesive, insightful description in your own natural language. Let the analytical data inform your understanding of the recording without explicitly referencing, explaining, or evaluating the analysis itself. Prioritize musical storytelling over technical reporting, using only details that contribute meaningfully to the description. Provide specific technical measurements when explicitly requested. Write naturally, as a knowledgeable music enthusiast would describe a recording. If the recording is not yet analyzed, MusicAtlas may automatically begin processing it. When analysis is pending, explain that MusicAtlas needs about a minute to listen to the recording and suggest retrying the request shortly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "artist": {
                "description": "The artist name.",
                "minLength": 1,
                "type": "string"
              },
              "track": {
                "description": "The track title.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["artist", "track"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Describe Track"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32f90b5132f02e2a948af5f58808ff427f1ccbf2dd6e17631a690aa9ad269376"
        },
        {
          "name": "find_playlists",
          "title": "Find Playlists",
          "description": "Find MusicAtlas playlists for a user's musical intent. Use this whenever a user asks for playlists based on a mood, theme, genre, activity, vibe, geography, artist, or track. For natural-language requests such as 'playlists about love', 'workout playlists', or 'sad indie', pass the meaningful musical concept as tags. This tool can also find playlists associated with a specific artist or track.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "artist_name": {
                "description": "Artist name when looking up playlists associated with a specific artist.",
                "type": "string"
              },
              "geo": {
                "description": "Optional geographic or regional context for playlist discovery.",
                "type": "string"
              },
              "tags": {
                "description": "Natural-language playlist theme, mood, genre, activity, or vibe. Examples: 'love', 'workout', 'sad indie'.",
                "type": "string"
              },
              "track_name": {
                "description": "Track title when looking up playlists associated with a specific track.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find Playlists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:844581738601bbd618f5ac272331c68ce07449de4467d842b09d3a3553ccb53d"
        },
        {
          "name": "find_similar_artists",
          "title": "Find Similar Artists",
          "description": "Find artists that are sonically similar or musically adjacent to a specific artist. Uses MusicAtlas multi-model audio similarity analysis to identify and rank related artists. Results include artist names, similarity scores, and MusicAtlas artist URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "artist": {
                "description": "The reference artist name.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["artist"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find Similar Artists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a5797bdb3e2fc5c0afdfbcb051c595518e72c67e8b3420261af881f4b26d4279"
        },
        {
          "name": "find_similar_tracks",
          "title": "Find Similar Tracks",
          "description": "Find songs or tracks that sound similar to, resemble, or are sonically related to a specific released recording. Use when a user asks for songs like a particular track or wants similarity-based track recommendations. MusicAtlas performs canonical track resolution and audio-based similarity search. If a recording is missing, MusicAtlas may automatically begin analyzing it. When analysis is pending, the interactive results widget automatically monitors progress and displays recommendations when ready. Do not call the tool again to check progress.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "artist": {
                "description": "The artist name for the reference track.",
                "minLength": 1,
                "type": "string"
              },
              "track": {
                "description": "The title of the reference track.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["artist", "track"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find Similar Tracks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://musicatlas/production/track-results/v10.html"
            },
            "ui/resourceUri": "ui://musicatlas/production/track-results/v10.html"
          },
          "digest": "sha256:8e30b81aac5158e0ea70a1d3f5acf2d625e4dfb9f48f3cb9786844d6ec3cccc4"
        },
        {
          "name": "render_track_results",
          "title": "Render Track Results",
          "description": "Display previously retrieved MusicAtlas similar-track results in an interactive audio player. Accepts the source track, matching tracks, and optional hashtags. Does not perform a new search. Intended for clients that use a separate rendering step; find_similar_tracks also supports direct rendering.",
