{
  "lockfileVersion": 2,
  "subjects": {
    "com.evolize/accessibility-scanner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://evolize.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "evolize-accessibility-scanner",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Evolize assesses the accessibility of publicly reachable websites. Typical flow: get_public_report to read an existing published assessment, or scan_website to request one, then get_scan_result with the returned scan_handle (follow next_cursor for every finding). Findings reference the rendered DOM, not source files — use your own repository access to locate the code. After deploying a fix to a publicly reachable URL, call scan_website with refresh=true and re-read the result to check the change. Results never certify WCAG conformance.",
      "tools": [
        {
          "name": "get_public_report",
          "title": "Get an existing public accessibility report",
          "description": "Retrieve an EXISTING public Evolize accessibility assessment for a website. Read-only: this starts no scan and creates no work. Returns not_found when no public report exists for the target — which says nothing about whether the site has accessibility problems. Evolize inspects publicly reachable pages of the target website in a real browser and runs deterministic accessibility checks (axe-core plus Evolize rules). It is not a local browser agent and it does not read your source code: findings reference the rendered DOM, so your coding agent maps them to source using its own repository access.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor from a previous response's `next_cursor`. Omit for the first page.",
                "maxLength": 512,
                "type": "string"
              },
              "limit": {
                "description": "Findings per page. Default 20, maximum 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "The public website to assess, e.g. `example.com` or `https://example.com`. Not an Evolize URL.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c59ed237acbfba145ab1bd9a9bf89fd1de29f67e2eb64d3783e5e6f8522a5983"
        },
        {
          "name": "get_scan_result",
          "title": "Read an assessment result",
          "description": "Read the result of an Evolize assessment started with scan_website, using the scan_handle it returned. Read-only: it never starts a scan, never refreshes an assessment, never changes publication state, and never consumes scan quota — polling is safe. While the assessment is pending it returns the status and a retry_after_seconds. Follow next_cursor to read every finding.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque pagination cursor from a previous response's `next_cursor`. Omit for the first page.",
                "maxLength": 512,
                "type": "string"
              },
              "limit": {
                "description": "Findings per page. Default 20, maximum 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "scan_handle": {
                "description": "The opaque handle returned by scan_website.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["scan_handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c271c4ee9f47f019b8c06f1ca30ef7ff22ccfe487ca0d4d92319831725e52c5d"
        },
        {
          "name": "scan_website",
          "title": "Request an accessibility assessment",
          "description": "Request an Evolize accessibility assessment of a publicly reachable website, then read the result with get_scan_result. By default a completed assessment up to 24 hours old is reused; pass refresh=true to require newly executed work (for example after deploying a fix). This CREATES work: it can start a real browser-based scan whose result is retained and may become a public report under Evolize's existing publication policy. Free public assessments are bounded: a completed result up to 24h old is reused unless refresh=true, at most 3 newly executed assessments per website per 24h, and the platform's own per-IP, per-domain and global scan limits still apply.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "refresh": {
                "description": "Require newly executed work instead of reusing a recent completed assessment. Use after deploying a fix. Never satisfied by an older completed report.",
                "type": "boolean"
              },
              "url": {
                "description": "The public website to assess, e.g. `example.com` or `https://example.com`. Not an Evolize URL.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f7e07f50e111c7565ee8c4905042ade5a3aab7aabbe7baada538a0e8d1c4576"
        }
      ],
      "digest": "sha256:3bb2f05c3509f7573b0894be77f7c230fad7005ba4aec50fed2ab90fa9db4b8c"
    }
  }
}
