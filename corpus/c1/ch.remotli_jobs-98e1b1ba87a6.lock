          },
          "digest": "sha256:5d0c4d20c4bbd640d6a70d43568f87d29db9a9239d1ead544430fde65dd4949a"
        },
        {
          "name": "list_categories",
          "title": "List Remotli job categories",
          "description": "The job categories with the number of open Fully Remote and Remote-Friendly roles in each. Use a slug from here as the category argument of search_jobs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Remotli job categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:29b845c6a3642e2612226be33a763625e9fa5a3d5b956543c497cc5072e3a866"
        },
        {
          "name": "search_jobs",
          "title": "Search Remotli jobs",
          "description": "Search open remote roles at Swiss companies and companies hiring in the CET time zone, from remotli.ch. Returns up to 20 roles, newest first, each with a plain-text excerpt, the company's verified remote policy when one is on record, the posted salary, and a link to the Remotli job page where the person applies. Pass keywords in query, not a sentence; only the first 5 are used. By default only Fully Remote and Remote-Friendly roles are searched; pass work_mode \"all\" or a mode to include hybrid and workation roles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "A category slug from list_categories.",
                "enum": ["engineering", "data", "product", "design", "marketing", "sales", "customer-success", "finance", "operations", "hr", "legal", "research", "other"],
                "type": "string"
              },
              "city": {
                "description": "A Swiss city slug. \"remote\" means roles located as remote, \"other\" means outside the major Swiss cities.",
                "enum": ["zurich", "geneva", "basel", "bern", "lausanne", "zug", "lucerne", "st-gallen", "lugano", "winterthur", "other", "remote"],
                "type": "string"
              },
              "limit": {
                "description": "How many roles to return, 1 to 20, default 10.",
                "type": "number"
              },
              "query": {
                "description": "Keywords, not a sentence (for example \"python backend\" or \"product designer\"). Matched case-insensitively against the job title, the company name and the job tags; every keyword must match. Only the first 5 keywords are used.",
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[^\\u0000-\\u001f\\u007f]*$",
                "type": "string"
              },
              "salary_min_chf": {
                "description": "Yearly floor in CHF. Compares the top of each posted range; a range in another currency is converted to CHF at approximate fixed rates for the comparison (the role still shows its own currency). Roles with no usable posted salary are left out when this is set.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "integer"
              },
              "work_mode": {
                "description": "One work mode, or \"all\". Default: fully_remote and remote_friendly (the remote-first view the site shows). Hybrid and workation roles appear only with \"all\" or that mode.",
                "enum": ["fully_remote", "remote_friendly", "hybrid", "hybrid_workation", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Remotli jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
