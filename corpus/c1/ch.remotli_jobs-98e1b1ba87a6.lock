        },
        {
          "name": "get_job",
          "title": "Get one Remotli job",
          "description": "One open role by its slug: the full description as plain text (up to 4000 characters), the work mode, the verified remote policy when on record, the posted salary and the Remotli job page link. longOpen is true for a role older than a year, which is still open but no longer in search results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The job slug, as returned by search_jobs.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
