      },
      "transport": {
        "type": "http",
        "url": "https://liqwall.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "liqwall",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Liqwall market data, read-only. Four tools work without a key: `liquidation_map` — where liquidations of longs and shorts stand below and above the price of one market; `liquidations` — how much was liquidated over the last 24 hours and the last hour; `derivatives` — funding rates, open interest and the long/short ratio; `fear_greed` — the crypto Fear and Greed Index. Every answer is a current snapshot: times are UTC in ISO 8601, `page_url` is the Liqwall page that shows the same data live, and the fields `missing` and `stale` name data that could not be fetched or is outdated.",
      "tools": [
        {
          "name": "derivatives",
          "title": "Funding, open interest, long/short",
          "description": "Funding rates, open interest and the long/short ratio of perpetual futures, for one coin or for the ten largest coins by open interest. Use it for questions like \"what is the funding rate of ETH\", \"is open interest growing\", \"are traders long or short\". Returns current values: the Binance funding rate and the average across exchanges per 8 hours, open interest in USD with its change over 24 hours and over the last hour, the share of Binance accounts that are long, the long/short ratio and the share of top traders' positions in longs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "Coin ticker such as BTC, ETH or SOL; omit it for the ten largest coins",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Funding, open interest, long/short"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17bfd73b0b2fff459e92d546a6a5fffd349107c1ae7d7c8a9a0ce9c32a187b79"
        },
        {
          "name": "fear_greed",
          "title": "Fear and Greed Index",
          "description": "The crypto Fear and Greed Index: the mood of the market right now on a scale from 0 (extreme fear) to 100 (extreme greed), for the whole market or for BTC, ETH or SOL, with the values a day, a week and a month ago.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "BTC, ETH or SOL; omit it for the whole crypto market",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fear and Greed Index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03b24e6f249e62e4a2985e06f8e3057ded98e610d60b1b5d0a9915b609186f52"
        },
        {
          "name": "liquidation_map",
          "title": "Liquidation map",
          "description": "Where forced liquidations stand around the current price of one market: USD amounts of long liquidations below the price and of short liquidations above it, on Hyperliquid (crypto, stocks, indices and commodities) and across large exchanges (Binance, OKX, Bybit, Hyperliquid, Gate). Use it for questions like \"where are the liquidation levels for BTC\", \"where do longs get liquidated\", \"what is the nearest liquidation cluster\". Returns one current snapshot: the price, totals within a few percent of the price, the largest levels on each side with their distance from the price, and the URL of the live map. An unknown market returns the list of valid ones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "Market ticker: BTC, ETH, SOL, HYPE, XRP, DOGE … or a Hyperliquid market such as XAU (gold), CL (crude oil), SP500, NVDA, TSLA. Names such as Bitcoin or Gold and pair names such as BTCUSDT are accepted too",
                "type": "string"
              }
            },
            "required": ["coin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Liquidation map"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aef8a221f8361ec45ec77c9363dc8bda53c676d3f39590bc2ca6ae3ad3af4018"
        },
        {
          "name": "liquidations",
          "title": "Liquidations",
          "description": "How much was liquidated: the last 24 hours and the last hour, longs against shorts, for the whole crypto market or for one coin. Use it for questions like \"how much was liquidated today\", \"were longs or shorts liquidated\", \"which exchange had the most liquidations\". Returns the totals, the split by coin (whole market) or by exchange (one coin), the largest liquidations of the last hour, and the URL of the page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coin": {
                "description": "One of BTC, ETH, SOL, XRP, DOGE, HYPE, BNB; omit it for the whole crypto market",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Liquidations"
          },
