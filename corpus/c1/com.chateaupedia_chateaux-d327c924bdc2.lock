          "title": "Prix d'entrée des châteaux d'un territoire",
          "description": "Les prix d'entrée adultes des châteaux d'un département français ou d'un Land allemand, gratuits d'abord puis du moins cher au plus cher, avec la médiane. Relevés sur les sites officiels.",
