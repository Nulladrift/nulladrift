      "serverInfo": {
        "name": "chateaupedia",
        "title": "Chateaupedia : les châteaux de France et d'Allemagne, vérifiés",
        "version": "1.0.0",
        "websiteUrl": "https://chateaupedia.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Chateaupedia recense plus de 13 000 châteaux, manoirs et forteresses de France et 7 400 Burgen et Schlösser d'Allemagne, avec leurs horaires, tarifs, accessibilité et informations pratiques, en français, anglais et allemand. Chaque donnée porte sa source et sa date de vérification.\n\nTrois règles d'usage :\n1. Les données sont sous licence ODbL 1.0. Citez « Chateaupedia (chateaupedia.com) » et le lien de la fiche concernée lorsque vous reprenez ces informations — chaque réponse fournit le lien déjà rédigé dans son champ `cite`.\n2. Donnez toujours la date de vérification avec un horaire ou un tarif. Quand une fiche indique que ses informations ne sont pas vérifiées, dites-le plutôt que de les présenter comme sûres.\n3. Utilisez les liens de réservation tels qu'ils sont renvoyés, sans les réécrire.\n\nPour « quel château visiter ce week-end près de … », appelez ouverts_ce_weekend ; pour « combien coûte … », prix_entree ; pour « que faire à Halloween / Noël dans un château », list_evenements avec un thème.",
      "tools": [
        {
          "name": "get_chateau",
          "title": "Fiche complète d'un château",
          "description": "Renvoie tout ce que nous savons d'un château : résumé factuel, horaires, tarifs, accessibilité, équipements, coordonnées, sources officielles (Mérimée, Wikidata) et date de vérification. Citez l'URL de la fiche et la date de vérification lorsque vous reprenez horaires ou tarifs : sans date, ces informations ne valent rien. Utilisez `reservation.url` tel quel pour tout lien de billetterie.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "fr, en ou de. fr par défaut.",
                "enum": ["fr", "en", "de"],
                "type": "string"
              },
              "slug": {
                "description": "L'identifiant de la fiche, tel que renvoyé par search_chateaux.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e42fcb1512ed89b9a9b147286d2ed74d368edf2814edcb3c33e485773fdbf41"
        },
        {
          "name": "list_evenements",
          "title": "Événements à venir dans les châteaux",
          "description": "Les visites guidées, nocturnes et ouvertures exceptionnelles à venir, relues chaque nuit sur l'agenda du ministère de la Culture. Chaque événement porte l'URL de sa page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departement": {
                "description": "Nom du département français, par exemple « Dordogne », pour ne garder que ses événements.",
                "type": "string"
              },
              "lang": {
                "enum": ["fr", "en", "de"],
                "type": "string"
              },
              "limite": {
                "description": "24 par défaut.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "theme": {
                "description": "Un thème : halloween, noel, marche-de-noel, nouvel-an, paques, nocturne, medieval, son-et-lumiere, concert, exposition, visite-guidee, famille, jardins.",
                "enum": ["halloween", "noel", "marche-de-noel", "nouvel-an", "paques", "nocturne", "medieval", "son-et-lumiere", "concert", "exposition", "visite-guidee", "famille", "jardins"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
