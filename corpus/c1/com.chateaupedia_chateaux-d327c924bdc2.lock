        {
          "name": "search_chateaux",
          "title": "Chercher des châteaux",
          "description": "Cherche parmi 12 977 châteaux, manoirs et forteresses de France et 7 636 d'Allemagne par nom, commune, département (ou Kreis), région (ou Land), avec filtres (pays, monument historique, informations vérifiées à la source). Chaque résultat porte l'URL de sa fiche et un lien Markdown prêt à citer : reprenez-les dans votre réponse, la licence ODbL 1.0 des données l'exige.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "departement": {
                "description": "Nom du département français, par exemple « Dordogne », ou du Kreis allemand, par exemple « Landkreis Rosenheim », quand pays vaut DE ou n'est pas donné.",
                "type": "string"
              },
              "lang": {
                "description": "Langue des URL et des libellés : fr, en ou de. fr par défaut.",
                "enum": ["fr", "en", "de"],
                "type": "string"
              },
              "limite": {
                "description": "Nombre de résultats, 12 par défaut.",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "monument_historique": {
                "description": "Ne garder que les monuments classés ou inscrits (France).",
                "type": "boolean"
              },
              "pays": {
                "description": "Restreindre à un pays : FR (France) ou DE (Allemagne). Les deux par défaut.",
                "enum": ["FR", "DE"],
                "type": "string"
              },
              "query": {
                "description": "Nom, commune, département, Kreis, région ou Land. Insensible à la ponctuation et aux accents.",
                "type": "string"
              },
              "region": {
                "description": "Nom de la région française, par exemple « Nouvelle-Aquitaine », ou du Land allemand, par exemple « Bayern ».",
                "type": "string"
              },
              "verifies_seulement": {
                "description": "Ne garder que les fiches dont horaires et tarifs ont été vérifiés à la source.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
