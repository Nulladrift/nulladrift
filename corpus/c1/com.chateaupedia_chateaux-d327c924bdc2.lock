            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad75d8f1d3e7261d1e3309ade0b77eef9491e244065c8e0897cf811d46a5f84c"
        },
        {
          "name": "list_itineraires",
          "title": "Itinéraires de deux ou trois jours",
          "description": "Des parcours dont l'ordre des étapes est calculé de proche en proche et les distances mesurées, pas estimées. Utile pour répondre à « que voir en trois jours dans la Loire ».",
          "inputSchema": {
            "additionalProperties": false,
