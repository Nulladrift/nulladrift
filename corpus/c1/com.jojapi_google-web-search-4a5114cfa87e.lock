{
  "lockfileVersion": 2,
  "subjects": {
    "com.jojapi/google-web-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jojapi.com/google-web-search"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi-google-web-search",
        "title": "Google Web Search API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of Google Web Search on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/google-web-search/pricing · Docs: https://jojapi.com/hub/api/google-web-search",
      "tools": [
        {
          "name": "get_v1",
          "title": "Web Search",
          "description": "Get web search results, knowledge panel and related keywords Group: Web Search. Billing per call: 1 Credits. Agents can pay per call ($0.01 via x402/MPP, no API key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "type": "string"
              },
              "gl": {
                "default": "US",
                "title": "Country code",
                "type": "string"
              },
              "hl": {
                "default": "en",
                "title": "Language code",
                "type": "string"
              },
              "limit": {
                "example": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "The search query. Supports plain keywords or full Google search syntax (Google Dorking).\n\nCommon operators: `\"exact phrase\"`, `OR`, `-exclude`, `site:`, `inurl:`, `intitle:`, `intext:`, `filetype:`, `before:` / `after:` (`YYYY-MM-DD`), `related:`, numeric ranges (`10..50`).\n\n**Example:**\n\n```\nsite:github.com intitle:awesome python -site:gist.github.com\n```",
                "example": "Harry Potter",
                "type": "string"
              },
              "related_keywords": {
                "example": true,
                "title": "Related Keywords",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a69ce903e18fa5315874e7af5477e15d9c249d7ca98f83a85f28d4b9584d4ba"
        }
      ],
      "digest": "sha256:8f935e60728a87f4fc2885b2d34b03f273252810e786fe063a086f0bb884accb"
    }
  }
}
