      "tools": [
        {
          "name": "confirm_crypto_subscription",
          "title": "Confirm a USDC payment and receive your API key",
          "description": "After sending the quoted USDC amount on Base, submit the transaction hash plus an EIP-191 signature of the claim message (from get_crypto_quote) made with the paying wallet. Verifies the payment on-chain and returns your API key. Idempotent: safe to retry with the same tx_hash.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "blocks": {
                "description": "Same blocks the quote was for",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "pool_slug": {
                "type": "string"
              },
              "signature": {
                "description": "EIP-191 signature of the claim message by the paying wallet",
                "type": "string"
              },
              "tx_hash": {
                "description": "Base L2 transaction hash of the USDC transfer",
                "type": "string"
              }
            },
            "required": ["blocks", "pool_slug", "signature", "tx_hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:573eeba989ebe21dde3590fb0b4d38e05797b891c94743627f805c0d93c6470d"
        },
        {
          "name": "get_card_checkout_link",
          "title": "Get a card checkout link",
          "description": "Card payments require a browser (3-D Secure). Returns the dashboard page for the pool where a human can complete checkout. Card subscriptions auto-renew monthly until cancelled.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "pool_slug": {
                "description": "Pool slug from list_pools",
                "type": "string"
              }
            },
            "required": ["pool_slug"],
            "type": "object"
          },
