        },
        {
          "name": "get_crypto_quote",
          "title": "Get a USDC subscription quote",
          "description": "Quote for subscribing to a pool with USDC on Base: exact amount, payment address, and the claim message you must sign after paying. Crypto subscriptions are one-time 30 days (no auto-renewal).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "blocks": {
                "description": "One or more block names from get_pool (all of them = 24/7)",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "pool_slug": {
                "description": "Pool slug from list_pools",
                "type": "string"
              }
            },
            "required": ["blocks", "pool_slug"],
