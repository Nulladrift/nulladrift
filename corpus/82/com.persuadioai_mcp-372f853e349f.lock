        },
        {
          "name": "clone_campaign_draft",
          "title": "Clone a campaign as a new draft",
          "description": "Copy a previous campaign's configuration (channel, message template, AI instructions, follow-up sequence, sender/automation settings) onto a brand-new campaign, and attach an audience to it. THE RESULT IS ALWAYS A DRAFT — this tool NEVER launches, NEVER sends, and never touches an approval token; it does not call launch_approved_campaign under any circumstance. import_ids (from preview_lead_import / import_leads_from_file) is the preferred way to supply a bulk audience — give several to combine multiple imported files into one campaign; leads are deduplicated across every import_id and lead_id given. At least one of import_ids/lead_ids should normally be supplied, or the clone has no audience. Use channels=['sms'] when the new draft must be text-only with no AI/voice calls, and from_address_id to pin the verified email identity on an email clone. After this, call review_campaign_readiness; only an explicit human approval may lead to launch_approved_campaign.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel_override": {
                "description": "Override the cloned campaign's channel. Omit to keep the source campaign's channel.",
                "enum": ["email", "sms", "both"],
                "type": "string"
              },
              "channels": {
                "description": "Optional explicit channel narrowing on the new draft. Example: ['sms'] makes an SMS campaign text-only and prevents AI/voice calling. This can only narrow the campaign type, never widen it.",
                "items": {
                  "enum": ["email", "sms", "voice"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "description": {
                "description": "Optional new description. Omit to keep the source campaign's description.",
                "maxLength": 2000,
                "type": "string"
              },
              "from_address_id": {
                "description": "Optional verified sender to pin on an email/both clone. Must belong to this account and remain on a live sending domain. Readiness re-checks final eligibility before launch.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Required. Repeat a retried call safely — the same key returns the same cloned campaign instead of creating a duplicate.",
                "maxLength": 200,
                "type": "string"
              },
              "import_ids": {
                "description": "Preferred for bulk audiences: import_id values from preview_lead_import/import_leads_from_file. Combine several to merge multiple imported files.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lead_ids": {
                "description": "Existing lead ids to include (from find_lead/list_leads). May be combined with import_ids; deduplicated together.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Name for the new draft campaign.",
                "maxLength": 120,
                "type": "string"
              },
              "source_campaign_id": {
                "description": "The campaign to copy settings from. Must be owned by this account.",
                "type": "string"
              },
              "subject": {
                "description": "Optional email subject for the cloned message template (email/both clones only). Omit to copy the source template's subject, if it has one.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["idempotency_key", "name", "source_campaign_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Clone a campaign as a new draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:eba9d9c0efb21e5d6a34925341128ae66959675ae00e2e2eca3610765e51c69b"
        },
        {
          "name": "create_campaign_draft",
          "title": "Create a campaign draft",
          "description": "Create a campaign in draft status with its opening SMS. THIS SENDS NOTHING — a draft cannot deliver a message. It exists so a human can read the exact wording and audience before deciding. The message is rejected if it implies a prior relationship or manufactures urgency. After this, call review_campaign_readiness.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "Context for the operator: who this targets and why.",
                "maxLength": 2000,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Repeat a retried call safely — the same key returns the same campaign.",
                "maxLength": 120,
                "type": "string"
              },
              "lead_ids": {
                "description": "Existing leads to move into this campaign. Ids outside this account are ignored.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "description": "The opening SMS, 320 characters or fewer. Say who is writing and why. Do not imply a prior conversation or a deadline. An opt-out line is appended automatically on first contact.",
                "maxLength": 320,
                "type": "string"
              },
              "name": {
                "description": "A name the operator will recognise in their dashboard.",
                "maxLength": 120,
                "type": "string"
              },
              "outreach_vertical": {
                "description": "Who the recipients ARE. 'home_purchase' — homeowners who might sell. 'b2b' — businesses and operators in the industry, never contacted about a house they live in. This chooses the copy rules AND which registered number the campaign may text from, so set it here rather than later: a b2b campaign left unset is treated as homeowner outreach. Omit it only when the campaign genuinely is homeowner outreach or you do not know.",
                "enum": ["home_purchase", "b2b"],
                "maxLength": 40,
                "type": "string"
              },
              "subject": {
                "description": "Optional email subject, stored with the message and carried onto an email clone of this draft. One line, 200 characters or fewer, no {{variables}}. Email campaigns otherwise get a subject at send time; only a prepared exact-message campaign must store one.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a campaign draft"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:766d5b48436f36aadcffbf3e213dccb1319b646d114c8f002a0568d6c1e74d1c"
        },
