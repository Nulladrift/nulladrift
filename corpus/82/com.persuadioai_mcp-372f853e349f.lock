                  "type": "string"
                },
                "type": "array"
              },
              "operator_authorized_this_launch": {
                "description": "Set true only when the authenticated human operator explicitly asked to launch this exact campaign in the current interactive turn of a session they signed in to (OAuth). Refused with an API key. Never set for scheduled/background execution, standing preferences, prior approvals, or inferred intent.",
                "type": "boolean"
              }
