          "description": "Attach leads this account owns to a campaign this account owns, by explicit id. Synonym for add_leads_to_campaign — same tool, same behavior, same response shape, just the verb some callers expect. Updates membership only: this call sends nothing. But leads attached to an ACTIVE campaign with drip on or Auto Outreach running are texted or emailed on that campaign's next run, with no new review or approval (opt-outs, suppression, quiet hours and caps still apply); do that only when the operator wants those people contacted. Opted-out and suppressed leads are REJECTED with per-lead skip reasons even when listed explicitly; leads already in the target are deduplicated; the response includes the campaign's final lead count read back from the database. To pick the audience by filter instead of by id, use select_and_attach_leads (same attach semantics, driven by search_leads filters). If the target campaign was already reviewed, its earlier approval is stale (the launch step recounts recipients and refuses a token approved for a smaller audience), so a fresh review_campaign_readiness is required before launching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign_id": {
