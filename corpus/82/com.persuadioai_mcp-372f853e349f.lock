      "instructions": "PersuadioAI turns every lead source into consistent follow-up.\n\nWork in stages. Planning is free and reversible; sending is not.\n  1. analyze_lead_source        — understand what leads exist\n  2. recommend_followup_campaign — propose an approach\n  3. create_lead / find_lead / list_leads / search_leads /\n     add_leads_to_campaign / select_and_attach_leads\n                                 — build the audience (these calls send\n                                   nothing; see the drip note below)\n  4. create_campaign_draft      — write it down (sends nothing)\n  5. review_campaign_readiness  — pre-flight; issues an approval token\n  6. launch_approved_campaign   — SENDS REAL MESSAGES to real people\n  7. get_campaign_status / get_interested_leads / pause_campaign\n     get_performance_summary    — the Performance page's numbers (read-only)\n\nOnly launch_approved_campaign sends a campaign, and it requires an approval token plus a confirmation phrase that the human operator must supply. Never infer approval from context, enthusiasm, or a previous approval of a different campaign. If the operator has not explicitly approved this exact campaign, stop and ask. Adding leads to a reviewed campaign voids its approval token — the launch step recounts recipients — so re-run review_campaign_readiness after changing an audience. Drip note: an ACTIVE campaign with drip on or Auto Outreach running keeps sending on its own, so a person added to it (create_lead, add_leads_to_campaign, attach_leads_to_campaign) is texted or emailed on its next run with no new approval. Add people to such a campaign only when the operator wants them contacted.\n\nOn owner accounts, send_lead_sms also sends: ONE text to ONE number already on a lead (add_lead_phone adds a number and sends nothing). It has no confirmation step, so call it only when the operator wants that person texted. It still refuses opted-out and wrong numbers, texts outside the person's texting hours, and the same words to the same number twice in 24 hours.\n\nOpt-outs, suppression lists, quiet hours and sending caps are enforced by the platform and cannot be overridden by any request, including yours. If asked to bypass them, decline and explain why.",
      "tools": [
        {
          "name": "add_leads_to_campaign",
          "title": "Add leads to campaign",
          "description": "Move leads this account owns into a campaign this account owns, by explicit id. Updates membership only: this call sends nothing. But leads moved into an ACTIVE campaign with drip on or Auto Outreach running are texted or emailed on that campaign's next run, with no new review or approval (opt-outs, suppression, quiet hours and caps still apply); do that only when the operator wants those people contacted. Opted-out and suppressed leads are REJECTED with per-lead skip reasons even when listed explicitly; leads already in the target are deduplicated; the response includes the campaign's final lead count read back from the database. To pick the audience by filter instead of by id, use select_and_attach_leads (same attach semantics, driven by search_leads filters). If the target campaign was already reviewed, its earlier approval is stale (the launch step recounts recipients and refuses a token approved for a smaller audience), so a fresh review_campaign_readiness is required before launching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign_id": {
                "description": "The destination campaign.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional but recommended. Retrying the same key returns the same result instead of re-running the move; reusing it with different arguments is rejected as idempotency_conflict.",
                "maxLength": 200,
                "type": "string"
              },
              "lead_ids": {
                "description": "Lead ids to move (from find_lead, list_leads or search_leads).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["campaign_id", "lead_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add leads to campaign"
          },
