              },
              "channel": {
                "description": "Must match the channel the readiness review approved. Default 'sms'; 'email' launches email-only.",
                "enum": ["sms", "email"],
                "type": "string"
              },
              "confirmation": {
                "description": "The exact confirmation phrase from the readiness review, as the operator typed it. Optional only when operator_authorized_this_launch=true in a signed-in (OAuth) session; always required with an API key.",
                "type": "string"
              },
              "from_address_id": {
                "description": "Email channel only: the same from_address_id the readiness review was run with (the approval binds to it).",
                "type": "string"
              },
              "from_number": {
                "description": "SMS channel only: the same outbound number the readiness review was run with. Omit for automatic sender routing.",
                "type": "string"
              },
              "lead_ids": {
                "description": "Must match the subset that was reviewed and approved.",
