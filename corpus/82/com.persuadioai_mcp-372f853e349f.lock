                    "description": "Lead status, e.g. 'new'.",
                    "type": "string"
                  },
                  "suppressed": {
                    "description": "do-not-contact / unsubscribed.",
                    "type": "boolean"
                  },
                  "tags": {
                    "description": "Leads carrying ANY of these tags.",
