                "description": "The DRAFT campaign whose opening message should change. Must be owned by this account.",
                "maxLength": 64,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Recommended. Repeat a retried call safely — the same key with the same message replays the first result; the same key with a different message is refused.",
