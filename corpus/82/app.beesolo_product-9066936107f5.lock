        "version": "1.0.0",
        "icons": [
          {
            "src": "https://beesolo.app/pwa-icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "Use the plan tool for current prices. Ask for the exact public slug before looking up a booking page. Give clients the returned booking link so they can select a time and confirm.",
      "tools": [
        {
          "name": "get_published_booking_page",
          "description": "Use this when a client knows a professional's exact beesolo slug. Returns the public service menu, prices, durations, and the link where the client can choose a time and confirm.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "slug": {
                "description": "Exact slug from the professional's public beesolo URL",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "bookingUrl": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "profileUrl": {
                "type": "string"
              },
              "services": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "description": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "durationMinutes": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "priceMinor": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["currency", "description", "durationMinutes", "name", "priceMinor"],
                  "type": "object"
                },
                "type": "array"
              },
              "slug": {
                "type": "string"
              },
              "timezone": {
                "type": "string"
              }
            },
            "required": ["bookingUrl", "name", "profileUrl", "services", "slug", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:772b8fdd029a6a046a58cd3c2c641803e59d64c45da8efa7ad620d5e230a6e4f"
        },
        {
          "name": "get_solo_plan",
          "description": "Use this to compare beesolo Solo pricing or check trial eligibility. Returns monthly and annual prices in minor currency units, trial length, included features, and shop and professional limits.",
          "inputSchema": {
            "not": {
              "type": "null"
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "includes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limits": {
                "additionalProperties": true,
                "properties": {
                  "professionals": {
                    "enum": [1],
                    "type": "number"
                  },
                  "publicBookingPages": {
                    "enum": [1],
                    "type": "number"
                  },
                  "shops": {
                    "enum": [1],
                    "type": "number"
                  }
                },
                "required": ["professionals", "publicBookingPages", "shops"],
                "type": "object"
              },
              "name": {
                "enum": ["Solo"],
                "type": "string"
              },
              "prices": {
                "additionalProperties": true,
                "properties": {
                  "annual": {
                    "additionalProperties": true,
                    "properties": {
                      "amountMinor": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "currency": {
                        "enum": ["EUR"],
                        "type": "string"
                      },
                      "excludesVat": {
                        "enum": [true],
                        "type": "boolean"
                      }
                    },
                    "required": ["amountMinor", "currency", "excludesVat"],
                    "type": "object"
                  },
                  "monthly": {
                    "additionalProperties": true,
                    "properties": {
                      "amountMinor": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "currency": {
                        "enum": ["EUR"],
                        "type": "string"
                      },
                      "excludesVat": {
                        "enum": [true],
                        "type": "boolean"
                      }
                    },
                    "required": ["amountMinor", "currency", "excludesVat"],
                    "type": "object"
                  }
                },
                "required": ["annual", "monthly"],
                "type": "object"
              },
              "trialDays": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["includes", "limits", "name", "prices", "trialDays", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
