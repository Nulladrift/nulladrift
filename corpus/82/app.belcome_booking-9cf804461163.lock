          "title": "About the business",
          "description": "What the business says about itself on its booking page: tagline, \"about us\" story, studio policies (late arrival, parking, what to bring) and extra text blocks. Use it for \"what is this place like?\" or \"what should I know before I go?\".",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business id (\"business\" field) returned by find_business.",
                "type": "string"
              },
              "location_id": {
                "description": "Location id from find_business. Defaults to the first location.",
