      },
      "instructions": "    Book appointments at salons, barbershops, spas, med spas and studios that use Belcome.\n    Flow: find_business, then list_services, then find_slots. Also: get_business (hours, phone, FAQ), list_team, list_gallery (photos of their work), list_addons (extras added to a service), list_reviews and list_offers (packages, memberships, gift cards) and get_booking_policy (cancellation, approval, deposit, fees) answer questions before booking. Offer a few open times in the location's timezone and\n    give the person the booking_url of the time they choose: they confirm it on the business's page with their name\n    and phone. Never ask for health details, card numbers or passwords in the chat.",
      "tools": [
        {
          "name": "find_business",
          "title": "Find a salon or spa",
          "description": "Find salons, barbershops, spas and studios that take online bookings on Belcome, by name, service or city. Returns up to 10 businesses with their locations and booking page.",
          "inputSchema": {
            "properties": {
              "near": {
                "description": "City, state or ZIP code to narrow the search, e.g. \"Orlando\" or \"02601\".",
                "type": "string"
              },
              "query": {
                "description": "Business name, service or kind of place, e.g. \"balayage\", \"barber\", \"Cape Cod Nails\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a salon or spa"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8fcb13b7b5ee91543f485cb62a64a9fdf7ba517c2be70a14ab3ecdc250cd4e9"
        },
        {
          "name": "find_slots",
          "title": "Find open times",
          "description": "Find open times for one service at a business, up to 14 days. Each time comes with a booking_url that opens the business's booking page with the service, professional and time already chosen; give that link to the person to confirm with their name and phone.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business id returned by find_business.",
                "type": "string"
              },
              "from": {
                "description": "First day, YYYY-MM-DD in the location's timezone. Defaults to today.",
                "type": "string"
              },
              "location_id": {
                "description": "Location id. Defaults to the first location.",
                "type": "string"
              },
              "service_id": {
                "description": "Service id from list_services.",
                "type": "string"
              },
              "staff_id": {
                "description": "Only this professional. Leave out for anyone available.",
                "type": "string"
              },
              "start_time_before": {
                "description": "Optional latest start time, exclusive, HH:MM (24-hour) in the location timezone on every searched day. Must be later than start_time_from if both are given. Filters appointment starts, not end times.",
                "type": "string"
              },
              "start_time_from": {
                "description": "Optional earliest start time, inclusive, HH:MM (24-hour) in the location timezone on every searched day. For afternoon use 12:00.",
                "type": "string"
              },
              "through": {
                "description": "Last day, YYYY-MM-DD, at most 13 days after from. Defaults to a week.",
                "type": "string"
              }
            },
            "required": ["business", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find open times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffc111f3a3ba4c3ae3015f417126b8d844786e88960bf8964094f188f7940f5f"
        },
