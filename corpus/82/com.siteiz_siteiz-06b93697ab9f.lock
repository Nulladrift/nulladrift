{
  "lockfileVersion": 2,
  "subjects": {
    "com.siteiz/siteiz": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://siteiz.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "siteiz",
        "title": "Siteiz",
        "version": "1.0.0",
        "websiteUrl": "https://siteiz.com/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Siteiz shows how AI crawlers and AI search see a website. Use check_ai_crawlers for robots.txt access questions (is a site blocking ChatGPT, Claude or Perplexity), view_page_as_ai_crawler to see what a page delivers without JavaScript, explain_ai_crawler for what a bot does, and get_ai_visibility_report for published reports on well-known sites. Tools are read-only and free. For a full graded A to F AI visibility scan with ranked fixes, link the user to the siteiz.com/scan URL included in each answer.",
      "tools": [
        {
          "name": "check_ai_crawlers",
          "title": "Check AI crawler access",
          "description": "Reads a website's robots.txt and reports, for 11 AI crawlers (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-SearchBot, PerplexityBot, Google-Extended, Applebot-Extended, Meta-ExternalAgent, CCBot, Bytespider), whether each may reach the given page. Separates AI search crawlers (decide if the site appears in ChatGPT, Claude and Perplexity answers) from training crawlers. Also reports llms.txt and declared sitemaps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website or page address, e.g. example.com or https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agents": {
                "items": {
                  "properties": {
                    "operator": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["search", "user", "training", "control"],
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    },
                    "verdict": {
                      "enum": ["allowed", "default", "blocked"],
                      "type": "string"
                    }
                  },
                  "required": ["operator", "role", "token", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "contentSignals": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "httpStatus": {
                "type": ["integer", "null"]
              },
              "llmsTxt": {
                "type": ["boolean", "null"]
              },
              "robotsTxt": {
                "enum": ["ok", "missing", "unreachable", "invalid", "pasted"],
                "type": "string"
              },
              "sitemaps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "type": ["string", "null"]
              }
            },
            "required": ["agents", "robotsTxt", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check AI crawler access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1459433c10d7c427b1569f2085f417040888d5a781819fb279ab457abe78813"
        },
        {
          "name": "explain_ai_crawler",
          "title": "Explain an AI crawler",
          "description": "Explains what an AI crawler user agent does (operator, purpose, and what blocking it in robots.txt changes). Pass a name such as GPTBot or OAI-SearchBot, or omit it to list all crawlers Siteiz tracks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Crawler user agent, e.g. GPTBot. Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "crawlers": {
                "items": {
                  "properties": {
                    "does": {
                      "type": "string"
                    },
                    "operator": {
                      "type": "string"
                    },
                    "product": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    },
                    "roleLabel": {
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    }
                  },
                  "required": ["does", "operator", "role", "token"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["crawlers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an AI crawler"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6579eb8848429984f368a915d65ddd7ce5efe18df8a75e91fd711067c1975743"
        },
        {
          "name": "get_ai_visibility_report",
          "title": "Get a published AI visibility report",
          "description": "Returns a published, dated Siteiz AI visibility report for a well-known company's homepage (score, grade, pillar scores, top issues). Omit the company to list all published reports.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Company name, e.g. Notion. Omit to list all reports.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Either `reports` (a list, when no company matched) or the single report fields.",
            "properties": {
              "company": {
                "type": "string"
              },
              "grade": {
                "type": "string"
              },
              "pillars": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "notAssessed": {
                      "type": "boolean"
                    },
                    "score": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "report": {
                "type": "string"
              },
              "reports": {
                "items": {
                  "properties": {
                    "company": {
                      "type": "string"
                    },
                    "grade": {
                      "type": "string"
                    },
                    "scannedAt": {
                      "type": "string"
                    },
                    "score": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "scannedAt": {
                "type": "string"
              },
              "score": {
                "type": "integer"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a published AI visibility report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3cae91391d4da14afdc1fd299d2dff570e874b186e392763cbd8f42e9d85932"
        },
        {
          "name": "view_page_as_ai_crawler",
          "title": "View a page as an AI crawler",
          "description": "Fetches one page the way most AI crawlers do (plain HTTP, no JavaScript) and reports what they actually receive: title, meta description, canonical, H1, heading count, structured data types, visible word count, token reading cost, and a text preview. Use it to check whether content is visible to AI without JavaScript.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Website or page address, e.g. example.com or https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bytes": {
                "type": "integer"
              },
              "canonical": {
                "type": ["string", "null"]
              },
              "finalUrl": {
                "type": "string"
              },
              "fullScan": {
                "type": "string"
              },
              "h1": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "headingCount": {
                "type": "integer"
              },
              "htmlTokens": {
                "type": "integer"
              },
              "metaDescription": {
                "type": ["string", "null"]
              },
              "status": {
                "type": "integer"
              },
              "structuredData": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "textTokens": {
                "type": "integer"
              },
              "title": {
                "type": ["string", "null"]
              },
              "words": {
                "type": "integer"
              }
            },
            "required": ["finalUrl", "fullScan", "status", "words"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "View a page as an AI crawler"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:77522f9a5f1f30256b014476de8d7d596f2eb113023b95db2a2c11d072641b8e"
        }
      ],
      "digest": "sha256:8bd9bd0b402118fc1f5a9debf66fdbd75ca73ca2b369ec1e657feb4f661f83a4"
    }
  }
}
