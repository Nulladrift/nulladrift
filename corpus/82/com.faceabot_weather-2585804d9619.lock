{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/weather": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/weather"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-weather",
        "title": "Faceabot Weather",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Weather: current weather and forecast (up to 9 days, with UV index), sunrise/sunset, pollen and air quality for any place in the world, free, no key.\nCall weather_forecast {\"location\":\"Paris\",\"days\":3} (coordinates: {\"location\":\"48.86,2.35\"}). \"tomorrow\" = daily[1]. sun_times {\"location\":\"Oslo\",\"date\":\"2026-12-21\"} for sunrise, sunset and day length. pollen_and_air_quality {\"location\":\"Brussels\"} for pollen (Europe) and air quality (worldwide).\nData: MET Norway (CC BY 4.0, cite \"MET Norway\"); pollen and air quality: CAMS via Open-Meteo (CC BY 4.0); place names: OpenStreetMap. Cached up to 1 hour.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "pollen_and_air_quality",
          "title": "Pollen and air quality for any place",
          "description": "Pollen (birch, alder, olive, grass, mugwort, ragweed, in grains/m³ with a level) and air quality (European and US AQI, PM2.5, PM10, ozone, NO2) now and for up to 4 days. Air quality: worldwide. Pollen: Europe only, during the pollen season (says so honestly elsewhere).\nUse when: hay fever, allergy, \"pollen count in Brussels\", \"is the air quality bad in Delhi today\", smog, asthma, outdoor sport.\nExample: {\"location\":\"Brussels\",\"days\":2}\nData: CAMS (Copernicus) forecasts via Open-Meteo (CC BY 4.0). Free, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 2,
                "description": "Days of daily maximums (1 = today)",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language of the place name, default en",
                "type": "string"
              },
              "lat": {
                "description": "Optional latitude instead of location",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "location": {
                "description": "City, address or landmark in any language, or \"lat,lon\"",
                "examples": ["Brussels"],
                "type": "string"
              },
              "lon": {
                "description": "Optional longitude (with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cb591cde8fdfa32e9a55fd3204cd5f46d43aa285dd62daafc7b11e02b3bbdecd"
        },
        {
          "name": "sun_times",
          "title": "Sunrise, sunset and day length for any place",
          "description": "Sunrise, sunset, solar noon and day length (local time) for any city or coordinates worldwide, for a date or up to 7 days; says when there is midnight sun or polar night.\nUse when: \"what time is sunrise in Oslo tomorrow?\", \"when is sunset in Bali\", planning photos, prayers or outdoor activities.\nExample: {\"location\":\"Oslo\",\"date\":\"2026-12-21\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "First date YYYY-MM-DD (default: today at that place)",
                "type": "string"
              },
              "days": {
                "default": 1,
                "description": "Number of days",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language of the place name, default en",
                "type": "string"
              },
              "lat": {
                "description": "Optional latitude instead of location",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "location": {
                "description": "City, address or landmark in any language, or \"lat,lon\"",
                "examples": ["Oslo"],
                "type": "string"
              },
              "lon": {
                "description": "Optional longitude (with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e8618455f7c21cc59f5c57d4b91ef9c9ef70d7de77619c53082818ba7963396"
        },
        {
          "name": "weather_forecast",
          "title": "Weather now and forecast for any place",
          "description": "Current weather and the forecast (up to 9 days) for any city, address or coordinates worldwide: temperature, conditions, rain, wind, humidity, UV index, plus the next 12 hours hour by hour.\nUse when: someone asks about the weather, a forecast, rain, temperature or wind somewhere, today, tomorrow or this week.\nExample: {\"location\":\"Paris\",\"days\":3}\nData: MET Norway (CC BY 4.0), place names via OpenStreetMap. Free, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 3,
                "description": "Number of days of daily forecast (1 = today only)",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Language of the place name: en, fr, nl, de, es… Default: en",
                "type": "string"
              },
              "lat": {
                "description": "Optional latitude: if lat and lon are given, they are used instead of geocoding location",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "location": {
                "description": "City, address or landmark in any language (e.g. \"Paris\", \"Bruxelles\", \"Shibuya, Tokyo\"), or coordinates as \"lat,lon\" (e.g. \"48.85,2.35\")",
                "examples": ["Paris"],
                "type": "string"
              },
              "lon": {
                "description": "Optional longitude (with lat)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "units": {
                "default": "metric",
                "description": "metric = °C, km/h, mm; imperial = °F, mph, inches",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d84e9b38eddcf25ea5068f99411b36320b692c5c530c7a3a6f727448454baf96"
        }
      ],
      "digest": "sha256:fd64557ffacc0e6a3f0ed14f9e95ef6ad1d596e088e4fabdfb1c3b20b607561a"
    }
  }
