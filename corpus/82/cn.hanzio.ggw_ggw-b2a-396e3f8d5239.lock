          "description": "代用户运行「七道关」痛点自测，返回结构化诊断（gates 排序/top_gate/top_biz/scene/推荐方案）与回看链接。⚠️ 必须先调 get_pain_quiz：把 10 道题逐题问用户（列出全部选项原文，单选选一个、多选可多选），把选中选项的 B*/T* 权重累加成 biz/pain，并把选中项给出的 maturity/readiness、industry/role 一起传入；只传画像不传 biz/pain 会返回 scored:false。",
