        {
          "name": "commit_version",
          "description": "Save the scenario's current state as a new immutable, hash-stamped version in the append-only chain. Records a diff vs the parent version and the recomputed top_line, and returns a content `hash` (+ `prev_hash`…",
          "inputSchema": {
            "additionalProperties": false,
