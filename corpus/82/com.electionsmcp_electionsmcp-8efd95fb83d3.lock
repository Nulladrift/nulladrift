        {
          "name": "target_precincts",
          "description": "Return structured precinct model rows: precinct_id, name, county, county_fips, baseline_share, modeled_share, ballots_est, overridden, and gap_to_goal. The response does not include demographic columns or demographic…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidate_id": {
                "default": "D",
                "type": "string"
              },
              "context": {
                "description": "Free-text constraints, echoed back (e.g. \"field ops in Orange and Durham only\").",
                "type": "string"
              },
              "filter": {
                "description": "Precinct property → condition map within the requested geography. Properties: external_id, GEOID, name, state, county, county_fips, shape_id, votes_dem, votes_rep, votes_total, pct_dem_lead, official_boundary, lat, lng, population, mhi, median_home, pct_bachelors, pct_foreign_born, unemp_pct, median_age, owner_occ_pct, modeled_margin_pp, modeled_pct_dem_lead, flipped, overridden. A bare scalar means exact equality; an array means membership. Object operators: gt, gte, lt, lte, in, not_in. Comparisons take finite numbers; in/not_in take arrays of scalars. Conditions are ANDed. pct_dem_lead is a baseline two-party share lead in -1..1. Scenario-scoped target_precincts, aggregate_precincts and apply_swing_to_query also accept modeled_margin_pp (D minus R over ALL modeled ballots, percentage points), modeled_pct_dem_lead (same margin / 100), modeled_share.CANDIDATE_ID (0..1 all-ballot share), flipped (winner differs from baseline, including ties) and overridden (saved precinct or county share override). These require a supported general statewide scenario with an allocated local model; missing shares never match numeric comparisons. Example: {external_id:{in:[\"48009-11\"]},votes_total:{gte:500}}. Unknown properties/operators and malformed conditions are rejected before matching or writing.",
                "type": "object"
              },
              "geo_id": {
                "description": "District or state geography — accepts the resolve_geography slug (\"us-pa\"), postal (\"PA\"), or FIPS (\"42\") (EM-056). Defaults to the simulation's race_scope geography.",
                "type": "string"
              },
              "goal_mode": {
                "default": "plurality",
                "description": "plurality = beat the leading opponent (default); majority = 50.01% share; share = explicit target_pct.",
                "enum": ["plurality", "majority", "share"],
                "type": "string"
              },
              "limit": {
                "default": 500,
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "margin": {
                "default": 1,
                "description": "plurality: win by at least this many votes.",
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Page start; pass next.offset from the prior result with the same scope and filters.",
                "minimum": 0,
                "type": "integer"
              },
              "rolloff_rate": {
                "description": "Explicit roll-off rate (see compute_vote_goal).",
                "maximum": 1.5,
                "minimum": 0.05,
                "type": "number"
              },
              "scenario_id": {
                "description": "The scenario/simulation handle (EM-056: simulation_id is accepted as an alias).",
                "type": "string"
              },
              "target_pct": {
                "default": 0.5001,
                "type": "number"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
            "required": ["scenario_id"],
            "type": "object"
          },
