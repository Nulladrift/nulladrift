        {
          "name": "get_view",
          "description": "Read the exact map/view state the application renders for a canonical scenario: headline totals, selected geography, modeled feature colors, annotations, primary-calendar playhead, candidate roster, presence, and a…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign_id_a": {
                "description": "Optional campaign custody for A when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "campaign_id_b": {
                "description": "Optional campaign custody for B when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "compare_simulation_id": {
                "description": "Compare B against simulation_id (A), using D-minus-R margin(B) minus margin(A). Requires one explicit state and county/precinct grain; both saved general-election models must share office/cycle/electorate and be readable.",
                "type": "string"
              },
              "cycle": {
                "maximum": 2040,
                "minimum": 2024,
                "type": "integer"
              },
              "difference_scale_pp": {
                "description": "Difference-only symmetric color extent: legend runs from negative this value through zero to positive this value. Omit to fit the largest absolute delta; out-of-scale values are disclosed as clamped.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "expected_hash_a": {
                "description": "Optional expected immutable version hash for A; mismatches refuse.",
                "type": "string"
              },
              "expected_hash_b": {
                "description": "Optional expected immutable version hash for B; mismatches refuse.",
                "type": "string"
              },
              "expected_version_hash": {
                "type": "string"
              },
              "grain": {
                "description": "With a state scoped, the grain of the local features returned: \"county\" (default) or \"precinct\". Applies to a statewide-level race (senate/governor/exec — its own overrides) AND to a PRIMARY sim scoped to a state (its per-county/precinct share-leader map from primary.feature_shares — mirroring render_view; a state-scoped primary defaults to county instead of the national delegate calendar). Ignored without a state.",
                "enum": ["city", "county", "precinct"],
                "type": "string"
              },
              "level": {
                "description": "Which map the view renders. Default president (or whatever set_view last scoped). house = HOUSE CONTROL (per-state delegation winners + the 218 banner); state_senate/state_assembly = one state's chamber (state required).",
                "enum": ["custom", "president", "senate", "house", "governor", "attorney_general", "secretary_of_state", "treasurer", "state_senate", "state_assembly"],
                "type": "string"
              },
              "simulation_id": {
                "type": "string"
              },
              "state": {
                "description": "Optional postal code or 2-digit FIPS — scope the map to one state. president → its county breakdown; senate/governor/exec → that RACE's local county (default) or precinct features from its own overrides (each with modeled margin, baseline_margin, and a basis label: direct_override | county_override | state_override_uniform | presidential_proxy / race_returns) — never the presidential county baseline relabeled. On a PRIMARY sim, scoping to a state returns that state's per-COUNTY (default; grain:\"precinct\" for finer) share-leader features from primary.feature_shares — modeled counties filled by the county primary WINNER's candidate color, unmodeled grey — instead of the national delegate calendar (which is the unscoped view).",
                "type": "string"
              },
              "version_a": {
                "description": "Difference comparison: exact saved version of A. Omit only when its latest version matches the live model.",
                "type": "string"
              },
              "version_b": {
                "description": "Difference comparison: exact saved version of B. Omit only when its latest version matches the live model.",
                "type": "string"
              },
              "version_id": {
                "description": "Exact saved version for a custom city model.",
                "type": "string"
              },
              "view": {
                "description": "difference uses compare_simulation_id as B and simulation_id as A; returns the zero-centered B-minus-A color scale and exact county/precinct rows.",
                "enum": ["result", "difference"],
                "type": "string"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
