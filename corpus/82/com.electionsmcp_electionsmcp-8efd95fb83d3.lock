        {
          "name": "primary_batch_edit",
          "description": "ATOMIC batch-edit transaction for a PRIMARY scenario — validate, preview, apply, and roll back a whole SET of candidate / share / calendar edits as ONE transaction. Pass edits:[{op, ...}, …] where each entry carries…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkpoint_label": {
                "description": "Optional label for the pre-batch rollback checkpoint version created on apply.",
                "type": "string"
              },
              "dry_run": {
                "description": "DEFAULT true — preview only: returns before/after/delta/warnings/errors/viability_flags and writes NOTHING. Pass false to actually apply.",
                "type": "boolean"
              },
              "edits": {
                "description": "Ordered heterogeneous list of primary edits, each an object {op, …opArgs}. op is one of set_primary_shares, set_primary_county_shares, set_primary_precinct_shares, set_primary_candidates, set_primary_asof, clear_primary_shares, define_dem_calendar, clear_dem_calendar, set_primary_grain_pref, set_primary_demo_levers. The remaining fields are exactly the args that single-edit tool takes, e.g. {\"op\":\"set_primary_shares\",\"party\":\"d\",\"state\":\"SC\",\"shares\":{\"newsom\":31,\"harris\":24}}. Applied in array order onto the working copy.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "expected_version_hash": {
                "description": "Copy expected_version_hash from the setup dry run to refuse overwriting an intervening edit. Exact already-applied replay returns the existing version.",
                "pattern": "^v1:[0-9a-f]{32}$",
                "type": "string"
              },
              "force": {
                "description": "Apply despite soft WARNINGS (just-over-100 totals, viability flags, mode/geo/calendar notes). Still BLOCKS on hard errors (unknown candidate, malformed edit, shares over 100.5). Default false.",
                "type": "boolean"
              },
              "party": {
                "description": "Default party (d/r) for edits that omit their own party. Defaults to the sim's primary party.",
                "type": "string"
              },
              "setup_evidence": {
                "description": "For automatic public-profile initialization: {kind:\"primary_profile_start\",model:\"geographic-context-v1\",profile_version:\"2026-09-05.v1\",ranking:[{id,name}]}. Use the same ordered ranking; the server validates the catalog and final roster/shares before one atomic save. Dry runs return proposed evidence; only applied evidence with version identity confirms success.",
                "type": "object"
              },
              "simulation_id": {
                "description": "The scenario/simulation to edit (sim_…).",
                "type": "string"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
            "required": ["edits", "simulation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
