        {
          "name": "compare_simulations",
          "description": "Compare two simulations. Without grain, returns the existing chamber/feature comparison. With grain:county|precinct and one state, compares exact saved canonical vote rows: margin(B)-margin(A), winners, flips, ballots…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign_id_a": {
                "description": "Optional campaign custody for A when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "campaign_id_b": {
                "description": "Optional campaign custody for B when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "expected_hash_a": {
                "description": "Optional expected immutable version hash for A; mismatches refuse.",
                "type": "string"
              },
              "expected_hash_b": {
