{
  "lockfileVersion": 2,
  "subjects": {
    "com.electionsmcp/electionsmcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.electionsmcp.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18", "2024-11-05"]
      },
      "serverInfo": {
        "name": "electionsmcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "electionsmcp — build user-controlled election models and coordinate campaign work. When the user wants to set up or join a campaign, call get_campaign_onboarding first and lead the setup in this AI conversation. Resume existing work before creating anything. Connecting alone never authorizes setup writes. tools/list shows the core tools plus call_tool. For anything else, find the tool with get_catalog (a query, a workflow, or {tool: name}) and run it with call_tool({ name, arguments }); it has the same permissions and checks as a direct call. Call get_catalog with the exact tool name when you need a tool's complete contract or after a validation error. The returned tool.guidance contains the same complete AI instructions as its use-<tool> MCP prompt; prompt support is optional. Tool-call receipts include a compact tool_guidance reference for the next step. Call tools/list for the catalog and help for the guided entry point; get_catalog searches the same retained tools authorized for this session. Send your API key as `Authorization: Bearer <key>` for durable Workbench operations; without it you are in the Core read/simulate sandbox. If the person is not signed in and wants to save work or set up a campaign, give them https://www.electionsmcp.com/get-started to create an account and get a personal connector URL; never ask for a key in chat. This server is dual-era: 2026-07-28 is served statelessly per-request, and 2025-06-18, 2024-11-05 through the legacy initialize handshake.",
      "tools": [
        {
          "name": "add_map_comment",
          "description": "Leave a Google-Docs-style COMMENT on the scenario map — a threaded, resolvable discussion anchored to a place. CAMPAIGN ISOLATION: when working inside a campaign, pass campaign_id; the scenario must be filed under it…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attachments": {
                "description": "Attachments on the message: [{name,url,mime,size,object_path?,kind?}]. An UPLOADED FILE rides as the object_path returned by /api/chat-upload — the bucket is private, so each read mints a fresh short-lived signed url into `url` (never store or share one; it expires). kind:\"link\" for pasted links; kind:\"view\" for a PINNED MAP VIEW whose url is a same-origin /sim?… deep link (the message carries the exact map context, and clicking the chip restores it).",
                "items": {
                  "properties": {
                    "kind": {
                      "enum": ["link", "view"],
                      "type": "string"
                    },
                    "mime": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "object_path": {
                      "type": "string"
                    },
                    "size": {
                      "type": "number"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "audience_scope": {
                "additionalProperties": false,
                "description": "Who can read this discussion or assignment. Replies and work originating in a discussion inherit its audience.",
                "properties": {
                  "audience": {
                    "enum": ["campaign", "leadership", "finance"],
                    "type": "string"
                  },
                  "boundary_version": {
                    "description": "The exact boundary version for these precinct IDs; required for precinct access.",
                    "maxLength": 120,
                    "type": ["string", "null"]
                  },
                  "precinct_ids": {
                    "anyOf": [
                      {
                        "items": {
                          "maxLength": 160,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 5000,
                        "minItems": 1,
                        "type": "array",
                        "uniqueItems": true
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Exact precinct IDs. Preserve leading zeros. Null means campaign-wide."
                  }
                },
                "required": ["audience", "boundary_version", "precinct_ids"],
                "type": "object"
              },
              "body": {
                "description": "The comment text (supports @mentions by email/handle).",
                "type": "string"
              },
              "campaign_id": {
                "description": "Campaign that owns this War Room message. The simulation must be tagged into it. Omit only for scenario-global discussion.",
                "type": "string"
              },
              "canvass_data": {
                "description": "Optional structured data for a field pin: { label, status, support_score, contacted_at, … } — anything your campaign tracks per pin.",
                "type": "object"
              },
              "canvass_kind": {
                "description": "Make this a color-coded FIELD-MAP PIN (Map View canvassing) instead of a plain comment: supporter (green) | voter (amber) | door (blue) | target (red) | note (teal). Use with a point anchor (lng+lat) or a feature_id. The body is the pin label.",
                "enum": ["supporter", "voter", "door", "target", "note"],
                "type": "string"
              },
              "category": {
                "description": "UNIFIED WAR ROOM OBJECTS: what kind of floater this placement is. Every category shares the same anchor model and starts a thread; the category drives the icon, the War Room grouping, and which payload fields make sense. A canvass_kind implies category \"canvass\" automatically.",
                "enum": ["note", "target", "canvass", "action", "need", "event", "strategy"],
                "type": "string"
              },
              "feature_id": {
                "description": "Anchor to this feature (5-digit county FIPS / precinct external_id / 2-digit state FIPS / district GEOID).",
                "type": "string"
              },
              "icon_type": {
                "description": "The icon/subtype within the category — e.g. note: why|risk|fact|question; target: by role; canvass: the drop kind; action: follow_up|call|door|research|decision.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional retry key. Replays return the same post and immutable context instead of duplicating the message.",
                "type": "string"
              },
              "lat": {
                "description": "Free-point anchor latitude (use with lng).",
                "type": "number"
              },
              "level": {
                "description": "Feature anchor level (county|precinct|state|house|state_senate|state_assembly). Defaults to the sim level.",
                "type": "string"
              },
              "lng": {
                "description": "Free-point anchor longitude (use with lat).",
                "type": "number"
              },
              "object": {
                "additionalProperties": false,
                "description": "Anchor the comment to an OBJECT (a strategy / strategy step / annotation / version / candidate / workspace person / canonical report widget), not a map place — the comment is ABOUT that object. A person ref must resolve inside this workspace and, when campaign-scoped, the person must be assigned to that campaign. A report_widget ref is verified against this exact saved scenario version.",
                "properties": {
                  "kind": {
                    "enum": ["strategy", "strategy_step", "annotation", "version", "candidate", "person", "report_widget"],
                    "type": "string"
                  },
                  "ref": {
                    "type": "string"
                  }
                },
                "required": ["kind", "ref"],
                "type": "object"
              },
              "parent_id": {
                "description": "Reply to this comment id (creates a thread; inherits the parent's anchor).",
                "type": "string"
              },
              "payload": {
                "description": "Category-specific structured fields, stored as-is. Examples — target: { priority, channel, universe_ref }; action: { status, assignee, due_at, priority }; need: { qty, unit, urgency }; event: { event_kind, starts_at, ends_at }.",
                "type": "object"
              },
              "region_kind": {
                "description": "What grain the regions[] ids are (precinct|county|state|district). Defaults to the anchor level.",
                "type": "string"
              },
              "regions": {
                "description": "The post's MANY-TO-MANY location — the region/turf/shapefile ids this post covers (a multi-area comment's selected regions, a canvass turf, a target's shapes). ONE comment can anchor to MANY areas: pass every id here. Written to the post_regions junction (\"what is happening in this region?\" stays one indexed query) AND stamped by the server onto the comment's payload.regions, so every reader of the post gets the full set back and the open map frames all of it. Returns regions_saved = what actually landed.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "report_context": {
                "additionalProperties": false,
                "description": "Bind this discussion to the exact immutable report widget the user is viewing. The report and widget must belong to simulation_id and the caller's workspace; the resulting receipt uses that report's pinned version and truthful widget coverage.",
                "properties": {
                  "report_id": {
                    "type": "string"
                  },
                  "widget_id": {
                    "type": "string"
                  }
                },
                "required": ["report_id", "widget_id"],
                "type": "object"
              },
              "simulation_id": {
                "type": "string"
              },
              "title": {
                "description": "Optional short name for the post (a strategy/target/event has one; plain chat does not — feeds fall back to a body excerpt). Indexed for full-text search alongside body.",
                "type": "string"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
            "required": ["body", "simulation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.electionsmcp/schema_version": "753e1b93f3ea7a7fd98ee6783a633bec62085db53a33c95dbc212982bc82c6df"
          },
          "digest": "sha256:ce05e90aa1707b664d937d4c029451c165dcb7552a02df810ed6ebddfd94d8c7"
        },
        {
          "name": "apply_swing_to_query",
          "description": "Apply a uniform swing or an explicit per-precinct weights vector to a filtered cohort in one atomic call. Weights select only their named IDs, support canonical statewide mechanisms, and optionally rescale a persuasion…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assumption": {
                "description": "mode calls that move ballots: stored on the lever's audit entry.",
                "maxLength": 600,
                "type": "string"
              },
              "filter": {
                "description": "Precinct property → condition map within the requested geography. Properties: external_id, GEOID, name, state, county, county_fips, shape_id, votes_dem, votes_rep, votes_total, pct_dem_lead, official_boundary, lat, lng, population, mhi, median_home, pct_bachelors, pct_foreign_born, unemp_pct, median_age, owner_occ_pct, modeled_margin_pp, modeled_pct_dem_lead, flipped, overridden. A bare scalar means exact equality; an array means membership. Object operators: gt, gte, lt, lte, in, not_in. Comparisons take finite numbers; in/not_in take arrays of scalars. Conditions are ANDed. pct_dem_lead is a baseline two-party share lead in -1..1. Scenario-scoped target_precincts, aggregate_precincts and apply_swing_to_query also accept modeled_margin_pp (D minus R over ALL modeled ballots, percentage points), modeled_pct_dem_lead (same margin / 100), modeled_share.CANDIDATE_ID (0..1 all-ballot share), flipped (winner differs from baseline, including ties) and overridden (saved precinct or county share override). These require a supported general statewide scenario with an allocated local model; missing shares never match numeric comparisons. Example: {external_id:{in:[\"48009-11\"]},votes_total:{gte:500}}. Unknown properties/operators and malformed conditions are rejected before matching or writing.",
                "type": "object"
              },
              "level": {
                "description": "The office these swung precincts model — folds them into that race's state rollup (same tag as set_precinct_pcts). REQUIRED for mode:\"turnout\"/\"mixed\" (the ballots ride that race's lever kernel; president excluded).",
                "enum": ["senate", "governor", "attorney_general", "secretary_of_state", "treasurer", "house", "state_senate", "state_assembly", "president"],
                "type": "string"
              },
              "max_precincts": {
                "default": 5000,
                "description": "Safety cap on how many precincts get mutated.",
                "maximum": 20000,
                "minimum": 1,
                "type": "integer"
              },
              "mix": {
                "default": 0.5,
                "description": "mode:\"mixed\" only — the fraction of swing_pp delivered via persuasion (the rest via turnout).",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "mode": {
                "description": "HOW the swing happens (EM-008). persuasion = conversion (×2 margin, ballots hold); turnout = one-sided ballots (×1 margin, votes_total moves); mixed = mix persuasion + the rest turnout. Omit for the classic call.",
                "enum": ["persuasion", "turnout", "mixed"],
                "type": "string"
              },
              "simulation_id": {
                "type": "string"
              },
              "source": {
                "description": "mode calls that move ballots: stored on the lever's audit entry.",
                "maxLength": 300,
                "type": "string"
              },
              "state": {
                "description": "Postal, FIPS, or resolve_geography slug (\"us-pa\") — required, scopes the query (EM-056: all formats accepted; also fills from geo_id).",
                "type": "string"
              },
              "swing_pp": {
                "description": "Percentage-point swing toward the target candidate. mode:\"turnout\": the percent of each precinct's ballots added for the target side.",
                "maximum": 50,
                "minimum": -50,
                "type": "number"
              },
              "target_margin_pp": {
                "description": "Alternative to swing_pp: desired margin of the target party over the other major party, as a percentage of all modeled ballots in the filtered cohort. Requires mode:persuasion, explicit toward_candidate_id and statewide level (including president). Cannot be combined with swing_pp.",
                "maximum": 100,
                "minimum": -100,
                "type": "number"
              },
              "toward_candidate_id": {
                "description": "The candidate id receiving the swing (e.g. \"D\", \"R\", or a custom id). Inferred to the level's first candidate of opposite party if omitted.",
                "type": "string"
              },
              "weights": {
                "additionalProperties": {
                  "maximum": 50,
                  "minimum": -50,
                  "type": "number"
                },
                "description": "Alternative to swing_pp: exact precinct external_id -> signed swing percentage points. Only these IDs change; all must be inside the state/filter with canonical ballots. Requires explicit D/R target, mode, statewide level and a cap covering the whole vector. President supports persuasion only. Optional target_margin_pp rescales a persuasion vector by a nonnegative factor (closest to 1 when several solutions exist), preserving its signs; target scope is weighted IDs only. Shares use sum-preserving 2-decimal rounding; receipt reports achieved margin/residual, clamps, weighted mean and one audit entry. Incremental; do not blindly replay after timeout.",
                "maxProperties": 20000,
                "minProperties": 1,
                "type": "object"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
            "required": ["filter", "simulation_id", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "com.electionsmcp/schema_version": "5d512149f3af0d72913523b9cec12aa3ace5ab41afa51a7d47b4dfbe234e4e44"
          },
          "digest": "sha256:b47ac85390df37e0c0266e210fde84126315da5d5f4cadfdaa62f54df389a178"
        },
        {
          "name": "apply_uniform_swing",
          "description": "Apply an incremental swing in points toward one candidate at the requested office. A saved race_scope restricts writes to that state or district and refuses a different office or unresolved geography. Unscoped and…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "YYYY-MM-DD timeline point at which to evaluate the decayed swing. Default: decay_start_date (full magnitude). Only used when decay_halflife is set.",
                "type": "string"
              },
              "decay_halflife": {
                "description": "Optional. Half-life in DAYS: past decay_start_date the applied swing halves every this-many days (exponential fade toward baseline). Omit for a permanent swing (today's behavior).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "decay_start_date": {
                "description": "YYYY-MM-DD the shift lands / peaks (decay measured forward from here). Default: today. Only used when decay_halflife is set.",
                "type": "string"
              },
              "level": {
                "enum": ["president", "senate", "governor", "house", "state_senate", "state_assembly", "attorney_general", "secretary_of_state", "treasurer"],
                "type": "string"
              },
              "simulation_id": {
                "type": "string"
              },
              "swing_pp": {
                "maximum": 50,
                "minimum": -50,
                "type": "number"
              },
              "toward_candidate_id": {
                "default": "D",
                "type": "string"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
            "required": ["level", "simulation_id", "swing_pp"],
