        {
          "name": "render_chart",
          "description": "share_comparison compares candidate shares for two saved versions of one model or two same-contest statewide general-election models. Returns canonical integer candidate votes, all-ballot shares, D-minus-R margins,…",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["simulation_id"]
              },
              {
                "properties": {
                  "type": {
                    "const": "share_comparison"
                  }
                },
                "required": ["simulation_id_a"]
              }
            ],
            "properties": {
              "asof": {
                "description": "For the primary charts — evaluate the race at this calendar checkpoint (contests counted), the same asof roll_up_primary takes: standings/clinch totals, the momentum timeline's end, and the calendar strip's counted set all stop there. Omit to use the scenario's STORED playhead (set_primary_asof) when one is set, else the full projected calendar. The response echoes the effective asof + contests_counted so a caption like \"Through FL\" can be verified against the data (tk_2840156e3f1d8b).",
                "type": ["integer", "null"]
              },
              "campaign_id_a": {
                "description": "Optional campaign custody for A when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "campaign_id_b": {
                "description": "Optional campaign custody for B when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "clinch": {
                "description": "ranking_board only — show each candidate's clinch line on the tiles (CLINCHES <state> · <date>, or how many delegates short). Default true; pass false for a name+delegates-only board. The response's rows[] carry the clinch data either way.",
                "type": "boolean"
              },
              "compare_simulation_id": {
                "description": "share_comparison only: alias for simulation_id_b.",
                "type": "string"
              },
              "context_simulation_id": {
                "description": "seat_hemicycle / decisive_seats only — compute the WHOLE chamber rollup from THIS scenario (a linked national/statewide view's scenario) instead of simulation_id. Pair with overlay_from_simulation_id + overlay_race to swap exactly one race's result in from a campaign's scenario: one seat changes hands, the counts move by that seat, nothing else. The two scenarios must model the same cycle and be general-election models — a disagreement is a typed refusal (context_cycle_mismatch / context_mode_mismatch), never a silent mix.",
                "type": "string"
              },
              "cycle": {
                "description": "Election cycle for seat_hemicycle / decisive_seats (defaults to the sim's cycle, else 2026) — drives the Senate class + governor calendar.",
                "type": "integer"
              },
              "expected_hash_a": {
                "description": "Optional expected immutable version hash for A; mismatches refuse.",
                "type": "string"
              },
              "expected_hash_b": {
                "description": "Optional expected immutable version hash for B; mismatches refuse.",
                "type": "string"
              },
              "format": {
                "description": "Image format. Default svg (png needs the resvg renderer; degrades to svg if absent).",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "highlight_race": {
                "additionalProperties": false,
                "description": "Mark one race on the card (same shape as overlay_race): its dot wears an amber ring on seat_hemicycle, and decisive_seats always includes it on the board with its true closest-races rank.",
                "properties": {
                  "district": {
                    "type": "string"
                  },
                  "office": {
                    "type": "string"
                  },
                  "state": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "level": {
                "description": "share_comparison only: statewide office; defaults to the saved scope. Both versions must match office, state, cycle and general-election stage.",
                "enum": ["president", "senate", "governor", "attorney_general", "secretary_of_state", "treasurer"],
                "type": "string"
              },
              "office": {
                "description": "For seat_hemicycle / decisive_seats — which chamber (default house). state_senate/state_assembly also need state.",
                "enum": ["house", "senate", "governor", "state_senate", "state_assembly"],
                "type": "string"
              },
              "overlay_from_simulation_id": {
                "description": "seat_hemicycle / decisive_seats only — the scenario that supplies the ONE overlaid race's modeled result. Travels with overlay_race; passing one without the other is refused (overlay_incomplete).",
                "type": "string"
              },
              "overlay_race": {
                "additionalProperties": false,
                "description": "The single race to swap in from overlay_from_simulation_id: {office, state, district}. office must match the card's chamber; statewide offices need only state; house takes the district GEOID (\"0604\") or the bare number with its state; state chambers take the district external_id.",
                "properties": {
                  "district": {
                    "type": "string"
                  },
                  "office": {
                    "type": "string"
                  },
                  "state": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "party": {
                "description": "For the primary charts — which party's race (defaults to the sim's primary mode).",
                "enum": ["d", "r"],
                "type": "string"
              },
              "share": {
                "description": "PUBLISH to a hostable URL: mints a share token and returns share.hosted_image_url / hosted_svg_url that resolve for ANYONE (cross-workspace, embeddable). Default false. Revoke with revoke_share(token).",
                "type": "boolean"
              },
              "share_ttl_days": {
                "description": "Days the shared URL stays live (default 90, max 365). Only with share:true.",
                "type": "number"
              },
              "simulation_id": {
                "description": "Scenario to render; for share_comparison this is A, or the single model with version_a/version_b.",
                "type": "string"
              },
              "simulation_id_a": {
                "description": "share_comparison only: A model, alternative to simulation_id. Conflicting aliases refuse.",
                "type": "string"
              },
              "simulation_id_b": {
                "description": "share_comparison only: B model in the same contest. Omit for two explicit versions of A.",
                "type": "string"
              },
              "state": {
                "description": "State postal or FIPS. Required for share_comparison and state-leg seat_hemicycle/decisive_seats.",
                "type": "string"
              },
              "style": {
                "additionalProperties": false,
                "description": "Optional brand overrides for the supported themed charts. Does not remove attribution or change candidate colors or model data.",
                "properties": {
                  "accent": {
                    "description": "Heading and threshold color, as six-digit hex. Candidate colors stay with the scenario roster.",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "background": {
                    "description": "Canvas color, as six-digit hex.",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "font": {
                    "description": "Portable font family. Custom fonts, URLs, and CSS are not accepted.",
                    "enum": ["sans", "serif", "mono"],
                    "type": "string"
                  },
                  "ink": {
                    "description": "Main text color, as six-digit hex.",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "theme": {
                "description": "Chart audience palette, using the map-theme registry. Supported by primary charts, swing_bars and chamber_control. Default control.",
                "enum": ["control", "analyst", "field", "civic", "accessible", "broadcast", "terrain", "print"],
                "type": "string"
              },
              "title": {
                "description": "Optional eyebrow/title for the chart.",
                "type": "string"
              },
              "type": {
                "description": "Which widget. share_comparison = saved candidate shares before/after, with paired version anchors and one state. Primary: delegate_standings (bars+clinch), clinch_dial (gauge), delegate_momentum (lines), calendar_strip (calendar grid), ranking_board (portrait tiles ranked by delegates + per-candidate clinch state/date; response carries the rows as data). General: swing_bars (state Δ vs 2024), chamber_control (down-ballot D/R scorecard), seat_hemicycle (the 1200×630 parliament-arch CONTROL CARD — every seat a dot, majority tick, big D/R counts), decisive_seats (the 1200×630 closest-races board with margin-band ratings + FLIP tags).",
                "enum": ["delegate_standings", "clinch_dial", "delegate_momentum", "calendar_strip", "ranking_board", "swing_bars", "chamber_control", "seat_hemicycle", "decisive_seats", "share_comparison"],
                "type": "string"
              },
              "version_a": {
                "description": "Difference comparison: exact saved version of A. Omit only when its latest version matches the live model.",
                "type": "string"
              },
              "version_b": {
                "description": "Difference comparison: exact saved version of B. Omit only when its latest version matches the live model.",
                "type": "string"
              },
              "workspace_scope": {
                "description": "Optional workspace for THIS call: use an exact personal/team ID from list_workspaces. Repeat on each call; it does not change the connection default. Must agree with MCP metadata and the effective HTTP workspace selector (header, otherwise connector URL). OAuth connections can only use their granted workspace. Membership and campaign permissions still apply.",
                "maxLength": 64,
                "minLength": 3,
                "pattern": "^[uw]-[a-z0-9](?:[a-z0-9-]{0,61})$",
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.electionsmcp/schema_version": "aff01f54a1b63262d4ec666c2430815afb5878b4fb28ebb5bc7bc658e628b3ee"
          },
          "digest": "sha256:9b346676f707e74535e93da2c232e18b5474d78d9dc219a111163770a72686d6"
        },
        {
          "name": "render_view",
          "description": "A headless server-rendered IMAGE of the map — the rendered view a viewer sees, as SVG or PNG, WITHOUT a browser (tk_0b6d3501 P2). For a scenario + level (president | senate | house | governor | the execs) it draws the…",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asof": {
                "description": "PRIMARY sims — render the delegate banner/standings AS OF this calendar checkpoint (contests counted; the same asof roll_up_primary / render_chart take). Omit to honor the scenario's STORED playhead (set_primary_asof) so the served image matches the viewer's scoreboard; null = the full projected calendar. The county/precinct share-leader FILLS are the scenario's stored shares and do NOT move with asof — only the delegate banner does. The primary mode + party are auto-detected from the sim's mode (dem_primary_2028 / rep_primary_2028); there is no mode/party arg. Ignored for general-election renders (the response echoes the effective asof when it applied).",
                "type": ["integer", "null"]
              },
              "campaign_id_a": {
                "description": "Optional campaign custody for A when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "campaign_id_b": {
                "description": "Optional campaign custody for B when the model belongs to multiple readable campaigns. Does not grant access.",
                "type": "string"
              },
              "compare_simulation_id": {
                "description": "Compare B against simulation_id (A), using D-minus-R margin(B) minus margin(A). Requires one explicit state and county/precinct grain; both saved general-election models must share office/cycle/electorate and be readable.",
                "type": "string"
              },
              "comparison_layout": {
                "description": "Difference-only 1200x630 card: one B-minus-A map (default), or the same-grain A | B | B-minus-A maps with explicit legends.",
                "enum": ["difference", "triptych"],
                "type": "string"
              },
              "difference_scale_pp": {
                "description": "Difference-only symmetric color extent: legend runs from negative this value through zero to positive this value. Omit to fit the largest absolute delta; out-of-scale values are disclosed as clamped.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "expected_hash_a": {
                "description": "Optional expected immutable version hash for A; mismatches refuse.",
                "type": "string"
              },
              "expected_hash_b": {
                "description": "Optional expected immutable version hash for B; mismatches refuse.",
                "type": "string"
              },
              "feature_id": {
                "description": "Optional — a state fips (37) or county/precinct id (37xxx) to scope to its state.",
                "type": "string"
              },
              "features": {
                "description": "CUSTOM MAP (president): an explicit list of geo_ids to include — county FIPS (5-digit), state FIPS (2-digit), or \"us-xx\". Hand-pick any counties across states; the map crops to exactly them. Combine with states[].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "format": {
                "description": "Image format. Default svg (png needs the resvg renderer on the host; degrades to svg if absent).",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "geo_id": {
                "description": "Optional — a geo slug like \"us-nc\" to scope to that state.",
                "type": "string"
              },
              "grain": {
                "description": "When scoped to ONE state (state/geo_id/feature_id), the geographic grain to render: \"county\" (default) per-county; \"precinct\" per-precinct (finest, within-county) — both work at president level AND at the statewide-race levels (senate/governor/exec, which render that race's own overrides/fold, tk_3c0569e9b02541); or a DISTRICT layer (president level only) — \"house\" = U.S. congressional districts (us-cd119), \"state_senate\" = state-senate districts (us-sldu), \"state_assembly\" = state-house districts (us-sldl). Districts are fetched on-demand and filled by their vote baseline (House: county→CD presidential aggregation; state-leg: RoutPoint 2024 returns where covered, else presidential-lean) + the scenario's district overrides (set_performance at that level). A few states lack a layer and fall back to county.",
                "enum": ["county", "precinct", "house", "state_senate", "state_assembly"],
                "type": "string"
              },
              "layers": {
                "additionalProperties": false,
                "description": "Draw saved highlight annotations on matching visible geography. Omit to honor set_view layers.highlights (default true); false hides them for this export only. Pins and notes are not rendered.",
                "properties": {
                  "highlights": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "level": {
                "description": "Which map to render. Default president. house = HOUSE CONTROL: states shaded by delegation majority, D/R seat tally, 218 banner (for one state's district map use grain:\"house\" with a state scope instead).",
                "enum": ["president", "senate", "house", "governor", "attorney_general", "secretary_of_state", "treasurer"],
                "type": "string"
              },
              "region": {
                "description": "CUSTOM MAP — with region_group, render exactly ONE region in the group (its slug).",
                "type": "string"
              },
              "region_group": {
                "description": "CUSTOM MAP — a saved workspace map region-group slug. Expands to its member counties or states; add region to render one named region. Ignored if states[] or features[] are passed.",
                "type": "string"
              },
              "share": {
                "description": "PUBLISH this map to a hostable URL: mints a share token and returns share.hosted_image_url / hosted_svg_url + a public page_url (/f/<token>) that resolve for ANYONE — cross-workspace, embeddable in an <img> or iframe. Default false (URLs are owner/public-scoped only). Anyone with the link sees the map; revoke with revoke_share(token).",
