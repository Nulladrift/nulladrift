        {
          "name": "translate",
          "title": "Translate text",
          "description": "Translate one text between Hebrew, English, Russian and the other languages from list_languages. Use it for product, support, interface, finance, legal and general clinical text. Returns the translation with its direction metadata.\n\nProtected translation: set `protect: true`, a `domain` (`general`, `clinical`, `finance`, `legal`) or any protection field, and prices, quantities, numbers, dates, codes, identifiers, product names, interface variables ({name}, %s) and `protected_terms` are kept exactly as written, and every sentence is verified; a sentence that cannot be verified comes back in the source language (status `fallback`) instead of a wrong value. `finance` also protects IBANs, card and account numbers and checks credit/debit direction; `legal` keeps clause references, citations and defined terms and checks shall/may modality; `clinical` protects drugs, doses and lab values.\n\nGender: `listener_gender` is the reader (\"you\"), `speaker_gender` the speaker (\"I\", e.g. an assistant). `glossary` maps source terms to required renderings; `redact_terms` keeps names exact and hidden from the model. `message_format: \"icu\"` translates an ICU MessageFormat string and rewrites plural branches for Hebrew and Russian. `quality`: `fast`, `balanced` (default) or `smartest`.\n\nUses the monthly character quota. For many short strings use translate_batch; for full English clinical documents into Hebrew use clinical_translate.",
          "inputSchema": {
            "properties": {
              "audience": {
                "description": "Clinical domain register. `clinician` (default) keeps shorthand such as BID and PO; `patient` writes it as plain words.",
                "enum": ["clinician", "patient"],
                "examples": ["patient"],
                "type": "string"
              },
              "bidi": {
                "description": "`isolate` wraps protected values in Unicode isolates in Hebrew output. Default none; see /v1/wrap.",
                "enum": ["isolate", "none"],
                "examples": ["none"],
                "type": "string"
              },
              "date_order": {
                "description": "How to read ambiguous numeric dates such as 04/03/2026. Default MDY for English sources, DMY for Hebrew and Russian.",
                "enum": ["MDY", "DMY"],
                "examples": ["MDY"],
                "type": "string"
              },
              "date_style": {
                "description": "`hebrew` (default) spells the month out in the target language (\"4 במרץ 2026\", \"4 марта 2026 г.\"); `iso`; `keep` (unambiguous dates only).",
                "enum": ["hebrew", "iso", "keep"],
                "examples": ["hebrew"],
                "type": "string"
              },
              "domain": {
                "description": "`general` (default) for product, commerce, support and interface text. `clinical` adds clinical register and drug, dose, lab and abbreviation detection. `finance` adds a formal banking register, protects IBANs, SWIFT/BIC codes, bank account numbers (including Israeli bank-branch-account), Israeli ID numbers and card numbers (check digits verified; these values are never shown to the model), invoice, policy and transaction references, signed amounts, rates and basis points, and checks that every money direction (credit/debit, deposit/withdrawal, buy/sell, increase/decrease, gain/loss, who owes whom) is kept. `legal` adds a formal legal register, protects clause and section references (Section 4.2, Clause 7(b), סעיף 12(א), § 3) and case and statute citations, renders each defined term (\"the Company\") the same way throughout, and checks that modality (shall, may, shall not, is not required to) is kept. Any value implies `protect`.",
                "enum": ["general", "clinical", "finance", "legal"],
                "examples": ["finance"],
                "type": "string"
              },
              "gender": {
                "description": "Grammatical gender for the reader where the target language marks it. For assistants, prefer `listener_gender` and `speaker_gender`.",
                "enum": ["male", "female", "general"],
                "examples": ["general"],
