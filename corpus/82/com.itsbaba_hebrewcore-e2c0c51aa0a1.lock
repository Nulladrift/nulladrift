        {
          "name": "clinical_translate",
          "title": "Translate clinical English to verified Hebrew",
          "description": "Translate a complete English clinical text (a discharge summary, patient instructions, a visit note, a model's answer) into Israeli medical Hebrew for a clinician or a patient. Drug names, doses, lab values, units, ICD-10 codes, clinical abbreviations, identifiers and every number are kept exactly; every sentence is checked for numbers, negation and laterality and reviewed for meaning. A sentence that fails is retried, then returned in English with status `fallback`: unverified Hebrew is never returned. Treat fallback sentences as untranslated.\n\n`audience`: `clinician` (default, keeps BID/PO shorthand) or `patient` (plain words). Pass the patient's medication and problem lists as `protected_terms`, names as `redact_terms` (hidden from the model), `reader_gender` and `patient_gender` when known, and `date_order` (US records are MDY). Counts 3× toward the monthly character quota.",
          "inputSchema": {
            "properties": {
              "audience": {
                "default": "clinician",
                "description": "Who reads the Hebrew. `clinician` (default) keeps shorthand such as BID and PO; `patient` writes dosing shorthand (BID, PRN) as plain words.",
                "enum": ["clinician", "patient"],
                "examples": ["patient"],
                "type": "string"
              },
              "bidi": {
                "default": "isolate",
                "description": "`isolate` wraps English values in Unicode isolates so \"5 mg\" never renders as \"mg 5\". `none` returns plain text.",
                "enum": ["isolate", "none"],
                "examples": ["isolate"],
                "type": "string"
              },
              "date_order": {
                "default": "MDY",
                "description": "How to read ambiguous numeric dates in the source. US records are MDY.",
                "enum": ["MDY", "DMY"],
                "examples": ["MDY"],
                "type": "string"
              },
              "date_style": {
                "default": "hebrew",
                "description": "`hebrew` writes \"4 במרץ 2026\"; `iso` writes 2026-03-04; `keep` leaves unambiguous dates as written (an ambiguous one is still rewritten). A two-digit year is kept as written.",
                "enum": ["hebrew", "iso", "keep"],
                "examples": ["hebrew"],
                "type": "string"
              },
              "glossary": {
                "additionalProperties": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "English term → required Hebrew rendering. Up to 500 entries.",
                "examples": [
                  {
                    "hypertension": "יתר לחץ דם"
                  }
                ],
                "type": "object"
              },
              "patient_gender": {
                "description": "Gender of the patient in third-person references. Inferred from he/she when omitted.",
                "enum": ["male", "female"],
                "examples": ["male"],
                "type": "string"
              },
              "protected_terms": {
                "description": "Kept verbatim. Pass the patient's medication and problem lists from the record. Up to 500, each up to 200 characters. Added to the account terms list for this request.",
                "examples": [
                  ["Eliquis 5 mg BID", "atrial fibrillation"]
                ],
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 500,
                "type": "array"
              },
              "reader_gender": {
                "description": "Gender of the reader, the person the text calls \"you\". Omit when unknown.",
                "enum": ["male", "female"],
                "examples": ["female"],
                "type": "string"
              },
              "redact_terms": {
