              "base": {
                "default": "auto",
                "description": "Paragraph direction to resolve against. `auto` (default) uses the first strong letter.",
                "enum": ["auto", "ltr", "rtl"],
                "examples": ["auto"],
                "type": "string"
              },
              "fields": {
                "additionalProperties": {
                  "maxLength": 20000,
                  "type": "string"
                },
                "description": "A map of field name → string, up to 100 fields and 20,000 characters in total. Send this or `text`.",
                "examples": [
                  {
                    "subtitle": "Read the summary",
                    "title": "מסמך Q3 ready"
                  }
                ],
                "type": "object"
              },
              "text": {
                "description": "A single string, up to 20,000 characters. Send this or `fields`.",
                "examples": ["שלום world"],
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "title": "AnalyzeRequest",
            "type": "object"
          },
