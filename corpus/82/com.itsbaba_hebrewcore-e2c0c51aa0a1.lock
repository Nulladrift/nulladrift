        {
          "name": "clinical_query",
          "title": "Hebrew question to English record query",
          "description": "Turn a Hebrew clinical question (up to 2,000 characters) into an English query for a record search or an English model. English terms, numbers and dates are kept exactly, and Hebrew spellings of drug names are mapped back to English, preferring the patient's own terms in `known_terms` and the account terms. Counts 3× toward the monthly character quota.",
          "inputSchema": {
            "properties": {
              "glossary": {
                "additionalProperties": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "English term → Hebrew rendering, used to map the Hebrew back to English.",
                "examples": [
                  {
                    "metformin": "מטפורמין"
                  }
                ],
                "type": "object"
              },
              "known_terms": {
                "description": "English terms from the patient's record, used to map Hebrew spellings back. Up to 500. Account terms are added automatically.",
                "examples": [
                  ["metformin", "lisinopril"]
                ],
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 500,
                "type": "array"
              },
              "text": {
                "description": "The Hebrew question, up to 2,000 characters.",
                "examples": ["האם המטופלת עדיין לוקחת מטפורמין?"],
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "description": "English query for your record search.",
                "examples": ["Is the patient still taking metformin?"],
                "type": "string"
              },
              "terms": {
                "description": "Hebrew spellings that were mapped back to English terms.",
                "items": {
                  "properties": {
                    "english": {
                      "examples": ["metformin"],
                      "type": "string"
                    },
                    "hebrew": {
                      "examples": ["מטפורמין"],
                      "type": "string"
                    },
                    "source": {
                      "description": "Where the mapping came from.",
                      "enum": ["known_terms", "lexicon", "glossary"],
                      "examples": ["known_terms"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "usage": {
                "properties": {
                  "characters": {
                    "examples": [33],
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
