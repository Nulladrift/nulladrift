        "name": "hebrewcore",
        "title": "HebrewCore by baba Hebrew",
        "version": "1.0.0",
        "description": "Hebrew translation, protected values, RTL display, nikud and clinical Hebrew for AI agents.",
        "websiteUrl": "https://hc.itsbaba.com",
        "icons": [
          {
            "src": "https://hc.itsbaba.com/baba-icon.png",
