              "text": {
                "description": "English text, 1 to 20,000 characters. Markdown lists, headings and tables keep their structure. Counts toward the monthly character quota.",
                "examples": ["Based on your records, you are taking Eliquis 5 mg twice a day. Your dose was changed on 03/04/2026."],
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
