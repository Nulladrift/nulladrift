      "instructions": "HebrewCore by baba Hebrew is a Hebrew language API (https://hc.itsbaba.com). Use these tools whenever text goes into or out of Hebrew, or when Hebrew must display correctly next to English.\n\nWhich tool:\n- translate: one text between Hebrew, English, Russian and the other languages from list_languages. translate_batch: up to 50 strings at once (interface strings, string files, product fields).\n- clinical_translate: a full English clinical document into verified Hebrew. clinical_query: a Hebrew clinical question into an English record query. clinical_verify: check Hebrew someone else produced against its English source. The clinical tools need a key with Clinical access.\n- detect_language: which language a user wrote in. analyze_direction and wrap_for_display: right-to-left layout of mixed Hebrew/English lines. transliterate, add_nikud, strip_nikud: Hebrew script work.\n- list_terms, add_terms, delete_term: the account's protected names (drug, product, brand), kept exactly in every protected translation.\n\nProtect exact values. When the text carries money, amounts, account or card numbers, dates, doses, lab values, codes, identifiers, product names or interface variables, call translate with protect: true or a domain (finance, legal, clinical, general): these values then come back exactly as written and every sentence is verified. Never rewrite, round, convert or \"fix\" a protected value in your own answer; copy the tool output as returned. A sentence with status \"fallback\" could not be verified and is left in the source language: say so rather than translating it yourself. For clinical content prefer clinical_translate, and pass the patient's medications as protected_terms and names as redact_terms.\n\nHebrew marks gender: set listener_gender for the reader (\"you\") and speaker_gender for the speaker (\"I\") when known. Quality: fast, balanced (default) or smartest.\n\nTools that call a model use the account's monthly character quota and every call counts toward its per-minute rate limit. Errors such as quota_exceeded, rate_limited or payment_required come back as tool errors; do not retry a quota error.",
      "tools": [
        {
          "name": "add_nikud",
          "title": "Add nikud (vowel points)",
          "description": "Add full nikud (vowel points) to Hebrew text, for learners, vocalized display and text-to-speech, where unvocalized Hebrew is ambiguous. English terms and numbers pass through unchanged. The result is verified: `verified: true` means removing the points gives back the input; when false, `nikud` is the input unchanged. Up to 10,000 characters. Uses the monthly character quota.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "Hebrew text to vocalize, up to 10,000 characters. English terms and numbers pass through.",
                "examples": ["שלום עולם"],
                "maxLength": 10000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "nikud": {
                "description": "The vocalized text, or the input unchanged when `verified` is false.",
                "examples": ["שָׁלוֹם עוֹלָם"],
                "type": "string"
              },
              "text": {
                "description": "The input.",
                "examples": ["שלום עולם"],
                "type": "string"
              },
              "verified": {
                "description": "True when removing the points gives back exactly the input. When false, `nikud` is the input unchanged: send it to speech unvocalized or retry.",
                "examples": [true],
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add nikud (vowel points)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:00e3f05ea149945d031a2105a938666d029bc5583d9c787b047be7ef9efde2c6"
        },
        {
          "name": "add_terms",
          "title": "Add or update account terms",
          "description": "Add protected terms to the account, or update existing ones (matched by exact term text). Every later protected translation on the account (translate, translate_batch and the clinical tools) keeps these terms exactly as written, or uses `translations.he` / `.en` / `.ru` for that target language when set. Sending a term that already exists replaces its translations and note. Up to 2,000 terms per account, each up to 200 characters. Changes apply to new requests within 30 seconds. Free.",
          "inputSchema": {
            "properties": {
              "terms": {
                "items": {
                  "properties": {
                    "note": {
                      "maxLength": 500,
                      "type": ["string", "null"]
                    },
                    "term": {
                      "examples": ["Optalgin"],
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "translations": {
                      "additionalProperties": false,
                      "examples": [
                        {
                          "he": "אופטלגין",
                          "ru": "Оптальгин"
                        }
                      ],
                      "properties": {
                        "en": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        },
                        "he": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        },
                        "ru": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "required": ["term"],
                  "type": "object"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["terms"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
