                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "pass": {
                "description": "True when no issue has severity `error`.",
                "examples": [false],
                "type": "boolean"
              },
              "usage": {
                "properties": {
                  "characters": {
                    "description": "Characters charged: source plus translation.",
                    "examples": [72],
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
