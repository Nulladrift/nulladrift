                ],
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "source": {
                "description": "The English source, up to 20,000 characters.",
                "examples": ["Metformin 500 mg BID since 03/04/2026."],
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "translation": {
                "description": "The Hebrew to check, up to 40,000 characters.",
                "examples": ["Metformin 50 mg BID מאז 03/04/2026."],
                "maxLength": 40000,
                "minLength": 1,
                "type": "string"
              },
              "verification": {
                "default": "standard",
                "description": "`standard` (default) runs the deterministic checks. `strict` adds an independent model review for meaning changes.",
                "enum": ["strict", "standard"],
                "examples": ["standard"],
                "type": "string"
              }
