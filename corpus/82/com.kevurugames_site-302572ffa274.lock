{
  "lockfileVersion": 2,
  "subjects": {
    "com.kevurugames/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.kevurugames.com/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "kevurugames-mcp",
        "title": "Kevuru Games",
        "version": "1.0.0",
        "description": "Search and read kevurugames.com (game development studio); send Kevuru Games an inquiry.",
        "websiteUrl": "https://kevurugames.com/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Website of Kevuru Games (kevurugames.com), a game development, game art, animation and outstaffing studio; services, portfolio, case studies and projects, and blog, in English. Use search to find pages, then fetch with a result id to read one in full. submit_inquiry sends the Kevuru Games team a project inquiry: use it only when the user explicitly asks to contact Kevuru Games, with the user’s real name and email.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page",
          "description": "Return the full text of one kevurugames.com page as markdown, by the id from search results (its canonical URL).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Page id from search: its canonical URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "language": {
                    "type": "string"
                  },
                  "site": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "text": {
                "description": "The page as markdown.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9b664aa359637aeb32d6ef32be62f62493e3612154e886b13254c86d73ebbab"
        },
        {
          "name": "get_page",
          "title": "Read a page (plain text)",
          "description": "Return the full markdown of one kevurugames.com page by its canonical URL (e.g. https://kevurugames.com/our-latest-projects/). The same as fetch, as plain text.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Canonical page URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page (plain text)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17553dd79ef8c377f970340d4693f0e302975d76c7b787e53d7cd6508adb939e"
        },
        {
          "name": "search",
          "title": "Search kevurugames.com",
          "description": "Search the website of Kevuru Games, a game development, game art, animation and outstaffing studio: services, hire pages, portfolio, case studies and projects (/our-latest-projects/) and blog articles. Use it to find what Kevuru Games offers, has built or has written about. Returns matching pages with snippets and URLs; read one in full with fetch, passing its id.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many pages to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search query in English, e.g. \"Unity mobile game development\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "id": {
                      "description": "Page id for fetch: its canonical URL.",
                      "type": "string"
                    },
                    "snippet": {
                      "description": "The passage that matched the query.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search kevurugames.com"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83af7d5d3c43d5737fd9ab67e768b5a95fa86bd565e062c9627f3aaaffcfd750"
        },
        {
          "name": "submit_inquiry",
          "title": "Send Kevuru Games an inquiry",
          "description": "Send a project inquiry to Kevuru Games on the user’s behalf: a request for a consultation, an estimate or a proposal for game development, game art, animation or outstaffing. It reaches the Kevuru Games team’s inbox and they reply by email to the address given. Use it only when the user asked to contact Kevuru Games, with the user’s own name and email address — never invent them — and show the user the text before sending. Sending means the user agrees to the Privacy Policy: https://kevurugames.com/privacy-policy/",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name, optional.",
                "maxLength": 150,
                "type": "string"
              },
              "email": {
                "description": "The user’s real email address. Kevuru Games replies to it.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "message": {
                "description": "What the user needs: the task, the business context, timing, any constraints.",
                "maxLength": 5000,
                "type": "string"
              },
              "name": {
                "description": "The user’s full name.",
                "maxLength": 100,
                "type": "string"
              },
              "phone": {
                "description": "Phone number, optional.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "type": "string"
              },
              "sent": {
                "type": "boolean"
              }
            },
            "required": ["message", "sent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send Kevuru Games an inquiry"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a1645d5c9cba63ff42560f5aa029cb2d3174c6c2139d8fbbffd7026b98616e9"
        }
      ],
      "digest": "sha256:7da47e95a1468ab3d6c5374f62e0c8c76e08563127bd5febb243d87a05e5d4fb"
    }
  }
