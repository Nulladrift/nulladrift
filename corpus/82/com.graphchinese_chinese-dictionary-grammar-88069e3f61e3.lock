              }
            ]
          },
          "digest": "sha256:9b69d3f2b1b76d07c3cf930eb6988904dfe99106dc42a47b495ffcfa28ebdf0c"
        },
        {
          "name": "get_topic_words",
          "title": "Chinese vocabulary by topic",
          "description": "Get the core Chinese words for a topic such as food, family, travel or business, with pinyin, meaning and HSK level. Call it with no topic to list the 30 topics and their slugs. Use this when the user wants words for a situation or subject. Do not use it to translate a specific word.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "A topic slug such as food. Omit to list all topics.",
                "maxLength": 40,
                "pattern": "^[a-z][a-z-]*$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chinese vocabulary by topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:a4df2c97910a14d83eb66babf53751f6b994392757c95eac609537d68ea753fd"
        },
        {
          "name": "lookup_word",
          "title": "Look up a Chinese word",
          "description": "Look up one Chinese word or character, written in simplified or traditional characters. Returns its pinyin, every meaning, its HSK level, other readings of the same characters, each character it is made of, and the GraphChinese lessons that teach it. Use this when the user asks what a specific Chinese word means or how it is pronounced. Do not use it for Japanese or other languages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "word": {
                "description": "The word in Chinese characters, for example 便宜.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a Chinese word"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:a6c6b356f807d39007bbe0176ae61e1999cc4a9c22dac006390c5dc9fd7cf4c8"
        },
        {
          "name": "search_dictionary",
          "title": "Search the Chinese dictionary",
          "description": "Search a Mandarin Chinese dictionary by Chinese characters, pinyin or an English word. Returns up to 10 matching words, each with its pinyin, a short meaning, its HSK level when it has one, and a link to its dictionary page. Use this when the user wants the Chinese for an English word, or does not know the exact headword. Do not use it for whole sentences (use segment_text) or grammar questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Chinese characters, pinyin (with or without tones) or English.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Chinese dictionary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ac43e8edaff18c35d7b29f9f17d955f0f4cb23c734d07e30332495f820658ade"
        },
        {
          "name": "search_grammar",
          "title": "Search Chinese grammar points",
          "description": "Search 195 Mandarin grammar points by keyword, by HSK level, or both. A keyword can be English (comparison, passive), a Chinese marker (把, 了) or a term name. Returns matching points with a one-paragraph summary and the slug that get_grammar_point takes. Use this to find which grammar point covers a pattern. Do not use it for vocabulary questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "level": {
                "description": "Only return points taught at this HSK level.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "One or more keywords. Every keyword must match.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Chinese grammar points"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
