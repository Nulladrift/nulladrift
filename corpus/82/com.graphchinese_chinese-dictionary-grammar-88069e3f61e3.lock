      "capabilities": {
        "tools": {}
      },
      "instructions": "A Mandarin Chinese dictionary and grammar reference. Give Chinese in simplified characters unless the user writes traditional.",
      "tools": [
        {
          "name": "get_common_characters",
          "title": "Most common Chinese characters",
          "description": "List the most frequent Chinese characters, most common first, each with its pinyin, meaning, HSK level and the cumulative share of running text it covers, plus how many characters are needed to cover 50, 80, 90 and 95 percent. Counted over GraphChinese's 145 graded readings. Use this when the user asks which characters matter most or how many they need. Do not use it for one character's meaning (use lookup_word).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many characters to return. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many of the most common. Default 0.",
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Most common Chinese characters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
