              }
            ]
          },
          "digest": "sha256:978ed8b1401de1d1f95f5c40772d1ab70c546e1e9a0441cda0e1c4a607a9bef8"
        },
        {
          "name": "get_study_order",
          "title": "What to learn first at an HSK level",
          "description": "Get the opening vocabulary lessons of an HSK level, in the order GraphChinese teaches them, each a themed group of words with pinyin and meaning. This is a learning order, not an alphabetical word list. Use this when the user asks what words to learn first, or what to start with at HSK 1 to 5. Do not use it to look up one word (use lookup_word).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "level": {
                "description": "HSK level, 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What to learn first at an HSK level"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
