        },
        {
          "name": "get_grammar_order",
          "title": "Which grammar to learn first",
          "description": "List the grammar points of an HSK level in the order GraphChinese teaches them, which respects what each point needs first. Each has a summary and the slug that get_grammar_point takes. Use this when the user asks which sentence patterns to learn first, or what grammar to study at their level. Do not use it to explain one pattern (use get_grammar_point).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many points to return. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "level": {
                "description": "HSK level, 1 to 6.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["level"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which grammar to learn first"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:0fa3ee044a530c4277a5ebfa2ce35a5cf2051308bf121ae7f57a666b941d98ea"
        },
        {
          "name": "get_grammar_point",
          "title": "Get one Chinese grammar point",
          "description": "Get one Mandarin grammar point by its slug. Returns the written explanation, worked example sentences with pinyin and English, a word-by-word note for each word in the pattern (what it does, structure, three examples, a common mistake), the grammar points that should be learned first, and the points this one leads to. Use this after search_grammar, when the user wants a pattern explained or wants to know what to study before it. Do not guess a slug: get it from search_grammar or get_grammar_order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "A slug returned by search_grammar.",
                "maxLength": 80,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one Chinese grammar point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:81c5c7275cf57522847a02c4d5df079846ddaf5a01de8418116cef643d3fd446"
        },
        {
          "name": "get_related_characters",
          "title": "Find related Chinese characters",
          "description": "Show how one Chinese character connects to others. Returns the components it is built from, characters that contain it, characters that look similar and are easy to confuse with it, the other characters that share its sound component, and common words that start with or contain it. Use this when the user wants to learn a character through its parts, tell look-alike characters apart, or see a character family. Do not use it for words of two or more characters.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "character": {
                "description": "Exactly one Chinese character, for example 请.",
                "maxLength": 4,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["character"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find related Chinese characters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
