{
  "lockfileVersion": 2,
  "subjects": {
    "com.actualgroup/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.actualgroup.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Actual group – offres d'emploi",
        "version": "1.0.0",
        "description": "Job offers of Actual group, a French temporary work and recruitment group: search offers, read them, find agencies and prepare an application."
      },
      "capabilities": {
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use search_offers then get_offer to help a candidate find a job in France. Filter values come from list_offer_facets. To apply, call start_application with the candidate's consent and give them the returned link: they attach their CV and send the application themselves.",
      "tools": [
        {
          "name": "find_agencies",
          "title": "Find Actual group agencies",
          "description": "Actual group employment agencies (about 780 in France) in a town or a region, with address and specialties. Candidates can visit or call an agency for advice, registration or follow-up on their applications. To recommend the single most relevant agency for a job, use find_best_agency instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "Town name, e.g. \"Nantes\".",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of agencies returned. Defaults to 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "region": {
                "description": "French region name, e.g. \"Pays de la Loire\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "filename": "find-agencies.ts"
          },
          "digest": "sha256:79ce18367c530f84ded16dc07f9a64d1b8c063502234f60bb9170f0a5c5b574b"
        },
        {
          "name": "find_best_agency",
          "title": "Find the most relevant Actual group agency",
          "description": "Recommend the Actual group agency, office, training centre or school best suited to a person's need, near a place in France. Covers employment agencies (intérim, CDD, CDI), Actual Talent offices (talent acquisition and assessment, mostly white-collar), Envergure centres (vocational training, skills assessment, career transition) and the group's schools (eSUP, Holberton…, often work-study). Ranks them by open offers for the given job, specialty (construction, logistics, medical, white-collar, school domain…) and distance. Returns address, phone, opening status and why each agency was picked. Pass the returned agency code to search_offers (agencyCode) to list that agency's offers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job": {
                "description": "Job or field the person is looking for or hiring for, e.g. \"électricien\", \"cariste\", \"aide-soignant\".",
                "type": "string"
              },
              "limit": {
                "description": "Number of agencies to return, 1 to 5. Defaults to 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "French town or postal code, e.g. \"Le Mans\" or \"72000\".",
                "minLength": 2,
                "type": "string"
              },
              "purpose": {
                "description": "find_job: a candidate looking for work (default). hire: a company looking to recruit. assessment: a company wanting candidates or staff assessed (Actual Talent). training: vocational training, skills assessment or career change (Envergure). school: a degree or work-study programme (group schools). insertion: return-to-work support.",
                "enum": ["find_job", "hire", "assessment", "training", "school", "insertion"],
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "filename": "find-best-agency.ts"
          },
          "digest": "sha256:cff6ecb52512290f9857f93fb202b5b1b9b2e67a5473ffde0561e6fe1b377f5c"
        },
        {
          "name": "get_offer",
          "title": "Get a job offer",
          "description": "Full details of one Actual group job offer: description, required profile, salary, schedule, benefits and recruiting agency. Takes the slug returned by search_offers (also the last segment of the offer URL).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Language of the offer text. Defaults to fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "slug": {
                "description": "Offer slug, from search_offers or the offer URL.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "filename": "get-offer.ts"
          },
          "digest": "sha256:e3e46815cb75421852b598ceca98f91e36ee7dc705a7a542f1494bd82a692395"
        },
        {
          "name": "list_offer_facets",
          "title": "List offer filter values",
          "description": "Exact filter values accepted by search_offers for one dimension (contract type, job family, industry or region), with the number of open offers for each. Optionally scoped by a query and a town.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "dimension": {
                "description": "Which filter to list.",
                "enum": ["contractType", "family", "industry", "region"],
                "type": "string"
              },
              "q": {
                "description": "Optional free text to scope the counts.",
                "type": "string"
              },
              "town": {
                "description": "Optional town or postal code to scope the counts.",
                "type": "string"
              }
            },
            "required": ["dimension"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "filename": "list-offer-facets.ts"
          },
          "digest": "sha256:5c6fc50905a19fd2e39558e84a39db689922b200aced88fb61f744220a43dcf5"
        },
        {
          "name": "search_offers",
          "title": "Search job offers",
          "description": "Search the job offers (temporary work, fixed-term and permanent contracts) published by Actual group in France. Combine a free-text query with a town and filters. Filter values for contractType, family, industry and region must be exact French values: get them from list_offer_facets. Use get_offer with a result's slug for the full offer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agencyCode": {
                "description": "Only offers handled by this agency: the agency code returned by find_best_agency.",
                "type": "string"
              },
              "contractType": {
                "description": "Contract types (exact values from list_offer_facets), e.g. [\"Contrat de travail temporaire\", \"CDI\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "family": {
                "description": "Job families (exact values from list_offer_facets).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "industry": {
                "description": "Industries (exact values from list_offer_facets).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "description": "Language of the offer texts and URLs. Defaults to fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Results per page, 1 to 20. Defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free text: job title, skill or keyword, e.g. \"cariste\", \"soudeur TIG\", \"aide-soignant\".",
                "type": "string"
              },
              "radius": {
                "anyOf": [
                  {
                    "const": 10,
                    "type": "number"
                  },
                  {
                    "const": 20,
                    "type": "number"
                  },
                  {
                    "const": 50,
                    "type": "number"
                  }
                ],
                "description": "Search radius in km around the town. Defaults to 20."
              },
              "region": {
                "description": "French regions (exact values from list_offer_facets), e.g. [\"Bretagne\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "Sort order. Defaults to relevance.",
                "enum": ["relevance", "date", "distance"],
                "type": "string"
              },
              "town": {
                "description": "French town or postal code to search around, e.g. \"Rennes\" or \"35000\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "filename": "search-offers.ts"
          },
          "digest": "sha256:aba92b4dfde05af79847aca4a82601587a708beaf93918e26f405c2e860e5962"
        },
        {
          "name": "start_application",
          "title": "Start a job application",
          "description": "Prepare an application to an Actual group offer on behalf of the candidate you are assisting. Returns a personal link, valid 72 hours, that the candidate must open to attach their CV and give consent to the processing of their data; the application is only sent once they submit that page. Only call this when the candidate has asked to apply and given you their name and email. Never submit the page yourself: give the link to the candidate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Candidate email address.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "firstName": {
                "description": "Candidate first name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Language of the application page. Defaults to fr.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "lastName": {
                "description": "Candidate last name.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "phoneNumber": {
                "description": "Candidate phone number, optional.",
                "maxLength": 30,
                "type": "string"
              },
              "slug": {
                "description": "Slug of the offer, from search_offers or get_offer.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "firstName", "lastName", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "filename": "start-application.ts"
          },
          "digest": "sha256:2a24f7dbd29cf1a0f64e93edbb01ee74698d016b8e764055748e642bc5ef4091"
        }
      ],
      "digest": "sha256:8d6f6f87a913c1f16bd2f779d9c757dd73b2333536d7aa30386d1504717701f7"
    }
  }
}
