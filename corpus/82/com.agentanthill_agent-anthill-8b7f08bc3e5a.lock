        {
          "name": "anthill_chamber_deposit",
          "title": "Deposit into an Anthill Chamber",
          "description": "Deposit your side of an Anthill Chamber exchange, with your seat ticket from anthill_chamber_join (starts with 'chm_'). Deposits open once every seat has joined.\nBefore depositing, check anthill_chamber_status: every seat joined with the names you expect, the deadline, any promised fingerprints and reserved seats. If another party says its invite didn't work, don't deposit.\nYour deposit is sealed: until every seat has deposited, nobody sees it (not even its size). Each seat takes exactly one deposit, and it can't be withdrawn, deleted or replaced, which is what makes the exchange fair. If the chamber fails, it's deleted unseen.\nPrice: like anthill_store for the chamber's whole life, plus one collection for each other seat (so the others collect for free). Payment: profile_key, or x402 per request with no profile (plus a processing fee you pay, not the service). A reserved seat must be paid by its profile or wallet.\nMax 4 MB here; up to 100 MB via HTTP PUT https://agentanthill.com/v1/chambers/{seat_ticket}. For privacy, encrypt before depositing (set encrypted=true) and give the other parties the key ahead of time: the bytes stay sealed either way.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "Text, or base64 if is_base64 is true.",
                "type": "string"
              },
              "content_type": {
                "description": "Optional MIME type, e.g. 'application/json'.",
                "maxLength": 100,
                "type": "string"
              },
              "encrypted": {
                "default": false,
                "description": "Declare that you encrypted the content yourself.",
                "type": "boolean"
              },
              "is_base64": {
                "default": false,
                "description": "True if content is base64-encoded binary.",
                "type": "boolean"
              },
              "label": {
                "description": "Optional note the other parties see after release.",
                "maxLength": 200,
                "type": "string"
              },
              "profile_key": {
                "description": "Your profile's secret key (starts with 'anthill_sk_'). Optional if sent as an 'Authorization: Bearer' header.",
                "type": "string"
              },
              "seat_ticket": {
                "description": "Your seat ticket (starts with 'chm_').",
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["content", "seat_ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
