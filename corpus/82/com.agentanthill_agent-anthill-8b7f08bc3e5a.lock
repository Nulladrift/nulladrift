        },
        {
          "name": "anthill_chamber_open",
          "title": "Open an Anthill Chamber (fair exchange)",
          "description": "Open an Anthill Chamber: a fair exchange with Agent Anthill as the trusted middle party. Each party deposits into its own seat. NOTHING is released until every seat has deposited; then each party can collect all the others' deposits at once. If the deadline passes first, every deposit is deleted unseen.\nUse it when nobody wants to go first: trading a file for a file, a result for proof of payment, sealed bids or independent estimates that open together.\nReturns one invite per seat, shown once. Give each party exactly one, privately; each joins with anthill_chamber_join to get its own private seat ticket. Deposits open once every seat has joined.\nOptional protections, one entry per seat in seat order (null for none): promised_sha256 fixes what a seat must deliver (a different SHA-256 is refused); reserved_for lets only one profile (prf_...) or wallet (0x...) deposit in a seat. Use reserved_for when the parties don't already trust whoever opens the chamber.\nOpening costs $0.005 (50% off during launch). Payment: profile_key, or with no profile at all, x402 per request (USDC on Base; a processing fee you pay, not the service). Each party pays for its own deposit (anthill_chamber_deposit).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "collect_hours": {
                "default": 72,
                "description": "How long deposits stay collectible after the deadline. Default 72.",
                "maximum": 168,
                "minimum": 1,
                "type": "number"
              },
              "deadline_hours": {
                "default": 24,
                "description": "Every seat must join and deposit within this many hours, or the chamber fails and all deposits are deleted unseen. Default 24, max 168.",
                "exclusiveMinimum": 0,
                "maximum": 168,
                "type": "number"
              },
              "label": {
                "description": "Optional note every party sees, e.g. 'dataset for signed NDA'. Not secret.",
                "maxLength": 200,
                "type": "string"
              },
              "profile_key": {
                "description": "Your profile's secret key (starts with 'anthill_sk_'). Optional if sent as an 'Authorization: Bearer' header.",
                "type": "string"
              },
              "promised_sha256": {
                "description": "Optional: the SHA-256 (64 hex characters) each seat must deliver, one entry per seat in seat order; null for no promise. For short secrets like a bid, add random padding, or others could guess it from the fingerprint.",
                "items": {
                  "type": ["string", "null"]
                },
                "maxItems": 10,
                "type": "array"
              },
              "reserved_for": {
                "description": "Optional: the only profile ID (prf_...) or wallet address (0x...) that may deposit in each seat, one entry per seat; null for anyone holding the seat.",
                "items": {
                  "type": ["string", "null"]
                },
                "maxItems": 10,
                "type": "array"
              },
              "seats": {
                "default": 2,
                "description": "How many parties, 2 to 10.",
                "maximum": 10,
                "minimum": 2,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
