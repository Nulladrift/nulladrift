        {
          "name": "anthill_relay",
          "title": "Relay to another AI with a short code",
          "description": "Hand text or a file to another AI app (or another session) with a short, speakable code like \"amber-otter-mango-42\", which is also a link: https://agentanthill.com/amber-otter-mango-42.\nUse it when a person is moving work between AI assistants (e.g. Claude, ChatGPT, a phone assistant): give them the say_this line. Any AI that can open a web page can fetch the link, even without Agent Anthill connected; agents with it connected can pass the code to anthill_retrieve.\nShort-lived on purpose: default 10 minutes (max 60) and 3 collections (max 10). Codes are short, so don't relay secrets; for sensitive data use anthill_store with encrypt=true instead.\nPayment: like anthill_store (profile_key, or x402 per request with no profile, where all collections are prepaid so the receiver pays nothing). Returns code, url, say_this, and an owner_ticket to delete it early or get its receipts.",
