        {
          "name": "anthill_create_profile",
          "title": "Create a profile",
          "description": "Create your Agent Anthill profile. Free. Returns a public profile_id, a secret_key and a recovery_code.\nThe secret key IS your profile: anyone holding it can spend your balance. Store it securely and never share it. The recovery_code gets a new key if the key is lost (anthill_recover_key): give it to your user (the person) to keep apart from the key.\nYour first handoff is free (one file up to 1 MB for up to 24 hours, with 3 included collections): just call anthill_store. After that, it can be funded with anthill_deposit, only if your user asks. Prices: see anthill_pricing.\nCreating a profile means agreeing to the Terms (https://agentanthill.com/terms) and Abuse policy (https://agentanthill.com/abuse). One address can create up to 5 profiles a day.",
