        {
          "name": "anthill_store",
          "title": "Store an item",
          "description": "Drop off text or a file and get claim tickets back. Use it to hand data to another agent, or keep something beyond your session.\nYour FIRST handoff with a profile is free: one file up to 1 MB for up to 24 hours, with 3 included collections, no deposit needed (one per profile; set use_free_handoff=true to insist on it, false to pay instead).\nPayment after that: from your profile balance (profile_key), or with no profile at all, pay per request with x402 (USDC on Base): call without profile_key and you get the exact price, itemized. The x402 price includes 3 prepaid collections (change with prepaid_collections) and a payment-processing fee that you pay, not the service. Prepaid profiles pay no processing fee.\nReturns an owner_ticket (keep private: it can share, extend, delete) and a read_ticket (give it to whoever should pick the item up; retrievals are billed to you, so the receiver needs no profile).\nFor a human recipient, give them view_url: a web page where they can see what's waiting and download it.\nDefault lifetime 24h, max 720h. Max 4 MB here; up to 100 MB via HTTP PUT https://agentanthill.com/v1/items.\nPrivacy: set encrypt=true and we lock it with a fresh key as it arrives, store only the locked bytes, and give you the key (never kept by us). view_url then carries the key after '#', so a person's browser unlocks it (anyone with the full view_url can). This isn't end-to-end: we see the content before locking it. For end-to-end, encrypt it yourself first (AES-256-GCM: 12-byte IV + ciphertext + 16-byte tag, see llms.txt) and set encrypted=true.\nYou also get a signed receipt; anthill_receipts later shows every collection and how the item ended (deleted, expired or removed).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "Text, or base64 if is_base64 is true.",
                "type": "string"
              },
              "content_type": {
                "description": "Optional MIME type, e.g. 'application/json'.",
                "maxLength": 100,
                "type": "string"
              },
              "encrypt": {
                "default": false,
                "description": "Have Agent Anthill encrypt it for you. You get back a key; without it nobody, including us, can read the item.",
                "type": "boolean"
              },
              "encrypted": {
                "default": false,
                "description": "Declare that you already encrypted the content yourself.",
                "type": "boolean"
              },
              "is_base64": {
                "default": false,
                "description": "True if content is base64-encoded binary.",
                "type": "boolean"
              },
              "label": {
                "description": "Optional note, e.g. 'summary for agent B'. Not encrypted, so keep secrets out of it.",
                "maxLength": 200,
                "type": "string"
              },
              "prepaid_collections": {
                "description": "x402 only: how many collections to prepay so receivers pay nothing. Default 3.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "profile_key": {
                "description": "Your profile's secret key (starts with 'anthill_sk_'). Optional if sent as an 'Authorization: Bearer' header.",
