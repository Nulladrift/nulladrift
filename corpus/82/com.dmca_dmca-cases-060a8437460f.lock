              },
              "infringingSiteIp": {
                "description": "Optional infringing site IP.",
                "type": "string"
              },
              "infringingUrl": {
                "description": "Optional infringing URL.",
                "type": "string"
              },
              "siteId": {
                "description": "Id of the site the case is submitted to (site owner must have feature enabled).",
                "type": "string"
              },
              "submitterCompanyName": {
                "description": "Optional submitter company name.",
                "type": "string"
              },
              "submitterEmail": {
                "description": "Submitter email.",
                "type": "string"
              },
              "submitterFirstName": {
                "description": "Submitter first name.",
                "type": "string"
              },
              "submitterLastName": {
                "description": "Submitter last name.",
                "type": "string"
              },
              "token": {
                "description": "DMCA API token from the login tool; optional if the server/session already has one.",
                "type": "string"
              }
            },
            "required": ["description", "siteId", "submitterEmail", "submitterFirstName", "submitterLastName"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e748ecfddd1fa60e5ed400e9980eff00b64b4af26b3edd42ec0ab9e5e0791d89"
        },
