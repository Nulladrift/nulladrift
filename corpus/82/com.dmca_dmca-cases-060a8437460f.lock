      },
      "instructions": "DMCA.com cases MCP. Tools: login, listCases, listDIYCases, listComplianceCases, getCaseById, createCase, updateCase, createDIYCase, createComplianceCase, getSiteReport. Callers can send their own DMCA.com API token on the MCP request as an Authorization: Bearer, X-DMCA-Token or Token header; otherwise call login with the user's DMCA.com email/password first: it returns a DMCA API token that is reused automatically for the rest of this MCP session, so cases are created under that user's account. Every other tool also takes an optional token argument (the token from login), which always takes priority; pass it explicitly if a call returns HTTP 401. There is no shared server token: without login or token, case tools fail with 'Not logged in'. updateCase keeps status and priority unchanged unless you pass them. getSiteReport uses upstream path /getSiteReport/{domain}.",
      "tools": [
        {
          "name": "createCase",
          "description": "POST https://api.dmca.com/createCase — create managed takedown case. Uses the session/`token` DMCA API token.",
          "inputSchema": {
            "properties": {
              "copiedFromUrl": {
                "description": "Optional original / copied-from URL.",
                "type": "string"
              },
              "description": {
                "description": "Case description.",
                "type": "string"
              },
              "infringingSiteIp": {
                "description": "Optional infringing site IP.",
                "type": "string"
              },
              "infringingUrl": {
                "description": "Optional infringing URL.",
                "type": "string"
              },
              "subject": {
                "description": "Case subject.",
                "type": "string"
              },
              "token": {
                "description": "DMCA API token from the login tool; optional if the server/session already has one.",
                "type": "string"
              }
            },
            "required": ["description", "subject"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53551876aaf22af713f8e08d084fa24eb1553477fe50fe6e27ebb1662abd1607"
        },
        {
          "name": "createComplianceCase",
          "description": "POST https://api.dmca.com/createComplianceCase — create compliance case. siteId site owner must have feature enabled. Uses the session/`token` DMCA API token.",
          "inputSchema": {
            "properties": {
              "copiedFromUrl": {
                "description": "Optional original / copied-from URL.",
                "type": "string"
              },
              "description": {
                "description": "Case description.",
