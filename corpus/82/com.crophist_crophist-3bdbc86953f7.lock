{
  "lockfileVersion": 2,
  "subjects": {
    "com.crophist/crophist": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.crophist.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "crophist",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "analyze_polygon",
          "description": "Analyze crop distribution within a custom GeoJSON polygon. Returns per-year zonal statistics. Requires an Enterprise API key.",
          "inputSchema": {
            "properties": {
              "geojson": {
                "description": "GeoJSON Polygon or Feature geometry",
                "type": "object"
              },
              "years": {
                "description": "Years to analyze (default: all 2008-2024)",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["geojson"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:109990dcc4a7ef4042d4d03d37d8f228ca55d79da913a4418927086635ec621f"
        },
        {
          "name": "batch_fields",
          "description": "Look up crop history for multiple fields at once (up to 100). Requires a Pro or Enterprise API key. Returns history and rotation analysis for each field.",
          "inputSchema": {
            "properties": {
              "field_ids": {
                "description": "Array of CropHist field IDs (max 100)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["field_ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f18c5f16f085a83b88956dea24dd5917ef6318b88a0806d2174983f2092f24fd"
        },
        {
          "name": "check_usage",
          "description": "Check API key usage statistics including tier, daily usage, remaining calls, and account info. Requires an API key (pass as ?key= in the MCP server URL).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29d75c14f7616a814182ec238408605b3afdab6b85547122193cd9212c9a6532"
        },
        {
          "name": "compare_years",
          "description": "Compare what was growing on a field between two specific years. Provide either a field_id or lat/lng coordinates, plus two years to compare.",
          "inputSchema": {
            "properties": {
              "field_id": {
                "description": "CropHist field ID (optional if lat/lng provided)",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (optional if field_id provided)",
                "type": "number"
              },
              "lng": {
                "description": "Longitude (optional if field_id provided)",
                "type": "number"
              },
              "year_a": {
                "description": "First year to compare (2008-2024)",
                "type": "number"
              },
              "year_b": {
                "description": "Second year to compare (2008-2024)",
                "type": "number"
              }
            },
            "required": ["year_a", "year_b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5a957f8cb01801389a7a5b4642a6dcf6c193dc5c7d5929287cf3c3f27a96712b"
        },
        {
          "name": "crop_stats",
          "description": "Get crop area statistics (top crops by area in hectares) for a bounding box or named location. Computed from USDA Cropland Data Layer (CDL) at 30m resolution. Provide either a place_name (geocoded to ~0.5 degree bbox) or explicit bbox coordinates.",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "Bounding box [west, south, east, north] in WGS84 degrees (max 0.5 degree side)",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "place_name": {
                "description": "US place name, e.g. \"Story County, Iowa\" (used if bbox not provided)",
                "type": "string"
              },
              "year": {
                "description": "CDL year (2008-2024, default 2024)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ee05050726d36e56c0dfd6585857a12dc5b6fe36c17b753cc1b3e0c22be0629"
        },
        {
          "name": "export_data",
          "description": "Get a download URL for bulk crop history data by US state and year. Returns a pre-signed S3 URL valid for 1 hour. Requires an Enterprise API key.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Output format (default: csv)",
                "enum": ["csv", "parquet"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code (e.g. IA, IL) or US for full dataset",
                "type": "string"
              },
              "year": {
                "description": "Year (2008-2024)",
                "type": "number"
              }
            },
            "required": ["state", "year"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe59864ca17b8e0785214fca80fe9ee48760ed43a2e4c51493f91dbcfe6a27d0"
        },
        {
          "name": "find_field",
          "description": "Find the agricultural field at a given latitude/longitude and return its crop history. Coordinates must be within the continental US. Returns 2008-2024 history with rotation analysis.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Latitude (WGS84)",
                "type": "number"
              },
              "lng": {
                "description": "Longitude (WGS84)",
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0e4cc0b10a0389a616daa18a2898e4f865830923a630ed3079cebbc248f6af3"
        },
        {
          "name": "lookup_field",
          "description": "Look up the crop history for a US agricultural field by its CropHist field ID. Returns year-by-year crop history (2008-2024) with rotation analysis. Field IDs are numeric strings found via the CropHist map at crophist.com.",
          "inputSchema": {
            "properties": {
              "field_id": {
                "description": "CropHist field ID (numeric string)",
                "type": "string"
              }
            },
            "required": ["field_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9fd03834bf569062b0c6e99ec129b74ae9545ce11f0689005f415d6c43d79995"
        },
        {
          "name": "search_location",
          "description": "Search for a US location by name (city, county, address, landmark) and return the crop history of the nearest agricultural field. Uses geocoding to convert place names to coordinates.",
          "inputSchema": {
            "properties": {
              "place_name": {
                "description": "US place name, e.g. \"Ames, Iowa\" or \"Story County, IA\"",
                "type": "string"
              }
            },
            "required": ["place_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc1b3cbe5dcd56afe446442e81dccdc7bf143f85cc4a03c4db54234ebef7acb5"
        }
      ],
      "digest": "sha256:9a41d45613ff559fa1d918005dc46549208d09fc6ab3f7c4e38c2f17a046804e"
    }
  }
}
