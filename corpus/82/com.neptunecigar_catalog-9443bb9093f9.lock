        {
          "name": "check_shipping",
          "title": "Check State Shipping Rules",
          "description": "Check whether Neptune Cigars can ship premium cigars to a US state.\n\nAccepts a state name or 2-letter code. Returns the DTC shipping posture,\nage/ID delivery rules, and tax notes for that state. Neptune ships from\nFlorida; all deliveries require an adult (21+) recipient.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
