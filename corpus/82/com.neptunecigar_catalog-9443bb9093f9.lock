              "tags": []
            }
          },
          "digest": "sha256:251d4938a8c94056f0facb9805403cd9b35252861a593a8956a115e8fdbaf3be"
        },
        {
          "name": "search_products",
          "title": "Search Products In Stock",
          "description": "Search buyable products (SKUs) on neptunecigar.com by name.\n\nReturns live sellable items — exact vitola/packaging (single, 5-pack,\nbox) — with current price, stock availability, and a direct product URL.\nUse search_cigars first to pick a line, then this to find what's in stock.",
