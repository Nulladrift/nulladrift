          "name": "get_cigar_line",
          "title": "Get Cigar Line Details",
          "description": "Full details for one cigar line, by line_id (from search_cigars) or name.\n\nReturns taste profile (strength/wrapper/binder/filler/origin), community\nrating breakdown incl. draw/burn/aroma/taste sub-ratings, price range, and\ndescription from the Cigar Scanner knowledge base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "line_id": {
                "default": 0,
                "type": "integer"
              },
              "name": {
                "default": "",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
