          "digest": "sha256:617b8cf69f4d19b3b06b5210bf9a268aead0be4233f792b80e99aa109f47c86f"
        },
        {
          "name": "search_cigars",
          "title": "Search Cigars",
          "description": "Search premium cigar lines in the Neptune Cigars / Cigar Scanner catalog.\n\nAll filters optional. strength: Mild | Mild-Medium | Medium | Medium-Full | Full.\norigin examples: Nicaragua, Dominican Republic, Honduras, USA.\nwrapper examples: Connecticut, Maduro, Habano, Corojo, Nicaraguan.\nmax_box_price filters on the line's cheapest box. min_rating is 1-5 stars\n(community ratings from Cigar Scanner). Returns up to `limit` (max 25) lines\nsorted by rating quality.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "type": "integer"
              },
              "max_box_price": {
                "default": 0,
                "type": "number"
              },
              "min_rating": {
                "default": 0,
                "type": "number"
              },
              "origin": {
                "default": "",
                "type": "string"
              },
              "query": {
                "default": "",
                "type": "string"
              },
              "strength": {
                "default": "",
                "type": "string"
              },
              "wrapper": {
                "default": "",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
