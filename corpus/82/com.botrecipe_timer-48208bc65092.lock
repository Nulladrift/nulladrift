{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/timer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://timer.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sandbox-timer",
        "title": "Sandbox Timer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Idle-sandbox guard for AI agents. Your agent sends its running E2B, Vercel Sandbox, Daytona or Modal sessions; Sandbox Timer flags the idle ones, shows what idle time cost at the hourly rates you give it, and with Pro at $9 a month returns the ready-to-run kill call for each. A guard on top of your sandboxes, not a sandbox. It never holds your provider keys. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "idle_report",
          "description": "Which sandboxes were flagged idle and what idle time cost, per provider, from what track_sessions has seen. Without an API key pass fleet. With a key: every fleet on it. Free shows 7 days, Pro 30.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "1-30 (free max 7).",
                "type": "integer"
              },
              "fleet": {
                "description": "A stable name for this group of sandboxes, e.g. \"my-agent\". State and rules are kept per fleet.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6476f7298ea3b42bde4579e018ce5e1fdff80809922e8892d5925f0245453f91"
        },
        {
          "name": "set_idle_rules",
          "description": "Pro: save the rules track_sessions applies to a fleet: idle_minutes threshold, max_lifetime_minutes, default rates_per_hour by provider, and alert_webhook. Free returns a preview of the rules and saves nothing (pass the same values on each track_sessions call instead).",
          "inputSchema": {
            "properties": {
              "alert_webhook": {
                "type": "string"
              },
              "fleet": {
                "description": "A stable name for this group of sandboxes, e.g. \"my-agent\". State and rules are kept per fleet.",
                "type": "string"
              },
              "idle_minutes": {
                "type": "integer"
              },
              "max_lifetime_minutes": {
                "type": "integer"
              },
              "rates_per_hour": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ecdc87e32d0e296acf0af51c4b4b3dc1ad506b4ebca7fd135212f4b341ce491"
        },
        {
          "name": "track_sessions",
          "description": "Send your agent's running sandbox sessions (up to 200; call it on a heartbeat, e.g. every 5 minutes) and get back which are idle past your threshold or over their max lifetime, the dollars idle time has cost at the hourly rates you pass, and what to do. Pro acts: returns a ready-to-run kill call per idle sandbox for its provider (E2B kill, Vercel Sandbox stop, Daytona stop, Modal terminate) and POSTs one alert per sandbox to your webhook. Free watch-only returns would_kill and sends nothing. We never hold provider keys and never kill anything ourselves: your agent runs the call with its own key.",
          "inputSchema": {
            "properties": {
              "alert_webhook": {
                "description": "https URL Pro posts the idle alert (with the kill call) to.",
                "type": "string"
              },
              "fleet": {
                "description": "A stable name for this group of sandboxes, e.g. \"my-agent\". State and rules are kept per fleet.",
                "type": "string"
              },
              "idle_minutes": {
                "description": "Idle minutes before a sandbox counts as idle. Default 15 (or your saved Pro rule).",
                "type": "integer"
              },
              "max_lifetime_minutes": {
                "description": "Optional: flag sandboxes running longer than this, idle or not.",
                "type": "integer"
              },
              "rates_per_hour": {
                "description": "Optional default USD per hour by provider, e.g. {\"e2b\": 0.17}. Your own numbers; per-session rate_per_hour wins.",
                "type": "object"
              },
              "sessions": {
                "items": {
                  "properties": {
                    "age_minutes": {
                      "description": "Minutes since it started (or pass started_at). Used for max lifetime.",
                      "type": "number"
                    },
                    "id": {
                      "description": "Sandbox id as your provider returns it (E2B sandboxId, Vercel sandbox name, Daytona id or name, Modal object_id).",
                      "type": "string"
                    },
                    "idle_minutes": {
                      "description": "Minutes since the sandbox last did work (a command, a request). Or pass last_activity_at.",
                      "type": "number"
                    },
                    "label": {
                      "description": "Optional human name, e.g. \"repo-tests\".",
                      "type": "string"
                    },
                    "last_activity_at": {
                      "description": "ISO time of the last work in the sandbox (instead of idle_minutes).",
                      "type": "string"
                    },
                    "provider": {
                      "description": "e2b, vercel, daytona, modal, or any other name.",
                      "type": "string"
                    },
                    "rate_per_hour": {
                      "description": "What this sandbox costs you per hour in USD, from your provider's price page or bill. Optional; without it we count minutes, not dollars.",
                      "type": "number"
                    },
                    "session_id": {
                      "description": "Vercel only: the current session id, used in the REST stop call.",
                      "type": "string"
                    },
                    "started_at": {
                      "description": "ISO start time (instead of age_minutes).",
                      "type": "string"
                    },
                    "status": {
                      "description": "running (default), paused or stopped. Paused and stopped sessions are skipped.",
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["sessions"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c620262981507c33c9f617fb60ae4754555f5b6f2113b91dbe312fa9d75a8d73"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9976e3342e295e0be5a023bb57d60324ebd7c104df1c76e8d7effcdadec38b20"
        },
        {
          "name": "weekly_report",
          "description": "Plain-English summary of the last 7 days: sandboxes watched, how many sat idle, dollars idle time cost at your rates, kill calls returned (Pro) or that would have been (free). Read-only; sends nothing. Needs a free API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51842b9e10ac998358f48e0659b344da6726a1bfab631adadbf77dddded38c61"
        }
      ],
      "digest": "sha256:0f050333bc2a2fe96b371616619d78861fc559db40740131f78c587cbd9d244c"
    }
  }
}
