        "name": "cnregwatch-china-data",
        "title": "China Visa & Regulation Data",
        "version": "0.2.3",
        "websiteUrl": "https://cnregwatch.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free, no key: list_capabilities, get_pricing, sample_eligibility, check_visa_free_eligibility, latest_regulation_changes (50 calls per IP per day in total). Policy information for reference only — we do not provide visa agency or intermediary services (仅供政策信息参考，不提供代办或中介服务。 / Policy information for reference only. We do not provide visa agency or intermediary services.). No MCP tools require payment. Data is sourced and dated; cite the returned source links. Support: support@rendlet.com",
      "tools": [
        {
          "name": "check_visa_free_eligibility",
          "title": "Check China visa-free eligibility",
          "description": "Use when someone asks whether a passport holder can enter mainland China without a visa, and for how long. Inputs: \"nationality\" (English country name, e.g. \"Germany\"). Output: JSON with visa_free_for_ordinary_passports, max_days, and every applicable route (30-day unilateral exemption, mutual agreements, 240-hour transit, Hainan 30-day) with conditions, validity dates and official NIA/MFA/embassy source links; dataset last checked 2026-10-18. Not legal advice. 仅供政策信息参考，不提供代办或中介服务。 / Policy information for reference only. We do not provide visa agency or intermediary services. Cost: free, no key, 50 free-tool calls per IP per day in total.",
          "inputSchema": {
            "properties": {
              "nationality": {
                "description": "Country name in English, e.g. \"Germany\", \"United States\".",
                "type": "string"
              }
            },
            "required": ["nationality"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5faa160d0e362c92915a7801468a6a7ebfd64a4f5674600ff652a10e711eb629"
        },
        {
          "name": "get_pricing",
          "title": "Get pricing and how to buy",
          "description": "Use when the user asks about cost, hits the free limit, or needs more calls. Inputs: none. Output: JSON with the free-tool limit, prepaid credit packs and their Stripe Payment Links, the USDC-on-Base endpoint and steps, and the cost of each tool. Cost: free, no key, 50 free-tool calls per IP per day in total.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a57a5e1cef5de153010db4eac1d18b5341ef753fd9061f08ed9066da4490dba2"
        },
        {
          "name": "latest_regulation_changes",
          "title": "Latest China regulation changes",
          "description": "Use to brief a foreign business on recent official Chinese regulations and policy releases (State Council English releases, MOFCOM). Inputs: optional \"limit\" (1-20, default 5), \"topic\" (tag/keyword, e.g. \"trade\", \"export control\"), \"since\" (YYYY-MM-DD). Output: JSON list of items with date, source, title, summary, tags and a link to the original. 仅供政策信息参考，不提供代办或中介服务。 / Policy information for reference only. We do not provide visa agency or intermediary services. Cost: free, no key, 50 free-tool calls per IP per day in total.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Optional ISO date (YYYY-MM-DD); only items on or after it.",
                "type": "string"
              },
              "topic": {
                "description": "Optional tag/keyword filter, e.g. \"trade\", \"export control\", \"AI\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e4dbc3692fdedb7dc12d2b86577fb2695d342c151093f57c752dcfae6bfc220"
        },
        {
          "name": "list_capabilities",
          "title": "List capabilities",
          "description": "Use first to see what this server covers and which tools are free. Inputs: none. Output: JSON with each tool, its cost, data coverage (visa-free routes for mainland China; official regulation releases), dataset dates and auth method. Cost: free, no key, 50 free-tool calls per IP per day in total.",
          "inputSchema": {
