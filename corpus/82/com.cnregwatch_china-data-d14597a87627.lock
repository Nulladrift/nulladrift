        },
        {
          "name": "sample_eligibility",
          "title": "Free sample eligibility result",
          "description": "Use to preview the shape and quality of eligibility data. Inputs: optional \"nationality\" (English country name; default \"Germany\"). Output: a short sample: whether ordinary passports are visa-free, max days, route names and one source link. For full routes, conditions, dates and all sources use check_visa_free_eligibility. 仅供政策信息参考，不提供代办或中介服务。 / Policy information for reference only. We do not provide visa agency or intermediary services. Cost: free, no key, 50 free-tool calls per IP per day in total.",
