              },
              "NuProtocolo": {
                "description": "Número do protocolo do evento (somente dígitos). Identifica o evento específico (ex.: Carta de Correção, Cancelamento, Conciliação Financeira (ECONF), Manifestação do destinatário) registrado para a nota fiscal. Sem o protocolo, o BuscarEventos com a Chave lista os eventos autorizados da nota com o protocolo de cada um.",
