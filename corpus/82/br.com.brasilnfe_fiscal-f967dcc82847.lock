                            "CodUnidadeMedida": {
                              "description": "Código da Unidade de Medida (cUnid) Valores: 0 - Metro Cúbico (M3); 1 - Quilograma (KG); 2 - Tonelada (TON); 3 - Unidade (UNIDADE); 4 - Litros (LITROS); 5 - MMBTU (MMBTU)",
                              "enum": [0, 1, 2, 3, 4, 5],
                              "type": "integer"
                            },
