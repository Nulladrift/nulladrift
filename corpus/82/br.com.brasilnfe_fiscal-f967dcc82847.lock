        {
          "name": "cadastro_consultar",
          "title": "Consultar Inscrição Estadual (IE) na SEFAZ",
          "description": "Consulta a Inscrição Estadual (IE) de um contribuinte na SEFAZ estadual (mundo NF-e/ICMS), por CNPJ/CPF/IE + UF. ATENÇÃO: muitas UFs NÃO oferecem este serviço (ex: RJ) e prestadores de serviço normalmente NÃO têm IE - nesses casos a IE não vem, e ISSO NÃO SIGNIFICA QUE O CNPJ ESTEJA INATIVO. Quando a SEFAZ não retorna e o documento é CNPJ, há fallback automático na Receita Federal (campo 'fonte'='receita') trazendo razão social, situação cadastral e endereço - sempre leia o campo 'mensagem'. Para apenas saber se um CNPJ está ativo ou pegar seus dados cadastrais (sem precisar da IE), prefira cliente_consultar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cpfCnpjIe": {
                "type": ["string", "null"]
              },
              "uf": {
                "description": "UF do CPF, CNPJ, IE",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "Contato": {
                "additionalProperties": false,
                "properties": {
                  "Email": {
                    "type": ["string", "null"]
                  },
                  "Fax": {
                    "type": ["string", "null"]
                  },
                  "Telefone": {
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "Endereco": {
                "additionalProperties": false,
                "properties": {
                  "Bairro": {
                    "type": ["string", "null"]
                  },
                  "Cep": {
                    "type": ["string", "null"]
                  },
                  "CodMunicipio": {
                    "type": ["string", "null"]
                  },
                  "CodPais": {
                    "default": 1058,
                    "type": "integer"
                  },
                  "Complemento": {
