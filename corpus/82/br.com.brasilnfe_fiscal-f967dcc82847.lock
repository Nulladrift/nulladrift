                  },
                  "Logradouro": {
                    "type": ["string", "null"]
                  },
                  "Municipio": {
                    "type": ["string", "null"]
                  },
                  "Numero": {
                    "type": ["string", "null"]
                  },
                  "Pais": {
                    "default": "BRASIL",
                    "type": ["string", "null"]
                  },
                  "Uf": {
                    "type": ["string", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "cnaePrincipal": {
                "type": ["string", "null"]
              },
              "cpfCnpj": {
                "type": ["string", "null"]
              },
              "dataInicioAtividade": {
                "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
                "type": ["string", "null"]
              },
              "dataOcorrenciaBaixa": {
                "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
                "type": ["string", "null"]
              },
              "dataUltimaAlteracaoCadastral": {
                "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
                "type": ["string", "null"]
              },
              "fonte": {
                "description": "Fonte dos dados: \"sefaz\" (Inscrição Estadual da SEFAZ estadual), \"receita\" (fallback na Receita Federal quando a UF não oferece a consulta ou o contribuinte não tem IE - comum em prestadores de serviço) ou \"indisponivel\".",
                "type": ["string", "null"]
              },
              "ie": {
                "type": ["string", "null"]
              },
              "ieAtual": {
                "type": ["string", "null"]
              },
              "ieUnica": {
                "type": ["string", "null"]
              },
              "indicadorCredenciamentoCTe": {
                "description": "Indicador de contribuinte credenciado a emitir CT-e. Valores: 0 - Não credenciado para emissão da CT-e;; 1 - Credenciado;; 2 - Credenciado com obrigatoriedade para todas operações;; 3 - Credenciado com obrigatoriedade parcial;; 4 - a SEFAZ não fornece a informação. Este indicador significa apenas que o contribuinte é credenciado para emitir CT-e na SEFAZ consultada.",
                "enum": [0, 1, 2, 3, 4],
                "type": "integer"
              },
              "indicadorCredenciamentoNFe": {
                "description": "Indicador de contribuinte credenciado a emitir NF-e. Valores: 0 - Não credenciado para emissão da NF-e;; 1 - Credenciado;; 2 - Credenciado com obrigatoriedade para todas operações;; 3 - Credenciado com obrigatoriedade parcial;; 4 - a SEFAZ não fornece a informação. Este indicador significa apenas que o contribuinte é credenciado para emitir NF-e na SEFAZ consultada.",
                "enum": [0, 1, 2, 3, 4],
                "type": "integer"
              },
              "mensagem": {
                "description": "Mensagem explicativa do resultado: por que a IE não veio, qual fonte foi usada, e o aviso de que vazio NÃO significa CNPJ inativo. Fica vazio quando a SEFAZ retornou a Inscrição Estadual normalmente.",
