        {
          "name": "evento_cancelar",
          "title": "Cancelar documento fiscal",
          "description": "Cancela um documento fiscal autorizado (NF-e, NFC-e, NFS-e, CT-e, MDF-e, DC-e, NFCom). Informe a chave de 44 dígitos e a justificativa (mínimo 15 caracteres). Para NFS-e use TipoDocumento=1 e informe NumeroNFSe ao invés de chave. Prazo SEFAZ NF-e: 24h após autorização (algumas UFs mais). NFCom: até 120h após o último dia do mês da autorização.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ChaveNF": {
                "description": "Chave de acesso de 44 dígitos da NF-e/NFC-e/CT-e/MDF-e/DC-e/NFCom a cancelar. Obrigatório quando TipoDocumento = 0 (documentos NFe-family). Para NFS-e (TipoDocumento = 1) use NumeroNFSe.",
                "type": "string"
              },
              "CodCancelamentoNFSe": {
                "default": 1,
                "description": "Código do motivo de cancelamento da NFS-e (Padrão 1) Valores: 1 - Erro na emissão; 2 - Serviço não prestado; 3 - Duplicidade da nota; 9 - Outros",
                "enum": [1, 2, 3, 9],
                "type": "integer"
              },
              "CpfCnpjRemetenteDCe": {
                "description": "CPF ou CNPJ do Usuário Emitente (Remetente) da DC-e original. Obrigatório no cancelamento de DC-e quando a nota não está cadastrada no sistema (caso esteja, o valor é lido da própria NotaFiscal).",
                "type": ["string", "null"]
              },
              "DataEvento": {
                "description": "Data do evento de cancelamento do documento (Caso não for enviado é considerada a data e hora atual)",
                "type": ["string", "null"]
              },
              "Justificativa": {
                "description": "Motivo do cancelamento. MÍNIMO 15 caracteres, MÁXIMO 1000. NÃO use texto genérico como \"cancelamento\" ou \"erro\" - descreva o motivo real (ex: \"Erro no valor unitário do produto X\"). Obrigatório para TipoDocumento = 0 (NFe-family).",
                "type": "string"
              },
              "NumeroNFSe": {
                "description": "Número da NFS-e a ser cancelada",
                "type": ["string", "null"]
              },
              "NumeroProtocolo": {
                "description": "Número do protocolo de autorização original do documento (obrigatório quando a nota foi emitida por OUTRO sistema externo). Se o documento foi emitido pelo próprio BrasilNFe, o protocolo é localizado automaticamente.",
                "type": ["string", "null"]
              },
              "NumeroSequencial": {
                "description": "Número sequencial do evento",
                "type": ["integer", "null"]
              },
              "TipoAmbiente": {
                "default": 1,
                "description": "Ambiente do documento original (DEVE bater com o ambiente onde a nota foi emitida). IMPORTANTE: passe explicitamente. Se a nota foi emitida em homologação (testes), use 2. Valores: 1 - Produção; 2 - Homologação",
                "enum": [1, 2],
                "type": "integer"
              },
              "TipoDocumento": {
                "description": "Tipo do documento fiscal a cancelar. Valores: 0 - NF-e, NFC-e, CT-e, MDF-e, DC-e, NFCom (usa ChaveNF de 44 dígitos); 1 - NFS-e (usa NumeroNFSe + CodCancelamentoNFSe + TipoAmbiente)",
                "enum": [0, 1],
                "type": "integer"
              }
            },
            "required": ["ChaveNF", "Justificativa", "TipoAmbiente", "TipoDocumento"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "Avisos": {
                "description": "Avisos não bloqueantes. Pode vir preenchida mesmo em emissão bem-sucedida.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "Base64File": {
                "description": "PDF do documento auxiliar do evento (ex.: Carta de Correcao) em Base64. Preenchido apenas quando o evento e autorizado e a nota existe na base. Nulo nos demais casos.",
                "type": ["string", "null"]
              },
              "Base64Xml": {
                "description": "XML do evento processado (procEventoNFe) em Base64. Preenchido quando o evento e autorizado (cStat 135) na Carta de Correcao da NF-e, na manifestacao do destinatario e no ECONF (NF-e e NFC-e). Nulo nos demais casos.",
                "type": ["string", "null"]
              },
              "CodStatusRespostaSefaz": {
                "type": "integer"
              },
              "DsAmbiente": {
                "type": ["string", "null"]
              },
              "DsEvento": {
                "type": ["string", "null"]
              },
              "DsMotivo": {
                "type": ["string", "null"]
              },
              "Error": {
                "description": "Mensagem de erro da operação. Vazia (\"\") quando foi bem-sucedida.",
                "type": ["string", "null"]
              },
              "NuProtocolo": {
                "type": ["string", "null"]
              },
              "NumeroSequencial": {
                "type": "integer"
              },
              "Status": {
                "description": "1 - Evento Processado; 2 - Aguardando processamento do evento; 3 - Ocorreu um erro ao processar o evento",
                "enum": [1, 2, 3],
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
