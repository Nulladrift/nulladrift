                        "type": ["string", "null"]
                      }
                    },
                    "required": ["Numero"],
                    "type": ["object", "null"]
                  },
                  "TipoAssinante": {
                    "description": "1 - Comercial; 2 - Industrial; 3 - Residencial/Pessoa física; 4 - Produtor rural; 5 - Órgão da administração pública estadual (Conv. ICMS 107/95); 6 - Prestador de telecomunicação responsável pelo ICMS da cessão de meios de rede (Conv. ICMS 17/13); 7 - Missões diplomáticas, repartições consulares e organismos internacionais (Conv. ICMS 158/94); 8 - Igrejas e templos; 99 - Outros",
                    "enum": [1, 2, 3, 4, 5, 6, 7, 8, 99],
