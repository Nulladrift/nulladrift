                "description": "Cessão de meios de rede entre operadoras (dispensa a fatura).",
                "type": "boolean"
              },
              "CodMunicipioFatoGerador": {
                "description": "Código IBGE do município do fato gerador. Quando não informado, usa o município da empresa.",
                "type": ["string", "null"]
              },
              "Codigo": {
                "description": "Código numérico da chave de acesso (até 7 dígitos). Quando não informado, usa o id interno da nota.",
                "type": ["integer", "null"]
              },
              "Cofaturamento": {
                "additionalProperties": false,
                "description": "NFCom da operadora local. Obrigatório quando TipoFaturamento = 2.",
