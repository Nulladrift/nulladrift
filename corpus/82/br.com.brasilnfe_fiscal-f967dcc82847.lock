        {
          "name": "nfe_previsualizar",
          "title": "Pré-visualizar DANFE",
          "description": "Gera o DANFE em PDF e o XML como pré-visualização, sem enviar para a SEFAZ. Envie a nota completa em 'notaFiscal' (mesmo formato de nfe_emitir) com TipoEnvio=1 e TipoArquivo=2 (PDF + XML juntos). O resultado abre num painel ao lado da conversa: chame de novo a cada alteração pedida pelo usuário (CFOP, itens, destinatário, valores) para o painel refletir a nota atual. Erros de validação voltam em 'Error'/'Avisos'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "Base64Xml": {
                "type": ["string", "null"]
              },
              "TipoArquivo": {
                "description": "Tipo do arquivo que deseja pré-visualizar (Padrão - 0) Valores: 0 - XML; 1 - PDF; 2 - PDF em Base64File e XML em Base64Xml na mesma chamada",
                "enum": [0, 1, 2],
                "type": "integer"
              },
              "TipoEnvio": {
                "description": "Tipo do envio no qual será convertido para o tipo do arquivo informado (Padrão - 0) Valores: 0 - Base64 contendo as informações do XML; 1 - Objeto contendo as informações das notas fiscais",
                "enum": [0, 1],
                "type": "integer"
              },
              "cte": {
