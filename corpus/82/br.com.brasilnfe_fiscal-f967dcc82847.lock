                "description": "Anexar todas as notas fiscais retornadas em um unico arquivo PDF",
                "type": "boolean"
              },
              "ModelosDocumento": {
                "description": "Filtra por modelo de documento. Vazio = todos (comportamento padrão). Combinável.",
