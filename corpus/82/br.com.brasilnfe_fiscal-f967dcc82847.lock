                        "description": "21 (comunicação) ou 22 (telecomunicação).",
                        "type": "integer"
                      },
                      "Numero": {
                        "type": "integer"
                      },
                      "Serie": {
                        "description": "Série com 3 caracteres (ex.: \"001\", \"SER\").",
                        "type": "string"
                      }
                    },
                    "required": ["Competencia", "Modelo", "Numero", "Serie"],
                    "type": ["object", "null"]
