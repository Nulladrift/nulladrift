                        "type": ["string", "null"]
                      },
                      "CodPais": {
                        "default": 1058,
                        "type": "integer"
                      },
                      "Complemento": {
                        "type": ["string", "null"]
                      },
                      "Logradouro": {
                        "type": ["string", "null"]
                      },
                      "Municipio": {
                        "type": ["string", "null"]
                      },
                      "Numero": {
                        "type": ["string", "null"]
                      },
                      "Pais": {
                        "default": "BRASIL",
                        "type": ["string", "null"]
                      },
                      "Uf": {
                        "type": ["string", "null"]
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "IE": {
                    "description": "Inscrição estadual do destinatário ou \"ISENTO\".",
                    "type": ["string", "null"]
                  },
                  "IM": {
                    "description": "Inscrição municipal.",
                    "type": ["string", "null"]
                  },
                  "IdEstrangeiro": {
                    "description": "Identificação de destinatário sem CPF/CNPJ (2 a 20 caracteres).",
                    "type": ["string", "null"]
                  },
                  "IndicadorIE": {
                    "description": "Indicador da IE. Quando não informado: 1 com IE numérica, 2 com \"ISENTO\" e 9 sem IE. Valores: 1 - Contribuinte ICMS; 2 - Contribuinte isento de inscrição (não aceito em AM, BA, CE, GO, MG, MS, MT, PE, RN, SE e SP); 9 - Não contribuinte",
                    "enum": [1, 2, 9, null],
                    "type": ["integer", "null"]
                  },
                  "Nome": {
                    "description": "Nome ou razão social.",
                    "type": "string"
                  }
                },
                "required": ["Nome"],
                "type": "object"
              },
              "Fatura": {
