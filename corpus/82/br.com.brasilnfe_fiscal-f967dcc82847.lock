                  "Codigo": {
                    "description": "Código único do assinante no seu sistema (até 30 caracteres).",
                    "type": "string"
                  },
                  "DataFimContrato": {
                    "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
                    "type": ["string", "null"]
                  },
                  "DataInicioContrato": {
                    "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
                    "type": ["string", "null"]
                  },
                  "NumeroContrato": {
                    "description": "Número do contrato. Obrigatório, com a data de início, fora do cofaturamento.",
                    "type": ["string", "null"]
                  },
                  "TerminaisAdicionais": {
                    "description": "Terminais adicionais do mesmo contrato, sem repetir número e na UF da empresa.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "CodMunicipio": {
                          "description": "Código IBGE do município do terminal principal (opcional). Em produção vai para a SEFAZ a partir de 16/11/2026 (NT 2026.004).",
                          "type": ["string", "null"]
                        },
                        "Numero": {
                          "description": "Número do terminal com DDD (7 a 12 dígitos).",
                          "type": "string"
                        },
                        "Uf": {
                          "description": "Sigla da UF de habilitação. Quando não informada, usa a UF da empresa.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["Numero"],
                      "type": "object"
                    },
                    "type": ["array", "null"]
                  },
                  "TerminalPrincipal": {
                    "additionalProperties": false,
                    "description": "Terminal principal do serviço (telefone com DDD, 7 a 12 dígitos), habilitado na UF da empresa.",
                    "properties": {
                      "CodMunicipio": {
                        "description": "Código IBGE do município do terminal principal (opcional). Em produção vai para a SEFAZ a partir de 16/11/2026 (NT 2026.004).",
