        {
          "name": "mdfe_encerrar",
          "title": "Encerrar MDF-e",
          "description": "Encerra um MDF-e já autorizado (evento tipo 3). Obrigatório ao final de cada transporte. Sem encerramento, novos MDF-e podem ser bloqueados pela SEFAZ.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chave": {
                "description": "Chave de acesso de 44 dígitos do MDF-e a encerrar.",
                "type": "string"
              },
              "codMunicipio": {
                "description": "Código IBGE (7 dígitos) do município onde o MDF-e foi encerrado. Se omitido, usa o último município de descarga do MDF-e (a sede da empresa, só quando o MDF-e não foi emitido por este sistema).",
                "type": ["integer", "null"]
              },
              "dataEncerramento": {
                "description": "Data do encerramento. Se omitida, usa a data do envio.",
                "type": ["string", "null"]
              },
              "numeroSequencial": {
                "description": "Número sequencial do evento. Se omitido, o sistema usa o próximo disponível.",
                "type": ["integer", "null"]
              },
              "protocolo": {
                "description": "Protocolo de autorização do MDF-e original. Opcional - se omitido, o sistema localiza pela chave.",
                "type": ["string", "null"]
              },
              "tipoAmbiente": {
                "default": 1,
                "description": "Ambiente do MDF-e original (DEVE bater com o ambiente onde o manifesto foi emitido). IMPORTANTE: passe explicitamente. ATENÇÃO: encerramento é DEFINITIVO - revise os dados antes. Valores: 1 - Produção; 2 - Homologação",
                "enum": [1, 2],
                "type": "integer"
              },
              "uf": {
                "description": "Sigla da UF de encerramento. Opcional: acompanha codMunicipio e, quando enviada, deve ser a UF desse município.",
                "type": ["string", "null"]
              }
