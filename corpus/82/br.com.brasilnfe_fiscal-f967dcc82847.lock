      "serverInfo": {
        "name": "BrasilNFe MCP",
        "title": "BrasilNFe - Emissão de documentos fiscais",
        "version": "1.0.0",
        "description": "Emissão e consulta de documentos fiscais brasileiros (NF-e, NFC-e, NFS-e, CT-e, MDF-e, DC-e) via API BrasilNFe."
      },
      "capabilities": {
        "completions": {},
        "extensions": {
          "io.modelcontextprotocol/tasks": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Servidor MCP da BrasilNFe para emissão e consulta de documentos fiscais brasileiros (NF-e, NFC-e, NFS-e, CT-e, MDF-e, DC-e). Autentique-se com o token de empresa via header 'Authorization: Bearer <token>' ou 'Token: <token>'. Antes de emitir, leia 'brasilnfe://empresa/atual' para confirmar emitente/regime. Use 'sefaz_status' antes de operações em massa para verificar a SEFAZ. Use 'tipoAmbiente: 2' (homologação) para testes - nunca em produção real. Pré-visualização: sempre que o usuário pedir uma nota ou alterar qualquer dado dela (CFOP, itens, destinatário, valores), chame 'nfe_previsualizar' com a nota completa - o painel ao lado da conversa mostra o DANFE e o XML atualizados. Nunca chame 'nfe_emitir' sem que o usuário tenha visto a pré-visualização final e confirmado explicitamente a emissão nesta conversa; só então envie confirmacaoUsuario=true. Há prompts prontos (prompts/list) para fluxos comuns: emitir_nfe_simples, cancelar_nota, diagnostico_emissao, relatorio_periodo, carta_correcao.",
      "tools": [
        {
