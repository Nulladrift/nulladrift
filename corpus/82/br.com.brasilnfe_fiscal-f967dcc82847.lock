                "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
                "type": "string"
              },
              "DtInicio": {
                "description": "Data/hora ISO 8601 (ex: 2026-07-22T13:45:00-03:00)",
