                  "TipoServico": {
                    "description": "1 - Telefonia; 2 - Comunicação de dados; 3 - TV por assinatura; 4 - Provimento de acesso à internet; 5 - Multimídia; 6 - Outros; 7 - Vários",
                    "enum": [1, 2, 3, 4, 5, 6, 7],
                    "type": "integer"
                  }
