        {
          "name": "find_local_ai_recipes",
          "title": "Find Local AI Recipes for Hardware",
          "description": "Recommend local-AI setups for a given hardware: platform + device count, optional goal (quality | balance | speed). Returns the editorial picks for that setup first (with the reason and the recipe's numbers), then all matching recipes by rank (category → value) or by AA intelligence. Every number has category, condition and source_url.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "Number of devices/GPUs (e.g. 1, 2, 4)",
                "type": "number"
              },
              "goal": {
                "description": "Optional: only picks for this goal",
                "enum": ["quality", "balance", "speed"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max recipes after the picks (default 20, max 100)",
                "examples": [5, 10, 20],
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "locale": {
                "default": "en",
                "description": "Page locale for returned URLs (default en)",
                "enum": ["en", "de", "fr", "it"],
                "examples": ["en", "de"],
                "type": "string"
              },
              "platform": {
                "description": "Hardware platform",
                "enum": ["dgx-spark", "mac", "strix-halo", "rtx-3090", "rtx-5090", "rtx-pro-6000"],
                "type": "string"
              },
              "sort": {
                "default": "rank",
                "enum": ["rank", "intelligence"],
                "type": "string"
              }
            },
            "required": ["count", "platform"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "description": "Number of returned records for list and search tools.",
