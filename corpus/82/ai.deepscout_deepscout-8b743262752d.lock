        {
          "name": "scout_get_job",
          "title": "Get the state of a job",
          "description": "Get the state of a job: status, estimate, approval, settlement, and error.\nPoll every 5 to 10 minutes until the status is COMPLETED, FAILED, or CANCELLED.\nThe time depends on the number of products, because DeepScout fetches the pages at\na rate that the e-shop accepts. The usual times, with the wait in the queue, are:\n- setup: from a few minutes to 3 hours.\n- scraping: 1 to 2 hours for a few thousand products, several hours for 20,000, and\n  up to 1 day for 100,000 or more.\n- matching: 1 hour for 1,000 products, 4 to 15 hours for 10,000, 1 to 2 days for 50,000.\n- EXPORTING, the last status: up to 1 hour.\nscrape_progress.percent and matching_progress.percent show the progress.\nmatching_progress.estimated_minutes_left shows the time left. In the queue and in\nsome phases, the progress does not change. A job without an error is not stuck:\ntell the user about a problem only if the job FAILED.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "job_kind": {
                "enum": ["setup", "scraping", "matching"],
                "type": "string"
              }
            },
            "required": ["job_id", "job_kind"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "items": {},
                    "type": "array"
                  }
                ]
