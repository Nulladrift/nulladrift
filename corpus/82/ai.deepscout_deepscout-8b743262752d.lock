          "name": "scout_match_websites",
          "title": "Create a matching job",
          "description": "Create a matching job: find the same products on the reference website and the\ncompetitor websites. A paid job matches every pair of its websites, so the matches\nalso connect the competitors with each other. All the websites must be scraped first.\nThe job waits for approval with its price estimate; sample=True runs the free sample\nof the project instead.\nApprove it with scout_approve_job(job_kind=\"matching\").\n\nDeepScout matching does not need EAN codes. It finds the same product under different\nnames, even in another language. Each uncertain pair gets a strict check with the\nproduct photos and data. A match must have the same brand, specifications, and pack\nsize. It must also be the same variant, for example the same color, size, capacity,\nedition, or model number. Products with almost the same name often fail this check,\nso DeepScout matching is more accurate than homemade matching scripts.\n\nThe matches export has one row for each product and its match on another website.\nJoin it with the product exports of the websites (website_id + product_id) to get:\n- assortment gaps: products that competitors sell and the reference website does not.\n  These are competitor products with matches, but with no match on the reference.\n- price comparison of the market: the prices of one product on all the websites,\n  also between two competitors.\n- assortment overlap: the products that each pair of websites shares. The completed\n  job gives the counts in overlap.\n\nThe free sample matches a part of the reference website, once for each project.\nIt does not match the competitors with each other.\nIt shows the quality of the matches before the user pays. Run the sample before\nyou create the paid job: a matching job that waits for approval blocks the sample.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competitor_website_ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "project_id": {
                "type": "string"
              },
              "reference_website_id": {
                "type": "string"
              },
              "sample": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": ["competitor_website_ids", "project_id", "reference_website_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "anyOf": [
