      "instructions": "DeepScout gives product data from any e-shop: names, prices, stock, images,\nand EAN codes, also behind anti-bot protection. It also finds the same products on\ndifferent e-shops.\nWhen the user has no websites yet, or asks what DeepScout can do, offer 2 or 3 first steps\nand ask which e-shop they care about:\n- export the product catalog of an e-shop,\n- compare the prices of a competitor with their own e-shop,\n- find the same products on several e-shops.\nNew accounts get €10 of credit. Two free samples show the data before the user pays:\n1. The analysis of a website is free within the free analyses of the month\n   (scout_get_balance shows how many are left). It includes a sample of real products\n   (scout_get_sample). While free analyses are left, a zero balance does not block it.\n2. Once for each project, a free matching sample (scout_match_websites with sample=True):\n   20% of the reference website,\n   up to 2,000 products, against the competitors in full,\n   after the websites are scraped.\nA full scrape and a paid matching charge the prepaid balance. The €10 credit of a new\naccount often covers the first full scrape of a smaller shop.\n\nDeepScout scrapes e-shops and matches their products across e-shops.\nA new website: scout_analyze_website -> scout_get_job(\"setup\") until COMPLETED\n-> scout_get_sample to check the data -> scout_scrape_website -> scout_approve_job\n-> scout_get_job(\"scraping\") until COMPLETED -> scout_list_exports -> scout_get_export.\nA scrape of given URLs ends with scout_get_url_results instead of scout_list_exports.\nMatching of scraped websites: scout_match_websites -> scout_approve_job\n-> scout_get_job(\"matching\") until COMPLETED -> scout_list_exports -> scout_get_export.\nThe matches connect all the websites of a matching, also the competitors with each other.\nUse them for assortment gaps (what competitors sell and the reference website does not),\nprice comparison of the market, and assortment overlap. scout_match_websites tells how.\nPut all the websites to compare in one project: a matching connects only the websites\nof one project.\nAn approval charges the prepaid balance: confirm the price with the user first.\nJobs take from minutes to many hours. scout_get_job gives the usual times.",
      "tools": [
        {
          "name": "scout_analyze_website",
          "title": "Add and analyze a website",
          "description": "Add a website to a project: analyze it and scrape a free sample of its products.\nEach customer has free analyses each month. After them, an analysis charges the\nprepaid balance when the job is created, without an approval. scout_get_balance\nshows the free analyses left and the price of one. If none are left, confirm the\nprice with the user before you call this tool.\nReturns the setup job; poll it with scout_get_job(job_kind=\"setup\") until it is\nCOMPLETED, then check the sample with scout_get_sample.\nA job that FAILED with the error_code CURRENCY_NOT_AVAILABLE found that the website\ndoes not offer the currency: no switch of the website shows its prices in it. The error\nof the job names the currency the website shows, when the analysis found it. The\nanalysis is used, also a paid one. Ask the user for a currency the website offers, then\nanalyze the website again.\nA project without localization gets the country and currency of this website.\n\ncountry: ISO 3166 code of the market to scrape, e.g. \"CZ\".\ncurrency: ISO 4217 code of the prices to scrape, e.g. \"CZK\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "project_id": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["country", "currency", "project_id", "url"],
            "type": "object"
          },
          "outputSchema": {
