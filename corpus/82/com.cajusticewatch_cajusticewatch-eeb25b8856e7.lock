            "properties": {
              "agency": {
                "description": "Police department or agency name",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
