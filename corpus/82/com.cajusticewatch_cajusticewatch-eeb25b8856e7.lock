          "name": "get_da",
          "description": "Get a full DA record by name (exact or close partial match).",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "DA name",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
