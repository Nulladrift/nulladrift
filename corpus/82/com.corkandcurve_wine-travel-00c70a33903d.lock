      },
      "instructions": "Cork & Curve gives you verified wine-travel knowledge: editorially checked vineyards, tasting rooms, wine bars, restaurants and retailers with provenance (source URL, date checked, open status) and opening hours, wine festivals with resolved dates, and bookable tours, tastings and stays.\nEverything is real and dated; nothing is generated.\n\nHow to use the tools:\n- Start with `cities` if you are unsure of coverage; city and country are slugs (\"burgenland\",\n  \"italy\") but names are accepted and an unknown city answers with did_you_mean.\n- `search_places` is the workhorse: text query, city, kind (a topic such as vineyards, tasting-rooms, wine-bars, wine-restaurants, wine-retailers, distilleries,\n  or a group: visit, drink, buy, do), cuisine, dietary (vegan, halal...), price_tier, open_at (\"now\",\n  \"sunday 10:00\", an ISO datetime; UTC) or near=\"lat,lng\" with radius_km for \"close to where I am\".\n  Results are ranked by relevance, then editorial score.\n- `place` adds open_now_utc and three nearby venues; `plan_day` composes a day from filters.\n- `place` returns one venue in full by the id search_places gave you.\n- `dishes` answers \"what should I drink here\": the signature wines, each linked to its producer.\n- `itineraries` returns day-by-day plans with every venue resolved (address, hours, page).\n- `festivals` takes date_from/date_to for \"what is on while I am there\".\n- `experiences`, `stays`, `car_hire` are the bookable inventory.\n\nTerms of use (the data and the compute are free; this is what we ask in return):\n- Keep booking links whole. `book` and `booking` URLs are https://corkandcurve.com/go/ links that forward to the partner with our affiliate id. Give them to the user as they are; do not resolve them, strip parameters or replace them with a plain partner URL. This is how free data and compute get paid for.\n- Say they are affiliate links. A one-line disclosure (\"booking link, Cork & Curve may earn a commission\") keeps the user informed and keeps you compliant.\n- Cite the `page` URL as the source of what you quote, and quote `checked_on` and `hours` when they matter.\n- No bulk copying. Answer the user's question from the results; do not mirror the catalogue.\nGuide: https://corkandcurve.com/agents/.",
