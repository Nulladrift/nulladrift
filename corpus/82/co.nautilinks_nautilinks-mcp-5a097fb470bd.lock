      "tools": [
        {
          "name": "about",
          "title": "About Nautilinks",
          "description": "Use this when the user asks what Nautilinks does, how its backlink buying service works, or how an AI agent can use it. Explains the French owned backlink network sold direct, with no reseller, how a purchase flows (prepaid balance or human Stripe checkout -> article drafted & published), the three price shelves (Plancton 5 EUR, Corail 15 EUR, Nautilus 30 EUR), and how authentication works. Call this first if you're not sure what this service does.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7628ffe062ebbbf6326359500dc45fa704090aa96d68f33eb6f71e9004799ab1"
        },
        {
          "name": "check_balance",
          "title": "Check the prepaid balance",
          "description": "Use this before create_order to return the prepaid balance available to this API key. create_order applies this balance after discounts: full coverage settles immediately, partial coverage reduces the human-approved Stripe remainder. Requires a Nautilinks API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4420c9b8ccd52795a1ca01ff50eeb459e7d7de65e49adf61ba01a992e1f52ecb"
        },
        {
          "name": "create_order",
          "title": "Order backlinks",
          "description": "Use this only when the user has selected placements and wants to place a backlink order. This can spend the account's prepaid balance immediately. Place an order for 1 to 20 backlinks across catalog sites. Each item can request a new dedicated article or an existing-article insertion, 0/1/3/5 tier-2 links, and an optional project tag, alongside target URL, anchor and brief. Use list_site_articles first to obtain article_id for an insertion. The better of the optional promo and welcome offer is applied, then prepaid credit. Full credit settles immediately; partial credit is held and Stripe charges only the remainder through a payment_url that a human has to open and pay before anything is fulfilled; surface that link and the total to your user and never imply the purchase is complete. Call check_balance first if you want to know which way it will go. A card is never charged without a human completing the checkout. Requires a Nautilinks API key with the 'order' scope.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "idempotency_key": {
                "description": "Stable retry key. Reuse it after a timeout to get the same quote/session; a different body with the same key is rejected.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "items": {
                "description": "1 to 20 line items, one per backlink to purchase.",
                "items": {
                  "properties": {
                    "anchor_text": {
                      "description": "The anchor text for the link.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "anchor_type": {
                      "description": "Optional anchor type hint: 'exact', 'partial', 'branded', 'generic' or 'naked'.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "article_id": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "description": "Required when format=lien_insere; obtain it from list_site_articles."
                    },
                    "content_brief": {
                      "description": "Optional brief/instructions for the article that will host the link.",
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "format": {
                      "description": "Placement format. Omit or use article_unitaire for a new dedicated article; use lien_insere to insert into an existing article.",
                      "enum": ["article_unitaire", "lien_insere"],
                      "type": "string"
                    },
                    "project_id": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "description": "Optional AI-visibility project id owned by this account."
                    },
                    "site_id": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "description": "The catalog site id to place the link on (from search_sites/get_site)."
                    },
                    "target_url": {
                      "description": "The URL on the advertiser's own site that the backlink should point to.",
                      "format": "uri",
                      "type": "string"
                    },
                    "tier2_pack_size": {
                      "anyOf": [
                        {
                          "const": 0,
                          "type": "number"
                        },
                        {
                          "const": 1,
                          "type": "number"
                        },
                        {
                          "const": 3,
                          "type": "number"
                        },
                        {
                          "const": 5,
                          "type": "number"
                        }
                      ],
                      "description": "Optional number of tier-2 links pointing to this backlink (0, 1, 3 or 5; default 0)."
                    }
                  },
                  "required": ["anchor_text", "site_id", "target_url"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "promo_code": {
                "description": "Optional promotion or affiliate code. The API automatically compares it with the welcome offer and applies the better discount.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "sandbox_credit_cents": {
                "description": "Sandbox keys only: simulated prepaid balance, in cents, for testing full-credit, mixed, and card-only outcomes.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:585385de43297e19251dd015b5c74c1aec56463ed0eed888005a0fa881b45f8d"
        },
        {
          "name": "get_ai_visibility_plan",
          "title": "Build order-ready items from an AI-visibility project",
          "description": "Turn the latest uncited fan-out opportunities of one owned AI-visibility project into configured backlink items. This is read-only: it creates no cart, quote, charge or order. Review the returned items, then pass them to create_order to purchase them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "project_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "AI-visibility project id. The returned items can be passed directly to create_order."
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:600b6ec49883cfd36117aa235b8eadfbb75195eea7968050fabeab97e044b617"
        },
        {
          "name": "get_order_status",
          "title": "Get per-link status for one order",
          "description": "Use this when the user wants publication progress or the live URL for a specific order. Fetch the status of each backlink item as it moves through the fulfillment pipeline (to_assign -> assigned -> drafted -> in_review -> approved -> published -> verified), along with its anchor_text, target_url, and published_url once live. Requires a Nautilinks API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "order_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "The order id, e.g. from list_orders or from a paid quote's get_quote_status result."
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57d35b61aee96ebdb5bd807335e10ae359cb9da3ec9461fa068171e57fc82bfa"
        },
        {
          "name": "get_quote_status",
          "title": "Check whether a quote has been paid",
          "description": "Use this after create_order returned a payment_url to check whether the user completed payment. Check whether the quote has been paid and get the resulting order_id once it has been converted to an order. Poll this after handing the payment_url to your user. Requires a Nautilinks API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "quote_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "The quote_id returned by create_order."
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7a48d60bfbab3e4c47aa059dbd5df65da448fd13f8437d9e0fdbdc4ec97047f"
        },
        {
          "name": "get_site",
          "title": "Get full details for one catalog site",
          "description": "Use this after search_sites when the user needs to evaluate one backlink placement before buying. Fetch the full catalog record for a single site by id: domain, niche, authority metrics, traffic, ranked keywords, price per link, price shelf, and any other published attributes. Requires a Nautilinks API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "site_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "The catalog site id, as returned by search_sites."
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea1a83e9233f6f605a00af0f0b251b97bcbc986d1eca364666d7b2fa0e7d3da7"
        },
        {
          "name": "list_ai_visibility_projects",
          "title": "List AI-visibility projects",
          "description": "List the AI-visibility projects owned by this account. Use a returned project id with get_ai_visibility_plan to build order-ready backlink items.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53bf60216ba75b21fc8e3264dd0f0bc2ece831f27de24dd9a81f3e4401420532"
        },
        {
          "name": "list_orders",
          "title": "List past orders",
          "description": "Use this when the user wants their Nautilinks order history or needs to find an order id. List orders placed with this API key, including overall status and totals. Use get_order_status on a specific order id for per-link detail. Requires a Nautilinks API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d21d615a11797f874a40ea39a043a2bdc4b7819cb2b4c7ca182799460e6da10c"
        },
        {
          "name": "list_site_articles",
          "title": "List existing articles available for insertion",
          "description": "List sold-once existing articles available on one catalog site. Returns article_id plus ranking queries, positions and impressions so you can choose a page, then pass that article_id to create_order with format=lien_insere. Requires a Nautilinks API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum articles to return (default 50, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "site_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "The catalog site id whose available existing articles should be listed."
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5923eece1fbb88c436dc9a46d1b29c9033f5cc09395d18b0e2f520839f7bf47"
        },
        {
          "name": "search_sites",
          "title": "Search the Nautilinks backlink catalog",
          "description": "Use this when the user wants to find or compare websites where they can buy backlinks. Search the Nautilinks catalog by niche, language, minimum Trust Flow, maximum price per link, price shelf (Plancton 5 EUR / Corail 15 EUR / Nautilus 30 EUR), or run a free-text query. Returns domain, niche, authority metrics (TF/CF/RD/Moz DA), monthly traffic, ranked keywords, price per link and shelf for each match, plus each site's id (needed for get_site and create_order). Requires a Nautilinks API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Filter by site language code (e.g. 'fr', 'en', 'de').",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (default 20, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_eur": {
                "description": "Maximum price per link, in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "min_tf": {
                "description": "Minimum Majestic Trust Flow.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "niche": {
                "description": "Filter by niche/thematic label (e.g. 'finance', 'sante', 'voyage').",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "description": "Pagination offset (default 0). Use with the total count returned to page through results.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search across domain and niche label.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "shelf": {
                "description": "Filter by price shelf: 'Plancton' (5 EUR, entry-level sites), 'Corail' (15 EUR, established sites with a real audience and a worked link profile), or 'Nautilus' (30 EUR, the network's strongest sites by traffic, age and link profile density). Omit to search across all three shelves.",
                "enum": ["Plancton", "Corail", "Nautilus"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71c9d640150776e3747c3b7c0cc947dad65018ac3c3db47c43a6a6a8f456e2e6"
        }
      ],
