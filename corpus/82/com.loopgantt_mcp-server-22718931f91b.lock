        {
          "name": "get_changes",
          "description": "What changed in the connected LoopGantt ACCOUNT (requires a LoopGantt API key) since an instant: tasks created, tasks now done and tasks otherwise updated. Built for agents that poll: the first time pass since (e.g. when you last looked); after that pass back BOTH the since and the cursor the previous reply gave you. The cursor resumes exactly after the last task reported, so no task is reported twice and none written in the same millisecond is skipped. Deleted tasks are not reported.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Only tasks this bot owns (its exact agentLabel, e.g. \"qa-bot\"), or 'none' for tasks no bot owns",
                "type": "string"
              },
              "cursor": {
                "description": "The cursor the previous get_changes reply gave you (keep its since too)",
                "type": "string"
              },
              "projectId": {
                "description": "Limit to one project",
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 instant, e.g. 2026-11-03T09:00:00Z",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:32c7470f03ca0d2a8336842e73b343a1a42ee8c7864de8779b5fe1402b43d9ed"
        },
        {
          "name": "get_template",
