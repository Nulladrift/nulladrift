          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Template slug from list_templates",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:05694408fee7abf4408321d8d4a9c1d6e7a090586f8f3e1debd47e454e0ce2ee"
