      },
      "instructions": "LoopGantt turns a task list into a scheduled Gantt chart (critical-path engine, working-day calendar). No account or API key is needed. create_gantt stores a chart and returns a picture, the dates, the critical path and a link; the link is the ONLY handle to the chart and expires (7 days, 30 once opened, forever once saved to a free account), so always show it to the user. Use schedule_project for what-if questions (nothing is stored) and list_templates / get_template for industry starting points. Durations are working days; duration 0 = milestone; dependencies are the 0-based positions of EARLIER tasks (or { task, type: FS|SS|FF|SF, lag }); group tasks under top-level phases with isPhase: true + parent (the phase position); chain only true prerequisites - independent tasks run in parallel. Ask the user for the start date and any deadline before creating (start defaults to today); pass deadline so the chart shows it. When it would change the plan, also ask (max 2-3 questions, one message): solo or team (drives parallelism), working days (workDays; do not assume Mon-Fri), vacations (holidays). A task with a due date (essay due Oct 15, exam on Nov 3, launch day) takes deadline: YYYY-MM-DD - a marker that never moves the schedule; the reply reports each task fit (buffer or days late). Use create_gantt when the user wants a chart they can open, export or save; use schedule_project only for what-if date math where nothing should be stored. With a LoopGantt API key the account tools run a real project as a team board: create_task (parentId, dependencies, assigneeId), list_tasks with status / assignee / due filters, update_task and complete_task, add_comment and list_comments for notes and handoffs, get_changes(since) to poll cheaply, list_overdue and list_due_soon, create_meeting and list_meetings, and link_external / list_links / find_by_link to tie tasks to PRs, issues and docs in other apps. For a team of agents: create_project with workflow: \"agent_board\" (stages todo, in_progress, blocked, waiting_approval, done), claim a task for your bot with agentLabel and filter with agent; use one of the project stage ids from list_projects as a status - other values are stored as sent but the board shows them in its first column, and the reply warns you. delete_task needs confirm: true - ask the user first. Every id comes from a previous reply; never invent one.",
      "tools": [
        {
          "name": "add_comment",
          "description": "Leave a comment on a task in the connected LoopGantt ACCOUNT (requires a LoopGantt API key) — notes, handoffs between agents, questions for a person. It shows in the task timeline, notifies the task watchers and @-mentioned people, and fires the comment.posted webhook.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The comment text (up to 10 000 characters)",
                "type": "string"
              },
              "parentId": {
                "description": "Reply to this top-level comment id (from list_comments)",
                "type": "string"
              },
              "taskId": {
                "description": "Task id from list_tasks",
                "type": "string"
              }
            },
            "required": ["content", "taskId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c28fbc41c26bf92843d33a0d7731a7f07de06f699b02c998c9699a70c3612510"
        },
        {
          "name": "complete_task",
          "description": "Mark one task done in the connected LoopGantt ACCOUNT (requires a LoopGantt API key). LoopGantt treats done as status AND 100 % together, so this sets both through the same rule the app uses - never set progress to 100 by hand with update_task and hope the status follows.",
          "inputSchema": {
            "properties": {
              "taskId": {
                "description": "Task id from list_tasks",
                "type": "string"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d53453e14f34a77e034068e51c48749200356de2b50d95287316cbbfc7d0d0f"
        },
        {
          "name": "create_gantt",
          "description": "Create a Gantt chart from a task list — no account or API key needed. YOU author the plan: list the tasks in execution order with realistic working-day durations and dependencies (0-based positions of earlier tasks; use { task, type, lag } for start-to-start/finish-to-finish links or lag). Milestones have duration 0. Only add a dependency where a task truly needs another one finished - independent tasks should run in PARALLEL (share a predecessor, or take no dependencies at all and start at the project start). Group tasks into top-level phases for a structured plan/WBS: the phase task gets isPhase: true, its tasks get parent = the position of the phase. LoopGantt schedules it with its critical-path engine and returns a picture of the chart, the dates, the critical path and a link where the user can view, export (PNG/PDF) and save the chart. Always show the user the link. Tasks with a due date take deadline: YYYY-MM-DD (a marker - the reply reports the fit). Use create_gantt when the user wants a chart to open, export or save; use schedule_project instead for what-if date math where nothing should be stored.",
          "inputSchema": {
            "properties": {
              "deadline": {
                "description": "Optional deadline YYYY-MM-DD - drawn on the chart; compare with the returned projectEndDate and warn the user if the plan overshoots",
                "type": "string"
              },
              "description": {
                "description": "Optional one-line description",
                "type": "string"
              },
              "holidays": {
                "description": "Non-working dates, YYYY-MM-DD",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Project name",
                "type": "string"
              },
              "startDate": {
                "description": "YYYY-MM-DD (defaults to today)",
                "type": "string"
              },
              "tasks": {
                "items": {
                  "properties": {
                    "deadline": {
                      "description": "Finish-by date YYYY-MM-DD for a task with a due date (essay due, exam day, launch). A MARKER: the task is still scheduled normally and the reply reports its fit - buffer or days late.",
                      "type": "string"
                    },
                    "dependencies": {
                      "description": "Predecessors: positions (0-based) of EARLIER tasks in this list, or objects { task, type: FS|SS|FF|SF, lag } for typed links / lag in days",
                      "items": {
                        "oneOf": [
                          {
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "properties": {
                              "lag": {
                                "type": "integer"
                              },
                              "task": {
                                "minimum": 0,
                                "type": "integer"
                              },
                              "type": {
                                "enum": ["FS", "SS", "FF", "SF"],
                                "type": "string"
                              }
                            },
                            "required": ["task"],
                            "type": "object"
                          }
                        ]
                      },
                      "type": "array"
                    },
                    "description": {
                      "type": "string"
                    },
                    "duration": {
                      "description": "Working days (default 1). 0 makes the task a milestone.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "isMilestone": {
                      "description": "Milestone (zero duration, drawn as a diamond)",
                      "type": "boolean"
                    },
                    "isPhase": {
                      "description": "Top-level phase (a group). Tasks join it with parent = this position. Phases take no dependencies and no parent; their dates become the envelope of their tasks.",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "Task name",
                      "type": "string"
                    },
                    "parent": {
                      "description": "Position (0-based) of an EARLIER task with isPhase=true that this task belongs to",
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 300,
                "minItems": 1,
                "type": "array"
              },
              "workDays": {
                "description": "Working weekdays as ISO numbers 1 (Mon) … 7 (Sun). Default Mon–Fri.",
                "items": {
                  "maximum": 7,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["name", "tasks"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd4513051c3abc228d1e5d7f1c8e796ccfd68bb05960bbb22a2d68edac86730c"
        },
        {
          "name": "create_meeting",
          "description": "Book a meeting in the connected LoopGantt ACCOUNT (requires a LoopGantt API key); the key owner is the organizer. Every invitee gets a calendar invitation (.ics, works with Apple, Google, Outlook and any other calendar); members with Google or Outlook sync get it straight in that calendar. Link it to a project (and a task) so the team sees it there. videoProvider picks the call: google_meet, teams or zoom only when the account has that connection, custom = the link you put in location, none = no call.",
          "inputSchema": {
            "properties": {
              "endsAt": {
                "description": "ISO 8601 instant after startsAt",
                "type": "string"
              },
              "guestEmails": {
                "description": "Outside guests by email (needs a paid plan)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "location": {
                "description": "Room, address, or the call link for custom",
                "type": "string"
              },
              "memberIds": {
                "description": "User ids of project members to invite",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "type": "string"
              },
              "projectId": {
                "description": "Project id from list_projects",
                "type": "string"
              },
              "startsAt": {
                "description": "ISO 8601 instant, e.g. 2026-11-04T15:00:00Z",
                "type": "string"
              },
              "taskId": {
                "description": "Task of that project the meeting is about",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "tz": {
                "description": "IANA time zone of the organizer, e.g. America/Lima",
                "type": "string"
              },
              "videoProvider": {
                "description": "Omit for the organizer's default",
                "enum": ["none", "google_meet", "teams", "zoom", "custom"],
                "type": "string"
              }
            },
            "required": ["endsAt", "startsAt", "title", "tz"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b457619bf1f879c9bb8c49baee50cb1311040c9df8d58c3ce70845062f4fea8b"
        },
        {
          "name": "create_project",
          "description": "Create a project in the connected LoopGantt ACCOUNT (requires a LoopGantt API key). For a keyless chart use create_gantt instead. Pass workflow: \"agent_board\" for a board a team of agents works on - stages todo, in_progress, blocked, waiting_approval, done (done is the finished stage).",
          "inputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "startDate": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "tasks": {
                "items": {
                  "properties": {
                    "dependencies": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "description": {
                      "type": "string"
                    },
                    "duration": {
                      "type": "number"
                    },
                    "isMilestone": {
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "workflow": {
                "description": "Board columns preset. agent_board = todo, in_progress, blocked, waiting_approval, done. Omit for the default stages (not_started, in_progress, on_hold, completed).",
                "enum": ["agent_board"],
                "type": "string"
              }
            },
            "required": ["name", "tasks"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b49d8c2bc3f3e6dffaaeb50b03a821aef93a18f9a4c8485a5a706a3a6a19814"
        },
        {
          "name": "create_task",
          "description": "Add one task to an existing project in the connected LoopGantt ACCOUNT (requires a LoopGantt API key). Put it under a phase with parentId, make it wait for other tasks with dependencies, and hand it to a person with assigneeId or to a bot with agentLabel (e.g. \"qa-bot\"). Returns the new task id.",
          "inputSchema": {
            "properties": {
              "agentLabel": {
                "description": "The bot (agent) that owns this task, e.g. \"qa-bot\" (1-64 characters) - so a team of agents can split one board. Use your own stable name. assigneeId is for a real PERSON; leave it alone unless a human should own the task.",
                "type": ["string", "null"]
              },
              "assigneeId": {
                "description": "User id of the project owner or an accepted member (a real person)",
                "type": "string"
              },
              "deadline": {
                "description": "Finish-by date YYYY-MM-DD (a marker, not a constraint)",
                "type": "string"
              },
              "dependencies": {
                "description": "Tasks (same project, not phases) this one waits for",
                "items": {
                  "properties": {
                    "lagDays": {
                      "description": "Working days of lag (negative = lead)",
                      "type": "integer"
                    },
                    "predecessorId": {
                      "description": "Task id",
                      "type": "string"
                    },
                    "type": {
                      "description": "FS (default): starts after the predecessor finishes",
                      "enum": ["FS", "SS", "FF", "SF"],
                      "type": "string"
                    }
                  },
                  "required": ["predecessorId"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "description": {
                "type": "string"
              },
              "durationDays": {
                "description": "Working days; 0 makes it a milestone",
                "minimum": 0,
                "type": "number"
              },
              "isMilestone": {
                "type": "boolean"
              },
              "isPhase": {
                "description": "Make it a phase that groups other tasks",
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "parentId": {
                "description": "Phase task id to put this task under",
                "type": "string"
              },
              "plannedEnd": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "plannedStart": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "priority": {
                "enum": ["low", "medium", "high", "critical"],
                "type": "string"
              },
              "projectId": {
                "description": "Project id from list_projects",
                "type": "string"
              },
              "status": {
                "description": "Workflow stage id - use one of the project's stage ids (list_projects shows each project's stages; any other value is stored as sent, shown in the board's first column, and warned about), e.g. not_started, in_progress, on_hold, completed, or todo, in_progress, blocked, waiting_approval, done on an agent board. Prefer complete_task for 'done'. Default: the first stage.",
                "type": "string"
              }
            },
            "required": ["name", "projectId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36df3565cbcc4ffdcaefe2e3b93d3832741048422d3f90531f42fc3abb2561a5"
        },
        {
          "name": "delete_task",
          "description": "Delete one task in the connected LoopGantt ACCOUNT (requires a LoopGantt API key) - and every task under it when it is a phase. DESTRUCTIVE: ask the user before calling, and pass confirm: true only after they agreed; without it nothing is deleted. The task goes to the project trash (restorable in the app for 30 days).",
          "inputSchema": {
            "properties": {
              "confirm": {
                "const": true,
                "description": "Must be true: the user has confirmed this deletion",
                "type": "boolean"
              },
              "taskId": {
                "description": "Task id from list_tasks",
                "type": "string"
              }
            },
            "required": ["confirm", "taskId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be87ecf83237677ee2dd0497bfd192db5dbe44c3a5975ab8189db18efe3d11eb"
        },
        {
