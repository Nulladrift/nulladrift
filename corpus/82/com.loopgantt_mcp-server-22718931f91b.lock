        {
          "name": "schedule_project",
          "description": "Compute a schedule without storing anything: dates, critical path, float and project end for a task list (same input shape as create_gantt; name optional). Use it to answer \"what is the critical path?\", \"when would this finish?\", \"how much slack does X have?\". Use create_gantt when the user wants a chart they can open.",
          "inputSchema": {
            "properties": {
              "deadline": {
                "description": "Optional deadline YYYY-MM-DD - drawn on the chart; compare with the returned projectEndDate and warn the user if the plan overshoots",
                "type": "string"
              },
              "description": {
                "description": "Optional one-line description",
                "type": "string"
              },
              "holidays": {
                "description": "Non-working dates, YYYY-MM-DD",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Project name",
                "type": "string"
              },
              "startDate": {
                "description": "YYYY-MM-DD (defaults to today)",
                "type": "string"
              },
              "tasks": {
                "items": {
                  "properties": {
                    "deadline": {
                      "description": "Finish-by date YYYY-MM-DD for a task with a due date (essay due, exam day, launch). A MARKER: the task is still scheduled normally and the reply reports its fit - buffer or days late.",
                      "type": "string"
                    },
                    "dependencies": {
                      "description": "Predecessors: positions (0-based) of EARLIER tasks in this list, or objects { task, type: FS|SS|FF|SF, lag } for typed links / lag in days",
                      "items": {
                        "oneOf": [
                          {
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "properties": {
                              "lag": {
                                "type": "integer"
                              },
                              "task": {
                                "minimum": 0,
                                "type": "integer"
                              },
                              "type": {
                                "enum": ["FS", "SS", "FF", "SF"],
                                "type": "string"
                              }
                            },
                            "required": ["task"],
                            "type": "object"
                          }
                        ]
                      },
                      "type": "array"
                    },
                    "description": {
                      "type": "string"
                    },
                    "duration": {
                      "description": "Working days (default 1). 0 makes the task a milestone.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "isMilestone": {
                      "description": "Milestone (zero duration, drawn as a diamond)",
                      "type": "boolean"
                    },
                    "isPhase": {
                      "description": "Top-level phase (a group). Tasks join it with parent = this position. Phases take no dependencies and no parent; their dates become the envelope of their tasks.",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "Task name",
                      "type": "string"
                    },
                    "parent": {
                      "description": "Position (0-based) of an EARLIER task with isPhase=true that this task belongs to",
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 300,
                "minItems": 1,
                "type": "array"
              },
              "workDays": {
                "description": "Working weekdays as ISO numbers 1 (Mon) … 7 (Sun). Default Mon–Fri.",
                "items": {
                  "maximum": 7,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["tasks"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:63e9b7482ffd4bc66c4e16466c9312d786803b95641917e9f752ede7728b93ef"
        },
        {
          "name": "update_task",
          "description": "Change one task in the connected LoopGantt ACCOUNT (requires a LoopGantt API key). Pass the taskId from list_tasks and only the fields to change. To mark a task done use complete_task — LoopGantt couples status and progress, and complete_task says exactly that. Set agentLabel to claim a task for a bot (null releases it); assigneeId is for a real person.",
          "inputSchema": {
            "properties": {
              "agentLabel": {
                "description": "The bot (agent) that owns this task, e.g. \"qa-bot\" (1-64 characters) - so a team of agents can split one board. Use your own stable name. assigneeId is for a real PERSON; leave it alone unless a human should own the task.",
                "type": ["string", "null"]
              },
              "assigneeId": {
                "description": "Assign to this user id (the project owner or an accepted member), or null to unassign",
                "type": ["string", "null"]
              },
              "deadline": {
                "description": "Finish-by date YYYY-MM-DD (a marker, not a constraint)",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "durationDays": {
                "description": "Working days; 0 makes it a milestone",
                "minimum": 0,
                "type": "number"
              },
              "isMilestone": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "plannedEnd": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "plannedStart": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "priority": {
                "enum": ["low", "medium", "high", "critical"],
                "type": "string"
              },
              "progress": {
                "description": "Percent complete",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "Workflow stage id - use one of the project's stage ids (list_projects shows each project's stages; any other value is stored as sent, shown in the board's first column, and warned about), e.g. not_started, in_progress, on_hold, completed, or todo, in_progress, blocked, waiting_approval, done on an agent board. Prefer complete_task for 'done'.",
                "type": "string"
              },
              "taskId": {
                "description": "Task id from list_tasks",
                "type": "string"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7138cbdb9204bd10a0cd3b656e2b45e1bbe3508ebee7b7adec3957c9ac53b215"
        }
