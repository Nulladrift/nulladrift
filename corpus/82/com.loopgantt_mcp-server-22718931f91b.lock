        {
          "name": "list_tasks",
          "description": "List tasks in the connected LoopGantt ACCOUNT (requires a LoopGantt API key), across every project the account can reach, most recently changed first. Use it to answer \"what am I working on\", to find a task before changing it, or to catch up on what moved: pass updatedSince (ISO timestamp) for \"since I last looked\". Each row carries the task id that update_task and complete_task take.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Only tasks this bot owns (its exact agentLabel, e.g. \"qa-bot\"), or 'none' for tasks no bot owns",
                "type": "string"
              },
              "assigneeId": {
                "description": "Only tasks assigned to this user id, or 'none' for unassigned tasks",
                "type": "string"
              },
              "cursor": {
                "description": "Next page: the opaque cursor a previous list_tasks reply gave you. Keep every other filter the same. Do not construct one.",
                "type": "string"
              },
              "dueAfter": {
                "description": "Only tasks scheduled to end on or after this date (YYYY-MM-DD)",
                "type": "string"
              },
              "dueBefore": {
                "description": "Only tasks scheduled to end on or before this date (YYYY-MM-DD)",
                "type": "string"
              },
              "limit": {
                "description": "How many tasks to return (default 50, capped at 200)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "openOnly": {
                "description": "Leave out tasks that are done",
                "type": "boolean"
              },
              "order": {
                "description": "Newest change first (default) or oldest first",
                "enum": ["updated_at.desc", "updated_at.asc"],
                "type": "string"
              },
              "projectId": {
                "description": "Limit to one project (id from list_projects)",
                "type": "string"
              },
              "status": {
                "description": "Only these workflow stage ids, e.g. [\"in_progress\", \"on_hold\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "updatedSince": {
                "description": "Only tasks changed at or after this ISO 8601 instant, e.g. 2026-09-01T00:00:00Z",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
