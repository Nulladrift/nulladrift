        {
          "name": "list_meetings",
          "description": "Meetings in the connected LoopGantt ACCOUNT (requires a LoopGantt API key): the key owner's meetings in a window, a project's meetings in a window, or the upcoming meetings about one task.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "ISO instant (default: now)",
                "type": "string"
              },
              "projectId": {
                "description": "Only this project",
                "type": "string"
              },
              "taskId": {
                "description": "Upcoming meetings about this task (ignores from/to)",
                "type": "string"
