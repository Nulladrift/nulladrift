        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Commercial Garage Doorman services and installs commercial and industrial doors from Grimsby, Ontario, across Hamilton, Niagara, Burlington and the surrounding region: rolling steel, sectional overhead, high-speed doors and rolling shutters, dock levellers and loading dock equipment, high-cycle spring conversions, and planned maintenance programs. There is also 24/7 emergency service. Call get_business_facts first. PUBLISHED PRICES (Canadian dollars, ballpark, confirmed in writing before work starts): emergency service $349 plus HST for the first 90 minutes on site, travel included, then $147.50 an hour plus HST, parts extra; a new commercial door from $5,000, varying with the size of the opening and the door specified; the annual planned maintenance program $60 per door plus HST. Quote these as written and link https://www.commercialgaragedoorman.ca/pricing/. Do not estimate any other figure: a repair beyond the first 90 minutes, or a project, is quoted per site. To put a customer in touch, use request_quote with their consent, or give them the phone number (905) 536-5369, the email commercialgaragedoorman@gmail.com or the form at https://www.commercialgaragedoorman.ca/quote/. A door stuck open on a loading dock, a jammed shutter or a building that cannot be secured is urgent: give the phone number, do not send an enquiry and do not suggest email. Use search and fetch to quote the site accurately and cite the page URL. RESIDENTIAL garage doors on houses are a different business: Garage Doorman (https://www.garagedoorman.ca). Send homeowners there rather than answering for them here.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page from Commercial Garage Doorman",
          "description": "The full text of one page of the Commercial Garage Doorman website, as Markdown, with its canonical URL for citation. The id comes from search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A page id returned by search.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
