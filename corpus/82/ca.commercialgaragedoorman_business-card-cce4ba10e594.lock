          },
          "digest": "sha256:958a6b86c3eae7eb347117bbd5d61b25305084f687b573ceb6eda3924da1c90f"
        },
        {
          "name": "request_quote",
          "title": "Ask Commercial Garage Doorman for a quote or a callback",
          "description": "Ask Commercial Garage Doorman to contact a facility manager, property manager, contractor or business owner about commercial or industrial doors: a repair, doors for a new building, a replacement, a maintenance program or dock equipment. Not for houses, and not for a door that is stuck open right now: that is a phone call. This sends a REAL message to a real small business, so call it only when the person has clearly asked to be contacted by Commercial Garage Doorman and has given you their own name and their own phone number or email. Never guess or invent contact details. Plain words only, no links. One request per person per day. If it is urgent, give them the phone number instead: (905) 536-5369.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent_to_contact": {
                "description": "Must be true: the customer has asked to be contacted by this business about this request.",
                "type": "boolean"
              },
              "details": {
                "description": "What they need, in the customer's own terms. Plain text, no links, 800 characters at most.",
                "type": "string"
              },
              "email": {
                "description": "The customer's email address. Give this or phone.",
                "type": "string"
              },
              "name": {
                "description": "The customer's own name.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number, ten digits. Give this or email.",
                "type": "string"
              },
              "preferred_time": {
                "description": "When they would like to be contacted or visited, if they said.",
                "type": "string"
              },
              "service": {
                "description": "What they need: repair = a repair or service call; new-construction = doors for a new building; replacement = replacing an existing door; maintenance = a planned maintenance program; dock = dock levellers, seals or bumpers; other = something else.",
                "enum": ["repair", "new-construction", "replacement", "maintenance", "dock", "other"],
                "type": "string"
              },
              "town": {
                "description": "Town or postal code where the work is.",
                "type": "string"
              }
            },
            "required": ["consent_to_contact", "details", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
