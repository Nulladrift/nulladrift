        {
          "name": "draft",
          "title": "Draft a post, listing or offer",
          "description": "Draft something for the person to finish in RoTerminal: a post on Social, a listing of one of their own games on the Marketplace, or an offer on a game for sale there. This never posts, lists or sends anything. It makes a draft, checked the way RoTerminal checks it, and answers status action_required with verification_uri, the draft's review page: give them that link and its message. They open it, see the draft as it will look, then post, list or send it in RoTerminal's own sheet (where they can change it first, and where card holds, fees and limits apply as always), or discard it. Their bell gets a note too. Drafts last 7 days; draft_status says whether it was done and what it became. Never say it's posted, listed or sent: only their own tap does that.\n- kind post: text, the post's words (at most 500 characters with the game's tag, plain, in their voice, no hashtags); game (optional), a game to tag: it goes in front as its tag, so don't start the words with its name.\n- kind listing: game, one of theirs that they own; price, the asking price in whole US dollars (0: open to offers); pitch (optional), the note to buyers, at most 200 characters, only facts you read, never a claim you didn't.\n- kind offer: listing, a game for sale on RoTerminal's Marketplace that takes offers (not an auction, not one sold directly); amount, the offer in whole US dollars; note (optional), to the seller, at most 600 characters.\nNever an offer to invest (money for a share of a game's earnings). Money words: \"$X after fees\", \"Total\", \"Your payout\", never \"you get\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "offer: the offer in whole US dollars",
                "type": "integer"
              },
              "game": {
                "description": "post: a game to tag (optional). listing: one of their own games",
                "type": ["string", "integer"]
              },
              "kind": {
                "description": "What to draft",
                "enum": ["post", "listing", "offer"],
                "type": "string"
              },
              "listing": {
                "description": "offer: the game for sale on the Marketplace",
                "type": ["string", "integer"]
              },
              "note": {
                "description": "offer: a note to the seller, at most 600 characters (optional)",
                "type": "string"
              },
              "pitch": {
                "description": "listing: the note to buyers, at most 200 characters (optional)",
                "type": "string"
              },
              "price": {
                "description": "listing: the asking price in whole US dollars (0: open to offers)",
                "type": "integer"
              },
              "text": {
                "description": "post: the words, at most 500 characters",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Draft a post, listing or offer"
