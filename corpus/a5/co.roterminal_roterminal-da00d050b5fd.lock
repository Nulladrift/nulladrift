        "name": "roterminal",
        "title": "RoTerminal",
        "version": "0.5.0",
        "websiteUrl": "https://roterminal.co",
        "icons": [
          {
            "src": "https://roterminal.co/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
