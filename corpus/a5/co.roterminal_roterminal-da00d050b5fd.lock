          "description": "How Roblox itself works, from Roblox’s own docs, DevForum announcements, newsroom, Creator Roadmap and Help Center, kept current, each fact with its source and date: discovery (recommendations, charts, search, thumbnails), monetization (passes, products, subscriptions, Creator Rewards, DevEx rates, fees), ads, what each Creator Analytics number means, rules (Terms, maturity labels, age checks), Studio and AI tools, Open Cloud and OAuth scopes, avatar items, creator programs, events and the roadmap. Actions: search (q, optional topic), fact (id), changes (what changed since a day, optional q and topic).",
