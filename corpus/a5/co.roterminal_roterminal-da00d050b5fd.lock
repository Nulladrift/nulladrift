      },
      "instructions": "RoTerminal is live data on every Roblox game: players right now, each game's history since Sep 27 2026, rising and new games, what developers are making (trends), genres, Roblox's charts in 60 countries, and who's behind a game. Use it for any question about Roblox games' players, popularity, growth, rivals, what to build, chart places, or how an update did. Start with `game` for one game, `rising` or `top` for lists, `trends` for ideas, `charts` with a game for where it charts, `updates` for how its updates did. Every result has a `link` to its page on roterminal.co: cite it when you use the numbers. `next` suggests what to look at next. RoBot's own tools are here too: `find` for what a name is (a game, studio or person), `dossier` for everything public at once, `person`, `series` for players over time, `page_cards` for a page's cards, `how_roblox` for how Roblox works; signed in, `my_games` and `my_game_numbers` for the person's own games from Roblox's analytics, `track` for their Terminal and `routine` for alerts. `page` reads any page's data by its path (without one, the catalogue), and `posts` searches news about Roblox (GDELT; credit it).",
      "tools": [
        {
          "name": "charts",
          "title": "Roblox’s charts",
          "description": "Roblox’s own charts (Top Earning, Top Trending, Up-and-Coming and the rest), as RoTerminal keeps them day by day in 60 countries and on every device. With no chart and no game: the list of charts, countries and devices. With a chart: its games now, each with its place yesterday, its move, its best place and its days on the chart (put a country in front for one country’s chart: jp-up-and-coming is Japan’s Up-and-Coming). With a game: every place it holds on the charts now, worldwide and in each country (like JP-Up-and-Coming #4), and each chart’s summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chart": {
                "description": "A chart’s id, like top-earning, top-trending or up-and-coming, with a country in front for one country’s chart, like jp-up-and-coming (optional)",
                "type": "string"
              },
              "country": {
                "description": "A country as two letters, like JP, BR or US (optional; worldwide without it)",
                "type": "string"
              },
              "device": {
                "description": "One device’s chart (optional; all devices without it)",
                "enum": ["all", "computer", "phone", "entry_phone", "tablet", "entry_tablet", "console", "vr"],
                "type": "string"
              },
              "game": {
                "description": "The game: its name (like \"grow a garden\"), its universe id, its Roblox link or place id, or its roterminal.co/g/ link: every place it holds on the charts now (optional)",
                "type": ["string", "integer"]
              },
              "genre": {
                "description": "For top-trending: one genre’s Trending list, like RPG or Simulation (optional)",
                "type": "string"
              },
              "limit": {
                "description": "1 to 100 (default 10)",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Roblox’s charts"
          },
