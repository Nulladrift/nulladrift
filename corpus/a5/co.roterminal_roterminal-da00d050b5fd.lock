        {
          "name": "routine",
          "title": "Alerts and routines",
          "description": "Set up or change a routine: a question RoBot answers again by itself, on a schedule (“every morning at 8: how did my games and their rivals do?”) or when something happens (a trigger), with a note to the person’s notifications (and Discord or email if connected). Use it for “every morning”, “each Monday”, “keep me posted”, “tell me when”, “alert me if”. Each run is RoBot answering, on the person’s RoBot usage. Actions: create (name, question, and every or trigger_sql), update (id, and only what changes), pause, resume, delete, restore, run (once now). routines lists them, with their ids. question is asked whole on each run: name the games and what to compare. Times are New York’s. Opens with RoBot: an account RoBot isn’t open on yet gets not_available.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["create", "update", "pause", "resume", "delete", "restore", "run"],
                "type": "string"
              },
              "at": {
                "description": "The time of day in New York as HH:MM (24-hour), for day and week; default 08:00",
                "type": "string"
              },
              "check_every_minutes": {
                "description": "For a trigger: how often it’s checked, 5 to 1440 (default 15)",
                "type": "integer"
              },
              "cooldown_hours": {
                "description": "For a trigger: the least time between its runs, 0.25 to 168 (default 6)",
                "type": "number"
