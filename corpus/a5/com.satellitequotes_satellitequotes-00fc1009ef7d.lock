      "prompts": [
        {
          "name": "install-widget",
          "title": "Install the quote widget on my website",
          "description": "Walks through adding the instant-quote widget to a contractor's site and verifies it worked.",
          "arguments": [
            {
              "name": "website_url",
              "description": "The page the widget should go on.",
              "required": true
            },
            {
              "name": "platform",
              "description": "What the site is built with, if known - e.g. WordPress, Squarespace, Wix.",
              "required": false
            }
