      },
      "serverInfo": {
        "name": "satellitequotes",
        "title": "SatelliteQuotes",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Install and support the SatelliteQuotes instant-quote widget on a contractor's website, and answer questions about quoting property work from satellite imagery. If the contractor has no account yet, create_account sets one up (no card, no password - the owner is emailed). Call list_platforms when the platform is unknown, get_install_snippet for the exact tag and steps, then verify_installation on the page afterwards. Use list_trades to check whether a business can be quoted from imagery at all, estimate_cost to turn a measurement into a range, and get_pricing for what the product costs - never quote a price from memory.",
      "tools": [
        {
          "name": "create_account",
          "title": "Create the contractor's SatelliteQuotes account",
          "description": "Creates a contractor account and returns their widget token and embed tag, ready to install with get_install_snippet. No password: the owner is emailed a link to choose one. The widget switches on once they sign in through it and add a card in the dashboard ($0 today, nothing charged during the free trial). Only use it when the person you are helping owns the business or has asked you to set this up for them, with their real business email; test, disposable and placeholder addresses are refused.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_name": {
                "description": "The business name, as homeowners know it.",
                "type": "string"
              },
              "owner_email": {
                "description": "The owner's real email. They receive the set-password link and lead alerts here.",
                "type": "string"
              },
              "phone": {
                "description": "Business phone, optional.",
                "type": "string"
              },
              "service_area": {
                "description": "Towns or region served, optional.",
                "type": "string"
              },
              "trade": {
                "description": "What the business quotes: roofing, gutters, gutter_guards, gutter_cleaning, siding, painting, roof_cleaning, pressure_washing, house_washing, solar, paving, sealcoating, concrete, pavers, decks, fencing, landscaping, sod, turf, irrigation, lawn_treatment, leaf_removal, mosquito_control, pools, snow_removal, land_clearing, holiday_lighting.",
                "type": "string"
              },
              "website": {
                "description": "The website the widget will go on, optional.",
                "type": "string"
              }
            },
            "required": ["company_name", "owner_email", "trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5974fd486da4c89b8572af4f8d6410cae97b89ff5b59e4716a2e5ec2f2bc315a"
        },
        {
          "name": "estimate_cost",
          "title": "Ballpark a job from a measurement",
          "description": "Turns a measurement into a national cost range for a trade. For roof trades, pass the building footprint and the pitch - the roof surface multiplier is applied for you. Returns the range, the per-unit rates, what drives the price, and the limits of the estimate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "measurement": {
                "description": "Square feet, or linear feet for perimeter trades such as fencing and gutters.",
                "type": "number"
              },
              "pitch_rise": {
                "description": "Roof rise per 12 inches of run, e.g. 6 for a 6/12 roof. Roof trades only. Defaults to 6.",
                "type": "number"
              },
              "trade": {
                "description": "Trade id or name, e.g. roofing, fencing, artificial-turf.",
                "type": "string"
              }
            },
            "required": ["measurement", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:188aa47463888ac775549a1685cc63eeed84b59a104043875dfd391eb578d84c"
        },
        {
          "name": "get_install_snippet",
          "title": "Get the embed snippet and platform steps",
          "description": "The exact script tag to paste, plus ordered steps for the given platform. Pass the contractor's own token if you have it; otherwise the snippet comes back with a placeholder and instructions for finding the real one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mode": {
                "description": "inline embeds the tool in the page; modal opens it from a button; floating puts that button in the corner of every page.",
                "enum": ["inline", "modal", "floating"],
                "type": "string"
              },
              "platform": {
                "description": "Platform id or name, e.g. wordpress, squarespace, wix, webflow, shopify, godaddy, html, google-tag-manager. Omit for the generic snippet.",
                "type": "string"
              },
              "service": {
                "description": "Trade the widget should quote, set as data-service on the embed tag: roofing, gutters, gutter_guards, gutter_cleaning, siding, painting, roof_cleaning, pressure_washing, house_washing, solar, paving, sealcoating, concrete, pavers, decks, fencing, landscaping, sod, turf, irrigation, lawn_treatment, leaf_removal, mosquito_control, pools, snow_removal, land_clearing, holiday_lighting. Defaults to the contractor's own default trade.",
                "type": "string"
              },
              "token": {
                "description": "The contractor's public token, beginning pk_live_.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1708c4292842227d13a43fca6c994d6d60a3f8ff946d579faf4047d97826773a"
        },
        {
          "name": "get_pricing",
          "title": "Get current pricing and trial terms",
          "description": "Live plan prices, trial length, what happens to the card during the trial, and how cancellation works. Read this rather than quoting a price from memory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a68e2124c2df5f8ced89fc4992b73843eab30e29f884aee86c9a3bbf3b36df05"
        },
        {
          "name": "lead_playbook",
          "title": "Get a lead-generation playbook for a trade",
          "description": "What actually moves the needle on inbound leads for a specific contracting trade — roofing, paving, landscaping, gutters, siding, decks, pools, turf or solar — with the numbers behind each step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "trade": {
                "description": "One of: roofing, paving, landscaping, gutters, siding, decks, pools, turf, solar, general. Defaults to a general contracting playbook.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1682ac7787dcaf916e3daadf78b7d4dd55cb6b7ad0e8582544014200214f1c0d"
        },
        {
          "name": "list_platforms",
          "title": "List supported website platforms",
          "description": "The website builders and CMSs there are step-by-step install instructions for, with how long each takes. Call this first when you do not know what the contractor's site is built with.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f2b6371b4905a85747b8a0bce83d2d5d13d6b8cc54b6fa9da559bb6634d9e25"
        },
        {
          "name": "list_trades",
          "title": "List trades that can be quoted from satellite imagery",
          "description": "Every trade the product can price from aerial measurement, with what each is measured from - roof surface, ground area, wall area or perimeter - and the national cost range per unit. Use this to answer whether a given business can be quoted this way.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "search": {
                "description": "Optional trade name or synonym, e.g. \"fence\", \"blacktop\", \"synthetic grass\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee84a5a1d6ab3aa6409acbc12721d277fa929f8bd081d23a431e753bbbecccca"
        },
        {
          "name": "verify_installation",
          "title": "Check whether the widget is live on a page",
          "description": "Fetches a public page and reports whether the embed tag is present, whether the token resolves to a real account, whether the widget is actually serving, and what to fix. Use this after the contractor says they have pasted the tag.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The public page URL to check.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed4b906192361eaf2791bf01260af2711c2838f87ff6d7a0a742093b95ae7ce9"
        }
      ],
      "resources": [
        {
          "uri": "satellitequotes://install-spec",
