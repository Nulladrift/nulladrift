        {
          "name": "search_products",
          "title": "Search wholesale products",
          "description": "Search published products from verified factories (each listing states where its factory is). Use short English keywords (e.g. 'stainless steel hook', 'silicone baking mat'). Filters are optional. Returns cards with the lowest tier price, MOQ, handling time and the supplier's Moqway rating; better-rated suppliers rank slightly higher. Prices and MOQ are per sale unit: pieces_per_unit is 1 for products sold by the piece, otherwise the pack size (then from_price_per_piece is given too). Call get_product for SKUs, full price tiers and carton data.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "enum": ["hardware", "home", "kitchen", "electronics_accessories", "packaging", "apparel_accessories", "pet", "building", "electrical_lighting", "industrial", "auto_parts", "sports_outdoor", "toys", "beauty_personal_care", "office_stationery", "other"],
                "type": "string"
              },
              "certification": {
                "description": "e.g. CE, FCC, RoHS, CPC, LFGB",
                "maxLength": 20,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_moq": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "max_unit_price_usd": {
                "description": "Only products whose lowest price per single piece is at or below this (products sold in packs are compared per piece)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "origin_country": {
                "description": "ISO 3166-1 alpha-2 country of origin (where the factory is), e.g. CN, VN, IN, MX",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Keywords; omit to browse the newest listings",
                "maxLength": 200,
                "type": "string"
              },
              "ships_within_days": {
                "description": "Max factory handling days before hand-over to the carrier",
                "maximum": 90,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search wholesale products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
