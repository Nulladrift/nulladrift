        {
          "name": "quote_order",
          "title": "Quote an order",
          "description": "Exact landed quote for one supplier's shipment: goods at tier price, freight by chargeable weight (cartons, volumetric), import-duty estimate, delivery days. Locks prices for 24 hours and returns quote_id for place_order. All SKUs must belong to one supplier.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "destination_country": {
                "description": "ISO-2 country code of the delivery address",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "incoterm": {
                "default": "DAP",
                "description": "DAP: buyer pays import duty on arrival. DDP: duty included in freight.",
                "enum": ["DAP", "DDP"],
                "type": "string"
              },
              "lines": {
                "items": {
                  "properties": {
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "maximum": 1000000,
                      "type": "integer"
                    },
                    "sku_id": {
                      "maxLength": 40,
                      "minLength": 3,
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku_id"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "service": {
                "default": "express",
                "enum": ["express", "air_freight", "sea_freight"],
                "type": "string"
              }
            },
            "required": ["destination_country", "lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Quote an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
