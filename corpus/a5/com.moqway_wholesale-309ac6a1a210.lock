              {
                "type": "noauth"
              },
              {
                "scopes": ["catalog:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:41dc22d493e0e625f30ebf2f2aaf809258e06a139a86ad201aebc975a009a0c2"
        },
        {
          "name": "send_inquiry",
          "title": "Ask a factory",
          "description": "Send a question or request to one factory: customization (logo, colour, packaging), samples, quantities above stock or outside the price tiers, lead times, anything the listing does not settle. Give product_id (or supplier_id for a general question), a kind, the message in English and any structured details. The factory's AI assistant answers at once from the factory's own data; anything needing a person is forwarded and the factory replies in the same inquiry (poll get_inquiry). Do not share contact or payment details; Moqway handles payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "details": {
                "additionalProperties": false,
                "properties": {
                  "customization": {
                    "description": "Logo, colour, size, material, packaging changes",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "destination_country": {
                    "maxLength": 2,
                    "minLength": 2,
                    "type": "string"
                  },
                  "needed_by": {
                    "description": "Date or period, e.g. 2027-02-15 or 'within 6 weeks'",
                    "maxLength": 30,
                    "type": "string"
                  },
                  "quantity": {
                    "exclusiveMinimum": 0,
                    "maximum": 100000000,
                    "type": "integer"
                  },
                  "sample_quantity": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000,
                    "type": "integer"
                  },
                  "target_unit_price_usd": {
                    "exclusiveMinimum": 0,
                    "maximum": 1000000,
                    "type": "number"
                  },
                  "unit": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "kind": {
                "enum": ["question", "customization", "sample", "bulk_order", "other"],
                "type": "string"
              },
              "message": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "product_id": {
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              },
              "subject": {
                "maxLength": 120,
                "type": "string"
              },
              "supplier_id": {
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
