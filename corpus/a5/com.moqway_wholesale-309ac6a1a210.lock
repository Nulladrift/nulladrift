        {
          "name": "rate_order",
          "title": "Rate an order",
          "description": "Records the buyer's rating of a shipped order, 1–5 stars: quality and as_described (goods match the photos and specs) are required, packaging and service optional. Only send ratings the buyer actually gave you; never guess them. Ratings feed Moqway's supplier rating and are not shown to the supplier. Calling again replaces the rating (allowed for 90 days after shipping).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "as_described": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "comment": {
                "anyOf": [
                  {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "order_id": {
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              },
              "packaging": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "quality": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["as_described", "order_id", "quality"],
            "type": "object"
          },
          "annotations": {
