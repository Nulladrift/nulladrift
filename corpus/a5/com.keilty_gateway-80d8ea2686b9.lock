{
  "lockfileVersion": 2,
  "subjects": {
    "com.keilty/gateway": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.keilty.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "keilty-gateway",
        "title": "KEILTY Realty Management",
        "version": "1.10.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KEILTY Realty Management manages rental property across Eastern Ontario, Canada. Use get_services and get_pricing to answer an owner's questions with published facts, check_fit to confirm a property is in scope, then, only with the owner's consent, request_rental_evaluation. Agents cannot sign, accept terms or pay on an owner's behalf. KEILTY is a property management firm, not a registered real estate brokerage. A person can always reach KEILTY at 613-545-3322 or Hello@KEILTY.com.",
      "tools": [
        {
          "name": "check_fit",
          "title": "Check whether a property fits KEILTY",
          "description": "Checks whether a rental property is a fit for KEILTY management. Returns fit (yes, nurture, waitlist or no), the reason, the recommended service and the next step. Call this before request_rental_evaluation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Community the property is in, e.g. Kingston",
                "type": "string"
              },
              "owner_lives_there_now": {
                "description": "True if the owner currently lives in the property",
                "type": "boolean"
              },
              "property_type": {
                "enum": ["single_family", "condo", "duplex_to_fourplex", "apartment_building", "student_house", "portfolio", "commercial"],
                "type": "string"
              },
              "self_manage_after_lease": {
                "description": "True if the owner only wants a resident placed and will manage the tenancy",
                "type": "boolean"
              },
              "units": {
                "description": "Number of rental units",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city", "property_type"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c5b96d86ba516e42d4755de2c64cdd6a02f5ef5e31772becb19afb89c17f392"
        },
        {
          "name": "get_booking_link",
          "title": "Get the link to book a call with A.J. Keilty",
          "description": "Returns the link the owner can use to book a first call with A.J. Keilty, President. The owner picks the time themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea65afb54aaeadf064ed37deadf2179c70853c0a8edab2870e9900e343e78dbd"
        },
        {
          "name": "get_pricing",
          "title": "Get KEILTY's published fees",
          "description": "Returns KEILTY's published fee schedule in Canadian dollars. Optionally filter to one service id from get_services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "Optional service id to filter to.",
                "enum": ["full_service_single_family", "full_service_small_multi_family", "apartment_and_build_to_rent", "commercial", "lease_up_mandate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e849f8f419447603c6cb6dddca3952bc5df764ed970edf79915da65f6dc4473"
        },
        {
          "name": "get_proof",
          "title": "Get facts about KEILTY",
          "description": "Returns verifiable facts about KEILTY: founding year, doors under management (about 1,200), location, markets, leadership, the response promise and where to read more.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f869802ff57eb6e97a252bbfec6308394d38cf76d6350364fa3567673bb7634e"
        },
        {
          "name": "get_service_areas",
          "title": "List the communities KEILTY serves",
          "description": "Returns the Ontario communities KEILTY manages rental property in, its core Eastern Ontario markets, and markets it watches but does not serve yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1d35a8471fc24c374e98d7d3e0352e3fbabfc6f4de419f8688f23f4a607cc51"
        },
        {
          "name": "get_services",
          "title": "List KEILTY's services",
          "description": "Lists KEILTY Realty Management's property management services for rental owners in Ontario: what each includes, who it is for, its term, and the page that describes it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e05b3dc6f5b569f3de90099a366f7aba7b1ef84e03263974615e56c3ef386796"
        },
        {
          "name": "request_rental_evaluation",
          "title": "Request a free rental evaluation for an owner",
          "description": "Submits a free rental evaluation request to KEILTY on the owner's behalf. KEILTY then contacts the owner directly. Only call this with the owner's explicit consent to share their contact details, and only once per property. The owner signs any agreement personally; this request commits them to nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the AI agent or app submitting, e.g. ChatGPT",
                "maxLength": 120,
                "type": "string"
              },
              "bedrooms": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "maxLength": 80,
                "type": "string"
              },
              "email": {
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "first_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "last_name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "description": "Anything else the owner wants KEILTY to know",
                "maxLength": 1500,
                "type": "string"
              },
              "owner_consent": {
                "description": "Must be true: the owner has agreed to share these details with KEILTY and to be contacted.",
                "type": "boolean"
              },
              "phone": {
                "description": "Mobile number, digits with optional +1",
                "maxLength": 30,
                "type": "string"
              },
              "property_address": {
                "maxLength": 300,
                "type": "string"
              },
              "property_status": {
                "enum": ["vacant", "resident_in_place", "owner_lives_there", "closing_soon"],
                "type": "string"
              },
              "property_type": {
                "enum": ["single_family", "condo", "duplex_to_fourplex", "apartment_building", "student_house", "portfolio", "commercial"],
                "type": "string"
              },
              "service_wanted": {
                "enum": ["full_service", "lease_up_mandate", "not_sure"],
                "type": "string"
              },
              "units": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city", "email", "first_name", "last_name", "owner_consent", "phone", "property_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ce46d47d0d5cef34d9e20ecb84ac2f493440ddf2f35cfecbc0246a32f514bb0"
        }
      ],
      "digest": "sha256:b93c09a2411620d4806f26d01612f78df76a293afb163587a31f2b1b000961cf"
    }
  }
}
