        },
        {
          "name": "didtheyopen_new_opens",
          "title": "New opens across all emails",
          "description": "What changed since a cursor, summarised per email, each open exactly once. Meant to run without the owner asking, as one permanent recurring job every 10 to 15 minutes: it says which emails are worth telling the owner about right now (first open, a new device, a return after a pause) and which are noise. First call (or after losing the cursor): since = an ISO time such as when tracking started or just before your last check. Then pass back the returned cursor and keep it in durable notes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "ISO-8601 time or the cursor returned by the previous call.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5c4e55f70e2f5db72524e17b2a1bfad00b4c2704aaf9b25590d0ee7c1d937d7b"
        },
        {
          "name": "didtheyopen_signup",
          "title": "Sign up for didtheyopen",
          "description": "Create a didtheyopen account (no email needed). Use only when no agent key is set for this server (Authorization header). Returns an agent key for this server and a dashboard login for the owner, shown once.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:927877485cf9a3ab3748396f11b79072d0d2d0a544add13522cd1654430382a1"
        },
        {
          "name": "didtheyopen_track_email",
          "title": "Track an email",
          "description": "Get a tracking pixel for ONE email the owner asked to track. Returns an <img> tag to put at the end of the HTML body before sending, and, given the links of the email (pass them by default), a tracked address for each link. Never use for plain-text emails or sensitive correspondence. After sending, keep watching with didtheyopen_new_opens on a schedule and tell the owner when it is opened, without waiting to be asked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "client_ref": {
                "description": "Your own unique id for this email, e.g. \"proposal-dana-2026-11-10\". Reuse it on retries.",
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "label": {
                "description": "Recipient display name shown in the owner dashboard, e.g. \"Dana Levi\". Never an email address.",
                "maxLength": 80,
                "type": "string"
              },
              "links": {
                "description": "The link addresses (href) in the HTML body; pass them by default whenever the email has links. Returns a tracked address for each, so a click by the recipient also counts as opened, even in Apple Mail, which hides opens. Leave out only when the owner says not to track links. Unsubscribe, mailto and non-web links are never tracked.",
                "items": {
                  "maxLength": 2048,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "sender_label": {
                "description": "Which mailbox it was sent from. Default work.",
                "enum": ["personal", "work"],
                "type": "string"
              }
            },
            "required": ["client_ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
