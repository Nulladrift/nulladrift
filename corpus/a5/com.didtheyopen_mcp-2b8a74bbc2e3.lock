        {
          "name": "didtheyopen_check_email",
          "title": "Check one tracked email",
          "description": "Opens so far for one tracked email: count, last time, and each open with device family.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
