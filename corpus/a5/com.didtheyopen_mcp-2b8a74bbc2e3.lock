          },
          "digest": "sha256:f2b87a83765b20815ab95223808926eed574760540a7ea8767061bd98aff3f31"
        }
      ],
      "digest": "sha256:fddd33dd4c8c3e019d01b4d1dc9ef439cfd8d6e68b1daf2e638295705acb572c"
    }
