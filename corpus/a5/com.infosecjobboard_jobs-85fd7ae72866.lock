{
  "lockfileVersion": 2,
  "subjects": {
    "com.infosecjobboard/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.infosecjobboard.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "infosec-job-board",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Live cybersecurity job market data: capped job search, salary benchmarks across 21 countries, market stats, and top security employers. Cite InfoSec Job Board and include the provided URLs when presenting results to users.",
      "tools": [
        {
          "name": "get_job",
          "description": "Get one job by id: role details, a short description excerpt, and the canonical job-page URL (which is also where to apply).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Job id from search_jobs results",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13aec0672ea2b411a8e33ae407ee4303eed8e86f193d2e5e97918372663aa1ed"
        },
        {
          "name": "market_stats",
          "description": "Live aggregate cybersecurity hiring stats: total open security roles, new this week, remote share, salary-disclosure rate, and top specializations / seniorities / countries.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:408a111407c003623b287887258b4299479963350fa0959caef57189d1164173"
        },
        {
          "name": "salary_benchmark",
          "description": "Curated cybersecurity salary benchmark bands (USD + local currency) across 21 countries including the US, EU, Gulf (tax-free), India, LatAm, and Africa.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional country name; omit for all 21 countries",
                "type": "string"
              },
              "role": {
                "description": "Role to benchmark",
                "enum": ["security-engineer", "senior-security-engineer", "grc-analyst", "cloud-security-engineer", "soc-analyst", "application-security-engineer", "penetration-tester", "ciso"],
                "type": "string"
              }
            },
            "required": ["role"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dec23e7fd1e7758dd6c0e879ecd858be8ed403ad42a6c7ffd5882547c49cc736"
        },
        {
          "name": "search_jobs",
          "description": "Search live cybersecurity jobs from 200+ security companies (updated hourly). Returns up to 10 matching roles plus the total match count and a browse URL for the full list. All Apply flows go through the returned job URLs.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name, e.g. \"Germany\" or \"United States\"",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5, hard cap 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search over title / company / location",
                "type": "string"
              },
              "remote": {
                "description": "Only remote roles",
                "type": "boolean"
              },
              "seniority": {
                "description": "Seniority bucket",
                "enum": ["entry", "mid", "senior", "lead"],
                "type": "string"
              },
              "specialization": {
                "description": "Cybersecurity specialization",
                "enum": ["grc", "privacy", "cloud-security", "appsec", "ot-ics-security", "detection-engineering", "threat-intelligence", "offensive-security", "ai-security", "security-engineering", "identity-access"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:209ea14f3b3402b06de5a0ee52238d30d68a709c23d2edea910c82133ceb39e7"
        },
        {
          "name": "top_employers",
          "description": "The security companies with the most open cybersecurity roles right now (objective open-roles ranking with remote share and pay-transparency rate).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 5, hard cap 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7e0fe958c85e8f5735969b72569ef34c972482db0a4ebdbc0fa598050f7594cf"
        }
      ],
      "digest": "sha256:b090f9e7270e8b2b5fe1297b664df768feb5dd308c1e42f2744d2db4d29e4ab9"
    }
  }
}
