          },
          "digest": "sha256:454e7d35ec0963c243d1eb0b8bc680e25916b4e2e0e1027657a345dad8e5f20b"
        },
        {
          "name": "movers",
          "title": "The week's biggest rating movers",
          "description": "Returns the clubs whose 442ball Power Rating rose (up) or fell (down) most between the latest two weekly snapshots, in one league (its slug) or one comparison group, 1 to 10 of them (default 5). The change is the rating difference only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "direction": {
                "enum": ["up", "down"],
                "type": "string"
              },
              "n": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "scope": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["direction", "scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The week's biggest rating movers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1eb37eab1bb82ab85cddfe21fe0d3fae8c011903cc95de0f9817afc4e6f02c29"
        },
        {
          "name": "rankings",
          "title": "A league's clubs by rating",
          "description": "Returns the top clubs of one league by 442ball Power Rating at the latest weekly snapshot, 1 to 20 of them (default 10), each with its page URL. Takes the league slug from resolve. There is no list across leagues.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "league": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "n": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A league's clubs by rating"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae720e35e7b827c4ba4535c16b01888ba46d9826e4333a16284508df2c6f8134"
        },
        {
          "name": "rating_history",
          "title": "A club's rating month by month",
          "description": "Returns one club's 442ball Power Rating month by month (the last weekly value of each month) for the latest 1 to 60 months (default 24), with the club page URL. Takes the club slug from resolve.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "club": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "months": {
                "default": 24,
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["club"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A club's rating month by month"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5965d280a2fae3e6b330e447b7dfba4e7e4a0a8946d26b1933278f729fcab924"
        },
        {
          "name": "resolve",
          "title": "Find a club or league on 442ball",
          "description": "Finds clubs and leagues by name and returns up to five, each with its 442ball slug and page URL. Use it first when you have a name, then pass the slug to the other tools. The query is 2 to 60 characters; accents and case are ignored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a club or league on 442ball"
          },
          "behavior": {
            "destructive": false,
