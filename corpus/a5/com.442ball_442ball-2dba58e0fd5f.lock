      },
      "transport": {
        "type": "http",
        "url": "https://mcp.442ball.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "442ball",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "442ball is a football publication at 442ball.com. These tools return 442ball's own club Power Ratings and league strength, and every answer links to the 442ball page of each club and league it names.",
      "tools": [
        {
          "name": "club_rating",
          "title": "A club's 442ball Power Rating",
          "description": "Returns one club's latest weekly 442ball Power Rating: the rating, its band, its rank by rating in its league, its attack and defence indices and its long-run rating, with the club and league page URLs. Takes the club slug from resolve.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "club": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              }
            },
            "required": ["club"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A club's 442ball Power Rating"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21eb047e3a069e42b2011ba83a5e56d85ce3f39f7c12657d4bdbef78fba43fd6"
        },
        {
          "name": "club_runs",
          "title": "A club's runs",
          "description": "Returns one club's current and longest runs from the results 442ball holds: unbeaten, winning, winless and clean sheets, overall, at home and away, with the longest this season and since 2010. Run lengths only. Takes the club slug from resolve.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "club": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              }
            },
            "required": ["club"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A club's runs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b969480de74bb0a7379c50e276728129fe68b6e625338748b67413ae8fb61bd"
        },
        {
          "name": "compare_clubs",
          "title": "Two clubs side by side",
          "description": "Returns two clubs' latest 442ball Power Ratings side by side. The difference between the ratings is given only when both clubs are rated on the same scale; otherwise the answer says why it is withheld. Takes two club slugs from resolve.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "club_a": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "club_b": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              }
            },
            "required": ["club_a", "club_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Two clubs side by side"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49c7cc3d126281acda202f3ddf6086cd34df7aec0cc021aee6b46b70ba4d1b6d"
        },
        {
          "name": "greatest_sides",
          "title": "The greatest club-seasons within a league",
          "description": "Returns club-seasons ranked within one league since 2010/11 (or the league's first season in 442ball's record) on league results, with each side's score, its rank in the league, its longest unbeaten run and the club page URL. One league (its slug from resolve), 1 to 20 of them (default 10); or one club's best seasons (its club slug), 1 to 10, each with its league and its rank there. Finished seasons only; sides are never compared across leagues.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "club": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "n": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "scope": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The greatest club-seasons within a league"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd21d974061c03a27032b647dfbf89e8ef553ee64e47ad36f9a4ebac0c09e12b"
        },
        {
          "name": "league_index",
          "title": "A league's 442 League Index",
          "description": "Returns the 442 League Index of one league (its slug from resolve), or of the top 1 to 20 European leagues (default 10): 0.6 x the mean 442ball Power Rating of the league's top 6 clubs (top 4 in a league of 12 or fewer) + 0.4 x the mean of all its clubs, in rating points, with both parts and the league page URL. A European league carries its rank among European leagues; a league elsewhere carries no rank yet.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "league": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "n": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A league's 442 League Index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49ae432f301e7cc71efd7c5ff9efec1136081549a7506fc1d74560e5c5613d5c"
        },
        {
          "name": "league_runs",
          "title": "A league's longest current runs",
          "description": "Returns the clubs of one league with the longest current run of one kind (unbeaten, winning, winless or clean_sheets), 1 to 10 of them (default 5), each with its page URL. Takes the league slug from resolve.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["unbeaten", "winning", "winless", "clean_sheets"],
                "type": "string"
              },
              "league": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              },
              "n": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["kind", "league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A league's longest current runs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd314b1e8abefeada4b47ff348598c9e84b18adc2377eb9d9d57ad27c692d428"
        },
        {
          "name": "league_strength",
          "title": "A league's 442ball strength",
          "description": "Returns one league's latest weekly 442ball league strength and how many clubs it counts, with the league page URL. Takes the league slug from resolve.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "league": {
                "pattern": "^[a-z0-9][a-z0-9-]{0,99}$",
                "type": "string"
              }
            },
            "required": ["league"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A league's 442ball strength"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fedf22f93bcb9511e768cfbb4dd77f840cdca636df6d5ab4957ca12f572483c7"
        },
        {
          "name": "method",
          "title": "How the 442ball ratings are made",
          "description": "Explains in words how 442ball calculates its club Power Ratings and league strength, what the band means, and which method version is in use.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
