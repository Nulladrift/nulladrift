      "tools": [
        {
          "name": "calculate_spring_usage",
          "title": "Compare documented spring cycle ratings",
          "description": "Calculate theoretical usage years from supplied cycle ratings and daily complete cycles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "comparison_rated_cycles": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "cycles_per_day": {
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "rated_cycles": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cycles_per_day", "rated_cycles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1b8af8cdb1f7b55b6971c4cf874664ee62dfc1b5dbbf7b750e1e0a3fd85abafc"
        },
        {
          "name": "check_installed_opener_quote",
          "title": "Check installed-opener quote scope",
          "description": "Review user-reported opener quote inclusions and return questions to ask the installer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "door_height_rail": {
                "default": "unknown",
                "description": "Rail for your door height",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "installation_labor": {
                "default": "unknown",
                "description": "Installation labor",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "old_opener_removal": {
                "default": "unknown",
                "description": "Old-opener removal",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "safety_setup_testing": {
                "default": "unknown",
                "description": "Safety setup and testing",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "taxes_fees": {
                "default": "unknown",
                "description": "Taxes and other fees",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "warranty": {
                "default": "unknown",
                "description": "Parts and labor warranty",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
