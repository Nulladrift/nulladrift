        },
        {
          "name": "get_garage_door_answer",
          "title": "Read a published garage-door answer",
          "description": "Retrieve a published knowledge item by the ID returned by search. Includes its source page and fact verification dates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Published knowledge item ID or slug",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b088f5dc7755d8255cdc94af81eb997c424f9081940f6ac71172eda390cce571"
        },
        {
          "name": "plan_winter_readiness",
          "title": "Plan garage-door winter preparation",
          "description": "Organize observations into a winter checklist, prioritizing reported damage or unusual heaviness.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bottom_seal_gap": {
                "default": false,
                "description": "Gaps under the door or a worn bottom seal",
                "type": "boolean"
              },
              "closing_problem": {
                "default": false,
                "description": "The door reverses, stops or will not close normally",
                "type": "boolean"
              },
              "new_noise": {
                "default": false,
                "description": "A new grinding, scraping or jerking movement",
                "type": "boolean"
              },
              "only_vehicle_access": {
                "default": false,
                "description": "No other entrance to the garage",
                "type": "boolean"
              },
              "visible_damage": {
                "default": false,
                "description": "A crooked door, loose cable, visible spring break or unusual heaviness",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
