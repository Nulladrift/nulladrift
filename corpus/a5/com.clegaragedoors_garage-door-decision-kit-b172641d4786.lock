          "digest": "sha256:7c01c6d1fe97f42e701b92c04cd73794890cb45d6d9901d64605eec7ab6a7523"
        },
        {
          "name": "search_garage_door_knowledge",
          "title": "Search verified garage-door answers",
          "description": "Search CLE published residential garage-door knowledge. Returns source pages, current verified facts and limitations. No customer records or booking actions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Garage-door question, component or buying decision",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
