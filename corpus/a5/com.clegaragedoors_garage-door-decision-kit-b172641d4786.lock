{
  "lockfileVersion": 2,
  "subjects": {
    "com.clegaragedoors/garage-door-decision-kit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.clegaragedoors.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "CLE Garage Door Decision Kit",
        "version": "0.2.0",
        "websiteUrl": "https://clegaragedoors.com/tools/garage-door-decision-kit"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_spring_usage",
          "title": "Compare documented spring cycle ratings",
          "description": "Calculate theoretical usage years from supplied cycle ratings and daily complete cycles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "comparison_rated_cycles": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "cycles_per_day": {
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "rated_cycles": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cycles_per_day", "rated_cycles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c15e90a414a4962e32b50915ead4167d35b3dc88a141003a394d2663bd745b41"
        },
        {
          "name": "check_installed_opener_quote",
          "title": "Check installed-opener quote scope",
          "description": "Review user-reported opener quote inclusions and return questions to ask the installer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "door_height_rail": {
                "default": "unknown",
                "description": "Rail for your door height",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "installation_labor": {
                "default": "unknown",
                "description": "Installation labor",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "old_opener_removal": {
                "default": "unknown",
                "description": "Old-opener removal",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "safety_setup_testing": {
                "default": "unknown",
                "description": "Safety setup and testing",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "taxes_fees": {
                "default": "unknown",
                "description": "Taxes and other fees",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              },
              "warranty": {
                "default": "unknown",
                "description": "Parts and labor warranty",
                "enum": ["included", "excluded", "unknown"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b168c036190895c13f97a4edb8cc19b5672b3d9011f5f16fcfefbcea51b43df"
        },
        {
          "name": "get_garage_door_answer",
          "title": "Read a published garage-door answer",
          "description": "Retrieve a published knowledge item by the ID returned by search. Includes its source page and fact verification dates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Published knowledge item ID or slug",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df84a809318558bc9dc9ff27b3d8181ba9e69d12a4f88d4c6282717480a74302"
        },
        {
          "name": "plan_winter_readiness",
          "title": "Plan garage-door winter preparation",
          "description": "Organize observations into a winter checklist, prioritizing reported damage or unusual heaviness.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bottom_seal_gap": {
                "default": false,
                "description": "Gaps under the door or a worn bottom seal",
                "type": "boolean"
              },
              "closing_problem": {
                "default": false,
                "description": "The door reverses, stops or will not close normally",
                "type": "boolean"
              },
              "new_noise": {
                "default": false,
                "description": "A new grinding, scraping or jerking movement",
                "type": "boolean"
              },
              "only_vehicle_access": {
                "default": false,
                "description": "No other entrance to the garage",
                "type": "boolean"
              },
              "visible_damage": {
                "default": false,
                "description": "A crooked door, loose cable, visible spring break or unusual heaviness",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc437a259cbf00d91ba5d1fb2d8cb525bd8557a6b815b8341765c349f95c89da"
        },
        {
          "name": "search_garage_door_knowledge",
          "title": "Search verified garage-door answers",
          "description": "Search CLE published residential garage-door knowledge. Returns source pages, current verified facts and limitations. No customer records or booking actions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Garage-door question, component or buying decision",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9783ba8b7af8373a1eccb0b54e098c136da015532d12c47623b815b89604392"
        }
      ],
      "digest": "sha256:ef66c072de2225273c8f8c2e439c854ca74b3592f3023dc814372664fcfcd647"
    }
  }
