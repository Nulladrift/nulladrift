        {
          "name": "get_paper",
          "title": "Get a paper",
          "description": "Use this when the user gives a DOI, PubMed id or arXiv id and wants the paper's abstract or a free full-text link, such as \"get the abstract for DOI 10.1038/s41586-021-03819-2\". Pass exactly one of doi, pmid or arxiv_id. Returns the title, authors, year, venue, the start of the abstract, the free full-text link and license when the index confirms them, and the index it came from. It does not say whether the paper was retracted or whether a reference is correct.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "doi": "10.1038/s41586-021-03819-2"
              }
            ],
            "properties": {
              "arxiv_id": {
                "description": "arXiv id such as \"2401.12345\"; an arxiv.org link also works",
                "maxLength": 80,
                "minLength": 7,
                "type": "string"
              },
              "doi": {
                "description": "DOI such as \"10.1038/s41586-021-03819-2\"; a doi.org link also works",
                "maxLength": 200,
                "minLength": 7,
                "type": "string"
              },
              "pmid": {
                "description": "PubMed id such as \"31452104\"",
                "maxLength": 12,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "Date the indexes were read (UTC, YYYY-MM-DD); they are updated continuously",
                "type": "string"
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "error": {
                "description": "Present when status is not ok: a stable code, what went wrong and what to do next.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "hint": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "required": ["code", "hint", "message"],
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "paper": {
                "properties": {
                  "abstract": {
                    "description": "First 600 characters of the abstract",
                    "type": ["string", "null"]
                  },
                  "authors": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "citedBy": {
                    "description": "Citation count in this source; sources count differently",
                    "type": ["integer", "null"]
                  },
                  "doi": {
                    "type": ["string", "null"]
                  },
                  "license": {
                    "description": "License of the open copy when the source states it",
                    "type": ["string", "null"]
                  },
                  "openAccessUrl": {
                    "description": "A link to the full text that is free to read; null when the source does not confirm one, which does not mean none exists",
                    "type": ["string", "null"]
                  },
                  "pmcid": {
                    "type": ["string", "null"]
                  },
                  "pmid": {
                    "type": ["string", "null"]
                  },
                  "source": {
                    "enum": ["Europe PMC", "Crossref", "arXiv"],
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "description": "A page for the record",
                    "type": "string"
                  },
                  "venue": {
                    "type": ["string", "null"]
                  },
                  "year": {
                    "type": ["integer", "null"]
                  }
                },
                "type": "object"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "not_found", "invalid_input", "unavailable"],
                "type": "string"
              },
              "untrusted_source": {
                "type": "boolean"
              }
            },
            "required": ["asOf", "as_of", "note", "notice", "source", "status", "untrusted_source"],
            "type": "object"
          },
