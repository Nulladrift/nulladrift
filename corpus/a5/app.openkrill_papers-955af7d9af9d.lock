              }
            },
            "required": ["ticket"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["pending", "answered"],
                "type": "string"
              },
              "ticket": {
                "type": "string"
              }
            },
            "required": ["status", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
