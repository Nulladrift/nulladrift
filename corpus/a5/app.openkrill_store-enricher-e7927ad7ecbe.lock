            "additionalProperties": false,
            "examples": [
              {
                "url": "allbirds.com"
              }
            ],
            "properties": {
              "check_mail": {
                "description": "Check MX, SPF and DMARC for the first email domains found (true by default)",
                "type": "boolean"
              },
