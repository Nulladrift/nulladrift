                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "max_product_pages": {
                "description": "Pages of the public product feed to read (250 products a page on Shopify, 100 on WooCommerce); 0 skips the catalog; 2 by default",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "The store's domain or home page, such as allbirds.com or https://www.nalgene.com",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
