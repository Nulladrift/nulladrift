      "instructions": "E-Commerce Store Enricher: Store stack, catalog, contacts. Pass the store's domain or home page as url; a bare domain means https. Lead with the platform and the catalog: product count, price range and median, and the newest product date. Say when productCountExact is false that the count is a lower bound. Then list the apps by category, then the emails, phones and social links. mailReady true means the domain takes mail, not that the mailbox exists. phonesUncertain are unconfirmed numbers. If status is blocked_by_robots, tell the user the store asks crawlers not to read it and do not try another way. If status is unreachable, give the reason from notes. Use it for online stores and brands. Never use it to find a private person's contact details or to collect addresses for spam. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "enrich_store",
          "title": "Enrich an online store: platform, catalog, apps and contacts",
          "description": "Reads one online store and returns its platform, catalog figures, installed apps and contact details. Use it when the user asks what a store runs on, how big its catalog is, what it charges, which apps it uses, or how to reach it, such as \"what does allbirds.com run on?\". Pass the store's domain or home page. It returns the platform and Shopify theme, country and currency, the product count with stock and price figures from the public product feed, 5 sample products, 44 detectable apps by category, and contact emails, phones and social links with a mail-ready flag per email domain. It obeys robots.txt and reads public stores only. Don't use it to look up a private person or to collect addresses for bulk mail.",
