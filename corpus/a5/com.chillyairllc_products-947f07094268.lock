        {
          "name": "list_refrigerants",
          "title": "List refrigerants",
          "description": "Refrigerants Chilly Air supplies, with type, available sizes, spec page URL and ordering terms. Quote only: contact for pricing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
