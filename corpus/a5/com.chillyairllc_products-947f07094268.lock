      "serverInfo": {
        "name": "com.chillyairllc/products",
        "title": "Chilly Air Products",
        "version": "1.0.0",
        "websiteUrl": "https://chillyairllc.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only Chilly Air LLC catalog. Prices are shown only where chillyairllc.com shows them; refrigerants are \"Contact for pricing\"; freight-quote items need a delivered quote before ordering. Orders are completed by a person on the website or by contacting Chilly Air (get_quote_link). Never present this server as able to place orders.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Full published details for one product by numeric id, SKU or URL slug: description, attributes, weight/dimensions if published, images, price/ordering and shipping. Only data published on the product page; no invented specs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Product id, SKU (e.g. DHP5036E1000A) or slug.",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b8957ea486d5704fddc7056ebd694ba8122babc4cbc57dcd059048d09da6eb8"
        },
        {
          "name": "get_quote_link",
          "title": "Get contact / quote link",
          "description": "Phone, text, email and contact-page links for a quote. Pass a product id, SKU or slug to get a pre-filled email subject (and the add-to-cart link if the item is sold online). Does not send anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "Optional product id, SKU or slug.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2f5889c0ce2a35316f5fc2b95f70bffdfe7d5db410178eaad21e23cd2d30b33"
        },
        {
          "name": "get_shipping_policy",
          "title": "Get shipping, returns and how-to-order policy",
          "description": "Shipping regions, rates, lead times and freight rules, the refund and returns policy (text as published), and how orders and quotes work.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
