            "readOnly": true
          },
          "digest": "sha256:6163993839a8af5aa69b2383ac5faf528d0be09e9ea8b2750da34f27ce991a0c"
        },
        {
          "name": "list_products",
          "title": "List products",
          "description": "List published Chilly Air products (WooCommerce) with SKU, categories, availability, listed price where the site shows one, shipping summary and how each item is ordered (online checkout or freight quote). Refrigerants are separate: use list_refrigerants.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug from list_categories, e.g. air-handlers.",
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "purchasable_online": {
                "description": "Only items a person can buy through online checkout.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
