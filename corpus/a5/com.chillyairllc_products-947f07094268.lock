        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Keyword search over product name, SKU, short description and category (all words must match). Also returns matching refrigerants (quote only).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "e.g. \"3 ton heat pump\", \"R-410A\", \"filter drier\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
