        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Product categories with slugs, parent category, product counts and URLs (includes the quote-only Refrigerants line).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
