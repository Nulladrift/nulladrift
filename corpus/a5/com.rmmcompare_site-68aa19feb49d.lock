        },
        {
          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the RMMCompare enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:217eab6b683550374d9aeb19e6b5b48c49aca5033af3a549420a6ee515381511"
        },
        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to human providers (two steps; not a purchase)",
          "description": "Submits an enquiry to RMMCompare — NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token — show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before any provider sees it. Consent means the person has read and agreed to: \"By submitting you agree RMMCompare emails you a recommendation and shares nothing else with anyone.\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: By submitting you agree RMMCompare emails you a recommendation and shares nothing else with anyone.",
                "type": "boolean"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5997308382efa4bedb6dd74fdd94550a0b37c3d0498db0c161220ccf9a917c20"
        }
