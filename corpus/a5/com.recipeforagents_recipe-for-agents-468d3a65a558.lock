{
  "lockfileVersion": 2,
  "subjects": {
    "com.recipeforagents/recipe-for-agents": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recipeforagents.com/mcp-server"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "recipe-for-agents",
        "title": "Recipe for Agents",
        "version": "1.0.0",
        "description": "Find the right Apify Actor, n8n recipe or agent skill for a live-web-data job, and get a ready MCP config for your client.",
        "websiteUrl": "https://recipeforagents.com/connect/",
        "icons": [
          {
            "src": "https://recipeforagents.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://recipeforagents.com/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Recipe for Agents answers 'which tool gets my agent this web data, and how do I wire it up?'. It does not run scrapers or return scraped records: it returns the Apify Actor to use, its MCP URL, example input, output fields and price, n8n workflows and setup steps, each with a link to the page on recipeforagents.com. Typical flow: search_tools (or find_recipe for an automation into Sheets/Slack/Notion/HubSpot/email) -> get_tool or get_recipe for the details -> build_mcp_config to add the chosen Actors to the user's MCP client. Running an Actor needs the user's own Apify account (OAuth sign-in or an API token); runs are billed to that account. Use troubleshoot for connection errors (401, 408, 429, client setup). Cite the page URL and its check date.",
      "tools": [
        {
          "name": "build_mcp_config",
          "title": "Build an MCP client config",
          "description": "Ready-to-paste config that adds chosen Actors (or a website's bundle) to an MCP client through Apify's hosted MCP server: Claude Code, Claude Desktop, Cursor, VS Code, ChatGPT, Codex CLI, Gemini CLI or n8n AI Agent, with steps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actors": {
                "description": "Actor ids (owner/name) to include.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "client": {
                "default": "all",
                "enum": ["all", "claude-code", "claude-desktop", "cursor", "vscode", "chatgpt", "codex", "gemini-cli", "n8n-agent"],
                "type": "string"
              },
              "server_name": {
                "description": "Optional server name in the config.",
                "maxLength": 60,
                "type": "string"
              },
              "website": {
                "description": "Or: a website whose main Actors to bundle, e.g. 'TikTok'.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build an MCP client config"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5afcfe98466292997943d4f1b997d9d49225ca30c5a8af945f0f19772c8cd43"
        },
        {
          "name": "find_recipe",
          "title": "Find an automation recipe",
          "description": "Find step-by-step n8n recipes that move live web data into a destination (Google Sheets, Slack, Notion, HubSpot, email, Discord, webhook, Qdrant) for a task such as 'new Zillow listings to Slack', plus matching use cases and agent skills. Suggests Actors when no recipe fits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Optional: where the data should go (Google Sheets, Slack, Notion, HubSpot, Email, Discord, Webhook, Qdrant).",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "task": {
                "description": "What should happen, e.g. 'daily Google Maps leads into a spreadsheet'.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an automation recipe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f3b3970f1ca3d1ca875597f1a527f9f7c1d7218135232900d598fb01266784d"
        },
        {
          "name": "get_recipe",
          "title": "Get a recipe",
          "description": "One recipe in full: what it does, the Actor and input it sends, schedule, de-duplication, setup steps, known limits and, with include_workflow=true, the importable n8n workflow JSON (built-in nodes only).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_workflow": {
                "default": false,
                "description": "Include the n8n workflow JSON (several KB).",
                "type": "boolean"
              },
              "slug": {
                "description": "Recipe slug from find_recipe, or the recipe page URL.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a recipe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e9d606a05c2366d106e55926cce8c3747326c2acff91478f1f4fbfebe5b1bb0"
        },
        {
          "name": "get_tool",
          "title": "Get one Actor's details",
          "description": "Everything published about one catalogue Actor: description, price, required and example input, output fields, MCP URL, configs for Claude Code/Cursor/VS Code/Codex, n8n workflow, SKILL.md and schema files, matching recipes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Actor id owner/name (from search_tools), or its recipeforagents.com or Apify Store URL.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one Actor's details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbf8e949b2850a0bc712ec9ab24e6970687d36b9722b62d83faed595971e9adb"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The catalogue's categories (leads, social, video, products, property, jobs, search, travel, developer utilities) with Actor counts and the main websites in each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf95501e6015602991129244f325681c0e5784b9eaf8868fb847209c93767893"
        },
        {
          "name": "list_websites",
          "title": "List covered websites",
          "description": "Websites the catalogue covers, with the number of Actors for each, its page and one MCP URL bundling its main Actors. Filter by part of the name or by category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["leads", "social", "video", "products", "property", "jobs", "search", "travel", "dev"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a website name, e.g. 'google'.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List covered websites"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d17b7647face764308fd192dc4465c6d43788f147b70c612288d9ab603dcad88"
        },
        {
          "name": "search_tools",
          "title": "Search the catalogue",
          "description": "Find Apify Actors (ready-made scrapers and data tools) an agent can call for a kind of web data, e.g. 'LinkedIn company headcount', 'Amazon prices', 'Google Maps leads with email'. Returns the best matches with website, price, output fields, required input, page and scoped MCP URL. Filter by website or category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this category (keys from list_categories).",
                "enum": ["leads", "social", "video", "products", "property", "jobs", "search", "travel", "dev"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The data you need, in plain words (website, records, fields).",
                "maxLength": 200,
                "type": "string"
              },
              "website": {
                "description": "Only Actors for this website, e.g. 'LinkedIn', 'Zillow'. Also returns that website's bundled MCP URL.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25728207e0ccd8db49d8546111c08b6c1b4c3a0ed4bdf7a884ce7da8b0d75973"
        },
        {
          "name": "troubleshoot",
          "title": "Troubleshoot a connection",
          "description": "Sourced fixes for errors when connecting Apify Actors to Claude, Cursor, VS Code, ChatGPT, Codex, Gemini CLI or n8n (401 unauthorized, 408 timeouts, 429, SSE endpoint gone, tools missing, result too large...).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "description": "Optional: the client, e.g. 'Cursor'.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 3,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "problem": {
                "description": "The error message or symptom.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Troubleshoot a connection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8bc2f2ef4d5a2bccdb445b5e37862976ae2938e0edfdb42d5919ecd1c810e18"
        }
      ],
      "digest": "sha256:3ff2573f97dacf2a5eb5a8593b34ae8b5f8ee4a1bca6057d4e7d582a8b4ce08a"
    }
  }
}
