{
  "lockfileVersion": 2,
  "subjects": {
    "ai.calaf/seeds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://calaf.ai/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "calaf",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Calaf (calaf.ai) is an MBA recruiting manager whose workspaces are stocked from \"seeds\" — single JSON documents any assistant can author. Use get_seed_format (or the seed-format resource) to learn the format, author the seed, then run validate_seed and fix every issue before handing the JSON to the user. This server cannot import anything: the user imports the file themselves at Settings → Workspace → Seeds, where each part is previewed and people are reviewed one by one. Only include a person when you are certain they hold that role today; leave fields blank rather than guessing.",
      "tools": [
        {
          "name": "get_seed_format",
          "title": "Get the Calaf seed file format",
          "description": "Returns the complete specification (markdown) for calaf_seed: 1 JSON documents — the format to follow when a user asks for a Calaf seed. Read it before authoring; then check your draft with validate_seed.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "markdown": {
                "type": "string"
              },
              "uri": {
                "description": "Where the same document lives as a resource.",
                "type": "string"
              }
            },
            "required": ["markdown", "uri"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:66286d5ced71b33a9a3491d02b041adb08775d88af06a0a093641b3835d64de6"
        },
        {
          "name": "validate_seed",
          "title": "Validate a Calaf seed file",
          "description": "Runs a draft seed document through the exact parser the Calaf app imports with. Pass the entire JSON document as a string. Returns per-section counts and the precise issue list (path, severity, message): severity \"error\" means nothing imports; \"dropped\" means that row or field is discarded and the rest lands. Fix the issues and validate again until clean before delivering the file to the user.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "seed": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                ],
                "description": "The complete seed JSON document — as text, or as the JSON object itself."
              }
            },
            "required": ["seed"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "contacts": {
                    "type": "number"
                  },
                  "keyDates": {
                    "type": "number"
                  },
                  "ladderRungs": {
                    "type": "number"
                  },
                  "orgKinds": {
                    "type": "number"
                  },
                  "orgs": {
                    "type": "number"
                  },
                  "prep": {
                    "type": "number"
                  },
                  "templates": {
                    "type": "number"
                  }
                },
                "required": ["contacts", "keyDates", "ladderRungs", "orgKinds", "orgs", "prep", "templates"],
                "type": "object"
              },
              "hasPlanner": {
                "type": "boolean"
              },
              "hasVocab": {
                "type": "boolean"
              },
              "issues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "message": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "dropped"],
                      "type": "string"
                    }
                  },
                  "required": ["message", "path", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["counts", "hasPlanner", "hasVocab", "issues", "valid"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ea72d9f210e6baad6f4eecdcaeefd3b08881002b84a44f443f2c883302945dfa"
        }
      ],
      "resources": [
        {
          "uri": "https://calaf.ai/seed-format.md",
          "name": "seed-format",
          "title": "Calaf seed file format",
          "description": "The complete calaf_seed: 1 JSON format — sections, ceilings, parser behavior, and the rules an assistant should follow when authoring a seed.",
          "mimeType": "text/markdown",
          "digest": "sha256:bd0ac82736eda10e2a0edd9a2429133917fd2027ca43097964c4cc4e4ef6d540"
        }
      ],
      "digest": "sha256:c9918a16c8a6cfd4189446ff95086e1924f608f9abb9936a8042976e8ee259b6"
    }
  }
}
