        {
          "name": "get_southern_hemisphere_report",
          "title": "Southern Hemisphere report",
          "description": "Get snow conditions for Southern Hemisphere ski resorts (Australia, New Zealand, Argentina, Chile) currently in season. Answers \"is Perisher / Portillo / Valle Nevado open right now and what are the current conditions\", \"is the Australian ski season underway\", and \"which Southern Hemisphere region — the Andes, Australia, or NZ — has the best snow right now\". Use for June–October SH ski queries. Prefers operator-verified data when available. Do NOT use for a specific opening DATE — use get_season_openings instead. Note that the SH is not the only place to ski in the northern summer: a handful of NH glaciers run summer or year-round operations (Zermatt/Matterhorn Ski Paradise skis all year; Passo dello Stelvio, Stryn and Galdhøpiggen run deep into autumn; Hintertux, Saas-Fee, Tignes, Les Deux Alpes and Timberline have dated summer windows that close). For those, call get_resort on the named glacier — summer windows are tracked per resort and a glacier being famous for summer skiing does not mean it is open today.",
