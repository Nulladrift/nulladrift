        {
          "name": "subscribe_alerts",
          "title": "Subscribe to snow alerts",
          "description": "Subscribe the signed-in user to snow alerts. Requires a SnowSure user access token (OAuth). type: 'powder' (OBSERVED fresh snow >= thresholdCm in 24h), 'forecast' (the forecast total over windowDays clears thresholdCm — 14 days with Pro or on a resort in My Mountains, 7 otherwise), 'trip' (a Powder Trip — a storm inside 14 days with a curated stay to book — at a resort you name, or on a pass via scope 'pass:ikon-pass' / 'pass:epic-pass' / 'pass:mountain-collective'; scope 'any' is not accepted for trips), 'opening' (resort opens for the season), or 'bluebird' (powder day then clear skies).",
          "inputSchema": {
            "properties": {
              "channel": {
                "description": "Delivery channel (default email)",
                "enum": ["email", "push"],
                "type": "string"
              },
              "scope": {
