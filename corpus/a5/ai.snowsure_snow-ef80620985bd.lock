        {
          "name": "get_snow_report",
          "title": "Global snow report",
          "description": "Get the global snow report with top-ranked resorts by snow conditions. Returns resorts sorted by SnowSure score, forecast, or recent snowfall. Use this for \"where has the best snow?\" or \"top ski resorts right now\" queries. Each row carries forecast7dCm and forecastHorizonDays; forecast14dCm is present only for a caller entitled to the fortnight (SnowSure Pro, or a resort in a signed-in reader's My Mountains), so read forecastHorizonDays before naming a forecast total. Each row also carries forecast7dBands: the free seven days at base, mid and summit, each with the elevation its run was made at — rain at the base can be snow at the summit, so quote the height with the figure.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Number of resorts to return (default: 10, max: 50)",
                "type": "number"
              },
              "region": {
                "description": "Filter by region",
                "enum": ["europe", "north-america", "asia", "oceania", "south-america", "africa"],
                "type": "string"
              },
              "sort": {
                "description": "Sort order: snowsure (AI rating), forecast (forecast snow at the caller's horizon: 7 days, or 14 when entitled; the list's metricKey is forecast7d or forecast14d to match and metricWindowDays states the days), recent (24h snowfall), depth (current base)",
                "enum": ["snowsure", "forecast", "recent", "depth"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "markdown": {
                "description": "Human-readable markdown summary (required for ChatGPT Instant mode).",
                "type": "string"
              },
              "resorts": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "baseDepthCm": {
                      "type": "number"
                    },
                    "country": {
                      "type": "string"
                    },
                    "forecast14dCm": {
                      "description": "SnowSure blended forecast total (cm) over the forward 14 days. Present only when forecastHorizonDays is 14 — a caller entitled to the fortnight (SnowSure Pro, or a signed-in reader on a resort in their My Mountains). Absent or null for an anonymous or free caller: read forecast7dCm instead, and never label it a 14-day total.",
                      "type": "number"
                    },
                    "forecast7dBands": {
                      "description": "The free seven days at each reporting height (SS-W-2343): base, mid and summit, each { band, elevationM, elevationFt, total7dCm } or null when that band has no run. The height is the one the run was made at; quote it beside the figure. Not gated. Null when the row carries no band.",
                      "type": ["object", "null"]
                    },
                    "forecast7dCm": {
                      "description": "SnowSure blended forecast total (cm) over the forward seven days, from the resort’s local today. The free window, served to every caller.",
                      "type": "number"
                    },
