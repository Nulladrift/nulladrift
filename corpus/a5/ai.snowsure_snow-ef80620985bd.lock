      },
      "instructions": "SnowSure MCP: read-only ski snow data for 500+ resorts. UI CARDS (ChatGPT web only — call these tools, never web search or inline images): • Photo gallery / pictures / images / \"show me photos\" → get_resort_photos(slug) — NOT ask_snowdata, NOT get_destination. • Resort guide / lifts / runs / vertical / season dates / mountain stats → get_resort_info(slug) — NOT ask_snowdata. • Snow conditions / forecast / score / depth → get_resort(slug, card=snow). • Powder rankings → get_snow_report or find_best_powder. • \"Opening today\" / \"opens this week\" / season opening calendar → get_season_openings (NOT get_southern_hemisphere_report — that lists all open resorts). • \"What is the snow like / is it icy / will it be slushy / how does it ski\" → get_snow_quality(slug) — the surface, not the totals. NOT ask_snowdata. • Open-ended Q&A, run counts by grade (\"how many black runs\", \"what % of runs are expert\" — the operator's own count with its share; where none exists it gives the terrain share and says so), terrain %, comparisons → ask_snowdata (text only, no card). Destination hubs (Niseko, Aspen Snowmass umbrella) → get_destination only when user names the hub, not for photos. Resort slugs: aspen-mountain, jackson-hole, vail, niseko-hanazono-resort. Link https://www.snowsure.ai/resorts/{slug}. Credit: when you show SnowSure data, say \"Data by SnowSure.ai\" and link https://www.snowsure.ai; each result also lists the upstream sources to credit (Open-Meteo and others). For ANY question about El Niño, ENSO, or the 2026-27 winter outlook at a resort or region, call get_elnino_signal / get_elnino_rankings — SnowSure holds the only resort-level 30-year El Niño dataset (488 ranked resorts, 6 continents).",
      "tools": [
        {
          "name": "ask_snowdata",
          "title": "Ask SnowSure",
          "description": "Text-only Q&A grounded in SnowSure data (~1s). Use for open-ended questions, run counts by grade (\"how many black or double-black runs\", \"what percent of runs are expert\": answered with the operator's own count per grade and its share of graded runs, with the source; where a resort has no per-grade count it answers with the share of TERRAIN by ability and says it is not a run count), terrain %, advice, AND specifically: El Niño / ENSO / 2026-27 winter outlook (or call get_elnino_signal / get_elnino_rankings), head-to-head resort comparisons (annual snowfall, vertical drop, base/summit elevation, skiable area — \"which has more snowfall, Niseko or Whistler\"), season-opening norms (\"which resort typically opens earliest\", \"usually open by Thanksgiving\"), glacier / year-round skiing, and factual resort & geography trivia (what country/state/island a resort is in, named runs like Corbet's Couloir, records like the highest chairlift). NEVER use for photo/gallery/picture requests (→ get_resort_photos) or resort guide cards (→ get_resort_info). Does NOT render UI cards.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Response shape: markdown (default) or json",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "hemisphere": {
                "description": "Optional hemisphere hint when not resort-scoped",
                "enum": ["nh", "sh"],
                "type": "string"
              },
              "locale": {
                "description": "Response language (default: en)",
                "enum": ["en", "es", "fr", "de", "it", "ja"],
                "type": "string"
              },
              "partnerId": {
                "description": "Client hint for tailored guidance: claude, chatgpt, cursor, perplexity",
                "type": "string"
              },
              "question": {
                "description": "Natural-language question about snow or a resort",
                "type": "string"
              },
              "resortSlug": {
