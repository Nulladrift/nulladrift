        {
          "name": "get_season_leaderboard",
          "title": "Season leaderboard by place",
          "description": "Rank resorts by how a season actually went, scoped to a place. This is the tool for \"which <place> resort had the most <metric> last season\" — the single most common retrospective question agents ask. Scope by state or province (Maine, Montana, Wyoming, British Columbia, Hokkaido, Nagano, Valais, Tyrol), by country (Switzerland, Japan, Canada), or by region (north-america, europe, asia, oceania, south-america, or a colloquial range: alps, andes, rockies, scandinavia). Metrics: snow_days, total_cm, powder_days, bluebird_days, max_storm (biggest single 24h snowfall, with the date it fell), peak_depth, longest_dry_spell. Covers 30 seasons back to 1996, so it answers historical and multi-season questions too, not just last season. Season accepts 2025, \"2025-26\", 2026, or \"last\" and resolves them all to the same season. Backed by ERA5 reanalysis across the full season window, so figures cover the entire season rather than only the days SnowSure has been live. Use get_snow_history for ONE resort's own history, get_monthly_snow for typical month-by-month climatology, and get_snow_report or find_best_powder for conditions RIGHT NOW.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "All fields optional. Defaults: metric=total_cm, hemisphere=nh, season=latest, limit=10, worldwide.",
            "properties": {
              "country": {
                "description": "Country name, e.g. Switzerland or Japan.",
                "type": "string"
              },
              "hemisphere": {
                "description": "Northern (nh, default) or southern (sh) hemisphere season.",
                "enum": ["nh", "sh"],
                "type": "string"
              },
              "limit": {
                "description": "How many resorts to return (default 10, max 50).",
                "type": "number"
              },
              "metric": {
                "description": "What to rank by. max_storm = biggest single 24-hour snowfall of the season.",
                "enum": ["snow_days", "total_cm", "powder_days", "bluebird_days", "max_storm", "peak_depth", "longest_dry_spell"],
                "type": "string"
              },
              "region": {
                "description": "north-america, europe, asia, oceania, south-america, or a colloquial range: alps, andes, rockies, scandinavia.",
                "type": "string"
              },
              "season": {
                "description": "Season to rank. Accepts a year (2025), a label (\"2025-26\"), the ending year (2026), or \"last\"/\"latest\". Northern-hemisphere seasons are keyed on their starting year.",
                "type": "string"
              },
              "state": {
                "description": "State, province or equivalent: Maine, Montana, British Columbia, Hokkaido, Valais, Tyrol.",
                "type": "string"
