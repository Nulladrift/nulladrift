              "resorts": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "baseDepthCm": {
                      "type": "number"
                    },
                    "country": {
                      "type": "string"
                    },
                    "forecast14dCm": {
                      "description": "SnowSure blended forecast total (cm) over the forward 14 days. Present only when forecastHorizonDays is 14 — a caller entitled to the fortnight (SnowSure Pro, or a signed-in reader on a resort in their My Mountains). Absent or null for an anonymous or free caller: read forecast7dCm instead, and never label it a 14-day total.",
                      "type": "number"
                    },
                    "forecast7dBands": {
                      "description": "The free seven days at each reporting height (SS-W-2343): base, mid and summit, each { band, elevationM, elevationFt, total7dCm } or null when that band has no run. The height is the one the run was made at; quote it beside the figure. Not gated. Null when the row carries no band.",
                      "type": ["object", "null"]
                    },
                    "forecast7dCm": {
                      "description": "SnowSure blended forecast total (cm) over the forward seven days, from the resort’s local today. The free window, served to every caller.",
                      "type": "number"
                    },
                    "forecastHorizonDays": {
                      "description": "The forecast horizon this caller is entitled to: 14 with SnowSure Pro or on a resort in a signed-in reader’s My Mountains, 7 otherwise. Read it before naming any forecast total.",
                      "type": "number"
                    },
                    "forecastPoint": {
                      "description": "The height forecast7dCm / forecast14dCm were made at (SS-W-2268): { band, elevationM, elevationFt }, band being the headline reporting height (mid or summit). Quote it beside the total. Absent when the row knows no height.",
                      "type": ["object", "null"]
