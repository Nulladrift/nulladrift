                      "type": "string"
                    },
                    "snowSureScore": {
                      "type": "number"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["country", "isOpen", "name", "rank", "slug", "url"],
                  "type": "object"
