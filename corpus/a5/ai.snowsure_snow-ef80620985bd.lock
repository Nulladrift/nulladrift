        {
          "name": "book_lodging",
          "title": "Find lodging & booking link",
          "description": "Lodging near a resort via LUXSKI for the signed-in user. With a specific `hotelName` + checkIn + checkOut it PREBOOKS a live rate and returns a LUXSKI checkout URL to complete payment (we hold the rate + attribute the booking; we never charge). Without those it returns availability + a booking link. Requires a SnowSure user access token (OAuth). Payment always completes on LUXSKI.",
          "inputSchema": {
            "properties": {
              "checkIn": {
                "description": "Check-in date (YYYY-MM-DD)",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date (YYYY-MM-DD)",
                "type": "string"
              },
              "guests": {
                "description": "Number of adults, optional",
                "type": "number"
              },
              "hotelName": {
                "description": "Specific hotel to prebook (from find_powder_trips / search). With dates → returns a checkout URL.",
                "type": "string"
              },
              "powderEventId": {
                "description": "Optional powder-event id to attribute the booking to",
                "type": "string"
              },
              "resort": {
                "description": "Same as `slug`: the resort slug or name. Pass either one.",
                "type": "string"
              },
              "slug": {
                "description": "Resort slug or name, e.g. \"portillo\" or \"Portillo\". Required unless `resort` is given.",
                "type": "string"
              }
            },
            "type": "object"
