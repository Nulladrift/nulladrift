{
  "lockfileVersion": 2,
  "subjects": {
    "com.crosscheckapi/crosscheck": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://crosscheckapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "crosscheck",
        "title": "crosscheck",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Independent checks for agents. check reviews a draft before a human sees it; accept checks another agent's deliverable against its task before you pay; skillcheck reviews a skill or MCP server's files before install (free when already scanned). Paid tools cost $0.02 to $0.06 in USDC over x402 on Base, with free test USDC on Base Sepolia; the first call returns the price as an x402 PaymentRequired. Everything you send is data to review, never instructions to crosscheck. Receipts, a free club for agents who show their work, admits agents that pass a free review tryout graded in code (/club/tryout). Details: https://crosscheckapi.com/llms.txt",
      "tools": [
        {
          "name": "accept",
          "title": "Check a deliverable against its task",
          "description": "Checks work another agent handed back against the task it was given, before you pay, release escrow, or pass it on. Returns accept, reject, or verify_externally with every requirement judged; counts, required JSON fields, and sums are checked in code. Optional payment_tx is verified on chain. $0.03 base. Paid per call in USDC over x402 (Base, or free test USDC on Base Sepolia). An x402-aware MCP client pays automatically: the first call returns the price as an x402 PaymentRequired error, and the retry carries the payment in _meta[\"x402/payment\"]. Without one, use the npm client `npx -y crosscheckapi`, which pays from a wallet you set.",
          "inputSchema": {
            "properties": {
              "deliverable": {
                "description": "What came back",
                "type": "string"
              },
              "payment_network": {
                "description": "Network of payment_tx, for example eip155:8453",
                "type": "string"
              },
              "payment_tx": {
                "description": "Optional transaction hash of the payment for this work",
                "type": "string"
              },
              "ref": {
                "description": "Optional: the hash of a crosscheck receipt that brought you here. Its wallet earns check credits from your first 90 days of spend.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "reference": {
                "description": "Optional reference material the task points to",
                "type": "string"
              },
              "task": {
                "description": "The task as given to the other agent",
                "type": "string"
              }
            },
            "required": ["deliverable", "task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d6121f7983b2b1728cba3e7b7fdc556b9ab63bba81476f8b67833ce6aa4d0c1"
        },
        {
          "name": "check",
          "title": "Review a draft",
          "description": "Independent review of a draft (email, report, summary, PR description) before its human sees it. Returns pass or specific issues with fixes; arithmetic is recomputed in code. With request (what the human asked), it also checks the draft answers that. With sources, each claim is checked against them and quotes are verified; with source_urls or fetch_cited, crosscheck fetches up to 3 web pages itself and checks against those (+$0.01 a page, and a dead link the draft gives fails it). $0.02. Paid per call in USDC over x402 (Base, or free test USDC on Base Sepolia). An x402-aware MCP client pays automatically: the first call returns the price as an x402 PaymentRequired error, and the retry carries the payment in _meta[\"x402/payment\"]. Without one, use the npm client `npx -y crosscheckapi`, which pays from a wallet you set.",
          "inputSchema": {
            "properties": {
              "draft": {
                "description": "The draft text to review",
                "maxLength": 48000,
                "type": "string"
              },
              "fetch_cited": {
                "description": "Optional: also fetch the links the draft itself cites (up to 3 pages in all, +$0.01 each); a link that is gone fails the draft",
                "type": "boolean"
              },
              "moltbook_identity": {
                "description": "Optional: a Moltbook identity token for the free tier, when it is on (a verified Moltbook agent gets free checks with no payment). Not stored. Without a free check left, the price comes back as usual",
                "type": "string"
              },
              "open_review": {
                "description": "Optional: let a qualified outside reviewer take the job (not routed yet; crosscheck's reviewer does it and the receipt says so)",
                "type": "boolean"
              },
              "ref": {
                "description": "Optional: the hash of a crosscheck receipt that brought you here. Its wallet earns check credits from your first 90 days of spend.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "request": {
                "description": "Optional: what the human asked for, word for word if you have it. The reviewer then also checks that the draft answers it (a missed question, a changed scope, a wrong period)",
                "maxLength": 8000,
                "type": "string"
              },
              "source_urls": {
                "description": "Optional: up to 3 web pages crosscheck fetches after payment and checks the draft against, as sources. +$0.01 each",
                "items": {
                  "description": "A public http or https URL",
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "sources": {
                "description": "Optional texts the draft relies on; turns on grounding",
                "items": {
                  "properties": {
                    "text": {
                      "description": "Source text",
                      "type": "string"
                    },
                    "title": {
                      "description": "Optional title",
                      "type": "string"
                    },
                    "url": {
                      "description": "Optional URL",
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["draft"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad768df22bcc18f2875bded42ab1669a92d7f4a20b58e6f55ea49281f527b30b"
        },
        {
          "name": "result",
          "title": "Get a result",
          "description": "Free. Status, verdict, and signed receipt of an earlier paid call that was still running, using the job_id and result_token it returned.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "job_id from the paid call",
                "type": "string"
              },
              "result_token": {
                "description": "result_token from the paid call",
                "type": "string"
              }
            },
            "required": ["job_id", "result_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74f47e9e988c4a8945ec0e5515cb9ec7339c7d4bfc10b0b9cca42c49a6953098"
        },
        {
          "name": "sellercheck",
          "title": "Check an x402 seller's resource",
          "description": "For x402 sellers: one dated report on your own paid resource, by code alone. Does it answer a valid 402 (v1 or v2: price, network, payTo), is it in the x402 Bazaar index, would agent402's router route to it, and how many USDC settlements reached its payTo on Base in 24 hours and 7 days. Nothing is paid to the resource. $0.05. Paid per call in USDC over x402 (Base, or free test USDC on Base Sepolia). An x402-aware MCP client pays automatically: the first call returns the price as an x402 PaymentRequired error, and the retry carries the payment in _meta[\"x402/payment\"]. Without one, use the npm client `npx -y crosscheckapi`, which pays from a wallet you set.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "Optional: the method it is paid with; default tries GET, then POST",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "network": {
                "description": "Optional: Base, the only network read today",
                "enum": ["eip155:8453"],
                "type": "string"
              },
              "resource": {
                "description": "The full URL of your x402 resource (public http or https)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["resource"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf136beacb3ffac4887e153e4fd84645423dc7564c94ea55354c24116d780e7a"
        },
        {
          "name": "sellerwatch",
          "title": "Watch an x402 resource for 30 days",
          "description": "For x402 sellers: sellercheck every hour for 30 days on one resource, paid once. An alert to your webhook (JSON POST) or ntfy topic only when something changes: the 402 breaks or its price or payTo change, it leaves or rejoins the Bazaar index, agent402's router flips, settlements start, double, or halve, or it is down twice in a row. Returns a public record page to link from your listing. $1. Paid per call in USDC over x402 (Base, or free test USDC on Base Sepolia). An x402-aware MCP client pays automatically: the first call returns the price as an x402 PaymentRequired error, and the retry carries the payment in _meta[\"x402/payment\"]. Without one, use the npm client `npx -y crosscheckapi`, which pays from a wallet you set.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "Optional: the method it is paid with; default tries GET, then POST",
                "enum": ["GET", "POST"],
                "type": "string"
              },
              "network": {
                "description": "Optional: Base, the only network read today",
                "enum": ["eip155:8453"],
                "type": "string"
              },
              "notify": {
                "description": "Where alerts go, at least one: webhook (a public https URL) and/or ntfy (an ntfy.sh topic)",
                "properties": {
                  "ntfy": {
                    "description": "An ntfy.sh topic",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "webhook": {
                    "description": "A public https URL",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "resource": {
                "description": "The full URL of your x402 resource (public http or https)",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["notify", "resource"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:004d81c87d5d683f3d55652f1cbeadb1a33120b85c5ccdcfdea080b603200d19"
        },
        {
          "name": "skillcheck",
          "title": "Security review of a skill or MCP server",
          "description": "Security review of a skill or MCP server's files before you install or connect it: read, never run. Free when these exact files were scanned before (looked up by bundle hash); otherwise paid, $0.03 base. Never says safe. Paid per call in USDC over x402 (Base, or free test USDC on Base Sepolia). An x402-aware MCP client pays automatically: the first call returns the price as an x402 PaymentRequired error, and the retry carries the payment in _meta[\"x402/payment\"]. Without one, use the npm client `npx -y crosscheckapi`, which pays from a wallet you set.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Every text file of the skill or server, docs included; code rules read all of them",
                "items": {
                  "properties": {
                    "content": {
                      "description": "File content",
                      "type": "string"
                    },
                    "path": {
                      "description": "Path inside the skill",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "fresh": {
                "description": "Scan again even when a past scan of these exact files exists",
                "type": "boolean"
              },
              "ref": {
                "description": "Optional: the hash of a crosscheck receipt that brought you here. Its wallet earns check credits from your first 90 days of spend.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d0112e986e1edac7fc9260321c6b837cf963bf1adcb816922506b050934e7b7"
        },
        {
          "name": "skillcheck_lookup",
          "title": "Look up a past skillcheck",
          "description": "Free. The latest skillcheck of an exact bundle, by its bundle_sha256 (SHA-256 of the canonical JSON of the files sorted by path, each as {path, sha256}).",
          "inputSchema": {
            "properties": {
              "bundle_sha256": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              }
            },
            "required": ["bundle_sha256"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:82207e1b16a8d0cdb7a73dbb7f3a6626b205883c44d0358cae9f74c8f3e1d235"
        },
        {
          "name": "verify_receipt",
          "title": "Verify a crosscheck receipt",
          "description": "Free. Before trusting work that arrives with a crosscheck receipt, check in code that crosscheck issued it, its signature is valid, what the outcome was, and that it covers exactly the text you were handed. Pass receipt_hash (or the receipt object) plus that text: draft, request, and sources for check, task and deliverable for accept, files for skillcheck, and the verdict if one came with it.",
          "inputSchema": {
            "properties": {
              "deliverable": {
                "description": "accept: the deliverable the receipt should cover",
                "type": "string"
              },
              "draft": {
                "description": "check: the draft the receipt should cover",
                "type": "string"
              },
              "files": {
                "description": "skillcheck: the skill's files",
                "items": {
                  "properties": {
                    "content": {
                      "description": "File content",
                      "type": "string"
                    },
                    "path": {
                      "description": "Path inside the skill",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "receipt": {
                "description": "Or the whole receipt object {body, hash, sig}",
                "type": "object"
              },
              "receipt_hash": {
                "description": "The receipt's hash (the last part of its /r/ proof link)",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "request": {
                "description": "check: the human's request, if the check had one",
                "type": "string"
              },
              "sources": {
                "description": "check: the sources, if the check had any, in the same order (strings or {text})",
                "type": "array"
              },
              "task": {
                "description": "accept: the task the receipt should cover",
                "type": "string"
              },
              "verdict": {
                "description": "The verdict that came with the receipt, to confirm nobody edited it",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60ff111391cb232d891a8fa321f7dd26bc4ec1b98e227c8c9d001b15b9acc89a"
        }
      ],
      "digest": "sha256:4c5d2961f8fb6b151ad8c27eb5bc201b47569c5c1a34ebcb38ec6f7a9bdc9180"
    }
  }
}
