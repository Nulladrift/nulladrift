{
  "lockfileVersion": 2,
  "subjects": {
    "app.pixever/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pixever.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pixever-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "pixever_info",
          "description": "Identidad y estado público de un Pixever: nombre (si está disclosed), privacidad, estado de ciclo de vida, y la vida free — `state` ('open'|'closed'), `open_until` (hasta cuándo sigue abierto a contenido nuevo) y `risk_counter_active` (true solo en los 7 días previos a un corte de extensión, fin de mes 3/4/5). Si está cerrado, lo dice junto con desde cuándo (`closed_since`) — sin ofrecer subida. Solo lectura.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Slug del Pixever, p.ej. 'boda-maria'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1c0f2d3d48ab9beac376cb8f5e45cd7447810c51551e49b73dde084ca5be83a"
        },
        {
          "name": "pixever_interactions",
          "description": "Agregado de interacciones de un media: `star` (count, recent_actors, starred_by_me), `reactions` (chips con conteos, recent_actors) y `views` (count). `token` es opcional en espacios públicos; en closed/semi_private se requiere identidad (x-guest-token) o un x-view-secret válido ya resuelto por el host. Solo lectura, devuelve el agregado tal cual.",
          "inputSchema": {
            "properties": {
              "media_id": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "token": {
                "description": "Token de invitado (x-guest-token) opcional — nunca se guarda ni se loguea.",
                "type": "string"
              }
            },
            "required": ["media_id", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e3233678f975602a3d144d976c0843b192e7d3cac5a8de5fe3a861b98fe6080"
        },
        {
          "name": "pixever_media_list",
          "description": "Lista paginada (cursor-based) de media visible del feed de un Pixever. Pixevers públicos no requieren `token`; cerrados/semi-privados sí (el x-guest-token de un invitado ya registrado). Usa `pageInfo.endCursor` de la respuesta como `after` para pedir la siguiente página. Solo lectura.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "Cursor opaco de `pageInfo.endCursor` de una llamada previa.",
                "type": "string"
              },
              "limit": {
                "description": "Default 20, máximo 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "type": "string"
              },
              "token": {
                "description": "Token de invitado (x-guest-token) ya emitido — nunca se guarda ni se loguea.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8536b4284317d71d5eef4fcef30a32239bbb2a1ff884f71efcf808d1f78418c"
        },
        {
          "name": "pixever_react",
          "description": "Reacciona a un media con un emoji del catálogo, o quita la reacción propia (`remove:true`). Requiere `token` (x-guest-token) — sin identidad de invitado no hay reacción. `emoji` es requerido salvo con `remove:true` (uno de ❤️ 😂 😮 😢 🔥 👏). Con `remove:true` se ignora `emoji` y se usa DELETE. Errores reales de la API (429 `REACTION_RATE_LIMITED`, etc.) se devuelven como `ok:false` con su `code`, nunca como éxito inventado.",
          "inputSchema": {
            "properties": {
              "emoji": {
                "description": "Requerido si remove no es true. Uno de: ❤️ 😂 😮 😢 🔥 👏",
                "type": "string"
              },
              "media_id": {
                "type": "string"
              },
              "remove": {
                "description": "true quita la reacción propia (DELETE) en vez de crearla/actualizarla; ignora emoji.",
                "type": "boolean"
              },
              "slug": {
                "type": "string"
              },
              "token": {
                "description": "Token de invitado (x-guest-token) ya emitido — requerido. Nunca se guarda ni se loguea.",
                "type": "string"
              }
            },
            "required": ["media_id", "slug", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f074dcf3227fcfcae1b2a9890c3773ec2ba8f9d0c2d011f71496e07cc0bc798f"
        },
        {
          "name": "pixever_star",
          "description": "Pone o quita la estrella de un media — funciona como un 'like': el toggle la pone si no estaba, o la quita si ya estaba. Requiere `token` (x-guest-token) — sin identidad de invitado no hay estrella. Devuelve `starred` (estado después del toggle) y `count` (total de estrellas del media). Errores reales de la API se devuelven como `ok:false` con su `code` cuando la API lo tipa, nunca como éxito inventado.",
          "inputSchema": {
            "properties": {
              "media_id": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "token": {
                "description": "Token de invitado (x-guest-token) ya emitido — requerido. Nunca se guarda ni se loguea.",
                "type": "string"
              }
            },
            "required": ["media_id", "slug", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01c5373dd60dea8495d27af887896e697ff3cbc8f2b5b55526ab58c5dc16b87c"
        },
        {
          "name": "pixever_upload_link",
          "description": "Construye la URL pública de la puerta de subida (/p/:slug) de un Pixever, agregando el acceso del invitado como ?access= si se provee `token`. Si el espacio está cerrado (vida free agotada), no ofrece el enlace: devuelve `ok:false` con `code: FREE_LIFE_CLOSED` y un mensaje en positivo (sigue visible para siempre, ya no entra contenido nuevo, Obtén Pro). No emite ni valida el token — solo lo adjunta cuando el espacio está abierto; la validación ocurre al abrir el enlace. Solo lectura.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              },
              "token": {
                "description": "Acceso (puerta×alcance) ya emitido por el host — nunca se guarda ni se loguea.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:09e667b0d852f0fdb194bf441a348209c7adcafa62f63b082b02a5f2c4535c7a"
        },
        {
          "name": "pixever_upload_media",
          "description": "ÚNICA tool de escritura: descarga una imagen pública desde `source_url` y la sube a `POST /api/v1/pixevers/:slug/media` a nombre del invitado dueño de `token` (x-guest-token, requerido — sin token no hay escritura). Solo imágenes (jpeg/png/webp/heic/heif, máx 20 MB); no video, no creación de Pixevers, no moderación. `source_url` debe ser https pública y no resolver a una red interna — se rechaza si no cumple, sin tocar la red. Si el espacio ya cerró su vida free, rechaza con `ok:false` y `code: FREE_LIFE_CLOSED` (mensaje en positivo: sigue visible para siempre, ya no entra contenido nuevo, Obtén Pro) — nunca por un reloj de 48h (retirado, ya no existe).",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              },
              "source_url": {
                "description": "URL https pública de la imagen a guardar. Nunca se loguea.",
                "type": "string"
              },
              "token": {
                "description": "Token de invitado (x-guest-token) ya emitido — requerido. Nunca se guarda ni se loguea.",
                "type": "string"
              }
            },
            "required": ["slug", "source_url", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2be54f260576d571cdae38db36f4735a2004f84da828962d8ea4a0dcb921912"
        }
      ],
      "digest": "sha256:2a6db6ef23fc534c71f2f4d68acd542a4a63f0f4aa5c987b7fa287cef219a954"
    }
  }
}
