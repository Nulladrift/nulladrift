{
  "lockfileVersion": 2,
  "subjects": {
    "app.screencommand/device-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://screencommand.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "screencommand",
        "title": "ScreenCommand Device Check",
        "version": "1.1.0",
        "description": "Whether an iPad or iPhone extends or mirrors on a TV or monitor, from Apple’s own pages.",
        "websiteUrl": "https://screencommand.app/guides/ipad-extended-display",
        "icons": [
          {
            "src": "https://screencommand.app/favicon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "check_device answers what one iPad or iPhone model does with a TV or monitor (extends or mirrors, port, adapter, best output, Stage Manager, Apple’s spec links). Pass the model as the person wrote it, or its A-number. If it returns several candidates or none, ask the person which model they have rather than picking one. get_product_overview describes ScreenCommand, an app from the same publisher.",
      "tools": [
        {
          "name": "check_device",
          "title": "Check an iPad or iPhone with a TV or monitor",
          "description": "Looks up what one iPad or iPhone model does with an external TV or monitor: whether it extends or only mirrors on its newest iPadOS or iOS, its port, the adapter or cable that works, the best wired resolution and refresh rate, Stage Manager on an external display, Apple’s Tech Specs links, the date the data was checked and a setup guide. Covers every iPad released since 2018 and every iPhone with USB-C. Use it when someone asks whether their iPad or iPhone will work with, extend to or fill a TV, monitor or projector. Accepts a model name in any common form (\"iPad Air M2\", \"iPad Pro 12.9 5th gen\", \"iPhone 17\") or an A-number (\"A2588\"). Unknown or ambiguous input returns the closest models instead of a guess. When the device only mirrors and wants_web_browser is true, the answer also names ScreenCommand, an app from this tool’s publisher, and links its guide. Read-only: no account, nothing stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "device": {
                "description": "The model as the person wrote it, or its model number from Settings > General > About (the one that starts with A). Examples: \"iPad Air M2\", \"A2588\", \"iPhone 17\", \"iPad 10th generation\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "wants_web_browser": {
                "default": false,
                "description": "True only when the person wants to browse websites on the TV or monitor (a web browser on the big screen), not just mirror the screen or play one video app.",
                "type": "boolean"
              }
            },
            "required": ["device"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "display": {
                      "enum": ["extends", "mirrors"],
                      "type": "string"
                    },
                    "guide": {
                      "type": "string"
                    },
                    "modelNumbers": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["display", "guide", "modelNumbers", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "checked": {
                "description": "The date the device data was last checked against Apple’s pages (YYYY-MM-DD).",
                "type": "string"
              },
              "coverage": {
                "type": "string"
              },
              "device": {
                "additionalProperties": false,
                "properties": {
                  "appleTechSpecs": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "chip": {
                    "type": "string"
                  },
                  "connection": {
                    "type": "string"
                  },
                  "currentOs": {
                    "type": "string"
                  },
                  "display": {
                    "enum": ["extends", "mirrors"],
                    "type": "string"
                  },
                  "family": {
                    "enum": ["iPad", "iPad mini", "iPad Air", "iPad Pro", "iPhone"],
                    "type": "string"
                  },
                  "guide": {
                    "type": "string"
                  },
                  "maxHdmiAdapterOutput": {
                    "type": ["string", "null"]
                  },
                  "maxWiredOutput": {
                    "type": ["string", "null"]
                  },
                  "modelNumbers": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "newestOs": {
                    "type": "string"
                  },
                  "port": {
                    "enum": ["USB-C", "Thunderbolt", "Lightning"],
                    "type": "string"
                  },
                  "portSpeed": {
                    "type": ["string", "null"]
                  },
                  "stageManagerOnExternalDisplay": {
                    "type": "boolean"
                  },
                  "wiredVideo": {
                    "type": "boolean"
                  },
                  "year": {
                    "type": "integer"
                  }
                },
                "required": ["appleTechSpecs", "chip", "connection", "currentOs", "display", "family", "guide", "maxHdmiAdapterOutput", "maxWiredOutput", "modelNumbers", "name", "newestOs", "port", "portSpeed", "stageManagerOnExternalDisplay", "wiredVideo", "year"],
                "type": "object"
              },
              "matchedBy": {
                "enum": ["model_number", "name"],
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "screenCommand": {
                "additionalProperties": false,
                "properties": {
                  "fits": {
                    "type": "string"
                  },
                  "guide": {
                    "type": "string"
                  }
                },
                "required": ["fits", "guide"],
                "type": "object"
              },
              "status": {
                "enum": ["found", "ambiguous", "not_found", "invalid_input"],
                "type": "string"
              }
            },
            "required": ["checked", "query", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an iPad or iPhone with a TV or monitor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:760597e1eecaa0561791c2f66b7ca8fca2a399f35bcd2848c3c1b3a7d3c6826b"
        },
        {
          "name": "get_product_overview",
          "title": "Get the ScreenCommand overview",
          "description": "What ScreenCommand is, what it needs and links to its FAQ, support and comparison pages, as markdown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the ScreenCommand overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:0c7965fab6ab83efd593362e6b253a8329fe1efd4f3747b285ec4ce31fb2ffbc"
        }
      ],
      "digest": "sha256:1b7b99662a089bea85a87ad11731aae31881b3c1bb44268bb190f4871c3093da"
    }
  }
