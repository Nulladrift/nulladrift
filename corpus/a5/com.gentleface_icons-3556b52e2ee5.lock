      "instructions": "Gentleface: free, MIT-licensed icons, each drawn separately for the 16, 20 and 24 px pixel grids (24 in light, regular and bold weights), in 6 styles (line or solid; round, soft or sharp corners).\nHow to use it well:\n1. Before building a screen, list every meaning it needs an icon for (settings, delete, invite user…), then call search_icons once per meaning.\n2. Read each result's use_for, and on get_icon its alternatives, dont_confuse_with and not_for: one motif should mean one thing across the project.\n3. Fetch the code with get_icons (several at once) or get_icon. Formats: svg, react, vue, svelte, img, css, data, sprite, swiftui, compose, android, flutter.\n4. Styles have jobs: line is the default; the solid twin of the same icon marks the selected or active state (the current tab, a toggled favorite, bookmark or like, a pinned item), so only the fill changes. Never solid for emphasis or decoration, never line and solid mixed otherwise. One corner style (round, soft or sharp) for the whole project.\n5. Size: pick the master for the size the icon shows at, with size (16, 20 or 24): 16 for dense desktop UI, 20 for desktop toolbars and sidebars, 24 for touch and mobile. Never scale one master to another size (a 16 at 20 or 24 blurs); exact multiples (32, 48 from 16) are fine. Render on whole pixels.\n6. Weight (24 only, with weight): regular by default. Within one list, toolbar or tab bar keep one weight; use light for secondary features and bold for the one or two most important actions only when they sit in different groups.\n7. The code is decorative (aria-hidden). For an icon that carries meaning on its own (an icon-only button), label the control.\n8. Some icons also come animated (16 px): search_icons marks them with animated, and get_icon returns motion (the SVG, a React component, and the times to play it on hover or click), and more_motions where there are others, such as eye's reveal and hide toggle. For a toggle (bookmark, like, show password) prefer the animated transition. Patterns: https://gentleface.com/animated-icons.md\n9. Specificity follows the meaning, not the app's audience. Use a subtype icon only when that subtype is what the control is about, and then the exact one the results and their alternatives name (for a trucking app's assigned vehicle that may be a semi, not a generic truck); otherwise the generic icon. Test: swap the label for the generic word; if it still fits, use the generic icon. People: generic roles (profile, account, member, author, customer, patient, doctor) get the neutral user or users, even in a women's or kids' app; use family when family is the subject. If the audience seems to imply a subtype, ask the user and record the choice.\nThe code is self-contained. React projects can install it instead: npm i @gentleface/react (16 px), @gentleface/react-20 or @gentleface/react-24 (prop weight), version 0.8.0; get_icon returns the import. Full catalog: https://gentleface.com/llms.txt",
