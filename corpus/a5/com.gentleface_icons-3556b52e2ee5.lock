      "serverInfo": {
        "name": "gentleface",
        "title": "Gentleface icons",
        "version": "2026-11-18"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gentleface: free, MIT-licensed icons drawn on the 16 px pixel grid, in 6 styles (line or solid; round, soft or sharp corners).\nHow to use it well:\n1. Before building a screen, list every meaning it needs an icon for (settings, delete, invite user…), then call search_icons once per meaning.\n2. Read each result's use_for, and on get_icon its alternatives, dont_confuse_with and not_for: one motif should mean one thing across the project.\n3. Fetch the code with get_icons (several at once) or get_icon, in ONE style for the whole project. Formats: svg, react, vue, svelte, img, css, data, sprite, swiftui, compose, android, flutter.\n4. Render at 16 px or an exact multiple (32, 48) on whole pixels; a fractional size or position blurs the icon.\n5. The code is decorative (aria-hidden). For an icon that carries meaning on its own (an icon-only button), label the control.\n6. Some icons also come animated: search_icons marks them with animated, and get_icon returns motion (the SVG, a React component, and the times to play it on hover or click), and more_motions where there are others, such as eye's reveal and hide toggle. Patterns: https://gentleface.com/animated-icons.md\n7. Specificity follows the meaning, not the app's audience. Use a subtype icon only when that subtype is what the control is about, and then the exact one the results and their alternatives name (for a trucking app's assigned vehicle that may be a semi, not a generic truck); otherwise the generic icon. Test: swap the label for the generic word; if it still fits, use the generic icon. People: generic roles (profile, account, member, author, customer, patient, doctor) get the neutral user or users, even in a women's or kids' app; use family when family is the subject. If the audience seems to imply a subtype, ask the user and record the choice.\nThe code is self-contained. React projects can install it instead: npm i @gentleface/react (version 0.7.0); get_icon returns the import. Full catalog: https://gentleface.com/llms.txt",
      "tools": [
        {
          "name": "get_category",
          "title": "Icons in a category",
          "description": "Every icon in one category (slug from list_categories), with what each is for.",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c42e087eda7b0c63c489e49cfd1227ed96bbb180d56abe172ab47faedd0cf7ca"
        },
        {
          "name": "get_icon",
          "title": "Get an icon as code",
          "description": "One icon in one style and format, with what it means, which icons to use instead, what it is confused with, file URLs (SVG, PNG 16/32/48), its family and, when it has one, its animated version (motion).",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "svg",
                "enum": ["svg", "react", "vue", "svelte", "img", "css", "data", "sprite", "swiftui", "compose", "android", "flutter"],
                "type": "string"
              },
              "name": {
                "description": "Icon name, kebab-case (from search_icons)",
                "type": "string"
              },
              "style": {
                "default": "line-round",
                "enum": ["line-round", "line-soft", "line-sharp", "solid-round", "solid-soft", "solid-sharp"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f17ce1345e1c9b6b0a16e1bd2800e5c0e015036e58af9cc251ccfde9c88dd56"
        },
        {
          "name": "get_icons",
          "title": "Get several icons as code",
          "description": "Up to 30 icons in one style and format in one call: the way to fetch every icon a screen needs once you have picked them.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "svg",
                "enum": ["svg", "react", "vue", "svelte", "img", "css", "data", "sprite", "swiftui", "compose", "android", "flutter"],
                "type": "string"
              },
              "names": {
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "style": {
                "default": "line-round",
                "enum": ["line-round", "line-soft", "line-sharp", "solid-round", "solid-soft", "solid-sharp"],
                "type": "string"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28deaf468918854fd925099867fe7bcd7ebe72db554429a679f66d663a359da5"
        },
