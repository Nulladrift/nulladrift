      "instructions": "Simple Easy Transactions (SET) sells two $1.00 checks for agents: an Agent Payment Readiness Assessment and an AI Visibility Check. Call list_paid_services first. Paid tools answer JSON-RPC error -32042 with a Machine Payments Protocol challenge when unpaid; pay it in-protocol, or send Authorization: Bearer <SET Agent Credits key> on the HTTP request, or call the HTTP endpoint named in the error. Results are information only and authorize no payment.",
