          "name": "agent_payment_readiness_assessment",
          "title": "Agent Payment Readiness Assessment",
          "description": "Paid: $1.00 per call over the Machine Payments Protocol, or one prepaid SET Agent Credits call (Authorization: Bearer <key> on the MCP request). Classifies what you declare about ten capabilities of a payment workflow (discovery, payment challenge and receipt, idempotency, webhook verification, fulfillment, authentication, wallet ownership, on-ramp handoff, delivery evidence, recovery) and returns the blocking controls and the order to fix them. It verifies nothing independently and authorizes no payment.",
