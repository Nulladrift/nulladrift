{
  "lockfileVersion": 2,
  "subjects": {
    "app.rowb.catchlog/logbook": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catchlog.rowb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "catchlog",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "catch_summary",
          "description": "Count what is in your logbook: totals, longest and heaviest, per species, per place and per month. Every number is counted from your entries; nothing is estimated.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42a72e4bd2f09356e5701d05da433ca64995014c0bed745fe6ec4066b5c1c824"
        },
        {
          "name": "list_entries",
          "description": "List the entries stored in your own logbook, newest first. Entries belonging to other users are never returned.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "max entries (default 20, max 100)",
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f842f339775cba5a9008e6ba6a407f6086eaa0a67c76346b0a8bb9c9c55ad177"
        },
        {
          "name": "record_catch",
          "description": "Record one catch in your logbook: date, species, place, and optionally length, weight, method, weather and water temperature. Returns the stored entry, or the list of errors that prevented storing it.",
          "inputSchema": {
            "properties": {
              "caught_on": {
                "description": "date of the catch, YYYY-MM-DD",
                "type": "string"
              },
              "length_cm": {
                "description": "length in cm (optional)",
                "type": "number"
              },
              "method": {
                "description": "how it was caught (optional)",
                "type": "string"
              },
              "notes": {
                "description": "free text (optional)",
                "type": "string"
              },
              "place": {
                "description": "where, e.g. \"north jetty\"",
                "type": "string"
              },
              "species": {
                "description": "what was caught, e.g. \"sea bass\"",
                "type": "string"
              },
              "water_temp_c": {
                "description": "water temperature in Celsius (optional)",
                "type": "number"
              },
              "weather": {
                "description": "conditions (optional)",
                "type": "string"
              },
              "weight_kg": {
                "description": "weight in kg (optional)",
                "type": "number"
              }
            },
            "required": ["caught_on", "place", "species"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bdef172320700e1bdbe3e95a07e496684a91908a4b1a353f2db180e031df20ba"
        }
      ],
      "digest": "sha256:1d9e36fd8092670c341db27fd724c8d8b49861cefe684e5a634f62a7bb14eb64"
    }
  }
}
