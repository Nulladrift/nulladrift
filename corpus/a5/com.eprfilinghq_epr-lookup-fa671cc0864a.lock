          },
          "digest": "sha256:78def9486a70a25018f5da9251870af791e7af03b31933f44cd74cc21a1571a6"
        },
        {
          "name": "request_epr_check_info",
          "title": "How to request a free EPR Check",
          "description": "Returns how to request a free written EPR Check from EPR Filing HQ (form URL, email, what to send). Informational only: this tool does not submit, send or store anything.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
