{
  "lockfileVersion": 2,
  "subjects": {
    "com.eprfilinghq/epr-lookup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.eprfilinghq.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "epr-filing-hq",
        "title": "EPR Filing HQ: packaging EPR lookup",
        "version": "2026-11-22.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only US packaging EPR reference for the Circular Action Alliance states (CA, OR, CO, WA, MN, MD; Maine monitored). Every answer is general information, not legal advice, and shows where rules MAY apply, never a confirmed obligation. Always pass along the citations, the data_as_of date and the disclaimer. Dollar figures are estimates. EPR Filing HQ is not affiliated with Circular Action Alliance or any agency.",
      "tools": [
        {
          "name": "check_applicability",
          "title": "Which states' packaging EPR rules may apply",
          "description": "Given sales states, revenue band, California sales band, rough tonnage and role (brand owner, importer, private-label retailer), returns per state: may apply, may be outside a small-producer line, need figures, or monitored. Never a confirmed obligation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ca_sales": {
                "default": "unsure",
                "description": "California gross sales, most recent calendar year",
                "enum": ["under_1m", "1m_plus", "unsure"],
                "type": "string"
              },
              "revenue_band": {
                "default": "unsure",
                "description": "Global revenue, most recent fiscal year",
                "enum": ["under_2m", "2m_5m", "5m_5_78m", "over_5_78m", "unsure"],
                "type": "string"
              },
              "role": {
                "default": "unsure",
                "enum": ["brand_owner", "importer", "private_label_retailer", "unsure"],
                "type": "string"
              },
              "states": {
                "description": "States sold or shipped into",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "tonnage": {
                "default": "unsure",
                "description": "Covered packaging into each state per year",
                "enum": ["under_1", "1_plus", "unsure"],
                "type": "string"
              }
            },
            "required": ["states"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e1cb0ff40177079cb1b16665fcaa55cd28bcf4769412c87b0b5c7384f0e541b"
        },
        {
          "name": "estimate_fee",
          "title": "Estimate packaging EPR fees (estimated)",
          "description": "Estimated 2027 fee range from CAA's published per-pound rates (OR, CO, WA) and optional flat dues (OR, CO), from annual pounds by material into one state. CA rates are preliminary and not totaled; MN, MD and ME have no published rates. Every figure is an estimate. Material ids: glass, aluminum, steel, corrugated, paperboard, kraft, polycoated, aseptic, pet_clear, pet_color, hdpe_natural, hdpe_color, pp_tubs, pp_lids, caps, pe_film, pp_film, laminate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "materials": {
                "default": [],
                "items": {
                  "properties": {
                    "id": {
                      "description": "Material id (see the tool description)",
                      "enum": ["glass", "aluminum", "steel", "corrugated", "paperboard", "kraft", "polycoated", "aseptic", "pet_clear", "pet_color", "hdpe_natural", "hdpe_color", "pp_tubs", "pp_lids", "caps", "pe_film", "pp_film", "laminate"],
                      "type": "string"
                    },
                    "lbs": {
                      "description": "Annual pounds of this material in packaging sold into the state",
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["id", "lbs"],
                  "type": "object"
                },
                "type": "array"
              },
              "state": {
                "description": "CA, OR, CO, WA, MN, MD or ME",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6d2d7903a2d54426e18f71028487d5d02ad0ea9e34db9a32c26f56f2ef2158f"
        },
        {
          "name": "get_deadlines",
          "title": "Get packaging EPR deadlines",
          "description": "Dated report, fee, registration and program milestones, each with a source and a confidence label (confirmed, expected, secondary, approximate).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include_past": {
                "description": "Include past milestones (default false)",
                "type": "boolean"
              },
              "states": {
                "description": "Filter by state codes; omit for all states",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91e1d17188e916d8343b53420fd6c2d8ff8486fba7fbf244ae2d805c007ee8ef"
        },
        {
          "name": "get_state_requirements",
          "title": "Get one state's packaging EPR requirements",
          "description": "Small-producer (de minimis) line, producer definition source, fee schedule status, upcoming dates and primary sources for one state.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "state": {
                "description": "Two-letter code or name: CA, OR, CO, WA, MN, MD or ME",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:796a5fcf1e615160e67d4ddbb1733789d0056d1fab6ce48d4bcaa600bcb5f66e"
        },
        {
          "name": "list_states",
          "title": "List packaging EPR states",
          "description": "List the US states covered (CA, OR, CO, WA, MN, MD, plus ME monitored), with program status, law, agency and fee-schedule status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
