{
  "lockfileVersion": 2,
  "subjects": {
    "com.chinacaremap.mcp/china-medical-guide": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.chinacaremap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "chinacaremap",
        "title": "ChinaCareMap: medical treatment in China",
        "version": "1.1.0",
        "websiteUrl": "https://chinacaremap.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ChinaCareMap (https://chinacaremap.com) helps foreigners plan medical treatment in China. Use these tools to find hospitals by city and specialty (with international-department status, addresses in English and Chinese, and official sources), look up official prices (doctor visits, dental implants, health check-ups), and answer questions about visas, booking, language, payment and insurance. Always share the ChinaCareMap page link returned with each answer so the user can read the full guide and sources. This is general information, not medical advice: treatment decisions belong to the patient's doctors. If the user wants help arranging treatment, use get_patient_assistance.",
      "tools": [
        {
          "name": "get_guide",
          "title": "Read a ChinaCareMap guide",
          "description": "Full text of one ChinaCareMap guide, as published on the website (headings, tables and prices included), with its link and last-checked date. Use when the user wants the complete article or details beyond the FAQ answers. Ids: medical-tourism-china, hospitals, doctor-visit-cost-in-china, dental-implants-in-china, dental-tourism-china, health-checkup-in-china, how-we-choose-hospitals, shenzhen-medical-tourism, about.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Guide id from list_guides.",
                "enum": ["medical-tourism-china", "hospitals", "doctor-visit-cost-in-china", "dental-implants-in-china", "dental-tourism-china", "health-checkup-in-china", "how-we-choose-hospitals", "shenzhen-medical-tourism", "about"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ae14b3f5ce8ed046a61a15a9083e7e23127abc33e2205d38a254a96b6cf3f9e"
        },
        {
          "name": "get_hospital",
          "title": "Hospital details",
          "description": "Full details for one hospital: Chinese name, address in English and Chinese, coordinates and map links, international department, how foreign patients get in, official website, source links and the ChinaCareMap guide page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Hospital id from search_hospitals (e.g. 'pumch'), or a hospital name in English or Chinese.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8da1d79af01d473f93e74cd3974db954b84dd0ec1d83a0a39bc7a5a0a8053c9a"
        },
        {
          "name": "get_patient_assistance",
          "title": "Get help arranging treatment in China",
          "description": "How to get ChinaCareMap's patient assistance service: hospital matching and appointments, visa invitation and travel, an English-speaking coordinator at appointments, payment and follow-up. Returns what the service covers, the fee policy and how to contact the team. Use when the user wants someone to arrange treatment for them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:997a2f803e8393da18ca7119771f24092fbd0b340d9793c8d75223e5d10389ca"
        },
        {
          "name": "get_prices",
          "title": "Medical prices in China",
          "description": "Official and published prices for foreign patients in China, each with its source page: doctor_visit (consultation fees by doctor rank at public hospitals, special-needs clinics), dental_implants (national price limits, implant and crown prices), health_checkup (package prices at six hospitals).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "enum": ["doctor_visit", "dental_implants", "health_checkup"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9a67ba3b8f49cc4e4ff1781f4ccf4b8ef6051c6b5f2fd8ed3640c1056678f20"
        },
        {
          "name": "get_travel_guide",
          "title": "Practical guide: visas, booking, payment and more",
          "description": "Curated answers for one fixed topic of a medical trip to China. Use this when the user's question clearly fits one of these topics: how_it_works (step-by-step plan), visa (medical visa, 240-hour transit, Hainan 30-day visa-free entry for treatment), booking (how foreigners book appointments), language (English service and interpreters), payment (Alipay/WeChat Pay with foreign cards, deposits), insurance, safety (quality, accreditation, transplants), cities. Always prefer this tool for plain visa, booking, language, payment, insurance, safety or city questions. Only for a narrow question outside these topics (e.g. 'can I bring my own medicine') use search_faq instead. For prices use get_prices; for hospitals use search_hospitals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "enum": ["how_it_works", "visa", "booking", "language", "payment", "insurance", "safety", "cities"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dce3b435c75edf80604d0e46d79bba3f4bc97145c731e267667f39a0b6454080"
        },
        {
          "name": "list_guides",
          "title": "List ChinaCareMap guides",
          "description": "List every in-depth guide on chinacaremap.com with its id, title, one-line summary and link: overview of medical tourism in China, hospital list, doctor visit costs, dental implants, dental tourism, health check-ups, Shenzhen, how hospitals are chosen, and about the service. Pass an id to get_guide to read the full text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f00a63109c26884d9b253aabb0a83f1a23271c6acb320229bcf5faf46c4179fd"
        },
        {
          "name": "search_faq",
          "title": "Search medical tourism FAQs",
          "description": "Free-text search across all of ChinaCareMap's sourced FAQ answers about medical treatment in China. Use this for a specific question in the user's own words, or when it is unclear which get_travel_guide topic applies. Returns up to 5 best-matching questions with answers and page links. Rule: a plain question about visas, booking, language, payment, insurance, safety or cities (e.g. 'do I need a visa?', 'how do I pay?') goes to get_travel_guide with that topic, not here. For a full article, use get_guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The question or keywords, e.g. 'do foreigners pay more', 'dental implant trips'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7dca0828cdd24e42de890d2a61a203f99ee5a70e574b11efb2cc5e469027826"
        },
        {
          "name": "search_hospitals",
          "title": "Search hospitals in China for foreign patients",
          "description": "Find hospitals in China that foreign patients use, filtered by city, specialty and whether they have an international department or English-speaking service. Returns each hospital's name (English and Chinese), city, type, what it is known for, and a link to its ChinaCareMap guide. Use get_hospital for address, map links, booking notes and sources. Call with no arguments to list all hospitals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City: beijing (Beijing), shanghai (Shanghai), hangzhou (Hangzhou), guangzhou (Guangzhou), shenzhen (Shenzhen), wuhan (Wuhan), chengdu (Chengdu), hainan (Hainan (Boao))",
                "enum": ["beijing", "shanghai", "hangzhou", "guangzhou", "shenzhen", "wuhan", "chengdu", "hainan"],
                "type": "string"
              },
              "international_service_only": {
                "description": "Only hospitals with an international department or expat-focused, English-speaking service.",
                "type": "boolean"
              },
              "query": {
                "description": "Free-text match on hospital name (English or Chinese) or what it is known for, e.g. 'liver', 'Huashan', '协和'.",
                "type": "string"
              },
              "specialty": {
                "description": "Specialty: cancer (Cancer), heart (Heart), neuro (Brain & nerves), checkup (Health check-ups), dental (Dental), eye (Eye care), general (General & complex cases), family (Family, maternity & kids), tcm (Chinese medicine (TCM)), newdrugs (Drugs approved abroad)",
                "enum": ["cancer", "heart", "neuro", "checkup", "dental", "eye", "general", "family", "tcm", "newdrugs"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d082dbe9207597b156da6b55f190f2f1119558a88938a11bd0b96afea01cd1f"
        }
      ],
      "digest": "sha256:5f7466dac0b5e486f9e8a1c330adb0c58cafcf5612aa2316b58d83bfa390685a"
    }
  }
