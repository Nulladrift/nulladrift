        {
          "name": "render_contract",
          "title": "Prepare a California offer letter and pay plan",
          "description": "Fill rolefig's California starter offer letter and pay plan (commission, salary with bonus, or hourly) from values the employer confirmed, or fill the employer's own contract through {{placeholders}}. Returns the document text, best-effort warnings (wage table checked 2026-10-06), the workspace's Compensation and Offer terms texts, and an ATS offer object once the candidate, start date and expiry are set. Use only confirmed values and never invent terms. Not legal advice. Remote use sends these values to rolefig to fill the template; nothing is stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ownContract": {
                "maxLength": 50000,
                "minLength": 1,
                "type": "string"
              },
              "today": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "values": {
                "additionalProperties": false,
                "properties": {
                  "benefits": {
                    "default": [],
                    "description": "Benefits offered.",
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 12,
                    "type": "array"
                  },
                  "candidate": {
                    "additionalProperties": false,
                    "default": {},
                    "properties": {
                      "name": {
                        "description": "The candidate's full name, once you make the offer.",
                        "maxLength": 120,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "classification": {
                    "description": "Overtime classification. Required for commission and salary plans; hourly plans are non-exempt.",
                    "enum": ["exempt", "non-exempt"],
                    "type": "string"
                  },
                  "employer": {
                    "additionalProperties": false,
                    "properties": {
                      "address": {
                        "description": "The employer's address.",
                        "maxLength": 300,
                        "minLength": 1,
                        "type": "string"
                      },
                      "legalName": {
                        "description": "The employer's legal name.",
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      },
                      "signerName": {
                        "description": "Who signs for the employer.",
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      },
                      "signerTitle": {
                        "description": "The signer's job title.",
                        "maxLength": 120,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["address", "legalName", "signerName", "signerTitle"],
                    "type": "object"
                  },
                  "offerExpiresAt": {
                    "description": "When the offer expires, as an ISO 8601 UTC time. Leave out until you make the offer.",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "pay": {
                    "oneOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "afterEmployment": {
                            "description": "What happens to earned and pending commission when employment ends.",
                            "maxLength": 1000,
                            "minLength": 1,
                            "type": "string"
                          },
                          "cap": {
                            "description": "Optional cap on commission or earnings.",
                            "maxLength": 200,
                            "type": "string"
                          },
                          "draw": {
                            "additionalProperties": false,
                            "description": "Optional draw paid while the employee builds commission.",
                            "properties": {
                              "amountPerMonth": {
                                "exclusiveMinimum": 0,
                                "maximum": 100000,
                                "type": "number"
                              },
                              "months": {
                                "maximum": 24,
                                "minimum": 1,
                                "type": "integer"
                              },
                              "recoverable": {
                                "description": "true: an advance repaid from future commission; false: the employee keeps it.",
                                "type": "boolean"
                              }
                            },
                            "required": ["amountPerMonth", "months", "recoverable"],
                            "type": "object"
                          },
                          "earned": {
                            "description": "When commission is earned, e.g. 'half when the deposit clears, half on final payment'.",
                            "maxLength": 1000,
                            "minLength": 1,
                            "type": "string"
                          },
                          "paid": {
                            "description": "When earned commission is paid, e.g. 'on the next regular payday after it is earned'.",
                            "maxLength": 1000,
                            "minLength": 1,
                            "type": "string"
                          },
                          "plan": {
                            "const": "commission",
                            "type": "string"
                          },
                          "rate": {
                            "description": "How commission is calculated: the rate and what it applies to, e.g. '3% of contract value on every project you close'.",
                            "maxLength": 300,
                            "minLength": 1,
                            "type": "string"
                          },
                          "rules": {
                            "default": [],
                            "description": "Special rules, e.g. 'projects signed below our margin floor need written approval and pay half rate'.",
                            "items": {
                              "maxLength": 300,
                              "minLength": 1,
                              "type": "string"
                            },
                            "maxItems": 10,
                            "type": "array"
                          },
                          "target": {
                            "description": "Optional target earnings, shown as an estimate.",
                            "maxLength": 200,
                            "type": "string"
                          }
                        },
                        "required": ["afterEmployment", "earned", "paid", "plan", "rate"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "annualBase": {
                            "description": "Base salary in USD per year.",
                            "exclusiveMinimum": 0,
                            "maximum": 10000000,
                            "type": "number"
                          },
                          "bonusConditions": {
                            "description": "Optional conditions for the bonus.",
                            "maxLength": 1000,
                            "type": "string"
                          },
                          "bonusMeasures": {
                            "description": "What the bonus is based on. Required with a bonus target.",
                            "maxLength": 1000,
                            "type": "string"
                          },
                          "bonusTarget": {
                            "description": "Optional target bonus, e.g. '$25,000–$40,000 a year'.",
                            "maxLength": 300,
                            "type": "string"
                          },
                          "bonusTiming": {
                            "description": "When the bonus is paid. Required with a bonus target.",
                            "maxLength": 500,
                            "type": "string"
                          },
                          "plan": {
                            "const": "salary_bonus",
                            "type": "string"
                          }
                        },
                        "required": ["annualBase", "plan"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "hourlyRate": {
                            "description": "Pay in USD per hour.",
                            "exclusiveMinimum": 0,
                            "maximum": 1000,
                            "type": "number"
                          },
                          "payFrequency": {
                            "description": "How often pay goes out.",
                            "enum": ["weekly", "biweekly", "semimonthly"],
                            "type": "string"
                          },
                          "plan": {
                            "const": "hourly",
                            "type": "string"
                          }
                        },
                        "required": ["hourlyRate", "payFrequency", "plan"],
                        "type": "object"
                      }
                    ]
                  },
