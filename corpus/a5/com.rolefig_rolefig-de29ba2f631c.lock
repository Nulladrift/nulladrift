        {
          "name": "get_job",
          "title": "Read a published opening",
          "description": "Read one current published opening in full, with its company profile, the company's application URL, its rolefig page and, when the company gave them, teamAnswers: a named person on the hiring team answering why the role exists, its hardest part and a normal week, in their own words, each answer with an audioUrl when they published their recording. Use the company and job slugs from search_jobs. Compensation text is authoritative; absent numeric pay and units are unknown. Never submits an application.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "job": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["company", "job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19e047b834c566000b1a0579fcd2f42052895e156f9b19052616b49748e8ef4a"
        },
