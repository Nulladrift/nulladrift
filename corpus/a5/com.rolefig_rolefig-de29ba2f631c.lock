{
  "lockfileVersion": 2,
  "subjects": {
    "com.rolefig/rolefig": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rolefig.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
