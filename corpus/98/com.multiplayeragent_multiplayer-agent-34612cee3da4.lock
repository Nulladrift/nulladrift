        {
          "name": "schedule_live_event",
          "title": "Schedule a live event",
          "description": "Schedule (or, with an existing id, edit) a timed event: a window, optionally repeating daily or weekly, optionally limited to some rooms, carrying config overrides that apply only while it runs. It starts and ends on time in rooms that are already running, as data: nobody is kicked and nothing is redeployed. Clients see it in mp.live (active / upcoming / config) and mp.onLive(cb); server logic reads liveOps() and gets onLiveOps(live, change) when it starts or ends. Up to 50 events per game; check the result with get_live_ops (pass `at` to preview).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "config": {
                "additionalProperties": {},
                "description": "Overrides deep-merged over the live config while the event runs (null deletes a key), e.g. { xpMultiplier: 2, rules: { lives: 1 } }.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "description": {
                "description": "Player-facing blurb for an events window.",
                "maxLength": 500,
                "type": "string"
              },
              "durationMinutes": {
                "description": "Length of each occurrence, instead of endsAt.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "endsAt": {
                "description": "ISO-8601 end. Or give durationMinutes. Neither = open-ended (until cancelled; not for repeating events).",
                "type": "string"
              },
              "game": {
                "description": "Which game to act on: its publishable key (pk_…) or its exact name. Defaults to the x-mp-game header, then your primary game.",
                "type": "string"
              },
              "id": {
                "description": "Stable id (a-z, 0-9, - _). Defaults to a slug of the title. Scheduling an existing id EDITS that event.",
                "maxLength": 48,
                "type": "string"
              },
              "repeat": {
                "description": "Repeat the same window every day or week from startsAt (default none).",
                "enum": ["none", "daily", "weekly"],
                "type": "string"
              },
              "repeatUntil": {
                "description": "ISO-8601: no occurrence starts at or after this. Omit = repeats forever.",
                "type": "string"
              },
              "rooms": {
                "description": "Only these room names. Omit = every room of the game.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "startsAt": {
                "description": "ISO-8601 start, e.g. \"2026-11-01T18:00:00Z\", or \"now\" (the default).",
                "type": "string"
              },
              "title": {
                "description": "Player-facing name, e.g. 'Double XP Weekend'.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
