          "description": "Check a real provider token against the game's login config exactly as player.loginExternal would, WITHOUT creating or linking a player. Returns { ok, uid, username, claims } or { ok: false, error }. Use it to confirm a provider works end to end, and to read what a token carries (e.g. Wavedash's gcid). Wavedash works before it's enabled (signature and issuer only, plus a note), so you can read the gcid that enable_login_provider needs. Ask the user to paste a token from their running build (Wavedash: (await Wavedash.getUserJwt()).data in the browser console).",
