{
  "lockfileVersion": 2,
  "subjects": {
    "com.marketcheck/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://developers.marketcheck.com/api/docs-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "MarketCheck Docs",
        "title": "MarketCheck API Documentation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Documentation for the MarketCheck REST APIs (https://api.marketcheck.com/v2). Start with search_docs for any question, or list_endpoints to browse. get_endpoint returns the exact query parameters and a real sample request and response for one endpoint. get_doc_page returns a full documentation page as markdown. No authentication is required here. Every REST API call itself needs api_key=YOUR_API_KEY as a query parameter; keys come from https://developers.marketcheck.com/api-keys.",
      "tools": [
        {
          "name": "get_doc_page",
          "description": "Fetch one full documentation page as Markdown, including resolved parameter tables and curl examples. Use a 'Page:' URL or path returned by search_docs or get_endpoint, e.g. '/docs/api/cars/inventory/inventory-search'. UK pages are under '/uk/docs/...'.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Docs path starting with /docs or /uk, or a full https://docs.marketcheck.com URL.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1117c315baa79cfa7f80198989923e5728a8da902530ddf7abd0dde07b1c550"
        },
        {
          "name": "get_endpoint",
          "description": "Exact reference for one REST endpoint: every query parameter (name, type, description, required, default), a real sample request, and a truncated real sample response. Use the path as shown by list_endpoints, e.g. '/v2/search/car/active'.",
          "inputSchema": {
            "properties": {
              "method": {
                "description": "Optional; defaults to the single documented method.",
                "enum": ["GET", "POST", "PUT", "DELETE"],
                "type": "string"
              },
              "path": {
                "description": "Endpoint path, e.g. /v2/search/car/active. Full api.marketcheck.com URLs accepted.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26501316acf4dd3148962e0a9806208479cdc80b317a7c68e9a4a2e9e84fcc90"
        },
        {
          "name": "get_plans_and_limits",
          "description": "Current published MarketCheck rate plans: per-call pricing, monthly quotas, and rate limits for a region, sourced from the live plan list (authoritative over docs). NA prices in USD, UK in GBP.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "Default NA.",
                "enum": ["NA", "UK"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fad49463d21246302bfa2d0e36a6db205488b426aa5b12c2493d94727ed69b69"
        },
        {
          "name": "list_endpoints",
          "description": "List every documented MarketCheck REST endpoint: method, path, one-line title, region, and docs URL (~73 endpoints across US/UK cars, dealers, VIN decode, history, valuations).",
          "inputSchema": {
            "properties": {
              "filter": {
                "description": "Optional case-insensitive substring match on path or title, e.g. 'dealer'.",
                "maxLength": 100,
                "type": "string"
              },
              "region": {
                "description": "Optional filter; omit for all.",
                "enum": ["NA", "UK"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a47f77661735be86f3b56f1c37f3883026a6cc607dcd8f2feb57f7fcb5c09265"
        },
        {
          "name": "search_docs",
          "description": "Semantic search over the complete MarketCheck API documentation, current rate plans, and API policies (2,000+ indexed sections). Returns the most relevant excerpts, each with its source page URL and endpoint. Use this first for any question about endpoints, parameters, authentication, errors, plans, or terms.",
          "inputSchema": {
            "properties": {
              "k": {
                "description": "Number of excerpts. Default 6.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language question or keywords, e.g. 'filter active listings by dealer id'.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "region": {
                "description": "Market region; filters region-specific pricing. Default NA.",
                "enum": ["NA", "UK"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c3b018a7f9bf56ba0a223dc7be786d8a20b47ddb55f0fbfbe036d0a2dde3f81"
        }
      ],
      "digest": "sha256:8845f83afcd2b261b910b7f86cfef0f96bebc8d27e69ad6a35cfe2f17600e7e7"
    }
  }
}
