{
  "lockfileVersion": 2,
  "subjects": {
    "com.jwatte/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jwatte.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "com.jwatte/site",
        "title": "jwatte.com website tools",
        "version": "1.1.0",
        "description": "Website tool catalog, browser run links, article search and book catalog details from jwatte.com.",
        "websiteUrl": "https://jwatte.com/connect/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to jwatte.com website-tool, article and book catalogs. Tool searches match words, related terms and phrases, with bounded result counts.\nRun links open a browser tool with a public website address filled in. Opening a link starts the selected tool; page audits may send that address to the site fetch function and configured proxies. The MCP server itself never fetches or audits the supplied address.\nArticle results contain titles, dates, summaries and source links. Book results are catalog information and can include Kindle prices and retailer links; they do not execute purchases.\nThe server has no accounts and performs no purchases, form submissions or persistent input storage. Other questions: https://jwatte.com/contact/.",
      "tools": [
        {
          "name": "find_tool",
          "title": "Find matching website tools",
          "description": "Matches a website-checking or creation need against the jwatte.com catalog using weighted words, related terms and phrase matches. Returns up to 10 matching tools with titles, descriptions, source links and takes_url flags indicating support for browser run links.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "need": "check my website for accessibility problems"
              }
            ],
            "properties": {
              "category": {
                "description": "Optional: only audits, generators or utilities.",
                "enum": ["audits", "generators", "utilities"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many tools at most (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "What the person wants to check or build, in their words.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "directory": {
                "type": "string"
              },
              "need": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["audits", "generators", "utilities"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "takes_url": {
                      "type": "boolean"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "description", "slug", "takes_url", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["directory", "need", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find matching website tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d746917364663359fb649c053339f82f5cce8591e18d3bdedc4e4c6197c4284"
        },
        {
          "name": "get_audit_link",
          "title": "Get a run link for a site",
          "description": "Creates a browser run link for a catalog tool that supports website addresses. Opening the link fills in the address and starts that tool, which may fetch the target through the site hosting function and configured proxies. The MCP call itself never fetches or audits the target and returns no audit findings. Accepts public HTTP or HTTPS addresses only; rejects private addresses, internal names, credentials and non-standard ports.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "tool": "mega-analyzer",
                "url": "https://example.com"
              }
            ],
            "properties": {
              "tool": {
                "description": "Tool slug, e.g. \"mega-analyzer\", \"wcag-accessibility-audit\", \"agent-ready-audit\".",
                "maxLength": 80,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "url": {
                "description": "The public page or site to audit. A bare host name uses HTTPS.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool", "url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "autorun": {
                "type": "boolean"
              },
              "fetched_by_server": {
                "const": false,
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "run_url": {
                "type": "string"
              },
              "target": {
                "type": "string"
              },
              "tool": {
                "additionalProperties": false,
                "properties": {
                  "description": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["description", "slug", "title", "url"],
                "type": "object"
              }
            },
            "required": ["autorun", "fetched_by_server", "note", "run_url", "target", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a run link for a site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:85308464e022bcaaa239f9c7624d9f1cd82b0bca77cf9f4a01f0e026348d5f6b"
        },
        {
          "name": "get_book_info",
          "title": "Book details",
          "description": "Catalog details for one of J.A. Watte's six books by slug: title, subtitle, page count, format, listed price, a short factual summary, Amazon link and companion website. Slugs: w2trap, condotrap, resaletrap, 97launch, 20agency, 100network. Prices are catalog values, not a live retailer lookup.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "slug": "97launch"
              }
            ],
            "properties": {
              "slug": {
                "description": "w2trap (The W-2 Trap), condotrap (The Condo Trap), resaletrap (The Resale Trap), 97launch (The $97 Launch), 20agency (The $20 Dollar Agency), 100network (The $100 Network).",
                "enum": ["w2trap", "condotrap", "resaletrap", "97launch", "20agency", "100network"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "book": {
                "additionalProperties": false,
                "properties": {
                  "amazon_url": {
                    "type": "string"
                  },
                  "book_site": {
                    "type": "string"
                  },
                  "cover": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "format": {
                    "type": "string"
                  },
                  "pages": {
                    "type": "integer"
                  },
                  "price_usd": {
                    "type": "string"
                  },
                  "role": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "subtitle": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  }
                },
                "required": ["amazon_url", "book_site", "description", "format", "pages", "slug", "subtitle", "title"],
                "type": "object"
              },
              "books_page": {
                "type": "string"
              }
            },
            "required": ["book", "books_page"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Book details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a6a5430b56902b8e88f6a294e90cefc1ecb71582f6c01f98a1b26bb2644f271"
        },
        {
          "name": "list_audit_tools",
          "title": "List website tools",
          "description": "Returns a page from the jwatte.com website-tool catalog in directory order, filtered by category or matching keywords. Each entry has a slug, title, category, description, source link and takes_url flag indicating whether it supports a browser run link. Includes the total count and next offset; 1 to 20 entries per page.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "category": "audits",
                "limit": 10
              }
            ],
            "properties": {
              "category": {
                "description": "Optional category: audits, generators or utilities; absent means all categories.",
                "enum": ["audits", "generators", "utilities"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Tools per page (1 to 20, default 10). More results are available using next_offset.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of entries before this page, matching the previous next_offset value.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "search": {
                "description": "Keywords that must all appear in the title, slug, tags or description, e.g. \"schema\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": ["string", "null"]
              },
              "count": {
                "type": "integer"
              },
              "directory": {
                "type": "string"
              },
              "next_offset": {
                "type": ["integer", "null"]
              },
              "offset": {
                "type": "integer"
              },
              "search": {
                "type": ["string", "null"]
              },
              "tools": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["audits", "generators", "utilities"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "takes_url": {
                      "type": "boolean"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "description", "slug", "takes_url", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["category", "count", "directory", "next_offset", "offset", "search", "tools", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List website tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c85d5d702383d98a05593ed1bc258a24e8e68cf2cd3d2849cc72dcc65ae1434"
        },
        {
          "name": "recommend_book",
          "title": "Recommend a book",
          "description": "Matches a reading topic against subject phrases and related-word rules for J.A. Watte's six-book catalog. A match returns a title, a topic-based reason, and links. Only a clearly matched subject receives a book. An unmatched topic returns no book and no Amazon link. This searches only the publisher's own catalog.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "topic": "books about website building"
              }
            ],
            "properties": {
              "topic": {
                "description": "The reader's situation, goal or topic, in their words.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "books_page": {
                "type": "string"
              },
              "matched": {
                "type": "boolean"
              },
              "primary": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amazon_url": {
                        "type": "string"
                      },
                      "book_site": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      },
                      "subtitle": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      }
                    },
                    "required": ["amazon_url", "book_site", "slug", "subtitle", "title"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "reason": {
                "type": "string"
              },
              "rule": {
                "type": ["string", "null"]
              },
              "secondary": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "amazon_url": {
                        "type": "string"
                      },
                      "book_site": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      },
                      "subtitle": {
                        "type": "string"
                      },
                      "title": {
                        "type": "string"
                      }
                    },
                    "required": ["amazon_url", "book_site", "slug", "subtitle", "title"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "topic": {
                "type": "string"
              }
            },
            "required": ["books_page", "matched", "primary", "reason", "rule", "secondary", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a book"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68c92f5b37544d033e0d33534ef3353e4716a31f88b837007a6150e484896d95"
        },
        {
          "name": "search_blog",
          "title": "Search the blog",
          "description": "Searches the jwatte.com article catalog by keyword and returns up to 25 matches ranked by relevance, each with a title, publication date, source link and summary.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "limit": 5,
                "query": "llms.txt"
              }
            ],
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many articles at most (1 to 25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. \"llms.txt\" or \"condo special assessment\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "blog": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["date", "summary", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_matches": {
                "type": "integer"
              }
            },
            "required": ["blog", "count", "query", "results", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the blog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbcd120e4738bf89e25102b67aceda98e28e964cdba8db26af71dedab906249b"
        }
      ],
      "digest": "sha256:058e86bb27e4ccc3060f242e3e96896e38cbd9aa7b059b5fed89b713a4c80880"
    }
  }
}
