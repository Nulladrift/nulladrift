      "serverInfo": {
        "name": "com.jwatte/site",
        "title": "jwatte.com website tools",
        "version": "2.0.0",
        "description": "Website tool catalog, browser run links, article search, series and downloads from jwatte.com.",
        "websiteUrl": "https://jwatte.com/connect/",
        "icons": [
          {
            "src": "https://jwatte.com/images/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "completions": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to jwatte.com website-tool and article catalogs. Tool searches match words, related terms and phrases, with bounded result counts.\nRun links open a browser tool with a public website address filled in. Opening a link starts the selected tool; page audits may send that address to the site fetch function and configured proxies. The MCP server itself never fetches or audits the supplied address.\nArticle results contain titles, dates, summaries and source links.\nThe server has no accounts and performs no purchases, form submissions or persistent input storage. Other questions: https://jwatte.com/contact/.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a jwatte.com item",
          "description": "Returns the full text of one jwatte.com item by its id (article:<slug>, download:<file name> or tool:<slug>): an article's published Markdown (the same text as its .md page), the text of a downloadable kit when it is a text file, or a website tool's catalog entry. Metadata gives dates, links, sizes and related downloads. A text longer than 100,000 characters is cut at a paragraph break and ends with a line giving the address of the full text. Answers come from the copy bundled with this server; nothing is fetched from the web.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "id": "tool:wcag-accessibility-audit"
              }
            ],
            "properties": {
              "id": {
                "description": "An id such as article:<slug>, download:<file name> or tool:<slug>.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "as_of": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "bytes": {
                    "type": "integer"
                  },
                  "category": {
                    "type": "string"
                  },
                  "char_count": {
                    "type": ["integer", "null"]
                  },
                  "date": {
                    "type": "string"
                  },
                  "dateModified": {
                    "type": ["string", "null"]
                  },
                  "description": {
                    "type": "string"
                  },
                  "downloads": {
                    "items": {
                      "properties": {
                        "file": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["file", "title", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "kind": {
                    "enum": ["article", "download", "tool"],
                    "type": "string"
                  },
                  "linked_from": {
                    "items": {
                      "properties": {
                        "slug": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["slug", "title", "url"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "markdown_url": {
                    "type": "string"
                  },
                  "source_url": {
                    "format": "uri",
                    "pattern": "^https://",
                    "type": "string"
                  },
                  "takes_url": {
                    "type": "boolean"
                  },
                  "text_available": {
                    "type": "boolean"
                  },
                  "truncated": {
                    "type": "boolean"
                  },
                  "type": {
                    "type": "string"
                  }
                },
                "required": ["as_of", "kind", "source_url"],
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a jwatte.com item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:175e227f9434e9b311dddd3c53c2aaf0d2e2c99925e573802997d936384a91de"
        },
        {
          "name": "find_tool",
          "title": "Find matching website tools",
          "description": "Matches a website-checking or creation need against the jwatte.com catalog using weighted words, related terms and phrase matches. Returns up to 10 matching tools with titles, descriptions, source links and takes_url flags indicating support for browser run links.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "need": "check my website for accessibility problems"
              }
            ],
            "properties": {
              "category": {
                "description": "Optional: only audits, generators or utilities.",
                "enum": ["audits", "generators", "utilities"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many tools at most (1 to 10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "What the person wants to check or build, in their words.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "format": "date-time",
                "type": "string"
              },
              "directory": {
                "type": "string"
              },
              "need": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["audits", "generators", "utilities"],
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "takes_url": {
                      "type": "boolean"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "description", "slug", "takes_url", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "source_url": {
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["directory", "need", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find matching website tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:87a85f607453ec7200b73d8786383722c65169be31006815359c85865f8e3c0f"
