        {
          "name": "list_recent_articles",
          "title": "Newest articles",
          "description": "Lists jwatte.com articles by publication date, newest first, from the same catalog as the blog and its RSS feed. Optional since date (YYYY-MM-DD) and paging with offset and next_offset; 1 to 25 per page. Each article has a title, publication date, source link and summary.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "limit": 10
              }
            ],
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many articles at most (1 to 25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of newer articles to skip, matching the previous next_offset value.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "since": {
                "description": "Optional: only articles published on or after this date, YYYY-MM-DD.",
                "maxLength": 10,
                "minLength": 10,
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
