        {
          "name": "get_request_link",
          "title": "Get a contact form link",
          "description": "Creates a link to the jwatte.com contact form with the subject and message filled in, for a tool request, a correction, a question or something else, optionally naming the jwatte.com page or tool it is about. The link only opens the form: the person adds their own name and email, reviews the text and presses Send. This tool sends nothing and stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "message": "A checker for RSS feed validity would help.",
                "reason": "tool_request"
              }
            ],
            "properties": {
              "message": {
                "description": "Optional: the message text to fill in, at most 1,000 characters. No passwords or private details.",
                "maxLength": 1000,
                "type": "string"
              },
              "page": {
                "description": "Optional: the https://jwatte.com/ page or the tool slug the request is about.",
                "maxLength": 300,
                "type": "string"
              },
              "reason": {
                "description": "tool_request (a tool the site should add), correction (something on the site is wrong), question, or other.",
                "enum": ["tool_request", "correction", "question", "other"],
                "type": "string"
              }
            },
            "required": ["reason"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "format": "date-time",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "prefilled": {
                "type": "boolean"
              },
              "request_url": {
                "format": "uri",
                "pattern": "^https://jwatte\\.com/contact/",
                "type": "string"
              },
              "source_url": {
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["as_of", "note", "prefilled", "request_url", "source_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a contact form link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:91cd9a798d603ece1ca85c2b0673aeb5ea7dc4b9234a80fa888784ded32d8e8b"
        },
        {
          "name": "get_series",
          "title": "Get an article series",
          "description": "Returns one jwatte.com article series by its id: its title, kind (hub for a series index page, parts for a numbered series), link and description, then its sections in the order the site gives them, each with its articles in reading order. Every article has an id of the form article:<slug>, its title, its canonical https link, its publication date and, in a numbered series, its part number (null otherwise). Answers come from the copy of the site bundled with this server; nothing is read from the web. A host that supports interactive views can also show the series as a list of links.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "id": "who-gets-the-yield"
              }
            ],
            "properties": {
              "id": {
                "description": "A series id, lowercase words joined by hyphens, e.g. \"who-gets-the-yield\".",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "format": "date-time",
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "description": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "kind": {
                "enum": ["hub", "parts"],
                "type": "string"
              },
              "sections": {
                "items": {
                  "properties": {
                    "heading": {
                      "type": "string"
                    },
                    "items": {
                      "items": {
                        "properties": {
                          "date": {
                            "type": "string"
                          },
                          "id": {
                            "pattern": "^article:[a-z0-9][a-z0-9-]*$",
                            "type": "string"
                          },
                          "part": {
                            "type": ["integer", "null"]
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "format": "uri",
                            "pattern": "^https://",
                            "type": "string"
                          }
                        },
                        "required": ["date", "id", "part", "title", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["heading", "items"],
                  "type": "object"
                },
                "type": "array"
              },
              "source_url": {
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "pattern": "^https://",
                "type": "string"
              }
            },
            "required": ["as_of", "count", "description", "id", "kind", "sections", "source_url", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an article series"
          },
