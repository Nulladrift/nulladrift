{
  "lockfileVersion": 2,
  "subjects": {
    "app.rowb.septic-log/maintenance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://septic-log.rowb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "septic-log",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "add_events",
          "description": "Append service events to an existing record. Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "events": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "site_id": {
                "type": "string"
              }
            },
            "required": ["events", "site_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:def1f9b909d422ecd7abc56d988c1a3f732c77fc9ec3ef1bda310571781d62fe"
        },
        {
          "name": "check_service_record",
          "description": "Check a list of septic system service events for things that cannot be true, and compute the next inspection and pump-out window from the intervals published by the US EPA. Deterministic arithmetic only - no AI. It does not judge whether your system is compliant, and it does not know your local code.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Treat this date as \"today\" (YYYY-MM-DD) when rejecting future dates and computing the next due date. Defaults to the server date.",
                "type": "string"
              },
              "events": {
                "description": "Events to check. Each: {date:\"YYYY-MM-DD\", kind:\"inspection|pump_out|repair|other\", company:\"who did it\", gallons?:number, liquid_depth_inches?:number, sludge_inches?:number, scum_inches?:number, sludge_to_outlet_inches?:number, scum_to_outlet_inches?:number, notes?:string}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["events"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:519e37659e7bd6f74c1e60b465afb2e85bd01a74664c0a9f7560ee44a4646af1"
        },
        {
          "name": "create_site",
          "description": "Open a maintenance record for one septic system (returns a site id). Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "household_size": {
                "type": "integer"
              },
              "installed_year": {
                "type": "integer"
              },
              "label": {
                "description": "What to call this system, e.g. \"Home - 12 Mill Rd\".",
                "type": "string"
              },
              "tank_gallons": {
                "type": "number"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60cb3faa7391671d40e6cf082778d1feb989ac5abc471bf692d8f045a2afc7d7"
        },
        {
          "name": "get_record_summary",
          "description": "Every event, the flagged issues, the last inspection and pump-out, and the next dates, for one record. Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "site_id": {
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1bbe9057497819f30bd132f4b640df0e1935da333e220fa6aae8b857cc4fda53"
        },
        {
          "name": "get_rules",
          "description": "The exact rule table this service checks against, the quoted source of every interval, and what it explicitly does not claim. Quote it if you need to explain a result.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4728a76263c4a2d77186949e82cf488a6169ef6dbf0b85abbdfcb870a7e3f7d9"
        },
        {
          "name": "request_provider_signoff",
          "description": "Create a one-time URL the service provider can open to confirm the recorded work. Requires a bearer key. The token is single use.",
          "inputSchema": {
            "properties": {
              "provider_email": {
                "type": "string"
              },
              "provider_name": {
                "type": "string"
              },
              "site_id": {
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a19875f3f5ebfef6259082789c1289244f3929696c3e1c0af4c26072cf665176"
        }
      ],
      "digest": "sha256:9c247574ba1cce04a9e1dafe317c53b89554cf7ca1c95b521a63e1e2cfae7791"
    }
  }
}
