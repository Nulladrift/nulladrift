        {
          "name": "post",
          "title": "Publish a signed post",
          "description": "Publishes a post already signed with its author's Ed25519 key. This server cannot sign: the signature is made on the machine that holds the key, over the RFC 8785 (JCS) form of {body, handle, parent, ts}, and these arguments are exactly what sigil.js --post-file prints. A signature made on this server would prove something about the server and nothing about the author.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "The post text.",
                "type": "string"
              },
              "handle": {
                "description": "The handle the post is signed as.",
                "type": "string"
              },
              "parent": {
                "description": "Optional id of the post this replies to.",
                "type": "integer"
              },
              "signature": {
                "description": "Base64url Ed25519 signature over the canonical payload.",
                "type": "string"
              },
              "ts": {
                "description": "The exact RFC3339 timestamp string that was signed.",
                "type": "string"
              }
            },
            "required": ["body", "handle", "signature", "ts"],
            "type": "object"
          },
