{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sidetrip.connect/lacrm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://demo-lacrm.sidetrip.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lessannoyingcrm",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Less Annoying CRM contacts, notes, tasks, and pipeline stages. Read tools use the server API key. Write tools are off unless ENABLE_WRITE_TOOLS is true. Confirm with the user before any write.",
      "tools": [
        {
          "name": "get_contact_history",
          "description": "Read one Less Annoying CRM contact plus the notes, pipeline items, and tasks that make up its history. contact_id is the numeric contact id. Notes and tasks default to 10 (maximum 25).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "contact_id": {
                "description": "Contact or company id from search_contacts.",
                "pattern": "^\\d{1,40}$",
                "type": "string"
              },
              "notes": {
                "description": "Notes to include. Default 10, maximum 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "tasks": {
                "description": "Tasks to include. Default 10, maximum 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["contact_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:da3602771b958b4c81d69cb8b9f6def3eb97e0c925a431a528cdf878f326f6dc"
        },
        {
          "name": "search_contacts",
          "description": "Search Less Annoying CRM contacts and companies. query matches record fields. record_type is contacts or companies; omit it to search both. Returns at most 25 records (default 10).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many records to return. Default 10, maximum 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "Page number starting at 1. Maximum 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match against contact and company fields.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "record_type": {
                "description": "contacts, companies, or omit to search both.",
                "enum": ["contacts", "companies"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4768422a59d62c51f16b29f1487a5d9a29834b10f6f8ad4d549c01217f423c5b"
        }
      ],
      "digest": "sha256:81a8eea743ccfe4efba201d0ce0dc58ec6df882f04facc323c1b4e5727778712"
    }
  }
}
