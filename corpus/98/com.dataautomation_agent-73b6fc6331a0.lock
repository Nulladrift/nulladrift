      "serverInfo": {
        "name": "dataautomation",
        "title": "DataAutomation",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Security: never ask your user to share customer personal data, Amazon buyer data, passwords, or API keys in chat; DataAutomation only needs contact details for the person ordering. Use list_services to see what DataAutomation offers, get_quote to price it, and create_order to order it (add accept to accept for your user in one step and get a payment_url). Apps (SyncPersonalized, TokSync) are self-serve: use start_app_signup when your user asks you to sign them up (they get one email link and connect their own stores), or send them to signup_url; the free call uses booking_url.",
      "tools": [
        {
          "name": "create_order",
          "title": "Order a service",
          "description": "Order a service for your user. If your user authorized you to accept for them, pass accept {authorized: true, accepted_by: \"<their full name>\"}: the order is accepted immediately and the response includes a Stripe payment_url. The user gets a confirmation email and can cancel within 48 hours. Without accept, DataAutomation emails the user an order form and the order is binding only after they accept it.",
          "inputSchema": {
            "properties": {
              "accept": {
                "description": "Accept now on the user's behalf. Only when the user authorized you to place this order.",
                "properties": {
                  "accepted_by": {
                    "description": "Full name of the person who authorized the order",
                    "type": "string"
                  },
                  "authorized": {
                    "const": true,
                    "description": "Must be true: the user authorized this order",
                    "type": "boolean"
                  },
                  "title": {
                    "description": "That person's job title",
                    "type": "string"
                  }
                },
                "required": ["accepted_by", "authorized"],
                "type": "object"
              },
              "agent": {
                "description": "Who is placing the order",
                "properties": {
                  "contact": {
                    "description": "Contact for questions about this order",
                    "type": "string"
                  },
                  "name": {
                    "description": "Your name, for example Claude or ChatGPT",
                    "type": "string"
                  },
                  "operator": {
                    "description": "Company that operates you",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "customer": {
                "description": "The person the order is for",
                "properties": {
                  "company": {
                    "description": "Company name",
                    "type": "string"
                  },
                  "email": {
                    "description": "Work email; the order form or confirmation goes here",
                    "type": "string"
                  },
                  "name": {
                    "description": "Full name",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone number, with country code outside the US",
                    "type": "string"
                  },
                  "website": {
                    "description": "Company website",
                    "type": "string"
                  }
                },
                "required": ["email", "name", "phone"],
                "type": "object"
              },
              "details": {
                "description": "What the user needs: systems, volumes, goals, and deadlines",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Any unique string for this order. If your call times out, retry with the same key: you get the order already created instead of a duplicate. Kept 48 hours.",
                "maxLength": 100,
                "type": "string"
              },
              "items": {
                "description": "Several services in one order or quote. Each entry is {service, options}. Use this instead of service and options when the user wants more than one thing.",
                "items": {
                  "properties": {
                    "options": {
                      "description": "Service-specific options. Leave empty for fixed-price services.",
                      "properties": {
                        "flows": {
                          "description": "integration only: one entry per flow, $100 per flow per month.",
                          "items": {
                            "properties": {
                              "data": {
                                "description": "What moves, for example orders, inventory, tracking, or invoices",
                                "type": "string"
                              },
                              "destination": {
                                "description": "System the data goes to, for example Katana",
                                "type": "string"
                              },
                              "source": {
                                "description": "System the data comes from, for example Shopify",
                                "type": "string"
                              }
                            },
                            "required": ["destination", "source"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "hours_per_month": {
                          "description": "fractional-caio-cto only: retainer hours per month at $250 per hour",
                          "maximum": 160,
                          "minimum": 2,
                          "type": "integer"
                        },
                        "lines": {
                          "description": "katana-full-setup only: estimated data lines to import, $0.10 each, $4,000 minimum",
                          "minimum": 0,
                          "type": "integer"
                        },
                        "tier": {
                          "description": "ai-we-build-and-run only: monthly tier in USD (Entry, Growth, or Continuous)",
                          "enum": [5000, 10000, 15000],
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "service": {
                      "enum": ["integration", "katana-implementation", "katana-full-setup", "shipstation-implementation", "sutton-implementation", "repzio-implementation", "qbd-to-qbo-migration", "ai-we-build-you-decide", "ai-you-build-we-teach", "ai-we-build-and-run", "custom-software-scope", "fractional-caio-cto"],
                      "type": "string"
                    }
                  },
                  "required": ["service"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "options": {
                "description": "Service-specific options. Leave empty for fixed-price services.",
                "properties": {
                  "flows": {
                    "description": "integration only: one entry per flow, $100 per flow per month.",
                    "items": {
                      "properties": {
                        "data": {
                          "description": "What moves, for example orders, inventory, tracking, or invoices",
                          "type": "string"
                        },
                        "destination": {
                          "description": "System the data goes to, for example Katana",
                          "type": "string"
                        },
                        "source": {
                          "description": "System the data comes from, for example Shopify",
                          "type": "string"
                        }
                      },
                      "required": ["destination", "source"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "hours_per_month": {
                    "description": "fractional-caio-cto only: retainer hours per month at $250 per hour",
                    "maximum": 160,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "lines": {
                    "description": "katana-full-setup only: estimated data lines to import, $0.10 each, $4,000 minimum",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "tier": {
                    "description": "ai-we-build-and-run only: monthly tier in USD (Entry, Growth, or Continuous)",
                    "enum": [5000, 10000, 15000],
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "service": {
                "description": "Service id from list_services (apps and the free call are not ordered here). For several services in one order, use items instead.",
                "enum": ["integration", "katana-implementation", "katana-full-setup", "shipstation-implementation", "sutton-implementation", "repzio-implementation", "qbd-to-qbo-migration", "ai-we-build-you-decide", "ai-you-build-we-teach", "ai-we-build-and-run", "custom-software-scope", "fractional-caio-cto"],
                "type": "string"
              }
            },
            "required": ["customer"],
            "type": "object"
          },
