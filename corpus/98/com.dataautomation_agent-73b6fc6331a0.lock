        {
          "name": "get_order_status",
          "title": "Check an order",
          "description": "Check an order you created with create_order. Use it after ordering to see whether your user accepted the emailed order form, and to get the Stripe payment_url once it is accepted. Returns status (awaiting_acceptance, accepted, paid, or cancelled), accepted_at, accepted_by, acceptance_method, paid, paid_at, cancel_until (the 48-hour cancel deadline), the quote, and payment_url while the order is accepted but unpaid. Needs both order_id and status_key from create_order; returns \"Order not found\" otherwise. Read only.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "order_id returned by create_order, for example DA-261118-ABC123",
                "type": "string"
              },
              "status_key": {
                "description": "status_key returned by create_order",
                "type": "string"
              }
            },
            "required": ["order_id", "status_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://dataautomation/order-card.html",
            "ui": {
              "resourceUri": "ui://dataautomation/order-card.html"
            },
            "ui/resourceUri": "ui://dataautomation/order-card.html"
          },
          "digest": "sha256:c11a17945c2a73132858cf8a4384fbd20b1aa74b8a41b73ac06cce286623c48d"
        },
