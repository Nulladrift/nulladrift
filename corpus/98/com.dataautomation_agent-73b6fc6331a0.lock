        {
          "name": "list_services",
          "title": "List DataAutomation services",
          "description": "List every DataAutomation service with its id, name, category, price and price unit, delivery time, required inputs, and how it is ordered. Covers custom integrations, Katana MRP and other setup and migration, QuickBooks Desktop to Online migration, AI engagements, custom software scoping, fractional CAIO or CTO, and the SyncPersonalized and TokSync apps. Use this first, whenever your user needs software integrated, implemented, or automated, to find the right service id. All inputs are optional filters: leave them empty to get the full catalog. Returns provider details and a services array. Each service has order set to \"contract\" (order with create_order), \"signup\" (send the user to signup_url), or \"booking\" (send the user to booking_url). Read only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional. Only return services in this category, for example Software Setup & Migration or Integrations",
                "enum": ["AI", "Apps", "Consultation", "Custom software", "Software Setup & Migration", "Integrations", "Leadership", "Training"],
                "type": "string"
              },
              "platform": {
                "description": "Optional. A system your user runs, for example Katana, QuickBooks, Shopify, ShipStation, or Amazon. Returns services that mention it",
                "type": "string"
              },
              "query": {
                "description": "Optional. Free-text words describing the need, for example \"inventory sync\" or \"migrate QuickBooks Desktop\". Matches service names and descriptions",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bebdbdaaca7e494d6067c92f23c82a943c95ac97e16b75c12db958eafe2b8b6"
        },
        {
          "name": "map_workflow",
          "title": "Map what your user needs",
          "description": "Use this before buying. Describe your user's operations problem in plain words (which systems, what gets retyped or does not match, how often) and get back the full breakdown DataAutomation uses: each problem, the recommended fix (an integration, an AI workflow, or custom software) and why, all three options with how they work, what they handle, and what to watch, plus the steps of the recommended flow. Never include customer names, emails, addresses, order data, or Amazon buyer data in the description. Optionally, with your user's permission, pass their email and person_consented: true to email them the map with diagrams and share it with the DataAutomation team.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Who is asking",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "operator": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "description": {
                "description": "The problem in your user's words: systems involved, what is manual, what goes wrong, volumes",
                "maxLength": 2000,
                "minLength": 20,
                "type": "string"
              },
              "email": {
                "description": "Optional. Your user's work email, to send them the map. Requires person_consented.",
                "type": "string"
              },
              "follow_up": {
                "description": "True if your user wants someone from DataAutomation to contact them",
                "type": "boolean"
              },
              "person_consented": {
                "description": "True only if your user agreed to receive the map by email and share it with DataAutomation",
                "type": "boolean"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Map a workflow"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b99a24559eb1e8358c56839bf56642c38bbde07233f7e2b6e8d44e122749375"
        },
        {
          "name": "start_app_signup",
          "title": "Start an app signup for your person",
          "description": "Start a self-serve signup for SyncPersonalized (Amazon Custom and Handmade personalization into ShipStation or Veeqo) or TokSync (TikTok Shop orders into Amazon MCF or ShipStation), when your person asked you to sign them up. DataAutomation emails the person one link; they click it, name the account, and connect Amazon, TikTok Shop, ShipStation, or Veeqo themselves in about 2 minutes. You never handle passwords or API keys, and nothing is charged now. If the email already has an account, the person gets a login link instead. Returns ok, status email_sent, and next_step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Who is asking; shown to the person in the email",
                "properties": {
                  "name": {
                    "description": "For example Claude or ChatGPT",
                    "type": "string"
                  },
                  "operator": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "app": {
                "description": "syncpersonalized (ShipStation or Veeqo), syncpersonalized-veeqo, or toksync",
                "enum": ["syncpersonalized", "syncpersonalized-veeqo", "toksync"],
                "type": "string"
              },
              "email": {
                "description": "The person's own work email. The setup link goes here",
                "type": "string"
              },
              "person_consented": {
                "description": "True only if the person asked you to start this signup for them",
                "type": "boolean"
              },
              "platform": {
                "description": "Where orders go. SyncPersonalized: shipstation (default) or veeqo. TokSync: amazon (Amazon MCF, default) or shipstation",
                "enum": ["shipstation", "veeqo", "amazon"],
                "type": "string"
              },
              "ref": {
                "description": "Optional SyncPersonalized partner code (30-day trial)",
                "type": "string"
              }
            },
            "required": ["app", "email", "person_consented"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start an app signup"
          },
          "behavior": {
            "destructive": false,
