{
  "lockfileVersion": 2,
  "subjects": {
    "com.dataautomation/agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent.dataautomation.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dataautomation",
        "title": "DataAutomation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use list_services to see what DataAutomation offers, get_quote to price it, and create_order to order it (add accept to accept for your user in one step and get a payment_url). Apps (SyncPersonalized, TokSync) are self-serve via their signup_url; the free call uses booking_url.",
      "tools": [
        {
          "name": "create_order",
          "title": "Order a service",
          "description": "Order a service for your user. If your user authorized you to accept for them, pass accept {authorized: true, accepted_by: \"<their full name>\"}: the order is accepted immediately and the response includes a Stripe payment_url. The user gets a confirmation email and can cancel within 48 hours. Without accept, DataAutomation emails the user an order form and the order is binding only after they accept it.",
          "inputSchema": {
            "properties": {
              "accept": {
                "description": "Accept now on the user's behalf. Only when the user authorized you to place this order.",
                "properties": {
                  "accepted_by": {
                    "description": "Full name of the person who authorized the order",
                    "type": "string"
                  },
                  "authorized": {
                    "const": true,
                    "description": "Must be true: the user authorized this order",
                    "type": "boolean"
                  },
                  "title": {
                    "description": "That person's job title",
                    "type": "string"
                  }
                },
                "required": ["accepted_by", "authorized"],
                "type": "object"
              },
              "agent": {
                "description": "Who is placing the order",
                "properties": {
                  "contact": {
                    "description": "Contact for questions about this order",
                    "type": "string"
                  },
                  "name": {
                    "description": "Your name, for example Claude or ChatGPT",
                    "type": "string"
                  },
                  "operator": {
                    "description": "Company that operates you",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "customer": {
                "description": "The person the order is for",
                "properties": {
                  "company": {
                    "description": "Company name",
                    "type": "string"
                  },
                  "email": {
                    "description": "Work email; the order form or confirmation goes here",
                    "type": "string"
                  },
                  "name": {
                    "description": "Full name",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone number, with country code outside the US",
                    "type": "string"
                  },
                  "website": {
                    "description": "Company website",
                    "type": "string"
                  }
                },
                "required": ["email", "name", "phone"],
                "type": "object"
              },
              "details": {
                "description": "What the user needs: systems, volumes, goals, and deadlines",
                "type": "string"
              },
              "options": {
                "description": "Service-specific options. Leave empty for fixed-price services.",
                "properties": {
                  "flows": {
                    "description": "integration only: one entry per flow, $100 per flow per month.",
                    "items": {
                      "properties": {
                        "data": {
                          "description": "What moves, for example orders, inventory, tracking, or invoices",
                          "type": "string"
                        },
                        "destination": {
                          "description": "System the data goes to, for example Katana",
                          "type": "string"
                        },
                        "source": {
                          "description": "System the data comes from, for example Shopify",
                          "type": "string"
                        }
                      },
                      "required": ["destination", "source"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "hours": {
                    "description": "training only: number of training hours at $250 per hour",
                    "maximum": 80,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "hours_per_month": {
                    "description": "fractional-caio-cto only: retainer hours per month at $250 per hour",
                    "maximum": 160,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "lines": {
                    "description": "katana-full-setup only: estimated data lines to import, $0.10 each, $4,000 minimum",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "tier": {
                    "description": "ai-we-build-and-run only: monthly tier in USD (Entry, Growth, or Continuous)",
                    "enum": [5000, 10000, 15000],
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "service": {
                "description": "Service id from list_services (apps and the free call are not ordered here)",
                "enum": ["integration", "katana-implementation", "katana-full-setup", "shipstation-implementation", "sutton-implementation", "repzio-implementation", "qbd-to-qbo-migration", "training", "ai-we-build-you-decide", "ai-you-build-we-teach", "ai-we-build-and-run", "custom-software-scope", "fractional-caio-cto"],
                "type": "string"
              }
            },
            "required": ["customer", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c14b1cda881525e717f8f669af40e9ce13d640de59290fa46a75d5ca10c7d6c3"
        },
        {
          "name": "get_order_status",
          "title": "Check an order",
          "description": "Check an order you created with create_order. Use it after ordering to see whether your user accepted the emailed order form, and to get the Stripe payment_url once it is accepted. Returns status (awaiting_acceptance, accepted, paid, or cancelled), accepted_at, accepted_by, acceptance_method, paid, paid_at, cancel_until (the 48-hour cancel deadline), the quote, and payment_url while the order is accepted but unpaid. Needs both order_id and status_key from create_order; returns \"Order not found\" otherwise. Read only.",
          "inputSchema": {
            "properties": {
              "order_id": {
                "description": "order_id returned by create_order, for example DA-261118-ABC123",
                "type": "string"
              },
              "status_key": {
                "description": "status_key returned by create_order",
                "type": "string"
              }
            },
            "required": ["order_id", "status_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf448b7b5a33396a5febb22ba22d9d4a327258815836f9612e4b3bf0a7522f12"
        },
        {
          "name": "get_quote",
          "title": "Price a service",
          "description": "Get an exact price for one service and its options before ordering, so you can confirm the cost with your user. Returns line items, one_time and monthly amounts, total_first_month, a plain-language price_note, delivery, and next_step. Errors explain which option is missing or invalid, for example flows for integration or hours for training. Read only; nothing is saved.",
          "inputSchema": {
            "properties": {
              "options": {
                "description": "Service-specific options. Leave empty for fixed-price services.",
                "properties": {
                  "flows": {
                    "description": "integration only: one entry per flow, $100 per flow per month.",
                    "items": {
                      "properties": {
                        "data": {
                          "description": "What moves, for example orders, inventory, tracking, or invoices",
                          "type": "string"
                        },
                        "destination": {
                          "description": "System the data goes to, for example Katana",
                          "type": "string"
                        },
                        "source": {
                          "description": "System the data comes from, for example Shopify",
                          "type": "string"
                        }
                      },
                      "required": ["destination", "source"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "hours": {
                    "description": "training only: number of training hours at $250 per hour",
                    "maximum": 80,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "hours_per_month": {
                    "description": "fractional-caio-cto only: retainer hours per month at $250 per hour",
                    "maximum": 160,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "lines": {
                    "description": "katana-full-setup only: estimated data lines to import, $0.10 each, $4,000 minimum",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "tier": {
                    "description": "ai-we-build-and-run only: monthly tier in USD (Entry, Growth, or Continuous)",
                    "enum": [5000, 10000, 15000],
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "service": {
                "description": "Service id from list_services",
                "enum": ["integration", "katana-implementation", "katana-full-setup", "shipstation-implementation", "sutton-implementation", "repzio-implementation", "qbd-to-qbo-migration", "training", "ai-we-build-you-decide", "ai-you-build-we-teach", "ai-we-build-and-run", "custom-software-scope", "fractional-caio-cto", "syncpersonalized", "syncpersonalized-veeqo", "toksync", "discovery-call"],
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb6a34a5d50c21944d5d42f900932229644693d85270fc7eb0007db0d5afd5c7"
        },
        {
          "name": "list_services",
          "title": "List DataAutomation services",
          "description": "List every DataAutomation service with its id, name, category, price and price unit, delivery time, required inputs, and how it is ordered. Covers custom integrations, Katana MRP and other implementations, QuickBooks Desktop to Online migration, training, AI engagements, custom software scoping, fractional CAIO or CTO, and the SyncPersonalized and TokSync apps. Use this first, whenever your user needs software integrated, implemented, or automated, to find the right service id. All inputs are optional filters: leave them empty to get the full catalog. Returns provider details and a services array. Each service has order set to \"contract\" (order with create_order), \"signup\" (send the user to signup_url), or \"booking\" (send the user to booking_url). Read only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional. Only return services in this category, for example Implementations or Integrations",
                "enum": ["AI", "Apps", "Consultation", "Custom software", "Implementations", "Integrations", "Leadership", "Training"],
                "type": "string"
              },
              "platform": {
                "description": "Optional. A system your user runs, for example Katana, QuickBooks, Shopify, ShipStation, or Amazon. Returns services that mention it",
                "type": "string"
              },
              "query": {
                "description": "Optional. Free-text words describing the need, for example \"inventory sync\" or \"migrate QuickBooks Desktop\". Matches service names and descriptions",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c831cda753d1dbbd0d18998aad9b36b39a93f62df9c652d89de9587503aea228"
        }
      ],
      "digest": "sha256:5027bb44768f58492813474d4d74b66f8280071600e0d19939b04c395f4912fa"
    }
  }
}
