      },
      "instructions": "Visa Engine answers from its own catalog of 18 visa routes in the US, UK, Schengen area, Canada and Australia, with official sources. Results are informational, not legal advice or a government decision. Routes outside the catalog are reported as not covered.",
      "tools": [
        {
          "name": "check_visa_readiness",
          "title": "Check visa readiness",
          "description": "Readiness check for one visa. For visitor visas (US B-1/B-2, UK Standard Visitor, Schengen, Canada visitor, Australia 600) it takes the traveller's passport country, destination, purpose, month, trip length and a short list of answers, and returns a readiness band, areas, findings and recommendations; it says which questions to ask when something is missing, and says so when no visa is needed. For talent and student visas (e.g. O-1A, UK Global Talent) it lists the criteria and marks which ones the person says they have something for, by criterion key; this is self-reported, unverified and not an eligibility decision. Examples: how ready am I for a UK visitor visa, check my Schengen application readiness, which O-1A criteria do I still need evidence for. It gives no approval probability or processing time and stores nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 64,
                      "type": "string"
                    },
                    {
                      "items": {
                        "maxLength": 64,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    }
                  ]
                },
                "description": "Visitor visas: question id to chosen option value (a list for multiple-choice questions). Leave out to be told which questions to ask.",
                "propertyNames": {
                  "maxLength": 64,
                  "type": "string"
                },
                "type": "object"
              },
              "destination": {
                "description": "Visitor visas: ISO alpha-2 code of the country travelled to. For EU-SCHENGEN, the Schengen state (e.g. IT). For a national visa it must be that visa's country (UK-SV: GB, B-1/B-2: US, CA-TRV: CA, AU-600: AU) and defaults to it.",
                "maxLength": 2,
                "type": "string"
              },
              "locale": {
                "description": "Language for names and explanations: en, tr, es or pt. Defaults to en.",
                "enum": ["en", "tr", "es", "pt"],
                "type": "string"
              },
              "nationality": {
                "description": "Visitor visas: the traveller's passport country, as an ISO alpha-2 code (TR) or English name.",
                "maxLength": 80,
                "type": "string"
              },
              "purpose": {
                "description": "Visitor visas: why the person travels.",
                "enum": ["tourism", "family", "medical", "short_business", "mixed"],
                "type": "string"
              },
              "selfReportedCriteria": {
                "description": "Talent and student visas: criterion keys the person says they have something for. Keys only, never a description of the person's achievements. Get the keys from get_visa_requirements.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "travelMonth": {
                "description": "Visitor visas: roughly when, as YYYY-MM, from last month to two years ahead.",
                "maxLength": 7,
                "type": "string"
              },
              "tripLength": {
                "description": "Visitor visas: how long the trip lasts.",
                "enum": ["up_to_14", "15_to_30", "31_to_90", "over_90", "open_ended"],
                "type": "string"
              },
              "visaType": {
                "description": "Visa Engine visa key, e.g. O-1A (US extraordinary ability), UK-GTV (UK Global Talent), UK-SV (UK Standard Visitor), EU-SCHENGEN (Schengen short stay), B-1/B-2 (US visitor). Call list_supported_routes for the full list.",
                "enum": ["O-1A", "O-1B", "EB-1A", "EB-2-NIW", "UK-GTV", "EU-BLUE", "CA-FSW", "AU-858", "B-1/B-2", "UK-SV", "CA-TRV", "AU-600", "EU-SCHENGEN", "CA-SP", "UK-STUDENT", "F-1", "AU-500", "DE-STUDENT"],
                "type": "string"
              }
            },
            "required": ["visaType"],
            "type": "object"
          },
