        {
          "name": "list_supported_routes",
          "title": "List supported visa routes",
          "description": "Lists the visa routes Visa Engine covers (visa keys, names, kind and country), the destinations its visitor-visa checks accept, and the languages it answers in. Use it to find the visa key for get_visa_requirements or check_visa_readiness, or to tell whether a route is covered at all — for example whether Visa Engine covers the UK Global Talent visa, US O-1A, Schengen visitor visas or Canadian study permits. Routes not listed are not covered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only this kind of route: talent (work by distinction), visitor (short trips), student.",
                "enum": ["talent", "visitor", "student"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "Only this jurisdiction: US, GB (United Kingdom), EU (Schengen and Germany), CA, AU.",
                "enum": ["US", "GB", "EU", "CA", "AU"],
                "type": "string"
              },
              "locale": {
                "description": "Language for names and explanations: en, tr, es or pt. Defaults to en.",
                "enum": ["en", "tr", "es", "pt"],
                "type": "string"
              }
            },
            "type": "object"
