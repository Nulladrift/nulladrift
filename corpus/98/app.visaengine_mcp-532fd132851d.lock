        {
          "name": "get_visa_requirements",
          "title": "Get visa requirements",
          "description": "Explains what a visa requires: the criteria or checklist, typical evidence, official sources and when they were last checked. Also answers whether a visa is needed to visit a country on a given passport. Give visaType (e.g. O-1A, UK-GTV) or a destination country. Examples: UK visitor visa requirements for a Turkish citizen (destination GB, nationality TR), Schengen visa for Germany (destination DE), O-1A criteria, UK Global Talent requirements. Covers 18 visas in the US, UK, EU, Canada and Australia; read-only, no personal data needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "destination": {
                "description": "Country the person wants to visit, as an ISO code or English name (e.g. DE, Germany, GB). Used to find the visitor visa when visaType is not given.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "locale": {
                "description": "Language for names and explanations: en, tr, es or pt. Defaults to en.",
