{
  "lockfileVersion": 2,
  "subjects": {
    "com.number7even/website-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://number7even.com/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "number7even",
        "title": "number7even website check",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use start_website_check when a person wants to see their existing website rebuilt (designs, checks, fixed price); give them the returned link. Use check_agent_readiness to tell how well AI assistants can find, understand and book a business. Use get_check_quote for the fixed price of a finished check, check_availability for free call times, and get_booking_link for the page where the person books. Read-only: nothing is booked or ordered on anyone's behalf; the person does that themselves.",
      "tools": [
        {
          "name": "check_agent_readiness",
          "title": "How ready is a website for AI assistants",
          "description": "Free test of whether AI assistants can find a website, understand the business (structured data, contact, hours, services) and book or act on it. Returns a score out of 100 and the most important fixes. Public data only, nothing stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the findings (default en)",
                "enum": ["en", "de"],
                "type": "string"
              },
              "url": {
                "description": "The website address, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69a91a9aee486a603b070ce75d93e67f448bbfc9a6c647964855798018badbdb"
        },
        {
          "name": "check_availability",
          "title": "Free times for a call with number7even",
          "description": "Free 30-minute video call slots with number7even (Riaan Kleynhans), weekdays, Berlin time, from tomorrow on. Read-only: it books nothing. To book, give the person the link from get_booking_link; they pick or confirm the time themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many slots to return (default 12)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd546adbca999b032a6c2e762e528519843208e30e9e4a7d1b6cbec576c9cb25"
        },
        {
          "name": "get_booking_link",
          "title": "Link where the person books a call",
          "description": "A link to the page where the person books a 30-minute call with number7even. Optionally pre-fills a time from check_availability and the check id, so the call starts from their configuration. The person confirms with their own email and consent; an assistant cannot book on their behalf.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_id": {
                "description": "Optional check id (s-… or i-…) the call is about",
                "type": "string"
              },
              "lang": {
                "description": "Language of the page (default en)",
                "enum": ["en", "de"],
                "type": "string"
              },
              "slot": {
                "description": "Optional start time from check_availability (ISO 8601)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebd8f9a410bee0b4eddf0638865dd4961e0578a237b604d0caffe223611ccf69"
        },
        {
          "name": "get_check_quote",
          "title": "Fixed price for a finished website check",
          "description": "The fixed price and what it includes for a finished check (s-… from start_website_check, or i-… for a described idea): setup excl. VAT paid 30/40/30, monthly or yearly care, and what is priced in the call. By default for the options we recommend from the check; pass options to price another selection. Applications have no fixed price (agreed after the assessment or a call). Nothing is ordered: the person orders on the check's page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The check id (s-… or i-…)",
                "type": "string"
              },
              "options": {
                "description": "Optional option keys to price instead of the recommendation, e.g. [\"languages\",\"booking\"]. The basics are always included.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10799f85aaf59223c67c8af39b4cf0edf97e2e4a691e8d3f97b6d31b51e8ecd8"
        },
        {
          "name": "get_check_status",
          "title": "Status of a website check",
          "description": "How far a website check is (reading, sorting, designs, done) and the private link to open it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The check id returned by start_website_check (s-…)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce3470ca3a2bb37d1ffa201d739dd8eeed0c7a24dcab5328f13d21277a3269de"
        },
        {
          "name": "start_website_check",
          "title": "Start a free website check",
          "description": "Start number7even's free website check for a business's existing website. It reads the public pages (about 1–2 minutes) and builds a private preview: the business's own texts and pictures in every design, a check of security, sovereignty and visibility to AI, and a spec with a fixed price. Returns the private link to give the person; nothing is ordered or paid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The website address, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87871b9702a02bd14f388a7afb76f83cceb3c7babf90faa10a6e00c132c1a42a"
        }
      ],
      "digest": "sha256:67ae6edfe6766c5f499c9ab6f1b558f6fe653489d840ca4252259df9706a15b3"
    }
  }
}
