{
  "lockfileVersion": 2,
  "subjects": {
    "com.greenerahead/reporting-rules": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.greenerahead.com/mcp/public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "greener-ahead",
        "title": "Greener Ahead",
        "version": "1.3.1",
        "description": "Carbon accounting, VSME and CSRD reporting and climate strategy, with the source of every figure.",
        "websiteUrl": "https://greenerahead.com/ai-connectors",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png",
            "sizes": ["128x128"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public Greener Ahead tools: check which sustainability reporting rules apply to a company, and read the official text of a VSME or ESRS disclosure.",
      "tools": [
        {
          "name": "check_reporting_obligation",
          "title": "Check reporting obligations",
          "description": "Checks whether CSRD reporting applies to a company after the 2026 EU simplification (or, for a company in France, under French law in force, with the French greenhouse gas report BEGES), whether the voluntary VSME standard and the value-chain cap are relevant, and whether the Dutch CO2-Prestatieladder matters. Uses headcount and turnover; no account needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asked_by": {
                "description": "Who is asking for sustainability information",
                "enum": ["bank", "customer", "tender", "investor", "none"],
                "type": "string"
              },
              "balance_sheet_eur": {
                "description": "Balance-sheet total in euros (used by the French size test)",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              },
              "country": {
                "description": "Two-letter country code, for example NL",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor from an earlier result of this tool.",
                "maxLength": 8192,
                "type": "string"
              },
              "employees": {
                "description": "Average number of employees of the group",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "employees_basis": {
                "description": "How employees was counted (the French BEGES threshold counts full-time equivalents under C. trav. L1111-2)",
                "enum": ["headcount", "fte", "average"],
                "type": "string"
              },
              "eu_parent": {
                "description": "True when the group is headed in the EU (default true)",
                "type": "boolean"
              },
              "listed": {
                "description": "True when listed on an EU regulated market",
                "type": "boolean"
              },
              "section": {
                "description": "One part of a shortened result: a \"$section\" path from an earlier result of this tool, for example items/0/adoption. The other arguments stay as before, and cursor pages a long part.",
                "maxLength": 512,
                "type": "string"
              },
              "turnover_eur": {
                "description": "Annual net turnover of the group in euros",
                "maximum": 10000000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["employees", "turnover_eur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check reporting obligations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5f5ab9c5272d4f68b067e4daacb3a798fa99f05f16172a69c1fe770a91b869a"
        },
        {
          "name": "explain_disclosure",
          "title": "Read an official disclosure text",
          "description": "Returns the official text of a disclosure in the EU voluntary standard for SMEs (VSME, B1-B11 and C1-C9) or in the ESRS (2026 edition, for example E1-8 or S1-5), with its EUR-Lex link. ESRS text is available in English, Dutch, German, French, Italian, Spanish and Polish.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Disclosure code, for example B3 or E1-8",
                "maxLength": 12,
                "minLength": 2,
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor from an earlier result of this tool.",
                "maxLength": 8192,
                "type": "string"
              },
              "language": {
                "description": "The language the person writes in, for labels and headings, for example nl. Defaults to the AI app's locale, else English.",
                "enum": ["en", "nl", "de", "fr", "it", "es", "pl"],
                "type": "string"
              },
              "section": {
                "description": "One part of a shortened result: a \"$section\" path from an earlier result of this tool, for example items/0/adoption. The other arguments stay as before, and cursor pages a long part.",
                "maxLength": 512,
                "type": "string"
              },
              "standard": {
                "enum": ["vsme", "esrs"],
                "type": "string"
              }
            },
            "required": ["code", "standard"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an official disclosure text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:269064ee328cd305a2126969764b55fbb6c1254e7dc64c42a91b5b93c2813512"
        }
      ],
      "digest": "sha256:73c2677541df14eaa8a2a52c838aae8deecd67012c4d4b7767203e3c7ca0a8b8"
    }
  }
}
