                        "type": "number"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["animations", "prices"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["animationSeconds", "currencies", "freeTrialAnimations", "packs", "plans", "source", "topups"],
            "type": "object"
