        {
          "name": "search_linof_docs",
          "title": "Search Linof docs",
          "description": "Search Linof's public documentation (what Linof does, how a film is made, pricing, guides, policies) by keywords. Use it first when a question is about Linof and you do not yet know which page answers it; then read a page in full with fetch_linof_doc.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many matches to return (1–10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords to look for, e.g. \"refund\" or \"old photos restore\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "excerpt": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "path", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
