            "additionalProperties": false,
            "properties": {
              "plan": {
                "description": "Only this plan. Leave out for every plan.",
                "enum": ["starter", "standard", "premium"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "animationSeconds": {
                "type": "number"
              },
              "buyUrl": {
                "type": "string"
              },
