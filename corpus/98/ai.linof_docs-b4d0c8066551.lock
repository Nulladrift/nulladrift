                  "properties": {
                    "animations": {
                      "type": "number"
                    },
                    "minutes": {
                      "type": "number"
                    },
                    "prices": {
                      "additionalProperties": {
                        "type": "number"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["animations", "minutes", "prices"],
                  "type": "object"
                },
                "type": "array"
              },
              "plans": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
