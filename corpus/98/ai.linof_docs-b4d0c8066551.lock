      "serverInfo": {
        "name": "linof-docs",
        "title": "Linof docs",
        "version": "cd51feca2759584d831cb2a684e45604e7122979",
        "description": "Linof's public docs and live prices: read-only, no sign-in. Linof turns family photos into a film.",
        "websiteUrl": "https://linof.ai",
        "icons": [
          {
            "src": "https://linof.ai/icons/icon-512-v3.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://linof.ai/linof-mark.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This server is Linof's public documentation and live prices, read-only and with no sign-in. Linof (https://linof.ai) turns family photos and home videos into a short cinematic film with music. Use search_linof_docs to find the page that answers a question, fetch_linof_doc to read it in full, and get_linof_pricing for what Linof costs right now. This server cannot make a film or touch any account: a film is made by signing in at https://linof.ai.",
      "tools": [
        {
          "name": "fetch_linof_doc",
          "title": "Read a Linof doc",
          "description": "Read one of Linof's public markdown docs in full, by its path (\"/pricing.md\") or its https://linof.ai URL. Use it after search_linof_docs, or directly for /index.md (the product overview) and /pricing.md.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "The doc's path, e.g. \"/pricing.md\", or its full URL, e.g. \"https://linof.ai/index.md\".",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "markdown": {
                "type": "string"
              },
              "path": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["markdown", "path", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:858b456f7e9bb7087d05a52747457c90f475987212e269958e2102227b2a5de2"
        },
        {
          "name": "get_linof_pricing",
          "title": "Get Linof's live prices",
          "description": "Get the prices Linof sells at right now: the Starter, Standard and Premium plans, their packages in every currency, top-ups and the free trial, read live from Linof's pricing service. Use it for any question about cost, rather than quoting a price from memory.",
