                            "additionalProperties": {
                              "type": "number"
                            },
                            "type": "object"
                          }
                        },
                        "required": ["animations", "filmSeconds", "id", "prices"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "tag": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "packages"],
                  "type": "object"
                },
                "type": "array"
              },
              "pricingPage": {
                "type": "string"
              },
