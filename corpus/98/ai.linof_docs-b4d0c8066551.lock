                        "type": "number"
                      },
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "packages": {
                      "items": {
                        "properties": {
                          "animations": {
                            "type": "number"
                          },
                          "filmSeconds": {
                            "type": "number"
                          },
