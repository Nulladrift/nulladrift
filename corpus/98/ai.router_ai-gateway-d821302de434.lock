{
  "lockfileVersion": 2,
  "subjects": {
    "ai.router/ai-gateway": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.router.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "router",
        "version": "1.27.2"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "370.ai unified AI gateway (one key, 100+ models). Tools: chat = call any text model (Claude / GPT / Gemini / DeepSeek / Qwen ...) and get its reply — use it when you need a different model, a model you don't have access to, or a cheaper / more specialized one (no need to route your own ordinary conversation through it); generate_image / text_to_speech = image / speech generation you cannot do yourself. list_models returns the full catalog. Each user brings their own 370.ai API key (Authorization: Bearer <key>); sign up at https://370.ai to get free trial credits.",
      "tools": [
        {
          "name": "chat",
          "description": "Ask any text/chat model on 370.ai (Claude / GPT / Gemini / DeepSeek / Qwen / ...) and get its reply.\n\n    Use this when you want a **specific or different** model than your own — e.g. consult Claude while you run on\n    GPT, use a cheaper model for bulk work, or reach a model you don't have direct access to. One key, 100+ models.\n    Call list_models to see the full catalog of model ids.\n\n    Args:\n        prompt: the user message / question.\n        model: model id to call (see list_models). Empty = a fast cheap default.\n        system: optional system instruction to steer the model.\n        max_tokens: optional cap on output length (omit to let the model decide).\n        temperature: optional sampling temperature 0..2 (omit for the model's default).\n    Returns the model's text reply.\n    ",
          "inputSchema": {
            "properties": {
              "max_tokens": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Tokens"
              },
              "model": {
                "default": "",
                "title": "Model",
                "type": "string"
              },
              "prompt": {
                "title": "Prompt",
                "type": "string"
              },
              "system": {
                "default": "",
                "title": "System",
                "type": "string"
              },
              "temperature": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Temperature"
              }
            },
            "required": ["prompt"],
            "title": "chatArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "chatOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86fc6fe2b16e5da2c9d1c325253cd96441844c0e4563ca2cccbabf7fffd69cb6"
        },
        {
          "name": "generate_image",
          "description": "Generate an image from a text prompt. Use whenever the user wants a picture/illustration/photo created.\n\n    Args:\n        prompt: description of the image (English works best).\n        size: 1024x1024 (square) / 1024x1536 (portrait) / 1536x1024 (landscape).\n    Returns the generated PNG image.\n    ",
          "inputSchema": {
            "properties": {
              "prompt": {
                "title": "Prompt",
                "type": "string"
              },
              "size": {
                "default": "1024x1024",
                "title": "Size",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "title": "generate_imageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:95ee20874cf189cde521a14d51ad740c17d14b508fa446b249aa32c6f2ac95a9"
        },
        {
          "name": "list_models",
          "description": "List every model id your API key can call on 370.ai (chat / image / video / audio). Free, no billing.",
          "inputSchema": {
            "properties": {},
            "title": "list_modelsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_modelsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f068e60b57886d50d719cf925f13a28bfea3d5f2dec398616e43e5fa9444c6f9"
        },
        {
          "name": "text_to_speech",
          "description": "Convert text to spoken audio. Billed per input character on your key.\n\n    Args:\n        text:  the text to speak.\n        voice: voice id. The OpenAI voice names (alloy / echo / fable / onyx / nova / shimmer) are\n               accepted, but on the default model they are all mapped to the same default voice, so\n               they sound identical. To pick a different voice, pass a voice id supported by the model\n               (for the default model, e.g. Cherry or Ethan).\n    Returns a short status line plus the generated audio as an audio content block\n    (mimeType as returned by the gateway, e.g. audio/mpeg).\n    ",
          "inputSchema": {
            "properties": {
              "text": {
                "title": "Text",
                "type": "string"
              },
              "voice": {
                "default": "alloy",
                "title": "Voice",
                "type": "string"
              }
            },
            "required": ["text"],
            "title": "text_to_speechArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10398dd75c9b69504856f1234321a9718f3df22a65363d0b9eb793ae099f1c0f"
        }
      ],
      "digest": "sha256:70569048a628b1beef514244670df2fde0f7b55293a45e8d8abc6e253ab3396a"
    }
  }
}
