{
  "lockfileVersion": 2,
  "subjects": {
    "com.caymanjobfinder/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://caymanjobfinder.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "caymanjobfinder",
        "title": "Cayman Job Finder",
        "version": "1.0.0",
        "websiteUrl": "https://caymanjobfinder.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search current job vacancies in the Cayman Islands, collected from the official WORC Jobs Portal and employer careers pages. Always share the caymanjobfinder.com link for each job: it shows the advert and links to the official place to apply. Cayman Job Finder is independent and never takes applications.",
      "tools": [
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "Get the basic facts of one current job by its slug (from search_jobs): title, employer, pay as stated, location, dates and the job page link, which links to the official advert for full details and how to apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "A job slug from search_jobs.",
                "pattern": "^[a-z0-9-]{1,160}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d018069b4442293d51311e7c8ea260e479ca3f904939ad300be5b6a08e0bbd2f"
        },
        {
          "name": "hiring_report_stats",
          "title": "Cayman Hiring Report figures",
          "description": "Headline figures from the published monthly Cayman Hiring Report (job adverts posted on the official WORC Jobs Portal that month: adverts, positions, employers, median advertised pay, most advertised sectors, best-paid sectors, advert length), exactly as published, with a link to the full report and its method. These are counts of public adverts by Cayman Job Finder, not official WORC statistics. Defaults to the latest edition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "edition": {
                "description": "Report month as YYYY-MM (published: 2026-10). Default: the latest.",
                "enum": ["2026-10"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cayman Hiring Report figures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a44c022f71c15df6fa42cbca75857a2a3223edf46f656e16c4a0f5d479dcacab"
        },
        {
          "name": "list_employers",
          "title": "List employers hiring",
          "description": "List employers with current vacancies in the Cayman Islands, with their number of open jobs and a link to their jobs on caymanjobfinder.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Job category slug.",
                "enum": ["accounting-finance", "funds-banking-insurance", "legal-compliance", "it-technology", "healthcare", "caregiving", "education-childcare", "chefs-kitchen", "food-beverage-service", "hotel-tourism", "engineering-architecture", "construction-trades", "cleaning-domestic", "gardening-pools", "mechanics-maintenance", "drivers-logistics", "marine-aviation", "beauty-fitness", "security", "sales-retail", "admin-hr-management", "other"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum employers (default 50).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "District slug.",
                "enum": ["bodden-town", "camana-bay", "cayman-brac", "east-end", "george-town", "little-cayman", "north-side", "red-bay-prospect", "savannah-lower-valley", "seven-mile-beach", "south-sound", "spotts-newlands", "west-bay"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List employers hiring"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:425b0afdd37e6dcc7affaae9c1bfdeefd4b7ca373a6cc64b24fc27e7a36f1c22"
        },
        {
          "name": "search_jobs",
          "title": "Search Cayman Islands jobs",
          "description": "Search current, open job vacancies in the Cayman Islands (from the official WORC Jobs Portal and employer careers pages), newest first. All filters are optional. Each result links to its caymanjobfinder.com page, which links to the official advert to apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Job category slug.",
                "enum": ["accounting-finance", "funds-banking-insurance", "legal-compliance", "it-technology", "healthcare", "caregiving", "education-childcare", "chefs-kitchen", "food-beverage-service", "hotel-tourism", "engineering-architecture", "construction-trades", "cleaning-domestic", "gardening-pools", "mechanics-maintenance", "drivers-logistics", "marine-aviation", "beauty-fitness", "security", "sales-retail", "admin-hr-management", "other"],
                "type": "string"
              },
              "closing_before": {
                "description": "Only jobs closing on or before this date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "keyword": {
                "description": "Words to match in the job title or employer name, e.g. \"accountant\" or \"Health City\".",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "Results per page (1-20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "District slug, e.g. george-town.",
                "enum": ["bodden-town", "camana-bay", "cayman-brac", "east-end", "george-town", "little-cayman", "north-side", "red-bay-prospect", "savannah-lower-valley", "seven-mile-beach", "south-sound", "spotts-newlands", "west-bay"],
                "type": "string"
              },
              "new_since": {
                "description": "Only jobs listed on or after this date (YYYY-MM-DD, Cayman time).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "offset": {
                "description": "Skip this many results, for the next page.",
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Cayman Islands jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee31678382f29f2e19d802a338e4ae62525607c1c45173a3ffb389a3be9d1b15"
        }
      ],
      "digest": "sha256:0681486a4e5d0c01a7eb27810e2c4b75dff14c5eb14bb94d135e7aa98f2efedc"
    }
  }
}
