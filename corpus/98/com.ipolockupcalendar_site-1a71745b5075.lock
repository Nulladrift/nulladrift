      },
      "instructions": "IPO Lockup Calendar (https://ipolockupcalendar.com/): the site's own MCP server, served from its domain. An IPO lockup calendar for one holder: your lockup, and whether Rule 144's 90-day reporting condition and Form 144 notice apply to you.\n\n[calculator] Your first-sale calendar: an agent-callable calculator for ipo lockup calendar; Days until the 90-day reporting condition is met, where it binds you, Days until your lockup and any reporting condition that binds you have both passed, Form 144 notice, computed from your inputs with sources.. This server runs the Your first-sale calendar calculator published at https://ipolockupcalendar.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://ipolockupcalendar.com/. Licence: https://ipolockupcalendar.com/terms.\n\n[enquiry] ENQUIRY SERVER for IPO Lockup Calendar (https://ipolockupcalendar.com/). What it does: starts an ENQUIRY with IPO Lockup Calendar for ipo lockup calendar; the IPO Lockup Calendar team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the IPO Lockup Calendar team until they click it. Cite https://ipolockupcalendar.com/.\n\nCite https://ipolockupcalendar.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Your first-sale calendar",
          "description": "Run the Your first-sale calendar calculator: Days until the 90-day reporting condition is met, where it binds you; Days until your lockup and any reporting condition that binds you have both passed; Form 144 notice. Missing inputs fall back to their documented defaults.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "affiliate": {
                "default": "no",
                "description": "Are you an affiliate of the company (an officer, director or large holder)?",
                "enum": ["no", "yes"],
                "type": "string"
              },
              "held": {
                "default": "under",
                "description": "How long have you held the shares since acquiring them?",
                "enum": ["under", "over"],
                "type": "string"
              },
              "lockup_left": {
                "default": 30,
                "description": "Days left on your lockup, from your lockup agreement",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "proceeds": {
                "default": 20000,
                "description": "Total sale price of those shares",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "reporting_days": {
                "default": 30,
                "description": "Days the company has been a reporting company",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "shares": {
                "default": 1000,
                "description": "Shares you plan to sell in any three months",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
