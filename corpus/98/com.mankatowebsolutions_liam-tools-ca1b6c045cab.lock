      "instructions": "Liam Tools: small JSON utilities for agents. Free: numbers_summary, text_metrics, normalize_json, budget_lens. 3 free calls a day each: ai_ready_check, site_card, email_auth, site_health, article_check (article_check returns a 0-100 credibility estimate, not a fact-check). link_check is paid. More calls: send Authorization: Bearer lt_... (prepaid, $5 = 500 calls, https://api.mankatowebsolutions.com/offer) or pay per call over x402 (0.01 XRP / 0.02 USDC / 0.02 RLUSD) on the REST routes in /.well-known/x402.",
      "tools": [
        {
          "name": "ai_ready_check",
          "title": "AI-readiness check",
          "description": "AI-search readiness check of a website, with every fix. 3 free A2A or X-Free-Trial calls per day per IP, then 0.01 XRP (or 0.02 USDC / 0.02 RLUSD). 3 free calls per day, then a prepaid key or x402 payment.",
