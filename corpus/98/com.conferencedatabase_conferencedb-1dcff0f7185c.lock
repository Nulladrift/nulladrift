      "instructions": "ConferenceDB lists which companies sponsor and exhibit at conferences and trade shows, with the sponsorship packages organizers publish. search_conferences finds events by topic, place or date; get_conference gives one event's dates, organizer, packages and top companies; get_conference_sponsors lists its companies; get_company_conferences lists one company's events; find_sponsors_for_event lists companies at the most events like a given one. Company-level data only.",
      "tools": [
        {
          "name": "find_sponsors_for_event",
          "title": "Find sponsors for an event",
          "description": "Use this when someone organizing a conference, trade show or event wants companies that might sponsor or exhibit at it. Takes their event (a name or website, if it is in the database) and/or a topic and a place. Returns the companies listed at the most similar conferences, with how many of those conferences each was at, how many as a sponsor or partner, and a few of the events, plus the conferences compared. Company-level only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event": {
                "description": "The organizer's own conference or one like it: a name such as \"Money20/20\" or a website such as money2020.com.",
                "maxLength": 120,
                "type": "string"
              },
              "limit": {
                "description": "Companies to return, default 25, at most 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "A city, country or region, such as Chicago, Germany or Europe. Leave out for anywhere.",
                "maxLength": 80,
                "type": "string"
              },
              "topic": {
                "description": "Industry or subject of the event, such as fintech, healthcare, AI or retail. Leave out to use the named event's industry.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "companies": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "as_sponsor_at": {
                      "type": "number"
                    },
                    "domain": {
                      "type": ["string", "null"]
                    },
                    "industry": {
                      "$ref": "#/properties/companies/items/properties/domain"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page_url": {
                      "$ref": "#/properties/companies/items/properties/domain"
                    },
                    "seen_at": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "similar_conferences_at": {
                      "type": "number"
                    }
                  },
                  "required": ["as_sponsor_at", "domain", "industry", "name", "page_url", "seen_at", "similar_conferences_at"],
                  "type": "object"
                },
                "type": "array"
              },
              "conferences_compared": {
                "type": "number"
              },
              "example_conferences": {
                "items": {
                  "$ref": "#/properties/matched_event/anyOf/0"
                },
                "type": "array"
              },
              "finder_url": {
                "$ref": "#/properties/matched_event/anyOf/0/properties/page_url"
              },
              "found": {
                "type": "boolean"
              },
              "matched_event": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "page_url": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "page_url", "slug"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "message": {
                "type": "string"
              },
              "returned": {
                "type": "number"
              },
              "scope": {
                "type": "string"
              },
              "total_companies": {
                "type": "number"
              }
            },
            "required": ["companies", "conferences_compared", "example_conferences", "finder_url", "found", "matched_event", "message", "returned", "scope", "total_companies"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
