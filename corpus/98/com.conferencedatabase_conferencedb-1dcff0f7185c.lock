        {
          "name": "search_conferences",
          "title": "Search conferences",
          "description": "Use this to find conferences and trade shows by topic, place, year or month, for example fintech conferences in 2027 or events in Las Vegas in March. Returns matching events, largest company lists first, with dates, city and country, the event's own website, how many sponsors and exhibitors are listed, and the conferencedatabase.com page for each. With no year or month it returns upcoming events only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many events to return, default 10, at most 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "A city, country or region, such as Las Vegas, Germany or Europe.",
                "maxLength": 80,
                "type": "string"
              },
              "month": {
                "description": "Month number, 1 to 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Industry or subject, such as fintech, healthcare, AI, cybersecurity, retail or manufacturing. Leave out for all topics.",
                "maxLength": 80,
                "type": "string"
              },
              "year": {
                "description": "Four-digit year of the event.",
                "maximum": 2035,
                "minimum": 2018,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "events": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "dates": {
