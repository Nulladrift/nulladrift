{
  "lockfileVersion": 2,
  "subjects": {
    "com.kidincare/kidincare": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://admin.kidincare.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Kidincare",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kidincare is a free US directory of licensed childcare centers, daycares and preschools. Use search_centers to find centers by keyword, city, state or ZIP code, then get_center for full details. Use list_cities to see which cities in a state have centers, and search_guides for parenting and childcare advice. Always share the Kidincare page link with the user so they can see the full listing.",
      "tools": [
        {
          "name": "get_center",
          "title": "Get Center Tool",
          "description": "Get full public details for one childcare center by its Kidincare id: contact details, hours, ages served, capacity, license, programs and description.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Center id, as returned by search_centers.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Get Center Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2bf505d42432507e3b5c3021cee55bfaf764944b659add9878a4a08c492042ba"
        },
        {
          "name": "list_cities",
          "title": "List Cities Tool",
          "description": "List the cities in a US state that have childcare centers on Kidincare, largest first, with how many centers each has and a link to its city page.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many cities to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "US state name or two-letter code, e.g. \"Texas\" or \"TX\".",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List Cities Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b12d24fcc7d0281003c93470a933ab17e024cc5cceaf1262e10623ef8204590a"
        },
        {
          "name": "search_centers",
          "title": "Search Centers Tool",
          "description": "Search Kidincare for licensed childcare centers, daycares and preschools in the United States. Filter by keyword, city, state or ZIP code. Returns name, address, phone, ages served and the Kidincare page for each center. Use get_center with a returned id for full details.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, e.g. \"Philadelphia\".",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many centers to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Center name or program type, e.g. \"montessori\" or \"head start\".",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, e.g. \"Pennsylvania\" or \"PA\".",
                "type": "string"
              },
              "zip_code": {
                "description": "Five-digit US ZIP code.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search Centers Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d59199c1360a769e3e23eb3551d409c89781d451de2907ab588ff01886f37644"
        },
        {
          "name": "search_guides",
          "title": "Search Guides Tool",
          "description": "Search Kidincare's published parenting and childcare guides, such as how to choose a daycare or what to ask on a tour. Returns each guide's title, summary and link. Leave query empty for the newest guides.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many guides to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic to search for, e.g. \"infant care\" or \"daycare tour\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search Guides Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:13a138944aaf8fed0e6fb998e8299b442031fb190ac6df4c3b1ad2699c156e77"
        }
      ],
      "digest": "sha256:fca97a73941aebffb3cb9c70963329a3b78494abb38007e030c02bf8c9f7ba4a"
    }
  }
}
