      "serverInfo": {
        "name": "flowsimp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "create_flowchart",
          "title": "Create flowchart",
          "description": "Turn Mermaid flowchart or graph syntax, or an indented outline, into FlowSimp links. Use it when the steps already exist as text and someone needs a diagram they can view or edit. Returns JSON with shareUrl (a read-only /view# link), editUrl (opens the editor at /?board=), nodeCount, and connectionCount. An optional title is echoed in that JSON; it is not drawn on a shape. The diagram is compressed into the link, so nothing is stored and the call does not write to a database. Only flowchart and graph syntax are accepted. Other Mermaid types are refused. Text is limited to 16,000 characters and about 80 shapes.",
          "inputSchema": {
            "properties": {
              "mode": {
                "description": "Editor mode stored in the link. flowchart is the default. network opens the network editor instead. Parsing does not change with the mode.",
                "enum": ["flowchart", "network"],
                "type": "string"
              },
              "text": {
                "description": "Diagram source. A Mermaid flowchart or graph (flowchart TD, rectangles in [], diamonds in {}, edge labels such as -->|Yes|), or an indented outline with one step per line. A trailing question mark becomes a decision, and Yes: or No: becomes an arrow label. Required. Maximum 16,000 characters.",
                "type": "string"
              },
              "title": {
                "description": "Optional label echoed in the JSON result. It is not placed on a shape and it is not stored.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create flowchart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d2f835633a1ccd910413256f8f43307222d135301347cb07312feeca45da610"
        },
        {
          "name": "list_templates",
          "title": "List templates",
          "description": "List every built-in FlowSimp template. Use it when a starter diagram is a better fit than generating one from text. Takes no arguments. Returns JSON with a templates array of id, label, and editUrl. The ids are swimlane, decision-tree, user-flow, org-chart, flowchart, process, network, mind-map, data-flow, algorithm, bpmn, onboarding, and approval. Each editUrl opens that template in the editor. The list is fixed, and the call does not store or change anything.",
          "inputSchema": {
            "description": "No arguments.",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c02ceb24ef710664d601033a4e2047726e20b2cb1f68cf828160653fce80473"
        }
      ],
