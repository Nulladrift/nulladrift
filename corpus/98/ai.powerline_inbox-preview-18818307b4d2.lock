{
  "lockfileVersion": 2,
  "subjects": {
    "ai.powerline/inbox-preview": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.powerline.ai/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "inbox-preview",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_job",
          "description": "Get the status and screenshots for a preview job. Poll until status is \"completed\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_id": {
                "description": "The job ID returned by submit_preview",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f08a1fd0580e19fa285761eb46b95dc939cf0f94d4726ea42a8b45feec2599ae"
        },
        {
          "name": "get_screenshot",
          "description": "Fetch a rendered screenshot. Returns the image URL for the given job, client, width, and environment (color scheme / images).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "client": {
                "description": "Client ID",
                "enum": ["gmail", "outlook", "yahoo"],
                "type": "string"
              },
              "color_scheme": {
                "default": "light",
                "description": "The render's color scheme",
                "enum": ["light", "dark"],
                "type": "string"
              },
              "images_disabled": {
                "default": false,
                "description": "Whether the render had images blocked",
                "type": "boolean"
              },
              "job_id": {
                "description": "The job ID",
                "type": "string"
              },
              "viewport_width": {
                "description": "Viewport width of the render, matching the job (1280 when the job used client defaults)",
                "type": "number"
              }
            },
            "required": ["client", "job_id", "viewport_width"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e14bc3996faff4d5134bdfa6d7c826ff1d57c1e287e3a4cd76de0f9d13eae94d"
        },
        {
          "name": "list_clients",
          "description": "List the email clients this deployment can render right now, with their rendering tier, engine, and capabilities",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:490f9e70af92c8a57f25cb7949b6e209a3982b5d642f536556c2283b2293389d"
        },
        {
          "name": "submit_preview",
          "description": "Submit an email for rendering across email clients — full HTML, or a complete raw .eml (base64). Provide exactly one of html/eml. Returns a job ID to poll for results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "eml": {
                "description": "A complete raw RFC 822 message (.eml), base64-encoded — inserted verbatim (real headers, multipart, attachments). Max 10MB decoded. Provide exactly one of html or eml.",
                "type": "string"
              },
              "html": {
                "description": "The full email HTML to preview. Provide exactly one of html or eml.",
                "type": "string"
              },
              "include_full_page": {
                "description": "Also screenshot the whole client window around the opened email (the mailbox UI as well as the message), returned as full_page on each render next to the usual email-only screenshot. Default false. Best-effort: the render mailbox identity and any other mail are masked, and the capture is omitted when that cannot be verified.",
                "type": "boolean"
              },
              "include_previews": {
                "description": "Also capture the inbox-list row (how the message looks unread in the list) and the subject heading, returned as inbox_preview / subject_preview on each render. Default false: they cost more than the body render itself, so ask only when you need them.",
                "type": "boolean"
              },
              "renders": {
                "description": "Exactly the renders you want, one entry each (e.g. outlook light + outlook dark are two entries). Omit for the server default: every live client at its default width, light.",
                "items": {
                  "properties": {
                    "client": {
                      "description": "Client ID",
                      "enum": ["gmail", "outlook", "yahoo"],
                      "type": "string"
                    },
                    "color_scheme": {
                      "description": "Render in the client's light or dark mode (default light). Dark must be supported by the client — check color_schemes in list_clients.",
                      "enum": ["light", "dark"],
                      "type": "string"
                    },
                    "images_disabled": {
                      "description": "Render with remote images blocked (default false)",
                      "type": "boolean"
                    },
                    "viewport_width": {
                      "description": "Viewport width in pixels (200-2560). Defaults to the client default (1280).",
                      "type": "number"
                    }
                  },
                  "required": ["client"],
                  "type": "object"
                },
                "type": "array"
              },
              "subject": {
                "description": "Email subject line",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:089da410f925af8d7c2ab4f6e3aef52e50fcc3c90d14ebb585b89080e63234fc"
        }
      ],
      "digest": "sha256:b475c40fe690c0c22d7ebe8766277e3baef666103f9b74b8a6a944b5c1bb0180"
    }
  }
}
