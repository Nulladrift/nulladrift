      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server is a read-only index of EvalGate's published documentation. It never reads repository files or customer data and cannot mutate EvalGate resources.",
      "tools": [
        {
          "name": "docs_get",
          "description": "Read one published EvalGate documentation page by its slug. Use it after docs_search or docs_list has given you the slug. Returns the page's title, URL, summary and full content, or a not_found error for an unknown slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Page slug exactly as returned by docs_search or docs_list.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://evalgate/docs-browser.html"
            }
          },
          "digest": "sha256:a2e3780d8d19ea9990a2200998227b2ec7d2612752d32ca7ec1b900477c0e706"
        },
        {
          "name": "docs_list",
          "description": "List every published EvalGate documentation page. Use it to browse the catalog when you do not have a search term or slug. Returns each page's slug, title, URL and summary; pass limit/cursor to page through results, or omit both for the whole catalog.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Continuation cursor from the previous page's nextCursor.",
                "pattern": "^(0|[1-9]\\d{0,8})$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum documents per page; defaults to 25 when paginating.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://evalgate/docs-browser.html"
            }
          },
          "digest": "sha256:69a3986ed71dd46ad5c41e0f8e034c6d8773dd2eadbb172fb5d63b2562376d2d"
        },
        {
          "name": "docs_search",
          "description": "Search published EvalGate documentation by keyword. Use it first when you have a question or topic but no page slug. Returns up to 10 ranked matches with slug, title, URL and summary; read a match in full with docs_get.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Maximum matches to return, from 1 to 10; defaults to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a short question, e.g. 'regression gate' or 'how do API keys work'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://evalgate/docs-browser.html"
            }
          },
          "digest": "sha256:1dfb04d6288c251c8b64f48087dd73eda1dceb020c12023125183b5b3d8fce62"
        }
