      "instructions": "This server is a read-only index of EvalGate's published documentation. It never reads repository files or customer data and cannot mutate EvalGate resources.",
      "tools": [
        {
          "name": "docs_get",
          "description": "Read one page from the published EvalGate documentation index.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://evalgate/docs-browser.html"
            }
          },
          "digest": "sha256:237188ccfb3045ceafbbb78ab219c064a689d45525a7a893c6e95dd59d1509db"
        },
        {
          "name": "docs_list",
          "description": "List published EvalGate documentation pages. Use limit/cursor to paginate; omit both to list the complete catalog.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Continuation cursor from the previous page's nextCursor.",
                "pattern": "^(0|[1-9]\\d{0,8})$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum documents per page; defaults to 25 when paginating.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://evalgate/docs-browser.html"
            }
          },
          "digest": "sha256:14378292ab89d35fc2f9e0d9781eec976ec8f1a6071e33a01ce692a3ccf0ce98"
        },
        {
          "name": "docs_search",
          "description": "Search the reviewed index of published EvalGate documentation.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
