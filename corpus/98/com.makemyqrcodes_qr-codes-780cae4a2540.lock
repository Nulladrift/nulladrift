        {
          "name": "get_code",
          "title": "Code details and scans",
          "description": "Get one code's full details and scan stats: what list_codes shows, a contact card's fields, and for changeable codes the scans in the last 7, 30, 90 or 365 days (unique visitors, scans per day, countries, devices) and its last 10 changes, such as where it pointed before and pauses. Static codes have no stats: they can't be counted. Automated checks (link previews, bots) are left out of the numbers, and days are in UTC. Find the code with list_codes first if you don't know its id or link ending. Read only; works with any key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code: its id from list_codes, or a changeable code's link ending (e.g. \"menu\" for makemyqrcodes.com/menu)",
                "type": ["integer", "string"]
              },
              "days": {
                "description": "Stats period in days: 7, 30, 90 or 365. Default 30",
                "enum": [7, 30, 90, 365],
                "type": "integer"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contact": {
                "description": "Contact cards: the card's fields (first, last, org, phone, email...)",
                "type": "object"
              },
              "created_at": {
                "description": "ISO time",
                "type": "string"
              },
              "folder": {
                "description": "Left out when the code isn't in a folder",
                "type": "string"
              },
              "history": {
                "items": {
                  "properties": {
                    "at": {
                      "type": "string"
                    },
                    "field": {
                      "description": "destination or status",
                      "type": "string"
                    },
                    "new_value": {
                      "type": ["string", "null"]
                    },
                    "old_value": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["at", "field"],
                  "type": "object"
                },
                "type": "array"
              },
              "holds": {
                "description": "Where it points, or what it holds, in a few words",
                "type": "string"
              },
              "id": {
                "description": "Use it as \"code\" in get_code, update_code and download_code",
                "type": "integer"
              },
              "kind": {
                "enum": ["changeable", "static"],
                "type": "string"
              },
              "last_scan_at": {
                "description": "ISO time of the latest scan",
                "type": "string"
              },
              "link": {
                "description": "Changeable codes: the short link the printed code holds",
                "type": "string"
              },
              "locked": {
                "description": "true when a lapsed plan locks editing; the code still works",
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "scans": {
                "description": "Changeable codes: scans of all time, automated checks left out",
                "type": "integer"
              },
              "stats": {
                "properties": {
                  "automated_scans_left_out": {
                    "type": "integer"
                  },
                  "countries": {
                    "items": {
                      "properties": {
                        "country": {
                          "description": "Two-letter code; null when unknown",
                          "type": ["string", "null"]
