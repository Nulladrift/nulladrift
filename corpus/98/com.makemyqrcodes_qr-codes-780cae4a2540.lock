{
  "lockfileVersion": 2,
  "subjects": {
    "com.makemyqrcodes/qr-codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://makemyqrcodes.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "makemyqrcodes",
        "title": "Make My QR Codes",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Make My QR Codes (makemyqrcodes.com) makes QR codes that keep working.\n- create_static_code works without an account: the code holds the link or text itself, so it can never be changed or counted after printing. Always tell the person that.\n- Everything else needs an account key (Authorization: Bearer mmq_...). The person makes one on their Account page (https://makemyqrcodes.com/app/account).\n- A changeable code (website link or contact card) can be pointed somewhere new after printing and counts its scans. Each account gets one free; plans add more. Wi-Fi, text, email, phone and SMS codes are always free.\n- When the account has no changeable codes left, get_account lists the plans and the link where the person buys one. You can't buy plans, and you can't delete codes.\n- Every link is screened against Google Web Risk, and link shorteners, IP addresses and this site are refused. Never try to hide where a code goes.\n- Ask the person before changing where a printed code points: everyone who scans it lands on the new page.",
      "tools": [
        {
          "name": "create_code",
          "title": "Make a code",
          "description": "Save a new code in the account and return its id, short link and a scan test. \"url\" (website link) and \"vcard\" (contact card) make changeable codes: they hold a short makemyqrcodes.com link, can be pointed somewhere new after printing, count their scans, and each uses one of the account's changeable codes (get_account shows how many are left). wifi, text, email, phone and sms codes are static and always free. Each type needs its own fields, named in each field's description. Web addresses are checked first: link shorteners, IP addresses and pages Google Web Risk flags are refused. Calling it twice makes two codes. Needs a key that can make and change codes. Use download_code afterward for the print file; use create_static_code when there's no key or nothing needs saving.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact": {
                "additionalProperties": false,
                "description": "type \"vcard\": the contact card people save. Needs first, last or org.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "first": {
                    "type": "string"
                  },
                  "last": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "org": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "phone2": {
                    "type": "string"
                  },
                  "region": {
                    "type": "string"
                  },
                  "street": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "website": {
                    "type": "string"
                  },
                  "zip": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "design": {
                "additionalProperties": false,
                "description": "How the code looks. All optional; dark squares on a light background scan best.",
                "properties": {
                  "bg": {
                    "description": "background color",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "dots": {
                    "enum": ["square", "rounded", "soft", "dots", "classy"],
                    "type": "string"
                  },
                  "ecc": {
                    "description": "error correction; higher survives more damage",
                    "enum": ["L", "M", "Q", "H"],
                    "type": "string"
                  },
                  "eye_color": {
                    "description": "corner color, if different",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "eyes": {
                    "description": "corner squares",
                    "enum": ["square", "rounded", "circle", "leaf"],
                    "type": "string"
                  },
                  "fg": {
                    "description": "square color, e.g. #111111",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "frame": {
                    "description": "a label around the code",
                    "enum": ["none", "label", "label-top", "pill"],
                    "type": "string"
                  },
                  "frame_color": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "frame_text": {
                    "description": "the label, e.g. \"Scan for the menu\"",
                    "maxLength": 24,
                    "type": "string"
                  },
                  "frame_text_color": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "margin": {
                    "description": "blank border in squares (4 is safest)",
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "email_body": {
                "description": "type \"email\": message text, optional",
                "maxLength": 600,
                "type": "string"
              },
              "email_subject": {
                "description": "type \"email\": subject line, optional",
                "maxLength": 150,
                "type": "string"
              },
              "email_to": {
                "description": "type \"email\": address the new email goes to",
                "maxLength": 120,
                "type": "string"
              },
              "ending": {
                "description": "Changeable codes: a custom link ending (makemyqrcodes.com/<ending>), 3 to 40 lowercase letters, digits and dashes. Random if left out. Can't be changed later.",
                "pattern": "^[a-z0-9][a-z0-9-]{2,39}$",
                "type": "string"
              },
              "folder": {
                "description": "Folder to put it in, any name; a folder exists once a code is in it",
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "Shown in the account; made from the content if left out",
                "maxLength": 80,
                "type": "string"
              },
              "phone_number": {
                "description": "types \"phone\" and \"sms\": the number to call or text",
                "maxLength": 40,
                "type": "string"
              },
              "sms_message": {
                "description": "type \"sms\": text the message starts with",
                "maxLength": 300,
                "type": "string"
              },
              "ssid": {
                "description": "type \"wifi\": network name",
                "maxLength": 64,
                "type": "string"
              },
              "text": {
                "description": "type \"text\": the message shown when scanned",
                "maxLength": 1200,
                "type": "string"
              },
              "type": {
                "description": "url (website link) and vcard (contact card) are changeable; wifi, text, email, phone and sms are static",
                "enum": ["url", "vcard", "wifi", "text", "email", "phone", "sms"],
                "type": "string"
              },
              "url": {
                "description": "type \"url\": the web address the code opens, e.g. https://example.com/menu",
                "maxLength": 2000,
                "type": "string"
              },
              "wifi_hidden": {
                "description": "type \"wifi\": the network is hidden",
                "type": "boolean"
              },
              "wifi_password": {
                "description": "type \"wifi\": password (leave out when wifi_security is \"nopass\")",
                "maxLength": 63,
                "type": "string"
              },
              "wifi_security": {
                "description": "type \"wifi\": WPA covers WPA2 and WPA3. Default WPA.",
                "enum": ["WPA", "WEP", "nopass"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changeable_codes_left": {
                "description": "A number, or \"unlimited\" while plans are switched off",
                "type": ["integer", "string"]
              },
              "created_at": {
                "description": "ISO time",
                "type": "string"
              },
              "folder": {
                "description": "Left out when the code isn't in a folder",
                "type": "string"
              },
              "holds": {
                "description": "Where it points, or what it holds, in a few words",
                "type": "string"
              },
              "id": {
                "description": "Use it as \"code\" in get_code, update_code and download_code",
                "type": "integer"
              },
              "kind": {
                "enum": ["changeable", "static"],
                "type": "string"
              },
              "last_scan_at": {
                "description": "ISO time of the latest scan",
                "type": "string"
              },
              "link": {
                "description": "Changeable codes: the short link the printed code holds",
                "type": "string"
              },
              "locked": {
                "description": "true when a lapsed plan locks editing; the code still works",
                "type": "boolean"
              },
              "min_print_size": {
                "description": "Smallest printed width that scans reliably",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "scan_test": {
                "description": "Whether our reader decoded the saved design",
                "enum": ["passed", "failed"],
                "type": "string"
              },
              "scans": {
                "description": "Changeable codes: scans of all time, automated checks left out",
                "type": "integer"
              },
              "status": {
                "enum": ["active", "paused", "blocked"],
                "type": "string"
              },
              "type": {
                "enum": ["url", "vcard", "wifi", "text", "email", "phone", "sms"],
                "type": "string"
              },
              "updated_at": {
                "description": "ISO time",
                "type": "string"
              },
              "warnings": {
                "description": "Design problems worth fixing, e.g. low contrast",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["changeable_codes_left", "created_at", "holds", "id", "kind", "min_print_size", "name", "scan_test", "status", "type", "updated_at", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4653238aa4a04ff9c1ba332df1df81db2fcad51ce82107f313502b5e72736c8c"
        },
        {
          "name": "create_static_code",
          "title": "Make a free static QR code",
          "description": "Make a QR code image without an account or key, saving nothing. The code holds the content itself (a web address, Wi-Fi login, text, email, phone number or text message), so it works forever without this site, but it can never be changed or counted after printing: tell the person that. Use create_code instead when the person has a key and wants a code they can point somewhere new later, or see scans for. Each type needs its own fields, named in each field's description. Web addresses are checked first: link shorteners, IP addresses and pages Google Web Risk flags are refused. At most 120 codes an hour per connection. Returns the image (SVG by default, best for print, or PNG 1200 px) and a scan test result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email_body": {
                "description": "type \"email\": message text, optional",
                "maxLength": 600,
                "type": "string"
              },
              "email_subject": {
                "description": "type \"email\": subject line, optional",
                "maxLength": 150,
                "type": "string"
              },
              "email_to": {
                "description": "type \"email\": address the new email goes to",
                "maxLength": 120,
                "type": "string"
              },
              "format": {
                "description": "svg (default; vector, best for print) or png (1200 px)",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "label": {
                "description": "Optional label printed under the code, e.g. \"Scan for Wi-Fi\"",
                "maxLength": 24,
                "type": "string"
              },
              "phone_number": {
                "description": "types \"phone\" and \"sms\": the number to call or text",
                "maxLength": 40,
                "type": "string"
              },
              "sms_message": {
                "description": "type \"sms\": text the message starts with",
                "maxLength": 300,
                "type": "string"
              },
              "ssid": {
                "description": "type \"wifi\": network name",
                "maxLength": 64,
                "type": "string"
              },
              "style": {
                "description": "classic (square modules, default), rounded or dots",
                "enum": ["classic", "rounded", "dots"],
                "type": "string"
              },
              "text": {
                "description": "type \"text\": the message shown when scanned",
                "maxLength": 1200,
                "type": "string"
              },
              "type": {
                "description": "What the code holds: url (a web address), wifi (a network login), text, email (a new email), phone (a call) or sms (a text message)",
                "enum": ["url", "wifi", "text", "email", "phone", "sms"],
                "type": "string"
              },
              "url": {
                "description": "type \"url\": the web address the code opens, e.g. https://example.com/menu",
                "maxLength": 2000,
                "type": "string"
              },
              "wifi_hidden": {
                "description": "type \"wifi\": the network is hidden",
                "type": "boolean"
              },
              "wifi_password": {
                "description": "type \"wifi\": password (leave out when wifi_security is \"nopass\")",
                "maxLength": 63,
                "type": "string"
              },
              "wifi_security": {
                "description": "type \"wifi\": WPA covers WPA2 and WPA3. Default WPA.",
                "enum": ["WPA", "WEP", "nopass"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "format": {
                "enum": ["svg", "png"],
                "type": "string"
              },
              "holds": {
                "description": "What the code holds, in a few words",
                "type": "string"
              },
              "kind": {
                "enum": ["static"],
                "type": "string"
              },
              "label": {
                "type": "string"
              },
              "note": {
                "description": "What to tell the person about static codes",
                "type": "string"
              },
              "scan_test": {
                "description": "Whether our reader decoded the image",
                "enum": ["passed", "failed"],
                "type": "string"
              },
              "type": {
                "enum": ["url", "wifi", "text", "email", "phone", "sms"],
                "type": "string"
              }
            },
            "required": ["format", "holds", "kind", "scan_test", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:564a6796e7955384730e3ca5c62715d8412fe66cae4d9fb81fd663b3354fb9cd"
        },
        {
          "name": "download_code",
          "title": "Download a code",
          "description": "Download a print-ready file of one of the account's codes, in its saved design: SVG (default; vector, any size, best for print shops), PNG (size_px wide, 300 dpi) or a vector PDF sized to width_in inches. The file comes back as an embedded resource (SVG, PDF) or an image (PNG). For content that isn't saved in the account, use create_static_code instead. At most 120 files an hour per account. Read only; works with any key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code: its id from list_codes, or a changeable code's link ending (e.g. \"menu\" for makemyqrcodes.com/menu)",
                "type": ["integer", "string"]
              },
              "format": {
                "description": "svg (default), png or pdf",
                "enum": ["svg", "png", "pdf"],
                "type": "string"
              },
              "size_px": {
                "description": "PNG only: width in pixels, 200 to 2000. Default 1200",
                "maximum": 2000,
                "minimum": 200,
                "type": "integer"
              },
              "width_in": {
                "description": "PDF only: printed width in inches, 0.5 to 40. Default 2",
                "maximum": 40,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "format": {
                "enum": ["svg", "png", "pdf"],
                "type": "string"
              },
              "id": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "size_px": {
                "description": "PNG width",
                "type": "integer"
              },
              "width_in": {
                "description": "PDF width in inches",
                "type": "number"
              }
            },
            "required": ["format", "id", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7483b069c7bcaa4e2fb3d60cb8b14aa0e8d3ed70d993f6a50fce2f548e6b0c6"
        },
        {
          "name": "get_account",
          "title": "Account and plans",
          "description": "Get the account this key belongs to: how many changeable codes it has used and has left, its plans and when they renew, the plans on sale with yearly prices, the page where the person buys one (buy_at), and the folders in use. Call it before create_code when unsure there's room for another changeable code, after create_code fails for that reason, or to find folder names for list_codes. You can't buy plans: give the person the buy_at link. Wi-Fi, text, email, phone and SMS codes never use the allowance. Read only; works with any key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "buy_at": {
                "description": "Where the person buys a plan (only while plans are on)",
                "type": "string"
              },
              "changeable_codes": {
                "properties": {
                  "allowed": {
                    "description": "A number, or \"unlimited ...\" while plans are switched off",
                    "type": ["integer", "string"]
                  },
                  "left": {
                    "type": "integer"
                  },
                  "locked": {
                    "description": "Codes beyond the allowance after a plan lapsed: they work but can't be edited",
                    "type": "integer"
                  },
                  "used": {
                    "type": "integer"
                  }
                },
                "required": ["allowed", "used"],
                "type": "object"
              },
              "email": {
                "description": "The account's email address",
                "type": "string"
              },
              "folders": {
                "description": "Folders in use, with how many codes each holds",
                "items": {
                  "properties": {
                    "codes": {
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["codes", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "on_sale": {
                "items": {
                  "properties": {
                    "codes": {
                      "description": "Changeable codes each plan adds",
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price_usd_per_year": {
                      "type": "number"
                    }
                  },
                  "required": ["codes", "name", "price_usd_per_year"],
                  "type": "object"
                },
                "type": "array"
              },
              "plans": {
                "items": {
                  "properties": {
                    "codes": {
                      "type": "integer"
                    },
                    "ending": {
                      "description": "true when set to end instead of renewing",
                      "type": "boolean"
                    },
                    "quantity": {
                      "type": "integer"
                    },
                    "renews_or_ends": {
                      "description": "ISO time",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "Stripe's: active, past_due, canceled...",
                      "type": "string"
                    }
                  },
                  "required": ["codes", "quantity", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "plans_switched_on": {
                "description": "false while the site gives changeable codes away free and unlimited",
                "type": "boolean"
              },
              "static_codes": {
                "type": "string"
              }
            },
            "required": ["changeable_codes", "email", "folders", "on_sale", "plans", "plans_switched_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
