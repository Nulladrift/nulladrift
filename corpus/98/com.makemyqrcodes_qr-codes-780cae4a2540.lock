            "properties": {
              "email_body": {
                "maxLength": 600,
                "type": "string"
              },
              "email_subject": {
                "maxLength": 150,
                "type": "string"
              },
              "email_to": {
                "description": "type \"email\": address the new email goes to",
                "maxLength": 120,
                "type": "string"
              },
              "format": {
                "description": "Default svg (best for print)",
                "enum": ["svg", "png"],
                "type": "string"
              },
              "label": {
                "description": "Optional label under the code, e.g. \"Scan for Wi-Fi\"",
                "maxLength": 24,
                "type": "string"
              },
              "phone_number": {
                "description": "types \"phone\" and \"sms\": the number to call or text",
                "maxLength": 40,
                "type": "string"
              },
              "sms_message": {
                "description": "type \"sms\": text the message starts with",
                "maxLength": 300,
                "type": "string"
              },
              "ssid": {
                "description": "type \"wifi\": network name",
                "maxLength": 64,
                "type": "string"
              },
              "style": {
                "description": "Default classic",
                "enum": ["classic", "rounded", "dots"],
                "type": "string"
              },
              "text": {
