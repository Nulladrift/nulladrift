        {
          "name": "make_static_code",
          "title": "Make a free static QR code",
          "description": "Make a QR code without an account. The code holds the content itself (a web address, Wi-Fi login, text, email, phone or SMS), so it works offline and forever, but it can never be changed or counted after printing. Nothing is stored. Returns the image (SVG by default, or PNG).",
