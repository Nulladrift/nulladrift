                "description": "Part of a code's name, link ending or web address; not case sensitive",
                "maxLength": 100,
                "type": "string"
              },
              "status": {
                "description": "Only active codes, paused ones (they show a \"paused\" page when scanned), or blocked ones (switched off for breaking the rules)",
