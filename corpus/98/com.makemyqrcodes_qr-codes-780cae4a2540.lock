{
  "lockfileVersion": 2,
  "subjects": {
    "com.makemyqrcodes/qr-codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://makemyqrcodes.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "makemyqrcodes",
        "title": "Make My QR Codes",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Make My QR Codes (makemyqrcodes.com) makes QR codes that keep working.\n- make_static_code works without an account: the code holds the link or text itself, so it can never be changed or counted after printing. Always tell the person that.\n- Everything else needs an account key (Authorization: Bearer mmq_...). The person makes one on their Account page (https://makemyqrcodes.com/app/account).\n- A changeable code (website link or contact card) can be pointed somewhere new after printing and counts its scans. Each account gets one free; plans add more. Wi-Fi, text, email, phone and SMS codes are always free.\n- When the account has no changeable codes left, account_status lists the plans and the link where the person buys one. You can't buy plans, and you can't delete codes.\n- Every link is screened against Google Web Risk, and link shorteners, IP addresses and this site are refused. Never try to hide where a code goes.\n- Ask the person before changing where a printed code points: everyone who scans it lands on the new page.",
      "tools": [
        {
          "name": "account_status",
          "title": "Account and plans",
          "description": "The account this key belongs to: changeable codes used and left, its plans, the plans on sale with prices, and the page where the person buys one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:954c18e981bd3c79f974fdb72f4be3c04f3f9d6f578f7a55e1b1a8e7285d8269"
        },
        {
          "name": "create_code",
          "title": "Make a code",
          "description": "Save a new code in the account. \"url\" and \"vcard\" are changeable codes: they hold a short makemyqrcodes.com link, can be pointed somewhere new after printing, count scans, and use the account's allowance. The other types are static and always free. Links are screened before saving. Returns the code's id, link and a scan test; use download_code for the file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact": {
                "additionalProperties": false,
                "description": "type \"vcard\": the contact card people save. Needs first, last or org.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "first": {
                    "type": "string"
                  },
                  "last": {
                    "type": "string"
                  },
                  "note": {
                    "type": "string"
                  },
                  "org": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "phone2": {
                    "type": "string"
                  },
                  "region": {
                    "type": "string"
                  },
                  "street": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "website": {
                    "type": "string"
                  },
                  "zip": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "design": {
                "additionalProperties": false,
                "description": "How the code looks. All optional; dark squares on a light background scan best.",
                "properties": {
                  "bg": {
                    "description": "background color",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "dots": {
                    "enum": ["square", "rounded", "soft", "dots", "classy"],
                    "type": "string"
                  },
                  "ecc": {
                    "description": "error correction; higher survives more damage",
                    "enum": ["L", "M", "Q", "H"],
                    "type": "string"
                  },
                  "eye_color": {
                    "description": "corner color, if different",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "eyes": {
                    "description": "corner squares",
                    "enum": ["square", "rounded", "circle", "leaf"],
                    "type": "string"
                  },
                  "fg": {
                    "description": "square color, e.g. #111111",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "frame": {
                    "description": "a label around the code",
                    "enum": ["none", "label", "label-top", "pill"],
                    "type": "string"
                  },
                  "frame_color": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "frame_text": {
                    "description": "the label, e.g. \"Scan for the menu\"",
                    "maxLength": 24,
                    "type": "string"
                  },
                  "frame_text_color": {
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "margin": {
                    "description": "blank border in squares (4 is safest)",
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "email_body": {
                "maxLength": 600,
                "type": "string"
              },
              "email_subject": {
                "maxLength": 150,
                "type": "string"
              },
              "email_to": {
                "description": "type \"email\": address the new email goes to",
                "maxLength": 120,
                "type": "string"
              },
              "ending": {
                "description": "Changeable codes: a custom link ending (makemyqrcodes.com/<ending>). Random if left out. Can't be changed later.",
                "pattern": "^[a-z0-9][a-z0-9-]{2,39}$",
                "type": "string"
              },
              "folder": {
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "Shown in the account; made from the content if left out",
                "maxLength": 80,
                "type": "string"
              },
              "phone_number": {
                "description": "types \"phone\" and \"sms\": the number to call or text",
                "maxLength": 40,
                "type": "string"
              },
              "sms_message": {
                "description": "type \"sms\": text the message starts with",
                "maxLength": 300,
                "type": "string"
              },
              "ssid": {
                "description": "type \"wifi\": network name",
                "maxLength": 64,
                "type": "string"
              },
              "text": {
                "description": "type \"text\": the message shown when scanned",
                "maxLength": 1200,
                "type": "string"
              },
              "type": {
                "description": "url (website link) and vcard (contact card) are changeable; wifi, text, email, phone and sms are static",
                "enum": ["url", "vcard", "wifi", "text", "email", "phone", "sms"],
                "type": "string"
              },
              "url": {
                "description": "type \"url\": the web address the code opens, e.g. https://example.com/menu",
                "maxLength": 2000,
                "type": "string"
              },
              "wifi_hidden": {
                "description": "type \"wifi\": the network is hidden",
                "type": "boolean"
              },
              "wifi_password": {
                "description": "type \"wifi\": password (leave out when wifi_security is \"nopass\")",
                "maxLength": 63,
                "type": "string"
              },
              "wifi_security": {
                "description": "type \"wifi\": WPA covers WPA2 and WPA3. Default WPA.",
                "enum": ["WPA", "WEP", "nopass"],
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:47316a037ad9bccad47e71357b8dd3e072d9d91f48d902c76f02e44374d8cd9a"
        },
        {
          "name": "download_code",
          "title": "Download a code",
          "description": "A print-ready file of one of the account's codes: SVG (default, any size), PNG (up to 2000 px) or vector PDF at a set width in inches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code: its id from list_codes, or a changeable code's link ending (e.g. \"menu\" for makemyqrcodes.com/menu)",
                "type": ["integer", "string"]
              },
              "format": {
                "enum": ["svg", "png", "pdf"],
                "type": "string"
              },
              "size_px": {
                "description": "PNG width, default 1200",
                "maximum": 2000,
                "minimum": 200,
                "type": "integer"
              },
              "width_in": {
                "description": "PDF width in inches, default 2",
                "maximum": 40,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1ba281f96e48dd1c56e2f5dba39159b5f532872e70efdd95f2d09031619ee63"
        },
        {
          "name": "get_code",
          "title": "Code details and scans",
          "description": "One code's details, scan stats (per day, countries, devices; automated scans left out) and its recent changes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code: its id from list_codes, or a changeable code's link ending (e.g. \"menu\" for makemyqrcodes.com/menu)",
                "type": ["integer", "string"]
