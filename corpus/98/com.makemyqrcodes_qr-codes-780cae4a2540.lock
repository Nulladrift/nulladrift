        },
        {
          "name": "update_code",
          "title": "Change a code",
          "description": "Change where a printed website-link code points, a contact card's details, a code's name or folder, or pause and resume a changeable code. Changing the destination affects everyone who scans it from then on, so confirm with the person first. Codes can't be deleted here.",
          "inputSchema": {
