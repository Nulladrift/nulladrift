        {
          "name": "list_codes",
          "title": "List codes",
          "description": "The account's codes, newest first: id, name, kind, what it holds or where it points, link, status and scans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "folder": {
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "Default 50",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "search": {
                "description": "Match in name, link ending or destination",
                "maxLength": 100,
                "type": "string"
              },
              "status": {
                "enum": ["active", "paused", "blocked"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
