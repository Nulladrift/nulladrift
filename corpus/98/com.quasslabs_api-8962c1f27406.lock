        {
          "name": "sql_migration_lint",
          "description": "Static lint of a SQL migration file (Postgres or MySQL) for operations that lock or rewrite live tables or break running application code. Flags CREATE INDEX without CONCURRENTLY and concurrent index builds inside a transaction, foreign key, CHECK and UNIQUE constraints added without NOT VALID or USING INDEX, SET NOT NULL without a validated CHECK, column type changes, NOT NULL columns added without a default, volatile or serial defaults that rewrite the table, dropped or renamed columns and tables, VACUUM FULL and CLUSTER, DELETE or UPDATE without WHERE, TRUNCATE, a missing lock_timeout, MySQL ALTERs without ALGORITHM/LOCK, and type advice (jsonb, text, identity, timestamptz). Tables created earlier in the same file are treated as new and skipped by lock and rewrite rules. The SQL is tokenized, never executed: no database is contacted, so table sizes and existing column types are unknown, and SQL inside strings, comments and function bodies is not linted. Up to 400 KB of SQL and 5,000 statements. Rules adapted from squawk and strong_migrations. Deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "assume_large_tables": {
                "default": true,
                "description": "Treat existing tables as large and busy. false downgrades lock and rewrite errors (index without CONCURRENTLY, foreign key or unique without NOT VALID / USING INDEX, type change, SET NOT NULL, VACUUM FULL / CLUSTER) to warnings; data-loss and compatibility rules are never downgraded.",
                "type": "boolean"
              },
              "dialect": {
                "default": "postgres",
                "description": "SQL dialect. \"postgresql\" and \"pg\" are also accepted, case-insensitive.",
                "enum": ["postgres", "mysql"],
                "type": "string"
              },
              "sql": {
                "description": "The migration file content. Max 400 KB (UTF-8); 512 KB request body.",
                "type": "string"
              }
            },
            "required": ["sql"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SQL migration zero-downtime linter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27c4b3b481b8eac341b46f5a422c44a63dc3bbb9ac881c3aae2926b9becf726c"
        },
        {
          "name": "story_lint",
          "description": "Deterministic structural quality linter for user stories - a sibling to ticket_lint but scoped to story-writing concepts any team recognizes: narrative completeness (As-a/I-want-to/So-that/Summary), acceptance criteria presence, duplicate/unknown dependency IDs, a \"Manage X\" story with no CRUD split, list stories missing a pagination mention. An OPTIONAL rate_config unlocks team-specific checks (screen-vs-narrative match, hour-rate-per-screen tolerance, required risk level by story type, milestone-code format, required companion story types per milestone) - omit it and only the universal checks run. No house rates or milestone conventions are hardcoded. POST one story or a batch (max 50). Deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "rate_config": {
                "description": "Optional. Enables team-specific checks, all off by default.",
                "properties": {
                  "check_screen_match": {
                    "description": "Flag when story.on_screen disagrees with story.screen.",
                    "type": "boolean"
                  },
                  "milestone_code_pattern": {
                    "description": "Regex the milestone_code field must match.",
                    "type": "string"
