                  "maxLength": 1024,
                  "type": "string"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "kind": {
                "default": "auto",
                "description": "\"skill\" for a SKILL.md, \"agents\" for AGENTS.md / CLAUDE.md. \"auto\" treats the text as a skill when it opens with frontmatter containing name: or description:.",
                "enum": ["skill", "agents", "auto"],
                "type": "string"
              },
              "text": {
                "description": "The full file content. Max 300 KB (UTF-8).",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
