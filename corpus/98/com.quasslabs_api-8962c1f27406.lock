        {
          "name": "acceptance_criteria_validator",
          "description": "QA advisor: validate acceptance criteria quality. POST a list of AC (or a story) and get per-AC problems (vague/untestable, non-atomic, no observable outcome) + a missing-coverage flag if there is no failure-path AC, plus a 0-100 score and pass/needs_work verdict. Tells you exactly what to fix. Deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "acceptance_criteria": {
                "description": "The criteria, one string each (max 50). Wins over story.",
                "items": {
                  "maxLength": 2000,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "story": {
                "description": "Alternative: full story text; the AC lines are extracted from it.",
                "maxLength": 16000,
                "type": "string"
              },
              "strictness": {
                "description": "Default \"normal\". \"strict\" also flags subjective wording in measurable criteria.",
                "enum": ["normal", "strict"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Acceptance criteria validator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
