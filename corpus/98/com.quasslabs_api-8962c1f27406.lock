        {
          "name": "tool_advisor",
          "description": "Which QL-API endpoint fits this task. POST a task description and get the ranked endpoint(s) that best match, each with a confidence label (high/medium/low). Deterministic keyword matching over this platform's own endpoint catalog, no LLM. Pairs with model_advisor (which itself is one of the recommendable endpoints, so a \"which model\" task surfaces it) - call them independently and chain the results yourself; optionally pass a prior model_advisor result's rationale in as `context` to bias matching.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Optional extra text to fold into matching - e.g. a prior model_advisor rationale, or more detail than fits in `task`.",
                "type": "string"
              },
              "task": {
                "description": "What you are trying to do.",
                "type": "string"
              },
              "tools": {
                "description": "Optional allowlist - restrict matching to only these endpoints, by endpoint slug (\"humanize\") or MCP tool name (\"humanize_text\").",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "top_n": {
                "default": 1,
                "description": "How many ranked endpoints to return. Default 1 = best match only.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "QuassLabs endpoint advisor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
