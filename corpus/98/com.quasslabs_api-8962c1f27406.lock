        {
          "name": "actions_audit",
          "description": "Static security audit of GitHub Actions workflow files. Flags template injection (attacker-controlled github.* contexts such as a PR title or branch name expanded inside run: or actions/github-script), pull_request_target and workflow_run triggers and the pwn-request pattern of checking out the pull request head under them, actions and reusable workflows not pinned to a full 40-character commit SHA, container images not pinned by digest, missing or write-all GITHUB_TOKEN permissions, secrets used under untrusted triggers or passed with secrets: inherit, actions/checkout persisting credentials, self-hosted runners on public repositories, curl or wget piped to a shell, hardcoded credentials (reported by kind and line, never echoed), jobs with no timeout-minutes, and caching in release or tag-publish workflows. Up to 50 files of 256 KB each, 1 MB request body; YAML anchors and aliases are rejected. Nothing referenced is fetched, so pinned SHAs are not checked to exist and called actions are not audited. Rules follow zizmor and GitHub's Actions hardening guide. Deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "repo_visibility": {
                "default": "public",
                "description": "Visibility of the repository the workflows live in. Only \"public\" runs the self-hosted-runner rule.",
                "enum": ["public", "private", "internal"],
                "type": "string"
              },
              "workflow": {
                "description": "Alternative to workflows: a single workflow YAML string. Reported with path \"workflow\".",
                "type": "string"
              },
              "workflows": {
                "description": "The workflow files to audit, e.g. everything under .github/workflows/. Max 50 files, 256 KB each, 1 MB request body. Send this or workflow, not both.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The workflow YAML, as text. Anchors and aliases are rejected.",
                      "type": "string"
                    },
                    "path": {
                      "description": "File path, echoed in findings, e.g. \".github/workflows/ci.yml\". Defaults to \"workflow[<index>]\".",
                      "type": "string"
                    }
                  },
                  "required": ["content"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GitHub Actions workflow security audit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15998d889e3a4f54d761b9ee61abfccbddc08b1506f66ff4af93659917df0917"
        },
        {
          "name": "agent_card_lint",
          "description": "Static lint of an A2A (Agent2Agent) Agent Card, the JSON an agent publishes at /.well-known/agent-card.json. Checks conformance with A2A v1.0.1 and the 0.3 field names (both dialects accepted): required fields present and typed, URLs absolute https (http allowed for localhost), input and output modes that look like MIME types, skills with id, name, description and tags, duplicate skill ids, and security requirements that reference declared schemes. Scores discoverability: skill descriptions too short (under 20 chars) or too long (over 1,024) to route on, near-duplicate skills, missing examples or provider. Flags prompt-injection phrasing aimed at the model reading the card and hidden zero-width, bidi or tag characters (reported as U+XXXX, never echoed raw). Optionally checks an x402 payment declaration: every accepts entry needs scheme, network, payTo, asset, resource (https) and a sane atomic amount; x402 findings are reported separately and do not affect the card score. 512 KB request; first 200 skills, 50 items per list, 100 x402 entries. URLs are parsed, never fetched, and card signatures are not verified. Deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "agent_card": {
                "description": "The Agent Card as a JSON object, or a string containing that JSON. Missing fields are findings, not errors, so send it as published.",
                "properties": {
                  "capabilities": {
                    "additionalProperties": true,
                    "description": "e.g. {\"streaming\": true, \"pushNotifications\": false}.",
                    "type": "object"
                  },
                  "defaultInputModes": {
                    "description": "MIME types, e.g. [\"text/plain\"].",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "defaultOutputModes": {
                    "description": "MIME types.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "description": {
                    "description": "What the agent does.",
                    "type": "string"
                  },
                  "name": {
                    "description": "Agent display name.",
                    "type": "string"
                  },
                  "protocolVersion": {
                    "description": "A2A protocol version, e.g. \"0.3.0\".",
                    "type": "string"
                  },
                  "securitySchemes": {
                    "additionalProperties": true,
                    "description": "Declared auth schemes by name.",
                    "type": "object"
                  },
                  "skills": {
                    "description": "Each with id, name, description, tags and optional examples, inputModes, outputModes, security.",
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "supportedInterfaces": {
                    "description": "A2A 1.0: endpoint URLs with their protocol binding; replaces url.",
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "url": {
                    "description": "A2A 0.3: the agent endpoint URL.",
                    "type": "string"
                  },
                  "version": {
                    "description": "The agent's own version.",
                    "type": "string"
                  }
                },
                "type": ["object", "string"]
              },
              "x402": {
                "description": "Optional x402 payment declaration (object or JSON string), checked separately from the card.",
                "properties": {
                  "accepts": {
                    "description": "Payment requirements. Each needs scheme, network, maxAmountRequired (or amount, as an atomic-unit digit string), resource, payTo and asset; description is recommended.",
                    "items": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": ["object", "string"]
              }
            },
            "required": ["agent_card"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A2A Agent Card linter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a695652c3d44aa69570acc8b629117079a0cfff4f330d22d6903e16c66b3c5c"
        },
