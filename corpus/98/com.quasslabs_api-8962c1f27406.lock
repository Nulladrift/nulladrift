        {
          "name": "worklog_guardrail",
          "description": "Worklog/timesheet policy checker - run a batch of worklog entries through configurable guardrails BEFORE posting them to a time-tracking system. Checks: rounding increment (default 0.25h, float-safe), per-entry min/max, per-author daily totals, duplicates, over-estimate alerts (never suggests inflating hours or estimates - flags to PM instead), future dates, weekends, immutable-author edit protection, missing description/ticket. Returns pass/warnings/blocked verdict + per-entry violations with fixes + hour totals by author and date. Caller supplies the reference date - fully deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "entries": {
                "description": "The entries to check, up to 500.",
                "items": {
                  "description": "One worklog entry.",
                  "properties": {
                    "already_logged_hours": {
                      "description": "Hours already on the ticket before this entry.",
                      "type": "number"
                    },
                    "author": {
                      "description": "Who logged it.",
                      "type": "string"
                    },
                    "date": {
                      "description": "Work date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "delete": {
                      "description": "True if this deletes an existing worklog.",
                      "type": "boolean"
                    },
                    "description": {
                      "description": "What was done.",
                      "type": "string"
                    },
                    "edit": {
                      "description": "True if this edits an existing worklog.",
                      "type": "boolean"
                    },
                    "estimate_hours": {
                      "description": "Ticket estimate, for the over-estimate check.",
                      "type": "number"
                    },
                    "hours": {
                      "description": "Hours logged; must be positive.",
                      "type": "number"
                    },
                    "id": {
                      "description": "Existing worklog id; on an immutable author this counts as an update.",
                      "type": "string"
                    },
                    "new": {
                      "description": "True if this is a new entry even though it carries an id.",
                      "type": "boolean"
                    },
                    "ticket": {
                      "description": "Ticket reference.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "policy": {
                "additionalProperties": false,
                "description": "Optional overrides of the default policy. Unknown keys are rejected.",
                "properties": {
                  "future_dates": {
                    "description": "Default \"block\".",
                    "enum": ["block", "alert"],
                    "type": "string"
                  },
                  "immutable_authors": {
                    "description": "Authors whose existing worklogs must never be edited or deleted.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "max_hours_per_day": {
                    "description": "Per author per day. Default 10.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "max_hours_per_entry": {
                    "description": "Default 8.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "min_hours_per_entry": {
                    "description": "Default 0.25.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "over_estimate_policy": {
                    "description": "Default \"alert\".",
                    "enum": ["alert", "block", "ignore"],
                    "type": "string"
                  },
                  "require_description": {
                    "description": "Default false.",
                    "type": "boolean"
                  },
                  "require_ticket": {
                    "description": "Default false.",
                    "type": "boolean"
                  },
                  "rounding_increment": {
                    "description": "Hours must be a multiple of this. Default 0.25.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "weekend_policy": {
                    "description": "Default \"allow\".",
                    "enum": ["allow", "alert"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "today": {
                "description": "Reference date \"YYYY-MM-DD\" for future-date checks.",
                "type": "string"
              }
            },
            "required": ["entries", "today"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Worklog policy check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
