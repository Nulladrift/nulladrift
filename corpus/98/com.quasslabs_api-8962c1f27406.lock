        {
          "name": "supply_chain_scan",
          "description": "Scan a whole repo archive (a ZIP of manifests, lockfiles and MCP server configs) for packages, MCP servers and extensions listed in a known-compromise catalog (Bumblebee threat intel). Use this for a repo, many lockfiles or MCP configs; use dependency_check instead to lint a few pasted manifests for pinning and hygiene. Send exactly one of archive_base64 or archive_url; neither or both is 400 exactly_one_of_archive_base64_or_archive_url. Read-only: the ZIP is sent to QuassLabs (archive_url is fetched server-side), unpacked to a temp dir deleted after the call, never executed or installed. 5 credits. Failed calls are not billed: input, fetch and archive errors (invalid_ecosystems, not_a_zip, unsafe_path_in_archive, too_many_entries, archive_expands_too_large) are rejected before any charge, and 5xx is refunded. Bearer key required. Returns verdict CLEAR or FINDINGS, findings with severity, source_file and remediation, and scanned counts; CLEAR is not a guarantee of safety.",
          "inputSchema": {
            "properties": {
              "archive_base64": {
                "description": "Base64 ZIP of the repo, or of its manifests, lockfiles and MCP configs. Max 10 MiB decoded (about 7.5 MiB of ZIP in practice under the 10 MB request limit), 10,000 entries, 200 MiB extracted. Send exactly one of archive_base64 or archive_url.",
                "type": "string"
              },
              "archive_url": {
                "description": "https:// URL to the same kind of ZIP, readable with no credentials (typically presigned), for archives too big to inline. Max 25 MiB download, 200 MiB extracted. The host must resolve only to public addresses on HTTPS port 443, and every redirect (up to 3) is re-validated the same way, otherwise 400 archive_url_blocked. The download shares the 29 s request budget with the scan, so it must finish within a few seconds, otherwise 400 archive_url_too_slow; a presigned S3 URL in a nearby region is ideal. Send exactly one of archive_url or archive_base64.",
                "type": "string"
              },
              "ecosystems": {
                "description": "Limit the scan to these ecosystems. Omitted, null or empty: all of them. Anything other than a list of the values above is 400 invalid_ecosystems, rejected before any charge.",
                "items": {
                  "enum": ["npm", "pypi", "go", "rubygems", "packagist", "mcp", "editor-extension", "browser-extension"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Supply-chain compromise scanner"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2424d21c6b732738d3dbc3f774bd2456501dd47eb2ce931eb4f130b3acf034c"
        },
        {
          "name": "ticket_lint",
          "description": "Full Jira-ticket quality linter (whole ticket, not just AC - use acceptance_criteria_validator for the deep AC pass). POST one ticket or a batch (max 50) and get per-ticket findings with severity + concrete fixes: missing/weak summary or description, missing AC or estimate, bugs without repro/expected-vs-actual/environment, missing epic link, points-vs-hours mismatch, oversized estimates to split, urgent-but-thin tickets. Returns score, grade, and a ready/needs_work verdict per ticket plus batch summary. Type-aware rules (story/bug/task/epic/subtask), strict profile available. Deterministic, no LLM.",
          "inputSchema": {
            "properties": {
              "profile": {
                "description": "Default \"normal\" (ready at 75). \"strict\" bumps severities and needs 85.",
                "enum": ["normal", "strict"],
                "type": "string"
              },
              "ticket": {
                "description": "One Jira-style ticket. Missing fields ARE findings, so send what you have.",
                "properties": {
                  "acceptance_criteria": {
                    "description": "A list, or one string with one criterion per line.",
                    "items": {
                      "type": "string"
                    },
                    "type": ["string", "array"]
                  },
                  "assignee": {
                    "description": "Owner, if assigned.",
                    "type": "string"
                  },
                  "attachments_count": {
                    "description": "Number of attachments; 0 on a bug is flagged.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "components": {
                    "description": "Components touched.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "description": {
                    "description": "The ticket body.",
                    "type": "string"
                  },
                  "epic_link": {
                    "description": "Parent epic key.",
                    "type": "string"
                  },
                  "estimate_hours": {
                    "description": "Estimate in hours.",
                    "type": "number"
                  },
                  "issue_type": {
                    "description": "story, bug, task, epic or subtask; anything else is linted as a task.",
                    "type": "string"
                  },
                  "key": {
                    "description": "Ticket key, echoed back, e.g. \"PROJ-123\".",
                    "type": "string"
                  },
                  "labels": {
                    "description": "Labels.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "priority": {
                    "description": "e.g. \"High\". highest/blocker with a thin description is flagged.",
                    "type": "string"
                  },
                  "story_points": {
                    "description": "Estimate in points; cross-checked against estimate_hours.",
                    "type": "number"
                  },
                  "summary": {
                    "description": "The one-line title.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "tickets": {
                "description": "Alternative: batch of up to 50 tickets. Send ticket or tickets, not both.",
