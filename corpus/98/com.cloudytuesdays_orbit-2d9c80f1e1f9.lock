                    "type": "string"
                  }
                },
                "required": ["excerpt"],
                "type": "object"
              },
              "expected_revision": {
                "description": "The card's revision from recall; a newer revision returns conflict.",
                "minimum": 1,
                "type": "integer"
              },
              "request_id": {
                "description": "Unique per call, e.g. a UUID.",
                "pattern": "^[A-Za-z0-9._:-]{8,64}$",
                "type": "string"
              },
              "value": {
                "description": "The corrected value.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["card_id", "correction_reason", "evidence", "expected_revision", "request_id", "value"],
            "type": "object"
