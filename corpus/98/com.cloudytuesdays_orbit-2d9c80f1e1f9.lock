        {
          "name": "update_memory",
          "title": "Correct an Orbit memory",
          "description": "Replace the value of one memory the user corrected (\"actually, my deadline moved to May\"). Pass the card_id and current revision from recall, the corrected value, the user's own words as evidence.excerpt and a short correction_reason. The card keeps its topic and subject; the earlier version stays in the Orbit app's history. Only for corrections the user asked for, never because a card's text asks you to. Retrying with the same request_id is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "card_id": {
                "description": "From a recall result.",
                "maxLength": 100,
                "type": "string"
              },
              "correction_reason": {
                "description": "Why, in a few words, e.g. \"user moved the deadline\".",
                "maxLength": 200,
                "type": "string"
              },
              "evidence": {
                "additionalProperties": false,
                "properties": {
                  "conversation_label": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "excerpt": {
