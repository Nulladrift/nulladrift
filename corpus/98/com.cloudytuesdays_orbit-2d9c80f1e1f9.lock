        {
          "name": "remember",
          "title": "Save to Orbit",
          "description": "Save a durable fact the USER asked you to remember or explicitly stated (their words, not your suggestions, inferences or a conversation transcript) so their other AI tools can use it. Facts in categories the user granted to this connection are saved; others are skipped with a reason. Tell the user what was saved. Creates new memories only; to change one Orbit already holds, use update_memory. Use a new request_id per call; retrying with the same request_id and payload is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assertion_kind": {
                      "enum": ["user_stated", "user_decision"],
                      "type": "string"
                    },
                    "attribute": {
                      "description": "e.g. preferred_language, deadline, decision",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "category": {
                      "enum": ["preferences", "projects", "decisions", "goals", "constraints", "work", "profile", "health", "finance", "relationships"],
                      "type": "string"
                    },
                    "client_fact_id": {
                      "pattern": "^[A-Za-z0-9._:-]{1,64}$",
                      "type": "string"
                    },
                    "effective_from": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "entity_id": {
                      "description": "Stable id like project:atlas (optional).",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "entity_label": {
                      "description": "Who/what the fact is about, e.g. \"Me\" or \"Project Atlas\".",
                      "maxLength": 200,
                      "type": "string"
                    },
                    "evidence": {
                      "additionalProperties": false,
                      "properties": {
                        "conversation_label": {
                          "maxLength": 100,
                          "type": "string"
                        },
                        "excerpt": {
                          "description": "The user's own words that support the fact.",
                          "maxLength": 500,
                          "type": "string"
                        }
                      },
                      "required": ["excerpt"],
                      "type": "object"
                    },
                    "expires_at": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "value": {
                      "maxLength": 1000,
                      "type": "string"
                    }
                  },
                  "required": ["assertion_kind", "attribute", "category", "client_fact_id", "entity_label", "evidence", "value"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "request_id": {
                "description": "Unique per call, e.g. a UUID.",
                "pattern": "^[A-Za-z0-9._:-]{8,64}$",
                "type": "string"
              }
            },
            "required": ["facts", "request_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "outcomes": {
                "items": {
                  "properties": {
                    "card_id": {
                      "type": "string"
                    },
                    "client_fact_id": {
                      "type": "string"
                    },
                    "reason_code": {
                      "description": "Why, e.g. ok, duplicate, not_allowed_category, sensitive_not_enabled, suspected_secret, use_update_memory, stale_revision, not_found.",
                      "type": "string"
                    },
                    "revision": {
                      "type": "integer"
                    },
                    "status": {
                      "enum": ["saved", "updated", "duplicate", "conflict", "skipped"],
                      "type": "string"
                    }
                  },
                  "required": ["client_fact_id", "reason_code", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "request_id": {
                "type": "string"
              }
            },
            "required": ["outcomes", "request_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
