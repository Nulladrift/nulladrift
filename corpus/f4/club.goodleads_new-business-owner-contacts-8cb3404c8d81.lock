        {
          "name": "create_checkout",
          "title": "Checkout link for a list (older name)",
          "description": "Mint a hosted Stripe Checkout link for a list you shaped — the same code as `checkout_list`.\n\n    Creating the link costs nothing and charges nobody — payment only happens\n    if a human opens the returned `checkout_url` and completes it on Stripe's\n    hosted page; the purchase is complete only when that person finishes\n    payment.\n\n    The dedicated buying journey is: `interpret_list` (the\n    buyer's words → a shape) or `list_starters` (ready-made lists with live\n    counts) → `quote_list` (graded counts + the price) → `checkout_list`\n    (this link). This tool keeps accepting a list for compatibility — the\n    list path is the same code as `checkout_list`.\n\n    What you can buy: a list — `list_id` (a saved list, `#browse?list=<id>`) or the\n    inline shape `filters` + `states` (omit `states` for every live state:\n    CO, CT, FL, NY, OR, TX, VA), with a `lane` (`all` / `best` / `contact`) and an optional `cap`\n    (`{\"type\": \"count|budget\", \"value\"}` — records for count, cents for budget).\n    The list is quoted through the same summary code path `browse_leads(summary=True)`\n    uses, then checkout is opened against exactly that quote — if the price\n    rule or the count moved in between, the server answers 409 with the\n    fresh quote and nothing is minted. **Billing base is `sellable` (a\n    matching record whose filing names a person), never `matching`.**\n    name and address $0.25 per record · plus one verified phone or email $0.50 · plus both $0.70 (price rule v1; live prices always come from the summary call's `prices` block). The selected records are frozen when the link is minted, so\n    what is billed is what is delivered.\n\n    `product_id` buys nothing: fixed-price shelf products were replaced by\n    starter lists with live counts. Passing one returns an error that names\n    the next calls — `list_starters` (or `interpret_list`), `quote_list`,\n    `checkout_list`. Every purchase is one-time; a standing order is set up\n    from a paid order's receipt, paid up front for the run (each delivery\n    draws on it).\n\n    `delivery`: `file` (the customer workbook — CSV / Excel / JSON, durable\n    re-download), `crm` (push into `crm_connection_id`), or `connector`\n    (the file ships today and `connector_crm_name` is recorded as a request\n    for that CRM). Delivery fires automatically on payment, typically within\n    a minute.\n\n    Returns: `checkout_url`, `order_id`, `session_id`, `records`,\n    `total_cents`, `currency`, `lines` (one per grade), `lane`, `cap`,\n    `price_rule_version`, `quote_valid_until` (counts refresh tomorrow\n    morning; the quote holds until then — and the frozen selection holds for\n    the life of the checkout session), `computed_at`, `exact`, `counts`\n    (`matching`, `sellable`, `verified_one`, `verified_both`, `no_channel`, `unnamed`), and `saved_list` (`id`, `url`, `name`, and the one-time\n    `claim_token` when this call saved an inline shape as a list).\n    Nothing is charged until a person completes checkout; the file arrives about a minute after they pay; if we find a phone or email on the records after that, the updated file replaces it on the order's receipt page within a few hours and the receipt shows what was found and billed. A hard bounce, a disconnected phone or the wrong person is replaced within 30 days; what you buy is yours to re-download any time.\n    ",
