        {
          "name": "list_filterable_fields",
          "title": "Filterable fields and grammar",
          "description": "The filter contract, from the schema endpoint (`GET /api/v1/schema/attributes?include=grammar`): fields, grammar, or recipes.\n\n    Call this before building `browse_leads` filters you haven't used before. Each field lists the `allowed_values`\n    when its vocabulary is closed and its `accepted_words` — the buyer's own words that mean a stored value (\"cell\" →\n    mobile, \"CST\" → the Central zones) — so you never have to learn our spellings; typed values are understood anyway.\n\n    Args:\n        section: `fields` (default) — every one of the 87 filterable\n            fields as `{\"field\", \"label\", \"type\", \"operators\", \"sortable\",\n            \"masked\", \"allowed_values\"?, \"description\", \"job\", \"absence\",\n            \"synonyms\"}`: `operators` is the ENFORCED set for that field (its\n            type's row, or a narrower pseudo-field override), `sortable`\n            flags the 77 fields `sort` accepts, `masked` flags\n            `contact_name`, `email_primary`, `phone_primary`, `registered_agent_name` (redacted for keyless callers, who may not filter the\n            summary on them), `allowed_values` lists the vocabulary where it is\n            enumerable (tiers in rank order, canonical `status` / `entity_type`\n            values — identical across all states), `job` names the jobs-ladder\n            step the field serves (LINK / CHOOSE / REACH, or IDENTITY),\n            `absence` states what a zero/null means per state where states\n            differ, and `synonyms` lists the buyer words that name this field;\n            canonical-vocabulary fields additionally carry `\"canonical\": true`,\n            the `\"values\"` list and a `\"raw_variant\"` naming the sibling field\n            that filters the raw state-specific SOS codes.\n            `grammar` — the leaf and group shapes (`and` / `or` / `not`), the\n            operator row per field type and the pseudo-field overrides, the\n            null semantics of the negative operators, and the sort contract\n            (multi-key shape, rank-ordered tier fields, tiebreaker) — plus\n            `sortable_fields` and `masked_fields` projected from the same\n            response. Filter grammar (rendered from the schema — `list_filterable_fields(section=\"grammar\")` is the full contract): a leaf is `{\"field\", \"op\", \"value\"}`; the top-level filters list is an implicit `and` group; group nodes `{\"op\": \"and\", \"filters\": [...]}` and `{\"op\": \"or\", \"filters\": [...]}` nest one or more children, `{\"op\": \"not\", \"filters\": [<one leaf or group>]}` negates exactly one. Operators by field type — text: eq, neq, in, not_in, contains, does_not_contain, exists, missing; number: eq, neq, gt, gte, lt, lte, between, in, not_in, exists, missing; date: eq, neq, gt, gte, lt, lte, between, in, not_in, exists, missing; boolean: eq, neq; geo: within. Narrower pseudo-fields — `run_manifest_id` eq; `cluster_ref` eq; `missing_stage` eq; `created_at` gt, gte, lt, lte, between; `geo_polygon` within; `geo_radius` within; `has_phone_or_email` eq; `filing_kind` eq, neq, in, not_in; `new_business_tier` eq, neq, in, not_in; `repeat_founders` eq, in. `neq`, `not_in`, `does_not_contain`, `not` keep rows where the field has no value. `exists` / `missing` take no value; `in` / `not_in` take a non-empty list; `between` takes `[start, end]`, both required. A (field, op) pair outside its type's row is a 422 naming the row, never a 500.\n            `recipes` — the outcome-recipe bank (`GET /api/v1/schema/recipes`):\n            jobs-to-be-done answered with the exact filters, what each score\n            means for that job, and the load-bearing caveats.\n\n    The same payload backs the Browse UI's filter builder, so anything listed\n    here works on browse, summary, export, checkout and pipeline scoping alike.\n    ",
