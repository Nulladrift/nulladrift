        {
          "name": "field_fill_rates",
          "title": "Field fill rates",
          "description": "How complete is every column in the file a buyer receives — exact counts, one call.\n\n    Answers \"what share of the records carries a value in each field?\" for every\n    delivered column, in the file's own order. It is exact (counted from stored\n    values over every sellable record, not sampled) and always current (refreshed\n    whenever the data changes; `computed_at` dates it). Use it before promising a\n    buyer a field, to compare states, or to see which columns are thin.\n\n    How \"filled\" is defined: text and category columns need a non-blank value;\n    numbers and dates need any value (0 counts); true/false flags need any known\n    value (a known false counts) — except `has_phone` and `has_email`, which mean\n    \"has one\" and count only when true. The records counted are the sellable\n    cohort Browse returns by default (`total`).\n\n    Each column row carries `basis`: `counted` (exact), `stamped at delivery` (the\n    file writes a value on every row, fill 100%), or `not countable yet` (with a\n    `reason`; `filled` and `fill_pct` are null — never guessed).\n\n    Args:\n        state: Two-letter state code (e.g. `FL`). Omit for all live states together.\n\n    Returns:\n        `{computed_at, scope, cohort: \"sellable\", total, columns: [{column, group,\n        filled, fill_pct, basis, reason?}], definition}`, or `{\"status\":\n        \"computing\"}` before the first snapshot exists. Aggregate counts only —\n        no records and no contact details.\n    ",
