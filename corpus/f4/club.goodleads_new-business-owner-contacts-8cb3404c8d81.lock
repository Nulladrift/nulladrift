        {
          "name": "checkout_list",
          "title": "Checkout link for a list",
          "description": "Turn a quoted list into a payment link a person completes — the buyer gets the file within a minute of paying.\n\n    Creating the link costs nothing and charges nobody — payment only happens\n    if a human opens the returned `checkout_url` and completes it on Stripe's\n    hosted page; the purchase is complete only when that person finishes\n    payment. Nothing is charged until a person completes checkout; the file arrives about a minute after they pay; if we find a phone or email on the records after that, the updated file replaces it on the order's receipt page within a few hours and the receipt shows what was found and billed. A hard bounce, a disconnected phone or the wrong person is replaced within 30 days; what you buy is yours to re-download any time.\n\n    Pass a saved list (`list_id`, `#browse?list=<id>`) or the inline shape\n    `filters` + `states` (omit `states` for every live state:\n    CO, CT, FL, NY, OR, TX, VA), a `lane` (`all` / `best` / `contact`) and an optional `cap`\n    (`{\"type\": \"count|budget\", \"value\"}` — records for count, cents for\n    budget). The list is quoted through the same summary path `quote_list`\n    uses, then checkout is opened against exactly that quote — if the price\n    rule or the count moved in between, the server answers 409 with the fresh\n    quote and nothing is minted. **Billing base is `sellable` (a matching\n    record whose filing names a person), never `matching`.** name and address $0.25 per record · plus one verified phone or email $0.50 · plus both $0.70 (price rule v1; live prices always come from the summary call's `prices` block). The\n    selected records are frozen when the link is minted, so what is billed is\n    what is delivered. After payment we go find a phone and email on every\n    record bought without one: the buyer authorizes a ceiling (`ceiling_cents` —\n    today's total plus the forecast upgrades), is charged `charged_now_cents` for\n    what exists now, and later only what we find, at that grade's price and\n    never above the ceiling. Every record ships the owner's name and mailing address plus the business facts — the business name, entity type and status, the state filing number and formation date, the industry with its NAICS, SIC and Google Business codes, the registered agent, the Lead Reference, and the Reachability, Contact Relevance and Contact Confidence scores; before paying, see one whole sample record (invented, every field real): https://app.goodleads.club/lead/GL-CO-900000, and open the exact file (11 made-up records, every column): https://app.goodleads.club/api/v1/commerce/sample-file?format=xlsx (or format=csv). A standing order on the same list (new matches on a\n    daily / weekly / monthly / quarterly cadence, paid up front for the run at the\n    same graded rule, each delivery drawn from it) is set up from the paid\n    order's receipt — this tool sells the one-time purchase.\n\n    `delivery`: `file` (the customer workbook — CSV / Excel / JSON, yours to\n    re-download any time), `crm` (push into `crm_connection_id`), or\n    `connector` (the file ships today and `connector_crm_name` is recorded as\n    a request for that CRM).\n\n    `include_existing`: the order is Just started only — brand-new businesses —\n    unless you pass this (or name `filing_kind` / `business_origin` in\n    `filters`); then existing businesses with a new filing are in the file too,\n    labeled, and the file's Read Me says you asked for them.\n\n    `offer_code`: the offer code your human was given, if any — the same one\n    you quoted with. Every grade then bills at the lower of list and the\n    offer; a code bound to one buyer needs their `customer_email`; a code\n    that cannot cover the whole list answers with the cap to set.\n\n    Returns: `checkout_url`, `order_id`, `session_id`, `records`,\n    `total_cents`, `currency`, `lines` (one per grade), `lane`, `cap`,\n    `price_rule_version`, `quote_valid_until`, `computed_at`, `exact`,\n    `counts` (`matching`, `sellable`, `verified_one`, `verified_both`, `no_channel`, `unnamed`), `offer` (when a code priced it), `saved_list` (`id`, `url`, `name`, and the\n    one-time `claim_token` when this call saved an inline shape as a list),\n    `after_payment` and `guarantee` (the two sentences above, written for the buyer), and —\n    when there are records to find on after payment — `ceiling_cents`,\n    `charged_now_cents` and `ceiling_note`.\n    ",
