        {
          "name": "explain_concept",
          "title": "Explain a concept",
          "description": "Translate a classification code, or map YOUR word for a concept to this surface's fields — ask before concluding absence.\n\n    **Codes — the crosswalk.** Every record carries NAICS, SIC, the Google\n    Business category and the payment MCC, tied together by our own taxonomy.\n    Give ANY one — `term` \"MCC 5812\", \"SIC 1711\", \"NAICS 238220\", \"google\n    category plumber\" (or `system` = naics / sic / mcc / google_category plus\n    `code`) — and get the other three back: the equivalents in each system, our\n    industry, the ready-to-use `filters` for each system, and a live count\n    (`total` is the whole crosswalk neighborhood; `total_exact` only industries\n    that carry the code itself; each industry is marked `exact` or `related`).\n    A code we do not carry directly WIDENS — to its parent group, then to the\n    industries the crosswalk ties it to — and `widened` says which step it took;\n    an empty answer means nothing relates to it, and names where to go next.\n    A trade word works too — \"plumbers\", \"electrician\", \"lawyer\", \"locksmith\": it is\n    read against the NAME of every code at every level (the Google category\n    \"Plumber\", the NAICS title \"Offices of Lawyers\", the SIC group \"Legal\n    Services\", the MCC description), and the answer says which level named it and\n    gives the broader parent. A SIC or NAICS prefix (`17`, `238`) is a whole group. A payments seller starts\n    from an MCC, a web designer from a Google category, a lender from NAICS — all\n    reach the same list. Hand the `filters` to `browse_leads` / `quote_list`.\n\n    **Concepts.** Call this whenever a term you or your buyer uses (\"vertical\",\n    \"direct dial\", \"sole proprietor\", \"operating address\", \"decision maker\")\n    doesn't obviously match a field name. It answers in three shapes:\n    `carried` names the exact fields and how to use them; `partially_carried`\n    adds per-state availability with the reason a state is zero (zero by state\n    design is not a data gap); `not_carried` explains why and names the nearest\n    signal we do hold. Ambiguous terms return a clarifying question instead of\n    a guess.\n\n    Never conclude \"this data is missing\" from an empty filter result or an\n    unmatched field name without calling this first — several concepts are\n    carried under a different name, and several zeros are publication facts,\n    not gaps.\n    ",
