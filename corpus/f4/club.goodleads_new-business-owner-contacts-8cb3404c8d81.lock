        {
          "name": "quote_list",
          "title": "Quote a list",
          "description": "What this list costs before anyone pays: how many records name a person, and the price by grade.\n\n    Pass a saved list (`list_id`, the 8-char id in `#browse?list=<id>`) or an inline\n    shape (`filters` + `states`; omit `states` for every live state:\n    CO, CT, FL, NY, OR, TX, VA). You get the same numbers the buy page shows a person:\n    `matching`, `sellable`, `verified_one`, `verified_both`, `no_channel`, `unnamed`, `facets`, `prices` (the live graded price rule +\n    `price_rule_version`), `quote` (present when `lane` or `cap` is given),\n    `exact`, `computed_at`, `quote_valid_until` (counts refresh tomorrow\n    morning; the quote holds until then), `per_state`, and the `_meta`\n    provenance block every read carries (schema_version, freshness, source,\n    access_level). When a count is zero by design the payload adds\n    `zero_reasons` — a state that never publishes the value, or a channel\n    asked of records too new to carry one yet: the morning after the\n    state posts a filing the record carries the name and mailing address;\n    phone and email are verified when you order. Each reason names the\n    widened count (`nearest_alternative`, e.g. \"last 90 days: 99 with a\n    phone\") and the filters that reach it (`alternative_filters`), so a zero\n    is never silent.\n\n    **Values are understood, not matched literally.** Filter values are understood, not matched literally: \"residential\",\n    \"cell\", \"CST\", \"Texas\", \"on fire\", \"Denver metro\" and \"working from home\" all resolve (case, spacing, plurals and\n    reviewed words), and every response echoes what was understood in `interpreted_values` (typed → stored). A value\n    that matched nothing comes back with `value_hints` — the closest real values and, for a closed list, every allowed\n    value. Read both before telling a human a count is zero or a field is missing.\n\n    **Billing discipline — read before quoting money to anyone.** Only\n    `sellable` records — matching records whose filing names a person — are\n    ever billed or delivered. `matching` includes `unnamed` records with no\n    person to reach; it is never a billable count and must never be presented\n    as one. Every price line is computed from `sellable` and its grades:\n    name and address $0.25 per record · plus one verified phone or email $0.50 · plus both $0.70 (price rule v1; live prices always come from the summary call's `prices` block). Lanes: `all` / `best` / `contact` (`all` = every sellable record at the\n    name-and-address grade; `best` = each record at its own grade, verified\n    first; `contact` = only records with a verified phone or email — add a\n    `has_email` filter for emailable now, `has_phone` for callable now). Cap:\n    `{\"type\": \"count|budget\", \"value\"}` — records for count, cents for\n    budget. Quote the server's numbers, never arithmetic of your own.\n\n    Each `quote.lines[]` entry carries `ships` (what a record at that grade\n    ships with, in the buyer's words — a name-and-address record never ships a\n    phone or email), and the summary carries `forecast` ({checked,\n    phone_expected, email_expected, both_expected, basis, as_of}): how many of\n    the records still to find on would come back with a verified phone or email,\n    from our measured outcomes on comparable records, stated with its basis.\n    `ceiling_cents` is the most a buyer can be charged: today's total plus the forecast upgrades, charged only for what we find. Every record ships the owner's name and mailing address plus the business facts — the business name, entity type and status, the state filing number and formation date, the industry with its NAICS, SIC and Google Business codes, the registered agent, the Lead Reference, and the Reachability, Contact Relevance and Contact Confidence scores; before paying, see one whole sample record (invented, every field real): https://app.goodleads.club/lead/GL-CO-900000, and open the exact file (11 made-up records, every column): https://app.goodleads.club/api/v1/commerce/sample-file?format=xlsx (or format=csv).\n\n    A quote supports three choices — callable now (a verified phone),\n    emailable now (a verified email, verified for deliverability and recent\n    activity), or newest, mail-first — plus a standing order. Orders are per\n    record with no minimums, so a small first order works.\n\n    `checkout_list` takes the same list / shape, lane and cap to buy exactly\n    what was quoted.\n\n    **Offer codes.** If your human was given an offer code — a price we agreed\n    with them, like `GL-7K3Q9M` — pass it as `offer_code` here AND on\n    `checkout_list`, so the quote and the payment link carry the same price.\n    A code is a ceiling: every grade bills at the lower of list and the\n    offer, never above list, and the reply adds an `offer` block (what is\n    left on it, when it expires). A code that cannot be used answers with\n    the reason in plain words; quoting again without the code gives list\n    price.\n\n    Args:\n        list_id: A saved list id. Mutually exclusive with `states` / `filters`.\n        states: State codes for an inline shape; omit for every live state.\n        filters: Filter clauses in the one contract (see `list_filterable_fields`).\n        include_held: Include inactive-or-holding entities (default False).\n        include_existing: Include existing businesses with a new filing (a\n            registration, a conversion, a reinstatement, a move, a rename) —\n            the default quotes Just started only, exactly as Browse and the\n            file do. Naming `filing_kind` / `business_origin` in `filters`\n            widens on its own.\n        lane: `all` / `best` / `contact` — asks for a `quote`.\n        cap: `{\"type\": \"count|budget\", \"value\": <int>}` — the dial the quote\n            is solved against.\n        offer_code: The offer code your human was given, if any.\n        group_by: Up to two fields to cross-tab the summary by, e.g.\n            `[\"property_classification\", \"naics_2_digit\"]` — residential vs.\n            commercial by industry in ONE call. Adds a `groups` block: the\n            four counts and the `share` per group, the top 50 groups, the rest\n            rolled into `other`. Groupable — classification: industry_sector,\n            industry_name, naics_2_digit … naics_6_digit, sic_2_digit …\n            sic_4_digit, gmb_category, mcc; geography: state, msa_name,\n            county_fips, principal_city, principal_zip, neighborhood,\n            time_zone, tract_income_band; also property_classification,\n            entity_type, reachability_tier, filed_by, formation_month.\n            Records our pipeline has not classified read `Unclassified`: counted with the groups so rows add up, ranked last (never leading a \"largest\" list), with the classified share in `classification` — the\n            classifier places more of them on every pipeline run, so a repeat\n            call later is a better count. Inline shapes only.\n\n    Returns:\n        The summary contract described above. Keyless callers may not filter\n        on `contact_name`, `email_primary`, `phone_primary`, `registered_agent_name` (422).\n    ",
