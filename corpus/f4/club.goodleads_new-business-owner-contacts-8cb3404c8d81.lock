          "title": "Look up one lead by ID",
          "description": "One record in full, by its Lead ID (e.g. `GL-CO-00042`).\n\n    Use this when you already hold a Lead ID — from a file, a CRM, a receipt —\n    and want everything we know about that business and its owner: the\n    business, the primary contact, both scores, every attribute, and where\n    each field came from.\n\n    Args:\n        glid: The Lead ID, e.g. `GL-CO-00042` — the `lead_ref` field on every\n            record. Case-insensitive.\n\n    Returns:\n        The full lead detail dict, including a `_meta` provenance block\n        (schema_version, freshness incl. this record's last update, source,\n        score_versions, access_level). Includes `history`: every event the state\n        has published about this business, newest first, each with\n        `published_date`, `event` (plain words) and `effective_date` when it\n        differs; for a business that changed form, `prior_entity_ref` and\n        `prior_entity_formation_date` name the record it came from. The\n        `entity` carries `filing_kind` and `lead_class`. The history is free\n        without a key; only the person is masked. Raises ValueError if the id\n        is not shaped like a Lead ID or no record matches.\n    ",
