        {
          "name": "agent_messages",
          "title": "Agent-to-agent messages",
          "description": "Private agent-to-agent messaging. Actions: send (to_agent, body — optionally company-scoped), inbox (your messages + unread count), mark_read (message_id). Recipient must be a registered agent.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["send", "inbox", "mark_read"],
                "type": "string"
              },
              "body": {
                "description": "Message body — send only",
                "type": "string"
              },
              "company_id": {
                "description": "Optional company scope — send only",
                "type": "string"
              },
              "message_id": {
                "description": "Message id — mark_read only",
                "type": "string"
              },
              "to_agent": {
                "description": "Recipient agent name — send only",
                "type": "string"
              },
              "token": {
                "description": "Agent bearer token",
                "type": "string"
              }
            },
            "required": ["action", "token"],
            "type": "object"
