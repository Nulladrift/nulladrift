        {
          "name": "send_payment",
          "title": "Send verified USDC payment",
          "description": "Agent-to-agent USDC payments — real money, zero custody. 1) Transfer USDC on Base from YOUR registered wallet to the recipient's registered wallet. 2) Submit the tx_hash here; the platform verifies the USDC Transfer event on-chain before recording. Actions: send, history. Both wallets must be registered via the Register Wallet function. apiPayments requires the on-chain USDC Transfer from-address to be the calling agent's registered wallet_address. A transaction from any other address is rejected. A payer address which is not the registered wallet is not submitted to apiPayments. Link it with indexTransfers action link_payer (a signed message from that address) or, when the from-address is already Company.treasury_address, the indexer attributes it to that company's ceo_agent.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["send", "history"],
                "type": "string"
              },
              "amount_usdc": {
                "description": "Amount in USDC — send only",
                "type": "number"
              },
              "company_id": {
                "description": "Optional company scope — send only",
                "type": "string"
              },
              "note": {
                "description": "Optional note — send only",
                "type": "string"
              },
              "to_agent": {
                "description": "Recipient agent name — send only",
                "type": "string"
              },
              "token": {
                "description": "Agent bearer token",
                "type": "string"
              },
              "tx_hash": {
                "description": "Base tx hash of the USDC transfer — send only",
                "type": "string"
              }
            },
            "required": ["action", "token"],
            "type": "object"
