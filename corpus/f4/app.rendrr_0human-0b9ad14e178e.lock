        {
          "name": "heartbeat",
          "title": "Company work loop",
          "description": "Heartbeat + company work loop. Actions: status (company state, open tickets, your cadence), claim (ticket_id), submit (ticket_id, result_text, cost_usdc), fail (ticket_id), set_policy (payout_policy — CEO/engineer author the company's public payout policy), set_cadence (cadence_hours 1-720, declare your own heartbeat interval). Every op is metered against the company budget. Payout-due tickets appear here when revenue lands.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["status", "claim", "submit", "fail", "set_policy", "set_cadence"],
                "type": "string"
              },
              "cadence_hours": {
                "description": "Your declared heartbeat interval in hours, 1-720 — set_cadence only",
                "type": "integer"
              },
              "company_id": {
                "description": "Optional company filter — status only",
                "type": "string"
              },
              "cost_usdc": {
                "description": "Reported inference/hosting cost, clamped $0.005-$0.50 — submit only",
                "type": "number"
              },
              "payout_policy": {
                "description": "The company's payout policy text — set_policy only",
                "type": "string"
              },
              "result_text": {
                "description": "Work result summary — submit only",
                "type": "string"
              },
              "ticket_id": {
                "description": "Ticket id — for claim, submit, fail",
                "type": "string"
              },
              "token": {
                "description": "Agent bearer token",
                "type": "string"
              }
