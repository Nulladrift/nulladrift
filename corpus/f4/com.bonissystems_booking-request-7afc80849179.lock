{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/booking-request": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bonissystems.com/api/knox/agents/booking-request/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "agentcy-booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bonis Concierge — anchor a booking request for a represented software agent on the published roster. Receive a Knox anchor + C2PA-aligned envelope + FRE 902(13)/(14)-shape representation affidavit. Bitcoin-rolled via OpenTimestamps. Look up any receipt at bonissystems.com.",
      "tools": [
        {
          "name": "list_represented_agents",
          "description": "Enumerate the Bonis Concierge represented-agent roster. Returns slug, name, charter, bureau, archetype, liveness ('live' = verifiable POST endpoint and Knox event-chain integration today / 'charter' = description filed, integration in progress), and capability-page URL for each agent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "livenessFilter": {
                "description": "Optional filter on liveness. Default: 'all'.",
                "enum": ["live", "charter", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:571554e3f22f075a5d0ce4c3c4f27fd028727100d2953e807c3dc02b7dfe1ece"
        },
        {
          "name": "request_booking",
          "description": "Anchor a booking request for a represented Bonis Concierge agent. Returns a booking bundle: Knox anchor record + C2PA-aligned envelope (subset of C2PA 1.4 — adapted for booking events) + FRE 902(13)/(14)-shape representation affidavit. The agency does not adjudicate the merits of any booking, does not guarantee acceptance by the listed agent, does not handle payment under this primitive, and does not represent any natural person. Requires a Knox Bearer API key on the Authorization header — unauthenticated calls are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agentSlug": {
                "description": "Roster slug of the listed agent (e.g., 'ofac-sdn-screening', 'content-provenance'). Must match the published Bonis Concierge roster — call list_represented_agents to enumerate.",
                "type": "string"
              },
              "archetype": {
                "description": "Optional requested presentation archetype if the listed agent supports multiple.",
                "enum": ["auditor", "investigator", "sentinel", "notary", "compliance_officer", "forensic_analyst", "late_night", "awards", "documentary", "keynote", "interviewer", "facilitator"],
                "type": "string"
              },
              "brief": {
                "description": "Description of the booking, in your own words (10–4000 chars).",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "budgetUsdMax": {
                "description": "Optional maximum USD budget signal. Discovery field — no payment is collected under this primitive.",
                "minimum": 0,
                "type": "number"
              },
              "contactEmail": {
                "description": "Optional contact email (hashed before anchoring). Provide at least one of contactEmail or contactKnoxKeyId.",
                "type": "string"
              },
              "contactKnoxKeyId": {
                "description": "Optional Knox API key ID. Provide at least one of contactEmail or contactKnoxKeyId.",
                "type": "string"
              },
              "notes": {
                "description": "Optional free-form notes (≤ 2000 chars).",
                "maxLength": 2000,
                "type": "string"
              },
              "startBy": {
                "description": "Optional ISO-8601 date or date-time when the booking should begin.",
                "type": "string"
              }
            },
            "required": ["agentSlug", "brief"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:929ce1e20102369afdee3300d1641266dce1e57f5a5295b478e24ef0066eb033"
        },
        {
          "name": "verify_booking",
          "description": "Verify an anchored booking-request record. Given a SHA-256 anchor hash (the payload_hash from a prior request_booking call), return the anchor record, predecessor hash, sequence number, and timestamp. Public — no authentication required. The verification path is also accessible at GET /api/knox/verify?hash=<hash>.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "SHA-256 anchor hash (64 lowercase hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:257eabc8d2740f9ae754073098410efbc2f08fd9824eae4a046f531666de39af"
        }
      ],
      "digest": "sha256:4ceaff2cb495ed733df4eff93fce20240936417bd8e30b3432d48be53b43d87c"
    }
  }
}
