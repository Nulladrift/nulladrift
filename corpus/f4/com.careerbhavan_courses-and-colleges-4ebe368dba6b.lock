      "instructions": "CareerBhavan: public, read-only data on Indian courses, colleges and universities\n(including online and distance degrees), from careerbhavan.com.\n\n- Find things with search_courses, search_colleges or search_guides; they return slugs.\n- Then use get_course_details, get_college_details, or get_college_course_details\n  (one course at one college: fees, eligibility, syllabus).\n- compare_colleges puts 2–4 colleges side by side, optionally for one course.\n- Fees are in INR and change each session; cite the careerbhavan.com link returned with\n  each result so the user can confirm and get free counselling.",
      "tools": [
        {
          "name": "compare_colleges",
          "title": "Compare colleges",
          "description": "Side-by-side comparison of 2–4 colleges: type, location, approvals, NAAC, NIRF, rating, fees and placements. Pass course_slug to compare the fees, duration and mode of that specific course at each college.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "college_slugs": {
                "items": {
                  "description": "College slug, e.g. from search results.",
                  "maxLength": 150,
                  "minLength": 1,
                  "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "course_slug": {
                "description": "Course slug, e.g. from search results.",
                "maxLength": 150,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["college_slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare colleges"
          },
          "behavior": {
