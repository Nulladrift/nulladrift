        {
          "name": "search_colleges",
          "title": "Search colleges and universities",
          "description": "Find Indian colleges and universities (including online and distance universities) on CareerBhavan. Filter by name, a course they offer, city, institution type, and total-fee budget in INR. Returns slugs, location, NAAC/NIRF, approvals and fees.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City as listed on the site, e.g. \"Bengaluru\", \"Noida\".",
                "maxLength": 60,
                "type": "string"
              },
              "course": {
                "description": "Only colleges offering this course, e.g. \"Online MBA\".",
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_total_fees_inr": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "min_total_fees_inr": {
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "College name or keyword.",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "description": "e.g. \"Private University\", \"Deemed University\".",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
