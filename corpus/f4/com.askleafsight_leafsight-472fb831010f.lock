        },
        {
          "name": "get_upcoming_checkins",
          "title": "My upcoming check-ins",
          "description": "The user's scheduled plant check-ins, soonest first, marked overdue, due today or upcoming. Plants the user said goodbye to are left out. Set include_other_care to also list watering and treatment tasks. Requires the user's Leafsight sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_other_care": {
                "description": "Also list watering, treatment and other care tasks.",
                "type": "boolean"
              }
