          "name": "search_guides",
          "title": "Search plant problem guides",
          "description": "Search Leafsight's plant problem guides: common symptoms, pests, diseases and care mistakes of houseplants and garden plants (for example yellow leaves, leaf spot, aphids, overwatering, root rot, powdery mildew). Use for general questions about a plant symptom. Returns titles, summaries and askleafsight.com links. No sign-in needed.",
