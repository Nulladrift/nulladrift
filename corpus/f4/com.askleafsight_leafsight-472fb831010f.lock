      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Leafsight helps with houseplant and garden plant problems. For general symptom questions, call search_guides, then get_guide. For the user's own plants, past assessments, care steps and check-ins, call list_my_plants first, then get_plant, get_result or get_upcoming_checkins; these need the user's Leafsight sign-in. Results are assessments, not diagnoses. When care steps are locked, say they are in the Leafsight app; never invent them. Nothing here can scan a photo or change the account. For price questions: Leafsight is for iPhone and iPad, and every photo assessment needs Leafsight Pro; there is no free version or free trial. Leafsight Pro is $5.99 a week, $4.99 a month or $29.99 a year, renewing until cancelled, or $49.99 once for Lifetime (US prices; other stores differ).",
      "tools": [
        {
          "name": "get_guide",
          "title": "Read a plant problem guide",
          "description": "Read one Leafsight plant problem guide in full: what it looks like, common causes, what to do first, when to look closer, and its sources. Use a slug from search_guides. No sign-in needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the guide text: en (default), es, de, fr, pt-BR, zh-Hans, ja or ko.",
                "enum": ["en", "es", "de", "fr", "pt-BR", "zh-Hans", "ja", "ko"],
                "type": "string"
              },
              "slug": {
                "description": "The guide's slug, e.g. 'overwatering-root-rot'.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a plant problem guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
