              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ee43ce37a6f7e975242e8b5d810bee5cff4ae783fbd73cd6f3bcd62dbae03bd2"
        },
        {
          "name": "get_plant",
          "title": "Get one of my plants",
          "description": "One saved plant: its details and notes, its recent assessments with care steps (as available in the user's app), its next check-in and active care tasks. Use a plant_id from list_my_plants. Requires the user's Leafsight sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plant_id": {
                "description": "The plant_id from list_my_plants.",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["plant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one of my plants"
