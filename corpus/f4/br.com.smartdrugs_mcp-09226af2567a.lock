        "version": "1.5.0",
        "description": "Fichas de nootrópicos, peptídeos, cogumelos funcionais, adaptógenos e canabinoides com fontes: interações com remédios, doses usadas nos estudos, curva de 24 horas, avaliação de stacks com corpo 3D, relatos e comunidade. Conteúdo educacional, sem recomendação de uso.",
