                "description": "Remédios em uso: nome genérico, marca ou classe. Classes aceitas: serotoninergicos, sedativos, anticonvulsivantes, estimulantes, antipsicoticos, imao, alcalinizantes, contraceptivos-hormonais, imunossupressores, substratos-cyp, anticoagulantes, hormonio-tireoidiano, antidiabeticos, anti-hipertensivos, azul-de-metileno, isrs, simpaticomimeticos, antidepressivos-triciclicos, opioides, benzodiazepinicos, cafeina, betabloqueadores, estatinas, bloqueadores-neuromusculares, piracetam, anticolinergicos, inibidores-colinesterase, levodopa, litio, nicotina, fenibut.",
                "items": {
