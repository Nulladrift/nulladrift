        },
        {
          "uri": "smartdrugs://ficha/angelica-gigas",
          "name": "angelica-gigas",
          "title": "Angelica gigas (dang-gui coreano)",
          "description": "Raiz de angélica coreana, usada na medicina tradicional da Coreia; os compostos característicos do extrato alcoólico são a decursina e o angelato de decursinol. A evidência para memória vem de camundongos, com o extrato etanólico padronizado INM-176; um ensaio coreano de fase III do INM-176 na doença de Alzheimer foi registrado como concluído em 2011, mas não achei resultados publicados. Em pessoas há um estudo de farmacocinética de dose única e um ensaio de 12 semanas que mediu triglicerídeos.",
