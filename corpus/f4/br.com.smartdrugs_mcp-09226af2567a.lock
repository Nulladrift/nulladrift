        },
        {
          "uri": "smartdrugs://ficha/adrafinil",
          "name": "adrafinil",
          "title": "Adrafinil",
          "description": "O adrafinil é um pró-fármaco do modafinil: no corpo, parte dele vira modafinil. Foi descoberto por um laboratório francês em 1974 e vendido na França como Olmifon para distúrbios de vigilância em idosos, mas a própria bula diz que a eficácia não foi provada fora dos idosos, e não foram encontrados ensaios controlados acessíveis. É proibido em competição pela WADA.",
