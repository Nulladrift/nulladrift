          "title": "Alfa-GPC",
          "description": "Fonte de colina que chega ao cérebro e serve de precursora da acetilcolina. Há um ensaio clínico positivo em Alzheimer leve a moderado; em pessoas saudáveis os dados são escassos e mistos.",
