          "digest": "sha256:c3d09087dea933255bccc4e4cdc725e2f73ae8dda6a9235513af625f8fcdbf78"
        },
        {
          "uri": "smartdrugs://ficha/ahk-cu",
          "name": "ahk-cu",
          "title": "AHK-Cu (tripeptídeo de cobre AHK)",
          "description": "O AHK-Cu é um tripeptídeo ligado a cobre, parecido com o GHK-Cu, vendido em cosméticos e séruns para queda de cabelo. Nas buscas feitas nesta pesquisa não existe nenhum estudo em pessoas: a evidência se resume a um trabalho coreano de 2007 com folículos de cabelo humano fora do corpo e células da papila dérmica em cultura, e a um estudo em células musculares de camundongo com um derivado ligado a vitamina C. Sem estudo em humanos, a ficha fica sem dose, sem farmacocinética e sem efeitos adversos descritos.",
          "mimeType": "text/markdown",
          "digest": "sha256:c49324103b4490049976289207549a0ccd77d1033b9f28c301f85fc33370f4e8"
        },
        {
          "uri": "smartdrugs://ficha/alfa-gpc",
