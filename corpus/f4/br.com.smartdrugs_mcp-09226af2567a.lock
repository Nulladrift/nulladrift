          "title": "Aniracetam",
          "description": "Racetam com ação glutamatérgica estudado em demência leve. A evidência humana se limita a um estudo aberto e não há dados sólidos de segurança de longo prazo.",
          "mimeType": "text/markdown",
          "digest": "sha256:229c86b89cb944b1dddc2eeade9a17638f91d547beffe664e2533e7dee7656d2"
        },
        {
          "uri": "smartdrugs://ficha/aod-9604",
          "name": "aod-9604",
          "title": "AOD-9604",
          "description": "Peptídeo sintético de 16 aminoácidos: o trecho 177-191 do hormônio do crescimento humano com uma tirosina a mais na ponta. Foi desenvolvido na Austrália pela Metabolic Pharmaceuticals como remédio oral para obesidade e chegou a seis ensaios clínicos com cerca de 900 pessoas; o maior deles, com 502 participantes randomizados, não mostrou diferença de peso contra placebo e a empresa encerrou o projeto em 2007. Não é aprovado como medicamento em nenhum país, a FDA recomendou não incluí-lo na lista de substâncias que podem ser manipuladas e a WADA o proíbe no esporte.",
          "mimeType": "text/markdown",
          "digest": "sha256:7d5a0c689a7f9f706170eb98207090bf8c6044ded21e09f79eea47c3dd3935b1"
        },
        {
          "uri": "smartdrugs://ficha/ara-290",
          "name": "ara-290",
          "title": "ARA 290 (cibinetida)",
          "description": "Peptídeo sintético de 11 aminoácidos desenhado a partir da eritropoietina para ativar o chamado receptor de reparo inato sem estimular a produção de glóbulos vermelhos. Em humanos há ensaios pequenos e curtos (28 dias, de 22 a 64 pessoas), quase todos do mesmo grupo e da empresa que desenvolve a molécula, com melhora de sintomas de neuropatia de fibras finas na sarcoidose e no diabetes tipo 2 e aumento de fibras nervosas da córnea. Não é aprovado como medicamento em nenhum país consultado; tem apenas designação de medicamento órfão na União Europeia.",
          "mimeType": "text/markdown",
          "digest": "sha256:7b403fc050b958f44e1334a68a9270ff59e415469dd2b3b5d272a3d97a488ef4"
        },
        {
          "uri": "smartdrugs://ficha/armodafinil",
          "name": "armodafinil",
          "title": "Armodafinila",
          "description": "A armodafinila é o enantiômero R do modafinil, aprovada nos EUA (Nuvigil) para a sonolência excessiva na apneia obstrutiva do sono, na narcolepsia e no transtorno do trabalho em turnos. Em ensaios de 12 semanas contra placebo, aumentou a vigília medida em laboratório; dor de cabeça foi o efeito adverso mais comum, e a bula alerta para reações graves de pele e sintomas psiquiátricos. Não há, nas fontes lidas, ensaios em pessoas saudáveis.",
          "mimeType": "text/markdown",
          "digest": "sha256:1b6400c51a5df2dca16cc517303a76a87175760fe4d7efca6ab2a78aa10495de"
        },
        {
          "uri": "smartdrugs://ficha/ashwagandha",
          "name": "ashwagandha",
          "title": "Ashwagandha",
          "description": "Planta da medicina ayurvédica vendida como adaptógeno. Ensaios curtos, quase todos na Índia, indicam redução do estresse percebido e do cortisol e melhora modesta do sono; a segurança no longo prazo não é conhecida.",
          "mimeType": "text/markdown",
          "digest": "sha256:2a35ae62fc4c7a8ee53070535f8e328a44798dea9ab7ceed9ad0eedad4ce09be"
        },
        {
          "uri": "smartdrugs://ficha/atomoxetina",
          "name": "atomoxetina",
          "title": "Atomoxetina",
          "description": "Medicamento não estimulante para TDAH que inibe seletivamente a recaptação de noradrenalina. Meta-análises mostram efeito superior ao placebo em adultos e crianças, menor que o das anfetaminas e com pior tolerabilidade que o placebo. A bula da FDA traz alerta em destaque para ideação suicida em crianças e adolescentes; em pessoas saudáveis, só há estudos pequenos de dose única com tarefas de laboratório.",
          "mimeType": "text/markdown",
          "digest": "sha256:f9681edeae3ff5203e82b2ac06fe5c1832508f7f6ca25b702854999eae95f9da"
        },
        {
          "uri": "smartdrugs://ficha/azul-de-metileno",
          "name": "azul-de-metileno",
          "title": "Azul de metileno",
          "description": "Corante usado como medicamento injetável para tratar metemoglobinemia, com alerta da FDA para síndrome serotoninérgica quando combinado com antidepressivos serotoninérgicos e opioides. Como 'nootrópico', há só um ensaio pequeno de dose única em 26 adultos saudáveis. Um derivado (HMTM) foi testado em fase 3 no Alzheimer e não separou do controle no desfecho principal de 52 semanas.",
          "mimeType": "text/markdown",
          "digest": "sha256:0a9e2232df978ec2e3d5815d81b10501cda7bfda56a196db2748b2b479662f11"
        },
        {
          "uri": "smartdrugs://ficha/bacopa-monnieri",
          "name": "bacopa-monnieri",
          "title": "Bacopa monnieri",
          "description": "Erva da medicina ayurvédica estudada em extratos padronizados por 12 semanas ou mais. Os ensaios mostram ganhos modestos de memória e de velocidade de atenção, com efeitos gastrointestinais frequentes.",
          "mimeType": "text/markdown",
          "digest": "sha256:9b5b728985ae701f8b68de1fc3792dcd53d0ae28621f1397f2ea463f09fe2407"
        },
        {
          "uri": "smartdrugs://ficha/bpc-157",
          "name": "bpc-157",
          "title": "BPC-157",
          "description": "Peptídeo sintético de 15 aminoácidos derivado de uma proteína do suco gástrico, vendido como \"research chemical\" e injetável para recuperação de lesões. Quase toda a evidência vem de animais: em humanos há só três estudos pequenos sem grupo controle (30 pessoas) e um ensaio controlado publicado apenas como resumo de congresso. Não é aprovado como medicamento em nenhum dos países consultados, a FDA aponta risco de imunogenicidade e de impurezas, e a WADA o proíbe no esporte.",
          "mimeType": "text/markdown",
          "digest": "sha256:0f4abbf37f9cd120da7ad2c1fe647c3c131ff44129e31ef125e9e9ad0eb9cd34"
        },
        {
          "uri": "smartdrugs://ficha/bromantano",
          "name": "bromantano",
          "title": "Bromantano",
          "description": "Derivado do adamantano criado na União Soviética como actoprotetor e registrado na Rússia como medicamento antiastênico (Ladasten). Os estudos clínicos são russos, em pacientes com astenia e neurastenia, quase todos abertos ou com descrição incompleta do cegamento. Está proibido no esporte: a Agência Mundial Antidopagem classifica o bromantano como estimulante não específico, proibido em competição.",
          "mimeType": "text/markdown",
          "digest": "sha256:3789f4f49e341d7eb843051baf3fbec4c0ce0690dfed646d187c8f014648e258"
        },
        {
          "uri": "smartdrugs://ficha/butilftalida",
          "name": "butilftalida",
          "title": "DL-3-n-butilftalida (NBP)",
          "description": "Composto sintético baseado na l-3-n-butilftalida das sementes de aipo, aprovado na China em 2002 para o AVC isquêmico, em cápsula e em injeção. Um ensaio chinês duplo-cego com 1.216 pacientes de AVC que receberam reperfusão mostrou mais pacientes com bom desfecho funcional em 90 dias (56,7% contra 44,0% no placebo), e um ensaio de 281 pacientes mostrou pequena melhora cognitiva no comprometimento vascular sem demência. Todos os ensaios são chineses, a maioria de baixa qualidade metodológica, e o efeito adverso mais citado é a elevação de enzimas do fígado.",
          "mimeType": "text/markdown",
          "digest": "sha256:f377906da57dc377712cdd10fa9dcb22795760ac8bcd5ee1b582738da993df78"
        },
        {
          "uri": "smartdrugs://ficha/cafe",
          "name": "cafe",
          "title": "Café",
          "description": "Principal fonte de cafeína no mundo. Doses moderadas melhoram humor e desempenho; doses altas atrapalham. Grandes revisões não associam o café a mais fibrilação atrial nem a câncer em geral.",
          "mimeType": "text/markdown",
          "digest": "sha256:758666fc2ef9e3e8bf1299f04ea844a7983d3d0207b0b4e234f60a6fa481235b"
        },
        {
          "uri": "smartdrugs://ficha/cafeina",
          "name": "cafeina",
          "title": "Cafeína",
          "description": "Metilxantina presente no café, no chá, no cacau e no guaraná. Aumenta o alerta e encurta o tempo de reação já em doses baixas, mas não compensa a falta de sono e causa tolerância e abstinência.",
          "mimeType": "text/markdown",
          "digest": "sha256:dddc9dc74ccd941eb9bf0c927b8b51d2c6df360d27fac8deb283e5270720d63d"
        },
        {
          "uri": "smartdrugs://ficha/cagrilintida",
          "name": "cagrilintida",
          "title": "Cagrilintida",
          "description": "Peptídeo experimental da Novo Nordisk, análogo de longa duração da amilina (hormônio do pâncreas ligado à saciedade), injetado sob a pele uma vez por semana. Sozinha, reduziu o peso em 6% a 11% em 26 semanas num ensaio de fase 2; combinada à semaglutida (CagriSema), levou a perda média de 20% em 68 semanas em ensaio de fase 3, com efeitos gastrointestinais na maioria dos participantes. Até outubro de 2026 a FDA não a tinha aprovado e afirmava que ela não pode ser manipulada; o que se vende fora dos ensaios é produto sem controle.",
          "mimeType": "text/markdown",
          "digest": "sha256:361baea9fd10b31287169bf8854004d786dfe8cae6a64dcb1738ebdceefdac68"
        },
        {
          "uri": "smartdrugs://ficha/canabidiol",
          "name": "canabidiol",
          "title": "Canabidiol (CBD)",
          "description": "Canabinoide da Cannabis sativa que não causa a intoxicação do THC. É medicamento aprovado nos EUA e na Europa para convulsões de três epilepsias raras, com redução de crises comprovada em ensaios controlados. Para ansiedade e cognição, os estudos em humanos são pequenos, quase sempre de dose única, e os resultados são inconsistentes.",
          "mimeType": "text/markdown",
          "digest": "sha256:af2cb360424527f72ad2f26330b52a63d606416615736322a7d7f51c989ac71d"
        },
        {
          "uri": "smartdrugs://ficha/cbc",
          "name": "cbc",
          "title": "Canabicromeno (CBC)",
          "description": "Canabinoide da Cannabis, formado a partir do mesmo precursor do THC e do CBD, sem efeito de intoxicação descrito. Não há nenhum ensaio clínico com CBC isolado em humanos: os únicos dados humanos vêm de produtos que misturam CBC com CBD, THC ou outros canabinoides, e o que se sabe sobre seus efeitos vem de células e animais. Mesmo assim, produtos de CBC são vendidos sem receita, com pouca ou nenhuma evidência de segurança ou eficácia.",
          "mimeType": "text/markdown",
          "digest": "sha256:64bb7c610dee7ec08663450427a00d1ddd1087b48a75b9ccc2fa46d0f9c745a5"
        },
        {
          "uri": "smartdrugs://ficha/cbdv",
          "name": "cbdv",
          "title": "Canabidivarina (CBDV)",
          "description": "Canabinoide da Cannabis parecido com o CBD (tem uma cadeia lateral mais curta) e sem efeito de intoxicação. Foi testado como medicamento: num ensaio controlado com 162 adultos com crises focais, não reduziu as crises mais que o placebo, e o desenvolvimento para epilepsia foi encerrado; em dor neuropática do HIV também não funcionou. Os estudos em autismo e na síndrome de Rett são pequenos, abertos ou de dose única, e o ensaio controlado em crianças autistas terminou em 2026 sem resultados publicados.",
          "mimeType": "text/markdown",
          "digest": "sha256:fa949109d865043a47f14e20f5d3f11cabdc43aa682cf7aa4757e560a79a9dfa"
        },
        {
          "uri": "smartdrugs://ficha/cbg",
          "name": "cbg",
          "title": "Canabigerol (CBG)",
          "description": "Canabinoide da Cannabis sativa, precursor químico do THC e do CBD, que não causou efeito de intoxicação nos estudos em humanos. Há só quatro estudos controlados pequenos e curtos com CBG isolado: um de dose única de 20 mg achou menos ansiedade e estresse, e um de 4 semanas em veteranos não melhorou o sono em relação ao placebo. Não é medicamento registrado em nenhum país, e boa parte do que se sabe vem de pesquisas online com usuários e de estudos em animais.",
          "mimeType": "text/markdown",
          "digest": "sha256:0b4a861f39e218fb09c3a06f799d7122327fada96ebf48b0e95278a357e745ff"
        },
        {
          "uri": "smartdrugs://ficha/cbl-514",
          "name": "cbl-514",
          "title": "CBL-514",
          "description": "Injeção experimental da Caliway Biopharmaceuticals (Taiwan) para reduzir gordura subcutânea localizada, aplicada em dezenas de pontos na área tratada. Não é um peptídeo: os artigos a descrevem como \"molécula pequena\", e o registro de um estudo no ClinicalTrials.gov informa que seus dois princípios ativos são curcumina e resveratrol. Ensaios de fase 2, pequenos, pagos pela fabricante e sem duplo-cego, mostraram redução da gordura abdominal tratada, com reações no local da injeção em quase todos os participantes; a fase 3 começou em 2026 e não há aprovação em nenhum país consultado.",
          "mimeType": "text/markdown",
          "digest": "sha256:99de4ca1e94a0fe51a294371277e9d1d674fa28942031fbfb90c83930ba0cdbf"
        },
        {
          "uri": "smartdrugs://ficha/cbn",
          "name": "cbn",
          "title": "Canabinol (CBN)",
          "description": "Canabinoide que se forma quando o THC da Cannabis se oxida, vendido como auxiliar do sono. Até 2021 não havia ensaio que medisse sono; desde então, poucos ensaios controlados, quase todos financiados ou conduzidos por empresas, acharam efeitos pequenos em questionários, e o único com polissonografia (20 pessoas, uma noite) não reduziu o tempo acordado durante a noite. Não é medicamento registrado em nenhum país, e no Reino Unido é droga controlada de Classe B.",
          "mimeType": "text/markdown",
          "digest": "sha256:647282a7895c8cef9450890bbe375d5814133cd34ae6f4e03cf135beb0a9a1ad"
        },
        {
          "uri": "smartdrugs://ficha/centrofenoxina",
          "name": "centrofenoxina",
          "title": "Centrofenoxina",
          "description": "Éster do DMAE com o ácido p-clorofenoxiacético, usado como medicamento na China e descrito como nootrópico em guias russos. Os estudos em humanos são antigos, pequenos e de curta duração, com sinais modestos em memória de idosos. Nos EUA não é aprovado e aparece em suplementos com dose rotulada errada; no Brasil está na lista C1.",
          "mimeType": "text/markdown",
          "digest": "sha256:f954813a35f2cd330f484a6bdae922d36e7d6efb24a3db0ced8aa482160dfc0f"
        },
        {
          "uri": "smartdrugs://ficha/cerebrolisina",
          "name": "cerebrolisina",
          "title": "Cerebrolisina (Cerebrolysin)",
          "description": "Mistura injetável de peptídeos de baixo peso molecular e aminoácidos obtida de cérebro de porco, registrada como medicamento na Rússia e em outros países para AVC, demência e traumatismo craniano. A revisão Cochrane de 2023 em AVC isquêmico agudo conclui que provavelmente não reduz mortes e aponta possível aumento de eventos adversos graves não fatais; a de 2019 em demência vascular viu melhora cognitiva pequena, com evidência de qualidade muito baixa. Há ensaios e meta-análises favoráveis em reabilitação motora, Alzheimer e trauma, vários ligados ao fabricante.",
          "mimeType": "text/markdown",
          "digest": "sha256:cf5bdf231c6ce5a5fc6cc451d3fccc5951cac31cc57e6cf1f57b599ee5a1ebfa"
        },
        {
          "uri": "smartdrugs://ficha/cetamina",
          "name": "cetamina",
          "title": "Cetamina e escetamina",
          "description": "A cetamina é um anestésico injetável usado desde 1970; a escetamina, uma de suas duas formas espelhadas, é um spray nasal aprovado para depressão resistente ao tratamento, aplicado só em serviço de saúde e sob observação. Em ensaios, uma infusão de cetamina e o spray de escetamina reduziram sintomas depressivos em horas a dias, com efeito que costuma diminuir e evidência de certeza baixa a moderada. O uso recreativo frequente está ligado a dependência, lesão grave da bexiga e das vias biliares, prejuízo de memória e mortes, quase sempre com outras drogas.",
          "mimeType": "text/markdown",
          "digest": "sha256:6c2af210e853e8dcf34d287e8116375779f479226c70adf25be1d16f43785d48"
        },
        {
          "uri": "smartdrugs://ficha/cha-verde-e-preto",
          "name": "cha-verde-e-preto",
          "title": "Chá verde e chá preto (Camellia sinensis)",
          "description": "Bebidas da mesma planta, com cafeína, teanina e catequinas. O chá ajuda a manter o alerta ao longo do dia; extratos concentrados têm mais efeitos colaterais e casos raros de lesão hepática.",
          "mimeType": "text/markdown",
          "digest": "sha256:be55d308d1367c50822d717420f087048c8daafdfcbb168da375422372915cf1"
        },
        {
          "uri": "smartdrugs://ficha/chaga",
          "name": "chaga",
          "title": "Chaga (Inonotus obliquus)",
