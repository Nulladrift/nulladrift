          "description": "Molécula pequena que bloqueia a enzima nicotinamida N-metiltransferase (NNMT), vendida em cápsulas e frascos como se fosse um peptídeo, o que ela não é. Toda a evidência vem de camundongos, ratos e células: perda de gordura em camundongos obesos, mais força e melhor regeneração muscular em camundongos velhos. Não achei nenhum estudo em humanos nem ensaio clínico registrado, e nenhuma agência a avaliou.",
