        {
          "name": "verificar_interacoes",
          "title": "Verificar interações",
          "description": "Cruza substâncias do SmartDrugs entre si e com remédios de uso comum (nome genérico, marca ou classe, como \"sertralina\", \"Rivotril\" ou \"anticoagulantes\") e devolve as interações que as fichas publicam, com gravidade (alta, moderada, baixa), explicação e fontes. Também avisa quando há estimulantes ou sedativos somados. Não encontrar alerta não significa que a combinação é segura.",
