        {
          "name": "entrar_na_comunidade",
          "title": "Entrar na comunidade",
          "description": "Liga esta conversa à conta da pessoa na comunidade SmartDrugs, para enviar relatos, reagir a relatos e publicar comentários e perguntas em nome dela. Devolve um link e um código: mostre os dois à pessoa e peça que abra o link, entre com o Google e confira se o código é o mesmo antes de autorizar. Entrar é com a conta Google, em um clique: a SmartDrugs não cria nem guarda senha. Depois que ela disser que autorizou, use a chave devolvida aqui nas ferramentas da comunidade. A conexão vale 7 dias e pode ser encerrada na mesma página. Use só quando a pessoa pedir para enviar um relato ou participar.",
