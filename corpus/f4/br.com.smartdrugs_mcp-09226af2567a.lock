          "mimeType": "text/markdown",
          "digest": "sha256:7c44d2c0f15671ada29c7cfb683d541db311ff34f72041ff603d207f159746da"
        },
        {
          "uri": "smartdrugs://ficha/citicolina",
          "name": "citicolina",
          "title": "Citicolina (CDP-colina)",
          "description": "Composto do próprio organismo que fornece colina e citidina para formar fosfolipídios das membranas neuronais. Os ensaios clínicos têm resultados heterogêneos; há poucos estudos em pessoas saudáveis.",
          "mimeType": "text/markdown",
          "digest": "sha256:66c207580fedd36a34fac411518a67513c8985bea33f6611f9698c5f7d6f3106"
        },
        {
          "uri": "smartdrugs://ficha/cjc-1295",
          "name": "cjc-1295",
          "title": "CJC-1295",
          "description": "Análogo sintético do hormônio liberador do hormônio do crescimento (fragmento hGRF 1-29) desenhado para se ligar de forma permanente à albumina do sangue, o que lhe dá meia-vida de quase uma semana. Em voluntários saudáveis, elevou hormônio do crescimento e IGF-1 por vários dias, mas o desenvolvimento clínico parou: o único ensaio de fase 2 registrado, em pessoas com HIV e obesidade visceral, foi encerrado em 2006 sem resultados publicados. Não é medicamento aprovado em nenhum dos países consultados; a FDA relata eventos adversos graves e a WADA o proíbe no esporte.",
          "mimeType": "text/markdown",
          "digest": "sha256:71d1c83c41c72a397377adf677113cbe6b7ad4db56c54673ea72970c604c3b56"
        },
        {
