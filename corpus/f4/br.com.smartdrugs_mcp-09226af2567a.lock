          "title": "Açafrão (Crocus sativus)",
          "description": "Especiaria feita dos estigmas da flor Crocus sativus (não é a cúrcuma). Meta-análises de ensaios, a maioria iranianos, mostram redução de sintomas de depressão e ansiedade com cerca de 30 mg/dia, mas com alta heterogeneidade, sinais de viés de publicação e efeito menos claro nas escalas aplicadas por médicos.",
          "mimeType": "text/markdown",
