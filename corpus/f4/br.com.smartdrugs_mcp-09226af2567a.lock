        },
        {
          "uri": "smartdrugs://ficha/acetil-l-carnitina",
          "name": "acetil-l-carnitina",
          "title": "Acetil-L-carnitina",
          "description": "Éster acetilado da L-carnitina, registrado como medicamento na Itália para lesões de nervos periféricos. Meta-análises sugerem efeito em sintomas depressivos e um efeito pequeno no comprometimento cognitivo leve, mas a Cochrane não viu benefício em medidas objetivas na demência e considera muito incerto o efeito na dor da neuropatia diabética. Num ensaio em câncer de mama, piorou a neuropatia causada por quimioterapia.",
          "mimeType": "text/markdown",
          "digest": "sha256:dfd3c8455aff49a298cc2de9781145993e8cdd61d4c68ff06ff10541a67cf74d"
        },
        {
          "uri": "smartdrugs://ficha/acido-hopantenico",
          "name": "acido-hopantenico",
          "title": "Ácido hopantênico (hopantenato de cálcio)",
          "description": "Análogo do ácido pantotênico (vitamina B5) e derivado do GABA, registrado na Rússia como nootrópico de venda com receita e usado no Japão desde 1978 como 'ativador do metabolismo cerebral'. Ensaios russos pequenos com placebo em crianças mostram efeitos modestos ou só tendência. No Japão, a partir de 1986, foram descritos mais de 47 casos de encefalopatia aguda semelhante à síndrome de Reye, 11 deles fatais, atribuídos ao antagonismo do ácido pantotênico.",
          "mimeType": "text/markdown",
          "digest": "sha256:cc7f3b282f1047d6f1f6751406f8ee746ac245ec81728a2eb63b6a48a90165b5"
        },
        {
          "uri": "smartdrugs://ficha/acido-ibotenico",
          "name": "acido-ibotenico",
