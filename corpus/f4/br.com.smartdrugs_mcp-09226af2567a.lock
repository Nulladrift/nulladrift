        {
          "uri": "smartdrugs://ficha/tenoten",
          "name": "tenoten",
          "title": "Tenoten (anticorpos anti-S100 em 'liberação ativa')",
          "description": "Produto russo registrado como ansiolítico de venda livre, feito de anticorpos contra a proteína cerebral S-100 submetidos a diluições ultra-altas (a chamada forma de 'liberação ativa'). O principal ensaio publicado em revista internacional (390 adultos) foi retratado pela Scientific Reports em 2022; entre os motivos, os editores citam que o produto é diluído além do ponto em que se espera haver alguma molécula ativa. Os demais ensaios são russos, quase todos ligados ao fabricante, e a plausibilidade do mecanismo é contestada.",
          "mimeType": "text/markdown",
          "digest": "sha256:a9e3715de568e780346f0afcd132fff40d8db4c49662b236ebc80c5327c81f96"
        },
        {
          "uri": "smartdrugs://ficha/tesamorelina",
          "name": "tesamorelina",
          "title": "Tesamorelina",
          "description": "Análogo sintético do hormônio liberador do hormônio do crescimento (GHRH 1-44), aprovado pela FDA desde 2010 com o nome Egrifta para reduzir o excesso de gordura abdominal em adultos com lipodistrofia associada ao HIV. Dois ensaios de fase 3 com 806 pacientes mostraram redução da gordura visceral, mas o efeito some quando o tratamento para e a segurança cardiovascular de longo prazo não foi estabelecida. Num ensaio de 20 semanas em adultos de 55 a 87 anos, com e sem comprometimento cognitivo leve, houve efeito favorável sobre a função executiva; num ensaio aberto de 6 meses em pessoas com HIV, não houve diferença cognitiva entre os grupos.",
          "mimeType": "text/markdown",
          "digest": "sha256:28d59454f8095116233fd9742a380e055e595ba6d14781d7438ccde711ff2a0e"
        },
        {
          "uri": "smartdrugs://ficha/tianeptina",
          "name": "tianeptina",
          "title": "Tianeptina",
          "description": "Antidepressivo tricíclico atípico usado na Europa, na Ásia e na América Latina, que em laboratório também age como agonista do receptor opioide mu. Na dose de bula (12,5 mg três vezes ao dia) mostrou eficácia na depressão, mas nos EUA, onde não é aprovada e é vendida como 'nootrópico' ou suplemento, cresceram os casos de dependência, abstinência e intoxicação de tipo opioide, com mortes, e a FDA chama a tendência de 'gas station heroin'. No Brasil, é substância controlada da Lista C1.",
          "mimeType": "text/markdown",
          "digest": "sha256:885e518ecce34cae8fa839994dff9d207a6fae5bf583afe6011ae545eb9905c7"
        },
        {
          "uri": "smartdrugs://ficha/tirzepatida",
          "name": "tirzepatida",
          "title": "Tirzepatida",
          "description": "Medicamento injetável de uso semanal, da Eli Lilly, que ativa os receptores de GIP e de GLP-1. É aprovado para diabetes tipo 2 e para obesidade ou sobrepeso com comorbidade (no Brasil como Mounjaro, com retenção de receita) e, nos EUA, também para apneia do sono em adultos com obesidade. Ensaios de fase 3 mostram perda média de 15% a 21% do peso em 72 semanas, com efeitos gastrointestinais frequentes e alertas de bula para pancreatite, vesícula e tumores de tireoide vistos em ratos. Versões manipuladas, falsificadas ou vendidas \"para pesquisa\" são alvo de alertas da FDA, da EMA, da MHRA e de proibições da Anvisa.",
          "mimeType": "text/markdown",
          "digest": "sha256:78c5b138f17b31afa053a250807f9d499bdc9d15a033b4808cb21bce1d81c53a"
        },
        {
          "uri": "smartdrugs://ficha/uridina",
          "name": "uridina",
          "title": "Uridina",
          "description": "A uridina é um nucleosídeo que as células usam para formar nucleotídeos e fosfolipídios de membrana. Em humanos, quase toda a evidência sobre cognição vem da mistura Souvenaid (Fortasyn Connect), que tem 625 mg de monofosfato de uridina junto com DHA, EPA, colina e vitaminas; uma revisão Cochrane concluiu que a mistura provavelmente não reduz a progressão para demência. Os dados em depressão bipolar vêm de séries abertas muito pequenas.",
          "mimeType": "text/markdown",
          "digest": "sha256:c0030658ee5a5b205da6741521de68f7286e1347e3efe8b0a195faa3fcdbb09d"
        },
        {
          "uri": "smartdrugs://ficha/vinpocetina",
          "name": "vinpocetina",
          "title": "Vinpocetina",
          "description": "Composto sintético derivado da vincamina, um alcaloide da planta Vinca minor. É medicamento na Hungria e na Rússia (Cavinton, com receita na Rússia) para sequelas de AVC e outros distúrbios da circulação cerebral, e é vendido como suplemento nos EUA. As revisões Cochrane consideram a evidência inconclusiva em demência e insuficiente no AVC agudo. A bula russa contraindica o uso na gravidez e a FDA orienta que grávidas e mulheres que possam engravidar não usem.",
          "mimeType": "text/markdown",
          "digest": "sha256:813c5c17cb9c83c2fa5ea707548e1ff303f826cf735a78cf0554369bcb6c2df2"
        },
        {
          "uri": "smartdrugs://ficha/vitaminas-b",
          "name": "vitaminas-b",
          "title": "Vitaminas B (B12, B6 e folato)",
          "description": "Ficha de grupo: vitamina B12 (cobalamina), vitamina B6 (piridoxina) e folato (ácido fólico, vitamina B9), que participam do metabolismo da homocisteína. Em pessoas sem deficiência, revisões Cochrane e meta-análises grandes acharam efeito nulo ou mínimo na cognição, apesar de alguns ensaios positivos em subgrupos com homocisteína alta. Em excesso, a B6 pode causar neuropatia periférica, e a EFSA fixou o limite superior em 12 mg/dia.",
          "mimeType": "text/markdown",
          "digest": "sha256:de3b661bf1290627b850585737265529a92d81d0f235a11e53b20919b579a105"
        }
      ],
