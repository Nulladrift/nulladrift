        {
          "name": "enviar_relato",
          "title": "Enviar relato",
          "description": "Envia o relato da pessoa para a comunidade SmartDrugs (a equipe revisa antes de publicar). Antes de chamar: escreva o relato com as palavras da pessoa, nos blocos do formulário, mostre o texto final completo e peça confirmação; e peça que ela confirme esta declaração: \"É a minha experiência, tenho 18 anos ou mais e sei que o relato fica público com o meu nome de perfil. Li os termos (https://smartdrugs.com.br/termos/).\" Só envie com as duas confirmações dela nesta conversa. Sem marca, loja, preço, cupom, contato ou link no texto. A comunidade tem limite de relatos por dia por pessoa.",
          "inputSchema": {
            "properties": {
              "adversos": {
                "description": "Efeitos adversos (ou \"nenhum\").",
                "maxLength": 800,
                "type": "string"
              },
              "chave": {
                "description": "Chave da conexão (sdm_…), devolvida por entrar_na_comunidade depois que a pessoa autorizou.",
                "type": "string"
              },
              "como": {
                "description": "Como usei: quantidade, frequência e por quanto tempo, do jeito que fez.",
                "maxLength": 800,
                "type": "string"
              },
              "cuidados": {
                "description": "Cuidados que tomou: exames, acompanhamento, o que evitou.",
                "maxLength": 800,
                "type": "string"
              },
              "dados": {
                "description": "Opcional: campos estruturados que alimentam o resumo da ficha (só o que a pessoa disse).",
                "properties": {
                  "acomp": {
                    "enum": ["medico", "nao"],
                    "type": "string"
                  },
                  "dura": {
                    "enum": ["h2", "h4", "h8", "h8m", "continuo", "nao"],
                    "type": "string"
                  },
                  "freq": {
                    "enum": ["unica", "eventual", "semana", "dia", "dia2"],
                    "type": "string"
                  },
                  "inicio": {
                    "enum": ["m30", "h1", "h2", "h2m", "dias", "semanas", "nao"],
                    "type": "string"
                  },
                  "periodo": {
                    "enum": ["dia", "semana", "mes", "meses", "ano"],
                    "type": "string"
                  },
                  "unidade": {
                    "enum": ["mg", "g", "mcg", "ml", "gotas", "ui", "xicaras", "unidades"],
                    "type": "string"
                  },
                  "valor": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "declaracao_confirmada": {
                "description": "true só se a pessoa confirmou a declaração nesta conversa.",
                "type": "boolean"
              },
              "percebi": {
                "description": "O que percebi: o que mudou e quando; vale dizer o que não mudou.",
                "maxLength": 1500,
                "minLength": 10,
