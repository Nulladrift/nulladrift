        },
        {
          "uri": "smartdrugs://ficha/coenzima-q10",
          "name": "coenzima-q10",
          "title": "Coenzima Q10",
          "description": "Substância produzida pelo próprio corpo que participa da produção de energia nas mitocôndrias; é vendida como suplemento em muitos países e, no Japão, como medicamento (ubidecarenona) para insuficiência cardíaca leve a moderada. Há evidência moderada de menos mortes e internações na insuficiência cardíaca, apoiada sobretudo em um ensaio de 420 pacientes. Não baixou a pressão de forma relevante e não ajudou na doença de Parkinson.",
          "mimeType": "text/markdown",
          "digest": "sha256:e314d2af0fd40422612aed54d2d62a70eda10d3689974cf278a7240116a23c98"
        },
        {
          "uri": "smartdrugs://ficha/cogitum",
          "name": "cogitum",
          "title": "Cogitum (acetilaminossuccinato de potássio)",
          "description": "Solução oral com um sal de potássio do ácido acetilaminossuccínico (ácido aspártico acetilado), registrada na Rússia para a síndrome astênica (cansaço persistente) e vendida lá sem receita. A evidência em humanos é pequena e toda russa: um ensaio duplo-cego com 71 jovens, por 21 dias, e estudos abertos em crianças, sem grupo placebo. A bula russa diz que não há dados de farmacocinética e que a dose máxima é desconhecida.",
          "mimeType": "text/markdown",
          "digest": "sha256:9b543d9eafb163472e4007fcd1c28b91e9a6cf88c037b4308b672c576a8b0dbf"
        },
        {
          "uri": "smartdrugs://ficha/colina",
          "name": "colina",
          "title": "Colina (bitartarato de colina e lecitina)",
          "description": "Nutriente essencial e precursor da acetilcolina, vendido como sal (bitartarato ou cloreto de colina) ou como lecitina, fonte de fosfatidilcolina; as formas alfa-GPC e citicolina têm fichas próprias. Em jovens saudáveis, 2 a 2,5 g de bitartarato não melhoraram a memória, e a revisão Cochrane não achou benefício da lecitina na demência. Estudos observacionais ligam a ingestão de colina na dieta a menos declínio cognitivo, o que não prova efeito do suplemento.",
          "mimeType": "text/markdown",
          "digest": "sha256:54a044975ebf02b0d3648f9854d65067829206aee90309100fbc3e131ff7ba2f"
        },
        {
          "uri": "smartdrugs://ficha/coluracetam",
          "name": "coluracetam",
          "title": "Coluracetam",
          "description": "Composto experimental da família dos racetams, criado no Japão nos anos 1990 e nunca registrado como medicamento. Quase tudo o que se sabe vem de ratos e camundongos, nos quais aumentou a captação de colina pelos neurônios. O único ensaio em humanos localizado (fase 2, 115 adultos com depressão e ansiedade) terminou em 2009 e não tem resultados publicados.",
          "mimeType": "text/markdown",
          "digest": "sha256:d21e64bdd778ee0ba4251bec375f9c39aabd087a4d13e9b0ed11575b12b3a084"
        },
        {
          "uri": "smartdrugs://ficha/cordyceps",
          "name": "cordyceps",
          "title": "Cordyceps",
          "description": "Fungo parasita de lagartas, popular em suplementos para energia e desempenho. A única fonte citada no livro descreve efeitos da cordicepina em estudos de laboratório e animais.",
          "mimeType": "text/markdown",
          "digest": "sha256:ac8054e4edbf3779452ea9286bf1281811f0267045490cd4572d9a5aa023670e"
        },
        {
          "uri": "smartdrugs://ficha/cortexin",
          "name": "cortexin",
          "title": "Cortexina",
          "description": "Mistura de polipeptídeos extraídos do córtex cerebral de animais, aplicada por injeção intramuscular e registrada como medicamento na Rússia. Quase toda a evidência vem de estudos russos, muitos sem placebo e sem cegamento; uma revisão sistemática internacional encontrou um único ensaio elegível, com 80 participantes, e classificou a certeza da evidência como baixa a muito baixa. A bula russa não traz dados de farmacocinética.",
          "mimeType": "text/markdown",
          "digest": "sha256:8dd11c68bb83be332861cd9c954d2fece7d191374f70ff629ff62e97b5d9144f"
        },
        {
          "uri": "smartdrugs://ficha/creatina",
          "name": "creatina",
          "title": "Creatina",
          "description": "Um dos suplementos esportivos mais estudados: melhora o desempenho em esforços curtos e intensos e potencializa o treino de força. Há dados iniciais, com amostras pequenas, sobre memória.",
          "mimeType": "text/markdown",
          "digest": "sha256:b3c8b8c5b51ad220ff6bb3baadd4215ed77e87d670fc332dcf7d40063f31164f"
        },
        {
          "uri": "smartdrugs://ficha/curcuma",
          "name": "curcuma",
          "title": "Cúrcuma / curcumina",
          "description": "Raiz cujo principal composto é a curcumina, de baixa absorção. As evidências iniciais em osteoartrite de joelho são positivas, mas de qualidade limitada; formulações de alta absorção já foram ligadas a lesão hepática.",
          "mimeType": "text/markdown",
          "digest": "sha256:777c360e6986945a8968834d72c86069243d48d2b5a288972f13a11d5d7b0f41"
        },
        {
          "uri": "smartdrugs://ficha/cytoflavin",
          "name": "cytoflavin",
          "title": "Cytoflavin (ácido succínico, inosina, nicotinamida e riboflavina)",
          "description": "Combinação fixa russa de ácido succínico, inosina, nicotinamida (vitamina B3) e riboflavina (vitamina B2), em solução intravenosa e em comprimidos, registrada na Rússia com receita para AVC isquêmico e suas sequelas, encefalopatias, polineuropatia diabética e neurastenia. Quase toda a evidência vem de estudos russos em que o produto é somado ao tratamento padrão, muitos sem cegamento; as meta-análises relatam benefício no AVC, mas com heterogeneidade alta. Há um ensaio duplo-cego com placebo, de 216 pacientes, na polineuropatia diabética.",
          "mimeType": "text/markdown",
          "digest": "sha256:d6021b7ebb803a8de6504b1c3545ac5bba93afcc050b7fe3617f5d57167d23ba"
        },
        {
          "uri": "smartdrugs://ficha/danshen",
          "name": "danshen",
          "title": "Danshen (Salvia miltiorrhiza)",
          "description": "Raiz seca de Salvia miltiorrhiza, usada na medicina tradicional chinesa em doenças do coração e dos vasos do cérebro; na China existem dezenas de preparações (comprimidos, injeções, sais de depsídeos, pílulas compostas). As meta-análises de ensaios chineses veem melhora cognitiva no comprometimento vascular, mas as revisões Cochrane concluem que a evidência é fraca demais para julgar o efeito. Há relatos de sangramento com varfarina, e estudos em voluntários mostram que o extrato rico em tanshinonas altera a enzima CYP3A.",
          "mimeType": "text/markdown",
          "digest": "sha256:4808f05835f87c8953dcf41228bbd8c4506f94d5da4f4fbfd9d1ffab4eb44139"
        },
        {
          "uri": "smartdrugs://ficha/davunetida",
          "name": "davunetida",
          "title": "Davunetida",
          "description": "Peptídeo de 8 aminoácidos (NAPVSIPQ) derivado da proteína neuroprotetora ADNP, testado em spray nasal (AL-108) e por via intravenosa (AL-208). No maior ensaio, com 313 pacientes com paralisia supranuclear progressiva por 52 semanas, não teve efeito; em ensaios menores de comprometimento cognitivo leve e de esquizofrenia, o desfecho cognitivo principal também não diferiu do placebo. Não é aprovada em nenhum país, e as análises recentes que sugerem benefício em mulheres são post hoc, feitas por pesquisadores com patentes do fármaco.",
          "mimeType": "text/markdown",
          "digest": "sha256:93740de1d52fc553e8bc418618deec28e401286bec519afa3143c0286498c725"
        },
        {
          "uri": "smartdrugs://ficha/deanol-aceglumato",
          "name": "deanol-aceglumato",
          "title": "Deanol aceglumato (Nooclerin)",
          "description": "Sal do deanol (DMAE) com o ácido N-acetil-L-glutâmico, vendido na Rússia como solução oral com receita (Nooclerin), com indicações que vão de estados astênicos e abstinência alcoólica a problemas de memória e atenção. Os estudos em humanos são russos e pequenos: um ensaio aberto na abstinência alcoólica e dois ensaios cegos com placebo em crianças e adolescentes com cefaleia tensional, de 40 e 60 participantes. Os resumos não informam as doses usadas.",
          "mimeType": "text/markdown",
          "digest": "sha256:feeaac1f26738c22039f27783aa2eaff58c5e0662c71e814ca6710a9bf77ea4a"
        },
        {
          "uri": "smartdrugs://ficha/dihexa",
          "name": "dihexa",
          "title": "Dihexa",
          "description": "Molécula pequena derivada da angiotensina IV, criada em laboratório universitário nos Estados Unidos e vendida como 'research chemical'. Não há estudo em humanos: a FDA afirma que não identificou nenhum dado de exposição humana a produtos com dihexa por qualquer via. Os dados existentes são de roedores, peixes-zebra e células, e o artigo que descrevia o mecanismo proposto foi retratado em 2025 por dados falsificados ou fabricados.",
          "mimeType": "text/markdown",
          "digest": "sha256:5154d2f686f4747398878407f1bf8272793edfc351a856fdb411d5d8b9fa299d"
        },
        {
          "uri": "smartdrugs://ficha/dmae",
          "name": "dmae",
          "title": "DMAE (dimetilaminoetanol)",
          "description": "Composto aparentado com a colina, proposto como precursor da acetilcolina, testado sobretudo nas décadas de 1970 e 1980. Os ensaios são pequenos e discordantes: houve sinais em crianças com dificuldade de aprendizagem e em discinesia tardia, mas nenhum benefício na doença de Alzheimer. Não há prova de que aumente a acetilcolina no cérebro humano.",
          "mimeType": "text/markdown",
          "digest": "sha256:218383ea1651eaa2d08f497ae40c54ef839357844efb212725fcc31a8aff3ad4"
        },
        {
          "uri": "smartdrugs://ficha/donepezila",
          "name": "donepezila",
          "title": "Donepezila",
          "description": "Inibidor da acetilcolinesterase aprovado para demência do tipo Alzheimer. A fama de 'potencializador cognitivo' para pessoas saudáveis vem de um único estudo pequeno amplificado pela mídia.",
          "mimeType": "text/markdown",
          "digest": "sha256:3e8b25942f11eba61f8d64485d35c8f846396752e8b627b03b5032de3f4a28ad"
        },
        {
          "uri": "smartdrugs://ficha/ecklonia-cava",
          "name": "ecklonia-cava",
          "title": "Florotaninos de Ecklonia cava (alga gamtae)",
          "description": "Extrato de uma alga marrom comestível da Coreia e do Japão, rico em polifenóis chamados florotaninos (o mais estudado é o dieckol). Os ensaios em humanos são pequenos e curtos, quase todos coreanos, e cada um usou um extrato diferente: um ensaio de 1 semana com polissonografia viu menos tempo acordado durante a noite, e ensaios de 12 semanas viram pequenas quedas de colesterol e de glicose após a refeição. A EFSA considerou o extrato seguro até 263 mg/dia em adultos e alertou para o teor de iodo.",
          "mimeType": "text/markdown",
          "digest": "sha256:592ee079604df37406366686c7fc90e1c72e52af73fb931418291ed8f67bdabc"
        },
        {
          "uri": "smartdrugs://ficha/eleuthero",
          "name": "eleuthero",
          "title": "Eleuthero (Eleutherococcus senticosus)",
          "description": "Raiz usada como adaptógeno no Leste Asiático e na Rússia. Há estudos pequenos em resistência física e com combinações de ervas, mas não houve benefício sobre o estresse em ensaio maior.",
          "mimeType": "text/markdown",
          "digest": "sha256:f13c7aa4e36af9ffde339ce20269c4e1f375114f509d626f2c7be3aaf7352902"
        },
        {
          "uri": "smartdrugs://ficha/epitalon",
          "name": "epitalon",
          "title": "Epitalona",
          "description": "Tetrapeptídeo sintético (Ala-Glu-Asp-Gly) criado na Rússia a partir da composição de aminoácidos da epitalamina, um extrato da glândula pineal de bovinos. É vendido pela internet como peptídeo anti-idade, quase sempre com rótulo de uso só em pesquisa. Em humanos existem apenas três estudos pequenos, todos do mesmo grupo russo, com desfechos de laboratório ou de visão, nenhum com sono medido; não há dado de farmacocinética humana, estudo de toxicidade de dose repetida nem estudo de carcinogenicidade de 2 anos.",
          "mimeType": "text/markdown",
          "digest": "sha256:c4bcf27f980543afbd09283926d1e9439bff4d54b2ec4b56b60d2b53045da821"
        },
        {
          "uri": "smartdrugs://ficha/erva-mate",
          "name": "erva-mate",
          "title": "Erva-mate (Ilex paraguariensis)",
          "description": "Infusão sul-americana com cafeína. Um estudo controlado mostrou melhora de colesterol; o risco de câncer associado parece ligado à temperatura muito alta da bebida, não ao mate em si.",
          "mimeType": "text/markdown",
          "digest": "sha256:6819d7eb5736d3af5e807bd2077cc9a831ecda5493dd4b1cb55603919f72660f"
        },
        {
          "uri": "smartdrugs://ficha/espirulina",
          "name": "espirulina",
          "title": "Espirulina (Arthrospira platensis)",
          "description": "Cianobactéria consumida como suplemento proteico. Estudos pequenos mostram redução de lipídios e algum ganho de resistência; produtos podem conter contaminantes.",
          "mimeType": "text/markdown",
          "digest": "sha256:d456621121478b33d741f612f2d0fa06d2b24bd9865bef84b1a1409d4dcd1192"
        },
        {
          "uri": "smartdrugs://ficha/extrato-de-torta-de-gergelim",
          "name": "extrato-de-torta-de-gergelim",
          "title": "Extrato de torta de gergelim (SOCE)",
          "description": "Extrato aquoso purificado da torta (bagaço) que sobra da prensagem do óleo de gergelim, rico em glicosídeos de sesaminol, uma lignana. Em humanos há um único ensaio piloto coreano, de 12 semanas, com 70 pessoas de 60 anos ou mais: houve melhora em itens de aprendizado verbal e queda do beta-amiloide no plasma, mas o estudo é pequeno, teve financiamento do fabricante e ainda não foi repetido. O resto da evidência é de células e camundongos.",
          "mimeType": "text/markdown",
          "digest": "sha256:76917a9173aac726294a375dacb73564d6c076f25c4e1203be88cb66566c0711"
        },
        {
          "uri": "smartdrugs://ficha/fabomotizol",
          "name": "fabomotizol",
          "title": "Fabomotizol (Afobazol)",
          "description": "Ansiolítico russo não benzodiazepínico, registrado na Rússia em 2006 e vendido lá sem receita para estados de ansiedade. O ensaio de registro o comparou com diazepam em 150 pacientes por 30 dias, sem grupo placebo durante o tratamento; os demais estudos em humanos são russos e abertos. Em laboratório liga-se ao receptor sigma-1, ao sítio MT3 (NQO2) e à MAO-A, com afinidade na faixa micromolar.",
          "mimeType": "text/markdown",
          "digest": "sha256:9775b605af24c8577c4981bf6e891fb3b438fe4d05023b2b26a595752286feb0"
        },
        {
          "uri": "smartdrugs://ficha/fasoracetam",
          "name": "fasoracetam",
          "title": "Fasoracetam",
          "description": "Composto experimental da família dos racetams, estudado no Japão nos anos 1990 para doença cerebrovascular e depois nos EUA para TDAH em jovens com variantes em genes ligados aos receptores de glutamato mGluR. Um estudo pequeno sem grupo placebo paralelo mostrou melhora, mas os ensaios duplo-cegos seguintes registraram resultados próximos aos do placebo. Não foi localizado registro como medicamento.",
          "mimeType": "text/markdown",
          "digest": "sha256:86a6e1b2b6cd4200a99a145866b53c34a8c0aa6779147af6c5b212d1f134c7d9"
        },
        {
          "uri": "smartdrugs://ficha/fenibut",
          "name": "fenibut",
          "title": "Fenibut",
          "description": "Derivado do GABA usado na Rússia como ansiolítico. No Brasil é de uso proscrito. Fora do uso médico, há muitos relatos de dependência, abstinência grave e intoxicação.",
          "mimeType": "text/markdown",
          "digest": "sha256:35b693e6260d067da20e76b408fe3ca0cb8bf3cd41b26920315fd86066a8b074"
        },
        {
          "uri": "smartdrugs://ficha/fenilpiracetam",
          "name": "fenilpiracetam",
          "title": "Fenilpiracetam",
          "description": "Derivado do piracetam com um grupo fenil, registrado na Rússia como medicamento de receita (fonturacetam). Os estudos em humanos são quase todos russos, curtos e na maioria abertos; mostram menos astenia e pequenas melhoras em testes cognitivos em pacientes com doenças neurológicas. É estimulante proibido em competição pela WADA.",
          "mimeType": "text/markdown",
          "digest": "sha256:623ff6986d0cbe8895a037772296b1ece68e2cff24e241f6d142298041c34250"
        },
        {
          "uri": "smartdrugs://ficha/flavanois-do-cacau",
          "name": "flavanois-do-cacau",
          "title": "Flavanóis do cacau",
          "description": "Flavanóis são polifenóis do cacau, como a (−)-epicatequina, vendidos em extrato padronizado. Nos grandes ensaios do estudo COSMOS, 500 mg/dia por 2 a 3 anos não melhoraram a cognição de idosos em geral, com possível benefício só em quem tinha dieta pior ou consumo baixo de flavanóis. A evidência é mais sólida para efeitos pequenos nos vasos e na pressão arterial.",
          "mimeType": "text/markdown",
          "digest": "sha256:db98bfe2fbcdd475a0e6092bfdd05926beb461ce8406b001ab9abec3410874b5"
        },
        {
          "uri": "smartdrugs://ficha/fosfatidilserina",
          "name": "fosfatidilserina",
          "title": "Fosfatidilserina",
          "description": "Fosfolipídio das membranas neuronais. Os ensaios mais positivos usaram PS de córtex bovino, que não é mais vendida; com PS de soja e PS ligada a DHA os dados são menores e preliminares.",
          "mimeType": "text/markdown",
          "digest": "sha256:58747d73141c47f4ae7e8b9f9bcea0e4e31cb9eddbedd6de3bcaf153b1b67dd2"
        },
        {
          "uri": "smartdrugs://ficha/fragmento-hgh-176-191",
          "name": "fragmento-hgh-176-191",
          "title": "Fragmento de hGH 176-191",
          "description": "Pedaço da ponta carboxi-terminal do hormônio do crescimento humano, vendido em frascos liofilizados como \"queimador de gordura\". É preciso separar duas coisas: o fragmento puro (os aminoácidos 176-191 ou 177-191), estudado só em ratos e camundongos nos anos 1990, e o AOD-9604, que é esse mesmo trecho com uma tirosina a mais e foi o único a chegar a ensaios clínicos, todos sem resultado de emagrecimento. Não há nenhum estudo publicado do fragmento puro em pessoas; a WADA proíbe os dois no esporte, nominalmente.",
          "mimeType": "text/markdown",
          "digest": "sha256:42fd68885a87948f3f3ab06a4b86ddcc1e71d641de06b97d5a0233d31f11973e"
        },
        {
          "uri": "smartdrugs://ficha/gaba",
          "name": "gaba",
          "title": "GABA (ácido gama-aminobutírico)",
          "description": "O GABA é o principal neurotransmissor inibitório do cérebro e também é vendido como suplemento oral. Revisões apontam evidência limitada para estresse e muito limitada para sono, com estudos pequenos e muitos ligados a fabricantes. Não há dados em humanos mostrando que o GABA ingerido atravesse a barreira hematoencefálica.",
          "mimeType": "text/markdown",
          "digest": "sha256:4b08077d68d5bfa0cd595c17fbc95688477bcb3b24c5c6b6f27674b3a822fbbf"
        },
        {
          "uri": "smartdrugs://ficha/galantamina",
          "name": "galantamina",
          "title": "Galantamina",
          "description": "Inibidor da acetilcolinesterase aprovado para demência leve a moderada da doença de Alzheimer. A revisão Cochrane de 2024 mostra efeito pequeno, mas clinicamente relevante, na cognição em seis meses e nenhum benefício no comprometimento cognitivo leve. Náusea e vômitos são os principais motivos de abandono.",
          "mimeType": "text/markdown",
          "digest": "sha256:a8fed70daef11a8867aaa56e596048908d742c2db5fa2f7a8a3e64ab4d06ce75"
        },
        {
          "uri": "smartdrugs://ficha/gastrodia-elata",
          "name": "gastrodia-elata",
          "title": "Gastrodia elata (tianma) e gastrodina",
          "description": "Rizoma de uma orquídea usado na medicina tradicional chinesa e coreana; a gastrodina é o seu principal composto isolado e, na China, é usada como medicamento em cápsula e em injeção. O extrato oral da planta tem um ensaio coreano pequeno em queixa de memória, com diferença pequena. Os estudos de enxaqueca, cefaleia tensional, pressão alta e delirium pós-operatório são chineses, usaram gastrodina isolada (quase sempre injetável e somada ao tratamento convencional) e têm qualidade de evidência baixa; não valem para o extrato da planta.",
          "mimeType": "text/markdown",
          "digest": "sha256:02d11c18862ffd4726a6d596da37b6a7bba45e9d77e59609a99ed851ec584f29"
        },
        {
          "uri": "smartdrugs://ficha/gengibre",
          "name": "gengibre",
          "title": "Gengibre (Zingiber officinale)",
          "description": "Raiz tradicionalmente usada contra náusea e para a digestão. A melhor evidência é para náusea na gravidez; para a náusea da quimioterapia e outros usos o benefício é incerto.",
          "mimeType": "text/markdown",
          "digest": "sha256:53930ca348b5b532e35b3204d6965c1239ce85d2e17a1e812c32629dc53b83ad"
        },
        {
          "uri": "smartdrugs://ficha/ghk-cu",
          "name": "ghk-cu",
          "title": "GHK-Cu (tripeptídeo de cobre)",
          "description": "GHK é um tripeptídeo que existe no plasma humano e forma um complexo com cobre (GHK-Cu); é usado em cosméticos e vendido como peptídeo injetável de \"pesquisa\". Quase toda a evidência vem de células e animais: nos poucos estudos em pessoas o GHK aparece sempre dentro de fórmulas com vários ingredientes, e o único ensaio randomizado que testou GHK-Cu isolado na pele (13 pacientes após laser) não achou diferença nas medidas objetivas. Não é medicamento aprovado em nenhum dos países consultados; a FDA classificou o GHK-Cu injetável como substância de risco para manipulação e a Anvisa diz que não há registro no Brasil.",
          "mimeType": "text/markdown",
          "digest": "sha256:bb9609aca01f68eb30d3efc442c9db327a6e611b178006ab4baf4ad258862847"
        },
        {
          "uri": "smartdrugs://ficha/ginkgo-biloba",
          "name": "ginkgo-biloba",
          "title": "Ginkgo biloba",
          "description": "Extrato da folha de ginkgo, muito estudado em demência. Não melhora a cognição de pessoas saudáveis nem previne demência; há dados positivos com o extrato EGb 761 em demência e ansiedade.",
          "mimeType": "text/markdown",
          "digest": "sha256:8c8e3b0c0dadbb51c5340728f330416a16ce6eb0153f87ebe01ef6e5cdef3e3b"
        },
        {
          "uri": "smartdrugs://ficha/goji",
          "name": "goji",
          "title": "Goji (Lycium barbarum / L. chinense)",
          "description": "Fruto de duas espécies próximas de Lycium, usado na China como alimento e tônico; é rico em dipalmitato de zeaxantina e em polissacarídeos. Os ensaios em humanos são pequenos e usam preparações diferentes (fruto inteiro, suco comercial, extrato aquoso, fórmula com leite): um ensaio coreano viu melhora em testes de atenção e memória em jovens, e meta-análises pequenas viram queda discreta de triglicerídeos. O risco mais bem documentado é a interação com a varfarina, com quatro relatos de caso de INR elevado, dois deles com sangramento.",
          "mimeType": "text/markdown",
          "digest": "sha256:be63453f8f378962fbc778bb78f355d70f68e9451cef4ed3e2ebfe5817dc6166"
        },
        {
          "uri": "smartdrugs://ficha/gongjin-dan",
          "name": "gongjin-dan",
          "title": "Gongjin-dan",
          "description": "Fórmula tradicional coreana em pílula, feita de raiz de Angelica gigas, fruto de Cornus officinalis, ginseng, galhada jovem de cervo e almíscar, em mel; algumas versões levam também raiz preparada de Rehmannia. Os dois ensaios coreanos publicados usaram formulações de fabricantes diferentes: no de fadiga crônica (90 pessoas, 4 semanas) o desfecho principal não diferiu do controle, e no de privação de sono (23 homens) o cortisol também não. Só desfechos secundários melhoraram. Há um relato de lesão renal.",
          "mimeType": "text/markdown",
          "digest": "sha256:fdb1e282403fda81c10ffb0077468d4478582d8aa4d0ce939b1739b2f56a10b5"
        },
        {
          "uri": "smartdrugs://ficha/guarana",
          "name": "guarana",
          "title": "Guaraná",
          "description": "Semente amazônica da Paullinia cupana, rica em cafeína (1,1% a 5,8%) e taninos. Uma meta-análise de 8 ensaios achou efeito agudo geral menos que trivial na cognição, com tempo de resposta um pouco mais rápido, sem saber se isso vem da cafeína ou de outros compostos. Na União Europeia é medicamento fitoterápico tradicional para fadiga, com base só no uso de longa data; em fadiga de pacientes com câncer, a meta-análise foi nula.",
          "mimeType": "text/markdown",
          "digest": "sha256:7dde12f0a43f90ba4fb2b51f56c9e1d07fafb669042d2e9aeb133b15978f048e"
        },
        {
          "uri": "smartdrugs://ficha/huperzina-a",
          "name": "huperzina-a",
          "title": "Huperzina A",
          "description": "Alcaloide do musgo chinês Huperzia serrata que inibe a acetilcolinesterase. Há sinais de benefício no Alzheimer, mas de ensaios com alto risco de viés; para comprometimento cognitivo leve não há ensaios adequados.",
          "mimeType": "text/markdown",
          "digest": "sha256:6f402d0a913962dc98e9ab69dc8503f3aca5caea67caba0aba511cb5ae4f63ed"
        },
        {
          "uri": "smartdrugs://ficha/ibogaina",
          "name": "ibogaina",
          "title": "Ibogaína",
          "description": "A ibogaína é o principal alcaloide da raiz de Tabernanthe iboga, arbusto da África Central usado há muito tempo em rituais Bwiti. Fora desse contexto, ela é usada em clínicas e por provedores informais para desintoxicação de opioides: os estudos publicados são quase todos observacionais, abertos e pequenos, e apontam queda dos sintomas de abstinência e da fissura. A substância prolonga o intervalo QT do coração, já causou arritmias e mortes, e provoca ataxia intensa nas primeiras horas.",
          "mimeType": "text/markdown",
          "digest": "sha256:018dd9fda1cb718b6852c9855d8232e3f98b356be4600b5c3b6ada7102a00bc8"
        },
        {
          "uri": "smartdrugs://ficha/icariina",
          "name": "icariina",
          "title": "Icariina (Epimedium)",
          "description": "Flavonoide prenilado das folhas de Epimedium (yin yang huo, \"horny goat weed\"). Quase toda a evidência sobre memória vem de animais; em humanos, a icariina isolada só foi testada num estudo piloto aberto com 10 pessoas, e os demais ensaios usaram extratos de Epimedium ou misturas, com desfechos de osso. Depois de ingerida, a icariina quase não aparece no sangue: o que circula são metabólitos.",
          "mimeType": "text/markdown",
          "digest": "sha256:288e9e7a4145be7a470818d1dc4680dec9792d4abd616d31973df077218001a7"
        },
        {
          "uri": "smartdrugs://ficha/ipamorelina",
          "name": "ipamorelina",
          "title": "Ipamorelina",
          "description": "Pentapeptídeo sintético criado pela Novo Nordisk nos anos 1990 que age no receptor da grelina (GHS-R) e faz a hipófise liberar hormônio do crescimento. Em pessoas só foi estudado por via intravenosa: um estudo de farmacocinética com 40 voluntários e dois ensaios de fase 2 em íleo pós-operatório, o único publicado deles (117 pacientes) sem diferença em relação ao placebo. Não é medicamento aprovado em nenhum dos países consultados, a FDA o colocou na categoria de substâncias com risco significativo de segurança para manipulação e a WADA o proíbe no esporte.",
          "mimeType": "text/markdown",
          "digest": "sha256:bac3ff966bc910619232623fd6a0ff1c20840f31db08c468b35cfb92e8b90abb"
        },
        {
          "uri": "smartdrugs://ficha/juba-de-leao",
          "name": "juba-de-leao",
          "title": "Juba-de-leão (Hericium erinaceus)",
          "description": "Cogumelo comestível estudado por estimular a síntese de NGF em células. Dois ensaios pequenos no Japão sugerem efeito em comprometimento cognitivo leve e em sintomas de ansiedade e depressão.",
          "mimeType": "text/markdown",
          "digest": "sha256:8830aec81c387990295b7b1e7976bebf0976c261d4ece8b24d042b74fcad82ff"
        },
        {
          "uri": "smartdrugs://ficha/kava",
          "name": "kava",
          "title": "Kava",
          "description": "Raiz de uma pimenteira das ilhas do Pacífico, consumida como bebida tradicional e vendida como extrato para ansiedade. Uma revisão Cochrane achou efeito pequeno e pouco robusto contra placebo, e o maior ensaio em transtorno de ansiedade generalizada (171 pessoas, 16 semanas) não achou benefício. Há casos raros de lesão hepática grave, alguns fatais, o que levou vários países europeus a retirar os produtos do mercado.",
          "mimeType": "text/markdown",
          "digest": "sha256:aefdd703ff915287ba6d998eefff6332c80f66a64978a4b5ee658d9046344ddb"
        },
        {
          "uri": "smartdrugs://ficha/kpv",
          "name": "kpv",
          "title": "KPV (tripeptídeo lisina-prolina-valina)",
          "description": "O KPV é um tripeptídeo que corresponde ao trecho final (aminoácidos 11 a 13) do hormônio alfa-MSH e é vendido como peptídeo anti-inflamatório em cápsula, creme, spray nasal e injeção. Toda a evidência é de animais e de células: em 2026 a FDA afirmou não ter encontrado nenhum dado de uso do KPV em seres humanos por qualquer via e propôs não incluí-lo na lista de substâncias permitidas para manipulação. Não há ensaio clínico registrado, não há dado de farmacocinética em pessoas e não há dose humana publicada.",
          "mimeType": "text/markdown",
          "digest": "sha256:ba2cfff5c44c512ed11e84dfb27ce8734613e313233bf098f2078b6d6c11ea69"
        },
        {
          "uri": "smartdrugs://ficha/l-teanina",
          "name": "l-teanina",
          "title": "L-Teanina",
          "description": "Aminoácido típico do chá-verde, estudado sobretudo combinado com cafeína. A combinação mostra ganhos moderados de alerta e atenção por até 2 horas; os dados sobre ansiedade e sono vêm de estudos pequenos.",
          "mimeType": "text/markdown",
          "digest": "sha256:8d15b9c0cc9b3cc1b3fc6066c5323f23527f9c6397c1602629a07fb612e3d889"
        },
        {
          "uri": "smartdrugs://ficha/l-tetra-hidropalmatina",
          "name": "l-tetra-hidropalmatina",
          "title": "L-tetra-hidropalmatina (l-THP, rotundina)",
          "description": "Alcaloide das plantas dos gêneros Corydalis e Stephania, vendido na China como medicamento sedativo e analgésico (rotundina) e, segundo um estudo vietnamita, sem receita no Vietnã. Bloqueia receptores de dopamina. Um ensaio chinês em 120 dependentes de heroína relatou menos fissura e mais abstinência; nos EUA, um ensaio de 4 semanas na esquizofrenia não mostrou benefício e outro, curto, avaliou só segurança em usuários de cocaína. Há casos publicados de hepatite com o produto Jin Bu Huan, que a continha, e de intoxicação com depressão do sistema nervoso central.",
          "mimeType": "text/markdown",
          "digest": "sha256:7943eb9f590f73d58274583dcabe6ccaed66b4a5337876d735bca61e02adb6e7"
        },
        {
          "uri": "smartdrugs://ficha/l-tirosina",
          "name": "l-tirosina",
          "title": "L-Tirosina",
          "description": "Aminoácido precursor de dopamina e noradrenalina. Estudos pequenos sugerem que ajuda a manter o desempenho sob estresse agudo ou privação de sono, mas não em condições normais.",
          "mimeType": "text/markdown",
          "digest": "sha256:d5b9941303c7b2dc69537d72571faf26a10599404bbbcac847217362fbad3822"
        },
        {
          "uri": "smartdrugs://ficha/leuzea",
          "name": "leuzea",
          "title": "Leuzea / Rhaponticum carthamoides (raiz-de-maral)",
          "description": "Planta da Sibéria cuja raiz é rica em ecdisteroides, sobretudo a 20-hidroxiecdisona (ecdisterona); na Rússia, o extrato líquido é medicamento sem receita para astenia e cansaço. Não achei ensaio controlado com o extrato da planta sozinho em pessoas: o que existe são ensaios com ecdisterona isolada, com resultados contraditórios para força e massa muscular, e um ensaio negativo de dose única com uma mistura de Leuzea e Rhodiola. A ecdisterona está no programa de monitoramento da WADA desde 2020; não é proibida.",
          "mimeType": "text/markdown",
          "digest": "sha256:9418033559b0b1b4c54223c6849d29335454300675a3b2fd3c81697f53a28728"
        },
        {
          "uri": "smartdrugs://ficha/levocarnitina",
          "name": "levocarnitina",
          "title": "Levocarnitina (L-carnitina)",
          "description": "Composto que transporta ácidos graxos para dentro das mitocôndrias. Pessoas saudáveis produzem o suficiente; os resultados em desempenho físico, fadiga e cognição são inconsistentes.",
          "mimeType": "text/markdown",
          "digest": "sha256:fb52f0dfd4c3fc76aa2457edbfdd6892da54f736e382b0feee497a61092eaca9"
        },
        {
          "uri": "smartdrugs://ficha/lisdexanfetamina",
          "name": "lisdexanfetamina",
          "title": "Lisdexanfetamina",
          "description": "Pró-fármaco da dexanfetamina (dexanfetamina ligada à lisina), usado no TDAH e, nos EUA, no transtorno de compulsão alimentar. As anfetaminas tiveram o maior efeito em adultos com TDAH numa meta-análise de 133 ensaios, mas a bula da FDA traz alerta em destaque de abuso e dependência, e uma revisão de 2024 conclui que o potencial de abuso oral é comparável ao da dexanfetamina. Em pessoas sem TDAH, há pouca evidência de que o uso não médico melhore o desempenho acadêmico.",
          "mimeType": "text/markdown",
          "digest": "sha256:991bbba0df602181ef0549297b166c4bba719984bce126e75cbac0376d64f682"
        },
        {
          "uri": "smartdrugs://ficha/litio-dose-baixa",
          "name": "litio-dose-baixa",
          "title": "Lítio em dose baixa",
          "description": "Uso de lítio (carbonato de lítio ou orotato de lítio) em doses bem menores que as psiquiátricas, com a ideia de proteger a cognição. Ensaios pequenos em comprometimento cognitivo leve e Alzheimer sugerem declínio mais lento, mas o ensaio mais recente, de 2 anos, não atingiu nenhum desfecho principal; os estudos de lítio na água de beber são observacionais e discordam entre si. Na dose psiquiátrica, o lítio tem margem estreita entre efeito e intoxicação.",
          "mimeType": "text/markdown",
          "digest": "sha256:a35535381af644072f540be14b5c708fd2505e9cccbfa136040df97c46752043"
        },
        {
          "uri": "smartdrugs://ficha/lsd-microdose",
          "name": "lsd-microdose",
          "title": "LSD em microdose",
          "description": "Microdose de LSD é o uso repetido, a cada poucos dias, de doses de alguns microgramas, abaixo das que causam alucinações. Em laboratório, essas doses mudam um pouco o humor, a pressão, o sono e a conectividade cerebral no dia do uso, mas os ensaios com placebo de 4 a 6 semanas não mostraram melhora duradoura de humor, cognição ou sintomas de TDAH, e a ansiedade foi o principal efeito indesejado. O LSD é de uso proscrito no Brasil e controlado no mundo todo.",
          "mimeType": "text/markdown",
          "digest": "sha256:ca06e7ce2f6d4f6b1b3d00b9a35e3e80562abafd9523a8c6dafdf0df7e16deef"
        },
        {
          "uri": "smartdrugs://ficha/maca",
          "name": "maca",
          "title": "Maca (Lepidium meyenii)",
          "description": "Raiz andina usada como alimento e suplemento. Há evidência limitada em função sexual, qualidade do sêmen e sintomas da menopausa; não há evidência sobre energia ou cognição.",
          "mimeType": "text/markdown",
          "digest": "sha256:affa0eebe7bd245ab7a8c2f367bbe2a3c7572763fad45849c5fcc3656d03d8dd"
        },
        {
          "uri": "smartdrugs://ficha/magnesio-l-treonato",
          "name": "magnesio-l-treonato",
          "title": "L-treonato de magnésio",
          "description": "Sal de magnésio com ácido L-treônico, desenvolvido para elevar o magnésio no cérebro; os dados de mecanismo vêm de ratos. Poucos ensaios pequenos em humanos, todos de curta duração e quase todos financiados por empresas do produto, mostraram ganhos modestos em testes cognitivos e em medidas subjetivas de sono, e um ensaio chinês não achou benefício em dor, humor, sono ou cognição.",
          "mimeType": "text/markdown",
          "digest": "sha256:6ac6984fbcaeecb593f3fd47e4516cedc2f44f62c9df96351312a86917c2371e"
        },
        {
          "uri": "smartdrugs://ficha/maitake",
          "name": "maitake",
          "title": "Maitake (Grifola frondosa)",
          "description": "Cogumelo culinário do Japão e da China estudado por seus beta-glucanos. Os resultados vêm principalmente de animais; em humanos, há apenas um estudo pequeno e sem controle em pacientes com câncer.",
          "mimeType": "text/markdown",
          "digest": "sha256:a977f21c9b8352fcdceecf5a01b5655aef33d0a7746b716195e7710230bc4730"
        },
        {
          "uri": "smartdrugs://ficha/manjericao-sagrado",
          "name": "manjericao-sagrado",
          "title": "Manjericão-sagrado (Ocimum sanctum)",
          "description": "Planta ayurvédica usada contra estresse e ansiedade. O único estudo clínico citado não teve grupo placebo; estudos em ratos levantaram dúvidas sobre fertilidade.",
          "mimeType": "text/markdown",
          "digest": "sha256:d6cf7f628afeca2c022cb731ac1cc629354df18bbded9af486398ea126afab8b"
        },
        {
          "uri": "smartdrugs://ficha/matcha",
          "name": "matcha",
          "title": "Matcha",
          "description": "Chá verde em pó, consumido inteiro, com mais teanina e cafeína que o chá comum. Estudos pequenos mostram efeito discreto na atenção e menor ansiedade quando a proporção de teanina é alta.",
          "mimeType": "text/markdown",
          "digest": "sha256:194e26ae2d5749f752bdc95aeae89a1ab57402a62d4c9026ab04dc6af5b96e85"
        },
        {
          "uri": "smartdrugs://ficha/mdma",
          "name": "mdma",
          "title": "MDMA",
          "description": "O MDMA libera serotonina, noradrenalina e dopamina pelos transportadores dessas substâncias e aumenta a ocitocina no sangue. Em dois ensaios de fase 3 com terapia estruturada, reduziu os sintomas de transtorno de estresse pós-traumático mais que o placebo com a mesma terapia, mas em agosto de 2024 a FDA recusou o registro e pediu um novo ensaio, por dúvidas sobre a confiabilidade dos dados de segurança, a durabilidade do efeito e a quebra do cegamento. Fora do ambiente clínico, está ligado a hipertermia, hiponatremia, síndrome serotoninérgica, eventos cardiovasculares e mortes, e é substância proscrita no Brasil.",
          "mimeType": "text/markdown",
          "digest": "sha256:acfce801eeaba2fbb96cf18a9d49bbe4506321dd6f0c49c894e003ee77cb213b"
        },
        {
          "uri": "smartdrugs://ficha/mebicar",
          "name": "mebicar",
          "title": "Mebicar / temgicoluril (Adaptol)",
          "description": "Ansiolítico não benzodiazepínico criado na União Soviética, registrado com receita na Rússia e na Letônia (Adaptol, do laboratório letão Olainfarm) para neuroses com ansiedade, irritabilidade e medo. Os estudos em humanos são observacionais ou abertos, na maioria russos, sem placebo: o mais recente, de 2025, acompanhou 100 adultos na Letônia por três semanas e tem autores ligados ao fabricante. O mecanismo não tem alvo molecular definido; os dados neuroquímicos são de animais, das décadas de 1970 e 1980.",
          "mimeType": "text/markdown",
          "digest": "sha256:1960d597088e585fa31ec676a90562a2fb060522bb9069ed700f1e59eaa5ec34"
        },
        {
          "uri": "smartdrugs://ficha/melatonina",
          "name": "melatonina",
          "title": "Melatonina",
          "description": "Hormônio produzido pela glândula pineal que participa do controle do ritmo sono-vigília; na Europa há um medicamento de liberação prolongada (2 mg) para insônia primária a partir dos 55 anos. Meta-análises mostram efeitos modestos sobre o tempo para adormecer e o jet lag. No Brasil não é aprovada como medicamento e só pode ser vendida como suplemento, com limite de 0,21 mg por dia.",
          "mimeType": "text/markdown",
          "digest": "sha256:331fd0cde4f4d685ca0037b3b3bb703894f6272e45ad6920aa07cfc74c534ec5"
        },
        {
          "uri": "smartdrugs://ficha/meldonium",
          "name": "meldonium",
          "title": "Meldônio",
          "description": "Fármaco cardiometabólico criado na Letônia que inibe a síntese de carnitina e desloca o metabolismo celular da queima de gordura para a de glicose. É registrado na Rússia, na Letônia e em outros países do Leste Europeu, mas não nos Estados Unidos, e está na lista de substâncias proibidas da Agência Mundial Antidopagem desde 1º de janeiro de 2016. Em atletas saudáveis não há ensaio randomizado controlado por placebo que mostre ganho de desempenho.",
          "mimeType": "text/markdown",
          "digest": "sha256:6ef0ef5a0ead5c61b61b8fe3adeac1e25eb892bedd10eaf05cfb41316282f9e1"
        },
        {
          "uri": "smartdrugs://ficha/memantina",
          "name": "memantina",
          "title": "Memantina",
          "description": "Medicamento para a doença de Alzheimer moderada a grave que bloqueia parcialmente o receptor NMDA do glutamato. Revisão Cochrane mostra benefício pequeno nessa fase e nenhum benefício no Alzheimer leve. Em pessoas saudáveis só há estudos pequenos de dose única, insuficientes para dizer que melhora a cognição.",
          "mimeType": "text/markdown",
          "digest": "sha256:2297867920897a2351f04730ed4f74b13cd908ecd3cf06ec2fb1a3de304d6be4"
        },
        {
          "uri": "smartdrugs://ficha/metilfenidato",
          "name": "metilfenidato",
          "title": "Metilfenidato",
          "description": "Estimulante de prescrição para TDAH. Em pessoas saudáveis o ganho cognitivo é pequeno, e a bula traz alerta máximo para abuso e dependência; análogos vendidos como 'novas substâncias' já causaram mortes.",
          "mimeType": "text/markdown",
          "digest": "sha256:644ef1e2a87ef93a29fdc14c040569cfd7798f8037d98fa2717886c94c47da7e"
        },
        {
          "uri": "smartdrugs://ficha/mexidol",
          "name": "mexidol",
          "title": "Mexidol (etilmetil-hidroxipiridina succinato)",
          "description": "Sal de succinato de um derivado de 3-hidroxipiridina, registrado na Rússia como medicamento antioxidante de venda com receita, usado em AVC isquêmico, isquemia cerebral crônica e TDAH infantil. Ensaios russos duplo-cegos com placebo (150 a 333 participantes) relatam melhora de escalas funcionais, cognitivas e de atenção. Quase toda a evidência vem da Rússia e de países vizinhos, foi publicada em uma mesma revista russa e não há revisão independente; o mecanismo se apoia em estudos de laboratório.",
          "mimeType": "text/markdown",
          "digest": "sha256:34ad62c8bdd016b35d7f14870ac4d210d22585e0a356b1c6df61029859c4d22a"
        },
        {
          "uri": "smartdrugs://ficha/modafinil",
          "name": "modafinil",
          "title": "Modafinil",
          "description": "Promotor de vigília aprovado para sonolência excessiva na narcolepsia, na apneia do sono e no trabalho em turnos. Em pessoas descansadas, os efeitos cognitivos variam conforme o teste usado.",
          "mimeType": "text/markdown",
          "digest": "sha256:538a95171b298b3919b550cb5e2cd7e3843d3f5b548a277e966ae65f63909a89"
        },
        {
          "uri": "smartdrugs://ficha/mots-c",
          "name": "mots-c",
          "title": "MOTS-c",
          "description": "Peptídeo de 16 aminoácidos codificado pelo DNA da mitocôndria, descrito em 2015, que ativa a AMPK e melhora sensibilidade à insulina e desempenho físico em camundongos. Em pessoas, o que existe é observação do peptídeo produzido pelo próprio corpo: o exercício aumenta sua expressão no músculo e no sangue. Não há estudo publicado de administração de MOTS-c em humanos; a FDA afirma não ter identificado nenhum dado de exposição humana por qualquer via. Um análogo (CB4211) completou um estudo de fase 1 sem resultados publicados e um ensaio de fase 2a com MOTS-c começou a recrutar em 2026. A WADA proíbe o peptídeo no esporte.",
          "mimeType": "text/markdown",
          "digest": "sha256:1b87e5bda5724ff592527ef8d6fc95c8b2278b8b5403a86b9601f145009ea237"
        },
        {
          "uri": "smartdrugs://ficha/muscimol",
          "name": "muscimol",
          "title": "Muscimol",
          "description": "Composto da Amanita muscaria que ativa receptores GABA-A e deprime o sistema nervoso central. Produtos com muscimol adicionado já causaram convulsões, coma, intubações e mortes. Não é medicamento aprovado e não tem benefício demonstrado.",
          "mimeType": "text/markdown",
          "digest": "sha256:72ef350df8285cc8f14db881ad3013e32e6bb82d369aa80e6725185965c462b3"
        },
        {
          "uri": "smartdrugs://ficha/n-acetil-l-tirosina",
          "name": "n-acetil-l-tirosina",
          "title": "N-acetil-L-tirosina",
          "description": "Forma acetilada e mais solúvel da L-tirosina, usada em soluções de nutrição parenteral e vendida como suplemento. Não há estudo publicado com NALT por via oral em humanos medindo cognição, humor ou desempenho. Nos estudos por via intravenosa, boa parte (35% a 60%) sai inalterada na urina e a tirosina no sangue sobe pouco ou nada.",
          "mimeType": "text/markdown",
          "digest": "sha256:9b3c4a1c861601b3e3081520d20e23b0dd403296dd71a27bdf00b4bd90169fcc"
        },
        {
          "uri": "smartdrugs://ficha/n-acetilcisteina",
          "name": "n-acetilcisteina",
          "title": "N-acetilcisteína",
          "description": "Medicamento usado como antídoto da intoxicação por paracetamol e como mucolítico, e vendido também como suplemento em alguns países. No Brasil é medicamento isento de prescrição. Em psiquiatria e dependência química os resultados são mistos: um ensaio em adolescentes com uso de cannabis foi positivo, mas o ensaio em adultos e uma meta-análise sobre fissura não mostraram efeito.",
          "mimeType": "text/markdown",
          "digest": "sha256:964c6c5fd7e0851f784fdf9364234d92c4aee66b3e156637604ebe3bb1aae428"
        },
        {
          "uri": "smartdrugs://ficha/nefiracetam",
          "name": "nefiracetam",
          "title": "Nefiracetam",
          "description": "Racetam desenvolvido no Japão pela Daiichi para sequelas de AVC e demência. O pedido de registro japonês foi retirado em 2002 por eficácia insuficiente. Nos ensaios com placebo, não tratou a depressão pós-AVC; houve sinal de melhora da apatia com 900 mg/dia em uma análise, não confirmado em ensaio posterior muito pequeno.",
          "mimeType": "text/markdown",
          "digest": "sha256:0ca8e15517d7d7d25ab2ca493d35bb82d85ded6961674d1c9fe7a9d08c81e0bb"
        },
        {
          "uri": "smartdrugs://ficha/nicotina",
          "name": "nicotina",
          "title": "Nicotina",
          "description": "Alcaloide estimulante do tabaco, com alto potencial de dependência. O uso com evidência sólida é a reposição de nicotina (adesivo, goma, pastilha) para parar de fumar, não o uso como nootrópico.",
          "mimeType": "text/markdown",
          "digest": "sha256:18f6ad912872a5fbb805959b0c61d9b320f17dfd6f028780ab75eaf0a60fc2fa"
        },
        {
          "uri": "smartdrugs://ficha/nigella-sativa",
          "name": "nigella-sativa",
          "title": "Nigella sativa (cominho-preto, habba sawda)",
          "description": "Semente de Nigella sativa (cominho-preto), usada como tempero e na medicina tradicional; o composto mais estudado é a timoquinona, presente no óleo volátil. Dois ensaios pequenos de Bangladesh com a semente em pó viram diferenças em testes de memória, e meta-análises apontam reduções modestas de pressão, glicose e lipídios, com qualidade de evidência quase sempre baixa ou muito baixa. Os estudos usaram preparações diferentes (semente em pó, óleo, óleo enriquecido em timoquinona) e não devem ser somados como se fossem a mesma coisa.",
          "mimeType": "text/markdown",
          "digest": "sha256:7886b3f04fcab9c14456fbc75f4bd83b4f34cde3e09c8d0dd7a5c3068d24d5fa"
        },
        {
          "uri": "smartdrugs://ficha/noopept",
          "name": "noopept",
          "title": "Noopept",
          "description": "Dipeptídeo sintético criado na Rússia como análogo do piracetam e registrado lá como medicamento (omberacetam, comprimidos de 10 mg). Uma revisão sistemática russa de 2026 reuniu 18 estudos clínicos, todos russos e abertos, com pequenas melhoras em testes cognitivos em pacientes com comprometimento cognitivo sem demência. Não há ensaio duplo-cego controlado por placebo publicado.",
          "mimeType": "text/markdown",
          "digest": "sha256:632f510ecfd4fc8c5e38ecd2ba5a57cd4d8a3396b9a551c00d94c1b4fb994402"
        },
        {
          "uri": "smartdrugs://objetivos",
          "name": "objetivos",
          "title": "Objetivos",
          "description": "Objetivos usados para organizar as fichas.",
          "mimeType": "application/json",
          "digest": "sha256:c1fdded6ec285115ca13ae25c12ee8e0dff7e943ff0b12ae9a5be161cbb2e720"
        },
        {
          "uri": "smartdrugs://ficha/olibano",
          "name": "olibano",
          "title": "Olíbano (frankincense, Boswellia)",
          "description": "Goma-resina de árvores do gênero Boswellia, rica em ácidos boswélicos (triterpenos como o AKBA). Para memória há poucos ensaios pequenos, com resultados mistos: alguns positivos e um ensaio de 18 semanas em Alzheimer sem diferença do placebo. A melhor evidência é de dor na osteoartrite, com extratos padronizados de Boswellia serrata; quase nada foi estudado com Boswellia sacra.",
          "mimeType": "text/markdown",
          "digest": "sha256:6b39dff517791d4efc2fd5bc6a80b9c647efc7af2cfe1600bb86dcb0a03f0b90"
        },
        {
          "uri": "smartdrugs://ficha/oligomanato-de-sodio",
          "name": "oligomanato-de-sodio",
          "title": "Oligomanato de sódio (GV-971)",
          "description": "Mistura de oligossacarídeos ácidos derivados de algas marinhas, de uso oral, que recebeu a primeira aprovação na China em novembro de 2019 (aprovação condicional, segundo revisões) para Alzheimer leve a moderado. A base é um único ensaio de fase 3 chinês de 36 semanas com 818 pacientes, sem biomarcador de amiloide na inclusão. O ensaio internacional de fase 3 (GREEN MEMORY) consta como suspenso no ClinicalTrials.gov desde 2022, sem resultados, e o mecanismo proposto, pelo eixo intestino-cérebro, ainda não foi validado em humanos.",
          "mimeType": "text/markdown",
          "digest": "sha256:8432b8ebcd5ce1e11d69f3d3344ad7fb83d5968ffa8409a553b29d7d3a0fc7d2"
        },
        {
          "uri": "smartdrugs://ficha/omega-3-epa-dha",
          "name": "omega-3-epa-dha",
          "title": "Ômega-3 (EPA e DHA)",
          "description": "Ácidos graxos de cadeia longa presentes em peixes e algas, estruturais nas membranas do cérebro e da retina. Os efeitos cognitivos em adultos saudáveis são pequenos ou ausentes; o benefício mais consistente é a redução de triglicerídeos.",
          "mimeType": "text/markdown",
          "digest": "sha256:c5a0108a526fc3a8d1a6ee2bbab2852245f9f2554b1fbb9327850896e2ddd7dd"
        },
        {
          "uri": "smartdrugs://ficha/oxiracetam",
          "name": "oxiracetam",
          "title": "Oxiracetam",
          "description": "Derivado do piracetam com uma hidroxila, estudado na Itália nas décadas de 1980 e 1990 e usado na China e na Coreia do Sul. Ensaios antigos em demência leve a moderada tiveram resultados mistos; um ensaio coreano de 2026 com 500 pacientes após AVC não mostrou benefício em 36 semanas. A tolerabilidade relatada é boa, e a eliminação depende dos rins.",
          "mimeType": "text/markdown",
          "digest": "sha256:949cfcd77ac0f7199bb3c5f2bf7f6a832b0de94f445b530d27bb4499a0aa2f7d"
        },
        {
          "uri": "smartdrugs://ficha/p21",
          "name": "p21",
          "title": "P021",
          "description": "Peptídeo curto derivado da região ativa do fator neurotrófico ciliar (CNTF) humano, desenvolvido num instituto de pesquisa de Nova York e licenciado para uma empresa que pretende transformá-lo em medicamento. Toda a evidência publicada é de camundongos, ratos e células: não encontrei nenhum estudo em humanos nem registro de ensaio clínico. Não confunda com a proteína p21 (inibidora de quinases dependentes de ciclina), que tem o mesmo nome e nada a ver com este peptídeo.",
          "mimeType": "text/markdown",
          "digest": "sha256:040d85dba5b908fc7b9f7ec3fa7fa717549b8213f6c6807c8efe9784377c3d5a"
        },
        {
          "uri": "smartdrugs://ficha/panax-ginseng",
          "name": "panax-ginseng",
          "title": "Panax ginseng",
          "description": "Raiz tradicional da medicina asiática. Há sinais de efeito agudo na velocidade de memória, na fadiga e na resposta à vacina da gripe, mas os estudos são pequenos ou abertos.",
          "mimeType": "text/markdown",
          "digest": "sha256:b6cb8ca24c959f0a5b9b8ca0100c9b2b1cce9950a1f0bc6c55c44dab7e155c27"
        },
        {
          "uri": "smartdrugs://ficha/picamilon",
          "name": "picamilon",
          "title": "Picamilon (nicotinoil-GABA)",
          "description": "Molécula sintética que une niacina e GABA, registrada na Rússia como medicamento de venda com receita para doença cerebrovascular e astenia. Os estudos clínicos recentes localizados são russos, abertos e sem placebo (44 e 50 pacientes), e um rastreio de laboratório de 2023 não encontrou ligação a 50 alvos biológicos. Nos EUA, a FDA declarou em 2015 que o picamilon não é ingrediente dietético, e análises acharam de 2,7 a 721,5 mg por porção em suplementos.",
          "mimeType": "text/markdown",
          "digest": "sha256:19326258df4f5890a2f2922f17f860ad9fa103aeb5a88c3c3402a0312d78a089"
        },
        {
          "uri": "smartdrugs://ficha/pinealon",
          "name": "pinealon",
          "title": "Pinealon",
          "description": "Tripeptídeo sintético Glu-Asp-Arg (EDR), criado pelo grupo de Vladimir Khavinson em São Petersburgo e vendido na Rússia como suplemento alimentar (БАД) em cápsulas orais, não como medicamento. Quase toda a pesquisa é russa, feita pelo próprio grupo criador ou por colaboradores, em células e em ratos. Os poucos estudos em humanos são pequenos, sem cegamento descrito, muitas vezes misturam o pinealon com outros peptídeos, e não há nenhum ensaio registrado no ClinicalTrials.gov.",
          "mimeType": "text/markdown",
          "digest": "sha256:d7a86f0e8566ab70485d581c9653841536117c85df117ea11c0aee1604b44956"
        },
        {
          "uri": "smartdrugs://ficha/piracetam",
          "name": "piracetam",
          "title": "Piracetam",
          "description": "Primeiro composto chamado de 'nootrópico'. Bem tolerado mesmo em doses altas, mas as revisões sobre demência discordam: a Cochrane não viu benefício em medidas específicas.",
          "mimeType": "text/markdown",
          "digest": "sha256:cb9fe7281c1d89fc44fec35df953641cbf6414c8869d9c29cd4f762617a8b62f"
        },
        {
          "uri": "smartdrugs://ficha/polygala",
          "name": "polygala",
          "title": "Polígala (Polygala tenuifolia)",
          "description": "Raiz usada na medicina tradicional chinesa (yuan zhi) para insônia e esquecimento. Em humanos há poucos ensaios: dois coreanos pequenos com o extrato BT-11 relataram melhora de memória, e estudos chineses testaram a planta só em combinação com outras ervas ou remédios. Quase todo o mecanismo vem de animais, e as saponinas da raiz irritam o trato digestivo.",
          "mimeType": "text/markdown",
          "digest": "sha256:9a8143cb98ae34f26dc631ee4643b555872da79701b6c9be6deb6cd8397529d7"
        },
        {
          "uri": "smartdrugs://ficha/pqq",
          "name": "pqq",
          "title": "PQQ (pirroloquinolina quinona)",
          "description": "Composto encontrado em pequenas quantidades nos alimentos, vendido como suplemento na forma de sal dissódico. A EFSA considerou seguro o uso de até 20 mg/dia em adultos, mas notou que os dados de absorção e de função renal em humanos são limitados. Os estudos de memória e atenção são pequenos, japoneses e quase todos ligados aos fabricantes.",
          "mimeType": "text/markdown",
          "digest": "sha256:945734181c464574d9d43679e44e12b79b8125bb26add383eb0575b512884059"
        },
        {
          "uri": "smartdrugs://ficha/pramiracetam",
          "name": "pramiracetam",
          "title": "Pramiracetam",
          "description": "Derivado do piracetam desenvolvido nos anos 1980 e registrado na Itália (Pramistar) para distúrbios de atenção e memória do idoso. A evidência em humanos se resume a ensaios pequenos e antigos: alguma melhora de memória após lesão cerebral e contra a amnésia por escopolamina, e nenhum benefício num ensaio pequeno em Alzheimer.",
          "mimeType": "text/markdown",
          "digest": "sha256:529484b1dc27cbb84127eaf393f39d61059f42f2d6586f979ded63aec08bf1c3"
        },
        {
          "uri": "smartdrugs://ficha/precursores-de-nad",
          "name": "precursores-de-nad",
          "title": "Precursores de NAD+ (NR e NMN)",
          "description": "Grupo de suplementos que inclui a nicotinamida ribosídeo (NR) e a nicotinamida mononucleotídeo (NMN), precursores do NAD+, um cofator do metabolismo energético. Em humanos, os dois elevam o NAD+ no sangue e foram bem tolerados em estudos de até alguns meses, mas dois ensaios de NR em comprometimento cognitivo leve não melhoraram a cognição e as meta-análises não acharam ganho de músculo nem benefício metabólico amplo.",
          "mimeType": "text/markdown",
          "digest": "sha256:ffe723850ea05c6e835b1e8ad80cd024fe5181bd70d10f7e3a991fcf3e693878"
        },
        {
          "uri": "smartdrugs://ficha/psilocibina",
          "name": "psilocibina",
          "title": "Psilocibina",
          "description": "A psilocibina é o principal composto psicodélico dos cogumelos do gênero Psilocybe e está sendo testada, em dose única ou em duas doses com apoio psicológico, para depressão, inclusive depressão resistente. Ensaios de fase 2 e meta-análises mostram queda dos sintomas maior que a do controle por algumas semanas, mas um ensaio alemão de 2026 não confirmou o desfecho principal, os participantes são muito selecionados e há eventos adversos, como dor de cabeça, náusea, alta da pressão e ideação suicida. É de uso proscrito no Brasil; na Austrália, desde 2023, psiquiatras autorizados podem prescrevê-la para depressão resistente.",
          "mimeType": "text/markdown",
          "digest": "sha256:10b7bc7dc3421a0067025deaf9488d5a340fc8f16410bc779e7e05ad377ed6bc"
        },
        {
          "uri": "smartdrugs://ficha/psilocibina-microdose",
          "name": "psilocibina-microdose",
          "title": "Psilocibina em microdose",
          "description": "Microdose é o uso repetido de quantidades de psilocibina, quase sempre de cogumelos ou trufas, pequenas demais para causar alucinações. Nos ensaios controlados com placebo, os efeitos relatados apareceram sobretudo em quem adivinhou o que estava tomando, sem melhora consistente de humor, bem-estar, criatividade ou cognição, e uma meta-análise achou piora do controle cognitivo. A psilocibina é de uso proscrito no Brasil.",
          "mimeType": "text/markdown",
          "digest": "sha256:eceb84c8d256e0efe63c84afd90cc45eabdaeeb7d369bfafd7d1ac336a28e8b0"
        },
        {
          "uri": "smartdrugs://ficha/pt-141",
          "name": "pt-141",
          "title": "PT-141 (bremelanotida)",
          "description": "Peptídeo cíclico sintético, análogo do hormônio alfa-MSH, que ativa receptores de melanocortina. Nos EUA é aprovado desde 2019 (Vyleesi, injeção subcutânea de 1,75 mg em autoinjetor) só para mulheres na pré-menopausa com transtorno do desejo sexual hipoativo; nos dois ensaios de fase 3 o ganho de desejo sobre o placebo foi estatisticamente significativo, mas pequeno, e o número de relações satisfatórias não mudou. Causa náusea em 40% das usuárias e eleva a pressão arterial por algumas horas; os frascos de \"PT-141\" vendidos para pesquisa não são o produto aprovado.",
          "mimeType": "text/markdown",
          "digest": "sha256:a090b751a075c8f4de759a68c9271c963b77fc7e3e7ae07bbfce28ba783b96fa"
        },
        {
          "uri": "smartdrugs://ficha/reishi",
          "name": "reishi",
          "title": "Reishi (Ganoderma lucidum)",
          "description": "Cogumelo usado na medicina tradicional chinesa, vendido como extrato do corpo de frutificação, pó de esporos ou fração de polissacarídeos; os compostos característicos são polissacarídeos e triterpenos (ácidos ganodéricos). As duas revisões Cochrane concluem que não há evidência suficiente para usá-lo como tratamento de câncer nem para fatores de risco cardiovascular. Ensaios isolados e pequenos viram menos fadiga em neurastenia e melhor condicionamento em universitárias. O LiverTox registra raros casos de lesão hepática aguda atribuídos ao reishi, na maioria mal documentados.",
          "mimeType": "text/markdown",
          "digest": "sha256:6160f3cdab0181e5dac2f0b885137032a812d43267b7349297cdd6988ef4f3d0"
        },
        {
          "uri": "smartdrugs://ficha/retatrutida",
          "name": "retatrutida",
          "title": "Retatrutida",
          "description": "Peptídeo experimental da Eli Lilly, injetado sob a pele uma vez por semana, que ativa três receptores hormonais (GIP, GLP-1 e glucagon). Em ensaios de fase 3 de 80 semanas, reduziu o peso em até 25% em adultos com obesidade e melhorou apneia do sono, dor de artrose no joelho e controle do diabetes tipo 2, com efeitos gastrointestinais frequentes. Até outubro de 2026 não tinha registro em nenhum país; o que circula em frascos e canetas fora dos ensaios é produto irregular, alvo de proibições da Anvisa e de alertas da FDA e da MHRA.",
          "mimeType": "text/markdown",
          "digest": "sha256:721c404802a75f6cd3edfb88647aaf42b1ce0e22f7b78c70c940b89c69be17fd"
        },
        {
          "uri": "smartdrugs://ficha/rhodiola-rosea",
          "name": "rhodiola-rosea",
          "title": "Rhodiola rosea",
          "description": "Raiz usada como adaptógeno. Estudos pequenos, vários com o mesmo extrato (SHR-5), sugerem menos fadiga sob estresse e algum efeito em resistência física; o conjunto da evidência é limitado.",
          "mimeType": "text/markdown",
          "digest": "sha256:fbd0bdc0aa0af2d201186247d6754157a5c5c4bcb5ab5117352c11b2837a79d9"
        },
        {
          "uri": "smartdrugs://ficha/schisandra-chinensis",
          "name": "schisandra-chinensis",
          "title": "Schisandra chinensis (limonnik)",
          "description": "Fruto de uma trepadeira do Extremo Oriente, usado como tônico na Rússia, na China e na Coreia; os compostos característicos são lignanas (esquisandrina e parecidas). Na Rússia, a tintura é medicamento sem receita para astenia. Os ensaios modernos com a planta sozinha são coreanos, pequenos e medem força muscular e sintomas da menopausa; o único ensaio de atenção usou uma mistura de três plantas. As lignanas inibem CYP3A e a glicoproteína P: em voluntários, extratos de Schisandra aumentaram muito a exposição a talinolol, midazolam e tacrolimo.",
          "mimeType": "text/markdown",
          "digest": "sha256:a672060a1ca4a127d6b16d523958edbd2d293beab14d908dc4eafc34e1e072b9"
        },
        {
          "uri": "smartdrugs://ficha/selank",
          "name": "selank",
          "title": "Selanque",
          "description": "Heptapeptídeo sintético derivado da tuftsina, registrado na Rússia como ansiolítico em gotas nasais e vendido lá sem receita. Os estudos clínicos são russos, pequenos e abertos, comparando o peptídeo com benzodiazepínicos como medazepam e fenazepam. Uma revisão norte-americana classifica o selanque como droga russa pouco estudada, vendida nos EUA como suplemento alimentar.",
          "mimeType": "text/markdown",
          "digest": "sha256:7b83e20cd477d92a2b9cd5cd6792a6af922d1d7e55d17524b057d867522b0b66"
        },
        {
          "uri": "smartdrugs://ficha/selegilina",
          "name": "selegilina",
          "title": "Selegilina",
          "description": "Inibidor seletivo da MAO-B usado como adjuvante da levodopa na doença de Parkinson e, em adesivo, na depressão maior. Tem interações graves com vários medicamentos.",
          "mimeType": "text/markdown",
          "digest": "sha256:a6e17c887d111523b6629f7f85cbbe44b11d5afea94f01b89d21ac656bd13f38"
        },
        {
          "uri": "smartdrugs://ficha/semax",
          "name": "semax",
          "title": "Semax",
          "description": "Heptapeptídeo sintético análogo do fragmento 4-10 do ACTH, registrado na Rússia como medicamento nootrópico em gotas nasais. Quase toda a evidência clínica vem de estudos russos em AVC isquêmico, pequenos e em sua maioria sem randomização ou cegamento. Não há ensaio clínico de Semax registrado no ClinicalTrials.gov nem estudo clínico publicado em revista de língua inglesa.",
          "mimeType": "text/markdown",
          "digest": "sha256:0d82f9fb50957f0834e45e4bd283a581565af4aa4ff1ddd78fe927ce922bab4d"
        },
        {
          "uri": "smartdrugs://ficha/semente-de-jujuba",
          "name": "semente-de-jujuba",
          "title": "Semente de jujuba (suanzaoren)",
          "description": "Semente da jujuba azeda (Ziziphus jujuba var. spinosa), usada na medicina tradicional chinesa para insônia, quase sempre dentro de fórmulas com outras plantas, como a decocção de suanzaoren. As meta-análises mostram melhora de curto prazo no sono relatado pelos pacientes, mas juntam produtos diferentes, e os ensaios são pequenos e de qualidade variável. A semente sozinha foi testada contra placebo em um estudo de viabilidade australiano com 12 pessoas.",
          "mimeType": "text/markdown",
          "digest": "sha256:86d0373df75bf78c9cb1345e9ed2d6a0fbe8c71efba35eff0d3f9d5a0d432f3f"
        },
        {
          "uri": "smartdrugs://ficha/slu-pp-332",
          "name": "slu-pp-332",
          "title": "SLU-PP-332",
          "description": "Molécula pequena criada em laboratório universitário nos Estados Unidos que ativa os três receptores relacionados ao estrogênio (ERRα, ERRβ e ERRγ) e liga, no músculo, o mesmo programa de genes de uma sessão de exercício aeróbico, por isso chamada de \"mimético do exercício\". Toda a evidência é de camundongos e de células: mais resistência na esteira, menos gordura, melhora da função cardíaca e renal em modelos de doença. Não achei nenhum estudo em humanos nem ensaio clínico registrado, e ela não é absorvida por via oral nos testes em animais. Está proibida no esporte desde a lista da WADA de 2027.",
          "mimeType": "text/markdown",
          "digest": "sha256:23b7e7d7d6fc1725e3a2186f8241c4b608cd1b7168b01552423489b99981f1e2"
        },
        {
          "uri": "smartdrugs://ficha/ss-31",
          "name": "ss-31",
          "title": "SS-31 (elamipretida)",
          "description": "Tetrapeptídeo sintético que se liga à cardiolipina, um lipídio da membrana interna da mitocôndria. Em setembro de 2025 a FDA deu aprovação acelerada à injeção subcutânea (Forzinity) só para melhorar a força muscular na síndrome de Barth, uma doença genética ultrarrara, com base em 12 pacientes e num desfecho intermediário; o ensaio confirmatório ainda está em andamento. Em miopatia mitocondrial primária, insuficiência cardíaca, infarto e degeneração macular seca, os ensaios controlados não atingiram o desfecho principal, e o \"SS-31\" vendido como produto para pesquisa foi classificado pela FDA como droga nova não aprovada.",
          "mimeType": "text/markdown",
          "digest": "sha256:c6f609193ec4df4aef136a40ee361b0e942ba80afcbaac353891f9c1f2dd9308"
        },
        {
          "uri": "smartdrugs://ficha/sulbutiamina",
          "name": "sulbutiamina",
          "title": "Sulbutiamina",
          "description": "Derivado sintético e lipossolúvel da tiamina (vitamina B1), criado no Japão e vendido na França e na Rússia contra astenia. O maior ensaio controlado, em fadiga pós-infecciosa, não mostrou efeito geral; os outros estudos são pequenos ou sem grupo controle. O mecanismo, aumento de derivados da tiamina no cérebro, foi estudado em animais.",
          "mimeType": "text/markdown",
          "digest": "sha256:6196a3708df87e2525b9798346e0161bcdfb15bc404eaacc2a5334eae6fde8d9"
        },
        {
          "uri": "smartdrugs://ficha/taurina",
          "name": "taurina",
          "title": "Taurina",
          "description": "Aminoácido sulfurado presente na dieta e em bebidas energéticas, registrado como medicamento no Japão e na Rússia. Meta-análises de ensaios curtos mostram queda pequena da pressão arterial e ganho modesto em exercícios de resistência; no Japão, a aprovação para a doença mitocondrial MELAS se baseou num ensaio aberto com 10 pacientes.",
          "mimeType": "text/markdown",
          "digest": "sha256:bec57cfed5522de71bed94346922c5d974c2a66936d8e537f2a1199d798badfb"
        },
        {
          "uri": "smartdrugs://ficha/tb-500",
          "name": "tb-500",
          "title": "TB-500 (fragmento 17-23 da timosina beta-4)",
          "description": "O TB-500 é um peptídeo sintético de sete aminoácidos, com um grupo acetil na ponta, copiado de um trecho da proteína timosina beta-4; apesar do marketing, não é a mesma molécula que a timosina beta-4 inteira nem os colírios e injetáveis RGN-259 e RGN-352 dos ensaios clínicos. Em 2026 a FDA afirmou não ter encontrado nenhum dado de uso do TB-500 em seres humanos por qualquer via e propôs não incluí-lo na lista de substâncias permitidas para manipulação. É proibido no esporte pela WADA, não tem registro na Anvisa e é vendido pela internet em frascos \"para pesquisa\", inclusive misturado com BPC-157.",
          "mimeType": "text/markdown",
          "digest": "sha256:5c729bc2e363227cb265b1d747f914f2d5f66cc006ad5db4e89c5418fe7f602e"
        },
        {
          "uri": "smartdrugs://ficha/tcm-e-cetonas",
          "name": "tcm-e-cetonas",
          "title": "TCM e cetonas exógenas",
          "description": "Ficha de grupo: triglicerídeos de cadeia média (TCM, como a tricaprilina, de ácido caprílico C8, e misturas de C8 e C10) e cetonas exógenas (sais e ésteres de beta-hidroxibutirato e o 1,3-butanodiol). Todos elevam os corpos cetônicos no sangue, um combustível alternativo para o cérebro. Meta-análises acharam efeito cognitivo pequeno em comprometimento cognitivo leve, Alzheimer e pessoas saudáveis, mas o maior ensaio em Alzheimer foi nulo e os efeitos gastrointestinais são comuns.",
          "mimeType": "text/markdown",
          "digest": "sha256:d39c836dc1286aa5d5153e130197025ef5cc4534479a0ffb6f6811ef1682343e"
        },
        {
          "uri": "smartdrugs://ficha/teacrina",
          "name": "teacrina",
          "title": "Teacrina",
          "description": "A teacrina é um alcaloide purínico parecido com a cafeína, encontrado no chá kucha e em algumas espécies de café, vendido como suplemento (TeaCrine). Estudos pequenos em humanos relatam mais sensação de energia e menos lapsos de atenção, mas outros não viram efeito na cognição nem no desempenho físico. A maioria dos estudos tem menos de 25 participantes, e ao menos um foi financiado pela empresa que vende o produto.",
          "mimeType": "text/markdown",
          "digest": "sha256:070a63197d195203bec9f23c64e446939ae167c4df524a908f53fbb69605efcd"
        },
