      "serverInfo": {
        "name": "clipkaboom",
        "title": "ClipKaboom",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "ClipKaboom is a library of short reaction/meme video clips. Use semantic_search for descriptive intents ('awkward shrug', 'crowd cheering'), search_clips for exact quotes, shows or tags, trending_clips for what's popular. When you show clips to the user, render each as a clickable thumbnail, [![<title>](<thumb_url>)](<page_url>), followed by the title and duration; page_url plays the clip. preview_url is the public watermarked MP4 preview. Pass include_thumbnails: true when you need to see the frames yourself to pick. Call get_download_url only once a clip is chosen: it returns the best file the user's plan allows (watermarked 480p SD on free, clean HD/4K on Creator) and counts as a download.",
      "tools": [
        {
          "name": "get_clip",
          "title": "Get clip details",
          "description": "Full details for one clip: transcript, description, typical uses, mood, downloads.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Clip id (the `id` field of a search result).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e57f4c7f47904b52667bf9b656615dd65feb5bf85cfe6f9fe3e63b5ee12a9030"
        },
        {
          "name": "get_download_url",
          "title": "Get download link",
          "description": "Download link for a chosen clip. Free: the watermarked 480p SD MP4. Creator/Team: the clean, un-watermarked HD or 4K MP4 (4K falls back to HD when the source is lower-res), expiring in 10 minutes. Omit `quality` for the best the plan allows. Each call counts as a download: call it only for clips the user wants.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Clip id (the `id` field of a search result).",
                "type": "string"
              },
              "quality": {
                "description": "sd = watermarked 480p (every plan); hd/4k = clean (Creator/Team). Default: the best allowed.",
                "enum": ["sd", "hd", "4k"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:85dd8c93a2a74b3445b443eff80502dbe918887a68808e7400fbfecced712011"
        },
        {
          "name": "search_clips",
          "title": "Search clips",
          "description": "Keyword search over clip quotes, shows, tags and transcripts (typo-tolerant). Best for exact lines, show/movie names or tags. Omit `query` to browse a category.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["meme", "sfx", "reactions", "funny", "anime", "movies", "omg"],
                "type": "string"
              },
              "cursor": {
                "description": "`next_cursor` from a previous page.",
                "type": "string"
              },
              "include_thumbnails": {
                "default": false,
                "description": "Also attach the first 4 results' thumbnails as images, so you can see the frames before picking (costs extra tokens).",
                "type": "boolean"
              },
              "length": {
                "description": "Clip length bucket: short (<~3s), medium, long.",
                "enum": ["short", "medium", "long"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. a quote.",
                "type": "string"
              },
              "show": {
                "description": "Exact source show/movie filter.",
                "type": "string"
              },
              "tag": {
                "description": "Exact tag filter.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
