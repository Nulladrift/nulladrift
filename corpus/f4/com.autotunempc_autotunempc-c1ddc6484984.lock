                                "additionalProperties": false,
                                "description": "At most eight circles. Their four numbers each sit outside ``np <= 8``.",
                                "properties": {
                                  "position": {
                                    "description": "Two distinct state indexes for the circle plane. Example: [0, 1].",
                                    "items": {
                                      "type": "integer"
                                    },
                                    "maxItems": 2,
                                    "minItems": 2,
                                    "type": "array"
                                  },
                                  "slots": {
                                    "description": "Circle slots. Length 1 to 8. Each is cx, cy, r, active.",
                                    "items": {
                                      "additionalProperties": false,
                                      "description": "One fixed circle. ``active`` is 0 or 1 and is not part of caller ``p``.",
                                      "properties": {
                                        "active": {
                                          "description": "1 keeps the circle. 0 drops the row. No other value is accepted.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cx": {
                                          "description": "Center along the first position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
