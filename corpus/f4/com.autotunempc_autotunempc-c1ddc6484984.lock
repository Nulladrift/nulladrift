        {
          "name": "start_autotune_job",
          "title": "Autotune weights",
          "description": "Paid at $1.50. Call free validate_problem and free simulate first.\n\nCall this when manual Q, R, Rd, and Qf oscillate or miss the target.\nThen poll ``get_autotune_job``.\n\nThe tuner needs discrete or continuous linear matrices A and B, one of\ndouble_integrator, thermal_rc_zone, soil_moisture_cascade, cart_pendulum,\nunicycle_kinematics, gravity_tank, icr_skid_steer, and ackermann, or a kind\nexpression plant with one allowlisted scalar expression per state row.\nExpressions outside that allowlist are rejected. Optional h rows and fixed\nobstacle slots, path-frame residuals, and zone bands are accepted.\n\nCall this when the weights are unknown and you can afford a closed-loop\nstudy with plant mismatch. Optuna tunes Q, R, Rd, and Qf on the single\nscenario in the request and reports overshoot and settling time. There is\nno scenario bank and no never-worse check: the result is the best trial of\nthat study, not a comparison with weights you already have. It is an alternative to manual PID or\nhand-tuned MPC. The reply is a ``job_id``. When payment\nenforcement is on it also includes a ``job_token`` for ``get_autotune_job``.\nIt does not contain the weights. Poll until ``status`` is ``complete`` or\n``failed``. The finished result's ``Q``, ``R``, ``Rd``, and ``Qf`` are the\nphysical weights. ``normalized_Q`` and its siblings are the unitless search box.\n\nPayment settles when the job is accepted onto the queue, not when the study\nfinishes. This is POST /v1/autotune at $1.50. Send header X-API-Key when a\n$15 pack still has an autotune credit. With no key, or when those credits\nare gone, the call is HTTP 402 and an agent pays with x402. A full queue is HTTP 429 and is not charged. The template study uses sampler seed 7. The study itself stops\nat ``timeout_seconds``. A process restart marks leftover ``running`` rows\n``failed`` with ``interrupted_by_restart`` instead of deleting a paid job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Paid at $1.50. Call free validate_problem and free simulate first. Call this when the weights oscillate or miss the target. Send X-API-Key or pay the HTTP 402 with x402 on Base USDC. Poll get_autotune_job with the returned job_id.",
                "properties": {
                  "constraints": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Allowlisted rows ``h(x, u, p) <= 0`` and fixed obstacle slots.\n\nSoft rows use one slack per node. ``hard`` true removes those slacks.\nA linear plant with any row here uses the nonlinear solver. The linear-only solver option is rejected.",
                        "properties": {
                          "h": {
                            "description": "Scalar rows, each h(x, u, p) <= 0. At most 8. Symbols are x[i], u[i], p[i], and pi. Same length, depth, and node caps as expression dynamics.",
                            "items": {
                              "type": "string"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "hard": {
                            "default": false,
                            "description": "True enforces the rows with no slack. Default false.",
                            "type": "boolean"
                          },
                          "obstacles": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "At most eight circles. Their four numbers each sit outside ``np <= 8``.",
                                "properties": {
                                  "position": {
                                    "description": "Two distinct state indexes for the circle plane. Example: [0, 1].",
                                    "items": {
                                      "type": "integer"
                                    },
                                    "maxItems": 2,
                                    "minItems": 2,
                                    "type": "array"
                                  },
                                  "slots": {
                                    "description": "Circle slots. Length 1 to 8. Each is cx, cy, r, active.",
                                    "items": {
                                      "additionalProperties": false,
                                      "description": "One fixed circle. ``active`` is 0 or 1 and is not part of caller ``p``.",
                                      "properties": {
                                        "active": {
                                          "description": "1 keeps the circle. 0 drops the row. No other value is accepted.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cx": {
                                          "description": "Center along the first position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cy": {
                                          "description": "Center along the second position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "r": {
                                          "description": "Radius. Must be >= 0.",
                                          "maximum": 1000000000000,
                                          "minimum": 0,
                                          "type": "number"
                                        },
                                        "vx": {
                                          "default": 0,
                                          "description": "Constant velocity along the first position index. Omit for 0.",
                                          "type": "number"
                                        },
                                        "vy": {
                                          "default": 0,
                                          "description": "Constant velocity along the second position index. Omit for 0.",
                                          "type": "number"
                                        },
                                        "vz": {
                                          "default": 0,
                                          "description": "Constant vertical velocity. Omit for 0. Planar circles ignore it.",
                                          "type": "number"
                                        }
                                      },
                                      "required": ["active", "cx", "cy", "r"],
                                      "type": "object"
                                    },
                                    "maxItems": 8,
                                    "minItems": 1,
                                    "type": "array"
                                  }
                                },
                                "required": ["position", "slots"],
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Fixed circles. Omit for none. The row is active * (r^2 - squared distance) <= 0."
                          },
                          "p": {
                            "description": "Caller parameters for h, length 0 to 8. On an expression plant, omit this to use the plant p. Obstacle slots do not use this vector and do not count toward the cap.",
