                              "type": "number"
                            },
                            "description": "Template knobs, one number per required key. double_integrator and unicycle_kinematics: dt > 0 (seconds). thermal_rc_zone: dt > 0, capacity > 0, time_constant > 0, and ambient. soil_moisture_cascade: dt > 0, capacity > 0, tau_1 > 0, tau_2 > 0, tau_3 > 0, k_12 >= 0, k_23 >= 0. gravity_tank: dt > 0, discharge > 0, inflow_gain > 0. cart_pendulum: dt, cart_mass, pole_mass, friction, inertia, gravity, and length, each > 0. icr_skid_steer: dt > 0 and slip, a signed length with abs(slip) <= 10. Body-frame lateral velocity equals slip * yaw_rate. If x_icr is the forward coordinate of the instantaneous center, positive ahead of the reference point, slip = -x_icr. ackermann: dt > 0 and wheelbase > 0. The steer component of u_min and u_max must lie inside ±1.2 rad. quadrotor_3d: dt from 0.02 to 0.05 s (20–50 Hz outer loop), gravity > 0, and drag >= 0. Inputs are roll, pitch, and thrust acceleration. Tilt bounds stay inside ±0.45 rad. Thrust bounds stay inside 0.4 g to 2 g. Optional attitude_tau_s > 0 adds a first-order roll/pitch lag, a yaw state, and a yaw-rate command. Omit it, or send 0, and the 6-state outer loop is unchanged. thermal_valve_process: dt > 0, rangeability > 1, flow_max > 0, tau_valve > 0, capacity > 0, loss >= 0, ambient, and heater_gain > 0. Valve flow is R^(valve_pos - 1). marine_usv: dt > 0, mass > 0, inertia > 0. Added mass and quadratic drag coefficients are >= 0. anti_sway_crane: dt > 0, cable_length > 0, cart_mass > 0, load_mass > 0, gravity > 0, damping >= 0. The input is cart force. Sway angle limits are soft state bounds. process_valve: dt > 0, capacitance > 0, tau > 0, cv > 0, and supply > 0. quadrotor: dt > 0, mass > 0, gravity > 0, and attitude_tau > 0. Unknown keys are rejected.",
                            "type": "object"
                          },
