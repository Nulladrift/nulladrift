        {
          "name": "autotune_embedded_controller_with_c_codegen",
          "title": "Autotune an embedded controller",
          "description": "Tune a linear plant and write a zero-heap C99 bundle.\n\nThe reply's ``codegen`` object lists ``mpc_bundle.h`` and ``mpc_bundle.c``\nplus ``usage_example_c`` and ``controller_kind``. A linear plant is a\ncondensed QP (``linear_qp``). A nonlinear plant, including differential\ndrive, is a linearized iteration (``linearized_rti``): one Jacobian of ``f``\nat the current ``(x, u, d)``, then projected-gradient steps. That is not a full\nnonlinear SQP and not acados SQP-RTI. The exported acados controller is a real SQP;\n``SQP_RTI`` is that backend's one-quadratic-program-per-tick mode. Compile with\n``gcc -O3 -std=c99 -Wall -Wextra -fPIC -shared -lm``. Each control step is\n``mpc_compute_u0`` then, after the plant measurement, ``mpc_observer_update``.\nNeither function allocates on the heap. ``MPC_NX``, ``MPC_NU``, ``MPC_ND``,\nand ``MPC_HORIZON`` in the header are the array sizes.\n\nSame payment as autotune_template: X-API-Key spends 1 autotune credit, and\na missing key or an empty pack is HTTP 402 for x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_trials": {
                "default": 1,
                "description": "Optuna trials before the C99 bundle is written. Default 1. Values below 1 are raised to 1. Paid at $2.00: X-API-Key spends 1 autotune credit, or HTTP 402 is x402 Base USDC. Each call starts a new study and writes a new bundle.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Autotune an embedded controller"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:e2a43b66671c073db6e28292224bec8cefaf32c30120f6ba9753faa3e10a965e"
        },
        {
          "name": "autotune_root_zone_irrigation",
          "title": "Autotune root-zone irrigation",
          "description": "Tune valve weights for the three-layer root-zone irrigation template.\n\nSame payment as autotune_template: X-API-Key spends 1 autotune credit, and\na missing key or an empty pack is HTTP 402 for x402. The default study is\nphysics-v1. Pass study_version published to run the older scenario.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_trials": {
                "default": 20,
                "description": "Optuna trials for the root-zone irrigation plant. Default 20. Values below 1 are raised to 1. Paid at $2.00: X-API-Key spends 1 autotune credit, or HTTP 402 is x402 Base USDC. Each call starts a new study.",
                "type": "integer"
              },
              "study_version": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
