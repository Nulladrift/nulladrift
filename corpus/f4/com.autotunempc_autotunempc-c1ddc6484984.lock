                            "enum": ["double_integrator", "thermal_rc_zone", "soil_moisture_cascade", "unicycle_kinematics", "gravity_tank", "cart_pendulum", "icr_skid_steer", "ackermann", "quadrotor_3d", "thermal_valve_process", "marine_usv", "anti_sway_crane", "process_valve", "quadrotor"],
