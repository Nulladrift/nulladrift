                          "N": {
                            "minimum": 1,
                            "type": "integer"
                          },
                          "dt": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "du_max": {
                            "anyOf": [
                              {
                                "items": {
                                  "type": "number"
                                },
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null
                          },
                          "du_min": {
                            "anyOf": [
                              {
                                "items": {
                                  "type": "number"
                                },
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null
                          },
                          "kind": {
                            "const": "linear",
                            "default": "linear",
                            "type": "string"
                          },
                          "time_mode": {
                            "default": "discrete",
                            "enum": ["discrete", "continuous"],
                            "type": "string"
                          },
                          "u_max": {
                            "anyOf": [
                              {
                                "items": {
                                  "type": "number"
                                },
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null
                          },
                          "u_min": {
