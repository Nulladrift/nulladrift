        {
          "name": "autotune_template",
          "title": "Autotune Template",
          "description": "Tune differential_drive, battery_peak_shaving, or root_zone_irrigation.\n\nThis is POST /v1/templates/autotune at $2.00. The name is differential_drive,\nbattery_peak_shaving, or root_zone_irrigation. The reply returns tuned\nQ, R, Rd, and Qf. Send name and max_trials.\nSend header X-API-Key when a $29 pack still has autotune credits. One call\nspends 2 of those credits. With no key, or when the credits are gone, the\ncall is HTTP 402 and an agent pays with x402. The reply returns the tuned\nweights for that template. Payment uses the same gate as the HTTP route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "max_trials": {
                    "default": 20,
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "name": {
                    "enum": ["root_zone_irrigation", "battery_peak_shaving", "differential_drive"],
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:ebe9daabc4ed3e433d023350e313bfe3be03fc8e7ba6c0706443766088b2afba"
        },
        {
          "name": "get_autotune_job",
          "title": "Get Autotune Job",
          "description": "Read one autotune job started by ``start_autotune_job``.\n\n``status`` is ``running``, ``complete``, or ``failed``. On ``complete``,\n``result`` holds the Pareto-best weights, overshoot, settling time, RMSE,\nand solve time. Poll again while it is ``running``. When payment enforcement\nis on, pass the ``job_token`` from the start call or the ``X-Job-Token``\nheader. A failed job reports ``autotune_failed``.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "job_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:769aa9dfd4d89d45ae8b0d5cdc2d81d3a3e68562f06a4aae6e9aff274e0aef42"
        },
        {
          "name": "identify_discrete_plant",
          "title": "Identify Discrete Plant",
          "description": "Fit a discrete linear A, B, and dt from logged (t, u, y) samples.\n\nThis tool stays free when payment enforcement is on. It does not call\nIPOPT. Pass the returned matrices to ``solve_mpc`` as a linear system.\nSend 4 to 2000 samples. Each ``y`` has length 1..24 and each ``u`` has\nlength 1..12, the same widths on every row, all finite, with strictly\nincreasing timestamps. Anything else is rejected before the fit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Logged ``(t, u, y)`` samples for a discrete linear fit. The route stays free.\n\nFour to 2000 rows. Every ``y`` has length 1..24 and every ``u`` has length\n1..12, and those widths do not change from row to row. Timestamps are finite\nand strictly increasing. Those checks run before any numeric fit.",
                "properties": {
                  "samples": {
                    "items": {
                      "additionalProperties": false,
                      "description": "One logged sample. ``u`` and ``y`` are scalars or vectors.",
                      "properties": {
                        "t": {
                          "type": "number"
                        },
                        "u": {
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 12,
                          "minItems": 1,
                          "type": "array"
                        },
                        "y": {
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 24,
                          "minItems": 1,
                          "type": "array"
                        }
                      },
                      "required": ["t", "u", "y"],
                      "type": "object"
                    },
                    "maxItems": 2000,
                    "minItems": 4,
                    "type": "array"
                  }
                },
                "required": ["samples"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3d1483c8070e5d62b741a6a4d9274df7ee2d56b755637d591d77d99bdd49b5fb"
        },
