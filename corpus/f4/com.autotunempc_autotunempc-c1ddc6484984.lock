          "digest": "sha256:8d6c89c9ad42b2b6612fb95458ac2ac53af5717fb6d5f2eeece89c92d140a8dc"
        },
        {
          "name": "get_autotune_job",
          "title": "Read an autotune job",
          "description": "Read one autotune job started by ``start_autotune_job``.\n\n``status`` is ``running``, ``complete``, or ``failed``. On ``complete``,\n``result`` holds the Pareto-best weights, overshoot, settling time, RMSE,\nand solve time. ``pareto_profiles`` names up to three points already evaluated\n(tight tracking, balanced, smooth) and ``pareto_points`` is the plot cloud.\nThe top-level ``Q``, ``R``, ``Rd``, and ``Qf`` stay the study winner.\nPoll again while it is ``running``. When payment enforcement\nis on, pass the ``job_token`` from the start call or the ``X-Job-Token``\nheader. A failed job reports ``autotune_failed``.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job id returned by start_autotune_job.",
                "type": "string"
              },
              "job_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Token returned with the job when payment enforcement is on. Omit it when the X-Job-Token header carries the same token. This poll is free and does not spend a credit."
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an autotune job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:616a666dd75d9cc2ba3eb4deee63d632eb7f6309957c081247a7fe6bda0b65fe"
        },
        {
          "name": "identify_discrete_plant",
          "title": "Identify a discrete plant",
          "description": "Fit a discrete linear A, B, and dt from logged (t, u, y) samples.\n\nThis tool stays free when payment enforcement is on. It does not call\nIPOPT. Pass the returned matrices to ``solve_mpc`` as a linear system.\nSend 4 to 2000 samples. Each ``y`` has length 1..24 and each ``u`` has\nlength 1..12, the same widths on every row, all finite, with strictly\nincreasing timestamps. Anything else is rejected before the fit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Logged (t, u, y) samples for a free discrete linear fit. No X-API-Key and no x402 charge. Pass A, B, and dt to solve_mpc after a free validate_problem.",
                "properties": {
                  "samples": {
                    "description": "Logged (t, u, y) rows. Length 4 to 2000. This fit is free: no X-API-Key and no x402 charge.",
                    "items": {
                      "additionalProperties": false,
                      "description": "One logged sample. ``u`` and ``y`` are scalars or vectors.",
                      "properties": {
                        "t": {
                          "description": "Sample time. Must be finite, and strictly increasing from row to row. Use one time unit for the whole log.",
                          "type": "number"
                        },
                        "u": {
                          "description": "Input sample, length 1 to 12. A scalar is wrapped as a one-element list. Every row uses the same length.",
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 12,
                          "minItems": 1,
                          "type": "array"
                        },
                        "y": {
                          "description": "Output sample, length 1 to 24. A scalar is wrapped as a one-element list. Every row uses the same length.",
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 24,
                          "minItems": 1,
                          "type": "array"
                        }
                      },
                      "required": ["t", "u", "y"],
                      "type": "object"
                    },
                    "maxItems": 2000,
                    "minItems": 4,
                    "type": "array"
                  }
                },
                "required": ["samples"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Identify a discrete plant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:46dc9ae96b5444e917931dfc2e7a026ecad084d19e3fa84b46c3700378c0bd6b"
        },
        {
          "name": "reset_warm_start",
          "title": "Reset warm start",
          "description": "Clear one session's shifted primal and dual.\n\nNext ``solve_mpc`` / ``POST /v1/solve`` with this ``session_id`` is cold.\nThe compiled solver stays. Stateless calls omit ``session_id`` and already\nclear warm-start memory, so they do not use this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session id whose warm-start seed to drop. Required, and at most 128 characters. Free: it does not spend a credit. The compiled solver stays. The next solve_mpc with this id is a cold start. Clearing an unknown id changes nothing.",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Reset warm start"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:563a191c8e00703d568ff1a3d87d3c25038869b9dc9babd302d4bc541cc2cffb"
        },
        {
          "name": "simulate",
          "title": "Simulate a closed loop",
          "description": "Free closed-loop tracking check. Call validate_problem first.\n\nThis is POST /v1/simulate. It stays free. The rollout shows whether the\ncurrent weights track the reference. Call start_autotune_job at $1.50 when\nthe motion oscillates or misses the target.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Free closed-loop rollout. No X-API-Key and no x402 charge. Call validate_problem first. Call start_autotune_job at $1.50 when the rollout oscillates or misses the target.",
                "properties": {
                  "Q": {
                    "description": "Stage state weight, shape nx by nx.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Qf": {
                    "description": "Terminal state weight, shape nx by nx.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "R": {
                    "description": "Input weight, shape nu by nu.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Rd": {
                    "description": "Slew weight on delta-u, shape nu by nu.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "U_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Input reference over the horizon, shape N by nu. Omit for the equilibrium input."
                  },
                  "X_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "State reference over the horizon, shape (N+1) by nx. Omit to hold x_ref."
                  },
                  "actuator_delay_ms": {
                    "anyOf": [
                      {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional delay in milliseconds. Used only when actuator_delay_steps is 0. Converted with round(ms / (dt * 1000)) and clamped to 0..5."
                  },
                  "actuator_delay_steps": {
                    "default": 0,
                    "description": "Commands already in flight before the one being solved. 0 leaves the solve unchanged. Values outside 0..5 are clamped.",
                    "type": "integer"
                  },
                  "cmd_vel_frame_id": {
                    "default": "base_link",
                    "description": "frame_id on TwistStamped exports. Default base_link. Letters, digits, underscore, slash, and hyphen only.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "codegen": {
                    "default": false,
                    "description": "Ask for the compiled oracle. Anonymous callers are forced to false so this route cannot invoke gcc. Authenticated callers may leave it true.",
                    "type": "boolean"
                  },
                  "constraints": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Allowlisted rows ``h(x, u, p) <= 0`` and fixed obstacle slots.\n\nSoft rows use one slack per node. ``hard`` true removes those slacks.\nA linear plant with any row here uses the nonlinear solver. The linear-only solver option is rejected.",
                        "properties": {
                          "h": {
                            "description": "Scalar rows, each h(x, u, p) <= 0. At most 8. Symbols are x[i], u[i], p[i], and pi. Same length, depth, and node caps as expression dynamics.",
                            "items": {
                              "type": "string"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "hard": {
                            "default": false,
                            "description": "True enforces the rows with no slack. Default false.",
                            "type": "boolean"
                          },
                          "obstacles": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "At most eight circles. Their four numbers each sit outside ``np <= 8``.",
                                "properties": {
                                  "position": {
                                    "description": "Two distinct state indexes for the circle plane. Example: [0, 1].",
                                    "items": {
                                      "type": "integer"
                                    },
                                    "maxItems": 2,
                                    "minItems": 2,
                                    "type": "array"
                                  },
                                  "slots": {
                                    "description": "Circle slots. Length 1 to 8. Each is cx, cy, r, active.",
                                    "items": {
                                      "additionalProperties": false,
                                      "description": "One fixed circle. ``active`` is 0 or 1 and is not part of caller ``p``.",
                                      "properties": {
                                        "active": {
                                          "description": "1 keeps the circle. 0 drops the row. No other value is accepted.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cx": {
                                          "description": "Center along the first position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cy": {
                                          "description": "Center along the second position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "r": {
                                          "description": "Radius. Must be >= 0.",
                                          "maximum": 1000000000000,
                                          "minimum": 0,
                                          "type": "number"
                                        },
                                        "vx": {
                                          "default": 0,
                                          "description": "Constant velocity along the first position index. Omit for 0.",
                                          "type": "number"
                                        },
                                        "vy": {
                                          "default": 0,
                                          "description": "Constant velocity along the second position index. Omit for 0.",
                                          "type": "number"
                                        },
                                        "vz": {
                                          "default": 0,
                                          "description": "Constant vertical velocity. Omit for 0. Planar circles ignore it.",
                                          "type": "number"
                                        }
                                      },
                                      "required": ["active", "cx", "cy", "r"],
                                      "type": "object"
                                    },
                                    "maxItems": 8,
                                    "minItems": 1,
                                    "type": "array"
                                  }
                                },
                                "required": ["position", "slots"],
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Fixed circles. Omit for none. The row is active * (r^2 - squared distance) <= 0."
                          },
                          "p": {
                            "description": "Caller parameters for h, length 0 to 8. On an expression plant, omit this to use the plant p. Obstacle slots do not use this vector and do not count toward the cap.",
                            "items": {
                              "maximum": 1000000000000,
                              "minimum": -1000000000000,
                              "type": "number"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "slack_l1": {
                            "anyOf": [
                              {
                                "maximum": 1000000000000,
                                "minimum": 0,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "L1 weight on each inequality slack. Omit for 1000. Ignored when hard is true."
                          },
                          "slack_l2": {
                            "anyOf": [
                              {
                                "maximum": 1000000000000,
                                "minimum": 0,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "L2 weight on each inequality slack. Omit for 100. Ignored when hard is true."
                          }
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional h(x, u, p) <= 0 rows and fixed obstacle slots. Omit for none. Needs the nonlinear solver. The linear-only solver option is rejected."
                  },
                  "corridor_half_width": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 100,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional half-width, in meters, of a soft corridor around the reference heading. Omit to add no corridor slacks. Nodes k = 1..N stay within this lateral distance, with a non-negative slack so a start outside the tube stays feasible."
                  },
                  "costs": {
                    "anyOf": [
                      {
