        {
          "name": "autotune_battery_peak_shaving",
          "title": "Autotune battery peak shaving",
          "description": "Tune charge power weights for the battery peak-shaving template.\n\nSame payment as autotune_template: X-API-Key spends 1 autotune credit, and\na missing key or an empty pack is HTTP 402 for x402.",
