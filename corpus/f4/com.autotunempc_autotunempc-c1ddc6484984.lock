        },
        {
          "name": "autotune_template",
          "title": "Autotune a template",
          "description": "Tune differential_drive, battery_peak_shaving, or root_zone_irrigation.\n\nThis is POST /v1/templates/autotune at $2.00. The name is differential_drive,\nbattery_peak_shaving, or root_zone_irrigation. The reply returns tuned\nQ, R, Rd, and Qf. Send name and max_trials.\nSend header X-API-Key when a $29 pack still has autotune credits. One call\nspends 2 of those credits. With no key, or when the credits are gone, the\ncall is HTTP 402 and an agent pays with x402. The reply returns the tuned\nweights for that template. Payment uses the same gate as the HTTP route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Paid template tune at $2.00 for differential_drive, battery_peak_shaving, or root_zone_irrigation. Send X-API-Key (spends 2 autotune credits) or pay HTTP 402 with x402 on Base USDC. Validate a custom plant free first; these three names are built in. Each call starts a new study.",
                "properties": {
                  "max_trials": {
                    "default": 20,
                    "description": "Optuna trials for that plant. Default 20, must be >= 1 and <= 30.",
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "name": {
                    "description": "Built-in plant: root_zone_irrigation, battery_peak_shaving, or differential_drive.",
                    "enum": ["root_zone_irrigation", "battery_peak_shaving", "differential_drive"],
                    "type": "string"
                  },
                  "study_version": {
                    "anyOf": [
                      {
                        "enum": ["published", "physics-v1"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Irrigation only. Omit for physics-v1: start [0.17, 0.22, 0.22], comfort reference, horizon 9. published keeps the older start-on-reference horizon 24 scenario."
                  }
                },
                "required": ["name"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Autotune a template"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
