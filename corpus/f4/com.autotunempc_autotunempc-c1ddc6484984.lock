        },
        {
          "name": "get_autotune_job",
          "title": "Read an autotune job",
          "description": "Read one autotune job started by ``start_autotune_job``.\n\n``status`` is ``running``, ``complete``, or ``failed``. On ``complete``,\n``result`` holds the Pareto-best weights, overshoot, settling time, RMSE,\nand solve time. Poll again while it is ``running``. When payment enforcement\nis on, pass the ``job_token`` from the start call or the ``X-Job-Token``\nheader. A failed job reports ``autotune_failed``.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job id returned by start_autotune_job.",
                "type": "string"
              },
              "job_token": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Token returned with the job when payment enforcement is on. Omit it when the X-Job-Token header carries the same token. This poll is free and does not spend a credit."
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an autotune job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a84e10e281c327d06c97a349cadae62aa12c74535f090229e4db32a395b175fe"
        },
        {
          "name": "identify_discrete_plant",
          "title": "Identify a discrete plant",
          "description": "Fit a discrete linear A, B, and dt from logged (t, u, y) samples.\n\nThis tool stays free when payment enforcement is on. It does not call\nIPOPT. Pass the returned matrices to ``solve_mpc`` as a linear system.\nSend 4 to 2000 samples. Each ``y`` has length 1..24 and each ``u`` has\nlength 1..12, the same widths on every row, all finite, with strictly\nincreasing timestamps. Anything else is rejected before the fit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Logged (t, u, y) samples for a free discrete linear fit. No X-API-Key and no x402 charge. Pass A, B, and dt to solve_mpc after a free validate_problem.",
                "properties": {
                  "samples": {
                    "description": "Logged (t, u, y) rows. Length 4 to 2000. This fit is free: no X-API-Key and no x402 charge.",
                    "items": {
                      "additionalProperties": false,
                      "description": "One logged sample. ``u`` and ``y`` are scalars or vectors.",
                      "properties": {
                        "t": {
                          "description": "Sample time. Must be finite, and strictly increasing from row to row. Use one time unit for the whole log.",
                          "type": "number"
                        },
                        "u": {
                          "description": "Input sample, length 1 to 12. A scalar is wrapped as a one-element list. Every row uses the same length.",
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 12,
                          "minItems": 1,
                          "type": "array"
                        },
                        "y": {
                          "description": "Output sample, length 1 to 24. A scalar is wrapped as a one-element list. Every row uses the same length.",
                          "items": {
                            "type": "number"
                          },
                          "maxItems": 24,
                          "minItems": 1,
                          "type": "array"
                        }
                      },
                      "required": ["t", "u", "y"],
                      "type": "object"
                    },
                    "maxItems": 2000,
                    "minItems": 4,
                    "type": "array"
                  }
                },
                "required": ["samples"],
                "type": "object"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Identify a discrete plant"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:46dc9ae96b5444e917931dfc2e7a026ecad084d19e3fa84b46c3700378c0bd6b"
        },
        {
          "name": "reset_warm_start",
          "title": "Reset warm start",
          "description": "Clear one session's shifted primal and dual.\n\nNext ``solve_mpc`` / ``POST /v1/solve`` with this ``session_id`` is cold.\nThe compiled solver stays. Stateless calls omit ``session_id`` and already\nclear warm-start memory, so they do not use this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session id whose warm-start seed to drop. Required, and at most 128 characters. Free: it does not spend a credit. The compiled solver stays. The next solve_mpc with this id is a cold start. Clearing an unknown id changes nothing.",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Reset warm start"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:563a191c8e00703d568ff1a3d87d3c25038869b9dc9babd302d4bc541cc2cffb"
        },
        {
          "name": "solve_mpc",
          "title": "Solve MPC",
          "description": "Solve a multi-step constrained MPC problem on the server.\n\nUse this when the horizon has soft state bounds, hard input and slew limits,\nand an offset-free disturbance rejection term. Pass the same ``session_id``\non later calls of one closed loop so the shifted primal and dual warm start\nis restored. Omit ``session_id`` for a single stateless solve.\n\nDo not call this for a one-step linear update you can do locally (a matrix\nmultiply, a threshold, or reading a sensor). Those do not need IPOPT.\nCasADi and IPOPT return u0 and the predicted trajectory for robotics,\nenergy storage, and process control. session_id is the warm start.\n\nThis is POST /v1/solve at $0.02. Send header X-API-Key when a $29 pack still\nhas solve credits. With no key, or when those credits are gone, the call is\nHTTP 402 and an agent pays with x402. There is no second payment path.\n\nSet ``reset_warm_start`` or call the ``reset_warm_start`` tool to drop the\nseed for that session. The compiled solver stays. A reset only clears the\nseed stored for the caller who owns it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Paid constrained solve at $0.02. Send X-API-Key while the pack has solve credits, or pay HTTP 402 with x402 on Base USDC. Validate free first. Autotune is the later step when the weights are unknown.",
                "properties": {
                  "Q": {
                    "description": "Stage state weight, shape nx by nx.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Qf": {
                    "description": "Terminal state weight, shape nx by nx.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "R": {
                    "description": "Input weight, shape nu by nu.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Rd": {
                    "description": "Slew weight on delta-u, shape nu by nu.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "U_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Input reference over the horizon, shape N by nu. Omit for the equilibrium input."
                  },
                  "X_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "State reference over the horizon, shape (N+1) by nx. Omit to hold x_ref."
                  },
                  "constraints": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Allowlisted rows ``h(x, u, p) <= 0`` and fixed obstacle slots.\n\nSoft rows use one slack per node. ``hard`` true removes those slacks.\nA linear plant with any row here uses the nonlinear solver. The linear-only solver option is rejected.",
                        "properties": {
                          "h": {
                            "description": "Scalar rows, each h(x, u, p) <= 0. At most 8. Symbols are x[i], u[i], p[i], and pi. Same length, depth, and node caps as expression dynamics.",
                            "items": {
                              "type": "string"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "hard": {
                            "default": false,
                            "description": "True enforces the rows with no slack. Default false.",
                            "type": "boolean"
                          },
                          "obstacles": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "At most eight circles. Their four numbers each sit outside ``np <= 8``.",
                                "properties": {
                                  "position": {
                                    "description": "Two distinct state indexes for the circle plane. Example: [0, 1].",
                                    "items": {
                                      "type": "integer"
                                    },
                                    "maxItems": 2,
                                    "minItems": 2,
                                    "type": "array"
                                  },
                                  "slots": {
                                    "description": "Circle slots. Length 1 to 8. Each is cx, cy, r, active.",
                                    "items": {
                                      "additionalProperties": false,
                                      "description": "One fixed circle. ``active`` is 0 or 1 and is not part of caller ``p``.",
                                      "properties": {
                                        "active": {
                                          "description": "1 keeps the circle. 0 drops the row. No other value is accepted.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cx": {
                                          "description": "Center along the first position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cy": {
                                          "description": "Center along the second position index, in the plant's state units.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "r": {
                                          "description": "Radius. Must be >= 0.",
                                          "maximum": 1000000000000,
                                          "minimum": 0,
                                          "type": "number"
                                        }
                                      },
                                      "required": ["active", "cx", "cy", "r"],
                                      "type": "object"
                                    },
                                    "maxItems": 8,
                                    "minItems": 1,
                                    "type": "array"
                                  }
                                },
                                "required": ["position", "slots"],
                                "type": "object"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Fixed circles. Omit for none. The row is active * (r^2 - squared distance) <= 0."
                          },
                          "p": {
                            "description": "Caller parameters for h, length 0 to 8. On an expression plant, omit this to use the plant p. Obstacle slots do not use this vector and do not count toward the cap.",
                            "items": {
                              "maximum": 1000000000000,
                              "minimum": -1000000000000,
                              "type": "number"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "slack_l1": {
                            "anyOf": [
                              {
                                "maximum": 1000000000000,
                                "minimum": 0,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "L1 weight on each inequality slack. Omit for 1000. Ignored when hard is true."
                          },
                          "slack_l2": {
                            "anyOf": [
                              {
                                "maximum": 1000000000000,
                                "minimum": 0,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "L2 weight on each inequality slack. Omit for 100. Ignored when hard is true."
                          }
                        },
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional h(x, u, p) <= 0 rows and fixed obstacle slots. Omit for none. Needs the nonlinear solver. The linear-only solver option is rejected."
                  },
                  "costs": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Path-frame and zone residuals. Economic prices stay the linear stage vectors.\n\n``linear_state_cost`` and ``linear_input_cost`` are the economic term. They are\nlinear in the node. Path samples, zone centers, half-widths, and weights are\nparameters of the compiled problem.",
                        "properties": {
                          "path": {
                            "anyOf": [
                              {
                                "items": {
                                  "items": {
                                    "maximum": 1000000000000,
                                    "minimum": -1000000000000,
                                    "type": "number"
                                  },
                                  "type": "array"
                                },
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "One path sample per state node, length N+1. Each sample is along, across, and heading, in the position indexes' units and the heading state's units."
                          },
                          "path_frame": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "Squared path residuals. Heading uses both sin and 1 - cos.",
                                "properties": {
                                  "heading": {
                                    "description": "State index of the heading. Must differ from both position indexes.",
                                    "type": "integer"
                                  },
                                  "heading_weight": {
                                    "default": 1,
                                    "description": "Weight on both squared heading residuals, sin(heading error) and 1 - cos(heading error). Must be >= 0. Default 1. The two residuals share this weight.",
                                    "maximum": 1000000000000,
                                    "minimum": 0,
                                    "type": "number"
                                  },
                                  "lateral_weight": {
                                    "default": 1,
                                    "description": "Weight on the squared cross-track residual. Must be >= 0. Default 1.",
                                    "maximum": 1000000000000,
                                    "minimum": 0,
                                    "type": "number"
                                  },
                                  "longitudinal_weight": {
                                    "default": 1,
