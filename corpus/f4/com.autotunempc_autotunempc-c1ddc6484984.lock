        {
          "name": "start_autotune_job",
          "title": "Autotune weights",
          "description": "Queue an Optuna search for Q, R, Rd, and Qf. Then poll ``get_autotune_job``.\n\nThe tuner needs discrete or continuous linear matrices A and B, one of\ndouble_integrator, thermal_rc_zone, soil_moisture_cascade, cart_pendulum,\nunicycle_kinematics, gravity_tank, icr_skid_steer, and ackermann, or a kind\nexpression plant with one allowlisted scalar expression per state row.\nExpressions outside that allowlist are rejected. Optional h rows and fixed\nobstacle slots, path-frame residuals, and zone bands are accepted.\n\nCall this when the weights are unknown and you can afford a closed-loop\nstudy with plant mismatch. Optuna tunes Q, R, Rd, and Qf on the single\nscenario in the request and reports overshoot and settling time. There is\nno scenario bank and no never-worse check: the result is the best trial of\nthat study, not a comparison with weights you already have. It is an alternative to manual PID or\nhand-tuned MPC. The reply is a ``job_id``. When payment\nenforcement is on it also includes a ``job_token`` for ``get_autotune_job``.\nIt does not contain the weights. Poll until ``status`` is ``complete`` or\n``failed``. The finished result's ``Q``, ``R``, ``Rd``, and ``Qf`` are the\nphysical weights. ``normalized_Q`` and its siblings are the unitless search box.\n\nPayment settles when the job is accepted onto the queue, not when the study\nfinishes. This is POST /v1/autotune at $1.50. Send header X-API-Key when a\n$29 pack still has an autotune credit. With no key, or when those credits\nare gone, the call is HTTP 402 and an agent pays with x402. A full queue is HTTP 429 and is not charged. The template study uses sampler seed 7. The study itself stops\nat ``timeout_seconds``. A process restart marks leftover ``running`` rows\n``failed`` with ``interrupted_by_restart`` instead of deleting a paid job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Paid Optuna study at $1.50. Send X-API-Key while the pack has an autotune credit, or pay HTTP 402 with x402 on Base USDC. Validate the plant free first, then solve, then this job when Q, R, Rd, and Qf are unknown. Each call starts a new job. Poll get_autotune_job with the returned job_id.",
                "properties": {
                  "constraints": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Allowlisted rows ``h(x, u, p) <= 0`` and fixed obstacle slots.\n\nSoft rows use one slack per node. ``hard`` true removes those slacks.\nA linear plant with any row here uses the nonlinear solver. The linear-only solver option is rejected.",
                        "properties": {
                          "h": {
                            "description": "Scalar rows, each h(x, u, p) <= 0. At most 8. Symbols are x[i], u[i], p[i], and pi. Same length, depth, and node caps as expression dynamics.",
