        {
          "name": "solve_mpc",
          "title": "Solve MPC",
          "description": "Solve a multi-step constrained MPC problem on the server.\n\nUse this when the horizon has soft state bounds, hard input and slew limits,\nand an offset-free disturbance rejection term. Pass the same ``session_id``\non later calls of one closed loop so the shifted primal and dual warm start\nis restored. Omit ``session_id`` for a single stateless solve.\n\nDo not call this for a one-step linear update you can do locally (a matrix\nmultiply, a threshold, or reading a sensor). Those do not need IPOPT.\nCasADi and IPOPT return u0 and the predicted trajectory for robotics,\nenergy storage, and process control. session_id is the warm start.\n\nThis is POST /v1/solve at $0.02. Send header X-API-Key when a $15 pack still\nhas solve credits. With no key, or when those credits are gone, the call is\nHTTP 402 and an agent pays with x402. There is no second payment path.\n\nSet ``reset_warm_start`` or call the ``reset_warm_start`` tool to drop the\nseed for that session. The compiled solver stays. A reset only clears the\nseed stored for the caller who owns it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Paid constrained solve at $0.02. Send X-API-Key while the pack has solve credits, or pay HTTP 402 with x402 on Base USDC. Validate free first. Autotune is the later step when the weights are unknown.",
                "properties": {
                  "Q": {
                    "description": "Stage state weight, shape nx by nx.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Qf": {
                    "description": "Terminal state weight, shape nx by nx.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "R": {
                    "description": "Input weight, shape nu by nu.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Rd": {
                    "description": "Slew weight on delta-u, shape nu by nu.",
                    "items": {
                      "items": {
                        "maximum": 1000000000000,
                        "minimum": -1000000000000,
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "U_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Input reference over the horizon, shape N by nu. Omit for the equilibrium input."
                  },
                  "X_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "State reference over the horizon, shape (N+1) by nx. Omit to hold x_ref."
                  },
                  "actuator_delay_ms": {
                    "anyOf": [
                      {
                        "maximum": 5000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Optional delay in milliseconds. Used only when actuator_delay_steps is 0. Converted with round(ms / (dt * 1000)) and clamped to 0..5."
                  },
                  "actuator_delay_steps": {
                    "default": 0,
                    "description": "Commands already in flight before the one being solved. 0 leaves the solve unchanged. Values outside 0..5 are clamped.",
                    "type": "integer"
                  },
                  "cmd_vel_frame_id": {
                    "default": "base_link",
                    "description": "frame_id on TwistStamped exports. Default base_link. Letters, digits, underscore, slash, and hyphen only.",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "constraints": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Allowlisted rows ``h(x, u, p) <= 0`` and fixed obstacle slots.\n\nSoft rows use one slack per node. ``hard`` true removes those slacks.\nA linear plant with any row here uses the nonlinear solver. The linear-only solver option is rejected.",
                        "properties": {
                          "h": {
                            "description": "Scalar rows, each h(x, u, p) <= 0. At most 8. Symbols are x[i], u[i], p[i], and pi. Same length, depth, and node caps as expression dynamics.",
                            "items": {
                              "type": "string"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "hard": {
                            "default": false,
                            "description": "True enforces the rows with no slack. Default false.",
                            "type": "boolean"
                          },
                          "obstacles": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "At most eight circles. Their four numbers each sit outside ``np <= 8``.",
                                "properties": {
                                  "position": {
                                    "description": "Two distinct state indexes for the circle plane. Example: [0, 1].",
                                    "items": {
                                      "type": "integer"
                                    },
                                    "maxItems": 2,
                                    "minItems": 2,
                                    "type": "array"
                                  },
                                  "slots": {
                                    "description": "Circle slots. Length 1 to 8. Each is cx, cy, r, active.",
                                    "items": {
                                      "additionalProperties": false,
