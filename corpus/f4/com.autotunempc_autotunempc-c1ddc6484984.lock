        {
          "name": "autotune_embedded_controller_with_c_codegen",
          "title": "Autotune Embedded Controller With C Codegen",
          "description": "Tune a linear plant and write a zero-heap C99 bundle.\n\nThe reply's ``codegen`` object lists ``mpc_bundle.h`` and ``mpc_bundle.c``\nplus ``usage_example_c`` and ``controller_kind``. A linear plant is a\ncondensed QP (``linear_qp``). A nonlinear plant, including differential\ndrive, is a linearized real-time iteration (``linearized_rti``): Jacobians\nat the current state, then projected-gradient steps. That is not a full\nnonlinear SQP. Compile with\n``gcc -O3 -std=c99 -Wall -Wextra -fPIC -shared -lm``. Each control step is\n``mpc_compute_u0`` then, after the plant measurement, ``mpc_observer_update``.\nNeither function allocates on the heap. ``MPC_NX``, ``MPC_NU``, ``MPC_ND``,\nand ``MPC_HORIZON`` in the header are the array sizes.\n\nSame payment as autotune_template: X-API-Key spends 2 autotune credits, and\na missing key or an empty pack is HTTP 402 for x402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_trials": {
                "default": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:32466a7919b68898c40b77b0d111cfb80c934e5eca02bfb2c42f5100493b9b40"
        },
