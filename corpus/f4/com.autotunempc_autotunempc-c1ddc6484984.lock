        {
          "name": "validate_problem",
          "title": "Validate a problem",
          "description": "Check dimensions, bounds, and linear controllability before a solve.\n\nThis is POST /v1/validate and stays free when payment enforcement is on.\nIt does not use X-API-Key and it does not return HTTP 402. Call it before\nsolve_mpc when you want the plant rejected without spending a credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "description": "Free plant check. No X-API-Key and no x402 charge. Call this before the paid solve_mpc, and before autotune.",
                "properties": {
                  "Q": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Stage state weight, shape nx by nx. Omit to skip the weight check."
                  },
                  "Qf": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Terminal state weight, shape nx by nx. Omit to skip the weight check."
                  },
                  "R": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Input weight, shape nu by nu. Omit to skip the weight check."
                  },
                  "Rd": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "maximum": 1000000000000,
                            "minimum": -1000000000000,
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Slew weight, shape nu by nu. Omit to skip the weight check."
                  },
                  "constraints": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "description": "Allowlisted rows ``h(x, u, p) <= 0`` and fixed obstacle slots.\n\nSoft rows use one slack per node. ``hard`` true removes those slacks.\nA linear plant with any row here uses the nonlinear solver. The linear-only solver option is rejected.",
                        "properties": {
                          "h": {
                            "description": "Scalar rows, each h(x, u, p) <= 0. At most 8. Symbols are x[i], u[i], p[i], and pi. Same length, depth, and node caps as expression dynamics.",
                            "items": {
                              "type": "string"
                            },
                            "maxItems": 8,
                            "type": "array"
                          },
                          "hard": {
                            "default": false,
                            "description": "True enforces the rows with no slack. Default false.",
                            "type": "boolean"
                          },
                          "obstacles": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "description": "At most eight circles. Their four numbers each sit outside ``np <= 8``.",
                                "properties": {
                                  "position": {
                                    "description": "Two distinct state indexes for the circle plane. Example: [0, 1].",
                                    "items": {
                                      "type": "integer"
                                    },
                                    "maxItems": 2,
                                    "minItems": 2,
                                    "type": "array"
                                  },
                                  "slots": {
                                    "description": "Circle slots. Length 1 to 8. Each is cx, cy, r, active.",
                                    "items": {
                                      "additionalProperties": false,
                                      "description": "One fixed circle. ``active`` is 0 or 1 and is not part of caller ``p``.",
                                      "properties": {
                                        "active": {
                                          "description": "1 keeps the circle. 0 drops the row. No other value is accepted.",
                                          "maximum": 1000000000000,
                                          "minimum": -1000000000000,
                                          "type": "number"
                                        },
                                        "cx": {
                                          "description": "Center along the first position index, in the plant's state units.",
