        {
          "name": "solve_mpc",
          "title": "Solve Mpc",
          "description": "Solve a multi-step constrained MPC problem on the server.\n\nUse this when the horizon has soft state bounds, hard input and slew limits,\nand an offset-free disturbance rejection term. Pass the same ``session_id``\non later calls of one closed loop so the shifted primal and dual warm start\nis restored. Omit ``session_id`` for a single stateless solve.\n\nDo not call this for a one-step linear update you can do locally (a matrix\nmultiply, a threshold, or reading a sensor). Those do not need IPOPT.\nCasADi and IPOPT return u0 and the predicted trajectory for robotics,\nenergy storage, and process control. session_id is the warm start.\n\nThis is POST /v1/solve at $0.02. Send header X-API-Key when a $29 pack still\nhas solve credits. With no key, or when those credits are gone, the call is\nHTTP 402 and an agent pays with x402. There is no second payment path.\n\nSet ``reset_warm_start`` or call the ``reset_warm_start`` tool to drop the\nseed for that session. The compiled solver stays. A reset only clears the\nseed stored for the caller who owns it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "additionalProperties": false,
                "properties": {
                  "Q": {
                    "items": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Qf": {
                    "items": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "R": {
                    "items": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "Rd": {
                    "items": {
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "type": "array"
                  },
                  "U_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "X_ref": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "d_forecast": {
                    "anyOf": [
                      {
                        "items": {
                          "items": {
                            "type": "number"
                          },
                          "type": "array"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "d_hat": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "number"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "max_iter": {
                    "default": 200,
                    "maximum": 500,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "reset_warm_start": {
                    "default": false,
                    "description": "Drop this session_id's warm-start seed before the solve. The compiled solver stays.",
                    "type": "boolean"
                  },
                  "session_id": {
                    "anyOf": [
                      {
                        "maxLength": 128,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Reuse this id across solve_mpc calls so the shifted primal and dual warm start stays with this closed loop. Omit it for a stateless solve. The seed is stored for this caller only."
                  },
                  "slack_l1": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "slack_l2": {
                    "anyOf": [
                      {
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null
                  },
                  "system": {
                    "oneOf": [
                      {
                        "additionalProperties": false,
                        "description": "Discrete or continuous linear plant.\n\nContinuous ``(A, B, Bd)`` are converted with a matrix exponential / zero-order\nhold at ``dt``. Discrete matrices are used as given. ``Bd`` defaults to ``B``\n(input disturbance) when omitted.",
                        "properties": {
                          "A": {
                            "items": {
                              "items": {
                                "type": "number"
                              },
                              "type": "array"
                            },
                            "type": "array"
                          },
                          "B": {
                            "items": {
                              "items": {
                                "type": "number"
                              },
                              "type": "array"
                            },
                            "type": "array"
                          },
                          "Bd": {
                            "anyOf": [
                              {
                                "items": {
                                  "items": {
                                    "type": "number"
                                  },
                                  "type": "array"
                                },
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null
                          },
                          "C": {
                            "anyOf": [
                              {
                                "items": {
                                  "items": {
                                    "type": "number"
                                  },
                                  "type": "array"
                                },
                                "type": "array"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null
                          },
                          "D": {
                            "anyOf": [
                              {
                                "items": {
                                  "items": {
                                    "type": "number"
