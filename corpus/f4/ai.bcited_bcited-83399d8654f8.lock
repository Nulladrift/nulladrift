        {
          "name": "scan_site",
          "title": "Scan a site for AI-citation readiness",
          "description": "Run b/cited's Site Readiness scan on one public URL: a rule-based audit (not model-judged) of 30+ observable signals across nine categories — indexing, metadata, social cards, structured data, AEO (llms.txt, ai.txt, AI-crawler stance in robots.txt, FAQPage/HowTo/Author schema), international, mobile, security headers, and performance. Returns an A–F grade, a 0–100 score per category, and every check with pass/warn/fail and a detail line. Performance (Core Web Vitals via PageSpeed Insights) is off by default because it adds up to 45 seconds; set include_performance to true to include it. Results are cached for an hour and shared across callers (source: \"cache\"). Private, loopback and .local hosts are rejected.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_performance": {
