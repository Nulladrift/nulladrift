          },
          "digest": "sha256:d9a60734ab7aa88acac800b1742fb9c432c9fba5c21741a28c4497db082e7aa3"
        },
        {
          "name": "search",
          "title": "MetalTakip analiz arşivinde arama",
          "description": "MetalTakip'in kendi yayınladığı Türkçe analiz ve araştırma makalelerinde arama yapar. Yalnız birinci taraf içerik döner; üçüncü taraf haberler kapsam dışıdır.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Arama sorgusu (Türkçe)",
