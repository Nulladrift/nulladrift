          "digest": "sha256:5c4d9a73f0a51e7cb8c8d30f66894218f519c6e752b0026e02a0c65722c64bc0"
        },
        {
          "name": "gunluk_ozet",
          "title": "Günlük piyasa özeti",
          "description": "MetalTakip'in son yayımlanan Türkçe piyasa analizini (başlık, özet, bağlantı; otomatik yayın 21 Ekim 2026'da durdu) ve kendi türetilmiş piyasa göstergelerini döndürür. Kaynak atıflı, kişiselleştirilmemiş bilgi.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
