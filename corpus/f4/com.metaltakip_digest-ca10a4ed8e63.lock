          "description": "MetalTakip tarafından hesaplanan oran ve prim göstergeleri: fiziki altın primi, dijital altın primi, çeyrek altın primi ve resmi aylık fiziki akış serilerinin yıllık değişimleri. Ham üçüncü-taraf verisi içermez.",
