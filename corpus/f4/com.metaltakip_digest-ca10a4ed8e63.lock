      },
      "instructions": "MetalTakip: Türkiye kıymetli maden piyasası için hesaplanmış gösterge ve birinci taraf analiz sunucusu.\nHam fiyat beslemesi değildir; göstergeler türetilmiş oranlardır.\nturev_gostergeler: prim ve oran göstergeleri. gunluk_ozet: en son yayımlanan analiz.\nsearch ve fetch: yalnızca MetalTakip’in kendi yayımladığı makalelerde arama ve tam metin.\nBu sunucu fiyat yönü tahmini, hedef seviye ya da işlem önerisi üretmez.\nYurtiçi primler gerçek bayi kotasyonlarından türetilir ve bağımsız ikinci kaynakla çapraz doğrulanır.",
      "tools": [
        {
          "name": "fetch",
          "title": "MetalTakip makalesini getir",
          "description": "search sonucundaki id ile MetalTakip'in kendi makalesinin tam metnini getirir. Yalnız birinci taraf içerik sunulur.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "search sonucundaki makale id değeri",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": false,
                "properties": {
                  "publishedAt": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "source": {
                    "type": "string"
                  }
                },
                "required": ["publishedAt", "source"],
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
