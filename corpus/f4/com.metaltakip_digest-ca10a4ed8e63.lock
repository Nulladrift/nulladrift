      "instructions": "MetalTakip: Türkiye için geçmiş veri ve birinci taraf analiz sunucusu. Anahtarsız ve salt okunur; çıktı Türkçe.\naltin_yil_ozeti: gram ve Cumhuriyet altınının yıl yıl aylık ortalama fiyatı. asgari_ucret_yili: yılın asgari ücreti, dönemleri ve altın ile dolar karşılığı.\nkur_yili: dolar ve euro kurunun yıl yıl aylık ortalaması. enflasyon_hesapla: bir tutarın iki ay arasındaki enflasyon karşılığı.\nemtia_yili: gümüş, platin ve Brent petrolün yıl yıl aylık ortalama dolar fiyatı ve TL karşılığı.\nulke_altin_yili: Hindistan, Endonezya, Suudi Arabistan ve BAE için uluslararası altın fiyatının yerel para karşılığı; o ülkelerin kuyumcu fiyatı değildir.\nveri_sayfasi: geçmiş veri ailelerinin sayfa adresleri (sayısı verilmeyen kripto ve borsa endeksi aileleri dahil).\nsearch ve fetch: yalnız MetalTakip’in kendi yayımladığı makalelerde arama ve tam metin.\nHer yanıt kaynağını ve ilgili sayfanın adresini taşır. Bu sunucu fiyat yönü tahmini, hedef seviye ya da işlem önerisi üretmez.",
