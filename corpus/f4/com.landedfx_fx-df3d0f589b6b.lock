      },
      "transport": {
        "type": "http",
        "url": "https://api.landedfx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "landedfx",
        "title": "LandedFX",
        "version": "1.0.0",
        "websiteUrl": "https://landedfx.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "LandedFX prices what actually lands when money moves between 25 local currencies and any stablecoin on any chain, across P2P venues (Bybit, Binance), payment rails, chains and swap providers, at the exact size.\n\nAsset notation: a local currency, optionally with its payment rail (\"KES\", \"KES:mpesa\", \"BRL:pix\", \"INR:upi\", \"NGN:bank\"), or a token on a chain (\"USDT:tron\", \"USDC:base\", \"USDC:sol\"). Amounts are decimal strings in units of the asset. allInBps is the total cost against the mid-market rate: lower is better, and it is the number to compare routes by.\n\nNothing here moves funds. P2P legs are priced, not executed. Swap tools return transactions for the user's own wallet to sign; LandedFX never holds keys or money.\n\nMost tools work without an API key. quote_transfer, lock_rate, price_carry and get_usage need one (scripts can instead pay per call over HTTP with x402, USDC on Base): the user sends it as the x-api-key header (or Authorization: Bearer) in their MCP client config. If they have none, they sign in at https://app.landedfx.com/keys and create one free (5,000 calls a month). Use search_docs and read_doc for integration questions.",
      "tools": [
        {
          "name": "get_p2p_ads",
          "title": "P2P ads usable at a size",
          "description": "The P2P ads (Bybit, Binance) that can fill an order of this size in a local currency, after reputation and AI screening, best first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Order size in the local currency",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "code": {
                "description": "Local currency, e.g. \"KES\"",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "rail": {
                "enum": ["mpesa", "pix", "upi", "mobile_money", "wallet", "cash", "card", "balance", "bank", "other"],
                "type": "string"
              },
              "side": {
                "description": "\"ask\": the user buys USDT with local currency. \"bid\": the user sells USDT for local currency.",
                "enum": ["ask", "bid"],
                "type": "string"
              }
            },
            "required": ["amount", "code", "side"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
