        {
          "name": "price_carry",
          "title": "Compare naira rates",
          "description": "Compare ways to earn naira interest rates on dollars (T-bills, hedged and unhedged), with outcomes under different devaluation scenarios. Needs an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amountUsd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "hedgeRatio": {
                "description": "Share hedged, 0 to 1 (default 1)",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "tenorDays": {
                "maximum": 730,
                "minimum": 7,
                "type": "integer"
              },
              "yieldPct": {
                "description": "Override the naira yield, % a year",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["amountUsd"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
