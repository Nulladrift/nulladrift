        },
        {
          "name": "search_docs",
          "title": "Search the LandedFX docs",
          "description": "Search the LandedFX documentation and API reference. Returns the most relevant sections with links. Use for integration questions: auth, notation, errors, guides, endpoints.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
