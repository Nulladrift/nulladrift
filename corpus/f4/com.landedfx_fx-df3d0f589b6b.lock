        },
        {
          "name": "market_overview",
          "title": "Cost of every corridor",
          "description": "The live all-in cost to buy and sell USDT in every covered currency at a standard size, for benchmarking corridors. With `code`, returns that corridor's history instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "A currency for its cost history",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "hours": {
                "description": "History window in hours (default 24)",
                "maximum": 2160,
                "minimum": 1,
                "type": "integer"
              },
              "sizeUsd": {
                "anyOf": [
                  {
                    "const": 100,
                    "type": "number"
                  },
                  {
                    "const": 1000,
                    "type": "number"
                  },
                  {
                    "const": 10000,
                    "type": "number"
                  }
                ],
                "description": "Order size in USD (default 1000)"
              }
            },
            "type": "object"
          },
