        },
        {
          "name": "quote_swap",
          "title": "Swap a stablecoin across chains",
          "description": "Best of Relay and NEAR Intents for a token-to-token swap, e.g. USDT:tron → USDC:base. With `executable: true` and the user's addresses, also returns the transaction or deposit address to execute it from the user's own wallet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount of `from`",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "depositOnly": {
                "description": "Only routes funded by sending to an address, for senders that cannot sign, like exchange withdrawals",
                "type": "boolean"
              },
              "executable": {
                "type": "boolean"
              },
              "from": {
                "description": "e.g. \"USDT:tron\"",
                "type": "string"
              },
              "recipient": {
                "description": "Receiver address on the destination chain",
                "type": "string"
              },
              "refundTo": {
                "description": "Refund address on the origin chain",
                "type": "string"
              },
              "slippageBps": {
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "e.g. \"USDC:base\"",
                "type": "string"
              },
              "user": {
                "description": "Sender address on the origin chain",
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7afa6527f88552a1f1241556cf607cc59b45f2b2e7513caa6541de2392842458"
        },
        {
          "name": "quote_transfer",
          "title": "Quote a transfer",
          "description": "Price every route between `from` and `to` at this size, across P2P venues, payment rails, withdrawal networks and swap providers. Returns the best route with each leg's cost, up to four alternatives, the all-in cost in bps against mid-market, and a confidence level. Needs an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount of `from`",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "from": {
                "description": "What is sent: \"KES\", \"KES:mpesa\", \"USDT:tron\"…",
                "maxLength": 32,
                "type": "string"
              },
              "maxAds": {
                "description": "Most P2P counterparties to split across (default 25; 1 forces a single ad)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "What should arrive, same notation: \"USDC:base\", \"NGN:bank\"…",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f8e70727277916ab79148beca7a454a0f670a3a32006469ba0b0b8e3e9c9ff78"
        },
        {
          "name": "read_doc",
          "title": "Read a docs page",
          "description": "A full docs page as Markdown, by path: \"quickstart\", \"authentication\", \"concepts/notation\", \"guides/vaults\", \"guides/rate-locks\"… Use \"index\" for the overview, \"llms\" for the page list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "path": {
                "pattern": "^[a-z0-9-]+(\\/[a-z0-9-]+)*$",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
