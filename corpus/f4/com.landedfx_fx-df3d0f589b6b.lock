          "name": "naira_risk",
          "title": "Naira risk today",
          "description": "The naira risk watchdog: calm, watch or step_aside, with reasons, market signals (24-hour move, street premium over the official index, futures-implied fall) and the recent headlines TypeSafe Jev judged. The Carry vault steps out of naira exposure at step_aside.",
