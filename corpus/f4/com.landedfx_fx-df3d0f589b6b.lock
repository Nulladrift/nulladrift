        {
          "name": "lock_rate",
          "title": "Lock a naira rate",
          "description": "Price a rate lock for a future naira payment from the on-chain futures book: the locked rate, premium over today, margin needed, and the order to sign. Prices only; nothing is placed. Needs an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amountUsd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "market": {
                "description": "A futures series such as cNGN-30NOV26; defaults to the nearest",
                "type": "string"
              },
              "side": {
                "description": "\"buy_usd\": dollars needed later (importer, payroll). \"sell_usd\": dollars received later.",
                "enum": ["buy_usd", "sell_usd"],
                "type": "string"
              }
            },
            "required": ["amountUsd", "side"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
