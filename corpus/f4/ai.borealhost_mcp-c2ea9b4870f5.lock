                "type": "string"
              },
              "forward_include_path": {
                "default": true,
                "title": "Forward Include Path",
                "type": "boolean"
              },
              "forward_type": {
                "default": "301",
                "title": "Forward Type",
                "type": "string"
              },
              "forward_url": {
                "default": "",
                "title": "Forward Url",
                "type": "string"
              },
              "last_name": {
                "title": "Last Name",
                "type": "string"
              },
              "nameservers": {
                "default": null,
                "items": {},
                "title": "Nameservers",
                "type": "array"
              },
              "period": {
                "default": 1,
                "title": "Period",
