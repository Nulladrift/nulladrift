        {
          "name": "register_domain",
          "description": "Register a new domain with WHOIS contact info and Stripe billing.\n\nFirst request a quote (quote_only=True), present registration_cad,\nprivacy_cad, total_cad, term and privacy choice, and obtain customer consent.\nThen repeat the same input with quote_only=False and the quote_token.\nNever automatically accept a replacement token after a price change.\nIncluded annual registration covers registration only; selected privacy\nuses the same BoC daily USD/CAD rate, rounded to CAD cents, no markup.\nRegistration/renewal convert their actual operation-specific USD cost first,\nthen apply 10% and round up to CAD .95. Rates older than four days refuse.\n\nRequires: API key with write scope.\n\nArgs:\n    whois_privacy: Explicit privacy choice; defaults selected only for supported paid TLDs.\n    quote_only: True returns a quote without registration or payment.\n    quote_token: Signed five-minute quote accepted by the customer.\n    domain: Full domain name (e.g. \"example.ca\", \"mybusiness.com\")\n    first_name: Registrant first name\n    last_name: Registrant last name\n    email: Registrant email address\n    phone: Phone number in E.164 format: \"+1.5145551234\"\n    address1: Street address (e.g. \"123 Rue Principale\")\n    city: City (e.g. \"Montreal\")\n    state: Province/state code (e.g. \"QC\", \"ON\", \"BC\")\n    postal_code: Postal/ZIP code (e.g. \"H2X 1Y4\")\n    country: ISO 3166-1 alpha-2 country code (default: \"CA\")\n    period: Registration period in years (1–10, default: 1)\n    usage_mode: What the domain points at.\n                \"site\" (default) links it to the billing subscription's\n                site with automatic DNS + Nginx + SSL.\n                \"external_ns\" delegates it to `nameservers` — the domain is\n                registered here but hosted elsewhere; we manage no DNS.\n                \"dns_only\" keeps it on our DNS with no site behind it.\n                \"forward\" redirects visitors to `forward_url`.\n    nameservers: Ordered list of 2–6 nameserver hostnames. Required when\n                 usage_mode=\"external_ns\" (e.g. [\"ns1.other.com\", \"ns2.other.com\"])\n    forward_url: Redirect target, required when usage_mode=\"forward\"\n                 (e.g. \"https://example.org\")\n    forward_type: \"301\" permanent (default) or \"302\" temporary\n    forward_include_path: Append the visitor's path to the target (default: True)\n    ca_legal_type: Required for .ca domains. CIRA legal types:\n                   \"CCT\" (Canadian citizen), \"RES\" (permanent resident),\n                   \"CCO\" (corporation), \"GOV\" (government), \"EDU\" (education),\n                   \"ASS\" (association), \"HOP\" (hospital), \"PRT\" (partnership),\n                   \"TDM\" (trademark), \"TRD\" (trade union), \"PLT\" (political party),\n                   \"LAM\" (library/archive/museum), \"MAJ\" (Her Majesty),\n                   \"INB\" (Indian band), \"ABO\" (Aboriginal peoples),\n                   \"LGR\" (legal representative)\n\nReturns:\n    Quote request: {\"quote\": {\"registration_cad\": \"...\",\n      \"privacy_cad\": \"...\", \"total_cad\": \"...\", \"currency\": \"CAD\",\n      \"period\": 1, \"whois_privacy\": false, \"expires_at\": \"iso8601\"},\n      \"quote_token\": \"...\", \"privacy_explanation\": \"...\"}\n    Purchase: {\"name\": \"example.ca\", \"status\": \"registered\",\n      \"last_pricing_quote\": {...}, ...}\n\nErrors:\n    VALIDATION_ERROR: Missing required fields, invalid phone format,\n                      missing ca_legal_type for .ca domains\n    NOT_FOUND: Domain not available (already registered by someone else)\n",
          "inputSchema": {
            "properties": {
              "address1": {
                "title": "Address1",
                "type": "string"
              },
              "ca_legal_type": {
                "default": "",
                "title": "Ca Legal Type",
                "type": "string"
              },
              "city": {
                "title": "City",
                "type": "string"
              },
              "country": {
                "default": "CA",
                "title": "Country",
                "type": "string"
              },
              "domain": {
