        {
          "name": "request_api_key",
          "description": "Request an API key for a site YOU ARE RUNNING ON (challenge-response).\n\n⚠ ONLY USE THIS IF YOU ARE EXECUTING INSIDE THAT SITE'S OWN CONTAINER. If\nyou bought or ordered the site from somewhere else, this is the wrong tool:\nit returns \"pending\" and the pending never resolves, because the proof it\nasks for is a file you cannot reach. Use `get_checkout_status(checkout_id)`\non the checkout that paid for the site — that hands over the site-scoped key\nover plain HTTP with no container access. The refusal and the pending\nresponse both name it under `alternative` when one is available.\n\nTwo-step verification flow:\n1. A claim token is written into that site's container, at the per-site path\n   the response gives you in `claim_path` (mode 600, owner admin — readable\n   only from on the container). Do not hardcode the path.\n2. Read that file and call claim_api_key(token) within 1 hour\n\nRefused for sites on SHARED containers. One container there serves up to 40\ncustomers behind one agent, so reading a file proves you are on the machine,\nnot which customer you are — the token would authenticate the wrong thing.\n\nNo authentication needed — the proof is reading the file from the container.\n\nArgs:\n    site_slug: The site identifier (your BorealHost site slug)\n\nReturns:\n    {\"status\": \"pending\", \"site_slug\": \"my-site\", \"expires_in_seconds\": 3600,\n     \"claim_path\": \"/home/admin/.borealhost/.claim_token_my-site\",\n     \"requires_container_access\": true,\n     \"instructions\": \"Read the claim token and call claim_api_key()...\",\n     \"alternative\": {\"checkout_id\": \"...\", \"command\": \"bh checkout status ...\"}}\n\nErrors:\n    VALIDATION_ERROR: Unknown site slug, no active subscription, shared\n        container, or a key already exists (rotate it, never revoke it to\n        reach this route). Carries `alternative` when another route works.\n    RATE_LIMITED: Too many pending claim tokens\n",
          "inputSchema": {
            "properties": {
              "site_slug": {
                "title": "Site Slug",
                "type": "string"
              }
            },
            "required": ["site_slug"],
            "title": "request_api_keyArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8bd75ca0f3031c4a403c96342cc7a285ca385dee409f863f99cd01316da8cd10"
        },
