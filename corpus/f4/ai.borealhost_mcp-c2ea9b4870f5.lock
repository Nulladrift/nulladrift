        {
          "name": "execute_query",
          "description": "Run ONE bounded read against a site's database.\n\nOne statement, beginning with SELECT, SHOW, DESCRIBE or EXPLAIN, with no\nsecond statement and no data-modifying clause anywhere in it. The container\nproves the statement is a read before running it and caps the result: 200\nrows by default, 1000 maximum, 2 MB of cell data. `truncated` in the\nresponse says whether a cap was reached.\n\n⚠ THIS TOOL CANNOT CHANGE ANYTHING, AND RETRYING WITH DIFFERENT WORDING WILL\nNOT MAKE IT. Anything that is not a single bounded read is refused with\nREAD_ONLY and nothing runs. To change data or schema, use the tool for the\njob: optimize_database, database_search_replace, manage_db_user,\nlist_databases, list_tables — and for creating, altering, dropping,\nimporting or exporting tables, the database manager in the control panel,\nwhich has no tool here.\n\nRequires: API key with write scope (unchanged — the scope is the customer's\npublished permission for this operation, not a claim about what it does).\n\nArgs:\n    slug: Site identifier\n    database: Database name\n    query: One read statement\n\nReturns:\n    {\"columns\": [\"id\", \"user_email\"], \"rows\": [[1, \"a@example.com\"], ...],\n     \"row_count\": 1, \"truncated\": false, \"execution_time_ms\": 12.0}\n\nErrors:\n    READ_ONLY: Not a single bounded read. The error text carries the\n        explanation and names the operation to use instead.\n",
