        {
          "name": "add_port_forward",
          "description": "Publish a container port on the node's public IP (TCP or UDP).\n\nThis is how inbound UDP reaches a container. There is no other way: the\ncontainer's own address is private, and the IP allow/deny rules of\nadd_firewall_rule cannot route anything.\n\nPORT PRESERVATION MATTERS. Leave external_port at 0 and a port is allocated\nfrom 10000-19999 — your service becomes reachable, but on a DIFFERENT\nnumber. That is fine for HTTP or ssh and broken for every protocol that\ncarries its own port inside the payload: STUN, TURN, RTP/WebRTC, SIP,\nWireGuard, QUIC. For those, pass external_port equal to internal_port.\n\nA media server needs a contiguous span, not one port — pass\ninternal_port_end. A span is always published unchanged and counts as ONE\nrule against your limit.\n\nSome ports are refused because the host or its neighbours already answer on\nthem: 22, 80, 443, 2222, 9201, 51820, and the bands 9210-9250, 9310-9350\nand 20000-20099. The last one is why the \"forward UDP 20000-20999 for\nJanus\" recipe printed in most Nextcloud Talk guides will not work here —\npick a span above it, e.g. 20100-20599.\n\nRequires: API key with write scope.\n\nArgs:\n    slug: Site identifier\n    internal_port: Port your service listens on inside the container\n    protocol: \"tcp\" or \"udp\". Default: \"tcp\"\n    label: Free-text note shown in the panel\n    external_port: Publish on this exact port; 0 allocates one from the pool\n    internal_port_end: End of a contiguous range (inclusive); 0 means one port\n\nReturns:\n    {\"id\": \"...\", \"external_port\": 3478, \"internal_port\": 3478,\n     \"protocol\": \"udp\", \"status\": \"active\",\n     \"public_address\": \"203.0.113.5:3478\", \"port_preserved\": true}\n",
          "inputSchema": {
            "properties": {
              "external_port": {
                "default": 0,
                "title": "External Port",
                "type": "integer"
              },
              "internal_port": {
                "title": "Internal Port",
                "type": "integer"
              },
              "internal_port_end": {
                "default": 0,
                "title": "Internal Port End",
                "type": "integer"
              },
              "label": {
                "default": "",
                "title": "Label",
                "type": "string"
              },
              "protocol": {
                "default": "tcp",
                "title": "Protocol",
                "type": "string"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["internal_port", "slug"],
            "title": "add_port_forwardArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f33f5a289cdb84694c38320e83c5bb8f2395fb4cd94a91ba850dd3d413ac431"
        },
