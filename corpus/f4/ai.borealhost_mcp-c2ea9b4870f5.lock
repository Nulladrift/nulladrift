        {
          "name": "set_site_nginx_snippet",
          "description": "Set custom nginx config on the BorealHost host proxy — WebSocket, timeouts, headers.\n\nUse this when configuring your container's own nginx is not enough because\nsomething in front of it is interfering. The host proxy sits between the\ninternet and your container, and by default its catch-all `location /` does\nnot do anything special per-site.\n\nWEBSOCKETS: if your WebSocket endpoint returns 400 through your domain but\nupgrades correctly (101) when tested inside your container, the Upgrade\nheader is being dropped in front of you. Add a location block that relays it:\n\n    location ^~ /your/ws/path/ {\n        proxy_pass <your site's existing upstream>;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n        proxy_read_timeout 3600;\n        proxy_send_timeout 3600;\n        error_page 502 503 504 =502;\n    }\n\nWhen testing with curl, force HTTP/1.1 (curl --http1.1). A WebSocket handshake uses the Upgrade header, which is invalid in HTTP/2 —\ncurl negotiates h2 with a CDN by default and the edge answers 400, which looks exactly like the bug you are trying to fix.\n\nThis config lives OUTSIDE the generated vhost, so it survives domain\nre-linking, autoconfig, plan changes and reprovisioning. Sending \"\" clears it.\n\nBounds — the file is parsed by a root process on a machine shared with\nBorealHost infrastructure, so only per-site proxy directives are accepted:\nlocation, proxy_pass, proxy_set_header, proxy_http_version, proxy_*_timeout,\nproxy_buffering, client_max_body_size, add_header, error_page, expires, gzip.\n`root`, `alias`, `include`, `access_log`, `error_log`, `server` and `upstream`\nare refused, and proxy_pass must target your own site's existing upstream.\nA rejection names the directive and why.\n\nThe config is validated with `nginx -t` before it is applied and rolled back\nautomatically if it does not pass, so a mistake cannot take your site down.\n\nRequires: API key with write scope.\n\nArgs:\n    domain_name: Full domain name (e.g. \"example.com\")\n    content: nginx config, or \"\" to clear it\n\nReturns:\n    {\"domain\": \"example.com\", \"bytes\": 214, \"replaced\": false}\n\nErrors:\n    NOT_FOUND: Domain not found\n    VALIDATION_ERROR: Domain not linked to a site, a directive is not\n        permitted, proxy_pass targets something other than your own\n        upstream, or nginx rejected the config (the message says which)\n",
          "inputSchema": {
            "properties": {
              "content": {
                "title": "Content",
                "type": "string"
              },
              "domain_name": {
                "title": "Domain Name",
                "type": "string"
              }
            },
            "required": ["content", "domain_name"],
            "title": "set_site_nginx_snippetArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e51820a9ecae3dc8027cb3560489325a29d689782834e52d3fce3592cdc0ee29"
        },
        {
          "name": "set_site_type",
          "description": "Change what a site's docroot IS, without deleting anything.\n\nTypes:\n  wordpress    WordPress, PHP and a database (the default)\n  php          PHP and a database, no WordPress\n  php-nodb     PHP, no database\n  static-site  HTML/CSS/JS only, no PHP and no database\n\n⚠ NON-DESTRUCTIVE. Existing files stay on disk and existing databases are\nnot dropped. They remain the customer's data and keep counting against\ntheir plan's quota — this changes how the site is SERVED, not what it\nholds. Converting back later finds everything where it was.\n\n⚠ Moving to a type without PHP does not merely stop executing .php — it\nstops serving them. The vhost returns 404 for php/phtml, because falling\nthrough to the static handler would return the file's SOURCE, and a\ndocroot converted from WordPress still contains wp-config.php with the\ndatabase password in it.\n\nShared hosting only. On a VPS the whole container is the customer's and\nthey reconfigure it with the tools inside it.\n\nRequires: API key with write scope.\n\nArgs:\n    slug: Site identifier\n    site_type: One of the four values above\n\nReturns:\n    {\"from\": \"wordpress\", \"to\": \"static-site\", \"database_created\": false,\n     \"placeholder_seeded\": false, \"pool_removed\": true}\n    `placeholder_seeded` is true only when the docroot was EMPTY — an\n    existing site's content is never overwritten.\n\nErrors:\n    VALIDATION_ERROR: Unknown type, or the site is not on shared hosting\n    NOT_FOUND: Unknown slug or not reachable by this account\n",
          "inputSchema": {
            "properties": {
              "site_type": {
                "title": "Site Type",
                "type": "string"
              },
              "slug": {
                "title": "Slug",
                "type": "string"
              }
            },
            "required": ["site_type", "slug"],
            "title": "set_site_typeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58e169de2fc3f649dd12aeb0153734a506d2c7bd730db45211ba14ce85e5ae72"
        },
