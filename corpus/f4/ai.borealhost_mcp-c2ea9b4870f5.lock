        {
          "name": "get_wallet",
          "description": "The account's prepaid balance, and what THIS key may spend from it.\n\nTwo ceilings, and both apply: the balance bounds the ACCOUNT, the allowance\nbounds this KEY within it. Plan against `spendable_cents`, which is the\nlower of the two — a $50 balance behind a $5 allowance means $5, and\nplanning against the balance is planning a purchase that gets refused.\n\n`can_spend: false` with a non-zero balance is normal and means this key has\nno budget allocated. That is not a bug: a key with no allowance may not\nspend the account's money, which is the whole reason allowances exist. Ask\nthe human to allocate one in the panel (Compte → Clés API).\n\nRead-only. Money goes in through a human — an agent able to top up its own\nbudget does not have one.\n\nRequires: API key with read scope.\n\nReturns:\n    {\"currency\": \"CAD\", \"balance_cents\": 5000, \"spendable_cents\": 500,\n     \"can_spend\": true,\n     \"key_allowance\": {\"limit_cents\": 2000, \"spent_cents\": 1500,\n                       \"remaining_cents\": 500}}\n\nTo spend it: complete_checkout(..., payment_method=\"wallet\").\n",
