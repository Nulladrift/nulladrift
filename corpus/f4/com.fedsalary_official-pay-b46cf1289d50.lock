{
  "lockfileVersion": 2,
  "subjects": {
    "com.fedsalary/official-pay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fedsalary.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fedsalary",
        "title": "FedSalary: official pay data",
        "version": "1.0.0",
        "websiteUrl": "https://fedsalary.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FedSalary republishes official pay statistics (US Bureau of Labor Statistics OEWS, Canada's Job Bank, the UK Office for National Statistics and 30+ other national statistics offices), never self-reported or crowdsourced salaries. Use get_pay for what a job pays in a place, check_pay to judge a specific offer or posted range, compare_offers for two US offers in different places, take_home for US pay after tax in a state or city, find_jobs for current openings with their pay (US and Canada, linking to each employer's own posting), and match_jobs for openings ranked by how well they fit a person's job titles, experience and skills. Every answer names its publisher, reference period and a FedSalary page link: cite the publisher as the source and link the FedSalary page. Figures are for the stated reference period, not today, and are not adjusted for experience unless a result says so.",
      "tools": [
        {
          "name": "check_pay",
          "title": "Check a pay offer or range",
          "description": "Where a job offer's pay, or a posted pay range, sits on the official pay distribution for the same job and place: the percentile span, the median, US take-home pay at the midpoint after federal and state tax, and for US metro areas which Department of Labor wage level (entry to fully competent) the pay meets. For the other national surveys, use national/<country code> (for example national/no), a local occupation code and an amount in its native pay period.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Optional ISO currency declaration for national survey inputs.",
                "type": "string"
              },
              "job": {
                "description": "Job title, FedSalary slug or occupation code.",
                "type": "string"
              },
              "max": {
                "description": "High end of the range (optional).",
                "type": "number"
              },
              "measure": {
                "description": "Optional national earnings measure. Norway and Singapore publish basic pay and Czechia publishes the public salary sector.",
                "enum": ["earnings", "basic", "public"],
                "type": "string"
              },
              "min": {
                "description": "Low end of the range, or the only figure.",
                "type": "number"
              },
              "periods": {
                "description": "Paid months, weeks or hours included in an annual amount when comparing with another native period.",
                "type": "number"
              },
              "place": {
                "description": "us, ca, uk, a US state or large metro, a Canadian province, a UK region, or national/<country code> for another national survey.",
                "type": "string"
              },
              "unit": {
                "description": "Use the source period for national comparisons, year for the UK, and year or hour for the US and Canada.",
                "enum": ["year", "hour", "month", "week"],
                "type": "string"
              }
            },
            "required": ["job", "min", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a pay offer or range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf42b984a03dc4f5dc9d0754b80d7b23815e633eb99824736ebd7681b2b9a2ab"
        },
        {
          "name": "compare_offers",
          "title": "Compare two US job offers",
          "description": "Two US job offers, each a pay figure in a state or one of the 50 largest metro areas, compared after federal income tax, Social Security, Medicare and state income tax, then after local prices (BEA regional price parities, rent included). Returns take-home pay, take-home at national prices, which offer is worth more and by how much, and the salary each place would need to match the other. With a job, also where each offer sits on the official pay distribution. City and county income taxes are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a_hours": {
                "description": "Paid hours per week for offer A. Default 40 for hourly pay.",
                "exclusiveMinimum": 0,
                "maximum": 168,
                "type": "number"
              },
              "a_job": {
                "description": "Occupation for offer A. Overrides the shared job.",
                "type": "string"
              },
              "a_pay": {
                "description": "Offer A's pay.",
                "type": "number"
              },
              "a_place": {
                "description": "Offer A's place: a US state or large metro area.",
                "type": "string"
              },
              "a_unit": {
                "description": "Pay period for offer A.",
                "enum": ["year", "hour"],
                "type": "string"
              },
              "a_weeks": {
                "description": "Paid weeks per year for offer A. Default 52 for hourly pay.",
                "exclusiveMinimum": 0,
                "maximum": 53,
                "type": "number"
              },
              "b_hours": {
                "description": "Paid hours per week for offer B. Default 40 for hourly pay.",
                "exclusiveMinimum": 0,
                "maximum": 168,
                "type": "number"
              },
              "b_job": {
                "description": "Occupation for offer B. Overrides the shared job.",
                "type": "string"
              },
              "b_pay": {
                "description": "Offer B's pay.",
                "type": "number"
              },
              "b_place": {
                "description": "Offer B's place.",
                "type": "string"
              },
              "b_unit": {
                "description": "Pay period for offer B.",
                "enum": ["year", "hour"],
                "type": "string"
              },
              "b_weeks": {
                "description": "Paid weeks per year for offer B. Default 52 for hourly pay.",
                "exclusiveMinimum": 0,
                "maximum": 53,
                "type": "number"
              },
              "job": {
                "description": "Optional job title or slug, to place each offer on the official distribution.",
                "type": "string"
              },
              "unit": {
                "description": "Shared pay period for offers without their own unit.",
                "enum": ["year", "hour"],
                "type": "string"
              }
            },
            "required": ["a_pay", "a_place", "b_pay", "b_place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two US job offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e389af31a9b90b13541af2e0f0b045b295b3061bd1471494572a78d81d42f071"
        },
        {
          "name": "find_jobs",
          "title": "Find current job openings with their pay",
          "description": "Current job openings in the US and Canada from employers' own job boards and US federal announcements from USAJOBS (read through their documented APIs, refreshed weekly), matching keywords and a place. Each result: title and employer as posted, places, posting date, the pay range when available in the feed, and otherwise the official BLS median for the occupation in the US state named (national for US remote jobs); for published US ranges, where the range sits on the official distribution; and the link to apply on the employer's own site. Results are newest first or by published pay. Coverage is strongest for technology, finance, startups and remote work; many hospitals, retailers and state and local governments are not included yet, so few or no results does not mean no such jobs exist. No job descriptions; FedSalary takes no applications.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "federal_only": {
                "description": "true = only US federal job announcements (from USAJOBS; apply on USAJOBS).",
                "type": "boolean"
              },
              "keywords": {
                "description": "A full official occupation name searches all openings classified in it. Other keywords are matched against the employer and job title.",
                "type": "string"
              },
              "min_pay": {
                "description": "Annualized pay threshold. The default is USD equivalent. With pay_currency CAD, compare only Canadian postings quoted in CAD. Jobs without published pay are left out when this is set.",
                "type": "number"
              },
              "occupation": {
                "description": "Optional US SOC code, Canadian NOC code or official occupation name. Combine with keywords to narrow the occupation by employer or specialty.",
                "type": "string"
              },
              "pay_basis": {
                "description": "With min_pay, require the published annual minimum (year) or hourly minimum (hour, compared to min_pay / 2,080). Omit for the top of the annualized range.",
                "enum": ["year", "hour"],
                "type": "string"
              },
              "pay_currency": {
                "description": "CAD requires pay quoted in Canadian dollars. USD keeps the default USD-equivalent comparison.",
                "enum": ["USD", "CAD"],
                "type": "string"
              },
              "place": {
                "description": "A US state (texas or TX), a US metro area or large city (austin), remote (US remote jobs), canada, a Canadian province (ontario) or a large Canadian city (toronto). Leave out for everywhere.",
                "type": "string"
              },
              "posted_after": {
                "description": "Include only openings with an employer posting date after YYYY-MM-DD.",
                "type": "string"
              },
              "published_pay_only": {
                "description": "true = only jobs that publish a pay range.",
                "type": "boolean"
              },
              "remote_only": {
                "description": "true = only jobs the employer marks remote, on top of any place (remote jobs open to Texas: place texas, remote_only true). For remote jobs anywhere in the US, set place to remote instead.",
                "type": "boolean"
              },
              "schedule": {
                "description": "Require an employer-stated full-time or part-time schedule.",
                "enum": ["full", "part"],
                "type": "string"
              },
              "sort": {
                "description": "new (default) or pay.",
                "enum": ["new", "pay"],
                "type": "string"
              },
              "strictly_above": {
                "description": "With min_pay, exclude equality for an explicit request for pay over the amount.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find current job openings with their pay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9acd92858cb9820b6e2db6d3be6fd2b3f2dd0ede9323b5ac81c5106fca02e634"
        },
        {
          "name": "get_pay",
          "title": "Official pay for a job",
          "description": "Official pay statistics for one job in one place: median, 10th to 90th percentiles, employment, the publisher and reference period, take-home pay where the site shows it, and for US states and metro areas the U.S. Department of Labor's four wage levels (entry to fully competent). Covers the US, Canada and the UK, with regional figures, and 29 other national occupation surveys using national/<country code>. Returns the page's Markdown copy with a citation line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "Job title as people say it (registered nurse, software engineer), a FedSalary page slug (registered-nurses) or an occupation code (SOC 29-1141, NOC 31301).",
                "type": "string"
              },
              "measure": {
                "description": "National survey measure. Norway and Singapore also publish basic pay. Czechia also publishes public-sector pay where available.",
                "enum": ["earnings", "basic", "public"],
                "type": "string"
              },
              "place": {
                "description": "us, ca or uk for a whole country (default us); a US state (texas or TX); a large US metro area (austin, seattle); a Canadian province (ontario); a UK region (london).",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Official pay for a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7700ec6c9c3cc65fa2ce44fe25f62644df9cb9f2eb58398a00aec27903971441"
        },
        {
          "name": "match_jobs",
          "title": "Jobs that fit a person's experience",
          "description": "Current US and Canadian openings ranked by how closely they fit a person's work history: the job titles they have held, years of experience, skills, place and minimum pay. For Canadian places, supported titles resolve to ESDC occupational profiles with official skill comparisons and entry requirements. US titles use O*NET and official wage groups. Ambiguous titles return occupation choices; openings are then ranked by title match, same or neighbouring occupation, skills named in the posting's title and seniority fit (intern and junior roles drop for experienced people, senior roles for people starting out). Each result says why it is listed, with available employer pay or the official median for context, and the link to apply on the employer's site. No job descriptions are read, so a skill counts only when the employer put it in the job title. Nothing about the person is stored. Same coverage limits as find_jobs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_remote": {
                "description": "With a place: also include remote jobs (default true).",
                "type": "boolean"
              },
              "min_pay": {
                "description": "Minimum of the employer’s posted yearly salary in USD. Hourly estimates and jobs without published salaries are excluded.",
                "type": "number"
              },
              "place": {
                "description": "A US state (texas or TX), a large US metro area (austin), Canada, a Canadian province or a named Canadian municipality (Ottawa, ON). Leave out for everywhere.",
                "type": "string"
              },
              "same_occupation_only": {
                "description": "true restricts openings to the identified occupations of the supplied job titles.",
                "type": "boolean"
              },
              "schedule": {
                "description": "Restrict matches and career alternatives to an employer-stated schedule.",
                "enum": ["full", "part"],
                "type": "string"
              },
              "skills": {
                "description": "Skills or specialties, twelve at most (ICU, pediatrics, Python).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "titles": {
                "description": "Job titles the person has held, most recent first, three at most (registered nurse, charge nurse).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "years_experience": {
                "description": "Years of work experience.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Jobs that fit a person's experience"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:14d3e9e7a5525e119daf9ae347a4be4ab2e9f571a313c2c35013040758534a29"
        },
        {
          "name": "take_home",
          "title": "US take-home pay after tax",
          "description": "Take-home pay on a US salary or hourly wage in a state or one of the 50 largest metro areas: federal income tax, Social Security, Medicare, the state's income tax and the state's employee payroll contributions where it has them (disability insurance, paid family leave, long-term care, employee unemployment insurance), using the state's newest published rules with the federal rules of the same year. Single filer, no dependents, standard deduction, wage income only; city and county income taxes are not included. Returns the yearly, monthly and per-paycheck amounts with each tax line and a link to the state's calculator page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pay": {
                "description": "Pay before tax: a yearly salary, or an hourly wage with unit hour.",
                "type": "number"
              },
              "place": {
                "description": "A US state (ohio or OH) or a large US metro area (austin, seattle). us gives federal taxes only.",
                "type": "string"
              },
              "unit": {
                "description": "year (default) or hour; hourly pay is annualized at 2,080 hours.",
                "enum": ["year", "hour"],
                "type": "string"
              }
            },
            "required": ["pay", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US take-home pay after tax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd083dba2be9524bfb09fa8339b99e3add78960b36fdfb133d2bd41814a8a737"
        }
      ],
      "digest": "sha256:99bb394eaaf6e84a58e257423bc697900ddcafea49046f44b2c2e0b845a0deda"
    }
  }
}
