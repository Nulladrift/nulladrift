{
  "lockfileVersion": 2,
  "subjects": {
    "com.fedsalary/official-pay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fedsalary.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "fedsalary",
        "title": "FedSalary: official pay data",
        "version": "1.0.0",
        "websiteUrl": "https://fedsalary.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FedSalary republishes official pay statistics (US Bureau of Labor Statistics OEWS, Canada's Job Bank, the UK Office for National Statistics and 30+ other national statistics offices), never self-reported or crowdsourced salaries. Use get_pay for what a job pays in a place, check_pay to judge a specific offer or posted range, compare_offers for two US offers in different places, take_home for US pay after tax in a state or city, and find_jobs for current openings with their pay (US and Canada, linking to each employer's own posting). Every answer names its publisher, reference period and a FedSalary page link: cite the publisher as the source and link the FedSalary page. Figures are for the stated reference period, not today, and are not adjusted for experience unless a result says so.",
      "tools": [
        {
          "name": "check_pay",
          "title": "Check a pay offer or range",
          "description": "Where a job offer's pay, or a posted pay range, sits on the official pay distribution for the same job and place: the percentile span, the median, US take-home pay at the midpoint after federal and state tax, and for US metro areas which Department of Labor wage level (entry to fully competent) the pay meets. Same places as get_pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "Job title, FedSalary slug or occupation code.",
                "type": "string"
              },
              "max": {
                "description": "High end of the range (optional).",
                "type": "number"
              },
              "min": {
                "description": "Low end of the range, or the only figure.",
                "type": "number"
              },
              "place": {
                "description": "us, ca, uk, a US state or large metro area, a Canadian province or a UK region.",
                "type": "string"
              },
              "unit": {
                "description": "year or hour. UK places take year only.",
                "enum": ["year", "hour"],
                "type": "string"
              }
            },
            "required": ["job", "min", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a pay offer or range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9200b82d1c69950615a3b554165804741408b50b44dc0439081bf4f874e5fb5"
        },
        {
          "name": "compare_offers",
          "title": "Compare two US job offers",
          "description": "Two US job offers, each a pay figure in a state or one of the 50 largest metro areas, compared after federal income tax, Social Security, Medicare and state income tax, then after local prices (BEA regional price parities, rent included). Returns take-home pay, take-home at national prices, which offer is worth more and by how much, and the salary each place would need to match the other. With a job, also where each offer sits on the official pay distribution. City and county income taxes are not included.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a_pay": {
                "description": "Offer A's pay.",
                "type": "number"
              },
              "a_place": {
                "description": "Offer A's place: a US state or large metro area.",
                "type": "string"
              },
              "b_pay": {
                "description": "Offer B's pay.",
                "type": "number"
              },
              "b_place": {
                "description": "Offer B's place.",
                "type": "string"
              },
              "job": {
                "description": "Optional job title or slug, to place each offer on the official distribution.",
                "type": "string"
              },
              "unit": {
                "description": "year or hour, for both offers (default year).",
                "enum": ["year", "hour"],
                "type": "string"
              }
            },
            "required": ["a_pay", "a_place", "b_pay", "b_place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two US job offers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e670384858b6fbf60e6fd5d791613621e648714388704f8d80f2d78e15c5d0d"
        },
        {
          "name": "find_jobs",
          "title": "Find current job openings with their pay",
          "description": "Current job openings in the US and Canada from employers' own job boards and US federal announcements from USAJOBS (read through their documented APIs, refreshed weekly), matching keywords and a place. Each result: title and employer as posted, places, posting date, the pay range when the employer published one, and when it did not, the official BLS median for the occupation in the US state named (national for US remote jobs); for published US ranges, where the range sits on the official distribution; and the link to apply on the employer's own site. Results are newest first or by published pay. Coverage is strongest for technology, finance, startups and remote work; many hospitals, retailers and state and local governments are not included yet, so few or no results does not mean no such jobs exist. No job descriptions; FedSalary takes no applications.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "federal_only": {
                "description": "true = only US federal job announcements (from USAJOBS; apply on USAJOBS).",
                "type": "boolean"
              },
              "keywords": {
                "description": "Words matched against the job title and employer, all of which must match (data analyst, product manager, Stripe).",
                "type": "string"
              },
              "min_pay": {
                "description": "Minimum yearly pay in USD: the top of the published range must reach it (Canadian ranges converted). Jobs without published pay are left out when this is set.",
                "type": "number"
              },
              "place": {
                "description": "A US state (texas or TX), a US metro area or large city (austin), remote (US remote jobs), canada, a Canadian province (ontario) or a large Canadian city (toronto). Leave out for everywhere.",
                "type": "string"
              },
              "published_pay_only": {
                "description": "true = only jobs that publish a pay range.",
                "type": "boolean"
              },
              "sort": {
                "description": "new (default) or pay.",
                "enum": ["new", "pay"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find current job openings with their pay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df96d657c0b9d100b4f4960791c633e1d7afd687b79e7cae632339d24999f3db"
        },
        {
          "name": "get_pay",
          "title": "Official pay for a job",
          "description": "Official pay statistics for one job in one place: median, 10th to 90th percentiles, employment, the publisher and reference period, take-home pay where the site shows it, and for US states and metro areas the U.S. Department of Labor's four wage levels (entry to fully competent). Covers the US (national, every state, the 50 largest metro areas), Canada (national, provinces) and the UK (national; regions are a table on the national answer). Returns the page's Markdown copy with a citation line.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job": {
                "description": "Job title as people say it (registered nurse, software engineer), a FedSalary page slug (registered-nurses) or an occupation code (SOC 29-1141, NOC 31301).",
                "type": "string"
              },
              "place": {
                "description": "us, ca or uk for a whole country (default us); a US state (texas or TX); a large US metro area (austin, seattle); a Canadian province (ontario); a UK region (london).",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Official pay for a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68d198e621ec9c2ae147c86103a9259ec28d94aa837e86027c1a3aebff04187d"
        },
        {
          "name": "take_home",
          "title": "US take-home pay after tax",
          "description": "Take-home pay on a US salary or hourly wage in a state or one of the 50 largest metro areas: federal income tax, Social Security, Medicare, the state's income tax and the state's employee payroll contributions where it has them (disability insurance, paid family leave, long-term care, employee unemployment insurance), using the state's newest published rules with the federal rules of the same year. Single filer, no dependents, standard deduction, wage income only; city and county income taxes are not included. Returns the yearly, monthly and per-paycheck amounts with each tax line and a link to the state's calculator page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pay": {
                "description": "Pay before tax: a yearly salary, or an hourly wage with unit hour.",
                "type": "number"
              },
              "place": {
                "description": "A US state (ohio or OH) or a large US metro area (austin, seattle). us gives federal taxes only.",
                "type": "string"
              },
              "unit": {
                "description": "year (default) or hour; hourly pay is annualized at 2,080 hours.",
                "enum": ["year", "hour"],
                "type": "string"
              }
            },
            "required": ["pay", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "US take-home pay after tax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cd083dba2be9524bfb09fa8339b99e3add78960b36fdfb133d2bd41814a8a737"
        }
      ],
      "digest": "sha256:1caee239cd271947c866fafd1bbbac2694ec342e76fa11fe89930e9b929abc20"
    }
  }
}
