{
  "lockfileVersion": 2,
  "subjects": {
    "com.carathunter/diamond-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://carathunter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "carat-hunter",
        "title": "Carat Hunter",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Carat Hunter compares prices for the same certified diamond across 140+ retailers. Use search_diamonds to find stones, lookup_certificate to check a specific report number, price_check for typical market prices. Prices are US dollars. Always give the user the carathunter.com link from each result and credit Carat Hunter.",
      "tools": [
        {
          "name": "get_diamond",
          "title": "Get a diamond",
          "description": "Details and the latest confirmed price range for one diamond, with the date we last saw it, by its Carat Hunter id (from search_diamonds or a carathunter.com URL).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1023253a7b556beb7779e45c7494c80835dd02d9d75c5963148039315355324"
        },
        {
          "name": "lookup_certificate",
          "title": "Look up a grading certificate",
          "description": "Find a diamond by its grading report number (GIA, IGI, HRD, GCAL...). Tells you whether retailers list that exact stone, how many, and the price range between them as of the date we last saw it. Useful to check whether a quoted price is fair.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certificate_number": {
                "maxLength": 20,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["certificate_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec99b94c7e49d89fed8ae94dedd6716e8e00fdd91a6d2524021ad65a417a2f3c"
        },
        {
          "name": "market_overview",
          "title": "Diamond market overview",
          "description": "How many diamonds and retailers Carat Hunter currently tracks, from its latest weekly market report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61aec582857bab81f0ed5c351ea9f4718f2d2ef95231b327681f5130abdc6f40"
        },
        {
          "name": "price_check",
          "title": "Market price for a diamond spec",
          "description": "Typical listed prices for a spec (carat size, colour, clarity, shape, origin) across all retailers Carat Hunter tracks, with the day they were measured: median, middle-half range, and how much the same stone varies between retailers. Carat sizes: 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 5.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carat": {
                "enum": [0.3, 0.5, 0.75, 1, 1.5, 2, 3, 5],
                "type": "number"
              },
              "clarity": {
                "enum": ["FL", "IF", "VVS1", "VVS2", "VS1", "VS2", "SI1", "SI2"],
                "type": "string"
              },
              "colour": {
                "enum": ["D", "E", "F", "G", "H", "I", "J", "K"],
                "type": "string"
              },
              "origin": {
                "enum": ["natural", "lab-grown"],
                "type": "string"
              },
              "shape": {
                "enum": ["round", "oval", "cushion", "emerald", "pear", "princess", "radiant", "marquise", "asscher", "heart"],
                "type": "string"
              }
            },
            "required": ["carat", "clarity", "colour", "origin", "shape"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c590d29e22acf90b2b39d863edef7788ba4aff16866a8da3c734cd5c01ab3c17"
        },
        {
          "name": "search_diamonds",
          "title": "Search diamonds",
          "description": "Search certified diamonds listed by retailers worldwide, with the latest cross-retailer prices we have seen. Returns up to 10 stones with specs, the lowest and highest confirmed price for that exact stone with the date we last saw them, how many retailers list it and a Carat Hunter grade. Prices in US dollars. Retailer names are shown on carathunter.com after a free sign-up; always give the user the link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clarity": {
                "items": {
                  "enum": ["FL", "IF", "VVS1", "VVS2", "VS1", "VS2", "SI1", "SI2", "I1"],
                  "type": "string"
                },
                "type": "array"
              },
              "colour": {
                "description": "e.g. [\"E\",\"F\",\"G\"]",
                "items": {
                  "enum": ["D", "E", "F", "G", "H", "I", "J", "K", "L", "M"],
                  "type": "string"
                },
                "type": "array"
              },
              "max_carat": {
                "maximum": 30,
                "minimum": 0.1,
                "type": "number"
              },
              "max_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "min_carat": {
                "maximum": 30,
                "minimum": 0.1,
                "type": "number"
              },
              "min_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "origin": {
                "enum": ["natural", "lab-grown"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "shape": {
                "enum": ["round", "oval", "cushion", "emerald", "pear", "princess", "radiant", "marquise", "asscher", "heart"],
                "type": "string"
              },
              "sort": {
                "default": "best",
                "enum": ["best", "price_low", "price_high"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e497a7f79eebe13549e802ce16d48a0b6869a6e77e74d4d7f1f9a14c834b6e78"
        }
      ],
      "digest": "sha256:23b314dd805e9580f42af3cb2db092e87f7600cc2b95134f4a86b148963df10b"
    }
  }
}
