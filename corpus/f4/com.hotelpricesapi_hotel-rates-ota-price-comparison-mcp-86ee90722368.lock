      "instructions": "Query live global hotel prices, room availability, nightly rate breakdowns, cancellation terms, amenities, and verified guest reviews across 50+ pre-seeded global cities and worldwide destinations. Handshake and tools/list are free; pass x-api-key (hp_live_...) or OAuth 2.1 Bearer token for tools/call. Claim 3,000 Free Credits ($0.30) on sign-up — No Card Required at https://hotelpricesapi.com/signup.",
      "tools": [
        {
          "name": "compare_city_nightly_rates",
          "title": "Compare Top City Hotel Nightly Rates & Taxes for OTA Rate Shopping",
          "description": "Run a fast 10-hotel rate-shopper snapshot for any global city to benchmark base nightly rates, excluded local taxes/fees, all-inclusive totals, star ratings, and guest scores. Cost: 2 Credits / hotel returned.",
