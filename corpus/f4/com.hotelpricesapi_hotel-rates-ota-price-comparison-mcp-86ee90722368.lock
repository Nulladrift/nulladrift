            "additionalProperties": false,
            "properties": {
              "checkin": {
                "description": "Check-in date in YYYY-MM-DD format.",
                "type": "string"
              },
              "checkout": {
                "description": "Check-out date in YYYY-MM-DD format.",
                "type": "string"
              },
              "city": {
                "description": "Global city name (e.g. \"Paris\", \"London\", \"Tokyo\", \"New York\").",
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "3-letter ISO-4217 currency code for rate comparison (e.g. USD, EUR, GBP, JPY).",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "description": "0 on success, non-zero on error.",
                "type": "integer"
              },
              "data": {
                "description": "Normalized city hotel availability and nightly pricing payload.",
                "properties": {
                  "checkin": {
                    "description": "Check-in date (YYYY-MM-DD).",
                    "type": "string"
                  },
                  "checkout": {
                    "description": "Check-out date (YYYY-MM-DD).",
                    "type": "string"
                  },
                  "city": {
                    "description": "Resolved city name.",
                    "type": "string"
                  },
                  "count": {
                    "description": "Number of hotels returned in this page.",
                    "type": "integer"
                  },
                  "currency": {
                    "description": "ISO-4217 currency code for all prices.",
                    "type": "string"
                  },
                  "hotels": {
                    "description": "List of available hotels with nightly rates, taxes, ratings, and photos.",
                    "items": {
                      "properties": {
                        "currency": {
                          "description": "Price currency code.",
                          "type": "string"
                        },
                        "excluded_taxes": {
                          "description": "Excluded local taxes and mandatory fees.",
                          "type": "number"
                        },
                        "hotel_id": {
                          "description": "Canonical numeric hotel identifier.",
                          "type": "string"
                        },
                        "name": {
                          "description": "Property name.",
                          "type": "string"
                        },
                        "photo_url": {
                          "description": "Primary property photograph URL.",
                          "type": "string"
                        },
                        "price_per_night": {
                          "description": "Computed average nightly price.",
                          "type": "number"
                        },
                        "price_total": {
                          "description": "Total stay price in requested currency.",
                          "type": "number"
                        },
                        "review_count": {
                          "description": "Total verified guest review count.",
                          "type": "integer"
                        },
                        "review_score": {
                          "description": "Verified guest score (0–10 scale).",
                          "type": "number"
                        },
                        "stars": {
                          "description": "Official star classification.",
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "location_id": {
                    "description": "Canonical destination token.",
                    "type": "string"
                  },
                  "nights": {
                    "description": "Total number of nights in the stay window.",
                    "type": "integer"
                  },
                  "total_available": {
                    "description": "Total available hotels matched in the search.",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
