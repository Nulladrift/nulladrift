        {
          "name": "create_listing",
          "title": "Create listing",
          "description": "Submit an MCP server, skill or plugin for review. Free with an account; US$ 0.10 without one. Limit: one submission a day and three in the queue per owner. Automatic review approves supported low-risk MCP listings; uncertain cases wait for a person. Poll `status_api` (`GET /api/listings/:id/status`, no credential) to learn the decision. A person or agent can submit without an account for US$ 0.10, paid through x402 or prepaid credit; with an account, it is free. Each owner can submit once a day and keep up to three submissions in the queue. For a skill, provide its SKILL.md URL. The service checks the body and quota before charging. An invalid body returns 400; an exhausted quota returns 429.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Long description, optional.",
                "type": "string"
              },
              "category": {
                "description": "Category so the listing shows up under the right filter.",
                "type": "string"
              },
              "kind": {
                "description": "What is being registered.",
                "enum": ["mcp", "skill", "plugin", "okf"],
                "type": "string"
              },
              "name": {
                "description": "Display name; without it, taken from the source.",
                "type": "string"
              },
              "tagline": {
                "description": "One line saying what it is for.",
                "type": "string"
              },
              "url": {
                "description": "MCP endpoint, SKILL.md URL, the plugin's repository or the OKF bundle's `index.md`. For an OKF bundle on a domain you control, `POST /api/okf/ping` is free.",
                "type": "string"
              }
            },
            "required": ["kind", "url"],
            "type": "object"
          },
          "annotations": {
