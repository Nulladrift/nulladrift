          "description": "MCP subregistry (GET /v0.1/servers). Only live kind=mcp, verified servers first, seals in _meta. Only `kind=mcp` and only `live`, verified servers first, each with its seals in `_meta`. A generic MCP client reads it without knowing this product. `GET /v0/servers` is an alias of the same resource, kept for whoever already pointed there — this is the canonical URL.",
