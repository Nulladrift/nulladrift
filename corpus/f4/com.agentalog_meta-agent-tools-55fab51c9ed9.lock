        {
          "name": "list_listings",
          "title": "List listings",
          "description": "Public mosaic of live MCP servers, skills, plugins and OKF knowledge bundles. MCP servers with an active verification seal first (`verified`); `trusted=1` lists only them, and `warning` marks a page with listings that Agentalog does not check every day. Then `live` listings and the `low` tail (few stars or no clear license) after them in every order — `low=0` leaves the tail out. To walk everything, follow `next`: without `q` it is a cursor (`next_cursor`, keyset on the order's index) and has no ceiling; every listing also has an HTML page at `/l/:id` and the shards of `/sitemap-listings.xml` list them all. `q` runs on a full-text index (FTS5, bm25) kept in the same transaction as every text write. With `q` and `low=0`, `low_count` says how many `low` listings the filter left out — LIKE with a cap of 200. The query is mapped onto kind/topic/transport filters unless `interpret=0`.",
          "inputSchema": {
            "properties": {
              "added_since": {
                "description": "Catalog arrival on or after YYYY-MM-DD. This is not the original publication date.",
                "type": "string"
              },
              "all": {
                "description": "1: every listing, verified first (default). Same as trusted=0.",
                "enum": ["1"],
                "type": "string"
              },
              "api_pass": {
                "description": "MAT-only private pass: mat_<32 random hex>_<64 random hex>. Generate and save before buying.",
                "type": "string"
              },
              "category": {
                "description": "Category declared by whoever published.",
                "type": "string"
              },
              "has_code": {
                "description": "Whether a repository link is available. This does not certify the code.",
                "enum": ["0", "1"],
                "type": "string"
              },
              "interpret": {
                "description": "`0` disables query understanding and searches the raw string.",
                "enum": ["0"],
                "type": "string"
              },
              "kind": {
                "description": "Which kind of resource to fetch.",
                "enum": ["mcp", "skill", "plugin"],
                "type": "string"
              },
              "language": {
                "description": "Repository code languages, comma-separated. Preserve case, for example Python.",
                "type": "string"
              },
              "license": {
                "description": "Repository licenses, comma-separated, for example MIT,Apache-2.0. Preserve case.",
                "type": "string"
              },
              "low": {
                "description": "`0` leaves the `low` tail out; by default it comes after the `live` listings in every order.",
                "enum": ["0"],
                "type": "string"
              },
              "max_prs": {
                "description": "Maximum open pull requests of a repository with collected activity data.",
                "type": "string"
              },
              "min_forks": {
                "description": "Minimum forks of a repository with collected activity data.",
                "type": "string"
              },
              "min_prs": {
                "description": "Minimum open pull requests of a repository with collected activity data.",
                "type": "string"
              },
              "min_stars": {
                "description": "Minimum repository stars, from 0 to 999999999.",
                "type": "string"
              },
              "pushed_since": {
                "description": "Last repository code push on or after YYYY-MM-DD.",
                "type": "string"
              },
              "q": {
                "description": "Free text over the name, the tagline, the description, the origin identifier and the README excerpt: every word (up to six, 2+ letters, accents ignored) must match; ranked by bm25 with the name weighing most (10), then tagline (5), identifier (3), description (2), README excerpt (1); ties by stars. Kind, topic and transport words become filters. The `low` tail is in the same index.",
                "type": "string"
              },
              "retry_key": {
                "description": "Optional retry key, up to 80 ASCII characters; same read for five minutes.",
                "type": "string"
              },
