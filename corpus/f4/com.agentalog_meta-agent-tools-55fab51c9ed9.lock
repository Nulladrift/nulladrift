        {
          "name": "a2a_agent_search",
          "title": "A2a agent search",
          "description": "Find A2A agents — agents that publish an AgentCard — by text, health, protocol version, registry, skill tag or publisher. Each row carries the key for a2a_agent and the license of every registry that lists it. Collected from public A2A registries and served as it comes — no review queue hides a record; quality is the order, never visibility. One row per agent, merged across the registries that list it: `sources` says which, and `credits` carries each one's license, which travels with the data. Values inside one parameter are OR'd, different parameters are AND'd. Cached for 60 seconds. A MAT catalog read, served by the index host `https://api.agentalog.com`; this host forwards the call there.",
          "inputSchema": {
            "properties": {
              "api_pass": {
                "description": "MAT-only private pass: mat_<32 random hex>_<64 random hex>. Generate and save before buying.",
                "type": "string"
              },
              "fonte": {
                "description": "Only agents listed by this registry. Comma-separated values are OR'd (up to 12, each up to 200 characters).",
                "enum": ["a2a_registry", "a2a_global", "agenstry"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Items per page, 1–50; more is capped at 50, anything else means 20.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Offset, capped at 20000 (a larger value reads as 20000). Prefer `_links.next`.",
                "type": "integer"
              },
              "protocolo": {
                "description": "A2A protocol version as normalized (`0.3`, `1.0`…); `/api/a2a/facets` lists the ones present. Comma-separated values are OR'd (up to 12, each up to 200 characters).",
                "type": "string"
              },
              "publicador": {
                "description": "Exact publisher, as `publisher` shows it. Comma-separated values are OR'd (up to 12, each up to 200 characters).",
                "type": "string"
              },
              "q": {
                "description": "Substring of the name, description, key, publisher or the card's skills, in any letter case (`%` and `_` are taken literally); up to 80 characters.",
                "type": "string"
              },
              "retry_key": {
                "description": "Optional retry key, up to 80 ASCII characters; same read for five minutes.",
                "type": "string"
              },
              "saude": {
                "description": "Health the registries measured: `sim` answered, `nao` did not, `sem_medida` never measured. Comma-separated values are OR'd (up to 12, each up to 200 characters).",
                "enum": ["sim", "nao", "sem_medida"],
                "type": "string"
              },
              "skills": {
                "description": "`1` keeps only agents whose card lists at least one skill.",
                "enum": ["1"],
                "type": "string"
              },
              "tag": {
                "description": "Exact tag of the card's skills, case-sensitive; `/api/a2a/facets` lists the 40 most used. Comma-separated values are OR'd (up to 12, each up to 200 characters).",
                "type": "string"
              }
            },
            "type": "object"
          },
