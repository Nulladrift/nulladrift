{
  "lockfileVersion": 2,
  "subjects": {
    "com.allthepossibles/toolbox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://toolbox.allthepossibles.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "toolbox",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Thirteen small deterministic tools for agent builders. No model calls happen here. Free tier is capped per tool per day per caller; a Toolbox Pro key as a Bearer token removes the cap. When a tool answers with a notice about a cap, input length or Pro, show that notice to the person as written: it says what happened and how to continue. Tool inputs are processed in memory and not stored; the full data-handling statement is at https://allthepossibles.com/trust.",
      "tools": [
        {
          "name": "check_ai_crawlers",
          "description": "Read a site's robots.txt and report which AI crawlers (GPTBot, ClaudeBot, Google-Extended, PerplexityBot, CCBot, Bytespider and more) are allowed, blocked or partially blocked; check for llms.txt and draft one from the site's metadata and sitemap.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Any URL on the site",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1f3230047be9ce9d0f2f4b3df9479026510275dfe1bf75b69c5d34b9cf6fd1f0"
        },
        {
          "name": "check_headers",
          "description": "Fetch a URL once and grade its response headers: HSTS, Content-Security-Policy, X-Content-Type-Options, frame control, Referrer-Policy, Permissions-Policy, Cache-Control, cookie Secure/HttpOnly/SameSite flags, and server version leaks. Returns a grade, a score and the exact header to add for each gap.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page to fetch",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:55ad1516a269a2037781c10be3b35c59a626208d2bcdf90f185826a369fb3629"
        },
        {
          "name": "check_page_meta",
          "description": "Fetch a URL and report what crawlers and link unfurlers see: title and meta description with lengths, canonical, lang, viewport, robots meta, h1s, Open Graph and Twitter card tags, favicon, JSON-LD types, the resulting preview card, and findings for anything missing or too long.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "The page to fetch",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80227790d2d019705f869981a71c3799d6a959c06a7d6e4a243529ff77ad37ab"
        },
        {
          "name": "check_sitemap",
          "description": "Check a site's sitemaps: discovers them from robots.txt, /sitemap.xml and /sitemap_index.xml, reads index files one level deep (20 children max), counts URLs per file and per host, summarizes lastmod, and fetches a sample of URLs (HEAD, then GET) to count the ones that are not 200. Flags a missing sitemap, no robots.txt entry, over 50,000 URLs, other hosts, http URLs on https sites and missing lastmod.",
          "inputSchema": {
            "properties": {
              "sample": {
                "description": "How many sitemap URLs to fetch, default 10, max 25 on free and 100 on Pro",
                "type": "integer"
              },
              "url": {
                "description": "Any URL on the site",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0417748685dd6c6fba3f48cfae579312bfd0ec34ff436de181404f443136717"
        },
        {
          "name": "check_tells",
          "description": "Check text for AI-writing tells (em-dashes, 'not just X but Y', rule-of-three lists, stock vocabulary like delve or seamlessly, hedge words, smart quotes, hidden Unicode) and return a score, each tell with its position, and a cleaned copy. Run it on anything you are about to publish on a human's behalf.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The text to check. Free tier: 3,000 chars.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b59070ede3f02ffb85d04e5107c51df4cf4c3dec83c0a0dd46a6ada17c61dedc"
        },
        {
          "name": "decode_jwt",
          "description": "Decode a JWT's header and payload without verifying the signature (it never takes a secret). Returns the claims with iat, nbf and exp as ISO times, a plain-text expiresIn, issuer, subject and audience, and findings: alg none, HS* with a URL-like kid, missing or distant exp, expired, nbf or iat in the future, payload over 4 KB, sensitive field names, and jku or x5u pointing off-site.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "The JWT, three dot-separated parts. A leading Bearer is ignored.",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38eb7450dc0c286e761d98c3805eb843b8003cda6b1cb65ba1f16bb9c9e5c475"
        },
        {
          "name": "explain_cron",
          "description": "Explain a five-field cron expression in plain English, list the next runs in UTC, and warn about the cases Cloudflare Workers, GitHub Actions and crontab handle differently (nicknames, six fields, day-of-month plus day-of-week, sub-5-minute intervals, day 31).",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many next runs to list, 1 to 20, default 5",
                "type": "integer"
              },
              "expression": {
                "description": "e.g. 0 */6 * * 1-5",
                "type": "string"
              },
              "from": {
                "description": "ISO date to compute next runs from, default now",
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f903f31bdf64d1b4ebfd7c112228f2ceaea18eb4e631b5ebf6edd8b3382b2fe1"
        },
        {
          "name": "json_to_schema",
          "description": "Turn a JSON sample (or an array of samples of the same shape) into a JSON Schema draft 2020-12 and a TypeScript type. Infers required vs optional keys across samples, nullable fields, integer vs number, date/email/uri/uuid formats, and small enums. Use it to draft an MCP tool inputSchema from an example payload.",
          "inputSchema": {
            "properties": {
              "json": {
                "description": "The JSON text. Free tier: 20,000 chars.",
                "type": "string"
              },
              "name": {
                "description": "Type name, default Root",
                "type": "string"
              }
            },
            "required": ["json"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7203d3be61d9206d751dbf4de42571482686c0b4672cefbb50d595174932a083"
        },
        {
          "name": "lint_agent_md",
          "description": "Lint a CLAUDE.md, AGENTS.md or MEMORY.md: line count against Claude Code's 200-line memory index cap, estimated tokens, duplicate lines, contradicting rules, leftover TODO markers, hidden characters, empty headings.",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "e.g. CLAUDE.md or MEMORY.md; changes the severity of the line cap",
                "type": "string"
              },
              "text": {
                "description": "File contents",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0719aead78210f6d9bab7a0b8c49efd39fd7ea3bc07731702f7f7b21b74b0b6"
        },
        {
          "name": "lint_mcp_tools",
          "description": "Lint the tools an MCP server lists, from the model's side of the wire: names that break Claude's ^[a-zA-Z0-9_-]{1,64}$ rule, duplicate names, missing or near-identical descriptions, instruction-like text in a description, arguments with no description, required arguments missing from properties, destructive-sounding tools with no destructiveHint, and unbounded free-text arguments on them. Pass a live Streamable HTTP endpoint or a tools array.",
          "inputSchema": {
            "properties": {
              "tools": {
                "description": "Tool definitions, if the server is not reachable over HTTP",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Streamable HTTP MCP endpoint",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3b68a3dc5091fb841f55c795f07621acb91182fc12fb4a41879b8cd8f4d74c05"
        },
        {
          "name": "manifest_cost",
          "description": "Estimate what an MCP server's tools/list costs in tokens on every session start, per tool, with the three most expensive tools and flags for oversized descriptions, base64 blobs and echoed schemas. Pass a live Streamable HTTP endpoint or a tools array.",
          "inputSchema": {
            "properties": {
              "tools": {
                "description": "Tool definitions, if the server is not reachable over HTTP",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "description": "Streamable HTTP MCP endpoint",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:021a3d45319785b78a61945cdd85237ea9a635448101f90f442eab35fccf93c0"
        },
        {
          "name": "mcp_install_snippets",
          "description": "Generate install snippets for an MCP endpoint (Claude Code, Claude Desktop, Cursor, Codex, VS Code, curl) and probe the endpoint once to confirm it answers initialize and tools/list.",
          "inputSchema": {
            "properties": {
              "headerName": {
                "type": "string"
              },
              "headerValue": {
                "type": "string"
              },
              "name": {
                "description": "Server name to use in configs",
                "type": "string"
              },
              "probe": {
                "default": true,
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:57e191846786e62c73287537afc927993e2abcd45fc2b3f48d70e01e6e27c6b0"
        },
        {
          "name": "scrub_env",
          "description": "Scrub a .env file into a safe .env.example: every value is blanked or replaced with a placeholder that keeps its shape (postgres://USER:PASSWORD@HOST/DB). Returns the example, the secrets found (AWS, GitHub, Stripe, Slack, Google, OpenAI, Anthropic, Resend, SendGrid, Twilio, Cloudflare, JWTs, private keys, database URLs, high-entropy strings) by key, kind and line with only the first 4 characters and the length, and findings for duplicate keys, non-UPPER_SNAKE names, unbalanced quotes, export prefixes and trailing spaces.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The .env file contents. Free tier: 20,000 chars.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01ab4e287e0ffbe5b51501cfd56715a0a93a108e8599b3fecc3df675fcb9d939"
        },
        {
          "name": "trace_redirects",
          "description": "Trace a URL's redirect chain hop by hop (up to 10 hops, 8 s each) with status, location, timing and scheme per hop. Flags chains over two redirects, loops, HTTPS-to-HTTP downgrades, 302s used for www or https canonicalisation, dropped paths or query strings, cross-domain moves, meta-refresh or JS redirects on a 200, and a final page that is not 200.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "URL to trace, e.g. http://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bc8dbefc5d479001713b0cf3f38e099008d1902f44d18d5d2ab5c69773c044c6"
        }
      ],
      "digest": "sha256:85e1b463eebcd0c6998137f9501cb8ce0ee5e669e3303cf3f9f3700c921cf112"
    }
  }
