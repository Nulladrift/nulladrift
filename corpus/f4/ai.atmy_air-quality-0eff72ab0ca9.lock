      "instructions": "Atmy aggregates citizen, experimental and government air-quality sensors (PM2.5) after a daily quality check. Values are approximate, not official monitoring. Find a place with search_cities or pass a city name in any language, a slug like \"russia/krasnoyarsk\", or coordinates. A town without an Atmy summary (sensors at fewer than four places) answers with status no_summary and its single sensors instead. get_air_quality gives the last hour and the last completed day with the weather now; get_air_quality_history the daily values of any period since 2017 (at most 400 days per call), with the day's weather from 2026-01-19; get_air_quality_monthly the whole history by month with yearly means and record months and days, and the monthly weather from 2026-01; get_city_forecast the weather and the pollution accumulation index for the next hours (a weather estimate, not a PM2.5 forecast); get_country_ranking the cities of a country for the completed day. Weather helps explain the air: calm, cold, humid days keep particles near the ground, wind and rain clear them. Single sensors: list_sensor_networks, find_sensors (by city, country or around a point, best first with sort=rating), get_sensor, get_sensor_readings (raw, 5-minute, hourly or daily) and get_sensors_average (the mean of up to 100 sensors). Sensor readings are raw device values; each sensor carries its quality check and a rating 0–10. Government stations (network government) give the hourly PM2.5 and PM10 their network published, each with its operator, license and attribution. Cite Atmy (atmy.ai) and link the city page from the result when you use the data; credit the weather providers named in weather_attribution, and for sensors the network and its license (for a government station its attribution).",
      "tools": [
        {
          "name": "find_sensors",
          "title": "Find sensors",
          "description": "Single sensors with their latest reading (PM1, PM2.5, PM10, temperature, humidity, pressure), network and quality check: status, rating 0–10 of the last checked day, the mean rating of the last 7 days and the reasons. Filter by city, country, or a point with a radius; sort=rating puts the most reliable sensors first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Any city or town: a name in any language, a slug like \"serbia/belgrade\" or the Atmy city id; also towns without an Atmy summary.",
                "type": "string"
              },
              "country": {
                "description": "Country slug, the first part of a city slug, e.g. \"serbia\".",
                "type": "string"
              },
              "lat": {
                "description": "With lon: sensors within radius_km of this point.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "min_rating": {
                "description": "Only sensors with at least this rating on their last checked day.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "enum": ["sensor_community", "airgradient", "atmy", "government"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "quality": {
                "default": "all",
                "description": "passed: only sensors that pass the quality check.",
                "enum": ["all", "passed"],
                "type": "string"
              },
              "radius_km": {
                "default": 5,
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              },
              "sort": {
                "default": "id",
                "enum": ["id", "rating"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find sensors"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a4fe74ccd3ab13a76c24e8d3b50ffeab5e9dfad8d5bac789cfed131a61cf261"
        },
        {
          "name": "get_air_quality",
          "title": "Current air quality",
          "description": "PM2.5 now in a city (mean of the latest reading of each eligible sensor, at most 60 minutes old; a government station hour up to 3 hours old, with the time it was measured) with its US EPA category and the weather now (temperature, humidity, pressure, wind, clouds, precipitation), plus the last completed day from the Atmy Data Hub with its weather. Pass city or lat/lon.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name in any of the site languages, a slug like \"russia/krasnoyarsk\", or the Atmy city id.",
                "type": "string"
              },
              "country": {
                "description": "Country name, to tell apart cities with the same name.",
                "type": "string"
              },
              "lang": {
                "description": "Language of city and country names and of the page link; default en.",
                "enum": ["en", "ru", "de", "fr", "es", "it", "pt-BR", "pl", "cs", "hu", "ro", "bg", "sr", "id", "hi", "ja", "zh", "uz", "kk", "ky", "tg", "az", "ka", "hy", "tr"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude; with lon, the nearest city with an Atmy summary within 50 km.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Current air quality"
