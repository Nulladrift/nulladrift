                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First day YYYY-MM-DD (2017-01-01 or later).",
                "format": "date",
                "type": "string"
              },
              "lang": {
                "description": "Language of city and country names and of the page link; default en.",
                "enum": ["en", "ru", "de", "fr", "es", "it", "pt-BR", "pl", "cs", "hu", "ro", "bg", "sr", "id", "hi", "ja", "zh", "uz", "kk", "ky", "tg", "az", "ka", "hy", "tr"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude; with lon, the nearest city with an Atmy summary within 50 km.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "to": {
                "description": "Last day YYYY-MM-DD; default the last completed day.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
