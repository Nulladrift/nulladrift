      "serverInfo": {
        "name": "com.kareverse/kareverse",
        "title": "Kareverse",
        "version": "1.0.0",
        "description": "Elder care at home in Bangalore, India: services, prices, Care Plan, areas and callback requests.",
        "websiteUrl": "https://www.kareverse.com/agents",
        "icons": [
          {
            "src": "https://www.kareverse.com/kareverse-logo-mob.webp",
            "mimeType": "image/webp"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kareverse provides elder care at home in Bangalore (Bengaluru), India, for families including NRI children living abroad. Use search_services and get_service for services and prices, get_care_plan for the monthly Care Plan, check_service_area for coverage, search_guides for articles, and get_contact_info for contact details. Prices are in Indian rupees (INR), as of November 2026; always share the service's url so the family can check the current price and book. submit_enquiry records a callback request that the person must then confirm on WhatsApp; Kareverse only contacts people who confirm. Only call it after the person has seen the privacy notice (https://www.kareverse.com/privacy), explicitly agreed to be contacted and given their own name and phone number; never invent details. It may be temporarily unavailable: then give the WhatsApp number instead. Kareverse gives no medical advice and is not an emergency service: in a medical emergency in India, tell the person to call 108 or 112.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check service area",
          "description": "Check whether Kareverse covers a locality or pincode in Bangalore (e.g. 'Whitefield', 'HSR Layout', '560066'), or list all service areas when locality is empty.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locality": {
                "description": "Locality, area or pincode in Bangalore.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Service area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fc6ba819ccd858d4da6f5434e39ea598c4adbdb09112eb332c68e9c821f3b68"
        },
        {
          "name": "get_care_plan",
          "title": "Get the Kareverse Care Plan",
          "description": "The monthly Kareverse Care Plan (a dedicated Care Manager, monthly home visit, weekly check-in, 24/7 emergency support): what it includes, monthly/quarterly/annual prices, and condition programmes such as dementia and Parkinson's care.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Care Plan"
          },
          "behavior": {
            "destructive": false,
