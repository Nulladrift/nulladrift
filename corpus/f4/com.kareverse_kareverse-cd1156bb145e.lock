            "readOnly": true
          },
          "digest": "sha256:6d55a532e621601c810cf85879fc2dc12b1d2e55c5ee4614997932c2bb6219b8"
        },
        {
          "name": "get_contact_info",
          "title": "Get contact details",
          "description": "Kareverse's phone/WhatsApp, email, working hours and office address, plus the service categories.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Contact details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8eae80ca3c4545617845b8e547872e09f15d8ec10e8954944d76a9b1188f890a"
        },
        {
          "name": "get_service",
          "title": "Get service details",
          "description": "Full details of one Kareverse service by id (from search_services): what is included and not included, price options, notice needed, FAQs and how to book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Service id, e.g. 'hospital-accompaniment'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get service"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3efc468508067a906ee279720ff650b3b43a1f8592b8b2418f987fb046b131e"
        },
        {
          "name": "search_guides",
          "title": "Search care guides",
          "description": "Search Kareverse's published guides for families caring for elderly parents (costs, caretakers, dementia, falls, hospital discharge, NRI care, Karnataka schemes). Returns titles, summaries and URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic, e.g. 'caretaker cost' or 'dementia at home'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:edb0b66c2e3a02687f9493cafaa390ad02b3bd994fbb3031acabc4c02af9b41d"
        },
        {
          "name": "search_services",
          "title": "Search Kareverse services",
          "description": "Search Kareverse's elder-care services in Bangalore by need (for example 'hospital visit', 'injection at home', 'night caretaker', 'physiotherapy after stroke'). Returns matching services with price, Care Plan member price and page URL. Leave query empty to list a category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category: genie (accompaniment and errands), nursing, caretakers, doctor-therapy, health-checks, condition-care.",
                "enum": ["genie", "nursing", "caretakers", "doctor-therapy", "health-checks", "condition-care"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the family needs, in plain words.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbb7c02d3cad0d919f52f82ea88cd4cdf515d6e88c373d65eee2fbfbff5cef68"
        },
        {
          "name": "submit_enquiry",
          "title": "Request a callback from Kareverse",
          "description": "Record a callback request for the Kareverse team. The result contains a WhatsApp link the person must open and send to confirm; Kareverse only contacts people who confirm. Use only after the person has seen Kareverse's privacy notice (https://www.kareverse.com/privacy), explicitly agreed to be contacted, and given their OWN name and phone number; set consent to true to confirm that. Never use it for someone else's number or for emergencies. May be temporarily unavailable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent": {
                "description": "True only if the person saw the privacy notice and agreed that Kareverse may contact them about this enquiry.",
                "type": "boolean"
              },
              "email": {
                "description": "Optional email address.",
                "type": "string"
              },
              "message": {
                "description": "Short background, in the person's words.",
                "maxLength": 1000,
                "type": "string"
              },
              "name": {
                "description": "Name of the person Kareverse should contact.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "parent_area": {
                "description": "Where the parent lives in Bangalore.",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Their phone or WhatsApp number, with country code (e.g. +91 98765 43210 or +1 415 555 0100).",
                "type": "string"
              },
              "service_interest": {
                "description": "What they need, e.g. 'Care Plan', 'Hospital accompaniment', 'Night caretaker'.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["consent", "name", "phone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a callback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:efcffa57842ac1276766d64a9d5e8c58f1133ba6ed56f2c0a913a40a6c4b6f06"
        }
      ],
