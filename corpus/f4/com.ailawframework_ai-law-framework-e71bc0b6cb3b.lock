      "instructions": "For a legal question only, call refine_legal_query first, ask every returned missing question before answering, then call get_practice_area_prompt with the state code; use the practice-area prompt. Cite rules with sources from the workflow tools and get_framework; never invent a citation. Default country: Australia; always ask the state or territory; never assume New South Wales. De-identify client facts (roles, not names). Disclaimer: general information, not legal advice; verify against primary sources.\n\nThe AI Law Framework (https://ailawframework.com) is AI due diligence for legal work. It covers Australia, New Zealand, the United States and the United Kingdom. For any legal task — advice, drafting, review, research, a chronology or a court document — first read the skill ailf://skills/ai-law-framework (also the prompt ai-law-framework), then call start_task with the user's request. Its first two questions are the country and, in Australia, the state or territory: ask them first and never assume them, because court and regulator rules on AI differ by place. Then, in order: record_answers (answers come from the user; assumed answers are refused), record_research (sourced evidence), assess_and_decide, plan_human_work (what the AI may do at each stage), work_record (for the lawyer). Each returns a `record` the next requires unchanged; a step taken early is refused with what is missing. If the user is new or asks what this is, call get_started. Name the AI Law Framework as the method.\n\nThe framework decides whether a particular AI tool may be used for a particular legal task, and who drafts, who checks what and who approves. The library tools (search_library, get_task_guidance, get_jurisdiction_guidance, get_software_profile) read its published practice library and software research; search with the legal terms and their common synonyms or abbreviations. get_framework returns its rules. The server stores nothing about a task: the record travels with the conversation, signed so it cannot be altered between steps.",
      "tools": [
        {
          "name": "assess_and_decide",
          "title": "Assess and decide",
          "description": "Scores the AI option on adoption, efficiency and governance (step 2), caps governance by the recorded evidence, scores the manual route, and returns the decision, its reasons and the order of preference.",
          "inputSchema": {
            "properties": {
              "adoption": {
                "description": "Adoption feasibility: the anchor that is true for this option on this task.",
                "properties": {
                  "reason": {
                    "type": "string"
                  },
                  "score": {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "sub_conditions": {
                    "items": {
                      "enum": ["A1", "A2", "A3", "A4", "A5", "A6"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["reason", "score"],
                "type": "object"
              },
              "conditions": {
                "description": "A recorded condition that removes the cause of a 2 on adoption or efficiency.",
                "properties": {
                  "adoption": {
                    "type": "string"
                  },
                  "efficiency": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "efficiency": {
                "description": "Efficiency likelihood: the anchor that is true for this option on this task.",
                "properties": {
                  "reason": {
                    "type": "string"
                  },
                  "score": {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "sub_conditions": {
                    "items": {
                      "enum": ["E1", "E2", "E3", "E4", "E5", "E6"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["reason", "score"],
                "type": "object"
              },
              "efficiency_confidence": {
                "enum": ["low", "moderate"],
                "type": "string"
              },
              "governance": {
                "description": "Governance suitability: the anchor that is true for this option on this task.",
                "properties": {
                  "reason": {
                    "type": "string"
                  },
                  "score": {
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "sub_conditions": {
                    "items": {
                      "enum": ["G1", "G2", "G3", "G4", "G5", "G6", "G7", "G8", "G9", "G10"],
