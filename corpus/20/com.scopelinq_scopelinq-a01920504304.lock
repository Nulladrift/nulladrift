{
  "lockfileVersion": 2,
  "subjects": {
    "com.scopelinq/scopelinq": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.scopelinq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "scopelinq",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ScopeLinq answers one question: what did we actually agree to? draft_scope_record reads a document into the terms it states. check_scope_change answers whether a new request is Included, Additional work, or Needs clarification, citing only lines the person confirmed. Always let the person confirm the lines before checking. Never treat not_found_in_text lines as agreed unless the person says so. Free, no account.",
      "tools": [
        {
          "name": "check_scope_change",
          "title": "Check a request against what was agreed",
          "description": "Answers whether a new request is Included, Additional work, or Needs clarification, citing one of the confirmed lines. Only pass lines the person has confirmed were agreed. Never pass lines from not_found_in_text unless the person confirmed them, and never pass the original document — there is no field for it. If no lines have been confirmed yet, call draft_scope_record first and ask the person. Works for whoever sent the document or whoever received it. Free, no account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirmed_lines": {
                "description": "Lines the person confirmed were agreed — from draft_scope_record, or in their own words.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "headline": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["headline"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "request_text": {
                "description": "The new request, in the words it was made.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["confirmed_lines", "request_text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cited_line": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "headline": {
                        "type": "string"
                      },
                      "index": {
                        "type": "integer"
                      },
                      "quote": {
                        "type": "string"
                      }
                    },
                    "required": ["headline", "index", "quote"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "confidence": {
                "type": "integer"
              },
              "label": {
                "enum": ["Included", "Additional work", "Needs clarification"],
                "type": "string"
              },
              "rationale": {
                "type": ["string", "null"]
              },
              "suggested_reply": {
                "type": ["string", "null"]
              },
              "verdict": {
                "enum": ["covered", "new_request", "needs_clarification"],
                "type": "string"
              }
            },
            "required": ["cited_line", "confidence", "label", "rationale", "suggested_reply", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ad8e5fe95654e708f74dde5f0940c5931384f135e4ac82816121392d9b6d0048"
        },
        {
          "name": "draft_scope_record",
          "title": "Read what was agreed",
          "description": "Reads a proposal, quote, estimate, contract, or email thread and returns the terms it actually states, each traced to the words it came from. Works for whoever sent the document or whoever received it. Pass the text exactly as written — do not summarise it first. Remove names, email addresses and account numbers before pasting. Returns two lists: `lines` (found in the text) and `not_found_in_text` (things the text does not clearly say). Show both to the person and ask which lines they agree were agreed, then call check_scope_change with only those. The text is processed by an AI model to produce the lines and is deleted within 24 hours. Free, no account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agreement_text": {
                "description": "The proposal, quote, estimate, contract, or thread, pasted as written.",
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["agreement_text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confidence": {
                "type": ["number", "null"]
              },
              "format": {
                "const": "scopelinq-record",
                "type": "string"
              },
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "anchor_score": {
                      "type": ["number", "null"]
                    },
                    "category": {
                      "type": "string"
                    },
                    "headline": {
                      "type": "string"
                    },
                    "source_span": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["anchor_score", "category", "headline", "source_span"],
                  "type": "object"
                },
                "type": "array"
              },
              "lines_hash": {
                "type": "string"
              },
              "next_step": {
                "type": "string"
              },
              "no_terms": {
                "type": "boolean"
              },
              "not_found_in_text": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "anchor_score": {
                      "type": ["number", "null"]
                    },
                    "category": {
                      "type": "string"
                    },
                    "headline": {
                      "type": "string"
                    },
                    "source_span": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["anchor_score", "category", "headline", "source_span"],
                  "type": "object"
                },
                "type": "array"
              },
              "parties": {
                "type": "null"
              },
              "status": {
                "const": "draft",
                "type": "string"
              },
              "version": {
                "const": "1",
                "type": "string"
              }
            },
            "required": ["confidence", "format", "lines", "lines_hash", "next_step", "not_found_in_text", "parties", "status", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c9fc10b1c9652e6e8589202152b369929b99ad9fb7f4bc170d4de2d458257dd4"
        }
      ],
      "digest": "sha256:4f767bcc8b70593ef4258016ac9e68ce2937cdce58ba8107a01a06150f2955fc"
    }
  }
}
