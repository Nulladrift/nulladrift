{
  "lockfileVersion": 2,
  "subjects": {
    "com.prognyx/oncology-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.prognyx.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "prognyx",
        "title": "Prognyx oncology intelligence",
        "version": "1.0.0",
        "websiteUrl": "https://www.prognyx.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prognyx gives source-linked oncology competitive intelligence. Use compare_trials to set up to three registry studies around an asset or target in one indication side by side, search_registry for the wider trial landscape of a target, company, indication or NCT number, and search_briefings for Prognyx analyses of recent oncology events. Every study carries its ClinicalTrials.gov URL; cite it. Only public research terms are accepted: never send confidential programme names or personal data.",
      "tools": [
        {
          "name": "compare_trials",
          "title": "Compare trials around an asset",
          "description": "Up to three interventional ClinicalTrials.gov studies matching an asset or target AND an oncology indication, side by side: sponsor, phase, status, declared arms, primary outcomes, last update, registry URL. Active studies first, then later phase; different sponsors where possible. Use a target (e.g. \"KIF18A\", \"B7-H3\") rather than one drug name to see other programmes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Public asset or target, e.g. \"sotorasib\", \"KRAS G12C\", \"B7-H3\".",
                "maxLength": 80,
                "type": "string"
              },
              "indication": {
                "description": "Oncology indication, e.g. \"colorectal cancer\", \"NSCLC\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["asset", "indication"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare trials around an asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cf19c8ae2758ed8266df2f27164c1325f34f4c5418a3a322bd79ef2016c84ae3"
        },
        {
          "name": "search_briefings",
          "title": "Search Prognyx briefings",
          "description": "Prognyx oncology competitive-intelligence briefings (each claim linked to a primary source) matching a drug, company, target or indication, newest first, with URL, date and summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Briefings to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Drug, company, target or indication. Empty returns the latest.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Prognyx briefings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33c34956858f241e82709cdcc7b3c2f046eead05aa9654ede265d81ea0a94489"
        },
        {
          "name": "search_registry",
          "title": "Search the oncology trial registry",
          "description": "Live landscape for a target, asset, company, indication or NCT number: total and active study counts, leading sponsors, phase mix, the most recently updated studies with URLs, and related Prognyx briefings. Counts for phases and sponsors come from a recent sample, stated in the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Studies to return.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "e.g. \"KRAS G12C\", \"Nuvalent\", \"claudin 18.2 gastric cancer\", \"NCT05132075\".",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search the oncology trial registry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:423df2fd4d424ec2d32467c53a2ff64f60cc4bca68ec449a267b19d28192c639"
        }
      ],
      "digest": "sha256:01b75a5a7add2c5533d43a1da0dfe3c74cc99d7defaa4993fe555b39d400cae2"
    }
  }
}
