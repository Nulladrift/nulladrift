      },
      "instructions": "Pipe2.ai MCP Server: create and edit videos, images and audio with AI pipelines. Discover pipelines with list_pipelines and their inputs with get_pipeline_schema. Check the price with estimate_pipeline_cost, start a run with run_pipeline and get its result with wait_for_pipeline_run. Pipelines compose: pass a run's output assets by ID as inputs to the next pipeline.",
      "tools": [
        {
          "name": "cancel_pipeline_run",
          "description": "Stop a pending or running pipeline run. Credits for work that did not happen are returned; work already finished may still be charged. A run that has already finished cannot be cancelled.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "The pipeline run ID returned by run_pipeline",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "success": {
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:353fad1c80f0385c615b7a779b0c4b7271b8e1969e56a78ce53ca8231340ce2d"
        },
        {
          "name": "estimate_pipeline_cost",
          "description": "Estimate the credits a pipeline run would cost before running it, with the same input you would pass to run_pipeline. Returns estimated_mc (the expected charge, in millicredits; 1000 = 1 credit), reservation_mc (what the run holds when it starts) and, for automatic model choice, the model it would route to. A run that holds its credits step by step also returns ceiling_mc, the most it can hold in total: it stops when the credits run out and keeps what it finished. Use it to confirm the cost with the user before a paid run or a multi-step chain.",
          "inputSchema": {
            "properties": {
              "input": {
                "description": "Pipeline input fields as a JSON object, as for run_pipeline. Unfinished inputs still return a price where the pipeline allows it.",
                "properties": {},
                "type": "object"
              },
              "pipeline_slug": {
                "description": "The slug identifier of the pipeline (e.g., 'video-cut', 'image-generator')",
                "type": "string"
              }
            },
            "required": ["input", "pipeline_slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ceiling_mc": {
                "type": "integer"
              },
              "estimate_is_partial": {
                "type": "boolean"
              },
              "estimated_mc": {
                "type": "integer"
              },
              "incompatible_models": {},
              "is_metered": {
                "type": "boolean"
              },
              "length_unknown": {
                "type": "boolean"
              },
              "model_input_schema": {},
              "pipeline_slug": {
                "type": "string"
              },
              "reservation_mc": {
                "type": "integer"
              },
              "routed_model": {
                "type": "string"
              },
              "routed_reason_code": {
                "type": "string"
              },
              "routed_reason_params": {}
            },
            "required": ["ceiling_mc", "estimate_is_partial", "estimated_mc", "incompatible_models", "is_metered", "length_unknown", "model_input_schema", "pipeline_slug", "reservation_mc", "routed_model", "routed_reason_code", "routed_reason_params"],
            "type": "object"
