        },
        {
          "name": "use_captions",
          "description": "Guide for using the AI Captions pipeline — Burn word-by-word captions into a video, in the style and colours you pick. The speech is transcribed for you, or attach your own SRT. Translate it into another language before burning.",
          "arguments": [
            {
              "name": "video_url",
              "description": "One video to burn captions into, up to 30 minutes. MP4, MOV, or WebM.",
              "required": true
            }
          ],
          "digest": "sha256:6ba5d62935ff44f5ae004588efccbb8c89066020228d5e9cdf34166cd584abb8"
        },
        {
          "name": "use_footage_search",
          "description": "Guide for using the Footage Search pipeline — Find stock video for B-roll, establishing shots and backgrounds. Receive links to clips from Pexels and Pixabay.",
          "arguments": [
            {
              "name": "query",
              "description": "Describe the footage you need",
              "required": true
            }
          ],
          "digest": "sha256:696a011f747aaa58ff80919302d5b5e49ce604d8b68210709e6c41088bb8742d"
        },
        {
          "name": "use_image_editor",
          "description": "Guide for using the Image Editor pipeline — Edit any image with AI. Change style, remove objects, modify elements, or transform the entire look.",
          "arguments": [
            {
              "name": "image_urls",
              "description": "Upload one image to edit it on its own or several to combine them into one result. Grok Imagine accepts up to 3, Grok Imagine Image 2.0 up to 5, and Gemini models up to 14.",
              "required": true
            },
            {
              "name": "instructions",
              "description": "What to change, in plain language — the edit is applied to the whole image.",
              "required": true
            }
          ],
          "digest": "sha256:6902d3d288f88a7fd4dc7536677a1a929fff15c30bfa985c7682c40af43c3df2"
        },
