      "instructions": "Pipe2.ai MCP Server: create and edit videos, images and audio with AI pipelines. Discover pipelines with list_pipelines and their inputs with get_pipeline_schema. Check the price with estimate_pipeline_cost, start a run with run_pipeline and get its result with wait_for_pipeline_run. Pipelines compose: pass a run's output assets by ID as inputs to the next pipeline.",
      "tools": [
        {
          "name": "cancel_pipeline_run",
          "description": "Stop a pending or running pipeline run. Credits for work that did not happen are returned; work already finished may still be charged. A run that has already finished cannot be cancelled.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "The pipeline run ID returned by run_pipeline",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "success": {
                "type": "boolean"
              }
            },
            "required": ["success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
