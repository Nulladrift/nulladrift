        {
          "name": "use_background_remover",
          "description": "Guide for using the AI Background Remover pipeline — Remove the background and get a transparent PNG. Cut out the subject as is, or let AI refine it.",
          "arguments": [
            {
              "name": "image_url",
              "description": "Upload one image to remove its background. PNG, JPEG, WebP, GIF, HEIC, or HEIF; up to 20 MB.",
              "required": true
