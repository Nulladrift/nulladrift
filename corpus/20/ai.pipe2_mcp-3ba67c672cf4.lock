        {
          "name": "request_upload",
          "description": "Request a presigned S3 upload URL for a file. Use this for pipeline inputs that require file URLs (e.g., images, videos, audio).\n\n**Two-step upload flow:**\n1. Call this tool with filename and content_type to get a presigned upload URL and final asset URL\n2. PUT the file contents to the upload_url (presigned, expires in 5 minutes)\n3. Use the asset_url as the input value when running a pipeline\n\nSupported content types: image/* (max 10MB), video/* (max 50MB), audio/* (max 20MB)",
          "inputSchema": {
            "properties": {
              "content_type": {
                "description": "MIME type of the file (e.g., 'image/jpeg', 'image/png', 'video/mp4', 'audio/mpeg')",
                "type": "string"
              },
              "filename": {
                "description": "Name of the file to upload (e.g., 'photo.jpg', 'video.mp4')",
                "type": "string"
              }
            },
            "required": ["content_type", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asset_url": {
                "type": "string"
              },
              "key": {
                "type": "string"
              },
              "upload_url": {
                "type": "string"
              }
            },
            "required": ["asset_url", "key", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
