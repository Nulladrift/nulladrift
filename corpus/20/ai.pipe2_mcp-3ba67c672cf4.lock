      "prompts": [
        {
          "name": "use_audio_generator",
          "description": "Guide for using the Audio Generator pipeline — Turn text into natural speech with dozens of voices, 70+ languages, and custom style directions for tone, accent, and pacing.",
          "arguments": [
            {
              "name": "text",
              "description": "Text to convert to speech.",
