        {
          "name": "use_product_shots",
          "description": "Guide for using the Product Shots pipeline — Turn one product photo into a full marketplace-ready shoot, white background, lifestyle, gradient studio, in-use, and outdoor variants.",
          "arguments": [
            {
              "name": "product_image",
              "description": "URL of the source product photo. One shot is enough, the AI preserves product shape, color, and branding and only changes the background.",
              "required": true
            },
            {
              "name": "environments",
              "description": "Array of 1-7 environments to generate. white_background is an Amazon-compliant main image (pure white, 85% product fill). lifestyle is an aspirational real-world scene. in_use shows hands holding or using the product. detail_closeup is a macro texture shot. scale_reference shows the product next to a hand or common object. gradient_studio is a premium ad-creative backdrop. outdoor is a natural environment for ad creative. A strong marketplace set combines white_background, lifestyle, scale_reference, detail_closeup, and in_use; use gradient_studio and outdoor for ads and brand imagery. You pay per environment selected.",
              "required": true
            }
          ],
          "digest": "sha256:501f544b1b0d3b1a0295129ba4815a1d46b094c6726578539fc23e2463ca8cb6"
        },
