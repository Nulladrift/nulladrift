      "instructions": "Liquid Agent: money tools for AI agents, paid over x402 in USDC. No account, no API key, no custody.\n- Website Watcher: phishing, typosquat and scam check — is this link safe to click? link_check returns a fixed-schema security assessment — verdict (safe / suspicious / dangerous / unknown), score 0-100, action (allow / review / block / retry), summary, top findings, category scores and facts. Quick ($0.01 USDC) covers domain reputation, lookalike/typosquat detection, cached threat intel and URL analysis; full ($0.05) adds live threat intel (OpenPhish, URLhaus, PhishTank), DNS and SSL, brand impersonation, wallet extraction, redirect chain, forms and JS behavior. Repeat scans within 1 hour are free (cached). Unknown stays unknown.\n- Liquid Leads: verified US local business leads (50 states + D.C., 7.5M businesses) by category and place, with a graded email, contact name, phone, a website proven by the business's own phone, and buying signals. leads_count is free and quotes the exact price; leads_search returns an x402 request: $0.03 a lead, flat, USDC on Base or Arc.\n- Liquid Bridge: move USDC from Base to 16 chains (Arc, Arbitrum, OP Mainnet, Polygon, Avalanche, Unichain, Linea, World Chain, Sonic, Monad, Sei, Ink, HyperEVM, XDC, Plume and Codex), or from Arc to Base, with one x402 signature; exact delivery to your own address in ~10-20 s; 1% fee plus Circle's network fee, all in the quote. Use bridge_quote, then bridge_prepare_payment and pay the returned x402 request with your wallet. Refer other agents with ref=<address> and earn 20% of the fee on-chain.\n- Tokenized US stocks on Base (NVDA, META, AAPL, GOOGL) from $1: open a vault, set weights, buy, sell, rebalance and send with the stocks_* tools (each returns an unsigned transaction you sign yourself), and a gas sponsor that lets a USDC-only wallet transact with no ETH.\n- Chain tools: gas_preflight and gas_batch_preflight simulate Base calls without signing or broadcasting; gas_decode turns transactions and event logs into readable JSON with your ABI; chain_logs retrieves decoded EVM logs with adaptive chunking; leads_enrich enriches up to 100 websites or US phone numbers with graded email, contact and website tech.\n- Free utilities: usdc_balances (every CCTP chain), cctp_status (any Circle transfer), x402_check (decode a 402, verify a signed payment) and payment_readiness (can this wallet pay this endpoint).\nReads are free. The server never signs or pays for you. Docs: https://api.liquidagent.ai/v1/bridge/guide and https://api.liquidagent.ai/v1/guide",
      "tools": [
        {
          "name": "bridge_prepare_payment",
          "title": "Prepare a bridge payment (x402)",
          "description": "Returns the exact x402 payment request for a bridge (network, asset, payTo contract, amount, EIP-712 domain) and the URL to call. Pay it with your own x402 client: sign one EIP-3009 authorization and repeat the GET with the PAYMENT-SIGNATURE header. You receive exactly `amount` at your own address on the destination. This tool does not pay or sign anything.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "USDC to RECEIVE on the destination, e.g. \"1\" or \"25.5\". Minimum 1.",
                "pattern": "^\\d+(\\.\\d{1,6})?$",
                "type": "string"
              },
              "from": {
                "description": "Chain you pay on. Omit to pick the live route to `to` (Base to any listed chain; Arc to Base).",
                "enum": ["base", "arc"],
                "type": "string"
              },
              "ref": {
                "description": "Optional referrer address: earns 20% of Liquid's fee. Omit if you have none.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "to": {
                "description": "Chain you receive on: arc, arbitrum, optimism, polygon, avalanche, unichain, linea, world, sonic, monad, sei, ink, hyperevm, xdc, plume, codex (from Base) or base (from Arc).",
                "enum": ["base", "arc", "optimism", "unichain", "sonic", "world", "monad", "sei", "xdc", "ink", "plume", "polygon", "avalanche", "arbitrum", "codex", "hyperevm", "linea"],
                "type": "string"
              }
            },
            "required": ["amount", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "howToPay": {
                "description": "Step-by-step signing instructions",
                "items": {},
                "type": "array"
              },
              "method": {
                "description": "HTTP method",
                "type": "string"
              },
              "note": {
                "description": "Notes",
                "type": "string"
              },
              "quote": {
                "additionalProperties": {},
                "description": "The quote behind the price",
                "properties": {},
                "type": "object"
              },
              "url": {
                "description": "URL to call with the PAYMENT-SIGNATURE header",
                "type": "string"
