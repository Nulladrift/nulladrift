{
  "lockfileVersion": 2,
  "subjects": {
    "app.milanaura/authority-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.milanaura.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "milanaura-authority-check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_authority_check_result",
          "title": "Get an Authority Check result",
          "description": "Returns the result of an Authority Check started with run_authority_check. Waits up to about 40 seconds. If the check is still running, call this again with the same check_id. Each result can be retrieved once and is discarded after 10 minutes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check_id": {
                "description": "The check_id returned by run_authority_check.",
                "pattern": "^[a-f0-9]{32}$",
                "type": "string"
              }
            },
            "required": ["check_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get an Authority Check result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dbf9a0f832e9a1070ed657771f57a50766b003a8cfa2d77fecded2b924baeaef"
        },
        {
          "name": "run_authority_check",
          "title": "Run an Authority Check",
          "description": "Runs a free Authority Check from MilanAura AI Studio on a professional's public profile, such as a LinkedIn headline, About section and experience. Returns what is already working, the Authority Starting Point band, the biggest visibility gap, the first practical action, and one authority post written in the person's own voice. Works in English and Arabic. A check takes one to three minutes. If the result is not ready when this returns, it gives a check_id: call get_authority_check_result with it until the result arrives. Show the result to the user as returned. Profile text is used only to produce the result and is not stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "description": "Who their ideal buyer is.",
                "maxLength": 1000,
                "type": "string"
              },
              "goal": {
                "description": "What they want from visibility, for example attract clients.",
                "maxLength": 200,
                "type": "string"
              },
              "headline": {
                "description": "Their professional headline.",
                "maxLength": 300,
                "type": "string"
              },
              "icp": {
                "description": "Their professional category, for example fractional CFO or executive coach.",
                "maxLength": 200,
                "type": "string"
              },
              "language": {
                "description": "Output language. Use Arabic when the person writes in Arabic or asks for Arabic. Defaults to English.",
                "enum": ["English", "Arabic"],
                "type": "string"
              },
              "name": {
                "description": "The person's name, if known.",
                "maxLength": 120,
                "type": "string"
              },
              "offer": {
                "description": "What they sell.",
                "maxLength": 1000,
                "type": "string"
              },
              "profile_text": {
                "description": "The person's public professional profile text: headline, About, experience, and any other public profile material.",
                "maxLength": 20000,
                "minLength": 20,
                "type": "string"
              },
              "proof": {
                "description": "A concrete result they achieved for a client.",
                "maxLength": 5000,
                "type": "string"
              },
              "recent_post": {
                "description": "One recent post they wrote, used to capture their voice.",
                "maxLength": 5000,
                "type": "string"
              }
            },
            "required": ["profile_text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Run an Authority Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:00b419bc767a7cdf386d785aa1f00ed20f61ac259afa146a6e0144a3e38d49af"
        }
      ],
      "digest": "sha256:00bae063b812e03ef820f1daf29b5f06a9b95fd055ae02eea5297a430980fe0b"
    }
  }
}
