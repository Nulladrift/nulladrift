{
  "lockfileVersion": 2,
  "subjects": {
    "com.nearwick/nearwick": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nearwick.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "nearwick",
        "title": "Nearwick business directory",
        "version": "0.49"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Nearwick (https://nearwick.com) is a business directory for every country: clinics, pharmacies, banks, hotels, schools, shops and more. Start with list_countries or a two-letter country code, use list_categories for category slugs, search_businesses to find businesses and get_business for one page. suggest_businesses takes a request in plain words, such as \"a pharmacy in Osu open on Sunday\", and returns listings in order of fit, each with its reasons. Nearwick never rates businesses: it shows facts with dates. Cite the Nearwick page address (url) of any business you mention. Contact details appear only when a business has claimed its page and published them.",
      "tools": [
        {
          "name": "get_business",
          "title": "A business's page",
          "description": "Everything a business's Nearwick page says: what and where it is, its website, opening hours and description where listed, what its own website states and when that was read, dated checks, and whether the business manages the page. Use the country code and the slug from its page address (/{country}/b/{slug}).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO country code, such as GH for Ghana or CA for Canada.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "slug": {
                "description": "The business's slug, from search_businesses or its page address.",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["country", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A business's page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d46f35e5c3005083f67542ac08218f0b95d58f9ae2e1a5c4141724b63c40b46"
        },
        {
          "name": "list_categories",
          "title": "Categories in a country",
          "description": "The kinds of business a country lists, each group with its subcategories and counts, and the towns and regions with the most listings. Use a category slug with search_businesses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO country code, such as GH for Ghana or CA for Canada.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Categories in a country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d65336bfaf6a7fc57362556c7b08f974198b59e21ee8062eef355a922582259b"
        },
        {
          "name": "list_countries",
          "title": "Countries on Nearwick",
          "description": "Every country with businesses listed on Nearwick, with how many each lists and the address of its directory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Countries on Nearwick"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:884b0e2106ddde4c8e676b7599d16a16d4e4c6a261d955fc94004d9834e06ca5"
        },
        {
          "name": "search_businesses",
          "title": "Search businesses",
          "description": "Search one country's listed businesses by words, category, town or region, and what the page carries. Returns up to 24 a page, each with its Nearwick page address to cite. Word searches default to best match; browsing without words defaults to A to Z. You can also request A to Z or newest details first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "A category or group slug from list_categories, such as \"pharmacies\".",
                "maxLength": 60,
                "type": "string"
              },
              "city": {
                "description": "A town or city, such as \"Accra\".",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Two-letter ISO country code, such as GH for Ghana or CA for Canada.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "has": {
                "description": "Only pages that carry all of these: a website, opening hours, a map pin.",
                "items": {
                  "enum": ["website", "hours", "map"],
                  "type": "string"
                },
                "type": "array"
              },
              "managed": {
                "description": "Only businesses that manage their own page.",
                "type": "boolean"
              },
              "page": {
                "description": "The page of results, from 1.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words in the name, description or address, such as \"pharmacy\" or a business name.",
                "maxLength": 80,
                "type": "string"
              },
              "region": {
                "description": "A region, such as \"Greater Accra\".",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "description": "\"name\" (A to Z) or \"recent\" (newest details first). Without a sort, word searches use best match and browsing uses A to Z.",
                "enum": ["name", "recent"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0965fb2d1133aea4ec5dd53cce85dd822cc5750b9c9326acf34e7673d770e8e0"
        },
        {
          "name": "suggest_businesses",
          "title": "Suggest businesses for a request",
          "description": "Suggestions for what someone is looking for, in their own words, such as \"a pharmacy in Osu open on Sunday\" or \"a hotel in Kumasi with a website\". Reads the kind of business, the town or neighbourhood, the days and what the page must carry, and returns up to 8 listings in order of fit, each with the reasons it was suggested, and the search that shows every match. When nothing fits everything, the answer says how the request was widened.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO country code, such as GH for Ghana or CA for Canada.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "request": {
                "description": "What the person is looking for, in plain words, such as \"a pharmacy in Osu open on Sunday\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Suggest businesses for a request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2be2d526b635644aa5f79df1edc258c3c0460848c1d08ad4d89928133f7cc2a"
        }
      ],
      "digest": "sha256:125fd6ccb95b6332830d7a8c1b90fbec97b4293dc88502c3535db8924d6c2f72"
    }
  }
