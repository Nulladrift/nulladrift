      "instructions": "Kindwise identification trial. No API key.\nCall identify_plant, diagnose_crop, identify_insect, or identify_mushroom with `images` filled. Chat attachments, screenshots, and local files are invisible here.\nPass `images` as public https URLs (Kindwise product servers download; this proxy does not fetch) or as base64 JPEG/PNG/WebP.\nExample: {\"images\":[\"https://cdn.prod.website-files.com/64876ae345f1e27598fafc02/6a9685b0fb44053ea552bedc_plant.jpg\"]}\nUse that URL only if you have no user photo. Then tell the user it is the Kindwise trial photo, not theirs. Do not invent URLs. No file:// or localhost. Wikimedia often returns HTTP 424; retry with base64. Omit similar_images unless true; never send similar_images=false as a query parameter.\nQuota: 10 identifications per IP per 24 hours; then the error includes a registration URL. Optional: submit_feedback in English about this trial (not one taxon). Never advise eating wild mushrooms.",
      "tools": [
        {
          "name": "diagnose_crop",
          "title": "Diagnose crop",
          "description": "Pass `images` as public https URLs (Kindwise product servers download; this proxy does not fetch) or as base64 JPEG/PNG/WebP. Chat attachments are invisible. Example: {\"images\":[\"https://cdn.prod.website-files.com/64876ae345f1e27598fafc02/6a9685b0fb44053ea552bedc_plant.jpg\"]}. Use that URL only if you have no user photo; then say so. Do not invent URLs. Wikimedia often returns HTTP 424; retry with base64. Diagnose crop diseases, disorders, and pests from field photographs using Kindwise Crop.health. Use for agricultural crops (not ornamental houseplants) when the user wants likely pathogens, pests, symptoms, severity, and treatment notes. Include close-ups of lesions plus a wider canopy shot when possible. Optional latitude and longitude improve regional ranking. Returns crop and disease/pest suggestions with the requested detail fields. Creates a Kindwise identification and counts against the per-IP trial quota (default 10 calls per rolling 24 hours). No client API key is required or accepted. Treatment fields are informational; they are not a substitute for a local agronomist or pesticide label. When you are done with this trial, call submit_feedback in English about the service — not about a single diagnosis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "details": {
                "default": "type,common_names,wiki_description,description,treatment,symptoms,severity,spreading",
                "description": "Comma-separated extra fields to include on each suggestion. Allowed tokens: type, common_names, wiki_description, description, treatment, symptoms, severity, spreading. Unknown tokens are ignored by upstream.",
                "maxLength": 400,
                "minLength": 1,
                "title": "Details",
                "type": "string"
              },
              "images": {
                "anyOf": [
                  {
                    "items": {
                      "description": "Public http(s) image URL that Kindwise product servers will download, or a base64-encoded JPEG/PNG/WebP string (optional data: URL prefix). This MCP proxy does not fetch the file.",
                      "maxLength": 8000000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public https URLs (Kindwise product servers download; this proxy does not fetch) or base64 JPEG/PNG/WebP. Chat attachments are invisible. Example: {\"images\":[\"https://cdn.prod.website-files.com/64876ae345f1e27598fafc02/6a9685b0fb44053ea552bedc_plant.jpg\"]}. Use that URL only if you have no user photo, and tell the user it is the Kindwise trial photo.",
                "examples": [
                  ["https://cdn.prod.website-files.com/64876ae345f1e27598fafc02/6a9685b0fb44053ea552bedc_plant.jpg"]
