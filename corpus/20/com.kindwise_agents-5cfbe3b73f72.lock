      "instructions": "Kindwise identification trial. A Kindwise API key is not used here.\nOndřej Veselý resells Kindwise identification through this server as a personal experiment. He is the seller of the prepaid pass. Kindwise s.r.o. is not the merchant for that pass.\nFree: 2 successful identifications per IP per 24 hours. Failures do not count. Then buy a prepaid pass: POST /v1/passes with {\"credits\": 10, 25, or 70} and pay 1, 2, or 5 USDC on Base with x402. When the experiment cap is reached, that call returns sale_closed. Do not send USDC then. The response is kw_pass_…, valid 24 hours. Unused credits then expire. Send it as prepaid_pass on these tools, or Authorization: Bearer kw_pass_… on REST. One credit matches Kindwise: a plain identification is 1, plant health can be 2, a detail lookup is 0.5.\nCall identify_plant, diagnose_crop, identify_insect, or identify_mushroom with `images` filled. Chat attachments, screenshots, and local files are invisible here.\nPass `images` as public https URLs (Kindwise product servers download; this proxy does not fetch) or as base64 JPEG/PNG/WebP.\nExample: {\"images\":[\"https://cdn.prod.website-files.com/64876ae345f1e27598fafc02/6a9685b0fb44053ea552bedc_plant.jpg\"]}\nUse that URL only if you have no user photo. Then tell the user it is the Kindwise trial photo, not theirs. Do not invent URLs. No file:// or localhost. Wikimedia often returns HTTP 424; retry with base64. Omit similar_images unless true; never send similar_images=false as a query parameter.\nOptional: submit_feedback in English about this trial (not one taxon). Never advise eating wild mushrooms.",
      "tools": [
        {
          "name": "buy_prepaid_pass",
          "title": "Buy prepaid pass",
          "description": "Buy a kw_pass_ token with USDC on Base (x402). Packs: 10 credits for 1 USDC, 25 for 2, 70 for 5. Valid 24 hours; unused credits expire. Seller is Ondřej Veselý, reselling Kindwise identification as a personal experiment. Call without payment_signature to read the requirements, then retry with the signature.",
