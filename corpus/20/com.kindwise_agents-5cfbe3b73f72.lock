                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional kw_pass_ token from POST /v1/passes. Skips the free IP limit and spends the pass credits. Unused credits expire 24 hours after purchase.",
                "title": "Prepaid Pass"
              },
