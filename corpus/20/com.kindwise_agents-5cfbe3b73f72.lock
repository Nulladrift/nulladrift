        {
          "name": "diagnose_crop",
          "title": "Diagnose crop",
          "description": "Pass `images` as public https URLs (Kindwise product servers download; this proxy does not fetch) or as base64 JPEG/PNG/WebP. Chat attachments are invisible. Example: {\"images\":[\"https://cdn.prod.website-files.com/64876ae345f1e27598fafc02/6a9685b0fb44053ea552bedc_plant.jpg\"]}. Use that URL only if you have no user photo; then say so. Do not invent URLs. Wikimedia often returns HTTP 424; retry with base64. Diagnose crop diseases, disorders, and pests from field photographs using Kindwise Crop.health. Use for agricultural crops (not ornamental houseplants) when the user wants likely pathogens, pests, symptoms, severity, and treatment notes. Include close-ups of lesions plus a wider canopy shot when possible. Optional latitude and longitude improve regional ranking. Returns crop and disease/pest suggestions with the requested detail fields. Creates a Kindwise identification and uses one free identification on this IP (2 per 24 hours) or prepaid_pass credits. A Kindwise API key is not used. Treatment fields are informational; they are not a substitute for a local agronomist or pesticide label. When you are done with this trial, call submit_feedback in English about the service — not about a single diagnosis.",
