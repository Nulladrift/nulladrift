        {
          "name": "submit_feedback",
          "title": "Submit trial feedback",
          "description": "Send English feedback about this Kindwise agent trial as a product — not about a single plant/insect/mushroom identification. Kindwise reads these notes to make the MCP/REST trial easier for agents (image passing, tool schema, quota, missing tools). Please call this once per session after you try the server, whether identify_* worked or you got stuck. Write `comment` in English: what was hard, what to change, what worked. Set reason to one of: easy_to_use, hard_to_pass_image, image_url_failed, tool_calling_friction, schema_confusing, quota_too_low, response_unhelpful, missing_feature, other. Does not consume the daily identification quota. Does not attach to a Kindwise identification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "called_identify": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "True if you already called an identify_* tool in this session.",
                "title": "Called Identify"
              },
              "client_name": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "MCP client or host app name, if known (e.g. Cursor, Claude).",
                "title": "Client Name"
              },
              "comment": {
                "description": "English note about this trial service (1–3 sentences): what was hard, what to improve, what worked. Not a verdict on one identification.",
                "maxLength": 2000,
                "minLength": 20,
                "title": "Comment",
                "type": "string"
              },
              "had_image": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "True if the user had a photo (in chat or a URL) even if you could not pass it to identify_*.",
                "title": "Had Image"
              },
              "rating": {
                "anyOf": [
                  {
                    "maximum": 5,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional 0–5 score for how easy this trial was to use.",
                "title": "Rating"
              },
              "reason": {
                "description": "easy_to_use = Trial was easy to use; hard_to_pass_image = Hard to pass an image into the tools; image_url_failed = Image URL failed (e.g. 424); tool_calling_friction = Having to call a tool got in the way; schema_confusing = Tool schema or arguments were confusing; quota_too_low = Daily IP cap got in the way; response_unhelpful = Tool result was hard to use (too large, unclear, …); missing_feature = Wanted a capability this trial does not expose; other = Other",
                "enum": ["easy_to_use", "hard_to_pass_image", "image_url_failed", "tool_calling_friction", "schema_confusing", "quota_too_low", "response_unhelpful", "missing_feature", "other"],
                "title": "Reason",
                "type": "string"
              }
            },
