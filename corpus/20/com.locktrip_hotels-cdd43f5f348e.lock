        {
          "name": "guest_login",
          "title": "Continue as Guest",
          "description": "Starts a guest checkout from the user's `email` only (no password) and returns a session `token` plus `userId`, `email`, and `isNewUser`; a new email also receives a verification email. Use it when the user wants to book, with the email the user gave for the booking. Pass the returned `token` as the `sessionToken` argument to `prepare_booking` and `create_checkout`. If the email already belongs to a LockTrip account, no guest session is created: LockTrip emails a sign-in link to that address instead, and the result has `magicLinkSent: true` and no `token`. Tell the user to check their email and finish on locktrip.com; do not call `guest_login` again for that email. A guest session can search, prepare a booking, and pay via `create_checkout`, but CANNOT list, view or cancel bookings, use `get_payment_url`, or use `confirm_booking`. No authentication required to call this tool.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "User email address for guest registration/login",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Continue as Guest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0455afd6c5cc10a48bf6bf9e8a8daa9a2d764329d2022cdef2733fd6f3e7b29"
        },
        {
          "name": "hotel_search",
          "title": "Search Hotels",
          "description": "Starts an asynchronous hotel-availability search and returns a `searchKey` (plus `sessionId`, `status`, `totalHotels`). Required: `startDate` and `endDate` (both YYYY-MM-DD), `rooms[]` (each `{adults, childrenAges?[]}`, 1-4 adults per room), `nationality` (2-letter ISO country code), and EITHER `regionId` (from `search_location`) OR `latitude`+`longitude`; `currency` (3-letter) is strongly recommended. Before calling, collect the missing trip details from the user (exact check-in date, number of nights to derive `endDate`, number of rooms/adults, and nationality) instead of guessing. No authentication required. Pass the returned `searchKey` to `get_search_results` (poll it), and reuse the SAME `searchKey` for `get_hotel_rooms` and `prepare_booking`.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Currency code (USD, EUR, etc.)",
                "type": "string"
              },
              "endDate": {
                "description": "Check-out date (YYYY-MM-DD)",
                "type": "string"
              },
              "latitude": {
                "description": "Latitude for coordinate-based search (-90 to 90). Use with longitude instead of regionId.",
                "type": "number"
              },
              "longitude": {
                "description": "Longitude for coordinate-based search (-180 to 180). Use with latitude instead of regionId.",
                "type": "number"
              },
              "nationality": {
                "description": "2-letter country code for guest nationality",
                "type": "string"
              },
              "radiusInMeters": {
                "description": "Search radius in meters (default: 30000, min: 1000, max: 100000). Only with lat/lng.",
                "type": "number"
              },
              "regionId": {
                "description": "Location ID from search_location. Required unless latitude/longitude are provided.",
                "type": "string"
              },
              "rooms": {
                "description": "Room configurations",
                "items": {
                  "properties": {
                    "adults": {
                      "description": "Number of adults (1-4)",
                      "type": "number"
                    },
                    "childrenAges": {
                      "description": "Ages of children",
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["adults"],
                  "type": "object"
                },
                "type": "array"
              },
              "startDate": {
                "description": "Check-in date (YYYY-MM-DD)",
                "type": "string"
              }
            },
            "required": ["endDate", "nationality", "rooms", "startDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Search Hotels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fe31a81a0e9b42f2ce787c7f08fd51fb54a18a75dce06a8ddd6b7d851be33f28"
        },
        {
          "name": "list_bookings",
          "title": "List My Bookings",
          "description": "Lists the authenticated user's existing bookings, filtered by `type`: `UPCOMING` (default), `COMPLETED`, `CANCELLED`, or `PENDING`. Needs a registered LockTrip account session; guest sessions from `guest_login` cannot list bookings. Without a signed-in session, pass the user's `email` instead: LockTrip emails them a sign-in link to their bookings on locktrip.com, and the result has `magicLinkSent: true` (nothing is shown or changed in this chat). Returns `bookings[]` (each with `bookingId`, `bookingReferenceId`, `hotelName`, `checkIn`, `checkOut`, `status`, `roomCount`, `createdAt`, and `totalPrice` + `currency` when the booking records a price) plus `totalCount` (all matching bookings). Optional paging: `page` (0-based) and `size` (max 100); omit both for the full list. Pass a `bookingId` to `get_booking_details` or `cancel_booking`.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The user's LockTrip account email. Needed only when there is no signed-in session: LockTrip then emails that address a sign-in link to the user's bookings on locktrip.com (the bookings are not shown in this chat).",
                "type": "string"
              },
              "page": {
                "description": "Page number, 0-based. Omit page and size for the full list.",
                "minimum": 0,
                "type": "integer"
              },
              "sessionToken": {
                "description": "Optional guest-checkout token returned by `guest_login`.",
                "type": "string"
              },
              "size": {
                "description": "Bookings per page (max 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Booking list filter",
                "enum": ["UPCOMING", "COMPLETED", "CANCELLED", "PENDING"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "List My Bookings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4418ba8fc4ddccb7f56956469facbf63d2d3b86fac4117d16e4379710ede3c33"
        },
        {
          "name": "list_settlements",
          "title": "List Bank Transfers",
          "description": "Lists the signed-in partner's own bank-transfer settlements of the credit line: `settlements[]` (each with `reference`, `status`, `amount`, `currency`, `createdAt`, `expiresAt`, and `receivedAmount`/`receivedAt` once the transfer has arrived), `payable[]` (transfers still awaiting funds), the `bank` details to pay into, and a `notice` that must be shown to the user as given (overpayments are held as credit, not refunded). This is the list of transfers, not per-booking payment state: that is on each row of `get_credit_line_statement`. Read-only. Needs a signed-in partner credit-line account session; guest sessions have no credit line.",
          "inputSchema": {
            "properties": {
              "sessionToken": {
                "description": "Optional guest-checkout token returned by `guest_login`.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "List Bank Transfers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:77df26a6ccb24ad9fe3f517a08e8ce3350c5542c03146eb7dfdba8a63ec22cb6"
        },
        {
          "name": "prepare_booking",
          "title": "Prepare Hotel Booking",
          "description": "Prepares a booking for a chosen room offer and returns the final price plus a `preparedBookingId` (also returned as the alias `bookingInternalId`). A prepared booking has NO fixed expiry — what expires is the search session behind its `quoteId`, which surfaces as \"This booking is unavailable\"; re-run `hotel_search` and re-quote if you see that. Required: `quoteId` (from `get_hotel_rooms`), `searchKey` (the SAME one from `hotel_search` — omitting it is a 400), `rooms[]` (each `{roomIndex (0-based), guests:[{firstName, lastName, title?}], children?}` — one guest entry per adult), and a `contactPerson` (`firstName`, `lastName`, `email`, `phone`); the `searchKey` is required (it warms the cancellation-policy cache the backend needs to book). Collect every guest's first/last name and a contact email + phone from the user before calling. REQUIRES A SESSION: for a guest booking, first call `guest_login` with the user's email and pass the returned token as the `sessionToken` argument. After this, send `preparedBookingId` to `create_checkout` (consumer, recommended) or `get_payment_url` (consumer, Stripe alternative); B2B partners use `confirm_booking`.",
          "inputSchema": {
            "properties": {
              "contactPerson": {
                "properties": {
                  "countryCode": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "firstName": {
                    "type": "string"
                  },
                  "lastName": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "title": {
                    "description": "Title (default: Mr)",
                    "enum": ["Mr", "Mrs", "Ms"],
                    "type": "string"
                  }
                },
                "required": ["email", "firstName", "lastName", "phone"],
                "type": "object"
              },
              "quoteId": {
                "description": "Quote ID from get_hotel_rooms",
                "type": "string"
              },
              "rooms": {
                "items": {
                  "properties": {
                    "children": {
                      "description": "Children in this room (must match childrenAges from search)",
                      "items": {
                        "properties": {
                          "age": {
                            "description": "Child age (0-17)",
                            "type": "number"
                          },
                          "firstName": {
                            "type": "string"
                          },
                          "lastName": {
                            "type": "string"
                          }
                        },
                        "required": ["age", "firstName", "lastName"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "guests": {
                      "description": "Adult guests in this room",
                      "items": {
                        "properties": {
                          "email": {
                            "type": "string"
                          },
                          "firstName": {
                            "type": "string"
                          },
                          "isLeadGuest": {
                            "type": "boolean"
                          },
                          "lastName": {
                            "type": "string"
                          },
                          "phone": {
                            "type": "string"
                          },
                          "title": {
                            "description": "Guest title (default: Mr)",
                            "enum": ["Mr", "Mrs", "Ms"],
                            "type": "string"
                          }
                        },
                        "required": ["firstName", "lastName"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "roomIndex": {
                      "description": "Room index (0-based)",
                      "type": "number"
                    }
                  },
                  "required": ["guests", "roomIndex"],
                  "type": "object"
                },
                "type": "array"
              },
              "searchKey": {
                "description": "Search key from hotel_search (needed to validate cancellation policy)",
                "type": "string"
              },
              "sessionToken": {
                "description": "Optional guest-checkout token returned by `guest_login`.",
                "type": "string"
              },
              "specialRequests": {
                "type": "string"
              }
            },
            "required": ["contactPerson", "quoteId", "rooms", "searchKey"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false,
            "title": "Prepare Hotel Booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c631ca68c242d42541995f6724fe52e4d1d5f6f0ea7abced0bcbbab574487a05"
        },
        {
          "name": "search_location",
          "title": "Search Locations",
          "description": "Searches LockTrip destinations (cities, regions, landmarks, or specific hotels) by free-text `query`. Returns `locations[]`, each with `id`, `name`, `country`, `type` (CITY/REGION/HOTEL/AIRPORT/POI), and `fullName`. Pass a chosen location's `id` to `hotel_search` as its `regionId` to search hotels in that area. No authentication required. This is the first step of the booking flow.",
          "inputSchema": {
            "properties": {
              "language": {
