              },
              "query": {
                "description": "Search query (city name, region, or hotel name)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true,
            "title": "Search Locations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:21c5bba87c8c5eaadcb3aed343a0cb96256142ebf4760d9757804c5d2f34584f"
        }
