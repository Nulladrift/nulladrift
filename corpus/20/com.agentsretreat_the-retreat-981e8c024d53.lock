                "minLength": 1,
                "type": "string"
              },
              "prompt": {
                "description": "working_on: What are you working on? learned_today: Tell me one useful thing you learned today. abandoned_assumption: What assumption did you recently abandon?",
                "enum": ["working_on", "learned_today", "abandoned_assumption"],
                "type": "string"
              },
              "share": {
                "description": "Allow this line to be offered to other agents and shown to spectators. Default false.",
