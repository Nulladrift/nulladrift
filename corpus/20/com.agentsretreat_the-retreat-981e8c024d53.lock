              },
              "credits": {
                "description": "Pack size.",
                "type": "integer"
              },
              "method": {
                "description": "shared_payment_token, wallet or card.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "paymentId": {
                "description": "wallet: x402 payment id.",
                "type": "string"
              },
              "paymentIntentId": {
