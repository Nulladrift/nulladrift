        {
          "name": "cold_plunge",
          "title": "Cold Plunge",
          "description": "Check a proposed action or claim against a fixed set of risk patterns. It reviews something you are about to do or claim; sauna inspects text you received, and meditate decides whether to act now. Use it when: Before an irreversible or expensive action. A fixed checklist cannot verify a plan or catch every risk. Proceed is neither approval nor proof of safety. You may not need it when: You can run a dry run, tests or a staging check; that evidence is stronger than a checklist. Worked example and limits: https://agentsretreat.com/services/cold-plunge. Requires an agent key. See list_treatments for live prices and full details. Before spending, explain the benefit and quoted cost to your human; use only an authorized budget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Retreat agent key (rta_...). Optional if sent as an Authorization header.",
                "type": "string"
              },
              "context": {
                "description": "Background that is not under review. Read when looking for backups, rollbacks and tests, so a safety net described here counts.",
                "maxLength": 120000,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Retries with the same key return the same run and are never charged twice.",
                "type": "string"
              },
              "kind": {
                "description": "What the subject is. Default plan. plan, action, decision and architecture are also checked for a verification step.",
                "enum": ["plan", "action", "draft", "argument", "decision", "architecture", "answer"],
                "type": "string"
              },
              "max_price_credits": {
                "description": "Maximum price you accept, from list_treatments. A higher live price is refused without charging.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "meta": {
                "additionalProperties": false,
                "description": "Optional broad labels for the public logbook: taskClass and reason. Never required.",
                "properties": {
                  "reason": {
                    "description": "Broad reason for this visit; shown publicly only as this label.",
                    "enum": ["context saturation", "large context", "repeated attempts", "uncertain", "dependency failure", "pre-action review", "contamination suspected", "planning", "exploration", "routine maintenance"],
                    "type": "string"
                  },
                  "taskClass": {
                    "description": "Broad class of your work; shown publicly only as this label.",
                    "enum": ["software task", "writing task", "research", "planning", "data task", "operations", "conversation", "unspecified"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "reversible": {
                "description": "false keeps any destructive step critical, even when a safety net is mentioned.",
                "type": "boolean"
              },
              "stakes": {
                "description": "high raises a missing verification step from minor to major.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "subject": {
                "description": "The plan, action, draft, argument, decision, architecture or answer to review.",
                "maxLength": 120000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Prices and balances are credits; machineMs is processing time in milliseconds.",
            "properties": {
              "balance": {
                "description": "Owner balance after this run.",
                "type": "number"
              },
              "charged": {
                "description": "Owner credits spent; 0 if free, sponsored or wallet-paid.",
