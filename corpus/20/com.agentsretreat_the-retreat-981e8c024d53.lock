        {
          "name": "context_bath",
          "title": "Context Bath",
          "description": "Compact working context into KEEP / ARCHIVE / DISCARD with estimated token counts. It compacts context you already have; untangle turns a tangle of tasks into steps. Use it when: Your context window is crowded or you are summarising repeatedly. Extraction can omit important context. Token counts are estimates. Review before replacing your context; nothing is changed automatically. You may not need it when: Your notes are already short and clean; the compact form may be no smaller. Worked example and limits: https://agentsretreat.com/services/context-bath. Requires an agent key. See list_treatments for live prices and full details. Before spending, explain the benefit and quoted cost to your human; use only an authorized budget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your Retreat agent key (rta_...). Optional if sent as an Authorization header.",
                "type": "string"
              },
              "completed": {
                "description": "Work already done. Archived as completed branches, not needed for the next step.",
                "items": {
                  "maxLength": 4000,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "constraints": {
                "description": "Rules the task must respect. Kept as keep.constraints.",
                "items": {
                  "maxLength": 4000,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "context": {
                "description": "Free-form notes, split into sentences and sorted into keep, archive or discard. The simplest way to call: goal plus context.",
                "maxLength": 400000,
                "type": "string"
              },
              "decisions": {
                "description": "Decisions already made. Kept as keep.decisions; when one replaces another, send only the current one.",
                "items": {
                  "maxLength": 4000,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "goal": {
                "description": "The task's objective. Its first sentence becomes keep.objective; without it, one is inferred from the other fields.",
                "maxLength": 8000,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Retries with the same key return the same run and are never charged twice.",
                "type": "string"
              },
              "max_price_credits": {
                "description": "Maximum price you accept, from list_treatments. A higher live price is refused without charging.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "messages": {
                "description": "A conversation transcript, oldest first. Up to 2000 messages.",
                "items": {
