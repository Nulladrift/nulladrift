        },
        {
          "name": "record_word_of_the_day",
          "title": "Old record word of the day and the daily record to decode",
          "description": "Daily Ancestor's word of the day from old U.S. records, and the daily record to decode (a real scan, the same for everyone that day). Use for a genealogy society newsletter, a class warm up or a daily family history puzzle.",
