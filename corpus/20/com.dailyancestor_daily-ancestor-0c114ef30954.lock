        "name": "daily-ancestor",
        "title": "Daily Ancestor",
        "version": "1.0.0",
        "websiteUrl": "https://dailyancestor.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Daily Ancestor (https://dailyancestor.com) is a free site that teaches family historians to read old U.S. records, with sources on every entry. Use record_word for a word or abbreviation in an old record; genealogy_guides for census, state and record guides and calculators; record_word_of_the_day for a daily word and record puzzle. Answers are short; send the user to the link for the full entry and sources.",
      "tools": [
        {
          "name": "genealogy_guides",
          "title": "Find a free guide for reading old U.S. records",
          "description": "Search Daily Ancestor (free, no account) for a guide: every U.S. census 1790 to 1950 (what each column asks), state guides, record guides (draft cards, naturalization, probate, land), family myths checked against records, handwriting lessons and calculators (birth date from a census age or a gravestone, Soundex, cousin chart, research plan). Returns the best pages with a short summary and a link.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Topic, e.g. \"1880 census\", \"Soundex\", \"naturalization\", \"second cousin\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a free guide for reading old U.S. records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c241ffa6541c8c93312b144f4a61b562e692728ec7e23ce87e2cc961ab3abd0"
        },
        {
          "name": "record_word",
          "title": "What an old record word or abbreviation means",
          "description": "Look up a word, abbreviation, occupation, old disease name, Latin or legal term found in old U.S. genealogy records (census, church, probate, land, death records) in the Daily Ancestor dictionary. Returns the meaning, the explanation and its sources, and a link to the full entry with an example from a real record.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "word": {
                "description": "Word or abbreviation as written, e.g. \"consumption\", \"inst.\", \"relict\", \"yeoman\"",
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
          },
