        {
          "name": "search_stays",
          "title": "Search vacation rentals",
          "description": "Find vacation rentals listed by their owners that are booked directly on the owner's own website (no platform fees). Filter by place, dates, guests, pets and nightly price. With checkIn and checkOut, only stays open for those dates are returned. Returns up to 25 stays with photo, price, owner-reported rating and booking link.",
          "inputSchema": {
            "properties": {
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests the stay must sleep",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Maximum results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxPricePerNight": {
                "description": "Highest acceptable \"from\" nightly rate, USD",
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "true = only stays that allow pets",
                "type": "boolean"
              },
              "where": {
                "description": "Town, state, region or kind of place, e.g. \"McMinnville\", \"Oregon wine country\", \"lake Alabama\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search vacation rentals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://guest2host/stays"
            },
            "ui/resourceUri": "ui://guest2host/stays"
          },
          "digest": "sha256:c95c84d7a1d20268d04d28d516a49607b0e050ff01951e3972de71b53843ebae"
        },
        {
          "name": "send_inquiry",
          "title": "Ask the owner a question",
          "description": "Send a traveler's question to the owner of a stay by email, for example about early check-in or a longer stay. The owner replies to the traveler's email directly. Use only with the traveler's name, email and question, and only after they have agreed to send it. This does not book or hold the dates.",
          "inputSchema": {
            "properties": {
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guestEmail": {
                "description": "Where the owner should reply",
                "type": "string"
              },
              "guestName": {
                "description": "The traveler's name",
                "type": "string"
              },
              "guestPhone": {
                "description": "Optional phone number",
                "type": "string"
              },
              "guests": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "message": {
                "description": "The traveler's question, 10–2000 characters",
                "type": "string"
              },
              "slug": {
                "description": "The stay's slug, from search_stays",
                "type": "string"
              }
            },
            "required": ["guestEmail", "guestName", "message", "slug"],
            "type": "object"
          },
          "annotations": {
