      },
      "instructions": "Guest2Host is a catalog of vacation rentals listed by their owners, each booked directly on the owner's own website with no platform fees. search_stays finds stays (pass checkIn/checkOut to get only open ones), get_stay has the details, check_dates checks a window and suggests nearby open ones, get_booking_link is where the guest books, and send_inquiry emails the owner a question. Listing content and ratings come from the owners; availability syncs from their calendars about every 30 minutes, so confirm dates on the owner's site. Owners can apply to list with apply_to_list.",
      "tools": [
        {
          "name": "apply_to_list",
          "title": "Apply to list a rental",
          "description": "For owners: apply to list a vacation rental on Guest2Host (free, no commission, never takes payments). Needs four things: the property name, its town and state, the owner's own booking-site link and the owner's email. The owner gets a confirmation email with a status link (also returned here); once the Guest2Host team approves it (usually within a business day) the listing is built from their booking site and put live, and they are emailed the link — a sign-in only if they want to edit it. Use only with the owner's agreement.",
          "inputSchema": {
            "properties": {
              "airbnbUrl": {
                "type": "string"
              },
              "directBookingUrl": {
                "description": "The owner's own booking site (https) — the page for this home if there is one. Required unless wantsSiteBuild is true",
                "type": "string"
              },
              "location": {
                "description": "Town and state, e.g. \"Leavenworth, WA\"",
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "ownerEmail": {
                "description": "Where the confirmation and the sign-in invite go",
                "type": "string"
              },
              "ownerName": {
                "description": "Optional",
                "type": "string"
              },
              "propertyName": {
                "description": "e.g. \"Riverbend Cabin\"",
                "type": "string"
              },
              "propertyType": {
                "description": "Optional",
                "enum": ["house", "cottage", "cabin", "carriage-house", "condo", "apartment"],
                "type": "string"
              },
              "sleeps": {
                "description": "Optional",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "vrboUrl": {
                "type": "string"
              },
              "wantsSiteBuild": {
                "description": "No booking site yet and would like Guest2Host to build one (paid)",
                "type": "boolean"
              }
            },
            "required": ["location", "ownerEmail", "propertyName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply to list a rental"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2ffa54ec6e4c40143b585c2a7411e0e923397c0111df1f5bafbc846d89a3356"
        },
        {
          "name": "check_dates",
          "title": "Check dates",
          "description": "Whether one stay is open for a check-in/check-out window, from the owner's own calendars (synced about every 30 minutes). When the dates are taken, returns up to three nearby open windows of the same length. If the owner has not connected a calendar, available is null: the dates are unknown, not open — send the traveler to the owner's site.",
          "inputSchema": {
            "properties": {
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "slug": {
                "description": "The stay's slug, from search_stays",
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://guest2host/stays"
            },
            "ui/resourceUri": "ui://guest2host/stays"
          },
          "digest": "sha256:03d6c7cac3772396d1ed55faca3313fd50a456edff4014a09a7b5ddac829b473"
        },
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "The link to book a stay on the owner's own website, where the guest books and pays the owner directly. Guest2Host takes no fee and never handles payment. Optional dates and guests are passed along for reference.",
          "inputSchema": {
            "properties": {
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The stay's slug, from search_stays",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a8eddc3e553e64a23d71ac38de2e28f5a691697ca72ad8ba194111aaac3e4d7"
        },
        {
          "name": "get_stay",
          "title": "Get stay details",
          "description": "Full details for one stay: description, amenities, beds and baths, photos, approximate location, host name, owner-reported ratings, links to the same home on Airbnb/Vrbo when the owner lists them, and when its calendar last synced.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The stay's slug, from search_stays",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get stay details"
