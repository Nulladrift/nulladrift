          "title": "Rascunhar respostas do agente com IA",
          "description": "Escreve com IA rascunhos de resposta a partir do perfil, dos planos e do material do treinador, para os temas ainda sem resposta ou para os temas pedidos. Um rascunho novo substitui o rascunho do tema, nunca uma resposta aprovada. Os rascunhos só valem depois de aprovados com salvar_resposta_do_agente.",
