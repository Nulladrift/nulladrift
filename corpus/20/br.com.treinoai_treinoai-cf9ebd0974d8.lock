                            "minimum": 1,
                            "type": "integer"
                          },
                          "nome": {
                            "description": "Nome exato do exercício na biblioteca do time, sem diferenciar acentos nem maiúsculas.",
                            "maxLength": 100,
                            "minLength": 1,
                            "type": "string"
                          },
                          "observacoes": {
                            "description": "Observação para o exercício.",
                            "maxLength": 500,
                            "minLength": 1,
                            "type": "string"
                          },
                          "repeticoes": {
                            "description": "Repetições por série. Deixe de fora em exercícios por tempo e cardio.",
                            "maximum": 1000,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "series": {
                            "description": "Número de séries.",
                            "maximum": 20,
                            "minimum": 1,
                            "type": "integer"
                          }
                        },
                        "required": ["series"],
                        "type": "object"
                      },
                      "maxItems": 30,
                      "minItems": 1,
                      "type": "array"
                    },
                    "nome": {
                      "description": "Nome da sessão, por exemplo \"Treino A - Peito e tríceps\".",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["exercicios", "nome"],
                  "type": "object"
                },
                "maxItems": 7,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["chave_idempotencia", "nome", "semanas", "sessoes"],
            "type": "object"
          },
          "outputSchema": {
