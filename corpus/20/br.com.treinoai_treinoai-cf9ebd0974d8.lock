        {
          "name": "buscar_dados_do_time",
          "title": "Buscar nos dados do time",
          "description": "Busca um texto, sem diferenciar acentos nem maiúsculas, nos registros de um tipo de dado do time (por exemplo o nome de um aluno ou uma palavra numa anotação), com os mesmos filtros de listar_dados_do_time. Entre aspas, a palavra tem de aparecer inteira. Devolve 20 registros por página por padrão, no máximo 50, e page.nextCursor quando há mais. Só lê.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "entity": {
                "enum": ["clients", "assignments", "sessions", "prescribed_exercises", "set_logs", "activities", "assessments", "notes", "programs", "exercises", "forms", "assessment_answers", "products", "tiers", "entitlements", "transactions", "classes", "automations", "automation_runs", "team_settings", "features", "team_overview", "daily_briefings"],
                "type": "string"
              },
              "filters": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 500,
                      "type": "string"
                    },
                    {
                      "type": "number"
                    },
                    {
                      "type": "boolean"
                    },
                    {
                      "type": "null"
                    },
                    {
                      "items": {
                        "anyOf": [
                          {
                            "maxLength": 200,
                            "type": "string"
                          },
                          {
                            "type": "number"
                          },
                          {
                            "type": "boolean"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "maxItems": 25,
                      "type": "array"
                    }
                  ]
                },
                "propertyNames": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["entity", "query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "entity": {
                "enum": ["clients", "assignments", "sessions", "prescribed_exercises", "set_logs", "activities", "assessments", "notes", "programs", "exercises", "forms", "assessment_answers", "products", "tiers", "entitlements", "transactions", "classes", "automations", "automation_runs", "team_settings", "features", "team_overview", "daily_briefings"],
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page": {
                "additionalProperties": false,
                "properties": {
                  "isComplete": {
                    "type": "boolean"
                  },
                  "matched": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "nextCursor": {
                    "type": ["string", "null"]
                  },
                  "returned": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["isComplete", "matched", "nextCursor", "returned"],
                "type": "object"
              },
              "rows": {
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["entity", "page", "rows"],
            "type": "object"
          },
          "annotations": {
