        {
          "name": "atribuir_formulario",
          "title": "Enviar formulário a um cliente",
          "description": "Envia um modelo de formulário do time (anamnese, check-in, medidas) para um cliente responder. O cliente recebe uma notificação e vê o formulário no app. Isso chega ao cliente e não se desfaz por esta conexão, então cada chamada precisa da confirmação do treinador. Exige chave_idempotencia: repetir o mesmo pedido com a mesma chave devolve o envio já feito, sem avisar o cliente de novo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chave_idempotencia": {
                "description": "Uma chave nova para cada pedido (por exemplo um UUID). Para repetir o mesmo pedido, como depois de uma falha de conexão, use a mesma chave: o resultado anterior volta e nada é criado de novo. A mesma chave com um pedido diferente é recusada. Vale por 30 dias.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cliente_id": {
                "description": "Id do cliente. Encontre-o com buscar_dados_do_time (entity \"clients\").",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
                "type": "string"
              },
              "modelo_id": {
                "description": "Id do modelo de formulário do time. Encontre-o com buscar_dados_do_time (entity \"forms\").",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["chave_idempotencia", "cliente_id", "modelo_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "envio_id": {
                "type": "number"
              },
              "link": {
                "type": "string"
              },
              "modelo_id": {
                "type": "number"
              },
              "repetida": {
                "type": "boolean"
              },
              "situacao": {
                "enum": ["enviado", "incerto"],
                "type": "string"
              }
            },
            "required": ["link", "repetida", "situacao"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Enviar formulário a um cliente"
          },
          "behavior": {
            "destructive": true,
