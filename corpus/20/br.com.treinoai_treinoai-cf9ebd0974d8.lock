      "instructions": "Calculadoras de treino, nutrição e negócio da TreinoAI, com as mesmas fórmulas das páginas em treinoai.com.br/ferramentas, e busca nos artigos da TreinoAI Academy. Cada resultado de calculadora traz a página com o método e as fontes; search encontra artigos e calculadoras, e fetch lê o texto completo. Os resultados são estimativas educativas e não substituem a avaliação de um profissional de saúde.\n\nAs ferramentas do treinador, como ver_conexao, pedem que o treinador entre na conta TreinoAI dele e agem só no time escolhido nessa hora, com as permissões que ele deu. Antes de agir em nome dele, use ver_conexao para saber o time e as permissões.",
