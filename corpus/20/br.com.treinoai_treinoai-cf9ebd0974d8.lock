        {
          "name": "enviar_mensagem",
          "title": "Enviar mensagem a um cliente",
          "description": "Envia uma mensagem do treinador para um cliente, na conversa do app do TreinoAI (nunca pelo WhatsApp). O cliente recebe uma notificação e lê a mensagem no app. Cada treinador envia no máximo 30 mensagens por minuto, somando o painel e as conexões. Isso chega ao cliente e não se desfaz por esta conexão, então cada chamada precisa da confirmação do treinador. Exige chave_idempotencia: repetir o mesmo pedido com a mesma chave devolve a mensagem já enviada, sem mandar de novo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chave_idempotencia": {
                "description": "Uma chave nova para cada pedido (por exemplo um UUID). Para repetir o mesmo pedido, como depois de uma falha de conexão, use a mesma chave: o resultado anterior volta e nada é criado de novo. A mesma chave com um pedido diferente é recusada. Vale por 30 dias.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cliente_id": {
                "description": "Id do cliente. Encontre-o com buscar_dados_do_time (entity \"clients\").",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
