        {
          "name": "criar_programa",
          "title": "Criar programa",
          "description": "Cria um programa na biblioteca do time a partir de um esboço: semanas, sessões e exercícios (pelo id ou pelo nome exato da biblioteca), com séries, repetições, carga e descanso. As sessões são uma semana de treino, repetida pelas semanas do programa. O programa fica só na biblioteca: não é atribuído a nenhum cliente e ninguém é avisado. A carga entra nas observações do exercício, e exercícios por tempo e cardio recebem a duração padrão do tipo. Se algum exercício não for encontrado, nada é criado e a resposta lista cada um com sugestões. Exige chave_idempotencia: repetir o mesmo pedido com a mesma chave devolve o programa já criado.",
