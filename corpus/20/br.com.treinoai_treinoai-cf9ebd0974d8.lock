        {
          "name": "alterar_agente_de_atendimento",
          "title": "Alterar o agente de atendimento",
          "description": "Altera o perfil do treinador que o agente apresenta (nome, CREF, especialidades, cidade, como atende, sobre), os planos que ele pode oferecer e o nome, o tom e o horário do treinador. Mande só o que muda; o resto fica como está. Nada chega aos clientes até o agente responder a próxima conversa.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "jeito": {
                "additionalProperties": false,
                "description": "Só os campos que mudam.",
                "properties": {
                  "horario": {
                    "description": "Quando o treinador costuma responder, uma faixa por dia. Substitui o horário atual; [] apaga.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "dia_da_semana": {
                          "description": "0 é domingo, 6 é sábado.",
                          "maximum": 6,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "fim": {
                          "description": "Hora de fim, HH:MM, depois do início.",
                          "type": "string"
                        },
                        "inicio": {
                          "description": "Hora de início, HH:MM.",
                          "type": "string"
                        }
                      },
                      "required": ["dia_da_semana", "fim", "inicio"],
                      "type": "object"
                    },
                    "maxItems": 7,
                    "minItems": 0,
                    "type": "array"
                  },
                  "nome_da_assistente": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  "tom": {
                    "description": "consultive (consultivo), direct (direto) ou warm (acolhedor).",
                    "enum": ["consultive", "direct", "warm"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "perfil": {
                "additionalProperties": false,
                "description": "Só os campos que mudam.",
                "properties": {
                  "atendimento": {
                    "description": "online, in_person (presencial) ou both (os dois).",
                    "enum": ["online", "in_person", "both"],
                    "type": "string"
                  },
                  "cidade": {
                    "anyOf": [
                      {
                        "maxLength": 120,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "cref": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Registro no CREF. null apaga."
                  },
                  "especialidades": {
                    "anyOf": [
                      {
                        "maxLength": 300,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "nome": {
                    "description": "Como os clientes chamam o treinador.",
                    "maxLength": 80,
                    "minLength": 1,
                    "type": "string"
                  },
                  "sobre": {
                    "anyOf": [
                      {
                        "maxLength": 1000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Formação, experiência e para quem é o trabalho."
                  }
                },
                "type": "object"
              },
              "planos_oferecidos": {
                "description": "A lista completa dos produto_id que o agente pode oferecer (substitui a atual). Os planos e seus ids vêm de ver_agente_de_atendimento.",
                "items": {
                  "format": "uuid",
                  "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 0,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Alterar o agente de atendimento"
          },
