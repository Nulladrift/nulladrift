          "description": "Monta um calendário de periodização de 4 a 12 semanas a partir da data de início e dos dias de treino, no modelo linear, ondulatório semanal ou ondulatório diário, com o foco e a faixa de repetições de cada semana e de cada treino. É um exemplo para editar, não uma prescrição individual.",
