        {
          "name": "calcular_1rm",
          "title": "Calcular 1RM",
          "description": "Carga máxima para uma repetição (1RM) estimada a partir de uma série de 1 a 12 repetições, pela média de Epley, Brzycki e Lander, com a tabela de cargas por percentual do 1RM.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cargaKg": {
                "description": "Carga levantada na série, em kg.",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              },
              "repeticoes": {
                "description": "Repetições completas com essa carga. Acima de 12 as fórmulas perdem precisão.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cargaKg", "repeticoes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brzyckiKg": {
                "type": "number"
              },
              "epleyKg": {
                "type": "number"
              },
              "landerKg": {
                "type": "number"
              },
              "pagina": {
                "description": "Página da calculadora, com o método e as fontes.",
                "type": "string"
              },
              "tabela": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cargaKg": {
                      "type": "number"
                    },
