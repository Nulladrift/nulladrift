        {
          "name": "criar_cliente",
          "title": "Adicionar cliente",
          "description": "Adiciona um cliente ao time pelo nome e e-mail, sem enviar convite, e-mail, mensagem ou notificação. Um cliente novo só acessa o app depois que o treinador enviar o convite pelo painel. Se o e-mail já tem conta no TreinoAI, a conta é vinculada ao time, e um cliente arquivado no time volta a ele. Essas pessoas já têm conta e veem o time no app, sem aviso. Nunca devolve senha nem link de acesso. Exige chave_idempotencia: repetir o mesmo pedido com a mesma chave devolve o cliente já adicionado.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chave_idempotencia": {
                "description": "Uma chave nova para cada pedido (por exemplo um UUID). Para repetir o mesmo pedido, como depois de uma falha de conexão, use a mesma chave: o resultado anterior volta e nada é criado de novo. A mesma chave com um pedido diferente é recusada. Vale por 30 dias.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "description": "E-mail do cliente.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "nome": {
                "description": "Primeiro nome do cliente.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "sobrenome": {
                "description": "Sobrenome do cliente.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "telefone": {
                "description": "Telefone do cliente.",
                "maxLength": 20,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["chave_idempotencia", "email", "nome"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cliente_id": {
                "type": "string"
              },
              "link": {
                "type": "string"
              },
              "repetida": {
                "type": "boolean"
              },
              "situacao": {
                "enum": ["criado", "reativado", "vinculado", "retomado"],
                "type": "string"
              }
            },
            "required": ["cliente_id", "link", "repetida", "situacao"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
