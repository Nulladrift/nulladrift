              "sessoes": {
                "description": "As sessões de uma semana de treino. A mesma semana se repete por todas as semanas do programa.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "exercicios": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "carga_kg": {
                            "description": "Carga em kg. Entra nas observações do exercício como \"Carga: N kg\".",
                            "maximum": 1000,
                            "minimum": 0,
                            "type": "number"
