        {
          "name": "registrar_treino",
          "title": "Registrar treino feito por um cliente",
          "description": "Registra como concluído um treino pendente que o cliente fez, com as séries (repetições e carga), o PSE de cada exercício e o horário. Envie todos os exercícios do treino, pela posição na ordem do treino; se faltar algum, nada é registrado e a resposta lista os exercícios. Registra só repetições e carga: treinos com exercícios por tempo ou cardio, séries especiais (drop, cluster, rest-pause) ou variações fixadas são recusados e devem ser registrados pelo painel. O treino aparece no histórico do cliente no app. Se ele fechar um mesociclo, o programa ou uma conquista, o cliente é notificado, e as automações do time ligadas a treino concluído rodam. Isso chega ao cliente e não se desfaz por esta conexão, então cada chamada precisa da confirmação do treinador. Exige chave_idempotencia: repetir o mesmo pedido com a mesma chave devolve o registro já feito.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chave_idempotencia": {
                "description": "Uma chave nova para cada pedido (por exemplo um UUID). Para repetir o mesmo pedido, como depois de uma falha de conexão, use a mesma chave: o resultado anterior volta e nada é criado de novo. A mesma chave com um pedido diferente é recusada. Vale por 30 dias.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "exercicios": {
                "description": "Todos os exercícios do treino, cada um pela posição, com todas as séries e o PSE.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "observacao": {
                      "description": "Anotação sobre o exercício.",
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "posicao": {
                      "description": "A posição do exercício no treino, a partir de 1, na ordem do treino.",
                      "maximum": 50,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "pse": {
                      "description": "A percepção de esforço (PSE) do exercício, de 1 a 10.",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "series": {
                      "description": "Uma entrada por série prescrita, na ordem.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "carga_kg": {
                            "description": "Carga usada, em kg.",
                            "maximum": 9999,
                            "minimum": 0,
                            "type": "number"
                          },
                          "feita": {
                            "default": true,
                            "description": "false se a série foi pulada.",
                            "type": "boolean"
                          },
                          "repeticoes": {
                            "description": "Repetições feitas.",
                            "maximum": 1000,
                            "minimum": 0,
                            "type": "integer"
                          }
                        },
                        "type": "object"
                      },
                      "maxItems": 50,
                      "minItems": 1,
                      "type": "array"
                    }
                  },
                  "required": ["posicao", "pse", "series"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "fim": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "inicio": {
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "sessao_id": {
                "description": "Id de um treino pendente do cliente. Encontre-o com listar_dados_do_time (entity \"sessions\").",
                "pattern": "^\\d{1,18}$",
                "type": "string"
              }
            },
            "required": ["chave_idempotencia", "exercicios", "fim", "inicio", "sessao_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "atribuicao_id": {
                "type": "number"
              },
              "cliente_id": {
                "type": "string"
              },
              "link": {
                "type": "string"
              },
              "repetida": {
                "type": "boolean"
              },
              "sessao_id": {
                "type": "string"
              },
              "situacao": {
                "enum": ["registrado", "incerto"],
                "type": "string"
              }
            },
            "required": ["cliente_id", "link", "repetida", "sessao_id", "situacao"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Registrar treino feito por um cliente"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
