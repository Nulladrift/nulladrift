        },
        {
          "name": "atribuir_programa",
          "title": "Atribuir programa a um cliente",
          "description": "Atribui um programa da biblioteca do time a um cliente. O cliente recebe uma notificação no app e passa a ver o programa. Com quando \"agora\" (o padrão), o programa começa na hora e encerra o programa em andamento do cliente; com \"depois_do_programa_atual\", ele entra na fila e começa quando o atual terminar. Isso chega ao cliente e não se desfaz por esta conexão, então cada chamada precisa da confirmação do treinador. Exige chave_idempotencia: repetir o mesmo pedido com a mesma chave devolve a atribuição já feita, sem avisar o cliente de novo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "chave_idempotencia": {
                "description": "Uma chave nova para cada pedido (por exemplo um UUID). Para repetir o mesmo pedido, como depois de uma falha de conexão, use a mesma chave: o resultado anterior volta e nada é criado de novo. A mesma chave com um pedido diferente é recusada. Vale por 30 dias.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cliente_id": {
                "description": "Id do cliente. Encontre-o com buscar_dados_do_time (entity \"clients\").",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$",
                "type": "string"
              },
              "programa_id": {
                "description": "Id do programa da biblioteca do time. Encontre-o com buscar_dados_do_time (entity \"programs\").",
                "maximum": 2147483647,
                "minimum": 1,
                "type": "integer"
              },
              "quando": {
                "default": "agora",
                "description": "\"agora\" começa o programa na hora e encerra o programa em andamento do cliente. \"depois_do_programa_atual\" põe o programa na fila, e ele começa sozinho quando o programa em andamento terminar.",
                "enum": ["agora", "depois_do_programa_atual"],
                "type": "string"
              }
            },
            "required": ["chave_idempotencia", "cliente_id", "programa_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "atribuicao_id": {
                "type": "number"
              },
              "link": {
                "type": "string"
              },
              "na_fila": {
                "type": "boolean"
              },
              "programa_id": {
                "type": "number"
              },
              "repetida": {
                "type": "boolean"
              },
              "situacao": {
                "enum": ["atribuido", "incerto"],
                "type": "string"
              },
              "versao_id": {
                "type": "number"
              }
            },
            "required": ["link", "repetida", "situacao"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Atribuir programa a um cliente"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "anthropic/requiresUserInteraction": true,
            "securitySchemes": [
              {
                "scopes": ["enviar"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:893da170a00eba99775d9c2cb5b29430accdc1d207082a9c4be5a0dce07eaaf0"
