          "description": "Adiciona material de apoio que o agente consulta para responder: uma página pública do site do treinador (link) ou um texto colado (bio do Instagram, política, perguntas e respostas). Só o texto é guardado. PDF e arquivos se enviam pelo painel. O mesmo link ou o mesmo texto não é guardado duas vezes.",
