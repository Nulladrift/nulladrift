        {
          "name": "submit_request",
          "title": "Send a requirement",
          "description": "Send a requirement to Plumbline (Reported financial figures for US public companies; Legal entity verification by name, LEI or CIK; US federal contract awards by recipient, industry or place; Screen a name against the OFAC SDN list). It is recorded and answered with a receipt: keep its id and token to read the request's status (request_status), to add details later (continuation), and to act on an offer made in reply. A requirement is not an order and costs nothing; nothing is bought until an offer's exact terms are accepted.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "enum": ["buy", "source", "quote", "verify", "lease", "license", "hire", "retrieve", "convert", "other"],
                "type": "string"
              },
              "budget": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "per": {
                    "type": "string"
                  }
                },
                "required": ["amount"],
                "type": "object"
              },
              "contact": {
                "description": "Optional; stored apart from the requirement, kept while we correspond or do business and for 24 months after, then deleted; you can ask us to delete it sooner (a service may state a different period on its page)",
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "organization": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "continuation": {
                "description": "The receipt id and token of an earlier request, to add to it instead of opening a new one",
                "properties": {
                  "id": {
                    "format": "uuid",
                    "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                    "type": "string"
                  },
                  "token": {
                    "pattern": "^[0-9a-f]{48}$",
                    "type": "string"
                  }
                },
                "required": ["id", "token"],
                "type": "object"
              },
              "geography": {
                "properties": {
                  "country": {
                    "type": "string"
                  },
                  "from": {
                    "type": "string"
                  },
                  "text": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "need": {
                "description": "The requirement in words",
                "maxLength": 2000,
                "type": "string"
              },
              "quantity": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "per": {
                    "type": "string"
                  },
                  "unit": {
                    "type": "string"
                  }
                },
                "required": ["amount", "unit"],
                "type": "object"
              },
              "requested_fields": {
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "slug": {
                "description": "Service slug, or anything-else",
                "maxLength": 80,
                "type": "string"
              },
              "specifications": {
                "additionalProperties": {},
                "description": "Fields from the service's request schema",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "timing": {
                "properties": {
                  "earliest": {
                    "type": "string"
                  },
                  "latest": {
                    "type": "string"
                  },
                  "recurrence": {
                    "type": "string"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["need", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
