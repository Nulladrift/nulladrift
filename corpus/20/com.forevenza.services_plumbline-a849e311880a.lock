        },
        {
          "name": "update_order_draft",
          "title": "Change the order draft",
          "description": "Change a Plumbline order draft the way the buyer asked: add, update, remove or replace companies (name an item by its key from the draft, or by match on its name), or clear the list (item fields: name (the company's name as the buyer has it, or its exact legal name); country (ISO 3166 two-letter code; narrows the LEI search by name); lei (20-character Legal Entity Identifier; the report then reads that exact record); cik (SEC Central Index Key; adds the SEC EDGAR registration (EDGAR is not searched by name))). The app in the conversation shows the change at once. A placed order is never changed (the draft is locked); a change after the request was sent is a revision the buyer sends again with send_order_draft. Repeat a call with the same op_id and it is applied once.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "base_revision": {
                "description": "The revision you read",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "from_app": {
                "description": "Set only by the app itself",
                "type": "boolean"
              },
              "id": {
                "description": "The draft id",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "op_id": {
                "description": "Your id for this change, so a retry is applied once",
                "maxLength": 80,
                "type": "string"
              },
              "ops": {
                "items": {
                  "oneOf": [
                    {
                      "properties": {
                        "item": {
                          "additionalProperties": {},
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "op": {
                          "const": "add",
                          "type": "string"
                        }
                      },
                      "required": ["item", "op"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "key": {
                          "maxLength": 12,
                          "type": "string"
                        },
                        "match": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "op": {
                          "const": "update",
                          "type": "string"
                        },
                        "set": {
                          "additionalProperties": {},
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        }
                      },
                      "required": ["op", "set"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "key": {
                          "maxLength": 12,
                          "type": "string"
                        },
                        "match": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "op": {
                          "const": "remove",
                          "type": "string"
                        }
                      },
                      "required": ["op"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "item": {
                          "additionalProperties": {},
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
                        "key": {
                          "maxLength": 12,
                          "type": "string"
                        },
                        "match": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "op": {
                          "const": "replace",
                          "type": "string"
                        }
                      },
                      "required": ["item", "op"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "op": {
                          "const": "clear",
                          "type": "string"
                        }
                      },
                      "required": ["op"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "field": {
                          "description": "Or one field by name, with value",
                          "maxLength": 60,
                          "type": "string"
                        },
                        "op": {
                          "const": "set",
                          "type": "string"
                        },
                        "value": {},
                        "values": {
                          "additionalProperties": {},
                          "description": "Single fields of the order by name; an empty value clears one",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        }
                      },
                      "required": ["op"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "token": {
                "description": "The draft's private token (also the receipt token of every request sent from it); keep it private",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["id", "ops", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
