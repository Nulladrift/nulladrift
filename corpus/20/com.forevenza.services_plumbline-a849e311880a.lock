        {
          "name": "company_financial_facts",
          "title": "Reported financials from SEC filings",
          "description": "Reported values of one XBRL concept for one SEC filer, by CIK or ticker, from its SEC filings (EDGAR): each value with its period, fiscal year, form, filing date and accession number, the latest 40.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cik": {
                "description": "SEC CIK; or give ticker",
                "maxLength": 10,
                "type": "string"
              },
              "concept": {
                "description": "XBRL concept name, default Revenues; others include RevenueFromContractWithCustomerExcludingAssessedTax, NetIncomeLoss, Assets",
                "maxLength": 120,
                "type": "string"
              },
              "taxonomy": {
                "description": "Default us-gaap",
                "enum": ["us-gaap", "ifrs-full", "dei"],
                "type": "string"
              },
              "ticker": {
                "description": "Stock ticker of an SEC filer, such as AAPL",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0df72b2c478434bccd4570230e9a4758beaab3b586c5fbd56023066235cafc63"
        },
        {
          "name": "counter_offer",
          "title": "Propose changes to an offer",
          "description": "Propose a change to an issued offer on its inspected terms: other quantities (by item index in terms.items), another list of companies (where the items price companies), a delivery date, a total price for the whole, a payment plan, or a note. It is a proposal, not a change: the terms stand and can still be accepted as they are. The business answers it in inspect_offer thread.counteroffers, with a revised offer to inspect and accept, or a reason. A later proposal replaces an earlier one still awaiting an answer. Nothing here orders or pays.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The request or offer id from your receipt or customer link",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "description": "Name of the person making this for the buyer",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "organization": {
                "description": "The buyer's organization",
                "maxLength": 160,
                "type": "string"
              },
              "proposal": {
                "description": "At least one of quantities, counterparties, deliver_by, total_minor, payment or note",
                "properties": {
                  "counterparties": {
                    "description": "The companies the order should cover instead, for an offer whose items price companies",
                    "items": {
                      "properties": {
                        "country": {
                          "description": "ISO 3166 two-letter code",
                          "pattern": "^[A-Za-z]{2}$",
                          "type": "string"
                        },
                        "identifier": {
                          "description": "An LEI, CIK or registry number, if known",
                          "maxLength": 40,
                          "type": "string"
                        },
                        "name": {
                          "maxLength": 160,
                          "minLength": 2,
                          "type": "string"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    },
                    "maxItems": 25,
                    "minItems": 1,
                    "type": "array"
                  },
                  "deliver_by": {
                    "description": "ISO date, such as 2027-01-15",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "note": {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "payment": {
                    "properties": {
                      "days_until_due": {
                        "maximum": 90,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "kind": {
                        "enum": ["CHECKOUT_FULL", "INVOICE"],
                        "type": "string"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  },
                  "quantities": {
                    "items": {
                      "properties": {
                        "item": {
                          "description": "0-based index into terms.items",
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "quantity": {
                          "exclusiveMinimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["item", "quantity"],
                      "type": "object"
                    },
                    "maxItems": 40,
                    "minItems": 1,
                    "type": "array"
                  },
                  "total_minor": {
                    "description": "The total the buyer proposes for the whole, in minor units of the offer currency",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "terms_sha256": {
                "description": "Exact terms_sha256 from inspect_offer; the act is refused if the terms have changed since",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Private token from your receipt or customer link; keep it for later visits",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["id", "name", "proposal", "terms_sha256", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
