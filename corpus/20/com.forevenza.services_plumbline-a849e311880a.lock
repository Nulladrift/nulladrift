      "serverInfo": {
        "name": "Plumbline",
        "title": "Plumbline",
        "version": "1.0.0",
        "websiteUrl": "https://plumbline.forevenza.com/"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Plumbline screens a person or company name against the US Treasury OFAC SDN list and its aliases in seconds, returning each match with its score, entry number and programs and the list's publication date; a match is a lead for review, not a determination. Its company checks (LEI and SEC registration, SEC-reported XBRL figures and federal contract awards) answer from the public registries where they are running, and every answer names the record it came from. Use list_propositions to see Plumbline's services, describe_proposition for one of them, then submit_request or an operation tool.",
      "tools": [
        {
          "name": "accept_offer",
          "title": "Accept an offer and place the order",
          "description": "Place an order on terms you have inspected and the buyer has authorized you to accept. Requires the exact terms hash and explicit acceptance. Follow inspect_offer later for payment links and verified payment state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accept": {
                "const": true,
                "type": "boolean"
              },
              "id": {
                "description": "The request or offer id from your receipt or customer link",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "organization": {
                "maxLength": 160,
                "type": "string"
              },
              "purchase_order": {
                "maxLength": 80,
                "type": "string"
              },
              "terms_sha256": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Private token from your receipt or customer link; keep it for later visits",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["accept", "id", "name", "terms_sha256", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a18c1c406249bd96f4dc11fc3957df15fd65fa5dfe523caffc162676751f6411"
        },
        {
          "name": "answer_remedy",
          "title": "Answer a proposed remedy",
          "description": "Accept or decline a remedy the business proposed on a placed order (inspect_offer thread.fulfilment.remedies with state PROPOSED). Recorded for the business, which applies it and shows the result there. Accepting a credit or refund here moves no money; the business records it when its payment processor does.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answer": {
                "enum": ["ACCEPT", "DECLINE"],
                "type": "string"
              },
              "id": {
                "description": "The request or offer id from your receipt or customer link",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "description": "Name of the person making this for the buyer",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "note": {
                "maxLength": 1000,
                "type": "string"
              },
              "remedy_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "terms_sha256": {
                "description": "Exact terms_sha256 from inspect_offer; the act is refused if the terms have changed since",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Private token from your receipt or customer link; keep it for later visits",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["answer", "id", "name", "remedy_id", "terms_sha256", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:01643422c2192f962e003cfa1447c5b7b70893fa8005c2f5bff8111f10a88633"
