        {
          "name": "submit_purchase_order",
          "title": "Send a purchase order",
          "description": "Send the buyer's purchase order for an issued offer or a placed order: number, revision, lines, total, currency and payment terms. It is matched against the accepted terms; differences are recorded and shown in inspect_offer thread.purchasing as exceptions, never silently accepted. A changed purchase order is the same number with a higher revision. This does not accept the offer and pays nothing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The request or offer id from your receipt or customer link",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "name": {
                "description": "Name of the person making this for the buyer",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "organization": {
                "description": "The buyer's organization",
                "maxLength": 160,
                "type": "string"
              },
              "po": {
                "properties": {
                  "bill_to": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "buyer_vendor_id": {
                    "description": "The seller's vendor id in the buyer's system",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "currency": {
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  "document_sha256": {
                    "description": "SHA-256 of the purchase order document, if there is one",
                    "pattern": "^[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "invoice_route": {
                    "description": "Where invoices go: a portal URL, email or API",
                    "maxLength": 300,
                    "type": "string"
                  },
                  "lines": {
                    "items": {
                      "properties": {
                        "amount_minor": {
                          "description": "quantity times unit_price_minor",
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "description": {
                          "maxLength": 300,
                          "minLength": 1,
                          "type": "string"
                        },
                        "quantity": {
                          "minimum": 0,
                          "type": "number"
                        },
                        "unit_price_minor": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        }
                      },
                      "required": ["amount_minor", "description", "quantity", "unit_price_minor"],
                      "type": "object"
                    },
                    "maxItems": 40,
                    "minItems": 1,
                    "type": "array"
                  },
                  "number": {
                    "pattern": "^[A-Za-z0-9._/-]{1,60}$",
                    "type": "string"
                  },
                  "payment_terms_days": {
                    "maximum": 120,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "revision": {
                    "description": "1 unless this replaces an earlier revision",
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "total_minor": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["currency", "lines", "number", "payment_terms_days", "total_minor"],
                "type": "object"
              },
              "terms_sha256": {
                "description": "Exact terms_sha256 from inspect_offer; the act is refused if the terms have changed since",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "token": {
                "description": "Private token from your receipt or customer link; keep it for later visits",
                "pattern": "^[0-9a-f]{48}$",
                "type": "string"
              }
            },
            "required": ["id", "name", "po", "terms_sha256", "token"],
            "type": "object"
          },
