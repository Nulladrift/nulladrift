                      "type": "string"
                    },
                    "unit": {
                      "description": "What the amount is per, e.g. project or month.",
                      "type": "string"
                    }
                  },
                  "required": ["amountUsd", "id", "kind", "label", "note", "unit"],
                  "type": "object"
                },
                "type": "array"
              },
