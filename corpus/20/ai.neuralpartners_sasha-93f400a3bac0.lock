                "description": "True on the reply where Sasha offers to pass the conversation to the Neural Partners team.",
                "type": "boolean"
              },
              "prices": {
                "description": "The approved Neural Partners starting prices Sasha's reply quoted, read from Neural Partners' configuration rather than from the reply text. Empty when she quoted none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amountUsd": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
