      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "sasha",
        "title": "Sasha, Neural Partners Chief of Staff",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "ask_sasha",
          "title": "Ask Sasha about Neural Partners",
          "description": "Sasha, Neural Partners' Chief of Staff, answers questions about what Neural Partners sells: the Neural Core products and platform, the Neural Labs agency and advisory services, whether they fit a business, and how to get a price. structuredContent.links carries the Neural Partners pages her reply points to. One message per call; a conversation continues by conversation_id. Sasha, Neural Partners' AI agent on Claude, can be wrong. Prices are starting points only. Chats are kept up to 90 days. She never books or submits anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversation_id": {
                "description": "The conversation_id an earlier call returned. Omitted, a new conversation starts. Earlier turns are kept server-side, so only the new message is sent.",
                "pattern": "^[a-z0-9]{20,32}$",
                "type": "string"
              },
              "message": {
                "description": "What to ask or tell Sasha, in plain text.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversation_id": {
                "description": "Continues this conversation on a later call.",
                "pattern": "^[a-z0-9]{20,32}$",
                "type": "string"
              },
              "degraded": {
                "description": "True when the reply is a stand-in because Sasha ran out of time; the same message can be sent again.",
                "type": "boolean"
              },
              "disclosure": {
                "description": "Present on the first reply of a conversation: what the person should know about Sasha. Also sent as its own first content block.",
                "type": "string"
              },
              "error": {
                "additionalProperties": false,
                "description": "Present only on a result with isError: true.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "retry_after_s": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "links": {
                "description": "The Neural Partners pages Sasha's reply pointed at, as absolute URLs. Only pages on the Neural Partners site are ever listed. Empty when she pointed at none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "offer_handoff": {
                "description": "True on the reply where Sasha offers to pass the conversation to the Neural Partners team.",
                "type": "boolean"
              },
              "reply": {
                "description": "Sasha's reply, on its own. The disclosure is never part of it.",
                "type": "string"
              }
            },
            "required": ["conversation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:662f195e5936358ff43bc644cf617ee7112052196ea7d1affa7bd4db0ad395ad"
        },
        {
          "name": "book_discovery",
          "title": "Book a Neural Labs discovery call",
          "description": "Returns a link to the Neural Partners contact page, pre-filled with a summary of the conversation. Nothing is submitted or booked by this tool: the message is sent only if a person opens the link, reviews it and presses send. Email addresses and phone numbers are removed from the summary. An optional message is answered by Sasha before the summary is written. Sasha, Neural Partners' AI agent on Claude, can be wrong. Prices are starting points only. Chats are kept up to 90 days. She never books or submits anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversation_id": {
                "description": "The conversation_id an earlier call returned. Omitted, a new conversation starts. Earlier turns are kept server-side, so only the new message is sent.",
                "pattern": "^[a-z0-9]{20,32}$",
                "type": "string"
              },
              "message": {
                "description": "Optional. A last message for Sasha before the handoff, in plain text.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact_url": {
                "description": "The /contact-us/ link a person opens and sends. Carries only a summary parameter.",
                "format": "uri",
                "type": "string"
              },
              "conversation_id": {
                "description": "Continues this conversation on a later call.",
                "pattern": "^[a-z0-9]{20,32}$",
                "type": "string"
              },
              "degraded": {
                "description": "True when the reply is a stand-in because Sasha ran out of time; the same message can be sent again.",
                "type": "boolean"
              },
              "disclosure": {
                "description": "Present on the first reply of a conversation: what the person should know about Sasha. Also sent as its own first content block.",
                "type": "string"
              },
              "error": {
                "additionalProperties": false,
                "description": "Present only on a result with isError: true.",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "retry_after_s": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["code", "message"],
                "type": "object"
              },
              "links": {
                "description": "The Neural Partners pages Sasha's reply pointed at, as absolute URLs. Only pages on the Neural Partners site are ever listed. Empty when she pointed at none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "offer_handoff": {
                "description": "True on the reply where Sasha offers to pass the conversation to the Neural Partners team.",
                "type": "boolean"
              },
              "reply": {
                "description": "Sasha's reply, on its own. The disclosure is never part of it.",
                "type": "string"
              },
              "summary_included": {
                "description": "False when the link carries no summary.",
                "type": "boolean"
              }
            },
            "required": ["conversation_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c12be8f57b852e56baf9133983a234299105dca059555bcf6891a4db33e9a596"
        },
        {
          "name": "pricing_discovery",
          "title": "Neural Labs pricing discovery",
          "description": "Sasha discusses what a Neural Labs agency or advisory engagement would cost. She asks about scope before naming a figure and quotes only Neural Partners' approved starting points, each of which depends on the work. structuredContent.prices carries exactly the approved figures her reply quoted, from configuration, with their conditions. Sasha, Neural Partners' AI agent on Claude, can be wrong. Prices are starting points only. Chats are kept up to 90 days. She never books or submits anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "conversation_id": {
                "description": "The conversation_id an earlier call returned. Omitted, a new conversation starts. Earlier turns are kept server-side, so only the new message is sent.",
                "pattern": "^[a-z0-9]{20,32}$",
                "type": "string"
              },
              "message": {
                "description": "The pricing question, or what the work is, in plain text.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
