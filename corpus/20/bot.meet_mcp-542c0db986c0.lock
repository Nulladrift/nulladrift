{
  "lockfileVersion": 2,
  "subjects": {
    "bot.meet/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.meet.bot/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "meetbot-mcp",
        "version": "1.3.0",
        "description": "Meet.bot MCP Server for scheduling and booking"
      },
      "capabilities": {
        "completions": {},
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_meeting",
          "title": "Book Meeting",
          "description": "Book a new meeting slot",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guest_email": {
                "description": "Email address of the guest (used for calendar invite and confirmation)",
                "type": "string"
              },
              "guest_name": {
                "description": "Full name of the guest",
                "type": "string"
              },
              "notes": {
                "description": "Optional notes to include with the meeting (e.g. agenda, call details)",
                "type": "string"
              },
              "page": {
                "description": "The URL of the scheduling page (e.g. https://meet.bot/your-page)",
                "type": "string"
              },
              "start": {
                "description": "Start time in ISO 8601 format (e.g. 2025-03-10T14:00:00Z); must be an available slot",
                "type": "string"
              }
            },
            "required": ["guest_email", "guest_name", "page", "start"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b81bb1e120c304d01f4b23df6a3c4b556cebb88a7dd871f54ee28880e2d97ce9"
        },
        {
          "name": "delete_webhook",
          "title": "Delete Webhook",
          "description": "Delete one of the authenticated user's webhooks by id",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The webhook id to delete",
                "type": "number"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:332d37ceec51bcdee7685be5685801bd8c6f81fcdf005daa723f097839d0ea8c"
        },
        {
          "name": "get_available_slots",
          "title": "Get Available Slots",
          "description": "Get available booking slots for a scheduling page",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "booking_link": {
                "description": "If true, include shareable booking links in the response",
                "type": "boolean"
              },
              "count": {
                "description": "Maximum number of slots to return (defaults to server limit)",
                "type": "number"
              },
              "end": {
                "description": "End date for the range in YYYY-MM-DD format",
                "type": "string"
              },
              "page": {
                "description": "The URL of the scheduling page (e.g. https://meet.bot/your-page)",
                "type": "string"
              },
              "start": {
                "description": "Start date for the range in YYYY-MM-DD format",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone for slot times (e.g. America/New_York, Europe/London)",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fdb37a83bb48b8d08b5dd22c99172234d9139fa249ed2e0ba87ec8b92d3550c"
        },
        {
          "name": "get_page_info",
          "title": "Get Page Information",
          "description": "Get information about a specific scheduling page",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "The URL of the scheduling page (e.g. https://meet.bot/your-page)",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a9d051047c94202fc1f28fe4ce4089e37390a08998c411092bdbef5863903ac3"
        },
        {
          "name": "get_scheduling_pages",
          "title": "Get Scheduling Pages",
          "description": "Get all scheduling pages for the authenticated user",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14ac623d513eab732deb1157bcbd5f9d9256de0795a3d710392fbf3dd2a9f4ff"
        },
        {
          "name": "health_check",
          "title": "Health Check",
          "description": "Check if the Meet.bot API client is healthy and the Bearer token is valid",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5cc819eeb3cfaac339315fcc79054a5e31de60141ec91f086f4a040769e5cf2a"
        },
        {
          "name": "list_webhooks",
          "title": "List Webhooks",
          "description": "List the authenticated user's outbound booking webhooks (fired on booking_received, booking_rescheduled and booking_cancelled)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:df2ddd4e242cfa380aa5c6fd4159d1cbd0b94e1db472ef73e7f921db3a349d4b"
        },
        {
          "name": "set_webhook",
          "title": "Set Webhook",
          "description": "Create or update an outbound booking webhook. Omit id to create (webhook_url required); pass id to update. Meet.bot POSTs a JWT-signed (HS256) JSON payload to the URL on each booking event.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coverage": {
                "description": "'all' (default) fires for every page including ones created later; 'selected' only for the pages in `pages`",
                "enum": ["all", "selected"],
                "type": "string"
              },
              "description": {
                "description": "Optional label for the webhook",
                "type": "string"
              },
              "id": {
                "description": "Webhook id to update; omit to create a new one",
                "type": "number"
              },
              "is_active": {
                "description": "Whether the webhook is active (default true)",
                "type": "boolean"
              },
              "pages": {
                "description": "Page ids to cover when coverage='selected'",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "scope": {
                "description": "'self' (default) your own pages; 'team' (team admins only) also fires for teammates' bookings",
                "enum": ["self", "team"],
                "type": "string"
              },
              "webhook_url": {
                "description": "HTTPS URL we POST booking events to (required when creating)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4d8525a946a680a4cbcd11d1bed94128080cf52060f475e53ba78045cbf8fa07"
        }
      ],
      "prompts": [
        {
          "name": "book_for_guest",
          "title": "Book for guest",
          "description": "Fast path when you already have all details. Books a meeting directly using the preferred time; useful when another system provides the slot.",
          "arguments": [
            {
              "name": "page",
              "description": "The scheduling page URL",
              "required": true
            },
            {
              "name": "guest_name",
              "description": "Full name of the guest",
              "required": true
            },
            {
              "name": "guest_email",
              "description": "Email address of the guest",
              "required": true
            },
            {
              "name": "preferred_time",
              "description": "Preferred start time in ISO 8601 format (e.g. 2025-03-10T14:00:00Z); should be an available slot",
              "required": true
            }
          ],
          "digest": "sha256:15fd26700c278312a83eb8b3dd85e66dcd2939dcaf653ec598ad6e48c75842ed"
        },
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "When is this person next free? Checks availability only; no booking. Use for pre-meeting research or answering \"when are they free?\"",
          "arguments": [
            {
              "name": "page",
              "description": "The scheduling page URL (e.g. https://meet.bot/your-page)",
              "required": true
            },
            {
              "name": "days_ahead",
              "description": "Number of days to look ahead (default: 7)",
              "required": false
            }
          ],
          "digest": "sha256:2034fcdbc4c90359e34fbbe4f0e27c0959cab477b7ce4a2fdff544b2ad8a1450"
        },
        {
          "name": "list_my_pages",
          "title": "List my scheduling pages",
          "description": "Starting point when you don't know which page to use. Lists the user's scheduling pages with a brief description of each.",
          "digest": "sha256:a922b19a74378a4405b2e784bad4add0b6ccdbf1a970f66cebad5061b9ff7379"
        },
        {
          "name": "schedule_meeting",
          "title": "Schedule a meeting",
          "description": "Get step-by-step instructions to schedule a meeting using this server. Use this when the user wants to book a meeting or check availability.",
          "digest": "sha256:d1d3b85032c2bb4a02a55a554140bbd3c31d68709b9d5b2c6377ebfa724e51bd"
        },
        {
          "name": "share_booking_link",
          "title": "Share booking link",
          "description": "Send the user a link to book. Returns shareable booking links; the guest picks their own slot. No booking is performed.",
          "arguments": [
            {
              "name": "page",
              "description": "The scheduling page URL",
              "required": true
            },
            {
              "name": "count",
              "description": "Number of slot links to return (default: 3)",
              "required": false
            }
          ],
          "digest": "sha256:efdc6ff0f8d79a700b8f21e8ebffd4500bcbc5c5367c49def89ebcdddc73a85d"
        },
        {
          "name": "suggest_times",
          "title": "Suggest times",
          "description": "Offer the user some options. Returns a clean list of available slots for them to pick from; no booking until they choose.",
          "arguments": [
            {
              "name": "page",
              "description": "The scheduling page URL",
              "required": true
            },
            {
              "name": "count",
              "description": "Number of slot options to return (default: 3)",
              "required": false
            },
            {
              "name": "timezone",
              "description": "IANA timezone for displaying times (e.g. America/New_York)",
              "required": false
            },
            {
              "name": "start_date",
              "description": "Start of range in YYYY-MM-DD format",
              "required": false
            },
            {
              "name": "end_date",
              "description": "End of range in YYYY-MM-DD format",
              "required": false
            }
          ],
          "digest": "sha256:b917a2054c3d9259079e5b6d393d2c4948b3780f0ae144d726b58cd506193d01"
        }
      ],
      "digest": "sha256:657d08edb858e5e7ec49b4594e14151c516c846a53add96aaa6cd0a7ec9bee0a"
    }
  }
}
