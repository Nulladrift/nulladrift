        {
          "name": "contact_support",
          "title": "Contact Vuelo support",
          "description": "Send the traveller's request to Vuelo's support team, who will be in touch with them. Use it whenever the traveller wants something done to a Vuelo booking that the other tools cannot do, or wants a person: change dates or names after paying, a refund question, a payment problem, a complaint, anything. It works in any conversation: pass the taskId if the booking was made in this chat; otherwise their Vuelo booking reference (VU-...) and the email or mobile they booked with, or just their email if they have no reference. To cancel a booking made in this chat, use cancel_booking first: it raises the request itself when Vuelo's team has to do it. Write the message in the traveller's words, with what they want and why. Tell them the ticket reference and reply time this returns.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email the traveller booked with: needed when there is no taskId, or when this tool asks for it.",
                "format": "email",
                "type": "string"
              },
              "message": {
                "description": "What the traveller wants, in their words.",
                "maxLength": 4000,
                "minLength": 5,
                "type": "string"
              },
              "mobile": {
                "description": "With reference, instead of email: the mobile on the booking.",
                "maxLength": 30,
                "type": "string"
              },
              "reference": {
                "description": "The Vuelo booking reference (VU-...), when there is no taskId.",
                "maxLength": 20,
                "type": "string"
              },
              "taskId": {
                "description": "The taskId book_trip returned, when the booking was made in this conversation.",
                "type": "string"
              },
              "topic": {
                "description": "What the request is about.",
                "enum": ["cancel", "change", "refund", "payment", "other"],
                "type": "string"
              }
            },
            "required": ["message", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78e6f51d78af4572cc34fb56d75a955ff08e7222572f3edf5aa506b221bc8bcc"
        },
        {
          "name": "find_my_booking",
          "title": "Send the traveller their booking page",
          "description": "For a traveller who booked with Vuelo before, in another conversation, and wants to see, change, cancel or get help with it: Vuelo texts the booking's own page to the mobile on that booking. On that page they can cancel, add it to their calendar, and contact Vuelo's team. Pass their Vuelo booking reference (VU-...) and the email or mobile they booked with. If they do not have the reference, pass the mobile they booked with alone (with country if it is not written with +): Vuelo texts that number a link to each of its latest bookings. You never see a link or whether anything matched, so tell them: if the details match, Vuelo has texted the mobile on the booking. They can also see every booking on their mobile at Vuelo's bookings page (/bookings on the site their booking links open), with a code texted to it. Never search their email or messages for a reference instead: ask for the mobile. For anything else they want a person for, use contact_support.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "For a mobile typed the local way (06 12 34 56 78), the country it is from, as an ISO code (FR). Not needed for a number with +.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "email": {
                "description": "The email the traveller booked with.",
                "format": "email",
                "type": "string"
              },
              "mobile": {
                "description": "The mobile on the booking: with the reference instead of the email, or alone without the reference.",
                "maxLength": 30,
                "type": "string"
              },
              "reference": {
                "description": "The Vuelo booking reference, VU-... Leave out if the traveller does not have it, and pass the mobile alone.",
                "maxLength": 20,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:deeb5b034d39f6defca2ad71c690b62a26695c476ef651343276a48773be93f9"
        },
        {
          "name": "follow_up_ticket",
          "title": "Check a support request later",
          "description": "When the traveller asks you to check a support request later (\"check it later today\", \"let me know tomorrow\"): you cannot come back by yourself, so Vuelo does. Pass the ticket reference (SUP-...), how many hours from now to check (in_hours, 1 to 72; 4 if they just say later today), and the taskId of the booking in this conversation or the email or mobile the request was raised with. At that time Vuelo checks the request and texts the traveller where it stands, with any refund or cancellation; if the team replies sooner, Vuelo texts them then. Tell the traveller when Vuelo will text. Up to three checks a day per request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email the request was raised with.",
                "format": "email",
                "type": "string"
              },
              "in_hours": {
                "description": "Hours from now to check. 4 for \"later today\", 24 for \"tomorrow\".",
                "maximum": 72,
                "minimum": 1,
                "type": "number"
              },
              "mobile": {
                "description": "Or the mobile on the request.",
                "maxLength": 30,
                "type": "string"
              },
              "taskId": {
                "description": "The booking's taskId, if it was made in this conversation.",
                "type": "string"
              },
              "ticket": {
                "description": "The ticket reference, SUP-...",
                "maxLength": 20,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:074f4ec8943e18dd3ca2e36177b094b49256c2fc5516103d0fa475f4ab71aae6"
        },
        {
          "name": "get_booking",
          "title": "Where a Vuelo booking stands",
          "description": "For a booking made in another conversation, or through another assistant: where it stands, by its Vuelo reference (VU-...) and the email or mobile it was booked with. Says booked, reserved, cancelled, cancellation_in_progress or not_booked, with the item, dates, number of travellers, amount, free cancellation date, the stay (hotel, area, stars, room, nights, what is included, any tax paid at the hotel, and a public page about the hotel), the date a reservation must be paid by, any requests with Vuelo's team, and its history oldest first (booked or reserved, cancellation_requested, cancelled, refund_sent, request_raised, team_replied, changed with what changed, request_resolved). It never gives names, dates of birth or the booking page: to give the traveller their page, use find_my_booking. If nothing matches, say the details did not match a booking and ask them to check the reference and the email or mobile; never say which was wrong. For a booking made in this conversation, use get_booking_status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email the traveller booked with.",
                "format": "email",
                "type": "string"
              },
              "mobile": {
                "description": "Or the mobile on the booking, instead of the email.",
                "maxLength": 30,
                "type": "string"
              },
              "reference": {
                "description": "The Vuelo booking reference, VU-...",
                "maxLength": 20,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
