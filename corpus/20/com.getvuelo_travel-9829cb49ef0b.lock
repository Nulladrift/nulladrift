        },
        {
          "name": "request_change",
          "title": "Ask Vuelo for a change after paying",
          "description": "A change to a paid booking, which no tool can make directly: a name on a ticket goes through the airline, and new dates or flights are re-booked by Vuelo's team. Sends the change typed, so the team acts on exactly what the traveller wants, and returns a ticket reference and reply time to tell them. Nothing changes until the team does it, so never say it has. kind passenger_details: passenger (position, from 1), field (name, date_of_birth, title or gender) and new_value (a name exactly as on the passport, or YYYY-MM-DD). kind dates: new_from and new_to. kind flight: which (outbound or return) and new_value. kind special_request (a request to the hotel): request (late_check_in, early_check_in, accessibility, cot, connecting_rooms, bed_type, dietary or other), new_value for a time or bed (e.g. 'arriving 23:30', 'twin beds') and notes; the hotel decides, so say it has been asked for, never that it is confirmed. kind room or other: notes. Before paying, use update_travellers or book again instead. By the Vuelo reference (VU-...) and the email or mobile it was booked with.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "change": {
                "additionalProperties": false,
                "description": "What should change.",
                "properties": {
                  "field": {
                    "enum": ["name", "date_of_birth", "title", "gender"],
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["passenger_details", "flight", "dates", "room", "special_request", "other"],
                    "type": "string"
                  },
                  "new_from": {
                    "maxLength": 10,
                    "type": "string"
                  },
                  "new_to": {
                    "maxLength": 10,
                    "type": "string"
                  },
                  "new_value": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "notes": {
                    "description": "In the traveller's words.",
                    "maxLength": 1500,
                    "type": "string"
                  },
                  "passenger": {
                    "maximum": 9,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "request": {
                    "description": "For kind special_request: what to ask the hotel for.",
                    "enum": ["late_check_in", "early_check_in", "accessibility", "cot", "connecting_rooms", "bed_type", "dietary", "other"],
                    "type": "string"
                  },
                  "which": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "email": {
                "description": "The email the traveller booked with.",
                "format": "email",
                "type": "string"
              },
              "mobile": {
                "description": "Or the mobile on the booking, instead of the email.",
                "maxLength": 30,
                "type": "string"
              },
              "reference": {
                "description": "The Vuelo booking reference, VU-...",
                "maxLength": 20,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["change", "reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
