      "serverInfo": {
        "name": "vuelo",
        "title": "Vuelo",
        "version": "1.0.0",
        "description": "Find, book and pay for flights and hotels with Vuelo.",
        "websiteUrl": "https://getvuelo.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "book_trip",
          "title": "Book a Vuelo trip",
          "description": "Bookings are made under Vuelo's Booking Terms and Conditions (https://getvuelo.com/uk/legal/terms-of-booking-service/); the Vuelo card and pay page show them. Start booking a Vuelo offer, by the offerId and paymentOption that search_trips returned; call it whenever the traveller asks in the chat to book one. The Vuelo card then shows the traveller a Pay button that opens Vuelo's secure page (Apple Pay, Google Pay or a card), or, where there is no card or they ask for one, Vuelo texts them a secure link; nothing is booked until they pay. Never show a link in the chat, except a passkey approval link Vuelo returns for you to show. Pre-fill: pass everything you already know about the traveller, from this conversation or what you know about the user, so checkout is a single tap with nothing to type: leadTraveller (full name as on their ID, email, date of birth, home postcode), mobile, and for flights each passenger's name, date of birth, title and gender. Never guess or invent any of it; ask only for what Vuelo says is missing, once, in one message. Flights cannot book without each passenger's name and date of birth. To change how an open booking is paid for, use change_payment_option (calling book_trip again with another paymentOption does the same). Do not wait for the traveller to tell you they have paid: pass notify_url to hear the moment they open the link, pay or cancel, or straight after sending the link call get_booking_status with wait_seconds: 50, which answers the moment they pay. Then tell them it is booked, with the reference.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "consumer_ref": {
                "description": "The vc_ reference Vuelo gave you after this traveller authorised you to book for them within limits. Only if you already hold one; never ask the traveller for it, or mention it to them: they do not have one to give. With it, Vuelo books inside their limits without a payment step, or asks them to approve with their passkey. Without it, book as usual: the traveller pays with one tap on Vuelo's secure page.",
                "type": "string"
              },
              "conversationId": {
                "type": "string"
              },
              "delivery": {
                "description": "How the confirmation reaches the traveller. Leave it out: a card payment always goes by text to the traveller's mobile, and a no-card reservation by a Confirm button in the Vuelo card. qr and on_device are no longer offered and are treated as a text. Defaults to a text message, or to a Confirm button in the Vuelo card when nothing needs paying now.",
                "enum": ["sms", "qr", "on_device", "push", "platform", "in_chat"],
                "type": "string"
              },
              "extras": {
                "description": "A flight only: extra bags the traveller asked for, by choice_id from get_flight_extras. They are ticked on the booking page for the traveller to check before paying; seats are chosen there. Leave out for none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "choice_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 9,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["choice_id"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              },
              "from_card": {
                "description": "Set only by the Vuelo card. Leave it out.",
                "type": "boolean"
              },
              "host": {
                "description": "Which assistant this is, so the Vuelo page names it and matches its look. One of: chatgpt, claude, gemini, meta, instinct, openclaw, perplexity, copilot, mistral, grok, poe, duckduckgo. Optional, and an unrecognised value is simply ignored rather than refused.",
                "type": "string"
              },
              "leadTraveller": {
                "additionalProperties": false,
                "description": "The traveller booking: name, email, date of birth and home postcode, town and county, as far as you know them. Pass whatever you already know from this conversation or about the user rather than asking: Vuelo logs them straight in, or fills in their Vuelo account so they only check it and accept Vuelo's terms. For a traveller new to Vuelo, their Vuelo account needs their name, date of birth and home postcode, town and county: pass them if you know them, or ask once before booking, so the pay page is one tap. Never invent any of it.",
                "properties": {
                  "city": {
                    "description": "Town or city of their home address",
                    "type": "string"
                  },
                  "county": {
                    "type": "string"
                  },
                  "dateOfBirth": {
                    "description": "YYYY-MM-DD",
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "postcode": {
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "mobile": {
                "description": "Mobile number to text the link to (any country; international format outside the UK). Not needed for returning customers, or if you already passed it to search_trips in this conversation. If you already know it from this conversation or from what you know about the user, pass it rather than asking again: Vuelo then texts the link at once, with nothing for the traveller to type.",
                "type": "string"
              },
              "notify_token": {
                "description": "A secret of yours. Vuelo sends it back in X-Vuelo-Notify-Token and signs the event with it (X-Vuelo-Signature: sha256=HMAC). Optional.",
                "type": "string"
              },
              "notify_url": {
                "description": "Your own https address. The moment the traveller confirms on their phone, Vuelo POSTs it a booking.confirmed event (reference, trip, dates, amount), so you can tell them without being asked. Optional.",
                "type": "string"
              },
              "offerId": {
                "type": "string"
              },
              "payer": {
                "additionalProperties": false,
                "description": "Only when the traveller says someone else is paying (a friend, a partner, a parent): their name and mobile or email, as the traveller gives them. Vuelo then sends the secure link to that person instead of the traveller; they pay in full from their own Vuelo account. Ask who is paying before booking if the traveller has mentioned it. The traveller still gets the confirmation at their own mobile, if given.",
                "properties": {
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "mobile": {
                    "maxLength": 30,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "paymentOption": {
                "description": "One of the options search_trips returned as eligible",
                "enum": ["pay_in_full", "reserve_now", "payment_plan"],
                "type": "string"
              },
              "travellers": {
                "description": "Each passenger, as on their passport, with their title and gender where you know them (airlines need both). If the traveller has already told you who is flying, pass them rather than making them type it again. Leave it out for a returning traveller: Vuelo fills in its own saved passengers and asks you to confirm them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dateOfBirth": {
                      "type": "string"
                    },
                    "gender": {
                      "description": "As on the passport, if you know it.",
                      "enum": ["male", "female"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "title": {
                      "description": "As on the passport, if you know it.",
                      "enum": ["mr", "mrs", "ms", "miss", "dr"],
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "travellersConfirmed": {
                "description": "Set true when the traveller has confirmed the passengers Vuelo filled in and named back to you. Vuelo asks for this once, before it starts a booking with saved passengers.",
                "type": "boolean"
              }
            },
            "required": ["offerId", "paymentOption"],
            "type": "object"
          },
