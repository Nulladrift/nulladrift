        {
          "name": "change_payment_option",
          "title": "Change how a Vuelo booking is paid for",
          "description": "When the traveller wants to pay a different way (for example reserve now instead of paying in full) before they have confirmed. Switches the open booking to that paymentOption; the link already texted stays the same and opens with the new choice, so nothing new is sent. Only an option the trip lists as available.",
