        {
          "name": "get_booking_status",
          "title": "Vuelo booking status",
          "description": "The current state of a Vuelo booking started with book_trip. Pass wait_seconds (up to 50) straight after the traveller has the link: it answers the moment they open it, pay or cancel, so you can tell them it is booked without being told.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "taskId": {
                "type": "string"
              },
              "wait_seconds": {
                "description": "Hold the answer until the booking changes, up to this many seconds.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["taskId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
