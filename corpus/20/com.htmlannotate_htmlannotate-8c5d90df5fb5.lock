{
  "lockfileVersion": 2,
  "subjects": {
    "com.htmlannotate/htmlannotate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.htmlannotate.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "htmlannotate",
        "title": "HTMLAnnotate",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use share_html when the user wants to share, publish or get feedback on an HTML page you wrote. Use share_url for a page that is already online. Before sharing, ask the user if they want an email when someone comments, and pass it as notify_email. Give the user the review link to send to their client, and tell them to keep the manage link private and saved. Always tell the user that links made without signing in last only 24 hours, after which they lose the page and its comments, and that adding https://mcp.htmlannotate.com/account instead (sign in once, free plan) keeps pages in their account for 14 days, or forever on Pro. Later in the conversation, use get_comments with the manage link to read the client's feedback and make the changes (get_page_html gives the page's current HTML if you don't have it), publish them with update_page, then resolve_comment for each one you fixed. Ask before replying on the user's behalf. With the manage link you can also read the page's current HTML before editing it (get_page_html), read one comment with its screenshot (get_comment), read the page health check (get_health_check), list and restore versions (list_versions, restore_version), set a comment's status, priority, labels or assignee (set_comment_status), and set the due date, pause comments or rename the page (update_page_settings). Nothing here deletes pages or comments.",
      "tools": [
        {
          "name": "get_comment",
          "title": "Read one comment",
          "description": "Read one comment in full: what the reviewer said, the element it is pinned to, its status, priority, labels, assignee and replies, plus the screenshot of what the reviewer saw, returned as an image. Use it when the user asks about a specific comment, or to look at the screenshot before making a change. To read every comment on a page at once, use get_comments instead.",
          "inputSchema": {
            "properties": {
              "include_screenshot": {
                "description": "Return the reviewer's screenshot as an image. Default true.",
                "type": "boolean"
              },
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              },
              "number": {
                "description": "The comment number as shown by get_comments, like 3 for #3.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["manage_link", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one comment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf5d29e7dbab033fc8a0d750d5b932361f37d680105343e145f5bf35c635898f"
        },
        {
          "name": "get_comments",
          "title": "Read the feedback on a page",
          "description": "Read every comment on an HTMLAnnotate page: what each reviewer said, which element it is pinned to (with a CSS selector), the screen size, the page version it was left on, suggested text changes and replies. Use it when the user asks what their client said, or wants you to make the requested changes. Needs the page's private manage link (returned by share_html or share_url, or pasted by the user). For one comment with its screenshot, use get_comment.",
          "inputSchema": {
            "properties": {
              "include_resolved": {
                "description": "Also list comments already marked resolved. Default false.",
                "type": "boolean"
              },
              "include_screenshots": {
                "description": "Also return the reviewers' screenshots as images (up to 4 per call, in comment order). Default false. Use get_comment to see one comment's screenshot.",
                "type": "boolean"
              },
              "manage_link": {
                "description": "The private manage link, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              }
            },
            "required": ["manage_link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the feedback on a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9d1f5c13e49fa4bea8f14369d48206c94f8bbe7a0d7c6039572518681be3100"
        },
        {
          "name": "get_health_check",
          "title": "Read the page health check",
          "description": "Read the page's latest health check: a score (how many checks passed), and each problem with where it is on the page in plain words (like \"In the navigation menu\"), the element, and how to fix it. Checks cover broken links, image descriptions, leftover filler text, headings, search, accessibility and the share preview. Runs the check first if the page has none yet. On the Free plan, Search, Accessibility and Share preview problems are listed without the item-by-item detail. Not for PDFs.",
          "inputSchema": {
            "properties": {
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              },
              "run_again": {
                "description": "Run the check again now instead of reading the last result. Use it after publishing a new version. Default false.",
                "type": "boolean"
              }
            },
            "required": ["manage_link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Read the page health check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd79c9b213a15c45cef66e36e792440719463ce1fe1e861080a3ee3d376209cd"
        },
        {
          "name": "get_page_html",
          "title": "Read a page's HTML",
          "description": "Get the HTML of a page shared as HTML, exactly as it was uploaded, so you can make the changes reviewers asked for and publish the result with update_page. Call it before editing when you don't already have the page's code in this conversation. Defaults to the latest version. Pages over about 400 KB come back in parts: call again with the next_offset it gives. For a live website it returns the site's current HTML for reference only, since the site is changed in its own code or builder. PDFs have no HTML.",
          "inputSchema": {
            "properties": {
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              },
              "offset": {
                "description": "Optional. Where to start, for a big page: the next_offset from the previous call. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "version": {
                "description": "Optional. The version to read, as shown by list_versions. Default: the latest.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["manage_link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a page's HTML"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5e0fbac55fdb43294e80189d7eb6218ae72c21d44679e9ef29e1043d32842819"
        },
        {
          "name": "list_versions",
          "title": "List a page's versions and approvals",
          "description": "List every version of a page: its number, when it was published, its name, how many comments were left on it, and who approved it or asked for changes on it. Use it when the user asks which version a client signed off, or before restoring an earlier version with restore_version. It doesn't return page code: use get_page_html with a version number for that.",
          "inputSchema": {
            "properties": {
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              }
            },
            "required": ["manage_link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a page's versions and approvals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57ff49aea77598683d3405e1d6f19ed674d4c2da8174e47b6db09dacc79e3997"
        },
        {
          "name": "reply_to_comment",
          "title": "Reply to a comment",
          "description": "Post a reply under one comment on an HTMLAnnotate page, as the page owner. Everyone in that thread gets an email. Confirm the wording with the user first. To change a comment's status instead, use resolve_comment or set_comment_status.",
          "inputSchema": {
            "properties": {
              "manage_link": {
                "description": "The private manage link for the page.",
                "type": "string"
              },
              "number": {
                "description": "The comment number as shown by get_comments, like 3 for #3.",
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "The reply as plain text. Everyone in the thread can read it.",
                "type": "string"
              }
            },
            "required": ["manage_link", "number", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Reply to a comment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5416ee9d923154b3d4f6aeca394d257f47ce33ee4ae405f89b4fce164b132b0"
        },
        {
          "name": "resolve_comment",
          "title": "Mark a comment resolved",
          "description": "Mark a comment on an HTMLAnnotate page as resolved (done), or reopen it. Use after the requested change has been made. Everyone in the thread gets an email when it is resolved. To set it to in progress, or change its priority, labels or assignee, use set_comment_status.",
          "inputSchema": {
            "properties": {
              "manage_link": {
                "description": "The private manage link for the page.",
                "type": "string"
              },
              "number": {
                "description": "The comment number as shown by get_comments, like 3 for #3.",
                "minimum": 1,
                "type": "integer"
              },
              "resolved": {
                "description": "true to resolve (default), false to reopen.",
                "type": "boolean"
              }
            },
            "required": ["manage_link", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Mark a comment resolved"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:47591867d22f2ab180c5c7fc81ea867ebf5579ecf1863b210d4f1b5cc9854d95"
        },
        {
          "name": "restore_version",
          "title": "Make an earlier version current again",
          "description": "Bring back an earlier version of a page as a new version on the same review link. Nothing is deleted: every version and its comments stay in the version menu. Free pages keep up to 3 versions, so on Free this fails once a page has 3. Confirm the version number with the user first. To publish new edits instead, use update_page.",
          "inputSchema": {
            "properties": {
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              },
              "note": {
                "description": "Optional short note for that email.",
                "type": "string"
              },
              "notify_reviewers": {
                "description": "Email everyone who commented that a new version is ready. Ask the user first. Default false.",
                "type": "boolean"
              },
              "version": {
                "description": "The earlier version to bring back, as shown by list_versions.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["manage_link", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Make an earlier version current again"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3912f498e7b50f64755ed43f4f52188a9c1b79e13b3e5ff8e7637b63edd2957"
        },
        {
          "name": "set_comment_status",
          "title": "Set a comment's status, priority, labels or assignee",
          "description": "Change how a comment is tracked, the same way the HTMLAnnotate app does: its status (open, in progress, resolved), priority, labels and who it is assigned to. Pass only what should change. Resolving emails everyone in the thread, and assigning emails the person assigned. Labels replace the comment's current labels (up to 3). To only mark a comment done or reopen it, resolve_comment is simpler.",
          "inputSchema": {
            "properties": {
              "assignee": {
                "description": "Optional. A teammate or reviewer on this page, by name or email. \"none\" unassigns it.",
                "type": "string"
              },
              "labels": {
                "description": "Optional. The labels the comment should have. An empty list clears them.",
                "items": {
                  "enum": ["Bug", "Copy", "Design", "Question", "Idea"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array",
                "uniqueItems": true
              },
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              },
              "number": {
                "description": "The comment number as shown by get_comments, like 3 for #3.",
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "description": "Optional. \"none\" clears it.",
                "enum": ["none", "low", "medium", "high", "urgent"],
                "type": "string"
              },
              "status": {
                "description": "Optional. The new status.",
                "enum": ["open", "in progress", "resolved"],
                "type": "string"
              }
            },
            "required": ["manage_link", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Set a comment's status, priority, labels or assignee"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1299303abbd06114c66b70ca5f066407bfc761b5236e535d29a27f080784d253"
        },
        {
          "name": "share_html",
          "title": "Share an HTML page for feedback",
          "description": "Publish a complete HTML page (for example a landing page, prototype or one-pager you just wrote) to HTMLAnnotate and get a review link. Anyone with the link can open the page and click any heading, button or image to leave a comment pinned to it, with no account. Pass the whole page as one self-contained HTML document (inline the CSS; images as URLs or data URIs). Returns the review link to send to the client and a private manage link for the owner. For a page that is already online, use share_url instead. To update a page you already shared, use update_page so the link stays the same.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "The full HTML document, starting with <!doctype html> or <html>.",
                "type": "string"
              },
              "notify_email": {
                "description": "Optional. The user's email, so HTMLAnnotate emails them when someone comments. Ask the user before sharing whether they want this.",
                "type": "string"
              },
              "title": {
                "description": "Optional short name for the page, used in the file name.",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Share an HTML page for feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50a8f9ae4efb54519aef5cf32b051f0412e00629688739419384d6005fe5f1c0"
        },
        {
          "name": "share_url",
          "title": "Share a live website for feedback",
          "description": "Turn a public web address (a published site, staging link or deploy preview) into an HTMLAnnotate review link where people click any element and comment on it. The page must open in a browser without signing in. Returns the review link and a private manage link for the owner. For HTML you wrote in this conversation, use share_html instead.",
          "inputSchema": {
            "properties": {
              "notify_email": {
                "description": "Optional. The user's email, so HTMLAnnotate emails them when someone comments. Ask the user before sharing whether they want this.",
                "type": "string"
              },
              "url": {
                "description": "The page address, for example https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Share a live website for feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58cdab4733cdb38908cbdaf15d4e590dcb288d1866d9f5bb857401226d4402a4"
        },
        {
          "name": "update_page",
          "title": "Publish a new version of a page",
          "description": "Replace an HTML page on HTMLAnnotate with a new version, on the same review link, so the client sees the update without a new link. The new version starts with no comments; earlier versions keep theirs. Use after making the changes from get_comments (get the current code with get_page_html if you don't have it). Needs the manage link. Only for pages shared as HTML, not live websites. To bring back an earlier version, use restore_version; to rename the page or set a due date, use update_page_settings.",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "The full new HTML document.",
                "type": "string"
              },
              "manage_link": {
                "description": "The private manage link for the page.",
                "type": "string"
              },
              "note": {
                "description": "Optional short note for that email, like what changed.",
                "type": "string"
              },
              "notify_reviewers": {
                "description": "Email everyone who commented that a new version is ready. Ask the user first.",
                "type": "boolean"
              },
              "version_name": {
                "description": "Optional short name for the new version, like \"Shorter hero, new photo\". Shown in the version menu.",
                "type": "string"
              }
            },
            "required": ["html", "manage_link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish a new version of a page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:870e885bd357a34d0f0373ad5827e0f48cfcc141839006d43eadbfefee0b8967"
        },
        {
          "name": "update_page_settings",
          "title": "Change a page's settings",
          "description": "Change a page's settings: the feedback due date (reviewers see it and get a reminder the day before), pausing or resuming new comments, and the page's name. Pass only what should change. The due date has to fall before the page's link expires (Free links last 14 days). It doesn't change the page itself: use update_page to publish new content.",
          "inputSchema": {
            "properties": {
              "comments_paused": {
                "description": "Optional. true pauses new comments and replies from reviewers (everyone can still read them); false lets them comment again.",
                "type": "boolean"
              },
              "due_date": {
                "description": "Optional. The feedback due date as YYYY-MM-DD, within the next year, or \"none\" to clear it.",
                "type": "string"
              },
              "manage_link": {
                "description": "The private manage link for the page, like https://htmlannotate.com/manage/<page>#k=<key>",
                "type": "string"
              },
              "timezone": {
                "description": "Optional. The user's time zone, like Asia/Kolkata or America/New_York, so the due date ends at midnight for them. Defaults to UTC.",
                "type": "string"
              },
              "title": {
                "description": "Optional. A new name for the page, as shown in My projects and emails. The review link stays the same.",
                "type": "string"
              }
            },
            "required": ["manage_link"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change a page's settings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c2fb46aa4dbc0ebf5b858a8ca59b646c92e000fae55188aa312056e323da8302"
        }
