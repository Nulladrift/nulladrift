                "type": "boolean"
              },
              "query": {
                "description": "free text, e.g. \"markdown notes\"",
                "type": "string"
              },
              "sort": {
                "description": "votes = most upvoted",
                "enum": ["top", "votes", "new", "rating", "name"],
                "type": "string"
              },
              "surface": {
                "description": "only apps that are also a CLI (curl | sh installer), an HTTP API, an MCP server or a native desktop app",
                "enum": ["cli", "api", "mcp", "desktop"],
                "type": "string"
