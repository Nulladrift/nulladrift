{
  "lockfileVersion": 2,
  "subjects": {
    "com.metruvo/fund-comparison": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://metruvo.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "metruvo",
        "title": "Metruvo",
        "version": "1.1.0",
        "websiteUrl": "https://metruvo.com",
        "icons": [
          {
            "src": "https://metruvo.com/metruvo-mark.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://metruvo.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only portfolio analysis from published fund data. Show the short disclaimer line (structuredContent.disclaimer.short) before results; the full text is in disclaimer.full. Build tables from structuredContent (rows, table, funds) rather than the text. Keep every missingData item, date and coverage figure visible. Explore at https://metruvo.com/check. Include the result's checkUrl as a link so the user can open the same comparison on metruvo.com.",
      "tools": [
        {
          "name": "compare_funds",
          "description": "Analyze two ETFs as a 50/50 portfolio, with overlap and issuer facts including dated ongoing charges side by side, and each fund's own region and sector exposure. Identify each side with exactly one ISIN or ticker; a ticker can be ambiguous across exchanges. Unknown facts remain null. Returns checkUrl: a shareable link to the same result.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "oneOf": [
                  {
                    "required": ["isinA"]
                  },
                  {
                    "required": ["tickerA"]
                  }
                ]
              },
              {
                "oneOf": [
                  {
                    "required": ["isinB"]
                  },
                  {
                    "required": ["tickerB"]
                  }
                ]
              }
            ],
            "properties": {
              "isinA": {
                "description": "ISIN with a valid check digit.",
                "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                "type": "string"
              },
              "isinB": {
                "description": "ISIN with a valid check digit.",
                "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                "type": "string"
              },
              "tickerA": {
                "description": "Exchange ticker, e.g. VWCE or SWDA.L; may match listings on several exchanges.",
                "pattern": "^[A-Za-z0-9.-]{2,20}$",
                "type": "string"
              },
              "tickerB": {
                "description": "Exchange ticker, e.g. VWCE or SWDA.L; may match listings on several exchanges.",
                "pattern": "^[A-Za-z0-9.-]{2,20}$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two funds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db649e0d05e82d2b990a26ff7ab8feda991ec5160b7d02598703ea4902b4b049"
        },
        {
          "name": "rank_funds",
          "description": "Sort 2 to 10 funds by up to three published facts: ongoing charge, US share, pairwise overlap and holdings count. Rows follow the criteria in order. A missing fact sorts last and stays null; it is never estimated. Rates are decimal fractions (0.07 = 7%). Analysis based on published fund data. Returns checkUrl: a shareable link to the same result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "criteria": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "direction": {
                      "enum": ["asc", "desc"],
                      "type": "string"
                    },
                    "metric": {
                      "enum": ["ongoingCharge", "usShare", "overlap", "holdingsCount"],
                      "type": "string"
                    }
                  },
                  "required": ["direction", "metric"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "isins": {
                "items": {
                  "description": "ISIN with a valid check digit.",
                  "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["criteria", "isins"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank funds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92b68a309f3d9804f042dbbcf16026fb8b85ed6e840bb15c2645e7f42090b522"
        },
        {
          "name": "search_funds",
          "description": "Search the published instrument catalogue by name, ISIN or ticker; includes currency and listing identifiers. Returns checkUrl: a shareable link to the same result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search funds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3574a381f607e5729413708e16245ff9b5f2447273d7489557ce8f41e781ac70"
        },
        {
          "name": "xray_portfolio",
          "description": "Analyze free-preview ETF overlap and region/sector/single-company concentration findings, known ongoing charges and regional/sector exposures from published evidence. Identify each holding with exactly one ISIN or ticker; a ticker can be ambiguous across exchanges. Use positive relative weights, values in one base currency, or omit all amounts for equal weights. Never mix weights and values. At most 10 distinct tickers per call. A single-company finding's isin is an ISIN when one is published, otherwise the fund file's own identifier. Dates, coverage and all data gaps accompany the result. Returns checkUrl: a shareable link to the same result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baseCurrency": {
                "default": "EUR",
                "enum": ["EUR", "GBP", "CHF", "USD"],
                "type": "string"
              },
              "holdings": {
                "items": {
                  "additionalProperties": false,
                  "oneOf": [
                    {
                      "required": ["isin"]
                    },
                    {
                      "required": ["ticker"]
                    }
                  ],
                  "properties": {
                    "isin": {
                      "description": "ISIN with a valid check digit.",
                      "pattern": "^[A-Z]{2}[A-Z0-9]{9}[0-9]$",
                      "type": "string"
                    },
                    "ticker": {
                      "description": "Exchange ticker, e.g. VWCE or SWDA.L; may match listings on several exchanges.",
                      "pattern": "^[A-Za-z0-9.-]{2,20}$",
                      "type": "string"
                    },
                    "value": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "weight": {
                      "exclusiveMinimum": 0,
                      "maximum": 100,
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["holdings"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Portfolio X-ray"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f3c50b38af7c0d687c8cb5d13fe8391b4b3513954a455ec1108378f8c5acf22"
        }
      ],
      "digest": "sha256:187a0f69609f6cd091419b489a208ff1bae54b268fbfc228e52daa97e5f346a7"
    }
  }
}
