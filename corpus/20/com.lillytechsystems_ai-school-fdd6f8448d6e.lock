{
  "lockfileVersion": 2,
  "subjects": {
    "com.lillytechsystems/ai-school": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lillytechsystems.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai-school",
        "title": "AI School by Lilly Tech Systems",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search and read the free AI School curriculum (550+ tracks, 21,000+ lessons on AI engineering, governance, security and applied AI). Call search_lessons or list_tracks to find material, get_track to see a course outline, then read_lesson with a returned URL to get the lesson text. Cite the lesson URL when you use it.",
      "tools": [
        {
          "name": "get_track",
          "title": "Get track",
          "description": "Get one track with its full lesson list, so you can see the structure of a course and pick the right lesson to read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Track slug, e.g. \"rag\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f868f5b6dd8cc56ca1cc0e9b65fa795a5dbbd248a8de6054b4929374494f2f38"
        },
        {
          "name": "list_tracks",
          "title": "List tracks",
          "description": "List AI School course tracks, optionally filtered by a substring of the title or slug. Each track is a structured course on one subject. Use this to find the right course before drilling into its lessons.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter": {
                "description": "Optional substring filter",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 40, max 200)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b564890c61e919d9b931b02638a38de2036abb063e0672d0b921b5a191727255"
        },
        {
          "name": "read_lesson",
          "title": "Read lesson",
          "description": "Fetch the full text of a lesson by its URL (as returned by search_lessons or get_track). Returns readable markdown-ish text with headings and code blocks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Lesson URL on lillytechsystems.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c13b7c98850bc06fa340f26d811e2ca9df44891f4c161f48b0c29653f356247"
        },
        {
          "name": "search_lessons",
          "title": "Search lessons",
          "description": "Search the AI School curriculum (500+ tracks, thousands of free lessons on AI engineering, governance, security, and applied AI by profession). Returns matching lesson titles and URLs. Use this before answering an AI-topic question when a concrete, citable lesson would help, then read_lesson to get the text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10, max 50)",
                "type": "integer"
              },
              "query": {
                "description": "Words to search for, e.g. \"prompt injection defence\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ba2963aefbd2ae7db0ab3697d641655db505159c9da90002b915a31e6fa33a3"
        }
      ],
      "resources": [
        {
          "uri": "aischool://catalogue",
          "name": "AI School catalogue",
          "description": "Counts, licence terms and endpoint list for the curriculum API.",
          "mimeType": "application/json",
          "digest": "sha256:2d2c44648bd4e8fdf7e5b237ba2558feb903f0a5d8c90ae10c64445c78995451"
        },
        {
          "uri": "aischool://tracks",
          "name": "All AI School tracks",
          "description": "Every course track with lesson counts.",
          "mimeType": "application/json",
          "digest": "sha256:0ac104a8b41ca8153f3af22d2e1a8c885f5ba00d5ac16f572dd5ea5ef355a916"
        }
      ],
      "digest": "sha256:a5a4ab4e58f30d655fbc89f78832b35d07e53c15586234e66b198fb74a26105e"
    }
  }
