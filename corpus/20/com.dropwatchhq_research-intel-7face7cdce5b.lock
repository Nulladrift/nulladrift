        {
          "name": "delta_digest",
          "description": "New grants + new trials in a filter over the last N days (the weekly-digest payload). Best for BD teams.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Lookback days (default 7).",
                "type": "number"
              },
              "ic": {
                "description": "NIH Institute/Center abbreviation, e.g. 'NCI'.",
                "type": "string"
              },
              "institution": {
                "description": "Institution name substring.",
                "type": "string"
              },
              "keyword": {
                "type": "string"
              },
              "kind": {
                "description": "'grant' or 'trial' to restrict.",
                "type": "string"
              },
              "maxAmount": {
                "type": "number"
              },
              "minAmount": {
                "type": "number"
              },
              "phase": {
                "description": "Trial phase substring, e.g. 'PHASE2'.",
                "type": "string"
              },
              "pi": {
                "description": "Principal investigator name substring.",
                "type": "string"
              },
              "sponsor": {
                "description": "Trial sponsor name substring.",
                "type": "string"
              },
              "sponsorClass": {
                "description": "INDUSTRY | NIH | OTHER_GOV | OTHER | INDIV.",
                "type": "string"
              },
              "state": {
                "description": "2-letter US state of the org/site.",
                "type": "string"
              },
              "topic": {
                "description": "Canonical topic slug, e.g. 'oncology', 'neuroscience'.",
                "type": "string"
              }
            },
            "type": "object"
          },
