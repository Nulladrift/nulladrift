      "instructions": "Hospital payment figures from official CMS data, plus the 2027 rate-change atlas: Medicare physician fee schedule amounts for 2026 and 2027 by code and locality, computed from the CMS Relative Value Files. Amounts are published Medicare averages or fee schedule amounts for a stated year — benchmarks, not quotes. Always say what the amount is and cite the source. Without an API key results are capped.",
      "tools": [
        {
          "name": "atlas_all_changes",
          "title": "The complete 2026 → 2027 change table (Atlas licence)",
          "description": "Every code’s 2026 and 2027 fee schedule amounts and the change, paged with limit and offset. Requires an Atlas API license on the account (or the owner): the free tier and other plans do not include the bulk table — single codes, the movers and locality figures stay public.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "number"
              },
              "offset": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The complete 2026 → 2027 change table (Atlas licence)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9d254c0df5f842842392d7f2f85e75bfb5af8d70fda6b9ef1c1cdaac6f322f9d"
        },
        {
          "name": "atlas_code_change",
          "title": "One code: 2026 vs 2027 fee schedule amounts",
          "description": "For one HCPCS code (and optional modifier): the Medicare physician fee schedule amounts for 2026 and 2027 — non-facility and facility, at the standard (non-QP) and qualifying-APM (QP) conversion factors — and the change. With a locality key (for example \"TX-31\"), that locality’s adjusted amounts are included. Amounts are computed from the CMS Relative Value Files by the formula CMS publishes; they are fee schedule amounts, not negotiated rates. Codes are identified by number: this dataset does not republish the AMA’s CPT descriptions.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "HCPCS code, e.g. \"99213\"",
                "type": "string"
              },
              "locality": {
                "description": "Locality key: state + number, e.g. \"TX-31\"",
                "type": "string"
              },
              "mod": {
                "description": "Modifier, e.g. \"26\"",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One code: 2026 vs 2027 fee schedule amounts"
