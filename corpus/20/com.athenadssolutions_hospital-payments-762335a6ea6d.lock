        {
          "name": "search_prices",
          "title": "Search hospital payment figures",
          "description": "Search what Medicare paid hospitals. q is free text: an everyday name of a hospital stay or outpatient procedure (\"knee replacement\", \"pneumonia\", \"pacemaker\"), a hospital name or a city. code is a DRG or APC code (\"470\", \"APC 5491\"). Each result is one hospital + one service: the average payment (labeled for what it is), billed charge, patient volume, CMS quality stars and the official source. Amounts are published Medicare averages, not quotes. Single tests, scans and visits (MRI, CT, labs, ER) are not in the data.",
          "inputSchema": {
            "properties": {
              "city": {
                "type": "string"
              },
              "code": {
                "description": "DRG or APC code",
                "type": "string"
              },
              "kind": {
                "description": "drg = hospital stays, apc = outpatient",
                "enum": ["drg", "apc"],
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "q": {
                "description": "Service, hospital or city in plain words",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or state name",
                "type": "string"
              }
            },
