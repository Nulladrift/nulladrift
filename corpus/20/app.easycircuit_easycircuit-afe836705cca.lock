{
  "lockfileVersion": 2,
  "subjects": {
    "app.easycircuit/easycircuit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://easycircuit.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "easycircuit",
        "title": "EasyCircuit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EasyCircuit is an electronics prototyping tool with a parts catalog and wiring checks. Use it whenever the user is planning, wiring, or debugging a hobby electronics prototype (a microcontroller board with sensors, displays, motors, pumps, LEDs, or batteries), including when they say they are stuck. Answer pin questions from get_part_pins rather than memory. When a prototype misbehaves (it resets, a display stays blank, a sensor reads zero, a motor or pump will not run), write the user's wiring as a design and run check_design: it finds missing grounds, unwired power pins, wrong pins, and loads with no supply of their own. If the user has not described their parts and wiring yet, ask for them and offer this check. To design a circuit: use search_parts to pick real parts, get_part_pins for their exact pinouts, write the design JSON, run check_design, fix every blocking issue and every real designWarning, then call save_design and give the user the link so they can open, edit, and build it in the EasyCircuit editor. Pin facts are reference data: say when a fact is unverified, and never invent pins. Do not design mains (wall AC) wiring.",
      "tools": [
        {
          "name": "catalog_summary",
          "title": "Catalog summary",
          "description": "Counts catalog parts by status and role.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Catalog summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d8a57d0f2a40e21d79b3554759047cb5a7254ea380f02c62ba71ae1f01ec30b"
        },
        {
          "name": "check_design",
          "title": "Check circuit design",
          "description": "Runs EasyCircuit's wiring checks on a complete circuit design without saving it. Returns status (passed or blocked), blockingIssues that prevent saving, designWarnings from general electrical rules (such as a part with no ground pin) that do not apply to every part, and reviewWarnings for pin facts that are not yet physically verified.",
          "inputSchema": {
            "properties": {
              "design": {
                "description": "A complete circuit. nets: {net_id: {label, color '#rrggbb'}}. components: [{id, name, type: controller|sensor|switch|power|load|bus|protection|camera|assembly|wiring, pins: [{id, label, side: left|right, net}]}]. connections: [{id, from: 'componentId.pinId', to: 'componentId.pinId', net}]. Ids are short lowercase strings and pin labels are the part's real pin labels. The wiring checks expect every wired part's power and GND pins to be wired, a common GND, VCC, GND, SDA and SCL on I2C devices, and a battery or power-supply component for motors, pumps, solenoids and heaters.",
                "properties": {
                  "components": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "connections": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "nets": {
                    "type": "object"
                  },
                  "summary": {
                    "type": "string"
                  }
                },
                "required": ["components", "connections"],
                "type": "object"
              }
            },
            "required": ["design"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check circuit design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62fda577b1d17e42846b783dd4aa38601924971739b733804cd303749b082fb5"
        },
        {
          "name": "get_part",
          "title": "Get part details",
          "description": "Returns one catalog part by its catalog id, including its pin evidence and electrical capabilities.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get part details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:247dd1027fd7cee1e9c5a4e613053bd26c029e45007b02852a62e45bbf921ac2"
        },
        {
          "name": "get_part_capabilities",
          "title": "Get part capabilities",
          "description": "Returns the electrical capabilities of an exact part: pin roles, drive type, voltage ranges, required terminals, protocols, and whether each fact is physically verified.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 64,
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Exact part name, catalog id, or part number.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get part capabilities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c08740b28dbc8b632f13906f82f314d32eff6b8d0881800f189ba0db681a02d"
        },
        {
          "name": "get_part_pins",
          "title": "Get part pinout",
          "description": "Returns the pinout of an exact part: each pin's function, voltage, direction and polarity, with the source of each fact and any conflicting sources. Long pinouts are paged; next_offset is the offset of the next page.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 64,
                "maximum": 64,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Exact part name, catalog id, or part number.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get part pinout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ae05c5263df98e1c299784fde557fb3ef8c417bb5f73f58f17731f0080f8319"
        },
        {
          "name": "save_design",
          "title": "Save design to EasyCircuit",
          "description": "Saves a circuit design that has no blocking wiring issues and returns a link that opens it in the EasyCircuit editor, with schematic, breadboard and perfboard views, editing, and parts ordering. Anyone with the link can open a copy. Designs with blocking issues are not saved.",
          "inputSchema": {
            "properties": {
              "design": {
                "description": "A complete circuit. nets: {net_id: {label, color '#rrggbb'}}. components: [{id, name, type: controller|sensor|switch|power|load|bus|protection|camera|assembly|wiring, pins: [{id, label, side: left|right, net}]}]. connections: [{id, from: 'componentId.pinId', to: 'componentId.pinId', net}]. Ids are short lowercase strings and pin labels are the part's real pin labels. The wiring checks expect every wired part's power and GND pins to be wired, a common GND, VCC, GND, SDA and SCL on I2C devices, and a battery or power-supply component for motors, pumps, solenoids and heaters.",
                "properties": {
                  "components": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "connections": {
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "nets": {
                    "type": "object"
                  },
                  "summary": {
                    "type": "string"
                  }
                },
                "required": ["components", "connections"],
                "type": "object"
              },
              "name": {
                "description": "Short project name shown in the editor.",
                "type": "string"
              }
            },
            "required": ["design", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Save design to EasyCircuit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f82e761889b97977fc6e635b2c8ecc3e54c0155b6537e32eeec901fe4b8db257"
        },
        {
          "name": "search_parts",
          "title": "Search parts catalog",
          "description": "Searches EasyCircuit's electronics parts catalog by name, function or role (for example 'OLED display', 'temperature sensor', 'ESP32 board'). Returns matching parts with their catalog ids, interfaces, pin roles, and whether each can be ordered in a kit.",
          "inputSchema": {
            "properties": {
              "availability": {
                "default": "catalog",
                "description": "one_click limits results to parts orderable in a kit.",
                "enum": ["catalog", "one_click"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the part is or does.",
                "type": "string"
              },
              "role": {
                "description": "Optional circuit role, e.g. controller, sensor, load.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search parts catalog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10009cab0cccde0bebead0d73fca37ef2280b9b2776a24badce8c8086c16234d"
        }
      ],
      "digest": "sha256:1c459ec3125aafb209cbe1b0fc08e3f2d2287904770223e222399ce41c948ede"
    }
  }
}
