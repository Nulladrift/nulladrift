        },
        {
          "name": "repair_facturx_envelope",
          "description": "Action payante / authentifiée : répare automatiquement l'enveloppe technique PDF/A-3b, le flux XMP Factur-X et l'ICC sRGB sans jamais modifier les montants comptables.",
          "inputSchema": {
            "properties": {
              "pdf_base64": {
                "description": "Fichier PDF Factur-X défectueux encodé en Base64.",
                "type": "string"
              }
            },
            "required": ["pdf_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:739545d4261ece39caf636f84349dce0555ed31962402b2b3123e37a8d71f724"
        },
        {
          "name": "validate_facturx",
          "description": "Valide de manière 100 % déterministe (sans stockage) une facture Factur-X 1.09.2 (PDF/A-3b ou XML CII) ou OASIS UBL 2.1 / Peppol BIS 3.0 contre les schémas officiels EN 16931 et les règles françaises BR-FR-CTC.",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "description": "Contenu binaire du fichier PDF Factur-X, XML CII ou XML UBL 2.1 encodé en Base64.",
                "type": "string"
              },
              "filename": {
                "description": "Nom optionnel du fichier (ex: facture.pdf, factur-x.xml ou invoice_ubl.xml).",
                "type": "string"
              }
            },
            "required": ["content_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26c244ae02aab17df3e0fd2c2dfc2508bd2af90649fca26e9df09b5e3627fde3"
        },
        {
          "name": "verify_french_company",
          "description": "Outil gratuit : vérifie un SIREN (9 chiffres), SIRET (14 chiffres), n° de TVA FR ou nom d'entreprise (contrôle de clé de Luhn INSEE, calcul automatique du n° de TVA intracommunautaire FRxx et interrogation en direct du registre officiel INSEE / DGFiP pour vérifier si l'entreprise est active ou cessée).",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "SIREN, SIRET, numéro de TVA FR ou raison sociale à vérifier.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
