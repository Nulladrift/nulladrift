        {
          "name": "extract_accounting_fec",
          "description": "Action payante / authentifiée : génère des écritures comptables équilibrées Débit = Crédit au format officiel FEC DGFiP (18 colonnes) ou CSV Sage/Cegid depuis une facture Factur-X ou UBL 2.1.",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "description": "Contenu binaire du PDF Factur-X ou XML CII/UBL encodé en Base64.",
                "type": "string"
              },
              "export_format": {
                "description": "Format d'export (fec DGFiP ou sage_csv).",
                "enum": ["fec", "sage_csv"],
                "type": "string"
              },
              "filename": {
                "type": "string"
              },
              "journal_type": {
                "description": "Type de journal comptable (achats ou ventes).",
                "enum": ["achats", "ventes"],
                "type": "string"
              }
            },
            "required": ["content_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2834836f5c3bf94494f35154a908cffafb5729435c5abdecdb01ba6248ef2d9"
        },
        {
          "name": "generate_facturx_invoice",
          "description": "Action payante / authentifiée : génère une facture PDF/A-3b Factur-X 1.09.2 EN 16931 & BR-FR-CTC certifiée conforme à partir de données JSON structurées (avec PDF visuel optionnel en Base64).",
          "inputSchema": {
            "properties": {
              "invoice_data": {
                "description": "Objet JSON conforme au schéma GenerateFacturxRequest.",
                "type": "object"
              },
              "visual_pdf_base64": {
                "description": "Optionnel : PDF visuel A4 existant encodé en Base64 dans lequel embarquer le XML Factur-X.",
                "type": "string"
              }
            },
            "required": ["invoice_data"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0658abdd7eddcf6e2aedcc9c7cc12875f85d29efb65410c5dcc1bdf5f20d4979"
        },
        {
          "name": "parse_visual_pdf_invoice",
          "description": "Outil gratuit : extrait localement (en RAM, sans stockage) les identifiants (SIREN, SIRET, IBAN), numéro, date et montants HT/TVA/TTC d'un PDF classique pour préparer une facture Factur-X.",
          "inputSchema": {
            "properties": {
              "filename": {
                "description": "Nom optionnel du fichier PDF.",
                "type": "string"
              },
              "pdf_base64": {
                "description": "Contenu binaire du PDF visuel encodé en Base64.",
                "type": "string"
              }
            },
            "required": ["pdf_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
