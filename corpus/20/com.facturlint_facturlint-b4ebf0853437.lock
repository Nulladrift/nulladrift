      "tools": [
        {
          "name": "convert_invoice_format",
          "description": "Action payante / authentifiée : convertit un fichier XML UBL 2.1, XML CII ou PDF Factur-X en PDF A4 lisible scellé Factur-X (facturx_pdf), en XML CII (cii_xml) ou en XML UBL 2.1 (ubl_xml).",
          "inputSchema": {
            "properties": {
              "content_base64": {
                "description": "Contenu binaire du fichier XML ou PDF encodé en Base64.",
                "type": "string"
              },
              "filename": {
                "description": "Nom optionnel du fichier source.",
                "type": "string"
              },
              "target_format": {
                "description": "Format de sortie souhaité (par défaut : facturx_pdf).",
                "enum": ["facturx_pdf", "cii_xml", "ubl_xml"],
                "type": "string"
              }
            },
            "required": ["content_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5b6c137fc1e9b38097d4f620264e08eb6f02677b498d728a4499b15aebbf520"
        },
        {
          "name": "explain_facturx_rule",
          "description": "Explique une règle normative Factur-X / EN 16931 / BR-FR-CTC ou PDF/A-3 et fournit un exemple XML correct.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Code d'erreur (ex: BR-CO-15, BR-FR-04, PDFA3-FX-NS-INVALID).",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
