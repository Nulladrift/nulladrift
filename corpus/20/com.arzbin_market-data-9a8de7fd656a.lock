        {
          "name": "convert_to_toman",
          "title": "Convert to Toman",
          "description": "Converts a fiat, crypto, or gold amount to an estimated Toman value using latest Arzbin indicative market data. Not financial advice.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount of the asset to convert to Toman. Must be greater than zero.",
                "type": "number"
              },
              "assetType": {
                "description": "Asset type: fiat, crypto, or gold.",
                "type": "string"
              },
              "code": {
                "description": "Asset code such as USD, EUR, USDT, BTC, EMAMI, or GOLD_GRAM.",
                "type": "string"
              }
            },
            "required": ["amount", "assetType", "code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "amount": {
                    "type": "number"
                  },
                  "assetType": {
                    "type": "string"
                  },
                  "canonicalUrl": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  },
                  "disclaimer": {
                    "type": "string"
                  },
                  "estimatedToman": {
                    "type": "number"
                  },
                  "generatedAtUtc": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "rateToman": {
                    "type": "number"
                  }
                },
                "required": ["amount", "assetType", "canonicalUrl", "code", "disclaimer", "estimatedToman", "generatedAtUtc", "rateToman"],
                "type": ["object", "null"]
              },
              "disclaimer": {
                "type": "string"
              },
              "generatedAtUtc": {
                "format": "date-time",
                "type": "string"
              },
              "source": {
                "type": "string"
              }
            },
            "required": ["data", "disclaimer", "generatedAtUtc", "source"],
            "type": "object"
          },
