{
  "lockfileVersion": 2,
  "subjects": {
    "com.allmcpservers/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.allmcpservers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "allmcpservers",
        "title": "allMCPservers directory",
        "version": "1.0.0",
        "websiteUrl": "https://www.allmcpservers.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "allMCPservers lists MCP servers from the Official MCP Registry and Claude's Connectors Directory. Use search_mcp_servers to find servers, get_mcp_server for one server's setup details (remote endpoint or package), compare_mcp_servers to weigh a few options, and list_categories to browse. A listing is not a security audit: tell the user to review a server's permissions before connecting it, and share each result's url so they can read the full profile.",
      "tools": [
        {
          "name": "compare_mcp_servers",
          "title": "Compare MCP servers",
          "description": "Two to four servers side by side: transport, endpoint or package, authentication, version, last update and official listings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slugs": {
                "description": "Slugs from search results, or allmcpservers.com profile links.",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare MCP servers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:165b0fe96f737e54067e7072c0e5470df053027c80c1c94f37fb34de3f96b1df"
        },
        {
          "name": "get_mcp_server",
          "title": "Get an MCP server's details",
          "description": "One server's full profile: description, remote endpoint or package to install, required headers and environment variables, repository, documentation and the official listings it comes from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The server's slug from search results, or its allmcpservers.com profile link.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an MCP server's details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86cc4af673c173233430e1a0f2c76a0c7423e01c23877736a802432d897b1f94"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The directory's categories with how many servers each has.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d14eaf026a1cd95f368e2bae311195d978d13817925636a1702b92cc86ae76b5"
        },
        {
          "name": "search_mcp_servers",
          "title": "Search MCP servers",
          "description": "Search the allMCPservers directory of MCP servers from the Official MCP Registry and Claude's Connectors Directory. Returns matching servers with their slug, publisher, category, transport and profile link. Leave out query to browse, editor's picks first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only servers in this category. list_categories describes each one.",
                "enum": ["developer-tools", "data-and-databases", "search-and-research", "productivity", "browser-and-web", "design", "communication", "cloud-and-infra", "business", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page.",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in names and descriptions, such as \"postgres\" or \"browser automation\".",
                "maxLength": 120,
                "type": "string"
              },
              "source": {
                "description": "Only servers listed in the Official MCP Registry (registry) or Claude's Connectors Directory (claude).",
                "enum": ["registry", "claude"],
                "type": "string"
              },
              "transport": {
                "type": "string",
                "description": "remote: a hosted endpoint you connect to by URL. local: a package you run on your machine. Servers offering both match either.",
                "enum": ["remote", "local"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search MCP servers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1dbb87f81aef106321831d09c2f6e9b34faba4c47269bfd114a4278373dd29e3"
        }
      ],
