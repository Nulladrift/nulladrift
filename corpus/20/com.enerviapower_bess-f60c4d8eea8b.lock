            "properties": {
              "appliances": {
                "description": "لیست مصارف برقی",
                "items": {
                  "properties": {
                    "hoursPerDay": {
                      "description": "ساعت کارکرد در شبانه‌روز (فقط حالت خورشیدی)",
                      "type": "number"
                    },
                    "name": {
                      "description": "نام دستگاه",
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "تعداد",
                      "type": "number"
                    },
                    "watts": {
                      "description": "توان هر واحد بر حسب وات",
                      "type": "number"
                    }
                  },
                  "required": ["watts"],
                  "type": "object"
                },
                "type": "array"
              },
              "autonomyDays": {
                "default": 1,
                "description": "روزهای خودکفایی (حالت offgrid)",
                "type": "number"
              },
              "backupHours": {
