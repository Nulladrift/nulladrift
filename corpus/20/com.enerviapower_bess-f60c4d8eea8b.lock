      "instructions": "ابزارهای محاسبه سیستم ذخیره انرژی و خورشیدی انرویا پاور. برای پیشنهاد سیستم ابتدا مصارف یا الگو را بدهید. Enervia Power (Iran) tools: size a backup/off-grid solar + LiFePO4 system, suggest products, and search/fetch the Persian articles, products and contact page. All tools are read-only.",
