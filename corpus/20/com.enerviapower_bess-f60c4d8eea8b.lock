      "instructions": "ابزارهای محاسبه سیستم ذخیره انرژی و خورشیدی انرویا پاور. برای پیشنهاد سیستم ابتدا مصارف یا الگو را بدهید.",
      "tools": [
        {
          "name": "calculate_bess_system",
          "description": "محاسبه ظرفیت باتری، توان اینورتر و تعداد پنل خورشیدی موردنیاز بر اساس لیست مصارف یا پیک بار. Calculate required battery capacity, inverter power and solar panel count for a backup or off-grid system.",
          "inputSchema": {
            "properties": {
              "appliances": {
                "description": "لیست مصارف برقی",
                "items": {
                  "properties": {
                    "hoursPerDay": {
                      "description": "ساعت کارکرد در شبانه‌روز (فقط حالت خورشیدی)",
                      "type": "number"
                    },
                    "name": {
                      "description": "نام دستگاه",
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "تعداد",
                      "type": "number"
                    },
                    "watts": {
                      "description": "توان هر واحد بر حسب وات",
                      "type": "number"
                    }
                  },
                  "required": ["watts"],
                  "type": "object"
                },
                "type": "array"
              },
              "autonomyDays": {
                "default": 1,
                "description": "روزهای خودکفایی (حالت offgrid)",
                "type": "number"
              },
              "backupHours": {
