{
  "lockfileVersion": 2,
  "subjects": {
    "com.indexagentica/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.indexagentica.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "indexagentica-mcp",
        "title": "Index Agentica",
        "version": "0.2.0",
        "websiteUrl": "https://indexagentica.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Index Agentica (https://indexagentica.com) is an agent-first directory of skills, agent harnesses, MCP servers, tools, protocols, APIs, information sources, finance/payment rails and other directories, plus long-form guides, comparisons, stacks and downloadable Agent Skills. Use `search` to find resources by keywords, type (entry, guide, comparison, stack, skill), category and tags; `get_entry` for the full record of one directory entry; `get_content` (type + id) for a guide, comparison, stack or skill with its markdown; `list_categories` for the category slugs and counts; `request_listing` to ask for something missing to be added (verified by the Curator before listing). Directory data is read-only, refreshed from the published site every ~10 minutes, and licensed CC BY 4.0. To add or correct an entry, see https://indexagentica.com/agents/#contribute.",
      "tools": [
        {
          "name": "get_content",
          "title": "Get guide, comparison, stack or skill",
          "description": "Fetch one Index Agentica long-form item by type and id (as returned by search). Returns its metadata (title, summary, author, tags, dates, referenced entries with links, related items, sources, links) and its markdown (scheme links resolved to absolute URLs). Comparisons include the structured table (criteria, one row per entry, verdict); stacks include the use case and components; skills include the full SKILL.md (skill_md) plus download links (links.zip, links.skill_md). Unknown ids return an error with suggestions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Item id (kebab-case slug) as returned by search.",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "include_html": {
                "default": false,
                "description": "Also return the rendered HTML body.",
                "type": "boolean"
              },
              "type": {
                "description": "guide, comparison, stack or skill.",
                "enum": ["guide", "comparison", "stack", "skill"],
                "type": "string"
              }
            },
            "required": ["id", "type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "content": {
                "description": "The item: front_matter, markdown, links and type-specific fields (comparison, stack, skill_md). See https://indexagentica.com/openapi.json (LongformItem).",
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "links": {
                    "type": "object"
                  },
                  "markdown": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "type": {
                    "type": "string"
                  }
                },
                "required": ["id", "markdown", "title", "type"],
                "type": "object"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get guide, comparison, stack or skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb576441cf6583892854d7628ed71ba07d83ec1e6b4ea6431532476bb727a67d"
        },
        {
          "name": "get_entry",
          "title": "Get directory entry",
          "description": "Fetch one Index Agentica entry by its id (kebab-case slug, e.g. \"model-context-protocol\"). Returns every field: name, category, summary, description, url, repo, docs, tags, license, pricing, status, agent_access (llms_txt, openapi, mcp_endpoint, auth), related ids, sources, dates and links. If the id is unknown the result is an error with suggested ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Entry id (kebab-case slug) as returned by search.",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "entry": {
                "description": "The full entry, following https://indexagentica.com/schema/entry.schema.json plus a links object.",
                "type": "object"
              }
            },
            "required": ["entry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get directory entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43e684130dce1a38c89a0ab8bd1fef2a3ce81fe6aef392566bb1bbc0ecd9198e"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List all Index Agentica categories with their slug, name, description, entry count and links (HTML page and JSON). Use a slug as the category filter for search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories": {
                "items": {
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "description": {
                      "type": "string"
                    },
                    "html": {
                      "type": "string"
                    },
                    "json": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["count", "name", "slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "generated": {
                "description": "When the published index was built.",
                "type": "string"
              },
              "total": {
                "description": "Total number of entries in the directory.",
                "type": "integer"
              }
            },
            "required": ["categories", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fef686a36fc7444408c379300e4052a44a1904c70b34b61d5aa0c32ef2cf382a"
        },
        {
          "name": "request_listing",
          "title": "Request a listing",
          "description": "Ask Index Agentica to add something that is missing (a skill, agent harness, MCP server, tool, protocol, API, ...). Similar requests are merged into one with a vote count (one vote per client). Nothing is listed automatically: the Curator verifies each request first. The public queue is at https://mcp.indexagentica.com/v1/requests and https://indexagentica.com/requested/. Limits: 5 requests per hour and 20 per day per client. Search first to check it is not already listed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Directory category slug, or \"other\". Current categories: skills, harnesses, mcp-servers, tools, protocols, apis, information, finance-payments, directories, infrastructure, evals-observability.",
                "enum": ["skills", "harnesses", "mcp-servers", "tools", "protocols", "apis", "information", "finance-payments", "directories", "infrastructure", "evals-observability", "other"],
                "type": "string"
              },
              "reason": {
                "description": "Optional: why it is useful / what you needed it for.",
                "maxLength": 500,
                "type": "string"
              },
              "requester": {
                "description": "Optional requesting agent or client name.",
                "maxLength": 60,
                "type": "string"
              },
              "url": {
                "description": "Optional http(s) link (repo, docs or homepage). Not shown publicly until verified.",
                "format": "uri",
                "maxLength": 300,
                "type": "string"
              },
              "wanted": {
                "description": "Short name of what is wanted, e.g. \"Linear MCP server\" or \"a skill for Terraform plans\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category", "wanted"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              },
              "list": {
                "type": "string"
              },
              "merged": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "request": {
                "properties": {
                  "category": {
                    "type": "string"
                  },
                  "first_seen": {
                    "type": "string"
                  },
                  "id": {
                    "type": "integer"
                  },
                  "last_seen": {
                    "type": "string"
                  },
                  "status": {
                    "enum": ["pending", "verified", "listed", "rejected"],
                    "type": "string"
                  },
                  "votes": {
                    "type": "integer"
                  },
                  "wanted": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "vote_counted": {
                "type": "boolean"
              }
            },
            "required": ["id", "merged", "ok", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:92699ee0ded40d3ed1f3b15909506f315aabd3a3cf9386e897af11f0356bcfe4"
        },
        {
          "name": "search",
          "title": "Search Index Agentica",
          "description": "Search Index Agentica: the directory of agent-usable resources (skills, harnesses, MCP servers, tools, protocols, APIs, information sources, finance/payments, directories) plus its long-form content (guides, comparisons, stacks and downloadable Agent Skills). Matches the query words against name/title, id, tags, summary and description and returns the best matches first, each with its type, a relevance score and links (HTML, markdown, JSON). Optionally filter by type (entry, guide, comparison, stack, skill; default all), category (entries only) and/or tags (ALL given tags must match). An empty query with a filter lists everything in that filter. For full details use get_entry for type entry, or get_content with the type and id for long-form items.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional entry category slug to restrict results to (implies type entry). Current categories: skills, harnesses, mcp-servers, tools, protocols, apis, information, finance-payments, directories, infrastructure, evals-observability.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search words, e.g. \"browser automation\" or \"payments x402\". May be empty when category or tags are given.",
                "maxLength": 200,
                "type": "string"
              },
              "tags": {
                "description": "Optional list of tag slugs; results must have all of them (e.g. [\"open-source\", \"python\"]).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "type": {
                "default": "all",
                "description": "Optional result type: entry (directory entries), guide, comparison, stack, skill, or all (default).",
                "enum": ["entry", "guide", "comparison", "stack", "skill", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "description": "Category filter applied (omitted when none).",
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "author": {
                      "description": "Long-form only.",
                      "type": "string"
                    },
                    "category": {
                      "description": "Entries only.",
                      "type": "string"
                    },
                    "entries": {
                      "description": "Long-form only: directory entry ids it references.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "last_verified": {
                      "description": "Long-form only.",
                      "type": "string"
                    },
                    "links": {
                      "type": "object"
                    },
                    "mcp_endpoint": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "pricing": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    },
                    "status": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": {
                      "description": "entry (directory entry) or a long-form type: guide, comparison, stack, skill.",
                      "enum": ["entry", "guide", "comparison", "stack", "skill"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "summary", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total": {
                "description": "Number of matches before the limit was applied.",
                "type": "integer"
              },
              "type": {
                "description": "Type filter applied (all when none).",
                "type": "string"
              }
            },
            "required": ["query", "results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Index Agentica"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6fa99bb4557a2ef6840fcb6bc9c26606b586766d34b855dfe049f84d2d8e4e0"
        }
      ],
      "digest": "sha256:501aac1f53b86a0e5e6041ebb735d7939d52206287c0888d3166bdfdc5092abd"
    }
  }
}
