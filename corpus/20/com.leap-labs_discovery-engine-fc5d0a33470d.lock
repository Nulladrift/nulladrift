        {
          "name": "discovery_add_payment_method",
          "description": "Attach a Stripe payment method to your Disco account.\n\n    The payment method must be tokenized via Stripe's API first — card details\n    never touch Disco's servers. Required before purchasing credits\n    or subscribing to a paid plan.\n\n    To tokenize a card, call Stripe's API directly:\n    POST https://api.stripe.com/v1/payment_methods\n    with the stripe_publishable_key from your account info.\n\n    Args:\n        payment_method_id: Stripe payment method ID (pm_...) from Stripe's API.\n        api_key: Disco API key (disco_...). Optional if DISCOVERY_API_KEY env var is set.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "payment_method_id": {
                "title": "Payment Method Id",
                "type": "string"
              }
            },
            "required": ["payment_method_id"],
            "title": "discovery_add_payment_methodArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
