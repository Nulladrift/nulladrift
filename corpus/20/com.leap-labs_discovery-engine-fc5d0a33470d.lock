        {
          "name": "discovery_estimate",
          "description": "Estimate the credits required to run a Disco analysis.\n\n    Returns `required_credits` for public (always 0) and private, with private\n    split by whether LLMs are enabled (use_llms=False is faster, use_llms=True\n    adds smarter preprocessing, literature context and a written summary).\n    Also returns per-visibility depth caps and accepted file formats. No\n    authentication required — when an API key is supplied, also returns the\n    caller's available credits.\n\n    Call this before discovery_analyze whenever cost or feasibility is unclear.\n\n    Args:\n        file_size_mb: Size of the dataset in megabytes.\n        num_columns: Number of columns in the dataset.\n        analysis_depth: Search depth (1=fast, higher=deeper). Used to compute the\n            private-run cost. Default 2.\n        api_key: Disco API key (disco_...). Optional. When provided, the response\n            includes `account.available_credits`.\n    ",
          "inputSchema": {
            "properties": {
              "analysis_depth": {
                "default": 2,
                "title": "Analysis Depth",
                "type": "integer"
              },
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "file_size_mb": {
                "title": "File Size Mb",
                "type": "number"
              },
              "num_columns": {
                "title": "Num Columns",
                "type": "integer"
              }
            },
            "required": ["file_size_mb", "num_columns"],
            "title": "discovery_estimateArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "discovery_estimateOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Estimate Analysis Cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:810c17a305ee6dbc5c7d9de123ee624f0496178204a78760094f729ec0b8092e"
        },
        {
          "name": "discovery_get_results",
          "description": "Fetch the full results of a completed Disco run.\n\n    Returns discovered patterns (with conditions, p-values, novelty scores,\n    citations), feature importance scores, a summary with key insights, column\n    statistics, and suggestions for what to explore next.\n\n    The response includes a `dashboard_urls` object with direct links to each\n    page of the interactive report — use these to direct the user to the most\n    relevant view:\n    - **summary**: AI-generated overview with key insights, novel findings, and plain-language explanation of the most important findings\n    - **patterns**: Full list of discovered patterns with conditions, effect sizes, p-values, novelty scores, citations, and interactive visualizations\n    - **features**: Feature importances, feature statistics and distribution plots, and correlation matrix\n    - **territory**: Interactive 3D map showing how patterns select different regions of the data\n\n    Only call this after discovery_status returns \"completed\".\n\n    Args:\n        run_id: The run ID returned by discovery_analyze.\n        api_key: Disco API key (disco_...). Optional if DISCOVERY_API_KEY env var is set.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "run_id": {
                "title": "Run Id",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "title": "discovery_get_resultsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "discovery_get_resultsOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get Analysis Results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c481fefd2780eb8f3ac71b38975164b83c4383083ff36cc7925df1659abbdff0"
