          "digest": "sha256:51f6eb5c6f343c9ca9fe7a91c7498fe3865880422bf43ead319a9f01514b7c94"
        },
        {
          "name": "discovery_analyze",
          "description": "Run Disco on tabular data to find novel, statistically validated patterns.\n\n    This is NOT another data analyst — it's a discovery pipeline that systematically\n    searches for feature interactions, subgroup effects, and conditional relationships\n    nobody thought to look for, then validates each on hold-out data with FDR-corrected\n    p-values and checks novelty against academic literature.\n\n    This is a long-running operation. Returns a run_id immediately.\n    Use discovery_status to poll and discovery_get_results to fetch completed results.\n\n    Use this when you need to go beyond answering questions about data and start\n    finding things nobody thought to ask. Do NOT use this for summary statistics,\n    visualization, or SQL queries.\n\n    Public runs are free but results are published. Private runs cost credits.\n    Call discovery_estimate first to check cost. Private report URLs require\n    sign-in — tell the user to sign in at the dashboard with the same email\n    address used to create the account (email code, no password needed).\n\n    Call discovery_upload first to upload your file, then pass the returned file_ref here.\n\n    Args:\n        target_column: The column to analyze — what drives it, beyond what's obvious.\n        file_ref: The file reference returned by discovery_upload.\n        analysis_depth: Search depth (1=fast, higher=deeper). Default 1.\n        visibility: \"public\" (free) or \"private\" (costs credits). Default \"public\".\n        title: Optional title for the analysis.\n        description: Optional description of the dataset.\n        excluded_columns: Optional JSON array of column names to exclude from analysis.\n        column_descriptions: Optional JSON object mapping column names to descriptions. Significantly improves pattern explanations — always provide if column names are non-obvious (e.g. {\"col_7\": \"patient age\", \"feat_a\": \"blood pressure\"}).\n        author: Optional author name for the report.\n        source_url: Optional source URL for the dataset.\n        use_llms: Slower and more expensive, but you get smarter pre-processing, summary page, literature context and pattern novelty assessment. Only applies to private runs — public runs always use LLMs. Default false.\n        api_key: Disco API key (disco_...). Optional if DISCOVERY_API_KEY env var is set.\n    ",
          "inputSchema": {
            "properties": {
              "analysis_depth": {
                "default": 2,
                "title": "Analysis Depth",
                "type": "integer"
              },
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Api Key"
              },
              "author": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Author"
              },
              "column_descriptions": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Column Descriptions"
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Description"
              },
              "excluded_columns": {
