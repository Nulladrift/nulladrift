      "instructions": "Not another AI data analyst. Disco is a discovery pipeline that finds novel, statistically validated patterns in tabular data — feature interactions, subgroup effects, and conditional relationships you wouldn't think to look for. When displaying results, render interactive visualizations following the Disco style guide at https://disco.leap-labs.com/visualization-spec",
