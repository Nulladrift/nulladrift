        {
          "name": "discovery_subscribe",
          "description": "Subscribe to or change your Disco plan.\n\n    Available plans:\n    - \"free_tier\": Explorer — free, 10 credits/month\n    - \"tier_1\": Researcher — $49/month, 500 credits/month\n    - \"tier_2\": Team — $199/month, 2000 credits/month\n\n    Paid plans require a payment method on file. Credits roll over on paid plans.\n\n    Args:\n        plan: Plan tier ID (\"free_tier\", \"tier_1\", or \"tier_2\").\n        api_key: Disco API key (disco_...). Optional if DISCOVERY_API_KEY env var is set.\n    ",
          "inputSchema": {
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
