                    "exclusiveMinimum": 0,
                    "maximum": 100,
                    "type": "number"
                  },
                  "x_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "y_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["height_pct", "source_height_px", "source_width_px", "target_height_cm", "target_width_cm", "version", "width_pct", "x_pct", "y_pct"],
                "type": "object"
              },
