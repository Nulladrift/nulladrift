      "instructions": "Loppix izrađuje dizajnerske tapete po mjeri u Hrvatskoj. Koristi izvore i quote_configuration; ne pogađaj cijene, tehničke osobine ni odobrenje kupnje. Poveznica pripreme nije narudžba.",
      "tools": [
        {
          "name": "create_configuration_handoff",
          "description": "Izdaj kratkotrajnu poveznicu za pregled potpune konfiguracije. Ne kupuje, ne rezervira, ne stvara košaricu i nije odobrenje naplate. Kupac pregledava i potvrđuje na Loppixu.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "catalogRevision": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "colorwayId": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "const": "HR",
                "default": "HR",
                "type": "string"
              },
              "crop": {
                "additionalProperties": false,
                "properties": {
                  "height_pct": {
                    "exclusiveMinimum": 0,
                    "maximum": 100,
                    "type": "number"
                  },
                  "source_height_px": {
                    "const": 4000,
                    "type": "number"
                  },
                  "source_width_px": {
                    "const": 6400,
                    "type": "number"
                  },
                  "target_height_cm": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "target_width_cm": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "version": {
                    "const": 1,
                    "type": "number"
