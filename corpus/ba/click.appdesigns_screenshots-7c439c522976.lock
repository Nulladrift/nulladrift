        {
          "name": "translate_asset",
          "title": "Make a set in another language",
          "description": "Use this when the user wants a screenshot set or listing asset in another language (a localization for the App Store or Google Play): one they saved (asset_id), or one you made in this conversation (handle). You translate every text layer yourself (get_asset lists them, with their ids); this makes a copy in that language, its images copied and the original untouched, wrapping a long translation and moving the captions under it down as the editor's own Translate set does. A saved set's copy is saved into the same project (asset_id back); a copy of yours is a new set with its own handle and link, which joins the original's project when the user saves them. Returns a preview of every screen (check the line breaks) and warnings; fix any line with edit_asset. One call per language. With asset_id (something the user saved) it needs the user signed in to appdesigns (in Claude Code type /mcp, pick appdesigns and choose Authenticate (or run `claude mcp login appdesigns` in a separate terminal), in Codex run `codex mcp login appdesigns`; other agents open the sign-in page themselves); with handle (a set or design you made in this conversation, not saved yet) it needs no sign-in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset_id": {
                "description": "The asset_id list_projects returned.",
                "pattern": "^[0-9a-f-]{36}$",
                "type": "string"
              },
              "handle": {
                "description": "Instead of asset_id: the project_handle create_project returned or the design_handle create_design returned, for something you made in this conversation that the user has not saved yet. Needs no sign-in.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "language": {
                "description": "App Store Connect's code for the language, such as de-DE, fr-FR, ja, es-MX or pt-BR.",
                "enum": ["ar-SA", "ca", "zh-Hans", "zh-Hant", "hr", "cs", "da", "nl-NL", "en-AU", "en-CA", "en-GB", "en-US", "fi", "fr-FR", "fr-CA", "de-DE", "el", "he", "hi", "hu", "id", "it", "ja", "ko", "ms", "no", "pl", "pt-BR", "pt-PT", "ro", "ru", "sk", "es-MX", "es-ES", "sv", "th", "tr", "uk", "vi"],
                "type": "string"
              },
              "texts": {
                "description": "Every text layer that has words, translated. Keep names and brands as written; match the source's tone and length where the language allows.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "The text layer's id from get_asset.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "screen": {
                      "description": "The screen, from 1.",
                      "maximum": 6,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "text": {
                      "description": "The text in the new language; \\n breaks a line.",
                      "maxLength": 400,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["id", "screen", "text"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["language", "texts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Make a set in another language"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3eb554715114dad8d21899e486d396f0bd04c01db680746942a9be8732809973"
        },
        {
          "name": "update_design",
          "title": "Change a listing art design",
          "description": "Changes a design create_design made, before the user saves it: set fields of a layer by id, add, remove or reorder layers, or replace a variant's background, loop or title, or add or remove a variant. Send only what changes. Returns new preview images and warnings, like create_design; the open_url create_design gave then opens the new version. A design changed with edit_asset keeps changing there, and one the user already saved changes in the editor (or with edit_asset by asset_id once they sign you in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "changes": {
                "description": "Applied in order. Positions count from 0 at the bottom.",
                "items": {
                  "properties": {
                    "background": {
                      "properties": {
                        "color": {
                          "description": "A plain colour.",
                          "pattern": "^#[0-9a-fA-F]{6}$",
                          "type": "string"
                        },
                        "gradient": {
                          "description": "A gradient instead of a plain colour; radial runs from the centre out.",
                          "properties": {
                            "angle": {
                              "description": "linear: 0 runs left to right, 90 top to bottom. Default 90.",
                              "maximum": 360,
                              "minimum": 0,
                              "type": "number"
                            },
                            "colors": {
                              "description": "2 to 5 colours, evenly spread across the whole canvas.",
                              "items": {
                                "pattern": "^#[0-9a-fA-F]{6}$",
                                "type": "string"
                              },
                              "maxItems": 5,
                              "minItems": 2,
                              "type": "array"
                            },
                            "type": {
                              "enum": ["linear", "radial"],
                              "type": "string"
                            }
                          },
                          "required": ["colors", "type"],
                          "type": "object"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "description": "The layer, for set_layer, remove_layer and move_layer.",
                      "maxLength": 32,
                      "type": "string"
                    },
                    "layer": {
                      "additionalProperties": {},
                      "description": "A layer with create_design's fields. set_layer: only the fields to change (motion {\"move\":\"none\"} stops it). add_layer: the whole new layer.",
                      "properties": {},
                      "type": "object"
                    },
                    "loop": {
                      "properties": {
                        "background": {
                          "description": "flow sways a gradient, shift drifts the colours a little round the wheel. Default still.",
                          "enum": ["still", "flow", "shift"],
                          "type": "string"
                        },
                        "effects": {
                          "items": {
                            "properties": {
                              "amount": {
                                "description": "0 to 1, how many. Default 0.5.",
                                "maximum": 1,
                                "minimum": 0,
                                "type": "number"
                              },
                              "color": {
                                "description": "Leave it out for a colour that shows on the background.",
                                "pattern": "^#[0-9a-fA-F]{6}$",
                                "type": "string"
                              },
                              "effect": {
                                "description": "Particles over the whole canvas. Anyone can try them; exporting them needs appdesigns Pro.",
                                "enum": ["sparkles", "snow", "confetti", "bokeh"],
                                "type": "string"
                              },
                              "layer": {
                                "description": "front draws over everything, back just over the background. Default front.",
                                "enum": ["front", "back"],
                                "type": "string"
                              },
                              "speed": {
                                "enum": ["slow", "medium", "fast"],
                                "type": "string"
                              }
                            },
                            "required": ["effect"],
                            "type": "object"
                          },
                          "maxItems": 2,
                          "type": "array"
                        },
                        "fps": {
                          "anyOf": [
                            {
                              "const": 30,
                              "type": "number"
                            },
                            {
                              "const": 60,
                              "type": "number"
                            }
                          ],
                          "description": "Default 30."
                        },
                        "seconds": {
                          "description": "Loop length: 5 to 30 for the header and search result (default 8), 15 to 30 for event art (default 15).",
                          "maximum": 30,
                          "minimum": 5,
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "new_variant": {
                      "additionalProperties": {},
                      "description": "add_variant: a whole variant, as in create_design.",
                      "properties": {},
                      "type": "object"
                    },
                    "op": {
                      "description": "set_layer changes the fields you give of layer id; add_layer adds layer (on top, or at position to); remove_layer and move_layer (to a position, 0 is the bottom) take id; set_background, set_loop and set_title replace those of the variant; add_variant adds new_variant; remove_variant removes the variant.",
                      "enum": ["set_layer", "add_layer", "remove_layer", "move_layer", "set_background", "set_loop", "set_title", "add_variant", "remove_variant"],
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "to": {
                      "description": "move_layer and add_layer: the position, 0 is the bottom.",
                      "maximum": 24,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "variant": {
                      "description": "Which variant, from 1. Every op but add_variant needs it.",
                      "maximum": 4,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["op"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "design_handle": {
                "description": "The design_handle create_design returned.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["changes", "design_handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change a listing art design"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ec4ceae20f7c87e38c31b9809c2ae81aa09162e7605b465548378aa5fcbdf9e5"
        },
