                      "maxLength": 4000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "file_id": {
                      "description": "ChatGPT's id for the attached file.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "file_name": {
