        {
          "name": "replace_screenshots",
          "title": "Put new screenshots in a set",
          "description": "Use this when a set needs new screenshots in its phones: a recapture, a fixed screen, or a phone frame layer to fill (get_asset shows those as \"phone frame: ...\"), in a set the user saved (asset_id) or a set or design you made in this conversation (handle). Two calls. First with asset_id or handle and screens (each a screen number, the local file and, for a phone frame layer, its id): it returns one upload command (bash and PowerShell) that sends the files straight to storage. Run it, then call again with the same asset_id or handle, replace_handle and the revision get_asset returned: the files are checked (PNG or JPEG, the shape of the phone's screen) and swapped in, and the reply has the new revision and previews. With asset_id (something the user saved) it needs the user signed in to appdesigns (in Claude Code type /mcp, pick appdesigns and choose Authenticate (or run `claude mcp login appdesigns` in a separate terminal), in Codex run `codex mcp login appdesigns`; other agents open the sign-in page themselves); with handle (a set or design you made in this conversation, not saved yet) it needs no sign-in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset_id": {
                "description": "The asset_id list_projects returned.",
                "pattern": "^[0-9a-f-]{36}$",
                "type": "string"
              },
              "handle": {
                "description": "Instead of asset_id: the project_handle create_project returned or the design_handle create_design returned, for something you made in this conversation that the user has not saved yet. Needs no sign-in.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "replace_handle": {
                "description": "Second call: the replace_handle the first call returned, once the upload command has run.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "revision": {
                "description": "Second call: the revision get_asset (or the last edit) returned.",
                "maxLength": 40,
                "minLength": 10,
                "type": "string"
              },
              "screens": {
                "description": "First call: what goes where, at most 6 files a call.",
                "items": {
                  "properties": {
                    "file_path": {
                      "description": "Absolute path to the PNG or JPEG (no ~ or $VARIABLES). Not read by the server; it goes into the upload command.",
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "layer": {
                      "description": "A phone frame layer's id from get_asset; leave it out for the screen's own phone.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "screen": {
                      "description": "The screen, from 1.",
                      "maximum": 6,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["file_path", "screen"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
