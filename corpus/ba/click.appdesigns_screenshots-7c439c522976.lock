      "serverInfo": {
        "name": "appdesigns",
        "title": "appdesigns",
        "version": "1.1.0",
        "description": "Turn app screenshots into App Store and Google Play screenshot sets that open as an editable project on appdesigns.click.",
        "websiteUrl": "https://appdesigns.click/mcp",
        "icons": [
          {
            "src": "https://appdesigns.click/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "appdesigns turns an app's screenshots into App Store and Google Play screenshot sets (device frame, background, a short caption) and opens them as an editable project on appdesigns.click. No account or API key is needed to make one.\n\nWith a terminal and the app's code (a coding agent), follow the workflow below, starting with get_workflow.\nIn a chat without a terminal (ChatGPT), ask the user to attach 1 to 6 raw screenshots of their app (PNG, JPEG, WebP or GIF, as the phone shows it, with no frame or marketing text added) if they have not, write a screen name and a headline for each from what it shows, call make_screenshot_set with the attached files, and give the user the link it returns. A finished store image will not do: its baked-in text cannot be edited.\n\nWorkflow with a terminal:\n1. Call get_workflow with the app's platform and store. It has the capture commands, the screen rules and the caption rules.\n2. Read the app's code and plan 4 or 5 screens (at most 6), best first, with the data each shows.\n3. Check in with the user once: the screens, the demo data you would add, any code you would change, and the captions. Then stop and wait for their reply before you edit code or capture.\n4. Capture each screen at store size, landscape for a landscape app, with a clean status bar.\n5. Call create_project with a screen name and short headline per screenshot, run the upload command it returns, then finish_project (signed in: then save_to_account).\n6. Open the link in the user's browser (the tools give the command) and give it to them, then offer the next assets what_next lists.\n\nArt you draw (an animated App Store header, search result or event art, a marketing image, Play's feature graphic): get_design_guide, then create_design.\n\nFor iPhone Duo (asked of new submissions from April 2027), make a second set with device iphone-duo; get_workflow has the steps.\n\nScreenshots go to storage through signed URLs, never as base64. The upload command works for 1 hour; a finished draft waits 72 hours.",
      "tools": [
        {
          "name": "create_design",
          "title": "Create a listing art design",
          "description": "Use this when you have designed art for an app yourself and the user should get it as an editable project: App Store listing art that loops as a video (a product page header, search result, or In-App Event card or page), or a still marketing image (an X, LinkedIn or Instagram post, a link preview, a Product Hunt image, a 16:9 image, Google Play's feature graphic). Takes 1 to 4 variants (directions for the user to choose from), each a background and layers: art you draw as SVG, library pieces, the app's icon, text, and phone frames showing the app (an iPhone, the iPhone Duo open from behind and from the front...), with moves and a loop on listing art. Checks everything and returns a preview image of each variant, warnings, a design_handle for update_design, and open_url, which opens the design in the appdesigns editor, where the user keeps a direction, tweaks any layer, saves it and exports it. Nothing is public and no account is needed. The design waits 72 hours to be opened and saved.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "animated": {
                "default": true,
                "description": "false for a still image (the user asked for one): the moves are kept with motion turned off, so the Motion toggle brings them back.",
                "type": "boolean"
              },
              "app_store_url": {
                "description": "The app's App Store link, if it is on the App Store: the editor's preview phone then shows its real name and icon, app_icon layers use its icon, and a phone layer can show one of its App Store screenshots.",
                "maxLength": 300,
                "type": "string"
              },
              "asset": {
                "default": "header",
                "description": "Listing art: header (3840x1646), search_result (3840x2560), event_card (3840x2160) or event_page (2160x3840). Stills: x_post (1600x900), linkedin_post (1200x627), link_preview (1200x630), instagram_square (1080x1080), instagram_portrait (1080x1350), instagram_tall (1080x1440), product_hunt (1270x760), wide_image (1920x1080), play_feature_graphic (1024x500).",
                "enum": ["header", "search_result", "event_card", "event_page", "x_post", "linkedin_post", "link_preview", "instagram_square", "instagram_portrait", "instagram_tall", "product_hunt", "wide_image", "play_feature_graphic"],
                "type": "string"
              },
              "project_id": {
                "description": "A project_id from list_projects (the user signed in): the new asset is saved into that saved project of theirs. Use it, not same_project_as, to add to something the user already saved.",
                "pattern": "^[0-9a-f-]{36}$",
                "type": "string"
              },
              "project_name": {
                "description": "The app's name. It becomes the project name in the user's appdesigns library.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "same_project_as": {
                "description": "The project_handle or design_handle of an earlier asset from this conversation (screenshots, a header...). The user's save then files this one in the same project, once they have saved that one.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "screenshots_from": {
                "description": "The project_handle of a screenshot set you made with create_project in this conversation (finished, not yet saved): a phone layer's screenshot n then shows that set's n-th capture, instead of an App Store screenshot. No sign-in needed.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "variants": {
                "description": "The directions, each a whole design. The first is the one you would pick.",
                "items": {
                  "properties": {
                    "background": {
                      "properties": {
                        "color": {
                          "description": "A plain colour.",
                          "pattern": "^#[0-9a-fA-F]{6}$",
                          "type": "string"
                        },
                        "gradient": {
                          "description": "A gradient instead of a plain colour; radial runs from the centre out.",
                          "properties": {
                            "angle": {
                              "description": "linear: 0 runs left to right, 90 top to bottom. Default 90.",
                              "maximum": 360,
                              "minimum": 0,
                              "type": "number"
                            },
                            "colors": {
                              "description": "2 to 5 colours, evenly spread across the whole canvas.",
                              "items": {
                                "pattern": "^#[0-9a-fA-F]{6}$",
                                "type": "string"
                              },
                              "maxItems": 5,
                              "minItems": 2,
                              "type": "array"
                            },
                            "type": {
                              "enum": ["linear", "radial"],
                              "type": "string"
                            }
                          },
                          "required": ["colors", "type"],
                          "type": "object"
                        }
                      },
                      "type": "object"
                    },
                    "layers": {
                      "description": "Bottom first, at most 24.",
                      "items": {
                        "properties": {
                          "align": {
                            "description": "text: default center.",
                            "enum": ["left", "center", "right"],
                            "type": "string"
                          },
                          "app_icon": {
                            "description": "true for the app's own App Store icon (needs app_store_url), drawn with iOS corners.",
                            "type": "boolean"
                          },
                          "color": {
                            "description": "text: default #1C1917.",
                            "pattern": "^#[0-9a-fA-F]{6}$",
                            "type": "string"
                          },
                          "flip": {
                            "description": "svg only: mirror it left to right.",
                            "type": "boolean"
                          },
                          "fold": {
                            "description": "phone, iPhone Duo: inner-open (Unfolded), outer-closed (Cover) or outer-open (Open back, the open phone from behind); the editor's names work too.",
                            "maxLength": 30,
                            "type": "string"
                          },
                          "font": {
                            "description": "text: default Inter.",
                            "enum": ["Inter", "DM Sans", "Poppins", "Space Grotesk", "Roboto", "Lato", "Playfair Display", "Georgia", "Pacifico", "Caveat", "Dancing Script", "Great Vibes"],
                            "type": "string"
                          },
                          "frame_color": {
                            "description": "phone: a colour id of the device from list_devices; default its first.",
                            "maxLength": 40,
                            "type": "string"
                          },
                          "height": {
                            "description": "phone only: its height as a share of the canvas height, instead of width.",
                            "exclusiveMinimum": 0,
                            "maximum": 3,
                            "type": "number"
                          },
                          "id": {
                            "description": "Unique within the variant, such as \"heart\" or \"headline\". update_design names layers by it.",
                            "pattern": "^[a-z0-9][a-z0-9-]{0,31}$",
                            "type": "string"
                          },
                          "library": {
                            "description": "A piece from the appdesigns library by its path from search_library (\"3d/3d-cube-purple.png\"): SF Symbols, emoji, 3D shapes, glows, badges and more.",
                            "maxLength": 200,
                            "type": "string"
                          },
                          "line_height": {
                            "description": "text: a multiple of the size, default 1.15.",
                            "maximum": 2,
                            "minimum": 0.8,
                            "type": "number"
                          },
                          "motion": {
                            "properties": {
                              "amount": {
                                "description": "0 to 1, subtle to bold. Default 0.5.",
                                "maximum": 1,
                                "minimum": 0,
                                "type": "number"
                              },
                              "move": {
                                "description": "float bobs up and down, drift wanders in a figure of eight, orbit circles its spot, sway rocks side to side, spin turns all the way round, pulse grows and shrinks, fade fades in and out, pop is a quick bounce once a cycle. Text takes float, drift or sway only. none takes a move off.",
                                "enum": ["float", "drift", "orbit", "sway", "spin", "pulse", "fade", "pop", "none"],
                                "type": "string"
                              },
                              "offset": {
                                "description": "0 to 1: where in its cycle the layer starts, so layers sharing a move do not move in step. Default 0.",
                                "maximum": 1,
                                "minimum": 0,
                                "type": "number"
                              },
                              "speed": {
                                "description": "slow (about 8 s a cycle, the default), medium (about 4 s) or fast (about 2.5 s). Rounded to whole cycles per loop, so the video loops without a seam.",
                                "enum": ["slow", "medium", "fast"],
                                "type": "string"
                              }
                            },
                            "required": ["move"],
                            "type": "object"
                          },
                          "opacity": {
                            "description": "svg, app_icon and library only. Default 1.",
                            "maximum": 1,
                            "minimum": 0,
                            "type": "number"
                          },
                          "orientation": {
                            "description": "phone: upright or on its side; default the way up of the screenshot it shows, else the canvas's (Open back is always on its side).",
                            "enum": ["portrait", "landscape"],
                            "type": "string"
                          },
                          "phone": {
                            "description": "A phone frame showing the app: a device id from list_devices (iphone-duo, iphone-17-pro-max...). Takes width or height, frame_color, fold, orientation and screenshot.",
                            "maxLength": 40,
                            "type": "string"
                          },
                          "rotation": {
                            "description": "Degrees clockwise. Default 0.",
                            "maximum": 360,
                            "minimum": -360,
                            "type": "number"
                          },
                          "screenshot": {
                            "description": "phone: show screenshot n: the n-th screen of the set screenshots_from names (your own captures), else the app's n-th App Store screenshot (app_store_url). Leave it out for an empty screen, which replace_screenshots fills.",
                            "maximum": 10,
                            "minimum": 1,
                            "type": "integer"
                          },
                          "size": {
                            "description": "text: font size in canvas pixels.",
                            "maximum": 600,
                            "minimum": 16,
                            "type": "number"
                          },
                          "svg": {
                            "description": "Art you draw: one standalone <svg> with a viewBox and a transparent background, cropped tight to the drawing. Paths, shapes, gradients, clip paths, masks and filters only; no <text>, <image>, scripts, stroke-dasharray, feMorphology, CSS animation or outside files.",
                            "maxLength": 60000,
                            "type": "string"
                          },
                          "text": {
                            "description": "Words, stay editable in the editor. Break lines yourself with \\n (at most 4 lines); nothing wraps.",
                            "maxLength": 120,
                            "type": "string"
                          },
                          "tint": {
                            "description": "library only: recolour the piece in one flat colour (SF Symbols are white glyphs).",
                            "pattern": "^#[0-9a-fA-F]{6}$",
                            "type": "string"
                          },
                          "weight": {
                            "description": "text: 100 to 900, default 700.",
                            "maximum": 900,
                            "minimum": 100,
                            "type": "integer"
                          },
                          "width": {
                            "description": "svg, app_icon and library: width as a share of the canvas width; the height follows the art's own shape.",
                            "exclusiveMinimum": 0,
                            "maximum": 3,
                            "type": "number"
                          },
                          "x": {
                            "description": "Horizontal centre as a share of the canvas width (0 left edge, 1 right edge). For text: the centre of centred text, the left edge of left-aligned text, the right edge of right-aligned text.",
                            "maximum": 2,
                            "minimum": -1,
                            "type": "number"
                          },
                          "y": {
                            "description": "Vertical centre as a share of the canvas height (0 top, 1 bottom). For text: the middle of the whole block.",
                            "maximum": 2,
                            "minimum": -1,
                            "type": "number"
                          }
                        },
                        "required": ["id", "x", "y"],
                        "type": "object"
                      },
                      "maxItems": 24,
                      "type": "array"
                    },
                    "loop": {
                      "properties": {
                        "background": {
                          "description": "flow sways a gradient, shift drifts the colours a little round the wheel. Default still.",
