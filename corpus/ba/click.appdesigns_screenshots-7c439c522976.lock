        {
          "name": "create_project",
          "title": "Create a screenshot project",
          "description": "Use this when you can run shell commands on the user's machine and have their app's screenshots as local files (a coding agent). Not for a chat without a terminal, such as ChatGPT, where the upload command cannot run. Starts a screenshot set: 1 to 6 screenshots in store order, each with a screen name and a headline. Returns a project_handle and one upload command (bash and PowerShell forms) that sends every screenshot straight to storage; run it once, then call finish_project with the handle. Upload and call finish_project within 1 hour (an unfinished project lapses then); a finished one waits 72 hours to be opened. Nothing is public and no account is needed; the user saves the set to their account when they open the link finish_project returns.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "background_color": {
                "description": "#RRGGBB. Use the app's brand or accent colour if you can find it in the code. Leave it out for a neutral light background.",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "canvas_size": {
                "description": "A canvas size from list_devices, as WIDTHxHEIGHT, portrait or landscape (2868x1320 for a landscape iPhone set). Leave it out and finish_project takes the store size the screenshots are (a landscape capture makes a landscape set), else the store default (1320x2868 for iPhone, 2048x2732 for iPad, 2007x2853 for iPhone Duo, 1080x1920 for Play).",
                "maxLength": 12,
                "type": "string"
              },
              "device": {
                "description": "A device id from list_devices. Defaults to iphone-17-pro-max for the App Store and pixel-11-pro for Google Play.",
                "maxLength": 40,
                "type": "string"
              },
              "fold": {
                "description": "iPhone Duo only: inner-open (Unfolded, the open inner display), outer-closed (Cover, the folded cover display) or outer-open (Open back, the open phone from behind, showing its cover display). The editor's names work too. Leave it out for the display the canvas is.",
                "maxLength": 30,
                "type": "string"
              },
              "frame_color": {
                "description": "A colour id of that device from list_devices. Leave it out to pick one that stands out from the background.",
                "maxLength": 40,
                "type": "string"
              },
              "orientation": {
                "description": "Which way up the set is, when canvas_size does not say: landscape for an app that runs in landscape (most games), and the phone is drawn on its side. Leave it out to follow the screenshots.",
                "enum": ["portrait", "landscape"],
                "type": "string"
              },
              "project_id": {
                "description": "A project_id from list_projects (the user signed in): the new asset is saved into that saved project of theirs. Use it, not same_project_as, to add to something the user already saved.",
                "pattern": "^[0-9a-f-]{36}$",
                "type": "string"
              },
              "project_name": {
                "description": "The app's name. It becomes the project name in the user's appdesigns library.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "same_project_as": {
                "description": "The project_handle or design_handle of an earlier asset from this conversation (screenshots, a header...). The user's save then files this one in the same project, once they have saved that one.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              },
              "screens": {
                "description": "One entry per screenshot, in the order the store should show them. The first sells the app.",
                "items": {
                  "properties": {
                    "file_path": {
                      "description": "Absolute path to the PNG or JPEG screenshot (no ~ or $VARIABLES; they are not expanded). Not read by the server; it goes into the upload command.",
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "headline": {
                      "description": "The big line: the benefit this screen shows, 2 to 6 words, 32 characters or fewer (40 at most; longer is set smaller). Sentence case, no trailing period. Example: \"See where every dollar goes\".",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "screen_name": {
                      "description": "The screen or feature name, shown as the small line: 1 to 3 words, at most 24 characters. Example: \"Weekly stats\".",
                      "maxLength": 24,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["file_path", "headline", "screen_name"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "store": {
                "default": "app_store",
                "description": "Which store the set is for.",
                "enum": ["app_store", "play"],
                "type": "string"
              }
            },
            "required": ["project_name", "screens"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a screenshot project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
