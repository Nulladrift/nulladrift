          "description": "Use for \"what is the ETH 15-minute market doing\" and \"which Kalshi 15-minute markets are open\". Every Kalshi 15-minute up-or-down series (crypto, metals, energy, FX): window status, YES price, close time, target, settlement source and the up rate over the last 96 windows; the same window on Polymarket international for BTC/ETH/SOL/XRP; and our live Bitcoin top-of-hour strategy with its record.",
