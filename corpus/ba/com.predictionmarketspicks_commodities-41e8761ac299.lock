        },
        {
          "name": "calculate_ev",
          "title": "Calculate EV Edge",
          "description": "Use for \"is this contract mispriced\" and \"what is my edge\". Give a Kalshi, Polymarket US or Novig price in cents and your own probability; returns the % expected-value edge and a BUY / SELL / SKIP read, with that venue's fee.",
          "inputSchema": {
            "properties": {
              "marketPrice": {
                "description": "Current contract price in cents (1–99), equal to the implied probability in %. Required for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              },
              "novigMarket": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["pregame", "live", "futures"],
                    "type": "string"
                  }
                ],
                "description": "With venue novig: pregame (default), live or futures. Sets the fee. One of: pregame · live · futures."
              },
              "venue": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["kalshi", "polymarket-us", "novig"],
                    "type": "string"
                  }
                ],
                "description": "Where you would trade it: kalshi, polymarket-us or novig. Default kalshi. One of: kalshi · polymarket-us · novig."
              },
              "venuePrices": {
                "description": "The same contract's price on each venue, in cents. Adds EV after each venue's fee and best_venue.",
                "properties": {
                  "kalshi": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "novig": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  },
                  "polymarket-us": {
                    "maximum": 99,
                    "minimum": 1,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "yourProbability": {
                "description": "Your own estimate of the true probability the contract resolves YES, in % (0–100). Required for a real answer. Accepts 55, \"55%\", \"55¢\", \"$0.55\", 0.55 or American odds (+120 / -150) — all read as 55%.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "data_freshness": {},
              "edge_pct": {
                "description": "Expected-value edge, %."
