        {
          "name": "perp_liquidation",
          "title": "Kalshi Perp Liquidation — where a leveraged position gets closed out",
          "description": "Use for \"where does a 5x bitcoin long liquidate on Kalshi\". Estimates a Kalshi perp's liquidation price and the % move to it from Kalshi's risk parameters (a 5x BTC long is about 8% away, not the 20% the 100÷leverage rule implies), plus fees and expected funding. An estimate; Kalshi's app shows the exact one. Assets: btc, eth, sol, xrp, doge, hype, link, gold, silver, platinum, palladium. Free.",
          "inputSchema": {
            "properties": {
              "asset": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["btc", "eth", "sol", "xrp", "doge", "hype", "link", "gold", "silver", "platinum", "palladium"],
                    "type": "string"
                  }
                ],
                "description": "The perp."
              },
              "entry": {
                "description": "Entry price (default: the live price).",
                "type": ["number", "string"]
              },
              "hold_days": {
                "default": 7,
                "description": "Days held, for the funding estimate (default 7).",
                "maximum": 365,
                "minimum": 0,
                "type": "number"
              },
              "leverage": {
                "description": "Leverage, e.g. 5 or \"5x\". Capped at Kalshi’s maximum for the size and side.",
                "type": ["number", "string"]
              },
              "margin": {
                "description": "Margin in dollars (default 1000).",
                "type": ["number", "string"]
              },
              "side": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "enum": ["long", "short"],
                    "type": "string"
                  }
                ],
                "description": "Direction. One of: long · short."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Kalshi Perp Liquidation — where a leveraged position gets closed out"
