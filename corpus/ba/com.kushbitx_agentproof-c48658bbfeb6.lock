  "subjects": {
    "com.kushbitx/agentproof": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kushbitx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kushbitx-agentproof",
        "title": "KushBitx",
        "version": "1.0.0",
        "websiteUrl": "https://kushbitx.com/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use spendguard_evaluate (free) before an agent pays. Paid tools (quick_check, token_risk, preflight, verify_payment) return an x402 payment requirement in _meta[\"x402/error\"]; retry with _meta[\"x402/payment\"] to receive the report. KushBitx never signs, holds keys or moves funds. INCOMPLETE means missing evidence, never zero risk.",
      "tools": [
        {
          "name": "kushbitx_preflight",
          "title": "KushBitx Preflight",
          "description": "One check before money moves on Base. Simulates the unsigned transaction, decodes approvals and transfers, screens the token and the recipient or spender, and applies a protected SpendGuard policy when given. Returns ALLOW, REVIEW or BLOCK with sourced findings. Fail-closed: no ALLOW unless every check ran. Does not detect prompt injection; Protected SpendGuard can cap what an agent pays, but does not detect it either. Paid tool: 0.005 USDC per call on Base via x402 (exact scheme). An unpaid call returns the payment requirement and charges nothing. Sign only if verdict is ALLOW, before expiresAt, and the transaction you sign is exactly the one you sent (same transactionDigest, chainId 8453). In code: canSign(report, transaction) from @kushbitx/sdk. Beta: Preflight also accepts batches (up to 10 calls), smart-account calls, ERC-4337 UserOperations (deployed accounts) and EIP-7702 authorizations, at the same price. Any call in a batch that KushBitx does not interpret returns REVIEW. Signed verdicts (Beta): on ALLOW, Preflight returns an EIP-712 signed verdict (60-second expiry) bound to executionDigest; REVIEW and BLOCK are never signed; keys at /.well-known/kushbitx-preflight-signers.json.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount in token units, for the record.",
                "pattern": "^[0-9]+(\\.[0-9]{1,18})?$",
                "type": "string"
              },
              "authorizationList": {
                "description": "Beta. EIP-7702 authorizations {chainId, address, nonce, yParity, r, s} of a type-4 transaction.",
                "items": {
                  "properties": {
                    "address": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "authority": {
                      "description": "Optional: the signer of the authorization, when known.",
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "chainId": {
                      "type": "integer"
                    },
                    "nonce": {
                      "type": ["string", "integer"]
                    },
                    "r": {
                      "type": "string"
                    },
                    "s": {
                      "type": "string"
                    },
                    "yParity": {
                      "type": ["string", "integer"]
                    }
                  },
                  "required": ["address", "chainId"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "calls": {
                "description": "Beta. A batch of 1 to 10 calls from one account (from required; no to). Each call: to, value, data, and optionally intent, tokenAddress, expectedRecipient, minAmountOut, expectedTokenOut. Any call KushBitx does not interpret makes the batch REVIEW.",
                "items": {
                  "properties": {
                    "data": {
                      "pattern": "^0x([a-fA-F0-9]{2})*$",
                      "type": "string"
                    },
                    "expectedRecipient": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "expectedTokenOut": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "intent": {
                      "enum": ["swap", "transfer", "approve", "buy_token", "contract_call"],
                      "type": "string"
                    },
                    "minAmountOut": {
                      "type": "string"
                    },
                    "to": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "tokenAddress": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "value": {
                      "pattern": "^[0-9]+$",
                      "type": "string"
                    }
                  },
                  "required": ["to"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "chainId": {
                "description": "Base mainnet.",
                "enum": [8453],
                "type": "integer"
              },
              "data": {
                "description": "Unsigned calldata.",
                "pattern": "^0x([a-fA-F0-9]{2})*$",
                "type": "string"
              },
              "entryPoint": {
                "description": "Beta. With userOperation: the official EntryPoint v0.6, v0.7 or v0.8 address.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "expectedRecipient": {
                "description": "Swap: who must receive the output (default: from). ETH or ERC-20 transfer: who must be paid; a different recipient is BLOCK (EXPECTED_RECIPIENT_MISMATCH).",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "expectedTokenOut": {
                "description": "Swap: token the swap must deliver; 0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE for native ETH. For buy_token, tokenAddress is used when this is absent.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "from": {
                "description": "Wallet that will sign. Required in practice: without it the verdict is REVIEW (sender_unknown), because the transaction cannot be simulated from the signing wallet.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "intent": {
                "description": "What the agent means to do.",
                "enum": ["swap", "transfer", "approve", "buy_token", "contract_call"],
                "type": "string"
              },
              "minAmountOut": {
                "description": "Swap: smallest acceptable output, in token units (for example 25.5).",
                "pattern": "^[0-9]+(\\.[0-9]{1,36})?$",
                "type": "string"
              },
              "policy": {
                "additionalProperties": false,
                "description": "Protected SpendGuard policy (send the agent key as Authorization: Bearer). Base USDC transfers only.",
                "properties": {
                  "agentId": {
                    "type": "string"
                  },
                  "policyId": {
                    "type": "string"
                  },
                  "requestId": {
                    "type": "string"
                  }
                },
                "required": ["agentId", "policyId", "requestId"],
                "type": "object"
              },
              "safeTransaction": {
                "additionalProperties": false,
                "description": "Beta. A Safe transaction (instead of to and data). On ALLOW the response carries safeCoSignature (Safe Policy Engine CoSignerPolicy format); a delegatecall is never co-signed.",
                "properties": {
                  "data": {
                    "type": "string"
                  },
                  "nonce": {
                    "type": "string"
                  },
                  "operation": {
                    "enum": [0, 1],
                    "type": "integer"
                  },
                  "safe": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "required": ["safe", "to"],
                "type": "object"
              },
              "to": {
                "description": "Transaction destination (contract or wallet).",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "tokenAddress": {
                "description": "Token to screen, when it is not the transaction destination (for example the token being bought).",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "userOperation": {
                "description": "Beta. An ERC-4337 UserOperation for a deployed account, with entryPoint (no to).",
                "properties": {
                  "callData": {
                    "pattern": "^0x([a-fA-F0-9]{2})*$",
                    "type": "string"
                  },
                  "callGasLimit": {
                    "type": "string"
                  },
                  "factory": {
                    "type": "string"
                  },
                  "factoryData": {
                    "type": "string"
                  },
                  "initCode": {
                    "type": "string"
                  },
                  "maxFeePerGas": {
                    "type": "string"
                  },
                  "maxPriorityFeePerGas": {
                    "type": "string"
                  },
                  "nonce": {
                    "type": "string"
                  },
                  "paymaster": {
                    "type": "string"
                  },
                  "paymasterAndData": {
                    "type": "string"
                  },
                  "paymasterData": {
                    "type": "string"
                  },
                  "preVerificationGas": {
                    "type": "string"
                  },
                  "sender": {
                    "pattern": "^0x[a-fA-F0-9]{40}$",
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  },
                  "verificationGasLimit": {
                    "type": "string"
                  }
                },
                "required": ["callData", "sender"],
                "type": "object"
              },
              "value": {
                "description": "Native ETH value in wei.",
                "pattern": "^[0-9]+$",
                "type": "string"
              }
            },
            "required": ["chainId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "KushBitx Preflight"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.005
          },
          "digest": "sha256:a9b7af6a99ab2cce20ae0d4b4129bfbc4517017377f55a6d8149bae5cc9558ae"
        },
        {
          "name": "preflight",
          "title": "Simulation Check",
          "description": "Simulation Check: simulate one unsigned Base transaction (eth_call and gas estimate), decode transfers, approvals and setApprovalForAll, and flag unlimited approvals, non-contract targets, the zero address, reverts and destination risk labels. Returns ALLOW, WARN, BLOCK or INCOMPLETE. For one ALLOW, REVIEW or BLOCK verdict before signing (effects, intended recipient, token, batches, signed verdict) use KushBitx Preflight: /api/preflight. Paid tool: 0.001 USDC per call on Base via x402 (exact scheme). An unpaid call returns the payment requirement and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "enum": ["base"],
                "type": "string"
              },
              "data": {
                "description": "Unsigned calldata.",
                "pattern": "^0x([a-fA-F0-9]{2})*$",
                "type": "string"
              },
              "from": {
                "description": "Optional sender used for simulation.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "to": {
                "description": "Transaction destination.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "valueWei": {
                "description": "Native ETH value in wei.",
                "pattern": "^[0-9]+$",
                "type": "string"
              }
            },
            "required": ["chain", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Simulation Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.001
          },
          "digest": "sha256:fecb149215f473f2e45f73b9beefb02761537208648e8cee600d3024801e2c4e"
        },
        {
          "name": "quick_check",
          "title": "Quick Check",
          "description": "Fast pre-payment sanity check for agents on Base: confirms the RPC reports Base mainnet (chain ID 8453) and that the official USDC contract has deployed code. No request body. Returns PASS or FAIL with both checks and a timestamp. It is not a token-risk report, transaction simulation or payment proof. Paid tool: 0.001 USDC per call on Base via x402 (exact scheme). An unpaid call returns the payment requirement and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Quick Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.001
          },
          "digest": "sha256:e744aee5c21e08a5c741aeff4657a24e70788c3f2643eccaa1fd0006c64fc05d"
        },
        {
          "name": "signature_check",
          "title": "Signature Check",
          "description": "Check an EIP-712 signature request before an agent signs it: EIP-3009 (x402 payments), EIP-2612 Permit and Permit2. Checks the chain, the token domain, payTo and amount, the spender, unlimited amounts and long validity. Returns ALLOW, REVIEW or BLOCK bound to the EIP-712 digest. Unknown typed data is REVIEW. An ALLOW is signed by a KushBitx key (signedVerdict, 60 seconds). Paid tool: 0.003 USDC per call on Base via x402 (exact scheme). An unpaid call returns the payment requirement and charges nothing. Sign only if verdict is ALLOW, before expiresAt, for the same signer, and the typed data you sign is exactly the one you sent (same typedDataDigest, chainId 8453 in the request and in typedData.domain). In code: canSignTypedData(report, { chainId, signer, typedData }) from @kushbitx/sdk.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chainId": {
                "const": 8453,
                "type": "integer"
              },
              "expectedAmount": {
                "description": "EIP-3009: the exact amount in atomic units.",
                "pattern": "^[0-9]{1,78}$",
                "type": "string"
              },
              "expectedPayTo": {
                "description": "EIP-3009: who must be paid.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "expectedSpender": {
                "description": "Permit and Permit2: who may spend.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "signer": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "typedData": {
                "description": "The exact EIP-712 object the agent is asked to sign: domain, types, primaryType, message.",
                "type": "object"
              }
            },
            "required": ["chainId", "signer", "typedData"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Signature Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.003
          },
          "digest": "sha256:78e082523e9a80d29819fe21b6ee7d0a479e96613d26c9e7998807fff705b4c4"
        },
        {
          "name": "spendguard_evaluate",
          "title": "SpendGuard policy check",
          "description": "Free. Check a proposed Base USDC payment against a spending policy you supply (per-transaction limit, daily budget, human-approval threshold, allowed recipients) before money moves. Returns APPROVE, HUMAN_APPROVAL or BLOCK with findings. Advisory only: it never signs, holds keys or moves funds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agentId": {
                "type": "string"
              },
              "amount": {
                "type": "string"
              },
              "asset": {
                "enum": ["USDC"],
                "type": "string"
              },
              "chain": {
                "enum": ["base"],
                "type": "string"
              },
              "context": {
                "additionalProperties": false,
                "properties": {
                  "agentProofDecision": {
                    "enum": ["ALLOW", "WARN", "BLOCK", "INCOMPLETE", "UNKNOWN"],
                    "type": "string"
                  },
                  "repeatCount": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "policy": {
                "additionalProperties": false,
                "properties": {
                  "allowedRecipients": {
                    "items": {
                      "pattern": "^0x[a-fA-F0-9]{40}$",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "blockUnknownRecipients": {
                    "type": "boolean"
                  },
                  "maxPerTransaction": {
                    "type": "string"
                  },
                  "maxRepeats": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "remainingDailyBudget": {
                    "type": "string"
                  },
                  "requireHumanAbove": {
                    "type": "string"
                  }
                },
                "required": ["allowedRecipients", "blockUnknownRecipients", "maxPerTransaction", "maxRepeats", "remainingDailyBudget", "requireHumanAbove"],
                "type": "object"
              },
              "recipient": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "requestId": {
                "type": "string"
              }
            },
            "required": ["agentId", "amount", "asset", "chain", "policy", "recipient", "requestId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "SpendGuard policy check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7be795b1c18d723283534d8c31ae08222cf739671b4e5b51509afbaba4afa359"
        },
        {
          "name": "token_risk",
          "title": "Token Risk",
          "description": "Token-risk report for one Base ERC-20 contract. Checks whether the token can be sold (honeypot simulation), buy/sell/transfer tax, owner privileges (mint, pause, blacklist, balance changes, proxy upgrades), holder concentration and DEX liquidity. Returns ALLOW, WARN, BLOCK or INCOMPLETE with scored findings and per-check coverage. INCOMPLETE means required evidence was unavailable, never zero risk. Read-only: never signs or trades. Paid tool: 0.001 USDC per call on Base via x402 (exact scheme). An unpaid call returns the payment requirement and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Base token contract address.",
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "chain": {
                "description": "Blockchain network.",
                "enum": ["base"],
                "type": "string"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Token Risk"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.001
          },
          "digest": "sha256:f01fdecaa798439cbd9211fb9d2b6c9e9ccea8cf7e783310ac87d3c7e9324359"
        },
        {
          "name": "verify_payment",
          "title": "Payment Proof",
          "description": "Verify Base USDC payment by transaction hash: did my x402 payment settle? Check recipient and amount (and optional sender) against the official USDC Transfer logs before releasing goods or credit. Returns VERIFIED, MISMATCH, FAILED or PENDING_OR_NOT_FOUND with block, confirmations, the matching transfer and a Basescan link. Read-only: never moves funds. Paid tool: 0.00288 USDC per call on Base via x402 (exact scheme). An unpaid call returns the payment requirement and charges nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chain": {
                "enum": ["base"],
                "type": "string"
              },
              "expectedAmount": {
                "description": "Expected USDC amount.",
                "pattern": "^[0-9]+(\\.[0-9]{1,6})?$",
                "type": "string"
              },
              "expectedFrom": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "expectedTo": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "txHash": {
                "pattern": "^0x[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["chain", "expectedAmount", "expectedTo", "txHash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Payment Proof"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.00288
          },
          "digest": "sha256:50802745995fb014f3ff8176bd7a5bea41fe40ba09943b3ef2cb0d507919673f"
        }
      ],
      "digest": "sha256:b2a985001e6be9992cf7ba7057276c8a53b4b9d27f60bcadec0445b0809d4da9"
    }
  }
