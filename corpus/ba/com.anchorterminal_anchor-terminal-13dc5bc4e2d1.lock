        {
          "name": "contact",
          "title": "Send a request to Anchor Terminal",
          "description": "Sends a message to the Anchor Terminal team, the same one the site's forms send, and a person replies to email. Use it only when your user asks you to get in touch. Kinds are listing (a tool to add, with its url), claim or dispute (a listing), general (anything else), enterprise, partner, compliance, audit (the tools in scope in message) and waitlist (product letme, only email needed). One call; three an hour and ten a day per address. The reply carries a reference id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company it's for",
                "maxLength": 200,
                "type": "string"
              },
              "email": {
                "description": "Where the reply goes, an address your user reads",
                "maxLength": 254,
                "type": "string"
              },
              "kind": {
                "description": "audit: an agent-readiness audit of a company's tools; listing: a tool to add to the directory, named by url; claim or dispute: a listing; enterprise or partner: an enquiry; compliance: the tools a company's agents use, to research first; general: anything else; waitlist: a place on a waitlist (product); dataset: the research dataset, which is taken from the site's own form at /academia/ by someone signed in with a university address or a journalist's at their publication, not over MCP",
                "enum": ["audit", "listing", "claim", "dispute", "enterprise", "partner", "compliance", "general", "waitlist", "dataset"],
                "type": "string"
              },
              "listing": {
                "description": "The listing it's about: a slug from search_tools, e.g. exa-mcp",
                "maxLength": 200,
                "type": "string"
              },
              "message": {
                "description": "The request, required except for waitlist (where it's an optional note of at most 500 characters). For an audit, the tools in scope (URLs, package names or MCP endpoints), one per line, saying which are internal",
                "maxLength": 5000,
                "type": "string"
              },
              "name": {
                "description": "Who's asking",
                "maxLength": 200,
                "type": "string"
              },
              "product": {
                "description": "waitlist only: letme (calling through letme), the default",
                "enum": ["letme"],
                "type": "string"
              },
              "url": {
                "description": "A domain, repository, endpoint or evidence link",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["email", "kind"],
            "type": "object"
          },
