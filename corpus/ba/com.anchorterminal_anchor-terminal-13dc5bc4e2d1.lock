              },
              "limit": {
                "description": "How many, 1 to 200 (default 50)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "listing": {
                "description": "A listing's slug: only the messages that tag it, such as stripe for $stripe",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
