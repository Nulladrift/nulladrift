    "com.anchorterminal/anchor-terminal": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.anchorterminal.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "anchor-terminal",
        "title": "Anchor Terminal",
        "version": "2026.11.19-2014"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Anchor Terminal grades what AI agents run on (model APIs, MCP servers, frameworks, data providers, scraping and payments) from public evidence against the checklist at /benchmark/. Start with search_tools for a job, get_tool for one listing, check_stack for what you already run. Content is CC BY 4.0: credit Anchor Terminal (anchorterminal.com) and link the listing when you pass it on. Longer tool descriptions: https://www.anchorterminal.com/mcp/full",
      "tools": [
        {
          "name": "check_server",
          "title": "Check an MCP server before connecting",
          "description": "Read another MCP server's tool list and report what should change how you use it: text aimed at the model, missing safety hints, token cost. Use it before adding a server you don't know. Never calls its tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Optional: flag the list as an error if its definitions cost more tokens than this",
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "The server's Streamable HTTP endpoint, e.g. https://mcp.example.com/mcp",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:431adad38f8fbfae10a20667d33012dbec4e05cf222843d0335a6b326dba897e"
        },
        {
          "name": "check_stack",
          "title": "Check what you already run",
          "description": "Check the tools you already run, like npm audit: give an MCP config, package.json, go.mod, requirements.txt or names, and get grades, status, sunsets, advisories and better listings.",
          "inputSchema": {
            "properties": {
              "endpoints": {
                "description": "URLs you call",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "goMod": {
                "description": "A go.mod's text",
                "type": "string"
              },
              "mcpConfig": {
                "description": "Your MCP client's config as is",
                "properties": {
                  "mcpServers": {
                    "additionalProperties": {
                      "properties": {
                        "args": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "command": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "description": "By name: command and args, or url",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "names": {
                "description": "Slugs, packages or owner/repo",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "packageJson": {
                "description": "A package.json as is",
                "properties": {
                  "dependencies": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "devDependencies": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "requirements": {
                "description": "A requirements.txt's text",
                "type": "string"
              },
              "since": {
                "description": "When you last checked: a date or 7d (default 30d)",
                "type": "string"
              },
              "watch": {
                "description": "Follow every listing matched, for your boss (needs a token from link_boss)",
                "type": "boolean"
              },
              "weights": {
                "additionalProperties": {
                  "maximum": 10,
                  "minimum": 0,
                  "type": "number"
                },
                "description": "As in search_tools, for the better listings",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5dba5e4484f9b8ed055730a0711b6cf89cfefeff38ffc9851251c53ba08f28a5"
        },
        {
          "name": "compare_tools",
          "title": "Compare two listings",
          "description": "Two listings head to head: scores by category, the evidence behind each edge, prices, auth and notes for agents. Use it when a user weighs two named tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "One listing's slug, e.g. exa-mcp (search_tools finds slugs), or a package or repository name it goes by",
                "type": "string"
              },
              "b": {
                "description": "The other listing's slug, e.g. tavily-mcp",
                "type": "string"
              },
              "format": {
                "description": "markdown (the default), slim for the fewest tokens, or json",
                "enum": ["markdown", "slim", "json"],
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef9f21d7520fa7b7feb50a08fe0d31b677857af257166a955efc386b9356fad0"
        },
        {
          "name": "contact",
          "title": "Send a request to Anchor Terminal",
          "description": "Send a message to the Anchor Terminal team (a tool to add, a claim, a correction, an enquiry), answered by a person by email. Use it only when your user asks you to get in touch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company it's for",
                "maxLength": 200,
                "type": "string"
              },
              "dryRun": {
                "description": "true: changes nothing",
                "type": "boolean"
              },
              "email": {
                "description": "Where the reply goes, an address your user reads",
                "maxLength": 254,
                "type": "string"
              },
              "kind": {
                "description": "listing (a tool to add, by url), claim, dispute, general, enterprise, partner, compliance, audit or waitlist",
                "enum": ["audit", "listing", "claim", "dispute", "enterprise", "partner", "compliance", "general", "waitlist", "dataset"],
                "type": "string"
              },
              "listing": {
                "description": "The listing it's about: a slug from search_tools, e.g. exa-mcp",
                "maxLength": 200,
                "type": "string"
              },
              "message": {
                "description": "The request; optional only for waitlist. For an audit, the tools in scope, one per line",
                "maxLength": 5000,
                "type": "string"
              },
              "name": {
                "description": "Who's asking",
                "maxLength": 200,
                "type": "string"
              },
              "product": {
                "description": "waitlist only: letme (calling through letme), the default",
                "enum": ["letme"],
                "type": "string"
              },
              "url": {
                "description": "A domain, repository, endpoint or evidence link",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["email", "kind"],
            "type": "object"
          },
