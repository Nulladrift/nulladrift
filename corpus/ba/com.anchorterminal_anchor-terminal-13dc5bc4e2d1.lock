        {
          "name": "search_tools",
          "title": "Search the directory",
          "description": "Find listed tools, APIs, MCP servers, models and data providers for a job, graded ones first with grade, price, auth and status. Use it when a user needs a tool or wants options narrowed by grade, price or auth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agentAlone": {
                "description": "Only listings an agent can start using with no human (keyless, x402 or programmatic signup)",
                "type": "boolean"
              },
              "agentReady": {
                "description": "Only agent-ready listings (grade BB or better)",
                "type": "boolean"
              },
              "auth": {
                "description": "How it authenticates; pat is a personal access token",
                "enum": ["none", "api-key", "oauth", "mixed", "pat"],
                "type": "string"
              },
              "capability": {
                "description": "A capability id from list_capabilities, e.g. web.search",
                "type": "string"
