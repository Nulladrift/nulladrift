        {
          "name": "search_tools",
          "title": "Search the directory",
          "description": "Find tools, APIs, MCP servers, models and data providers for a job. Use it when a user needs a tool for a task or wants options narrowed by grade, price, auth or where data is processed. Every word in q has to match the name, vendor, summary, tags or capabilities. Returns graded listings first, each with grade, score, why it's above the next, auth, price, whether it's up and its endpoint (method at /benchmark/), then indexed listings (facts and our own checks, no score), then other servers from the official MCP registry. Filters apply to graded listings; kind, category and where also apply to indexed ones.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agentAlone": {
                "description": "Only listings an agent can start using with no human (keyless, x402 or programmatic signup)",
                "type": "boolean"
              },
              "agentReady": {
                "description": "Only agent-ready listings (grade BB or better)",
                "type": "boolean"
              },
              "auth": {
                "description": "How it authenticates; pat is a personal access token",
                "enum": ["none", "api-key", "oauth", "mixed", "pat"],
                "type": "string"
              },
              "capability": {
                "description": "A capability id from list_capabilities, e.g. web.search",
                "type": "string"
              },
              "category": {
                "description": "A category slug, e.g. search or browser (list at /categories/)",
                "type": "string"
              },
              "cert": {
                "description": "Certifications every result holds, comma-separated: SOC2, ISO27001, ISO27701, ISO42001, HIPAA, PCI, FedRAMP, CSA, GDPR",
                "type": "string"
              },
              "dpa": {
                "description": "Only listings with a data processing agreement",
                "type": "boolean"
              },
              "includeRegistry": {
                "description": "Also search the official MCP registry (default true)",
                "type": "boolean"
              },
              "kind": {
                "description": "What sort of listing; platform hosts other labs' models, weights are open weights you run",
                "enum": ["mcp", "http-api", "sdk", "model", "router", "platform", "weights", "framework", "harness", "protocol"],
                "type": "string"
              },
              "limit": {
                "description": "How many graded listings to return (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxToolTokens": {
                "description": "Only listings whose MCP tool definitions cost at most this many tokens",
                "minimum": 1,
                "type": "integer"
              },
              "minGrade": {
                "description": "Lowest grade to include, AA best to F worst; BB and up is agent-ready",
                "enum": ["AA", "A", "BB", "B", "C", "D", "E", "F"],
                "type": "string"
              },
              "minRating": {
                "description": "Average panel rating at least this",
                "maximum": 5,
                "minimum": 1,
                "type": "number"
              },
              "noCard": {
                "description": "Only listings that need no payment card before the first call",
                "type": "boolean"
              },
              "noTraining": {
                "description": "Only listings whose vendor says it doesn't train on customers' data",
                "type": "boolean"
              },
              "offset": {
                "description": "Skip this many graded listings, for the next page (the answer's nextOffset)",
                "minimum": 0,
                "type": "integer"
              },
              "pricing": {
                "description": "How it charges; freemium has a free tier, byo-plan is your own plan with the vendor",
                "enum": ["free", "freemium", "usage", "byo-plan", "paid"],
                "type": "string"
              },
              "q": {
                "description": "What you need, in a few words: 'send email', 'web search', 'uk company data'",
                "type": "string"
              },
              "region": {
                "description": "Where data is processed, any of US, EU, UK, CA, APAC, self-hosted, comma-separated",
                "type": "string"
              },
              "unknown": {
                "description": "Listings not yet researched for a requirement filter: exclude (default) or include, marked",
                "enum": ["exclude", "include"],
                "type": "string"
              },
              "weights": {
                "additionalProperties": {
                  "maximum": 10,
                  "minimum": 0,
                  "type": "number"
                },
                "description": "0 to 10 per category, 1 if left out: reliability, schema, ergonomics, security, payments, maintenance, transparency (open weights: capability, reach, risk, interface, upkeep). Ranks by yourScore",
                "type": "object"
              },
              "where": {
                "description": "Where it runs",
                "enum": ["hosted", "local", "both", "library", "spec"],
                "type": "string"
              },
              "x402": {
                "description": "Payable per call with USDC and no account",
                "enum": ["yes", "partial", "no"],
                "type": "string"
              },
              "zeroRetention": {
                "description": "Only listings with zero retention on some plan",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the directory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
