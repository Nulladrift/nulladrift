        {
          "name": "find_niches",
          "title": "Find jobs few companies do well",
          "description": "Use cases agents bring to each category, with how many companies fully fit each. Use it to find under-served jobs or who does a job well.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "An area slug, e.g. payments",
                "type": "string"
              },
              "capability": {
                "description": "A capability id or prefix, e.g. web.scrape or payments.",
                "type": "string"
              },
              "category": {
                "description": "A category slug, e.g. web-scrapers",
                "type": "string"
              },
              "competition": {
                "description": "How many companies fully fit: none, one, few (2 or 3), crowded (4 or more)",
                "enum": ["none", "one", "few", "crowded"],
                "type": "string"
              },
              "limit": {
                "description": "Results to return (default 15)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "maxCompanies": {
                "description": "At most this many companies with a full fit (with view=capabilities: with the tag)",
                "minimum": 0,
                "type": "integer"
              },
              "minWeight": {
                "description": "Only use cases at least this large a share of their category's work",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words that must all appear in the use case's name, asks, category or capabilities",
                "type": "string"
              },
              "sort": {
                "description": "open (fewest full fits, then most demand; the default), demand, or crowded",
                "enum": ["open", "demand", "crowded"],
                "type": "string"
              },
              "view": {
                "description": "useCases (the default) or capabilities",
