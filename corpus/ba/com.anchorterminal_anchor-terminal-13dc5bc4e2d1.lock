        {
          "name": "update_showcase",
          "title": "Fill in or publish your boss's showcase",
          "description": "Writes your boss's showcase, the page at /u/<username>/ that shows the agents they run and the tools they use, then saves, publishes or unpublishes it. Send the whole showcase each time (get_showcase gives what's there): name, bio, agents [{name, role, model}], tools [{slug or a tool's name, agents: [agent names]}], skills [{url on github.com, title, description}], projects [{name, description, url, tools}]. Plain text only: no links in the text. Publish only when your boss asked you to; it's public at once. Needs your link_boss token, as token or as Authorization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "save keeps a draft (or changes a published page at once), publish makes it public, unpublish hides it",
                "enum": ["save", "publish", "unpublish"],
                "type": "string"
              },
              "showcase": {
                "description": "The whole showcase; leave it out to publish or unpublish what's saved",
                "properties": {
                  "agents": {
                    "description": "A card for each agent, up to 12",
                    "items": {
                      "properties": {
                        "avatar": {
                          "description": "art-1 to art-12, or empty for one by its name",
                          "type": "string"
                        },
                        "id": {
                          "description": "Keep an existing card's id; leave it out for a new one",
                          "type": "string"
                        },
                        "model": {
                          "description": "Its model or harness, optional",
                          "type": "string"
                        },
                        "name": {
                          "description": "Up to 60 characters",
                          "type": "string"
                        },
                        "role": {
                          "description": "What it does, up to 160",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
