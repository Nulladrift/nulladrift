      "tools": [
        {
          "name": "rpncalc_eval",
          "description": "Evaluates a Reverse Polish Notation (postfix) expression: whitespace-separated tokens, each a number or an operator/function that pops its operands off a stack and pushes the result. Supports arithmetic, exponentiation/modulo, roots, trigonometry, logarithms, rounding, bitwise ops, and constants (pi, e, phi). Always returns the decimal result — for hex/bin/oct rendering, convert the returned number yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expr": {
                "description": "space-separated RPN expression, e.g. \"3 4 + 2 *\"",
                "type": "string"
              }
            },
            "required": ["expr"],
            "type": "object"
          },
          "outputSchema": {
            "type": "number"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
