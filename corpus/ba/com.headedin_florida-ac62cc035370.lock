        {
          "name": "debark_day",
          "title": "Cruise debark day",
          "description": "Off the ship, not on the plane yet: a Florida cruise debark day. Off the ship in the morning (default 8 AM), flying out later: up to 3 of our own picks near the port in order with drive times, trimmed so the person leaves the last one in time to be at the airport 2 hours before a flight in the U.S. (3 for international, the TSA's general advice), plus the leave-for-the-airport time. Ports: PortMiami, Port Everglades, Port Canaveral, Port Tampa Bay, JAXPORT, Key West; the airport defaults to the usual one for the port (MIA, FLL, MCO, TPA, JAX, EYW). bags=true (all the luggage, no car) keeps it to 2 stops. Drive times are estimates; the person decides.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "Florida airport code, e.g. MCO (default: the usual one for the port)",
                "type": "string"
              },
              "bags": {
                "description": "true when they carry all their bags and have no car (2 stops at most)",
                "type": "boolean"
              },
              "flight": {
                "description": "The flight's departure time, e.g. 4 PM or 16:00",
                "type": "string"
              },
              "international": {
                "description": "true for a flight abroad (3 hours early instead of 2)",
                "type": "boolean"
              },
              "lang": {
                "description": "Language for the descriptions and category names: en (default), es, pt",
                "enum": ["en", "es", "pt"],
                "type": "string"
              },
              "mood": {
                "description": "beach (default), old (Old Florida), rain, wild, weird, road",
                "enum": ["beach", "old", "rain", "wild", "weird", "road"],
                "type": "string"
              },
              "off_ship": {
                "description": "When they are off the ship, e.g. 8 AM (default 8:00 AM)",
                "type": "string"
              },
              "port": {
                "enum": ["miami", "everglades", "canaveral", "tampa", "jax", "keywest"],
                "type": "string"
              }
            },
            "required": ["flight", "port"],
            "type": "object"
