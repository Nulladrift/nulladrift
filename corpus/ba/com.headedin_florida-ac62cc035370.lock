      "serverInfo": {
        "name": "headed-in-florida",
        "title": "Headed In: Florida trips, water and weather",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Local, real-time help for trips around Florida (made on Tampa Bay): where to go, from Tampa Bay and Miami to Naples, Sarasota, the Space Coast, Jacksonville, the Panhandle, Orlando and The Villages (find_places), how busy it is right now (live_conditions), boat ramps anywhere in Florida with live waits around Tampa Bay (boat_ramps), NOAA's marine forecast and tides anywhere in Florida waters (marine_forecast), when Florida drawbridges open next (drawbridges), beach water health advisories statewide (beach_water), rocket launches from Kennedy and the Cape with where to watch (rocket_launches), FWC red tide samples (red_tide), whether an inlet is stacking up on an outgoing tide into the wind (inlet_watch), Florida sandbars and big days like Boca Bash (sandbars), golden hour and a sunset guess anywhere (golden_hour), when to go fishing: the Bite Score, best-bite hours and this week's best days (bite_score), FWC's public artificial reefs and wrecks to fish or dive (artificial_reefs), marina fuel docks (fuel_docks), what's on this week or weekend from Florida city and county calendars (whats_on), true Name game and Weird Florida stories pinned all over the state for road-trip stops (florida_stories), story trails, Wind Phones, a rental's guest guidebook from its headedin.com/stay link (stay_guidebook), and our two free apps (safety_apps): Headed In, the float plan for boaters, and Headed Back, road-trip games and trivia. Data is public and anonymous.",
      "tools": [
