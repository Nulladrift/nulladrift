          "name": "artificial_reefs",
          "title": "Artificial reefs",
          "description": "Florida's public artificial reefs near a spot (FWC's 4,519 deployments statewide): name, position, depth and relief in feet, what was sunk (ships, bridge spans, reef modules), year, miles away, closest first. For fishing, diving and spearfishing trips. Not for navigation.",
