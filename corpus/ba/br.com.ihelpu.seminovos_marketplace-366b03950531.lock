      "instructions": "Marketplace de iPhones usados e seminovos da iHelpU, assistência técnica Apple com 9 lojas no Rio Grande do Sul (RS). Todos os aparelhos têm vistoria técnica iHelpU. Venda e retirada somente no RS: qualquer aparelho pode ser retirado em qualquer uma das 9 lojas (no mesmo dia se já estiver nela, ou em até 2 dias úteis). Garantia: 1 ano para aparelhos vendidos pela iHelpU e lacrados; 3 meses para seminovos de terceiros. Pagamento por PIX ou em até 18x no cartão. Use buscar_iphones para encontrar aparelhos, preco_iphone_usado para preços de referência, lojas_ihelpu para endereços e como_comprar para regras. Sempre informe o link do aparelho para a compra.",
      "tools": [
        {
          "name": "buscar_iphones",
          "title": "Buscar iPhones usados à venda",
          "description": "Busca iPhones (e outros Apple) usados e seminovos disponíveis agora no marketplace iHelpU, no RS. Filtra por modelo, capacidade, cidade de retirada, preço máximo e saúde mínima da bateria. Retorna preço, estado, bateria, garantia, loja onde está e link de compra.",
