        {
          "name": "author",
          "description": "An author's profile by name or id: affiliations (curated table first, else the newest paper's first page), metrics (papers, citations, GitHub stars, active years, h-index when known), their 10 most-cited papers, top 10 collaborators with shared-paper counts, and `more` hints for author_papers / coauthor_network. Use when a question names a person; use search to find the exact name first. A name several people share returns no figures, only who those people are (`ambiguous`, with each one's `openalex_id`): ask again with one. A name nobody is told apart under yet answers by name, marked `name_only`. [Free · 1 credit]",
