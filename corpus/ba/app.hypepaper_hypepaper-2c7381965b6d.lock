        {
          "name": "sota_changelog",
          "description": "Benchmark lanes whose leader changed since a date, corpus-wide or within a topic's subtree: for each change the previous holder, the new leader (paper, method, venue), the delta and how long the old record stood. Use for 'what changed in SOTA on X since June' or a periodic catch-up. Examines the 150 most recently active lanes in scope; a change whose jump is outside the SOTA feed's believability band is not reported. [Free · 3 credits]",
