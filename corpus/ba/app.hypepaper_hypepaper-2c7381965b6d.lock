          "description": "Accepted papers of one venue-year (2020 onwards: ICML, NeurIPS, ICLR, CVPR, ...), most cited first, paginated, with acceptance status (oral/poster/spotlight), primary area, citations, hype, code and project URLs; optional keyword filter on title/abstract and an acceptance-type filter. Use for 'what was at CVPR 2026 on X', to build a venue reading list, or with status='oral' for the papers the programme singled out. [Free · 1 credit]",
