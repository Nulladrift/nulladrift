          "description": "Co-authorship graph around an author: hop 1 is everyone they published with (top 20 by shared papers), hop 2 adds the collaborators of their 8 closest co-authors. Nodes carry hop depth, edges the shared-paper count. Use to map a research group, find who bridges two labs, or pick reviewers. Consortium papers with more than 30 authors are skipped on hop 2. For a person, every node is a person with its `openalex_id`. A name several people share returns no figures, only who those people are (`ambiguous`, with each one's `openalex_id`): ask again with one. A name nobody is told apart under yet answers by name, marked `name_only`. [Free · 2 credits]",
