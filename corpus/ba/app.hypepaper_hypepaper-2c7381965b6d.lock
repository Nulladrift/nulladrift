        {
          "name": "expert_communities",
          "description": "Louvain communities of a topic expert's knowledge graph at one dendrogram level, largest first, with each community's hub nodes and a sample of members resolved to names/types. Use to get the shape of a field before drilling in: level 0 is the finest split, max_level the coarsest. Then expert_node_context on a hub. [Free · 1 credit]",
          "inputSchema": {
