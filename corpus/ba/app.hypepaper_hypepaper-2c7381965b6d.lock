        {
          "name": "citation_walk",
          "description": "Multi-hop citation traversal (up to 3 hops) from a paper, forward (papers citing it), backward (its references) or both, as nodes with in-corpus citation counts and hop depth, and edges carrying the fuzzy match score and the matched reference text. Use to trace lineage, find follow-up work, or build a reading graph; use citation_graph for a flat one-hop page. Inbound edges come newest first, outbound competitors first, so a truncated walk is the top of each side. [Free · 2 credits]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "depth": {
                "default": 2,
                "description": "Hops from the root",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "direction": {
                "default": "both",
                "enum": ["in", "out", "both"],
                "type": "string"
              },
              "max_nodes": {
                "default": 200,
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "min_match_score": {
                "default": 70,
                "description": "Drop edges whose reference match scored below this",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "paper_id": {
                "description": "Paper UUID or arXiv id",
                "type": "string"
              }
            },
            "required": ["paper_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
