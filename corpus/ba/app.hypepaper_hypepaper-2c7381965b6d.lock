        {
          "name": "sota_papers",
          "description": "State of the art for a research topic, a dataset, or a free-text dataset query. Use first for any 'what is SOTA on X', 'best method for X' or 'who leads benchmark X' question. Per benchmark lane (dataset x metric x condition) returns the leader, runners-up and entrants since `since` (default 365 days) with whether each beat the incumbent. Every row carries the value, its provenance (self-reported or reported as a baseline in another paper's table, match method), the paper (id, arXiv id, date, venue, citations, hype, code URL), up to 5 authors and, on paid plans, affiliations. Single-source lanes are flagged: one paper's table is not a leaderboard. Rankings require matching experimental protocols; rows carry conditions and source evidence. Pass the user's own words as `topic` when no topic name is known: scope.interpreted_as then names the topic and benchmarks it was read as (say so), and lists the newest matching papers with ranked_in_lanes — a paper without a lane row has no verified standing. [Free · 6 credits]",
