        {
          "name": "expert_federation",
          "description": "Which topic experts hold the same entity — a paper (by arXiv id), method, model, dataset, benchmark or metric — and under which node id in each. Pass a name or a node id; topic_id narrows the starting expert. Use to move a question to the expert that knows an entity best, or to see how widely a method is used across fields. [Free · 1 credit]",
