        {
          "name": "sota_alarm",
          "description": "Standing alarm on state of the art: watch a topic or a benchmark lane, then poll for the record changes you have not seen yet. action='watch' adds a watch (topic, or dataset with an optional metric), action='unwatch' removes one, action='poll' (the default) returns new events across every watch — the previous holder, the new leader, the delta, and how long the old record stood. A poll marks what it returned as seen and moves the cursor, so the next call is a true diff; pass peek=true to look without consuming. Use it to keep a project current instead of re-reading a leaderboard: one call a day tells you if anything moved. [Free · 10 credits]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "default": "poll",
