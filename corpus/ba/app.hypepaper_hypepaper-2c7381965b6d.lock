        {
          "name": "expert_ask",
          "description": "Ask any topic's expert a question (a topic without its own expert is answered from its nearest ancestor's, else from its own papers). The answer is written from the expert's knowledge graph, paper views, SOTA lanes, benchmark rows and notes; each sentence ends with [Cn] markers that `citations` resolves (hp:// pointer, kind, title, the quoted passage, the paper's URL), and it says what the evidence does not establish instead of guessing. [Free · 5 credits + AI credits]",
