        {
          "name": "expert_graph_map",
          "description": "A budgeted subgraph around a query: seeds are the best full-text hits in the expert's graph, then neighbours join by how many edges tie them to what is already held, until `budget` nodes. Returns nodes, the edges among them and the papers they came from. Use for 'what surrounds X in this field' in one call; then expert_node_context to go deeper. [Free · 2 credits]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "default": 40,
                "maximum": 120,
                "minimum": 5,
                "type": "integer"
              },
