{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentfieldkit/kits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentfieldkit.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentfieldkit-catalog",
        "title": "Agent Field Kit",
        "version": "0.2.0",
        "websiteUrl": "https://agentfieldkit.com",
        "icons": [
          {
            "src": "https://agentfieldkit.com/brand/logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://agentfieldkit.com/brand/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prices are final. Buy with create_checkout (MCP) or POST /api/checkout; a human or authorized agent pays on the returned Stripe-hosted URL. Refunds: 14 days, no questions. License: https://agentfieldkit.com/license",
      "tools": [
        {
          "name": "changes_since",
          "description": "Free. What's new or updated in Agent Field Kit's cyber-defense advisories since a date (YYYY-MM-DD or ISO UTC). Returns headlines plus next_since: store it and pass it on your next scheduled poll so you only fetch changes. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8090e1aaba79c84395c33bfda0e11bc3550a671d8d17bd6781b1c63d09df6ab7"
        },
        {
          "name": "check_my_stack",
          "description": "Given the components an agent runs on (frameworks, bots, platforms, packages with optional versions), return matching advisories (AFK intel plus live OSV.dev, which includes GitHub Security Advisories, for packages with an ecosystem or version), free steps first, relevant kits, and per-component coverage (matched / covered_no_match / not_covered). PREMIUM (Bearer API key). Read-only; inputs are not stored. Package entries may be 'name==version' (PyPI style).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "components": {
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["components"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73785c7f6dcf5b7ae72b419e778bf70d3e5c44dc3e84d50d0bf6758487c9503c"
        },
        {
          "name": "create_checkout",
          "description": "Create a Stripe-hosted checkout for one Agent Field Kit product and return its URL. Does NOT charge anything: a human, or an agent with explicit payment authority, must pay on the returned page. Prices: single template $29 (Agent Security Audit Kit $79), full kit of the 4 original templates $79, team license (10 users) $199. 14-day no-questions refunds. Also sold: Cyber Defense Bundle $79, Bundle + 1 year Cyber Desk Pro $199. Returns session_id and status_url; after payment call get_order with the session_id to receive signed download links (agent-to-agent purchase flow). Returns 'checkout_not_open' until checkout launches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the purchasing agent/app (optional, analytics only)",
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "description": "Buyer email for the receipt (optional)",
                "type": "string"
              },
              "product_id": {
                "enum": ["cost-roi-calculator", "eval-test-plan", "incident-runbooks", "vendor-security-questionnaire", "afk-cyber-bundle-pro-year", "cyber-defense-bundle", "mcp-tool-access-review", "prompt-injection-test-pack", "agent-observability-starter", "agent-security-audit-kit", "realtime-agent-monitoring-kit", "ai-slop-editing-kit", "secrets-rotation-kit", "approval-gates-kit", "eu-ai-act-transparency-kit", "mcp-server-auth-kit", "agent-skill-authoring-kit", "ai-supply-chain-defense-kit", "inference-key-abuse-kit", "ci-registry-credential-kit", "oauth-grant-revocation-kit", "cyber-defense-dashboard-kit", "agent-red-team-suite", "ai-spend-kill-switch-kit", "exposure-patch-alerts-kit", "full-kit", "team-license"],
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a6f576f70cc05b9e643a667bd57d137f46c460a6edb476f5c6f1feda7393622"
        },
        {
          "name": "get_advisory",
          "description": "Get one advisory by id. Free: headline, free first steps and sources. Subscribers (Bearer key): full detail plus a fix-it brief (patch status, fixed version, am I affected, exact steps, how to verify, matching kit). Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c812c80d91c501b29e683c0570d0ff92ac15ac23d960ba76107e3f361e9d0e7e"
        },
        {
          "name": "get_cyber_advisories",
          "description": "Sourced cyber-defense advisories (free: headlines from the last 30 days; subscribers: full detail and history) affecting AI agent stacks (platforms, packages, frameworks, consumer bots). Read-only. Filter by date (YYYY-MM-DD) and/or component (e.g. 'litellm', 'railway', 'grok-bot', 'package:pypi/litellm').",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "component": {
                "maxLength": 80,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cdee9ec76eca19987ce9b341c2c23057f1f3939aeee3943d54a36f366e982b13"
        },
        {
          "name": "get_cyber_dashboard_data",
          "description": "PREMIUM (Bearer API key). Full advisory dataset plus stack index and kit versions, for the Cyber Defense Dashboard kit to auto-update. Optional components: also returns check_my_stack results (AFK intel + live OSV.dev / GitHub advisories) and per-component coverage. Read-only; inputs are not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "components": {
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "since": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b8265939455edbb1fb7e8942d835bd1e2b51f5284f5f8e89232e8797b0360f7"
        },
        {
          "name": "get_hardening_checklist",
          "description": "PREMIUM (Bearer API key). Hardening checklist for one agent stack: key rotation, connector/OAuth revocation, plugin/skill review, approval gates, logging, with config surfaces and a verification level. Independent guidance; no vendor affiliation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "stack": {
                "enum": ["grok-bot", "openclaw", "instinct", "muse", "openai-dots", "chatgpt", "claude", "cursor", "goose", "n8n", "manus", "devin", "replit-agent", "lindy", "zapier-agents", "gemini-spark", "claude-duet", "langchain", "crewai", "autogen", "openai-agents-sdk", "litellm-proxy", "dspy", "mcp-client"],
                "type": "string"
              }
            },
            "required": ["stack"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21c6e7591d6bb6eccd416441ddcc500c04ead1fa4b07ed906899eda6371bf470"
        },
        {
          "name": "get_order",
          "description": "Check an Agent Field Kit order by its Stripe checkout session_id (from create_checkout). Before payment: paid:false with pay_url. After payment: paid:true, a receipt and signed download links (valid 72h, 5 downloads per file). Read-only; never charges.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "pattern": "^cs_(live|test)_[A-Za-z0-9]{10,200}$",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f40f73caacc67527b738839c2a997a04dbcc6d897603728c483a537045575055"
        },
        {
          "name": "get_product",
          "description": "Get one Agent Field Kit product by id. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["cost-roi-calculator", "eval-test-plan", "incident-runbooks", "vendor-security-questionnaire", "afk-cyber-bundle-pro-year", "cyber-defense-bundle", "mcp-tool-access-review", "prompt-injection-test-pack", "agent-observability-starter", "agent-security-audit-kit", "realtime-agent-monitoring-kit", "ai-slop-editing-kit", "secrets-rotation-kit", "approval-gates-kit", "eu-ai-act-transparency-kit", "mcp-server-auth-kit", "agent-skill-authoring-kit", "ai-supply-chain-defense-kit", "inference-key-abuse-kit", "ci-registry-credential-kit", "oauth-grant-revocation-kit", "cyber-defense-dashboard-kit", "agent-red-team-suite", "ai-spend-kill-switch-kit", "exposure-patch-alerts-kit", "full-kit", "team-license"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f39fd86b15c14c3ec91fe0bc10835d2749fbba6f0e9e0e9f059d16f6243e2af"
        },
        {
          "name": "request_kit",
          "description": "Tell Agent Field Kit which new kit you (or the person you act for) would most want to buy. Pick topics and/or describe an idea; optional price tier. Email is optional and only used to notify when a matching kit ships; include it only with that person's consent. Max 5 requests/hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "idea": {
                "maxLength": 1000,
                "type": "string"
              },
              "notify": {
                "type": "boolean"
              },
              "tier": {
                "enum": ["29", "79", "199", "not_sure"],
                "type": "string"
              },
              "topics": {
                "items": {
                  "enum": ["eu-ai-act-readiness", "agent-privacy-dpia", "rag-quality-eval", "human-escalation-design", "multi-agent-testing", "model-selection-scorecard", "agent-slo-sla", "support-agent-playbook", "agent-cost-chargeback", "other"],
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4ba8cadd52d14032ad02bbc9a32c71040ec176ae3959d55daec01f3bbbecdf99"
        },
        {
          "name": "search_advisories",
          "description": "Keyword search over Agent Field Kit cyber-defense advisories (e.g. 'litellm', 'mcp oauth', 'railway'). Free: headlines. Subscribers: full detail and fix-it briefs. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0d88e458249f149d2fe933f20613607c79b83ccba9b013834a85ed4e43e45f6"
        },
        {
          "name": "search_products",
          "description": "Search Agent Field Kit templates, bundles and licenses by keyword. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "enum": ["template", "bundle", "license"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e6413fa2434125af336719a08c2986c480f4bd5d0ca23e12e5073a8df04d74d"
        },
        {
          "name": "vote_agent_poll",
          "description": "Vote in Agent Field Kit's poll 'Which AI agent platforms do you use regularly?' on behalf of the person you act for, only with their consent and with their real answer. Multi-select. Returns live results after voting. Self-selected, not a scientific sample. Max 3 votes/day per network.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "maxLength": 100,
                "type": "string"
              },
              "choices": {
                "items": {
                  "enum": ["openclaw", "grok-bot", "chatgpt-dots", "muse", "instinct", "claude-cowork", "gemini-spark", "microsoft-copilot", "manus", "other", "none"],
                  "type": "string"
                },
                "maxItems": 11,
                "minItems": 1,
                "type": "array"
              },
              "other": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["choices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1581415e5eacb59675ed2599535eca9845e3fdc5d3b7c02bd767a9db00972683"
