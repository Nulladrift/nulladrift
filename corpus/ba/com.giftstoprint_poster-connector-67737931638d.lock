{
  "lockfileVersion": 2,
  "subjects": {
    "com.giftstoprint/poster-connector": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.giftstoprint.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "giftstoprint",
        "title": "GiftsToPrint",
        "version": "1.1.0",
        "websiteUrl": "https://giftstoprint.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GiftsToPrint makes personalised newspaper-style posters showing real headlines from a chosen year, for birthdays, wedding anniversaries, dating anniversaries and retirements, in US, UK, Canadian and Australian editions. Posters are delivered as a print-ready digital file by email (nothing is posted), usually the next working day. Typical flow: find_posters, then get_poster_form, then collect the details and a photo from the user, then upload_photo, then create_poster_checkout, then share the returned checkout_url so the user can review and pay. Names, dates and the his/her wording come from the user. The photo is one the user provides in the current conversation, either attached or as a link. If none has been provided yet, ask for one. If the photo can't be passed to upload_photo, get_photo_upload_link gives the user a page to upload it from their device. If an order can't be completed here, the poster's product_page lets the user order on the website.",
      "tools": [
        {
          "name": "create_poster_checkout",
          "title": "Create the personalised checkout",
          "description": "Validate every detail and create a Shopify checkout for one personalised poster with all the details attached. Returns checkout_url. Nothing is charged: open checkout_url for the user to review the order and pay on GiftsToPrint's own checkout. Before calling, read the details back to the user, including the photo_url so they can check it is the right photo, and confirm they understand they will receive a digital file to print (set confirm_digital_file to true). If a field is wrong, the error lists every problem at once so you can fix them in one go.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "description": "The buyer's email. The download link is sent here.",
                    "format": "email",
                    "type": "string"
                  },
                  "first_name": {
                    "description": "The buyer's first name.",
                    "type": "string"
                  }
                },
                "required": ["email", "first_name"],
                "type": "object"
              },
              "buyer_country": {
                "description": "Optional ISO country code, so checkout opens in the buyer's currency.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "confirm_digital_file": {
                "description": "Must be true: the buyer understands the poster is a digital file to print, not a physical print.",
                "type": "boolean"
              },
              "handle": {
                "description": "The poster's handle, from find_posters.",
                "type": "string"
              },
              "instructions": {
                "description": "Optional note to the designers, e.g. how to crop the photo.",
                "maxLength": 500,
                "type": "string"
              },
              "personalisation": {
                "additionalProperties": {
                  "type": ["string", "integer"]
                },
                "description": "The fields from get_poster_form, keyed by their id (e.g. recipient_first_name, birth_day, birth_month).",
                "type": "object"
              },
              "photo_url": {
                "description": "The photo_url returned by upload_photo.",
                "format": "uri",
                "type": "string"
              },
              "turnaround": {
                "description": "standard: ready the next working day, order Mon-Fri. rush_weekday: ready within 12 hours, order Mon-Fri. rush_weekend: ready within 24 hours, order Sat or Sun.",
                "enum": ["standard", "rush_weekday", "rush_weekend"],
                "type": "string"
              }
            },
            "required": ["buyer", "confirm_digital_file", "handle", "personalisation", "photo_url", "turnaround"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b4251c3dac51410d748d05abf0eac6fe901f9af587fa66496d1e720a8ce1c89"
        },
        {
          "name": "find_posters",
          "title": "Find a poster",
          "description": "Search GiftsToPrint's personalised newspaper-style posters. Each poster shows real headlines and events from one year, personalised with a name, photo and message, and is delivered as a print-ready digital file (nothing is posted). Birthday posters and wedding-anniversary posters exist per milestone and edition (e.g. 60th Birthday, Australian edition, 1966); retirement and dating-anniversary posters cover any year, chosen in the form. Pick the edition by where the recipient lives or grew up (US, UK, Canada or Australia). Returns each matching poster's handle, prices and product page. Next step: get_poster_form.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_country": {
                "description": "Optional ISO country code of the buyer (e.g. \"US\", \"AU\") to show prices in their currency.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "edition": {
                "description": "Country edition: which country's news the poster shows.",
                "enum": ["US", "UK", "Canada", "Australia"],
                "type": "string"
              },
              "milestone": {
                "description": "The birthday or anniversary number, e.g. 60 for a 60th.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "occasion": {
                "description": "What the poster celebrates.",
                "enum": ["birthday", "wedding_anniversary", "dating_anniversary", "retirement"],
                "type": "string"
              },
              "year": {
                "description": "The year the poster should cover (birth year, or wedding year).",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f596559629e4bfcb31c24e91e7d2c8e8bb768117809f8a752a011a9f3502931"
        },
        {
          "name": "get_photo_upload_link",
          "title": "Get a link to upload the photo",
          "description": "Create a private web page where the user can upload the poster photo from their phone or computer. Use this whenever you can't pass the user's photo to upload_photo yourself: they have no link to it, they want to pick it from their device, or a photo they attached in the chat can't be sent on. Give the user upload_page and ask them to tell you once it's uploaded, then call upload_photo with upload_id to get the photo_url. The link works for 7 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:092390dc9a3745382b0ba9b047fa9068c43d7b17e22a096f9baea8f5e584c656"
        },
        {
          "name": "get_poster_form",
          "title": "Get the details a poster needs",
          "description": "List exactly what to collect from the user for one poster: names, dates, optional message, and the photo, plus the turnaround options and prices. Ask the user for anything you don't already know. Don't invent names or dates. Next step: upload_photo, then create_poster_checkout.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer_country": {
                "description": "Optional ISO country code of the buyer, for local prices.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "handle": {
                "description": "The poster's handle, from find_posters.",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69c5696e32cb742cacf9c398346d8ef9b232d773a378fb2b3b71b03d086d9951"
        },
        {
          "name": "upload_photo",
          "title": "Upload the photo for the poster",
          "description": "Store the photo that will be printed on the poster, and return the photo_url to pass to create_poster_checkout. Only use a photo the user has given in THIS conversation. Never reuse a photo or link from memory or an earlier conversation, and never use a product or poster image. If the user hasn't given a photo yet, ask them for one instead of calling this. Give exactly one of: photo (a file the user attached in this chat), image_url (a public https link to the image), image_base64, or upload_id (from get_photo_upload_link, once the user says they've uploaded). If you can't send the user's photo any of these ways, call get_photo_upload_link instead of asking the user for a link. JPEG, PNG or WebP, up to 20MB. Photos are kept for 12 months so the poster can be made and revised, then deleted automatically.",
          "inputSchema": {
            "$defs": {
              "OpenAIFile": {
                "additionalProperties": false,
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "The image file encoded as base64 (a data: URL prefix is fine).",
                "type": "string"
              },
              "image_url": {
                "description": "Public https:// address of the image.",
                "format": "uri",
                "type": "string"
              },
              "photo": {
                "$ref": "#/$defs/OpenAIFile",
                "description": "A photo the user attached in this chat (ChatGPT file reference)."
              },
              "upload_id": {
                "description": "The upload_id from get_photo_upload_link, after the user has uploaded on that page.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["photo"]
          },
          "digest": "sha256:79ff2cfb82dad839f0948719694fe90ba19fed7b3af3b20b55f7a226c4f00355"
        }
      ],
      "digest": "sha256:9ba544b01b4cb4f38b0b6efda6cf8d7520dce736af702d63e6eefae3847655c5"
    }
  }
}
