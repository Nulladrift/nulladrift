      "serverInfo": {
        "name": "accrue-mcp",
        "version": "2.1.0",
        "description": "MCP server for the ACCRUE stablecoin yield platform. Exposes the Stablecoin Yield Index (SYX), all yield vaults, model portfolios, yield calculations and platform metadata, plus unsigned deposit and withdrawal transactions for the agent's own wallet — gas in ETH or in USDC. ACCRUE never signs or custodies funds. Live onchain data on Ethereum and Base. SYX additionally benchmarks Arbitrum lending markets, which are not ACCRUE products."
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "build_user_operation",
          "description": "Second step of the USDC-gas path. Pass back the draft from prepare_transaction unchanged. For usdc_path, add permit_signature (EIP-712 signature of the returned permit). For either path, add authorization_signature (EIP-7702) if prepare asked for one. Returns the final user operation plus its EIP-712 typed data and hash for you to sign. Nothing is sent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "authorization_signature": {
                "description": "Only on first use on the chain: the EIP-7702 authorisation signature, as 65-byte hex or {r, s, yParity}."
              },
              "draft": {
                "description": "usdc_path.draft from prepare_transaction, unchanged.",
                "type": "object"
              },
              "permit_signature": {
                "description": "usdc_path only: 65-byte hex signature of usdc_path.sign.permit (typed data or its digest).",
                "type": "string"
              }
            },
            "required": ["draft"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Build USDC-Gas Operation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4cef45dcc5ac9483b4eeb04b1d72821725ba5dc8fba80a31d8dfc145aacdd774"
        },
        {
          "name": "calculate_yield",
          "description": "Project compound returns for a USDC deposit into any ACCRUE vault or model portfolio over a given holding period. Uses live APY data and applies the ACCRUE platform fee, which is charged on PRINCIPAL and never on yield. Direct vaults are FREE (0%); managed products are 0.50%/yr falling to 0.25% above $1M. Returns gross yield, platform fee, net yield and final balance. Because the fee is on principal, net yield can be negative over a short horizon — net_is_negative flags that. Use this when the user asks \"how much would I earn\" or \"what would my $X grow to\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_usdc": {
                "description": "USDC deposit amount in dollars",
                "minimum": 0.01,
                "type": "number"
              },
              "months": {
                "description": "Holding period in months",
                "minimum": 0.1,
                "type": "number"
              },
              "target_id": {
                "description": "Optional vault ID or portfolio ID. If omitted, projects across all vaults and portfolios.",
                "type": "string"
              }
            },
            "required": ["amount_usdc", "months"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calculate Projected Yield"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5d5e9e46033dbd2317d1f8ff568b85888aedd342cf2eaf467d89c1fb3a493062"
        },
