        {
          "name": "prepare_transaction",
          "description": "Prepare a deposit into or withdrawal from an ACCRUE vault for the calling agent's own wallet. Nothing is signed or sent. Returns (1) eth_path: ordinary unsigned transactions to send in order from the account, paying gas in ETH — ALWAYS returned; and (2) usdc_path: when available, the account can instead pay gas in USDC and hold no ETH at all — sign the returned USDC permit (and, on first use on the chain, the EIP-7702 authorisation, which keeps your address), then call build_user_operation. Prefer usdc_path when the account holds no ETH; eth_path always works. The USDC path shows a gas ceiling: the most the operation can cost; the actual charge is lower. Every precondition is checked first (allowlist, minimum deposit, balance, withdrawable liquidity), so a failure is reported before you sign anything. Amounts are in USDC, e.g. \"25\" or \"12.5\"; for a full withdrawal use amount \"all\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "description": "The agent's own 0x address. Positions are permanently tied to the address that deposits.",
                "type": "string"
              },
              "action": {
                "enum": ["deposit", "withdraw"],
                "type": "string"
              },
              "amount": {
                "description": "USDC amount (\"25\", \"12.5\"), or \"all\" to withdraw the whole withdrawable position.",
                "type": "string"
              },
              "chain": {
                "description": "Chain of the vault. Gas can be paid in ETH or USDC on both.",
                "enum": ["base", "ethereum"],
                "type": "string"
              },
              "gas": {
                "description": "auto (default): return every route available — USDC, USDC and ETH. eth: ETH path only.",
                "enum": ["auto", "eth"],
                "type": "string"
              },
              "vault": {
                "description": "Vault address or on-chain symbol (e.g. acrAAVE) on this chain, from list_vault_contracts. To withdraw from a retired ACCRUE vault (no longer listed, but always withdrawable), pass its address.",
                "type": "string"
              }
            },
            "required": ["account", "action", "amount", "chain", "vault"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Prepare Deposit or Withdrawal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d73f4b45837c28a9c19bd17317a81e01f9c81218053aab1203b81eaa7bc3f2ac"
