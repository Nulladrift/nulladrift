                "type": "string"
              },
              "checked": {
                "description": "true = only items with a recorded check.",
                "type": "boolean"
              },
              "kind": {
                "description": "Kind of item, for example team, build, toolkit, grokbot, trade, guide, field. list_filters returns the kinds that exist.",
                "type": "string"
              },
              "limit": {
                "description": "How many items (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
