        {
          "name": "search_items",
          "title": "Search the shelf",
          "description": "Search the BotShelf Vampire shelf by words (up to 16 different words). Use it when you know the job but not the item, for example \"code review\" or \"meeting notes\". Every word must match the title, description, type, where-it-runs, topic, keywords or id; items in which every word stands at the start of a word (\"test\" in \"tests\", not in \"contest\") come first. Returns short cards (id, title, summary, kind, where it runs, access) and the total number of matches. Next: call get_item with a card's id for the full text. When no item matches every word, the reply carries a hint and, if some items match part of the words, suggestions: the items that match most of them. When a filter value is not in use, filter_note says so. Filters: kind, runs_on, topic, access, checked; list_filters returns the values they accept.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access": {
                "description": "open = full text readable without sign-up. paid = listed, text not available here.",
                "enum": ["open", "paid"],
                "type": "string"
              },
              "checked": {
                "description": "true = only items with a recorded check.",
                "type": "boolean"
              },
              "kind": {
                "description": "Kind of item, for example team, build, toolkit, grokbot, trade, guide, field. list_filters returns the kinds that exist.",
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, for example \"code review\" or \"meeting notes\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "runs_on": {
                "description": "Where it runs, exactly as shown on the shelf, for example \"Claude Code\", \"Grok Bot\", \"Ollama\", \"TradingView\". list_filters returns the names in use.",
                "type": "string"
              },
              "topic": {
                "description": "Topic label exactly as shown on the shelf, for example \"Research\". list_filters returns the topics in use.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
