{
  "lockfileVersion": 2,
  "subjects": {
    "com.stackduke/radar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://radar.stackduke.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stackduke-radar",
        "title": "Stackduke Radar",
        "version": "0.1.0",
        "websiteUrl": "https://stackduke.com/tracker"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stackduke Radar answers questions about the tool lists of a fixed set of official vendor MCP servers, from the data behind Stackduke's public tracker. It is read-only: it cannot act on any service, it does not connect to those servers for anyone, and it does not say whether a server is safe. Answers give tool names as identifiers and never quote a server's descriptions.",
      "tools": [
        {
          "name": "find_tool",
          "title": "Find a tool by name",
          "description": "Finds which tracked vendor MCP servers list a tool with a given name, and the kind each is counted as. By default it matches the whole name, ignoring case; with match set to 'contains' it finds names containing the text (at least 3 characters). Searches only the servers the tracker follows, at their latest listing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "match": {
                "default": "exact",
                "enum": ["exact", "contains"],
                "type": "string"
              },
              "name": {
                "description": "A tool name, for example \"delete_issue\".",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_.-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_as_of": {
                "description": "When the tracker data was published.",
                "type": "string"
              },
              "match": {
                "type": "string"
              },
              "matches": {
                "items": {
                  "properties": {
                    "kind": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "tool": {
                      "type": "string"
                    },
                    "vendor": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "tool", "vendor"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "servers_searched": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "description": "The tracker page this answer is drawn from.",
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "total_matches": {
                "type": "integer"
              }
            },
            "required": ["data_as_of", "matches", "query", "source", "summary", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a tool by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6a77e548a22010a745184144b3712cedb1a8efd6dff9d66f567e772aa74c559"
        },
        {
          "name": "get_recent_changes",
          "title": "Get recent tool changes",
          "description": "Gives the changes seen to one tracked vendor MCP server's tool list in the last 1 to 30 days (default 7): tools added and removed, tools changed with the fields that changed (title, description, input or output schema, annotations), and tools now counted as able to do more than before. Each change is dated as seen between two checks, because the tracker compares one listing with the next. The answer also says how many checks were made in the period, which ones failed, and any stretch that was not watched. A change made and undone between two checks is not seen. Changed text is never quoted. A server the tracker does not follow gets a 'not covered' answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 7,
                "description": "How many days back to look, 1 to 30. Default 7.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "vendor": {
                "description": "The server, by id or name, for example \"huggingface\" or \"Microsoft Learn\".",
                "maxLength": 40,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,39}$",
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changes": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "checks_in_period": {
                "type": "integer"
              },
              "covered": {
                "type": "boolean"
              },
              "covered_vendors": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "data_as_of": {
                "description": "When the tracker data was published.",
                "type": "string"
              },
              "days": {
                "type": "integer"
              },
              "failed_checks": {
                "items": {
                  "properties": {
                    "at": {
                      "type": "string"
                    },
                    "outcome": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "failed_checks_total": {
                "type": "integer"
              },
              "last_listed": {
                "type": ["string", "null"]
              },
              "listings_in_period": {
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "older_changes_may_be_missing": {
                "type": "boolean"
              },
              "period": {
                "properties": {
                  "from": {
                    "type": "string"
                  },
                  "to": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "source": {
                "description": "The tracker page this answer is drawn from.",
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "unwatched_stretches": {
                "items": {
                  "properties": {
                    "from": {
                      "type": "string"
                    },
                    "hours": {
                      "type": "integer"
                    },
                    "to": {
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "vendor": {
                "type": "string"
              },
              "vendor_asked": {
                "type": "string"
              },
              "watched_from": {
                "type": ["string", "null"]
              }
            },
            "required": ["covered", "data_as_of", "source", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get recent tool changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fee39f97eeeb9910d4158ea4da4edb1a810ecd2e7e6d457641174ae4ab05caf"
        },
        {
          "name": "get_server_capabilities",
          "title": "Get a server's tools by kind",
          "description": "Gives the tool names on one tracked vendor MCP server, grouped by the most serious thing each tool is counted as able to do: money (move or spend money), destructive (changes that cannot be undone, such as deleting), send (send messages or publish to other people), write (create or change things), unclear, or read (labelled as only reading). Labels come from Stackduke's open-source scanner: the server's own annotations where it sends them, otherwise a guess from the tool's name that leans to the more serious kind. They are not verified by calling the tools, and they do not mean a server is safe. Tool descriptions are never included. A server the tracker does not follow gets a 'not covered' answer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional. Only the tools counted as this kind.",
                "enum": ["money", "destructive", "send", "write", "unclear", "read"],
                "type": "string"
              },
              "vendor": {
                "description": "The server, by id or name, for example \"huggingface\" or \"Microsoft Learn\".",
                "maxLength": 40,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,39}$",
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "covered": {
                "type": "boolean"
              },
              "covered_vendors": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "data_as_of": {
                "description": "When the tracker data was published.",
                "type": "string"
              },
              "groups": {
                "items": {
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "meaning": {
                      "type": "string"
                    },
                    "tools": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["count", "kind", "meaning", "tools"],
                  "type": "object"
                },
                "type": "array"
              },
              "last_listed": {
                "type": ["string", "null"]
              },
              "name": {
                "type": "string"
              },
              "names_withheld": {
                "type": "integer"
              },
              "source": {
                "description": "The tracker page this answer is drawn from.",
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "tool_count": {
                "type": ["integer", "null"]
              },
              "vendor": {
                "type": "string"
              },
              "vendor_asked": {
                "type": "string"
              }
            },
            "required": ["covered", "data_as_of", "source", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a server's tools by kind"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4d24c13788038ea4685c975d2de611875d33f5d19796acd96bef67bdfd39c15"
        },
        {
          "name": "list_tracked_servers",
          "title": "List tracked MCP servers",
          "description": "Lists the official vendor MCP servers that Stackduke's public tracker follows. For each: its tool count, its tools counted by kind (money, destructive, send, write, unclear, read), when it was last checked and when its tools were last listed. Only these servers are covered. The tracker data is published about once a day. Read-only: answers come from Stackduke's published tracker data, and no vendor's server is contacted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data_as_of": {
                "description": "When the tracker data was published.",
                "type": "string"
              },
              "servers": {
                "items": {
                  "properties": {
                    "kinds": {
                      "additionalProperties": {
                        "type": "integer"
                      },
                      "type": "object"
                    },
                    "last_checked": {
                      "type": ["string", "null"]
                    },
                    "last_listed": {
                      "type": ["string", "null"]
                    },
                    "latest_outcome": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "server_address": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "tool_count": {
                      "type": ["integer", "null"]
                    },
                    "vendor": {
                      "type": "string"
                    },
                    "website": {
                      "type": "string"
                    }
                  },
                  "required": ["kinds", "last_checked", "last_listed", "name", "source", "tool_count", "vendor"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "The tracker page this answer is drawn from.",
                "type": "string"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["data_as_of", "servers", "source", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List tracked MCP servers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98e4035e2bc3289ab65b366fc91522767363ec00609f3bf16bc5f2d861545548"
        }
      ],
