      "instructions": "Subastas públicas de España (BOE judiciales, notariales, Seguridad Social, AEAT, ayuntamientos…). buscar_bienes devuelve los resultados con un resumen gratis (tipo, municipio, origen, m², valor, depósito y fin); ver_bien da la ficha completa y la primera consulta de cada bien gasta 1 de la cuota mensual. No abras las fichas de todos los resultados: enseña la lista y pregunta al usuario cuáles quiere ver; si hay muchos más resultados que fichas disponibles, propón acotar la búsqueda. Los valores exactos de los filtros salen de listar_provincias, listar_municipios y opciones_filtros. Con la cuenta conectada (en prueba gratuita o con un plan en vigor) o con una key valen todas, con los cupos mensuales del plan (mi_cuenta los da). Sin cuenta, o con una cuenta sin plan, también se puede buscar: buscar_bienes dice cuántas subastas activas coinciden, pero solo se ven las finalizadas, con límites diarios; sin cuenta, las tools de cuenta y las subastas activas piden conectar la cuenta. buscar_por_codigo encuentra un bien por referencia catastral, IDUFIR/CRU o id del BOE. Para dudas de conceptos (depósito, cargas, cesión de remate…) usa explicar_concepto o lee el recurso alertasubastas://conceptos; antes de crear_alerta, alertas_previsualizar dice cuántas subastas activas coinciden. Los valores de los filtros están también en alertasubastas://filtros.",
      "tools": [
        {
          "name": "alertas_previsualizar",
          "title": "Previsualizar una alerta",
          "description": "Antes de crear_alerta: cuántas subastas activas coinciden ahora con esos filtros y una muestra de hasta 5 ids (las más recientes), para ajustar filtros demasiado estrechos o amplios. Mismos filtros y reglas de plan que crear_alerta. No crea nada ni consume cuota.",
