        {
          "name": "ver_bien",
          "title": "Ficha de un bien",
          "description": "Detalle completo de un bien: datos del bien, de su lote y de su subasta (valor, depósito, puja, cargas, situación posesoria, fechas, URL oficial…), subastas similares (ids) y, si la hay, la estimación de valor de mercado (venta y alquiler, de Idealista). En zonas con poca actividad, Idealista no valora el inmueble y valor_mercado trae el precio medio de la zona por la superficie, con aproximado: true y sin rango. La primera consulta de cada bien consume 1 de la cuota mensual de subastas consultadas, repetirla es gratis. Ábrela solo para los bienes que el usuario quiere ver: para elegir, basta el resumen de buscar_bienes. Tras varias fichas nuevas seguidas pide confirmación (error confirmacion_necesaria): pregunta al usuario y, si lo confirma, repite con confirmado: true.",
