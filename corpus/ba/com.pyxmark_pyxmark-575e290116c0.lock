      "instructions": "Vendor and counterparty checks: sanctions screening (OFAC SDN + Consolidated, UN, EU, UK), SEC EDGAR company lookup, domain age and email-auth signals, and a combined due_diligence_report. Every result carries a timestamp and dated source. Free without a key (25 tool calls per day per IP). Results are informational, not compliance determinations; always tell the user to verify potential matches against the linked official entry.",
