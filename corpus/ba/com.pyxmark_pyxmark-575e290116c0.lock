        },
        {
          "name": "due_diligence_report",
          "title": "Vendor due diligence report",
          "description": "One-call due-diligence report: SEC profile (if public), sanctions screen, federal exclusions, domain signals (registration age, email records, Wayback Machine first-seen date), and state registry link, with a red-flag summary, a verdict (clear / review / hold; rules at https://mcp.pyxmark.com/#verdict) and source links. An agent should not pay or onboard on 'hold', and should ask a person on 'review'. Informational only, not a compliance determination. Results come from public government lists and filings, may be incomplete or out of date, and fuzzy name matches can be false positives or miss variants. Verify every potential match against the official source before acting. Colorado vendors only (state CO or a Colorado address): address_density gives how many active Colorado companies list the vendor's address, from the Colorado Department of State's Business Entities in Colorado data (Public Domain), refreshed monthly. A building that also hosts a listed virtual mailbox service, an address shared by 1,000+ companies, or a registered agent's address used by hundreds of companies that almost none of them list as their principal address adds a worth-a-second-look line under info, never a red flag or a verdict change; other states are not covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional: street address or city (free text). Flags addresses in comprehensively sanctioned regions: Crimea, the so-called DNR/LNR, Iran, North Korea, Cuba (Syria is flagged for review)",
                "type": "string"
              },
              "birth_year": {
                "description": "Optional: birth year, if the full date isn't known",
                "type": "number"
              },
              "cik": {
                "description": "SEC CIK",
                "type": "string"
              },
              "country": {
                "description": "Optional: country where the person lives or the organisation is based",
                "type": "string"
              },
              "dob": {
                "description": "Optional: date of birth (YYYY-MM-DD) of the person, to tell them apart from others with the same name",
                "type": "string"
              },
              "domain": {
                "description": "Company website or email domain",
                "type": "string"
              },
              "email": {
                "description": "Optional: contact email, matched against emails and domains the lists give",
                "type": "string"
              },
              "ids": {
                "description": "Optional: identifiers to match against the lists: company registration or tax numbers, passport or national ID numbers, vessel IMO numbers, SWIFT/BIC codes, crypto addresses",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Company or person name",
                "type": "string"
              },
              "nationality": {
                "description": "Optional: the person's nationality (country name or ISO code)",
                "type": "string"
              },
              "owners": {
                "description": "Optional: owners and their share (percent). Each is screened; listed owners holding 50% or more in total make the company blocked under the OFAC 50 percent rule",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "percent": {
                      "type": "number"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "phone": {
                "description": "Optional: phone number, matched on its last 9 digits against phones the lists give",
                "type": "string"
              },
              "state": {
                "description": "US state of incorporation/registration",
                "type": "string"
              },
              "subject_type": {
                "description": "Optional: whether the name is a company or a person. Defaults to company when the name has a legal suffix such as Inc or LLC (or, in a report, when it is an SEC-registered company); then person, vessel and aircraft entries must match almost exactly.",
                "enum": ["company", "person"],
                "type": "string"
              },
              "ticker": {
                "description": "Ticker",
                "type": "string"
              },
              "website": {
                "description": "Optional: website or domain, matched against websites the lists give",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Vendor due diligence report"
