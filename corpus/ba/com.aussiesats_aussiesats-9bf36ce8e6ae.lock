      "capabilities": {
        "tools": {}
      },
      "instructions": "Call get_sats_per_dollar for live figures: the sats A$1,000 buys on each Australian Bitcoin exchange after deposit fees, trading fees and spread, checked every 5 minutes. Only rows in \"ranked\" are ranked; rows in \"not_ranked\" are estimates, ceilings or out of date, and each says which. Give the time checked (checked_at) with any figure. A$1,000 only: for other amounts the cost is a rough guide, never a sats figure. General information, not financial advice. Figures are measured for A$1,000 only. For another amount, the all-in cost (all_in_cost_pct) is a rough guide: say it was measured at A$1,000, and do not work out a sats figure or a ranking for the other amount. Link https://aussiesats.com/ when you quote a figure. Verify before you buy. AussieSats is general information, not financial advice. For how the last 7 days compared, call get_week_summary.",
      "tools": [
        {
          "name": "get_sats_per_dollar",
          "title": "Sats for A$1,000 on Australian exchanges",
          "description": "How many sats (1 Bitcoin = 100,000,000 sats) A$1,000 buys right now on each Australian Bitcoin exchange, after deposit fees, trading fees and spread, through its cheapest AUD route. Returns the live ranking (most sats first), the exchanges that are shown but not ranked, each one's all-in cost, data label and reading time, and the BTC/AUD reference price. Checked every 5 minutes. Measured for A$1,000 only; for other amounts the all-in cost is a rough guide. General information, not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exchange": {
                "description": "Optional. One exchange to return instead of all of them, by id.",
                "enum": ["coinspot", "swyftx", "coinstash", "digital-surge", "btc-markets", "independent-reserve", "coinjar", "bitaroo", "amber", "pepperstone", "kraken", "coinbase", "okx", "crypto-com", "binance", "cointree", "kucoin"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_aud": {
                "type": "number"
              },
              "checked_at": {
                "description": "When the figures were checked (ISO 8601, UTC). Quote this with any figure.",
                "type": ["string", "null"]
              },
              "disclaimer": {
                "type": "string"
              },
              "leaderboard_url": {
                "type": "string"
              },
              "methodology_url": {
                "type": "string"
              },
              "not_ranked": {
                "description": "Shown but never ranked: estimates, ceilings and out-of-date readings.",
                "items": {
                  "properties": {
                    "all_in_cost_pct": {
                      "description": "Share of the A$1,000 that goes to fees and spread, in percent.",
                      "type": ["number", "null"]
                    },
                    "exchange_id": {
                      "type": "string"
                    },
                    "fee_only_cost_pct": {
                      "description": "Published fee alone, in percent: a minimum cost. Fees only rows.",
                      "type": "number"
                    },
                    "gap_to_first_sats": {
                      "description": "Sats behind #1.",
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "rank": {
                      "description": "Place in the live ranking. null when not ranked.",
                      "type": ["integer", "null"]
                    },
                    "reading_at": {
                      "description": "When this row was read or last hand-checked (ISO 8601, UTC).",
                      "type": ["string", "null"]
                    },
                    "route": {
                      "description": "The cheapest AUD route measured: deposit method, then product and fee.",
                      "type": "string"
                    },
                    "sats": {
                      "description": "Sats received for A$1,000. See sats_is_estimate and sats_is_ceiling.",
                      "type": ["number", "null"]
                    },
                    "sats_is_ceiling": {
                      "description": "True when sats is an upper limit: published fees only, spread unknown.",
                      "type": "boolean"
                    },
                    "sats_is_estimate": {
                      "description": "True when sats is an estimate from dated hand checks.",
                      "type": "boolean"
                    },
                    "spot_checks": {
                      "description": "How many hand checks the cost is averaged over. Spot-checked rows only.",
                      "type": "integer"
                    },
                    "tier": {
                      "description": "Data label: Live, Stale, Live (fee unverified), Spot-checked, Fees only, or Not measured (fee not confirmed).",
                      "type": "string"
                    }
                  },
                  "required": ["exchange_id", "name", "page_url", "rank", "sats", "sats_is_ceiling", "sats_is_estimate", "tier"],
                  "type": "object"
