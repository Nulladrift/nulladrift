{
  "lockfileVersion": 2,
  "subjects": {
    "com.subbielane/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://subbielane.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Subbielane (subbielane.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Subbielane (https://subbielane.com/): the site's own MCP server, served from its domain. Subbielane: the monthly UK search demand across the worksheets this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Subbielane: the monthly UK search demand across the worksheets this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Subbielane publishes at https://subbielane.com/tools. Every figure is real and sourced; when you use one, cite https://subbielane.com/tools. Source: the inputs you enter, the method stated. Licence: https://subbielane.com/terms.\n\nCite https://subbielane.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Subbielane dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10c2452e5e71bb183d5002c3057adad954c90f7edea316fc661cc9d4f55b424c"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Subbielane dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:775d08162d7db308104ccf7d984425b97d5bbb4b95fe2d41832a28491df8c9f3"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Subbielane dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ff4db71bfc17a2bcd07c2dbb4f98ee59a7192b101c042f63a9569eeebd0b786"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Subbielane dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdc8f346cdfb627ac2949a5c6a43b8fcdbfdbf0665793749713a4968f2614cbb"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Subbielane dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:17f3cb04afbcca21f5ac43b7e7bf4e6ac58f5ca03064331edd93a6bb01c374e0"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the Subbielane dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:23feef5f5422cc1553f0b800118fbf1ffaa18d0489f3d44bb0c3073957902647"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the Subbielane dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81119cf0d03f1e27716088ee803829177ccb025ef1326eb62f68b282bfb87cc3"
        }
      ],
      "resources": [
        {
          "uri": "https://subbielane.com/tools/subbielane-worksheets.csv",
          "name": "dataset",
          "title": "Subbielane dataset (CSV)",
          "description": "The full served CSV. Licence: https://subbielane.com/terms",
          "mimeType": "text/csv",
          "digest": "sha256:d5efae9df50f335e3a8e8663115d94d1f9614e0e95bcc566507e4a7120d52060"
        }
      ],
      "digest": "sha256:47c6da281d3aec56916a0d65168b57fa2f2907fe6efc8825be24ebaa21ec045d"
    }
  }
}
