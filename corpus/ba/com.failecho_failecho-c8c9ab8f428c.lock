{
  "lockfileVersion": 2,
  "subjects": {
    "com.failecho/failecho": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://failecho.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "failecho",
        "title": "FailEcho",
        "version": "0.1.0",
        "websiteUrl": "https://failecho.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "FailEcho provides live cross-agent failure intelligence: what other agents\nsaw when a tool failed, and what fixed it. Use it when another tool fails,\nbefore retrying blindly. Call check_tool_failure BEFORE retrying:\nit returns whether others are failing the same way now, the recovery actions\nthat worked, and one recommendation -- or `skip` when nothing has.\nClose the loop: report_tool_failure on a failure, report_tool_success on a\nsuccess (rates need a denominator), report_recovery_outcome after you try\na fix. Name things as the server does: service = serverInfo.name or the API\nhost, operation = the tool or endpoint name. Send failure metadata only --\nnever prompts, arguments, results, bodies, headers, keys or user content;\nerror text is normalized server-side and the raw string discarded.",
      "tools": [
        {
          "name": "check_tool_failure",
          "title": "Check what the network knows about a tool failure",
          "description": "Use FailEcho when another tool fails, before retrying blindly. Call this BEFORE retrying a failed tool, API or MCP call. Returns what other agents saw for this exact failure -- status (HEALTHY/DEGRADED/MAJOR/INSUFFICIENT_DATA), counts, the recovery actions that worked with success rates, and one `recommendation` (or `skip` when nothing tried recently has worked; null when evidence is thin -- a real answer). Works on your own history before anyone else joins. Free, anonymous, stores nothing, never rate limited.",
          "inputSchema": {
            "properties": {
              "error_code": {
                "description": "Code, e.g. '422', 'ECONNRESET'.",
                "maxLength": 32,
                "type": "string"
              },
              "error_message": {
                "description": "The error text only; normalized server-side, not stored by this call.",
                "maxLength": 2000,
                "type": "string"
              },
              "error_type": {
                "description": "Failure class, e.g. 'validation_error', 'timeout', 'rate_limit', 'auth_error'.",
                "maxLength": 64,
                "type": "string"
              },
              "operation": {
                "description": "The tool or endpoint as the server names it, e.g. 'create_issue', not 'mcp__github__create_issue'.",
                "maxLength": 128,
                "type": "string"
              },
              "reporter_id": {
                "description": "Optional stable agent id; hashed, never stored raw. Lets from_other_agents be answered.",
                "maxLength": 200,
                "type": "string"
              },
              "schema_hash": {
                "description": "Short hash of the tool schema you used (separates 'API broke' from 'schema stale').",
                "maxLength": 64,
                "type": "string"
              },
              "service": {
                "description": "The MCP server's own name (serverInfo.name) or the API host, e.g. 'api.github.com'. Not your client's local alias.",
                "maxLength": 128,
                "type": "string"
              },
              "verbose": {
                "default": false,
                "description": "Full record (timestamps, rates, effective counts, every action). Default: the compact answer.",
                "type": "boolean"
              },
              "version": {
                "description": "Service/tool version, if known.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["operation", "service"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "check_tool_failureDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cc5bcf79a63a4cc7d6344ec9031829f61e07692cbeaa4a9a1cb509ccfac9cb4e"
        },
        {
          "name": "report_recovery_outcome",
          "title": "Report whether a recovery action worked",
          "description": "After acting on a failure -- retry, wait, refresh_schema, reconnect, use_fallback, reauthenticate -- report whether it worked. Every recommendation others get is built from these. Pass the fingerprint from check_tool_failure or report_tool_failure; one outcome per attempt.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "What you tried, e.g. 'refresh_schema' ([a-z0-9_.-]).",
                "maxLength": 64,
                "type": "string"
              },
              "fingerprint": {
                "description": "From check_tool_failure or report_tool_failure (32 hex chars).",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              },
              "reporter_id": {
                "description": "Optional stable agent id; hashed, never stored raw.",
                "maxLength": 200,
                "type": "string"
              },
              "successful": {
                "description": "True when the action resolved the failure.",
                "type": "boolean"
              }
            },
            "required": ["action", "fingerprint", "successful"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "report_recovery_outcomeDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:90160d725b0a67736ce6775cec4c523f08871d8b1810453abe7ca9cdd959fb50"
        },
        {
          "name": "report_tool_failure",
          "title": "Report a failed tool call to the network",
          "description": "Report a failed tool/API/MCP call so others can recognise it; call after a failure, alongside check_tool_failure.\n\nPRIVACY: this is a shared network. Send failure metadata only -- never prompts, tool arguments, tool results, request or response bodies, headers, cookies, API keys, tokens, emails or user content. Error text is normalized server-side and the raw string discarded. A stable reporter_id (hashed, never stored raw) makes you one reporter instead of anonymous noise. Writes are rate limited per client.",
          "inputSchema": {
            "properties": {
              "error_code": {
                "description": "Protocol/vendor code, e.g. '422'.",
                "maxLength": 32,
                "type": "string"
              },
              "error_message": {
                "description": "Error text. Normalized before storage; no secrets please.",
                "maxLength": 2000,
                "type": "string"
              },
              "error_type": {
                "description": "Short failure class, e.g. 'validation_error'.",
                "maxLength": 64,
                "type": "string"
              },
              "latency_ms": {
                "description": "Observed call latency in milliseconds.",
                "minimum": 0,
                "type": "integer"
              },
              "operation": {
                "description": "The tool or endpoint as the server names it, e.g. 'create_issue', not 'mcp__github__create_issue'.",
                "maxLength": 128,
                "type": "string"
              },
              "reporter_id": {
                "description": "Optional stable identifier for your agent. Salted and hashed on arrival; never stored raw.",
                "maxLength": 200,
                "type": "string"
              },
              "schema_hash": {
                "description": "Short hash of the tool schema used.",
                "maxLength": 64,
                "type": "string"
              },
              "service": {
                "description": "The MCP server's own name (serverInfo.name) or the API host, e.g. 'api.github.com'. Not your client's local alias.",
                "maxLength": 128,
                "type": "string"
              },
              "version": {
                "description": "Version of the service/tool.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["operation", "service"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "report_tool_failureDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:12757c24f174016c9db4d7b9680487aea9caa03967363913754fc429a4aea54d"
        },
        {
          "name": "report_tool_success",
          "title": "Report a successful tool call to the network",
          "description": "Report that a call SUCCEEDED. Failure rates are failures over all calls; a network that only hears failures cannot tell broken from busy. No error data -- service, operation, version, latency.",
          "inputSchema": {
            "properties": {
              "latency_ms": {
                "description": "Observed call latency in milliseconds.",
                "minimum": 0,
                "type": "integer"
              },
              "operation": {
                "description": "The tool or endpoint as the server names it, e.g. 'create_issue', not 'mcp__github__create_issue'.",
                "maxLength": 128,
                "type": "string"
              },
              "reporter_id": {
                "description": "Optional stable agent id; hashed, never stored raw.",
                "maxLength": 200,
                "type": "string"
              },
              "schema_hash": {
                "description": "Short hash of the tool schema used.",
                "maxLength": 64,
                "type": "string"
              },
              "service": {
                "description": "The MCP server's own name (serverInfo.name) or the API host, e.g. 'api.github.com'. Not your client's local alias.",
                "maxLength": 128,
                "type": "string"
              },
              "version": {
                "description": "Version of the service/tool.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["operation", "service"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "report_tool_successDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4e269de2c620ed281aacf65cfc25588d3dcc2fbd9019f8f29225159bc83b32c7"
        }
      ],
      "digest": "sha256:359c7aee07665eecbf9c3ebcf1b5e599ac42fae7255ab5e00bd36272727316a3"
    }
  }
}
