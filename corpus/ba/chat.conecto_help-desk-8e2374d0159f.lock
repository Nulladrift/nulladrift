              },
              "inbox": {
                "maxLength": 254,
                "type": "string"
              },
              "internal": {
                "default": false,
                "type": "boolean"
              },
              "number": {
                "description": "The ticket number, e.g. 42 for ticket #42.",
                "minimum": 1,
                "type": "integer"
              },
