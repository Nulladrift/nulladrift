        {
          "name": "ticket_list",
          "title": "List tickets",
          "description": "Tickets, newest activity first, by status (default: open and pending), priority, requester, tag, custom field, CRM contact or company, words in the subject or request, or activity since a time. A view gives a work queue instead: waiting_on_us (open, no reply since the customer last wrote; longest waiting first), waiting_on_customer (pending), overdue (an SLA target missed; most overdue first), at_risk (an SLA target due within within_minutes), unassigned, or mine (assigned to the calling bot). Free. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_id": {
                "minimum": 1,
                "type": "integer"
              },
              "contact_id": {
                "minimum": 1,
                "type": "integer"
              },
              "fields": {
                "additionalProperties": {
                  "maxLength": 500,
                  "type": "string"
                },
                "description": "Only tickets with these custom field values, e.g. {\"order_id\": \"1042\"}.",
                "maxProperties": 5,
                "propertyNames": {
                  "pattern": "^[a-z][a-z0-9_]{0,39}$"
                },
                "type": "object"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "enum": ["low", "normal", "high", "urgent"],
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              },
              "requester": {
                "maxLength": 254,
                "type": "string"
              },
              "since": {
                "description": "ISO 8601: activity at or after this time.",
                "maxLength": 40,
                "type": "string"
              },
              "status": {
                "enum": ["open", "pending", "resolved", "all"],
                "type": "string"
              },
              "tag": {
                "maxLength": 40,
                "type": "string"
              },
              "view": {
                "enum": ["unassigned", "mine", "waiting_on_us", "waiting_on_customer", "overdue", "at_risk"],
                "type": "string"
              },
              "within_minutes": {
                "default": 60,
                "maximum": 10080,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
