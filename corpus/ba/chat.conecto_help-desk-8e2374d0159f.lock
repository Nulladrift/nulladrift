            "additionalProperties": false,
            "properties": {
              "alert_percent": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "areas": {
                "description": "The areas its keys may work in (account tools always); null for every area.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": ["array", "null"]
              },
              "budget": {
                "description": "hard refuses calls past the budget; soft only warns.",
