        {
          "name": "ticket_reply",
          "title": "Reply to a ticket",
          "description": "Email the requester a reply (internal=false) or add a private note only the team sees (internal=true). A reply goes out from the ticket's support inbox in the same email thread, so the customer's answer comes back to this ticket (inbox picks another support inbox); without one it is Conecto's standard ticket email. template sends a saved reply and applies its status and tags; body, if also given, goes above it. attachments: files of the file store, sent with a reply from a support inbox. status sets the status afterwards (pending = waiting on the customer, resolved = done); without it a reply reopens a resolved ticket. Costs $0.05 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
