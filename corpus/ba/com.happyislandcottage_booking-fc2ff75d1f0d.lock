{
  "lockfileVersion": 2,
  "subjects": {
    "com.happyislandcottage/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://happyislandcottage.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "happyislandcottage-booking",
        "title": "Happy Island Cottage booking",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Happy Island Cottage LLC rents three homes on Anna Maria Island, Florida: Happy Island Cottage (happy-island-cottage, sleeps 6, 7 night minimum); Happy Turtle A (happy-turtle-a, sleeps 5, 3 night minimum); Happy Turtle B (happy-turtle-b, sleeps 4, 3 night minimum). Direct booking is request to book: the owner, a real person, confirms by email with a payment link, and nothing is charged at request. Flow: check_availability, then get_quote, show the guest the total and payment schedule, and call request_booking only after the guest explicitly asks you to send it. Every request reaches the owner, so never send test or speculative requests. Quotes are all in: rent, cleaning, optional pet fee, 7% Florida sales tax plus Manatee surtax and 6% Manatee tourist development tax; no platform fees. Payment: 20% deposit at booking and the balance 45 days before check in, or full payment when check in is 45 days away or less; returning guests with their returning guest code pay no deposit and no pet fee. A request holds nothing. Dates are reserved when the deposit or full payment clears. Check in 3:00 PM, check out 10:00 AM. Cancellation: full refund when cancelled 30 or more days before arrival; inside 30 days the stay is not refundable, except that returning direct guests can cancel anytime and a hurricane warning or mandatory evacuation order for Manatee County covering the stay dates means a full refund whenever cancelled. Bookings run through 2027-12-31; a stay with a later night is refused with BEYOND_HORIZON and lastBookableDate. Calendars are refreshed every 30 minutes. Every refusal returns ok:false with an error code and a one sentence message. Published facts: https://happyislandcottage.com/llms.txt",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Booked date ranges and open windows for the three homes, from the live calendars (refreshed every 30 minutes). Ranges are start to end with end exclusive: a checkout day is open for a new check in. openWindows lists every gap at least as long as that home's minimum stay inside the window you ask for (default today plus 180 days, longest 400). A window flagged clippedAtWindowEnd may continue past your 'to' date. Homes: Happy Island Cottage (happy-island-cottage, sleeps 6, 7 night minimum); Happy Turtle A (happy-turtle-a, sleeps 5, 3 night minimum); Happy Turtle B (happy-turtle-b, sleeps 4, 3 night minimum).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "First day to look at, YYYY-MM-DD (default today)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "property": {
                "description": "happy-island-cottage = Happy Island Cottage, sleeps 6; happy-turtle-a = Happy Turtle A, sleeps 5; happy-turtle-b = Happy Turtle B, sleeps 4",
                "enum": ["happy-island-cottage", "happy-turtle-a", "happy-turtle-b"],
                "type": "string"
              },
              "to": {
                "description": "Last day, exclusive, YYYY-MM-DD (default from plus 180 days)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06816fe54b57a88d4d65f4ae3d04d308a6873f38521a5c1becbe31841e59420c"
        },
        {
          "name": "get_quote",
          "title": "Get an exact quote",
          "description": "Exact all in price for one home and date range, from the same engine as the site's booking form: nightly subtotal, any discount, cleaning fee, pet fee, 7% sales tax plus surtax, 6% tourist development tax, total, and the payment schedule (20% deposit at booking and the balance 45 days before check in, or full payment when check in is 45 days away or less; returning guests with their returning guest code pay no deposit and no pet fee). Errors (each with a one sentence message): UNKNOWN_PROPERTY, BAD_DATES, PAST_DATES, BEYOND_HORIZON (last night after 2027-12-31; carries lastBookableDate), MIN_NIGHTS, UNAVAILABLE, OVER_CAPACITY (carries maxGuests). A request holds nothing. Dates are reserved when the deposit or full payment clears. Check in 3:00 PM, check out 10:00 AM. Read only; nothing is booked or held.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkin": {
                "description": "Check in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "Check out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "code": {
                "description": "Discount code, only if the guest already has one",
                "type": "string"
              },
              "dog": {
                "description": "True if the guest brings a dog (adds the pet fee). The REST endpoint calls this parameter pets; this server accepts pets as an alias.",
                "type": "boolean"
              },
              "guests": {
                "description": "Number of guests, counted against the home's capacity",
                "minimum": 1,
                "type": "integer"
              },
              "property": {
                "description": "happy-island-cottage = Happy Island Cottage, sleeps 6; happy-turtle-a = Happy Turtle A, sleeps 5; happy-turtle-b = Happy Turtle B, sleeps 4",
                "enum": ["happy-island-cottage", "happy-turtle-a", "happy-turtle-b"],
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an exact quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec08d68dfa4aad4f58704f03489a62cb7226746afa8dad5fc02063bdb8ff6488"
        },
        {
          "name": "request_booking",
          "title": "Send a booking request",
          "description": "Sends a booking request to the owner on the guest's behalf, priced by the same engine as get_quote. This is request to book: the owner confirms by email to the guest with a payment link, and nothing is charged now. Call it ONLY after the guest has seen the quote and explicitly asked you to send the request, and set guestApproved to true to confirm that. Every call reaches a real person: never send tests, duplicates or requests the guest has not approved. Errors: as get_quote, plus MISSING_CONTACT and GUEST_APPROVAL_REQUIRED. A request holds nothing. Dates are reserved when the deposit or full payment clears. Cancellation: full refund when cancelled 30 or more days before arrival; inside 30 days the stay is not refundable, except that returning direct guests can cancel anytime and a hurricane warning or mandatory evacuation order for Manatee County covering the stay dates means a full refund whenever cancelled.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checkin": {
                "description": "Check in date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkout": {
                "description": "Check out date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "code": {
                "description": "Discount code, only if the guest already has one",
                "type": "string"
              },
              "dog": {
                "description": "True if the guest brings a dog (adds the pet fee). The REST endpoint calls this parameter pets; this server accepts pets as an alias.",
                "type": "boolean"
              },
              "email": {
                "description": "Guest's email; the owner replies here with the payment link",
                "type": "string"
              },
              "guestApproved": {
                "const": true,
                "description": "Must be true: the guest saw this quote and asked you to send the request",
                "type": "boolean"
              },
              "guests": {
                "description": "Number of guests",
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Guest's full name",
                "type": "string"
              },
              "notes": {
                "description": "Anything the guest wants the owner to know (optional)",
                "type": "string"
              },
              "phone": {
                "description": "Guest's phone (optional)",
                "type": "string"
              },
              "property": {
                "description": "happy-island-cottage = Happy Island Cottage, sleeps 6; happy-turtle-a = Happy Turtle A, sleeps 5; happy-turtle-b = Happy Turtle B, sleeps 4",
                "enum": ["happy-island-cottage", "happy-turtle-a", "happy-turtle-b"],
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "email", "guestApproved", "guests", "name", "property"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a booking request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be843a6d865f842cce912237e17463113586973199cbf8628fd32429a64e9ed6"
        }
      ],
      "digest": "sha256:4d71a195d1d36c73ff813c5d4bab998f66c317fd0fe226b57aec0493353cbbba"
    }
  }
