                      "type": "string"
                    },
                    "type": "object"
                  },
                  "method": {
                    "const": "PUT",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["headers", "method", "url"],
                "type": "object"
              }
            },
            "required": ["curl", "destination_url", "expires_at", "next_steps", "upload_id", "upload_request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request Lightbringer file upload link"
