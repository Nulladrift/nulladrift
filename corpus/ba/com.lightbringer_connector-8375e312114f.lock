          "name": "get_review",
          "title": "Read review in Lightbringer",
          "description": "Returns a review: its metadata, the document under review rendered as markdown, each comment thread with a stable comment ID, and the review discussion feed (standalone comments on the review itself). Attorney redlines are included as suggested changes, each with the original text, the proposed replacement, and an optional rationale. Proposed amendments embedded in the document (agent-drafted changes to a block) are listed in artifact.amendments and in a trailing text block: each carries the baseline text, the proposed text, a redline with <del>/<ins> tags, and a unified patch; the document body itself shows the baseline at the amended block. The document is artifact.markdown in the structured result and is also returned as its own text block. When it cannot be rendered through this API, a short notice takes its place and artifact.status / artifact.reason say so. A country review asks which countries to continue in: a validation review (type ENTRY_PLAN_VALIDATION) for the countries a European patent is validated in, or a regional entry review (type ENTRY_PLAN_REGIONAL) for the countries and regional offices a priority or PCT application is entered in. The document lists the recommended and selected countries, and the validation field carries them, and every code the selection may name, as codes for set_validation_countries.",
