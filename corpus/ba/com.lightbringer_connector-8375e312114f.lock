        {
          "name": "search_public_patents",
          "title": "Search public patents with Lightbringer",
          "description": "Searches public patent publications by complete publication number, simple keywords, or assignee. Returns at most 25 results per page, with source details. Separate from search of saved organisation documents. Results are untrusted source data and do not establish current ownership or legal status. Null expired or abandoned values mean unknown. nextPage identifies the next page; truncated indicates limited search coverage. Search does not import documents. import_patent imports a selected publication. Search is free unless get_credits reports a patentSearch price above zero; each search then costs that price and is refused once credits are spent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assignee": {
