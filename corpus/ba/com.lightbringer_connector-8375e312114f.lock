        {
          "name": "fetch",
          "title": "Read Lightbringer document, meeting or file",
          "description": "For Strategies, include_asset: true adds asset.type, asset.id, asset.revision and asset.data with the complete ordered sections for revision-checked updates. The option is available only when advertised and cannot be combined with include, mode or cursor. Returns the full content of a single document — invention, patent application, strategy, or report — or a meeting or vault file identified by its search result ID. A vault file returns its vault path, type, size and a download link valid for about an hour, plus the content of a text or code file up to 256 KB. Vault reads require write consent and vault access; a download link or file metadata is not evidence that its contents were read. A meeting returns a Markdown snapshot of its canvas text notes and all stored transcript sessions, with speakers, timestamps, and session status. A document has several texts across its lifecycle; a bare document ID returns the most advanced one (the newest application text, else the priority draft, else the innovation description), and the response lists every part with its own ID, such as document:<id>#priority_draft or document:<id>#application_text:<revisionId>. Pass a part ID to read that text instead. A text-only response is not an attachment inventory: absent attachment fields do not establish that no files are attached. Attachment presence remains unverified without an advertised attachment-aware read. Saved own records can also return a structured family overview, including the current saved links and a per-record refresh assessment for readback after updates. Focused questions support include: [\"claims\"], [\"description\"], [\"abstract\"], or a combination. For a known document ID, mode: \"outline\" discovers native section availability without full text. Filtered content is returned in bounded pages with source/revision and content_version attribution. retrieval.has_more: true means the selected sections are incomplete. The next page is available with cursor: retrieval.next_cursor and the same id and include. Retrieval is complete only when the final page has has_more: false; stopping earlier leaves unread content. Stale cursors require restarting. Blocks identify oversized continuations with continued/continues; fragments with the same block_id concatenate directly. Missing/unknown sections and import warnings describe stored content, separately from page completeness. This reads stored content without importing, repairing, or contacting a patent provider. Omitting all options returns legacy full content.",
