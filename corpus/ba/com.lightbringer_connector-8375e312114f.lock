        {
          "name": "list_trade_secrets",
          "title": "List trade secret register in Lightbringer",
          "description": "Lists the trade secret register entries the user can open in the connected Lightbringer organisation, as index rows: reference, title, status and dates. Entry content is not included. Which entries appear follows the user’s register access in Lightbringer, and an empty list means the user can open none. Returns up to 25 entries per page with a cursor for the next page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous page",
                "pattern": "^\\d{1,9}$",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many register entries to return",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "markedAt": {
                      "description": "When the entry was marked as a trade secret (ISO 8601, UTC)",
                      "type": "string"
                    },
                    "reference": {
                      "description": "Register reference, such as TS-0001",
                      "type": "string"
                    },
                    "status": {
                      "anyOf": [
                        {
                          "enum": ["SECRET", "DISCLOSED_UNDER_OBLIGATION", "PUBLISHED", "LOST"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Assessed status; null means not assessed, not that the entry is secret"
                    },
                    "statusChangedAt": {
                      "description": "Date the status last changed (YYYY-MM-DD)",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "Non-revealing title, or null when none has been set",
                      "type": ["string", "null"]
                    },
                    "tradeSecretId": {
                      "description": "Register entry identifier",
                      "type": "string"
                    }
                  },
                  "required": ["markedAt", "reference", "status", "statusChangedAt", "title", "tradeSecretId"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "description": "Cursor for the next page; null on the last page",
