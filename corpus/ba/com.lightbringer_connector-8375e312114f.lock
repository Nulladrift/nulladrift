                "minLength": 1,
                "type": "string"
              },
              "invention_id": {
                "description": "Optional innovation identifier",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "next_cursor": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Opaque continuation cursor; pass unchanged to list_tasks, even when the page is empty."
              },
              "tasks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "created_at": {
                      "type": "string"
                    },
                    "expires_at": {
                      "type": "string"
                    },
                    "invention_id": {
                      "type": "string"
                    },
                    "progress": {
                      "additionalProperties": false,
                      "properties": {
                        "completed": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "total": {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["completed", "total"],
                      "type": "object"
                    },
                    "status": {
                      "enum": ["queued", "running", "succeeded", "partially_succeeded", "failed"],
                      "type": "string"
