                "description": "Saved invention disclosure identifier",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "review_digest": {
                "properties": {
                  "optional_ideas": {
                    "default": [],
                    "items": {
                      "properties": {
                        "sources": {
                          "items": {
                            "properties": {
                              "finding_index": {
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "finding_title": {
                                "description": "Exact original finding title; rejects changed or reordered source indices",
                                "maxLength": 2000,
                                "minLength": 1,
                                "type": "string"
                              },
                              "result_index": {
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              }
                            },
                            "required": ["finding_index", "finding_title", "result_index"],
                            "type": "object"
                          },
                          "maxItems": 20,
                          "minItems": 1,
                          "type": "array"
                        },
                        "summary": {
                          "maxLength": 300,
                          "minLength": 1,
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["sources", "summary", "title"],
                      "type": "object"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "priorities": {
                    "items": {
                      "properties": {
                        "kind": {
                          "enum": ["clarify", "improve"],
                          "type": "string"
                        },
                        "sources": {
                          "items": {
                            "properties": {
                              "finding_index": {
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              },
                              "finding_title": {
                                "description": "Exact original finding title; rejects changed or reordered source indices",
                                "maxLength": 2000,
                                "minLength": 1,
                                "type": "string"
                              },
                              "result_index": {
                                "maximum": 9007199254740991,
                                "minimum": 0,
                                "type": "integer"
                              }
                            },
                            "required": ["finding_index", "finding_title", "result_index"],
                            "type": "object"
                          },
                          "maxItems": 20,
                          "minItems": 1,
                          "type": "array"
                        },
                        "summary": {
                          "maxLength": 300,
                          "minLength": 1,
                          "type": "string"
                        },
                        "title": {
                          "maxLength": 100,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["kind", "sources", "summary", "title"],
                      "type": "object"
                    },
                    "maxItems": 5,
                    "type": "array"
                  }
                },
                "required": ["priorities"],
                "type": "object"
              },
              "task_id": {
                "description": "Optional existing innovation-feedback task for this disclosure",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["invention_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "capture_questions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
