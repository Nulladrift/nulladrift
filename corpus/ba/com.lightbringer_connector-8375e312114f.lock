        {
          "name": "add_discussion_comment",
          "title": "Add review discussion comment in Lightbringer",
          "description": "Posts a standalone comment to the review's discussion feed, visible to the review creator and all participants, and returns the updated discussion. Unlike add_comment, it is not anchored to a passage of the document — it suits general remarks, questions, or status updates about the review as a whole. Eligible review participants receive in-app and email notifications.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "comment": {
                "description": "The comment text",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "review_id": {
                "description": "The review identifier",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["comment", "review_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
