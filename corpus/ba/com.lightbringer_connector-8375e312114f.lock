            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add review discussion comment in Lightbringer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Added review discussion comment in Lightbringer",
            "openai/toolInvocation/invoking": "Adding review discussion comment in Lightbringer…"
          },
          "digest": "sha256:b0742e78e6668c8084ba286dd84c588687953b76388cb5aac661b657754f5920"
