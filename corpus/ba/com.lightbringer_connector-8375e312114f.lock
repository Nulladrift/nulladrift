            "required": ["comment", "comment_id", "review_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "commentId": {
                "type": "string"
              },
              "mentionedUserIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
