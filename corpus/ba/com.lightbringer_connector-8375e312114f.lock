                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["content", "title"],
                          "type": "object"
                        },
                        "maxItems": 50,
                        "minItems": 1,
                        "type": "array"
                      },
                      "title": {
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      }
