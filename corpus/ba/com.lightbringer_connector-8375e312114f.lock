        {
          "name": "request_upload_url",
          "title": "Request Lightbringer file upload link",
          "description": "Requires callable register_upload in this connection before requesting a URL or transferring bytes. Without it, the file cannot be saved at its destination. Starts uploading one file to Lightbringer: an illustration such as a sketch or diagram for a draft invention disclosure (destination kind illustration), which becomes the next drawing in its Illustrations section, or a file for a folder in the organisation's vault (destination kind vault). Requires access to the original file bytes and a way to send an HTTP PUT. Returns a URL valid for 15 minutes, the required method and headers, an example curl command for hosts with a shell, and the destination page for manual upload. The original bytes are transferred with the returned method and headers; register_upload saves the file after a successful PUT. The destination page supports manual upload when the host cannot read or transfer the file. The file itself is uploaded; its contents are not accepted as text. Files up to 25 MB. Illustrations: PNG, JPEG or WebP. Vault: PDF, Office documents (Word, Excel, PowerPoint, OpenDocument, RTF), images (PNG, JPEG, WebP), and text or code files. A vault file name must be free in its folder.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content_length": {
                "description": "The exact file size in bytes",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "destination": {
                "description": "Where the file goes: a draft invention disclosure's Illustrations section, or a vault folder",
                "properties": {
                  "id": {
                    "description": "For illustration: the invention disclosure, as document:<id> from search or its invention_id. Not used for vault.",
                    "pattern": "^(?:document:)?[A-Za-z0-9_-]{1,64}$",
                    "type": "string"
                  },
                  "kind": {
                    "description": "illustration for an image added to an invention disclosure's Illustrations section; vault for a file stored in the organisation's vault",
                    "enum": ["illustration", "vault"],
                    "type": "string"
                  },
                  "path": {
                    "description": "For vault: the folder, such as /Contracts/2026. Missing folders are created; the vault root when omitted. Not used for the other kinds.",
                    "maxLength": 1024,
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "file_name": {
                "description": "The file name, with its extension; the attachment is listed under this name",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content_length", "destination", "file_name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "curl": {
                "type": "string"
              },
              "destination_url": {
                "type": ["string", "null"]
              },
              "expires_at": {
                "type": "string"
              },
              "next_steps": {
                "type": "string"
              },
              "upload_id": {
                "type": "string"
              },
              "upload_request": {
                "additionalProperties": false,
                "properties": {
                  "headers": {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "method": {
                    "const": "PUT",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["headers", "method", "url"],
                "type": "object"
              }
            },
            "required": ["curl", "destination_url", "expires_at", "next_steps", "upload_id", "upload_request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request Lightbringer file upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Requested file upload link from Lightbringer",
            "openai/toolInvocation/invoking": "Requesting a Lightbringer file upload link…"
