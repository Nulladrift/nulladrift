        {
          "name": "update_innovation",
          "title": "Update innovation in Lightbringer",
          "description": "Updates one or more sections of an existing innovation record with new content and reports, per section, whether it was applied. Replaces the specified sections: a section built from an earlier get_innovation read discards any edits saved to it since that read. Text the agent leaves as read keeps its comment threads and pending changes; an applied section also lists any markdown it could not store (dropped), any comment threads whose text the write removed (detached_threads), and whether the write was too large to keep every comment anchor on the edited paragraphs (marks_incomplete); smaller writes keep them. Section text is Markdown: LaTeX in $`…`$ inline or in a ```math fenced block is stored as an equation, \\ce{…} inside those forms as a chemical formula or reaction, and \\chemfig{…} or \\smiles{…} inside them as a chemical structure; bare $…$ and $$…$$ remain literal text. Sections hold horizontal rules and blockquotes as written. In a paragraph the write edits, a chemical structure left in place exactly as read usually keeps its stored forms, such as a molfile or CDXML. One whose \\chemfig{…} or \\smiles{…} changes, one moved elsewhere, and one in a write that reports incomplete mark preservation can keep only what is written. A labelled reference such as \"Equation 2\" becomes plain text. These losses are not reported individually.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "invention_id": {
                "description": "The innovation identifier (invention_id)",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "sections": {
                "additionalProperties": false,
                "description": "Named invention sections and their full replacement text",
                "properties": {
                  "details": {
                    "description": "Full replacement text for the Further details section; an empty string clears the section",
                    "type": "string"
                  },
                  "priorArt": {
                    "description": "Full replacement text for the Prior art section; an empty string clears the section",
                    "type": "string"
                  },
                  "problem": {
                    "description": "Full replacement text for the Problem section; an empty string clears the section",
                    "type": "string"
                  },
                  "shortcomings": {
                    "description": "Full replacement text for the Prior art shortcomings section; an empty string clears the section",
                    "type": "string"
                  },
                  "solution": {
                    "description": "Full replacement text for the Solution section; an empty string clears the section",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["invention_id", "sections"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "additionalProperties": {
                  "additionalProperties": false,
                  "properties": {
                    "applied": {
                      "type": "boolean"
                    },
                    "detached_threads": {
                      "description": "Comment threads whose anchored text this write removed. They still exist but no longer point at any text; re-anchor or resolve them in the app.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "quote": {
                            "description": "The text the thread was anchored on before this write",
                            "type": "string"
                          },
                          "thread_id": {
                            "type": "string"
                          }
                        },
                        "required": ["quote", "thread_id"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "dropped": {
                      "description": "Markdown the write could not store. Empty when everything was kept.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "description": "What was dropped: image, footnote, horizontalRule or unsupported",
                            "type": "string"
                          },
                          "text": {
                            "description": "The markdown as written, shortened when long",
                            "type": "string"
                          }
                        },
                        "required": ["kind", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "error": {
                      "type": ["string", "null"]
                    },
                    "marks_incomplete": {
                      "const": true,
                      "description": "The write was too large to match every edited paragraph to its stored one, so some were matched only roughly: their pending changes stay, but comment anchors on the edited text may have come off; those threads are listed as detached. Smaller writes keep them.",
                      "type": "boolean"
                    }
                  },
                  "required": ["applied"],
                  "type": "object"
                },
                "propertyNames": {
                  "enum": ["problem", "solution", "details", "priorArt", "shortcomings"],
                  "type": "string"
                },
                "type": "object"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update innovation in Lightbringer"
          },
          "behavior": {
