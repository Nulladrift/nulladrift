        {
          "name": "update_asset",
          "title": "Update record in Lightbringer",
          "description": "Updates one asset to the supplied state. Currently supports Strategy title and ordered Markdown sections. The input uses the revision and complete section state returned by fetch with include_asset: true; this read depends on the advertised include_asset parameter. Applies atomically at the supplied revision; conflicts require a fresh fetch and reconciliation. Supplying sections replaces the collection: omitted sections are deleted and new sections receive IDs. Unchanged section IDs and comment anchors are preserved. Edits touching pending review changes fail; detached discussions are reported. Requires write consent and Strategy management rights. Does not publish or run a service. Uncertain outcomes require readback and reconciliation before another write.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asset": {
                "additionalProperties": false,
                "properties": {
                  "changes": {
                    "additionalProperties": false,
                    "properties": {
                      "sections": {
                        "description": "Complete desired ordered section collection. Omitted existing IDs are deleted; array order is saved. Preserve every section to keep. Omit this field to leave all sections unchanged.",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "content": {
                              "description": "Section Markdown; empty clears its body",
                              "maxLength": 500000,
                              "type": "string"
                            },
                            "id": {
                              "description": "Existing section ID from fetch; omit only for a new section",
                              "maxLength": 128,
                              "pattern": "^[a-zA-Z0-9_-]+$",
                              "type": "string"
                            },
                            "title": {
                              "maxLength": 500,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["content", "title"],
                          "type": "object"
                        },
                        "maxItems": 50,
                        "minItems": 1,
                        "type": "array"
                      },
                      "title": {
                        "description": "Omission leaves the title unchanged",
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "id": {
                    "description": "The report:<id> reference returned by search, fetch or create_asset",
                    "maxLength": 71,
                    "pattern": "^report:[a-zA-Z0-9_-]+$",
                    "type": "string"
                  },
                  "revision": {
                    "description": "asset.revision from the latest fetch with include_asset: true; stale revisions fail without writes",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "type": {
                    "const": "strategy",
                    "description": "Currently supports Strategies only",
                    "type": "string"
                  }
                },
                "required": ["changes", "id", "revision", "type"],
                "type": "object"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
