        {
          "name": "list_tasks",
          "title": "List Lightbringer analysis tasks",
          "description": "Lists the current user’s automated tasks in the connected organisation, newest to oldest, optionally for an innovation, with their status. Recovers task IDs after a lost response or conversation. Feedback summaries are recorded states, not a poll of the analyses; feedback tasks and findings expire 30 days after creation. Pagination can return an empty page with a continuation cursor. Professional service requests are separate.",
          "inputSchema": {
