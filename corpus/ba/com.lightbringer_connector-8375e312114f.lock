        {
          "name": "list_tasks",
          "title": "List Lightbringer analysis tasks",
          "description": "Lists the current user’s automated tasks in the connected organisation, newest to oldest, optionally for an innovation, with their status. By default it lists innovation_feedback tasks; with include_conversations, it also lists agent_conversation tasks (journeys from start_journey), and for a running conversation what its agent is doing (activity). Recovers task IDs after a lost response or conversation. Feedback summaries are recorded states, not a poll of the analyses; feedback tasks and findings expire 30 days after creation, conversations do not. Pagination can return an empty page with a continuation cursor. Professional service requests are separate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "Pass next_cursor from the previous list_tasks response unchanged",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "include_conversations": {
                "default": false,
                "description": "true also lists the user’s agent conversations, such as journeys from start_journey, with their status, journey and activity; false lists feedback tasks only",
                "type": "boolean"
              },
              "invention_id": {
                "description": "Optional invention disclosure: document:<id> as search returns it, or its invention_id",
                "pattern": "^(?:document:)?[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "next_cursor": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Opaque continuation cursor; pass unchanged to list_tasks, even when the page is empty."
              },
              "tasks": {
                "items": {
                  "oneOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "created_at": {
                          "type": "string"
                        },
                        "expires_at": {
                          "type": "string"
                        },
                        "invention_id": {
                          "type": "string"
                        },
                        "progress": {
                          "additionalProperties": false,
                          "properties": {
                            "completed": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "total": {
                              "exclusiveMinimum": 0,
                              "maximum": 9007199254740991,
                              "type": "integer"
                            }
                          },
                          "required": ["completed", "total"],
                          "type": "object"
                        },
                        "status": {
                          "enum": ["queued", "running", "succeeded", "partially_succeeded", "failed"],
                          "type": "string"
                        },
                        "task_id": {
                          "type": "string"
                        },
                        "type": {
                          "const": "innovation_feedback",
                          "type": "string"
                        }
                      },
                      "required": ["created_at", "expires_at", "invention_id", "progress", "status", "task_id", "type"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "activity": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "elapsed_seconds": {
                                  "description": "How long the agent has worked on the current turn",
                                  "minimum": 0,
                                  "type": "number"
                                },
                                "steps": {
                                  "description": "The latest steps, from oldest to newest; empty until the agent reports a step",
                                  "items": {
                                    "additionalProperties": false,
                                    "properties": {
                                      "at": {
                                        "description": "When the step began",
                                        "type": "string"
                                      },
                                      "label": {
                                        "description": "The step in the user’s terms, as the Lightbringer chat shows it; document titles in it are data",
                                        "maxLength": 300,
                                        "type": "string"
                                      },
                                      "status": {
                                        "enum": ["running", "succeeded", "failed"],
                                        "type": "string"
                                      },
                                      "tool": {
                                        "maxLength": 100,
                                        "type": "string"
                                      }
                                    },
                                    "required": ["at", "label", "status", "tool"],
                                    "type": "object"
                                  },
                                  "type": "array"
                                }
                              },
                              "required": ["elapsed_seconds", "steps"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "While running, what the agent is doing now; null otherwise. Relay it to the user rather than guessing."
                        },
                        "created_at": {
                          "type": "string"
                        },
                        "expires_at": {
                          "type": "null"
                        },
                        "invention_id": {
                          "type": ["string", "null"]
                        },
                        "journey": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "journey_id": {
                                  "type": "string"
                                },
                                "outcome": {
                                  "anyOf": [
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "coverage": {
                                          "description": "Each source the journey read, and whether it found something, nothing, or could not check",
                                          "items": {
                                            "additionalProperties": false,
                                            "properties": {
                                              "note": {
                                                "type": ["string", "null"]
                                              },
                                              "source": {
                                                "type": "string"
                                              },
                                              "state": {
                                                "enum": ["found", "nothing_found", "couldnt_check"],
                                                "type": "string"
                                              }
                                            },
                                            "required": ["note", "source", "state"],
                                            "type": "object"
                                          },
                                          "type": "array"
                                        },
                                        "done": {
                                          "description": "Each done criterion of the journey, and whether it was met",
                                          "items": {
                                            "additionalProperties": false,
                                            "properties": {
                                              "id": {
                                                "type": "string"
                                              },
                                              "met": {
                                                "type": "boolean"
                                              },
                                              "note": {
                                                "type": ["string", "null"]
                                              }
                                            },
                                            "required": ["id", "met", "note"],
                                            "type": "object"
                                          },
                                          "type": "array"
                                        },
                                        "state": {
                                          "enum": ["reached", "not_reached"],
                                          "type": "string"
                                        },
                                        "summary": {
                                          "type": "string"
                                        }
                                      },
                                      "required": ["coverage", "done", "state", "summary"],
                                      "type": "object"
                                    },
                                    {
                                      "type": "null"
                                    }
                                  ],
                                  "description": "Null until the agent finishes the journey; then whether it reached the outcome. Relay couldnt_check sources to the user."
                                }
                              },
                              "required": ["journey_id", "outcome"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "The journey this conversation follows; null for a conversation that is not a journey."
                        },
                        "name": {
                          "type": "string"
                        },
                        "status": {
                          "enum": ["running", "awaiting_input", "needs_attention", "completed", "cancelled"],
                          "type": "string"
                        },
                        "task_id": {
                          "type": "string"
                        },
                        "type": {
                          "const": "agent_conversation",
                          "type": "string"
                        },
                        "updated_at": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["created_at", "expires_at", "invention_id", "name", "status", "task_id", "type", "updated_at", "url"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              }
            },
            "required": ["next_cursor", "tasks"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Lightbringer analysis tasks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Listed analysis tasks in Lightbringer",
            "openai/toolInvocation/invoking": "Listing Lightbringer analysis tasks…"
          },
          "digest": "sha256:b8b22eb5a9aa384ba9ba4b8b939d6e5fcf5eed0a5f2ed6d95c1448d0dcb8bbd5"
        },
        {
          "name": "list_trade_secrets",
          "title": "List trade secret register in Lightbringer",
          "description": "Lists the trade secret register entries the user can open in the connected Lightbringer organisation, as index rows: reference, title, status and dates. Entry content is not included. Which entries appear follows the user’s register access in Lightbringer, and an empty list means the user can open none. Returns up to 25 entries per page with a cursor for the next page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous page",
                "pattern": "^\\d{1,9}$",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many register entries to return",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "markedAt": {
                      "description": "When the entry was marked as a trade secret (ISO 8601, UTC)",
                      "type": "string"
                    },
                    "reference": {
                      "description": "Register reference, such as TS-0001",
                      "type": "string"
                    },
                    "status": {
                      "anyOf": [
                        {
                          "enum": ["SECRET", "DISCLOSED_UNDER_OBLIGATION", "PUBLISHED", "LOST"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Assessed status; null means not assessed, not that the entry is secret"
                    },
                    "statusChangedAt": {
                      "description": "Date the status last changed (YYYY-MM-DD)",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "Non-revealing title, or null when none has been set",
                      "type": ["string", "null"]
                    },
                    "tradeSecretId": {
                      "description": "Register entry identifier",
                      "type": "string"
                    }
                  },
                  "required": ["markedAt", "reference", "status", "statusChangedAt", "title", "tradeSecretId"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "description": "Cursor for the next page; null on the last page",
                "type": ["string", "null"]
              }
            },
            "required": ["entries", "nextCursor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List trade secret register in Lightbringer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Listed trade secret register in Lightbringer",
            "openai/toolInvocation/invoking": "Listing trade secret register in Lightbringer…"
          },
          "digest": "sha256:712760ace7b76a346a67900fd64a2ee48a10b6ad75f7d0e2ec3927b67c251c1e"
        },
        {
          "name": "refresh_patent_family",
          "title": "Update patent family in Lightbringer",
          "description": "Updates family grouping for one saved own patent, using public patent information and related own patents already saved in the connected organisation. Useful for an apparent missing relationship, an unfinished family update, or a check against newer public information. Imports already attempt family grouping. Related publications are included only after they are imported. Existing relationships are retained, so a refresh cannot remove an incorrect one. Patent text, PDFs, images, legal status and own/competitor classification are unchanged. Competitor records are not supported. Returns counts of added and existing relationships, unresolved or ambiguous matches, and failures, with warnings; it returns no list of family members and does not establish complete family coverage. A null links result means the update did not finish; repeating the refresh attempts it again. A refresh can cost credits (see get_credits) and is refused once credits are spent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentId": {
                "description": "Saved own patent document ID from import_patent, or document:<id> from search",
                "type": "string"
              }
            },
            "required": ["documentId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "childReferences": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "documentId": {
                "type": "string"
              },
              "links": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "addedLinks": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "ambiguousReferences": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "existingLinks": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "failedLinks": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "unresolvedReferences": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["addedLinks", "ambiguousReferences", "existingLinks", "failedLinks", "unresolvedReferences"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "parentReferences": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "publicationNumber": {
                "type": "string"
              },
              "refreshedAt": {
                "type": "string"
              },
              "status": {
                "enum": ["refreshed", "partial"],
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["childReferences", "documentId", "links", "parentReferences", "publicationNumber", "refreshedAt", "status", "url", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update patent family in Lightbringer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Updated patent family in Lightbringer",
            "openai/toolInvocation/invoking": "Updating patent family in Lightbringer…"
          },
          "digest": "sha256:1d3d881a908a9376e2dd0a500dd2202e80be155f082879fd86f3368a014d8187"
        },
        {
          "name": "register_upload",
          "title": "Save uploaded file in Lightbringer",
          "description": "Finishes an upload after the file was PUT to the URL from request_upload_url: checks it and adds it to the destination, as the next drawing in an invention disclosure's Illustrations section or as a file in a vault folder. Until this succeeds the file is not added. If the file has not arrived yet, or Lightbringer asks to try again, the same upload can be registered again. Registering again after success returns the same result. For a vault result, the fetch reference is \"vault_file:\" followed by vault_file.id; the bare ID is not a vault fetch reference. Optional readback depends on the advertised fetch supporting vault files. An unavailable read does not mean the upload failed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "description": {
                "description": "Illustrations only: what the drawing shows, in plain text. Shown under it in the Illustrations section.",
                "maxLength": 4096,
                "type": "string"
              },
              "upload_id": {
                "description": "upload_id from request_upload_url",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["upload_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attachment": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "createdAt": {
                        "type": "string"
                      },
                      "fileName": {
                        "type": "string"
                      },
                      "id": {
                        "type": "string"
                      },
                      "mimeType": {
                        "type": "string"
                      },
                      "ref": {
                        "type": ["string", "null"]
                      },
                      "source": {
                        "type": "string"
                      }
                    },
                    "required": ["createdAt", "fileName", "id", "mimeType", "source"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "destination_url": {
                "type": ["string", "null"]
              },
              "illustration": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "description": {
                        "type": "string"
                      },
                      "id": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "number": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["description", "id", "name", "number"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "size_bytes": {
                "type": ["number", "null"]
              },
              "summary": {
                "type": "string"
              },
              "vault_file": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "description": "Bare vault file ID; fetch accepts vault_file:<id>",
                    "type": "string"
                  },
                  "mimeType": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "path": {
                    "type": "string"
                  },
                  "sizeBytes": {
                    "type": ["number", "null"]
                  }
                },
                "required": ["id", "mimeType", "name", "path", "sizeBytes"],
                "type": "object"
              }
            },
            "required": ["attachment", "destination_url", "illustration", "size_bytes", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save uploaded file in Lightbringer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Lightbringer file registration response returned",
            "openai/toolInvocation/invoking": "Saving uploaded file in Lightbringer…"
          },
          "digest": "sha256:fa0b10b98005144502168c10bbaa1e57cfacf6f729193868f3f3ac7da4431467"
        },
        {
          "name": "reply_to_comment",
          "title": "Reply to review comment in Lightbringer",
          "description": "Adds a reply to an existing comment thread identified by its comment ID, and returns the created reply. Targeted users with document access receive email and in-app mention notifications.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "comment": {
                "description": "The reply text",
                "type": "string"
              },
              "comment_id": {
                "description": "The comment thread identifier",
                "type": "string"
