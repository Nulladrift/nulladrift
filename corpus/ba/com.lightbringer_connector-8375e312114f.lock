        {
          "name": "import_patent",
          "title": "Import patent application into Lightbringer",
          "description": "Imports one public patent publication into the connected organisation, with a complete publication number and explicit purpose. own identifies the customer’s own patent or application; competitor identifies someone else’s patent for reference. Ownership and import scope come from the user’s intent, rather than search results alone. Own-patent imports automatically attempt family grouping with related saved patents, including earlier imports; a separate refresh is not normally needed. Repeated requests return the existing record without updating it. A different purpose or another publication of the same application can produce a conflict identifying the existing record. imported means the record was saved. receipt.status reports complete, partial or incomplete import processing; receipt.warnings explain limitations such as missing PDFs or uncertain family grouping. An incomplete receipt does not mean work is still running; a null receipt means completion details are unavailable. A timed-out request may have saved the record; repeating the same publication and purpose retrieves its saved outcome. Import cannot change an existing record’s purpose or replace its publication. A new import is free unless get_credits reports a patentImport price above zero; it then costs that price and is refused once credits are spent. Returning an existing record is free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "competitorCompanyName": {
                "maxLength": 191,
                "minLength": 1,
                "type": "string"
              },
              "publicationNumber": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9\\s.,/-]+$",
                "type": "string"
              },
              "purpose": {
                "description": "own for the customer’s own portfolio; competitor for someone else’s patent",
                "enum": ["own", "competitor"],
                "type": "string"
              }
            },
            "required": ["publicationNumber", "purpose"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "documentId": {
                "type": "string"
              },
              "publicationNumber": {
                "type": "string"
              },
              "purpose": {
                "enum": ["own", "competitor"],
                "type": "string"
              },
              "receipt": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "abandoned": {
                        "type": ["boolean", "null"]
                      },
                      "expired": {
                        "type": ["boolean", "null"]
                      },
                      "provider": {
                        "type": ["string", "null"]
                      },
                      "retrievedAt": {
                        "type": ["string", "null"]
                      },
                      "sourceUrl": {
                        "type": ["string", "null"]
                      },
                      "status": {
                        "enum": ["incomplete", "complete", "partial"],
                        "type": "string"
                      },
                      "version": {
                        "const": 1,
                        "type": "number"
                      },
                      "warnings": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["abandoned", "expired", "provider", "retrievedAt", "sourceUrl", "status", "version", "warnings"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["imported", "already_imported"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["documentId", "publicationNumber", "purpose", "receipt", "status", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import patent application into Lightbringer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Imported patent application into Lightbringer",
            "openai/toolInvocation/invoking": "Importing patent application into Lightbringer…"
          },
