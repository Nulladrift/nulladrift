          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Replied to review comment in Lightbringer",
            "openai/toolInvocation/invoking": "Replying to review comment in Lightbringer…"
          },
          "digest": "sha256:eb2ff641661a54a7d8fcea457701036adb39079e0a5335ab5219b6355693c9bf"
        },
        {
          "name": "request_patent_preparation",
          "title": "Request Lightbringer patent preparation",
          "description": "Requests Lightbringer patent preparation for an already registered innovation, expressing the user’s decision to pursue patent filing. Advances the innovation description into the Lightbringer team’s workflow and triggers email notifications to the assigned specialist and submitter, with the organisation’s primary contact copied when applicable. Returns whether preparation was newly requested or had already been requested. Email delivery status is not included. Separate from registration; does not itself complete preparation, file a patent or pay for services.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "invention_id": {
                "description": "The invention disclosure: document:<id> as search returns it, or its invention_id",
                "pattern": "^(?:document:)?[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["invention_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "outcome": {
                "description": "Whether patent preparation was newly requested or was already requested; neither confirms completion or filing",
                "enum": ["requested", "already_requested"],
                "type": "string"
              },
              "refNum": {
                "type": ["string", "null"]
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "outcome", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request Lightbringer patent preparation"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Lightbringer preparation request sent",
