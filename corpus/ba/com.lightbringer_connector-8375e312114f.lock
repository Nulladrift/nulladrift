        {
          "name": "invite_members",
          "title": "Invite colleagues in Lightbringer",
          "description": "Invites up to 20 people into the connected Lightbringer organisation and gives them access to up to five innovations or published strategies, sending each person an invitation email that cannot be recalled. Requires the user’s approval of the exact list of names, email addresses, roles and documents before sending. Email addresses come from the user or a source the user pointed to, not from guesses or name-based patterns. Roles: inventor sees only documents shared with them; inventor_moderator sees all of the organisation’s documents and strategies. Only published strategies can be shared; a draft strategy needs publishing beforehand, which requires the user’s explicit request. Existing members get access to the documents instead of an invitation, and a pending invitation keeps its role and is re-sent with the documents. The email identifies documents by reference number only, so the user may want to message the people directly with context. Returns a per-person status: invited, already_invited, already_member or refused with a reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documents": {
                "description": "The innovations and published strategies to give the people access to",
                "items": {
                  "properties": {
                    "id": {
                      "description": "The innovation or Strategy identifier",
                      "maxLength": 64,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9_-]+$",
                      "type": "string"
                    },
                    "type": {
                      "description": "innovation or strategy",
                      "enum": ["innovation", "strategy"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "type"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "people": {
                "description": "The approved people to invite",
                "items": {
                  "properties": {
                    "email": {
                      "description": "The email address the user supplied or approved for this person",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "name": {
                      "description": "The person’s name as the user approved it: letters, numbers, spaces, apostrophes, hyphens, commas and periods",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "role": {
                      "description": "inventor: sees only shared documents; inventor_moderator: sees all organisation documents and strategies",
                      "enum": ["inventor", "inventor_moderator"],
                      "type": "string"
                    }
                  },
                  "required": ["email", "name", "role"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["documents", "people"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "already_invited": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "already_member": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "invited": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "refused": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "unknown": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["already_invited", "already_member", "invited", "refused", "unknown"],
                "type": "object"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "failedDocuments": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "maxLength": 191,
                            "type": "string"
                          },
                          "type": {
                            "enum": ["innovation", "strategy"],
                            "type": "string"
                          }
                        },
                        "required": ["id", "type"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "reason": {
                      "enum": ["self", "role_not_allowed", "pending_invitation_role", "invalid_email", "failed"],
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["invited", "already_invited", "already_member", "refused", "unknown"],
                      "type": "string"
                    },
                    "warning": {
                      "enum": ["email_not_sent"],
                      "type": "string"
                    }
                  },
                  "required": ["email", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["counts", "results", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Invite colleagues in Lightbringer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
