        {
          "name": "start_innovation_feedback",
          "title": "Start Lightbringer innovation analysis",
          "description": "Starts automated analysis of a registered innovation description across clarity, problem framing, completeness, or all focus areas. Returns one task_id, status, progress, available findings and per-analysis errors. Findings contain readable title/description fields; findings_error means findings are unavailable, not absent. Queued or running tasks continue through get_task_status with the same task_id. Succeeded, partially_succeeded and failed are terminal. Ending the wait does not cancel analysis. Separate from novelty assessment, patent search, FTO, attorney review and patent preparation requests. Where the organisation is charged in credits, the clarity analysis costs credits. Once they are spent, a clarity-only request is refused; with other focus areas, clarity is reported as not started while the others still run.",
          "inputSchema": {
