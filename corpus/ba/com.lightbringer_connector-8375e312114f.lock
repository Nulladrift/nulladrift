        {
          "name": "send_developer_feedback",
          "title": "Send feedback to Lightbringer",
          "description": "Sends feedback the user explicitly wants to share about Lightbringer tools or customer needs the available assistance could not resolve: broken or surprising tool behaviour, missing capabilities, friction, or an unresolved customer problem. For unmet needs, describe the intended outcome, help provided and remaining obstacle using confirmed evidence, not feature proposals or solution suggestions. Do not infer a service-wide gap from missing access, evidence or a limitation of this conversation. Requires the user’s explicit consent to send the proposed report after seeing its text, category and optional tool name and being informed of the recipient. Requires mcp:write permission. Reports go to a human-reviewed Lightbringer engineering Slack channel. Only the report text, category and optional tool name are sent; no account or client metadata is attached. The destination channel is not visible to the signed-in user. Reports contain only the issue or unresolved need the user agreed to share, without conversation transcripts, document text, invention details, or other confidential material. Delivery records feedback only; it does not request professional work or promise a response or resolution.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "The kind of report: bug for broken or surprising behaviour, tool_request for a missing tool capability, general for unresolved customer needs or other feedback. A missing-capability report can describe the problem without proposing a solution",
                "enum": ["bug", "tool_request", "general"],
                "type": "string"
              },
              "feedback": {
                "description": "The report text approved by the user for sending: a concise description of the issue or unresolved need. For unmet needs include the desired outcome, help provided and remaining problem; include timing, consequences and current alternatives only when known and safe to share. Keep unknowns explicit. Describe the problem without solution suggestions, without conversation transcripts, document text, invention details, or unrelated task context",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "tool_name": {
                "description": "The specific tool the report concerns, when there is one",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["category", "feedback"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "note": {
                "type": "string"
              },
              "status": {
                "enum": ["delivered", "not_delivered"],
                "type": "string"
              }
            },
            "required": ["note", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send feedback to Lightbringer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Finished feedback request in Lightbringer",
            "openai/toolInvocation/invoking": "Sending feedback to Lightbringer…"
          },
          "digest": "sha256:f880553d0d592e054c4c06c2d5ea7723edf96d3816eefd29cacdc1995ccc86e6"
