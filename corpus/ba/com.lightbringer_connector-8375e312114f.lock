                              "type": "boolean"
                            },
                            "unmatchedReferenceCount": {
                              "anyOf": [
                                {
                                  "maximum": 9007199254740991,
                                  "minimum": 0,
                                  "type": "integer"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["ambiguousReferenceCount", "assessment", "eligible", "lastRefreshedAt", "missingLinkCount", "references", "referencesAvailable", "referencesTruncated", "unmatchedReferenceCount"],
                          "type": "object"
                        },
                        "regions": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "scope": {
                          "const": "accessible_saved_records",
                          "type": "string"
                        }
                      },
                      "required": ["applicationCount", "coverage", "groupingKey", "members", "membersTruncated", "priorityDate", "priorityDateSource", "recordedPublicationCount", "refresh", "regions", "scope"],
                      "type": "object"
                    },
                    "id": {
                      "type": "string"
                    },
                    "metadata": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "part": {
