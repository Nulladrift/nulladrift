        {
          "name": "comment",
          "title": "Comment on a record in Lightbringer",
          "description": "Starts a comment thread on a quoted passage of an invention disclosure, a patent draft (priority application draft or application text), a commentable report or a Strategy, or replies to a thread. Changes no record text. Mentioned users with access are notified. Every request posts a new comment, so a repeated request posts it twice. A new thread cannot overlap an open thread; it takes over a resolved thread's highlight, and that thread remains, detached. Returns a status; an ambiguous passage returns each occurrence with a ready selector, and a missing one returns hints.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "add starts a thread; reply adds to an existing one",
                "enum": ["add", "reply"],
                "type": "string"
              },
              "block": {
                "description": "add: the paragraph the passage is in, as an ambiguous answer names it in a selector",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "comment": {
                "description": "The comment text",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "prefix": {
                "description": "add: text immediately before the passage, in the same paragraph",
                "maxLength": 500,
                "type": "string"
              },
              "quoted_text": {
                "description": "add: the passage to anchor the thread on, copied from the record text as fetch with include_asset renders it. It is matched against the text as stored when the comment is added",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "description": "add: the section the passage is in: for a disclosure problem, solution, details, priorArt or shortcomings; for any other record, a key of its asset data.sections (a report names a section body by its id and its title <id>_title; a Strategy names them the same way, with the id of an entry in its data.sections)",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "suffix": {
                "description": "add: text immediately after the passage, in the same paragraph",
                "maxLength": 500,
                "type": "string"
              },
              "target": {
                "description": "The record’s asset type and id, as fetch with include_asset returns them",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "maxLength": 73,
                        "pattern": "^document:[a-zA-Z0-9_-]+$",
                        "type": "string"
                      },
                      "type": {
                        "const": "invention_disclosure",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "pattern": "^document:[a-zA-Z0-9_-]{1,64}#priority_draft$",
                        "type": "string"
                      },
                      "type": {
                        "const": "priority_application_draft",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "pattern": "^document:[a-zA-Z0-9_-]{1,64}#application_text:[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": {
                        "const": "application_text",
                        "type": "string"
                      }
