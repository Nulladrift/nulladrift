        {
          "name": "update_asset",
          "title": "Update record in Lightbringer",
          "description": "Updates one asset to the supplied state. Currently supports Strategy title and ordered Markdown sections. The input uses the revision and complete section state returned by fetch with include_asset: true; this read depends on the advertised include_asset parameter. Applies atomically at the supplied revision; conflicts require a fresh fetch and reconciliation. Supplying sections replaces the collection: omitted sections are deleted and new sections receive IDs. Unchanged section IDs and comment anchors are preserved. Edits touching pending review changes fail; detached discussions are reported. Requires write consent and Strategy management rights. Does not publish or run a service. Uncertain outcomes require readback and reconciliation before another write.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asset": {
                "additionalProperties": false,
                "properties": {
                  "changes": {
                    "additionalProperties": false,
                    "properties": {
                      "sections": {
                        "description": "Complete desired ordered section collection. Omitted existing IDs are deleted; array order is saved. Preserve every section to keep. Omit this field to leave all sections unchanged.",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "content": {
                              "description": "Section Markdown; empty clears its body",
                              "maxLength": 500000,
                              "type": "string"
                            },
                            "id": {
                              "description": "Existing section ID from fetch; omit only for a new section",
                              "maxLength": 128,
                              "pattern": "^[a-zA-Z0-9_-]+$",
                              "type": "string"
                            },
                            "title": {
                              "maxLength": 500,
                              "minLength": 1,
                              "type": "string"
                            }
                          },
                          "required": ["content", "title"],
                          "type": "object"
                        },
                        "maxItems": 50,
                        "minItems": 1,
                        "type": "array"
                      },
                      "title": {
                        "description": "Omission leaves the title unchanged",
                        "maxLength": 500,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "id": {
                    "description": "The report:<id> reference returned by search, fetch or create_asset",
                    "maxLength": 71,
                    "pattern": "^report:[a-zA-Z0-9_-]+$",
                    "type": "string"
                  },
                  "revision": {
                    "description": "asset.revision from the latest fetch with include_asset: true; stale revisions fail without writes",
                    "maxLength": 128,
                    "minLength": 1,
                    "type": "string"
                  },
                  "type": {
                    "const": "strategy",
                    "description": "Currently supports Strategies only",
                    "type": "string"
                  }
                },
                "required": ["changes", "id", "revision", "type"],
                "type": "object"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "asset": {
                "additionalProperties": {},
                "properties": {
                  "id": {
                    "description": "The report:<id> reference returned by search, fetch or create_asset",
                    "maxLength": 71,
                    "pattern": "^report:[a-zA-Z0-9_-]+$",
                    "type": "string"
                  },
                  "revision": {
                    "type": "string"
                  },
                  "status": {
                    "anyOf": [
                      {
                        "enum": ["DRAFT", "PUBLISHED"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "title": {
                    "type": "string"
                  },
                  "type": {
                    "const": "strategy",
                    "description": "Currently supports Strategies only",
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["id", "revision", "title", "type", "url"],
                "type": "object"
              },
              "orphaned_discussion_ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update record in Lightbringer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Updated record in Lightbringer",
            "openai/toolInvocation/invoking": "Updating record in Lightbringer…"
          },
          "digest": "sha256:ae2beb0b981a9cad8215b051911e49c06d784a861d57df077e6554b659a263aa"
        },
        {
          "name": "update_comment_thread",
          "title": "Update a Lightbringer comment thread",
          "description": "Resolves or reopens a comment thread on an invention disclosure, a patent draft, a commentable report or a Strategy. Changes nothing else. Anyone who may comment on the record may do either; no one is notified. A thread already in the requested state is reported as unchanged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "resolved": {
                "description": "true resolves the thread; false reopens it",
                "type": "boolean"
              },
              "target": {
                "description": "The record’s asset type and id, as fetch with include_asset returns them",
                "oneOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "maxLength": 73,
                        "pattern": "^document:[a-zA-Z0-9_-]+$",
                        "type": "string"
                      },
                      "type": {
                        "const": "invention_disclosure",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "pattern": "^document:[a-zA-Z0-9_-]{1,64}#priority_draft$",
                        "type": "string"
                      },
                      "type": {
                        "const": "priority_application_draft",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "pattern": "^document:[a-zA-Z0-9_-]{1,64}#application_text:[a-zA-Z0-9_-]{1,64}$",
                        "type": "string"
                      },
                      "type": {
                        "const": "application_text",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "maxLength": 71,
                        "pattern": "^report:[a-zA-Z0-9_-]+$",
                        "type": "string"
                      },
                      "type": {
                        "const": "report",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "maxLength": 71,
                        "pattern": "^report:[a-zA-Z0-9_-]+$",
                        "type": "string"
                      },
                      "type": {
                        "const": "prosecution_report",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "id": {
                        "maxLength": 71,
                        "pattern": "^report:[a-zA-Z0-9_-]+$",
                        "type": "string"
                      },
                      "type": {
                        "const": "strategy",
                        "type": "string"
                      }
                    },
                    "required": ["id", "type"],
                    "type": "object"
                  }
                ]
              },
              "thread_id": {
                "description": "The thread identifier",
                "type": "string"
              }
            },
            "required": ["resolved", "target", "thread_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "commentId": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "hint": {
                "type": "string"
              },
              "instructions": {
                "type": "string"
              },
              "status": {
                "enum": ["created", "replied", "resolved", "reopened", "deleted", "ambiguous", "not_found", "overlapping", "refused", "unsupported"],
                "type": "string"
              },
              "threadId": {
                "type": "string"
              },
              "unchanged": {
                "type": "boolean"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a Lightbringer comment thread"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Finished comment thread update in Lightbringer",
            "openai/toolInvocation/invoking": "Updating comment thread in Lightbringer…"
          },
          "digest": "sha256:9bfef185a4928f7bd621ebfe65e9be5fce28e6e6bb28340935deb090c650a3ce"
        },
        {
          "name": "update_company_context",
          "title": "Update company context in Lightbringer",
          "description": "Updates selected profile fields or shared assistant notes in the connected organisation. Requires moderator rights and write consent. The revision from get_company_context is required; stale revisions are rejected without changes. Omitted fields remain unchanged; notes replaces the complete shared notes text and empty strings clear fields. applicant_name updates the legal applicant setting and names an unnamed workspace; it does not rename an established workspace. Returns the saved context and new revision. Does not create or publish a Strategy.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "revision": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "updates": {
                "additionalProperties": false,
                "properties": {
                  "applicant_name": {
                    "description": "Legal applicant name; empty clears it",
                    "maxLength": 512,
                    "type": "string"
                  },
                  "country": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "notes": {
                    "description": "Complete replacement for shared Markdown notes; preserve unrelated notes",
                    "maxLength": 50000,
                    "type": "string"
                  },
                  "state": {
                    "maxLength": 128,
                    "type": "string"
                  },
                  "website": {
                    "description": "HTTP(S) website without credentials; empty clears it",
                    "maxLength": 2048,
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["revision", "updates"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "can_update": {
                "type": "boolean"
              },
              "notes": {
                "type": "string"
              },
              "organisation": {
                "additionalProperties": {},
                "properties": {
                  "applicant_name": {
                    "type": ["string", "null"]
                  },
                  "country": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "state": {
                    "type": ["string", "null"]
                  },
                  "website": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["applicant_name", "country", "name", "state", "website"],
                "type": "object"
              },
              "revision": {
                "type": "string"
              }
            },
            "required": ["can_update", "notes", "organisation", "revision"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update company context in Lightbringer"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Updated company context in Lightbringer",
            "openai/toolInvocation/invoking": "Updating company context in Lightbringer…"
          },
