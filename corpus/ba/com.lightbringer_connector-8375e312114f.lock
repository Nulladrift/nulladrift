        {
          "name": "search",
          "title": "Search Lightbringer organisation",
          "description": "Searches the Lightbringer organisation's documents (inventions, patent applications, and reports and Strategies), meetings and the files in its vault. The \"meeting\" category filters by title, reference, or indexed transcript/canvas text. Meeting result IDs resolve through fetch to canvas and transcript text. The \"vault\" category lists vault files (vault_file:<id>), matching every query word against the file name or folder path; file contents are not searched. Omitting query lists the whole vault the user can see. Vault results need a connection that can also write. Returns matching results, each with an ID, title, and summary. A document result also lists its parts: the texts it has accumulated across its lifecycle (innovation description, priority draft, application text revisions), each with an ID that fetch accepts. Supports cursor-based pagination; omitting query lists accessible records in the selected category. Saved own application and patent results can include a structured family overview: accessible members, jurisdictions, recorded statuses, priority provenance and coverage limits. Its refresh assessment compares stored references with saved links without calling a provider or changing records. Document content is indexed asynchronously, so a recently created or edited document can take a short while to become searchable; an empty result reflects the current index and does not by itself establish that a matching document is absent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "enum": ["application", "patent", "innovation", "competitor_application", "report", "strategy", "meeting", "vault"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor from a previous search response",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search query",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hasMore": {
                "type": "boolean"
              },
              "nextCursor": {
                "type": ["string", "null"]
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "family": {
                      "additionalProperties": false,
                      "properties": {
                        "applicationCount": {
                          "description": "Accessible saved application records in this group, including the selected record",
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "coverage": {
                          "const": "unverified",
                          "type": "string"
                        },
                        "groupingKey": {
                          "description": "Representative accessible document key for grouping saved records; can change with links or access, not a global family ID",
                          "type": "string"
                        },
                        "members": {
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "applicationNumber": {
                                "type": ["string", "null"]
                              },
                              "applicationType": {
                                "type": "string"
                              },
                              "documentId": {
                                "type": "string"
                              },
                              "filingDate": {
                                "type": ["string", "null"]
                              },
                              "publicationNumber": {
                                "type": ["string", "null"]
                              },
                              "recordedStatus": {
                                "type": ["string", "null"]
                              },
                              "refNum": {
                                "type": ["string", "null"]
                              },
                              "region": {
                                "type": ["string", "null"]
                              },
                              "relationship": {
                                "enum": ["self", "parent", "child", "other_related"],
                                "type": "string"
                              },
                              "title": {
                                "type": ["string", "null"]
                              }
                            },
                            "required": ["applicationNumber", "applicationType", "documentId", "filingDate", "publicationNumber", "recordedStatus", "refNum", "region", "relationship", "title"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "membersTruncated": {
                          "type": "boolean"
                        },
                        "priorityDate": {
                          "type": ["string", "null"]
                        },
                        "priorityDateSource": {
                          "enum": ["imported", "earliest_saved_priority_filing", "unknown"],
                          "type": "string"
