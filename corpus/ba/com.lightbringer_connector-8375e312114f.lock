        {
          "name": "show_invention_capture",
          "title": "Lightbringer invention capture",
          "description": "Presents a saved invention as a compact record link, optionally with the findings of an existing automated feedback task. Without task_id, returns the saved-record link; with task_id, the component delivers the review findings and unresolved analyses. Reads the saved disclosure and checks task/invention binding and current access. Task refresh can persist collected results. Does not create or edit the invention, start analysis, spend analysis credits, or request patent preparation. Capture questions are assistant-authored follow-ups grounded in exact saved_quote passages; they are not separately persisted. Optional review_digest supplies up to five merged priorities and separate optional ideas, citing successful, available, non-discarded findings by result_index, finding_index and exact finding_title. The result retains original findings; the digest is assistant-authored synthesis. Analysis revision matching, patentability and attorney approval are not established. Successful app display delivers the link and findings without duplicate chat output. Tool success alone does not prove rendering. Text/link fallback is available for unavailable, denied or failed display, or an explicit text request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "capture_questions": {
                "default": [],
                "items": {
                  "properties": {
                    "question": {
                      "maxLength": 500,
                      "minLength": 1,
                      "type": "string"
                    },
                    "saved_quote": {
                      "description": "Exact supporting passage in the saved disclosure, including an explicit unknown when applicable",
                      "maxLength": 2000,
                      "minLength": 12,
                      "type": "string"
                    },
                    "why_it_matters": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["question", "saved_quote", "why_it_matters"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
