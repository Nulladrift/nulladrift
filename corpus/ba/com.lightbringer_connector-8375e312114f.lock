        {
          "name": "delete_asset",
          "title": "Delete strategy from Lightbringer",
          "description": "Permanently deletes one asset explicitly selected by the user. Currently supports Strategies only. Requires write consent and Strategy management rights. Does not delete other asset types or withdraw patent-service requests.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asset": {
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "description": "The report:<id> reference returned by search, fetch or create_asset",
