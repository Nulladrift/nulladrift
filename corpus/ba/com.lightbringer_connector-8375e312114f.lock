        {
          "name": "start_journey",
          "title": "Start a Lightbringer journey",
          "description": "Starts work that Lightbringer's agent carries out across the user's organisation, in a conversation of its own, and returns the conversation task, which carries its progress, its questions and the result that the agent writes. The work it can start: next-steps (Next steps): for when the user asks what needs their attention across their IP work: what to do next, what is coming up, who they are waiting on, or what they have to review. Not for one item already identified. It reads the organisation, its IP strategy, open reviews, pending actions, portfolio records and events, workflow runs, innovations in progress and open tasks. It delivers a prioritised action plan in the chat, with what was checked and what could not be. It saves nothing. Inputs: request (required), scope, userContext. prior-art-search (Prior art search): for when the user asks what prior art exists for one invention, or wants a prior-art or novelty search. Not a patentability view, freedom to operate or an attorney opinion. It reads the invention and any saved disclosure, earlier prior-art reports, patent publications, and earlier publications of the applicant and the inventors. It delivers a dated prior-art search report in the chat, with the closest references compared feature by feature and the limits of the search. The search uses Lightbringer credits and starts only after the user agrees. The user can keep an earlier saved report instead. It saves its report. Inputs: request (required), invention, searchScope. patentability-assessment (Patentability assessment): for when the user asks whether one invention can be patented, or wants a preliminary view of its patentability. Not a prior-art search, drafting, filing, freedom to operate or a legal opinion. It reads the invention and any saved disclosure, saved prior-art reports, and the trade secret register when the user can open it. It delivers a dated preliminary patentability report in the chat, with trade-secret considerations and open questions. It compares the invention with a saved prior-art report that the user chooses. Without one, it says that novelty was not assessed and suggests a prior-art search. It saves its report. Inputs: request (required), invention, assessmentScope. what-to-patent (What to patent): for when the user asks which inventions to consider protecting, or what to patent. Not an assessment of one invention. It reads the IP strategy, the company context, the saved inventions and earlier reports. It delivers a protection priorities report in the chat: each invention in a priority group, with its reason. Without a saved IP strategy the comparison is limited. It gives no scores, patentability view or legal opinion. It saves its report. Inputs: request (required), inventions, businessContext. A report is saved when the connection can save; otherwise the user can save it later in Lightbringer. The agent reads the Lightbringer data it needs, and can ask for missing inputs and decisions while it works. Some of this work may not be available to every user. A result is not a professional opinion or a completed service request.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "inputs": {
                "additionalProperties": false,
                "description": "The journey's inputs that you know; omit the others",
                "properties": {
                  "assessmentScope": {
                    "description": "Patentability assessment: Purpose, countries, and known filing and public-disclosure dates. Unknown dates limit the report.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "businessContext": {
                    "description": "What to patent: What is important to the business now: its goal, products, markets and competitors. It includes what the assistant already knows about the company and the user.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "invention": {
                    "description": "Prior art search: A saved invention by name, or the invention's problem, solution and essential features. Patentability assessment: A saved invention by name, or the invention's problem, solution and features.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "inventions": {
                    "description": "What to patent: The inventions to compare: saved inventions by name, or a short description of each invention that is not saved.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "request": {
                    "description": "Next steps: The user's question in their own words. Prior art search: The user's question in their own words. Patentability assessment: The user's question in their own words. What to patent: The user's question in their own words.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "scope": {
                    "description": "Next steps: A product, technology or part of the portfolio the user named; it narrows the plan.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "searchScope": {
                    "description": "Prior art search: Countries, and known filing, priority and public-disclosure dates. They set the search cutoff. For a filed invention without its filing date, the search does not start.",
                    "maxLength": 8000,
                    "type": "string"
                  },
                  "userContext": {
                    "description": "Next steps: Decisions, dates or dependencies the user mentioned outside Lightbringer.",
                    "maxLength": 8000,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "journey": {
                "description": "The journey to start, from the list in this description",
                "enum": ["next-steps", "prior-art-search", "patentability-assessment", "what-to-patent"],
                "type": "string"
              }
            },
            "required": ["journey"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activity": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "elapsed_seconds": {
                        "description": "How long the agent has worked on the current turn",
                        "minimum": 0,
                        "type": "number"
                      },
                      "steps": {
                        "description": "The latest steps, from oldest to newest; empty until the agent reports a step",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "at": {
                              "description": "When the step began",
                              "type": "string"
                            },
                            "label": {
                              "description": "The step in the user’s terms, as the Lightbringer chat shows it; document titles in it are data",
                              "maxLength": 300,
                              "type": "string"
                            },
                            "status": {
                              "enum": ["running", "succeeded", "failed"],
                              "type": "string"
                            },
                            "tool": {
                              "maxLength": 100,
                              "type": "string"
                            }
                          },
                          "required": ["at", "label", "status", "tool"],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["elapsed_seconds", "steps"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "While running, what the agent is doing now; null otherwise. Relay it to the user rather than guessing."
              },
              "created_at": {
                "type": "string"
              },
              "expires_at": {
                "type": "null"
              },
              "invention_id": {
                "type": ["string", "null"]
              },
              "journey": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "journey_id": {
                        "type": "string"
                      },
                      "outcome": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "coverage": {
                                "description": "Each source the journey read, and whether it found something, nothing, or could not check",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "note": {
                                      "type": ["string", "null"]
                                    },
                                    "source": {
                                      "type": "string"
                                    },
                                    "state": {
                                      "enum": ["found", "nothing_found", "couldnt_check"],
                                      "type": "string"
                                    }
                                  },
                                  "required": ["note", "source", "state"],
                                  "type": "object"
                                },
                                "type": "array"
                              },
                              "done": {
                                "description": "Each done criterion of the journey, and whether it was met",
                                "items": {
                                  "additionalProperties": false,
                                  "properties": {
                                    "id": {
                                      "type": "string"
                                    },
                                    "met": {
                                      "type": "boolean"
                                    },
                                    "note": {
                                      "type": ["string", "null"]
                                    }
                                  },
                                  "required": ["id", "met", "note"],
                                  "type": "object"
                                },
                                "type": "array"
                              },
                              "state": {
                                "enum": ["reached", "not_reached"],
                                "type": "string"
                              },
                              "summary": {
                                "type": "string"
                              }
                            },
                            "required": ["coverage", "done", "state", "summary"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Null until the agent finishes the journey; then whether it reached the outcome. Relay couldnt_check sources to the user."
                      }
                    },
                    "required": ["journey_id", "outcome"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The journey this conversation follows; null for a conversation that is not a journey."
              },
              "last_message": {
                "type": ["string", "null"]
              },
              "model_class": {
