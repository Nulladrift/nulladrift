        {
          "name": "import_patent",
          "title": "Import patent application into Lightbringer",
          "description": "Imports one public patent publication into the connected organisation, with a complete publication number and explicit purpose. own is the customer’s own patent or application; competitor is someone else’s, for reference. The purpose comes from the user’s intent, not from search results alone. Own-patent imports attempt family grouping, so a separate refresh is not normally needed. A repeated request returns the existing record unchanged; a different purpose or another publication of the same application can give a conflict that names the existing record. imported means the record was saved. receipt.status reports complete, partial or incomplete processing and receipt.warnings explain limits such as a missing PDF; a null receipt means the details are unavailable. A timed-out request may have saved the record; repeating it retrieves the saved outcome. A new import can cost credits (see get_credits) and is refused once credits are spent. Returning an existing record is free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "competitorCompanyName": {
                "maxLength": 191,
                "minLength": 1,
                "type": "string"
              },
              "publicationNumber": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9\\s.,/-]+$",
                "type": "string"
              },
              "purpose": {
                "description": "own for the customer’s own portfolio; competitor for someone else’s patent",
                "enum": ["own", "competitor"],
                "type": "string"
              }
            },
            "required": ["publicationNumber", "purpose"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "creditsCharged": {
                "description": "Credits this request charged; 0 when the import was free or returned an existing record, even if an earlier request was charged for it",
                "type": "number"
              },
              "documentId": {
                "type": "string"
              },
              "publicationNumber": {
                "type": "string"
              },
              "purpose": {
                "enum": ["own", "competitor"],
                "type": "string"
              },
              "receipt": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "abandoned": {
                        "type": ["boolean", "null"]
                      },
                      "expired": {
                        "type": ["boolean", "null"]
                      },
                      "provider": {
                        "type": ["string", "null"]
                      },
                      "retrievedAt": {
                        "type": ["string", "null"]
                      },
                      "sourceUrl": {
                        "type": ["string", "null"]
                      },
                      "status": {
                        "enum": ["incomplete", "complete", "partial"],
                        "type": "string"
                      },
                      "version": {
                        "const": 1,
                        "type": "number"
                      },
                      "warnings": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["abandoned", "expired", "provider", "retrievedAt", "sourceUrl", "status", "version", "warnings"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "status": {
                "enum": ["imported", "already_imported"],
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["creditsCharged", "documentId", "publicationNumber", "purpose", "receipt", "status", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Import patent application into Lightbringer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Imported patent application into Lightbringer",
            "openai/toolInvocation/invoking": "Importing patent application into Lightbringer…"
          },
