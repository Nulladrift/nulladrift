        {
          "name": "refresh_patent_family",
          "title": "Update patent family in Lightbringer",
          "description": "Updates family grouping for one saved own patent using public patent information and related own patents already saved in the connected organisation. Useful for an apparent missing relationship, an unfinished family update, or a requested check against newer public information. Imports already attempt family grouping automatically; routine refresh after import is unnecessary. Related publications must be imported separately before they can be included. Repeating import_patent only retrieves its saved outcome. Existing family relationships are retained, so refresh cannot remove incorrect relationships. Patent text, PDFs, images, legal status and own/competitor classification are unchanged. Competitor records are not supported. Returns counts of added and existing relationships, unresolved or ambiguous matches, and failures, with warnings. It does not return a list of family members. A null links result means the update did not finish; repeating the refresh attempts it again. Results do not establish complete family coverage. Where the organisation is charged in credits, a refresh costs a patent search and is refused once credits are spent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentId": {
                "description": "Saved own patent document ID from import_patent, or document:<id> from search",
                "type": "string"
              }
            },
            "required": ["documentId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "childReferences": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "documentId": {
                "type": "string"
              },
              "links": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "addedLinks": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "ambiguousReferences": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "existingLinks": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "failedLinks": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "unresolvedReferences": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["addedLinks", "ambiguousReferences", "existingLinks", "failedLinks", "unresolvedReferences"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "parentReferences": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "publicationNumber": {
                "type": "string"
              },
              "refreshedAt": {
                "type": "string"
              },
              "status": {
                "enum": ["refreshed", "partial"],
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["childReferences", "documentId", "links", "parentReferences", "publicationNumber", "refreshedAt", "status", "url", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update patent family in Lightbringer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Updated patent family in Lightbringer",
            "openai/toolInvocation/invoking": "Updating patent family in Lightbringer…"
