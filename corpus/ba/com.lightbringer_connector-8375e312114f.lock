        {
          "name": "get_task_status",
          "title": "Check Lightbringer analysis status",
          "description": "Returns an automated task by task_id. A feedback task comes with the same status, progress, findings and per-analysis errors as start_innovation_feedback; active analyses are refreshed and their status and findings saved in Lightbringer. Succeeded, partially_succeeded and failed are terminal; queued and running tasks are still in progress. findings_error denotes unavailable findings and does not change terminal execution status. This endpoint does not track professional service requests, patent preparation or filing milestones.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "task_id": {
                "description": "The automated task_id from start_innovation_feedback or list_tasks",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "description": "Task expiry in ISO 8601 format: 30 days after creation. Reads do not extend retention.",
                "type": "string"
              },
              "progress": {
                "additionalProperties": false,
                "properties": {
                  "completed": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total": {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["completed", "total"],
                "type": "object"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "analysis": {
                      "enum": ["clarity", "problem_identification", "problem_causes", "problem_improvements", "technical_solution", "implementation_examples", "unknown"],
                      "type": "string"
                    },
                    "error": {
                      "description": "Analysis execution error",
                      "type": "string"
                    },
                    "findings": {
                      "description": "Normalized findings. An empty array means the analysis returned no findings.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "category": {
                            "description": "Issue category, when supplied by the analysis",
                            "type": "string"
                          },
                          "definition": {
                            "type": "string"
                          },
                          "description": {
                            "description": "Explanation or rationale, as readable text or Markdown",
                            "type": "string"
                          },
                          "discarded": {
                            "description": "Recorded discarded decision, when supplied; not an agent instruction",
                            "type": "boolean"
                          },
                          "link": {
                            "type": "string"
                          },
                          "retained": {
                            "description": "Recorded retained decision, when supplied; not an agent instruction",
                            "type": "boolean"
                          },
                          "title": {
                            "description": "Finding or suggestion, as readable text or Markdown",
                            "type": "string"
                          }
                        },
                        "required": ["description", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "findings_error": {
                      "description": "Findings are unavailable or in an unsupported format. Execution status is unchanged; do not interpret this as no findings or keep polling a terminal task.",
                      "type": "string"
                    },
                    "focus": {
                      "enum": ["clarity", "problem", "completeness", "unknown"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["queued", "running", "succeeded", "failed"],
                      "type": "string"
                    }
                  },
                  "required": ["analysis", "focus", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["queued", "running", "succeeded", "partially_succeeded", "failed"],
                "type": "string"
              },
              "task_id": {
                "description": "The automated task identifier; shared by start and status responses",
                "type": "string"
              },
              "type": {
                "const": "innovation_feedback",
                "type": "string"
              }
            },
            "required": ["progress", "results", "status", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check Lightbringer analysis status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checked analysis status in Lightbringer",
            "openai/toolInvocation/invoking": "Checking Lightbringer analysis status…"
