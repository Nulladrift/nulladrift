              }
            ]
          },
          "digest": "sha256:f62bb481f7859d9b614743f2d652d2b474c97cf1de7f4fb08b85216cac2055ca"
        },
        {
          "name": "get_free_placement_guidance",
          "title": "Get free placement guidance",
          "description": "Get free curated placement guidance. Provide the business type, stage, market, language and goal using the listed choices. Provide public_mcp for an MCP server or in_person for a local service.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "business_type": {
                      "const": "mcp"
                    }
                  },
                  "required": ["business_type"]
                },
                "then": {
                  "required": ["public_mcp"]
                }
              },
              {
                "if": {
                  "properties": {
                    "business_type": {
                      "const": "local_service"
                    }
                  },
                  "required": ["business_type"]
                },
                "then": {
                  "required": ["in_person"]
                }
              }
            ],
            "examples": [
              {
                "business_stage": "public",
                "business_type": "saas",
                "goal": "feedback",
                "language": "en",
                "market": "global"
              },
              {
                "business_stage": "public",
                "business_type": "local_service",
                "goal": "visibility",
                "in_person": true,
                "language": "ru",
                "market": "ru"
              },
              {
                "business_stage": "public",
                "business_type": "mcp",
                "goal": "discovery",
                "language": "en",
                "market": "global",
                "public_mcp": true
              }
            ],
            "properties": {
              "business_stage": {
                "enum": ["idea", "building", "public"],
                "type": "string"
              },
              "business_type": {
                "enum": ["saas", "local_service", "online_service", "mcp", "other"],
                "type": "string"
              },
              "goal": {
                "enum": ["visibility", "feedback", "discovery"],
                "type": "string"
              },
              "in_person": {
                "description": "Required for a local_service. Confirm whether the business meets customers in person.",
                "type": "boolean"
              },
              "language": {
                "enum": ["ru", "en", "es"],
                "type": "string"
              },
              "market": {
                "enum": ["ru", "global"],
                "type": "string"
              },
              "public_mcp": {
                "description": "Required for a business of type mcp. Confirm whether the server is public and usable.",
                "type": "boolean"
              }
            },
            "required": ["business_stage", "business_type", "goal", "language", "market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
