      "serverInfo": {
        "name": "qonvert",
        "title": "Qonvert · AI marketing adviser",
        "version": "1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Qonvert is the project assistant. Use tools/list to discover named integrations and scenarios. Call get_qonvert_connect_guide for public setup and example questions. After connecting to MCP, call qonvert_connect or the requested named entry tool to discover project sources, consent and the next useful source. For a saved source missing access, request its scope in the MCP client. Use the same MCP endpoint when switching assistants. For a capacity offer show the price and ask whether to continue. For questions about a specific business entity, use read_project_entity_context. Pass earlier user questions for follow-ups and use the returned coverage and exact page evidence. For Google Ads in chat, use get_setup_requirements for Google Ads creation and optimization. Reuse an eligible account or open begin_google_ads_connection for Google OAuth. Use the saved site, ask for the URL or account if missing or ambiguous, and continue in chat. Confirm measured website facts with the user, then prepare and activate each scenario. Use prepare_campaign_brief and submit_google_ads_brief for native research and the resulting card. For an Adsy campaign request, use adsy_campaign_request with the supplied URL or saved site. Reuse its request_id and show the returned review link when it asks for confirmation. Use analyze_google_ads_offer_page for a distinct landing page. Show prepare_google_ads_action before confirm_google_ads_action. Wait for explicit approval for this exact preview in the conversation. A PAUSED creation and enabling it need separate approvals. Use dismiss_google_ads_card if the user declines, or get_google_ads_action_status to verify execution. Connect and grant the requested scope when prompted. Ask the user to review and confirm the exact action; OAuth only grants access. For either Google Ads or Yandex Direct, use get_campaign_requirements and prepare_campaign_brief; Yandex requires its typed brief and an active scenario instance. Use get_setup_requirements, prepare_scenario_activation and get_prepared_scenario for supported scenario setup, and get_custom_source_requirements, prepare_custom_source and get_custom_source_status for supported source setup. Confirm each prepared setup or campaign brief through the supported confirmation tool; otherwise confirm in Qonvert. For custom scenarios use workflow_create_draft. For email, use create_email_template or update_email_template, then open Qonvert to choose and review the template and separately approve any send. After saving a brief, use get_campaign_brief_status with its brief_id for the current review or task link. Starting or spending requires separate human approval.",
      "tools": [
        {
          "name": "adsy_campaign_request",
          "title": "Adsy campaign request",
          "description": "Ask Qonvert to start or continue a Google Ads request using a website URL or the saved project site. Reuse the same request_id on each follow-up; provide only confirmed answers. Saves a brief for native approval; never runs research or ads. Additional consent required: qonvert.campaigns, qonvert.read",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "additionalProperties": false,
                "description": "Only confirmed answers; instance_id identifies the selected account scenario.",
                "properties": {
                  "country_code": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "end_date": {
                    "format": "date",
                    "type": "string"
                  },
                  "eu_political_advertising": {
                    "enum": ["CONTAINS_EU_POLITICAL_ADVERTISING", "DOES_NOT_CONTAIN_EU_POLITICAL_ADVERTISING"],
                    "type": "string"
                  },
                  "geography": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "instance_id": {
                    "format": "uuid",
                    "type": "string"
                  },
                  "language": {
                    "enum": ["en", "ru", "es"],
                    "type": "string"
                  },
                  "monthly_budget_minor": {
                    "description": "Monthly budget in the selected account currency's minor units.",
                    "maximum": 100000000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "offering": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "start_date": {
                    "format": "date",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "provider": {
                "enum": ["google_ads"],
                "type": "string"
              },
              "request_id": {
                "description": "Reuse for every continuation of this request.",
                "format": "uuid",
                "type": "string"
              },
              "url": {
                "description": "Exact HTTPS page; omit for the saved project site.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
