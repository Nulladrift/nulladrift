{
  "lockfileVersion": 2,
  "subjects": {
    "ai.qonvert/qonvert": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.qonvert.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "qonvert",
        "title": "Qonvert · AI marketing adviser",
        "version": "1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Qonvert is the project assistant. For a request to set up Google Ads, use adsy_campaign_request with the exact page URL if supplied, or omit it to use the saved project site. Reuse one request_id for all continuations; provide only confirmed answers and ask for missing inputs. Connect and grant the requested scope when prompted. Ask the user to review and confirm in Qonvert; links or tool calls never approve research or provider actions. For either Google Ads or Yandex Direct, use get_campaign_requirements and prepare_campaign_brief; Yandex requires its typed brief and an active scenario instance. Use get_setup_requirements, prepare_scenario_activation and get_prepared_scenario for supported scenario setup, and get_custom_source_requirements, prepare_custom_source and get_custom_source_status for supported source setup. Confirm each prepared setup or campaign brief in Qonvert. For custom scenarios use workflow_create_draft. For email, use create_email_template or update_email_template, then open Qonvert to choose and review the template and separately approve any send. After saving a brief, use get_campaign_brief_status with its brief_id for the current review or task link. Starting or spending requires separate human approval.",
      "tools": [
        {
          "name": "adsy_campaign_request",
          "title": "Adsy campaign request",
          "description": "Ask Qonvert to start or continue a Google Ads request using a website URL or the saved project site. Reuse the same request_id on each follow-up; provide only confirmed answers. Saves a brief for native approval; never runs research or ads. Additional consent required: qonvert.campaigns, qonvert.read",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "additionalProperties": false,
                "description": "Only confirmed answers; instance_id identifies the selected account scenario.",
                "properties": {
                  "country_code": {
                    "pattern": "^[A-Z]{2}$",
                    "type": "string"
                  },
                  "end_date": {
                    "format": "date",
                    "type": "string"
                  },
                  "eu_political_advertising": {
                    "enum": ["CONTAINS_EU_POLITICAL_ADVERTISING", "DOES_NOT_CONTAIN_EU_POLITICAL_ADVERTISING"],
                    "type": "string"
                  },
                  "geography": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "instance_id": {
                    "format": "uuid",
                    "type": "string"
                  },
                  "language": {
                    "enum": ["en", "ru", "es"],
                    "type": "string"
                  },
                  "monthly_budget_minor": {
                    "description": "Monthly budget in the selected account currency's minor units.",
                    "maximum": 100000000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "offering": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "start_date": {
                    "format": "date",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "provider": {
                "enum": ["google_ads"],
                "type": "string"
              },
              "request_id": {
                "description": "Reuse for every continuation of this request.",
                "format": "uuid",
                "type": "string"
              },
              "url": {
                "description": "Exact HTTPS page; omit for the saved project site.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["request_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "needsConsent": true,
            "requiredScopes": ["qonvert.campaigns", "qonvert.read"],
            "securitySchemes": [
              {
                "scopes": ["qonvert.campaigns", "qonvert.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:064f24878a1cd3a3d1d0726386439aa1117457afd6945ee9967120472ff405b3"
        },
        {
          "name": "check_marketing_tracking_url",
          "title": "Check campaign URL tags",
          "description": "Inspect tracking parameter names in one supplied HTTP(S) URL without opening it. Works without a Qonvert account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["en", "ru"],
                "title": "Language",
                "type": "string"
              },
              "url": {
                "description": "Example link with any sensitive values removed.",
                "maxLength": 2048,
                "minLength": 1,
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["language", "url"],
            "title": "TrackingURL",
            "type": "object"
          },
