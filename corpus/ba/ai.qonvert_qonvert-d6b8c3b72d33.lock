            ]
          },
          "digest": "sha256:a8600abf199bc7a4821c8f5caa43512c2157a03a01cc9a57a75f74708229c6a7"
        },
        {
          "name": "get_marketing_measurement_readiness",
          "title": "Get marketing measurement readiness",
          "description": "Check authorized marketing sources and observed click-ID gaps. Optionally inspect supplied URL tags without visiting those URLs. Never changes tracking or budgets. Additional consent required: qonvert.read",
          "inputSchema": {
            "$defs": {
              "ObservedVisit": {
                "additionalProperties": false,
                "properties": {
                  "analytics_consent": {
                    "anyOf": [
                      {
                        "enum": ["granted", "denied"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Analytics Consent"
                  },
                  "analytics_fields": {
                    "anyOf": [
                      {
                        "items": {
                          "enum": ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "gclid", "gbraid", "wbraid", "yclid"],
                          "type": "string"
                        },
                        "maxItems": 9,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Analytics Fields"
                  },
                  "analytics_provider": {
                    "anyOf": [
                      {
                        "enum": ["ga4", "metrika"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Analytics Provider"
                  },
                  "clicked_url": {
                    "maxLength": 2048,
                    "minLength": 1,
                    "title": "Clicked Url",
                    "type": "string"
                  },
                  "event": {
                    "anyOf": [
                      {
                        "enum": ["signup", "paid_checkout"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Event"
                  },
                  "events_for_single_action": {
                    "anyOf": [
                      {
                        "maximum": 20,
                        "minimum": 0,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Events For Single Action"
                  },
                  "landing_url": {
                    "anyOf": [
                      {
                        "maxLength": 2048,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Landing Url"
                  }
                },
                "required": ["clicked_url"],
                "title": "ObservedVisit",
                "type": "object"
              }
            },
            "additionalProperties": false,
            "properties": {
              "observed_visits": {
                "items": {
                  "$ref": "#/$defs/ObservedVisit"
                },
                "maxItems": 3,
                "title": "Observed Visits",
                "type": "array"
              },
              "sample_urls": {
                "items": {
                  "maxLength": 2048,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "title": "Sample Urls",
                "type": "array"
              }
            },
            "title": "ReadinessInput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "needsConsent": true,
            "requiredScopes": ["qonvert.read"],
            "securitySchemes": [
              {
                "scopes": ["qonvert.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:15debe241215239030a235c362f1bf935aad9ecb320a082c31abce4561e2cb8b"
        },
