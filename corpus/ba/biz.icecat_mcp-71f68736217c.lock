      "serverInfo": {
        "name": "Icecat Product Content",
        "version": "1.0.5"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Product tools take an optional `locale` in the language_COUNTRY form, e.g. it_IT. Pass it only when the user's request explicitly mentions a language, market or locale for the content (e.g. \"in German\", \"for the Italian market\", \"nl_BE\"); the language the request is written in is not a mention. A country name or code alone is a market, not a locale: pass the language_COUNTRY of that market. Pass a mentioned locale even if it may be unavailable: the refusal names the reason. Otherwise omit it: the connection default is used. account_locales returns the account's locales.",
      "tools": [
        {
          "name": "account_locales",
          "description": "Returns the locales this account is authorised to use. Call before requesting content in a specific locale.",
          "inputSchema": {
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "locales": {
                "description": "Locales authorised for this account, and only those",
                "items": {
                  "properties": {
                    "locale": {
                      "description": "Locale code to send on a request",
                      "type": "string"
                    }
                  },
                  "required": ["locale"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["locales"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7da92e87091eff0d5c0ffe7e8698897144b6998370160d46b79f53ba33d49cc"
