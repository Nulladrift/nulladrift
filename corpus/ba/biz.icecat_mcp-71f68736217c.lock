        {
          "name": "product_360_view",
          "description": "Returns 360° view images.",
          "inputSchema": {
            "properties": {
              "brand_name": {
                "description": "Brand name. Required only with product_code. Ignored if GTIN is present.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "gtin": {
                "description": "Global Trade Item Number. Overrides brand_name + product_code. Use GTIN exclusively when valid.",
                "maxLength": 14,
                "minLength": 12,
                "type": "string"
              },
              "locale": {
                "description": "Locale for this request, in the language_COUNTRY form. Applies to this request only. Omit to use the connection default. Available locales come from account_locales.",
                "type": "string"
              },
              "product_code": {
                "description": "Manufacturer product code. Required only with brand_name. Ignored if GTIN is present.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "360_views": {
                "description": "List of 360° view sets. Each set is an independent 360 rotation with its own ordered frames.",
                "items": {
                  "properties": {
                    "images": {
                      "description": "Ordered list of frames for this 360 view",
                      "items": {
                        "properties": {
                          "order": {
                            "description": "Frame order for correct 360 view rendering",
                            "type": "integer"
                          },
                          "url": {
                            "description": "Image URL",
                            "type": "string"
                          }
                        },
                        "required": ["order", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["images"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["360_views"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
