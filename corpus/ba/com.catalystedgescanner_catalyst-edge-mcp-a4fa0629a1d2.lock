      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_convergence_picks",
          "description": "Today's top scored catalyst picks from the Catalyst Edge convergence model. Optional filters: conviction, sector. Free tier returns the top 3.",
          "inputSchema": {
            "properties": {
              "conviction": {
                "description": "filter by conviction level",
                "enum": ["MAXIMUM", "HIGH", "ELEVATED", "WATCH"],
                "type": "string"
              },
              "limit": {
                "description": "max picks (default 25; free tier capped at 3)",
                "type": "integer"
              },
              "sector": {
                "description": "filter by sector (substring match)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9d9f966c024f35090699aa62dba2ba03c9c5e0587fde18430f433e52a844d73d"
        },
        {
          "name": "get_options_context",
          "description": "Live options context for a ticker via Tradier — nearest expiration, ATM call/put prices, straddle cost. Use to choose an options strategy.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "ticker symbol",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ccb1707b7e1e233621937a5dbaf298c4c798beddd93ca0d18d1b6c5c8858c91a"
        },
        {
          "name": "get_price_forecast",
          "description": "Kronos price forecast for a ticker (or the whole scored board), as a probability: p_up is the share of sampled price paths closing higher over the horizon, with a p10-p90 return band. Price history only — independent of the catalyst signal layers.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "max rows when no ticker is given (default 25)",
                "type": "integer"
              },
              "ticker": {
                "description": "ticker symbol; omit for the full board",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ae9863916ddc5e7c992511e7b25fb4a6e790267cad1fd464a84a2d9d525275d4"
        },
        {
          "name": "get_sector_lean",
          "description": "Orphan-aggregated sector lean — the directional signal each sector is showing, from ~480 aggregated data spokes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fde05f63a55d379f5f935e4bf90269bd0fa44390f4084ea3088acf2b9777a38"
        },
        {
          "name": "get_thesis",
          "description": "Plain-language thesis for a ticker — quantitative read, catalysts, risks, bear case. Covers the top convergence picks.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "ticker symbol",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
