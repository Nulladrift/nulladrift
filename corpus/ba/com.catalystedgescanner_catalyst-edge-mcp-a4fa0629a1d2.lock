        {
          "name": "get_ticker_signal",
          "description": "Full convergence breakdown for one ticker — every non-zero signal layer and its points, plus the score and conviction.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "ticker symbol",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:848e2ad70e00cc47b15346db885c55a0c56bd37fe470af53f9d60e871e27ab5f"
        },
        {
          "name": "get_track_record",
          "description": "Historical hit-rate and alpha of Catalyst Edge pick lists — the evidence an agent uses to weight the signal. Optional: list_name filter.",
          "inputSchema": {
            "properties": {
              "list_name": {
                "description": "filter to one pick list (substring match)",
                "type": "string"
              }
            },
            "type": "object"
          },
