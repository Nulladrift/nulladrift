{
  "lockfileVersion": 2,
  "subjects": {
    "ai.maxcv/resume": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://maxcv.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "maxcv",
        "title": "MaxCV — Resume Tailor & ATS Optimizer",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MaxCV assesses and tailors supplied CV text against a job posting. Use score_cv for a source-only assessment; tailor_cv generates and assesses actual before/after documents. Do not add facts; AI can make mistakes, so have the user review every change. Scores are not employer ATS scores or hiring probabilities. Text only: no saved-account access, PDF export or application submission. Per-network limits: 10 assessments/hour and 2 tailorings/day; global limits also apply.",
      "tools": [
        {
          "name": "score_cv",
          "title": "Assess CV against a job",
          "description": "Assess the supplied CV only (assessmentKind=source_only), without generating a document or predicted after score. With v2b, method=offer-phrase-coverage-v1 measures exact positive coverage of frozen phrases copied from offer requirements and duties, with phrase counts and matched/missing lists; an empty inventory scores zero. phraseCount (not requirementCount) is the denominator; the inventory is extracted once per exact offer text and reused (assessment.inventoryHash); nested phrases count once. Other engines retain method=jev-probability-v1 with semantic per-requirement probabilities. Neither is an employer ATS score or hiring probability. Use tailor_cv for actual before/after documents.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "Relevant CV or resume text, at least 80 characters after trimming. Omit contact details and sensitive identifiers.",
                "maxLength": 20000,
                "minLength": 80,
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting as plain text, at least 80 characters after trimming. The CV and job posting together must fit in 20000 UTF-8 bytes when encoded as JSON, including JSON syntax and escapes.",
                "maxLength": 20000,
                "minLength": 80,
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1079ab83d5f7addbe284d6cd9e0951635b81aee927a1d1c70113dd84560e301"
        },
        {
          "name": "tailor_cv",
          "title": "Tailor CV to a job",
          "description": "Tailor a supplied CV/resume to a specific job posting. A successful tailoring returns the actual tailored CV and before/after assessments, plus role-fit notes, interview preparation and a cover letter when available. A role mismatch or a finding of possible added or omitted facts can prevent delivery of a tailored CV. AI can make mistakes; review every change. Text input/output only; does not access saved accounts, export PDFs or submit applications. Limited to 2 calls per day per network.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "Relevant CV or resume text, at least 80 characters after trimming. Omit contact details and sensitive identifiers.",
                "maxLength": 20000,
                "minLength": 80,
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting as plain text, at least 80 characters after trimming. The CV and job posting together must fit in 20000 UTF-8 bytes when encoded as JSON, including JSON syntax and escapes.",
                "maxLength": 20000,
                "minLength": 80,
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9ee680f62c0411b6a473e8f4e8bef7fc88450c4d6b3fa1af9dd2828066f6f7e"
        }
      ],
      "digest": "sha256:c81da9262df234009b28a37cec7da8bb19621122e9eee3955b1195a40fc9b308"
    }
  }
