  "subjects": {
    "ai.maxcv/resume": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://maxcv.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "maxcv",
        "title": "MaxCV — Resume Tailor & ATS Optimizer",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MaxCV tailors an existing CV to a specific job posting. Call score_cv to assess the supplied CV only; tailor_cv generates and separately scores actual before/after documents (rules and automated checks are designed to prevent added facts; AI can make mistakes, so have the user review every change). For more tailorings and PDF export use the web app at https://maxcv.ai.",
      "tools": [
        {
          "name": "score_cv",
          "description": "Assess the supplied CV only (assessmentKind=source_only), without generating a document or predicted after score. With v2b, method=offer-phrase-coverage-v1 measures exact positive coverage of frozen phrases copied from offer requirements and duties, with phrase counts and matched/missing lists; an empty inventory scores zero. phraseCount (not requirementCount) is the denominator; the inventory is extracted once per exact offer text and reused (assessment.inventoryHash); nested phrases count once. Other engines retain method=jev-probability-v1 with semantic per-requirement probabilities. Neither is an employer ATS score or hiring probability. Use tailor_cv for actual before/after documents.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "The full CV/resume as plain text, at most 20000 characters.",
                "maxLength": 20000,
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting text, at most 20000 characters (CV and job together at most 20000 UTF-8 bytes).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e956a8064aff4816f8462f94580adce258a5c9f7403402b33865e26bd91d15ee"
        },
        {
          "name": "tailor_cv",
          "description": "Tailor a CV/resume to a specific job posting: rewrites the CV with the posting's ATS keywords (rules and automated checks are designed to prevent added facts; AI can make mistakes), and returns the tailored CV, a match score, role-fit notes, interview prep and a cover letter (null when it could not be generated). Trial is rate-limited per network; for more tailorings and PDF export use the MaxCV web app.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "The full CV/resume as plain text, at most 20000 characters.",
                "maxLength": 20000,
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting text, at most 20000 characters (CV and job together at most 20000 UTF-8 bytes).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c9db105533b99877ca40d7130c583d2d0a2986a74101b0dab7157b1f33818dac"
        }
      ],
      "digest": "sha256:67aadd88f94fbd040a9f5149cb6413a2c4b5dba66ec7b3501d3475d3fbace525"
    }
  }
