      },
      "transport": {
        "type": "http",
        "url": "https://maxcv.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "maxcv",
        "title": "MaxCV — Resume Tailor & ATS Optimizer",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MaxCV tailors an existing CV to a specific job posting. Call score_cv to assess the supplied CV only; tailor_cv generates and separately scores actual before/after documents (rules and automated checks are designed to prevent added facts; AI can make mistakes, so have the user review every change). For more tailorings and PDF export use the web app at https://maxcv.ai.",
      "tools": [
        {
          "name": "score_cv",
          "description": "Assess only the supplied CV against atomic job requirements using Jev evidence probabilities. Returns one source score, assessmentKind=source_only, method=jev-probability-v1 and per-requirement met/not_met/unknown probabilities, confidence and actual model version. Every requirement stays in the denominator; the score is 100 times mean probabilityMet. No tailored CV or after score is generated. Run tailor_cv for actual document before/after assessment.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "The full CV/resume as plain text.",
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting text.",
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d1baa6f9f93ea604517ac14dea32c57774b1197c6478a1e2e2e7c8d18db2d7d"
        },
        {
          "name": "tailor_cv",
          "description": "Tailor a CV/resume to a specific job posting: rewrites the CV with the posting's ATS keywords (rules and automated checks are designed to prevent added facts; AI can make mistakes), and returns the tailored CV, a match score, role-fit notes, interview prep and a cover letter (null when it could not be generated). Trial is rate-limited per network; for more tailorings and PDF export use the MaxCV web app.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "The full CV/resume as plain text.",
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting text.",
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:417453eb72b97af3de2ee878069da645968a4a59e19e4112cfc6f522db4ae58d"
        }
