  "subjects": {
    "ai.maxcv/resume": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://maxcv.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "maxcv",
        "title": "MaxCV — Resume Tailor & ATS Optimizer",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MaxCV assesses and tailors supplied CV text against a job posting. Use score_cv for a source-only assessment; tailor_cv generates and assesses actual before/after documents. Do not add facts; AI can make mistakes, so have the user review every change. Scores are not employer ATS scores or hiring probabilities. Text only: no saved-account access, PDF export or application submission. Per-network limits: 10 assessments/hour and 2 tailorings/day; global limits also apply.",
      "tools": [
        {
          "name": "score_cv",
          "title": "Assess CV against a job",
          "description": "Assess the supplied CV only (assessmentKind=source_only), without generating a document or predicted after score. With v2b, method=offer-phrase-coverage-v1 measures exact positive coverage of frozen phrases copied from offer requirements and duties, with phrase counts and matched/missing lists; an empty inventory scores zero. phraseCount (not requirementCount) is the denominator; the inventory is extracted once per exact offer text and reused (assessment.inventoryHash); nested phrases count once. Other engines retain method=jev-probability-v1 with semantic per-requirement probabilities. Neither is an employer ATS score or hiring probability. Use tailor_cv for actual before/after documents.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "The full CV/resume as plain text, at most 20000 characters.",
                "maxLength": 20000,
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting text, at most 20000 characters (CV and job together at most 20000 UTF-8 bytes).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae38d2ce6803c573e89127984465efba9870af50aab47e509bd9627c7b3f3c01"
        },
        {
          "name": "tailor_cv",
          "title": "Tailor CV to a job",
          "description": "Tailor a supplied CV/resume to a specific job posting. Returns the actual tailored CV, before/after assessments, role-fit notes, interview preparation and a cover letter when available (otherwise null). Rules and automated checks are designed to prevent added facts; AI can make mistakes, so review every change. Text input/output only; does not access saved accounts, export PDFs or submit applications. Limited to 2 calls per day per network.",
          "inputSchema": {
            "properties": {
              "cvText": {
                "description": "The full CV/resume as plain text, at most 20000 characters.",
                "maxLength": 20000,
                "type": "string"
              },
              "jobDescription": {
                "description": "The job posting text, at most 20000 characters (CV and job together at most 20000 UTF-8 bytes).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["cvText", "jobDescription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c933c9c28d7a2bc22bfea0c84502975d4e5c19e711be5932d74fe00f666f3b1"
        }
      ],
      "digest": "sha256:e23cb85d6bc2202689aa1a46a9360c4474c9112005b33bd9ab9af5d8ef384c0b"
    }
  }
