        {
          "name": "biz_detail",
          "title": "사업자 정보 조회",
          "description": "Look up general status information of a Korean business by its 10-digit business registration number. 사업자등록번호로 해당 사업자의 일반 현황 정보(대표자, 주소, 직원수, 설립일, 업종, 업태, 종목, 연락처, 사업자상태, 과세유형 등)를 조회합니다. 법인은 financial_info=Y 로 기업재무정보(요약재무제표·재무상태표·손익계산서)를 추가 요금 없이 함께 받을 수 있습니다. [호출당 50포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "biz_no": {
                "description": "사업자등록번호 (숫자 10자리, 하이픈 제외, 예: 1234567890)",
                "type": "string"
              },
              "financial_info": {
                "description": "Y 이면 법인의 기업재무정보(최근 3개 사업연도 요약재무제표, 최근 사업연도 재무상태표·손익계산서)를 기업재무정보 필드에 함께 반환합니다. 법인만 제공되며 추가 요금은 없습니다. 재무정보가 없으면 기업재무정보.조회결과=N 과 사유코드를 반환합니다.",
                "enum": ["Y", "N"],
                "type": "string"
              }
            },
            "required": ["biz_no"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0f71a4a6e0dd7505d1c42d77fd964bd8809d7846d7cb8553f2e63398b01bbf9"
        },
        {
          "name": "bldrgst",
          "title": "건축물대장 조회",
          "description": "Look up a Korean building register by parcel number or lot address. PNU 또는 시군구·법정동·번지로 표제부·총괄표제부·기본개요·층별개요·전유부·전유공용면적·주택가격·오수정화시설·부속지번·지역지구구역을 조회합니다. PNU(19자리) 또는 sigunguCd·bjdongCd 중 하나가 필요합니다. [호출당 30포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bjdongCd": {
                "description": "법정동코드 5자리 (pnu 가 없을 때)",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              },
              "bun": {
                "description": "본번. 숫자만 보내면 4자리로 채웁니다.",
                "type": "string"
              },
              "dongNm": {
                "description": "동 이름. floor·expos·area·price 전용",
                "type": "string"
              },
              "endDate": {
                "description": "대장 생성일 범위 끝. title·recap 전용. 연·월만 보내면 그 달 마지막 날로 맞춥니다.",
                "type": "string"
              },
              "flrNo": {
                "description": "층 번호. area 전용. 지하는 음수",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hoNm": {
                "description": "호 이름. floor·expos·area·price 전용",
                "type": "string"
              },
              "ji": {
                "description": "부번 (기본 0000)",
                "type": "string"
              },
              "numOfRows": {
                "description": "한 쪽 건수 (기본 20, 최대 100)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "pageNo": {
                "description": "쪽 번호 (기본 1)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "platGbCd": {
                "description": "0 대지(기본), 1 산. 대지·산·임야 표기도 받습니다.",
                "enum": ["0", "1"],
                "type": "string"
              },
              "pnu": {
                "description": "필지고유번호 19자리. 주면 번지 항목은 무시합니다.",
                "pattern": "^[0-9]{19}$",
                "type": "string"
              },
              "sigunguCd": {
                "description": "시군구코드 5자리 (pnu 가 없을 때)",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              },
              "startDate": {
                "description": "대장 생성일 범위 시작. title·recap 전용. 2024 / 2024-06 / 20240101",
                "type": "string"
              },
              "type": {
                "description": "대장 종류 (기본 title)",
                "enum": ["title", "recap", "basis", "floor", "expos", "area", "price", "wclf", "jibun", "district"],
                "type": "string"
              }
            },
            "type": "object"
          },
