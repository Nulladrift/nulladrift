                "type": "string"
              },
              "indstrytyCd": {
                "description": "업종코드 (선택)",
                "type": "string"
              },
              "numOfRows": {
                "description": "페이지당 결과 수 (기본 10, 최대 999)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "pageNo": {
                "description": "페이지 번호 (기본 1)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "startDate": {
                "description": "조회 시작일 (YYYYMMDD 또는 YYYYMMDDHHMM)",
