                "minLength": 1,
                "pattern": "^[A-Za-z0-9]*[0-9][A-Za-z0-9]*(?![\\s\\S])",
                "type": "string"
              },
              "bizType": {
                "description": "업무구분 (물품·공사·용역·외자, 기본 용역)",
