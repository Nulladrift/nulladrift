          "description": "Build a Korean company snapshot: profile with listing status and age, recent 90-day disclosure events and risk flags. 기업 개황에 최근 90일 공시 이벤트 요약과 위험 신호를 결합해 상장구분·업력·위험공시를 한 장으로 정리합니다. 응답은 company·recent_events·risk_flags·insights 이며, 최근 공시 조회가 실패하면 recent_events 는 null 입니다. [호출당 30포인트]",
