        {
          "name": "app_reviews",
          "title": "앱 리뷰 조회",
          "description": "Get iOS app metadata and customer reviews by numeric app id. iOS 앱 정보(평점·가격·장르)와 고객 리뷰를 함께 돌려줍니다. country 기본 kr, page 로 리뷰 페이지를 넘깁니다(최대 10). [호출당 30포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "appId": {
                "description": "iOS 앱 ID (숫자)",
                "pattern": "^[0-9]{1,12}$",
                "type": "string"
              },
              "country": {
                "description": "국가 코드 (기본 kr)",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "page": {
                "description": "리뷰 페이지 (기본 1, 최대 10)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f073d6fb8e5de2337e14aeddc73013d6e34b5b7464335098b6c734e0e778e22e"
        },
        {
          "name": "bid_award",
          "title": "낙찰 경쟁 분석",
          "description": "Analyze Korean public-sector award results: success-rate distribution and averages, winner concentration, low-rate notices. 공공기관 낙찰 결과를 모아 평균·중위 낙찰률, 낙찰률 분포, 업체별 낙찰 점유와 집중도(HHI), 저가 낙찰 공고를 분석합니다. 응답은 summary·distribution·competitors·low_rate·insights 이며 원문 목록은 제공하지 않습니다. [호출당 50포인트]",
