        {
          "name": "hide_rrn",
          "title": "개인정보 마스킹(주민등록번호)",
          "description": "Mask resident registration numbers found in an image and return the masked image. 이미지에서 주민등록번호를 인식해 지정한 방식으로 가린 이미지를 반환합니다. 이미지 파일과 type(1: 주민등록번호 전체 가림, 2: 뒷자리 전체 가림, 3: 뒷자리 첫 숫자 제외 가림, 4: 주민등록번호와 주소 가림)을 모두 입력해야 합니다. 정보주체의 동의 등 적법한 처리 근거를 확보한 경우에만 사용하십시오. [호출당 20포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "image_url": {
                "description": "다운로드 가능한 https URL (허용 형식: image/jpeg, image/png) (최대 50MB)",
                "type": "string"
              },
              "type": {
                "description": "가림 처리 타입 (1: 주민등록번호 전체, 2: 뒷자리 전체, 3: 뒷자리 첫 숫자 제외, 4: 주민등록번호+주소)",
                "type": "string"
              }
            },
            "required": ["image_url", "type"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be21a4ea685a1ce47c5d7681a1bf51bc824f98182aad2a5fcdf0bb10cc53fbf9"
        },
        {
          "name": "identi_card1",
          "title": "[Text] 주민등록증 진위 확인",
          "description": "Verify the authenticity of a Korean resident registration card (jumin-deungnokjeung) using text input. 주민등록증의 기재 정보를 입력해 진위 여부를 확인합니다. name, rrn1, rrn2, date 네 항목을 모두 입력해야 하며, date는 숫자만 허용됩니다(예: 20230101). 정보주체의 동의 등 적법한 처리 근거를 확보한 경우에만 사용하십시오. [호출당 40포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "발급일자 (숫자만, 예: 20230101)",
                "type": "string"
              },
              "name": {
                "description": "성명",
                "type": "string"
              },
              "rrn1": {
                "description": "주민등록번호 앞 6자리",
                "type": "string"
              },
              "rrn2": {
                "description": "주민등록번호 뒤 7자리",
                "type": "string"
              }
            },
            "required": ["date", "name", "rrn1", "rrn2"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3296219c607a32437a4398a83329dccc5334ac4652d4b918d76da61c767b751e"
        },
        {
          "name": "identi_card2",
          "title": "[Text] 운전면허증 진위 확인",
          "description": "Check Korean driver license number and personal details. ghost_num is optional, may be empty, and is not used in the match decision. 운전면허번호와 인적사항을 조회합니다. birth_y, birth_m, birth_d, name과 licen_no0~licen_no3은 필수입니다. ghost_num(식별번호)은 생략·빈값·임의 문자열 모두 허용하며 전달값을 판정에 사용하지 않습니다. rrn1, rrn2도 선택 입력입니다. 암호일련번호 자체나 실물 면허증의 위·변조 여부는 검증하지 않습니다. 정보주체의 동의 등 적법한 처리 근거를 확보한 경우에만 사용하십시오. [호출당 40포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth_d": {
                "description": "생년월일 - 일 (예: 01)",
                "type": "string"
              },
              "birth_m": {
                "description": "생년월일 - 월 (예: 01)",
                "type": "string"
              },
              "birth_y": {
                "description": "생년월일 - 년 (예: 2000)",
                "type": "string"
              },
              "ghost_num": {
                "description": "식별번호 (선택, 생략·빈값 허용, 전달값은 판정에 사용하지 않음)",
                "type": "string"
              },
              "licen_no0": {
                "description": "면허번호 1구획 (예: 21)",
                "type": "string"
              },
              "licen_no1": {
                "description": "면허번호 2구획 (예: 19)",
                "type": "string"
              },
              "licen_no2": {
                "description": "면허번호 3구획 (예: 174133)",
                "type": "string"
              },
              "licen_no3": {
                "description": "면허번호 4구획 (예: 01)",
                "type": "string"
              },
              "name": {
                "description": "성명",
                "type": "string"
              },
              "rrn1": {
                "description": "주민등록번호 앞 6자리 (선택)",
