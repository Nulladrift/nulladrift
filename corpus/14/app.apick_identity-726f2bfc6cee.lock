        {
          "name": "identi_card4",
          "title": "[Text] 주민등록등본 진위 확인",
          "description": "Verify the authenticity of a Korean resident registration certificate (jumin-deungnok-deungbon) using text input. 주민등록등본·초본의 문서확인번호로 진위 여부를 확인합니다. 문서확인번호를 네 구획으로 나눈 doc_num1~doc_num4(마지막 구획은 4~5자리)와 발급 종류 type(1: 온라인 발급, 2: 기타 발급)을 보냅니다. 정보주체의 동의 등 적법한 처리 근거를 확보한 경우에만 사용하십시오. [호출당 40포인트]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "doc_num1": {
                "description": "문서확인번호 1구획 (4자리)",
                "type": "string"
              },
              "doc_num2": {
                "description": "문서확인번호 2구획 (4자리)",
                "type": "string"
              },
              "doc_num3": {
                "description": "문서확인번호 3구획 (4자리)",
                "type": "string"
              },
              "doc_num4": {
                "description": "문서확인번호 4구획 (4~5자리)",
                "type": "string"
              },
              "type": {
                "description": "발급 경로 구분 (1: 인터넷으로 발급한 등본, 2: 그 밖의 경로로 발급한 등본)",
                "type": "string"
              }
            },
            "required": ["doc_num1", "doc_num2", "doc_num3", "doc_num4", "type"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
