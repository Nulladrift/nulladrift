        {
          "name": "identi_card3",
          "title": "[Text] 여권 진위 확인",
          "description": "Verify the authenticity of a Korean passport using text input. 여권의 기재 정보를 입력해 진위 여부를 확인합니다. name, pass_num, made_date, exp_date, birth_date 다섯 항목을 모두 입력해야 하며, 일자 세 항목은 숫자만 허용됩니다(예: 20230101). 정보주체의 동의 등 적법한 처리 근거를 확보한 경우에만 사용하십시오. [호출당 40포인트]",
