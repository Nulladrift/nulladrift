      },
      "instructions": "Use this server for proxy provisioning and account operations. Never guess IDs or hidden enum values; resolve them with lookup tools first. Always resolve country IDs with listGeoCountries before createProxyResource. Always resolve tariff_id with listProxyPlans before createProxyResource. Always confirm sufficient funds with getAccountBalance before any billable create or update action; check data.can_create_proxy before creating a resource. Always inspect existing resources with listProxyResources before reading, updating, deleting, or recreating a resource when no trusted ID is already available in the current session. Before creating a resource, verify this sequence: target account or project, geo, plan, balance, duplicate check, then create. Use filtered and scoped listing whenever available; avoid broad unfiltered listings unless necessary. When listing or searching, use limit and continue through all pages until the target is found or pagination is exhausted. If pagination metadata indicates more results, do not stop at the first page. Avoid duplicate provisioning by checking for matching active, pending, or recently created resources before createProxyResource. After createProxyResource, verify the final state with getProxyResource or a follow-up listProxyResources call before reporting success. Always use buildConnectionString to assemble proxy usernames and connection strings; never assemble them manually. If validation fails, correct the inputs before retrying. If balance is insufficient, do not retry billable actions until balance is re-checked and sufficient. If the upstream service is rate limited or temporarily unavailable, retry with backoff and unchanged arguments. Prefer high-level outcome tools over multi-step low-level tool chains when both are available. Successful tool data is returned as JSON text in content, wrapped in data with optional sibling meta; pagination and totals are under meta. Return only the data necessary for the next decision or final answer. Do not narrate internal identifiers (numeric country/tariff/catalog IDs, region codes) to the user mid-task — resolve them silently via lookup tools and report only user-relevant outcomes, e.g. 'Residential plan selected' not 'tariff_id 14 confirmed'.",
      "tools": [
        {
          "name": "buildConnectionString",
          "title": "Build Connection String",
          "description": "Build a ready-to-use username and connection string for a proxy resource. The tool retrieves the proxy credential and account prefix automatically, validates geo, network, and session parameters, and encodes them in the correct order. Returns the host, port, username, password, and a username:password@host:port connection string. Response fields: docs://proxies/buildConnectionString.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asn": {
                "description": "Residential ASN. Excludes location and isp.",
                "minimum": 0,
                "type": "integer"
              },
              "city": {
                "description": "City extract_parameter. Requires country_code and state.",
                "type": "string"
              },
              "country_code": {
                "description": "Optional two-letter ISO country code, e.g. US.",
                "type": "string"
              },
              "id": {
                "description": "Proxy resource ID from listProxyResources.",
                "type": "string"
              },
              "isp": {
                "description": "Mobile ISP code. Excludes location and asn.",
                "minimum": 0,
                "type": "integer"
              },
              "session": {
                "description": "Optional alphanumeric sticky-session ID.",
                "type": "string"
              },
              "session_ttl_minutes": {
                "description": "TTL in minutes. Requires session.",
                "type": "integer"
              },
              "state": {
                "description": "Region extract_parameter. Requires country_code.",
                "type": "string"
              },
              "strict": {
                "description": "Strict sticky session. Requires session.",
                "type": "boolean"
              },
              "zip": {
                "description": "ZIP value. Requires country_code; excludes state/city.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5278de299a75e4acac83ab71b9eef7f0b933afbabc3402cfc84d08d2e723a8a2"
        },
        {
          "name": "createProxyResource",
          "title": "Create Proxy Resource",
          "description": "Create a new residential or mobile proxy resource on the account. Check getAccountBalance and require can_create_proxy to be true; usage is billed according to the selected plan (tariff_id from listProxyPlans). The name must be unique on the account and cannot be changed later. Limits can be set here or later with setProxyLimits. Returns the complete new proxy, including its password. Use buildConnectionString to get a connection string. Response fields: docs://proxies/createProxyResource.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Country IDs; empty allows any country.",
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": ["null", "array"]
              },
              "description": {
                "description": "Free-text note, shown alongside this proxy in listProxyResources. Write enough detail to identify this proxy's purpose at a glance later — e.g. the project or task it's for, why it was created, its default country, or other distinguishing settings.",
                "type": "string"
              },
              "ip_whitelist": {
                "description": "IP addresses allowed to authenticate with this proxy, e.g. ['203.0.113.1']. Empty or omitted means no IP restriction.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "limits": {
                "additionalProperties": false,
                "description": "Optional spend or traffic limit. Can also be set later via setProxyLimits.",
                "properties": {
                  "limit_type": {
                    "description": "'money' = USD spend cap, 'traffic' = bytes cap",
                    "type": "string"
                  },
                  "time_period": {
                    "description": "Reset period for the limit counter, one of: daily, monthly",
                    "type": "string"
                  },
                  "total_limit": {
                    "description": "Limit value: USD amount for 'money', bytes for 'traffic'",
                    "type": "number"
                  }
                },
                "required": ["limit_type", "time_period", "total_limit"],
                "type": ["null", "object"]
              },
              "name": {
                "description": "Proxy name: lowercase letters, digits, underscores only, max 50 characters. Immutable after creation.",
                "type": "string"
              },
              "proxy_type": {
                "description": "Proxy type, one of: residential, mobile",
                "type": "string"
              },
              "tariff_id": {
                "description": "Tariff plan ID from listProxyPlans",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["name", "proxy_type", "tariff_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2d99686cac9621171a98527a40e3dc9666cc77cf56c1ef689caaf68fd45787f"
        },
        {
          "name": "deactivateProxyResource",
          "title": "Deactivate Proxy Resource",
          "description": "Deactivate a proxy resource, stopping its traffic without deleting it. Reactivate later with updateProxyResource (status active). Use deleteProxyResource to permanently remove instead. Returns the updated proxy with status inactive. Response fields: docs://proxies/updateProxyResource (shared with updateProxyResource).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Proxy resource ID. Get from listProxyResources.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc3aadf7c8bc8018fdeea7f46ff2e97babe87434a414d6d7e2d3a4222fd4fd91"
        },
        {
          "name": "deleteProxyResource",
          "title": "Delete Proxy Resource",
          "description": "Permanently delete a proxy resource. This action is irreversible — the proxy and all its settings will be removed. User confirmation is required before proceeding. To stop traffic but keep the proxy for later, use deactivateProxyResource instead. Returns a snapshot of the deleted proxy with status deleted. Response fields: docs://proxies/deleteProxyResource.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "Set to true only after the user has explicitly confirmed the deletion. Skips the confirmation step.",
                "type": "boolean"
              },
              "id": {
                "description": "Proxy resource ID. Get from listProxyResources.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:abf6f68f2b7eb87cdae47605c91613129ccfea131ddb3a7f7c0ebaa7dd9eeb23"
        },
        {
          "name": "getAccountBalance",
          "title": "Get Account Balance",
          "description": "Get the current account balance, overdraft limit, and proxy username prefix. Returns funds_available in USD, can_create_proxy (whether proxy creation is allowed), and the prefix that starts every proxy username. Overdraft-enabled accounts also return credit_limit in USD and may return credit_limit_unlimited. Use can_create_proxy to check creation eligibility. For past deposits and charges, use listAccountBalanceHistory. Response fields: docs://account/getAccountBalance.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:75d7c7fbc24bced967c73055b983b31dbc6fc6a4ce6fa7123385a21f7e6cbaf1"
        },
        {
          "name": "getAccountTrafficUsage",
          "title": "Get Account Traffic Usage",
          "description": "Get daily traffic and spend for the account over a date range, broken down by proxy. Returns, for each date with traffic, the bytes downloaded and uploaded and the USD spent per proxy resource ID; dates with no traffic are omitted. Pass user_proxy_list_id to report on one proxy. For per-proxy totals over a period, listProxyResources with statistic_from/statistic_to is simpler. Results are paginated: keep requesting pages while meta.pagination.hasMorePages is true. Response fields: docs://account/getAccountTrafficUsage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "Start date in YYYY-MM-DD format, e.g. 2024-01-01",
                "type": "string"
              },
              "date_to": {
                "description": "End date in YYYY-MM-DD format, e.g. 2024-01-31",
                "type": "string"
              },
              "limit": {
                "description": "Items per page, default 100, max 200",
                "type": "integer"
              },
              "page": {
                "description": "One-based page number; omitted or 0 uses page 1",
                "type": "integer"
              },
              "user_proxy_list_id": {
                "description": "Filter to a single proxy resource ID, from listProxyResources. Omit to get all proxies.",
                "type": "string"
              }
            },
            "required": ["date_from", "date_to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:981660e7066fa8839cabac7fa76a45cf55ae38821c756fa45596d54efb46ab61"
        },
