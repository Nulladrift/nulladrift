      "prompts": [
        {
          "name": "build-connection-string",
          "title": "Build Connection String",
          "description": "Generate a ready-to-use proxy connection string for a specific proxy resource. Recommends protocol, geo targeting, and session mode based on the proxy's stated purpose, then confirms with the user before assembling the structured username with all parameters encoded correctly.",
          "arguments": [
            {
              "name": "proxy_id",
              "description": "Proxy resource ID to build the connection string for. If omitted, the agent will list available proxies and ask you to choose."
            },
            {
              "name": "purpose",
              "description": "What this proxy is used for, e.g. 'scraping Amazon product prices in the US'. If omitted, the agent will check the conversation history (e.g. from create-proxy-resource) or ask directly."
            }
          ],
          "digest": "sha256:2bb061f69f9c73c413e769759a6c0d254ac6638cec6f254ba6cc0a40618ac8e7"
        },
        {
          "name": "cleanup-unused-proxies",
          "title": "Cleanup Unused Proxies",
          "description": "Find proxy resources with zero traffic over the last 30 days and deactivate them after confirmation. Helps reduce clutter and avoid accidental spend.",
          "digest": "sha256:c9572f7fc47f9f02434139997e00e7476ce757f835744b17e70ec0c8ecc9ff51"
        },
        {
          "name": "create-proxy-resource",
          "title": "Create Proxy Resource",
          "description": "Create a proxy resource for any use case: web scraping, market research, SEO monitoring, ad verification, social media management, mobile testing, account automation, and more. Derives the proxy name and description from the stated purpose, recommends the appropriate proxy type if not specified, sets a default country (given directly or inferred from purpose), then continues in the same response to recommend protocol/geo/session settings and return a ready-to-use connection string — no separate prompt needed.",
          "arguments": [
            {
              "name": "purpose",
              "description": "What this proxy will be used for, e.g. 'scraping Amazon product prices in the US' or 'collecting mobile search results from Google'",
              "required": true
            },
            {
              "name": "proxy_type",
              "description": "Proxy type: residential or mobile. If omitted, the agent will recommend based on the purpose."
            },
            {
              "name": "country",
              "description": "Default country to restrict this proxy to, e.g. 'US' or 'Germany'. Resolved to the numeric country ID via listGeoCountries. If omitted, the agent infers one from the purpose if a specific country or region is implied, otherwise the proxy is left unrestricted."
            }
          ],
          "digest": "sha256:31a7c0c128f651f54df84e01436b6093e7c3b83b241def5a252b7590679b8977"
        },
        {
          "name": "monthly-cost-report",
          "title": "Monthly Cost Report",
          "description": "Generate a traffic and spend report for a given period. Shows total traffic, cost per proxy, and flags proxies with unusually high spend or zero activity.",
          "arguments": [
            {
              "name": "period",
              "description": "Time period to report on. Accepts natural language: 'this month', 'last month', 'June 2024', 'past 30 days', or a strict range like '2024-06-01 to 2024-06-30'.",
              "required": true
            }
          ],
          "digest": "sha256:714faed53c78cc3b2657cfc40ad3ce6280d3418010eb3b662762dffc8eb192cd"
        }
      ],
      "digest": "sha256:2a63abbcbdad22739805dd3ae6a6f0bf19e661a5dc09fedcd176882df46ef503"
    }
  }
