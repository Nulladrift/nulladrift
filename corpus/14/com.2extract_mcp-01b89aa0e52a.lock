        {
          "name": "setProxyIpWhitelist",
          "title": "Set Proxy IP Whitelist",
          "description": "Replace the IP whitelist for a proxy resource, restricting authentication to the given IPs. This controls who can authenticate; to control which domains the proxy can reach, use setProxyTargetHosts. Returns the updated proxy with the applied IP whitelist. Response fields: docs://proxy-settings/setProxyIpWhitelist.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Proxy resource ID. Get from listProxyResources.",
                "type": "string"
              },
              "ips": {
                "description": "List of allowed IP addresses, e.g. ['203.0.113.1', '198.51.100.42']. Empty array removes all IP restrictions.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["id", "ips"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cb8c5160875febb53f6fd35f7efc64586eddd53ac40e9c8661e9cd29b6f83d5"
        },
        {
          "name": "setProxyLimits",
          "title": "Set Proxy Limits",
          "description": "Set the traffic or spending limit on a proxy resource to control costs. A proxy has one limit: this call replaces any existing limit, and total_limit 0 removes it. The counter resets daily or monthly according to time_period. Returns the updated proxy with the applied limits. To change other settings in the same call, use updateProxyResource. Response fields: docs://proxy-settings/setProxyLimits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Proxy resource ID. Get from listProxyResources.",
                "type": "string"
              },
              "limit_type": {
                "description": "'money' = USD spend cap, 'traffic' = bytes cap",
                "type": "string"
              },
              "time_period": {
                "description": "Reset period for the limit counter, one of: daily, monthly",
                "type": "string"
              },
              "total_limit": {
                "description": "Limit value: USD amount for 'money' (e.g. 50.00), bytes for 'traffic' (e.g. 1073741824 = 1GB). Set to 0 to remove the limit.",
                "type": "number"
              }
            },
            "required": ["id", "limit_type", "time_period", "total_limit"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06c66307e5c2946c7bc368de217532f37cf1e5a4255d710d37c9f28a76758bbf"
        },
        {
          "name": "setProxyTargetHosts",
          "title": "Set Proxy Target Hosts",
          "description": "Replace the target host whitelist for a proxy resource, restricting its traffic to the given domains. This controls where the proxy can connect; to control who can authenticate, use setProxyIpWhitelist. Returns the updated proxy with the applied target host whitelist. Response fields: docs://proxy-settings/setProxyTargetHosts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Proxy resource ID. Get from listProxyResources.",
                "type": "string"
              },
              "target_hosts": {
                "description": "List of allowed domains, e.g. ['example.com', '*.api.service.com']. Empty array removes all restrictions.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["id", "target_hosts"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7ef4f1d4ee2fe19fc830f273f53f308b163620ab22e84d2e033cdea3b115ca5"
        },
        {
          "name": "updateProxyResource",
          "title": "Update Proxy Resource",
          "description": "Update description, countries, status, IP whitelist, or limits in one call. Name and proxy_type are not mutable through this MCP tool. For single-field changes, prefer setProxyIpWhitelist, setProxyLimits, or deactivateProxyResource. Returns the complete updated proxy without its password. Response fields: docs://proxies/updateProxyResource.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Replacement country IDs; empty clears.",
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": ["null", "array"]
              },
              "description": {
                "description": "New description. See createProxyResource's description field for what to include.",
                "type": "string"
              },
              "id": {
                "description": "Proxy resource ID. Get from listProxyResources.",
                "type": "string"
              },
              "ip_whitelist": {
                "description": "New IP whitelist. Replaces the existing list entirely. Empty array removes all restrictions.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "limits": {
                "additionalProperties": false,
                "description": "New spend or traffic limit. Replaces the existing limit.",
                "properties": {
                  "limit_type": {
                    "description": "'money' = USD spend cap, 'traffic' = bytes cap",
                    "type": "string"
                  },
                  "time_period": {
                    "description": "Reset period for the limit counter, one of: daily, monthly",
                    "type": "string"
                  },
                  "total_limit": {
                    "description": "Limit value: USD amount for 'money', bytes for 'traffic'",
                    "type": "number"
                  }
                },
                "required": ["limit_type", "time_period", "total_limit"],
                "type": ["null", "object"]
              },
              "status": {
                "description": "New status, one of: active, inactive",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8e6552724914f34c9607d9702bd794587629fd58d51bd1557db81ed17c33a0d"
        }
