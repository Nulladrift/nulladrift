{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sosumi/sosumi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sosumi.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sosumi.ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Sosumi returns Apple's documentation as Markdown. The conformance conditions in Apple's data, such as \"Conforms when `Element` conforms to `Hashable`.\", can be missing or wrong. When a condition matters, read the declaration in the module's `.swiftinterface` file in the SDK.",
      "tools": [
        {
          "name": "fetchAppleDocumentation",
          "title": "Fetch Apple Documentation",
          "description": "Fetch a page of Apple Developer documentation (https://developer.apple.com/documentation) or the Human Interface Guidelines (https://developer.apple.com/design/human-interface-guidelines) by path and return it as Markdown",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Documentation path (e.g., '/documentation/swift', '/documentation/swiftui/view', '/design/human-interface-guidelines/foundations/color')",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch Apple Documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:821f47fbf4faed468d1fdb61a7d50645c49a6e0f5b7cdcc97ffa351ac587d389"
        },
        {
          "name": "fetchAppleVideoTranscript",
          "title": "Fetch Apple Video Transcript",
          "description": "Fetch the transcript of an Apple Developer video (https://developer.apple.com/videos) by path and return it as Markdown",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Apple video path (e.g., '/videos/play/wwdc2021/10133' or '/videos/play/meet-with-apple/208')",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch Apple Video Transcript"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e09e44d3b73b7a222298a4d6202ea1d1ec7915767e537e3cd8e1391321a1b47"
        },
        {
          "name": "fetchExternalDocumentation",
          "title": "Fetch External Documentation",
          "description": "Fetch a page from a public Swift-DocC documentation site (https://www.swift.org/documentation/docc/) by absolute HTTPS URL and return it as Markdown",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "External Swift-DocC URL (e.g., 'https://swiftlang.github.io/swift-docc-plugin/documentation/swiftdoccplugin')",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch External Documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c3cf96b827193f3c342f0b9958c0a3b52ccbce61aeb1127c804c0d28e8314ac"
        },
        {
          "name": "searchAppleDocumentation",
          "title": "Search Apple Documentation",
          "description": "Search Apple Developer documentation (https://developer.apple.com/documentation) and return structured results",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Search query for Apple documentation",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The search query that was executed",
                "type": "string"
              },
              "results": {
                "description": "Array of search results",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "breadcrumbs": {
                      "description": "Navigation breadcrumbs showing the page hierarchy",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "description": {
                      "description": "Brief description of the page content",
                      "type": "string"
                    },
                    "tags": {
                      "description": "Tags associated with the page (languages, platforms, etc.)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "description": "Title of the documentation page",
                      "type": "string"
                    },
                    "type": {
                      "description": "Type of result (documentation, general, etc.)",
                      "type": "string"
                    },
                    "url": {
                      "description": "Full URL to the documentation page",
                      "type": "string"
                    }
                  },
                  "required": ["breadcrumbs", "description", "tags", "title", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Apple Documentation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:988cded3e807dbc7f32b8b34630bc8fc2c627832e88c17fccbe8c0a3ecf2afdb"
        }
      ],
      "digest": "sha256:f18c53d0e7bb2f24261a7f9df5913a6030b7ffb0c822fceb3f0daff3f5d011f1"
    }
  }
}
