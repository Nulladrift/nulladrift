            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/clone-card-v2.html",
            "openai/toolInvocation/invoked": "Questions loaded",
            "openai/toolInvocation/invoking": "Loading questions…",
            "securitySchemes": [
