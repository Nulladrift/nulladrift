        {
          "name": "remove_clone_fact",
          "title": "Remove a fact from my AI clone",
          "description": "Use this when the user wants the clone to stop saying something: removes one fact, given by its exact text or its 0-based position in the list from get_my_clone. Removed facts cannot be restored except by adding them again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "index": {
                "description": "0-based position of the fact in the facts list.",
                "maximum": 39,
                "minimum": 0,
                "type": "integer"
              },
              "text": {
                "description": "The exact text of the fact to remove.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "fact_count": {
                "type": "number"
              },
              "removed": {
                "type": "string"
              }
            },
            "required": ["fact_count", "removed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Remove a fact from my AI clone"
