        {
          "name": "publish_my_clone",
          "title": "Publish my AI clone",
          "description": "Use this when the user asks to create, update or publish their AI clone. It publishes a public chat page on the web where anyone with the link can ask the clone questions without an account. Include only what the user gave or approved in this conversation for publication, because it becomes public. It is an AI clone of the account holder only, never of another person. Headline and intro replace the earlier ones; facts are added to the existing facts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "about": {
                "description": "A short intro in the user's own words, approved for publication.",
                "maxLength": 1200,
                "minLength": 1,
                "type": "string"
              },
              "contact": {
                "description": "Optional: how people can reach the user, only if the user wants it public.",
                "maxLength": 200,
                "type": "string"
              },
              "display_name": {
                "description": "The user's own name as it should appear on the page, for example \"Ada Lovelace\". Only the account holder's own name. Kept from the last time when left out.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "facts": {
                "description": "Facts the clone may state about the user, one per item. Only what the user approved for publication.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "headline": {
                "description": "One line saying who the user is and what they do, as the user approved it for publication.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["about", "facts", "headline"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "about": {
                "type": "string"
              },
              "contact": {
                "type": "string"
              },
              "created": {
                "type": "boolean"
              },
              "fact_count": {
                "type": "number"
              },
              "facts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "headline": {
                "type": "string"
              },
              "link": {
                "type": ["string", "null"]
              },
              "name": {
                "type": "string"
              },
              "public": {
                "type": "boolean"
              }
            },
            "required": ["about", "contact", "created", "fact_count", "facts", "headline", "link", "name", "public"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish my AI clone"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
