      "instructions": "Use discover, connect, quote, authorize, execute, and verify_receipt. Customer-owned clients may use OAuth connection grants. Autonomous machines may self-register at /v1/agents/register and present the returned ipc_live_ bearer directly. Paid execution requires prior canonical prepaid authorization.",
