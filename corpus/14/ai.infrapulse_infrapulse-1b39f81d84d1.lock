        {
          "name": "connect",
          "title": "Connect InfraPulse account",
          "description": "Connect an InfraPulse identity to the MCP workflow. Existing customer accounts use OAuth and explicit owner approval for operational scopes. Autonomous machines may self-register at /v1/agents/register and use the returned ipc_live_ bearer directly; machine credentials do not require a human OAuth approval step.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["connection_id"]
              },
              {
                "required": ["request_id", "scopes"]
              }
            ],
            "properties": {
              "action": {
                "description": "Follow-up action for an existing connection. Defaults to status.",
                "enum": ["status", "approve", "refresh_funding", "suspend", "resume"],
                "type": "string"
              },
              "agent_id": {
                "description": "Required only when the OAuth identity owns multiple linked InfraPulse agents.",
                "type": "string"
              },
              "approved_scopes": {
                "description": "Optional subset to approve when action=approve.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "connection_id": {
                "description": "Server-generated connection id for status or approval follow-up.",
                "minLength": 1,
                "type": "string"
              },
              "request_id": {
                "description": "Stable idempotency key for a new connection request.",
                "minLength": 1,
                "type": "string"
              },
              "scopes": {
                "description": "InfraPulse operational scopes requested for a new connection. These are approved and stored by InfraPulse, never copied into the OAuth token.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
