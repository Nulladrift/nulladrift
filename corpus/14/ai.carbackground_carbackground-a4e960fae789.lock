      "instructions": "Car Background AI turns ordinary car photos into dealership-quality listing photos. Use it whenever a user wants to improve, clean up or standardise vehicle photos: for dealer websites, marketplace listings, social posts or ads.\n\nWhat it does:\n- Replaces the background of a car photo with a studio, showroom or outdoor scene. The car itself is kept as photographed (same car, wheels, badges and viewing angle) and is given shadows, lighting and reflections that match the new scene, so it looks shot on location instead of pasted in.\n- Works from a phone photo taken on a lot or a street. Interior and detail shots are cleaned up too, so a whole listing gets one consistent look.\n- Hides license plates (blank plate, blur, or the dealer's own plate logo), adds dealer logos, reframes to marketplace aspect ratios, and can centre the car or show it freshly washed.\n- Custom backgrounds: create_background makes a scene of the user's own, such as their real showroom or brand colours, from a text description and/or reference photos. It returns a preview image; look at it and call refine_background with a change (\"darker floor\", \"warmer light\") until it matches what the user wants. Each preview costs one credit. Custom backgrounds are then used like any other.\n\nHow to use it:\n1. list_backgrounds to see the scenes and their preview images; pick one that fits the user's brand or ask them.\n2. generate_background with a public image URL and a background_id. One credit per result; failed generations are not charged. Use the same background for every photo of a car, and for a dealer's whole stock, to keep listings consistent.\n3. hide_license_plates when only the plate should change. It is included with a subscription.\n\nCredits and billing: get_credits shows the balance. When it runs out, list_plans shows the subscriptions; create_checkout returns a payment link for a first subscription and change_plan upgrades an existing one. Preview a plan change with confirm: false and get the user's agreement before calling it with confirm: true.",
      "tools": [
        {
          "name": "change_plan",
          "title": "Change subscription plan",
          "description": "Change the plan of a workspace that already has a subscription, to a `price_id` from list_plans. Always call it first with `confirm: false`, which for an upgrade returns a preview of the prorated charge and charges nothing, and get the user's agreement to that amount. With `confirm: true` an upgrade charges the payment method on file immediately and adds the photos at once, while a smaller plan charges nothing now and is booked to start at the next renewal. For a workspace without a subscription it returns `no_active_subscription`; use create_checkout there instead. It cannot cancel a subscription; the user does that in the app. Needs an OAuth sign-in: with an API key it returns an error pointing to the app.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "confirm": {
                "description": "false previews an upgrade; true applies the change.",
                "type": "boolean"
              },
              "price_id": {
                "description": "A `price_id` from list_plans.",
                "type": "string"
              }
            },
            "required": ["confirm", "price_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change subscription plan"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e23c68745cc4bec1e32603f108cf362c476885d86a38fbf95222b6f7f876299a"
        },
        {
          "name": "create_background",
          "title": "Create custom background",
          "description": "Create a new reusable background scene for the workspace, such as the dealer's own showroom, a branded studio or a specific outdoor setting. Use it when none of the scenes in list_backgrounds fits; it does not edit a car photo (that is generate_background), and to adjust a custom background that already exists use refine_background instead of creating another. Give a `description`, `reference_image_urls`, or both; add `base_background_id` to start from a built-in scene and describe only what to change. Renders a preview with a demo car and returns it as an image plus the new background's `id`, ready to pass to generate_background. Costs one credit; a rejected or failed request is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base_background_id": {
                "description": "A built-in background `id` to start from; the description then says what to change.",
                "type": "string"
              },
              "description": {
                "description": "The scene: walls, floor, lighting, setting. E.g. 'A bright showroom with light oak flooring and floor-to-ceiling windows'.",
                "type": "string"
              },
              "name": {
                "description": "Display name. Suggested if omitted.",
                "type": "string"
              },
              "reference_image_urls": {
                "description": "Up to three public image URLs of the place or style to recreate.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create custom background"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87b5114185f6a5fe5281fc479236737909e9311fef49d52f59a56b9e7da3b120"
        },
        {
          "name": "create_checkout",
          "title": "Create checkout link",
          "description": "Start a first subscription for a workspace that has none, e.g. when get_credits shows too few credits. Take `price_id` from list_plans; `currency` picks one of that plan's fixed local prices and `buyer` decides VAT handling for EU and UK buyers. This call charges nothing: it returns a Stripe checkout `url` for the user to open and pay, and the plan's photos are added once the payment completes. For a workspace that already subscribes it returns `already_subscribed`; use change_plan there instead. Needs an OAuth sign-in: with an API key it returns an error pointing to the app.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer": {
                "description": "EU and UK buyers: `business` collects a VAT number (reverse charge), `personal` adds VAT.",
                "enum": ["business", "personal"],
                "type": "string"
              },
              "currency": {
                "description": "A key of the plan's `currency_options` (e.g. `eur`) to pay the fixed local price. Omit for USD.",
                "type": "string"
              },
              "price_id": {
                "description": "A `price_id` from list_plans.",
                "type": "string"
              }
            },
            "required": ["price_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4773b50949735291371f2b574c072998855c245213ec53c2e28bdb7b02934587"
        },
        {
          "name": "delete_background",
          "title": "Delete custom background",
          "description": "Permanently delete one of the workspace's custom backgrounds, e.g. a scene the user no longer wants in their list. It cannot be undone through this server; a deleted scene has to be made again with create_background. Photos already generated with it are not affected, and no credits are charged or refunded. Only custom backgrounds (`custom: true` in list_backgrounds) can be deleted, never built-in ones. To change a scene instead of removing it, use refine_background. Returns the `id` with `deleted: true`, or `not_found` for an unknown id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "background_id": {
                "description": "The `id` of a custom background.",
                "type": "string"
              }
            },
            "required": ["background_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete custom background"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:db0ff06a564754a849d84e00477625e6f23d177c121a637e08548d0fa3e7b10d"
        },
        {
          "name": "delete_logo",
          "title": "Delete logo",
          "description": "Permanently delete one of the workspace's stored logos, e.g. an outdated logo or to free one of the seven slots before upload_logo. It cannot be undone through this server; the logo has to be uploaded again to restore it. Photos already generated keep the logo they were made with, and later generate_background calls can no longer use this `id`. Get the `id` from list_logos, and pass the same `type` the logo was listed under (`logo` by default, or `plate`). Free. Returns the `id` with `deleted: true`, or `not_found` when the id is unknown for that type.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "A logo `id` from list_logos.",
                "type": "string"
              },
              "type": {
                "description": "`logo` (default): logos drawn on finished photos. `plate`: designs put on the license plate.",
                "enum": ["logo", "plate"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete logo"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:50e7ecb4ed7993a31cd3260d0549f8799755dd454514e00f025b718e2d3e86fe"
        },
        {
          "name": "generate_background",
          "title": "Replace photo background",
          "description": "Replace the background of one car photo with a chosen scene: the main tool for turning a phone photo into a listing photo. The car is kept as photographed and gets shadows, lighting and reflections that match the scene. Works on exterior, interior and detail shots. Pick `background_id` with list_backgrounds first and use the same one for every photo of a car. In the same call it can hide the plate (`hide_license_plate`, with `license_plate_style` and, for `logo`, a `license_plate_logo` from list_logos), draw a dealer `logo`, reframe to an `aspect_ratio`, centre the car or show it washed. To hide the plate without changing the background use hide_license_plates; to make a new scene use create_background. One photo per call; the source photo is not modified. Costs one credit, and a failed generation is not charged. Can take up to a minute. Returns a signed `image_url` of the high-resolution result, valid for 7 days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspect_ratio": {
                "description": "Output aspect ratio. Omit to keep the photo's own.",
                "enum": ["1:1", "16:9", "9:16", "4:3", "3:4", "3:2", "2:3", "4:5", "5:4", "21:9"],
                "type": "string"
              },
              "background_id": {
                "description": "A background `id` from list_backgrounds.",
                "type": "string"
              },
              "center_car": {
                "description": "Experimental: centre, enlarge and level the car like a listing photo.",
                "type": "boolean"
              },
              "clean_car": {
                "description": "Experimental: show the car freshly washed.",
                "type": "boolean"
              },
              "hide_license_plate": {
                "description": "Hide a legible license plate (exterior photos).",
                "type": "boolean"
              },
              "image_url": {
                "description": "Public HTTPS URL of the car photo (JPEG, PNG or WebP).",
                "format": "uri",
                "type": "string"
              },
              "license_plate_logo": {
                "description": "Required with license_plate_style `logo`.",
                "properties": {
                  "id": {
                    "description": "A plate logo `id` from list_logos with type `plate`.",
                    "type": "string"
                  }
                },
                "required": ["id"],
                "type": "object"
              },
              "license_plate_style": {
                "description": "With hide_license_plate: `plain` (default) replaces it with a blank plate, `blur` blurs it, `logo` shows the dealer's plate logo (set license_plate_logo).",
                "enum": ["plain", "blur", "logo"],
                "type": "string"
              },
              "logo": {
                "description": "Draw one of the workspace's logos on the result.",
                "properties": {
                  "id": {
                    "description": "A logo `id` from list_logos.",
                    "type": "string"
                  },
                  "position": {
                    "enum": ["top-left", "top-right", "bottom-left", "bottom-right", "top-center"],
                    "type": "string"
                  }
                },
                "required": ["id"],
                "type": "object"
              }
            },
            "required": ["background_id", "image_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Replace photo background"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:827d255082caceb8464eb22be7a41a6a31ac97a989948cc647174a4fa20d2f8a"
        },
        {
          "name": "get_credits",
          "title": "Get credit balance",
          "description": "Read the workspace's current credit balance, returned as `balance`. One credit is one photo from generate_background or one preview from create_background or refine_background; hide_license_plates uses none. Call it before a batch to check there are enough credits, or after an insufficient-credits error. Read-only and free; takes no parameters. It does not show plans or prices: when the balance is too low, use list_plans, then create_checkout (no subscription yet) or change_plan (existing subscription).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get credit balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d023dc00e9da38cb2abdc20d152cee7743f416dff2c4682ba060a26f89fa0c2b"
        },
        {
          "name": "hide_license_plates",
          "title": "Hide license plates",
          "description": "Hide the license plates in a car photo without changing anything else, for privacy before publishing a listing. Use this when the background should stay as it is; when the background is being replaced as well, set `hide_license_plate` on generate_background instead of calling both. `style` chooses a blur (default) or a solid `block`, and `block_color` sets the block's colour. Uses no credits: it is included with an active subscription, up to a fair-use monthly limit, and returns `subscription_required` for a workspace without one. The source photo is not modified; the result is returned as an image, with the areas that were hidden listed as `plates`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "block_color": {
                "description": "Hex colour of the block, e.g. #FFFFFF. Default black.",
                "type": "string"
              },
              "image_url": {
                "description": "Public HTTPS URL of the car photo (JPEG, PNG or WebP).",
                "format": "uri",
                "type": "string"
              },
              "style": {
                "description": "Blur the plate (default) or cover it with a block.",
                "enum": ["blur", "block"],
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Hide license plates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff189ef129ea63f0607df2d8c17a0e51463bf42640e2368a6e7f753e5b015e77"
        },
        {
          "name": "list_backgrounds",
          "title": "List backgrounds",
          "description": "List the background scenes available for car photos: built-in studios, showrooms and outdoor settings, plus the workspace's own custom backgrounds (`custom: true`, made with create_background or in the app). Call this first to pick a scene: each entry has a preview image, an example with a car, and the `id` that generate_background takes as `background_id` (custom ones also go to refine_background and delete_background). Read-only and free; takes no parameters and returns every scene in one response. For logos use list_logos instead.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List backgrounds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3490ba7466f298026f489253fd273fc82220f9fff20f483831c943b9cd55720f"
        },
        {
          "name": "list_logos",
          "title": "List logos",
          "description": "List the logos stored for the workspace, to get the `id` that other tools need. `type` selects which set is returned: `logo` (default) for dealer logos drawn on finished photos, passed as `logo.id` to generate_background, or `plate` for designs shown on the license plate, passed as `license_plate_logo.id`. Each entry has `id`, `type`, `image_url` and `created_at`. Also call it before delete_logo, or before upload_logo to see whether the logo is already stored. Read-only and free. For background scenes use list_backgrounds instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "type": {
                "description": "`logo` (default): logos drawn on finished photos. `plate`: designs put on the license plate.",
                "enum": ["logo", "plate"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List logos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd2eb1d2ad06d48d345090307fcb787408a6245ea7c1b7aa70a412de2cf5ea2e"
        },
        {
          "name": "list_plans",
          "title": "List subscription plans",
          "description": "List the subscription plans on offer, to quote prices or to get the `price_id` that create_checkout (workspace without a subscription) and change_plan (existing subscription) take. Each plan has its monthly photo allowance (`credits`), billing interval and price: `unit_amount` is in the smallest unit of `currency` (USD), and `currency_options` lists the fixed local prices whose keys create_checkout accepts as `currency`. Read-only and free; takes no parameters and is the same for every caller. It does not show the workspace's own balance: use get_credits for that.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List subscription plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6dfb8a5ed7fcad2b472a9d3126c263d9dc4d9bcae9d1529b9de6ef80122215c"
        },
        {
          "name": "refine_background",
          "title": "Refine custom background",
          "description": "Adjust a custom background that already exists and render a new preview, e.g. after create_background when the preview is close but not right. `description` is only the change to make ('make the floor darker and the lighting warmer'); everything else in the scene is kept, and `reference_image_urls` can show the look to move towards. The background is updated in place under the same `id` and name, so later generate_background calls use the refined scene; photos already generated are not changed. Works on custom backgrounds only, not built-in ones; to start a different scene use create_background. Returns the new preview image. Costs one credit; a rejected or failed request is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "background_id": {
                "description": "The `id` of a custom background.",
                "type": "string"
              },
              "description": {
                "description": "What to change.",
                "type": "string"
              },
              "reference_image_urls": {
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "required": ["background_id", "description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Refine custom background"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4eb9d08fac1d4709972e1eae51b02a1229f3a44a39ef94e556de3eff928d13bc"
        },
        {
          "name": "upload_logo",
          "title": "Upload logo",
          "description": "Store a logo for the workspace so it can be put on photos later. It does not change any photo by itself: pass the returned `id` to generate_background as `logo.id`, or as `license_plate_logo.id` for a `plate` logo. The file is fetched from `image_url` once and a copy is kept (PNG, WebP or JPEG up to 5 MB; a transparent background works best). `type` is `logo` (default) for dealer logos or `plate` for license plate designs, where `background` sets the plate colour behind a transparent logo. Up to seven per type: when full, remove one with delete_logo first. Check list_logos before uploading to avoid duplicates. Free. Returns the stored logo with its `id`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "background": {
                "description": "Plate logos only: hex colour behind a transparent logo. Default white.",
                "type": "string"
              },
              "image_url": {
                "description": "Public HTTPS URL of the logo.",
                "format": "uri",
                "type": "string"
              },
              "type": {
                "description": "`logo` (default): logos drawn on finished photos. `plate`: designs put on the license plate.",
                "enum": ["logo", "plate"],
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Upload logo"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c445ea709832df4939ad84195ee541abf0f9707160ec07759e1cb27acdebaf7"
        }
