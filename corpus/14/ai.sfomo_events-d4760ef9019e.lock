        {
          "name": "search_events",
          "title": "Search events",
          "description": "Search every upcoming Bay Area event by words, dates, price, topic or place: dance, AI, music, arts, food, sports, comedy, exercise, volunteering, dating, business and professional networking. Use it whenever the question has search words, a date range (\"this weekend\": from/to), free-only, a town or an area; for a day-by-day overview of the next few days with no search words use list_upcoming, for one act by name find_performer. Words in `query` match the title, venue, performers, organizer or tags at the start of a word, singular or plural, with common synonyms (standup = stand-up, kids = children); by default all of them must match, with match \"any\" (or | / commas between them) any one does. A word that matches nothing is read as the closest word the events use, and `search` in the result says how the query was read. Dates are local (America/Los_Angeles), YYYY-MM-DD. Keyword results come earliest first, at most `limit`; `count` says how many matched in total. Topic/audience tags and venue mapping are incomplete: retry without optional filters when thin, use semantic search when offered, and supplement with web search if there are too few verified options. Check original listings for indoor setting, exact age eligibility, price and remaining tickets. Zero results do not mean no events exist. get_city lists valid filter values. No sign-in; each client gets 30 calls a minute and 2,500 event rows an hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Who the event is only for: kids, teens, seniors (older adults: senior-center programs, 55+ groups), or general (none of those). Default: no filter. Caregiver/aging talks for families and professionals are general.",
                "enum": ["general", "kids", "teens", "seniors"],
                "type": "string"
              },
              "biz_format": {
                "description": "Kind of work event: referral_group (BNI etc.), chamber, mixer, breakfast_lunch, workshop_training, conference_expo, career_fair, ce_credits, pitch_demo, committee_meeting",
                "enum": ["referral_group", "chamber", "mixer", "breakfast_lunch", "workshop_training", "conference_expo", "career_fair", "ce_credits", "pitch_demo", "committee_meeting"],
                "type": "string"
              },
              "category": {
                "description": "Scored category (the site's AI, Dance, Fun, Gym, Music, Singles, Volunteer tabs)",
                "enum": ["ai", "dance", "dating", "entertainment", "exercise", "music", "volunteer"],
                "type": "string"
              },
              "changed_since": {
                "description": "Only events added or changed (title, date or time, venue, link, price, sold out, status) at or after this moment: YYYY-MM-DD (local) or an ISO date-time. To follow up later, pass the previous result's changes.synced_at; changes.removed then lists events taken down since.",
                "type": "string"
              },
              "city": {
                "description": "City, e.g. 'San Francisco' or another town in the Bay Area (case-insensitive)",
                "type": "string"
              },
              "free": {
                "description": "Only free events (a listed free price, or an unpriced listing from a source whose events are free)",
                "type": "boolean"
              },
              "from": {
                "description": "First day to attend (default: today); includes events already running on that day",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 25, max 100)",
                "type": "integer"
              },
              "match": {
                "description": "all (default): every word in query must match; any: at least one word or |-separated phrase does (results with more matches are no different in order: earliest first); semantic: by meaning (\"something romantic\", \"chill music outdoors\"), from an embedding of query",
                "enum": ["all", "any", "semantic"],
                "type": "string"
              },
              "near": {
                "description": "Events within radius_km of a place: a neighborhood, a town, a venue name, or \"lat,lon\". Results get distance_km, nearest first within each day. Use this for \"near X\"; use neighborhood for \"in X\". Unmapped venues are left out (counted in place.unplaced_events).",
                "type": "string"
              },
              "neighborhood": {
                "description": "Only events in this San Francisco neighborhood (or town): Bayview, Bernal Heights, Castro, Chinatown, Excelsior, FiDi / South Beach, Glen Park, Golden Gate Park, Haight, Hayes Valley, Ingleside / Oceanview, Inner Richmond, Inner Sunset, Japantown, Lakeshore, Lincoln Park, Lone Mountain / USF, Marina, McLaren Park, Mission, Mission Bay, Nob Hill, Noe Valley, North Beach, Outer Mission, Outer Richmond, Pacific Heights, Portola, Potrero Hill, Presidio, Presidio Heights, Russian Hill, Seacliff, SoMa, Sunset / Parkside, Tenderloin, Treasure Island, Twin Peaks, Visitacion Valley, West of Twin Peaks, Western Addition. Sub-neighborhood and common names work too. Add radius_km to also take events within that distance of its centre. Events whose venue isn't mapped can't be placed and are left out; the response's place.unplaced_events counts them.",
                "type": "string"
              },
              "new_host": {
                "description": "Only events from a new host: an organizer, group or promoter whose first listing we saw in the last two weeks (a plain discovery marker, not a quality signal)",
                "type": "boolean"
              },
              "query": {
                "description": "Free text, e.g. 'salsa', 'hackathon', 'street fair'. Separate alternatives with | or commas ('salsa | bachata', 'comedy, improv'); keep a phrase together with quotes. A neighborhood or town after 'in'/'near' ('art openings in SoMa') becomes the place filter.",
                "type": "string"
              },
              "radius_km": {
                "description": "Distance for near (default 1.5, max 50), or how far neighborhood reaches past its boundary (default 0)",
                "type": "number"
              },
              "scope": {
