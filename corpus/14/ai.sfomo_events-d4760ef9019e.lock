                "enum": ["senior_care", "healthcare", "life_sciences", "real_estate", "finance_insurance", "legal", "tech", "defense_government", "trades_construction", "hospitality_food", "retail_ecommerce", "marketing_media", "nonprofit", "energy_climate", "hr_workforce", "creative_design"],
