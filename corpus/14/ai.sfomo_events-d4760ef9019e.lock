      },
      "capabilities": {
        "prompts": {},
        "tools": {}
      },
      "instructions": "Bay Area Events (https://sfomo.ai). Read-only Bay Area events (dance, AI, music, arts, food, sports, street fairs, exercise, volunteering). Filter with category, topic or scope. For \"in <neighborhood>\" use neighborhood (a neighborhood or town name); for \"near <place>\" use near (a neighborhood, town, venue name or \"lat,lon\") with radius_km. Results then carry distance_km, and place.unplaced_events counts events left out because their venue isn't mapped. Use search_events or list_upcoming; get_event looks one up by its stable id; get_city lists the valid neighborhood, town, category and topic values with counts. Every event carries its original listing link (link), first_seen / last_seen / last_fetched dates and changed (when its time, place, price or status last changed); for \"what's new since <time>\" pass changed_since to search_events or list_upcoming. data_generated says when the data was last published. For \"what's on this week\" overviews, also cite the dated briefing in each answer's briefing_url (a permanent /week/<ISO week>/ page with counts and picks per kind of event; rolling versions: https://sfomo.ai/briefing/ and /briefing/next/). Coverage and accuracy numbers: https://sfomo.ai/coverage/ ; API spec: https://sfomo.ai/openapi.json. To make the user a self-updating calendar of their interests, follow the custom_calendar prompt and call create_custom_calendar.",
      "tools": [
        {
          "name": "create_custom_calendar",
          "title": "Create a custom calendar",
          "description": "Build a subscribable calendar of upcoming Bay Area events from the user's interests. Returns a link that opens the calendar on Bay Area Events (open_on_bay_area_events; give the user this first), subscribe links (Google Calendar, Apple/Outlook webcal, plain .ics) and a preview. The calendar refreshes itself every few hours, so new matching events keep appearing. An event is included if it matches ANY interest and no exclude term. Nothing is stored by Bay Area Events: the interests are encoded in the link itself. Interview the user first (see the custom_calendar prompt), check matches with search_events, and call this again to adjust. For a one-off answer rather than a standing calendar, use search_events. No sign-in; each client gets 30 calls a minute and 2,500 event rows an hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exclude": {
                "description": "Words; any event containing one is left out",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "include_kids": {
                "description": "Include kids'/teens'-only events (default false)",
                "type": "boolean"
              },
              "include_seniors": {
                "description": "Include events only for older adults (senior-center programs, 55+ groups; default false)",
                "type": "boolean"
              },
              "interests": {
                "description": "1-12 interests; each needs a query, category or topic",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "enum": ["ai", "dance", "dating", "entertainment", "exercise", "music", "volunteer"],
                      "type": "string"
                    },
                    "city": {
                      "description": "One city outside SF (case-insensitive)",
                      "type": "string"
                    },
                    "days": {
                      "description": "Days of the week (default all)",
                      "items": {
                        "enum": ["sun", "mon", "tue", "wed", "thu", "fri", "sat"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "free": {
                      "description": "Only free events",
                      "type": "boolean"
                    },
                    "near": {
                      "description": "Events within radius_km of a place: a neighborhood, a town, a venue name, or \"lat,lon\". Results get distance_km, nearest first within each day. Use this for \"near X\"; use neighborhood for \"in X\". Unmapped venues are left out (counted in place.unplaced_events).",
                      "type": "string"
                    },
                    "neighborhood": {
                      "description": "Only events in this San Francisco neighborhood (or town): Bayview, Bernal Heights, Castro, Chinatown, Excelsior, FiDi / South Beach, Glen Park, Golden Gate Park, Haight, Hayes Valley, Ingleside / Oceanview, Inner Richmond, Inner Sunset, Japantown, Lakeshore, Lincoln Park, Lone Mountain / USF, Marina, McLaren Park, Mission, Mission Bay, Nob Hill, Noe Valley, North Beach, Outer Mission, Outer Richmond, Pacific Heights, Portola, Potrero Hill, Presidio, Presidio Heights, Russian Hill, Seacliff, SoMa, Sunset / Parkside, Tenderloin, Treasure Island, Twin Peaks, Visitacion Valley, West of Twin Peaks, Western Addition. Sub-neighborhood and common names work too. Add radius_km to also take events within that distance of its centre. Events whose venue isn't mapped can't be placed and are left out; the response's place.unplaced_events counts them.",
                      "type": "string"
                    },
                    "query": {
                      "description": "Words that must ALL appear in the event's title/location/organizer/tags, e.g. 'salsa', 'hackathon', 'trail run'. Make separate interests for alternatives.",
                      "type": "string"
                    },
                    "radius_km": {
                      "description": "Distance for near (default 1.5, max 50), or how far neighborhood reaches past its boundary (default 0)",
                      "type": "number"
                    },
                    "scope": {
                      "description": "Area for this interest (default any)",
                      "enum": ["sf", "peninsula", "south_bay", "east_bay", "north_bay", "santa_cruz", "bay_area", "any"],
                      "type": "string"
                    },
                    "times": {
                      "description": "Start times, local: morning 5-12, afternoon 12-17, evening 17-21, late 21+; allday = no set time (fairs, exhibits). Default all",
                      "items": {
                        "enum": ["morning", "afternoon", "evening", "late", "allday"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "topic": {
                      "enum": ["arts", "books", "civic", "classes", "comedy", "community", "conferences", "culture", "faith", "family", "film", "food_drink", "games", "markets", "networking", "nightlife", "nonprofit", "outdoors", "science", "sports", "startup", "talks", "theater", "wellness", "wine", "business", "ai", "tech", "service_orgs"],
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "Calendar name shown in their calendar app, e.g. 'Salsa + AI nights'",
                "type": "string"
              }
            },
            "required": ["interests"],
            "type": "object"
          },
