        {
          "name": "resolve_flight",
          "description": "Resolve a flight number to its airports, terminals, scheduled times, and status. Codeshares are resolved automatically (e.g. DL8742 → operated by Air France as AF9): the response then carries codeshare:true, marketing_flight and operating_flight — record/track the OPERATING flight. Use BEFORE book_ride whenever the customer provides a flight number so that pickup time and terminal are correct. Input is tolerant: accepts 'AF007', 'AF 007', 'AF-007', 'af7', 'AFR007' — the tool normalizes internally. Returns an array of matching operations (usually 1 when direction is set).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Date in YYYY-MM-DD (NOT dd/mm/yyyy). This is the arrival date for pickups, departure date for dropoffs.",
                "type": "string"
              },
              "direction": {
                "default": "arrival",
                "description": "'arrival' (default) when picking the passenger up at an airport, 'departure' when dropping off for a flight.",
                "enum": ["arrival", "departure"],
                "type": "string"
              },
              "flight_number": {
                "description": "Flight number in any format: 'AF007', 'AF 007', 'af-7', 'AFR007'. Server normalizes.",
                "type": "string"
              }
            },
            "required": ["date", "flight_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up flight times & terminals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8bf4abcdafb3374776014ab0adad02ec618a99e9989afd12ab3d3166c7ab8f19"
        },
        {
          "name": "resolve_location",
          "description": "Resolve a free-text location (city, airport, hotel, station, full address) to a canonical address + coordinates, using the same geocoder that Zeplan consumes for bookings. Use this BEFORE get_quote when the customer gives a fuzzy pickup/drop-off (e.g. 'CDG', 'Le Bristol', 'Gare du Nord', raw GPS). Returns up to 5 candidates with place_id, full address, type hint, and optionally coordinates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "include_coords": {
                "default": false,
                "description": "If true, also fetch GPS coords for the first result (extra API call). Defaults to false — request only when the agent has picked the right candidate.",
                "type": "boolean"
              },
              "query": {
                "description": "Free-text location. Examples: 'CDG', 'Charles de Gaulle Terminal 2E', 'Hotel Le Bristol Paris', 'Gare du Nord', '15 rue de la Paix Paris', '48.8566, 2.3522'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Resolve location to canonical address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:71490eb873f3d76489d4ba2a782a5577c1c3e2135fb1d6438586f35996b04e2e"
        },
        {
          "name": "resolve_train",
          "description": "Resolve a TRAIN NUMBER to its route, stations and scheduled times via the official SNCF API (covers TGV inOui/Ouigo, TER, Intercités, TGV Lyria, Eurostar and international TGVs — everything serving a French station). Use whenever a customer books a station pickup/drop-off or a station Meet & Greet and gives a train number, to verify the departure/arrival time. A train number is DIGITS ONLY (TGV 6503, Lyria 9211, Eurostar 9031); a 6-char code like 'JWVLHH' is a ticket PNR and a long ref like 'W209656898' is an agency booking reference — those cannot be looked up here: extract route + time from the customer's confirmation instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Travel date in YYYY-MM-DD.",
                "type": "string"
              },
              "train_number": {
                "description": "Train number, digits only or with prefix: '9211', 'TGV 6503', 'Eurostar 9031'. Server normalizes.",
                "type": "string"
              }
            },
            "required": ["date", "train_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up train route & times (SNCF)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:da05bfbb91b5e284f41472ad105b4901074afdd101599a829ab83495b73c1949"
        },
