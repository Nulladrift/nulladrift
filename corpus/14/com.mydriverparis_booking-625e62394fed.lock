      "instructions": "You are the MyDriverParis booking assistant. You help customers book premium private chauffeur transfers in Paris and across Europe.\nBusiness rules (shared by every MyDriverParis agent — cancellation, modifications, vehicles, Meet & Greet, pricing logic, forbidden phrases): read the resource rules://mydriverparis once per conversation and follow it. Escalation on this channel = the customer emails contact@mydriverparis.com (never a phone number).\n\nWorkflow:\n1. Use get_service_info to answer questions about services and coverage, and get_cancellation_policy for anything about cancellations, changes or refunds.\n2. If the customer gives a fuzzy location (\"CDG\", \"Le Bristol\", \"Gare du Nord\"), call resolve_location to canonicalize it before get_quote. Pass the chosen candidate's \"address\" as pickup/dropoff.\n3. If the customer provides a flight number (airport pickup), call resolve_flight to get the correct arrival terminal, scheduled time, and airport. pickup_time = the scheduled LANDING time (arrival_local) — never add a buffer: the chauffeur monitors the flight and waits up to 1 hour after the real landing at no charge (rule of 2026-08-27; the former +25/+45 min offset is withdrawn).\n4. Use get_quote to calculate exact prices. It returns a quote_id valid for 15 minutes — KEEP IT.\n5. After presenting the quote, ask if the customer would like to proceed. Collect: name, email, phone number.\n6. Once the customer confirms, use book_ride with the quote_id from step 4. The price is locked from the quote — the price parameter you used to pass is no longer accepted. If the quote expired, call get_quote again.\n7. For safe retries on network errors, generate a UUID once per booking attempt and pass it as idempotency_key to book_ride. Same key + same params = same payment link (no duplicate charge).\n\nCRITICAL — how to present the result after book_ride:\n- NEVER say \"reservation created\", \"booking confirmed\", or \"réservation créée\". The booking is only created AFTER the customer completes payment.\n- Say something like: \"Here is your secure payment link to confirm the reservation. Once payment is completed, your booking will be confirmed and a chauffeur will be assigned.\"\n- Present the trip summary (route, date, time, vehicle, price) and the payment link clearly.\n- Never mention \"Stripe\" or \"checkout URL\". Just say \"secure payment link\".\n\nImportant:\n- Always call get_quote before book_ride — use the exact price from the quote.\n- Prices are all-inclusive (tolls, fuel, waiting time included).\n- For airport pickups, always ask for the flight number.\n- Free cancellation up to 24 hours before departure.",
      "tools": [
        {
          "name": "book_meetgreet",
          "description": "Create a secure payment link for a VIP Meet & Greet booking, with optional transfer combo. Available locations: CDG, Orly, Gare de Lyon — Meet & Greet is NO LONGER offered at Gare du Nord (do not quote or book it there). M&G prices are FIXED (CDG/Orly 250€ base for 2 pax + 50€/extra, Gare de Lyon 350€ + 75€/extra) — do NOT call get_quote for the M&G part. Some event dates carry a supplement (e.g. Paris Air Show): the mg_price returned here is the amount actually charged for pickup_date. A connection (service_type='connection': arrival flight → connecting departure flight with fast-track between terminals) is billed as TWO M&G services = the location price ×2 (e.g. CDG 2 pax = 500€). For a combo with a transfer (e.g. CDG M&G + transfer to a hotel), call get_quote first for the transfer leg and pass the resulting quote_id + vehicle_id in `transfer`. If lead time is below the minimum (12h before pickup), returns LEAD_TIME_TOO_SHORT — the caller must fall back to manual notification instead of retrying. lead_time_override=true bypasses the 12h minimum ONLY after Sylvain has explicitly confirmed greeter availability for this exact request (WhatsApp admin approval 'mg ok'); never set it on your own initiative. A 90-minute floor always applies. If flight cannot be validated, returns FLIGHT_NOT_FOUND — ask the customer to re-confirm the flight number, or set flight_unverified=true with manual_airline + manual_origin to force-accept.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "additional_info": {
                "description": "Free-text notes (special requests, tail number for private aviation, etc.).",
                "type": "string"
              },
              "adults": {
                "description": "Number of adults (min 1).",
                "minimum": 1,
                "type": "integer"
              },
              "bags": {
                "default": 0,
                "description": "Number of bags (used for vehicle sizing when combo transfer).",
                "minimum": 0,
                "type": "integer"
              },
              "channel": {
                "description": "Caller channel identifier for observability (whatsapp, chatbot, mcp-direct, ...).",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children (in addition to adults).",
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "Client email — used for booking confirmation and Stripe receipt.",
                "format": "email",
                "type": "string"
              },
              "first_name": {
                "description": "Client first name.",
                "type": "string"
              },
              "flight_number": {
                "description": "Flight number for airports (AF1234) or train/Eurostar number for stations.",
                "type": "string"
              },
              "flight_unverified": {
                "description": "Set true only if the client confirmed the flight after AeroDataBox couldn't validate it. Requires manual_airline + manual_origin.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Optional UUID for safe retries. Same key returns the same payment_url for 24h.",
                "type": "string"
              },
              "last_name": {
                "description": "Client last name.",
                "type": "string"
              },
              "lead_time_override": {
                "description": "Bypass the 12h minimum lead time. ONLY when Sylvain has explicitly approved this exact booking after manually confirming greeter availability ('mg ok' admin flow) — never on client insistence. Hard 90-minute floor.",
                "type": "boolean"
              },
              "location": {
                "description": "M&G location. cdg/orly = airport, gare_de_lyon = train station. Gare du Nord is no longer available.",
                "enum": ["cdg", "orly", "gare_de_lyon"],
                "type": "string"
              },
              "manual_airline": {
                "description": "Required if flight_unverified=true. The airline name as stated by the client.",
                "type": "string"
              },
              "manual_arrival_time": {
                "description": "Optional. Local arrival time as stated by the client.",
                "type": "string"
              },
              "manual_origin": {
                "description": "Required if flight_unverified=true. Departure city as stated by the client.",
                "type": "string"
              },
              "phone": {
                "description": "Client phone with country code.",
                "type": "string"
              },
              "pickup_date": {
                "description": "YYYY-MM-DD format.",
                "type": "string"
              },
              "pickup_time": {
                "description": "HH:MM in Paris time. For arrivals this is the flight/train arrival time; for departures the time the greeter meets the client.",
                "type": "string"
              },
              "service_type": {
                "default": "arrival",
                "description": "arrival (pickup at airport/station), departure (drop-off + greeter for check-in), connection (transit: arrival flight → connecting departure flight; billed as 2 M&G services = location price ×2).",
                "enum": ["arrival", "departure", "connection"],
                "type": "string"
              },
              "terminal": {
                "description": "Terminal number (airports only, e.g. '2E', '3').",
                "type": "string"
              },
              "train_coach": {
                "description": "Train coach number. Required for train stations.",
                "type": "string"
              },
              "train_pnr": {
                "description": "TGV reservation reference (PNR). Required when location is gare_de_lyon.",
                "type": "string"
              },
              "train_seat": {
                "description": "Train seat number(s). Required for train stations.",
                "type": "string"
              },
              "transfer": {
                "additionalProperties": false,
                "description": "Optional combo: bundles a private transfer in the same Stripe Checkout session. Generates 2 line items + 2 Zeplan bookings (M&G + transfer).",
                "properties": {
                  "quote_id": {
                    "description": "quote_id from a prior get_quote call covering the transfer leg (e.g. CDG → Le Bristol).",
                    "type": "string"
                  },
                  "transfer_pickup_time": {
                    "description": "HH:MM — for an ARRIVAL: the scheduled landing time, same as the greeter time (pickup_time); the chauffeur waits for the greeter to bring the client out (waiting included). For a DEPARTURE: the car pickup time at the client's address, before the greeter time at the airport.",
                    "type": "string"
                  },
                  "vehicle_id": {
                    "description": "Vehicle ID chosen from that quote.",
                    "type": "number"
                  }
                },
                "required": ["quote_id", "transfer_pickup_time", "vehicle_id"],
                "type": "object"
              }
            },
            "required": ["adults", "email", "first_name", "flight_number", "last_name", "location", "phone", "pickup_date", "pickup_time"],
            "type": "object"
          },
