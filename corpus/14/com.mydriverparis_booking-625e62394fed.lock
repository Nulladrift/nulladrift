        {
          "name": "book_ride",
          "description": "Create a secure payment link to book a private chauffeur transfer. The reservation is created automatically ONLY after the customer completes payment. REQUIRED: call get_quote first and pass the resulting quote_id + the chosen vehicle_id. The price is taken from the stored quote (not from any price field you pass). Pass idempotency_key to make retries safe: the same key returns the same payment link instead of creating a duplicate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bags": {
                "default": 1,
                "description": "Number of bags",
                "minimum": 0,
                "type": "integer"
              },
              "channel": {
                "description": "Caller channel identifier for observability. If omitted, the channel stored with the quote (from get_quote) is used.",
                "type": "string"
              },
              "flight_number": {
                "description": "Flight number for airport pickups (e.g. AF123)",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional agent-generated key (e.g. UUID) to deduplicate retries. Same key + same params returns the same payment link for 24 h. Same key + different params returns an IDEMPOTENCY_CONFLICT error.",
                "type": "string"
              },
              "passenger_email": {
                "description": "Passenger email for booking confirmation",
                "type": "string"
              },
              "passenger_name": {
                "description": "Full name of the passenger",
                "type": "string"
              },
              "passenger_phone": {
                "description": "Passenger phone with country code (e.g. +33612345678)",
                "type": "string"
              },
              "passengers": {
                "default": 1,
                "description": "Number of passengers",
                "minimum": 1,
                "type": "integer"
              },
              "quote_id": {
                "description": "quote_id returned by get_quote. Must be passed. Expired quote (>15 min) requires a fresh get_quote.",
                "type": "string"
              },
              "vehicle_id": {
                "description": "Vehicle ID chosen from the get_quote results",
                "type": "number"
              }
            },
            "required": ["passenger_email", "passenger_name", "passenger_phone", "quote_id", "vehicle_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a ride (creates secure payment link)"
