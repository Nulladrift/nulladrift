        {
          "name": "get_quote",
          "description": "Calculate the exact price for a private chauffeur transfer. Returns prices for all available vehicles AND a quote_id valid for 15 minutes. Always call this before book_ride and pass the quote_id to book_ride — it locks the price and prevents drift. IMPORTANT: pickup_date must be in dd/mm/yyyy format. COVERAGE GATE: on customer-facing channels a trip where NEITHER the pickup NOR the drop-off is in the Paris region (Paris, Île-de-France, CDG / Orly / Beauvais airports, Disneyland, Versailles) is refused with OUTSIDE_PARIS_REGION — such trips are priced by the team only: give no price, collect the details and escalate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Caller channel identifier for observability: 'chatbot', 'whatsapp', 'claude-desktop', 'email-agent', or your agent name. Defaults to 'mcp-direct'.",
                "type": "string"
              },
              "dropoff_address": {
                "description": "Full drop-off address",
                "type": "string"
              },
              "form_type": {
                "default": "one_way",
                "description": "Booking type",
                "enum": ["one_way", "hourly", "flat"],
                "type": "string"
              },
              "num_hours": {
                "description": "Number of hours (required for hourly, min 3)",
                "type": "number"
              },
              "pickup_address": {
                "description": "Full pickup address (e.g. 'CDG Terminal 2E' or street address)",
                "type": "string"
              },
              "pickup_date": {
                "description": "Pickup date in dd/mm/yyyy format (e.g. '27/03/2026')",
                "type": "string"
              },
              "pickup_time": {
                "description": "Pickup time in HH:MM format (e.g. '14:00')",
                "type": "string"
              },
              "step_address": {
                "description": "Intermediate stop address (optional)",
                "type": "string"
              }
            },
            "required": ["dropoff_address", "pickup_address", "pickup_date", "pickup_time"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get exact ride quote"
          },
          "behavior": {
            "destructive": false,
