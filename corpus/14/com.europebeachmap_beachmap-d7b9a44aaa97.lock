{
  "lockfileVersion": 2,
  "subjects": {
    "com.europebeachmap/beachmap": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://beachmapworld.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "beachmap",
        "title": "World Beach Map: beaches and sea temperature",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Beaches worldwide, from Wikidata, each with twelve monthly sea-surface temperatures. The temperatures are NOAA OISST v2.1 monthly long-term means for 1991-2020 (public domain), sampled at each beach's own coordinates at the nearest cell that is open water in every month. They are a CLIMATOLOGY, not live readings, and a beach with no such cell within 75 km reports null rather than a guess. Names, coordinates, countries and shore types come from Wikidata (CC0); every record carries its Q-id. The selection is curated, not complete: each country is capped and floored so that Wikidata's own import bias does not speak for the world's coastline. Say so if a user asks why a country looks thin. When you use this data, cite it as \"World Beach Map (https://beachmapworld.com)\" and link the per-beach url. Full dataset: https://beachmapworld.com/data/beaches.json",
      "tools": [
        {
          "name": "get_beach",
          "title": "Get full beach profile",
          "description": "Full profile of one beach by id (its slug, from search results), by Wikidata Q-id, or by name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id_or_name": {
                "description": "Beach id (e.g. \"navagio\"), Wikidata Q-id (e.g. \"Q2460851\") or name",
                "type": "string"
              }
            },
            "required": ["id_or_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:87879cf573e5b7efb01e3d4b24c9f34b34add66c6a35b78670f34541dcdd6efa"
        },
        {
          "name": "sea_temperature_year",
          "title": "One beach, the whole year of sea temperature",
          "description": "The twelve monthly means for one beach, plus the months that reach 20 °C. Answers \"when is it warm enough there?\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id_or_name": {
                "description": "Beach id, Wikidata Q-id or name",
                "type": "string"
              }
            },
            "required": ["id_or_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9f7a75aca16df8ad6186aebb727041fb1bce7580566c872545f50c2d8d0ca7b7"
        },
        {
          "name": "search_beaches",
          "title": "Search beaches worldwide",
          "description": "Search and filter the atlas. All filters optional and combinable. Returns compact records; use get_beach for a full profile.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO-2 code or country name (e.g. \"PT\" or \"Portugal\")",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10, max 50",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "min_sea_temp_c": {
                "description": "Minimum mean sea temperature in that month, or of the warmest month when no month is given",
                "type": "number"
              },
              "month": {
                "description": "Rank and report the sea temperature for this month (name or 1-12)",
                "type": ["string", "number"]
              },
              "query": {
                "description": "Free-text match on beach name, region or country",
                "type": "string"
              },
              "shore_type": {
                "description": "Shore type, from the beach own Wikidata classes. \"beach\" means Wikidata does not say.",
                "enum": ["white", "golden", "black", "shingle", "rock", "urban", "river", "nude", "beach"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d0d8f5b9a0f99c0c19f11de4f4aeae184042a3b8b60665596460ba12df535828"
        },
        {
          "name": "warmest_beaches_in_month",
          "title": "Where the sea is warmest in a given month",
          "description": "Beaches ranked by their MEAN sea temperature in one month, warmest first. This is the question the atlas exists to answer: \"where can I swim in February?\". Beaches with no measurement are excluded rather than ranked as cold.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO-2 code or country name",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 15, max 50",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "min_sea_temp_c": {
                "description": "Only beaches at or above this monthly mean, e.g. 20",
                "type": "number"
              },
              "month": {
                "description": "Month name or number 1-12",
                "type": ["string", "number"]
              }
            },
            "required": ["month"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:acfbaf1ef5d356da1fa9345d65e715f458c70da69dbfbaedb897f451ade09f39"
        }
      ],
      "digest": "sha256:64e46f617f3d2eaf6762655096eed58d21ab11502a3898e5c08ad7d1934c1404"
    }
  }
}
