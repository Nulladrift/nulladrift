{
  "lockfileVersion": 2,
  "subjects": {
    "com.oma-kase/icons": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://icons.oma-kase.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "omakase-icons",
        "title": "Omakase Icons",
        "version": "0.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_icons to find an icon by meaning, then get_icon for exact code. Never invent icon names: only names returned by these tools exist.",
      "tools": [
        {
          "name": "get_icon",
          "title": "Get icon code",
          "description": "Get ready-to-paste code for one icon: install command, import, JSX/Vue/Svelte usage, or raw SVG. Unknown names return the closest matches instead of a guess.",
          "inputSchema": {
            "properties": {
              "corner": {
                "description": "Corner shape. Default rounded.",
                "enum": ["rounded", "sharp"],
                "type": "string"
              },
              "format": {
                "description": "Output format. Default react.",
                "enum": ["react", "vue", "svelte", "svg"],
                "type": "string"
              },
              "name": {
                "description": "Icon name from search_icons, e.g. \"trash\" or \"chevron-left\".",
                "type": "string"
              },
              "rtl": {
                "description": "Set true for right-to-left layouts (Arabic, Hebrew). Directional icons such as arrows and chevrons are mirrored; others are unchanged.",
                "type": "boolean"
              },
              "size": {
                "description": "Rendered size in px. Default 24. Stroke weight adapts automatically (16px → 2.25, 20px → 1.8, 24px → 1.5).",
                "type": "number"
              },
              "strokeWidth": {
                "description": "Override the stroke weight on the 24px grid. Usually leave unset.",
                "maximum": 2.25,
                "minimum": 1,
                "type": "number"
              },
              "variant": {
                "description": "Visual style. Default stroke.",
                "enum": ["stroke", "solid", "duotone", "twotone"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ecf43f030cf341579ff190881493ed6f7eee5b05bf22140acc1afd3c9b9dc830"
        },
        {
          "name": "list_icons",
          "title": "List all icons",
          "description": "List every icon name in the set.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3699bbf7d7fde0d7425ccdd1bc5d7b9b8ca68e88af9b5a032a48b33ef3b4f17"
        },
        {
          "name": "search_icons",
          "title": "Search icons",
          "description": "Find Omakase icons by meaning, e.g. \"delete\", \"settings\", \"payment\", \"dirham\". Returns exact icon names and component names. Always search before using an icon name you are unsure of.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results, default 10.",
                "type": "number"
              },
              "query": {
                "description": "What the icon should mean or show.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dbcb692c1a5b5f7b59d3492a1d1dc93167f46d58f3c9e55947070aa457825537"
        }
      ],
      "digest": "sha256:2466eb2b462d26c82d1746fd4f6f86661ed2562399ef6c215b4cfea1307303ad"
    }
  }
}
