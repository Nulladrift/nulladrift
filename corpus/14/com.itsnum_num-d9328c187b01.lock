          },
          "digest": "sha256:fb6169a7bdddb79237e60553b2a0a3434e868978e61b4a4a08950f9c06a4d766"
        },
        {
          "name": "num_list_submissions",
          "title": "List your submissions",
          "description": "Lists the businesses and promotions this account has submitted, with the reviewer's decision on each. Free and unmetered.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "enum": ["pending", "approved", "rejected", "duplicate", "withdrawn"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
