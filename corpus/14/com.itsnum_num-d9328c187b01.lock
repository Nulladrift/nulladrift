          },
          "digest": "sha256:d3050de2f48fd75eb4fad6d3c101e08b2215980e70ffc2ac999db6f1bb19fdb8"
        },
        {
          "name": "num_photo_wallet",
          "title": "Photo wallet and licenses",
          "description": "This account's photo wallet balance (US cents, plus test credit), what it spent today against the daily cap, and the licenses it holds. Free and unmetered. Adding credit is POST /api/agent/photos/topup, which returns a checkout link a person pays.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
