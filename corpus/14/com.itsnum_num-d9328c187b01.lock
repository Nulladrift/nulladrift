          },
          "digest": "sha256:f6a617751310bbfb129a32bdaeead17a7ba5b0bb32c34c11cb0ff5c26fb7dcd2"
        },
        {
          "name": "num_search_photos",
          "title": "Search licensable photos of places",
          "description": "Search photos of real places taken by NUM travelers and offered for licensing per use. Each result has a photo_id, a preview URL, the place (name, city, area, category), the month it was taken, the photographer's public name and the price in US cents for each use: social (one post), web (one page), ad (one campaign) and ai_training (one dataset). A price of null means that use cannot be bought right now. Business uses sell in live drops: a limited number of licenses over 3 days, the price rising 10% after each one; drop shows licenses left, the end time and the next price. Every photo shows a place with no recognisable person and was checked by a person; results never include coordinates or exact dates. use=ai_training returns only photos whose photographer allows AI training. Each call counts against the daily read quota.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "e.g. 'Restaurant', 'Bar', 'Hotel'.",
                "type": "string"
              },
              "city": {
                "description": "A NUM destination or neighbourhood, e.g. 'London' or 'Silom'.",
                "type": "string"
              },
              "kind": {
                "enum": ["storefront", "interior", "menu", "food_drink", "view", "room", "hours", "signage", "other"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "place_id": {
                "description": "Only photos of this place (from num_search_places).",
                "type": "string"
              },
              "q": {
                "description": "Free text matched against the place name.",
                "type": "string"
              },
              "use": {
                "description": "Only photos offered for this use.",
                "enum": ["social", "web", "ad", "ai_training"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4645bd9eac649050aa3317ad5d8bc489bae174a3357a0ebc0396b1b17a5c4032"
        },
        {
          "name": "num_search_places",
          "title": "Search places",
          "description": "Search NUM's travel directory: more than 2.5 million places — restaurants, bars, hotels, spas, tours and shops, deepest in Thailand and the UK. Say where to look: city (one of NUM's destinations — see num_list_destinations) or country; then narrow with q, area and category. Places NUM knows have closed are never returned. Returns name, category, address, phone, website, coordinates and whether the owner has claimed the listing; call num_get_place for how to book one. Each call counts against the daily read quota.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "A neighbourhood inside the destination, e.g. 'Kata' or 'Soho'.",
                "type": "string"
              },
              "category": {
                "description": "e.g. 'Restaurant', 'Bar', 'Hotel', 'Spa', 'Tour'.",
                "type": "string"
              },
              "city": {
                "description": "A NUM destination, e.g. 'Phuket', 'Edinburgh', 'Bangkok', 'London'. Required unless country is given.",
                "type": "string"
              },
              "country": {
                "description": "ISO-2 code or name, e.g. 'TH' or 'Thailand'. Searches every NUM destination in that country.",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 20, cap 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free text matched against the place name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eb75dd208c0a81cda495aa0dbc7cff6923098f0fde29c786cd51625b958b8939"
        },
        {
          "name": "num_submit_business",
          "title": "Submit a business for review",
          "description": "Submit a business to NUM for review. Free and unmetered. A person at 5arz reviews every submission before any traveller sees it, so the result is status 'pending_review', never an immediate listing. 'relationship' records whether the submitter owns the business, was engaged by the owner, or is a third party; reviewers verify it. Contact details must be ones the business has published — submissions with guessed or derived contact details are rejected. Re-sending the same external_ref updates the pending submission instead of creating a duplicate.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "callback_url": {
                "description": "NUM POSTs the review decision here.",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "email": {
                "description": "Only if the business has published it. Do not derive it from the domain name.",
                "type": "string"
              },
              "external_ref": {
                "description": "Your own reference for this business. Re-sending it edits the pending submission instead of creating a duplicate.",
                "type": "string"
              },
              "hours": {
                "type": "string"
              },
              "languages": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "Trading name as it appears on the door.",
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "price_range": {
                "type": "string"
              },
              "relationship": {
                "description": "'owner' if you run it, 'authorized_agent' if the owner engaged you, 'third_party' if you neither own nor represent it.",
                "enum": ["owner", "authorized_agent", "third_party"],
                "type": "string"
              },
              "vertical": {
                "description": "restaurant, cafe, bar, hotel, spa, boat, tour, shop, transport, clinic, gym, attraction, other…",
                "type": "string"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["city", "country", "name", "relationship"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d5f55a8b4acfd53e1ba1e47ce5c91fd012394dfad3549789061f613e8ffd36b"
        },
        {
          "name": "num_submit_promo",
          "title": "Submit a promotion for review",
          "description": "Attach a promotion, special, event or ad to a business previously submitted by the same account. Free and unmetered. A person reviews it before it is shown to anyone. Re-sending the same promo_ref updates the pending promotion instead of creating a duplicate.",
          "inputSchema": {
            "properties": {
              "detail": {
                "type": "string"
              },
              "discount_pct": {
                "maximum": 90,
                "minimum": 0,
                "type": "integer"
              },
              "ends_at": {
                "type": "string"
              },
              "external_ref": {
                "description": "Alternative to submission_id: the reference you used for the business.",
                "type": "string"
              },
              "kind": {
                "enum": ["promo", "special", "event", "ad"],
                "type": "string"
              },
              "promo_ref": {
                "description": "Your own reference for this promotion, for idempotent edits.",
                "type": "string"
              },
              "starts_at": {
                "description": "2026-08-01 or 2026-08-01T18:00:00Z.",
                "type": "string"
              },
              "submission_id": {
                "description": "From num_submit_business.",
                "type": "string"
              },
              "terms": {
                "type": "string"
              },
              "title": {
                "description": "The single line a traveller reads.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f112ca16f9ce08210afac939c18a194d9f31c7f776944045954b4431df31cacc"
        }
      ],
      "digest": "sha256:f0cc35974711d02c8b8aa1057f2eb3e3eaa71d6a32eb60f36f5214a61fb0d237"
    }
  }
