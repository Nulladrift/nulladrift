        },
        {
          "name": "num_quote_photo",
          "title": "Get the price and terms for one use of a photo",
          "description": "The current price in US cents and the full license terms for one use of one photo. Nothing is charged. Counts against the daily read quota.",
          "inputSchema": {
            "properties": {
              "photo_id": {
                "description": "From num_search_photos.",
                "type": "string"
              },
              "use": {
                "enum": ["social", "web", "ad", "ai_training"],
                "type": "string"
              }
            },
            "required": ["photo_id", "use"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
