{
  "lockfileVersion": 2,
  "subjects": {
    "com.itsnum/num": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://itsnum.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "num",
        "title": "NUM — travel directory by 5arz",
        "version": "1.3.0",
        "websiteUrl": "https://itsnum.com/agents/",
        "icons": [
          {
            "src": "https://itsnum.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NUM is a travel places directory run by 5arz. 'Verified' on NUM refers to identity-checked guests and owner-claimed listings, not to unclaimed places. Reads are metered per UTC day; writes are free. Every business or promotion submitted is reviewed by a person before a traveller sees it and returns status 'pending_review'. Submissions whose contact details were guessed — an email address derived from a domain name, for instance — are rejected in review. The full rules are at https://itsnum.com/agents/.",
      "tools": [
        {
          "name": "num_get_place",
          "title": "Get place details and how to book it",
          "description": "Full record for one place, by the place_id that num_search_places returned, including HOW TO BOOK IT on the venue's own terms. `booking.method` is one of: request (the venue takes requests through NUM and confirms each one itself), venue_system (send the traveller to booking.url, prefilled when you pass party_size, date and time), phone (the number is for the traveller to call), not_through_num, closed, unknown. Follow booking.guidance exactly. If open_status.closed is true, NUM holds evidence the place has gone: do not send anyone there. accolades carry their source; menu is the owner's own list and prices. Each call counts against the daily read quota.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Optional: YYYY-MM-DD, to prefill the venue's booking page.",
                "type": "string"
              },
              "party_size": {
                "description": "Optional: people in the party, to prefill the venue's booking page.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "place_id": {
                "description": "The place_id returned by num_search_places.",
                "type": "string"
              },
              "time": {
                "description": "Optional: HH:MM 24-hour, local to the venue.",
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9caa25a36153d6758f5b930eb73b3266c523ad486ed70fe29b51a882c2c9112a"
        },
        {
          "name": "num_license_photo",
          "title": "License one use of a photo",
          "description": "Buys one use of one photo from this account's prepaid photo wallet and returns the license and a download link to the file (metadata removed). max_price_cents is the most the operator agreed to pay; a higher current price is refused with the quote and nothing is charged. In a live drop the price rises after every license, so another buyer can move it first: within max_price_cents the purchase goes through at the new price, above it you get price_moved with the new quote and nothing is charged. Re-sending the same idempotency_key returns the same license instead of buying again. Spending is capped per UTC day. While NUM's licensing is in its test run, purchases use test credit and no money moves; the response says test: true.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "description": "Your own key for this purchase; a retry with the same key never buys twice.",
                "type": "string"
              },
              "max_price_cents": {
                "description": "The most the operator agreed to pay for this use, in US cents.",
                "minimum": 1,
                "type": "integer"
              },
              "photo_id": {
                "description": "From num_search_photos.",
                "type": "string"
              },
              "use": {
                "enum": ["social", "web", "ad", "ai_training"],
                "type": "string"
              }
            },
            "required": ["max_price_cents", "photo_id", "use"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08887505af726e529449b4e4df3d4955bf437f8a9d0eea063cd324729d8dea37"
        },
        {
          "name": "num_list_destinations",
          "title": "List NUM's destinations",
          "description": "Every destination NUM covers, with its country. Use a destination's name or slug as num_search_places city. Free, unmetered, and needs no key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
