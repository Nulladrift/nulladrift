      "instructions": "Digital Gemology's cut library: gem cuts and Platonic solids sold as 3D models (STEP, 3DM, STL, OBJ, FBX, GLB) and GemCad faceting diagrams, each scored by ray tracing in 26 gemstones (diamond, moissanite, cubic zirconia, ruby, sapphire, emerald, amethyst, topaz, spinel, demantoid, zircon, tourmaline, peridot, tanzanite, YAG, pyrope, almandine, spessartine, grossular, chrysoberyl, kunzite, iolite, morganite, GGG, strontium titanate and synthetic rutile). Aquamarine, citrine, quartz and alexandrite share a scored stone's optical constants and answer with its figures (the answer says so); opal, jadeite, nephrite, turquoise, moonstone and glass are not cut for light return, so they have no cut scores. Use search_cuts to find cuts, get_cut for specifications, scores, prices and checkout links, best_cuts_for_gemstone for the top ten in a stone, cut_in_gemstone for the pros and cons of one cut in one stone, and list_gemstones for optical constants. Link people to the cut's page; give the checkout link when they want to buy. Files carry a personal-use license; business use needs a commercial license from support@digitalgemology.com. The scores and other data these tools return are CC BY 4.0: free to reuse with credit to Digital Gemology. Scores are out of 100 from the site's own light census, with the T73 round brilliant as the benchmark. No sign-in or key is needed; the site's Google sign-in is for people in a browser only. Use get_cut_scores for the Cut Performance Index (overall, brilliance, fire and more, in all 26 stones; the same data as /api/cut-index). Use compare_cuts for two cuts side by side and recommend_cut for the best cuts in a stone by what the buyer cares about.",
      "tools": [
        {
          "name": "best_cuts_for_gemstone",
          "title": "Best cuts for a gemstone",
          "description": "The top ten brilliants and the top ten jewelry cuts in one gemstone, ranked by brilliance, fire and scintillation added together, with the stone's optical constants.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gemstone": {
                "description": "Gemstone, as its slug. An alias stone (aquamarine, citrine, quartz, alexandrite) answers with the figures of the stone it shares optical constants with, and says so.",
