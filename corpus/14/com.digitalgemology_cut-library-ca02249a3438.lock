          "description": "Search Digital Gemology's gem cuts and Platonic solids by name, style, shape or use (for example 'square step cut', 'round brilliant for moissanite', 'historic cushion', 'pear'). Returns each match with its page, facets, size and price; get_cut gives the checkout links. Give a gemstone to add the cut's brilliance, fire and scintillation in that stone and to sort by them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "brilliants, jewelry (fancy and step cuts), historic, house (our own designs) or platonic (solids, 3D files only).",
