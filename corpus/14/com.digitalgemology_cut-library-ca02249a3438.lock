        {
          "name": "recommend_cut",
          "title": "Recommend a cut",
          "description": "The best cuts in one gemstone for what matters to the buyer: overall light performance, brilliance, fire, scintillation (sparkle), spread (looks bigger for its weight), tilt (stays bright when tilted) or leakage (least light lost). Filter by family or outline. Returns a ranked short list with each cut's page and checkout links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this family: brilliants, jewelry, historic or house. All if left out.",
                "enum": ["brilliants", "jewelry", "historic", "house"],
                "type": "string"
              },
              "gemstone": {
                "description": "Gemstone, as its slug.",
                "enum": ["diamond", "moissanite", "cubic-zirconia", "ruby", "sapphire", "emerald", "amethyst"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many cuts to return, 1 to 20; 5 if left out.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "default": "overall",
                "description": "What to rank by; leakage ranks the least light lost first. overall if left out.",
                "enum": ["overall", "brilliance", "fire", "scintillation", "spread", "tilt", "leakage"],
                "type": "string"
              },
              "shape": {
                "description": "Only cuts with this outline. All if left out.",
                "enum": ["round", "elongated", "square", "triangular", "other"],
                "type": "string"
              }
            },
            "required": ["gemstone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a cut"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:775b6f2787bba6ce4bedf45990935e1078ada5b0fc26224d0df01aba9c092d73"
        },
        {
          "name": "search_cuts",
          "title": "Search the cut library",
          "description": "Search Digital Gemology's gem cuts and Platonic solids by name, style, shape or use (for example 'square step cut', 'round brilliant for moissanite', 'historic cushion', 'pear'). Returns each match with its page, facets, size and price; get_cut gives the checkout links. Give a gemstone to add the cut's brilliance, fire and scintillation in that stone and to sort by them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "brilliants, jewelry (fancy and step cuts), historic, house (our own designs) or platonic (solids, 3D files only).",
                "enum": ["brilliants", "jewelry", "historic", "house", "platonic"],
                "type": "string"
              },
              "cutting_files": {
                "description": "Only cuts that are also sold as GemCad cutting files.",
                "type": "boolean"
              },
              "gemstone": {
                "description": "Gemstone, as its slug.",
                "enum": ["diamond", "moissanite", "cubic-zirconia", "ruby", "sapphire", "emerald", "amethyst"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many cuts to return, 1 to 50; 5 if left out.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text. Leave it out to list every cut that fits the filters.",
                "type": "string"
              },
              "shape": {
                "description": "Outline of the cut.",
                "enum": ["round", "elongated", "square", "triangular", "other", "solid"],
                "type": "string"
              },
              "sort": {
                "description": "relevance (default with a query), total (brilliance + fire + scintillation, the default with a gemstone and no query), brilliance, fire, scintillation, facets (most first) or name.",
                "enum": ["relevance", "total", "brilliance", "fire", "scintillation", "facets", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
