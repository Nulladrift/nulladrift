        {
          "name": "recommend_cut",
          "title": "Recommend a cut",
          "description": "The best cuts in one gemstone for what matters to the buyer: overall light performance, brilliance, fire, scintillation (sparkle), spread (looks bigger for its weight), tilt (stays bright when tilted) or leakage (least light lost). Filter by family or outline. Returns a ranked short list with each cut's page and checkout links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this family: brilliants, jewelry, historic or house. All if left out.",
                "enum": ["brilliants", "jewelry", "historic", "house"],
                "type": "string"
              },
              "gemstone": {
                "description": "Gemstone, as its slug. An alias stone (aquamarine, citrine, quartz, alexandrite) answers with the figures of the stone it shares optical constants with, and says so.",
                "enum": ["diamond", "moissanite", "cubic-zirconia", "ruby", "sapphire", "emerald", "amethyst", "topaz", "spinel", "demantoid", "zircon", "tourmaline", "peridot", "tanzanite", "yag", "pyrope", "almandine", "spessartine", "grossular", "chrysoberyl", "kunzite", "iolite", "morganite", "ggg", "strontium-titanate", "synthetic-rutile", "aquamarine", "citrine", "quartz", "alexandrite"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many cuts to return, 1 to 20; 5 if left out.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "default": "overall",
                "description": "What to rank by; leakage ranks the least light lost first. overall if left out.",
                "enum": ["overall", "brilliance", "fire", "scintillation", "spread", "tilt", "leakage"],
                "type": "string"
              },
              "shape": {
