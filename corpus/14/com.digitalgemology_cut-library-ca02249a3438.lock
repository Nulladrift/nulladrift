        {
          "name": "compare_cuts",
          "title": "Compare two cuts",
          "description": "Two cuts side by side in one gemstone: overall, brilliance, fire, scintillation, tilt, face-up spread and leakage from the Cut Performance Index, each cut's place in that stone, facets and size, and the products with prices and checkout links. For questions like 'oval or pear for my sapphire?'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cut_a": {
                "description": "The first cut's slug or name, for example 'oval'.",
                "type": "string"
              },
              "cut_b": {
                "description": "The second cut's slug or name, for example 'pear'.",
                "type": "string"
              },
              "gemstone": {
                "description": "The stone to compare them in; diamond if left out.",
                "enum": ["diamond", "moissanite", "cubic-zirconia", "ruby", "sapphire", "emerald", "amethyst"],
                "type": "string"
              }
            },
            "required": ["cut_a", "cut_b"],
            "type": "object"
