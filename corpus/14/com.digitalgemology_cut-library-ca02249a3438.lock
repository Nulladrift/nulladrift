        {
          "name": "get_cut",
          "title": "Get one cut",
          "description": "Everything about one cut: what it is, measured specifications (facets, angles, depth, size, index gear), brilliance, fire and scintillation in all seven gemstones against the T73, the products with prices and checkout links, its questions and answers, and its page.",
          "inputSchema": {
