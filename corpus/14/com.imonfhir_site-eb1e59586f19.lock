        {
          "name": "get_validation_findings",
          "title": "Every finding of a large validation",
          "description": "Every issue of one large validate_bundle result, a page at a time. Give it the result_id from a validate_bundle summary; it reads what validate_bundle kept (the findings, never the bundle) for 1 hour, so the bundle is not sent again and the validator does not run again. The issues come in the order POST /api/v1/validate returns them; call again with page.next_offset until it is null. Optional severity filters to fatal, error, warning or information. An unknown or expired result_id is an error: run validate_bundle again. Synthetic payloads only. Never send real patient data. Findings describe a synthetic Bundle. 60 calls per minute; MCP only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Where the page starts, counting the issues chosen (default 0); use page.next_offset.",
                "minimum": 0,
                "type": "integer"
              },
              "result_id": {
                "description": "From a validate_bundle summary (result_id or next_steps).",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              },
              "severity": {
                "description": "Only issues of this severity.",
                "enum": ["fatal", "error", "warning", "information"],
                "type": "string"
              }
            },
            "required": ["result_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "clipped": {
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "expires_at": {
                "type": "string"
              },
              "findings_digest": {
                "type": "string"
              },
              "issues": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "next_steps": {
                "items": {
                  "properties": {
                    "arguments": {
                      "type": "object"
                    },
                    "note": {
                      "type": "string"
                    },
                    "tool": {
                      "const": "get_validation_findings"
                    }
                  },
                  "required": ["arguments", "note", "tool"],
                  "type": "object"
                },
                "maxItems": 1,
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "page": {
                "properties": {
                  "listed": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "next_offset": {
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "offset": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total_issues": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total_matching": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["listed", "next_offset", "offset", "total_issues", "total_matching"],
                "type": "object"
              },
              "pas_version": {
                "type": ["string", "null"]
              },
              "result_id": {
                "type": "string"
              },
              "severity": {
                "type": ["string", "null"]
              }
            },
            "required": ["clipped", "expires_at", "findings_digest", "issues", "next_steps", "notice", "page", "pas_version", "result_id", "severity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Every finding of a large validation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.imonfhir/about": {
              "howToUse": ["Give the result_id from a validate_bundle summary.", "Call again with page.next_offset until it is null."],
              "safeToRun": ["Reads only what validate_bundle kept, for 1 hour; never the bundle.", "Read-only. Free; no account, no key."],
              "whatItDoes": ["Pages every issue of one large result, in the order the REST call returns them.", "Sends no bundle and does not run the validator again."],
              "whatItIs": ["The full list behind a validate_bundle summary, read from what validate_bundle kept."]
            },
            "com.imonfhir/cost": {
              "free": true
            },
            "com.imonfhir/form": {
              "advanced": ["severity", "offset"]
            }
          },
