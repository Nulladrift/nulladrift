              }
            },
            "required": ["counts", "findings_listed", "findings_omitted", "full_report", "ig_a", "ig_b", "mode", "notice", "summary", "top_findings", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two IGs"
