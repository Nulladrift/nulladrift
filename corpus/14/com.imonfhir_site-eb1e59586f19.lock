      "instructions": "ImOnFHIR — read-only data about HL7 standards discussions and FHIR tools. No key needed.\nAttribution: \"Data from ImOnFHIR (imonfhir.com)\" with a link to the item's canonical_url.\nEvidence types:\n- source_read, jira_verified and human_reviewed are checks ImOnFHIR made.\n- machine_summary is a reading, not a check, and always carries its model; observed_at is the read time when known, null when not.\n- inferred says nothing about current state.\nWhat you may not say:\n- Do not present a machine_summary as a finding. Say \"a machine summary, unreviewed, from <model> on <date>, says…\".\n- Do not say a Jira issue is published unless its lifecycle reaches \"published\". \"Applied\" is not published.\n- Do not say a thread is resolved because it is quiet. Quiet is inferred.\n- Always put the date and the evidence type beside any claim about where a standard stands.\n- Link to canonical_url and the HL7 source. Never reproduce thread text. Never name a person from a thread.\n- Validator output is for synthetic payloads; say so if you relay it.",
      "tools": [
        {
          "name": "compare_igs",
          "title": "Compare two IGs",
          "description": "Compare two implementation guides, each \"packageId#version\": one guide at two versions (version diff) or two guides (stack compare). Over MCP the answer is a bounded summary (the risk level and, in plain words, the rule that set it; counts per change type, a change-type by impact breakdown, the profiles carrying the most breaking changes, what moved in value set definitions, the most serious findings, and where the whole report is); POST /api/v1/compare returns the whole report.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ig_a": {
                "description": "e.g. \"hl7.fhir.us.davinci-pas#2.0.1\"",
                "type": "string"
              },
              "ig_b": {
                "description": "e.g. \"hl7.fhir.us.davinci-pas#2.1.0\"",
                "type": "string"
              }
            },
            "required": ["ig_a", "ig_b"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "breakdown": {
                "properties": {
                  "by_type_impact": {
                    "additionalProperties": {
                      "additionalProperties": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "type": "object"
                    },
                    "type": "object"
                  },
                  "family": {
                    "type": "string"
                  }
                },
                "required": ["by_type_impact", "family"],
                "type": "object"
              },
              "comparison_notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "comparison_status": {
                "type": ["string", "null"]
              },
              "counts": {
                "properties": {
                  "families": {
                    "type": "object"
                  },
                  "total": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["families", "total"],
                "type": "object"
              },
              "findings_listed": {
                "minimum": 0,
                "type": "integer"
              },
              "findings_omitted": {
                "minimum": 0,
                "type": "integer"
              },
              "full_report": {
                "properties": {
                  "note": {
                    "type": "string"
                  },
                  "rest": {
                    "properties": {
                      "body": {
                        "type": "object"
                      },
                      "method": {
                        "const": "POST"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["body", "method", "url"],
                    "type": "object"
                  },
                  "site_url": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["note", "rest", "site_url"],
                "type": "object"
              },
              "ig_a": {
                "type": "string"
              },
              "ig_b": {
                "type": "string"
              },
              "mode": {
                "enum": ["version", "stack"]
              },
              "notice": {
                "type": "string"
              },
              "risk": {
                "properties": {
                  "explanation": {
                    "type": ["string", "null"]
                  },
