        {
          "name": "validate_bundle",
          "title": "Validate a PAS bundle",
          "description": "Validate a synthetic Da Vinci PAS Submit Bundle with the ImOnFHIR validator. Synthetic payloads only. Never send real patient data. Findings describe a synthetic Bundle. Body cap 2 MB, 10 calls per minute. Over MCP, read `summary` first: false means the whole OperationOutcome is in `outcome`; true means it was over 100,000 characters, so the answer is a bounded summary instead (the coverage note; distinct problems by severity, a problem the validator's layers report twice counted once, with the raw counts beside them; counts by issue code, rule family and resource; the PAS profile versions the issues cite; the 25 most serious kinds of finding, and how many were not listed). A summary's findings (never the bundle) are kept 1 hour: get_validation_findings pages every issue with the result_id it gives. POST /api/v1/validate returns the whole OperationOutcome.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bundle": {
                "description": "A FHIR Bundle (resourceType \"Bundle\"). Synthetic only.",
                "type": "object"
              },
              "ig": {
                "const": "hl7.fhir.us.davinci-pas",
                "type": "string"
              },
              "version": {
                "description": "A PAS version the validator allows; omitted, the default.",
                "type": "string"
              }
            },
            "required": ["bundle"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "counts": {
                "properties": {
                  "by_code": {
                    "type": "object"
                  },
                  "by_resource": {
                    "items": {
                      "properties": {
                        "issues": {
                          "minimum": 0,
                          "type": "integer"
                        },
                        "resource": {
                          "type": "string"
                        }
                      },
                      "required": ["issues", "resource"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "by_rule_family": {
                    "type": "object"
                  },
                  "by_severity": {
                    "description": "As reported: one per OperationOutcome issue, as REST returns them; larger than problems_by_severity when layers report the same problem.",
                    "type": "object"
                  },
                  "by_severity_code": {
                    "type": "object"
                  },
                  "distinct_findings": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "issues": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "problems": {
                    "description": "Distinct problems: one per severity, code, message and place, so a problem two validator layers report counts once. Lead with this.",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "problems_by_severity": {
                    "description": "Distinct problems by severity.",
                    "type": "object"
                  },
                  "resources_total": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["by_code", "by_resource", "by_rule_family", "by_severity", "by_severity_code", "distinct_findings", "issues", "problems", "problems_by_severity", "resources_total"],
                "type": "object"
              },
              "coverage": {
                "properties": {
                  "complete": {
                    "type": "boolean"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "required": ["complete", "text"],
                "type": "object"
              },
              "expires_at": {
                "type": ["string", "null"]
              },
              "findings_digest": {
                "type": ["string", "null"]
              },
              "findings_listed": {
                "minimum": 0,
                "type": "integer"
              },
              "findings_omitted": {
                "minimum": 0,
                "type": "integer"
              },
              "full_report": {
                "properties": {
                  "note": {
                    "type": "string"
                  },
                  "rest": {
                    "properties": {
                      "method": {
                        "const": "POST"
                      },
                      "send": {
                        "type": "string"
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["method", "send", "url"],
                    "type": "object"
                  },
                  "site_url": {
                    "type": "string"
                  }
                },
                "required": ["note", "rest", "site_url"],
                "type": "object"
              },
              "ig": {
                "const": "hl7.fhir.us.davinci-pas"
              },
              "instruction_block": {
                "properties": {
                  "rules": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["rules", "version"],
                "type": "object"
              },
              "key_findings": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "count": {
                      "description": "Issues of this kind as reported, layer twins included.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    },
                    "message_clipped": {
                      "type": "boolean"
                    },
                    "places": {
                      "description": "Distinct places this kind occurs: its problems, layer twins merged.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "rule_families": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "severity": {
                      "type": "string"
                    },
                    "where": {
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 3,
                      "type": "array"
                    },
                    "where_omitted": {
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["code", "count", "message", "message_clipped", "places", "rule_families", "severity", "where", "where_omitted"],
                  "type": "object"
                },
                "maxItems": 25,
                "type": "array"
              },
              "next_steps": {
                "items": {
                  "properties": {
                    "arguments": {
                      "required": ["result_id"],
                      "properties": {
                        "result_id": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "note": {
                      "type": "string"
                    },
                    "tool": {
                      "const": "get_validation_findings"
                    }
                  },
                  "required": ["arguments", "note", "tool"],
                  "type": "object"
                },
                "maxItems": 1,
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "outcome": {
                "description": "Present only when summary is false.",
                "properties": {
                  "issue": {
                    "type": "array"
                  },
                  "resourceType": {
                    "const": "OperationOutcome"
                  }
                },
                "required": ["issue", "resourceType"],
                "type": "object"
              },
              "pas_profile_versions_cited": {
                "items": {
                  "properties": {
                    "issues": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["issues", "version"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "requestId": {
                "type": "string"
              },
              "result_id": {
                "description": "The id get_validation_findings reads; null when the result could not be kept (see store_note).",
                "type": ["string", "null"]
              },
              "store_note": {
                "type": ["string", "null"]
              },
              "summary": {
                "description": "false: the whole OperationOutcome is in outcome. true: it was too long to send whole; this is a bounded summary.",
                "type": "boolean"
              },
              "summary_notice": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "version": {
                "type": ["string", "null"]
              },
              "version_note": {
                "type": ["string", "null"]
              }
            },
            "required": ["ig", "notice", "requestId", "summary", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate a PAS bundle"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.imonfhir/about": {
              "howToUse": ["Send a synthetic bundle; pick a PAS version or take the default."],
              "safeToRun": ["Synthetic data only. Body cap 2 MB, 10 calls a minute. Free; no account, no key.", "A result too long to send whole keeps its findings 1 hour for get_validation_findings.", "The bundle itself is never kept."],
              "whatItDoes": ["Checks a bundle against the pinned PAS guide.", "Returns an OperationOutcome with a coverage note first.", "Over MCP, a result too long to send whole comes back summarised: coverage, counts, the top findings."],
              "whatItIs": ["The ImOnFHIR validator for Da Vinci PAS Submit Bundles."]
            },
            "com.imonfhir/cost": {
              "free": true
            },
            "com.imonfhir/form": {
              "advanced": ["ig", "version"]
            }
          },
          "digest": "sha256:236f78dd1b33ee10a5ee4775c749373c870008fa08f01b0a40e7992ac46f8b6f"
        }
      ],
      "digest": "sha256:06ed903375256ee216691f5b5dc571794d97eec97ccabafc736b0dcc4719f253"
    }
  }
