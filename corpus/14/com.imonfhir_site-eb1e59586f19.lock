              },
              {
                "args": {
                  "rule_id": "PAS-SEM-PROV-001"
                },
                "id": "rule-prov-001",
                "label": "A rule with no committed anchor (it abstains)"
              }
            ]
          },
          "digest": "sha256:beb0362c72cffec9407e5a01deb778e43ff5a3fcc5e6be9d2d91568fcbb7d745"
        },
        {
          "name": "get_digest_item",
          "title": "Read one digest item",
          "description": "One digest item in full: each claim (question, outcome, impact, stage, next step) with its own evidence record, plus HL7 Jira statuses and canonical_url.",
          "inputSchema": {
