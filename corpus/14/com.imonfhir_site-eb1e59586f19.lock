                    "resourceType": "Patient"
                  },
                  "b": {
                    "birthDate": "1970-01-01",
                    "gender": "female",
                    "id": "synthetic-1",
                    "resourceType": "Patient"
                  }
                },
                "id": "one-field",
                "label": "Two synthetic patients, one field different"
              }
            ]
          },
          "digest": "sha256:f007618e1ed175bc4fcf2e614dc0440785771dada112aa2d247175c14eb99a85"
        },
        {
          "name": "explain_finding",
          "title": "Evidence for a rule or a requirement",
          "description": "The evidence behind a semantic validator rule, not an explanation of it. Give rule_id (a rule id such as PAS-SEM-PROV-001) and get the rule's id, version, title, description, source, category and default severity as the validator states them, plus, only when the rule's explanation entry declares anchors that all resolve, the HL7 statements for them: package, version, key, conformance word, HL7's statement text verbatim (its markdown) and the sha256 of that text. It abstains, with the reason, when no anchor is committed or one does not resolve. 0 of 17 rule explanations have committed anchors; a rule id abstains until its anchors are committed. Or give requirement ({packageId, version, key}) and get that one HL7 statement the same way. An unknown package, version or key is an error, and so is a package version that has a catalog but no committed statement text. Statement text is committed for hl7.fhir.us.davinci-pas@2.2.1; a package version that has a catalog but no committed text is an error. It also returns an instruction block telling your assistant how to use the evidence. It calls nothing outside this site. Prose your assistant writes around the passages is not controlled by ImOnFHIR.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "requirement": {
                "additionalProperties": false,
                "description": "One HL7 statement: its package id, version and statement key, e.g. hl7.fhir.us.davinci-pas, 2.2.1, ainfo-3. Give this or rule_id, not both.",
                "properties": {
                  "key": {
                    "type": "string"
                  },
                  "packageId": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["key", "packageId", "version"],
                "type": "object"
              },
              "rule_id": {
                "description": "A semantic rule id, e.g. PAS-SEM-PROV-001. Give this or requirement, not both.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "abstain": {
                "properties": {
                  "detail": {
                    "type": "string"
                  },
                  "reason": {
                    "enum": ["no-entry", "no-anchors", "no-audience", "unresolved-anchor"]
                  },
                  "unresolved": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["detail", "reason", "unresolved"],
                "type": "object"
              },
              "instruction_block": {
                "properties": {
                  "rules": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["rules", "version"],
                "type": "object"
              },
              "mode": {
                "enum": ["rule", "requirement"]
              },
              "notice": {
                "type": "string"
              },
              "outcome": {
                "enum": ["evidence", "abstained"]
              },
              "passages": {
                "items": {
                  "properties": {
                    "conformance": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "key": {
                      "type": "string"
                    },
                    "licence": {
                      "type": "string"
                    },
                    "package_id": {
                      "type": "string"
                    },
                    "tarball_sha256": {
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "text": {
                      "type": "string"
                    },
                    "text_sha256": {
                      "pattern": "^[0-9a-f]{64}$",
                      "type": "string"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["conformance", "key", "licence", "package_id", "tarball_sha256", "text", "text_sha256", "version"],
                  "type": "object"
                },
                "type": "array"
              },
              "rule": {
                "properties": {
                  "category": {
                    "type": "string"
                  },
                  "default_severity": {
                    "type": "string"
                  },
                  "description": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["category", "default_severity", "description", "id", "source", "title", "version"],
                "type": "object"
              }
            },
            "required": ["instruction_block", "mode", "notice", "outcome", "passages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Evidence for a rule or a requirement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.imonfhir/about": {
              "howToUse": ["Give rule_id, or give requirement with packageId, version and key. Not both."],
              "safeToRun": ["No payload is sent: a rule id or a statement key only.", "Calls nothing outside this site. Read-only. No account, no key.", "Prose your assistant writes around the passages is not controlled by ImOnFHIR."],
              "whatItDoes": ["Given a rule id, returns the rule's main fields and, if it has resolving anchors, HL7's statements.", "With no anchor committed for the rule, it abstains and says why.", "Given a package, version and key, returns that statement; unknown, or with no committed text, is an error.", "Returns an instruction block that tells your assistant how to use the evidence."],
              "whatItIs": ["The evidence behind a validator rule or one HL7 requirement: HL7's own statements, word for word."]
            },
            "com.imonfhir/cost": {
              "free": true
            },
            "com.imonfhir/presets": [
