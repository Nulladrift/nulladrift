              "safeToRun": ["Free. Read-only. No account, no key; nothing you send is stored."],
              "whatItDoes": ["Returns a summary: counts by change type and impact, top profiles, value set changes.", "It gives the risk level and the rule that set it, in plain words.", "It also lists the most serious findings and where the whole report is.", "The whole report is large; it is at POST /api/v1/compare and, for a version pair, on a page."],
              "whatItIs": ["A comparison of two implementation guides, or one guide at two versions."]
