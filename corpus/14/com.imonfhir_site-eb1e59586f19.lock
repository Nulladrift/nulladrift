        {
          "name": "compare_payloads",
          "title": "Compare two payloads",
          "description": "Compare two synthetic FHIR payloads (a resource or a Bundle each, 1 MB at most per side) and report where they differ: which rows are missing or extra, which field paths changed, and counts. It returns no field values; it lists up to 200 rows and 300 field paths (the paths come from the key names in the payloads) and counts the rest. Synthetic data only. The payloads are sent to imonfhir.com for the call and the site does not store them; the browser Compare tool at /lab/compare keeps them on your machine.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "A FHIR resource or Bundle (a JSON object, or a string holding one). Synthetic only.",
                "type": ["object", "string"]
              },
              "b": {
                "description": "The payload to compare it with, in the same form.",
                "type": ["object", "string"]
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "identical": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "paths_listed": {
                "minimum": 0,
                "type": "integer"
              },
              "paths_omitted": {
                "minimum": 0,
                "type": "integer"
              },
              "rows": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "diff_count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "differences": {
                      "items": {
                        "properties": {
                          "path": {
                            "type": "string"
                          },
                          "status": {
                            "enum": ["changed", "a-only", "b-only"]
                          }
                        },
                        "required": ["path", "status"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "equivalent_count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["matched", "a-only", "b-only"]
                    },
                    "matched_by": {
                      "type": ["string", "null"]
                    },
                    "row_key": {
                      "type": "string"
                    },
                    "total_diff_count": {
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["category", "diff_count", "differences", "equivalent_count", "kind", "matched_by", "row_key", "total_diff_count"],
                  "type": "object"
                },
                "type": "array"
              },
              "rows_listed": {
                "minimum": 0,
                "type": "integer"
              },
              "rows_omitted": {
                "minimum": 0,
                "type": "integer"
              },
              "stats": {
                "properties": {
                  "extra_in_b": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "field_diffs": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "matched": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "missing_from_b": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "total": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["extra_in_b", "field_diffs", "matched", "missing_from_b", "total"],
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["identical", "notice", "paths_listed", "paths_omitted", "rows", "rows_listed", "rows_omitted", "stats", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two payloads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.imonfhir/about": {
              "howToUse": ["Give the two payloads as a and b."],
              "safeToRun": ["Synthetic data only.", "Each payload is sent to imonfhir.com; the site does not store it.", "The Compare tool at /lab/compare keeps them on your machine.", "Read-only. No account, no key."],
              "whatItDoes": ["Says where they differ: rows missing or extra, the field paths that changed, and counts.", "Returns no field values; field paths come from key names."],
              "whatItIs": ["A comparison of two synthetic FHIR payloads, a resource or a Bundle each."]
            },
            "com.imonfhir/cost": {
              "free": true
            },
            "com.imonfhir/presets": [
              {
                "args": {
                  "a": {
                    "birthDate": "1970-01-01",
                    "gender": "male",
