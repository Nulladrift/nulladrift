                  },
                  "overlap": {
                    "properties": {
                      "multi_tagged": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "tagged": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "untagged": {
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["multi_tagged", "tagged", "untagged"],
                    "type": "object"
                  },
                  "rule": {
                    "type": "string"
                  },
                  "rule_text": {
                    "type": "string"
                  },
                  "workflows": {
                    "items": {
                      "properties": {
                        "needing_attention": {
                          "minimum": 0,
