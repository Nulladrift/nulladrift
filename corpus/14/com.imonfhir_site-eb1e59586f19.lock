                        },
                        "workflow": {
                          "type": "string"
                        }
                      },
                      "required": ["needing_attention", "workflow"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": ["object", "null"]
              },
              "summary": {
                "const": true
              },
              "top_findings": {
