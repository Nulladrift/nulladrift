                      },
                      "type": ["object", "null"]
                    },
                    "title": {
                      "type": ["string", "null"]
                    },
                    "workgroup": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["canonical_url", "evidence", "evidence_types", "id", "jira", "last_activity", "source_url", "stage", "stage_evidence", "title", "workgroup"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              }
