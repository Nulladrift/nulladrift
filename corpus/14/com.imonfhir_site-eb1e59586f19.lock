                            "type": ["string", "null"]
                          },
                          "resolved": {
                            "type": "boolean"
                          },
                          "source_url": {
                            "type": "string"
                          },
                          "status": {
                            "type": "string"
                          }
                        },
                        "required": ["evidence", "key", "last_verified", "lifecycle", "resolution", "resolved", "source_url", "status"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "last_activity": {
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "stage": {
                      "type": ["string", "null"]
                    },
                    "stage_evidence": {
                      "properties": {
                        "evidence_type": {
                          "type": "string"
                        },
                        "observed_at": {
                          "type": "string"
