      },
      "transport": {
        "type": "http",
        "url": "https://klarframe.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.klarframe/site",
        "title": "Klarframe",
        "version": "1.0.0",
        "description": "Read-only access to Klarframe: AI phone assistants, meeting agents, knowledge system and other products, guides and blog articles in German, English, Spanish and Italian, plus free slots for a 30-minute intro call and a booking link the person completes themselves.",
        "websiteUrl": "https://klarframe.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Klarframe is an AI automation company in Palma de Mallorca. Use list_products and get_product for product facts, search_content for guides and articles, company_info for who Klarframe is. To book a free intro call: get_intro_slots, then prepare_intro_call, then give the person the bookingUrl; they confirm it themselves. Klarframe publishes no prices.",
      "tools": [
        {
          "name": "company_info",
          "title": "Company facts",
          "description": "Facts about Klarframe: what it does, founders, location, languages, how projects are priced, contact and legal pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "de",
                "description": "Answer language: de, en, es or it. Defaults to de.",
                "enum": ["de", "en", "es", "it"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Company facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac8696e92211036227fd009c81a7a64c61da5abbc6e0888e32c7744e5341e034"
        },
        {
          "name": "get_intro_slots",
          "title": "Free intro call slots",
          "description": "Free slots for a free 30-minute video intro call with the Klarframe founders (Monday to Friday afternoons, Madrid time). Returns ISO start times.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 5,
                "description": "How many bookable days to return",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "de",
                "description": "Answer language: de, en, es or it. Defaults to de.",
                "enum": ["de", "en", "es", "it"],
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone for the readable labels, e.g. Europe/Berlin. Defaults to Europe/Madrid.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Free intro call slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b7df7707571c54a6f652884fc93ab1bdd2a58b30ae2080f8b2b85ee25120c44"
        },
        {
          "name": "get_product",
          "title": "Product details",
          "description": "Details of one Klarframe product: what it is, how the rollout works, example scenarios, integrations, privacy and FAQ. Klarframe publishes no prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "de",
                "description": "Answer language: de, en, es or it. Defaults to de.",
                "enum": ["de", "en", "es", "it"],
                "type": "string"
              },
              "slug": {
                "description": "Product slug, e.g. inbound-voice",
                "enum": ["smart-websites", "angebots-veredler", "concierge", "video-avatare", "video-tour-agent", "meeting-agenten", "outbound-voice", "inbound-voice", "live-translator", "ebook-shop", "social-media", "motion", "estate-pulse", "mallorca-excursion", "meeting-language-bridge", "knowledge-os"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:baef9ea2d59ab6cd183dc6f343b9ab70d14621ab2ee80490ccd14dfb09fc5cbd"
        },
        {
          "name": "list_products",
          "title": "List products",
          "description": "All Klarframe products with a one-line summary and the product page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "de",
                "description": "Answer language: de, en, es or it. Defaults to de.",
                "enum": ["de", "en", "es", "it"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List products"
          },
          "behavior": {
            "destructive": false,
