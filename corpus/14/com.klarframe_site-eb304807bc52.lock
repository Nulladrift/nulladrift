            "readOnly": true
          },
          "digest": "sha256:0cff25efc1e64d74d1d47197a02f10548e24de00fdaa12096b5d6738f6e83090"
        },
        {
          "name": "prepare_intro_call",
          "title": "Prepare intro call booking",
          "description": "Checks that an intro call slot is still free and returns a booking link with that slot preselected. Nothing is booked here: the person opens the link and enters name, company and email themselves.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "de",
                "description": "Answer language: de, en, es or it. Defaults to de.",
                "enum": ["de", "en", "es", "it"],
                "type": "string"
              },
              "slot": {
                "description": "ISO start time of a free intro call slot",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["slot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare intro call booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4edd993d188725e51925de9200b20c6bd3868d6dac77d6824624ea02452db98"
        },
        {
          "name": "search_content",
          "title": "Search guides, blog and products",
          "description": "Keyword search over Klarframe product pages, guides (Ratgeber) and blog articles. Returns titles, URLs and a matching sentence. Covers topics such as AI phone assistants, meeting minutes, EU AI Act Article 50, GDPR and costs of AI models.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "de",
                "description": "Answer language: de, en, es or it. Defaults to de.",
                "enum": ["de", "en", "es", "it"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search words, any of the four languages",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
