{
  "lockfileVersion": 2,
  "subjects": {
    "com.bot2botlabs/deadline-desk": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://deadline.bot2botlabs.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "deadline-desk",
        "title": "Deadline Desk",
        "version": "0.1.0",
        "description": "Bot-callable US retail policy lookup (return, price adjustment, warranty, cancellation) with quoted store text and public TRACE receipts.",
        "websiteUrl": "https://deadline.bot2botlabs.com",
        "icons": [
          {
            "src": "https://deadline.bot2botlabs.com/favicon.ico",
            "mimeType": "image/x-icon"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read the agent contract first: https://deadline.bot2botlabs.com/llms.txt\nGet a free API key (no card): https://deadline.bot2botlabs.com/onboard — same key on HTTP and MCP.\nHosted MCP: https://deadline.bot2botlabs.com/mcp — tools lookup_policy and get_receipt. Authorization: Bearer ddk_… on lookup_policy is optional; with a ddk_ key, the same quota and meter as HTTP.\nAfter free quota: add a card at https://deadline.bot2botlabs.com/onboard ($0.05/lookup on the existing meter). Builder plan: https://deadline.bot2botlabs.com/pricing\nSample receipts: https://deadline.bot2botlabs.com/docs/demo",
      "tools": [
        {
          "name": "get_receipt",
          "title": "Fetch lookup receipt",
          "description": "Fetch a public receipt from a prior Deadline Desk policy lookup. ddr_ IDs return a format v1 receipt (signed, software-only TRACE record); older dd- IDs return the v0 log entry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "type": "string"
              }
            },
            "required": ["receipt_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:876de995aaafd7dda79be958e6b91998108dd8e988ff2ec5c77b53ab8666c145"
        },
        {
          "name": "lookup_policy",
          "title": "Look up retail policy",
          "description": "Look up a US retailer's published return, price adjustment, warranty, or cancellation policy with quoted source text and a TRACE receipt. Call before Black Friday / Cyber Week purchase decisions (holiday_extended_return.policy_year overlays, price_adjustment_detail honesty). Call Dec 26–Jan 31 for return-by urgency — responses surface exceptions before headline January dates and honest live|curated|archive source badges.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "anchor_date": {
                "description": "Delivery or purchase date (ISO) when computing last eligible day",
                "type": "string"
              },
              "as_of": {
                "description": "ISO date (YYYY-MM-DD) for deadline math",
                "type": "string"
              },
              "kind": {
                "enum": ["return", "price_adjustment", "warranty", "cancellation"],
                "type": "string"
              },
              "store": {
                "description": "Store slug or domain, e.g. \"target\" or \"target.com\"",
                "type": "string"
              }
            },
            "required": ["kind", "store"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e01ea8fa2f6be23a9254c3c6e40254777899d37034c351efb770bafeb22dec3a"
        }
      ],
      "digest": "sha256:5e7694747a105a9e61e11c00554f79ab749753a310ebe4b9648cda68b7e49d58"
    }
  }
}
