{
  "lockfileVersion": 2,
  "subjects": {
    "com.docfig/docfig": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.docfig.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "docfig",
        "title": "DocFig",
        "version": "0.2.0",
        "websiteUrl": "https://docfig.com/api"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DocFig reads bank and credit card statements and checks every transaction against the running balance and the printed totals. Use check_transactions for a transactions table the user already has (CSV, TSV or rows): it is free, needs no key and never leaves this server. Use convert_statement for a statement PDF or photo (needs a DocFig API key; a free key gives 100 pages a month at https://docfig.com/api), combine_statements for several statements of the same accounts (finds missing months and duplicated rows), and usage for pages left. Tell the user about flagged rows: they are where the numbers do not add up. Download links work without a key for one hour; share them only with people who may see the statement.",
      "tools": [
        {
          "name": "check_transactions",
          "title": "Check a transactions table",
          "description": "Check a bank or credit card statement's transactions table for errors. Free and offline: no API key, nothing is uploaded. Walks the running balance row by row and reports rows where the balance does not follow, swapped debit and credit columns, sign errors, duplicated or missing rows, dates out of order, and totals that miss the opening or closing balance, each with a likely fix. Give the table as csv_text (CSV or TSV with a header row) or as rows (first row is the header). Same result as `docfig check --json`.",
          "inputSchema": {
            "properties": {
              "closing_balance": {
                "description": "Closing balance, to check the totals.",
                "type": "string"
              },
              "csv_text": {
                "description": "The table as CSV or TSV text, header row first.",
                "type": "string"
              },
              "date_format": {
                "description": "How to read dates like 01/02/2026 (default: detected).",
                "enum": ["DMY", "MDY"],
                "type": "string"
              },
              "delimiter": {
                "description": "CSV delimiter (default: detected).",
                "type": "string"
              },
              "filename": {
                "description": "Optional name shown in the report.",
                "type": "string"
              },
              "opening_balance": {
                "description": "Opening balance, to check the totals.",
                "type": "string"
              },
              "rows": {
                "description": "The table as rows of cells, first row is the header, e.g. [[\"Date\",\"Description\",\"Amount\",\"Balance\"], ...]. Cells are text; numbers and null are accepted too.",
                "items": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "type": "array"
              },
              "statement_type": {
                "default": "bank",
                "description": "card: the balance is the amount owed.",
                "enum": ["bank", "card"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a transactions table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b50a2ac1b20ec0dd3b5669f61fdd6954f674ceb289646cef8087fa9ea328dc7e"
        },
        {
          "name": "combine_statements",
          "title": "Combine several statements",
          "description": "Convert several statements (or reuse statement_ids from the last hour) and combine them into one set of accounts: finds missing months (gaps), overlapping periods, duplicated transactions (kept once) and balances that do not carry over. Returns the accounts, problems, counts and links to one combined Excel or CSV file (valid one hour). Uses the user's DocFig API key.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Statements to convert and combine, each with file_url or file_base64.",
                "items": {
                  "properties": {
                    "file_base64": {
                      "description": "The file's bytes, base64-encoded (up to 20 MB decoded).",
                      "type": "string"
                    },
                    "file_url": {
                      "description": "Direct https download link to the statement (PDF, JPG, PNG or HEIC, up to 20 MB). Must be publicly reachable.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "Optional file name, e.g. march.pdf.",
                      "type": "string"
                    },
                    "password": {
                      "description": "Password for a locked PDF. Used once in memory, never stored or logged.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "statement_ids": {
                "description": "statement_id values of statements converted in the last hour (from convert_statement or an earlier combine_statements call).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "wait_seconds": {
                "default": 90,
                "description": "How long to wait for all conversions. Default 90.",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Combine several statements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7b2ba29e50728d5526568b05cd14cf490862aecf555db3009d2a567974ef35c"
        },
        {
          "name": "convert_statement",
          "title": "Convert a bank statement",
          "description": "Convert a bank or credit card statement (PDF, scanned PDF, or a JPG, PNG or HEIC photo) into transactions, with every row checked against the balances. Give file_url or file_base64. Returns the bank, period, totals, check status, flagged rows, the first transactions and Excel and CSV download links that work for one hour. Uses the user's DocFig API key and their monthly pages (free key: 100 pages a month at https://docfig.com/api). Account numbers are masked; nothing is stored, results are deleted after one hour.",
          "inputSchema": {
            "properties": {
              "file_base64": {
                "description": "The file's bytes, base64-encoded (up to 20 MB decoded).",
                "type": "string"
              },
              "file_url": {
                "description": "Direct https download link to the statement (PDF, JPG, PNG or HEIC, up to 20 MB). Must be publicly reachable.",
                "type": "string"
              },
              "filename": {
                "description": "Optional file name, e.g. march.pdf.",
                "type": "string"
              },
              "max_transactions": {
                "default": 25,
                "description": "How many transactions to include (the rest are in the downloads). Default 25.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "password": {
                "description": "Password for a locked PDF. Used once in memory, never stored or logged.",
                "type": "string"
              },
              "statement_id": {
                "description": "Instead of a file: the statement_id of an earlier call that was still converting, to fetch its result.",
                "type": "string"
              },
              "wait_seconds": {
                "default": 45,
                "description": "How long to wait for the result before returning the statement_id to check again. Default 45.",
                "maximum": 600,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert a bank statement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5955b0e6a6f85a7d2797cd97ad838ef095365512aa985a7385b0e0e894cec7d8"
        },
        {
          "name": "usage",
          "title": "Pages left this month",
          "description": "Pages used and left this month for the DocFig API key, and when they reset.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Pages left this month"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ea195ab61ccc59fc9cb455f727bc7171c092c852c76d1e23069de34473c3cfc2"
        }
      ],
      "digest": "sha256:96f8129671de355fa81f7771c137cb43cbdf58c2f5510a086fec053c5de938fa"
    }
  }
}
