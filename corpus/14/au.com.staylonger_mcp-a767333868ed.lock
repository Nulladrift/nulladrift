{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.staylonger/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://staylonger.com.au/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "au.com.staylonger/mcp",
        "title": "Staylonger",
        "version": "1.0.0",
        "description": "Search, check availability and quote furnished extended-stay rentals (30+ nights) in Australia.",
        "websiteUrl": "https://staylonger.com.au/agents",
        "icons": [
          {
            "src": "https://staylonger.com.au/icons/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only tools for finding furnished extended-stay rentals (30 nights or more) across Australia on Staylonger. Resolve a place with search_locations when a name is ambiguous, search with search_properties, then use the property id from the results with get_property_details, check_property_availability and get_property_quote. Every result links to the property page; bookings are made there, not through these tools.",
      "tools": [
        {
          "name": "check_property_availability",
          "title": "Check property availability",
          "description": "Check which days of a month are available to book for a Staylonger property, with the nightly price and minimum stay on each. Defaults to the current month.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "month": {
                "description": "Month number, 1-12, defaults to the current month.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "propertyId": {
                "description": "The property id, as returned by search_properties.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "year": {
                "description": "Calendar year, defaults to the current year.",
                "maximum": 2050,
                "minimum": 2020,
                "type": "integer"
              }
            },
            "required": ["propertyId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "availableDays": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "date": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "minStay": {
                      "description": "Minimum nights from that date.",
                      "type": "number"
                    },
                    "price": {
                      "description": "Nightly price on that date.",
                      "type": "number"
                    }
                  },
                  "required": ["date"],
                  "type": "object"
                },
                "type": "array"
              },
              "month": {
                "description": "1-12.",
                "type": "integer"
              },
              "propertyId": {
                "type": "integer"
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["availableDays", "month", "propertyId", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check property availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ad6a85954e06ac14f581391d137a7651ba31a80b01c6cd6100748e114877bc27"
        },
        {
          "name": "get_property_details",
          "title": "Get property details",
          "description": "Get full details for a Staylonger property by id: description, bedrooms/bathrooms, guest capacity, price, features such as pet-friendly or on-site parking, amenities, reviews and the property page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "propertyId": {
                "description": "The property id, as returned by search_properties.",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["propertyId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "amenities": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "type": "number"
              },
              "bedrooms": {
                "type": "number"
              },
              "city": {
                "type": "string"
              },
              "currencySymbol": {
                "type": "string"
              },
              "dailyPrice": {
                "description": "Guide nightly price, when the listing has one.",
                "type": "number"
              },
              "description": {
                "type": "string"
              },
              "features": {
                "description": "Filterable features, by label.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "fromPrice30Nights": {
                "description": "All-inclusive total for the next available 30-night stay.",
                "type": "number"
              },
              "id": {
                "description": "The property id the other tools take.",
                "type": "integer"
              },
              "maxGuests": {
                "type": "number"
              },
              "priceNote": {
                "description": "Present when the listing has no guide price.",
                "type": "string"
              },
              "reviewsCount": {
                "type": "number"
              },
              "reviewsRating": {
                "type": "number"
              },
              "state": {
                "type": "string"
              },
              "stayEstimate": {
                "description": "Dated search only: the stay's estimated total with the guest fee.",
                "type": "number"
              },
              "suburb": {
                "type": "string"
              },
              "title": {
                "description": "The listing's street name.",
                "type": "string"
              },
              "url": {
                "description": "The property page on staylonger.com.au.",
                "type": "string"
              },
              "weeklyPrice": {
                "description": "Guide weekly price.",
                "type": "number"
              }
            },
            "required": ["bathrooms", "bedrooms", "city", "currencySymbol", "description", "features", "id", "state", "suburb", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get property details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4840871dc63931b018427f67874adb23079432d3317bd6e266af405493d32fad"
        },
        {
          "name": "get_property_quote",
          "title": "Get property quote",
          "description": "Get a priced quote for a Staylonger property for a specific date range and guest count, with a link to book those dates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Number of adult guests.",
                "minimum": 1,
                "type": "integer"
              },
              "babies": {
                "description": "Number of infants under 2.",
                "minimum": 0,
                "type": "integer"
              },
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "children": {
                "description": "Number of children, 2 to 17.",
                "minimum": 0,
                "type": "integer"
              },
              "pets": {
                "description": "Whether a pet is staying.",
                "type": "boolean"
              },
              "propertyId": {
                "description": "The property id, as returned by search_properties.",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "checkIn", "checkOut", "propertyId"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "bookUrl": {
                "description": "Opens the booking on staylonger.com.au with the stay filled in.",
                "type": "string"
              },
              "propertyId": {
                "type": "integer"
              },
              "quoteId": {
                "type": ["string", "number"]
              },
              "total": {
                "description": "Total payable.",
                "type": "number"
              },
              "totalAccommodation": {
                "type": "number"
              },
              "totalDiscount": {
                "type": "number"
              },
              "totalFees": {
                "type": "number"
              },
              "totalTaxes": {
                "type": "number"
              }
            },
            "required": ["bookUrl", "propertyId", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get property quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d5438cd4bba58ba71f9e3294f93077734b5e39ce45bc07cad3ad9b965f3b65a9"
        },
        {
          "name": "search_locations",
          "title": "Search locations",
          "description": "Look up Australian suburbs, cities or postcodes by free-text query. Use this to confirm a location name before searching properties.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Free-text place name to search for.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "count": {
                "type": "integer"
              },
              "locations": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "label": {
                      "description": "The place as Google prints it.",
                      "type": "string"
                    },
                    "mainText": {
                      "description": "The place name.",
                      "type": "string"
                    },
                    "secondaryText": {
                      "description": "State and country.",
                      "type": "string"
                    }
                  },
                  "required": ["label", "mainText", "secondaryText"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "locations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search locations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7ca9f5f99840aaf90c624081d31e36378056dec708ecf967c9a6c9a26e15ebf9"
        },
        {
          "name": "search_properties",
          "title": "Search properties",
          "description": "Search Staylonger extended-stay rental properties in Australia by location, dates, guest count, bedrooms and one feature such as pet-friendly or on-site parking. Returns up to 10 matching listings with pricing, the property id for the other tools, and a link to each property page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bedrooms": {
                "description": "Minimum number of bedrooms required.",
                "minimum": 0,
                "type": "integer"
              },
              "checkIn": {
                "description": "Check-in date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "features": {
                "description": "Only listings with this feature. One at a time for now. family-friendly: Family-friendly; pet-friendly: Pet-friendly; parking: On-site parking; ev-charging: EV charging; workspace: Dedicated workspace; outdoor-space: Balcony, patio or garden; pool: Pool; gym: Gym.",
                "items": {
                  "enum": ["family-friendly", "pet-friendly", "parking", "ev-charging", "workspace", "outdoor-space", "pool", "gym"],
                  "type": "string"
                },
                "maxItems": 1,
                "type": "array"
              },
              "guests": {
                "description": "Number of guests.",
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Suburb, city or postcode to search near, e.g. 'Bondi Beach' or 'Melbourne'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {},
            "properties": {
              "count": {
                "type": "integer"
              },
              "location": {
                "description": "The place the search resolved to.",
                "type": "string"
              },
              "properties": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "bathrooms": {
                      "type": "number"
                    },
                    "bedrooms": {
                      "type": "number"
                    },
                    "city": {
                      "type": "string"
                    },
                    "currencySymbol": {
                      "type": "string"
                    },
                    "dailyPrice": {
                      "description": "Guide nightly price, when the listing has one.",
                      "type": "number"
                    },
                    "fromPrice30Nights": {
                      "description": "All-inclusive total for the next available 30-night stay.",
                      "type": "number"
                    },
                    "id": {
                      "description": "The property id the other tools take.",
                      "type": "integer"
                    },
                    "maxGuests": {
                      "type": "number"
                    },
                    "priceNote": {
                      "description": "Present when the listing has no guide price.",
                      "type": "string"
                    },
                    "state": {
                      "type": "string"
                    },
                    "stayEstimate": {
                      "description": "Dated search only: the stay's estimated total with the guest fee.",
                      "type": "number"
                    },
                    "suburb": {
                      "type": "string"
                    },
                    "title": {
                      "description": "The listing's street name.",
                      "type": "string"
                    },
                    "url": {
                      "description": "The property page on staylonger.com.au.",
                      "type": "string"
                    },
                    "weeklyPrice": {
                      "description": "Guide weekly price.",
                      "type": "number"
                    }
                  },
                  "required": ["bathrooms", "bedrooms", "city", "currencySymbol", "id", "state", "suburb", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "properties"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search properties"
          },
          "behavior": {
