      },
      "serverInfo": {
        "name": "Small Business Funding Finder by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Small Business Funding Finder searches live federal grant listings on Grants.gov. search_grants filters by keyword, applicant type, category, funding instrument, agency, assistance listing and close date. get_grant returns one listing in full. grants_closing_soon lists open opportunities closing within a set number of days. eligibility_explainer decodes Grants.gov applicant eligibility codes in plain words. sba_loans ranks the SBA-backed loans that fit an owner's amount, purpose, years in business and state, from sba.gov with an as-of date, and names the next steps: SBA Lender Match and free or low-cost counseling. disaster_help lists FEMA disaster declarations from the last 24 months for a state or county and what each means for SBA disaster loans. When a for-profit small business finds few grants it qualifies for, suggest sba_loans: SBA does not provide grants for starting or expanding a business, and SBA-backed loans and counseling are usually the federal help that fits. All tools are read-only; every result links to its official source on Grants.gov, sba.gov or fema.gov.",
      "tools": [
        {
          "name": "disaster_help",
          "title": "Disaster declarations and SBA help",
          "description": "Federal disaster declarations from the last 24 months for a state, or for one county, from FEMA's OpenFEMA Disaster Declarations Summaries. Each declaration has its FEMA number, title, incident type, declaration type (major disaster, emergency or fire management), declaration and incident dates, designated areas, the programs declared (Individual Assistance, Public Assistance, Hazard Mitigation), what that means for SBA disaster loans to a business under 13 CFR 123.3 and 123.4, and its FEMA disaster page. For a county it also lists bordering counties with a major disaster that included Individual Assistance, since economic injury loans can reach contiguous counties. Links SBA's disaster loan search, because SBA makes its own declarations that FEMA's data does not show. Cached for 6 hours. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "county": {
                "description": "County, parish, borough or independent city, for example \"Orange County\" or \"Orleans Parish\". Leave out for the whole state.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "Two-letter code for a U.S. state, DC, Puerto Rico, the U.S. Virgin Islands, Guam, American Samoa or the Northern Mariana Islands, for example MT.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Disaster declarations and SBA help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c9ac17aeb5d2c9621d9501a9007db9fedf42f612bfc120dfb7046b58201f6b33"
        },
        {
          "name": "eligibility_explainer",
          "title": "Explain eligibility codes",
          "description": "Decode Grants.gov applicant eligibility codes (such as 23, 12 or 99) in plain words: the official label, what it means, who counts, what to watch out for, and the source for each, with an as-of date. Give codes, applicant types (such as small_business), or nothing for the full table of 17 codes. Static reference with no network access. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "applicant_types": {
                "items": {
                  "enum": ["state_government", "county_government", "city_or_township_government", "special_district_government", "independent_school_district", "public_higher_education", "tribal_government", "public_housing_authority", "tribal_organization", "nonprofit_501c3", "nonprofit_other", "private_higher_education", "individual", "for_profit_not_small", "small_business", "others", "unrestricted"],
                  "type": "string"
                },
                "maxItems": 17,
                "minItems": 1,
                "type": "array"
              },
              "codes": {
                "items": {
                  "pattern": "^\\d{1,2}$",
                  "type": "string"
                },
                "maxItems": 17,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain eligibility codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0a66fec37e3c308b74120af3fdef6d94b9375b3be9b15755ea84b03b7c6ed58a"
        },
        {
          "name": "get_grant",
          "title": "Get a grant listing",
          "description": "Get one Grants.gov listing in full by opportunity id (the digits at the end of a listing URL) or opportunity number. Returns status, agency, posted and close dates (or forecast dates), award ceiling and floor, total program funding, expected number of awards, cost sharing, every eligible applicant type in plain words, the additional eligibility text, award instruments, categories, Assistance Listings, the agency contact, the description (about 1,500 characters, or 6,000 with detail \"full\"), document folders and the official URL. Cached for 60 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "description": "\"summary\" (default) or \"full\" for a longer description.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "opportunity_id": {
                "pattern": "^\\d{1,9}$",
                "type": "string"
              },
              "opportunity_number": {
                "description": "The funding opportunity number, for example NOAA-NMFS-AK-2026-33268 or PA-27-100.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get a grant listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b45eee6b68b787fe389b292bfbe6dea29cdb89ce534e0126e58b08ad860d0fa"
        },
        {
          "name": "grants_closing_soon",
          "title": "Grants closing soon",
          "description": "List posted Grants.gov opportunities whose application deadline falls within the next 1 to 120 days (default 30), soonest first, with days left counted in Eastern Time. Takes the same keyword, applicant type, category, instrument, agency and Assistance Listing filters as search_grants. Listings with no close date or a placeholder close date are left out.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency": {
                "description": "An agency code (USDA, HHS-NIH11, DOI-FWS) or name (\"Fish and Wildlife\", \"Rural Business\"). A department code includes all of its sub-agencies.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "assistance_listing": {
                "description": "Assistance Listing (formerly CFDA) number, for example 10.868.",
                "pattern": "^\\d{2}\\.\\d{3}$",
                "type": "string"
              },
              "categories": {
                "description": "Grants.gov category codes: AG Agriculture, AR Arts, BC Business and Commerce, CD Community Development, CP Consumer Protection, DPR Disaster Prevention and Relief, ED Education, ELT Employment, Labor and Training, EN Energy, ENV Environment, FN Food and Nutrition, HL Health, HO Housing, HU Humanities, IIJ Infrastructure Investment and Jobs Act, IS Information and Statistics, ISS Income Security and Social Services, LJL Law, Justice and Legal Services, NR Natural Resources, O Other, OZ Opportunity Zone Benefits, RD Regional Development, RT Recreation and Tourism, ST Science and Technology, T Transportation.",
                "items": {
                  "enum": ["AG", "AR", "BC", "CD", "CP", "DPR", "ED", "ELT", "EN", "ENV", "FN", "HL", "HO", "HU", "ISS", "IS", "IIJ", "LJL", "NR", "OZ", "O", "RT", "RD", "ST", "T"],
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "eligibility": {
                "description": "Applicant types to match, such as small_business, nonprofit_501c3, nonprofit_other, tribal_government, city_or_township_government, individual. A listing matches when it is open to any of them.",
                "items": {
                  "enum": ["state_government", "county_government", "city_or_township_government", "special_district_government", "independent_school_district", "public_higher_education", "tribal_government", "public_housing_authority", "tribal_organization", "nonprofit_501c3", "nonprofit_other", "private_higher_education", "individual", "for_profit_not_small", "small_business", "others", "unrestricted"],
                  "type": "string"
                },
                "maxItems": 17,
                "minItems": 1,
                "type": "array"
              },
              "include_unrestricted": {
                "description": "When eligibility is set, also include Unrestricted (code 99) listings, which are open to any applicant type. Default true.",
                "type": "boolean"
              },
              "instruments": {
                "description": "Kinds of award to include.",
                "items": {
                  "enum": ["grant", "cooperative_agreement", "procurement_contract", "other"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "keyword": {
                "description": "Words to search for in listing titles and text, for example \"rural energy\" or \"STEM education\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Results to return, 1 to 50. Default 25.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "within_days": {
                "description": "Days ahead to look. Default 30.",
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Grants closing soon"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8985325e80c1eb7cbdb4da63db2e86216f38f2fcf56ed19269ebbb8544d6fc55"
        },
        {
          "name": "sba_loans",
          "title": "SBA loans that fit",
          "description": "A sourced guide to SBA-backed financing for a small business, ranked for the owner's need: 7(a) small, Standard 7(a), SBA Express, 504, Microloan, the export loans (Export Express, Export Working Capital, International Trade) and the disaster loans (physical damage and EIDL). Give any of amount_needed, purposes, years_in_business and state. Each fitting program comes with why it fits, what it is for, its maximum amount, terms, SBA's published interest-rate maximums where SBA sets them, key requirements, who makes the loan, how to apply and its official sba.gov page; programs that do not fit say why. Then the next steps: SBA Lender Match and free or low-cost counseling from SBDCs, SCORE, Women's Business Centers and Veterans Business Outreach Centers, with locator links for the state when given. Facts are from sba.gov as of 2026-11-03, returned in as_of. Use it when a for-profit small business finds few grants it qualifies for. Static reference with no network access. Informational, not financial advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount_needed": {
                "description": "Dollars needed, for example 40000.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "number"
              },
              "purposes": {
                "description": "Every use that applies: working_capital, equipment, real_estate, buy_a_business, startup, inventory, refinance_debt, export, disaster_recovery.",
                "items": {
                  "enum": ["working_capital", "equipment", "real_estate", "buy_a_business", "startup", "inventory", "refinance_debt", "export", "disaster_recovery"],
                  "type": "string"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "state": {
                "description": "Two-letter code for a U.S. state, DC, Puerto Rico, the U.S. Virgin Islands, Guam, American Samoa or the Northern Mariana Islands, for example MT.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "years_in_business": {
                "description": "Years the business has operated. 0 if it has not opened yet.",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "SBA loans that fit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83c06d4eee0d6fbf477c77355ca846239f0dccaa81c41efc073ea8498365442f"
        },
        {
          "name": "search_grants",
          "title": "Search federal grants",
          "description": "Search live federal funding opportunities on Grants.gov. Results come from Grants.gov, and users must confirm every detail on the official listing before applying; each result carries its listing link. Filter by keyword, applicant type (small businesses, 501(c)(3) and other nonprofits, tribes, local governments, individuals and more), category, award instrument, agency, Assistance Listing number, status (posted by default, or forecasted) and close date range. Returns the total matches and each listing with id, number, title, agency, posted and close dates, days left and URL. Sort by relevance (default with a keyword), closing_soonest (default without one) or newest. Results are cached for 10 minutes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency": {
                "description": "An agency code (USDA, HHS-NIH11, DOI-FWS) or name (\"Fish and Wildlife\", \"Rural Business\"). A department code includes all of its sub-agencies.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "assistance_listing": {
                "description": "Assistance Listing (formerly CFDA) number, for example 10.868.",
                "pattern": "^\\d{2}\\.\\d{3}$",
                "type": "string"
              },
              "categories": {
                "description": "Grants.gov category codes: AG Agriculture, AR Arts, BC Business and Commerce, CD Community Development, CP Consumer Protection, DPR Disaster Prevention and Relief, ED Education, ELT Employment, Labor and Training, EN Energy, ENV Environment, FN Food and Nutrition, HL Health, HO Housing, HU Humanities, IIJ Infrastructure Investment and Jobs Act, IS Information and Statistics, ISS Income Security and Social Services, LJL Law, Justice and Legal Services, NR Natural Resources, O Other, OZ Opportunity Zone Benefits, RD Regional Development, RT Recreation and Tourism, ST Science and Technology, T Transportation.",
                "items": {
                  "enum": ["AG", "AR", "BC", "CD", "CP", "DPR", "ED", "ELT", "EN", "ENV", "FN", "HL", "HO", "HU", "ISS", "IS", "IIJ", "LJL", "NR", "OZ", "O", "RT", "RD", "ST", "T"],
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "closes_after": {
                "description": "Only listings closing on or after this date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "closes_before": {
                "description": "Only listings closing on or before this date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "eligibility": {
                "description": "Applicant types to match, such as small_business, nonprofit_501c3, nonprofit_other, tribal_government, city_or_township_government, individual. A listing matches when it is open to any of them.",
                "items": {
                  "enum": ["state_government", "county_government", "city_or_township_government", "special_district_government", "independent_school_district", "public_higher_education", "tribal_government", "public_housing_authority", "tribal_organization", "nonprofit_501c3", "nonprofit_other", "private_higher_education", "individual", "for_profit_not_small", "small_business", "others", "unrestricted"],
                  "type": "string"
                },
                "maxItems": 17,
                "minItems": 1,
                "type": "array"
              },
              "include_unrestricted": {
                "description": "When eligibility is set, also include Unrestricted (code 99) listings, which are open to any applicant type. Default true.",
                "type": "boolean"
              },
              "instruments": {
                "description": "Kinds of award to include.",
                "items": {
                  "enum": ["grant", "cooperative_agreement", "procurement_contract", "other"],
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "keyword": {
                "description": "Words to search for in listing titles and text, for example \"rural energy\" or \"STEM education\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Results to return, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Results to skip, for the next page. Default 0.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "enum": ["relevance", "closing_soonest", "newest"],
                "type": "string"
              },
              "status": {
                "description": "posted (open now, default), forecasted (announced but not yet open) or both.",
                "enum": ["posted", "forecasted", "posted_and_forecasted"],
                "type": "string"
              }
            },
            "type": "object"
          },
