{
  "lockfileVersion": 2,
  "subjects": {
    "co.byondr/receipt-maker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://byondr.co/receipt-maker/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Receipt Maker",
        "version": "0.1.0",
        "websiteUrl": "https://byondr.co/receipt-maker",
        "icons": [
          {
            "src": "https://byondr.co/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://byondr.co/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "byondr Receipt Maker. Call list_templates for a template slug, then make_receipt with the template, items (name, qty and unit_price as decimal strings) and accept_terms: true. Anything you leave out uses the template's sample, so pass an empty array to clear discounts or messages. A logo goes in as file_id (from create_upload), a public https url or base64, up to 2 MB and, for a PNG or JPEG, 2 megapixels (for example 1600×1250). make_barcode returns a PNG or SVG. Download links expire after 24 hours. Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited. If a call asks for payment (HTTP 402 or an x402 payment request), ask the user before paying.",
      "tools": [
        {
          "name": "calculate_sales_tax",
          "description": "Work out sales tax exactly, in whole minor units. mode \"add\": amount is the price before tax. mode \"extract\": amount already includes the tax, and the net price and the tax inside it are returned. rate is a percentage like \"8.25\". Money is a decimal string. Returns net, tax and gross as decimal strings rounded to the currency's decimals (default 2). Free. Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "The price, as a decimal string like 100.00",
                "pattern": "^\\d{1,12}(\\.\\d{1,4})?$",
                "type": "string"
              },
              "currency": {
                "description": "Only decimals matters here (0, 2 or 3); default 2 decimals",
                "properties": {
                  "decimal": {
                    "enum": [".", ","],
                    "type": "string"
                  },
                  "decimals": {
                    "anyOf": [
                      {
                        "const": 0,
                        "type": "number"
                      },
                      {
                        "const": 2,
                        "type": "number"
                      },
                      {
                        "const": 3,
                        "type": "number"
                      }
                    ]
                  },
                  "position": {
                    "enum": ["before", "after"],
                    "type": "string"
                  },
                  "symbol": {
                    "maxLength": 5,
                    "minLength": 1,
                    "type": "string"
                  },
                  "thousands": {
                    "enum": [",", ".", " ", ""],
                    "type": "string"
                  }
                },
                "required": ["decimal", "decimals", "position", "symbol", "thousands"],
                "type": "object"
              },
              "mode": {
                "description": "add: amount is before tax. extract: amount includes tax",
                "enum": ["add", "extract"],
                "type": "string"
              },
              "rate": {
                "description": "Tax rate in percent, like \"8.25\"",
                "pattern": "^\\d{1,12}(\\.\\d{1,4})?$",
                "type": "string"
              }
            },
            "required": ["amount", "mode", "rate"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "gross": {
                "type": "string"
              },
              "net": {
                "type": "string"
              },
              "tax": {
                "type": "string"
              }
            },
            "required": ["gross", "net", "tax"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate sales tax"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:acbab6d809f1fe57b0bd305d887739e1b7653b37bd7c460769fa9cbadfb0b74d"
        },
        {
          "name": "calculate_tip",
          "description": "Work out a tip and split a bill between people, in whole cents. round \"none\" rounds the tip to the cent; \"up-total\" rounds the total up to the next whole unit; \"up-each\" rounds each person's share up to the next whole unit and the total becomes shares times people. Returns tip, total and per_person as decimal strings. Free. Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bill": {
                "description": "The bill before the tip, as a decimal string like 87.40",
                "pattern": "^\\d{1,12}(\\.\\d{1,4})?$",
                "type": "string"
              },
              "people": {
                "description": "How many people share the bill",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "percent": {
                "description": "Tip in percent, like \"18\"",
                "pattern": "^\\d{1,12}(\\.\\d{1,4})?$",
                "type": "string"
              },
              "round": {
                "description": "none: to the cent. up-total: round the total up. up-each: round each share up",
                "enum": ["none", "up-total", "up-each"],
                "type": "string"
              }
            },
            "required": ["bill", "people", "percent", "round"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "per_person": {
                "type": "string"
              },
              "tip": {
                "type": "string"
              },
              "total": {
                "type": "string"
              }
            },
            "required": ["per_person", "tip", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate a tip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f80518f54244237ba8302dd7e0031de91cc5f2337d39f53828a77135770fccff"
        },
        {
          "name": "create_upload",
          "description": "Get a one-hour signed upload URL for a logo file (PNG, JPEG or SVG, up to 2 MB; a PNG or JPEG at most 2 megapixels) that sits on disk. PUT the raw bytes to upload_url with a Content-Length header, then pass file_id as make_receipt's logo.file_id. Free. Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bytes": {
                "description": "Exact size of the file you will upload, in bytes (at most 2 MB)",
                "maximum": 2097152,
                "minimum": 1,
                "type": "integer"
              },
              "filename": {
                "description": "Original file name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["bytes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "type": "string"
              },
              "file_id": {
                "type": "string"
              },
              "max_bytes": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "method": {
                "const": "PUT",
                "type": "string"
              },
              "upload_url": {
                "type": "string"
              }
            },
            "required": ["expires_at", "file_id", "max_bytes", "method", "upload_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create upload URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:072b67ffbb3670acda8d33cdc6f965617d717789e6112a5d252ba56c43e218a0"
        },
        {
          "name": "list_templates",
          "description": "List the receipt templates make_receipt can use, each with its slug, name, category and kind (brand or generic). Filter by category, kind or a query on the name or slug. Call this first to get a slug. Free. Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Only templates in this category",
                "enum": ["retail", "food", "travel", "services", "finance", "health", "other"],
                "type": "string"
              },
              "kind": {
                "description": "brand or generic templates only",
                "enum": ["brand", "generic"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for in the template name or slug",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "templates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "kind", "name", "slug"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["templates"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List receipt templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48b6db14cd36c0ba5f736e08330fb523c56235031fe52883193bf3a04882d981"
        },
        {
          "name": "make_barcode",
          "description": "Make a barcode image on white, with quiet zones and the readable text under a 1-D code, and get a 24-hour download link. type is code128 (printable ASCII, up to 48 characters), ean13 (12 digits, or 13 with a check digit that must match), upca (11 digits, or 12 with a check digit that must match) or qr (up to 300 characters). format is png (default) or svg. Returns url, expires_at and text, what a reader will decode (including the check digit). Free within a daily quota counted in documents (see start.md). Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "default": "png",
                "description": "File type of the barcode",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "type": {
                "description": "Barcode type",
                "enum": ["code128", "ean13", "upca", "qr"],
                "type": "string"
              },
              "value": {
                "description": "What to encode",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["type", "value"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["expires_at", "text", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Make a barcode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:db231382e379c4e154f3122c18525aa5a04a22b6c5e99ca165c62b28b8d4deca"
        },
        {
          "name": "make_receipt",
          "description": "Make a receipt file from a template, with your own items, and get a 24-hour download link. Call list_templates for a slug first. Set accept_terms to true. items is required (1 to 200): name, qty and unit_price as decimal strings like \"4.50\", never numbers; subtotal, tax and total are worked out for you. Every other field you leave out (store name and address, date, currency, tax, payment, discounts, extra_lines, messages, barcode) uses the template's sample value, so pass an empty array to clear discounts, extra_lines or messages. format is png (default), jpeg or pdf. An optional logo goes on top: PNG, JPEG or SVG up to 2 MB (a PNG or JPEG at most 2 megapixels, for example 1600×1250; resize a bigger one first), as file_id (from create_upload), url or data_base64; it replaces the template's logo, and header.logo \"none\" removes the template's logo. Returns url, expires_at, the delivered image size in pixels (for a PDF, the page at 1x), the totals as formatted strings, and notes for anything that was left out or cut. Free within a daily quota counted in documents (see start.md). Make receipts only for lawful purposes, such as replacing a lost receipt, bookkeeping, testing or design mockups. Using a receipt to deceive anyone, including for refunds, expense claims or proof of purchase, is prohibited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accept_terms": {
                "const": true,
                "description": "Must be true: you agree to the acceptable-use policy in this tool's description",
                "type": "boolean"
              },
              "barcode": {
                "properties": {
                  "type": {
                    "enum": ["code128", "ean13", "upca", "qr"],
                    "type": "string"
                  },
                  "value": {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["type", "value"],
                "type": "object"
              },
              "currency": {
                "description": "Symbol, decimals (0, 2 or 3) and number format; fields you leave out keep the template's",
                "properties": {
                  "decimal": {
                    "enum": [".", ","],
                    "type": "string"
                  },
                  "decimals": {
                    "anyOf": [
                      {
                        "const": 0,
                        "type": "number"
                      },
                      {
                        "const": 2,
                        "type": "number"
                      },
                      {
                        "const": 3,
                        "type": "number"
                      }
                    ]
                  },
                  "position": {
                    "enum": ["before", "after"],
                    "type": "string"
                  },
                  "symbol": {
                    "maxLength": 5,
                    "minLength": 1,
                    "type": "string"
                  },
                  "thousands": {
                    "enum": [",", ".", " ", ""],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "date_format": {
                "enum": ["MM/DD/YYYY", "DD/MM/YYYY", "YYYY-MM-DD", "DD.MM.YYYY"],
                "type": "string"
              },
              "datetime": {
                "type": "string"
              },
              "discounts": {
                "items": {
                  "properties": {
                    "amount": {
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "label"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "extra_lines": {
                "items": {
                  "properties": {
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "value": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "format": {
                "default": "png",
                "description": "File type of the receipt",
                "enum": ["png", "pdf", "jpeg"],
                "type": "string"
              },
              "header": {
                "description": "Seller name, address lines, alignment and logo choice; fields you leave out keep the template's",
                "properties": {
                  "align": {
                    "enum": ["left", "center", "right"],
                    "type": "string"
                  },
                  "lines": {
                    "items": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  "logo": {
                    "description": "none removes the template's built-in logo; template keeps it",
                    "enum": ["none", "template"],
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "items": {
                "description": "What was bought: name, qty and unit_price (decimal strings; a negative price is a refund line), with optional sku and note",
                "items": {
                  "properties": {
                    "name": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "qty": {
                      "type": "string"
                    },
                    "sku": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "unit_price": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "qty", "unit_price"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "logo": {
                "description": "A logo for the top of the receipt: exactly one of file_id, url or data_base64. PNG, JPEG or SVG, up to 2 MB (a PNG or JPEG also at most 2 megapixels, for example 1600×1250); the file's own bytes decide the type, not its name.",
                "properties": {
                  "data_base64": {
                    "description": "Or base64 bytes of the logo, up to 2 MB decoded",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "A file_id from create_upload (after the PUT)",
                    "type": "string"
                  },
                  "url": {
                    "description": "Or a public https URL of the logo",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "messages": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "paper": {
                "enum": ["thermal", "white", "yellow"],
                "type": "string"
              },
              "payment": {
                "description": "How it was paid; replaces the template's payment",
                "properties": {
                  "auth_code": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "card_brand": {
                    "maxLength": 30,
                    "type": "string"
                  },
                  "card_last4": {
                    "pattern": "^\\d{4}$",
                    "type": "string"
                  },
                  "label": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "method": {
                    "enum": ["cash", "card", "other"],
                    "type": "string"
                  },
                  "tendered": {
                    "type": "string"
                  },
                  "transaction_id": {
                    "maxLength": 60,
                    "type": "string"
                  }
                },
                "required": ["method"],
                "type": "object"
              },
              "sections": {
                "items": {
                  "enum": ["header", "meta", "items", "totals", "payment", "barcode", "messages"],
                  "type": "string"
                },
                "maxItems": 28,
                "type": "array"
              },
              "tax": {
                "description": "Either a rate in percent or a fixed amount, with a label; replaces the template's tax",
                "properties": {
                  "amount": {
                    "type": "string"
                  },
                  "label": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "rate": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "template": {
                "description": "Template slug from list_templates",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "time_format": {
                "enum": ["12h", "24h"],
                "type": "string"
              },
              "tip": {
                "type": "string"
              }
            },
            "required": ["accept_terms", "items", "template"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "type": "string"
              },
              "format": {
                "enum": ["png", "pdf", "jpeg"],
                "type": "string"
              },
              "height_px": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "totals": {
                "additionalProperties": false,
                "properties": {
                  "change": {
                    "type": ["string", "null"]
                  },
                  "discount": {
                    "type": "string"
                  },
                  "subtotal": {
                    "type": "string"
                  },
                  "tax": {
                    "type": "string"
                  },
                  "tip": {
                    "type": "string"
                  },
                  "total": {
                    "type": "string"
                  }
                },
                "required": ["change", "discount", "subtotal", "tax", "tip", "total"],
                "type": "object"
              },
              "url": {
                "type": "string"
              },
              "width_px": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["expires_at", "format", "height_px", "notes", "totals", "url", "width_px"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Make a receipt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fcc9c23bd8fcc210cf99f1de4b5b8e3a8d751a1596f4fb8ba88064e5a9859cd"
        }
      ],
