            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "account_token": {
                "description": "Account token, if your account claimed that conversation. Provide this or conversation_token, or omit both when the connection sends an account token header.",
                "maxLength": 128,
                "type": "string"
              },
              "cancellation_terms": {
                "anyOf": [
                  {
                    "description": "Cancellation terms you propose. Max 2000 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
