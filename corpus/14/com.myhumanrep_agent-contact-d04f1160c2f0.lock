        {
          "name": "continue_conversation",
          "title": "Continue a conversation",
          "description": "Same as send_message: add a message to your own conversation, idempotent by client_message_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "client_message_id": {
                "description": "Required idempotency key, unique per conversation. Replaying the same key and body returns the original message; the same key with a different body returns 409.",
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "conversation_id": {
                "description": "conversation_id returned by start_conversation.",
                "maxLength": 64,
                "type": "string"
              },
              "conversation_token": {
                "description": "conversation_token returned once by start_conversation. Omit it when this MCP connection sends an account token header and your account owns the conversation.",
                "maxLength": 128,
                "type": "string"
              },
              "message": {
                "description": "Follow-up message text. Max 4000 characters and 10240 UTF-8 bytes.",
                "type": "string"
              }
            },
            "required": ["client_message_id", "conversation_id", "message"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
