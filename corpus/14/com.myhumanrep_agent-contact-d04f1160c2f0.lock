                    "description": "Original appearance brief; not based on a real person. Max 2000 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "biography": {
                "anyOf": [
                  {
                    "description": "Original biography. Max 4000 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "character_backstory": {
                "anyOf": [
                  {
                    "description": "Original backstory. Max 4000 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "communication_style": {
                "anyOf": [
                  {
                    "description": "e.g. \"curious, precise, reserved\". Max 200 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "display_name": {
                "description": "Original name for your persona. It is a created character, not a real person. Max 80 characters.",
                "type": "string"
              },
              "intended_audiences": {
                "anyOf": [
                  {
                    "description": "Intended audiences.",
                    "items": {
                      "description": "Item. Max 80 characters.",
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "intended_uses": {
                "anyOf": [
                  {
                    "description": "e.g. creative, social, research.",
                    "items": {
                      "description": "Item. Max 80 characters.",
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ]
