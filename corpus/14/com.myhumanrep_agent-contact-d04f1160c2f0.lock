              },
              "client_request_id": {
                "description": "Required idempotency key, unique per proposal.",
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "confidentiality": {
                "anyOf": [
                  {
                    "description": "Confidentiality preference.",
                    "enum": ["standard", "request_discussion"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "conversation_token": {
                "description": "Token of the conversation the request belongs to. Provide this or account_token.",
                "maxLength": 128,
                "type": "string"
              },
              "deliverables": {
                "description": "What would be delivered (observations, photos, a report...).",
                "items": {
                  "description": "Item. Max 120 characters.",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "evidence_requirements": {
                "anyOf": [
                  {
                    "description": "Evidence you would expect. Max 2000 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "location_text": {
                "anyOf": [
                  {
                    "description": "General location; \"remote\" or \"virtual\" is fine. Max 150 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "anyOf": [
                  {
                    "description": "Optional note shown with this revision. Max 2000 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "price": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "Indicative, nonbinding price. Never charged by this API.",
                    "properties": {
                      "amount_minor": {
                        "description": "Integer minor units, e.g. 18000 = 180.00 CAD.",
                        "maximum": 100000000000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "currency": {
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      }
                    },
                    "required": ["amount_minor", "currency"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "proposal_id": {
                "maxLength": 64,
                "type": "string"
              },
              "required_skills": {
                "description": "Skills or qualifications the human would need.",
                "items": {
                  "description": "Item. Max 120 characters.",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "scope_text": {
                "description": "What the human would do, and what is out of scope. Max 4000 characters.",
                "type": "string"
              },
              "timing_text": {
                "anyOf": [
                  {
                    "description": "Timing, deadline or duration. Max 200 characters.",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "valid_days": {
                "description": "How long this revision stays open, in days (default 14).",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["client_request_id", "proposal_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
