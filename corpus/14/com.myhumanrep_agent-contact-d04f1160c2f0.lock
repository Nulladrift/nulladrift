        {
          "name": "create_persona",
          "title": "Create an original persona",
          "description": "Creates an original human-like persona (name, biography, style, briefs). Private by default. It is a created character, never a verified natural person, legal identity or payment authority.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "account_token": {
                "description": "account_token from create_agent_account. Not a conversation token. Omit it when this MCP connection sends the account token as a header.",
                "maxLength": 128,
                "type": "string"
              },
              "appearance_brief": {
                "anyOf": [
