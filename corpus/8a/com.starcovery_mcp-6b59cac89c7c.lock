              },
              "searchCreditOrder": {
                "items": {
                  "enum": ["user_free_grant", "organization_balance"],
                  "type": "string"
                },
                "type": "array"
              },
              "userId": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["billing", "credential", "nextSearchCreditSource", "organizationId", "searchCreditOrder", "userId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who am I"
          },
          "behavior": {
