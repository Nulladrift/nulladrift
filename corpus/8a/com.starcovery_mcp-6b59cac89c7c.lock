        {
          "name": "request_campaign_funding",
          "title": "Request campaign funding",
          "description": "Request campaign funding for a campaign the caller's organization owns. Starcovery Payouts runs concierge: this call records one open funding request for the accepted creators not yet funded, per person, with the quoted total (compensation per creator times those people, plus the $99 campaign price on the campaign's first funding request only, which Starcovery keeps and never refunds), and notifies the Starcovery team, who invoice the organization.\n\nOnly organization owners and admins may call it. Needs a saved contract, an answered market information question, and at least one creator who accepted and is not yet funded. Returns a tool error naming the reason when the campaign is not the caller's, it is archived, a step is missing, or a request is already open. An archived campaign is funded only after it is reopened with update_campaign status active. The reason creators_changed means a creator accepted while the request was prepared; the same call then succeeds.\n\nReturns the request row with amountCents set to the quoted total. Needs a credential.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "campaignId": {
                "description": "Campaign id from list_campaigns",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["campaignId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "request": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "amountCents": {
                        "description": "Quoted total in whole cents.",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "campaignId": {
                        "type": "string"
                      },
                      "createdAt": {
                        "anyOf": [
                          {
                            "format": "date-time",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}[Tt](?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:[Zz]|[+-](?:[01]\\d|2[0-3]):[0-5]\\d)$",
                            "type": "string"
                          },
                          {
                            "format": "date-time",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}[Tt](?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:[Zz]|[+-](?:[01]\\d|2[0-3]):[0-5]\\d)$",
                            "type": "string"
                          }
                        ]
                      },
                      "id": {
                        "type": "string"
                      },
                      "kind": {
                        "enum": ["fund"],
                        "type": "string"
                      },
                      "requestedBy": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "resolvedAt": {
                        "anyOf": [
                          {
                            "format": "date-time",
                            "pattern": "^\\d{4}-\\d{2}-\\d{2}[Tt](?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:[Zz]|[+-](?:[01]\\d|2[0-3]):[0-5]\\d)$",
                            "type": "string"
                          },
