        {
          "name": "create_campaign",
          "title": "Create campaign",
          "description": "Create a campaign with a goal (what to advertise or attain). A campaign opens only to its organization until its proposals are sent, at no charge. It is public and free by default, which opens it to any identified caller once sent; setting visibility \"private\" costs 1 credit and keeps it to the organization after the send. Contract (deliverable, compensationCents, and platforms, the platforms one payment covers), creator posting date, campaign details declassifying date (embargoUntil), disclosure, and marketInformation are accepted. Optional creators, each a profileId and fitScore pick, adds them as manual matches in the same call, as add_campaign_matches does, and the result carries matches with the added and present counts; any other key on a creator fails the call with a validation error; a creator id outside the catalog fails the call before anything is created or charged. Needs a credential.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "contract": {
                "additionalProperties": false,
                "description": "Compensation in USD cents, the paid deliverable, the platforms the creator posts on, and optional creator posting date.",
                "properties": {
                  "compensationCents": {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "creatorPostingDate": {
                    "description": "Creator posting date as the start of a UTC calendar day, an RFC 3339 date-time at midnight UTC such as 2026-12-01T00:00:00Z. Any other instant is refused. Omit when unset.",
                    "format": "date-time",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}[Tt](?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:[Zz]|[+-](?:[01]\\d|2[0-3]):[0-5]\\d)$",
                    "type": "string"
                  },
                  "deliverable": {
                    "maxLength": 2000,
                    "pattern": "^[^\\u0000]*[^\\u0000-\\u0020\\u007F-\\u00A0\\u00AD\\u0300-\\u036F\\u034F\\u061C\\u115F\\u1160\\u1680\\u17B4\\u17B5\\u180B-\\u180F\\u2000-\\u200F\\u2028-\\u202F\\u205F-\\u206F\\u20D0-\\u20F0\\u2800\\u3000\\u3164\\uFE00-\\uFE0F\\uFE20-\\uFE2F\\uFEFF\\uFFA0\\uFFF0-\\uFFF8][^\\u0000]*$",
                    "type": "string"
                  },
                  "platforms": {
