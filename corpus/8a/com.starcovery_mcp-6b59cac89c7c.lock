      "serverInfo": {
        "name": "com.starcovery/mcp",
        "title": "Starcovery",
        "version": "1.0.0",
        "description": "End-to-end vibe creator marketing: find, hire, cross-post, measure, and pay out creators.",
        "websiteUrl": "https://www.starcovery.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Most people who use Starcovery are not marketers, so lead the way kindly and keep every step simple.\n\nWhen the user tells you what they sell and who they want, call search_creators right away; do not ask about country, budget, or other details first.\n\nKeep the search brief (q) short: one plain sentence under 200 characters.\n\nAfter search_creators, help the user choose from the shortlist. When they say which creators they like, answer with one short question offering to set up a campaign for those creators, and call no tool in that answer. Do not save a List for them unless they ask for one.\n\nWhen they say yes, call create_campaign once with the picked creators. Fill the campaign name and goal yourself from the conversation (what they sell and the creators they picked). Do not ask the user for a name, a goal, an amount to pay, or a posting date first. Leave the contract and posting date out of create_campaign unless the user already gave them. Make one campaign per plan: change its details with update_campaign and its creators with add_campaign_matches or remove_campaign_match, and never create a second campaign for the same plan.\n\nPass each creator to create_campaign, add_campaign_matches, and save_list as exactly {\"profileId\": <the id search_creators returned>, \"fitScore\": <its fitScore>} and nothing else. Copy each id character for character from the search_creators result; never write an id yourself.\n\nAfter the campaign exists, ask in plain words when they would like the posts to go up, and offer to work out fair pay. Fair pay comes from their past campaigns (list_campaigns and get_campaign) and each creator's followers and views. The contract pays every creator one amount, so suggest one amount with a short reason, then set what the user agrees to with update_campaign.\n\nKeep the tone warm and welcoming. Say what is ready and what comes next in a sentence a beginner understands. Add no caveat or reassurance about what has not happened yet, such as that nothing has been sent, that they don't need to commit, or that an amount is only an opening offer.\n\nWhen the user agrees to a posting date and an amount, call update_campaign with contract.compensationCents and contract.creatorPostingDate before you say anything is set. Never say a campaign, date, or amount is saved unless a tool call in this reply saved it.\n\nSaving the posting date and the pay finishes the setup. Call request_campaign_send or request_campaign_funding only when the user asks in their own words to send the proposals or to pay; agreeing to a date or an amount is not asking to send. When they ask to save and send, save first, then send. After a save alone, tell them the campaign is ready and offer to send the proposals when they are.",
      "tools": [
        {
          "name": "add_campaign_match",
          "title": "Add campaign match",
          "description": "Add a creator as a manual match to a campaign by profileId, with its fitScore. Idempotent on (campaign, profileId). Stores the platform, handle, name, picture, and follower count of the catalog profile, so the input carries nothing else, and any other key, platform or username included, fails the call with a validation error; a profileId with no catalog profile returns not_found. While a send request is open, once the campaign is sent, or while it is archived, it returns a tool error naming the reason. Needs a credential.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "campaignId": {
                "description": "Campaign id from list_campaigns",
                "minLength": 1,
                "type": "string"
              },
              "fitScore": {
                "anyOf": [
                  {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fit score from search_creators, 0 to 1, or null when unknown"
              },
              "profileId": {
                "description": "Creator profile id from search_creators",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$",
                "type": "string"
              }
            },
            "required": ["campaignId", "fitScore", "profileId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add campaign match"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:280097066a675ff308e186d86a4094aeaf71649dca26accefdb8ae8d5e6651e3"
        },
        {
          "name": "add_campaign_matches",
          "title": "Add campaign matches",
          "description": "Add several creators as manual matches to a campaign in one call. Each creator is a profileId and fitScore pick: the id and fitScore of a search_creators creator, or the profileId and fitScore of a get_list creator. Idempotent on (campaign, profileId). Stores the platform, handle, name, picture, and follower count of each catalog profile, so a creator carries nothing else, and any other key on a creator fails the call with a validation error. A profileId outside the catalog fails the call with a tool error naming it, and nothing is added. Returns added, the count of new matches, and present, the count already on the campaign, with addedCreators and presentCreators, the same counts per person, so a person with two matched profiles counts once. A campaign outside the caller's organization returns not_found. While a send request is open, once the campaign is sent, or while it is archived, it returns a tool error naming the reason. Needs a credential.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "campaignId": {
                "description": "Campaign id from list_campaigns",
                "minLength": 1,
                "type": "string"
              },
              "creators": {
                "description": "The creators to add to the campaign: the profileId and fitScore of each, the id and fitScore of a search_creators creator or the profileId and fitScore of a get_list creator",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fitScore": {
                      "anyOf": [
                        {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Fit score from search_creators, 0 to 1, or null when unknown"
                    },
                    "profileId": {
                      "description": "Creator profile id from search_creators",
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|[fF]{8}-[fF]{4}-[fF]{4}-[fF]{4}-[fF]{12})$",
                      "type": "string"
                    }
                  },
                  "required": ["fitScore", "profileId"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["campaignId", "creators"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add campaign matches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
