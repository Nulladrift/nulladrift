        {
          "name": "thread_turn",
          "title": "Run thread turn",
          "description": "Run the next turn of a search thread and return the settled brief, its filters, the operations the turn ran, the reply, and the creators of the thread result set with a shortlistId for enrich_creators. creatorCount counts the whole set; creators holds at most the 50 best fit of them, fewer when the result would pass 140,000 characters. The reply, statement, and error are cut to 4,000 characters, and operations lists at most the first 20. Without threadId the call opens a new thread; the threadId in the result is the durable handle for the next turn. When a limit refuses the turn of a call that opened its thread, the tool error is JSON with the refusal in error beside threadId and any threadKey, so retry that thread instead of opening another. A pasted website address is read into a brief; anything else refines the brief, or, with a credential, answers a question about the organization's campaigns, Lists, credits, or API keys from read tools without changing them.\n\nSends notifications/progress when the caller passes a progressToken. MCP cannot stream a tool result, so the call is blocking and waits until the turn ends, up to 800 seconds.\n\nEach turn costs 1 use plus 1 for each search and each exclusion it runs, from the same daily grant as search_creators and then 1 prepaid credit each. A refinement returns the set it built; the first brief runs one search for its creators, billed like search_creators. The thread stores the set, so a caller with a credential reads it again free with GET /api/threads/{threadId}/results. When the allowance runs out, exhausted is set and creators is empty; a turn that finds it spent runs nothing.\n\nWithout a credential, each turn draws on the per-IP allowance of search_creators, and opening a thread counts against 100 thread starts per IP per 24 hours. The result then also holds threadKey, and the next turn of that thread passes threadKey with threadId.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "message": {
                "description": "The turn text: what to search for, what to change in the running search, or a website address to read into a brief",
                "maxLength": 2000,
