          "description": "Cancel the open send request of a campaign the caller's organization owns, before the Starcovery team sends the proposals, so the campaign is a draft again and request_campaign_send can ask again. Only an organization owner may call it. Returns a tool error naming the reason when the caller is not an owner, the campaign is not the caller's, it is already sent, or it holds no open send request. Returns the cancelled request row. Needs a credential.",
