        {
          "name": "update_campaign",
          "title": "Update campaign",
          "description": "Update campaign fields: name, goal, visibility, or status (draft, archived, or active; Starcovery sets active when the team sends the proposals, and active reopens an archived campaign whose proposals were sent). A campaign that is active or holds a delivery cannot return to draft, a campaign with an open send or funding request cannot be archived, and a campaign that is not archived or was never sent cannot be set active; each change returns a tool error naming the reason. Changing visibility to private costs 1 credit; already-private updates do not. Contract (deliverable, compensationCents, and platforms, the platforms one payment covers), creator posting date, campaign details declassifying date (embargoUntil), disclosure, and marketInformation are accepted. Null marketInformation clears it. While a funding request is open or the campaign holds funds, a changed or cleared marketInformation returns a tool error naming the reason; a campaign whose reserve was refunded to zero takes a new answer. After Starcovery sends the proposals, a changed or cleared contract returns a tool error naming the reason, and a call without contract still changes the other fields. Needs a credential.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "campaignId": {
                "description": "Campaign id from list_campaigns",
                "minLength": 1,
                "type": "string"
              },
              "contract": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Compensation in USD cents, the paid deliverable, the platforms the creator posts on, and optional creator posting date.",
                    "properties": {
                      "compensationCents": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "creatorPostingDate": {
                        "description": "Creator posting date as the start of a UTC calendar day, an RFC 3339 date-time at midnight UTC such as 2026-12-01T00:00:00Z. Any other instant is refused. Omit when unset.",
                        "format": "date-time",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}[Tt](?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:[Zz]|[+-](?:[01]\\d|2[0-3]):[0-5]\\d)$",
                        "type": "string"
                      },
                      "deliverable": {
                        "maxLength": 2000,
                        "pattern": "^[^\\u0000]*[^\\u0000-\\u0020\\u007F-\\u00A0\\u00AD\\u0300-\\u036F\\u034F\\u061C\\u115F\\u1160\\u1680\\u17B4\\u17B5\\u180B-\\u180F\\u2000-\\u200F\\u2028-\\u202F\\u205F-\\u206F\\u20D0-\\u20F0\\u2800\\u3000\\u3164\\uFE00-\\uFE0F\\uFE20-\\uFE2F\\uFEFF\\uFFA0\\uFFF0-\\uFFF8][^\\u0000]*$",
                        "type": "string"
                      },
                      "platforms": {
                        "description": "Platforms the creator posts on for the one payment: ig for Instagram, tt for TikTok. A creator posts on each one they run.",
                        "items": {
                          "enum": ["ig", "tt"],
                          "type": "string"
                        },
                        "maxItems": 2,
                        "minItems": 1,
                        "type": "array"
                      }
                    },
                    "required": ["compensationCents", "deliverable", "platforms"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null clears stored contract metadata. A stored declassifying date needs a contract, so clear embargoUntil in the same patch."
              },
              "disclosure": {
                "additionalProperties": true,
                "description": "Paid partnership disclosure. Required before send.",
                "properties": {
                  "statement": {
                    "maxLength": 4000,
                    "pattern": "^[^\\u0000]*[^\\u0000-\\u0020\\u007F-\\u00A0\\u00AD\\u0300-\\u036F\\u034F\\u061C\\u115F\\u1160\\u1680\\u17B4\\u17B5\\u180B-\\u180F\\u2000-\\u200F\\u2028-\\u202F\\u205F-\\u206F\\u20D0-\\u20F0\\u2800\\u3000\\u3164\\uFE00-\\uFE0F\\uFE20-\\uFE2F\\uFEFF\\uFFA0\\uFFF0-\\uFFF8][^\\u0000]*$",
                    "type": "string"
                  }
                },
                "required": ["statement"],
                "type": "object"
              },
              "embargoUntil": {
                "anyOf": [
                  {
                    "description": "Campaign details declassifying date as the start of a UTC calendar day, an RFC 3339 date-time at midnight UTC such as 2026-12-01T00:00:00Z. Any other instant is refused.",
                    "format": "date-time",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}[Tt](?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:[Zz]|[+-](?:[01]\\d|2[0-3]):[0-5]\\d)$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Campaign details declassifying date as the start of a UTC calendar day, an RFC 3339 date-time at midnight UTC such as 2026-12-01T00:00:00Z. Any other instant is refused. Null clears it."
              },
              "goal": {
                "allOf": [
                  {
                    "description": "Campaign goal, also the brief for generate_campaign_matches",
                    "maxLength": 200,
                    "pattern": "^[^\\u0000]*[^\\u0000-\\u0020\\u007F-\\u00A0\\u00AD\\u0300-\\u036F\\u034F\\u061C\\u115F\\u1160\\u1680\\u17B4\\u17B5\\u180B-\\u180F\\u2000-\\u200F\\u2028-\\u202F\\u205F-\\u206F\\u20D0-\\u20F0\\u2800\\u3000\\u3164\\uFE00-\\uFE0F\\uFE20-\\uFE2F\\uFEFF\\uFFA0\\uFFF0-\\uFFF8][^\\u0000]*$"
                  }
                ],
                "description": "Campaign goal",
                "type": "string"
              },
              "marketInformation": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "releaseDelayMonths": {
                        "anyOf": [
                          {
                            "maximum": 18,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["releaseDelayMonths"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "When the campaign's name and pay per creator may join the going rate, the list of campaigns and the typical pay other organizations and creators see: releaseDelayMonths 0 to 18 holds them back that many months after the first funding request since the campaign last held no funds, and a releaseDelayMonths of null keeps them out. A campaign joins no earlier than its declassifying date. Null clears the answer. While a funding request is open or the campaign holds funds, a change or a clear is refused."
              },
              "name": {
                "description": "Campaign name",
                "maxLength": 100,
                "pattern": "^[^\\u0000]*[^\\u0000-\\u0020\\u007F-\\u00A0\\u00AD\\u0300-\\u036F\\u034F\\u061C\\u115F\\u1160\\u1680\\u17B4\\u17B5\\u180B-\\u180F\\u2000-\\u200F\\u2028-\\u202F\\u205F-\\u206F\\u20D0-\\u20F0\\u2800\\u3000\\u3164\\uFE00-\\uFE0F\\uFE20-\\uFE2F\\uFEFF\\uFFA0\\uFFF0-\\uFFF8][^\\u0000]*$",
                "type": "string"
              },
              "status": {
                "description": "draft, archived, or active. Starcovery sets active when the team sends the proposals; active reopens an archived campaign whose proposals were sent.",
                "enum": ["active", "archived", "draft"],
                "type": "string"
              },
              "visibility": {
                "description": "Who opens the campaign once its proposals are sent. Public is free. Private costs 1 credit. Before the send, only the organization opens the campaign, whatever the visibility.",
                "enum": ["private", "public"],
                "type": "string"
              }
            },
            "required": ["campaignId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update campaign"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77344a865024dfb2ea6c93384fb92334032bebd4d2caafc09dcf683738bc8271"
        },
        {
          "name": "upload_campaign_attachment",
          "title": "Upload campaign file",
          "description": "Attach one file to a campaign the caller's organization owns: a PDF, a GIF, JPEG, PNG, or WebP image, a CSV, a JSON, or a plain text file, at most 4 MB, sent as base64. The campaign, the organization, and the user each have a file limit, and uploads per hour are limited; past either it returns a tool error naming the reason. A campaign outside the organization returns not_found. Needs a credential.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": true,
            "properties": {
              "campaignId": {
                "description": "Campaign id from list_campaigns",
                "minLength": 1,
                "type": "string"
              },
              "content": {
                "contentEncoding": "base64",
                "description": "The file bytes in base64, at most 4 MB once decoded",
                "format": "byte",
                "type": "string"
              },
              "contentType": {
                "description": "The media type of the file",
                "enum": ["application/json", "application/pdf", "image/gif", "image/jpeg", "image/png", "image/webp", "text/csv", "text/plain"],
                "type": "string"
              },
              "fileName": {
                "description": "The file name with its extension, such as brief.pdf",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["campaignId", "content", "contentType", "fileName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Upload campaign file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:47dd990af568445b065359ebcbc31dc7b7379a9ee14d6504bc658f9a104d6d28"
        },
        {
          "name": "whoami",
