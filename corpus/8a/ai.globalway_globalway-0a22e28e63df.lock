          "name": "search_guides",
          "title": "Search GlobalWay guides",
          "description": "Search GlobalWay’s guides for brands selling abroad and the creators they work with: sponsorship prices on YouTube, Instagram and X, finding creators, selling without an overseas store, Amazon Brand Registry and Attribution, and more. Returns the best matches, each with its title, summary and page URL; get_guide returns the full text.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Language of the results. Defaults to the language of the query.",
                "enum": ["en", "zh"],
