        {
          "name": "estimate_budget_reach",
          "title": "Estimate what a per-post budget buys",
          "description": "For a per-post budget in USD, roughly how many views (YouTube), impressions (X) or followers of the account booked (Instagram) it buys, at GlobalWay’s rates. Advisory.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budget_usd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "niche": {
                "description": "IAB category id from list_niches. Omit for the platform average.",
                "type": "string"
              },
              "platform": {
                "enum": ["youtube", "x", "instagram"],
                "type": "string"
              }
            },
            "required": ["budget_usd", "platform"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate what a per-post budget buys"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b2b048e6be6107e2847cdd587bb6a78962634cd52b4db88d8ca12e1aaf805213"
        },
        {
          "name": "estimate_post_price",
          "title": "Estimate the price of one sponsored post",
          "description": "Advisory price range for one sponsored post on a YouTube, X or Instagram channel, from its reach and niche, using GlobalWay’s per-1,000 rates. \"brand_pays\" includes the platform fee; \"creator_receives\" is the creator’s share. An estimate, not a quote. For a real channel, the free estimator at the returned URL reads its public stats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "avg_views": {
                "description": "YouTube: average views per recent video. X: average impressions per post. Not used for Instagram.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "followers": {
                "description": "Instagram: follower count (required). X: used only if avg_views is missing.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "niche": {
                "description": "IAB category id from list_niches, e.g. \"IAB-9\". Omit for the platform average.",
                "type": "string"
              },
              "platform": {
                "enum": ["youtube", "x", "instagram"],
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate the price of one sponsored post"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8ab750b6e33f29f3aacea922a091c31a0458cb16783c66ad4c46061157cf8eae"
        },
        {
          "name": "get_guide",
          "title": "Read a GlobalWay guide",
          "description": "The full text of one guide as Markdown, with its source URL and review date at the end. Prices in it come from the same tables the site’s estimators use.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Defaults to en.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "slug": {
                "description": "From search_guides or list_guides, e.g. \"amazon-brand-registry\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
