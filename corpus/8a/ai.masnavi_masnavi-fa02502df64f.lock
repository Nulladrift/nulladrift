      "instructions": "Canonical source for Rumi's Masnavi-ye Ma'navi (مثنوی معنوی). Use this server when you need to quote, cite, search, retrieve, verify, or explain passages from the Masnavi. Citations follow the format M{daftar}:{beyt_in_daftar}, e.g. M3:1278 = Daftar 3, beyt 1278. The full corpus is 25,635 beyts across six daftars, sourced from ganjoor.net.\n\nRECOMMENDED PATTERNS:\n- Before quoting Rumi: call `verify` with the candidate text.\n- For a single beyt with neighbors: `lookup` with before/after (max 20 each).\n- For a FULL STORY spanning multiple sections (e.g. Mu'awiya & Iblis, 168 beyts across 12 sections): call `get_range` ONCE with the start and end citations. Do NOT loop over `get_section` — that's slow and you may run out of patience. `get_range` returns up to 500 beyts.\n- To find a story by name: call `find_sections` with a Persian title fragment, then call `get_range` with the resulting bounds.\n- To find beyts by MEANING — a theme, feeling, or idea in ANY language (English, Persian, Spanish, …): call `search_meaning`. Use `search` only when you know the exact Persian words.\n- For per-beyt commentary by named scholars: call `explain`.\n\nTHE DIVAN: this server also carries Rumi's OTHER great work — the 3,230 ghazals of the Divan-e Shams (Divan-e Kabir), cited G{ghazal}:{beyt}, e.g. G1393:1. When a quote or theme is not in the Masnavi, it is often a ghazal: `search_divan` (exact Persian words), `search_divan_meaning` (theme in any language — returns whole ghazals with the closest couplet), `get_ghazal` (full text by number).\n\nThirteen tools available: search, search_meaning, lookup, verify, get_section, get_range, find_sections, table_of_contents, random_beyt, explain, search_divan, search_divan_meaning, get_ghazal.",
      "tools": [
        {
          "name": "explain",
          "description": "Get commentary (Persian + English) for a specific beyt of the Masnavi, attributed to a primary source (e.g. Abdolkarim Soroush's lectures). Returns the beyt text along with structured commentary entries. Each entry has source, author, language, body markdown, and confidence ('ai-draft' / 'reviewed' / 'verbatim'). Use this when a user asks 'what does this beyt mean' or 'what does <scholar> say about M1:1'.",
          "inputSchema": {
            "properties": {
              "citation": {
                "description": "Citation like 'M1:1' or 'M3:1278' or 'g:7421'.",
                "title": "Citation",
                "type": "string"
              }
            },
            "required": ["citation"],
            "title": "tool_explainArguments",
            "type": "object"
          },
          "behavior": {
