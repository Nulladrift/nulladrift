{
  "lockfileVersion": 2,
  "subjects": {
    "com.quasarui/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.quasarui.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "QuasarUI",
        "version": "1.0.0",
        "description": "Copy-paste Quasar (Vue 3) UI Components: list Blocks, search Components and fetch their source."
      },
      "capabilities": {
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Find Components with search_components, or list_blocks then list_components. Fetch source with get_component; Free Components are open to anyone, Paid ones need All Access or Blocks Pro. Call get_setup_guide before pasting a Component into a project.",
      "tools": [
        {
          "name": "get_component",
          "title": "Get Component",
          "description": "Get a Component's full Vue SFC source by slug. Free Components return their source to anyone; a Paid Component without access returns an upgrade message with the pricing URL instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Component slug from list_components or search_components, e.g. buttons-01",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "get-component.ts"
          },
          "digest": "sha256:ddf21d970a6614ab9d79e88fb36fbafd04ee1b1f6c84457d4531148dff71dbde"
        },
        {
          "name": "get_setup_guide",
          "title": "Get Setup Guide",
          "description": "How to set up Quasar (Quasar CLI, Nuxt or Vite) and paste a QuasarUI Component into a project, including the icon sets the Components need.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "get-setup-guide.ts"
          },
          "digest": "sha256:6870bdda196c75c47546f50bcf5805ffb20f373b29f9dba844849b51de580361"
        },
        {
          "name": "list_blocks",
          "title": "List Blocks",
          "description": "List every QuasarUI Block (a group of related Components, e.g. pricing-sections) with its tags, how many Components it has, how many are Free, and its page URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "list-blocks.ts"
          },
          "digest": "sha256:1ebc9b0438fbed53b10e399fb015ddf4862a0c835d7facd8d0f28f13980ebba4"
        },
        {
          "name": "list_components",
          "title": "List Components",
          "description": "List the Components of one Block, each with \"access\": \"free\" (source available to anyone) or \"paid\" (needs All Access or Blocks Pro).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "block": {
                "description": "Block slug from list_blocks, e.g. pricing-sections",
                "type": "string"
              }
            },
            "required": ["block"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "list-components.ts"
          },
          "digest": "sha256:3b1c70cc66213695e40335db7eca39ef83ea1e6c0eaf4e0f65c895aa54b388e6"
        },
        {
          "name": "search_components",
          "title": "Search Components",
          "description": "Search Components by a plain-language query, e.g. \"pricing table with a monthly/yearly toggle\" or a slug. Returns up to 20 matches, best first, each with its Free or Paid access.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "What you are looking for",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "filename": "search-components.ts"
          },
          "digest": "sha256:754d60dc909788939e3b8c39e80be632453046e8e7b87a4b9b6480de66dccb82"
        }
      ],
      "digest": "sha256:5c40effab550e1eebbdea51d0ff5edf71eb9417973d33dffaca4efec439e0fac"
    }
  }
}
