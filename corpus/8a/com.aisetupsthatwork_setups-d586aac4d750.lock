          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bot_name": {
                "description": "What the bot is called.",
                "type": "string"
              },
              "business_name": {
                "description": "The business name.",
                "type": "string"
              },
              "decisions": {
                "description": "Decisions the owner has made, one per line.",
                "type": "string"
