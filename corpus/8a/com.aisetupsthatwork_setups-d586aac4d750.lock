              },
              "allow_rules": {
                "description": "The owner’s Allow rules.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ask_first_rules": {
                "description": "The owner’s Ask first rules. Leave out to use the four starter rules.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "from_routine": {
                "description": "True when a scheduled routine is asking. Routine approval cards expire after 30 minutes.",
                "type": "boolean"
              },
              "industry": {
                "description": "The kind of business.",
                "enum": ["home-services", "clinic-wellness", "solo-consultant", "home-family"],
                "type": "string"
              },
              "untrusted_text": {
                "description": "Text the bot read from outside, such as an email body.",
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
