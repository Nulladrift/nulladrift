        "name": "aisetupsthatwork",
        "title": "AI Setups That Work",
        "version": "1.0.0",
        "websiteUrl": "https://www.aisetupsthatwork.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI Setups That Work is a catalog of step-by-step AI setups for small business, work and home: steps, a copy-paste prompt, guardrails, known snags and sources. Use search_setups to find setups for the job the user describes, then get_setup for the full steps and prompt. Use get_skill when the user wants it as a Claude skill. Prefer setups labeled \"tested\" (they were run for real; the testedNote says how). Say when a setup is only \"researched\". Only recommend setups this server returns, and link the setup page. Every setup drafts first: never send, post, pay, book, cancel or delete for the user without their approval of that exact action.",
      "tools": [
        {
          "name": "get_setup",
          "title": "Get a setup",
          "description": "The full setup for a slug from search_setups: who it is for, steps, the copy-paste prompt, common snags, sources, and its label (tested or researched).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The setup slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a setup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5987c29fc07bd6ca59cc1b453d1ebc062fa2acc6e8b77c5e194493c54f4eab1"
        },
        {
          "name": "get_skill",
          "title": "Get a Claude skill",
          "description": "The SKILL.md for a setup, ready to save as ~/.claude/skills/<name>/SKILL.md, plus the .zip link for the Claude app. Only setups with a skill have one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The setup slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Claude skill"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:60d60c7f47170bc1c0036c687b593509711b80684bd4f1769f9caad22b48e1b7"
        },
        {
          "name": "search_setups",
          "title": "Search AI setups",
          "description": "Find AI setups for a job, such as \"chase late invoices\" or \"reply to Google reviews\". Returns the best matches with Tested setups ranked first, each with its page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional: only this category.",
                "enum": ["Content", "Inbox", "Invoicing & money", "Leads", "Life admin", "Operations", "Research", "Reviews", "Scheduling"],
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Optional platform id, such as claude, claude-code, chatgpt, gemini or grok-bot.",
                "type": "string"
              },
              "query": {
                "description": "The job, problem or tool, in plain words.",
                "type": "string"
              },
              "tested_only": {
                "description": "Only setups that were run for real.",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
