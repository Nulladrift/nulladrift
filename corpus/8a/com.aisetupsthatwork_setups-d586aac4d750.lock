          "description": "VIP. Compares what the bot drafted with what the owner really sent, and returns the Never rules to add to voice.md. An edit seen in two or more pairs becomes a permanent rule (the Two-Edit Rule). Without a member token it returns a labeled demo on sample drafts.",
