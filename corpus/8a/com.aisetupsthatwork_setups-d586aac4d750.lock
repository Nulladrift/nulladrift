                "description": "Days and hours.",
                "type": "string"
              },
              "industry": {
                "description": "The kind of business.",
                "enum": ["home-services", "clinic-wellness", "solo-consultant", "home-family"],
                "type": "string"
              },
              "offers": {
                "description": "Current offers, each with an end date.",
                "type": "string"
              },
              "owner_role": {
                "description": "Name and role for sign-offs.",
                "type": "string"
              },
              "policies": {
                "description": "One policy per line.",
                "type": "string"
              },
              "service_area": {
                "description": "Towns, region or \"online\".",
                "type": "string"
              },
              "services": {
                "description": "One service per line, with its price or range.",
                "type": "string"
              },
              "voice_never": {
                "description": "Lines for the Never list in voice.md.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "voice_samples": {
