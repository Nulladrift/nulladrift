{
  "lockfileVersion": 2,
  "subjects": {
    "com.fotosize/fotosize": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fotosize.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fotosize",
        "title": "fotosize",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "fotosize lists ID photo specs (passport, visa, ID card) checked against official sources, and makes the photo in the browser without uploading it. Use list_photo_specs, then get_photo_spec. Quote the size, head size and background with the source and date, pass on every note, and link make_it when it is not null.",
      "tools": [
        {
          "name": "get_photo_spec",
          "title": "Get an ID photo spec",
          "description": "One ID photo spec: print size in mm, head size and how it is measured, allowed backgrounds and whether the background may be changed, online pixel size and file limit where there is one, who takes the photo, the official source and the date it was checked, and a link to make the photo in the browser. Always pass on the notes; they say what the photo must not be used for.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Spec id from list_photo_specs.",
                "maxLength": 40,
                "type": "string"
              },
              "locale": {
                "description": "Language of the linked page. Default en.",
                "enum": ["en", "es", "es-mx", "ja", "pt-br", "de", "nl", "tr", "vi", "id"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03813bf33f605e9b4a650d99159746bfffa17e8ed9909f32d13d87dfbf979627"
        },
        {
          "name": "list_photo_specs",
          "title": "List ID photo specs",
          "description": "The passport, visa, ID card and other ID photo specs fotosize has checked against official sources, with an id for get_photo_spec. Filter by country code. can_make_here is false where the photo must be taken at the office or fotosize does not make it.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country code: us (United States), uk (United Kingdom), es (Spain), mx (Mexico), br (Brazil), jp (Japan), de (Germany), nl (Netherlands), tr (Turkey), vn (Vietnam), id (Indonesia), in (India), lat (Latin America), kr (South Korea).",
                "enum": ["us", "uk", "es", "mx", "br", "jp", "de", "nl", "tr", "vn", "id", "in", "lat", "kr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e110a2135b374691762b49d8922b8fdba9975569016504521483f6c4f8568282"
        }
      ],
      "digest": "sha256:97440dfa982b579b6541090ea3da612da9b8f7821c452ee2a49e557223a531f0"
    }
  }
}
