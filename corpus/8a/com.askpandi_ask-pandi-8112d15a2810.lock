{
  "lockfileVersion": 2,
  "subjects": {
    "com.askpandi/ask-pandi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://askpandi.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ask-pandi",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "ask_pandi",
          "title": "Ask Pandi",
          "description": "Prepare or submit a text research question to Pandi. A first call without a request ID prepares a private submission ID. A repeat with that ID, question and locale creates a research job and returns its private receipt.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "default": "en",
                "pattern": "^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8}){0,2}$",
                "type": "string"
              },
              "question": {
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "request_id": {
                "description": "Use the private request_id issued by Pandi for this guest question. Linked accounts may also generate their own unique ID. Reuse the same ID for retries.",
                "pattern": "^[\\w.:-]{8,64}$",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask Pandi"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["pandi:ask"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:1a2ea970a1b2f5ac9d8de9209a244c4b5ec1df520281d7ee2a1181eafc279368"
        },
        {
          "name": "get_ask",
          "title": "Read a Pandi answer",
          "description": "Read the state, progress or completed text answer and numbered citations for a Pandi research job. The private receipt identifies the job. An optional cursor resumes progress from an earlier read.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ask_id": {
                "anyOf": [
                  {
                    "pattern": "^\\d{1,20}\\.[\\w-]{43}$",
                    "type": "string"
                  },
                  {
                    "pattern": "^ga\\.([a-z0-9]{1,8}\\.[\\w-]{22})\\.(\\d{1,20})\\.[\\w-]{22}$",
                    "type": "string"
                  }
                ]
              },
              "cursor": {
                "pattern": "^\\d{1,20}\\/[\\w:.-]{1,100}$",
                "type": "string"
              },
              "wait_seconds": {
                "default": 8,
                "maximum": 15,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["ask_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Pandi answer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["pandi:ask"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3ec7861c8f571272332ea25ddbf308ae7e309e0df3a64a7e334cc72ae3b0b667"
        }
      ],
      "digest": "sha256:43e0b7395abb2c55ebb71e9a043c036f1337adb4da6213aac2eee9cd68ffc467"
    }
  }
}
