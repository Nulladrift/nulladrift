    "com.dropwatchhq/bio-catalyst": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://biocatalyst.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "bio-catalyst",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "catalyst_for_company",
          "description": "Return verified catalyst events for one public company by ticker, each linked to its official source. Free preview; full data inline.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18b221706c90022c7b9aa3f12d7403bbc6f4f7e53449a98a27b10c34bae87f82"
        },
        {
          "name": "catalyst_for_drug",
          "description": "Return verified catalyst events referencing a drug/product name, each linked to its official source.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9bf640f9b459e342d668d6a803113c8fd3dff8386cd42d726d3b399b3c8fff9"
        },
        {
          "name": "upcoming_catalysts",
          "description": "Return upcoming biotech/pharma catalysts (clinical-trial readouts, FDA AdComm meetings, recent approvals) VERIFIED against and linked to their official source (ClinicalTrials.gov, Federal Register, openFDA). Each record includes the official sourceUrl, the exact sourceField the date came from, and a verifiedAsOf stamp. This is scheduling/reference data, NOT investment advice.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Horizon in days from today (default 90).",
                "type": "number"
              },
              "kind": {
                "description": "Filter by event type.",
                "enum": ["readout", "adcom", "approval"],
                "type": "string"
              },
              "limit": {
                "description": "Max events (default 50).",
                "type": "number"
              },
              "phase": {
                "description": "Filter trial readouts by phase, e.g. 'PHASE3'.",
                "type": "string"
              },
              "ticker": {
                "description": "Filter to one public-company ticker.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e5b6df1f84bb3067969a04682150208e530623c84b5bd9517876d142f123f88"
        }
      ],
      "digest": "sha256:46e4a73fed8c6564e471122315b6c6e819a9d98811660e2acc7bdf6845a5a9e6"
    }
  }
