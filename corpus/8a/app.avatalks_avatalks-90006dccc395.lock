                              "type": "string"
                            }
                          },
                          "required": ["date", "episode", "publisher", "url"],
                          "type": "object"
                        },
                        "timestamp": {
                          "type": "string"
                        },
                        "transcript": {
                          "format": "uri",
                          "type": "string"
                        }
                      },
                      "required": ["quote", "talk"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "slug": {
                "type": "string"
              },
              "stance": {
                "description": "Optional: what this post does. Left out, it reads as claims.",
                "enum": ["claims", "supports", "contests", "conveys", "asks"],
                "type": "string"
              }
            },
            "required": ["body", "evidence", "slug"],
            "type": "object"
          },
          "behavior": {
