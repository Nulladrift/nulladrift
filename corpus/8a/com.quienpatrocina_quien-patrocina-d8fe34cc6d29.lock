        {
          "name": "find_sponsor_leads_for_podcast",
          "title": "Marcas para proponer a un podcast / Sponsor leads for a podcast",
          "description": "Which brands could a podcaster, network or agency pitch for sponsorship? ¿A qué marcas proponer un patrocinio? Takes a Spanish-language show and returns brands that sponsored similar shows in the last 30 days but did not sponsor this show. Similar means same category and country; if that finds nothing it widens to same category, then same country, and says which in basis. Data comes from written episode descriptions, not audio. / Los datos salen de descripciones escritas, no de audio.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "show": {
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["show"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "basis": {
                "anyOf": [
                  {
                    "enum": ["category_and_country", "category", "country"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "candidates": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "found": {
                "type": "boolean"
              },
              "leads": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "brand_page": {
                      "type": ["string", "null"]
                    },
                    "example_shows": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "promo_codes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "similar_shows_sponsored": {
                      "type": "number"
                    }
                  },
                  "required": ["brand", "brand_page", "example_shows", "promo_codes", "similar_shows_sponsored"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_step": {
                "additionalProperties": false,
                "properties": {
                  "data_limits": {
                    "type": "string"
                  },
                  "verify_on_air": {
                    "additionalProperties": false,
                    "properties": {
                      "free_check_url": {
                        "type": "string"
                      },
                      "order_url": {
                        "type": "string"
                      },
                      "text_en": {
                        "type": "string"
                      },
                      "text_es": {
                        "type": "string"
                      }
                    },
                    "required": ["free_check_url", "order_url", "text_en", "text_es"],
                    "type": "object"
                  }
                },
                "required": ["data_limits", "verify_on_air"],
                "type": "object"
              },
              "show": {
                "type": "string"
              },
              "similar_shows": {
                "type": "number"
              }
            },
            "required": ["basis", "candidates", "found", "leads", "next_step", "show", "similar_shows"],
            "type": "object"
          },
