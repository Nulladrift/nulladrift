                  "type": "string"
                },
                "type": "array"
              },
              "show_has_other_sponsors": {
                "type": "number"
              },
              "show_page": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["mention_found", "no_mention_found", "brand_unknown", "show_unknown"],
