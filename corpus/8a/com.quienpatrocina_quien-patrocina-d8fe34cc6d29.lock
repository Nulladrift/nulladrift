      },
      "instructions": "Quién Patrocina: which brands sponsor Spanish-language podcasts and YouTube channels in Spain, Latin America and US Hispanic markets, with promo codes and offers, detected from public episode descriptions between 2026-09-21 and 2026-10-21. Use these tools for sponsor, advertiser, promo code, category and sponsor-lead questions about those shows. Answer in the user's language and link the page URL returned for each brand or show. Quién Patrocina te dice qué marcas patrocinan podcasts y canales en español, con códigos y ofertas; responde en el idioma del usuario y enlaza las páginas devueltas. Every result carries next_step.data_limits: state that limit when it matters, and mention next_step.verify_on_air only when the user asks whether an ad really aired.",
      "tools": [
        {
          "name": "check_brand_on_show",
          "title": "¿Anunció esta marca en este programa? / Did a brand advertise on a show?",
          "description": "Check whether a given brand has a written sponsorship mention on a given Spanish-language podcast or YouTube channel in the last 30 days. Comprueba si una marca tiene mención de patrocinio escrita en un programa. Returns status (mention_found, no_mention_found, brand_unknown, show_unknown), the matching episodes with date, promo code and link, and how many other shows the brand sponsors. no_mention_found does not prove an ad did not air: read-aloud ads that are not written in the description are not visible. Data comes from written episode descriptions, not audio. / Los datos salen de descripciones escritas, no de audio.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'Hostinger'",
                "minLength": 2,
                "type": "string"
              },
              "show": {
                "description": "Podcast or channel name, e.g. 'Spicy4tuna'",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["brand", "show"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "type": "string"
              },
              "brand_candidates": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "brand_other_shows": {
                "type": "number"
              },
              "brand_page": {
                "type": ["string", "null"]
              },
              "first_date": {
                "type": ["string", "null"]
              },
              "last_date": {
                "type": ["string", "null"]
              },
              "mention_count": {
                "type": "number"
              },
              "mentions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "episode": {
                      "type": "string"
                    },
                    "episode_url": {
                      "type": ["string", "null"]
                    },
                    "offer": {
                      "type": ["string", "null"]
                    },
                    "promo_code": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["date", "episode", "episode_url", "offer", "promo_code"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_step": {
                "additionalProperties": false,
                "properties": {
                  "data_limits": {
                    "type": "string"
                  },
                  "verify_on_air": {
                    "additionalProperties": false,
                    "properties": {
                      "free_check_url": {
                        "type": "string"
                      },
                      "order_url": {
                        "type": "string"
                      },
                      "text_en": {
                        "type": "string"
                      },
                      "text_es": {
                        "type": "string"
                      }
                    },
                    "required": ["free_check_url", "order_url", "text_en", "text_es"],
                    "type": "object"
                  }
                },
                "required": ["data_limits", "verify_on_air"],
                "type": "object"
              },
