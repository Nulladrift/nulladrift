      "instructions": "DevicErts (devicerts.com) is a catalogue of medical devices compiled from public registries: EUDAMED (European Union) and the U.S. FDA (510(k), De Novo, PMA, GUDID, recalls, establishment registrations). Every result carries the canonical DevicErts page URL, a citation line and the reuse terms of each source. Informational only, not medical or regulatory advice. DevicErts is not an official register and is not affiliated with the U.S. FDA or the European Commission. Statuses are as of the stated date; the record in the source registry prevails.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a record",
          "description": "Standard fetch tool: the full record behind a search result id (device:<slug> or manufacturer:<slug>) as Markdown text, with its canonical url and metadata (registries, retrieval date, reuse terms).",
