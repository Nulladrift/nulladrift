        {
          "name": "search_recalls",
          "title": "Search FDA recalls",
          "description": "Search U.S. FDA medical device recalls across all devices by words (product description, recall reason, recalling firm or recall number), product code, firm, submission number or pathway, start-date range, recall class and status, with offset paging. Returns up to 20 recalls per page, newest first: recall number, class, status, start date, reason, product code, firm, submissions and the name-matched DevicErts manufacturer page, plus total and next_offset. Use when the question covers recalls in general or all recalls of a company, e.g. ongoing Class I recalls of a product code. Do not use for the recalls of one known device (use get_device_recalls) or for EU data (recalls are FDA only). Read-only, no login. Data: public EUDAMED and U.S. FDA records, synced monthly, EU certificates weekly (dates in get_data_sources). Cached up to 1 hour; limit 300 calls a minute per IP.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
