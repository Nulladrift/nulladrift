          "description": "Search registered establishments: EU economic operators and authorities in EUDAMED (manufacturers, authorised representatives, importers, notified bodies, competent authorities, sponsors) by name or SRN with role and country filters and offset paging, or one FDA establishment registration by FEI number (a single hit, no paging). Returns up to 20 hits per page (registry, identifier and its type, name, role, country, status, page URL) and next_offset. Use when the question is about a registration identifier (SRN or FEI) or an operator role such as authorised representative. Do not use to find a company profile by name (use search_manufacturers) or its devices (use search_devices). Read-only, no login. Data: public EUDAMED and U.S. FDA records, synced monthly, EU certificates weekly (dates in get_data_sources). Cached up to 1 hour; limit 300 calls a minute per IP.",
