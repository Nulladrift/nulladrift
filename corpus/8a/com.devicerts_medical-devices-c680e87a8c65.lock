        {
          "name": "search_devices",
          "title": "Search medical devices",
          "description": "Full-text search of the DevicErts catalogue (EUDAMED, FDA 510(k), De Novo, PMA, GUDID). Returns up to 20 devices, each with its page URL, manufacturer, risk class, registries, headline status, primary reference and UDI-DI. Results are a first page only; more_results_url opens the same search on the website.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "device_class": {
                "description": "Only devices of this risk class (EU MDR I/IIa/IIb/III, US FDA I/II/III, EU IVDR A-D).",
                "enum": ["Class I", "Class II", "Class IIa", "Class IIb", "Class III", "Class A", "Class B", "Class C", "Class D"],
                "type": "string"
              },
              "limit": {
                "description": "Number of results, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Only devices of manufacturers whose name contains these words.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Search text: device or trade name, model or catalogue number, manufacturer name, or an identifier.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "registry": {
                "description": "Only devices listed in this registry: eudamed, fda_510k (510(k) and De Novo), fda_pma or fda_udi (GUDID).",
                "enum": ["eudamed", "fda_510k", "fda_pma", "fda_udi"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
