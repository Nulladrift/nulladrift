                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Only recalls started on or before this date, YYYY-MM-DD. e.g. 2024-12-31. Default: no upper bound.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "firm": {
                "description": "Only recalls whose recalling firm name contains these words, 2 to 100 characters. e.g. \"Medtronic\". Default: all.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Results per page, integer 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Number of results to skip, integer 0 to 999. Default 0. Pass next_offset from the previous page to get the next one; offset plus limit stays within the first 1000 results.",
                "maximum": 999,
                "minimum": 0,
                "type": "integer"
              },
              "pathway": {
                "description": "Only recalls naming a submission of this FDA premarket pathway: 510k, pma or denovo. Default: all.",
                "enum": ["510k", "pma", "denovo"],
                "type": "string"
