        {
          "name": "search_certificates",
          "title": "Search EU certificates",
          "description": "Search EU notified-body certificates (EUDAMED) by certificate number, notified body number or name, holder name or SRN, legislation (MDR, IVDR), status and validity date, with offset paging. Returns up to 20 certificates per page: number, type, legislation, status, issue and expiry dates, notified body and holder with their DevicErts pages, plus total and next_offset. Use when a certificate number is known, or the question is which certificates a notified body issued or a manufacturer holds. Do not use for the certificates of one known device (use get_device_certificates) or for FDA clearances (use find_device_by_identifier). Read-only, no login. Data: public EUDAMED and U.S. FDA records, synced monthly, EU certificates weekly (dates in get_data_sources). Cached up to 1 hour; limit 300 calls a minute per IP.",
