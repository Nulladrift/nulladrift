        {
          "name": "get_device",
          "title": "Get a device record",
          "description": "The DevicErts record of one device: names as registered, manufacturer, headline status, risk class with its legal system, and every authorization, registration and listing with number, dates and status. detail=full adds identifiers (UDI-DI, Basic UDI-DI, catalogue and submission numbers), FDA product codes, EMDN and GMDN codes, EU notified-body certificates, FDA recalls, EU market availability and the registry properties. Renamed or merged pages resolve to the current slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "description": "summary (default): names, manufacturer, status, class, authorizations. full: adds identifiers, nomenclature codes, EU certificates, recalls, EU market availability and registry properties.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "slug": {
                "description": "The device slug, the last part of its https://devicerts.com/devices/<slug> URL (a full page URL is accepted too).",
                "maxLength": 240,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
