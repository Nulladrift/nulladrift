      },
      "instructions": "DevicErts (devicerts.com) is a catalogue of medical devices compiled from public registries: EUDAMED (European Union) and the U.S. FDA (510(k), De Novo, PMA, GUDID, recalls, establishment registrations). Operated by Digitaly (https://digitaly.site). Every result carries the canonical DevicErts page URL, a citation line and the reuse terms of each source. Informational only, not medical or regulatory advice. DevicErts is not an official register and is not affiliated with the U.S. FDA or the European Commission. Statuses are as of the stated date; the record in the source registry prevails.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a record (ChatGPT format)",
          "description": "Fetch one record in the standard search/fetch connector format: the device or manufacturer behind a search id (device:<slug> or manufacturer:<slug>) as Markdown text, with its url and metadata (retrieval date, reuse terms). Use when the client works only with the standard search and fetch pair (ChatGPT connectors and deep research). Do not use when get_device or get_manufacturer is available: they return structured fields and a detail level. Read-only, no login. Data: public EUDAMED and U.S. FDA records, synced monthly, EU certificates weekly (dates in get_data_sources). Cached up to 1 hour; limit 300 calls a minute per IP.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "A result id from search: device:<slug> or manufacturer:<slug>. A device or manufacturer page URL is accepted too. e.g. device:heartstart-frx-defibrillator-p180028",
                "maxLength": 260,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
