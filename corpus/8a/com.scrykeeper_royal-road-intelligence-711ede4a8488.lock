{
  "lockfileVersion": 2,
  "subjects": {
    "com.scrykeeper/royal-road-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scrykeeper.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Scrykeeper Intelligence",
        "version": ""
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_author",
          "title": "Get Author Intelligence",
          "description": "Get a resolved Scrykeeper author identity, known works and deduplicated observed audience footprint. Known works are not guaranteed to be a complete bibliography.",
          "inputSchema": {
            "properties": {
              "identity_id": {
                "title": "Identity Id",
                "type": "integer"
              }
            },
            "required": ["identity_id"],
            "title": "get_authorArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_authorDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0b1f0809abc49381ef0ad51e0a6b0a88b607442d348fba8710e3b9ab2689d4bd"
        },
        {
          "name": "get_data_context",
          "title": "Get Scrykeeper Data Context",
          "description": "Return Scrykeeper's current data coverage, source-specific freshness, methodology and limitations. Use this when interpreting reader, author or commercial metrics.",
          "inputSchema": {
            "properties": {},
            "title": "get_data_contextArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_data_contextDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e25e531bd837cae687154dd4bf955bf925181b82c4328c63cf1afd2cf86cbe0b"
        },
        {
          "name": "get_story",
          "title": "Get Story Intelligence",
          "description": "Get Scrykeeper intelligence for one Royal Road fiction ID. Observed readers are sampled graph observations and are not total readership. Anonymous demo access is available; higher limits are available at https://scrykeeper.com/api/access.",
          "inputSchema": {
            "properties": {
              "rr_fiction_id": {
                "title": "Rr Fiction Id",
                "type": "integer"
              }
            },
            "required": ["rr_fiction_id"],
            "title": "get_storyArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_storyDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40e27e5dec1c5715a03040cd652b53ca6aa398f5126cf3533ef2985b25ae1326"
        },
        {
          "name": "search_market",
          "title": "Search Market Intelligence",
          "description": "Search Scrykeeper's Royal Road market dataset by genre, lifecycle, followers, sampled observed readers, update recency and known commercial mapping. commercial='none' means no accepted mapping in Scrykeeper, not unpublished.",
          "inputSchema": {
            "properties": {
              "commercial": {
                "default": "all",
                "enum": ["all", "known", "none"],
                "title": "Commercial",
                "type": "string"
              },
              "cursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cursor"
              },
              "followers_max": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Followers Max"
              },
              "followers_min": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Followers Min"
              },
              "genre": {
                "default": "",
                "enum": ["", "litrpg", "progression", "cultivation", "xianxia", "dungeon_core", "time_loop", "cozy", "fanfiction"],
                "title": "Genre",
                "type": "string"
              },
              "lifecycle": {
                "default": "",
                "enum": ["", "ongoing", "completed", "stubbed", "hiatus", "inactive", "dropped", "unknown"],
                "title": "Lifecycle",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "q": {
                "default": "",
                "title": "Q",
                "type": "string"
              },
              "readers_max": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Readers Max"
              },
              "readers_min": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Readers Min"
              },
              "sort": {
                "default": "audience",
                "enum": ["audience", "followers", "recent"],
                "title": "Sort",
                "type": "string"
              },
              "updated_days": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Updated Days"
              }
            },
            "title": "search_marketArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "search_marketDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:dbcf7db6e7b4ffbd5fc1667a5fa5a9e69c093f071227a16b3ed4e7c3acfb6e35"
        }
      ],
      "digest": "sha256:67278ba3b464fbc4d35aa8541a44ab39da8863b6b32085bc12e2feff2d945c75"
    }
  }
}
