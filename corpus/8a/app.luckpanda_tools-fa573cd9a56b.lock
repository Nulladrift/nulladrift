        {
          "name": "calculate_gst",
          "title": "Calculate India GST",
          "description": "GST on an amount in rupees: add GST to an amount before tax, or take it out of an amount that includes it; CGST + SGST for a supply within one state, IGST across states. Read-only arithmetic.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount in rupees, e.g. 10000.",
                "type": ["number", "string"]
              },
              "mode": {
                "description": "add: the amount is before GST (default). remove: the amount includes GST.",
                "enum": ["add", "remove"],
                "type": "string"
              },
              "rate": {
                "description": "GST rate in percent; default 18.",
                "type": ["number", "string"]
              },
              "supply": {
                "description": "intra: within one state, CGST + SGST (default). inter: another state or an export, IGST.",
                "enum": ["intra", "inter"],
                "type": "string"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amount_before_gst": {
                "type": "number"
              },
              "amount_including_gst": {
                "type": "number"
              },
              "components": {
                "items": {
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "rate_percent": {
                      "type": "number"
                    }
                  },
                  "required": ["amount", "name", "rate_percent"],
                  "type": "object"
                },
                "type": "array"
              },
              "currency": {
                "type": "string"
              },
              "formatted": {
                "description": "The amounts formatted for the currency's country.",
                "properties": {
                  "amount_before_gst": {
                    "type": "string"
                  },
                  "amount_including_gst": {
                    "type": "string"
                  },
                  "gst": {
                    "type": "string"
                  }
                },
                "required": ["amount_before_gst", "amount_including_gst", "gst"],
                "type": "object"
              },
              "gst": {
                "type": "number"
              },
              "locale": {
                "type": "string"
              },
              "mode": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "rate_percent": {
                "type": "number"
              },
              "supply": {
                "type": "string"
              }
            },
            "required": ["amount_before_gst", "amount_including_gst", "components", "currency", "formatted", "gst", "mode", "rate_percent", "supply"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate India GST"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e36a49bc91cef951119620f17b582e125eb4205e07f3c454b766738ec2d686e"
        },
        {
          "name": "calculate_vat",
          "title": "Calculate VAT",
          "description": "VAT on an amount: add it to a net amount or take it out of a gross one. UK by default; EU countries and the UAE by country (standard rate if no rate is given). Read-only arithmetic.",
