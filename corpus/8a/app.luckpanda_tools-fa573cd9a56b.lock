      "serverInfo": {
        "name": "luckpanda-tools",
        "title": "LuckPanda Document Tools",
        "version": "1.1.0",
        "description": "Create invoices, quotes, receipts and credit notes with GST or VAT, as prefilled links or PDFs.",
        "websiteUrl": "https://luckpanda.app/agents",
        "icons": [
          {
            "src": "https://luckpanda.app/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://luckpanda.app/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://luckpanda.app/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for creating business documents and for GST, VAT and loan arithmetic. No account is needed to call them. create_document_link and create_document_pdf take a document (invoice, quote, proforma invoice, receipt or credit note; any supported currency; India GST, UK and EU VAT, US sales tax) and return editor_url, a link that opens the document prefilled in the LuckPanda editor for 7 days, or a PDF. PDFs from this server include a LuckPanda footer and a verification QR code. get_document_rules returns the fields and tax rules for a document type and country. calculate_gst, calculate_vat, calculate_emi, check_gstin (format only) and find_hsn_code (India, a labelled subset) are read-only. Ask the person for every detail; do not invent business names, tax IDs, prices or dates. The tools do not issue, number or send documents and do not take payment: the person reviews the result in the editor.",
      "tools": [
        {
          "name": "calculate_emi",
          "title": "Calculate a loan EMI",
          "description": "Monthly EMI on a reducing-balance loan, total interest, total payment and the year-by-year schedule. Read-only arithmetic.",
          "inputSchema": {
            "properties": {
              "annual_rate": {
                "description": "Yearly interest in percent, e.g. 9.5.",
                "type": ["number", "string"]
              },
              "currency": {
                "description": "ISO 4217 code; default INR.",
                "type": "string"
              },
              "months": {
                "description": "Loan term in months (1 to 600). Give months or years.",
                "type": ["number", "string"]
              },
              "principal": {
                "description": "Loan amount.",
                "type": ["number", "string"]
              },
              "years": {
                "description": "Loan term in years (up to 50). Used when months is not given.",
                "type": ["number", "string"]
              }
            },
            "required": ["annual_rate", "principal"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "annual_rate_percent": {
                "type": "number"
              },
              "currency": {
                "type": "string"
              },
              "emi": {
                "type": "number"
              },
              "formatted": {
                "description": "The amounts formatted for the currency's country.",
                "properties": {
                  "emi": {
                    "type": "string"
                  },
                  "total_interest": {
                    "type": "string"
                  },
                  "total_payment": {
                    "type": "string"
                  }
                },
                "required": ["emi", "total_interest", "total_payment"],
                "type": "object"
              },
              "locale": {
                "type": "string"
              },
              "months": {
                "type": "integer"
              },
              "principal": {
                "type": "number"
              },
              "schedule_by_year": {
                "items": {
                  "properties": {
                    "balance": {
                      "type": "number"
                    },
                    "interest": {
                      "type": "number"
                    },
                    "principal": {
                      "type": "number"
                    },
                    "year": {
                      "type": "integer"
                    }
                  },
                  "required": ["balance", "interest", "principal", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_interest": {
                "type": "number"
              },
              "total_payment": {
                "type": "number"
              }
            },
            "required": ["annual_rate_percent", "currency", "emi", "formatted", "months", "principal", "schedule_by_year", "total_interest", "total_payment"],
            "type": "object"
          },
          "annotations": {
