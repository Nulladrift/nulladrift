        {
          "name": "create_document_link",
          "title": "Create a prefilled document link",
          "description": "Validates a document (invoice, quote, proforma invoice, receipt or credit note) and returns editor_url, a short link that opens it prefilled in the LuckPanda editor, where the person can review, edit and download the PDF. Also returns the totals with tax worked out, the required fields still missing and any parts left out as invalid. Side effect: the document is stored on LuckPanda's servers for 7 days under a random link id (not listed or indexed), and every call creates a new link. Nothing is issued, numbered or sent. Use details the person gave; do not invent them.",
          "inputSchema": {
            "properties": {
              "doc": {
                "description": "A document to prefill. Parts that fail validation are left out and listed in `ignored`; nothing is ever rendered as HTML.",
                "properties": {
                  "buyer": {
                    "description": "The client (for a receipt, who paid).",
                    "properties": {
                      "address": {
                        "description": "New lines as \\n.",
                        "maxLength": 600,
                        "type": "string"
                      },
                      "country_code": {
                        "description": "Buyer only; the seller's country is the document's country_code.",
                        "pattern": "^[A-Za-z]{2}$",
                        "type": "string"
                      },
                      "email": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "state_code": {
                        "description": "India: two-digit GST state code or the state name.",
                        "type": "string"
                      },
                      "tax_id": {
                        "description": "GSTIN (India), VAT number (UK/EU), EIN (US), ABN, TRN...",
                        "maxLength": 60,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "country_code": {
                    "description": "The seller's country: decides currency, formats and tax rules. If missing: the currency's country (INR -> IN, GBP -> GB …; EUR -> DE unless the caller is in a euro country), else the caller's country.",
                    "enum": ["US", "GB", "DE", "FR", "NL", "IE", "AE", "SG", "AU", "CA", "IN", "ES", "IT", "BE", "AT", "PT", "FI", "MX", "BR"],
                    "type": "string"
                  },
                  "currency": {
                    "description": "ISO 4217 code. If missing: the seller country's currency.",
                    "enum": ["USD", "EUR", "GBP", "INR", "AED", "SGD", "AUD", "CAD", "MXN", "BRL"],
                    "type": "string"
                  },
                  "due_date": {
                    "description": "Due date; for a quote, valid until.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": ["string", "null"]
                  },
                  "export_type": {
                    "description": "India, buyer abroad.",
                    "enum": ["none", "lut", "with_payment"],
                    "type": "string"
                  },
                  "issue_date": {
                    "description": "YYYY-MM-DD. Default: today.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "kind": {
                    "description": "Document type.",
                    "enum": ["invoice", "quote", "proforma", "credit_note", "receipt"],
                    "type": "string"
                  },
                  "lines": {
                    "description": "The items or services, 1 to 100 lines.",
                    "items": {
                      "properties": {
                        "description": {
                          "maxLength": 500,
                          "type": "string"
                        },
                        "discount_minor": {
                          "minimum": 0,
                          "type": "integer"
                        },
                        "hsn_sac": {
                          "description": "India: HSN (goods, 4/6/8 digits) or SAC (services, 6 digits starting 99).",
                          "type": "string"
                        },
                        "quantity": {
                          "description": "Decimal, up to 6 decimals (\"1\", \"2.5\").",
                          "type": ["string", "number"]
                        },
                        "tax_percent": {
                          "description": "Alternative: tax rate in percent (18).",
                          "type": ["string", "number"]
                        },
                        "tax_rate_bp": {
                          "description": "Tax rate in basis points: 18% = 1800.",
                          "maximum": 10000,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "unit_code": {
                          "description": "unit | hour | day | month | item",
                          "type": "string"
                        },
                        "unit_price": {
                          "description": "Alternative: price per unit in major units (\"1250.50\").",
                          "type": ["string", "number"]
                        },
                        "unit_price_minor": {
                          "description": "Price per unit in minor units (cents, paise).",
                          "minimum": 0,
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "notes": {
                    "description": "Shown on the document, for example a thank-you or a delivery note.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "original_invoice_date": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "original_invoice_number": {
                    "description": "Credit notes: the invoice it corrects.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "place_of_supply": {
                    "description": "India: GST state code, or 96 for another country.",
                    "type": "string"
                  },
                  "reason": {
                    "description": "Credit notes: refund, product_return, discount, price_correction, defect, cancellation, tax_correction, other, or the reason in your own words.",
                    "type": "string"
                  },
                  "reason_note": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "seller": {
                    "description": "Your business (who issues the document; for a receipt, who received the money).",
                    "properties": {
                      "address": {
                        "description": "New lines as \\n.",
                        "maxLength": 600,
                        "type": "string"
                      },
                      "country_code": {
                        "description": "Buyer only; the seller's country is the document's country_code.",
                        "pattern": "^[A-Za-z]{2}$",
                        "type": "string"
                      },
                      "email": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "state_code": {
                        "description": "India: two-digit GST state code or the state name.",
                        "type": "string"
                      },
                      "tax_id": {
                        "description": "GSTIN (India), VAT number (UK/EU), EIN (US), ABN, TRN...",
                        "maxLength": 60,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "terms": {
                    "description": "Payment terms and bank details; for a quote, validity and delivery terms.",
                    "maxLength": 2000,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "page": {
                "description": "The page to open: a slug (\"credit-note\", \"gst-invoice-format\") or its URL. Default: the generator for the document type and country.",
                "type": "string"
              }
            },
            "required": ["doc"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "docs_url": {
                "description": "Public page describing this server and its tools.",
                "type": "string"
              },
              "document_type": {
                "type": "string"
              },
              "editor_url": {
                "description": "Short link that opens the document prefilled in the LuckPanda editor. Valid until expires_at (7 days).",
                "type": "string"
              },
              "expires_at": {
                "description": "ISO 8601 time the link stops opening.",
                "type": "string"
              },
              "ignored": {
                "description": "Parts of the input that were left out because they were invalid, as dotted paths.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "missing": {
                "description": "Required fields still empty, as dotted paths (e.g. buyer.name, lines.0.description).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "page_url": {
                "description": "The editor page the link opens, without the document.",
                "type": "string"
              },
              "prefill_url": {
                "description": "A self-contained link with the document in the URL; present only when it is short enough.",
                "type": "string"
              },
              "totals": {
                "description": "Totals with tax worked out.",
                "properties": {
                  "currency": {
                    "description": "ISO 4217 code.",
                    "type": "string"
                  },
                  "discount_minor": {
                    "type": "integer"
                  },
                  "formatted": {
                    "description": "The amounts formatted for the document's country.",
                    "properties": {
                      "subtotal": {
                        "type": "string"
                      },
                      "tax": {
                        "type": "string"
                      },
                      "total": {
                        "type": "string"
                      }
                    },
                    "required": ["subtotal", "tax", "total"],
                    "type": "object"
                  },
                  "subtotal_minor": {
                    "description": "Before tax and discount, in minor units (cents, paise).",
                    "type": "integer"
                  },
                  "supply": {
                    "description": "India: the kind of supply, when it is known.",
                    "type": "string"
                  },
                  "tax_lines": {
                    "items": {
                      "properties": {
                        "amount": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "rate_percent": {
                          "type": "number"
                        }
                      },
                      "required": ["amount", "name", "rate_percent"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "tax_minor": {
                    "type": "integer"
                  },
                  "total_minor": {
                    "description": "Amount payable, in minor units.",
                    "type": "integer"
                  }
                },
                "required": ["currency", "formatted", "tax_lines", "total_minor"],
                "type": "object"
              }
            },
            "required": ["country", "currency", "document_type", "editor_url", "expires_at", "ignored", "missing", "page_url", "totals"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a prefilled document link"
          },
          "behavior": {
