            "properties": {
              "amount": {
                "description": "Amount in the country's currency, e.g. 1000.",
                "type": ["number", "string"]
              },
              "country": {
                "description": "GB (default), DE, FR, NL, IE, ES, IT, BE, AT, PT, FI or AE.",
                "type": "string"
              },
              "mode": {
                "description": "add: the amount is net (default). remove: the amount includes VAT.",
                "enum": ["add", "remove"],
                "type": "string"
              },
              "rate": {
                "description": "VAT rate in percent; default the country's standard rate.",
                "type": ["number", "string"]
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "country": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "formatted": {
                "description": "The amounts formatted for the currency's country.",
                "properties": {
                  "gross": {
                    "type": "string"
                  },
                  "net": {
                    "type": "string"
                  },
                  "vat": {
                    "type": "string"
                  }
                },
                "required": ["gross", "net", "vat"],
                "type": "object"
              },
              "gross": {
                "type": "number"
              },
              "locale": {
                "type": "string"
              },
              "mode": {
                "type": "string"
              },
              "net": {
                "type": "number"
              },
              "rate_percent": {
                "type": "number"
              },
              "standard_rate_percent": {
                "type": "number"
              },
              "vat": {
                "type": "number"
              }
            },
            "required": ["country", "currency", "formatted", "gross", "mode", "net", "rate_percent", "vat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calculate VAT"
          },
          "behavior": {
            "destructive": false,
