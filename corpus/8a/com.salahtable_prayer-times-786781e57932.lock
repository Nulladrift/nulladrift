            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae63b36a0cdbadbbe4e3c6f2964005af985bc64c08685595932c4f254d30f2d0"
        },
        {
          "name": "get_qibla",
          "title": "Qibla direction",
          "description": "Qibla bearing from true north, compass point and great-circle distance to the Kaaba for a city.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from find_city, e.g. \"karachi\", \"london\"",
