{
  "lockfileVersion": 2,
  "subjects": {
    "com.salahtable/prayer-times": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://salahtable.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "salahtable",
        "title": "SalahTable prayer times",
        "version": "1.0.0",
        "websiteUrl": "https://salahtable.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Islamic prayer times for 407 cities in 13 countries. Call find_city first to get the country and city slugs, then get_prayer_times or get_monthly_timetable. Times are calculated estimates (or published MUIS/JAKIM tables in Singapore and Malaysia), not a mosque's iqamah or Jumu'ah times. Asr differs by school: hanafi is later than shafi (Shafi'i, Maliki, Hanbali). Methodology: https://salahtable.com/methodology",
      "tools": [
        {
          "name": "find_city",
          "title": "Find a city",
          "description": "Look up a supported city by name (e.g. \"Lahore\", \"Birmingham UK\", \"new york\"). Returns slugs for the other tools, coordinates, time zone and the country's default method and Asr school, or close matches for misspellings.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "City name, optionally with region or country",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3b1240da32c2f7be72704f0bdf8b9cbe480ad3fa4b86072b0c319cdc0304965"
        },
        {
          "name": "get_monthly_timetable",
          "title": "Monthly prayer timetable",
          "description": "Daily prayer times for a whole month, from two months back to twelve months ahead of the city's current month.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from find_city, e.g. \"karachi\", \"london\"",
                "type": "string"
              },
              "country": {
                "description": "Country slug from find_city, e.g. \"pakistan\", \"united-kingdom\"",
                "type": "string"
              },
              "method": {
                "description": "Calculation method; defaults to the country's usual method",
                "enum": ["karachi", "isna", "mwl", "moonsighting", "ummalqura", "uoif", "diyanet", "egyptian", "dubai", "qatar", "kuwait", "singapore", "muis", "jakim", "malaysia"],
                "type": "string"
              },
              "month": {
                "description": "Month as YYYY-MM, e.g. \"2027-02\"",
                "type": "string"
              },
              "school": {
                "description": "Asr school; defaults to the country's usual school",
                "enum": ["hanafi", "shafi"],
                "type": "string"
              }
            },
            "required": ["city", "country", "month"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc7d57d53255e554dbeebcdeaf6ba8326edc00fc49db4a868ff643d6332351fb"
        },
        {
          "name": "get_prayer_times",
          "title": "Prayer times today and this week",
          "description": "Fajr, sunrise, Dhuhr, Asr, Maghrib and Isha for today and the next 7 days in the city's local time, the next prayer, and Asr for the other school.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City slug from find_city, e.g. \"karachi\", \"london\"",
                "type": "string"
              },
              "country": {
                "description": "Country slug from find_city, e.g. \"pakistan\", \"united-kingdom\"",
                "type": "string"
              },
              "method": {
                "description": "Calculation method; defaults to the country's usual method",
                "enum": ["karachi", "isna", "mwl", "moonsighting", "ummalqura", "uoif", "diyanet", "egyptian", "dubai", "qatar", "kuwait", "singapore", "muis", "jakim", "malaysia"],
                "type": "string"
              },
              "school": {
                "description": "Asr school; defaults to the country's usual school",
                "enum": ["hanafi", "shafi"],
                "type": "string"
              }
            },
            "required": ["city", "country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
