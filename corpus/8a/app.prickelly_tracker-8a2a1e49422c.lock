{
  "lockfileVersion": 2,
  "subjects": {
    "app.prickelly/tracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.prickelly.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "prickelly",
        "title": "Prickelly",
        "version": "1.0.0",
        "description": "Personal price tracker for Amazon.com.tr, Hepsiburada and Trendyol: search, price history, deals and watches.",
        "websiteUrl": "https://prickelly.app/mcp",
        "icons": [
          {
            "src": "https://prickelly.app/logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://prickelly.app/logo-1024.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          },
          {
            "src": "https://prickelly.app/logo.svg",
            "mimeType": "image/svg+xml"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Search products, read price history and deals without signing in. Adding, listing or removing watches needs a sign-in: OAuth, a session token, or an API key from the account page.",
      "tools": [
        {
          "name": "add_watch",
          "title": "Add a watch",
          "description": "Start watching a product for the signed-in user (product URL or id, optional target price). Sends a confirmation email; this tool does not confirm it. Requires a Bearer API key or session token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "description": "Output language: \"tr\" (default) or \"en\".",
                "type": "string"
              },
              "marketplace": {
                "type": "string"
              },
              "product": {
                "description": "Product id or shop URL to watch.",
                "type": "string"
              },
              "productId": {
                "description": "Product id to watch.",
                "type": "string"
              },
              "query": {
                "description": "A name to search if you do not have a link yet.",
                "type": "string"
              },
              "targetPrice": {
                "description": "Optional target price in TRY.",
                "type": "number"
              },
              "target_price": {
                "description": "Alias of targetPrice.",
                "type": "number"
              },
              "url": {
                "description": "Product URL to watch.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add a watch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c087f0e6df849264a2455f56aeeaebe60e9b86495d68dd40eec0b0da8ae8a3f"
        },
        {
          "name": "get_deals",
          "title": "Get deals",
          "description": "List current real price drops from the same source as the Prickelly deals page (last 7 days). Optional marketplace filter. No sign-in required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Optional category name. Not yet used for filtering; included for forward compatibility.",
                "type": "string"
              },
              "lang": {
                "description": "Output language: \"tr\" (default) or \"en\".",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-20, default 8.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "marketplace": {
                "description": "Optional marketplace: amazon_tr, hepsiburada, or trendyol.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b56ab0f8b1220d0be481eb43ec55b4c80f8f812fc66bbd1a36aae5a386fb74e3"
        },
        {
          "name": "get_price_history",
          "title": "Get price history",
          "description": "Get price history for one product (by Prickelly or shop product id, or a product URL). Returns recent points, min, max, current, and a short verdict based only on that history. No sign-in required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "description": "History window in days, default 90, max 365.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "lang": {
                "description": "Output language: \"tr\" (default) or \"en\".",
                "type": "string"
              },
              "marketplace": {
                "description": "Optional marketplace when only a product id is given.",
                "type": "string"
              },
              "product": {
                "description": "Product id or shop / Prickelly history URL.",
                "type": "string"
              },
              "productId": {
                "description": "Product id, for example HBCV00008O0L2Z or an Amazon ASIN.",
                "type": "string"
              },
              "url": {
                "description": "Product URL from Amazon.com.tr, Hepsiburada, Trendyol, or a Prickelly history link.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get price history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b34aa084bc5eb5b216e04516859b23dadb18b055a2dc92d73dee0270de85bbd5"
        },
        {
          "name": "list_watches",
          "title": "List watches",
          "description": "List the signed-in user's watched products. Requires a Bearer API key or session token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "description": "Output language: \"tr\" (default) or \"en\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List watches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:025fe99e7227bf509cbab3c97545b17025b0d3e5e9d5794a73572fad3bf99400"
        },
        {
          "name": "remove_watch",
          "title": "Remove a watch",
          "description": "Remove one of the signed-in user's watches, by watch id or product URL/id. Requires a Bearer API key or session token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Watch id returned by list_watches.",
                "type": "string"
              },
              "lang": {
                "description": "Output language: \"tr\" (default) or \"en\".",
                "type": "string"
              },
              "marketplace": {
                "type": "string"
              },
              "productId": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Remove a watch"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7d1183a4df6848c0f62a10802b628fc74a1bf538382eaa5cafb7a6ed9b883ba0"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search the Prickelly catalog for products on Amazon.com.tr, Hepsiburada or Trendyol. Returns the current price, marketplace, shop URL and Prickelly history link. No sign-in required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "description": "Output language: \"tr\" (default) or \"en\".",
                "type": "string"
              },
              "limit": {
                "description": "Max results, 1-20, default 8.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "marketplace": {
                "description": "Optional marketplace: amazon_tr, hepsiburada, or trendyol.",
                "type": "string"
              },
              "query": {
                "description": "Search text, for example a product name or brand.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:23cc03d9b29d0560613e33a309e42ab4a2daf4f919bd3f4670f52df5f1ba801f"
        }
      ],
      "digest": "sha256:28c3db689a23d792e6b8c98b6f29928ac3ad15ce0b967275606c754de233d7f9"
    }
  }
}
