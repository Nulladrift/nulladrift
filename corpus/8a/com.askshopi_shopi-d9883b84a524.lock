{
  "lockfileVersion": 2,
  "subjects": {
    "com.askshopi/shopi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tdmveqiseajuuavgkskm.supabase.co/functions/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "shopi",
        "title": "Shopi",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Shopi gives a product's verdict with the sources behind it, and checked prices with where and when each was read. It never sends a verdict without a source, takes no commission and runs no ads.",
      "tools": [
        {
          "name": "add_request",
          "title": "Leave a request with Shopi",
          "description": "Leave a standing request on the signed-in shopper's Shopi desk: what they need and the most they'll spend. Shopi researches it and asks the shopper before anything is bought; it never buys or checks out by itself. Needs the shopper to connect Shopi with permission to add requests.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "The most they want to spend, in major units (800 = $800).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "currency": {
                "description": "ISO 4217 currency of the budget; USD when omitted.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "need": {
                "description": "What they're shopping for, in their words, e.g. 'a quiet dishwasher'.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["budget", "need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["requests:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:246add201ba56d7c91e5d80132e589545e76519087229d8e8f659523b0730a6a"
        },
        {
          "name": "add_watch",
          "title": "Watch a price",
          "description": "Add a product to the signed-in shopper's Your Watches, so Shopi tells them when its price really drops. Use the product_id from get_verdict. It never buys anything. Needs the shopper to connect Shopi with permission to add watches.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 currency of the target; USD when omitted.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "product": {
                "description": "A Shopi product_id, as returned by get_verdict.",
                "pattern": "^[A-Za-z0-9_-]{8,128}$",
                "type": "string"
              },
              "target_price": {
                "description": "The price the shopper hopes for, in major units. Recorded with the watch.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["product", "target_price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["watches:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ba7b5d5327ea2887703b5e7fedc77e9951231d4ae6c1151631373aaf1edd6288"
        },
        {
          "name": "check_owned",
          "title": "Do I already own this?",
          "description": "Whether the signed-in shopper (or their household) already owns this product, with a count. Needs the shopper to connect Shopi. Use the product_id from get_verdict.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "A Shopi product_id, as returned by get_verdict.",
                "pattern": "^[A-Za-z0-9_-]{8,128}$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["owned:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cc1c68d91fcb19d3345fbbcb1567cf2c45ac411f108160587e39f0ec907132c0"
        },
        {
          "name": "get_desk",
          "title": "The shopper's Shopi desk",
          "description": "What is waiting on the signed-in shopper's Shopi desk: recalls on things they own, standing requests and price watches, each with a title and a link. Needs the shopper to connect Shopi.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["desk:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:ecdfdbeb862cc093b89937ef50af5e6490f047178c453ddf5fb93530702ec450"
        },
        {
          "name": "get_my_taste",
          "title": "The shopper's stated preferences",
          "description": "The signed-in shopper's stated shopping preferences on Shopi, in their own words, and their budget ceiling if they gave one. Use it to fit a recommendation to them. Needs the shopper to connect Shopi and allow \"your stated preferences\"; without that it returns how to allow it, and no data. It never returns their notes, searches or purchases.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["taste:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fd7e507972d00df3048574596fd7fa056e50eb4f9085d4e919f436bedbeb7bb5"
        },
        {
          "name": "get_price",
          "title": "Checked prices",
          "description": "Prices Shopi has checked for a product at each store, each with the link it was read from and when. Use the product_id from get_verdict. Returns 'no checked price' when none is on record. Shopi takes no commission and runs no ads.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product": {
                "description": "A Shopi product_id, as returned by get_verdict.",
                "pattern": "^[A-Za-z0-9_-]{8,128}$",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e7617ba7aca7f1a292daef85c7f183757f795615f991ccf4762b4b24e9919df3"
        },
        {
          "name": "get_verdict",
          "title": "Shopi's verdict",
          "description": "Shopi's verdict on a product, with the sources it was researched from. Give exactly one of: query (the product's name), gtin (a UPC/EAN barcode), or url (a Shopi product page link). Returns 'no sourced verdict' when Shopi has no verdict it can back with a source.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gtin": {
                "description": "A GTIN-8/12/13/14 (UPC or EAN) barcode.",
                "pattern": "^(\\d{8}|\\d{12}|\\d{13}|\\d{14})$",
                "type": "string"
              },
              "query": {
                "description": "The product's name, e.g. 'Ankarsrum Original stand mixer'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "A Shopi product page link (https://askshopi.com/p/…).",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:6464381db71c5dd607d3c7dc1a747e1a7951a8efd28785795bfb58048be9bd96"
        }
      ],
      "digest": "sha256:d19aa3099e2a08d272d88735d71f0a3a4e5bbd747df1ca60b6d6af6526712f47"
    }
  }
}
