  "subjects": {
    "com.morsecodetranslator/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://morsecodetranslator.com/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Morse Code Translator",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Translates between text and International Morse code, by morsecodetranslator.com. Use text_to_morse to encode text, morse_to_text to decode dots and dashes, morse_audio to get the sound of a text as a WAV file, and morse_alphabet for the code chart. Morse code is written with \".\" and \"-\", one space between letters and \" / \" between words. Show the result to the user with the translator link: the page plays the code as sound, at any speed and tone, and can download it.",
      "tools": [
        {
          "name": "morse_alphabet",
          "title": "Morse code alphabet",
          "description": "Returns the International Morse code chart: the letters A-Z, the digits 0-9 and punctuation, each with its code.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Morse code alphabet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40418caa907a0d525a78db0f839752998a935ccca61e1e5be83515c50d837664"
        },
        {
          "name": "morse_audio",
          "title": "Morse code audio",
          "description": "Translates text into International Morse code and returns the sound as a WAV audio file (8 kHz mono), with the code as text and a link to the translator on morsecodetranslator.com. Choose the speed in words per minute (5-40, default 20) and the tone in hertz (300-1000, default 600). The sound can be at most 60 seconds long: use a higher speed or a shorter text for more.",
          "inputSchema": {
            "properties": {
              "frequency": {
                "description": "The tone in hertz, 300 to 1000. Default: 600.",
                "maximum": 1000,
                "minimum": 300,
                "type": "integer"
              },
              "text": {
                "description": "The text to play as Morse code, at most 200 characters.",
                "maxLength": 200,
                "type": "string"
              },
              "wpm": {
                "description": "The speed in words per minute, 5 to 40. Default: 20.",
                "maximum": 40,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Morse code audio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17502630343dd21d4994a4d874c6af83226d254fcac79670664b44802f2c2e69"
        },
        {
          "name": "morse_to_text",
          "title": "Morse code to text",
          "description": "Decodes International Morse code into text. Write dots as \".\" and dashes as \"-\"; separate letters with a space and words with \" / \", a line break or three spaces. Returns the text in capital letters, lists any groups that are not Morse characters (shown as # in the text), and gives a link to the translator on morsecodetranslator.com with the code filled in.",
          "inputSchema": {
            "properties": {
              "morse": {
                "description": "The Morse code to decode, at most 5000 characters, for example \".... .. / - .... . .-. .\".",
                "maxLength": 5000,
                "type": "string"
              }
            },
            "required": ["morse"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Morse code to text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36290dcdfa3e3fbc70f08f036e64ca940f4dcc657341fad20f3ab1d75cb92142"
        },
        {
          "name": "text_to_morse",
          "title": "Text to Morse code",
          "description": "Translates text into International Morse code (letters A-Z, digits 0-9 and common punctuation). Returns the code with \".\" and \"-\", one space between letters and \" / \" between words, lists any characters that have no Morse code, and gives a link to the translator on morsecodetranslator.com with the code filled in.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The text to translate, at most 1000 characters.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Text to Morse code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96108f99dc814f114f1d08674348a27c2690cce7603b6fcd985a1a7f8078844d"
        }
      ],
      "digest": "sha256:c68e65a1b63622cb749c63347d61678e80c4bc700441f214a44dcce0a4d937c2"
    }
  }
}
