              "city": {
                "description": "City name or WonderKit city key, such as \"Paris\" or \"paris-france\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "slug": {
                "description": "Optional itinerary slug to link a specific public plan.",
