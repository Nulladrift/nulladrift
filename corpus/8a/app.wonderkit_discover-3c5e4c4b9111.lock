              },
              "guideList": {
                "type": "string"
              },
              "hint": {
                "type": "string"
              },
              "itinerariesUrl": {
                "description": "WonderKit itineraries for this city",
                "format": "uri",
                "type": "string"
              },
              "links": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "matches": {
                "description": "Candidate cities when the name is ambiguous",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "cityKey": {
                      "type": "string"
                    },
                    "discoverUrl": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["city", "cityKey"],
                  "type": "object"
                },
                "type": "array"
              },
              "nearest": {
                "description": "Covered cities in or near the asked-for area. Not the city that was asked for",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "cityKey": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The WonderKit page for this city",
                      "format": "uri",
                      "type": "string"
                    },
                    "why": {
                      "description": "Why this city is offered, e.g. \"in Vermont\" or \"near Wyoming\"",
                      "type": "string"
                    }
                  },
                  "required": ["city", "cityKey", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "description": "Read-only reminder; not user content",
                "type": "string"
              },
              "planDescription": {
                "description": "One line saying what planUrl opens",
                "type": "string"
              },
              "planUrl": {
                "description": "Guest planner link for the destination as asked; it plans any city",
                "format": "uri",
                "type": "string"
              },
              "reason": {
                "description": "unknown_city, region_not_city, no_city_guide, no_itineraries_for_city, ambiguous_city, no_published_guide, no_matches, unknown_itinerary, lookup_failed, …",
                "type": "string"
              },
              "region": {
                "description": "The state, country, or area the city ask was read as",
                "type": "string"
              },
              "suggestions": {
