        },
        {
          "name": "hide_products",
          "title": "Hide products",
          "description": "Use when the venue owner asks to remove, hide or take products off their own menu. Products are hidden from the public menu, not deleted, and can be shown again with update_products (available: true) or undo_change. Identify products by product_id from get_my_menu. Up to 50 per call. Two steps: preview without confirm, then confirm: true after the owner agrees. Requires the owner to connect their PRENOTO account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "false or omitted: preview only. true: hide, only after the owner agreed.",
                "type": "boolean"
              },
              "product_ids": {
                "description": "From get_my_menu.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "venue_id": {
                "description": "Optional. Only needed when the account manages several venues (see list_my_venues).",
                "type": "string"
              }
            },
            "required": ["product_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Hide products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ea572ce0cfcade27e357411a288da71747548578ceb75c06f402a4b6b1fb6b92"
        },
        {
          "name": "list_my_venues",
          "title": "List my venues",
          "description": "Use when the venue owner asks about their own PRENOTO Menu venues. Returns the venues of the signed-in PRENOTO account with their public menu link. Requires the owner to connect their PRENOTO account. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my venues"
          },
          "behavior": {
            "destructive": false,
