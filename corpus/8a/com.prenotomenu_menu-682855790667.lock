          },
          "digest": "sha256:29ddacc29a42c5e835188abaf16f81a965c85971fcbb847c86de171c75558040"
        },
        {
          "name": "undo_change",
          "title": "Undo a change",
          "description": "Use when the venue owner wants to undo a change made through update_products, add_products or hide_products. Pass the change_id returned when the change was saved. Undoing an added product removes it (and the category created with it, if left empty), as long as it was not changed after being added; otherwise it is hidden. Two steps: preview without confirm, then confirm: true after the owner agrees. Requires the owner to connect their PRENOTO account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change_id": {
                "description": "Returned by the tool that made the change.",
                "type": "string"
              },
              "confirm": {
                "description": "false or omitted: preview only. true: undo, only after the owner agreed.",
                "type": "boolean"
              }
            },
            "required": ["change_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Undo a change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ecdb03baa706009ef1fa568d325292d1790c29c517a6c8e35d89d4f393f1a391"
        },
        {
          "name": "update_products",
          "title": "Change products",
          "description": "Use when the venue owner asks to change products on their own menu: price, name, description, ingredients, allergens, availability (sold out / back) or featured. Identify products by product_id from get_my_menu; if several products match what the owner said (for example two with the same name), ask which one. Up to 50 products per call. Two steps: call first without confirm to get the before/after (nothing is saved), show it to the owner, and only after they agree call again with the same changes and confirm: true. Allergens: only the 14 EU codes and only when the owner states them; never guess. Changed texts are translated automatically. Every change can be undone with undo_change. Requires the owner to connect their PRENOTO account. Reply in the owner's language.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "changes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "allergens": {
                      "description": "Full new list of allergens (replaces the current one). Only what the owner states.",
                      "items": {
                        "enum": ["gluten", "crustaceans", "eggs", "fish", "peanuts", "soy", "milk", "nuts", "celery", "mustard", "sesame", "sulphites", "lupin", "molluscs"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "available": {
                      "description": "false = sold out / hidden from the public menu; true = shown again.",
                      "type": "boolean"
                    },
                    "description": {
                      "description": "Empty string or null removes it.",
                      "maxLength": 1000,
                      "type": ["string", "null"]
                    },
                    "featured": {
                      "type": "boolean"
                    },
                    "ingredients": {
                      "description": "Empty string or null removes it.",
                      "maxLength": 1000,
                      "type": ["string", "null"]
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "price": {
                      "description": "New price in the venue currency, without symbol.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "product_id": {
                      "description": "From get_my_menu.",
                      "type": "string"
                    }
                  },
                  "required": ["product_id"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "confirm": {
                "description": "false or omitted: preview only. true: save, only after the owner agreed to the preview.",
                "type": "boolean"
              },
              "venue_id": {
                "description": "Optional. Only needed when the account manages several venues (see list_my_venues).",
                "type": "string"
              }
            },
            "required": ["changes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change products"
          },
