        {
          "name": "get_my_menu",
          "title": "Read my menu",
          "description": "Use when the venue owner wants to see or check their current menu: categories, products, prices, availability and allergens, with the ids needed for later changes. Requires the owner to connect their PRENOTO account. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
