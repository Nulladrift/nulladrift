{
  "lockfileVersion": 2,
  "subjects": {
    "com.prenotomenu/menu": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.prenotomenu.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "prenoto-menu",
        "title": "PRENOTO Menu",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PRENOTO Menu creates digital QR menus for restaurants, bars, cafés and hotels.\n1. Ask the user for a photo, PDF or text of the venue's current menu (or use the one already shared).\n2. Read it carefully and build the JSON: keep names and prices exactly as written; categories in menu order; do not invent dishes, descriptions or allergens.\n3. Set business.defaultLanguage to the language the menu is written in. PRENOTO translates it to the other 5 languages.\n4. Put any doubt (illegible price, unclear item) in notes instead of guessing.\n5. Call create_menu_preview. Give the user the preview_url and tell them to open it, review prices and allergens, and click 'Continue with this menu' to activate it for free.\nAlways reply to the user in the language they are writing in, even when the menu is in another language.\nImages are not accepted through this tool; the owner can add photos after activating the menu.",
      "tools": [
        {
          "name": "about_prenoto_menu",
          "title": "About PRENOTO Menu",
          "description": "Return factual information about PRENOTO Menu: what it does, price, supported languages and features. Use when the user asks what PRENOTO Menu is or how it works. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About PRENOTO Menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbfb45c9a102aed197da5973c47c49296ff94aba91d4b886e52d01349735efbf"
        },
        {
          "name": "create_menu_preview",
          "title": "Create a digital QR menu",
          "description": "Use when the user asks to create a digital or QR menu for a restaurant, bar, café or hotel. Convert the venue's existing menu (photo, PDF or text shared by the user) into this JSON. Keep dish names and prices exactly as written, keep categories in menu order and never invent dishes, descriptions or allergens; put any doubt in notes. Creates a private preview link where the venue owner reviews, edits and activates the menu. The menu is translated automatically into English, Italian, Spanish, French, German and Portuguese. Side effect: every call creates a new preview, so retrying creates another link. Images are not accepted; the owner adds photos after activating. Reply to the user in their own language.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "businessType": {
                    "description": "Use wine_bar for bars, cafés and wine bars. Default restaurant.",
                    "enum": ["restaurant", "wine_bar", "hotel", "beach_club", "food_truck", "event"],
                    "type": "string"
                  },
                  "currency": {
                    "description": "ISO code such as EUR, CHF, USD, GBP. Default EUR.",
                    "maxLength": 8,
                    "type": "string"
                  },
                  "defaultLanguage": {
                    "description": "Language the menu is written in. PRENOTO translates it to the other 5 languages automatically.",
                    "enum": ["es", "it", "en", "fr", "de", "pt"],
                    "type": "string"
                  },
                  "description": {
                    "description": "One short sentence about the venue (optional).",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "instagram": {
                    "description": "Username without @.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "name": {
                    "description": "Venue name, exactly as on the menu or sign.",
                    "maxLength": 160,
                    "type": "string"
                  },
                  "openingHours": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "whatsapp": {
                    "description": "International format, e.g. +41 79 123 45 67.",
                    "maxLength": 100,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "products": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "allergens": {
                            "description": "Only allergens stated on the menu. Never guess.",
                            "items": {
                              "enum": ["gluten", "crustaceans", "eggs", "fish", "peanuts", "soy", "milk", "nuts", "celery", "mustard", "sesame", "sulphites", "lupin", "molluscs"],
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "available": {
                            "type": "boolean"
                          },
                          "description": {
                            "maxLength": 1000,
                            "type": "string"
                          },
                          "ingredients": {
                            "maxLength": 1000,
                            "type": "string"
                          },
                          "name": {
                            "maxLength": 200,
                            "type": "string"
                          },
                          "price": {
                            "description": "Number with up to 2 decimals, without currency symbol. Use 0 only if the menu shows no price.",
                            "minimum": 0,
                            "type": "number"
                          }
                        },
                        "required": ["name", "price"],
                        "type": "object"
                      },
                      "minItems": 1,
                      "type": "array"
                    },
                    "station": {
                      "description": "kitchen for food, bar for drinks.",
                      "enum": ["kitchen", "bar"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "products"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "description": "Doubts while reading the menu (illegible prices, unclear items). The owner sees them as warnings.",
                "items": {
                  "maxLength": 1000,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["business", "categories"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a digital QR menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4beb1f17770a50e4fc6d766b4befe681986f9ba5bcf40c71ea1d73712c22b08c"
        },
        {
          "name": "get_menu_format",
          "title": "Menu format and instructions",
          "description": "Return the step-by-step instructions, the JSON format and an example for create_menu_preview. Read-only; it does not create anything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Menu format and instructions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bac02fdb1977e67fcd76b76f8e22471112435be49095d65aead742776940c98"
        }
      ],
      "digest": "sha256:937befe1701fc60346cbff7275501d97fb83e8c03389bed37e59bd663ab368f1"
    }
  }
