      "instructions": "Company Jobs Feed (jobs_* only): live openings from the public Greenhouse, Lever and Ashby APIs, plus Personio's documented XML feed, Pinpoint's documented postings.json, and a named Gem job board when you already know the account. Free tools: jobs_get_board, jobs_get_job, jobs_find_board, jobs_check_open, jobs_list_seed_boards, jobs_search_by_location. jobs_search_companies is offline here (COMING_SOON, runs and bills nothing). Paid indexed Jobs search is live: 8,800+ Greenhouse, Ashby and Lever boards in one call, radius and salary filters, fresh daily index, as the Apify Actor https://apify.com/fairquery/jobs-index-search or https://mcp.getfairquery.com/jobs-index/mcp (your own Apify token). SmartRecruiters, LinkedIn, Workday, Workable, Recruitee and Rippling are not supported and are never contacted. This is Fairquery's hosted Company Jobs Feed MCP (stateless Streamable HTTP on this Fairquery-hosted Worker). This endpoint registers jobs tools only. Free tools need no account and no token. Indexed Jobs search is not on this endpoint (see the Actor and /jobs-index/mcp above); jobs_search_companies returns COMING_SOON, does not read a token, and does not start an Apify Actor run. There is no server-side token. The local npm server is @fairquery/company-jobs-feed-mcp.",
      "tools": [
        {
          "name": "jobs_check_open",
          "title": "Re-check whether one job is still published (free)",
          "description": "Indexed Jobs search is LIVE (paid, on your own Apify token): one call searches 8,800+ Greenhouse, Ashby and Lever company boards, with radius and salary filters, from a fresh daily index (not a live scrape of a few boards). Run it as the Apify Actor https://apify.com/fairquery/jobs-index-search or the MCP https://mcp.getfairquery.com/jobs-index/mcp (send your Apify token). New Apify accounts get a $5 starter credit. This free tool stays free and live-scans the 135-board starter list.\nWHAT: Re-check ONE job on the employer's ATS right now and report open or closed.\nWHEN: Before applying, alerting or contacting about a specific job you got earlier (job_key or ats + slug + jobId), when you only need open or closed.\nWHEN NOT: One job's full detail (jobs_get_job). Listing a board (jobs_get_board). Checking many jobs at once (jobs_search_companies is offline here; this tool checks one job).\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs or results. The job id and board slug are sent to the public ATS host in the requests below. Greenhouse, Lever: one GET to the documented per-job endpoint; HTTP 404 = closed. Ashby, Personio, Pinpoint and Gem have no per-job read here, so the documented board feed is fetched once and searched for the id (method \"board_listing\"). Personio is robots.txt then /xml. Pinpoint is robots.txt then /postings.json. Gem is GET /job_posts/ only. No apply URL is requested. \"open\" means currently published by the employer; it does not prove the role is still being filled.\nCOST: No APIFY_TOKEN, no billing.\nRETURNS: One \"open_check\" row (job = the full \"job\" row when includeDescription=true and the job is open, else null), or a tool error: INVALID_INPUT, BOARD_NOT_FOUND, HOST_BLOCKED or NETWORK_ERROR (the last two retryable).\nPARAMETERS: A malformed jobKey, or neither jobKey nor a complete ats + slug + jobId, returns INVALID_INPUT without a request. An Ashby, Personio, Pinpoint or Gem id costs one full board download; on Greenhouse and Lever a 404 triggers one extra board request so a closed job (status closed) is told apart from a missing board (BOARD_NOT_FOUND). includeDescription adds no request on Greenhouse and Lever and makes the Ashby or Personio board download include descriptions. Pinpoint and Gem description_text stay empty (the row links out). description_text is plain text, <= 20,000 chars, e-mails/phones removed, exactly as in jobs_get_board.\nEXAMPLE: {\"jobKey\":\"greenhouse:stripe:8172503\"} -> {\"status\":\"open\",\"method\":\"detail_endpoint\"}.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ats": {
                "description": "Required unless jobKey is given. The applicant-tracking system hosting the board: \"greenhouse\" | \"lever\" | \"ashby\" | \"personio\" | \"pinpoint\" | \"gem\" (the first part of job_key). Example: \"greenhouse\"",
                "enum": ["greenhouse", "lever", "ashby", "personio", "pinpoint", "gem"],
                "type": "string"
              },
              "includeDescription": {
                "description": "Optional boolean, default false. true adds job: the full job row (title, location, compensation, posted_at, description_text, ...) when the job is open. On Pinpoint and Gem, description_text stays empty. Example: true",
                "type": "boolean"
              },
              "jobId": {
                "description": "Required unless jobKey is given. The ATS job id (job_id field, the last part of job_key), 1-100 chars: numeric on Greenhouse and Personio, a UUID on Lever and Ashby, the posting id on Pinpoint, the job post id on Gem. Example: \"8172503\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "jobKey": {
                "description": "Optional if ats + slug + jobId are given; wins when both are given. The job_key field of a job row, format \"{ats}:{slug}:{job_id}\" with ats in lowercase (greenhouse | lever | ashby | personio | pinpoint | gem); any other shape returns INVALID_INPUT. Examples: \"greenhouse:stripe:8172503\", \"personio:acme:4103\", \"gem:acme:am9icG9zdA\"",
                "maxLength": 250,
                "type": "string"
              },
              "slug": {
                "description": "Required unless jobKey is given. Board slug from the public board URL (boards.greenhouse.io/{slug}, jobs.lever.co/{slug}, jobs.ashbyhq.com/{slug}, or the Personio account, Pinpoint subdomain or Gem vanity; the middle part of job_key), case-insensitive, 1-100 chars: a letter or digit, then letters, digits, \".\", \"_\" or \"-\". A Personio account, Pinpoint subdomain or Gem vanity cannot contain a dot. Example: \"stripe\"",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows. Each has \"type\": \"job\" (job_key, title, company, locations, countries, remote, posted_at, verified_open_at, age_days, long_open, apply_url, source_url, ...), \"board\", \"company\", \"seed_board\", \"open_check\" or \"error\" (code, message, retryable)",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": {},
                "description": "Tool-specific context: board totals, request counts, cost notes",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Offset to pass for the next page, or null when done"
              },
              "offset": {
                "description": "Offset of the first item in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "total": {
                "description": "Total items after filters, before paging",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["count", "hasMore", "items", "nextOffset", "offset", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Re-check whether one job is still published (free)"
