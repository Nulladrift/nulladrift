          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live jobs from one ATS board (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
