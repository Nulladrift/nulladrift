        {
          "name": "jobs_get_board",
          "title": "Get live jobs from one ATS board (free)",
          "description": "Indexed Jobs search is LIVE (paid, on your own Apify token): one call searches 8,800+ Greenhouse, Ashby and Lever company boards, with radius and salary filters, from a fresh daily index (not a live scrape of a few boards). Run it as the Apify Actor https://apify.com/fairquery/jobs-index-search or the MCP https://mcp.getfairquery.com/jobs-index/mcp (send your Apify token). New Apify accounts get a $5 starter credit. This free tool stays free and live-scans the 135-board starter list.\nWHAT: Fetch every job currently published on ONE company board from its official public ATS API (Greenhouse, Lever or Ashby), from Personio's documented XML feed, from Pinpoint's documented postings.json, or from a named Gem job board, normalize it and filter it on this Worker.\nWHEN: You know the board (ats + slug), e.g. from jobs_find_board or a careers-page link, and want its live openings now. For Personio, Pinpoint and Gem you already know the company account, subdomain or vanity.\nWHEN NOT: One known job's full detail (jobs_get_job). Jobs in a place or by role across the starter list, without a company name (jobs_search_by_location). Do not ask the user for a company and do not call this tool or jobs_find_board first for that ask. Many companies at once, history (new/closed/reposted since last run), or careers-page discovery at scale: use paid indexed search (Apify Actor fairquery/jobs-index-search or https://mcp.getfairquery.com/jobs-index/mcp, your own Apify token). jobs_search_companies is offline here and not billed. Use jobs_search_by_location for a place or role on the 135 starter boards. Unknown Greenhouse/Lever/Ashby board: use jobs_find_board first. Personio, Pinpoint and Gem are never discovered. SmartRecruiters, LinkedIn, Workday, Workable, Recruitee and Rippling are not supported and never contacted.\nBEHAVIOR: Runs on this Fairquery-hosted Worker (Cloudflare), not on the caller's machine; inputs leave the client. This Worker's code is designed not to store inputs or results. The slug is sent to the public ATS host in the requests below. Greenhouse, Lever and Ashby: one GET to the documented API host only (very large Greenhouse boards: a second, lighter GET). Personio: robots.txt, then GET https://{account}.jobs.personio.de/xml only; all Personio accounts share one lane, one at a time, at least 1.5 s apart. Pinpoint: that tenant's robots.txt, then GET https://{subdomain}.pinpointhq.com/postings.json only (not jobs.json, not /api/v1); each subdomain is its own lane, one at a time, at least 1 s apart. Gem: one read of Gem's public job-board API (the job_posts list for the vanity you name; no sign-in, never submits applications); every vanity shares one lane, one at a time, at least 1 s apart. Pinpoint and Gem description_text stay empty (link out; the ad body is not copied). Gem job_url points at jobs.gem.com. Pinpoint job_url is the tenant listing link. Emails and phones are not kept from a Pinpoint posting. Nothing stored, no history: first_seen_at = now and change = null. Any HTTP 403/429 stops that host for the session (kill switch, HOST_BLOCKED error). A blocked Personio or Pinpoint host does not block other companies. A blocked Gem response stops api.gem.com for the session. Lever requests are spaced 1 s apart (its robots.txt Crawl-delay).\nCOST: No APIFY_TOKEN, no billing.\nRETURNS: Paged \"job\" rows. compensation only when the ATS publishes it; posted_at is the ATS date or null (never guessed); age_basis says how age_days was derived.\nPARAMETERS: All filters are AND-ed; values inside one filter are OR-ed. titleIncludes/titleExcludes match whole words (\"engineer\" does not match \"Engineering\"). countries uses the ATS's structured country where present (Lever, Ashby) and a place-name list otherwise; rows without any country are dropped when countries is set. postedWithinDays drops rows with posted_at = null. Paging re-fetches the board, so pages from different calls can shift if the employer edits the board in between.\nEXAMPLE: {\"ats\":\"ashby\",\"slug\":\"ramp\",\"titleIncludes\":[\"engineer\"],\"remote\":\"only\"} -> remote engineering roles at Ramp with salary ranges.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ats": {
                "description": "Required. The applicant-tracking system hosting the board: \"greenhouse\" | \"lever\" | \"ashby\" | \"personio\" | \"pinpoint\" | \"gem\". Personio, Pinpoint and Gem are the account, subdomain or vanity you name, not a discovered board. Example: \"ashby\"",
                "enum": ["greenhouse", "lever", "ashby", "personio", "pinpoint", "gem"],
                "type": "string"
              },
              "countries": {
                "description": "Optional ISO-3166 alpha-2 codes, any-of, case-insensitive. Example: [\"US\",\"DE\"]",
                "items": {
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "includeDescription": {
                "description": "Optional boolean, default false. true adds description_text (plain text, <= 20,000 chars, e-mails/phones removed)",
                "type": "boolean"
              },
              "limit": {
                "description": "Optional page size, integer 1-500, default 50",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "Optional, 0-50 strings, any-of. Substring match on location text. US state names and codes match both ways (FL and Florida); NYC, SF, LA, DC, Tampa Bay and other US metro aliases match. \"remote\" also matches ATS remote flags. Example: [\"new york\",\"berlin\"]",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "longOpenDays": {
                "description": "Optional integer, default 60: rows older than this get long_open = true (a heuristic, not proof of a ghost job)",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Optional items to skip, integer >= 0, default 0; pass nextOffset from the previous response",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "postedWithinDays": {
                "description": "Optional integer 1-3650: keep jobs whose ATS publish date is at most this many days old. Example: 14",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "remote": {
                "description": "Optional, \"any\" | \"only\" | \"exclude\", default \"any\"",
                "enum": ["any", "only", "exclude"],
                "type": "string"
              },
              "slug": {
                "description": "Required. Board slug as it appears in the public board URL (case-insensitive): boards.greenhouse.io/{slug}, jobs.lever.co/{slug}, jobs.ashbyhq.com/{slug}, the Personio account in {account}.jobs.personio.de, the Pinpoint subdomain in {subdomain}.pinpointhq.com, or the Gem vanity in jobs.gem.com/{vanity}. Named feeds reject a dot. 1-100 chars. Example: \"ramp\" or \"acme\"",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$",
                "type": "string"
              },
              "titleExcludes": {
                "description": "Optional, 0-50 strings, any-of. Drop titles containing any of these. Example: [\"intern\",\"manager\"]",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "titleIncludes": {
                "description": "Optional, 0-50 strings, any-of. Keep titles containing any of these whole words/phrases, case-insensitive. Example: [\"engineer\",\"data scientist\"]",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["ats", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Number of items in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hasMore": {
                "description": "True if more items exist after this page",
                "type": "boolean"
              },
              "items": {
                "description": "Result rows. Each has \"type\": \"job\" (job_key, title, company, locations, countries, remote, posted_at, verified_open_at, age_days, long_open, apply_url, source_url, ...), \"board\", \"company\", \"seed_board\", \"open_check\" or \"error\" (code, message, retryable)",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": {},
                "description": "Tool-specific context: board totals, request counts, cost notes",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextOffset": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Offset to pass for the next page, or null when done"
              },
              "offset": {
                "description": "Offset of the first item in this page",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "total": {
                "description": "Total items after filters, before paging",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["count", "hasMore", "items", "nextOffset", "offset", "total"],
            "type": "object"
