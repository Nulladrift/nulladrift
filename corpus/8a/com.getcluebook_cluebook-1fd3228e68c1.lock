{
  "lockfileVersion": 2,
  "subjects": {
    "com.getcluebook/cluebook": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getcluebook.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "cluebook-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "estimate_book_pricing",
          "description": "Return transparent retail pricing, shipping upgrade options, and business-day delivery lead times for ClueBook keepsake editions.",
          "inputSchema": {
            "properties": {
              "shippingLevel": {
                "enum": ["MAIL", "GROUND_HD", "PRIORITY_MAIL", "EXPRESS"],
                "type": "string"
              },
              "tier": {
                "enum": ["paperback_1", "hardcover_1", "family_5"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7c64416905e04cd89c3e8dbf193be5383eb9596208ce23850559b9ad5263a5b"
        },
        {
          "name": "get_lulu_print_specs",
          "description": "Return exact Lulu 6x9 US Trade interior bleed dimensions (450x666 pt) and paperback vs casewrap hardcover cover wrap dimensions.",
          "inputSchema": {
            "properties": {
              "binding": {
                "enum": ["paperback", "hardcover"],
                "type": "string"
              },
              "pageCount": {
                "description": "Even book page count (32-104; defaults to 44 sample pages)",
                "maximum": 104,
                "minimum": 32,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a52c0477b6e1bedf5ff3501da8d9d37895374ddcf382cef7d053a7765119fd8"
        },
        {
          "name": "solve_crossword_preview",
          "description": "Pack 1-3 inside-joke answers into a verified 13x13 American-style interlocking crossword grid with clean SCOWL filler.",
          "inputSchema": {
            "properties": {
              "entries": {
                "items": {
                  "properties": {
                    "answer": {
                      "type": "string"
                    },
                    "clue": {
                      "type": "string"
                    }
                  },
                  "required": ["answer"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41eb0eb82cb5f12d03939c80b2275be8754825bf0a0d09089729570033a42288"
        }
      ],
      "digest": "sha256:c3d15e3802fe06ab3a799896616a3a5c4016ed4fe6c837fe697fc5b8b73598f0"
    }
  }
}
