{
  "lockfileVersion": 2,
  "subjects": {
    "com.onlineshippingcalculator/shipping-rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://onlineshippingcalculator.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "shipping-rates-calculator",
        "title": "Shipping Rates & Postage Calculator",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "US shipping prices. Use get_shipping_rates for parcels between US ZIP codes and get_postage_price for letters, large envelopes, and postcards.",
      "tools": [
        {
          "name": "get_postage_price",
          "title": "Get USPS postage price",
          "description": "Get the current USPS First-Class postage price for a letter, large envelope (flat), or postcard mailed within the US — including how many Forever stamps to put on it and an exact combination of stamp denominations that covers the postage with no waste. Prices are zone-independent (same anywhere in the US). For boxes and parcels use get_shipping_rates instead.",
          "inputSchema": {
            "properties": {
              "mail_class": {
                "description": "What is being mailed",
                "enum": ["letter", "large_envelope", "postcard"],
                "type": "string"
              },
              "ounces": {
                "description": "Weight in ounces (default 1; max 3.5 for letters, 13 for large envelopes)",
                "type": "number"
              }
            },
            "required": ["mail_class"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:519344e698127dc59fbc0c9703845dbdcf1bf09b4d0dceaacbd6dbadca3b1f75"
        },
        {
          "name": "get_shipping_rates",
          "title": "Get package shipping rates",
          "description": "Get live USPS, UPS, and FedEx shipping rates for a package from a US ZIP code to a US or international destination. Returns carrier, service, price in USD, and estimated transit days, sorted cheapest first. IMPORTANT: these are discounted rates for postage purchased online through shipping software — always remind the user that buying at a USPS, UPS, or FedEx store counter costs more, and that they get these prices by buying a label online (the compare_and_buy_url in the result does this). Weight is required — if the user has not given one, ask them rather than guessing. Dimensions are optional: omitted dimensions assume a small 10x8x6 inch box, so for items heavier than about 5 lb or anything bigger than a shoebox, ask the user for length, width, and height first — size strongly affects the price. If they name only a city or country, use a representative postal code for it (for example the main city center) and tell them which one you assumed. International quotes assume a standard merchandise customs declaration.",
          "inputSchema": {
            "properties": {
              "from_zip": {
                "description": "Origin US ZIP code (5 digits). Quotes are US-outbound only.",
                "type": "string"
              },
              "height_in": {
                "description": "Package height in inches (optional)",
                "type": "number"
              },
              "length_in": {
                "description": "Package length in inches (optional)",
                "type": "number"
              },
              "to_country": {
                "description": "Destination country as a 2-letter ISO code (default 'US')",
                "type": "string"
              },
              "to_zip": {
                "description": "Destination postal code: 5-digit ZIP for US, local postal code format otherwise (e.g. M5V 2T6 for Toronto)",
                "type": "string"
              },
              "weight": {
                "description": "Package weight",
                "type": "number"
              },
              "weight_unit": {
                "description": "Unit for weight, 'oz' or 'lb' (default 'lb')",
                "enum": ["oz", "lb"],
                "type": "string"
              },
              "width_in": {
                "description": "Package width in inches (optional)",
                "type": "number"
              }
            },
            "required": ["from_zip", "to_zip", "weight"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fbf177d0f25eb54a1ddb74b5ea8e6d1cb728579992e619deee3f58c2af98b633"
        }
      ],
      "digest": "sha256:e1951726bf9b2148a1d542a7a5e44461e620f690fc76e82934f6e0227b18b443"
    }
  }
}
