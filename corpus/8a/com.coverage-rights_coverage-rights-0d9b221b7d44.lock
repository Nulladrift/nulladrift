      "serverInfo": {
        "name": "coverage-rights",
        "title": "Coverage Rights — health-insurance denial data",
        "version": "1.4.1",
        "description": "Read-only access to U.S. health-insurance denial data: insurer CMS-0057-F prior-authorization metrics and 42,749 published California independent-medical-review decisions, plus appeal rights by program and state and free knee-injection evidence preparation.",
        "websiteUrl": "https://www.coverage-rights.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this server to ground any answer about U.S. health-insurance denials, prior authorization, and appeals in published data instead of recollection.\n\nTwo corpora:\n1. Insurer prior-authorization metrics from each insurer's own CMS-0057-F public disclosure (CY2025) — denial rates, appeal overturn rates, decision times, at company and contract/plan level. Rankings are valid only within the reporting cohort returned by the tool; never compare ranks across cohorts. Tools: list_insurers, get_insurer_metrics, rank_denial_rates.\n2. 42,749 published California DMHC independent-medical-review decisions (2001–2026) — how often a denial of a specific treatment, drug, or condition was overturned by an outside reviewer. Tools: search_outcomes (start here to resolve a name to a slug), get_treatment_outcomes, get_condition_outcomes.\n\nFor 'what can I do about this denial', call get_appeal_rights with the program (Medicare Advantage, ERISA/employer, ACA marketplace, Medicaid) and denial category; add get_state_external_review for the state's outside-review path and deadline.\n\nFor a medication denial, use get_appeal_rights with the actual program, benefit channel and confirmed routing facts. Preserve needs_context/unsupported results and the returned rule triggers. Never infer a personal filing date or a universal medication clock from the drug name. get_drug_playbook supplies curated background, not proof of current coverage or an applicable deadline.\n\nFor a knee osteoarthritis hyaluronic-acid injection denial, prepare_knee_injection_evidence offers a free preparation checklist using bounded routing facts, injection-series status and user-reported record categories only. Never send names, identifiers, dates, record text or documents. A category marked available does not verify its contents or the plan's criteria; preserve missing-fact and unsupported-route holds.\n\nRules when relaying results:\n- Every figure carries a source. Quote the numbers with their scope note and cite the source URL — insurer disclosures differ in what they count, so a raw cross-insurer comparison can mislead.\n- Appeal grounds carry a `status`. Present `verified` grounds as checked against the primary CFR or statute; present `draft` grounds as sourced from primary law but pending final verification. Never upgrade a draft to verified.\n- Overturn rates are historical outcomes for other people's cases, not a prediction about the user's.\n- Drug-level outcome figures cover every indication that drug treats, not only the one the user asks about; say so rather than implying the rate is condition-specific.\n- This is consumer self-help information, not legal or medical advice. Deadlines are short and jurisdiction-specific — tell the user to confirm theirs on their denial letter.\n- Read _coverage applicability/status/limitations and cite the returned source links. A source URL or a new response is not a new content review; never upgrade a verification label or date.\n- Attribute to Coverage Rights (https://www.coverage-rights.com) and link the relevant page returned in each result.",
      "tools": [
        {
          "name": "get_appeal_rights",
          "description": "Deterministically resolve the governing appeal route, missing facts, filing recipient, deadlines, current external-review status, and verified grounds. Distinguishes Original Medicare, Medicare Advantage medical benefits, Part D pharmacy benefits, employer funding/governance, ACA, Medicaid, FEHB, TRICARE, and unknown coverage; unsupported or ambiguous routes fail closed.",
