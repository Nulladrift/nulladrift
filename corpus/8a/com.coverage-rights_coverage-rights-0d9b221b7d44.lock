              },
              "current_status": {
                "enum": ["awaiting-service", "receiving-service", "service-ended", "post-service-claim", "unknown"],
                "type": "string"
              },
              "denial_reason": {
                "description": "Denial category. For medication denials use 'prescription-drug' and supply the actual coverage program, benefit channel and routing facts. Applicable grounds and rule triggers depend on that route; preserve missing-fact and unsupported results.",
                "enum": ["medical-necessity", "experimental-investigational", "prior-authorization", "out-of-network", "not-covered-benefit", "coding-billing-error", "prescription-drug"],
                "type": "string"
              },
              "drug_channel": {
                "description": "For a drug denial, whether the medical or pharmacy benefit applies",
                "enum": ["not-a-drug", "medical-benefit", "pharmacy-benefit", "unknown"],
                "type": "string"
              },
              "employer_type": {
                "description": "Required to resolve job-based coverage",
