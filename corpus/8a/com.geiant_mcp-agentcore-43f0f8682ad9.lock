{
  "lockfileVersion": 2,
  "subjects": {
    "com.geiant/mcp-agentcore": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geiant-agentcore-production.up.railway.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "geiant-agentcore",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_delegation_chain",
          "description": "Verify the human → agent delegation chain and check whether a specific tool is whitelisted for this agent. Answers the regulatory question: \"Did a real human authorize this AI action?\" Returns the principal identity, delegation depth, cert validity, and tool authorization.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_pk": {
                "description": "Agent Ed25519 public key (64 hex chars)",
                "type": "string"
              },
              "tool_name": {
                "description": "Name of the tool the agent intends to call",
                "type": "string"
              }
            },
            "required": ["tool_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2639fd05402ddf14e84da5240bb806d51e7d60854aec0fdb5be9975ab8a3073"
        },
        {
          "name": "generate_audit_proof",
          "description": "Generate a EU AI Act Art. 12 (record-keeping) and Art. 14 (human oversight) compliance evidence bundle for an AI agent. Returns the cryptographic audit chain, Merkle epoch roots, delegation certificate, trust score, and violation history — sufficient for regulatory submission. The chain_verification.is_valid field proves the audit trail has not been tampered with.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_pk": {
                "description": "Agent Ed25519 public key (64 hex chars)",
                "type": "string"
              },
              "from": {
                "description": "ISO 8601 start of reporting period",
                "type": "string"
              },
              "to": {
                "description": "ISO 8601 end of reporting period",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53a188731b53f9e844093a3a21c47bb4923e076239b574e30ab334ea527adfda"
        },
        {
          "name": "verify_jurisdiction",
          "description": "Verify that an AI agent is authorized to operate in a specific H3 territorial cell. Checks the GNS-AIP delegation certificate: signature validity, temporal bounds, H3 cell authorization, and facet authorization. Returns a structured result indicating whether the agent may proceed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_pk": {
                "description": "Agent Ed25519 public key (64 hex chars)",
                "type": "string"
              },
              "facet": {
                "description": "Facet to check (e.g. \"energy@italy-geiant\")",
                "type": "string"
              },
              "h3_cell": {
                "description": "H3 cell index representing the operation territory",
                "type": "string"
              }
            },
            "required": ["h3_cell"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e953547ee724e7108c22bf868aa2fff6e94eae4bd56795db6e2b4a49fdb78428"
        }
      ],
      "digest": "sha256:1384ba807ac03c893b5fe5a9436d2767057625ae3feb1df402c338446d67c364"
    }
  }
}
