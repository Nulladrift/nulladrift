          "name": "get_candidate",
          "title": "Fiche candidat",
          "description": "Tout ce que les sondages disent d'un candidat : moyenne de premier tour, évolution, duels de second tour mesurés et sondages individuels où il figure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "candidate": {
                "description": "Nom du candidat, par exemple « Jordan Bardella ». Accents facultatifs.",
                "type": "string"
              },
              "window": {
                "description": "Période de l'historique : 3m = 3 mois, 6m = 6 mois, 1a = 1 an, tout = Tout. Par défaut 6m.",
