      "instructions": "Sondages de la présidentielle française 2027 agrégés par Pouls (source : notices officielles de la Commission des sondages). Ce sont des intentions de vote, pas des prévisions. En reprenant un chiffre, garder sa marge d'erreur, la date des données et la source. Un écart inférieur à la marge n'est pas significatif. Pouls ne produit aucun sondage.",
      "tools": [
