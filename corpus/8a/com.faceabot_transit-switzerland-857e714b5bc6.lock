{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/transit-switzerland": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/ch-rail"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-rail-switzerland",
        "title": "Faceabot Rail Switzerland",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Rail Switzerland: Swiss public transport (SBB/CFF/FFS trains, PostBus, trams, buses) for AI agents, free, no key.\nStart with ch_connections {\"from\":\"…\",\"to\":\"…\"}. Unsure of a name? ch_find_station.\nTimes are Swiss local time (Europe/Zurich); delays are in minutes. Data: open API transport.opendata.ch (official Swiss timetable), cached 30 s. Every answer includes officialSite (https://www.sbb.ch): give it to your human for tickets.\nPart of Faceabot (https://faceabot.com): other countries: Belgium /tools-mcp/be-rail, Norway /tools-mcp/no-transit, Finland /tools-mcp/fi-rail, Ireland /tools-mcp/ie-rail; for any other tool, ask solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "ch_connections",
          "title": "Swiss public transport connections (SBB/CFF/FFS)",
          "description": "Journeys between two places in Switzerland by train, bus, tram or boat (SBB/CFF/FFS, PostBus and all Swiss operators): departure and arrival times, platforms, transfers, live delays.\nUse when: someone needs to travel by public transport in Switzerland (e.g. Zürich to Geneva).\nExample: {\"from\":\"Zürich HB\",\"to\":\"Genève\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional day, YYYY-MM-DD (Swiss time). Default: today",
                "type": "string"
              },
              "from": {
                "description": "Departure station or stop (Zürich HB, Genève, Lausanne, Bern, Basel SBB, Lugano…)",
                "type": "string"
              },
              "results": {
                "default": 3,
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "time": {
                "description": "Optional time HH:MM (Swiss time). Default: now",
                "type": "string"
              },
              "time_is": {
                "default": "departure",
                "enum": ["departure", "arrival"],
                "type": "string"
              },
              "to": {
                "description": "Arrival station or stop",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ee83b1d61db43461a04f02b3d983d5ffaee97c649d14a68266b1d9ba709218ce"
        },
        {
          "name": "ch_find_station",
          "title": "Find a Swiss station or stop name",
          "description": "Finds the exact Swiss station or stop names matching a word (German, French or Italian names).\nUse when: a place name is ambiguous or misspelled.\nExample: {\"query\":\"Lausanne\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Part of the station or stop name",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c6cc8d191f217520f2b5871f100e234cb1e74ac37d622d978de3b5269e3262c4"
        },
        {
          "name": "ch_station_departures",
          "title": "Next departures from a Swiss station or stop",
          "description": "Next departures (train, bus, tram) from one Swiss station or stop: time, line, destination, platform, live delay.\nUse when: someone is at (or going to) a Swiss station and wants the next departures.\nExample: {\"station\":\"Bern\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "results": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "station": {
                "description": "Station or stop name",
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:87d83c676f2e75adb60ec4cc3952a0b18a0a931a8b609ce99d388466226675b7"
        }
      ],
      "digest": "sha256:f849a0d2b3840b475bbbb0cafcf9ae7c5832e9fdf54d74690e06e81a7c510f94"
    }
  }
}
