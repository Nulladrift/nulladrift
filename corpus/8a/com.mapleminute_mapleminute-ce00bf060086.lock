        {
          "name": "remove_addon",
          "title": "Stop a yearly add-on",
          "description": "Stop a yearly add-on at the end of the year already paid (no refund). For the office address, use the company page, which collects the new address.",
          "inputSchema": {
            "properties": {
              "addon": {
                "enum": ["plan", "phone", "attorney", "minutes"],
                "type": "string"
              },
