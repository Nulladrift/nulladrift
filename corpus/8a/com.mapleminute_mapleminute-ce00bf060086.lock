        {
          "name": "report_change",
          "title": "Report a change to file",
          "description": "Tell us about a change we must file: new director, new address, shares sold and so on. The law allows 15 days.",
          "inputSchema": {
            "properties": {
              "change": {
                "description": "What changed and when, in plain words.",
                "type": "string"
              },
              "id": {
                "description": "Company id like MM-12, from list_companies.",
                "type": "string"
              }
            },
            "required": ["change", "id"],
