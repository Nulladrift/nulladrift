        {
          "name": "report_change",
          "title": "Send a change for the holder to approve",
          "description": "Send a change to file: new director, new address, shares sold and so on (the law allows 15 days). Nothing is filed from this call: the account holder must approve the change on mapleminute.com (we email them), then our team files it with the registry. Its status shows in get_company.change_requests: waiting_for_approval, approved, filed.",
          "inputSchema": {
            "properties": {
              "change": {
                "description": "What changed and when, in plain words.",
                "type": "string"
              },
              "id": {
                "description": "Company id like MM-12, from list_companies.",
                "type": "string"
              }
            },
            "required": ["change", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Send a change for the holder to approve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d06a2ec490d9ec0086d5c898388c85050e1c5e0ec93a7226ca3d243455eaa034"
        },
        {
          "name": "start_company",
          "title": "Start a company (unpaid order)",
          "description": "Start a company with its office in Ontario, British Columbia, Manitoba or Saskatchewan: federal (CBCA), or a BC or Ontario company. Works without signing in: then it returns the company with checkout_url, the person pays there or on page_url, and follows the company later on page_url or by signing in at mapleminute.com with the contact email. Signed in (or with an API key) the company also joins that account. Nothing is filed until payment. Every name, address and consent must come from the person: the consent of directors to act and the agreement to the terms are their own declarations.",
          "inputSchema": {
            "properties": {
              "agree_to_terms_and_privacy": {
                "const": true,
                "description": "The human agrees to https://mapleminute.com/terms and https://mapleminute.com/privacy. Only send true if they confirmed it.",
                "type": "boolean"
              },
              "also_register_in": {
                "description": "Federal companies: also register in Manitoba or Saskatchewan (government fee and our fee in get_prices; the yearly plan then adds that province's annual return). Only if the company does business there.",
                "items": {
                  "enum": ["MB", "SK"],
                  "type": "string"
                },
                "type": "array"
              },
              "also_register_in_bc": {
                "description": "Only when the office is outside BC (a federal company), or for an ON company: also register in BC (BC government fee, plus the BC name approval for an Ontario company, and our fee in get_prices; the yearly plan then adds the BC annual report). No office in BC is needed, but BC requires an attorney: an individual living in BC (at the BC office where they can usually be reached) or a BC company (at its registered office), who accepts legal papers for the company there. Only if the company does business in BC.",
                "properties": {
                  "attorney": {
                    "oneOf": [
                      {
                        "properties": {
                          "city": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "postal_code": {
                            "description": "A BC postal code, like V6B 1A1.",
                            "type": "string"
                          },
                          "street": {
                            "type": "string"
                          }
                        },
                        "required": ["city", "name", "postal_code", "street"],
                        "type": "object"
                      },
                      {
                        "const": "maple_minute",
                        "description": "Maple Minute acts as the attorney, $19.99 a year (see get_prices)."
                      }
                    ]
                  }
                },
                "required": ["attorney"],
                "type": "object"
              },
              "also_register_in_ontario": {
                "default": false,
                "description": "Only when the office is outside Ontario (a federal company), or for a BC company: also register in Ontario. No government fee; our fee in get_prices. Only if the company does business in Ontario.",
                "type": "boolean"
              },
              "attorney_in": {
                "additionalProperties": {
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "postal_code": {
                      "type": "string"
                    },
                    "street": {
                      "type": "string"
                    }
                  },
                  "required": ["city", "name", "postal_code", "street"],
                  "type": "object"
                },
                "description": "An attorney for service, by province code, where one is needed: Manitoba, unless its registered office is in Manitoba and a director or officer lives there; Saskatchewan, unless a director or officer lives in Saskatchewan. A person living there (or a company there), at their address there.",
                "type": "object"
              },
              "business_activity": {
                "description": "A few words, like \"coffee shop\" or \"software consulting\".",
                "type": "string"
              },
              "company_phone_number": {
                "default": false,
                "description": "A Canadian phone number for the company, from us (yearly fee, see get_prices). Receive-only: texts and voicemails show on the company page. Keeps the founder's own number out of business directories.",
                "type": "boolean"
              },
              "contact": {
                "description": "The person we talk to about the order. Receives the receipt, documents and private order link.",
                "properties": {
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "description": "Optional, like 604 555 0123.",
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "directors_agreed_to_act": {
                "const": true,
                "description": "Every director is 18+, not bankrupt, and agreed to be a director. Only send true if the human confirmed it.",
                "type": "boolean"
              },
              "duns": {
                "default": false,
                "description": "Free: we request a D-U-N-S number from Dun & Bradstreet once incorporated (needed for Apple/Google developer accounts and some suppliers); usually within 30 business days.",
                "type": "boolean"
              },
              "express": {
                "default": false,
                "description": "Federal only: Corporations Canada processes within 4 hours for a $100 government fee.",
                "type": "boolean"
              },
              "financial_year_end_month": {
                "default": 12,
                "description": "The company year ends on the last day of this month.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "jurisdiction": {
                "default": "CA",
                "description": "CA: federal, name protected across Canada, also registered in the office's province; needs resident Canadian directors (at least 1, or a quarter with 4+). BC or ON: a provincial company; directors can live anywhere, the office must be in that province, no express. Moving a provincial company to federal later costs about $900 (BC) or $530 (ON) in government fees. Fees in get_prices.",
                "enum": ["CA", "BC", "ON"],
                "type": "string"
              },
              "name": {
                "description": "Omit for a numbered company (fastest; like 1234567 Canada Inc., 1234567 B.C. Ltd. or 1234567 Ontario Inc.).",
                "properties": {
                  "ending": {
                    "default": "Inc.",
                    "enum": ["Inc.", "Ltd.", "Corp.", "Incorporated", "Limited", "Corporation"],
                    "type": "string"
                  },
                  "if_refused": {
                    "default": "go_numbered",
                    "description": "If the registry refuses the name: incorporate as numbered right away, or pause and ask (the person picks a new name on page_url, or an assistant proposes one with choose_new_name for them to confirm).",
                    "enum": ["go_numbered", "ask_me"],
                    "type": "string"
                  },
                  "name": {
                    "description": "For type word: the name without Inc./Ltd., e.g. \"Northbound Coffee\".",
                    "type": "string"
                  },
                  "type": {
                    "default": "numbered",
                    "enum": ["numbered", "word"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "office": {
                "description": "Registered office: public, a street address in the province, not a PO box.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "postal_code": {
                    "type": "string"
                  },
                  "province": {
                    "description": "Federal: Ontario (provincial registration free), Manitoba ($350 government fee), Saskatchewan ($255 government fee) or British Columbia ($350 BC government fee). For a BC or ON company it is that province.",
                    "enum": ["ON", "BC", "MB", "SK"],
                    "type": "string"
                  },
                  "street": {
                    "description": "Street number and name.",
                    "type": "string"
                  },
                  "unit": {
                    "type": "string"
                  },
                  "use_our_address": {
                    "description": "Use our office address instead (yearly fee, see get_prices); letters from the registries and the CRA are scanned into the account. Then omit street/city/postal_code.",
                    "type": "boolean"
                  }
                },
                "required": ["province"],
                "type": "object"
              },
              "people": {
                "description": "Everyone who is a director or owns part of the company.",
                "items": {
                  "properties": {
                    "address_for_service": {
                      "description": "Optional address where official papers can reach them, shown publicly instead of the home address. Not a PO box.",
                      "properties": {
                        "city": {
                          "type": "string"
                        },
                        "country": {
                          "default": "Canada",
                          "type": "string"
                        },
                        "postal_code": {
                          "type": "string"
                        },
                        "province_or_state": {
                          "type": "string"
                        },
                        "street": {
                          "type": "string"
                        }
                      },
                      "required": ["city", "postal_code", "street"],
                      "type": "object"
                    },
                    "citizenship": {
                      "description": "Required for owners of 25% or more; private.",
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "country": {
                      "default": "Canada",
                      "type": "string"
                    },
                    "date_of_birth": {
                      "description": "YYYY-MM-DD. Required for owners of 25% or more; kept private by Corporations Canada.",
                      "format": "date",
                      "type": "string"
                    },
                    "director": {
                      "description": "Runs the company and signs for it. At least one person must be a director.",
                      "type": "boolean"
                    },
                    "first_name": {
                      "description": "Legal first name, as on ID.",
                      "type": "string"
                    },
                    "last_name": {
                      "type": "string"
                    },
                    "officer": {
                      "default": false,
                      "description": "Not a director but an officer (e.g. the president). The president must be a director or an officer.",
                      "type": "boolean"
                    },
                    "owns_percent": {
                      "description": "Percent of the company this person owns. All people must add up to 100. Use 0 for someone who owns nothing.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "postal_code": {
                      "description": "Like V6B 1A1 in Canada.",
                      "type": "string"
                    },
                    "province_or_state": {
                      "description": "Two-letter Canadian province code like BC or ON, or a state/region outside Canada.",
                      "type": "string"
                    },
                    "resident_canadian": {
                      "description": "A Canadian citizen or permanent resident who lives in Canada. At least one director must be (a quarter of them with 4+ directors).",
                      "type": "boolean"
                    },
                    "street": {
                      "description": "Home address: street number and name. Required for directors and for owners of 25% or more. Public for directors; no PO boxes.",
                      "type": "string"
                    },
                    "tax_residence": {
                      "description": "Country where they pay income tax. Required for owners of 25% or more; private.",
                      "type": "string"
                    }
                  },
                  "required": ["director", "first_name", "last_name", "owns_percent", "resident_canadian"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "president_index": {
                "default": 0,
                "description": "Index in people of the president; must be a director or an officer.",
                "type": "integer"
              },
              "yearly_plan": {
                "default": true,
                "description": "We file the annual returns and changes every year (price in get_prices).",
                "type": "boolean"
              }
            },
            "required": ["agree_to_terms_and_privacy", "business_activity", "contact", "directors_agreed_to_act", "office", "people"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a company (unpaid order)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:295d38f42b730b1a9ba664617bcb86f7e729245c80f88338dc464d5ce515663f"
        }
      ],
      "digest": "sha256:2a2a314aeacdd2f495953ebbbbc763b8be1616c7d8fdef544362e43fad64d2e9"
    }
  }
