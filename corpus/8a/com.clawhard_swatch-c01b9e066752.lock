      "serverInfo": {
        "name": "com.clawhard/swatch",
        "title": "Swatch",
        "version": "1.1.0",
        "description": "Swatch checks text and background color contrast against WCAG, shows the closest colors that pass, and builds a full 50-950 palette from any color. Runs in your browser, no account.",
        "websiteUrl": "https://swatch.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Swatch: Swatch checks text and background color contrast against WCAG, shows the closest colors that pass, and builds a full 50-950 palette from any color. Runs in your browser, no account. Use it when you pick, review or generate UI colors and need an exact contrast ratio, a passing replacement, a palette scale or a color conversion. Tools: swatch_check_contrast (Check the WCAG contrast of a text and background color); swatch_fix_contrast (Find the nearest accessible color that passes contrast); swatch_make_scale (Build a 50-950 color palette from one color); swatch_check_pairs (Check contrast for many color pairs at once). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "swatch_check_contrast",
          "title": "Check the WCAG contrast of a text and background color",
          "description": "Use when the user asks whether a color combination is readable or accessible, passes WCAG AA or AAA, or has enough contrast (text on a background, button, badge, link color), or what a color is in another format. Returns the exact contrast ratio, pass or fail for normal text, large text and UI components at AA and AAA, the APCA lightness contrast and a plain note. Colors can be hex, rgb(), hsl() or CSS names. Example: {\"foreground\": \"#777777\", \"background\": \"#ffffff\"}. Also returns each color in hex, rgb, hsl and oklch with its nearest CSS name.",
          "inputSchema": {
            "properties": {
              "background": {
                "description": "Background color, e.g. \"#ffffff\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "foreground": {
                "description": "Text (or icon) color, e.g. \"#767676\" or \"rgb(20 20 20)\" or \"tomato\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["background", "foreground"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check the WCAG contrast of a text and background color"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://swatch/contrast-v1.html",
            "openai/toolInvocation/invoked": "Contrast checked",
            "openai/toolInvocation/invoking": "Measuring contrast…",
            "ui": {
              "resourceUri": "ui://swatch/contrast-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/swatch/result"
          },
          "digest": "sha256:d931ddbb7000c6390e44d906fb52be4419e764f2498ff4ef01bb9d6716a86188"
        },
        {
          "name": "swatch_check_pairs",
          "title": "Check contrast for many color pairs at once",
          "description": "Use when the user has a whole design system, theme or stylesheet and wants every text and background pair checked for accessibility in one go. Takes up to 50 pairs and returns the ratio and AA and AAA results for each, with a count of failures. Example: {\"pairs\": [{\"foreground\": \"#777\", \"background\": \"#fff\", \"label\": \"muted text\"}, {\"foreground\": \"#fff\", \"background\": \"#ff5a1f\", \"label\": \"button\"}]}.",
          "inputSchema": {
            "properties": {
              "pairs": {
                "description": "Pairs to check.",
                "items": {
                  "properties": {
                    "background": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "foreground": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "label": {
                      "description": "Optional name, like \"muted text on card\".",
                      "maxLength": 60,
                      "type": "string"
                    }
                  },
                  "required": ["background", "foreground"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["pairs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check contrast for many color pairs at once"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://swatch/pairs-v1.html",
            "openai/toolInvocation/invoked": "Audit done",
            "openai/toolInvocation/invoking": "Auditing pairs…",
            "ui": {
              "resourceUri": "ui://swatch/pairs-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/swatch/result"
          },
          "digest": "sha256:f759d3bd48374e17c28b6eb0926b1fdcb8e1f8580f261187695926be5d06f5d6"
        },
        {
          "name": "swatch_fix_contrast",
          "title": "Find the nearest accessible color that passes contrast",
          "description": "Use when a color pair fails contrast and the user wants the smallest change that makes it pass, such as \"make this gray text accessible without changing the look\". Returns the closest text color on that background that reaches the target (AA, AAA, AA-large or ui), and separately the closest background, keeping the hue. Example: {\"foreground\": \"#777777\", \"background\": \"#ffffff\", \"target\": \"AA\"}. Returns already_passes if nothing needs to change.",
          "inputSchema": {
            "properties": {
              "background": {
                "description": "Current background color.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "foreground": {
                "description": "Current text color.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "description": "Contrast target. Default AA.",
                "enum": ["AA", "AAA", "AA-large", "ui"],
                "type": "string"
              }
            },
            "required": ["background", "foreground"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the nearest accessible color that passes contrast"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://swatch/fix-v1.html",
            "openai/toolInvocation/invoked": "Fix ready",
            "openai/toolInvocation/invoking": "Finding a passing color…",
            "ui": {
              "resourceUri": "ui://swatch/fix-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/swatch/result"
          },
          "digest": "sha256:b4e3d34c870cd0ae15ee5df86db73b89f26c218db46bb6ec996f4b4d8f03194f"
        },
        {
          "name": "swatch_make_scale",
          "title": "Build a 50-950 color palette from one color",
          "description": "Use when the user asks for a palette, shades, tints, a design-token scale or a Tailwind-style 50 to 950 ramp from a brand color. Returns 11 steps that keep the hue, with the hex, contrast on white and on black, and the best text color for each step. Example: {\"color\": \"#ff5a1f\", \"name\": \"brand\"}.",
          "inputSchema": {
            "properties": {
              "color": {
                "description": "Base color, e.g. \"#ff5a1f\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Token name used in the CSS and Tailwind output. Default \"brand\".",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["color"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a 50-950 color palette from one color"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://swatch/scale-v1.html",
            "openai/toolInvocation/invoked": "Scale ready",
            "openai/toolInvocation/invoking": "Building the scale…",
            "ui": {
              "resourceUri": "ui://swatch/scale-v1.html",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/swatch/result"
          },
          "digest": "sha256:74990ad80b42aa8c7c3e6ebaa5de4c3e66d68d7e2d022bf098009d238c3e9f28"
        }
