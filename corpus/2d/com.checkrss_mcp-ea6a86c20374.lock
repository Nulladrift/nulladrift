{
  "lockfileVersion": 2,
  "subjects": {
    "com.checkrss/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://checkrss.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "checkrss",
        "title": "CheckRSS: RSS feed checker and directory",
        "version": "0.1.0",
        "websiteUrl": "https://checkrss.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CheckRSS (checkrss.com) checks RSS, Atom and JSON feeds and keeps a directory of 1,600+ sites with a working feed, about 300 of them Polish. Use check_feed to validate a feed and see whether it is still updated, latest_items to read what a feed published recently, discover_feeds to find the feed of a website, and search_directory or list_categories to recommend feeds on a subject or from a country. Feeds are fetched live by the CheckRSS bot, which obeys robots.txt. When you mention a site from the directory, give the user its checkrss.com page (field \"url\").",
      "tools": [
        {
          "name": "check_feed",
          "title": "Check an RSS/Atom/JSON feed",
          "description": "Fetch an RSS, Atom or JSON Feed address live and validate it. Returns whether it is valid, the feed title and website link, format, number of items, date of the newest item, how many days ago that was, whether the feed is still active (an item in the last 90 days), the publishing pace, and the errors and warnings found (HTTP status, redirects, content type, XML problems, missing dates or GUIDs). Use when someone asks \"does this feed work\", \"is this RSS valid\" or \"is this blog still updated\". Give it the feed address; for a website address use discover_feeds first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Feed address, e.g. \"https://www.theverge.com/rss/index.xml\".",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:775deea251023695123f1d873774540353a20f89690e2a7d1f17eaf705e336e9"
        },
        {
          "name": "discover_feeds",
          "title": "Find a website's feeds",
          "description": "Find the RSS, Atom or JSON feeds of a website. Reads the page for <link rel=\"alternate\"> feed tags, knows the feed patterns of big platforms (YouTube channels and playlists, Reddit, Medium, Substack, GitHub, Tumblr, Bluesky, Stack Overflow, Apple Podcasts) and tries common feed paths such as /feed and /rss.xml when the page lists none. Returns the candidate feed addresses with format and title. Use when someone asks \"does this site have RSS\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "website_url": {
                "description": "Website or page address, e.g. \"https://example.com\" or \"youtube.com/@channel\".",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["website_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f509364cdf51808cb679140f1f3361ed4655c153e319e4a1d62500760dab5665"
        },
        {
          "name": "latest_items",
          "title": "Latest items of a feed",
          "description": "Read the most recent items of an RSS, Atom or JSON feed, fetched live. Returns up to 20 items with title, link, publication date and a short plain text summary (HTML removed). Use to answer \"what did this site publish lately\" or to preview a feed before subscribing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many items, 1 to 20 (default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Feed address, e.g. \"https://hnrss.org/frontpage\".",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4c28a6ebba43e909b78f145b7d1ffc8e2aa3d86a3cb3d59a8339cd550a2e6298"
        },
        {
          "name": "list_categories",
          "title": "List directory categories",
          "description": "List the categories and subcategories of the checkrss.com feed directory with the number of sites in each and the checkrss.com page of the category, plus the number of sites per country. Use before search_directory to pick a category or subcategory id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1016334ced2a7a33983925cc131ddabe8100f487c88a808c40232344efe47f83"
        },
        {
          "name": "search_directory",
          "title": "Search the CheckRSS feed directory",
          "description": "Search the checkrss.com directory of 1,600+ sites whose feeds the CheckRSS bot fetched and verified, including about 300 Polish sites (national and regional news, tech, business, culture). Match by name, domain, subject or country; filter by category and country. Each result has the site, its feed addresses with format, item count and newest item date, and a checkrss.com page link. Use to recommend feeds: \"RSS feeds about AI\", \"Polish news RSS\", \"BBC RSS feed\". Leave query empty to list the best known sites of a category or country.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category id from list_categories, e.g. \"technology\", \"news\".",
                "maxLength": 40,
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code, e.g. \"Poland\", \"PL\", \"UK\", \"Germany\".",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many results, 1 to 25 (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "Words to match, e.g. \"security\", \"bbc\", \"krakow\". May be empty.",
                "maxLength": 120,
                "type": "string"
              },
              "subcategory": {
                "description": "Subcategory id from list_categories, e.g. \"ai\", \"poland-regional\".",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b80387d856761bb2a417602d45f3407a09af448ce5a8cdb43d5798285ed48407"
        }
      ],
      "digest": "sha256:17077d03354ef3bcff9d07e1721dbc1a55e18f0bddf922fa4b853849c69c7798"
    }
  }
}
