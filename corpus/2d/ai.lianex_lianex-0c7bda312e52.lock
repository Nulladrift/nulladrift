        {
          "name": "lianex_products",
          "title": "The published product-permalink index",
          "description": "List published product permalink IDs and their updated_at freshness. Use the IDs to request individual products. Over HTTP, omitting limit returns the full published index, while the MCP tool lianex_products returns one page of 50; otherwise offset, page_size and has_more describe the page. ignored lists unusable paging parameters. Results can change between requests. Cache-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "pattern": "^-?[0-9]+$",
                    "type": "string"
                  }
                ],
                "default": 50,
                "description": "How many permalinks to return, clamped to 50. Over HTTP, omitting it returns the whole index (the sitemap's own source, never truncated by default). The MCP tool lianex_products returns 50 per call when it is omitted; continue with offset while has_more is true."
              },
              "offset": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "pattern": "^-?[0-9]+$",
                    "type": "string"
                  }
                ],
                "description": "How many permalinks to skip. Unusable values are ignored and named in `ignored`; a negative value is clamped to 0."
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "ProductIndexEntry": {
                "additionalProperties": true,
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "updated_at": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["id", "updated_at"],
                "type": "object"
              },
              "ProductIndexResponse": {
                "additionalProperties": true,
                "properties": {
                  "has_more": {
                    "type": "boolean"
                  },
                  "ignored": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "offset": {
                    "type": "integer"
                  },
                  "page_size": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "products": {
                    "items": {
                      "$ref": "#/$defs/ProductIndexEntry"
                    },
                    "type": "array"
                  }
                },
                "required": ["has_more", "ignored", "offset", "page_size", "products"],
                "type": "object"
              }
            },
            "$ref": "#/$defs/ProductIndexResponse",
            "additionalProperties": true,
            "type": "object"
          },
