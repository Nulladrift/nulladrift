      "instructions": "Lianex provides a free, cache-only read API over its stored shopping catalogue. No API key,\naccount or authentication is required. These endpoints do not fetch live marketplace data.\n\nAvailable now: Australia (prices in AUD). Other marketplaces are in progress. Prices are never converted: a search filtered to a `currency` that is not served returns `result: \"miss\"` with `emptied_by: [\"currency\"]`, `available_regions` and a `retry_url` without the filter.\n\nRunnable examples:\n- https://api.lianex.ai/api/public/search?q=iphone&limit=5\n- https://api.lianex.ai/api/public/search?q=laptop&currency=AUD&max_price=1500&compact=true\n- https://api.lianex.ai/api/public/browse\n\nRate limit: **600 requests per minute per caller**. Read `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` (seconds until a slot frees). On `429`, wait the `Retry-After` seconds before retrying. The limit can change.\n\n## Using the results\n\n- Search returns `result: \"hit\"` with products, `\"miss\"` with an empty list, or `\"not_searched\"`\n  when no searchable term was supplied. `not_searched` omits `products` and `has_more`.\n  An empty answer means \"not in our cache\" for that query or page, not that a product does not exist.\n- When no cached product matches every search word, search can return the closest matches as\n  `result: \"hit\"` with `match: \"partial\"`, `matched_terms` and `dropped_terms`. Exact hits carry\n  `match: \"all_terms\"`. Check `match` before treating a hit as an exact match.\n- Use `offset`, `limit` and `has_more` for paging. Results may change between requests; pagination\n  is not a saved snapshot. Search covers a bounded result set, not the entire marketplace.\n  `/products` and `/vs` return their full published index when `limit` is omitted.\n- No catalogue-wide match total is provided. Search `count` and category-browse `total` count only\n  products in that response.\n- Return product `url` links unchanged. They may contain affiliate tracking that supports this free\n  API at no extra cost to shoppers. Disclosure: https://lianex.ai/disclosure\n- Product IDs use `<provider>~~<marketplace-id>`, for example `amazon~~B09B2RL8CG`.\n  IDs without `~~` are eBay IDs, for example `v1~178119112778~0`.\n  Product pages are at `https://lianex.ai/p/<id>`.\n- Additional response fields may appear. Ignore unknown fields and handle missing or null values.\n  Search and category results can omit unavailable fields; product detail can return explicit nulls.\n\nThis public API is best-effort, with no SLA or deprecation policy. The conversational chat API is\noutside this contract. Human documentation: https://lianex.ai/developers\n",
