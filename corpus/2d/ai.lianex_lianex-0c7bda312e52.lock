        {
          "name": "lianex_vs",
          "title": "The published product-comparison index",
          "description": "List published comparisons whose products remain cached, ordered by slug, with updated_at freshness. Omitting limit returns the full published index. Otherwise use offset, page_size and has_more; ignored lists unusable paging parameters. Results may change between requests. Cache-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "pattern": "^-?[0-9]+$",
                    "type": "string"
                  }
                ],
                "description": "How many pairs to return, clamped to 50. OMIT IT and you get the whole index — this is the sitemap's own source, so it is never truncated by default."
              },
              "offset": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "pattern": "^-?[0-9]+$",
                    "type": "string"
                  }
                ],
                "description": "How many pairs to skip. Unusable values are ignored and named in `ignored`; a negative value is clamped to 0."
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "VsIndexEntry": {
                "additionalProperties": true,
                "properties": {
                  "slug": {
                    "type": "string"
                  },
                  "updated_at": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["slug", "updated_at"],
                "type": "object"
              },
              "VsIndexResponse": {
                "additionalProperties": true,
                "properties": {
                  "has_more": {
                    "type": "boolean"
                  },
                  "ignored": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "offset": {
                    "type": "integer"
                  },
                  "page_size": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "pairs": {
                    "items": {
                      "$ref": "#/$defs/VsIndexEntry"
                    },
                    "type": "array"
                  }
                },
                "required": ["has_more", "ignored", "offset", "page_size", "pairs"],
                "type": "object"
              }
