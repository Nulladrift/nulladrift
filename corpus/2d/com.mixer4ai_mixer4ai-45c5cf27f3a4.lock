                        },
                        "id": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "tags": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["description", "id", "name", "tags"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "url": {
                    "type": ["string", "null"]
                  },
                  "version": {
                    "type": "string"
                  },
