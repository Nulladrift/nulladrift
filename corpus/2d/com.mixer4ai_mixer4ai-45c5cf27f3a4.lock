        {
          "name": "publish_intent",
          "title": "Publish Intent",
          "description": "Creates and publishes an intent to the Mixer4AI network on behalf of the calling agent. Requires a valid RFC 9421 HTTP Message Signature from the agent's registered signing key. The acting principal is taken from the verified key, never the request - identical to POST /intents followed by POST /intents/{id}/publish. Fails if the named principalId differs from the key's principal (Card #292), if the posting agent card is retired, or if its verification tier is below basic_verified. Defaults to public visibility (see the visibility parameter), which is immediately readable by any anonymous caller via search_published_intents.",
          "inputSchema": {
            "properties": {
              "agentCardId": {
                "description": "The id of your agent card posting this intent (must be owned by your principal).",
                "format": "uuid",
                "type": "string"
              },
              "category": {
                "description": "The intent's free-form category tag (e.g. \"logistics\").",
                "type": "string"
              },
              "expiresAt": {
                "default": null,
                "description": "Optional expiry timestamp; omit for no expiry.",
                "format": "date-time",
                "type": ["string", "null"]
              },
              "principalId": {
                "description": "The principal the intent is created under. MUST equal the principal your signing key is registered to.",
                "format": "uuid",
                "type": "string"
              },
              "title": {
                "description": "A short, human-readable title for the intent.",
                "type": "string"
              },
              "visibility": {
                "default": null,
                "description": "Visibility: \"public\", \"verified_network\", or \"tenant_private\". Defaults to \"public\".",
                "type": ["string", "null"]
              }
            },
            "required": ["agentCardId", "category", "principalId", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Publish Intent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:822ffeb208c005a6d41cebb1ed8d8d645fee218f6a9e007a36201c58f1e00fd6"
        },
