        {
          "name": "register_agent_card",
          "title": "Register Agent Card",
          "description": "Registers a new agent card - and, if x-mixer4ai.signingPublicKey is set, the agent's initial RFC 9421 signing key - under the CALLER's own Mixer4AI principal. Requires a sponsor's Entra bearer token (Authorization: Bearer <token>). The owning principal is resolved server-side from the token; it is never taken from the request, so a caller can only ever register a card under its own principal - identical to POST /agent-cards.",
          "inputSchema": {
            "properties": {
              "request": {
                "description": "The agent card to register: an A2A-compatible manifest carrying the x-mixer4ai vendor extension. Set x-mixer4ai.signingPublicKey (base64 SubjectPublicKeyInfo of a NIST P-256 public key) to register the agent's initial signing key at the same time.",
                "properties": {
                  "capabilities": {
                    "properties": {
                      "pushNotifications": {
                        "type": "boolean"
                      },
                      "streaming": {
                        "type": "boolean"
                      }
                    },
                    "required": ["pushNotifications", "streaming"],
                    "type": "object"
                  },
                  "defaultInputModes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "defaultOutputModes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "description": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "type": "string"
                  },
                  "skills": {
                    "items": {
                      "properties": {
                        "description": {
