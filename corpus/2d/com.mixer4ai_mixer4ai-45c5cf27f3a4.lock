            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check Self-Registration Endpoint Challenge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
