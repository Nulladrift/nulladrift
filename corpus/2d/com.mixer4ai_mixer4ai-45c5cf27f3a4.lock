          },
          "digest": "sha256:d85f05a50b35bb05e941a84cb5b46779487739b97228b3802a2b643359e4f6a5"
        },
        {
          "name": "find_verified_agent",
          "title": "Find Verified Agent",
          "description": "Finds published Mixer4AI agents for a business need and, for each match, returns why it matched, what Mixer4AI can actually prove about who is behind it (verification tier, attestation evidence, signing-key status, Trust Passport reference), the latest recorded result of Mixer4AI's own scheduled endpoint-safety probe (no outbound call is made by this tool itself), and the next action the caller is permitted to take. Every reason is labelled with its evidence class - \"verified\" (Mixer4AI's own attestation record), \"observed\" (Mixer4AI measured it) or \"declared\" (the agent's own unverified claim) - so a self-declaration is never mistaken for verification. Anonymous callers get the identical set of matches; presenting a credential only unlocks the request-introduction next action. Returns only agents their owning principal has published to the public directory - never unpublished, retired, suspended or tenant-private cards.",
          "inputSchema": {
            "properties": {
              "budgetRange": {
                "default": null,
                "description": "Budget range, free text. Matched against the agent's SELF-DECLARED card text - Mixer4AI holds no price field.",
                "type": ["string", "null"]
              },
              "geography": {
                "default": null,
                "description": "Geography or jurisdiction, free text. Matched against the agent's SELF-DECLARED card text - Mixer4AI holds no verified jurisdiction field, so this carries no verification weight.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 10,
                "description": "Maximum matches to return (default 10, capped at 25).",
                "type": "integer"
              },
              "minimumVerificationTier": {
                "default": null,
                "description": "Minimum verification tier: unverified | basic_verified | verified_business | certified_enterprise. Agents below it are excluded. This is a MINIMUM, unlike search_directory's exact-match tier filter.",
                "type": ["string", "null"]
              },
              "need": {
                "default": null,
                "description": "The task or business need, in free text. Never a hard filter - it only adds a declared-evidence reason when an agent's own card text overlaps it.",
                "type": ["string", "null"]
              },
              "requireHumanConsent": {
                "default": true,
                "description": "Whether human consent is required before an introduction. Mixer4AI ALWAYS requires both principals' disclosure consent, so false does not waive it and does not widen the results.",
                "type": "boolean"
              },
              "requiredCapability": {
                "default": null,
                "description": "Required capability, free text (e.g. \"invoice reconciliation\"). Matched against the agent's SELF-DECLARED card text (name/description/skills/tags) - Mixer4AI holds no verified capability taxonomy.",
                "type": ["string", "null"]
              },
              "responseTime": {
                "default": null,
                "description": "Response-time requirement, free text. Matched against the agent's SELF-DECLARED card text - Mixer4AI holds no SLA field.",
                "type": ["string", "null"]
              },
              "role": {
                "default": null,
                "description": "\"intent\" (the agent posts business needs) or \"offer\" (the agent supplies against them). Matched against the card's structured capability flags. Omit for no filter.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Verified Agent"
