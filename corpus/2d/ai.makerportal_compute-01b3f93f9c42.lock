        {
          "name": "llmVramFit",
          "title": "Decide whether one LLM fits one accelerator, at every quantization.",
          "description": "Decide whether one LLM fits one accelerator, at every quantization.\n\nThe identical function behind the /lab/llm-vram instrument. Returns one row per quantization (FP16 through Q3_K_M) with weight bytes and their basis, headroom, the largest context that fits, and the bandwidth-limited decode ceiling; plus the chosen best-fitting quant, the full-precision row, and a five-state verdict. Model geometry comes from each repo’s own config.json and tensor-shape index; accelerator capacity and bandwidth come from the site’s device table.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "batch": {
                "default": 1,
                "description": "Concurrent sequences sharing the cache. Omit it for the published page's 1.",
                "maximum": 1024,
                "minimum": 1,
                "type": "integer"
              },
              "context": {
                "default": 8192,
                "description": "Context length in tokens used for the headline verdict. Omit it and the solver takes its own default of 8192, which is what the published page states.",
                "maximum": 10000000,
                "minimum": 1,
                "type": "integer"
              },
              "gpu": {
                "description": "Accelerator slug.",
                "enum": ["rtx-5090", "rtx-5080", "rtx-5070-ti", "rtx-4090", "rtx-4080-super", "rtx-4070-ti-super", "rtx-4060-ti-16gb", "rtx-3090", "rtx-3060-12gb", "rtx-6000-ada", "l40s", "a100-40gb", "a100-80gb", "h100-sxm", "h200-sxm", "rx-7900-xtx", "apple-m4-24gb", "apple-m4-pro-48gb", "apple-m4-max-128gb", "apple-m3-ultra-512gb", "jetson-orin-nano-super-8gb", "jetson-agx-orin-64gb"],
                "type": "string"
