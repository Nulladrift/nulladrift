        {
          "name": "portLength",
          "title": "Solve a vented loudspeaker box for the length of round port to cut, with both end corrections, the smallest workable diameter and the peak port air speed.",
          "description": "Solve a vented loudspeaker box for the length of round port to cut, with both end corrections, the smallest workable diameter and the peak port air speed.\n\nThe identical function behind the worked examples on /lab/port-length-calculator and the calculator itself. Give the net box volume `vol` (litres), the port inside diameter `dia` (cm) and the tuning `fb` (Hz); `temp` (deg C, default 20) sets the speed of sound. Returns the length to cut (cm), the acoustic length and the end correction it contains, the port area, length/diameter, the air volume the port displaces, and the smallest diameter that can reach the tuning. When the port is too narrow, `tooNarrow` is true and `cutLengthCm` is negative: the end corrections alone already exceed the acoustic length the tuning needs. Add `sd` (cone area, cm^2) and `xmax` (peak excursion, mm) together for the peak port air speed.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dia": {
                "description": "Inside diameter of a round port, centimetres. For a slot, the diameter of the round port of equal area, 2*sqrt(w*h/pi).",
                "maximum": 200,
                "minimum": 0.1,
                "type": "number"
              },
              "fb": {
                "description": "Box tuning frequency, hertz.",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              },
              "sd": {
                "description": "Driver effective cone area Sd, cm^2. Give with `xmax` for the peak port air speed.",
                "maximum": 20000,
                "minimum": 1,
                "type": "number"
              },
              "temp": {
                "description": "Air temperature, deg C. Default 20.",
                "maximum": 60,
                "minimum": -50,
                "type": "number"
              },
              "vol": {
                "description": "Net internal box volume, litres (after the driver, bracing and port are subtracted).",
                "maximum": 100000,
                "minimum": 0.1,
                "type": "number"
              },
              "xmax": {
                "description": "Driver peak one-way excursion, mm. Give with `sd`.",
                "maximum": 100,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["dia", "fb", "vol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "inputs": {
                "description": "The parsed inputs, echoed back with defaults filled in.",
