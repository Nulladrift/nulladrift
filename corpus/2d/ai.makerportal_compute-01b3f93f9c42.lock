      "instructions": "Deterministic engineering solvers. Every tool runs the identical function that renders the corresponding published page on makerportal.ai — nothing is fetched, nothing is recalled from a model, and the same inputs always give the same answer.\n\nEvery result carries `provenance.canonicalUrl`: the published page stating exactly this answer when the inputs are on the published grid, and the lane hub when they are not. Cite it. `license` is \"free-with-attribution\".\n\nNumbers that are not finite come back as the strings \"Infinity\", \"-Infinity\" and \"NaN\". Those are real answers (a notch is -inf dB at its centre frequency); they are not error states.",
      "tools": [
        {
          "name": "biquadDesign",
          "title": "Design one RBJ-cookbook biquad and report its numerical behaviour.",
          "description": "Design one RBJ-cookbook biquad and report its numerical behaviour.\n\nThe identical function behind the /lab/biquad coefficient tables. Returns coefficients at the requested sample rate, coefficients at every other rate whose Nyquist limit clears the corner, pole/zero geometry, the −3 dB points solved by bisection, a Q sweep, a gain sweep where the type uses gain, and the quantised forms. The 240-point response curve is omitted unless include=curve is passed. Non-finite values (a notch is −∞ at f0; a low-pass is −∞ at Nyquist) are encoded as the strings \"Infinity\", \"-Infinity\" and \"NaN\" — JSON has no other honest option, and null would be a different answer.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "freq": {
                "description": "Corner (or centre) frequency f0 in Hz. Must be below Nyquist.",
                "maximum": 1000000,
                "minimum": 0.1,
                "type": "number"
              },
              "fs": {
                "default": 48000,
                "description": "Sample rate in Hz. Defaults to 48000.",
                "maximum": 768000,
                "minimum": 1000,
                "type": "number"
              },
              "gain": {
                "description": "Peak/shelf gain in dB. Ignored by types that do not use gain.",
                "maximum": 40,
                "minimum": -40,
                "type": "number"
              },
              "include": {
                "description": "Optional heavy block to include, omitted by default. \"curve\": The 240-point log-spaced magnitude response, and one per sweep row.",
                "enum": ["curve"],
                "type": "string"
              },
              "q": {
                "description": "Filter Q. Defaults to the type’s own default. Shelves ignore it (S is fixed at 1, matching Web Audio).",
                "maximum": 100,
                "minimum": 0.01,
                "type": "number"
              },
              "type": {
                "description": "Filter type.",
                "enum": ["lowpass", "highpass", "bandpass", "notch", "allpass", "peaking", "lowshelf", "highshelf"],
                "type": "string"
              }
            },
            "required": ["freq", "type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "inputs": {
                "description": "The parsed inputs, echoed back with defaults filled in.",
                "type": "object"
              },
              "license": {
                "type": "string"
              },
              "provenance": {
                "properties": {
                  "canonicalUrl": {
                    "description": "The published page stating this exact answer, or the lane hub when the inputs are off the published grid. Cite it.",
                    "type": "string"
                  },
                  "method": {
                    "description": "How the answer was computed, and what its inputs are.",
                    "type": "string"
                  }
                },
                "required": ["canonicalUrl", "method"],
                "type": "object"
              },
              "result": {
                "description": "The solved analysis. Shape is per-tool.",
                "type": "object"
              }
            },
            "required": ["inputs", "license", "provenance", "result"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
