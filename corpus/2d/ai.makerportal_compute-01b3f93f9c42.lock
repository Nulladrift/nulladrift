        {
          "name": "opticsResonator",
          "title": "Solve a two-mirror laser cavity: g-parameters, stability, and the TEM00 waist and mirror spot sizes.",
          "description": "Solve a two-mirror laser cavity: g-parameters, stability, and the TEM00 waist and mirror spot sizes.\n\nThe identical function behind the worked examples on /lab/optics-bench, built from the resonator code the bench runs. Give the mirror spacing `l` (cm), each mirror radius `r1`, `r2` (cm; positive is concave toward the cavity, negative convex, omitted means flat) and the wavelength `w` (nm). Returns g1, g2, their product, the round-trip half-trace and whether the cavity is stable; when it is, `mode` holds the waist radius (um), its distance from mirror 1 (cm) and the spot radius on each mirror (mm). `mode` is null for an unstable cavity or one on the g1*g2 = 0 or 1 boundary.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "l": {
                "description": "Mirror spacing (cavity length), centimetres.",
                "maximum": 10000,
                "minimum": 0.1,
                "type": "number"
              },
              "r1": {
                "description": "Radius of curvature of mirror 1, cm. Positive = concave toward the cavity, negative = convex. Omit for a flat mirror.",
                "maximum": 100000,
                "minimum": -100000,
                "type": "number"
              },
              "r2": {
                "description": "Radius of curvature of mirror 2, cm, same convention. Omit for a flat mirror.",
                "maximum": 100000,
                "minimum": -100000,
                "type": "number"
              },
              "w": {
                "description": "Wavelength, nanometres.",
                "maximum": 20000,
                "minimum": 100,
                "type": "number"
              }
            },
            "required": ["l", "w"],
            "type": "object"
          },
          "outputSchema": {
