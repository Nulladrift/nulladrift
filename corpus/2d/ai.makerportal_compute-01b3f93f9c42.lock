        {
          "name": "roomShapeBand",
          "title": "Solve the best rectangular room proportions for a given volume.",
          "description": "Solve the best rectangular room proportions for a given volume.\n\nThe identical function that renders /lab/room-shape/{lo}-{hi}. Give a room volume in cubic feet and get the proportions to build: the length and width as multiples of the ceiling height, the exact dimensions at your volume, the widest axial gap they leave, and how far those proportions sit from a full solve at your exact volume. Also returns the band the volume falls in, that band's guarantee across its whole range, and which Bolt constraints are active at the answer. Five bands cover 800-5,000 cubic feet; a volume outside that range is refused rather than served from the nearest band.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "volume": {
                "description": "Room volume in cubic feet. Five bands cover 800–5000 ft³; anything outside that is a 400 naming the range, never an answer from the nearest band.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["volume"],
            "type": "object"
          },
