        {
          "name": "roomModes",
          "title": "Solve the eigenmodes of a rectangular room.",
          "description": "Solve the eigenmodes of a rectangular room.\n\nThe identical function behind the /lab/room-modes instrument. Dimensions are in feet and are converted at 0.3048 m/ft. Returns every mode below maxFreq, the three axial fundamentals, mode pile-ups (three or more modes within 5 Hz, capped at 200 Hz because dense modes above the Schroeder crossover are desirable rather than a defect), the widest axial gap below 200 Hz, and Schroeder frequencies at RT60 = 0.3 s and 0.6 s. The full mode list is omitted unless include=modes is passed; counts are always present.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "height": {
                "description": "Ceiling height in feet.",
                "maximum": 40,
                "minimum": 3,
                "type": "number"
              },
              "include": {
                "description": "Optional heavy block to include, omitted by default. \"modes\": Every solved mode and the axial subset, with their (nx, ny, nz) orders.",
                "enum": ["modes"],
                "type": "string"
              },
              "length": {
                "description": "Room length in feet.",
                "maximum": 100,
                "minimum": 3,
                "type": "number"
              },
              "maxFreq": {
                "default": 300,
                "description": "Highest mode frequency to solve for, in Hz. Defaults to 300. Mode count scales with volume × frequency³, so a large room and a high maxFreq together are refused with a 400 once the enumeration would exceed 100,000 modes; the error names the maxFreq that would have worked.",
                "maximum": 1000,
                "minimum": 20,
                "type": "number"
              },
              "width": {
                "description": "Room width in feet.",
                "maximum": 100,
                "minimum": 3,
                "type": "number"
              }
            },
            "required": ["height", "length", "width"],
            "type": "object"
          },
