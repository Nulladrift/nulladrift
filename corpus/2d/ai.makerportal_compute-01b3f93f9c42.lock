        {
          "name": "gaussianBeam",
          "title": "Solve an ideal Gaussian laser beam: Rayleigh range, divergence, radius at a distance, and the waist behind a focusing lens.",
          "description": "Solve an ideal Gaussian laser beam: Rayleigh range, divergence, radius at a distance, and the waist behind a focusing lens.\n\nThe identical function behind the worked examples on /lab/gaussian-beam-calculator, built from the same q-propagation the calculator runs. Give a wavelength and a 1/e^2 waist radius to get the Rayleigh range, the far-field half-angle divergence and the depth of focus. Add `distance` (metres from the waist) for the beam radius and phase-front curvature there. Add `focal` (millimetres) to put a thin lens at the waist and get the focused waist radius, its distance behind the lens and its Rayleigh range.\n\nEvery result carries provenance.canonicalUrl — the published page for these exact inputs, or the lane hub when they are off the published grid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "distance": {
                "description": "Distance in metres, from the waist (or, when `focal` is given, from the lens, after it). Negative is upstream. When given, the result includes the beam radius and phase-front curvature there.",
                "maximum": 1000000,
                "minimum": -1000000,
                "type": "number"
              },
              "focal": {
                "description": "Focal length in millimetres of a thin lens placed at the waist. When given, the result includes the focused waist.",
                "maximum": 1000000,
                "minimum": 0.001,
                "type": "number"
              },
              "waist": {
                "description": "1/e^2 waist RADIUS in millimetres (not the diameter). At least one wavelength: the model is paraxial.",
                "maximum": 1000,
                "minimum": 0.0001,
                "type": "number"
              },
              "wavelength": {
                "description": "Vacuum wavelength in nanometres (632.8 for HeNe, 1064 for Nd:YAG).",
                "maximum": 20000,
                "minimum": 100,
                "type": "number"
              }
            },
            "required": ["waist", "wavelength"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "inputs": {
                "description": "The parsed inputs, echoed back with defaults filled in.",
                "type": "object"
