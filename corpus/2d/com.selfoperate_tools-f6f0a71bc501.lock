      "serverInfo": {
        "name": "selfoperate-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "area_businesses",
          "description": "Businesses of one category across a US city, ZIP or coordinates, radius up to 20 km: name, address, phone, website, social links, distance, confidence and source for each. Nearest first, up to 150 per call, paged with offset (see total_found and next_offset). Same data as nearby-businesses, built for lists. Charged only when at least one is found. Costs $0.25 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "category",
                "type": "string"
              },
              "lat": {
                "description": "lat",
                "type": "number"
              },
              "limit": {
                "description": "1 to 150, default 100",
                "type": "number"
              },
              "lon": {
                "description": "lon",
                "type": "number"
              },
              "offset": {
                "description": "skip this many (for the next page), default 0",
                "type": "number"
              },
              "place": {
                "description": "US city and state, or ZIP (or give lat and lon)",
                "type": "string"
              },
              "radius_km": {
                "description": "1 to 20, default 10",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49dfa6a6771a78e52353b604051a2408771c08106edb24c548ccd0c0d4e369b9"
        },
        {
          "name": "business_verify",
          "description": "Business verify: give a business domain (and optionally its name). Checks public facts only: domain age (registry record), email setup (MX, SPF, DMARC), HTTPS and certificate, and whether the name appears on the site. Returns a trust score with each signal, its source and fetch time, and warnings. No registrant or personal data. Charged only when the domain resolves. Costs $0.05 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "domain": {
                "description": "Business domain or website URL, e.g. example.com",
                "type": "string"
              },
              "name": {
                "description": "Optional business name to look for on the site",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7022396b4496652473846e0ae26cdf3c88fd339750baa0e77461b511263dd437"
        },
        {
          "name": "company_dossier",
          "description": "Company dossier for a US business, from a name and city/state and/or a website. One call returns: the matched business (Overture), phone, address and category, hours only if the business publishes them, domain age, email setup (MX/SPF/DMARC), certificate, website health and technology stack, SEC registration for public companies, a source, date and confidence on every field, honest 'not found' where unknown, and a short summary. Business facts only, no personal data. Charged only when the business or domain is found. Costs $0.15 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Business name",
                "type": "string"
              },
              "place": {
                "description": "US city and state, or ZIP, e.g. 'Austin, TX'",
                "type": "string"
              },
              "website": {
                "description": "Business website or domain",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:40d30c6faf1cc0d701c5a3f130a92d21615c01ce810ef7c8a00ac50bb9526702"
        },
        {
          "name": "local_business_profile",
          "description": "Company / business enrichment lookup (US). Give a business name and a city or ZIP; get the best matching business with address, phone, website, social links, category, website health score, services it publishes on its own site, and a verification block: every field lists its sources and fetched-at date, sources are cross-checked (phone, name, address), conflicts are reported, and an overall confidence is given. Charged only when a match is found. Costs $0.03 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Business name",
                "type": "string"
              },
              "place": {
                "description": "US city and state, or ZIP, e.g. 'Austin, TX'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:378c80a5d19424e1ed3f92fbaea7e1bfaa2d4b4715a6408f2a2143abacdba532"
        },
        {
          "name": "nearby_businesses",
          "description": "Businesses of one category near a US city, ZIP or coordinates: name, address, phone, website, social links, distance, confidence and source for each. Nearest first, up to 50, radius up to 10 km. Categories include dentist, restaurant, salon, lawyer, plumber/electrician (trades), hotel, gym, vet. Charged only when at least one is found. Costs $0.03 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "category",
                "type": "string"
              },
              "lat": {
                "description": "lat",
                "type": "number"
              },
              "limit": {
                "description": "1 to 50, default 20",
                "type": "number"
              },
              "lon": {
                "description": "lon",
                "type": "number"
              },
              "place": {
                "description": "US city and state, or ZIP (or give lat and lon)",
                "type": "string"
              },
              "radius_km": {
                "description": "0.5 to 10, default 5",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c8a4542b8dacdfd4b65026732b2c5e59970307d63805b5987c636193d3a70987"
        },
        {
          "name": "page_brief",
          "description": "Page brief: give a public URL; get the page as clean markdown (headings, text, links), its title, description, language and word count, a website health score with the top issues, and which security headers are present. Fetched by us live, respects robots.txt, skips login-walled pages. Charged only when the page could be read. Costs $0.03 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Public http(s) URL of the page",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba3e840a9e8d8b76d80978a522b5e67897b2c3cc1115b6d6c095ebddbf0bd47b"
        },
        {
          "name": "site_check",
          "description": "Website health, search-visibility and conversion check for any public URL. Returns a 0-100 score and a ranked list of issues, each with what was found, why it matters and the fix. About 20 checks: HTTPS and certificate, speed, mobile tag, title, description, headings, structured data, robots, sitemap, llms.txt, contact and call to action, broken links. Costs $0.02 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Public http(s) URL of the site to check",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:56e94c2fe32d457889833a77c07bd9ba2cc53dcecbc35b541d4526956ce87787"
        }
      ],
      "digest": "sha256:9925d75de1733ca23fed037b9cdaefcab61f1adda77ac94793d54b1c65490465"
    }
