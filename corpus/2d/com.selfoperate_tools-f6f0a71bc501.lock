          "digest": "sha256:c520d6cc76ed2269a150d16ec70bf470cec1f34aade41ff8924e2cf0bd8a0910"
        },
        {
          "name": "page_brief",
          "description": "Page brief: give a public URL; get the page as clean markdown (headings, text, links), its title, description, language and word count, a website health score with the top issues, and which security headers are present. Fetched by us live, respects robots.txt, skips login-walled pages. Charged only when the page could be read. Costs $0.03 per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "Public http(s) URL of the page",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
