                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Merchant name, website domain or ID. Empty string lists the catalog.",
                "maxLength": 150,
                "type": "string"
              }
            },
            "required": ["market", "query"],
            "type": "object"
