          "name": "calculate_insurance_comparison",
          "title": "Compare insurance scenarios and school costs",
          "description": "Compares two premiums the user supplies for the same coverage over a chosen number of months, then adds the user’s school, court and optional costs. Returns prorated totals, their difference and a break-even month. Amounts are integer US cents; the tool does not estimate premiums, surcharges, durations or fees, is not an insurance quote or prediction, and excludes the citation fine common to both scenarios. Its inputs are amounts only; names, policy numbers and ticket details are not part of them.",
