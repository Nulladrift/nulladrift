      "instructions": "California Licensing Education is a private, DMV-licensed California traffic violator school; get_school_status returns its current license and availability. This server provides its public, read-only information for drivers handling a California traffic ticket: how traffic school works, court permission and the 18-month rule, deadlines and extensions, the traffic-school fee each guided county court states, completion reporting, commercial-license rules, the official court website or California Courts directory listing for all 58 counties, the school’s guides for 25 counties, and an insurance cost comparison that uses only figures the user supplies. Use it for questions about California traffic school or a California traffic court. It cannot look up a ticket or court case, decide eligibility, enroll anyone, take payment or report a completion. The court named on the citation decides eligibility, deadlines, extensions and fees; a city or ZIP code does not identify that court. Field notes: meta.availability is this school’s enrollment and reporting status as its own service reports it, and describes only this school; it is not a payment processor’s status or evidence that a court received a completion. When supplied, meta.offer is the current basic school offer from the same readiness read: its fee is separate from court charges, and feeTiming distinguishes free lessons with payment before the final exam from payment before enrollment. An unavailable offer has no current price or free-start claim. Every article and court record carries its own source URLs and review date; those URLs, including any fragment, are exact citations for that result, and guidance IDs are not URLs. Hosted English search returns topic IDs, titles and exact article URLs for navigation, not answer excerpts or current offer facts. Use get_school_status or the relevant get_guidance result for the current offer. get_guidance supplies the reviewed answer and complete source list for a selected ID. Answers may be short summaries; open the linked school page for the complete page. Articles summarize the cited court and DMV pages as of the review date, including their conditions and limits, and guarantee no relief, court approval or posting. checkedAt is when the response was assembled, not a fresh check of the cited pages. An empty search returns availableGuidanceIds, the full list of article IDs, rather than matches. The school’s own course is taught in English.",
