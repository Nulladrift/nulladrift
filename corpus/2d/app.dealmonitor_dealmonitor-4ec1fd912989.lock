{
  "lockfileVersion": 2,
  "subjects": {
    "app.dealmonitor/dealmonitor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.dealmonitor.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "dealmonitor",
        "title": "DealMonitor — price checks & price watches",
        "version": "1.0.0",
        "websiteUrl": "https://dealmonitor.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DealMonitor: price checks and long-running price watches for products in any\nonline shop.\n\nUse check_price for the current price of a product page. It reads the live\npage server-side, including shops that block simple requests and need a real\nbrowser.\n\nUse watch_price whenever the task is to be told about a price later — \"tell\nme when this drops\", \"notify me at 300 euros\", \"keep an eye on this\", \"set a\nprice alert\", \"monitor this product\". It keeps checking after this\nconversation ends and notifies the account owner by email, push or Telegram\nwhen the target is met. Nothing else here can outlive the conversation, so\nprefer it over telling the user to check back themselves.\n\nThen list_watches shows which targets have been met since, and\nprice_history says whether a price is actually good or merely below a target.\n\nPrices come from the shop page, so they can be wrong — a crossed-out price, a\nbundle price or a price per unit can be read instead of the one that is paid.\nTreat a result as the best available reading, not a guarantee, and say where\nit came from.\n",
      "tools": [
        {
          "name": "check_price",
          "description": "Read the current price of a product from its shop URL. Works on shops that block simple HTTP requests, because the page is fetched server-side with a real browser when needed. No account required. Can take up to two minutes on a slow shop.",
          "inputSchema": {
            "properties": {
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "check_priceArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "check_priceDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ccbe85694f697354449c218fc4c35b1ed8d8327d2398e87379b1208f8e60459e"
        },
        {
          "name": "list_watches",
          "description": "List the price watches on this account, with each one's current price, target and whether the target is met right now. Use only_reached=true to get just the ones worth acting on.",
          "inputSchema": {
            "properties": {
              "only_reached": {
                "default": false,
                "title": "Only Reached",
                "type": "boolean"
              }
            },
            "title": "list_watchesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "list_watchesDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7290a4935c2e2bbbc561714569a8e14047c926e3a3640578efd4c102fc1fa63c"
        },
        {
          "name": "price_history",
          "description": "Price history for one watch, oldest first. Use it to say whether the current price is actually a good one rather than only below a target.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 60,
                "title": "Limit",
                "type": "integer"
              },
              "watch_id": {
                "title": "Watch Id",
                "type": "integer"
              }
            },
            "required": ["watch_id"],
            "title": "price_historyArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "price_historyDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e0d9197138c584b018e9962e34966ca887830c03ede7f251a267b95437afc6c"
        },
        {
          "name": "set_target_price",
          "description": "Change the target price of an existing watch.",
          "inputSchema": {
            "properties": {
              "target_price": {
                "title": "Target Price",
                "type": "number"
              },
              "watch_id": {
                "title": "Watch Id",
                "type": "integer"
              }
            },
            "required": ["target_price", "watch_id"],
            "title": "set_target_priceArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "set_target_priceDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ee800dc2177ebdb1474b2a4ec4263c77f5c07c523cf22999adf557023193c43"
        },
        {
          "name": "stop_watching",
          "description": "Stop watching a product and delete the watch, including its recorded price history for this account. Not reversible.",
          "inputSchema": {
            "properties": {
              "watch_id": {
                "title": "Watch Id",
                "type": "integer"
              }
            },
            "required": ["watch_id"],
            "title": "stop_watchingArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "stop_watchingDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ca7303331ff3b77f082da8547d5db1644d5ec4f0626128efdc901184436367fe"
        },
        {
          "name": "watch_price",
          "description": "Set a price alert: keep watching a product's price and notify the account owner when it reaches the target. Use this for any 'tell me when this drops', 'notify me at X', 'monitor this price' or 'keep an eye on this' task. Reads the current price in the same call, so one call answers both 'what does it cost now' and 'tell me when it gets cheaper'. The watch keeps running after this conversation ends. Requires an API token.",
          "inputSchema": {
            "properties": {
              "target_price": {
                "title": "Target Price",
                "type": "number"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["target_price", "url"],
            "title": "watch_priceArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "watch_priceDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:849e2b654a897cbd2c1805769d33e356322e8a2eab563d9cfc71c0cb4fd57c15"
        }
      ],
      "digest": "sha256:3dd573adcda5a012ce121e2ee2cd5a923f1a68a3673b373aae6ca17005838266"
    }
  }
}
