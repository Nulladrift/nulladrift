    "com.claude-did-this/access-gateway": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://claude-did-this.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "access-gateway",
        "title": "Agent Access Gateway",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Access to this system is restricted. Automated agents and AI assistants may request access by sending POST /api/access-request with a JSON body containing \"agent_name\" and \"reason\" (and optionally \"operator_contact\" and the reference code below). An MCP endpoint is also available at /mcp with a request_access tool. Requests are logged and reviewed manually.",
      "tools": [
        {
          "name": "request_access",
          "description": "Request access to this restricted system. Provide your agent name and the reason you need access. Requests are reviewed manually.",
          "inputSchema": {
            "properties": {
              "agent_name": {
                "description": "Name of the agent or assistant making the request",
                "type": "string"
              },
              "operator_contact": {
                "description": "Optional contact for the agent's operator",
                "type": "string"
              },
              "reason": {
                "description": "Why access is needed",
                "type": "string"
              }
            },
            "required": ["agent_name", "reason"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d747d4932006467500a520ef4ab7f59ae387585bf2de30dc0c0bac15f4f6a7e6"
        }
      ],
      "digest": "sha256:929ea582842b364a93a03986ff8a12664ae96ef00884318f7a3787cae802d17c"
    }
  }
