{
  "lockfileVersion": 2,
  "subjects": {
    "com.loteriasapi/loterias": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.loteriasapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "loterias-api",
        "title": "Loterias API",
        "version": "1.0.0",
        "websiteUrl": "https://loteriasapi.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to official Spanish state lottery data (Loterias y Apuestas del Estado): latest results, next draws, number checking and aggregated statistics. Each game exposes its 3 most recent draws; statistics are aggregated over past draws and do not predict future results.",
      "tools": [
        {
          "name": "check_numbers",
          "title": "Check numbers against a draw",
          "description": "Check whether a set of numbers won in one of the 3 most recent draws of a game (default: the latest). For \"nacional\" the numbers are décimo numbers (up to 5 digits, at most 5, pass them as strings to keep leading zeros, e.g. \"01755\"). For the other games pass the main numbers and, when the game has them, the extra numbers (stars, reintegro, clave...). Returns matches, whether it is a winner and the prize. Only the 3 most recent draws can be checked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "drawDate": {
                "description": "Optional draw date (YYYY-MM-DD). Must be one of the 3 latest draws; defaults to the latest.",
                "examples": ["2026-11-11"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "extraNumbers": {
                "description": "Optional extra numbers: Euromillones stars, reintegro in Primitiva/Bonoloto, etc.",
                "examples": [
                  [3, 11]
                ],
                "items": {
                  "maximum": 99,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array"
              },
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["bonoloto", "euromillones", "lototurf", "primitiva", "gordo", "quiniela", "quinigol", "quintuple", "nacional", "eurodreams"],
                "examples": ["euromillones"],
                "type": "string"
              },
              "numbers": {
                "description": "Main numbers to check (nacional: décimo numbers, up to 5 digits).",
                "examples": [
                  [4, 15, 23, 38, 42]
                ],
                "items": {
                  "anyOf": [
                    {
                      "maximum": 99999,
                      "minimum": 0,
                      "type": "integer"
                    },
                    {
                      "pattern": "^\\d{1,5}$",
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["game", "numbers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check numbers against a draw"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9444aac069d765b3e86253f2e330a696da3eada81977f32f4e0761d60481192d"
        },
        {
          "name": "get_latest_results",
          "title": "Get latest lottery results",
          "description": "Get the most recent official results (draw date, winning combination, complementary numbers and jackpot when applicable) of one game, newest first. Use it for questions like \"what were the last Euromillones numbers?\". Returns up to the 3 most recent draws.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["bonoloto", "euromillones", "lototurf", "primitiva", "gordo", "quiniela", "quinigol", "quintuple", "nacional", "eurodreams"],
                "examples": ["euromillones"],
                "type": "string"
              },
              "limit": {
                "default": 1,
                "description": "How many recent draws to return (1-3).",
                "examples": [1],
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get latest lottery results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e3cb8852508ceb1133c420d325507fddd2bba14407f208562f15c270f9b715c"
        },
        {
          "name": "get_next_draw",
          "title": "Get the next lottery draw",
          "description": "Get the next scheduled draw of one game: date, status and announced jackpot when available. Use it for \"when is the next Primitiva draw and how much is the jackpot?\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["bonoloto", "euromillones", "lototurf", "primitiva", "gordo", "quiniela", "quinigol", "quintuple", "nacional", "eurodreams"],
                "examples": ["euromillones"],
                "type": "string"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the next lottery draw"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7fe0416d2cc75dae2447c9b6c2561093c0c5f2e0b71dac0584299e9a539cf7b"
        },
        {
          "name": "get_public_statistics",
          "title": "Get aggregated game statistics",
          "description": "Aggregated statistics of a game over its last 2000 draws: most and least frequent numbers, longest absences, even/odd split, sum range and top pairs. Available for: primitiva, bonoloto, euromillones, gordo, eurodreams, lototurf. Covers the last 2000 draws only; no per-number tables or custom periods.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["primitiva", "bonoloto", "euromillones", "gordo", "eurodreams", "lototurf"],
                "examples": ["primitiva"],
                "type": "string"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get aggregated game statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f67d90112ea8d35aa7c965f5114c6e44ceb990da164bc8584d68cf4e6b74134"
        },
        {
          "name": "list_games",
          "title": "List lottery games",
          "description": "List the Spanish state lottery games covered (slug and name). Use the slug as the \"game\" argument of the other tools.",
