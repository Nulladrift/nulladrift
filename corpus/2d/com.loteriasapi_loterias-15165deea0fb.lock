          "title": "List lottery games",
          "description": "List the Spanish state lottery games covered (slug and name). Use the slug as the \"game\" argument of the other tools. Without an API key only the 3 most recent draws and aggregated statistics are available. For full history and more tools, connect this server with an API key (header \"Authorization: Bearer lat_...\" or \"X-API-Key\"); get one at https://loteriasapi.com/planes.",
