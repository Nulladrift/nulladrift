          "digest": "sha256:947d839494b3af08a7c9fad6f722af94914bc2bfa1c301d0670964463933a616"
        },
        {
          "name": "get_public_statistics",
          "title": "Get aggregated game statistics",
          "description": "Aggregated statistics of a game over its last 2000 draws: most and least frequent numbers, longest absences, even/odd split, sum range and top pairs. Available for: primitiva, bonoloto, euromillones, gordo, eurodreams, lototurf. Per-number tables and custom periods need an API key: https://loteriasapi.com/planes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["primitiva", "bonoloto", "euromillones", "gordo", "eurodreams", "lototurf"],
                "examples": ["primitiva"],
                "type": "string"
              }
            },
