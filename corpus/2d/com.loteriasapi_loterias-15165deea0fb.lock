      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "loterias-api",
        "title": "Loterias API",
        "version": "1.0.0",
        "websiteUrl": "https://loteriasapi.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to official Spanish state lottery data (Loterias y Apuestas del Estado): latest results, next draws, number checking and aggregated statistics. Without an API key the server exposes the 3 most recent draws of each game and aggregated statistics. For full history and more tools, connect with an API key (header \"Authorization: Bearer lat_...\" or \"X-API-Key\"); get one at https://loteriasapi.com/planes.",
      "tools": [
        {
          "name": "check_numbers",
          "title": "Check numbers against a draw",
          "description": "Check whether a set of numbers won in one of the 3 most recent draws of a game (default: the latest). For \"nacional\" the numbers are décimo numbers (up to 5 digits, at most 5, pass them as strings to keep leading zeros, e.g. \"01755\"). For the other games pass the main numbers and, when the game has them, the extra numbers (stars, reintegro, clave...). Returns matches, whether it is a winner and the prize. Older draws need an API key: https://loteriasapi.com/planes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "drawDate": {
                "description": "Optional draw date (YYYY-MM-DD). Must be one of the 3 latest draws; defaults to the latest.",
                "examples": ["2026-11-11"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "extraNumbers": {
                "description": "Optional extra numbers: Euromillones stars, reintegro in Primitiva/Bonoloto, etc.",
                "examples": [
                  [3, 11]
                ],
                "items": {
                  "maximum": 99,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 5,
                "type": "array"
              },
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["bonoloto", "euromillones", "lototurf", "primitiva", "gordo", "quiniela", "quinigol", "quintuple", "nacional", "eurodreams"],
                "examples": ["euromillones"],
                "type": "string"
              },
              "numbers": {
                "description": "Main numbers to check (nacional: décimo numbers, up to 5 digits).",
                "examples": [
                  [4, 15, 23, 38, 42]
                ],
                "items": {
                  "anyOf": [
                    {
                      "maximum": 99999,
                      "minimum": 0,
                      "type": "integer"
                    },
                    {
                      "pattern": "^\\d{1,5}$",
                      "type": "string"
                    }
                  ]
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["game", "numbers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check numbers against a draw"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83436318ac093d3e077636a6ce0f16fe1dbeef2b841c0a8a31cb1caf2f93e425"
        },
        {
          "name": "get_latest_results",
          "title": "Get latest lottery results",
          "description": "Get the most recent official results (draw date, winning combination, complementary numbers and jackpot when applicable) of one game, newest first. Use it for questions like \"what were the last Euromillones numbers?\". Without an API key only the 3 most recent draws and aggregated statistics are available. For full history and more tools, connect this server with an API key (header \"Authorization: Bearer lat_...\" or \"X-API-Key\"); get one at https://loteriasapi.com/planes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["bonoloto", "euromillones", "lototurf", "primitiva", "gordo", "quiniela", "quinigol", "quintuple", "nacional", "eurodreams"],
                "examples": ["euromillones"],
                "type": "string"
              },
              "limit": {
                "default": 1,
                "description": "How many recent draws to return (1-3).",
                "examples": [1],
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get latest lottery results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52580be2db413ccc4208988af99db3ce9c2ba0e48d9061648e31c4506ed8ae1a"
        },
        {
          "name": "get_next_draw",
          "title": "Get the next lottery draw",
          "description": "Get the next scheduled draw of one game: date, status and announced jackpot when available. Use it for \"when is the next Primitiva draw and how much is the jackpot?\". Without an API key only the 3 most recent draws and aggregated statistics are available. For full history and more tools, connect this server with an API key (header \"Authorization: Bearer lat_...\" or \"X-API-Key\"); get one at https://loteriasapi.com/planes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "Game slug. Call list_games to see them all. Example: \"euromillones\".",
                "enum": ["bonoloto", "euromillones", "lototurf", "primitiva", "gordo", "quiniela", "quinigol", "quintuple", "nacional", "eurodreams"],
                "examples": ["euromillones"],
                "type": "string"
              }
            },
