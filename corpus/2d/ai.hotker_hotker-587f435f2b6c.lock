      "tools": [
        {
          "name": "calculate_combo_discount",
          "title": "HOTKER 통신 결합할인 계산",
          "description": "통신사별 월 결합할인과 동일 조건 24개월 합계의 참고값을 계산합니다. SKT는 mobileLines, KT는 mobileMonthlyTotal, LGU_PLUS는 mobilePlanFees가 필요합니다. data.result에 mobileDiscount, internetDiscount, iptvDiscount, monthlyDiscount, discount24Months를 원(KRW)으로 반환합니다. KT 휴대폰 할인은 개인 몫이 아닌 가족 전체 배분 전 금액입니다. 결과는 항상 estimated이며 가입 자격·명의·프로모션·승인은 통신사 확인이 필요합니다. 무인증·읽기 전용으로 가입 변경은 하지 않습니다. 전체 구매비용은 calculate_mobile_tco, 출처는 get_calculation_evidence를 사용하세요.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "carrier": {
                "description": "계산용 통신사 코드. LG U+는 LGU_PLUS. 개인 계정이나 가입 자격을 조회하지 않습니다.",
                "enum": ["SKT", "KT", "LGU_PLUS"],
                "type": "string"
              },
              "internetTier": {
                "description": "인터넷 속도 등급. 200M은 LGU_PLUS만 지원.",
                "enum": ["100M", "200M", "500M", "1G"],
                "type": "string"
              },
              "iptv": {
                "description": "SKT IPTV 결합 여부. 생략 시 false. KT·LGU_PLUS에서는 이 필드를 사용하지 않음.",
                "type": "boolean"
              },
              "mobileLines": {
                "description": "SKT 필수: 결합할 휴대폰 회선 수 1~5. 다른 통신사는 이 필드를 사용하지 않음.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "mobileMonthlyTotal": {
                "description": "KT 필수: 가족 전체 결합 대상 월정액 합계, 원(KRW). 요금약정 할인 후·선택약정 할인 전 기준.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "mobilePlanFees": {
                "description": "LGU_PLUS 필수: 각 결합 회선의 월 요금제 금액 배열, 원(KRW), 1~10개. 다른 통신사는 사용하지 않음.",
                "items": {
                  "maximum": 100000000,
                  "minimum": 0,
                  "type": "number"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["carrier", "internetTier"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": {},
                "description": "계산: inputBasis, engine, result, 선택 notice. 근거: engines, carriers, limitations. 검색: dataAsOf, resultCount, items 및 적용 필터. 개별 자료의 관측일·유효기간도 확인하세요.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "generatedAt": {
                "description": "응답 생성 ISO 시각. 원본 자료의 갱신 시각과 다릅니다.",
                "type": "string"
              },
              "mcpServerVersion": {
                "description": "HOTKER MCP 서버 버전.",
                "type": "string"
              },
              "ok": {
                "const": true,
                "description": "성공 여부. 실행 실패는 isError=true와 공개 오류 코드로 별도 반환합니다.",
                "type": "boolean"
              },
              "schemaVersion": {
                "description": "공개 응답 데이터 계약 버전.",
                "type": "string"
              },
              "status": {
                "description": "calculated=입력 기준 계산, estimated=참고 추정, incomplete=정보 부족, reference=근거, verified=검색 공개 기준 통과, partner_presented=판매점 제시 조건 포함(통신사 확인 전). 실제 계약 보증 아님.",
                "enum": ["calculated", "estimated", "incomplete", "reference", "verified", "partner_presented"],
                "type": "string"
              },
              "tool": {
                "description": "호출한 도구 이름.",
                "type": "string"
              }
            },
            "required": ["data", "generatedAt", "mcpServerVersion", "ok", "schemaVersion", "status", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7576e79673511a2872cf09a5ecd26aa0b769ee27f98bdcd7b7addbf2632ddb8c"
        },
        {
          "name": "calculate_contract_penalty",
          "title": "HOTKER 약정 반환금 계산",
          "description": "SKT·KT·LG U+ 약정 반환금의 기본 참고값을 계산합니다. elapsedMonths 또는 elapsedDays 중 정확히 하나를 제공하세요. selective_contract는 accumulatedDiscount와 12/24개월 약정, public_subsidy는 receivedSubsidy와 24개월 약정이 필요합니다. data.result.penalty는 원(KRW)이며 항상 estimated입니다. LG U+ 지원금은 전환지원금 기본 산식 참고값으로 가입 프로그램별 최종 청구액과 다를 수 있습니다. 무인증·읽기 전용이며 통신사 개인계정 조회·해지는 하지 않습니다. 근거는 get_calculation_evidence를 사용하세요. 잘못된 조합은 오류를 반환하며 입력을 추측해 재호출하지 마세요.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accumulatedDiscount": {
                "description": "selective_contract 필수: 지금까지 받은 누적 요금 할인액, 원(KRW). 월 할인액이 아님.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "carrier": {
                "description": "계산용 통신사 코드. LG U+는 LGU_PLUS. 개인 계정이나 가입 자격을 조회하지 않습니다.",
                "enum": ["SKT", "KT", "LGU_PLUS"],
                "type": "string"
              },
              "contractMonths": {
                "anyOf": [
                  {
                    "const": 12,
                    "type": "number"
                  },
                  {
                    "const": 24,
                    "type": "number"
                  }
                ],
                "default": 24,
                "description": "약정 개월 수. 기본 24. public_subsidy는 24만 지원."
              },
              "elapsedDays": {
                "description": "경과 일수. elapsedMonths와 둘 중 하나만 입력. 12개월 약정 최대 365일, 24개월 최대 730일.",
                "maximum": 730,
                "minimum": 0,
                "type": "integer"
              },
              "elapsedMonths": {
                "description": "경과 개월 수. elapsedDays와 둘 중 하나만 입력하며 약정 기간 이하여야 함.",
                "maximum": 24,
                "minimum": 0,
                "type": "number"
              },
              "penaltyType": {
                "description": "selective_contract=선택약정 할인반환금, public_subsidy=지원금 반환 참고액.",
                "enum": ["selective_contract", "public_subsidy"],
                "type": "string"
              },
              "receivedSubsidy": {
                "description": "public_subsidy 필수: 실제 수령 지원금 총액, 원(KRW). 단말 원금·판매가가 아님.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["carrier", "penaltyType"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": {},
                "description": "계산: inputBasis, engine, result, 선택 notice. 근거: engines, carriers, limitations. 검색: dataAsOf, resultCount, items 및 적용 필터. 개별 자료의 관측일·유효기간도 확인하세요.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "generatedAt": {
                "description": "응답 생성 ISO 시각. 원본 자료의 갱신 시각과 다릅니다.",
                "type": "string"
              },
              "mcpServerVersion": {
                "description": "HOTKER MCP 서버 버전.",
                "type": "string"
              },
              "ok": {
                "const": true,
                "description": "성공 여부. 실행 실패는 isError=true와 공개 오류 코드로 별도 반환합니다.",
                "type": "boolean"
              },
              "schemaVersion": {
                "description": "공개 응답 데이터 계약 버전.",
                "type": "string"
              },
              "status": {
                "description": "calculated=입력 기준 계산, estimated=참고 추정, incomplete=정보 부족, reference=근거, verified=검색 공개 기준 통과, partner_presented=판매점 제시 조건 포함(통신사 확인 전). 실제 계약 보증 아님.",
                "enum": ["calculated", "estimated", "incomplete", "reference", "verified", "partner_presented"],
                "type": "string"
              },
              "tool": {
                "description": "호출한 도구 이름.",
                "type": "string"
              }
            },
            "required": ["data", "generatedAt", "mcpServerVersion", "ok", "schemaVersion", "status", "tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac3526fe7d2fad556dba62080549f1cee2f9971b983682571f8543bda6a57d28"
        },
        {
          "name": "calculate_mobile_tco",
          "title": "HOTKER 휴대폰 총비용 계산",
          "description": "사용자가 확인한 견적의 12~36개월 총비용을 계산합니다. 단말 전체 판매가, 기간별 요금, 의무 부가서비스·비용, 할부이자에서 확정 할인을 차감하며 현금 사은품은 별도 표시합니다. 반환값 data.result의 expected_total_spend, completeness, warnings를 함께 읽고 incomplete/estimated를 확정 견적으로 표현하지 마세요. 무인증·읽기 전용이며 구매나 계정 조회를 하지 않습니다. 실제 판매조건 검색은 search_verified_mobile_deals, 산식 출처는 get_calculation_evidence를 사용하세요. 미확인 입력을 추측하거나 0으로 채우지 마세요.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activationDate": {
                "description": "개통 기준일 YYYY-MM-DD. 날짜형 유지조건 계산에 필요. 미확인이면 생략하고 경고 확인.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "deal": {
                "additionalProperties": false,
                "description": "사용자가 확인한 판매 조건. 필수 device_sale_price는 단말 전체 금액이며 월 할부금이 아닙니다.",
                "properties": {
                  "addons": {
                    "description": "부가서비스 최대 20개. 없음이 확인된 경우 빈 배열. 미확인 비용을 없다고 단정하지 마세요.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "addon_name": {
                          "description": "부가서비스 이름. 개인정보 제외.",
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        },
                        "cancel_allowed_at": {
                          "description": "해지 가능일 YYYY-MM-DD. date 유형이면 activationDate도 필요.",
                          "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                          "type": "string"
                        },
                        "hold_days": {
                          "description": "hold_type=days일 때 필요한 유지 일수. 해당 유형에서는 1 이상.",
                          "maximum": 3660,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "hold_months": {
                          "description": "months 또는 m_plus일 때 필요한 유지 개월 수. 해당 유형에서는 1 이상.",
                          "maximum": 120,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "hold_type": {
                          "description": "유지조건: none=없음, days=일수, months=개월, m_plus=개통월 이후 N개월, date=변경 가능일, unknown=미확인. 해당 기간 필드를 함께 제공.",
                          "enum": ["none", "days", "months", "m_plus", "date", "unknown"],
                          "type": "string"
                        },
                        "mandatory": {
                          "description": "false이면 의무비용에서 제외. 생략 시 의무 서비스로 취급.",
                          "type": "boolean"
                        },
                        "monthly_price": {
                          "description": "부가서비스 월 비용, 원(KRW). 미확인을 0으로 넣지 마세요.",
                          "maximum": 100000000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "source_text": {
                          "description": "유지조건 원문. 개인정보를 제거한 확인 자료만 입력.",
                          "maxLength": 500,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "bundle_required": {
                    "description": "결합 조건 존재 여부. 실제 승인·할인 자격을 보장하지 않음.",
                    "type": "boolean"
                  },
                  "card_required": {
                    "description": "카드 조건 존재 여부. true가 할인 자격 충족을 뜻하지 않음.",
                    "type": "boolean"
                  },
                  "cash_gift_amount": {
                    "description": "현금 사은품 총액, 원(KRW). 기본 총비용에서 차감하지 않고 별도 표시.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "cash_gift_payout_policy": {
                    "description": "현금 사은품 지급 조건: 익월 말 또는 7일 이내. 지급 완료 보증 아님.",
                    "enum": ["next_month_end", "within_7_days"],
                    "type": "string"
                  },
                  "change_allowed_at": {
                    "description": "요금제 변경 가능일 YYYY-MM-DD. date 유형이면 activationDate도 제공.",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "confirmed_discounts": {
                    "description": "중복되지 않는 확정 할인 총액 목록. 숫자는 확정으로 간주하며 객체는 guaranteed=true, conditional!=true일 때만 차감.",
                    "items": {
                      "anyOf": [
                        {
                          "description": "확정 총액, 원(KRW). 할인 배열의 숫자는 확정 할인으로 차감되므로 미확정 혜택은 숫자로 넣지 마세요.",
                          "maximum": 1000000000,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "description": "항목 전체 금액, 원(KRW). 월 금액이 아님.",
                              "maximum": 1000000000,
                              "minimum": 0,
                              "type": "number"
                            },
                            "conditional": {
                              "description": "조건부 할인이면 true. guaranteed=true여도 차감하지 않음.",
                              "type": "boolean"
                            },
                            "guaranteed": {
                              "description": "할인이 확정됐으면 true. 객체형 할인은 true일 때만 차감 후보.",
                              "type": "boolean"
                            },
                            "mandatory": {
                              "description": "의무비용 배열에서 false이면 제외. 할인 배열에는 적용하지 않음.",
                              "type": "boolean"
                            }
                          },
                          "required": ["amount"],
                          "type": "object"
                        }
                      ]
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "deal_id": {
                    "description": "사용자 견적 식별자. 고객 이름·전화번호·계약번호 금지.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "device_sale_price": {
                    "description": "지원금 반영 후 단말 전체 판매가/원금, 원(KRW). 월 할부금이 아님. 지원금을 다시 차감하지 마세요.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "initial_plan_monthly_fee": {
                    "description": "초기 요금제 월정액, 원(KRW). 선택약정 할인 적용 전 금액.",
                    "maximum": 100000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "installment_interest": {
                    "description": "amount이면 전체 할부이자 원(KRW), apr이면 연이율 소수(5.9%=0.059, 0~1). 월 납입액이 아님.",
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "installment_interest_type": {
                    "description": "이자 방식. none=무이자 확인, amount=전체 이자 확정액, apr=연이율 추정. apr이면 installment_months도 필요.",
                    "enum": ["none", "amount", "apr"],
                    "type": "string"
                  },
                  "installment_months": {
                    "description": "할부 개월 수. 비교 기간 horizonMonths와 별개.",
                    "maximum": 60,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "mandatory_costs": {
                    "description": "추가 의무비용 전체 금액 목록. 월 비용은 해당 기간 총액으로 제공. 최대 20개.",
                    "items": {
                      "anyOf": [
