                "type": "string"
              },
              "tx": {
                "description": "payment transaction hash (PAYMENT-RESPONSE header transaction, or your wallet)",
                "type": "string"
              }
            },
            "required": ["network", "outcome", "service_url", "tx"],
            "type": "object"
