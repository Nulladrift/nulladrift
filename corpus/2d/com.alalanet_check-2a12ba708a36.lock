        {
          "name": "report_purchase",
          "title": "Report what you got after paying",
          "description": "After you paid an x402 endpoint on Base or Solana: report the outcome (delivered, partial, wrong_content, not_delivered) with the payment tx (the transaction field of the PAYMENT-RESPONSE header). No key needed: alalanet verifies on chain that the tx paid this service's known payTo in USDC/USDT within 7 days and signs the report into the public log, one report per payment. Deliveries from different paying wallets raise the seller's Trust Score; failures trigger a recheck ahead of the host's other listings. This is how agents learn which sellers deliver.",
