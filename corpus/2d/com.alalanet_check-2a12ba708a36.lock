        {
          "name": "payment_status",
          "title": "Did my x402 payment settle? May I pay again?",
          "description": "Tells whether an x402 payment settled, for use after a timeout, a 5xx or any unclear answer to a paid request and before a new payment is signed. Pass network and the settlement tx, or (EVM exact) from + nonce + valid_before of the signed authorization, or (Solana exact) from + the recentBlockhash of the signed transaction; the signature itself is not needed. safe_to_sign_new is true only when a new payment cannot pay twice. alalanet reads the chain and answers state (settled | pending | not_settled | expired_unsettled | failed) and retry: do_not_pay_again, resend_same (same authorization can settle only once), new_payment_ok, or wait. Prevents paying twice. Read-only (nothing is signed or logged); the error chain_unavailable means the payment networks did not answer, and the same question can be asked again after 15 s.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "token contract; default USDC on Base",
                "type": "string"
              },
              "blockhash": {
                "description": "Solana exact payments without a tx: the recentBlockhash of the transaction you signed (base58); with from it identifies your payment, since the facilitator's fee-payer signature (the transaction id) is unknown to you before settlement",
                "type": "string"
              },
              "from": {
                "description": "payments without a tx: EVM exact: payload.authorization.from of the PAYMENT-SIGNATURE you sent (your wallet address); Solana exact: your wallet address (the signer of the transaction besides the facilitator's fee payer)",
                "type": "string"
              },
              "network": {
                "description": "Base: eip155:8453 or base; Solana: solana or solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp",
                "type": "string"
              },
              "nonce": {
                "description": "EVM exact payments without a tx: payload.authorization.nonce of the PAYMENT-SIGNATURE you sent (0x + 64 hex); never send the signature itself",
                "type": "string"
              },
              "tx": {
                "description": "settlement transaction hash from the transaction field of the PAYMENT-RESPONSE header (0x + 64 hex on Base, base58 signature on Solana), if you got one",
                "type": "string"
              },
              "valid_before": {
                "description": "payload.authorization.validBefore (unix seconds): lets alalanet tell an expired, unused authorization (safe to pay anew) from one that may still settle",
                "type": "integer"
              }
            },
            "required": ["network"],
            "type": "object"
          },
