        {
          "name": "preflight_payment",
          "title": "Decide before paying an x402 endpoint",
          "description": "Decision for one x402 payment, right before it is signed. Pass the endpoint url and the 402 it returned (PAYMENT-REQUIRED header value or JSON body), optionally max_usd and client (your x402 library and version: known payment flaws come back in client_advisories, not logged). Each payment option gets allow / hold / block with reasons. block: pay_to_unknown, pay_to_zero_address, pay_to_burn_address, pay_to_is_asset, pay_to_sanctioned, pay_to_frozen_by_issuer, service_not_working, over_budget, quote_expired (the option's own expiry passed); hold: pay_to_differs_from_listing, pay_to_never_seen, price_above_listing, price_above_observed, network_not_listed, asset_not_stablecoin, high_price ($5 or more), unknown_service, not_checked_yet, not_rated_yet, low_trust_score, listing_removed (its catalogue no longer lists it); info: pay_to_as_observed, pay_to_platform_wallet, amount_is_ceiling (scheme upto), frozen_status_unknown, testnet. The decision is bound to the payment hash, valid for up to 5 minutes (expires_at), signed and logged, except for an unlisted url that looks like it carries a key or token (then it is made for you only, with no attestation). allow: no problem found; hold: the user should confirm; block: do not pay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "description": "optional: your x402 client library and version, e.g. @x402/fetch@2.22.1 or pypi:x402@2.19.0; alalanet warns about versions with known payment flaws (not logged)",
