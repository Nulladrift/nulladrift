        {
          "name": "check_service",
          "title": "Check a service before paying or connecting",
          "description": "Call before the first payment to an x402 endpoint, before connecting to an MCP server, and whenever a call to it fails. Give url (any https URL, listed or not: unknown ones are probed now and detected as x402 or MCP) or id from find_service. Returns alive, advice (ok / ok_requires_auth: working as listed; ok_terms_not_checked, unverified_yet: not fully checked yet; caution_*: confirm with the user — pay_to_changed, network_changed, price_higher_than_listed, high_price, tools_changed, suspicious_tool_description, buyers_report_failures; avoid_*: a blocking problem — down, not_working_as_listed, sanctioned_pay_to, pay_to_frozen), trust_score (0-100, open formula at /trust) with flags, checked_at and last_alive_at (when it last answered as listed), observed price, network and pay_to against the listing, uptime 24h/7d/30d, host_listings, pay_to_shared_by_hosts, verified purchases, alalanet's own test purchase, for MCP the tool-set diff (tools_diff, tool_description_flags), and on caution_* or avoid_* up to 3 working alternatives on other hosts. Answers from the last stored check (checked_at says when; 100 a day free); live=true probes now and adds a signed, logged attestation you can keep as evidence (5 a day free). Read-only for the caller; an unknown URL joins the public catalogue. preflight_payment decides one specific 402.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "service id from find_service results; give either id or url",
                "type": "string"
              },
              "live": {
                "description": "true: probe now and return a signed, logged receipt; false (default): the last stored check",
                "type": "boolean"
              },
              "url": {
                "description": "https URL of the x402 endpoint or MCP server, listed or not (private, loopback, link-local and cloud-metadata addresses are refused by an SSRF guard)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "type": ["null", "array"]
              },
              "attestation": {
                "type": ["null", "object"]
              },
              "note": {
                "type": "string"
              },
              "service": {
                "type": "object"
              }
            },
            "required": ["service"],
            "type": "object"
          },
