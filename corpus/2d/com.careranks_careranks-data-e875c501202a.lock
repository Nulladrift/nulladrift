{
  "lockfileVersion": 2,
  "subjects": {
    "com.careranks/careranks-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://careranks.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "careranks-data",
        "title": "CareRanks Data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only US healthcare facility data from CareRanks (careranks.com): CMS quality ratings for 41K+ hospitals, nursing homes, home-health agencies and dialysis centers, payer-negotiated hospital prices by DRG, and clinician rosters. Typical flow: search_facilities → get_facility / get_facility_profile → get_hospital_prices / get_hospital_clinicians (hospitals only). Facility ids are {type, id} pairs; hospital ids are CMS CCNs (opaque 6-char strings, letters possible). Data is public-domain federal data; cite careranks.com.",
      "tools": [
        {
          "name": "get_facility",
          "title": "Get facility summary + capability URLs",
          "description": "Look up one facility by {type, id}. Returns the index record plus canonical URLs and which detail tools work for it. Hospital ids are CMS CCNs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Facility id (hospitals: 6-char CCN; systems: slug).",
                "type": "string"
              },
              "type": {
                "enum": ["hospital", "nursing-home", "home-health", "dialysis", "system"],
                "type": "string"
              }
            },
            "required": ["id", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59dfb221845793eb4f29a1cc8ff5fc8eef6178270eac8ba806828063e14baa39"
        },
        {
          "name": "get_facility_profile",
          "title": "Get full facility profile content",
          "description": "Structured summary for any facility; for hospitals the full profile markdown (quality measures, ratings context) is returned AS THE TEXT CONTENT BLOCK, with metadata (truncation flag, full URL) in structuredContent. max_chars bounds the markdown body.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "max_chars": {
                "description": "Markdown budget (default 15000).",
                "maximum": 40000,
                "minimum": 500,
                "type": "integer"
              },
              "type": {
                "enum": ["hospital", "nursing-home", "home-health", "dialysis", "system"],
                "type": "string"
              }
            },
            "required": ["id", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0141a32e97f4d27f5bf1397ea2f31980bb26c65e223fc97137c44193c4878dcd"
        },
        {
          "name": "get_hospital_clinicians",
          "title": "Get hospital clinician roster",
          "description": "Clinicians affiliated with a hospital (CMS data): name, specialty, Medicare procedure volumes, Open Payments totals. Available for ~4,570 hospitals (clinicians_tool_available flag). Filter matches name or specialty.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ccn": {
                "description": "Hospital CCN (6 characters).",
                "type": "string"
              },
              "filter": {
                "description": "Optional case-insensitive substring on name or specialty.",
                "type": "string"
              },
              "limit": {
                "description": "Max clinicians (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ccn"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3078bb81af6080416b57191afdab1d5e4e729dffebb1b24b3dab102cc1132746"
        },
        {
          "name": "get_hospital_prices",
          "title": "Get payer-negotiated hospital prices",
          "description": "Payer-negotiated rates parsed from a hospital's federally required machine-readable file. Without `drg`: a per-DRG summary (payer count, min/median/max) across every DRG in the file. With `drg` (digits; zero-padded automatically): the individual payer-by-payer rates for that DRG. Available for ~2,060 hospitals (prices_tool_available flag).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ccn": {
                "description": "Hospital CCN (6 characters).",
                "type": "string"
              },
              "drg": {
                "description": "Optional MS-DRG code, e.g. \"291\" or \"047\".",
                "type": "string"
              },
              "limit": {
                "description": "Max DRG summary rows (default 100). Ignored when drg is given.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ccn"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:19ca2a60f73f30a15140b1a4d743e971a8e592b494afb97f61ecb1f5f29f8de2"
        },
        {
          "name": "search_facilities",
          "title": "Search US healthcare facilities",
          "description": "Search 41K+ US facilities (hospitals, nursing homes, home-health agencies, dialysis centers, health systems) by name and/or city, optionally filtered by state and type. Returns ids usable with the other tools plus capability flags.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or city text to match (case-insensitive substring).",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state/territory code filter, e.g. \"CT\".",
                "type": "string"
              },
              "type": {
                "description": "Facility type filter.",
                "enum": ["hospital", "nursing-home", "home-health", "dialysis", "system"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4f85e1238ca44c4418dfd9152bb86609f47650eeba8d218b979db05d6b23b40"
        }
      ],
      "digest": "sha256:8c9ab2bf4660b5b6bfc2276641213aa9719b49517857b3a6ac8dbe035f8b48d0"
    }
  }
}
