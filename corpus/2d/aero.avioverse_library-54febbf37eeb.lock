          },
          "digest": "sha256:95338fea08b473cb2f9a34ad245013c78206819fdf17199416a7f081c6e05f17"
        }
      ],
      "digest": "sha256:f4ef085a92145077542162fd51d833e135b673daec7b2e3ceda37a0d4b13f944"
    }
  }
