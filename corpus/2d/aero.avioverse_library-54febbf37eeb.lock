{
  "lockfileVersion": 2,
  "subjects": {
    "aero.avioverse/library": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://avioverse.aero/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aero.avioverse/library",
        "title": "Avioverse EASA library",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Avioverse publishes the EASA Easy Access Rules rule by rule, with each rule's AMC and GM, the official reference and the EAR revision date, plus EASA definitions and implementation guides. Use `get_rule` when you know a rule reference (for example 145.A.30(e) or ORO.GEN.200), `search` to find rules, definitions and guides by words, `lookup_term` for a definition, and `fetch` to read a page found by `search`. Cite the page URL returned with each result; for binding wording cite the regulation reference shown in the text. The text is a convenience copy of the EASA Easy Access Rules, not the official publication, and is informational only: decisions, approvals and sign-off stay with accountable people.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page",
          "description": "Return the full text of one library page as Markdown. `id` is the `id` (site path) or `url` of a result from `search`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The id or url of a search result",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:78dac1f45e706c1e7429cd950be03f421555076f96b3b808cee117bf8a51cefb"
        },
        {
          "name": "get_rule",
          "title": "Get an EASA rule by reference",
          "description": "Return an EASA rule by its reference (for example 145.A.30(e), CAMO.A.305, ORO.GEN.200, FCL.010) with its text, AMC and GM, the regulation, the EAR revision date and the page URL. A rule published point by point lists its points to request next. If several regulations use the reference (such as Article 2), the matches are listed: pass `regulation` to choose one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "reference": {
                "description": "Rule reference, for example 145.A.30(e)",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "regulation": {
                "description": "Regulation slug from list_regulations, only needed when a reference is shared",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:03c04690118e7aa572e8879d10902938df366cd652ebff91bbdf945453460c3f"
        },
        {
          "name": "list_regulations",
          "title": "List the regulations",
          "description": "List the EASA regulations in the library with their official reference, the EAR revision date the text reproduces, and the `regulation` value to pass to `get_rule`.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cf6f7430e1c87b52b80fd4f2aa6c1c0b90767c4f1f4f255bf7d500fe8e79b531"
        },
        {
          "name": "lookup_term",
          "title": "Look up a definition",
          "description": "Return how EASA defines a term, quoted verbatim with the regulation and article it comes from, plus the entry from the general aviation glossary when there is one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "term": {
                "description": "The term to define, for example: error management",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c36955e46fe0bd84291d3388f4edeb7206c598661a8bf3c4a7c4ade9e0bfb2c8"
        },
        {
          "name": "search",
          "title": "Search the library",
          "description": "Search EASA rules, EASA definitions, implementation guides, articles and the Metis manual by reference or by words. Returns matching pages with their URLs. A rule reference such as 145.A.30 ranks exact matches first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Words to look for, or a rule reference such as 145.A.30",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
