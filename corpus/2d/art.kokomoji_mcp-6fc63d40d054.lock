          "name": "docs_search",
          "title": "Search the Kokomoji docs",
          "description": "Free. Searches the Kokomoji docs, the agent manual and llms.txt by words and returns the best sections with links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
