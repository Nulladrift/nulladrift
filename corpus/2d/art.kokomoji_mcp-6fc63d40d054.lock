          "title": "Registered Kokomoji agents",
          "description": "Free. Every ERC-8004 agent bound to a Kokomoji (from https://kokomoji.art/agent/register/index.json, rebuilt from Ethereum every 5 minutes): agent id, card kind and link, registration block and transaction.",
