        {
          "name": "job_check",
          "title": "Check a job input (free dry run)",
          "description": "Free. Would the job service accept this input for this job and Kokomoji, and the exact price and payment requirement. Nothing is charged and no job starts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "input": {
                "additionalProperties": {},
                "description": "The job's input object, exactly as its docs and jobs_list's example show.",
                "propertyNames": {
                  "maxLength": 64,
                  "type": "string"
                },
                "type": "object"
              },
              "job": {
                "description": "A job id from jobs_list, like send-check.",
                "pattern": "^[a-z][a-z0-9-]{1,40}$",
                "type": "string"
              },
              "kokomoji": {
                "description": "A Kokomoji number, 1 to 2372.",
                "maximum": 2372,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["input", "job", "kokomoji"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8a6a305de9ae4684ddc125f5a3823a61e7c07cdcf604e22e1d2a2491128361dc"
        },
        {
          "name": "job_result",
          "title": "Fetch a job result",
          "description": "Free. A delivered job result, by its job id (32 hex) or by the X-Job-Key it was paid with.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "jobId": {
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              },
              "jobKey": {
                "pattern": "^[A-Za-z0-9_-]{22,128}$",
