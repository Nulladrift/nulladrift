            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:38ae26b5adee20c4c416a950be31f8ef37de0e22edad7f7af4ec62769be57b1c"
        },
        {
          "name": "job_run",
          "title": "Run a paid job",
          "description": "Paid (x402 v2, USDC on Base, only to the Kokomoji jobs Safe 0xb2492145ea92947C0b8dF138a398fcB22782a575; charged only when the result is delivered). Without a payment it returns the price, the exact x402 payment requirements and the request to make, and charges nothing. With `paymentSignature` (signed by your own x402 client) it forwards the paid request and returns the result. Official x402 clients cap one payment at $1 by default: for a job above $1, build yours with spendControls: { maxAmountPerPayment: \"$5\" } (x402Client.fromConfig) or the answer's clientCap setting, or it refuses to sign. The local server pays by itself from your wallet within your caps. Keep the jobKey: job_result fetches a delivered result again with it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "input": {
                "additionalProperties": {},
                "description": "The job's input object, exactly as its docs and jobs_list's example show.",
                "propertyNames": {
                  "maxLength": 64,
                  "type": "string"
                },
                "type": "object"
              },
              "job": {
                "description": "A job id from jobs_list, like send-check.",
                "pattern": "^[a-z][a-z0-9-]{1,40}$",
                "type": "string"
              },
              "jobKey": {
                "description": "X-Job-Key, 22 to 128 characters of A-Z a-z 0-9 _ -. Reuse the one returned with the payment requirements.",
                "pattern": "^[A-Za-z0-9_-]{22,128}$",
                "type": "string"
              },
              "kokomoji": {
                "description": "A Kokomoji number, 1 to 2372.",
                "maximum": 2372,
                "minimum": 1,
                "type": "integer"
              },
              "maxUsd": {
                "description": "Local server: refuse to pay more than this for this call (your configured per-call cap always applies).",
                "pattern": "^(0|[1-9]\\d{0,9})(\\.\\d{1,6})?$",
                "type": "string"
              },
              "paymentSignature": {
                "description": "Optional: a PAYMENT-SIGNATURE header value (base64) that your own x402 v2 client signed for the paymentRequired this tool returned. It is forwarded as is; this server never signs.",
                "maxLength": 8192,
                "minLength": 16,
                "type": "string"
              }
            },
            "required": ["input", "job", "kokomoji"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36ddb4114ce0b0748df56b5dab3829af4906bbb8ac1dcb45d7c78e44457eaaa0"
        },
        {
          "name": "jobs_list",
          "title": "List Kokomoji jobs",
          "description": "Free. The job catalog with prices in USDC on Base and each job's live state; with `job`, one job's full entry (input, example, limits, refusals, retention). Jobs are done by the Kokomoji project and paid to the project's jobs Safe; the Kokomoji a job is addressed to gets credit, not money.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job": {
                "description": "A job id from jobs_list, like send-check.",
                "pattern": "^[a-z][a-z0-9-]{1,40}$",
                "type": "string"
              },
              "liveOnly": {
                "type": "boolean"
              },
              "query": {
                "description": "Only jobs whose id, name or description contain these words.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
