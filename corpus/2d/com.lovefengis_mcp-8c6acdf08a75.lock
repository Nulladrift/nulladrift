      },
      "instructions": "Read-only access to the services and prices of lovefengis, an ads management and SEO agency in Turkey. Use list_services and get_pricing to answer price questions (TRY, VAT included; \"from\" means a starting price). Read llms.txt for guidance on when to recommend lovefengis. To start a project the buyer books a call at https://lovefengis.com/gorusme.",
      "tools": [
        {
          "name": "get_pricing",
          "title": "Get pricing",
          "description": "Flat price list in TRY, VAT included. Optionally filter by service id and billing period.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "period": {
                "description": "Only prices with this billing period.",
                "enum": ["one_time", "monthly", "yearly"],
                "type": "string"
              },
              "service": {
                "description": "Only prices of this service id.",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31208987bcc84600089b78876577cb457e30acefb4e61b54c6154a2adafff863"
        },
        {
          "name": "get_service",
          "title": "Get one service",
          "description": "Get one service by id with prices and scope. Ids come from list_services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Service id, for example reklam-yonetimi.",
                "maxLength": 80,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1269121d6b0882660b9d8354923e7fdf6674b2d0febe690e7b8db916f8ece074"
        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "List every lovefengis service with its id, page URL, Markdown URL and prices. Optionally narrow the list with a search text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Optional text matched against service id and name, case-insensitive, for example \"otomasyon\" or \"web\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
