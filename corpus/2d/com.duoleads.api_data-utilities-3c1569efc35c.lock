      "serverInfo": {
        "name": "Duo Data Utilities",
        "title": "Duo Data Utilities: IBAN, VAT, ISIN Validation API",
        "version": "1.1.0",
        "description": "Small exact data utilities for agents: IBAN, VAT and tax ID, ISIN, barcode, timezone, geo, hashing, chain and number tools.",
        "websiteUrl": "https://api.duoleads.com",
        "icons": [
          {
            "src": "https://api.duoleads.com/logo.png",
            "mimeType": "image/png",
            "sizes": ["256x256"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Small exact data utilities for agents: IBAN, VAT and tax ID, ISIN, barcode, timezone, geo, hashing, chain and number tools. tools/list is free; each tools/call costs $0.05 in USDC on Base, paid with x402 v2. Call a tool without payment to get its PaymentRequired, then repeat the call with the signed payment in _meta[\"x402/payment\"] (any x402 MCP client such as @x402/mcp does this); bad arguments are answered free.",
      "tools": [
        {
          "name": "airport_lookup",
          "title": "Airport lookup by IATA or ICAO code: name, coordinates, elevation, time zone; nearest airports",
          "description": "Airport lookup by IATA or ICAO code: get the airport's name, city, country, ISO 3166-2 region code, WGS-84 coordinates, elevation and IANA time zone, or find the nearest airports to a coordinate within a radius. Covers every airport worldwide that holds a three-letter IATA code and scheduled service. Returns the code type that matched and the distance in kilometres for proximity results. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "3-letter IATA or 4-letter ICAO code, case-insensitive. Accepted: a 3-letter IATA or 4-letter ICAO code.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 filter. Accepted: an ISO 3166-1 alpha-2 code.",
                "type": "string"
              },
              "limit": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Maximum results 1-25, default 5. Only with near. Accepted: integer 1-25."
              },
              "near": {
                "description": "lat,lon to search around. Accepted: lat,lon.",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius in km, 1-1000, default 100. Only with near. Accepted: number 1-1000.",
                "type": ["number", "string"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66f856e519050377df7146d8b43e89718da6d407109a94195b46af62a1ab05bb"
        },
        {
          "name": "base_convert",
          "title": "Base converter: integers between number bases 2 to 36 (hex, binary, octal)",
          "description": "Base converter: convert an integer between any two numeric bases from 2 to 36 (hex, binary, octal and more), with arbitrary precision so values far beyond 2^53 are exact. Accepts an optional sign and common prefixes (0x, 0b, 0o), validates every digit against the source base, and returns the value in the target base, in decimal, and as its bit length and digit count. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case": {
                "description": "Digit case for bases above 10: lower (default) or upper. Accepted: lower, upper.",
                "enum": ["lower", "upper"],
                "type": "string"
              },
              "from": {
                "description": "Source base 2-36, or auto (default) to read a 0x/0b/0o prefix. Accepted: integer 2-36, or 'auto'.",
                "type": "string"
              },
              "prefix": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["true", "false"],
                    "type": "string"
                  }
                ],
                "description": "Emit 0x/0b/0o where conventional. Default false. Accepted: true or false."
              },
              "to": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Target base 2-36, default 10. Accepted: integer 2-36."
              },
              "value": {
                "description": "Integer to convert; optional sign and 0x/0b/0o prefix. Accepted: at most 1024 characters.",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ade81eb8624c348fcd98c04100ca72d0aefbfcc899d25a79a9a3e05e34f3766b"
        },
        {
          "name": "business_days_calculate",
          "title": "Business days calculator: add or count working days with your weekend mask and holiday list",
          "description": "Business days calculator with a caller-supplied calendar: add or subtract N working days from a date, or count the working days between two dates. The weekend is a weekday mask (Friday-Saturday and Sunday-only weeks work) and holidays are an explicit date list, so nothing depends on a stale holiday table. Returns the result date, the day count and the skipped dates with reasons. The skipped list is capped at 1,000 entries (skipped_truncated flags it); skipped_total is always exact. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Business days to add, -3650 to 3650. Required when op=add. Accepted: integer between -3650 and 3650."
              },
              "from": {
                "description": "Start date, YYYY-MM-DD. Accepted: a calendar date as YYYY-MM-DD.",
                "type": "string"
              },
              "holidays": {
                "description": "Comma-separated YYYY-MM-DD holiday dates. Accepted: comma-separated YYYY-MM-DD dates, at most 2048 characters.",
                "type": "string"
              },
              "inclusive": {
                "description": "For op=count: start (default, half-open [from, to)), both or neither. Accepted: start, both, neither.",
                "enum": ["start", "both", "neither"],
                "type": "string"
              },
              "op": {
                "description": "add (default) N business days to from, or count business days between from and to. Accepted: add, count.",
                "enum": ["add", "count"],
                "type": "string"
              },
              "to": {
                "description": "End date YYYY-MM-DD, may precede from. Required when op=count. Accepted: a calendar date as YYYY-MM-DD.",
                "type": "string"
              },
              "weekend": {
                "description": "Comma-separated weekday names or ISO numbers. Default sat,sun. Empty string = no weekend. Accepted: comma-separated weekday names (mon..sun) or ISO numbers 1-7.",
                "type": "string"
              }
            },
            "required": ["from"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8dd590ab6ba95c7589804e2d5dcda4d37d2a80ce4542e87ac5df3d6ec07f2edd"
        },
        {
          "name": "calendar_convert",
          "title": "Calendar converter: Gregorian to Hijri, Hebrew, Japanese era, Persian and more, plus Easter date",
          "description": "Calendar converter: convert a Gregorian date to other calendar systems: Islamic (both the tabular civil calendar and the Umm al-Qura variant), Hebrew, Japanese imperial era, Republic of China, Buddhist and Persian. Also computes Easter Sunday for a year in both the Gregorian and Julian reckonings. Uses the calendar support built into the runtime, with the algorithm named in every response. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Gregorian date YYYY-MM-DD. Required when op=convert. Accepted: a calendar date as YYYY-MM-DD.",
                "type": "string"
              },
              "op": {
                "description": "convert (default) a Gregorian date, or easter for a year. Accepted: convert, easter.",
                "enum": ["convert", "easter"],
                "type": "string"
              },
              "rite": {
                "description": "Easter reckoning: western (default) or eastern. Accepted: western, eastern.",
                "enum": ["western", "eastern"],
                "type": "string"
              },
              "to": {
                "description": "Comma-separated calendar ids: islamic, islamic-umalqura, hebrew, japanese, roc, buddhist, persian. Default all. Accepted: islamic, islamic-umalqura, hebrew, japanese, roc, buddhist, persian.",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Year for op=easter, 326-9999. Accepted: integer 326-9999."
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afec36bff178b9bf424dafdd82d5529fbd1d96c40e9be6c3a206c63ae194b767"
        },
        {
          "name": "country_lookup",
          "title": "Country lookup: ISO 3166 codes, currency, TLD, UN region and ISO 3166-2 subdivisions",
          "description": "Country lookup: find a country or territory by ISO 3166-1 alpha-2, alpha-3 or numeric code, or by name, and get the other codes, the official and common English names, the UN M49 region and sub-region, the currencies in use, the country-code TLD, and optionally the full ISO 3166-2 subdivision list with each subdivision's type. Also resolves an ISO 3166-2 subdivision code such as NL-NH directly. Names are matched case- and accent-insensitively. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "ISO 3166-1 alpha-2, alpha-3 or numeric code, or an ISO 3166-2 subdivision code such as NL-NH. Accepted: ISO 3166-1 alpha-2/alpha-3/numeric, or an ISO 3166-2 subdivision code.",
                "type": "string"
              },
              "include": {
                "description": "Comma-separated: subdivisions, m49, currency, tld. Default m49,currency,tld. Accepted: comma-separated subset of subdivisions, m49, currency, tld.",
                "type": "string"
              },
              "name": {
                "description": "Substring search on country names, case- and accent-insensitive. Accepted: at most 128 characters.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e79c196fd64458e59734b5a6357471a90d22095b6dc775b6fa919e5d6a7c633e"
        },
        {
          "name": "crypto_address_validate",
          "title": "Crypto address validator: detect the blockchain and verify the checksum (EVM, Bitcoin, Solana and more)",
          "description": "Crypto address validator: identify which blockchain an address belongs to and validate its encoding: EVM EIP-55 checksum, Bitcoin base58check and bech32/bech32m with witness version, Solana base58 and on-curve check, Cosmos bech32 with its HRP, Tron, XRP, Litecoin, Dogecoin, Cardano, Polkadot SS58 and Algorand. Returns every chain the address is valid for (ambiguous when several match), the checksummed form for EVM addresses, and the reason a check failed, including unrecognised_format. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Address to identify and validate. Accepted: at most 128 characters.",
                "type": "string"
              },
              "chain_id": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "EVM chain id; enables EIP-1191 chain-salted checksum validation. Accepted: a positive integer chain id."
              },
              "expect": {
                "description": "Restrict the check to one chain id. Accepted: evm, bitcoin, solana, cosmos, tron, xrp, cardano, polkadot, algorand, litecoin, dogecoin.",
                "enum": ["evm", "bitcoin", "solana", "cosmos", "tron", "xrp", "cardano", "polkadot", "algorand", "litecoin", "dogecoin"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a4fb5c6a26f6c445ad2b4041f8655bc9b214fe09a00e8e1b27c8f281c8450a8"
        },
        {
          "name": "currency_lookup",
          "title": "Currency lookup: ISO 4217 codes, names, minor units and cash rounding",
          "description": "Currency lookup by ISO 4217 alphabetic or numeric code: the official English name, minor-unit exponent, fund flag, the smallest cash denomination where it differs from the minor unit, the territories that use it, and historic codes on request. Returns the correct rounding increment for cash amounts, which is what a caller needs to render or settle a price. This route returns currency facts only and never an exchange rate. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "ISO 4217 alpha-3 or 3-digit numeric code. Accepted: a 3-letter alphabetic or 3-digit numeric ISO 4217 code.",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2; returns the currencies in use there. Accepted: an ISO 3166-1 alpha-2 code.",
                "type": "string"
              },
              "include": {
                "description": "Comma-separated: territories, historic. Default none. Accepted: comma-separated subset of territories, historic.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9e8cc4a99354d1adc7912c82e9daa0d6f0348cbfe4762f72a0af7f654817657c"
        },
        {
          "name": "cyrillic_transliterate",
          "title": "Cyrillic transliteration to Latin (ISO 9:1995, BGN/PCGN Russian)",
          "description": "Cyrillic transliteration to Latin using a named standard: ISO 9:1995 (one-to-one, with diacritics, covering the full standard: Russian, other Slavic, historic and non-Slavic Cyrillic letters) or BGN/PCGN, which is the Russian system only (Ukrainian, Serbian and other letters are passed through unmapped). Returns the transliteration, the source script, the standard, the mapped fraction and the unmapped characters. Other scripts are rejected with UNSUPPORTED_VALUE. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "case": {
                "description": "preserve (default), lower or upper. Accepted: preserve, lower, upper.",
                "enum": ["preserve", "lower", "upper"],
                "type": "string"
              },
              "from": {
                "description": "Source script name (cyrillic), or auto (default). Accepted: cyrillic or auto.",
                "type": "string"
              },
              "standard": {
                "description": "Romanisation standard: iso-9 (default; all ISO 9:1995 Cyrillic letters) or bgn-pcgn (BGN/PCGN Russian system, Russian letters only). Accepted: iso-9 or bgn-pcgn (Russian letters only) for cyrillic.",
                "type": "string"
              },
              "text": {
                "description": "Text to transliterate, at most 2048 characters. Accepted: at most 2048 characters.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
