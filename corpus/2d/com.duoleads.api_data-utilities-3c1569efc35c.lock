        {
          "name": "geo_distance",
          "title": "Distance calculator: geodesic distance, bearing and destination point on WGS-84",
          "description": "Distance calculator: distance and direction between WGS-84 coordinates: geodesic distance by Vincenty with a haversine fallback, initial and final bearing, the midpoint, and the destination point reached from a start point on a given bearing and distance. Also computes the cumulative length of a supplied coordinate path. Results in metres, kilometres, nautical miles and miles. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bearing": {
                "description": "Initial bearing in degrees for op=destination. Accepted: number 0-360.",
                "type": ["number", "string"]
              },
              "distance_m": {
                "description": "Distance in metres for op=destination, 0 to 1e9 (about 25 Earth circumferences); larger values are 400 INVALID_PARAM. Accepted: a number between 0 and 1e9 (metres).",
                "type": ["number", "string"]
              },
              "lat1": {
                "description": "Start latitude. Accepted: a number between -90 and 90.",
                "type": ["number", "string"]
              },
              "lat2": {
                "description": "End latitude. Accepted: a number between -90 and 90.",
                "type": ["number", "string"]
              },
              "lon1": {
                "description": "Start longitude. Accepted: a number between -180 and 180.",
                "type": ["number", "string"]
              },
              "lon2": {
                "description": "End longitude. Accepted: a number between -180 and 180.",
                "type": ["number", "string"]
              },
              "method": {
                "description": "vincenty (default, WGS-84) or haversine. Accepted: vincenty, haversine.",
                "enum": ["vincenty", "haversine"],
                "type": "string"
              },
              "op": {
                "description": "distance (default), destination, midpoint or path. Accepted: distance, destination, midpoint, path.",
                "enum": ["distance", "destination", "midpoint", "path"],
                "type": "string"
              },
              "path": {
                "description": "Comma-separated lat,lon pairs for op=path, at most 200 points. Accepted: comma-separated lat,lon pairs, at most 200 points.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
