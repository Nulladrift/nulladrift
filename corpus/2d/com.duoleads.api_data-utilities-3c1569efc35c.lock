          "digest": "sha256:e625b3dd9bb1af678204ba1c8ccb48c5e035c61888f236d5046f44a008dffa6b"
        },
        {
          "name": "dst_transitions",
          "title": "DST transitions: next daylight-saving time changes for an IANA time zone",
          "description": "DST transitions: list the daylight-saving time changes for an IANA time zone over a date range: the exact instant of each shift, the offset before and after, and whether local clocks jump forward or back. Returns the current offset and DST state, and the next transition from a given instant. Zones without DST return an empty transition list rather than an error. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Start of the range: RFC 3339 or YYYY-MM-DD. Default now. Accepted: RFC 3339 timestamp or YYYY-MM-DD.",
                "type": "string"
              },
              "years": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Length of the range in years, 1-10. Default 2. Accepted: integer 1-10."
              },
              "zone": {
                "description": "IANA time zone id. Accepted: an IANA time zone id, e.g. Europe/Amsterdam.",
                "type": "string"
              }
            },
            "required": ["zone"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
