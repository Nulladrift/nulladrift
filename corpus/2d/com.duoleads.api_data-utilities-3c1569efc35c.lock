        {
          "name": "geohash_encode_decode",
          "title": "Geohash encoder and decoder with neighbour cells",
          "description": "Geohash encoder and decoder: encode a WGS-84 latitude and longitude to a geohash at a chosen precision, or decode a geohash back to its bounding box, centre point and error bounds in metres. Encoding also returns the eight neighbouring cells, which is what a caller needs to do proximity search over a geohash-indexed store without a spatial database. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "geohash": {
                "description": "Geohash to decode, 1-12 characters. Required when op=decode. Accepted: base32 geohash alphabet, excluding a, i, l and o.",
                "type": "string"
              },
              "lat": {
                "description": "WGS-84 latitude, -90 to 90. Required when op=encode. Accepted: a number between -90 and 90.",
                "type": ["number", "string"]
              },
              "lon": {
                "description": "WGS-84 longitude, -180 to 180. Required when op=encode. Accepted: a number between -180 and 180.",
                "type": ["number", "string"]
              },
              "op": {
                "description": "encode (default): lat/lon to geohash. decode: geohash to bounding box. Accepted: encode, decode.",
                "enum": ["encode", "decode"],
                "type": "string"
              },
              "precision": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Geohash length 1-12, default 9 (about 4.8 m). Accepted: integer 1-12."
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
