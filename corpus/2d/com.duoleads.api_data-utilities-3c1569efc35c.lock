          "description": "RRULE expander: expand an RFC 5545 recurrence rule into concrete occurrence timestamps. Accepts an RRULE string with DTSTART, an IANA time zone, and optional EXDATE and RDATE lists, and returns up to 200 occurrences as both local wall-clock times and UTC instants. Supports FREQ, INTERVAL, COUNT, UNTIL, BYDAY, BYMONTHDAY, BYMONTH, BYSETPOS and WKST. Occurrences moved by a DST gap carry gap: true. Rules needing over 50,000 candidate evaluations are rejected. Price: $0.05 per successful call, paid over x402 (USDC on Base).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "after": {
                "description": "RFC 3339 instant; skip occurrences before it. Accepted: RFC 3339 timestamp.",
                "type": "string"
              },
              "count": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Maximum occurrences to return, 1-200. Default 20. Accepted: integer 1-200."
              },
              "dtstart": {
                "description": "First occurrence, YYYY-MM-DDTHH:MM:SS local to zone. Accepted: YYYY-MM-DDTHH:MM:SS.",
                "type": "string"
              },
              "exdate": {
                "description": "Comma-separated local datetimes to exclude. Accepted: at most 1024 characters.",
                "type": "string"
              },
              "rdate": {
                "description": "Comma-separated local datetimes to add. Accepted: at most 1024 characters.",
                "type": "string"
              },
              "rrule": {
                "description": "RFC 5545 RRULE, e.g. FREQ=MONTHLY;BYDAY=-1FR;COUNT=6. Accepted: at most 512 characters.",
                "type": "string"
              },
              "zone": {
                "description": "IANA time zone id. Accepted: an IANA time zone id, e.g. Europe/Amsterdam.",
                "type": "string"
              }
            },
            "required": ["dtstart", "rrule", "zone"],
