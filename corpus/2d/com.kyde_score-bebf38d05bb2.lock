        {
          "name": "get_scores",
          "title": "Get drift scores",
          "description": "Current drift score per agent under the key: 0-39 deviating, 40-69 watch, 70-100 normal; status 'learning' until the baseline freezes (30 runs over at least 3 days). 'feedback' lists alerts to ask your human about (share answer_url, never answer it yourself).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agents": {
                "items": {
                  "properties": {
                    "alarms": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "alarms_total": {
                      "type": "integer"
                    },
                    "band": {
                      "description": "deviating (0-39) | watch (40-69) | normal (70-100); null while learning.",
                      "type": ["string", "null"]
                    },
                    "baseline_fingerprint": {
                      "type": ["string", "null"]
                    },
                    "calls": {
                      "description": "Stored tool calls, also while learning.",
                      "type": "integer"
                    },
                    "contract": {
                      "description": "The declared contract's seal triple (never a bare hash, D-069): status proposed or confirmed, hash, schema_version, confirmed_at. Absent when no contract was ever proposed.",
                      "type": "object"
                    },
                    "error_rate": {
                      "type": ["number", "null"]
                    },
                    "last_seen_at": {
                      "description": "When the newest call arrived (UTC).",
                      "type": ["string", "null"]
                    },
                    "median_duration_ms": {
                      "type": ["integer", "null"]
                    },
                    "method_version": {
                      "type": "string"
                    },
                    "model": {
                      "description": "The model the agent currently runs on (majority of its last runs).",
                      "type": ["string", "null"]
                    },
                    "model_changes": {
                      "description": "Detected model switches, newest first.",
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "n_baseline_records": {
                      "type": "integer"
                    },
                    "n_live_records": {
                      "type": "integer"
                    },
                    "notices": {
                      "description": "Present when something needs the human's attention beyond the score: the active announced change (announce_change) with what shifted since and the rebaseline call that accepts the new baseline, and — while an agent is still learning with no real alarm — a sample_alarm with sample: true showing what an alarm will look like, and an alert_held notice when the free plan's one instant alert mail of the month is used up (the alerts then wait for the weekly review; tell your human one is waiting), a contract_proposed notice while a proposed contract awaits the human, and an action_held notice when a call was held before execution (tell your human; retry only after approval). NEVER relay a sample as a real alarm; real ones carry an alarm_id.",
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "proposed_action": {
                      "description": "Present only while the agent is deviating: the one-click way back if the change was intended (rebaseline with kind and reason).",
                      "type": "object"
                    },
                    "reason": {
                      "description": "The alarm reason line while watch/deviating: one plain sentence, what to do, how sure.",
                      "properties": {
                        "action": {
                          "type": "string"
                        },
                        "certainty": {
                          "enum": ["sure", "hint"],
                          "type": "string"
                        },
                        "kind": {
                          "type": "string"
                        },
                        "reason": {
                          "type": "string"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "rebaselined_at": {
                      "type": ["string", "null"]
                    },
                    "runs_needed": {
                      "type": "integer"
                    },
                    "runs_seen": {
                      "type": "integer"
                    },
                    "score": {
                      "description": "0-100; null while learning.",
                      "type": ["integer", "null"]
                    },
                    "service_name": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["learning", "scored"],
                      "type": "string"
                    },
                    "tool_mix": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "warnings": {
                      "description": "Setup problems with this agent's name, e.g. a harness default name or several agents sharing one service.name. Fix them, or the baseline blurs; relay them to your human.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
