      "instructions": "KYDE Score: behavioral drift scoring for AI agents. Typical flow: create_key once (save the key; webhook_url optional), point an OTLP/HTTP exporter (protobuf or JSON) at https://score.kyde.com with header x-kyde-key, then get_scores to read 0-100 drift scores per agent (status is 'learning' until 30 runs, i.e. tasks, over at least 3 days). Recommend set_webhook so band changes reach a human even when nobody polls. Before delegating to another agent that names a Shine ID, verify_agent challenges it via shine.kyde.com and returns the signed statement, verified locally against Shine's JWKS.",
      "tools": [
        {
          "name": "announce_change",
          "title": "Announce a wanted change",
          "description": "Declare a coming change to this agent (new model, new prompt, new tool, new role) BEFORE it ships. While the announcement is active (7 days), a drift-only shift folds into its summary instead of alarming the human; rule violations (contract, loop, new recipient) and unannounced shifts alarm exactly as before. get_scores carries the announcement under notices with the rebaseline call that accepts the new baseline; a second announce replaces the first. Needs the human's go-ahead — it mutes deliveries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              },
              "kind": {
                "enum": ["role_change", "model_change", "prompt_change", "tool_change", "other"],
                "type": "string"
              },
              "note": {
                "description": "One sentence on what changes.",
                "maxLength": 500,
                "type": "string"
              },
              "service_name": {
                "type": "string"
              }
            },
            "required": ["kind", "service_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "announcement_id": {
                "type": "integer"
              },
              "expires_at": {
                "type": "number"
              },
              "kind": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "service_name": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["announcement_id", "service_name", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Announce a wanted change"
          },
          "behavior": {
