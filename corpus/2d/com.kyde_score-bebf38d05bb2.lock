  "subjects": {
    "com.kyde/score": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://score.kyde.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "kyde-score",
        "version": "0.10.1"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KYDE Score: behavioral drift scoring for AI agents. Typical flow: create_key once (save the key; webhook_url optional), point an OTLP/HTTP exporter (protobuf or JSON) at https://score.kyde.com with header x-kyde-key, then get_scores to read 0-100 drift scores per agent (status is 'learning' until 30 runs are seen). Recommend set_webhook so band changes reach a human even when nobody polls. Before delegating to another agent that names a Shine ID, verify_agent challenges it via shine.kyde.com and returns the signed statement, verified locally against Shine's JWKS.",
      "tools": [
        {
          "name": "claim_key",
          "title": "Attach a human to the key",
          "description": "Attach your human's email to the key (double opt-in: Kyde mails a confirmation link). Once confirmed, the key is claimed: the human gets the management dashboard, and rebaseline, webhook changes and revocation work only for them — no agent, including you, can reset its own score. Asking the human for the address once is a mandatory setup step; only the human may decline. Never invent or guess an address; skip only when get_scores already shows claimed: true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The human's email address, given by them.",
                "type": "string"
              },
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              },
              "product_updates": {
                "description": "Separate, optional consent: may Kyde send occasional product updates to this address? Ask as its own question; pass true only on an explicit yes. Default false; revocable in the dashboard.",
                "type": "boolean"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "claim": {
                "type": "string"
              },
              "email_sent": {
                "type": "boolean"
              },
              "next": {
                "type": "string"
              }
            },
            "required": ["claim", "email_sent", "next"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Attach a human to the key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa439e43a64685d91f40fd6008620bd45922d9224c2b055721293341e0db2ca7"
        },
        {
          "name": "create_key",
          "title": "Create scoring key",
          "description": "Create a scoring key (no signup). One key covers all agents, identified by OTel service.name. webhook_url (https) is optional but recommended: it receives an HMAC-signed POST when any agent's score changes band.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "purpose": {
                "description": "Optional: 'test' for evaluation runs and benchmarks, so they stay out of KYDE's usage statistics. Default customer.",
                "enum": ["customer", "test", "internal"],
                "type": "string"
              },
              "source": {
                "description": "Optional: where you found KYDE Score (e.g. skill, llms.txt, registry, website). Aggregate adoption stats only.",
                "type": "string"
              },
              "webhook_url": {
                "description": "Optional https URL notified on band changes.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "key": {
                "description": "The scoring key — shown once.",
                "type": "string"
              },
              "method_version": {
                "type": "string"
              },
              "next_steps": {
                "type": "string"
              },
              "webhook": {
                "type": ["string", "null"]
              }
            },
            "required": ["key", "method_version", "next_steps", "webhook"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create scoring key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:627a2e181d12336183e53c84442b860e5306128c9ae63f2ae79f1980f0d8e264"
        },
        {
          "name": "get_scores",
          "title": "Get drift scores",
          "description": "Current drift score per agent under the key: 0-39 deviating, 40-69 watch, 70-100 normal; status 'learning' until the 30-run baseline freezes. 'feedback' lists alerts to ask your human about (share answer_url, never answer it yourself).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agents": {
                "items": {
                  "properties": {
                    "alarms": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "alarms_total": {
                      "type": "integer"
                    },
                    "band": {
                      "description": "deviating (0-39) | watch (40-69) | normal (70-100); null while learning.",
                      "type": ["string", "null"]
                    },
                    "baseline_fingerprint": {
                      "type": ["string", "null"]
                    },
                    "calls": {
                      "description": "Stored tool calls, also while learning.",
                      "type": "integer"
                    },
                    "error_rate": {
                      "type": ["number", "null"]
                    },
                    "last_seen_at": {
                      "description": "When the newest call arrived (UTC).",
                      "type": ["string", "null"]
                    },
                    "median_duration_ms": {
                      "type": ["integer", "null"]
                    },
                    "method_version": {
                      "type": "string"
                    },
                    "n_baseline_records": {
                      "type": "integer"
                    },
                    "n_live_records": {
                      "type": "integer"
                    },
                    "rebaselined_at": {
                      "type": ["string", "null"]
                    },
                    "runs_needed": {
                      "type": "integer"
                    },
                    "runs_seen": {
                      "type": "integer"
                    },
                    "score": {
                      "description": "0-100; null while learning.",
                      "type": ["integer", "null"]
                    },
                    "service_name": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["learning", "scored"],
                      "type": "string"
                    },
                    "tool_mix": {
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "warnings": {
                      "description": "Setup problems with this agent's name, e.g. a harness default name or several agents sharing one service.name. Fix them, or the baseline blurs; relay them to your human.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["band", "method_version", "runs_needed", "runs_seen", "score", "service_name", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "claimed": {
                "type": "boolean"
              },
              "degraded": {
                "description": "Present only when records were dropped today (quota/limits).",
                "properties": {
                  "dropped_today": {
                    "type": "integer"
                  },
                  "reason": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "feedback": {
                "description": "Alerts KYDE Score would like the human's verdict on. Ask your human in one sentence whether the alert was right and share answer_url. Never open or answer the link yourself: only the human's click counts.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "method_version": {
                "type": "string"
              },
              "service_version": {
                "type": "string"
              },
              "webhook": {
                "type": ["string", "null"]
              }
            },
            "required": ["agents", "claimed", "method_version", "service_version", "webhook"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get drift scores"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:440427dbaf61fc5a1afe5b0b2a8f3e9dea94e9c803ff60f32452437fd27cd2fa"
        },
        {
          "name": "rebaseline",
          "title": "Reset agent baseline",
          "description": "Forget one agent's learned baseline and score and relearn from its next 30 runs. For intended behavior changes (new model, new task) that left the agent permanently deviating. The reset is permanently visible: records and alarms stay stored, the agent carries rebaselined_at, and the reset itself is recorded as a rebaseline alarm naming the score/band it erased. Requires confirm=true and the human's explicit go-ahead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "type": "boolean"
              },
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              },
              "service_name": {
                "type": "string"
              }
            },
            "required": ["confirm", "service_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "method_version": {
                "type": "string"
              },
              "rebaselined_at": {
                "type": "string"
              },
              "runs_needed": {
                "type": "integer"
              },
              "runs_seen": {
                "type": "integer"
              },
              "service_name": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["rebaselined_at", "service_name", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Reset agent baseline"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4f566b7de5b7a4b84e2cd1548ba5002f5826876566bb710306928032a53920e9"
        },
        {
          "name": "revoke_key",
          "title": "Revoke key and delete data",
          "description": "Revoke the key and permanently delete all data stored under it. Requires confirm=true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "type": "boolean"
              },
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              }
            },
            "required": ["confirm"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "revoked": {
                "type": "boolean"
              }
            },
            "required": ["revoked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Revoke key and delete data"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ac2d9a800c0c7ffadde01c5ff5446a04faa527b09a9800dc368138c4e476f27c"
        },
        {
          "name": "set_webhook",
          "title": "Set alert webhook",
          "description": "Add or change the https webhook. It is POSTed on every band change and rebaseline, HMAC-SHA256-signed with the scoring key (header x-kyde-signature: sha256=<hex> over the raw body).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              },
              "webhook_url": {
                "description": "https URL, or null to remove the webhook (the key becomes poll-only).",
                "type": ["string", "null"]
              }
            },
            "required": ["webhook_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "webhook": {
                "type": ["string", "null"]
              }
            },
            "required": ["webhook"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set alert webhook"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e5090d30ba1c87e956ead41bf7acccd1c9e6fdb2f804cd9c2d0d8ba5789db42f"
        },
        {
          "name": "verify_agent",
          "title": "Verify another agent (Shine)",
          "description": "Prove who is on the other end before delegating work: challenges the Shine ID at shine.kyde.com, waits for the agent to confirm over its own authenticated connection, then verifies the Ed25519-signed statement against Shine's JWKS and compares the nonce hash. Needs no scoring key. The verified agent typically polls every 30 s, so a first call often answers 'pending' — call verify_agent again with the returned challenge_id, result_token and nonce to keep waiting. In the result, band 'learning' means identity confirmed but behavior not yet scored (fewer than 30 runs): whether to delegate to a learning agent is the challenger's policy call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_id": {
                "description": "From an earlier 'pending' answer: continue waiting on that challenge (together with result_token and nonce).",
                "type": "string"
              },
              "challenger": {
                "description": "Who is asking — shown to the verified agent and bound into the statement's aud. Use your own agent/service name.",
                "type": "string"
              },
              "nonce": {
                "type": "string"
              },
              "result_token": {
                "type": "string"
              },
              "session": {
                "description": "Optional session marker; the verified agent answers only on the path the challenge names (relay protection).",
                "type": "string"
              },
              "shine_id": {
                "description": "The Shine ID the other agent names (sh_...). Starts a new challenge.",
                "type": "string"
              },
              "wait_s": {
                "description": "Seconds to wait for confirmation in this call (default 20, max 25).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "challenge_id": {
                "type": "string"
              },
              "claims": {
                "type": "object"
              },
              "expires_at": {
                "type": "number"
              },
              "jwks_url": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "nonce": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "result_token": {
                "type": "string"
              },
              "statement": {
                "description": "Compact JWS — any third party can re-verify it offline against jwks_url.",
                "type": "string"
              },
              "status": {
                "enum": ["confirmed", "pending", "expired"],
                "type": "string"
              },
              "verified": {
                "description": "true only after the signature, nonce and expiry checks passed locally.",
                "type": "boolean"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify another agent (Shine)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60c44e9bfb39459444dbce9f82a1dbaaf2660bb56e3a5553ad78c56063541e55"
        }
