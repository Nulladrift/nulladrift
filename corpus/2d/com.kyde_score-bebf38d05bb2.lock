        {
          "name": "verify_agent",
          "title": "Verify another agent (Shine)",
          "description": "Prove who is on the other end before delegating work: challenges the Shine ID at shine.kyde.com, waits for the agent to confirm over its own authenticated connection, then verifies the Ed25519-signed statement against Shine's JWKS and compares the nonce hash. Needs no scoring key. The verified agent typically polls every 30 s, so a first call often answers 'pending' — call verify_agent again with the returned challenge_id, result_token and nonce to keep waiting. In the result, band 'learning' means identity confirmed but behavior not yet scored (still learning: 30 runs over at least 3 days): whether to delegate to a learning agent is the challenger's policy call. Claims v1 adds facts: contract and frame as triples {hash, schema_version, confirmed_at} (null = none confirmed), compliance {state none|too_young|measured, since, days}, holds_band none|low|elevated (last 90 days, never a raw count), method_version, and false_alarms, reserved and null until presentable — null NEVER means zero. The statement says what was measured, never 'safe'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "challenge_id": {
                "description": "From an earlier 'pending' answer: continue waiting on that challenge (together with result_token and nonce).",
                "type": "string"
              },
              "challenger": {
                "description": "Who is asking — shown to the verified agent and bound into the statement's aud. Use your own agent/service name.",
                "type": "string"
              },
              "nonce": {
                "type": "string"
              },
              "result_token": {
                "type": "string"
              },
              "session": {
                "description": "Optional session marker; the verified agent answers only on the path the challenge names (relay protection).",
                "type": "string"
              },
              "shine_id": {
                "description": "The Shine ID the other agent names (sh_...). Starts a new challenge.",
                "type": "string"
              },
              "wait_s": {
                "description": "Seconds to wait for confirmation in this call (default 20, max 25).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "challenge_id": {
                "type": "string"
              },
              "claims": {
                "type": "object"
              },
              "expires_at": {
                "type": "number"
              },
              "jwks_url": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "nonce": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "result_token": {
                "type": "string"
              },
              "statement": {
                "description": "Compact JWS — any third party can re-verify it offline against jwks_url.",
                "type": "string"
              },
              "status": {
                "enum": ["confirmed", "pending", "expired"],
                "type": "string"
              },
              "verified": {
                "description": "true only after the signature, nonce and expiry checks passed locally.",
                "type": "boolean"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify another agent (Shine)"
          },
