          },
          "digest": "sha256:37d72d5b193e3098d2e1ec8e7a8144d1688b60ef7ba5412ba8116683cd5317f8"
        },
        {
          "name": "rebaseline",
          "title": "Reset agent baseline",
          "description": "Forget one agent's learned baseline and score and relearn from its next 30 runs over at least 3 days. For intended behavior changes (new model, new task) that left the agent permanently deviating. The reset is permanently visible: records and alarms stay stored, the agent carries rebaselined_at, and the reset itself is recorded as a rebaseline alarm naming the score/band it erased. Record why with kind and reason: both land in that alarm, the timeline and the webhook event. Requires confirm=true and the human's explicit go-ahead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "announcement_id": {
                "description": "Accept an announced change (see announce_change): closes the announcement and records it as the reason.",
                "type": "integer"
              },
              "confirm": {
                "type": "boolean"
              },
              "key": {
                "description": "Scoring key; omit when sent as x-kyde-key header.",
                "type": "string"
              },
              "kind": {
                "description": "What changed on purpose.",
                "enum": ["role_change", "model_change", "prompt_change", "tool_change", "other"],
                "type": "string"
              },
              "reason": {
                "description": "One sentence on why, recorded with the reset.",
                "maxLength": 500,
                "type": "string"
              },
              "service_name": {
                "type": "string"
              }
            },
            "required": ["confirm", "service_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "kind": {
                "type": "string"
              },
              "method_version": {
                "type": "string"
              },
              "reason": {
                "type": "string"
