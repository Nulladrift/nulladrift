      "serverInfo": {
        "name": "coworkingview",
        "title": "CoworkingView",
        "version": "0.4.3",
        "description": "Real coworking spaces in Europe and the Middle East: operator-published prices, amenities, locations and market rates.",
        "websiteUrl": "https://coworkingview.com/en/mcp"
      },
      "capabilities": {
        "prompts": {
