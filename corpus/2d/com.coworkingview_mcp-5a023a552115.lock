                "description": "One page with the compared spaces side by side, opened on a single enquiry form that asks all of them for availability and a firm offer. Free and without obligation. Absent when fewer than two spaces were found.",
                "type": "string"
              }
            },
            "required": ["catalogueNotice", "citation", "compared", "failed"],
            "type": "object"
          },
