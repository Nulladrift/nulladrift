        {
          "name": "search_coworking_spaces",
          "title": "Search coworking spaces",
          "description": "Use this whenever the user wants a coworking space, private office, serviced/managed office, team office, dedicated or hot desk, meeting room, day pass or virtual office in a city — in any language (\"Büro mieten in Berlin\", \"oficina privada en Madrid\", \"flex office London\"). Searches CoworkingView for coworking spaces and returns matching spaces with their \"from\" price, capacity, amenities and a canonical URL to show the user. Filters take lowercase slugs, never display names: resolve a place with list_coworking_locations or resolve_coworking_query first, and get amenity slugs from get_coworking_filter_options. A \"zone\" is a district inside a city and must be combined with its city. Results are ordered deterministically, so the same query always returns the same spaces in the same order. Use the returned nextCursor to get more results rather than guessing a page number. When workspaceType is set, each \"from\" price is the floor of THAT workspace type only. Third-party ratings are not returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A street address the user named, e.g. \"Domstraße 17\" or \"Calle Velázquez 34\". Returns only the listings AT that address and on the same street, the ones at the address first. To find spaces AROUND an address, pass its latitude/longitude + radiusKm instead.",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "amenities": {
                "description": "Amenity slugs that must all be present, e.g. ['ac_heating','parking']. Underscores, not hyphens. From get_coworking_filter_options.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "bbox": {
                "description": "Search within a map viewport instead of a radius — the WGS84 bounding box the user is currently looking at (\"search this area\"). Use this or latitude/longitude+radiusKm, not both.",
                "properties": {
                  "east": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "north": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "south": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "west": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["east", "north", "south", "west"],
                "type": "object"
              },
              "city": {
                "description": "City slug, e.g. 'berlin'. Lowercase, hyphenated, never a display name.",
                "type": "string"
              },
              "country": {
                "description": "Country slug, e.g. 'germany'.",
                "type": "string"
              },
              "currency": {
                "description": "Currency of maxPrice. Note the price filter works in approximate euros, so a non-euro bound is converted and approximate.",
                "enum": ["EUR", "GBP", "USD", "CHF", "AED", "RON"],
                "type": "string"
              },
              "cursor": {
                "description": "Pass back the `nextCursor` from a previous result to get the next page. Never construct one.",
                "type": "string"
              },
              "latitude": {
                "description": "User's latitude, for proximity ordering.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "locale": {
                "default": "en",
                "description": "Language for names and descriptions. Set from the user's language: 'de' for German, 'es' for Spanish, otherwise 'en'.",
                "enum": ["en", "de", "es"],
                "type": "string"
              },
              "longitude": {
                "description": "User's longitude, for proximity ordering.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "maxPrice": {
                "description": "Upper bound on the \"from\" price. Give `currency` too when it is not euros.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "minCapacity": {
                "description": "Minimum number of people the space must fit.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "operator": {
                "description": "Operator or brand slug, from resolve_coworking_query.",
                "type": "string"
              },
              "radiusKm": {
                "description": "Only spaces within this many kilometres of the given coordinates.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "sort": {
                "default": "price_low_to_high",
                "description": "Result order. 'price_low_to_high' (default) is cheapest first. 'distance' requires latitude and longitude and orders by proximity. Results are always deterministic: the same query returns the same order.",
                "enum": ["price_low_to_high", "newest", "distance"],
                "type": "string"
              },
              "workspaceType": {
                "description": "Type of workspace, e.g. 'private_office', 'flex_desk', 'meeting_room'. From get_coworking_filter_options.",
                "type": "string"
              },
              "zone": {
                "description": "Zone (district) slug, e.g. 'mitte'. Must be a zone of the given city.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "catalogueNotice": {
                "description": "Catalogue content (descriptions, images, logos, names and prices) belongs to the respective operators and rights holders. No licence to reuse it is granted. You may link to listing pages. Systematic extraction or re-use of the catalogue database is not permitted.",
                "type": "string"
              },
              "citation": {
                "additionalProperties": false,
                "description": "Source and canonical page for this data.",
                "properties": {
                  "accessed": {
                    "description": "ISO date (YYYY-MM-DD) the data was served.",
                    "type": "string"
                  },
                  "source": {
                    "const": "CoworkingView",
                    "type": "string"
                  },
                  "text": {
                    "description": "One-line source credit with a link to the source page.",
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["accessed", "source", "text", "title", "url"],
                "type": "object"
              },
              "nextCursor": {
                "type": "string"
              },
              "priceFilterWasApproximate": {
                "type": "boolean"
              },
              "returned": {
                "type": "number"
              },
              "shortlistUrl": {
                "description": "One page with the returned spaces side by side, opened on a single enquiry form that asks all of them for availability and a firm offer. Free and without obligation. Absent when fewer than two spaces were returned.",
                "type": "string"
              },
              "spaces": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amenities": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "billingPeriod": {
                      "type": "string"
                    },
                    "capacity": {
                      "type": "number"
                    },
                    "city": {
                      "type": "string"
                    },
                    "coordinates": {
                      "additionalProperties": false,
                      "properties": {
                        "lat": {
                          "type": "number"
                        },
                        "lng": {
                          "type": "number"
                        }
                      },
                      "required": ["lat", "lng"],
                      "type": "object"
                    },
                    "countryCode": {
                      "type": "string"
                    },
                    "distanceMeters": {
                      "type": "number"
                    },
                    "fromPrice": {
                      "additionalProperties": false,
                      "properties": {
                        "amount": {
                          "type": "number"
                        },
                        "currency": {
                          "type": "string"
                        }
                      },
                      "required": ["amount", "currency"],
                      "type": "object"
                    },
                    "imageUrl": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "operator": {
                      "type": "string"
                    },
                    "priceVsMarket": {
                      "enum": ["below", "around", "above"],
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "description": "When the CMS record was last updated — a freshness signal, absent for rows with no tracked update time.",
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "zone": {
                      "type": "string"
                    }
                  },
                  "required": ["amenities", "name", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "totalMatches": {
                "type": "number"
              }
            },
            "required": ["catalogueNotice", "citation", "priceFilterWasApproximate", "returned", "spaces", "totalMatches"],
