            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City slug, to scope counts and price ranges to one city.",
                "type": "string"
              },
              "country": {
                "description": "Country slug, to scope to one country.",
                "type": "string"
