                "type": "string"
              },
              "region": {
                "description": "Optional region: a code ('BY', 'HE', 'MD', 'CT', 'SCT'), a name ('Bayern', 'Nordrhein-Westfalen', 'NRW', 'Andalucía', 'Scotland') or a city with its own calendar ('Madrid', 'Barcelona'). Omit for the days the whole country shares.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "year": {
                "description": "Calendar year. Only years with official data are served: 2026, 2027. Defaults to the latest.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
