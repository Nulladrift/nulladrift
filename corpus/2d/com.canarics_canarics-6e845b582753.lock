  "subjects": {
    "com.canarics/canarics": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://canarics.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "canarics",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_signup_status",
          "title": "Check signup status",
          "description": "Follow a signup started with start_signup. Poll slowly — the human step takes minutes. Once the person has claimed the link and the trial is live, this returns a one-time read-only Canarics API key for the new team: store it and use it as the Bearer key on this same MCP endpoint (and /api/v1) from then on.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "intentToken": {
                "description": "The intentToken returned by start_signup.",
                "type": "string"
              }
            },
            "required": ["intentToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d07dfa519a1dbd6ffd3d5d4c2b966817a2bee43a838679a506b3c50ccd162513"
        },
        {
          "name": "start_signup",
          "title": "Start a Canarics signup",
          "description": "Begin setting up Canarics (AI voice agents + call analysis) for a company that has no account yet. Returns a claim URL: ALWAYS show that URL to the person immediately and verbatim — it is useless sitting in your context; they open it, sign in, verify their phone by SMS and accept the terms; the trial then provisions itself with a demo AI agent generated from the company website. Keep the returned intentToken to follow progress with check_signup_status. All other Canarics tools need the API key that check_signup_status hands you after the claim. GROUNDING: companyName and website must come from what the person actually told you in this conversation — if either is missing, ask for it; never guess, never use placeholders like \"New Company\" or example.com. Never ask for or collect a password or any credentials in chat: identity is verified entirely on the claim link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "companyName": {
                "description": "Company name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "contactEmail": {
                "description": "Contact email of the person who will claim the signup.",
                "type": "string"
              },
              "language": {
                "description": "Preferred conversation/summary language (e.g. Latvian, English, German). Default English.",
                "type": "string"
              },
              "notes": {
                "description": "Short context on the intended use case (max 500 chars).",
                "maxLength": 500,
                "type": "string"
              },
              "website": {
                "description": "Company website URL — the demo AI agent is generated from it.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["companyName", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f8113361690c2c373ca2b40f2cb15a84eac8def46789a8f4184507a10e5b30ab"
        }
      ],
      "digest": "sha256:3b09d727311a77b6da82b50b1b5cf8146fb99bbfd2ee7b128186ebaea8793c24"
    }
  }
}
