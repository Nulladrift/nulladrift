      "tools": [
        {
          "name": "get_article_detail",
          "title": "获取文章详情",
          "description": "根据文章 ID 获取单篇或多篇资讯的完整正文（极简 Markdown）与详细元数据。\n调用时机：通过 search_articles 找到目标新闻后，需要对正文进行深度分析、总结、翻译或细节提取时调用。\n一次最多 10 个 ID；正文以 Markdown 返回，已清洗脚本 / 样式等噪音。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "article_ids": {
                "description": "文章 ID，多个用英文逗号分隔（如 '10234' 或 '10234,10235'），单次最多 10 个。",
                "type": "string"
              },
              "language": {
                "default": "zh-cn",
                "description": "阅读语言：zh-cn(简中)、zh-hk(繁中)、en(英文)，默认 zh-cn。",
                "enum": ["zh-cn", "zh-hk", "en"],
                "type": "string"
              }
            },
            "required": ["article_ids"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "articles": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "article_id": {
                      "type": "string"
                    },
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "category": {
                      "type": "string"
                    },
                    "content": {
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "publish_time": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tags": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "word_count": {
                      "type": "number"
                    }
                  },
                  "required": ["article_id", "authors", "category", "language", "publish_time", "source", "summary", "tags", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "number"
              },
              "language": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["articles", "count", "language", "status", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2d464677c483c3d61d5a9904e79418a83bc0b67fe5889b7c21fcf353b9b1ae36"
        },
        {
          "name": "search_articles",
          "title": "搜索新闻列表",
          "description": "搜索并检索 NewTimeSpace（新时空）发布的财经、科技、新股、ETF、出海等新闻资讯。\n用途：查询最新资讯清单，或按主体 / 关键词、分类、日期区间检索文章。默认仅返回【核心摘要与元数据】以节省上下文 Token；如需完整正文，先取得 article_id 再调用 get_article_detail，或将 include_content 设为 true。\n\n【query 使用指南】\n- 只传最核心的单个主体词（如“小米”“英伟达”），不要传逻辑运算符或多词（勿传“小米 AND 财报”或“小米 财报”）。\n- query 会同时匹配标题与摘要。若用户问“最新动态 / 近期新闻”，保持 query 为空、page=1 即可。\n\n【category 使用指南】\n- 分类须与 language 配对、精确匹配且区分大小写；zh-cn 示例：财经、新股、ETF、科技、出海、新时空研究院、财经FAQ（仅供示意，实际以服务端为准）。\n- 若不确定当前语言的合法分类：先随便传一个占位分类（如 category=\"_\"），服务端不会报错，而会在 warnings 中回吐该语言下的【权威分类清单】，再据此重填 category 重试即可。\n\n【日期区间】\n- 用 start_date / end_date（YYYY-MM-DD）限定发布时间范围；只填其一表示开区间（如仅 start_date 表示该日至今）。\n- 当日筛选：start_date 与 end_date 传同一天即可。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "分类名称（可选）。精确匹配、区分大小写，须与 language 配对；不确定时先传占位分类（如 '_'），据 warnings 回吐的权威清单重试。不传则检索全站。",
                "type": "string"
              },
              "end_date": {
                "description": "结束日期 YYYY-MM-DD（含当天 23:59:59）。",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_content": {
                "default": false,
                "description": "是否在结果中直接包含完整正文（Markdown）？默认 false（仅摘要，节省 Token）。",
                "type": "boolean"
              },
              "language": {
                "default": "zh-cn",
                "description": "输出语言，默认 zh-cn。可选 zh-cn(简中)、zh-hk(繁中)、en(英文)。",
                "enum": ["zh-cn", "zh-hk", "en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "每页条数，1-100，默认 10。",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "order": {
                "default": "desc",
                "description": "排序方向：desc(降序) 或 asc(升序)，默认 desc。",
                "enum": ["desc", "asc"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "页码，默认 1。",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "核心检索词（可选）。只传单个最核心的主体或主题词，匹配标题与摘要。",
                "type": "string"
              },
              "sort": {
                "default": "publish_time",
                "description": "排序字段：publish_time(发布时间) 或 id，默认 publish_time。",
                "enum": ["publish_time", "id"],
                "type": "string"
              },
              "start_date": {
                "description": "起始日期 YYYY-MM-DD（含当天 00:00:00）。",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "articles": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "article_id": {
                      "type": "string"
                    },
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "category": {
                      "type": "string"
                    },
                    "content": {
                      "type": "string"
                    },
                    "language": {
                      "type": "string"
                    },
                    "publish_time": {
                      "type": "string"
                    },
                    "source": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tags": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "word_count": {
                      "type": "number"
                    }
                  },
                  "required": ["article_id", "authors", "category", "language", "publish_time", "source", "summary", "tags", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "category": {
                "type": "string"
              },
              "count": {
                "type": "number"
              },
              "language": {
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "page": {
                "type": "number"
              },
              "query": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "total": {
                "type": "number"
              },
              "total_pages": {
                "type": "number"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["articles", "category", "count", "language", "limit", "page", "query", "status", "total", "total_pages", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
