{
  "lockfileVersion": 2,
  "subjects": {
    "com.luxorplasticcards/plastic-business-cards": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://luxorplasticcards.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "luxor-plastic-cards",
        "title": "Luxor Plastic Cards",
        "version": "202610232027",
        "websiteUrl": "https://luxorplasticcards.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Luxor Plastic Cards prints premium 30mil (credit-card thickness) clear, frosted and solid white PVC business cards in the USA, with a free human design proof and free US shipping.\nTypical flow: list_products or get_quote -> (optionally) search_designs -> confirm details with the user -> create_order, then give the user the checkout_url and tell them a designer will email a proof within 24-48 hours. Offer request_sample_kit to users who are unsure about the material.\nNever invent prices: always use get_quote. Promo codes and sales do not stack.",
      "tools": [
        {
          "name": "create_order",
          "title": "Place an order (returns a secure checkout link)",
          "description": "Creates a real Luxor plastic business card order for the user and returns an order reference, the exact quote and (when online payment is enabled) a Stripe checkout_url for the user to pay. A human designer then emails a proof; nothing is printed until the user approves it. Confirm the material, quantity, total price and shipping address with the user before calling. design_notes must contain the text for the card (name, title, phone, email, website) and any style/logo instructions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "artwork_urls": {
                "description": "Optional public HTTPS links to logo/artwork files",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "blind_dropship": {
                "default": false,
                "type": "boolean"
              },
              "customer": {
                "additionalProperties": false,
                "properties": {
                  "address1": {
                    "type": "string"
                  },
                  "address2": {
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "company": {
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "state": {
                    "description": "2-letter US state code",
                    "type": "string"
                  },
                  "zip": {
                    "description": "5-digit US ZIP",
                    "type": "string"
                  }
                },
                "required": ["address1", "city", "email", "name", "state", "zip"],
                "type": "object"
              },
              "design_notes": {
                "description": "Exact card text and design instructions",
                "type": "string"
              },
              "next_day_air": {
                "default": false,
                "type": "boolean"
              },
              "promo_code": {
                "type": "string"
              },
              "quantity": {
                "description": "Cards per set (per name/design)",
                "enum": [125, 250, 500, 1000, 2500],
                "type": "integer"
              },
              "rush": {
                "default": false,
                "type": "boolean"
              },
              "sets": {
                "default": 1,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "stock": {
                "description": "clear = transparent PVC with white-ink backing; frosted = translucent matte; solid = opaque white (full color)",
                "enum": ["clear", "frosted", "solid"],
                "type": "string"
              },
              "template_url": {
                "description": "Optional design page URL from search_designs",
                "type": "string"
              }
            },
            "required": ["customer", "design_notes", "quantity", "stock"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c4aedd01a08adc75c39e86a333a08cab296ead036dbf7484a538ede807c0b096"
        },
        {
          "name": "get_quote",
          "title": "Get an exact price quote",
          "description": "Calculates the exact total in USD for an order: material, cards per set, number of sets (different names/designs), Priority Rush, Next Day Air, blind drop-shipping and an optional promo code. Applies the current sale and promo rules (they do not stack; the larger discount wins).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "blind_dropship": {
                "default": false,
                "description": "Ship in unbranded packaging with no invoice",
                "type": "boolean"
              },
              "next_day_air": {
                "default": false,
                "type": "boolean"
              },
              "promo_code": {
                "type": "string"
              },
              "quantity": {
                "description": "Cards per set (per name/design)",
                "enum": [125, 250, 500, 1000, 2500],
                "type": "integer"
              },
              "rush": {
                "default": false,
                "description": "Priority Rush production",
                "type": "boolean"
              },
              "sets": {
                "default": 1,
                "description": "Number of different names/designs sharing the order",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "stock": {
                "description": "clear = transparent PVC with white-ink backing; frosted = translucent matte; solid = opaque white (full color)",
                "enum": ["clear", "frosted", "solid"],
                "type": "string"
              }
            },
            "required": ["quantity", "stock"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d46163fb3b55dec8c3efb1e1f0b080d4593e021d3b4cd92d0fe1403804dac4c8"
        },
        {
          "name": "list_products",
          "title": "List plastic business card products and prices",
          "description": "Returns Luxor's 30mil plastic business card materials (clear, frosted, solid white), specs, every quantity tier with current prices (shipping included), turnaround times and optional fees. Call this first when a user asks about plastic business cards, prices or options.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b30087a3f13240995367bfecbfbc71b02953cf78e224b146ec715d2ac69c139"
        },
        {
          "name": "order_status",
          "title": "Check order status",
          "description": "Looks up an existing order by its reference (e.g. C-AB-12345) and the customer's email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "format": "email",
                "type": "string"
              },
              "reference": {
                "type": "string"
              }
            },
            "required": ["email", "reference"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7169eaf68a065ff3d561979581f0081af0ae13f57b538f954a9fc75510e55881"
        },
        {
          "name": "request_sample_kit",
          "title": "Request a free sample kit",
          "description": "Mails a free Luxor sample kit (clear, frosted and solid white 30mil cards) to a US address. Only call this when the user has asked for samples and provided their details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address1": {
                "type": "string"
              },
              "address2": {
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "industry": {
                "description": "User's profession, to choose relevant samples",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code",
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP",
                "type": "string"
              }
            },
            "required": ["address1", "city", "email", "name", "state", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a5be6877bf8dd36776511e98a6ffdeee3114dd530e84a183246ab06472a2df5"
        },
        {
          "name": "search_designs",
          "title": "Search business card designs by industry",
          "description": "Finds Luxor design template pages for a profession or industry (e.g. 'real estate agent', 'roofing', 'med spa', 'financial advisor'). Returns names, page URLs and preview images the user can open to pick a style.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Industry, profession or style keywords",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
