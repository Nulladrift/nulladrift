          },
          "digest": "sha256:079fa638c865a975919dc84adb2a8945848e65ced2d7f90108c388f9d833a109"
        }
      ],
      "digest": "sha256:51beb1df03000c8ab8d0e0b9fd1ec497a364c79eea8df6790c7e705a7c1a6cd3"
    }
  }
