{
  "lockfileVersion": 2,
  "subjects": {
    "com.olyport/fdic-bankfind": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.olyport.com/fdic-bankfind/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fdic-bankfind",
        "version": "1.27.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_bank_failures",
          "description": "Get recent bank failures from FDIC records.\n\n    Returns details of failed FDIC-insured institutions including failure\n    date, resolution type, estimated cost, and pre-failure assets.\n\n    Args:\n        state: Two-letter state abbreviation to filter by (e.g. 'CA').\n        start_year: Only return failures from this year onward (e.g. 2020).\n    ",
          "inputSchema": {
            "properties": {
              "start_year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Start Year"
              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "State"
              }
            },
            "title": "get_bank_failuresArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_bank_failuresOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cd4b3336775a9df9adccb68dd8c1c917482bffbca3de5c18334a59a7e135f88"
        },
        {
          "name": "get_county_branches",
          "description": "Get all bank branches in a county ranked by deposits.\n\n    Returns branch-level deposit data from the Summary of Deposits (SOD)\n    for all institutions in the specified county.\n\n    Args:\n        state_fips: Two-digit state FIPS code (e.g. '06' for California).\n        county_fips: Three-digit county FIPS code (e.g. '037' for Los Angeles).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "state_fips": {
                "title": "State Fips",
                "type": "string"
              }
            },
            "required": ["county_fips", "state_fips"],
            "title": "get_county_branchesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_branchesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2086d8b5955d7236161e6bc96882fa480a05b52b5112036138086db212d46e87"
        },
        {
          "name": "get_institution",
          "description": "Get detailed financial information for a specific FDIC-insured institution.\n\n    Returns Call Report data for the most recent reporting period (2024-06-30)\n    including assets, deposits, income, classification, and regulator.\n\n    Args:\n        cert: FDIC certificate number uniquely identifying the institution.\n    ",
          "inputSchema": {
            "properties": {
              "cert": {
                "title": "Cert",
                "type": "integer"
              }
            },
            "required": ["cert"],
            "title": "get_institutionArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_institutionOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b69e0423a5f3b7f7ff912cd68e784869a0b06b27abb1ac1aa9723d7336388cb"
        },
        {
          "name": "get_institution_branches",
          "description": "Get all branch locations for an FDIC-insured institution.\n\n    Returns branch-level data from the Summary of Deposits (SOD) including\n    addresses, deposit amounts, branch type, and coordinates.\n\n    Args:\n        cert: FDIC certificate number uniquely identifying the institution.\n    ",
          "inputSchema": {
            "properties": {
              "cert": {
                "title": "Cert",
                "type": "integer"
              }
            },
            "required": ["cert"],
            "title": "get_institution_branchesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_institution_branchesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:162306c4919b113022437e296d4c7a3ae867b2cbdd9bca1c9c28b43df5afded2"
        },
        {
          "name": "search_institutions",
          "description": "Search FDIC-insured financial institutions by name.\n\n    Returns matching banks with key financial data from the most recent\n    Call Report (2024-06-30), sorted by total assets descending.\n\n    Args:\n        search: Institution name or partial name to search for.\n        limit: Maximum number of results to return (default 10, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "search": {
                "title": "Search",
                "type": "string"
              }
            },
            "required": ["search"],
            "title": "search_institutionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_institutionsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ef0b139419b22bfb5e200f737d1789341fbda2d80d8576374b792ca96bfb8a8"
        }
      ],
      "digest": "sha256:536ad16b154399f406d7f8708855a91c0381714c6a2074c72e7a2420a4254879"
    }
  }
}
