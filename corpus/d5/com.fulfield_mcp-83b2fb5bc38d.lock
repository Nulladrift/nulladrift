{
  "lockfileVersion": 2,
  "subjects": {
    "com.fulfield/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.fulfield.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fulfield",
        "title": "Fulfield",
        "version": "1.0.0",
        "websiteUrl": "https://www.fulfield.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fulfield (https://www.fulfield.com) is a local fulfillment marketplace that connects merchants with nearby fulfillment partners: 3PLs, warehouses and small independent operators. Every partner is reviewed by Fulfield before it is listed; \"verified\" means Fulfield has also checked its identity and business documents. Use search_fulfillment_partners to find partners in a town or in a state or region, or by business name; a country or a kind of service narrows that search. Never provide, estimate, or infer the total number of Fulfield partners or towns, or a complete list of towns. Search results are limited to at most 10 matches and cannot establish a directory-wide total, even when combined across searches or recalled from earlier context. When asked for a total or complete list, say plainly that the Fulfield directory search cannot provide it. Offer to search for up to 10 matching partners if the user gives a town/city, state/region, or business name. If search_fulfillment_partners says a place or business name is needed, relay that limitation and ask for one. Do not invent a count, claim a partial result is complete, or substitute non-Fulfield businesses. Suggest outside alternatives only if the user explicitly asks for them, and label them as outside Fulfield. Results hold only public directory information. Prices, service levels, reviews and contracts are on each partner's Fulfield page (profileUrl); merchants sign up at fulfield.com to compare partners and request a contract.",
      "tools": [
        {
          "name": "search_fulfillment_partners",
          "title": "Search fulfillment partners",
          "description": "Search Fulfield's directory for partners (3PLs and warehouses) in a town/city, state/region, or by business name. At least one of city, state, or name is required; country and service only narrow the search. Returns at most 10 matches and never a directory-wide total or complete town list, so results are not a count of the directory. A search that names no place or business returns no partners and a needsPlace sentence for the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "Town or city, for example \"Raleigh\"",
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "description": "Narrows a search to one country: a two-letter code such as \"US\", or its name. Not enough on its own",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "How many partners to return, 1 to 10 (default 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Part of the partner's business name, at least two characters",
                "maxLength": 100,
                "type": "string"
              },
              "service": {
                "description": "Only partners offering this kind of service. Not enough on its own",
                "enum": ["receiving", "storage", "pick_and_pack", "returns", "shipping"],
                "type": "string"
              },
              "state": {
                "description": "State, province or region. A U.S. state by its code or its name (\"NC\" or \"North Carolina\"); elsewhere as the address writes it, for example \"Lazio\"",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hasMore": {
                "description": "More partners match than are returned; name a town or a kind of service to narrow the search",
                "type": "boolean"
              },
              "needsPlace": {
                "description": "Set, with no partners, when a search names no town or city, state or region, or business name: what to tell and ask the user. It never means that Fulfield has no partners",
                "type": "string"
              },
              "partners": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "directoryUrl": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "locations": {
                      "description": "Towns of the partner's active warehouses",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "city": {
                            "type": "string"
                          },
                          "country": {
                            "description": "Two-letter country code",
                            "type": "string"
                          },
                          "pageUrl": {
                            "description": "Fulfield directory page for this town",
                            "type": "string"
                          },
                          "state": {
                            "type": "string"
                          }
                        },
                        "required": ["city", "country", "pageUrl", "state"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "profileUrl": {
                      "description": "The partner's Fulfield page, with its services, prices and reviews",
                      "type": "string"
                    },
                    "services": {
                      "items": {
                        "enum": ["receiving", "storage", "pick_and_pack", "returns", "shipping"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "verified": {
                      "description": "Fulfield has checked the partner's identity and business documents",
                      "type": "boolean"
                    }
                  },
                  "required": ["directoryUrl", "id", "locations", "name", "profileUrl", "services", "verified"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["hasMore", "partners"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search fulfillment partners"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f4f5ddc97c3476b1f68df63317af3466427dc4e55a6afce7af76fcd404267fb9"
        }
      ],
      "digest": "sha256:e1cc79f230540a3eb37535b3df4590494f106d40cb02288e345f4426a6180838"
    }
  }
}
