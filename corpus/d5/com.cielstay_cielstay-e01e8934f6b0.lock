                    "type": ["number", "null"]
                  },
                  "minLeadDays": {
                    "description": "Fewest days between booking and arrival",
                    "type": ["number", "null"]
                  },
                  "note": {
                    "type": "string"
                  },
                  "petsAllowed": {
                    "type": ["boolean", "null"]
                  }
                },
                "required": ["available", "note"],
