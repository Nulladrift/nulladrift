          "name": "search_vacation_rentals",
          "title": "Search vacation rentals",
          "description": "Search about 100,000 vacation rentals and longer-stay homes from independent hosts and property managers in 100 countries and territories. Each result lists the ways it can be booked that CielStay holds: the host's own booking site or engine (directUrl / referenceUrl), bookUrl (the same booking page opened through CielStay, which lets CielStay count the referral) and a CielStay listing page (cielstayUrl). CielStay does not take bookings or payments. Results are ranked by fit to the request, with a photo, a price (the average per night of a 3-night stay including the host's fees, before taxes; or per month for monthly homes) and a match score. Suited to finding a place to stay, or to checking whether a home seen on another site can be booked with its host. Follow-ups to a search (\"with ping pong\", \"cheaper\", \"bigger\") are handled by refine_search, or here with previousIntent; without either, a follow-up that names no place is searched everywhere. Each result carries bookUrl (the host's booking page) and, where someone can receive a message about the home, messageHostUrl and messageHost; for those, contact_host sends the traveller's message at once, free: the quickest way to ask about dates, pets or a monthly stay.",
