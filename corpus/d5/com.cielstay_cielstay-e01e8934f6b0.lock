        {
          "name": "book_stay",
          "title": "Book now: hold dates with the host",
          "description": "Holds dates for the traveller at a home whose host offers \"Book now\" on CielStay (bookNow.available in get_listing_details): a Pro host whose calendar CielStay keeps in sync, within the host's limits (nights, lead time, guests, pets). guestEmail must be the traveller's own address: CielStay emails it a confirmation link, and the booking holds the dates for 30 minutes until the traveller confirms. On confirmation the dates are blocked on the host's calendar and the traveller receives the host's payment instructions. The booking and the payment are between the traveller and the host: CielStay is not a party to it and takes no payment. status \"awaiting_guest_confirmation\" on success; otherwise error explains why (dates taken, over the host's limits, calendar not confirmable just now) and contact_host remains available for a request instead. The reply's next describes what the traveller receives.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkIn": {
                "description": "Arrival date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guestEmail": {
                "description": "The traveller's own email address: the confirmation link and the host's payment instructions go there",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "listingId": {
                "description": "The home's CielStay id (or slug)",
                "type": "string"
              },
              "message": {
                "description": "A note to the host from the traveller (arrival time, who is coming)",
                "type": "string"
              },
              "name": {
                "description": "The traveller's name, as the host will see it",
                "type": "string"
              },
              "pets": {
                "description": "Number of pets",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["checkIn", "checkOut", "guestEmail", "listingId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "error": {
                "type": "string"
              },
