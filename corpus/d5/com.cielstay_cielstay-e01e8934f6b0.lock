              "bookingOptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "cielstayUrl": {
                "type": "string"
              },
              "description": {
                "type": ["string", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "hostTrust": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "alsoListedOn": {
                        "description": "Other platforms this home is listed on",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
