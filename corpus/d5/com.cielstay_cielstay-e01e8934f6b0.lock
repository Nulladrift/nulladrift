                "type": "string"
              },
              "checkOut": {
                "description": "Departure date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests, for the live quote. Defaults to 2.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "description": "The listing ID from a previous search result (result.id).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
