                          {
                            "type": "null"
                          }
                        ],
                        "description": "The host's booking-site domain and the year it was registered, from public domain records"
                      },
                      "fromHost": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "cancellation": {
