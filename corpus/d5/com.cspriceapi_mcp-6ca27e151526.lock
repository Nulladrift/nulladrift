{
  "lockfileVersion": 2,
  "subjects": {
    "com.cspriceapi/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.cspriceapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cspriceapi",
        "title": "CSPriceAPI – CS2 skin prices",
        "version": "0.1.0",
        "websiteUrl": "https://cspriceapi.com/docs/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CSPriceAPI: live CS2 skin prices from 12 marketplaces (incl. the Chinese markets BUFF163 and YouPin) plus Steam, YouPin buy orders, float-ranged prices, Doppler phase prices, price history and sales. Workflow: resolve exact names with find_items, then call get_prices. Prices are in each market's own currency; price_usd is an approximate conversion for comparison. Without an API key only find_items and single-item get_prices work, with strict limits. Plans: https://cspriceapi.com/pricing.",
      "tools": [
        {
          "name": "find_items",
          "title": "Find CS2 items",
          "description": "Finds exact CS2 market_hash_name values (skins, knives, gloves, stickers, cases, agents) from a loose query, e.g. 'ak redline ft', 'karambit doppler fn', 'st m4a1 printstream'. Use it before the price tools, which need exact names. Abbreviations: st = StatTrak, fn/mw/ft/ww/bs = exterior.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text item search",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cd641f39d0ba2a572105dd8067e8d35c17c350d722709010cbf5658098cb109f"
        },
        {
          "name": "get_float_ranged_prices",
          "title": "YouPin float-ranged prices",
          "description": "YouPin898 lowest listing price per float range (e.g. 0.00-0.01, 0.01-0.02) for an item, in CNY, with Doppler phase and Fade % where relevant. Use it for low-float or high-fade valuations. Requires an API key (Pro plan).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "market_hash_name": {
                "description": "Exact market_hash_name",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["market_hash_name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8d85a0872c6c8f1b062f12e9894d6be9fd54ea25c6ec74f5bfbd9900c7abc967"
        },
        {
          "name": "get_price_history",
          "title": "CS2 price history",
          "description": "Daily or hourly price history of one item on one marketplace (lowest listing price and listing count), in the market's currency. Daily covers up to a year and more, hourly up to 30 days. Requires an API key (Enterprise plan).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "market": {
                "description": "Default youpin",
                "enum": ["youpin", "buff163", "c5game", "skinport", "skinbaron", "market-csgo", "csfloat", "dmarket", "ecosteam", "lisskins", "skinland", "shadowpay", "waxpeer"],
                "type": "string"
              },
              "market_hash_name": {
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "description": "Default daily",
                "enum": ["daily", "hourly"],
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["market_hash_name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7892bf3be2d435e7068efbf67e6d10bbbdfc632af0298e4a845c9b474d116600"
        },
        {
          "name": "get_prices",
          "title": "Live CS2 skin prices across marketplaces",
          "description": "Live lowest listing prices for CS2 items on up to 12 marketplaces (YouPin898, BUFF163, C5Game, EcoSteam, SkinBaron, Skinport, CSFloat, LIS-SKINS, DMarket, ShadowPay, Waxpeer, Market.CSGO) plus the Steam Community Market best ask/bid. Refreshed about every 5 minutes. Prices are in each market's own currency (CNY, EUR or USD) with an approximate USD value for comparison, plus listing counts and the cheapest market. Doppler / Gamma Doppler names without a phase return every phase separately. Without an API key (preview): one item per call, 5 calls per day, prices from a snapshot up to 6 hours old.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Exact market_hash_name values (use find_items first if unsure)",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "markets": {
                "description": "Limit to these marketplaces (default: all)",
                "items": {
                  "enum": ["youpin", "buff163", "c5game", "ecosteam", "skinbaron", "skinport", "csfloat", "lisskins", "dmarket", "shadowpay", "waxpeer", "market-csgo"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b50cc3b5288b8d2c0711cc298833f7d4e73054c4070fcbcb46ab63dd336f4297"
        },
        {
          "name": "get_recent_sales",
          "title": "Recent CS2 sales",
          "description": "Recent completed sales of an item on CSFloat, YouPin or Skinport with price, float, pattern (paint seed), stickers and keychains. Filter by float range or pattern. Requires an API key (Enterprise plan).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "float_max": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "float_min": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Max sales returned (default 30)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market_hash_name": {
                "minLength": 1,
                "type": "string"
              },
              "marketplace": {
                "enum": ["csfloat", "youpin", "skinport"],
                "type": "string"
              },
              "paint_seed": {
                "description": "Pattern / paint seed filter",
                "items": {
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["market_hash_name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:942f9a039ba9dada85fff1cdf4347a60425dc4f32fbe26c863c0fd7f529c8efe"
        },
        {
          "name": "get_youpin_buy_orders",
          "title": "YouPin buy orders",
          "description": "Current YouPin898 buy orders (bids) for an item, in CNY, refreshed about every 30 minutes. Default: best buy-order price and order count (Pro plan). With detail=true or any float/phase/fade/tier filter: every individual buy order with its float range and conditions (Enterprise plan). Requires an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "detail": {
                "description": "Return every order with float ranges (Enterprise)",
                "type": "boolean"
              },
              "fade": {
                "description": "Fade % of the item",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "float": {
                "description": "Only orders accepting this float",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Max orders returned (default 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market_hash_name": {
                "description": "Exact market_hash_name",
                "minLength": 1,
                "type": "string"
              },
              "phase": {
                "enum": ["Phase 1", "Phase 2", "Phase 3", "Phase 4", "Ruby", "Sapphire", "Black Pearl", "Emerald"],
                "type": "string"
              },
              "tier": {
                "description": "Case Hardened tier",
                "enum": ["T1", "T2", "T3", "T4", "Full Blue"],
                "type": "string"
              }
            },
            "required": ["market_hash_name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1c63e873d52c07424627dcb116f2bde47984b9d6e23bae928c2d688a046c3bc"
        }
      ],
      "digest": "sha256:fc6b569b88c87bc003f79cdf41eaf9f55aee3ebcdbff4b1c058770468df4793b"
    }
  }
}
