      },
      "serverInfo": {
        "name": "typeza",
        "title": "Typeza",
        "version": "1.0.0",
        "description": "Socionics personality types, relationships and the Typeza test.",
        "websiteUrl": "https://typeza.ai",
        "icons": [
          {
            "src": "https://typeza.ai/images/logo-maskable-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Typeza is a socionics personality test with plain-language profiles of the 16 personality types and the 16 relationship types between them.\n\nUse these tools to describe a type, to explain how two types relate (for example the person and their partner, friend or colleague), or to let the person take the Typeza test right here and get their type.\n\n- Every output names types and relations by their Typeza names (Analyst, Craftsman, Duality). Use those names; inputs also accept codes and slugs.\n- Duality is the relation for partners and friends. When the question is about work, describe the pair as business relations.\n- Typeza describes typical patterns between types, not what anyone should do. Do not turn a relation into advice or a prediction for a real relationship, and pass on the disclaimer that relationship outputs carry.\n- Share the typeza.ai links the outputs give, so the person can read more.",
      "tools": [
        {
          "name": "answer_test",
          "title": "Answer Typeza test questions",
          "description": "Send the person's answers for one batch of a Typeza test begun with start_test, using its draft_id and key. `answers` maps each question code to 1 (statement_1 fits better) or 2 (statement_2 fits better). Returns status next_questions with the next batch or, once every question is answered, the result: status type_found with the Typeza type (name, slug, page, short description) and keep_url, or status choose_type with candidate types when the answers fit more than one equally. Answers are saved with every call, so a test can continue later: send empty answers to get the current batch back. Give the person keep_url: it opens the full result on typeza.ai and lets them save it to an account. For a signed-in person, a first result becomes their Typeza type; a retake keeps the type they have.",
          "inputSchema": {
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "integer"
                },
                "description": "Question code to 1 (statement_1 fits better) or 2 (statement_2 fits better). Send {} to get the current batch back.",
                "title": "Answers",
                "type": "object"
              },
              "draft_id": {
                "description": "The draft_id start_test returned.",
                "title": "Draft Id",
                "type": "string"
              },
              "key": {
                "description": "The key start_test returned, passed back unchanged.",
                "title": "Key",
                "type": "string"
              }
            },
            "required": ["answers", "draft_id", "key"],
            "title": "answer_testArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "QuestionBatch": {
                "properties": {
                  "answered": {
                    "title": "Answered",
                    "type": "integer"
                  },
                  "batch": {
                    "items": {
                      "$ref": "#/$defs/QuestionItem"
                    },
                    "title": "Batch",
                    "type": "array"
                  },
                  "draft_id": {
                    "title": "Draft Id",
                    "type": "string"
                  },
                  "key": {
                    "title": "Key",
                    "type": "string"
                  },
                  "language": {
                    "title": "Language",
                    "type": "string"
                  },
                  "status": {
                    "const": "next_questions",
                    "title": "Status",
                    "type": "string"
                  },
                  "total": {
                    "title": "Total",
                    "type": "integer"
                  }
                },
                "required": ["answered", "batch", "draft_id", "key", "language", "status", "total"],
                "title": "QuestionBatch",
                "type": "object"
              },
              "QuestionItem": {
                "properties": {
                  "code": {
                    "title": "Code",
                    "type": "string"
                  },
                  "statement_1": {
                    "title": "Statement 1",
                    "type": "string"
                  },
                  "statement_2": {
                    "title": "Statement 2",
                    "type": "string"
                  }
                },
                "required": ["code", "statement_1", "statement_2"],
                "title": "QuestionItem",
                "type": "object"
              },
              "TypeCandidate": {
                "properties": {
                  "first_paragraph": {
                    "title": "First Paragraph",
                    "type": "string"
                  },
                  "subtitle": {
                    "title": "Subtitle",
                    "type": "string"
                  },
                  "type_name": {
                    "title": "Type Name",
                    "type": "string"
                  },
                  "type_slug": {
                    "title": "Type Slug",
                    "type": "string"
                  },
                  "type_url": {
                    "title": "Type Url",
                    "type": "string"
                  }
                },
                "required": ["first_paragraph", "subtitle", "type_name", "type_slug", "type_url"],
                "title": "TypeCandidate",
                "type": "object"
              },
              "TypeFound": {
                "properties": {
                  "draft_id": {
                    "title": "Draft Id",
                    "type": "string"
                  },
                  "keep_hint": {
                    "title": "Keep Hint",
                    "type": "string"
                  },
                  "keep_url": {
                    "title": "Keep Url",
                    "type": "string"
                  },
                  "short_description": {
                    "title": "Short Description",
                    "type": "string"
                  },
                  "status": {
                    "const": "type_found",
                    "title": "Status",
                    "type": "string"
                  },
                  "subtitle": {
                    "title": "Subtitle",
                    "type": "string"
                  },
                  "type_name": {
                    "title": "Type Name",
                    "type": "string"
                  },
                  "type_slug": {
                    "title": "Type Slug",
                    "type": "string"
                  },
                  "type_url": {
                    "title": "Type Url",
                    "type": "string"
                  }
                },
                "required": ["draft_id", "keep_hint", "keep_url", "short_description", "status", "subtitle", "type_name", "type_slug", "type_url"],
                "title": "TypeFound",
                "type": "object"
              },
              "TypeTied": {
                "properties": {
                  "candidates": {
                    "items": {
                      "$ref": "#/$defs/TypeCandidate"
                    },
                    "title": "Candidates",
                    "type": "array"
                  },
                  "draft_id": {
                    "title": "Draft Id",
                    "type": "string"
                  },
                  "keep_hint": {
                    "title": "Keep Hint",
                    "type": "string"
                  },
                  "keep_url": {
                    "title": "Keep Url",
                    "type": "string"
                  },
                  "status": {
                    "const": "choose_type",
                    "title": "Status",
                    "type": "string"
                  }
                },
                "required": ["candidates", "draft_id", "keep_hint", "keep_url", "status"],
                "title": "TypeTied",
                "type": "object"
              }
            },
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/QuestionBatch"
                  },
                  {
                    "$ref": "#/$defs/TypeFound"
                  },
                  {
                    "$ref": "#/$defs/TypeTied"
                  }
                ],
                "title": "Result"
              }
            },
            "required": ["result"],
            "title": "answer_testOutput",
            "type": "object"
          },
