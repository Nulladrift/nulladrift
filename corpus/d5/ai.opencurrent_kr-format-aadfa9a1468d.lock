{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/kr-format": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/kr-format"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kr-format",
        "title": "Korea Number & Format Checks",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Deterministic Korean format checks for documents, invoices and customer data: business registration number (사업자등록번호) and corporate registration number (법인등록번호) check digits, amounts written in Korean (금액 한글 표기) for contracts and receipts, and Korean phone number normalization (display and E.164). Checks format and check digits only, not whether a business is active.",
      "tools": [
        {
          "name": "kr_amount_in_words",
          "title": "Write a won amount in Korean",
          "description": "Write an amount in Korean won as words: formal (계약서·영수증 style, e.g. 금 일백이십삼만사천오백원정) and plain (e.g. 백이십삼만 사천오백 원).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["amount"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "formal": {
                "type": "string"
              },
              "plain": {
                "type": "string"
              }
            },
            "required": ["formal", "plain"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:451042d93b98d7ea86c7a227621e2b507d76a9079bd71334c3069a6a0ca20663"
        },
        {
          "name": "kr_check_business_number",
          "title": "Validate a Korean business registration number",
          "description": "Check the format and check digit of a Korean business registration number (사업자등록번호, 10 digits) or corporate registration number (법인등록번호, 13 digits). Does not check whether the business is active or closed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "business (default, 10 digits) or corporate (13 digits)",
                "enum": ["business", "corporate"],
                "type": "string"
              },
              "number": {
                "maxLength": 30,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc49721730ef3a112f0ddd9c194a42b802b8d596cd36249b91cbe759c6a8dc70"
        },
        {
          "name": "kr_normalize_phone",
          "title": "Normalize a Korean phone number",
          "description": "Normalize a Korean phone number to display form (010-1234-5678, 02-123-4567, 1588-1234) and E.164 (+821012345678), and tell its kind (mobile, Seoul, area code, nationwide 15xx/16xx/18xx, internet 070).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "phone": {
                "maxLength": 30,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b2311059bbd720f5e5b7cdefe493ff329081c3c35da9e87d8a43a0d441e7f54"
        }
      ],
      "digest": "sha256:04e4fc82d2b5e265d1f22de62e7528dac815afd013a50148a867f53f4b76d936"
    }
  }
}
