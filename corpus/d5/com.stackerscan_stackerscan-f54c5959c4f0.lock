      },
      "transport": {
        "type": "http",
        "url": "https://www.stackerscan.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "StackerScan",
        "version": "1.5.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Six read-only tools: spot prices, observed premiums, price history, Goldback rate and currencies for gold, silver and other metals, and StackerScan's How to Use guide.\nNo API key, account, or registration is required.\nStackerScan is not a dealer and sells no bullion; its tools return price data and its own How to Use guide.\nResults are structured JSON mirroring the open HTTP API documented at https://www.stackerscan.com/openapi.json; errors are RFC 9457 problem documents.",
      "tools": [
        {
          "name": "get_goldback_rate",
          "title": "Goldback exchange rate",
          "description": "The latest Goldback premium multiple over its gold content, and the exchange rate that follows from it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "A currency code from the live catalog at /api/currencies (ISO 4217 fiat plus BTC and the metal codes). Defaults to USD.",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "Resolved uppercase currency code.",
                "minLength": 1,
                "type": "string"
              },
              "goldContentTroyOz": {
                "const": 0.001,
                "description": "Fine-gold content of one Goldback note.",
                "type": "number"
              },
              "goldSpotPerTroyOz": {
                "description": "Underlying gold spot price per troy ounce in the base currency.",
                "type": "number"
              },
              "premiumMultiple": {
                "description": "Multiple applied to the note's contained-gold spot value.",
                "minimum": 0,
                "type": "number"
              },
              "rateDate": {
                "description": "Effective date of the premium multiple.",
                "format": "date",
                "type": "string"
              },
              "ratePerGoldback": {
                "description": "Price of one Goldback: goldSpotPerTroyOz × goldContentTroyOz × premiumMultiple.",
                "type": "number"
              },
              "spotAsOf": {
                "description": "UTC update instant of the gold spot input.",
                "format": "date-time",
                "type": "string"
              }
            },
            "required": ["base", "goldContentTroyOz", "goldSpotPerTroyOz", "premiumMultiple", "rateDate", "ratePerGoldback", "spotAsOf"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Goldback exchange rate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:84a384a6e9eacf036c4d46371cb891efb4097525e77573ffa91f07a4856e1734"
        },
        {
          "name": "get_how_to_use",
          "title": "How to Use guide",
          "description": "StackerScan's How to Use guide in any app language: its table of contents, or one section as markdown quoting the app's own button and field labels. Sections: createAccount (Your Account), stackSettings (Stack Settings), addItems (Adding Items to Your Stack), editItems (Editing, Selling and Deleting Items), addPhotos (Adding Photos to Your Items), managePortfolio (Understanding Your Portfolio Overview), worthToday (How Items Are Valued), dataFields (Understanding Your Item Data Fields), useTags (How to Use Tags), useCredits (Using Credits), trackPrices (Tracking Metal Prices), premiums (Checking Premiums), stackChat (Asking About Your Stack).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "App language, for the labels a person sees in it. Defaults to en.",
                "enum": ["en", "es", "de", "fr", "ja", "pt", "zh-CN", "zh-TW", "ar", "ru", "hi", "it", "nl", "he", "tr", "pl", "sv", "nb", "da", "fi", "uk"],
                "type": "string"
              },
              "section": {
                "description": "A section id. Omit for the table of contents.",
                "enum": ["createAccount", "stackSettings", "addItems", "editItems", "addPhotos", "managePortfolio", "worthToday", "dataFields", "useTags", "useCredits", "trackPrices", "premiums", "stackChat"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "minLength": 1,
                "type": "string"
              },
              "section": {
                "minLength": 1,
                "type": "string"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "section": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "subsections": {
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["section", "title"],
                  "title": "HowToUseContentsEntry",
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "How to Use guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9509a9afa813a7041f5ffeee76b0bd48a12d2e7b072fe6b7f8a35149c926c6e0"
        },
        {
          "name": "get_observed_premiums",
          "title": "Observed premiums over spot",
          "description": "Rolling fine-metal-weighted median asking premiums for silver, gold, platinum, palladium, copper, nickel and Goldback, observed from marketplace listings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque continuation token returned by the same tool with exactly the same filters.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Product page size. Without a query, pages browse the most-listed products.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "metal": {
                "description": "Which metal's observed premiums to return.",
                "enum": ["silver", "gold", "platinum", "palladium", "copper", "nickel", "goldback"],
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive product label/canonical-key search.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["metal"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "UTC latest observation instant.",
                "format": "date-time",
                "type": "string"
              },
              "categories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "listingCount": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "medianPercent": {
                      "type": "number"
                    }
                  },
                  "required": ["key", "label", "listingCount", "medianPercent"],
                  "title": "PremiumCategory",
                  "type": "object"
                },
                "type": "array"
              },
              "metal": {
                "enum": ["silver", "gold", "platinum", "palladium", "copper", "nickel", "goldback"],
                "type": "string"
              },
              "minimumListings": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "nextCursor": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "overall": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "listingCount": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "medianPercent": {
                        "type": "number"
                      }
                    },
                    "required": ["listingCount", "medianPercent"],
                    "title": "PremiumSummary",
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "productOrder": {
                "description": "How product rows were selected: search (query match, catalog order) or listing_count (browse, most-listed first). Empty products means no data.",
                "enum": ["search", "listing_count"],
                "type": "string"
              },
              "productQuery": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fineTroyOz": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "key": {
                      "maxLength": 160,
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "listingCount": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "listingsUrl": {
                      "format": "uri",
                      "maxLength": 2048,
                      "type": "string"
                    },
                    "medianPercent": {
                      "type": "number"
                    },
                    "numistaUrl": {
                      "anyOf": [
                        {
                          "format": "uri",
                          "maxLength": 2048,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["fineTroyOz", "key", "label", "listingCount", "listingsUrl", "medianPercent", "numistaUrl"],
                  "title": "PremiumProduct",
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "sourceUrl": {
                "format": "uri",
                "type": "string"
              },
              "windowDays": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["asOf", "categories", "metal", "minimumListings", "nextCursor", "overall", "productOrder", "productQuery", "products", "sourceUrl", "windowDays"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Observed premiums over spot"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb4d0c08e21910a50cc9345c42104138da3200733de89498772ce190964b66a5"
        },
