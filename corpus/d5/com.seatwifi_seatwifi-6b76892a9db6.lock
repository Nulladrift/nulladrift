              "resourceUri": "ui://seatwifi/panel.html"
            },
            "ui/resourceUri": "ui://seatwifi/panel.html"
          },
          "digest": "sha256:27bdb84c009691c93dcbf3516d8c8269f31f070337af60e9dbaed820158497c1"
        },
        {
          "name": "get_speed_stats",
          "title": "Measured WiFi speed",
          "description": "Crowd-sourced in-flight WiFi speed reports: average download/upload Mbps, latency, and a per-provider breakdown. Use for \"is the WiFi fast enough\" questions. Pass a flight_number or an airline_code, not both.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "airline_code": {
                "description": "IATA airline code, e.g. \"UA\"",
                "type": "string"
              },
              "flight_number": {
                "description": "IATA flight number, e.g. \"UA123\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
