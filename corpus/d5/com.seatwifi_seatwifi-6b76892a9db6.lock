      "instructions": "SeatWiFi tracks in-flight WiFi: which provider (Starlink, Viasat, Gogo, Panasonic, Amazon Leo) is fitted to which aircraft, whether it is free, how fast it is, and how far each airline's Starlink rollout has progressed.\n\nUse these tools whenever someone asks about internet, WiFi, connectivity, streaming, or working online on a specific flight, airline, aircraft type, or tail number — including \"will I have WiFi on my flight\", \"is Starlink on this route\", and \"which airline has the best WiFi\".\n\nPick a tool by what the user gave you:\n- a flight number -> get_wifi_facts (add the flight date when known; quote its answer line and say its confidence)\n- an airline -> get_airline_wifi, then get_rollouts for Starlink timelines\n- a tail number -> get_tail_info\n- speed or \"is it fast enough for calls\" -> get_speed_stats\n- a name or partial term -> search_wifi\n\nAnswers are predictions from fleet data, not live readings. Always pass on the confidence or probability the tools return rather than stating WiFi as certain.",
      "tools": [
        {
          "name": "get_airline_wifi",
          "title": "WiFi across an airline",
          "description": "WiFi providers an airline uses fleet-wide, plus a fleet summary and whether WiFi is free. Use when the question is about the airline rather than one flight.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "airline_code": {
                "description": "IATA airline code, e.g. \"UA\" for United, \"DL\" for Delta",
                "type": "string"
              }
            },
            "required": ["airline_code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://seatwifi/panel.html"
            },
            "ui/resourceUri": "ui://seatwifi/panel.html"
          },
          "digest": "sha256:06298ef608487c5710d96b813ff412f9785a88d96d22936f9f8ecf68ee5159af"
        },
        {
          "name": "get_flight_wifi",
          "title": "WiFi on a flight (summary)",
          "description": "Compatibility alias of get_wifi_facts for a flight number with no date. Use when the user asks for a quick WiFi answer and get_wifi_facts is not available. Returns the same answer line, confidence, last_observed and basis, without the dated tail prediction. Otherwise use get_wifi_facts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "flight_number": {
                "description": "IATA flight number, e.g. \"UA123\" or \"DL456\"",
                "type": "string"
              }
            },
            "required": ["flight_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://seatwifi/panel.html"
            },
            "ui/resourceUri": "ui://seatwifi/panel.html"
          },
          "digest": "sha256:0ad3538081b6bf6464b59545ee2397f9c31838b5be1d7d2f1a7bfd3070592cd0"
        },
        {
          "name": "get_rollouts",
          "title": "Starlink rollout status",
          "description": "Starlink and satellite WiFi rollout progress per aircraft type: status (complete, in_progress, planned, announced), fleet percentage, and expected completion. Omit airline_code for every tracked airline.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "airline_code": {
                "description": "Optional IATA airline code to filter rollouts, e.g. \"UA\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
