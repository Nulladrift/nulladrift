      "serverInfo": {
        "name": "startupmkt",
        "title": "StartupMKT — Startup Discovery & Marketplace",
        "version": "1.0.0",
        "description": "StartupMKT is a startup discovery platform and acquisitions marketplace for micro-SaaS and AI ventures. It helps founders monetize what they built: compare startups and AI tools, read pricing teardowns, browse startups for sale, and follow the latest verified funding rounds. You built it. Now make money.",
        "websiteUrl": "https://startupmkt.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only tools over the live StartupMKT catalog. Use search_collections to find curated lists, get_collection for their members, latest_funding for verified recent funding rounds, and startups_for_sale for acquisition listings. All data comes from startupmkt.com pages; cite the URLs returned.",
      "tools": [
        {
          "name": "about",
          "title": "About StartupMKT",
          "description": "What StartupMKT is, who it is for, and its key URLs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:feb8f66b49dc913199e8ff9492b308dc95bb4bd527834ebec4b69bba963bfdc4"
        },
        {
          "name": "get_collection",
          "title": "Get a StartupMKT collection",
          "description": "Get the top items in one StartupMKT collection by slug (from search_collections): startup names, one-line descriptions and StartupMKT URLs.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Collection slug, e.g. \"top-25-ai-agents\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c821a325735d30330b21e2f44406c8bda43884321db70628164da387323c03f"
        },
        {
          "name": "latest_funding",
          "title": "Latest startup funding (Funding Radar)",
          "description": "Latest entries from StartupMKT Funding Radar — verified startup funding rounds from funding news sources, refreshed daily. Returns exactly what the current feed holds; amounts and rounds are passed through, never generated.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many entries to return (1-50, default 10).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:097fab8a3297d751c374bf7785f502472f48e7d4a2ddd4396143afddb2f1c3f6"
        },
        {
          "name": "search_collections",
          "title": "Search StartupMKT collections",
          "description": "Search StartupMKT curated collection pages (e.g. \"Top 25 AI Agents\", \"Startups over $10k MRR\"). Returns matching collections that actually have listings, with title, URL and item count.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Topic to search for, e.g. \"ai agents\", \"crm software\", \"profitable startups\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b2c2488129bce89b06ed9558348d52ed5e7c5471df37b4bf5474a28d7596445e"
