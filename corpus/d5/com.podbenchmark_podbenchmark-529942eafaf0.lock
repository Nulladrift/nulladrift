                          "type": "string"
                        },
                        "values": {
                          "description": "The values this field has among the matching configurations.",
                          "items": {
                            "additionalProperties": false,
                            "properties": {
                              "label": {
                                "description": "That value as the supplier names it.",
                                "type": "string"
                              },
                              "value": {
                                "description": "The value to pass back in `choices`.",
                                "type": "string"
                              }
                            },
                            "required": ["label", "value"],
                            "type": "object"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["field", "label", "values"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "nextOffset": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
