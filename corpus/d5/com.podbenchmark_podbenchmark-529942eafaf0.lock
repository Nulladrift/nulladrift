        {
          "name": "get_product_options",
          "title": "Find product configurations",
          "description": "Use this when a seller wants supplier pricing for a specific print-on-demand product size or color, such as an adult M black T-shirt or an 11 oz mug. Lists the product's fields and supported configurations for the destination and currency; narrow with words or choices. Pass a returned key as optionKey, or its choices, to compare_product. Search products first to obtain canonicalProductId. Supported destinations: US, GB, DE, AU, CA.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "canonicalProductId": {
                "description": "A product id from search_products or resolve_supplier_link, such as `cotton-ringer-tee`.",
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "choices": {
                "additionalProperties": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "Choices by field, such as { \"size\": \"m\", \"color\": \"black\" }. Values match a value key, its last part or its label, case-insensitively; get_product_options lists them.",
                "propertyNames": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "currency": {
                "description": "Currency for every price, such as USD, GBP or EUR.",
                "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                "type": "string"
              },
              "destination": {
                "description": "The buyer's country, where the order ships. Product cost, shipping and duty depend on it.",
                "enum": ["US", "GB", "DE", "AU", "CA"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "How many results to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many results to skip. Pass nextOffset from the previous page.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "default": "",
                "description": "Words to narrow the list, such as `m black`.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["canonicalProductId", "currency", "destination"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "defaultOptionKey": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
