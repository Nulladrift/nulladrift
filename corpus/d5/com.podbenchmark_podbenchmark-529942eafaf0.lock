{
  "lockfileVersion": 2,
  "subjects": {
    "com.podbenchmark/podbenchmark": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://podbenchmark.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "podbenchmark",
        "title": "POD Benchmark",
        "version": "1.0.0",
        "description": "Compare print-on-demand suppliers for the same product: product cost, shipping, delivered total and delivery time for US, UK, EU, Canadian and Australian buyers, plus profit after platform fees.",
        "websiteUrl": "https://podbenchmark.com",
        "icons": [
          {
            "src": "https://podbenchmark.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://podbenchmark.com/brand/podbenchmark-slash.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {
            "directoryRead": true
          }
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "POD Benchmark compares the same print-on-demand blank across suppliers such as Printify, Printful and Gelato, using prices it collects from each supplier. Every tool is read-only: it never places orders, opens links or touches a store.\n\nUsual path: search_products (or resolve_supplier_link when the seller pastes a supplier link), then get_product_options for a specific size or color, then compare_product. Use list_suppliers and get_supplier for plans, fees and branding, get_supplier_prices for where one supplier is cheapest, and supplier_guide when a seller is choosing suppliers for a shop.\n\nAsk only for what changes the answer: the product, and where buyers live (US, GB, DE, CA or AU). Pass the seller's current supplier, selling price or target margin, platform and shop country to compare_product once they mention them, rather than estimating profit yourself.\n\nReport unknown prices as unknown, never as zero or as the cheapest. Rankings are product plus shipping; affiliate links never change them. Each result carries a podbenchmark.com url: share it so the seller can check the comparison and its sources.",
      "tools": [
        {
          "name": "compare_product",
          "title": "Compare print-on-demand suppliers",
          "description": "Use this when a seller asks which print-on-demand (POD) supplier costs less for a product, wants a Printify vs Printful comparison, or needs product prices, shipping, delivered totals or delivery times. Compares Printify, Printful, Gelato, Prodigi, Apliiq, Artelo, CustomCat, Fourthwall, Inkthreadable and merchOne for one product and configuration, destination and currency. Search products first; for a specific size or color pass choices or an optionKey from get_product_options, otherwise it uses the product's usual configuration and returns its label. Totals and rankings are product + shipping; unknown costs stay null; similar products stay separate; affiliate links never change rankings. pricingTier base is standard pricing; use paid plans only when asked. supplier lists one supplier's every product and print provider for the choice. Seller context, only when the seller already said it: yourSupplier pins their current supplier first with the difference per sale; sellingPrice or targetMargin with salesChannel and shopLocation applies approved platform fees. When the seller mentions any of these, call again with them instead of estimating profit yourself; if salesChannel or shopLocation is missing, the result lists what to ask. Profit is an estimate before tax. Supplier-billed duty is separate: established, zero, a bounded estimate or unverified. Profit deducts established duty or a converted estimate; unverified duty or an unconverted native estimate leaves profit before that charge. Show one estimated duty amount (the converted upper endpoint, or the native one marked not converted), never a min–max range. Estimated or unverified duty and conditional design/setup prices never support a winner, gap or best-profit claim. VAT, sales tax and customer-paid import charges are excluded or marked unknown. Supported destinations: US, GB, DE, AU, CA. Not for ordering, store integrations, print-quality rankings or other destinations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "canonicalProductId": {
                "description": "A product id from search_products or resolve_supplier_link, such as `cotton-ringer-tee`.",
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              },
              "choices": {
                "additionalProperties": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "Choices by field, such as { \"size\": \"m\", \"color\": \"black\" }. Values match a value key, its last part or its label, case-insensitively; get_product_options lists them.",
                "propertyNames": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "currency": {
                "description": "Currency for every price, such as USD, GBP or EUR.",
                "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                "type": "string"
              },
              "destination": {
                "description": "The buyer's country, where the order ships. Product cost, shipping and duty depend on it.",
                "enum": ["US", "GB", "DE", "AU", "CA"],
                "type": "string"
              },
              "optionKey": {
                "description": "An exact key from get_product_options.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "pricingTier": {
                "default": "base",
                "description": "base is each supplier's standard price; tier1 and tier2 are its paid plans.",
                "enum": ["base", "tier1", "tier2"],
                "type": "string"
              },
              "salesChannel": {
                "description": "The platform the seller sells on. Needed with sellingPrice or targetMargin for platform fees.",
                "enum": ["etsy", "shopify", "woocommerce", "tiktok-shop"],
                "type": "string"
              },
              "sellingPrice": {
                "description": "What the seller's customer pays for one selected configuration or pack, in the chosen currency, including any shipping the seller charges. Only when the seller said so.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "shopLocation": {
                "description": "The country the seller's shop is based in, which can differ from the destination the order ships to. Needed with sellingPrice or targetMargin for platform fees.",
                "enum": ["US", "GB", "DE", "AU", "CA"],
                "type": "string"
              },
              "supplier": {
                "description": "Show only this supplier, with every product and print provider it offers for the choice.",
                "enum": ["apliiq", "artelo", "merchone", "customcat", "fourthwall", "gelato", "inkthreadable", "printful", "printify", "prodigi"],
                "type": "string"
              },
              "targetMargin": {
                "description": "The share of the sale, in percent, the seller wants to keep after supplier cost and platform fees. Returns the price to charge with each supplier. Use instead of sellingPrice.",
                "exclusiveMaximum": 95,
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "yourSupplier": {
                "description": "The supplier the seller uses today. Only when the seller said so; never guess.",
                "enum": ["apliiq", "artelo", "merchone", "customcat", "fourthwall", "gelato", "inkthreadable", "printful", "printify", "prodigi"],
                "type": "string"
              }
            },
            "required": ["canonicalProductId", "currency", "destination"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "affiliateDisclosure": {
                    "description": "The commission disclosure that applies to affiliate links.",
                    "type": "string"
                  },
                  "alternatives": {
                    "description": "Similar products compared alongside, kept separate from the same product's suppliers.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "offer": {
                          "additionalProperties": false,
                          "description": "The offer this supplier's row shows.",
                          "properties": {
                            "actionUrl": {
                              "description": "The main link out to this offer: the supplier's product page, or its sign-up page when the affiliate programme pays only for sign-ups.",
                              "format": "uri",
                              "type": "string"
                            },
                            "affiliate": {
                              "description": "Whether actionUrl earns a commission; it never changes prices or rankings.",
                              "type": "boolean"
                            },
                            "available": {
                              "description": "The supplier sells this configuration and quotes it for the destination.",
                              "type": "boolean"
                            },
                            "buyerImportWarning": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "A charge the buyer may pay on import, in words; null when there is none."
                            },
                            "cheapest": {
                              "description": "Has the lowest product plus shipping total among comparable offers; false when the comparison cannot rank suppliers.",
                              "type": "boolean"
                            },
                            "checkedAt": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "When this price was last checked, as an ISO date-time; null when unknown."
                            },
                            "comparable": {
                              "description": "The priced configuration matches the requested choice closely enough to compare.",
                              "type": "boolean"
                            },
                            "criticalDifferences": {
                              "description": "Ways this product differs from the one asked about; empty for the same product.",
                              "items": {
                                "minLength": 1,
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "currency": {
                              "anyOf": [
                                {
                                  "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The currency these amounts are in; null when no price is known."
                            },
                            "delivered": {
                              "anyOf": [
                                {
                                  "minimum": 0,
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Product plus shipping in the response currency; null when the supplier cannot price it, never 0."
                            },
                            "deliveryDaysMax": {
                              "anyOf": [
                                {
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The supplier's longest stated delivery time, in days from order to arrival; null when unknown."
                            },
                            "deliveryDaysMin": {
                              "anyOf": [
                                {
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The supplier's shortest stated delivery time, in days from order to arrival; null when unknown."
                            },
                            "differencesUnresolved": {
                              "anyOf": [
                                {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "A difference that could not be confirmed; null when everything is known."
                            },
                            "duty": {
                              "anyOf": [
                                {
                                  "minimum": 0,
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Supplier-billed duty in the response currency, separate from the delivered total; 0 when the supplier bills none, null when unverified."
                            },
                            "dutyEstimate": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "converted": {
                                      "anyOf": [
                                        {
                                          "additionalProperties": false,
                                          "properties": {
                                            "currency": {
                                              "description": "The currency of these duty amounts.",
                                              "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                                              "type": "string"
                                            },
                                            "max": {
                                              "description": "Highest amount in this duty range, in this currency.",
                                              "minimum": 0,
                                              "type": "number"
                                            },
                                            "min": {
                                              "description": "Lowest amount in this duty range, in this currency.",
                                              "minimum": 0,
                                              "type": "number"
                                            }
                                          },
                                          "required": ["currency", "max", "min"],
                                          "type": "object"
                                        },
                                        {
                                          "type": "null"
                                        }
                                      ],
                                      "description": "The same estimate in the response currency; null when it could not be converted."
                                    },
                                    "native": {
                                      "additionalProperties": false,
                                      "description": "The duty estimate in the supplier's own currency.",
                                      "properties": {
                                        "basis": {
                                          "const": "line_net_x_compatible_product_rate",
                                          "description": "How the estimate was derived: the line's net price times the supplier's per-product duty rate.",
                                          "type": "string"
                                        },
                                        "currency": {
                                          "description": "The currency of these duty amounts.",
                                          "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                                          "type": "string"
                                        },
                                        "max": {
                                          "description": "Highest amount in this duty range, in this currency.",
                                          "minimum": 0,
                                          "type": "number"
                                        },
                                        "min": {
                                          "description": "Lowest amount in this duty range, in this currency.",
                                          "minimum": 0,
                                          "type": "number"
                                        }
                                      },
                                      "required": ["basis", "currency", "max", "min"],
                                      "type": "object"
                                    }
                                  },
                                  "required": ["converted", "native"],
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The bounded duty estimate when only a range is known; absent otherwise."
                            },
                            "dutyOutcome": {
                              "anyOf": [
                                {
                                  "enum": ["charged", "not_applicable", "estimated", "unknown"],
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "charged when the supplier bills duty, not_applicable when none applies, estimated when only a range is known, unknown when unverified."
                            },
                            "dutySource": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "amount": {
                                      "description": "The supplier's own duty amount, in its own currency.",
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    "currency": {
                                      "description": "The currency the supplier states that duty in.",
                                      "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                                      "type": "string"
                                    }
                                  },
                                  "required": ["amount", "currency"],
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The supplier's own duty charge as it states it; null when none is published."
                            },
                            "facts": {
                              "description": "Labelled facts about this offer, such as print method, size range and quantity.",
                              "items": {
                                "additionalProperties": false,
                                "properties": {
                                  "label": {
                                    "description": "What the fact is about.",
                                    "type": "string"
                                  },
                                  "value": {
                                    "description": "The fact's value.",
                                    "type": "string"
                                  }
                                },
                                "required": ["label", "value"],
                                "type": "object"
                              },
                              "type": "array"
                            },
                            "isYourSupplier": {
                              "description": "The supplier the seller said they use today.",
                              "type": "boolean"
                            },
                            "mostKept": {
                              "description": "Leaves the seller the most per sale; false unless profit is shown and every supplier-billed duty is known.",
                              "type": "boolean"
                            },
                            "note": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "How this offer's configuration differs from the one asked about, in words; null when there is nothing to add."
                            },
                            "price": {
                              "anyOf": [
                                {
                                  "minimum": 0,
                                  "type": "number"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "Product cost in the response currency, before shipping; null when unknown, never 0."
                            },
                            "priceBasis": {
                              "const": "product-and-shipping",
                              "description": "What the delivered total covers: product and shipping.",
                              "type": "string"
                            },
                            "pricingBasis": {
                              "description": "The selected price basis and any setup disclosure, in words.",
                              "type": "string"
                            },
                            "pricingContext": {
                              "additionalProperties": false,
                              "description": "Present when this price only holds under stated conditions, such as a design the seller already has.",
                              "properties": {
                                "basis": {
                                  "description": "What the price assumes: an existing design the seller already has, or included digitisation.",
                                  "enum": ["existing-supplier-digitised-design", "digitisation-included"],
                                  "type": "string"
                                },
                                "newDesignSetup": {
                                  "description": "How a new design's setup is charged, or that it is included.",
                                  "oneOf": [
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "applicability": {
                                          "description": "design-dependent when the fee depends on the artwork, selected when one fee applies to this order.",
                                          "enum": ["design-dependent", "selected"],
                                          "type": "string"
                                        },
                                        "application": {
                                          "const": "not-modelled",
                                          "description": "Always not-modelled: the charge is disclosed but never added to a total.",
                                          "type": "string"
                                        },
                                        "fees": {
                                          "description": "The setup fees the supplier lists.",
                                          "items": {
                                            "additionalProperties": false,
                                            "properties": {
                                              "amount": {
                                                "description": "The fee amount in its own currency.",
                                                "minimum": 0,
                                                "type": "number"
                                              },
                                              "conditions": {
                                                "description": "What must hold for this fee to apply.",
                                                "items": {
                                                  "maxLength": 600,
                                                  "minLength": 1,
                                                  "type": "string"
                                                },
                                                "maxItems": 12,
                                                "type": "array"
                                              },
                                              "currency": {
                                                "description": "Original supplier currency; never converted along with the unit price.",
                                                "enum": ["USD", "EUR", "GBP", "AUD", "CAD"],
                                                "type": "string"
                                              },
                                              "kind": {
                                                "description": "What the fee is for: standard, text-only, image, adjustment, back-or-side or setup.",
                                                "enum": ["standard", "text-only", "image", "adjustment", "back-or-side", "setup"],
                                                "type": "string"
                                              },
                                              "scope": {
                                                "description": "What the fee applies to: per design, per design and area, per order, per unit or unknown.",
                                                "enum": ["per-design", "per-design-and-area", "per-order", "per-unit", "unknown"],
                                                "type": "string"
                                              },
                                              "source": {
                                                "description": "What the supplier states about this fee.",
                                                "maxLength": 600,
                                                "minLength": 1,
                                                "type": "string"
                                              },
                                              "taxBasis": {
                                                "description": "Whether the fee is quoted before VAT (ex-vat) or unclear.",
                                                "enum": ["ex-vat", "unknown"],
                                                "type": "string"
                                              }
                                            },
                                            "required": ["amount", "conditions", "currency", "kind", "scope", "source", "taxBasis"],
                                            "type": "object"
                                          },
                                          "maxItems": 8,
                                          "minItems": 1,
                                          "type": "array"
                                        },
                                        "includedInDeliveredTotal": {
                                          "const": false,
                                          "description": "Always false: setup charges stay outside the delivered total.",
                                          "type": "boolean"
                                        },
                                        "status": {
                                          "const": "listed",
                                          "description": "The supplier lists a setup charge.",
                                          "type": "string"
                                        }
                                      },
                                      "required": ["applicability", "application", "fees", "includedInDeliveredTotal", "status"],
                                      "type": "object"
                                    },
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "conditions": {
                                          "description": "What must hold for the inclusion.",
                                          "items": {
                                            "maxLength": 600,
                                            "minLength": 1,
                                            "type": "string"
                                          },
                                          "maxItems": 12,
                                          "type": "array"
                                        },
                                        "source": {
                                          "description": "What the supplier states about the inclusion.",
                                          "maxLength": 600,
                                          "minLength": 1,
                                          "type": "string"
                                        },
                                        "status": {
                                          "const": "included",
                                          "description": "Digitisation is included, so there is no setup charge.",
                                          "type": "string"
                                        }
                                      },
                                      "required": ["conditions", "source", "status"],
                                      "type": "object"
                                    },
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "reason": {
                                          "description": "Why the setup charge is unknown.",
                                          "maxLength": 600,
                                          "minLength": 1,
                                          "type": "string"
                                        },
                                        "source": {
                                          "description": "What the supplier states, when it says anything.",
                                          "maxLength": 600,
                                          "minLength": 1,
                                          "type": "string"
                                        },
                                        "status": {
                                          "const": "unknown",
                                          "description": "Whether a setup charge applies could not be established.",
                                          "type": "string"
                                        }
                                      },
                                      "required": ["reason", "status"],
                                      "type": "object"
                                    }
                                  ]
                                },
                                "physicalSelections": {
                                  "description": "The supplier options this price was quoted for.",
                                  "items": {
                                    "additionalProperties": false,
                                    "properties": {
                                      "axisId": {
                                        "description": "The option field's id, such as size.",
                                        "maxLength": 200,
                                        "minLength": 1,
                                        "type": "string"
                                      },
                                      "axisLabel": {
                                        "description": "The option field as shown, such as Size.",
                                        "maxLength": 200,
                                        "minLength": 1,
                                        "type": "string"
                                      },
                                      "kind": {
                                        "description": "sku-option changes the unit price; standard-configuration is a fixed default.",
                                        "enum": ["sku-option", "standard-configuration"],
                                        "type": "string"
                                      },
                                      "valueId": {
                                        "description": "The chosen value's id.",
                                        "maxLength": 200,
                                        "minLength": 1,
                                        "type": "string"
                                      },
                                      "valueLabel": {
                                        "description": "The chosen value as shown, such as Adult M.",
                                        "maxLength": 200,
                                        "minLength": 1,
                                        "type": "string"
                                      }
                                    },
                                    "required": ["axisId", "axisLabel", "kind", "valueId", "valueLabel"],
                                    "type": "object"
                                  },
                                  "maxItems": 8,
                                  "type": "array"
                                },
                                "policyId": {
                                  "description": "Which pricing policy this context follows.",
                                  "maxLength": 200,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "policyVersion": {
                                  "description": "The version of that pricing policy.",
                                  "maxLength": 200,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "recurringConditions": {
                                  "description": "What must remain true for this recurring unit price.",
                                  "items": {
                                    "maxLength": 600,
                                    "minLength": 1,
                                    "type": "string"
                                  },
                                  "maxItems": 12,
                                  "type": "array"
                                },
                                "source": {
                                  "description": "What the supplier states about this price, in its own words.",
                                  "maxLength": 600,
                                  "minLength": 1,
                                  "type": "string"
                                }
                              },
                              "required": ["basis", "newDesignSetup", "physicalSelections", "policyId", "policyVersion", "recurringConditions", "source"],
                              "type": "object"
                            },
                            "pricingPlan": {
                              "description": "The supplier plan this price uses, such as Standard pricing.",
                              "type": "string"
                            },
                            "pricingPlanId": {
                              "anyOf": [
                                {
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ],
                              "description": "The stable id of that plan, such as `printify:premium`; pass it back instead of guessing from its name. Null when no price is known."
                            },
                            "product": {
                              "description": "The supplier's own name for the product.",
                              "type": "string"
                            },
                            "productUrl": {
                              "description": "The supplier's page for this product and configuration.",
                              "format": "uri",
                              "type": "string"
                            },
                            "profit": {
                              "anyOf": [
                                {
                                  "oneOf": [
                                    {
                                      "additionalProperties": false,
                                      "properties": {
                                        "dutyStatus": {
                                          "description": "How well the supplier-billed duty is established: known, estimated from bounded quotes, or unknown.",
                                          "enum": ["known", "estimated", "unknown"],
                                          "type": "string"
                                        },
                                        "estimatedDutyDeducted": {
                                          "anyOf": [
                                            {
                                              "minimum": 0,
                                              "type": "number"
                                            },
                                            {
