                    ],
                    "description": "Offset to pass for the next page; null on the last page."
                  },
                  "ok": {
                    "const": true,
                    "type": "boolean"
                  },
                  "options": {
                    "description": "The matching configurations.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "choices": {
                          "additionalProperties": {
                            "type": "string"
                          },
                          "description": "The same choice by field, ready for compare_product `choices`.",
                          "propertyNames": {
                            "type": "string"
                          },
                          "type": "object"
                        },
