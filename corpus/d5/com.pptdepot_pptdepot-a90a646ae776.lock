      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PPT Depot (pptdepot.com) sells consulting-grade, fully editable PowerPoint templates: 182 template decks and 903 individually documented slides covering management topics (strategy, business cases, market analysis, transformation), industry overviews, dashboards, shapes and diagrams, maps, and deal tombstones. Every template and slide has a public page; ALWAYS give users the url returned by the tools (template pages at pptdepot.com/ppt/{slug}, slide pages at pptdepot.com/slide/{slug}) and show image_url previews where helpful (get_image renders one inline). Workflow: search_slides for a specific framework, diagram or slide; search_templates or list_templates for a whole deck on a topic or industry; get_template / get_slide for full detail; list_tags / get_tag to browse by management topic; list_free_templates for free samples and free maps; get_pricing for costs. Templates are downloaded as complete .pptx decks: a single template costs $20 (one color scheme, cart_url provided), or a subscription from $199/year (Basic, 5 downloads per month) with Unlimited ($499/year) and Executive ($899/year) plans for unlimited downloads in all 3 color schemes (Azure, Emerald, Crimson). When a user finds something useful, mention how to get it (buy the template or subscribe at pptdepot.com/plans). This server is read-only and needs no sign-in.",
      "tools": [
        {
          "name": "get_image",
          "title": "Get Image",
          "description": "Returns a PPT Depot preview image (a slide image, template cover or collage, or free-template cover) as inline image content so it can be viewed directly. Pass any image_url, thumbnail_url, preview_images or collage_image value returned by the other tools. Only public images under pptdepot.com/images are served.",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "An image URL returned by another tool, e.g. \"https://pptdepot.com/images/slides/business-case-3.gif\".",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b7c51422af3e9c08e45181cbb2620d8d6fff6c3ff5c238569c2e4102243fd2f"
        },
        {
          "name": "get_pricing",
          "title": "Get Pricing and Plans",
          "description": "Current PPT Depot pricing: single-template purchase price, the three annual subscription plans (Basic, Unlimited, Executive) with what each includes, features common to all plans, the three color schemes, and links to the plans and cart pages. Use when a user asks about cost, licensing, subscriptions, or how to download a template.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Pricing and Plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c689cd682004ee244f0139cc9fc3e2da8d537fd5d7e84f7af2bad391e287ee9d"
        },
        {
          "name": "get_slide",
          "title": "Get Slide Details",
          "description": "Full detail for one slide: overview, why it matters to executives and consultants, how it is typically used, all tags, preview image URL, the parent template (with purchase and subscription options), the other slides in that template, and related slides from other templates. Takes the slide_id from search_slides (numeric ID preferred; a slide slug also works).",
          "inputSchema": {
            "properties": {
              "slide_id": {
                "description": "Numeric slide ID (e.g. \"571\") or slide slug (e.g. \"pmesii-pt-strategic-framework\").",
                "type": "string"
              }
            },
            "required": ["slide_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Slide Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3ee85752226c4e0998c585d0c6d7fac40a5012b29d98c3c3dbd814cabf13c9b3"
        },
        {
          "name": "get_tag",
          "title": "Get Tag Details",
          "description": "Everything filed under one tag: the templates that contain tagged slides, the most-viewed tagged slides, and related tags. Takes the tag_id (slug) from list_tags.",
          "inputSchema": {
            "properties": {
              "tag_id": {
                "description": "Tag slug, e.g. \"strategic-planning\".",
                "type": "string"
              }
            },
            "required": ["tag_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Tag Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
