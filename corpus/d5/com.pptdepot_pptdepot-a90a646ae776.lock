            "readOnly": true
          },
          "digest": "sha256:1f78874acfbc3884f614b9d8e945b90edee241f3db1046778b183529cf906350"
        },
        {
          "name": "get_template",
          "title": "Get Template Details",
          "description": "Full detail for one PowerPoint template deck: description, every slide it contains (title, page URL, preview image), tags, preview images in all three color schemes (Azure, Emerald, Crimson), related templates, and how to get it (single purchase for $20 or subscription). Takes the template_id (slug) from search_templates or list_templates.",
          "inputSchema": {
            "properties": {
              "template_id": {
                "description": "Template slug, e.g. \"business-case\", or numeric deck ID.",
                "type": "string"
              }
            },
            "required": ["template_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Template Details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9affb8f1ec3195748a6b212c379fd96e1428dcbda2c616896bbee72cc88e6a23"
        },
        {
          "name": "list_free_templates",
          "title": "List Free Templates",
          "description": "Free PowerPoint downloads offered by PPT Depot: free country and regional PPT maps, plus free sample template packs. Each has a public page where the file is emailed after entering an email address. Optional keyword filter and type filter (maps or templates). Good for users who want to try before buying.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results to return (default 20, max 60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional keyword, e.g. \"europe\", \"consulting\".",
                "type": "string"
              },
              "type": {
                "description": "Filter to free maps or free template packs (default all).",
                "enum": ["all", "maps", "templates"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Free Templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:424bc46fdfc46d85cb2ce9e82c6b6c4747a906b45f794712846feac3ba8b959e"
        },
        {
          "name": "list_tags",
          "title": "List Tags",
          "description": "Management topics and frameworks used to tag slides (for example Strategic Planning, Risk Management, Digital Transformation), ranked by how many slides carry them. Optional keyword filter on the tag name. Each tag has a public browse page. Use get_tag to see a tag's templates and slides, or pass tag_id to search_slides.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results to return (default 30, max 60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional keyword to filter tag names, e.g. \"risk\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Tags"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45017261a146cbbe1ddc5bcdf7ca1c0a1102b67a343c75a272461696d3f813e8"
        },
        {
          "name": "list_templates",
          "title": "Browse Templates",
          "description": "Browse the template catalog without a keyword: by category (topics, industries, shapes, dashboards, maps, tombstones), newest first, or most popular. With no category, returns templates across all categories. Each category holds roughly 10 to 50 templates, so a category listing is usually complete.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category. Omit for all categories.",
                "enum": ["topics", "industries", "shapes", "dashboards", "maps", "tombstones"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return (default 25, max 60).",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "description": "Sort order (default popular).",
                "enum": ["popular", "newest", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse Templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51628083a2af64ad928d0dc12c81edc177e3cb786ad152f1ed0b41ada556c24f"
        },
        {
          "name": "search_slides",
          "title": "Search Individual Slides",
          "description": "Search the individual slides inside PPT Depot's templates by keyword (slide title, overview text, tags, and parent template name). Each result includes the slide's public page URL, its preview image URL, a short overview, tags, and the parent template. Optional filters: tag_id (from list_tags) and template_id. Use get_slide for the full description of a slide (overview, why it matters, how to use it).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum results to return (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search, e.g. \"SWOT\", \"issue tree\", \"stakeholder map\", \"pricing waterfall\".",
                "type": "string"
              },
              "tag_id": {
                "description": "Optional tag slug filter, e.g. \"strategic-planning\" (see list_tags).",
                "type": "string"
              },
              "template_id": {
                "description": "Optional template slug filter, e.g. \"business-case\" (see search_templates).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Individual Slides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3186bfae9eb4eef340d4cc78ccbce4cb57bad96f0db9616d99646875e079b3eb"
        },
        {
          "name": "search_templates",
          "title": "Search PPT Templates",
          "description": "Search PPT Depot's catalog of consulting-grade PowerPoint template decks by keyword (name, headline, description, and the titles and tags of the slides inside each deck). Optional category filter. Returns relevance-ranked templates with page URL, cover image, slide count, and cart URL. Use this first to find a template_id for get_template. For individual slides or frameworks (for example \"SWOT matrix\" or \"issue tree\"), use search_slides.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional: restrict to one template category.",
                "enum": ["topics", "industries", "shapes", "dashboards", "maps", "tombstones"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return (default 10, max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search, e.g. \"business case\", \"market entry\", \"Texas map\", \"fintech\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search PPT Templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8089ca73b13bb0e8c21f9499255711155e0c0c916c99963dfbf226875b23a902"
        }
      ],
