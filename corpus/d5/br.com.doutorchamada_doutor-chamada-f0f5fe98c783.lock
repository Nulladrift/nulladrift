            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "tema": {
                "description": "como-funciona = how it works, waiting time, video, hours, app; atestado = medical certificates (sick notes); receitas = prescriptions and renewals; exames = exam requests; documentos = receiving and fixing documents; pagamento = price, payment methods, refunds; familia = children and family; seguranca = trust, data protection, document validation; emergencias = when NOT to use telemedicine.",
