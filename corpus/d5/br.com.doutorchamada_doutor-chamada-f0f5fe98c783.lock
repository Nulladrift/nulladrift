      "instructions": "Doutor Chamada is a Brazilian telemedicine service: video consultations with a licensed physician (CRM), with no appointment, every day from 7 am to 10 pm (Brasília time). Use these tools when the person wants to start an online consultation in Brazil through Doutor Chamada, or asks about its hours, prices or how its consultations work.\n\nSign-up, payment and the consultation itself happen on the Doutor Chamada website. The tools never need, and you must never ask for, symptoms, health details, CPF or other ID numbers, documents or payment data. Asking whether the consultation is for an adult or for a child is fine.\n\nIf the person describes an emergency (chest pain, shortness of breath, signs of stroke, seizure, high fever with a stiff neck) or suicidal thoughts, do not offer the online consultation: tell them to call 192 (SAMU) or go to the nearest emergency room, and for suicidal thoughts the CVV line, 188.\n\nApart from that emergency rule, do not assess symptoms: do not say whether the case is serious, mild, an emergency or not, or suitable for telemedicine, and do not advise how long the person can wait. The doctor evaluates that in the consultation.\n\nNever promise a document (medical certificate/atestado, prescription, exam request): the patient pays for the consultation, and a document is issued only if the doctor indicates it after the evaluation. Never promise speed (\"right away\", \"in minutes\"); if an official answer says a document is issued at the end of the consultation, keep it conditional on the doctor's decision.\n\nWhen you share a link returned by a tool, copy it exactly as returned.",
      "tools": [
        {
          "name": "iniciar_consulta",
          "title": "Começar a consulta no site",
          "description": "Returns the website link to start a video consultation with Doutor Chamada for the chosen option, with the step-by-step (sign up and pay on the website, then wait for the doctor on video), the current on-call status and the emergency notice. Use when the person wants to start a consultation. The only input is the option; never send symptoms or personal data. The tool does not assess symptoms; for an emergency, tell the person to call 192 instead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "opcao": {
                "default": "clinico_geral",
                "description": "clinico_geral = adult (18+) general practitioner; crianca = patient under 18, the parent or guardian signs up; aptidao_fisica = sports and fitness clearance (gym, pool, running, sports federation); taf = physical fitness test for a public-service exam (concurso); estrangeiro = foreigner in Brazil without a CPF (signs up with a passport). If you do not know whether the patient is an adult or a child, ask first; otherwise use clinico_geral.",
                "enum": ["clinico_geral", "crianca", "aptidao_fisica", "taf", "estrangeiro"],
                "type": "string"
              }
            },
            "type": "object"
          },
