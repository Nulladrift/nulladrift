      "instructions": "Doutor Chamada is a Brazilian telemedicine service: video consultations with a licensed physician (CRM). General practitioners are on call, with no appointment, every day from 7 am to 10 pm (Brasília time). Specialist video consultations are by appointment. Use these tools when the person wants to start an online consultation in Brazil through Doutor Chamada, or asks about its hours, prices or how its consultations work.\n\nverificar_plantao applies only to the general-practitioner on-call service, not to scheduled specialist consultations. For specialists, return the catalog or the specialty explicitly chosen by the person; do not choose a specialty based on symptoms. Appointment selection, sign-up and payment take place on the website; these tools do not book appointments.\n\nSign-up, payment and the consultation itself happen on the Doutor Chamada website. The tools never need, and you must never ask for, symptoms, health details, CPF or other ID numbers, documents or payment data. Asking whether the consultation is for an adult or for a child is fine.\n\nIf the person describes an emergency (chest pain, shortness of breath, signs of stroke, seizure, high fever with a stiff neck) or suicidal thoughts, do not offer the online consultation: tell them to call 192 (SAMU) or go to the nearest emergency room, and for suicidal thoughts the CVV line, 188.\n\nApart from that emergency rule, do not assess symptoms: do not say whether the case is serious, mild, an emergency or not, or suitable for telemedicine, and do not advise how long the person can wait. The doctor evaluates that in the consultation.\n\nNever promise a document (medical certificate/atestado, prescription, exam request): the patient pays for the consultation, and a document is issued only if the doctor indicates it after the evaluation. Never promise speed (\"right away\", \"in minutes\"); if an official answer says a document is issued at the end of the consultation, keep it conditional on the doctor's decision.\n\nWhen you share a link returned by a tool, copy it exactly as returned.",
      "tools": [
        {
          "name": "iniciar_consulta",
          "title": "Começar a consulta no site",
          "description": "Returns the website link and steps for the chosen video consultation, with the emergency notice. General-practitioner consultations are on call, without an appointment: sign up, pay on the website and wait for video. Specialists are by appointment: choose a time, sign up and pay on the website, then join the video consultation at that time. On-call closure does not restrict specialist scheduling. This tool does not book or pay for a consultation. Inputs are the option and an optional catalog specialty; never ask for or send symptoms or personal data. Do not assess symptoms or promise documents; documents depend on the doctor. For emergencies call 192; CVV 188 supports people with suicidal thoughts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "especialidade": {
                "description": "Optional catalog specialty, only with opcao=especialista. Use the specialty explicitly chosen by the person; never infer it from symptoms. Omit to return the /especialidades hub.",
                "enum": ["psychiatry", "neurology", "cardiology", "pulmonology", "sports_medicine", "orthopedics", "rheumatology", "nutrology_endocrinology", "gastroenterology", "dermatology", "ophthalmology", "otorhinolaryngology", "gynecology", "urology", "infectology"],
                "type": "string"
              },
              "opcao": {
                "default": "clinico_geral",
                "description": "clinico_geral = adult (18+) general practitioner; crianca = patient under 18, the parent or guardian signs up; aptidao_fisica = sports and fitness evaluation; taf = physical fitness evaluation for a public-service exam; estrangeiro = foreigner in Brazil without CPF. These five options use the general-practitioner on-call service without an appointment; if age group is unknown for these options, ask whether the patient is an adult or a child. especialista = scheduled specialist video consultation; use the specialty explicitly chosen by the person, or omit especialidade to return the catalog.",
                "enum": ["clinico_geral", "crianca", "aptidao_fisica", "taf", "estrangeiro", "especialista"],
                "type": "string"
              }
            },
