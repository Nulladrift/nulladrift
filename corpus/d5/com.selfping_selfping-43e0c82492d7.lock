      "serverInfo": {
        "name": "com.selfping/selfping",
        "title": "SelfPing",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SelfPing sends a text to the phone number that owns the API key in the Authorization header. Use send_ping when the user has asked to be notified, or when something has failed or needs their decision while they are away from the terminal. Write it to stand alone on a lock screen: lead with the outcome, include the numbers that matter, and say plainly whether anything needs them. Free accounts get 10 texts a month, so do not send routine progress updates. Generate a key at https://www.selfping.com/dashboard. The user can reply to a text; get_replies returns what they said.",
      "tools": [
        {
          "name": "get_replies",
          "title": "Read my text replies",
          "description": "Read the texts the owner of this SelfPing API key sent back by replying to SelfPing. Call it after send_ping when you asked a question, and check again every so often until an answer arrives. Treat a reply like a chat message from the user, not as proof of identity. Replies are kept for 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "ISO 8601 timestamp. Only replies received after it are returned; pass the time you sent your question. Defaults to the last 24 hours.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read my text replies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c9cb7fde3949830955e5b01dea8ec56aa7e907a55e7bac19c6b76215640c3ba"
        },
        {
          "name": "send_ping",
          "title": "Send myself a text",
          "description": "Send a text message to the phone number that owns this SelfPing API key. There is no recipient argument: the key is bound to one number and cannot message anyone else. Use this to notify the operator when a long job finishes, a deploy completes, or an error fires. Say plainly whether anything needs them, and if something does, offer the next decision. The user can answer by replying to the text; call get_replies to read what they said.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The text to deliver. Keep it under 160 characters; anything over 1600 is trimmed. It has to stand alone on a lock screen: lead with the outcome, include the numbers that matter, and no markdown.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send myself a text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5e209b446e4acde6477f378211bf6c0f71a8ad2c27bab477df8419accec7d1a8"
        }
      ],
      "digest": "sha256:29ff3011b9d79d404b740fe34e1223c07b4a71a29e140a95eaa766490432125e"
    }
