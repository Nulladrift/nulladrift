{
  "lockfileVersion": 2,
  "subjects": {
    "cash.wire/wire-cash": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://wire.cash/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "wire-cash",
        "title": "Wire Cash: bank wire fees and transfer costs",
        "version": "1.0.0",
        "websiteUrl": "https://wire.cash/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Published by Janover Capital LLC. Information only: these tools take no applications and send nothing to lenders. Wire Cash (wire.cash) answers questions about what a wire transfer costs in the US: published wire fees and same-day cutoff times at 17 banks and credit unions (personal accounts) and 9 banks (business accounts), Fedwire hours and 2026 holidays, and World Bank survey costs for sending money to Mexico, India and the Philippines by provider. Bank fees come from each bank's own fee schedule or deposit agreement (schedule dated 2025-05 to 2026-10, read 2026-10-24); provider costs come from World Bank Remittance Prices Worldwide (Q3 2025 survey); reference exchange rates are ECB euro rates crossed to US dollars. Every result carries its source link and date; cite it. A fee of \"not published\" means the bank does not print it, not that it is free. Bank wire fees leave out exchange-rate spreads and intermediary or receiving-bank charges. Nothing returned is a quote, an offer or financial advice: banks change fees without notice and the bank's current schedule governs. Wire Cash is an independent website, not a bank or money transmitter. Data downloads and methods: https://wire.cash/data/",
      "tools": [
        {
          "name": "compare_bank_wire_fees",
          "title": "Compare wire fees across banks",
          "description": "Ranks US banks from lowest to highest published fee for one kind of wire (outgoing or incoming, domestic or international, in dollars or foreign currency), for personal or business accounts. Pass 2 to 17 banks, or none to rank every bank covered. Banks that do not publish the fee or do not offer the wire are listed last with the reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_type": {
                "default": "personal",
                "description": "personal (17 banks) or business (9 banks). Default personal.",
                "enum": ["personal", "business"],
                "type": "string"
              },
              "banks": {
                "description": "Bank names to compare, e.g. [\"Chase\",\"Wells Fargo\",\"Ally\"]. Omit to rank all covered banks.",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 17,
                "minItems": 2,
                "type": "array"
              },
              "wire_type": {
                "description": "Which fee to compare: domestic_outgoing, domestic_incoming, international_outgoing_usd, international_outgoing_foreign_currency or international_incoming.",
                "enum": ["domestic_outgoing", "domestic_incoming", "international_outgoing_usd", "international_outgoing_foreign_currency", "international_incoming"],
                "type": "string"
              }
            },
            "required": ["wire_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare wire fees across banks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b77decbb101be5038232fd181803073091ab45461b34c0c8918dd53007a32ef9"
        },
        {
          "name": "find_cheapest_way_to_send_money",
          "title": "Cheapest way to send money abroad",
          "description": "Ranks money transfer providers by total cost (fee plus exchange-rate margin) for sending $200 or $500 from the US to Mexico, India or the Philippines, from the World Bank Remittance Prices Worldwide survey (Q3 2025), with the corridor average, the ECB reference rate in that currency and providers' published fee rules. Filter by how the recipient gets the money.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount_usd": {
                "default": 200,
                "description": "Amount sent in US dollars: 200 or 500 (the two amounts the World Bank surveys). Default 200.",
                "enum": [200, 500],
                "type": "integer"
              },
              "country": {
                "description": "Destination: Mexico, India or Philippines (country name, ISO code MX/IN/PH or currency MXN/INR/PHP).",
                "maxLength": 20,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many providers to return, cheapest first. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "receiving_method": {
                "description": "Optional: only providers paying out to a bank account, cash pickup or mobile wallet.",
                "enum": ["bank_account", "cash", "mobile_wallet"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest way to send money abroad"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:13bfea2cf161e1de7ba818b0aed4b151d2a528188b0c250bb9c93b472713b9b7"
        },
        {
          "name": "get_bank_wire_fees",
          "title": "Wire transfer fees at one bank",
          "description": "One US bank's published wire fees: outgoing and incoming domestic wires, international wires sent in dollars or in foreign currency, incoming international wires, same-day cutoff times, fee waivers, what the bank says about its exchange rate, the fee schedule date and the source document link. Personal accounts cover 17 banks and credit unions; business accounts cover 9 banks.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account_type": {
                "default": "personal",
                "description": "personal (consumer checking) or business (business checking). Default personal.",
                "enum": ["personal", "business"],
                "type": "string"
              },
              "bank": {
                "description": "Bank name or common short name, e.g. \"Chase\", \"Bank of America\", \"BofA\", \"Navy Federal\", \"Schwab\".",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["bank"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wire transfer fees at one bank"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aed07037ee8eb0af67b7f6515470b9a42c16efca37b7d697d00045b8eac81054"
        },
        {
          "name": "get_wire_cutoff_times",
          "title": "Wire cutoff times and Fedwire hours",
          "description": "Same-day wire cutoff times as each bank publishes them (latest first, Eastern time used for sorting), the Fedwire Funds Service operating hours, and the 2026 Federal Reserve holidays. Pass a date to learn whether it is a Fedwire business day and, if not, the next one. Pass a bank to get only its cutoffs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bank": {
                "description": "Optional bank name, e.g. \"Wells Fargo\". Omit for every bank.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "date": {
                "description": "Optional date in 2026 as YYYY-MM-DD, e.g. 2026-11-27, to check whether Fedwire is open that day.",
                "pattern": "^2026-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Wire cutoff times and Fedwire hours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:095d68312d6fc74942a104afab17272b34985961a0f6a9441ad154a3b7268d79"
        }
      ],
      "digest": "sha256:da26ad75a7ae17847e2e53edabd15866642441d15e150d2d5d1dcfcb62169106"
    }
  }
