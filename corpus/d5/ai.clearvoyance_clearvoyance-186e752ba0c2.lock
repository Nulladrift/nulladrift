        {
          "name": "create_campaign",
          "description": "LEGACY wallet flow — new integrations should use create_account and launch_campaign (API key + prepaid balance, no wallet). (launch_campaign is its equivalent for the key flow.) Creates a new anonymous audio feedback campaign. Two modes: (a) INCENTIVIZED — participants earn USDC rewards; you must fund an escrow address     returned in the response, then call verify_campaign_funding. Participants have 30 days after     the campaign ends to claim; anything unclaimed then goes back to the wallet you signed in with. (b) NO_REWARD — survey only, no crypto rewards; you pay a flat Stripe activation fee     (returned in activationRequired), then call verify_campaign_activation. The accessToken is single-use and is consumed on success. Privacy threshold: minPercent enforces the minimum response rate before results are unlocked (minimum 50%). Campaign expiry: 1–42 days (default 7).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accessToken": {
                "description": "One-time access token from initialize_session (free sessions) or verify_payment",
                "type": "string"
              },
              "cohortEmails": {
                "description": "Email addresses of participants (minimum 2 for privacy)",
                "items": {
                  "format": "email",
                  "type": "string"
                },
                "minItems": 2,
                "type": "array"
              },
              "description": {
                "description": "Short description of the campaign purpose",
                "type": "string"
              },
              "digitalGiftText": {
                "description": "Optional digital gift description shown to NO_REWARD participants (e.g. a discount code)",
                "type": "string"
              },
              "expiresInDays": {
                "description": "Campaign duration in days (1–42, default 7)",
                "maximum": 42,
                "minimum": 1,
                "type": "integer"
              },
              "incentiveCents": {
                "description": "Reward per participant in cents (e.g. 500 = $5.00). Required for INCENTIVIZED.",
                "type": "integer"
              },
              "minPercent": {
                "description": "Minimum response rate (%) required to unlock results. Defaults to 50.",
                "maximum": 100,
                "minimum": 50,
                "type": "number"
              },
              "questions": {
                "description": "List of audio questions for participants to answer",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "text": {
                      "description": "Question text",
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "rewardMint": {
                "description": "SPL token mint address for rewards. Defaults to USDC if omitted.",
                "type": "string"
              },
              "rewardMode": {
                "description": "INCENTIVIZED: crypto rewards per response. NO_REWARD: survey only, flat activation fee.",
                "enum": ["INCENTIVIZED", "NO_REWARD"],
                "type": "string"
              },
              "title": {
                "description": "Campaign title (shown to participants)",
                "type": "string"
              }
            },
            "required": ["accessToken", "cohortEmails", "description", "questions", "rewardMode", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:143972e335876dbfe850225cfa565341278577f9a2557b6da4d7d96d9da1bd9a"
        },
