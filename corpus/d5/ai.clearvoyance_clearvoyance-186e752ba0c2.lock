      "serverInfo": {
        "name": "clearvoyance",
        "title": "Clearvoyance - anonymous feedback from real people",
        "version": "1.1.0",
        "websiteUrl": "https://clearvoyance.ai/aeo#mcp-integration"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Clearvoyance collects anonymous, honest feedback from real people by voice or text and returns the answers plus an AI report. Start with get_pricing, then create_account: mode \"sandbox\" tries everything with a notional $20 balance and sends nothing; \"live\" is for real campaigns. Keep the apiKey it returns - it is shown once and every other tool needs it. A live account needs a top-up first: create_card_topup gives a Stripe link for a person to pay. Then quote_campaign and launch_campaign. kind \"open_link\" returns a share link to put in the user's own post-purchase email (giftText, such as a promo code, is shown after answering); kind \"targeted\" emails one invitation per address. Poll get_campaign; get_campaign_results and analyze_campaign once the privacy threshold is met; close_campaign when done. Money not spent on campaigns stays in the balance for the next one; close_account (preview first, then confirm: true with the owner's agreement) refunds it to the card that paid. Price: a flat price per campaign by size, from $4.99, charged in full at launch whatever it receives. Answers carry no link to the person and are deleted 30 days after the campaign closes. Tools marked LEGACY are the older Solana-wallet flow; use the key flow unless the user is already integrated with it.",
      "tools": [
        {
          "name": "analyze_campaign",
          "title": "Analyse the answers",
          "description": "Runs the AI analysis over every answer so far and returns an executive summary with themes, sentiment and quotes; the report is then also part of get_campaign_results. Re-running with no new answers returns the same report. A sandbox campaign gets the illustrative sample report, marked sample: true.",
