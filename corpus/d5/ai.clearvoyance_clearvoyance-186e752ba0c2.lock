        {
          "name": "create_account",
          "title": "Create an account",
          "description": "Creates an agent account and returns its API key ONCE — store it; it is not kept anywhere and cannot be shown again. No email, no password, nothing personal: the account is a key and a balance. mode 'sandbox' gives a cv_test_ key with $20.00 of notional balance — the same API, no money moves, no email is sent (a sandbox targeted campaign returns its invitation links instead of sending them). mode 'live' (default) starts at $0 and needs a top-up before a campaign can launch. Free; limited to 10 accounts per hour per address.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "label": {
                "description": "Optional name for the account, chosen by you (e.g. 'acme-shop post-purchase bot')",
                "maxLength": 80,
                "type": "string"
              },
              "mode": {
                "description": "Default 'live'. Use 'sandbox' to try everything with a notional balance.",
                "enum": ["live", "sandbox"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
