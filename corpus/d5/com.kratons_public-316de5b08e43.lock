                    },
                    "source": {
                      "enum": ["Zicasso", "Google"],
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["available", "bestRating", "rating", "reviewCount", "source", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["bestRating", "generatedAt", "note", "ratingValue", "reviewCount", "reviews", "sources"],
            "type": "object"
