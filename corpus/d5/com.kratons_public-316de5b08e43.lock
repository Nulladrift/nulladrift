        {
          "name": "request_a_proposal",
          "title": "Request a bespoke proposal",
          "description": "Submit a structured proposal request to Kratons on behalf of a traveller or a travel agent: contact, destinations within Spain/Portugal/Morocco, dates, travellers, total budget, interests. Returns a reference. A human advisor replies by e-mail — there is no automatic booking, no online checkout and no price list. Send idempotencyKey to retry safely.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "description": "E-mail address a human advisor will reply to",
                    "format": "email",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "language": {
                    "description": "Language for the reply (English or Spanish)",
                    "enum": ["en", "es"],
                    "type": "string"
                  },
                  "name": {
                    "description": "Traveller's (or the person to reply to) full name",
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone / WhatsApp number with country code",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "preferredChannel": {
                    "enum": ["email", "phone", "whatsapp", "video_call"],
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "idempotencyKey": {
                "description": "Send the same key to retry safely; the same reference comes back",
                "maxLength": 120,
                "type": "string"
              },
              "requester": {
                "additionalProperties": false,
                "default": {
                  "kind": "ai_agent"
                },
                "properties": {
                  "agentName": {
                    "description": "Name of the assistant or agency submitting this",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "agentVendor": {
                    "description": "Vendor / platform of the assistant (e.g. OpenAI, Anthropic)",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "kind": {
                    "default": "ai_agent",
                    "enum": ["ai_agent", "travel_agent", "traveller"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "socialPostId": {
                "description": "The Kratons social post the traveller came from, when the link carried it",
                "pattern": "^[0-9a-fA-F]{24}$",
                "type": "string"
              },
              "source": {
                "description": "Where this request originated, e.g. \"social\" when the traveller followed a link in one of Kratons' social posts",
                "enum": ["social", "web", "agent", "referral", "other"],
                "type": "string"
              },
              "trip": {
                "additionalProperties": false,
                "properties": {
                  "accommodationStyle": {
                    "maxLength": 200,
                    "type": "string"
