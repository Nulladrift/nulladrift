        {
          "name": "get_reviews",
          "title": "Traveller reviews",
          "description": "Aggregate rating (1–5) and the newest traveller reviews of Kratons from Zicasso and Google, each attributed to the platform that published it, with a link to read them all. A source that cannot be read is listed as unavailable — never invented.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
