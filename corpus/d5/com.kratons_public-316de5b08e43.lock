        {
          "name": "get_proposal_request_status",
          "title": "Status of a proposal request",
          "description": "Where a submitted proposal request stands (received, being prepared, proposal sent, confirmed, closed), looked up by the reference returned when it was submitted. Returns the stage, dates and the reply commitment; no personal data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "The reference returned by request_a_proposal, e.g. PR-20260916-U8GB",
                "pattern": "^PR-\\d{8}-[A-Za-z0-9]{4}$",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lastUpdateAt": {
                "description": "ISO timestamp",
                "type": "string"
              },
              "nextStep": {
                "type": "string"
              },
              "receivedAt": {
                "description": "ISO timestamp",
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "slaBusinessDays": {
                "type": "integer"
              },
              "status": {
                "enum": ["received", "being_prepared", "proposal_sent", "confirmed", "closed"],
                "type": "string"
              },
              "statusText": {
                "type": "string"
              }
            },
            "required": ["lastUpdateAt", "nextStep", "receivedAt", "reference", "slaBusinessDays", "status", "statusText"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Status of a proposal request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:89325bfff9bb71f5b679fa71cc24d1b41ca5a6449317a8f0b61be36e6ed81829"
