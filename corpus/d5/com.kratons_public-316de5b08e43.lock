                "description": "Weighted average over the available sources, 1–5",
                "type": ["number", "null"]
              },
              "reviewCount": {
                "type": "integer"
              },
              "reviews": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "countries": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "date": {
                      "$ref": "#/properties/sources/items/properties/url"
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "rating": {
                      "type": "number"
                    },
                    "reviewer": {
                      "description": "As published by the platform",
                      "type": "string"
                    },
                    "source": {
                      "enum": ["Zicasso", "Google"],
                      "type": "string"
                    },
                    "title": {
                      "$ref": "#/properties/sources/items/properties/url"
                    },
                    "url": {
                      "$ref": "#/properties/sources/items/properties/url"
