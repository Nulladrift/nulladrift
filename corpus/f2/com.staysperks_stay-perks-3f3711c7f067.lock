        },
        {
          "name": "create_booking",
          "description": "Get the steps to book a hotel, cruise or experience found with search_trips. Geisel Power, the Virtuoso advisor, quotes it in writing within 24 hours (rate, taxes, the hotel's cancellation policy and the perks) and books only after the traveler approves. This tool sends nothing itself (request_sent: false). Hotel bookings carry no fee and nothing is charged by Stay Perks: the traveler pays the hotel directly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "num_nights": {
                "default": 1,
                "type": "number"
              },
              "traveler_info": {
                "additionalProperties": false,
                "properties": {
                  "agent_note": {
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "full_name": {
                    "type": "string"
                  },
                  "num_travelers": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "phone": {
                    "type": "string"
                  },
                  "special_requests": {
                    "type": "string"
                  }
                },
                "required": ["email", "full_name", "num_travelers"],
                "type": "object"
              },
              "trip_id": {
                "type": "string"
              }
            },
            "required": ["traveler_info", "trip_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c6bf4c7d7e80f82a6d6d430f3cf4feda8950c10a3313e7b4fd5ae0817374f98"
        },
        {
          "name": "create_booking_session",
          "title": "Start a booking (UCP lodging)",
          "description": "WRITE. Opens a UCP lodging booking session from a quoted offer (stay_id from get_availability_quote). Returns the authoritative total, the cancellation policy (show it to the traveler), the Virtuoso amenities, the payment term (pay at the hotel) and evidence. Nothing is charged; the session is held until the quote expires.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "minimum": 1,
                "type": "integer"
              },
              "booker": {
                "additionalProperties": false,
                "description": "Lead traveler (legal name + email). Without it the session stays \"incomplete\".",
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "first_name": {
                    "type": "string"
                  },
                  "last_name": {
                    "type": "string"
                  },
                  "phone_number": {
                    "type": "string"
                  }
                },
                "required": ["email", "first_name", "last_name"],
                "type": "object"
              },
              "children": {
                "minimum": 0,
                "type": "integer"
              },
              "property_id": {
                "type": "string"
              },
              "stay_id": {
                "description": "stay_id of a quoted offer",
                "type": "string"
              }
            },
            "required": ["property_id", "stay_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e1ed078bd0307d824f5c98bed8cde96a8a60502348933627239136f8dbb59b6a"
        },
        {
          "name": "get_availability_quote",
          "title": "Check a stay quote",
          "description": "READ. Returns the status of a quote from search_availability: \"pending\" (try again later), \"quoted\" (offers with stay_id, full total, cancellation terms), \"unavailable\", or \"expired\". Use an offer's stay_id with create_booking_session.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "quote_id": {
                "description": "Quote id returned by search_availability",
                "type": "string"
              }
            },
            "required": ["quote_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
