        },
        {
          "name": "get_booking_session",
          "title": "Check a booking",
          "description": "READ. Current state of a booking session: ready_for_complete (awaiting the traveler's approval), complete_in_progress (the advisor is placing the reservation), completed (includes the hotel's own confirmation number; the traveler is also emailed), or canceled.",
