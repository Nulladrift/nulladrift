        {
          "name": "get_trip_details",
          "description": "Get the details of a hotel, package, cruise or private experience from search_trips, with a hotel's Virtuoso perks. Virtuoso records carry no published rate or availability; the advisor quotes those in writing within 24 hours.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "trip_id": {
                "description": "trip_id from search_trips, or a hotel's virtuoso_property_id",
                "type": "string"
              }
            },
            "required": ["trip_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac708bd031b0594636a8ac550994decbb2709d1003383bfb0489b565af00f8e8"
        },
        {
          "name": "request_itinerary",
          "description": "WRITE. Send Geisel Power, the Virtuoso advisor, the traveler's request for a Journey (Journeys by Geisel Power: a whole trip she plans, books and confirms, usually from about $15,000 to $20,000) or a hotel stay (Stay Perks Reserve, no minimum). Call it only after the traveler has agreed to share their name, email and trip details with Geisel Power, and set traveler_consented to true. Returns a reference and what happens next: Geisel replies to a Journeys request the same day, with the full proposal after a discovery call, and to a hotel request in writing within 24 hours; some requests also get a link to book a 30-minute call with her (call_url). Nothing is booked or charged. Hotel bookings carry no fee and the traveler pays the hotel directly; a Journey carries a planning fee, which depends on the trip's length and complexity and which Geisel explains on the discovery call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destinations": {
                "description": "Where: places, regions or hotels (\"Amalfi Coast, Lake Como\")",
                "type": "string"
              },
              "email": {
                "description": "The traveler's email: Geisel replies there",
                "format": "email",
                "type": "string"
              },
              "flexibility": {
                "description": "How flexible the dates are: exact (Exact dates), few-days (A few days either way), month (Any time in a month), open (Open, advise me)",
                "enum": ["exact", "few-days", "month", "open"],
                "type": "string"
              },
              "kind": {
                "description": "journey (the default): a whole trip Geisel designs; hotel: a hotel stay only",
                "enum": ["journey", "hotel"],
                "type": "string"
              },
              "name": {
                "description": "The traveler's full name",
                "type": "string"
              },
              "notes": {
                "description": "Anything else the traveler wants Geisel to know",
                "type": "string"
              },
              "occasion": {
                "description": "What the trip is for: anniversary (Anniversary or honeymoon), birthday (A milestone birthday), family (Family or multigenerational trip), celebration (Another celebration), business (Business with some leisure), escape (Simply time away)",
                "enum": ["anniversary", "birthday", "family", "celebration", "business", "escape"],
                "type": "string"
              },
              "travel_dates": {
                "description": "When (\"10 to 20 May 2027\", \"late spring\")",
                "type": "string"
              },
              "traveler_consented": {
                "const": true,
                "description": "true, and only once the traveler has agreed to share these details with Geisel Power",
                "type": "boolean"
              },
              "travelers": {
                "description": "Who is traveling (\"2 adults, 1 child\")",
                "type": "string"
              },
              "trip_budget": {
                "description": "The whole trip's budget in USD, for a Journey: under-15k (Under $15,000), 15k-20k ($15,000 to $20,000), 20k-50k ($20,000 to $50,000), 50k-plus ($50,000 or more). No budget is needed for a hotel stay",
                "enum": ["under-15k", "15k-20k", "20k-50k", "50k-plus"],
                "type": "string"
              }
            },
            "required": ["email", "name", "traveler_consented"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6df643fb70f8c3351e8cd138e43b38bbc119c66ae2a5c0a711913f9c9fc2ea4d"
        },
        {
          "name": "search_availability",
          "title": "Request a stay quote (Virtuoso perks)",
          "description": "WRITE. Ask Geisel Power, the Virtuoso advisor, to price a stay at a Virtuoso hotel (property_id from search_trips). Virtuoso data carries no live rates, so pricing is asynchronous: this returns a quote id with status \"pending\" and a quote_due_by time (within 24 hours); poll get_availability_quote. A firm offer includes the full total, taxes and fees, the hotel's cancellation policy, and the Virtuoso amenities (e.g. breakfast for two, a hotel credit, an upgrade, subject to availability). Nothing is reserved or charged by this call, and hotel bookings carry no fee.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Number of adults",
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "description": "Number of children",
                "minimum": 0,
                "type": "integer"
              },
              "end_date": {
                "description": "Check-out date, YYYY-MM-DD",
                "type": "string"
              },
              "property_id": {
                "description": "Virtuoso property id (virtuoso_property_id) from search_trips",
                "type": "string"
              },
              "start_date": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["adults", "end_date", "property_id", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef85509faf4fda37a2d4c671efe918703e65c924472300c350e97faa439e83e9"
        },
        {
          "name": "search_trips",
          "description": "Search 2,000+ Virtuoso hotels, plus packages, cruises and private experiences, by place, brand or kind of stay. Results show whether Virtuoso perks apply, a trip_id for get_trip_details, and how to book. No live rates: the advisor quotes them.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "budget_usd": {
                "description": "Max budget in USD",
                "type": "number"
              },
              "check_in": {
                "description": "Check-in date (ISO 8601)",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date (ISO 8601)",
                "type": "string"
              },
              "destination": {
                "description": "A city, region or country (\"Paris\", \"Tuscany\", \"Caribbean\"), a hotel or brand (\"Four Seasons\"), both (\"Four Seasons Paris\"), or a kind of stay (\"beach\", \"safari\")",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, up to 50 (default 10)",
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Results to skip, for the next page",
                "minimum": 0,
                "type": "integer"
              },
              "trip_type": {
                "description": "hotel_only (the default), fixed_package, cruise, service (private experiences) or custom_itinerary",
                "enum": ["hotel_only", "fixed_package", "cruise", "service", "custom_itinerary"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
