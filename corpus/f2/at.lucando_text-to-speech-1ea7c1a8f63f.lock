      "serverInfo": {
        "name": "lucando-text-to-speech",
        "title": "Lucando Text to Speech",
        "version": "1.0.0",
        "websiteUrl": "https://lucando.at/text-to-speech/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Lucando turns German text into natural speech (10 German voices, made in Austria, EU AI Act watermark) and returns download links. Typical use: phone announcements, voice-overs for videos and training, reading texts aloud. list_voices returns the voice ids, text_to_speech charges the user's monthly character balance, and get_balance shows what is left.",
      "tools": [
        {
          "name": "get_balance",
          "title": "Guthaben anzeigen",
          "description": "Show the user's Lucando plan and how many characters are left this month (1 character of text = 1 character; transcription costs 300 characters per started minute). Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Guthaben anzeigen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b03bb97d312b60d3660ec4c46235497f5c99af84eb42111179eb57e4737b6f50"
        },
        {
          "name": "get_job",
          "title": "Auftrag abrufen",
          "description": "Get the status of a Lucando job (text_to_speech or a transcription started on lucando.at) and, when finished, the download link(s); for transcriptions also the text. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job id returned by text_to_speech or list_recent_jobs.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Auftrag abrufen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c3f75c4d64f6df6be3098ed291a465df28e1e7d508558adba7c7379d4a1b61b"
        },
        {
          "name": "list_recent_jobs",
          "title": "Letzte Aufträge",
          "description": "List the user's 10 most recent Lucando jobs (speech and transcriptions) with id, kind, status and date, newest first. Read-only. Download links come from get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Letzte Aufträge"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b82db92de6100a91eb1ec2cfe73f4d795f5990a48787be892e264250cfa5f276"
        },
        {
          "name": "list_voices",
          "title": "Stimmen auflisten",
          "description": "List the German text-to-speech voices available in the user's Lucando account (public voices and the user's own cloned voices). Returns voice id, name, gender, style, typical use and a public MP3 sample link. The voice id is the value text_to_speech expects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stimmen auflisten"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c782c8e9382fc7265975d59f2eb5247d9b0dcc82721bfe2008063c5a507c39d"
        },
        {
          "name": "text_to_speech",
          "title": "Text vorlesen lassen",
          "description": "Turn German text into speech with a Lucando voice and return a download link to the audio file (valid 24 hours). Uses the user's character balance (one character per character of text; pause marks like [Pause 2 s] are free). Max 20,000 characters per call. Formats: mp3 (default), wav, telefon (WAV 8 kHz for phone systems), alaw, ulaw. If the file is not ready within about 25 seconds, the result contains the job id and its status, and get_job returns the link once it is done. Every file carries an inaudible 'AI-generated' watermark as required by the EU AI Act.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "enum": ["mp3", "wav", "telefon", "alaw", "ulaw"],
                "type": "string"
              },
              "speed": {
                "description": "Speaking speed, 1.0 = normal.",
                "maximum": 1.2,
                "minimum": 0.8,
                "type": "number"
              },
              "text": {
                "description": "German text to speak. Numbers and dates are spoken in German words.",
                "maxLength": 20000,
                "type": "string"
              },
              "voice": {
                "description": "Voice id from list_voices. Optional; default is the most used public voice.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Text vorlesen lassen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:178a91fd8514120f6e5c93768ed0731414a1d639bb8dc4f8b29a3a0ce59b6532"
        }
      ],
      "digest": "sha256:a5e341cca89f0fd940d03baab20f8fb0f691d8508599c43e97a5e0f448534de0"
    }
