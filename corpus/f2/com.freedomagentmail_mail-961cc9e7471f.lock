{
  "lockfileVersion": 2,
  "subjects": {
    "com.freedomagentmail/mail": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://freedomagentmail.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "freedomagentmail",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Disposable, receive-only email inboxes. Typical flow: create_inbox -> use the address (e.g. in a sign-up form) -> wait_for_email with the token -> use the returned code or verification link.",
      "tools": [
        {
          "name": "create_inbox",
          "description": "Create a new disposable email inbox. Returns its address, password and a token for the other tools. Inboxes are receive-only and are kept until deleted. Save the address and password: tokens expire, and login_inbox gets a new one.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional domain. Defaults to the first available domain.",
                "type": "string"
              },
              "how_you_found_us": {
                "description": "Optional, but appreciated: in a sentence, how you found this service and why you chose it over alternatives (e.g. \"found in the MCP registry; no API key needed\"). Please don't include personal or secret information.",
                "type": "string"
              },
              "username": {
                "description": "Optional part before the @. A random name like brave-otter-4821 if omitted.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1dc44b9a635fdc5aa58e6ff4824959c5735fa7a8a7e8a223ac8bc62a3f12627"
        },
        {
          "name": "delete_inbox",
          "description": "Delete an inbox and all of its email immediately.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "The inbox token returned by create_inbox.",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f9a16f3ba4031211bbc9e5f365c69641cb788679d136bebcd66db65f4aab2a44"
        },
        {
          "name": "list_emails",
          "description": "List the most recent emails in an inbox (newest first), with codes, without full bodies.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "The inbox token returned by create_inbox.",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:851ef5fb3923b8d4c57adaedba005e4d647f774fab8305f453737913dc85e866"
        },
        {
          "name": "login_inbox",
          "description": "Get a fresh token for an existing inbox (tokens expire; inboxes don't).",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "password": {
                "type": "string"
              }
            },
            "required": ["address", "password"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:771ccdd316d8e58710e82bbc668ca2d02e1c12c88ba2666ea408788dd43b423b"
        },
        {
          "name": "read_email",
          "description": "Read one email in full: plain text, codes, links and attachment names.",
          "inputSchema": {
            "properties": {
              "message_id": {
                "type": "string"
              },
              "token": {
                "description": "The inbox token returned by create_inbox.",
                "type": "string"
              }
            },
            "required": ["message_id", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd21e40c52f80ca820ceff30d319d12d3b920ee64dfb79e42bd57ecd0ad4c2b6"
        },
        {
          "name": "wait_for_email",
          "description": "Wait for unread email in an inbox and return it, including extracted one-time codes and verification links. Returns immediately if unread mail exists. Each message is returned once; it is marked read afterwards.",
          "inputSchema": {
            "properties": {
              "timeout_seconds": {
                "description": "How long to wait (0-60). Default 30.",
                "type": "number"
              },
              "token": {
                "description": "The inbox token returned by create_inbox.",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e601486cce960c5c500a77adebd96ae7a1c2444ebfe23b4171fd1a225f10b7c9"
        }
      ],
      "digest": "sha256:61d3f48b643a77b5233b3b9b9570891378860ba4a58ae77969b9cad9c1ae3900"
    }
  }
}
