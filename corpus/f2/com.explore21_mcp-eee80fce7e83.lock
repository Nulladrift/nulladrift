          },
          "digest": "sha256:55eb0bf9fe82512265bc850b13b8fb437c10eea47c85763fd9dd3608cd147737"
        },
        {
          "name": "long_term_snapshot",
          "title": "Long-term snapshot",
          "description": "Where Bitcoin stands today for a long-term holder: BTC daily close (USD); MVRV ratio; MVRV Z-Score; Realized price (USD); Short-term holder realized price (USD); % of supply in profit; Mayer Multiple; 200-week moving average (USD); Price vs 200-week moving average (%); Puell Multiple; Hashrate, 7-day average (H/s); Mining difficulty; Average block interval per epoch (seconds). Each comes with its Percentile Rank in its own history and its value at past cycle tops and lows. Long-term context for Bitcoin holders, not trading signals. Show the closing \"Source:\" line to the user.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
