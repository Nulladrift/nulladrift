      "serverInfo": {
        "name": "explore21-mcp",
        "title": "Explore21 MCP",
        "version": "1.0.0",
        "websiteUrl": "https://charts.explore21.com/data"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Bitcoin on-chain data from Explore21 (realized price, MVRV, HODL waves and more), computed from our own Bitcoin Core node. Long-term context for Bitcoin holders, not trading signals. Show the closing \"Source:\" line to the user. Start with long_term_snapshot for \"where are we now\".",
      "tools": [
        {
          "name": "explain_metric",
          "title": "Explain a metric",
          "description": "What a metric measures, its columns and units, its method version and every change to how it is computed, and its chart page. Long-term context for Bitcoin holders, not trading signals. Show the closing \"Source:\" line to the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The metric id, e.g. bitcoin-realized-price.",
                "enum": ["bitcoin-mvrv-z-score", "bitcoin-price", "bitcoin-mayer-multiple", "bitcoin-200-week-moving-average", "bitcoin-hodl-waves", "bitcoin-hashrate", "bitcoin-mining-difficulty", "bitcoin-puell-multiple", "bitcoin-block-interval", "bitcoin-block-size", "bitcoin-transactions-per-day", "bitcoin-mvrv-ratio", "bitcoin-realized-price", "bitcoin-percent-supply-in-profit", "bitcoin-realized-cap", "bitcoin-realized-profit-loss"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9cfc4b4a12ad10635966f34ce6809ba63385bd160b541a1f3a30cdda11db196f"
        },
        {
          "name": "get_metric",
          "title": "Get a metric",
          "description": "One metric's daily values as CSV, oldest first. Without from/to it returns the last 365 days; pass from (and to) as yyyy-MM-dd for other ranges. Use list_metrics for the ids. Long-term context for Bitcoin holders, not trading signals. Show the closing \"Source:\" line to the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "First UTC day, yyyy-MM-dd.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "id": {
                "description": "The metric id, e.g. bitcoin-mvrv-ratio.",
                "enum": ["bitcoin-mvrv-z-score", "bitcoin-price", "bitcoin-mayer-multiple", "bitcoin-200-week-moving-average", "bitcoin-hodl-waves", "bitcoin-hashrate", "bitcoin-mining-difficulty", "bitcoin-puell-multiple", "bitcoin-block-interval", "bitcoin-block-size", "bitcoin-transactions-per-day", "bitcoin-mvrv-ratio", "bitcoin-realized-price", "bitcoin-percent-supply-in-profit", "bitcoin-realized-cap", "bitcoin-realized-profit-loss"],
                "type": "string"
              },
              "to": {
                "description": "Last UTC day, yyyy-MM-dd.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dfd6477bcbbbbc092c2098bf8f74d6686d1259111a12a026dcadc41ea7c9f4cb"
        },
        {
          "name": "list_metrics",
          "title": "List metrics",
          "description": "Every Bitcoin metric Explore21 publishes, with its id and what it measures. Long-term context for Bitcoin holders, not trading signals. Show the closing \"Source:\" line to the user.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
