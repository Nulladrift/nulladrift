          },
          "digest": "sha256:95dff11458a7a69f736549a6bae295a2cd85c0c384c4db29357aa4c3d52f3c37"
        },
        {
          "name": "search_learn",
          "title": "Search Learn and Guides",
          "description": "Find Explore21's teaching pages: the course «Биткойн от нулата» (Bitcoin from zero), the guides and the glossary words, in English and Bulgarian. Returns titles, links and a short excerpt; link the page rather than retelling it. Show the closing \"Source:\" line to the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Which language comes first; guessed from the query if left out.",
                "enum": ["en", "bg"],
                "type": "string"
              },
              "query": {
                "description": "The words to search for, in English or Bulgarian.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
