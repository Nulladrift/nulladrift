        {
          "name": "cron_next_runs",
          "description": "Explain a 5- or 6-field cron expression in plain English and list its next run times in a time zone (as ISO 8601 and Unix timestamps). Use to answer \"when does this cron job run next?\" or to validate an expression.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "How many upcoming runs to return. Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "expression": {
                "description": "Cron expression, e.g. \"0 9 * * 1-5\".",
                "type": "string"
              },
              "from": {
                "description": "Start evaluating after this date/time (ISO 8601). Defaults to now.",
                "type": "string"
              },
              "timezone": {
                "description": "Zone the schedule is evaluated in. Defaults to UTC.",
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "description": {
                "description": "Plain-English reading of the expression.",
                "type": "string"
              },
              "expression": {
                "type": "string"
              },
              "next_runs": {
                "items": {
                  "properties": {
                    "epoch_seconds": {
                      "type": "integer"
                    },
                    "iso": {
                      "type": "string"
                    },
                    "utc_iso": {
                      "type": "string"
                    },
                    "weekday": {
                      "type": "string"
                    }
                  },
                  "required": ["epoch_seconds", "iso", "utc_iso", "weekday"],
                  "type": "object"
                },
                "type": "array"
              },
              "timezone": {
                "type": "string"
              }
            },
            "required": ["description", "expression", "next_runs", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Next cron runs"
          },
          "behavior": {
