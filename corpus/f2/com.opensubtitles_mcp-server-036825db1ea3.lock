      },
      "instructions": "Find and download subtitles from OpenSubtitles.com. Start with search_subtitles (by filename, title, IMDb/TMDB id with season/episode, or moviehash) and pass languages. Use search_features to disambiguate titles, get_subtitle_details to inspect a result for free, and download_subtitle only for the file you want: each download uses the user's daily quota. Credentials are configured in the client, never passed as tool arguments; never ask the user for a password in chat. Guide: opensubtitles://guide/intelligent-search.",
      "tools": [
        {
          "name": "download_subtitle",
          "title": "Download subtitle",
          "description": "Download one subtitle file by file_id and return its text (or a temporary link), with optional format conversion, FPS conversion or time shift. Each call uses one download from the user's daily OpenSubtitles quota, so pick the file with search_subtitles first; the result reports the remaining quota.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "delivery": {
                "default": "content",
                "description": "content = return the subtitle text; link = return only a temporary download URL (for large files or saving to disk)",
                "enum": ["content", "link"],
                "type": "string"
              },
              "file_id": {
                "description": "file_id from search_subtitles or get_subtitle_details",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "in_fps": {
                "description": "Frame rate the subtitle was timed for (use with out_fps)",
                "exclusiveMinimum": 0,
                "maximum": 240,
                "type": "number"
              },
              "out_fps": {
                "description": "Frame rate of your video (use with in_fps)",
                "exclusiveMinimum": 0,
                "maximum": 240,
                "type": "number"
              },
              "sub_format": {
                "description": "Convert to this format. Omit to keep the original (usually srt).",
                "enum": ["srt", "webvtt", "sub", "mpl", "dfxp", "txt"],
                "type": "string"
              },
              "timeshift": {
                "description": "Shift all cues by this many seconds, e.g. 2.5 or -1",
                "maximum": 3600,
                "minimum": -3600,
                "type": "number"
              }
            },
            "required": ["file_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Subtitle text (delivery=content)",
                "type": ["string", "null"]
              },
              "file_id": {
                "type": "number"
              },
              "file_name": {
                "type": ["string", "null"]
              },
              "format": {
                "type": ["string", "null"]
              },
              "link": {
                "description": "Temporary download URL (valid for a few hours)",
                "type": "string"
              },
              "mime_type": {
                "type": "string"
              },
              "quota": {
                "additionalProperties": false,
                "properties": {
                  "remaining": {
                    "description": "Downloads left today",
                    "type": ["number", "null"]
                  },
                  "requests": {
                    "description": "Downloads used in the current period",
                    "type": ["number", "null"]
                  },
                  "reset_time": {
                    "type": ["string", "null"]
                  },
                  "reset_time_utc": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["remaining", "requests", "reset_time", "reset_time_utc"],
                "type": "object"
              },
              "size_bytes": {
                "type": ["number", "null"]
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["content", "file_id", "file_name", "format", "link", "mime_type", "quota", "size_bytes", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Download subtitle"
          },
          "behavior": {
            "destructive": false,
