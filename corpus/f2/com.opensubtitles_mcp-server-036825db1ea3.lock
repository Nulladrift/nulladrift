            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "feature_id": {
                "description": "feature.feature_id of the same search result",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "language": {
                "description": "The subtitle's language (speeds up the lookup)",
                "pattern": "^[A-Za-z]{2,3}(-[A-Za-z]{2,4})?$",
                "type": "string"
              },
              "related_limit": {
                "default": 5,
                "description": "How many related subtitles (same title and language) to return, 0-20",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "subtitle_id": {
                "anyOf": [
                  {
                    "pattern": "^\\d{1,12}$",
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  }
                ],
                "description": "subtitle_id from search_subtitles"
              }
            },
            "required": ["feature_id", "subtitle_id"],
            "type": "object"
