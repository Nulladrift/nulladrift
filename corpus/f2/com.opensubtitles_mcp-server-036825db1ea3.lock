        {
          "name": "search_subtitles",
          "title": "Search subtitles",
          "description": "Find subtitles for a movie or TV episode and get file_ids to download. Search by title (query), video filename, IMDb/TMDB/feature id with optional season/episode, or moviehash; filter by language and flags. Results are ranked with exact title, episode and release-name matches first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "episode_number": {
                "description": "TV episode number within season_number",
                "maximum": 9999,
                "minimum": 0,
                "type": "integer"
              },
              "exact_title": {
                "default": true,
                "description": "When searching by title, first resolve it to the exact movie/show (so \"The Matrix\" does not return \"The Matrix Revisited\"). Set false for a fuzzy text search.",
                "type": "boolean"
              },
              "feature_id": {
                "description": "OpenSubtitles feature id from search_features. With season_number/episode_number it is the show's id.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "filename": {
                "description": "Video filename, e.g. \"Chicago.Fire.S14E01.1080p.WEB.h264-ETHEL.mkv\". Parsed with guessit-js into title/year/season/episode; its release name ranks matching subtitles first.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "foreign_parts_only": {
                "default": "include",
                "description": "Subtitles that only cover foreign-language dialogue",
                "enum": ["include", "exclude", "only"],
                "type": "string"
              },
              "hearing_impaired": {
                "default": "include",
                "description": "Subtitles for the deaf and hard of hearing (SDH)",
                "enum": ["include", "exclude", "only"],
                "type": "string"
              },
              "imdb_id": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "pattern": "^(tt)?\\d{1,10}$",
                    "type": "string"
                  }
                ],
                "description": "IMDb id (tt0133093 or 133093). With season_number/episode_number it is the show's id."
              },
              "include_ai_translated": {
                "default": true,
                "description": "Include AI-translated subtitles",
                "type": "boolean"
              },
              "include_machine_translated": {
                "default": false,
                "description": "Include machine-translated subtitles (usually low quality)",
                "type": "boolean"
              },
              "languages": {
                "description": "Subtitle languages in order of preference, e.g. [\"en\", \"pt-BR\"]. Omit for all languages.",
                "items": {
                  "description": "Language code as listed by list_languages, e.g. en, de, pt-BR, zh-CN",
                  "pattern": "^[A-Za-z]{2,3}(-[A-Za-z]{2,4})?$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "moviehash": {
                "description": "OpenSubtitles hash of the video file (calculate_file_hash in local mode). Exact file matches are flagged moviehash_match and ranked first.",
                "pattern": "^[0-9a-fA-F]{16}$",
                "type": "string"
              },
              "order_by": {
                "default": "relevance",
                "description": "relevance = exact title/episode and release-name matches first, then popularity",
                "enum": ["relevance", "download_count", "upload_date", "rating", "votes"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Result page, starting at 1",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 20,
                "description": "Results per page (1-100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Title to search for, e.g. \"The Matrix\". Not needed when an id, moviehash or filename is given.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "season_number": {
                "description": "TV season number; use with episode_number and the show's query or id",
                "maximum": 999,
                "minimum": 0,
                "type": "integer"
              },
              "tmdb_id": {
                "description": "TMDB id. With season_number/episode_number it is the show's id.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "trusted_only": {
                "default": false,
                "description": "Only subtitles from trusted uploaders",
                "type": "boolean"
              },
              "type": {
                "description": "Restrict to movies or TV episodes",
                "enum": ["movie", "episode", "all"],
                "type": "string"
              },
              "year": {
                "description": "Release year, to tell remakes and same-name titles apart",
                "maximum": 2100,
                "minimum": 1870,
                "type": "integer"
              }
            },
            "type": "object"
          },
