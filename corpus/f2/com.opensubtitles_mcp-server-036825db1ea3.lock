        {
          "name": "search_features",
          "title": "Find movies and TV shows",
          "description": "Look up movies, TV shows and episodes on OpenSubtitles (title, year, IMDb/TMDB/feature ids, seasons and episode counts, subtitle counts per language). Use it to disambiguate a title before search_subtitles, or to find a show's seasons and episodes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "feature_id": {
                "description": "OpenSubtitles feature id",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "imdb_id": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "pattern": "^(tt)?\\d{1,10}$",
                    "type": "string"
                  }
                ],
                "description": "IMDb id (tt0133093 or 133093)"
              },
              "include_episodes": {
                "default": false,
                "description": "List every episode (title, feature_id, IMDb id) per season for TV shows",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Title, e.g. \"Chicago Fire\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "tmdb_id": {
                "description": "TMDB id",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "type": {
                "default": "all",
                "description": "Restrict to movies, TV shows or episodes",
                "enum": ["movie", "tvshow", "episode", "all"],
                "type": "string"
              },
              "year": {
                "description": "Release year",
                "maximum": 2100,
                "minimum": 1870,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "features": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "episode_number": {
                      "type": ["number", "null"]
                    },
                    "feature_id": {
                      "type": "number"
