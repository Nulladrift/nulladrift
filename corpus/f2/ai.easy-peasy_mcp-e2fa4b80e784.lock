        {
          "name": "generate_image",
          "title": "Generate or edit image",
          "description": "Generate or edit an image with Easy-Peasy.AI. Synchronous — returns image URL(s) when generation finishes (can take up to a few minutes). Uses image credits and requires a paid plan for API access. To edit existing images, pass their URLs in source_images; model then picks the edit model. display_media shows the returned image IDs in an embedded gallery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dimensions": {
                "description": "Aspect ratio such as \"1:1\", \"16:9\" or \"9:16\" (supported ratios vary by model), or a pixel size \"WIDTHxHEIGHT\" such as \"1792x1024\" (default \"1024x1024\"). Nano Banana 2, Nano Banana Pro and GPT Image models map a pixel size to the nearest aspect ratio they support; other models may not, so prefer an aspect ratio.",
                "type": "string"
              },
              "model": {
                "description": "Image model name. For new images, e.g. \"Nano Banana 2\" (default), \"Nano Banana Pro\", \"FLUX.2 [max]\", \"OpenAI GPT Image 2.6 Flare Medium\", \"OpenAI GPT Image 2.5 Flare Medium\", \"OpenAI GPT Image 2 Medium\", \"Seedream 5.0 Pro\", \"Seedream 5.5\". With source_images, model also picks the edit model, so it must be one of the edit models (a subset), e.g. \"Nano Banana 2\", \"Nano Banana Pro\", \"OpenAI GPT Image 2.6 Flare Medium\", \"OpenAI GPT Image 2.6 Sunburst Medium\", \"OpenAI GPT Image 2.5 Flare Medium\", \"OpenAI GPT Image 2.5 Sunburst Medium\", \"Seedream 5.0 Pro\", \"Seedream 5.5\", \"FLUX.2 [max]\" or \"Qwen Image\"; any other name is rejected with the list of edit models. Omit model when editing to use \"OpenAI GPT Image 2.6 Flare Medium\".",
                "type": "string"
              },
              "outputs": {
                "description": "Number of images to generate (default 1).",
                "type": "number"
              },
              "prompt": {
                "description": "Description of the image to generate.",
                "type": "string"
              },
              "resolution": {
                "description": "For models that support it: \"1K\" or \"2K\".",
                "type": "string"
              },
              "source_images": {
                "description": "Optional image URLs to edit/transform (image-to-image). Up to 10.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "style": {
                "description": "Optional style preset name.",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "media": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "model": {
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["processing", "completed", "failed"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["image", "video"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
