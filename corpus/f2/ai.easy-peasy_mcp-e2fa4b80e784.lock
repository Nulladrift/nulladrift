      "serverInfo": {
        "name": "easy-peasy-ai",
        "title": "Easy-Peasy.AI",
        "version": "1.3.4",
        "description": "Generate text, images, videos, speech, and transcriptions with Easy-Peasy.AI.",
        "websiteUrl": "https://easy-peasy.ai/mcp",
        "icons": [
          {
            "src": "https://easy-peasy.ai/images/marky_square%20Background%20Removed.png",
            "mimeType": "image/png",
            "sizes": ["1080x1080"]
          }
        ]
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Use Easy-Peasy.AI tools only when the user asks to create, retrieve, or transform content with their account. Generation tools consume the user’s Easy-Peasy.AI credits or quotas. Prefer list/get tools to resolve template, voice, and generation details before starting a paid generation. After generating images or starting a video, use display_media with the returned IDs to show the results. The viewer can check an existing video’s progress. Keep a result link available for clients without embedded UI.",
      "tools": [
        {
          "name": "display_media",
          "title": "Show generated images or videos",
          "description": "Show Easy-Peasy.AI images in an embedded gallery or videos in an embedded player. Use IDs returned by generate_image, get_image, generate_video, or get_video. Can display a processing video and check its progress. Reads existing results in the connected account; does not generate content or spend credits. Clients without embedded UI still receive the media links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "Existing image or video IDs to display, in order (up to 8).",
                "items": {
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "media_type": {
                "enum": ["image", "video"],
                "type": "string"
              }
            },
            "required": ["ids", "media_type"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "media": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "model": {
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["processing", "completed", "failed"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["image", "video"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "used_credits": {
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["id", "status", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["media"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://easy-peasy/media-viewer-v3.html",
            "openai/toolInvocation/invoked": "Your media is ready to view",
            "openai/toolInvocation/invoking": "Loading your media…",
            "securitySchemes": [
