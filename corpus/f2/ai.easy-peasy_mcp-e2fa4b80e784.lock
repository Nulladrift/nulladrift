        {
          "name": "list_templates",
          "title": "List writing templates",
          "description": "List a page of Easy-Peasy.AI writing templates (presets), optionally filtered by category. Returns slug, title, description, and category, plus total, categories, and next_offset (null on the last page). Use get_template to inspect a known slug directly, then generate_text to run it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category name to filter templates by.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum results to return (default 20, maximum 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Start position. Use next_offset from the previous result to read another page.",
                "minimum": 0,
                "type": "integer"
              }
