        {
          "name": "generate_text",
          "title": "Generate text",
          "description": "Generate text with an Easy-Peasy.AI template (preset). Synchronous — returns the generated text. Uses the account word quota and requires available API token allowance. Call get_template first to learn which fields a template accepts; pass template-specific fields via extra_fields (e.g. {\"extra1\": \"...\"}).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "extra_fields": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Template-specific fields keyed by field name from get_template, e.g. {\"extra1\": \"value\"}.",
                "type": "object"
              },
              "keywords": {
                "description": "Main topic / input text for the template. Required by almost all templates.",
                "type": "string"
              },
              "language": {
                "description": "Output language name in English, e.g. \"English\", \"Spanish\".",
                "type": "string"
              },
              "outputs": {
                "description": "How many variations to generate (default 1).",
                "type": "number"
              },
              "preset": {
                "description": "Template slug, e.g. \"blog-post-intro\" (see list_templates).",
                "type": "string"
              },
              "tone": {
                "description": "Optional tone of voice, e.g. \"Friendly\".",
                "type": "string"
              }
            },
            "required": ["preset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
