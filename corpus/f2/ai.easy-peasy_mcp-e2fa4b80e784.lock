        {
          "name": "list_voices",
          "title": "List text-to-speech voices",
          "description": "List a page of text-to-speech voices (id, name, language, accent), including the account’s custom/cloned voices. Filter by language and optionally accent. Returns total and next_offset (null on the last page). Choose a suitable returned id and pass it as voice_id to generate_speech; additional pages are optional.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accent": {
                "description": "Optional accent filter.",
                "type": "string"
