        {
          "name": "generate_video",
          "title": "Generate video",
          "description": "Start an AI video generation. Defaults to MiniMax H3 Max: 5 seconds, 768p, native audio, 4 credits per second at 768p. With an image and no model, uses MiniMax H3 Max Image. ASYNC — returns a video id. display_media shows the video and checks its progress in an embedded player; get_video also checks that same id. Uses video credits (billed per second of output).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Aspect ratio, e.g. \"16:9\" (default), \"9:16\", \"1:1\".",
                "type": "string"
              },
              "duration": {
                "description": "Clip length in seconds as a string. MiniMax H3 Max supports \"5\" through \"15\" (default \"5\"). Veo 3.1 supports only \"4\", \"6\", or \"8\" seconds. Must be supported by the selected model. If omitted, uses a supported model default.",
                "type": "string"
              },
              "generate_audio": {
                "description": "Whether to generate a soundtrack on models with an audio toggle. MiniMax H3 Max always generates audio and cannot accept false. For a silent video, select a model with an audio toggle, such as Veo 3.1 Fast.",
                "type": "boolean"
              },
              "image": {
                "description": "Optional image URL used as the first frame. With no model, selects MiniMax H3 Max Image. For an explicit model, select the matching Image variant.",
                "type": "string"
              },
              "model": {
                "description": "Optional video model. Omit for \"MiniMax H3 Max\" (or \"MiniMax H3 Max Image\" when image is supplied). Other examples: \"Veo 3.1\", \"Veo 3.1 Fast\", \"Seedance 2.5\", \"Seedance 2.0 Mini\". An explicit model is used as supplied; choose its Image variant for image-to-video.",
                "type": "string"
              },
              "prompt": {
                "description": "Description of the video to generate.",
                "type": "string"
              },
              "resolution": {
                "description": "Model-dependent output resolution. MiniMax H3 Max supports \"768p\" (default) or \"480p\". Other models may support \"720p\", \"1080p\", or \"2k\".",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "media": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "model": {
                      "type": "string"
                    },
                    "prompt": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["processing", "completed", "failed"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["image", "video"],
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "used_credits": {
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["id", "status", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["media"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
