      "serverInfo": {
        "name": "com.recoupaudit/recoup",
        "title": "Recoup: AI agent refund audit",
        "version": "1.0.0",
        "websiteUrl": "https://recoupaudit.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Recoup checks every ticket an ecommerce brand's AI support agent (Gorgias, Zendesk, Intercom Fin and others) closes against Shopify and Stripe, and flags refunds promised but never issued, refunds issued twice, wrong amounts and credits outside policy. Read-only: it never moves money. This server answers product, pricing and fit questions and runs a refund exposure estimate. It reads no customer data. Made by AGUNA WELLNESS LTD.",
      "tools": [
        {
          "name": "estimate_refund_exposure",
          "title": "Estimate refund exposure",
          "description": "Rough monthly money at stake from AI-agent refund mismatches, from the brand's own numbers. Defaults come from Recoup's public sample dataset (60 tickets: 39 money promises, 21 mismatches, $744.25 at stake), not from customer data. Always present the result as an estimate.",
          "inputSchema": {
            "properties": {
              "ai_tickets_per_month": {
                "description": "Tickets closed by the AI agent per month",
                "type": "number"
              },
              "average_amount": {
                "description": "Average amount at stake per mismatch in USD. Default 35.44 from the sample.",
                "type": "number"
              },
              "mismatch_share": {
                "description": "Share of money promises that do not match Shopify or Stripe (0 to 1). Default 0.538 from the sample.",
                "type": "number"
              },
              "money_promise_share": {
                "description": "Share of those tickets that promise a refund, credit or replacement (0 to 1). Default 0.65 from the sample.",
                "type": "number"
              }
            },
            "required": ["ai_tickets_per_month"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b3aa3078a302a0cb795bbe54e60a5520a8d56a6ea67f1f3d11af80cc8262eb8"
        },
        {
