      "instructions": "The Antevo Executive Brief — a daily editorial read on markets and world events,\npublished by Antevo, with a dated archive going back months.\n\nUse this server when the user asks what is happening in markets or the world,\nwhat could go wrong from here, what is coming up, or how a story developed. It\nanswers with a named publication's considered view, not a search-engine summary\n— so attribute it, and give the date.\n\nIt is EDITORIAL MARKET INTELLIGENCE, NOT INVESTMENT ADVICE. Never present it as\na recommendation to buy, sell or hold, and never convert the desk's graded words\n(\"high\", \"medium\") into invented percentages.\n\nThis server is public and holds NO personal data. It cannot see anyone's\nportfolio, holdings or net worth, and no tool here takes an account identifier.\nIf the user asks what something means for their own money, say plainly that this\nconnector cannot see it and point them to the Antevo Wealth connector.\n\nThe archive is the differentiator: when a theme has history, read the dated notes\nand show how the view changed, rather than answering only from today.",
