{
  "lockfileVersion": 2,
  "subjects": {
    "com.localaiprices/localaiprices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://localaiprices.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "localaiprices",
        "title": "Local AI Prices",
        "version": "1.0.0",
        "websiteUrl": "https://localaiprices.com/agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prices, stock and measured LLM speeds (tokens per second) for local AI computers and graphics cards, from localaiprices.com. Prices are checked once a day. Show the page link and the check time with any price. Speeds are public results by others; keep the source link. Read-only: nothing here can buy anything.",
      "tools": [
        {
          "name": "find_for_model",
          "title": "Machines for a model",
          "description": "Which tracked machines can run an open model (4-bit weights fit in memory), cheapest first, with measured tok/s where someone has published a result. Use list_models for ids.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price in the region's currency.",
                "type": "number"
              },
              "measured_only": {
                "description": "Only machines with a published speed for this model.",
                "type": "boolean"
              },
              "model": {
                "description": "Model id or name, e.g. gpt-oss-120b or Qwen3 Coder 30B A3B.",
                "type": "string"
              },
              "region": {
                "description": "us = prices in USD, eu = prices in EUR. Default us.",
                "enum": ["us", "eu"],
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Machines for a model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d43abb0be5016b6171d3fdc9235c8895ec810a1ec011cf92b50ef5a7b52f872"
        },
        {
          "name": "get_machine",
          "title": "Get one machine",
          "description": "One machine in full by id (from search_machines) or page URL: price per store with stock and check time, price history summary, every published speed result with its source, and value.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Machine id, e.g. framework-desktop-128, or its localaiprices.com/p/<id>/ URL.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one machine"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0d3d7a9a8807d4d8583d9d2d15c8a7b43d4943ce892292bd3df06e271d0782f5"
        },
        {
          "name": "list_changes",
          "title": "What changed",
          "description": "Price drops, price rises, restocks and newly tracked machines, newest first. Set since to a timestamp and only later changes come back; reuse next_since from the reply for the next call. Prices are checked once a day.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "machine": {
                "description": "Only changes for this machine id.",
                "type": "string"
              },
              "since": {
                "description": "ISO date or time; only changes after it. Omit for all.",
                "type": "string"
              },
              "types": {
                "description": "Only these kinds of change.",
                "items": {
                  "enum": ["price_drop", "price_rise", "back_in_stock", "out_of_stock", "new_machine"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What changed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82e8defae3689ec2d10501a55a478b6dab5cdc06356ce9df25fbbd95e707003f"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "The open models we track: id, size, memory needed at 4-bit and 8-bit, how many machines fit each and how many have a measured speed, and the page URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d9a5242244a4236a5ed572b13d4995e0a491dd179f035ae7882e1cd2c262f0b"
        },
        {
          "name": "search_machines",
          "title": "Search machines",
          "description": "Find local AI computers and graphics cards by budget, memory and type. Returns price, measured tok/s, value (tok/s per 1,000 of currency), when the price was checked, and the page URL. Prices are checked once a day.",
          "inputSchema": {
            "properties": {
              "benchmark": {
                "description": "Speed to use: small = Llama-2 7B Q4_0 (default, most results), large = gpt-oss-120b (needs 64GB+).",
                "enum": ["small", "large"],
                "type": "string"
              },
              "in_stock_only": {
                "description": "Leave out machines a store reports as out of stock.",
                "type": "boolean"
              },
              "kind": {
                "description": "machine = complete computer, gpu-card = graphics card only (needs a PC). Default any.",
                "enum": ["machine", "gpu-card", "any"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price in the region's currency.",
                "type": "number"
              },
              "min_memory_gb": {
                "description": "Least memory (unified memory or VRAM) in GB, e.g. 128.",
                "type": "number"
              },
              "region": {
                "description": "us = prices in USD, eu = prices in EUR. Default us.",
                "enum": ["us", "eu"],
                "type": "string"
              },
              "sort": {
                "description": "value = tok/s per 1,000 (default), price = cheapest first, speed = fastest first.",
                "enum": ["value", "price", "speed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search machines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5d79e48406a5a7a129a69b74408c4ac0fcda7d2fef51be20fe3d2bc827e62db"
        }
      ],
      "digest": "sha256:2d83a39f784f763eb0aa6f33317ffeda0cedfd4018e0223aea7494888dffb943"
    }
  }
}
