        },
        {
          "name": "insurance_companies_in_state",
          "description": "List the property and casualty insurers on a state's regulator lists: admitted (licensed) companies and eligible surplus lines insurers, with NAIC numbers and licensed lines. Optional filters: status 'ad' or 'sl', and a line of business.",
          "inputSchema": {
            "properties": {
              "line": {
