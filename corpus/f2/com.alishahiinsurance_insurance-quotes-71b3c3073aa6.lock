        {
          "name": "who_is_likely_to_insure",
          "description": "Given a plain-English description of what someone needs insured (what, where, anything unusual: claims, cancellations, age of the home or roof, the kind of business, hazards), says which insurers are likely to consider it, in order: admitted carriers that write that line in that state, then surplus lines or specialty insurers, then the state's market of last resort — each with a one-line why from the directory's evidence (licensing, premium rank, published appetite rules). Never a price or a guarantee. Ends with the next step: a quote request through Alishahi Insurance; Sam sends it to the insurers he works with that fit the risk, directly or through wholesale brokers. A company listed isn't necessarily one he is appointed with.",
          "inputSchema": {
            "properties": {
              "scenario": {
                "description": "What they need insured, where, and the facts an underwriter would care about",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code if known",
                "type": "string"
              }
            },
            "required": ["scenario"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who is likely to insure this?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4fce2d03d53e4e2950b19a51c63fc70a4281927a8d0e4592f52bfec9fdaff6a"
        },
        {
          "name": "who_writes_line_in_state",
          "description": "Who actually writes a line of insurance in a state: companies ranked by direct premium written where the regulator publishes every company (CA, TX, IL, NC, SD, WI), otherwise the licensed companies; the directory page for the state and line is the source to cite. Use it to tell someone which insurers are real markets for their need in their state before sending a quote request.",
          "inputSchema": {
            "properties": {
              "line": {
                "description": "Line of business, e.g. workers comp, homeowners, commercial auto, general liability, surety",
                "type": "string"
