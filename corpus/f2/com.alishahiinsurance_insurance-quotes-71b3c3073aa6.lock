        },
        {
          "name": "get_application",
          "title": "Get an application Sam started",
          "description": "Read a quote application Sam Alishahi started from the person's email: every field, its allowed choices, what's filled in and what's still required. The application_id and token are in Sam's reply email (Reference APP-<id>).",
          "inputSchema": {
            "additionalProperties": false,
