        {
          "name": "submit_quote_request",
          "title": "Send quote request to Sam Alishahi",
          "description": "Send the person's quote request to Sam Alishahi, a licensed independent insurance broker, who will contact them. Only call after the person has confirmed they want to be contacted. Use real values from the person; if a field is unknown, leave it out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Answers keyed by question name from get_quote_questions. Select questions must use one of the listed choices.",
                "type": "object"
              },
              "contact_consent": {
                "description": "True only after the person confirmed they want Sam Alishahi to contact them about this request by phone or email.",
                "type": "boolean"
              },
              "coverage": {
                "description": "Coverage name from list_coverages.",
                "type": "string"
              },
              "email": {
                "description": "Email address.",
                "type": "string"
              },
              "name": {
                "description": "Full name.",
                "type": "string"
              },
              "notes": {
                "description": "Anything else the person wants Sam to know, such as deadlines or lender requirements.",
                "type": "string"
              },
              "phone": {
                "description": "Mobile phone number.",
                "type": "string"
              },
              "zip": {
                "description": "ZIP code of the property or business.",
                "type": "string"
              }
            },
