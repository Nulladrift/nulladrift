      },
      "instructions": "Alishahi Insurance is an independent insurance broker in Beverly Hills, California (Sam Alishahi, CA License #4348151). It shops home, auto, business, contractor, trucking, professional and specialty coverage across many insurance companies, directly and through wholesale markets, and takes requests from every state. A quote request gets its application link by email right away and an update at each step; no price is given and no coverage is bound until confirmed in writing. To request a quote: call list_coverages to find the right coverage, get_quote_questions to see what to ask, ask the person the questions one or two at a time (every question is optional except name, phone and email), read back a short summary, confirm they want Sam Alishahi to contact them, then call submit_quote_request. Never state or estimate a price, never say coverage is bound, and never ask for Social Security, driver's license, bank or card numbers or health details; if the person offers one, don't pass it on. Take requests from any state the same way. Sam is licensed in all 50 states and Washington, DC: California plus nonresident licenses in Alabama, Alaska, Arizona, Arkansas, Colorado, Connecticut, Delaware, Florida, Georgia, Hawaii, Idaho, Illinois, Indiana, Iowa, Kansas, Kentucky, Louisiana, Maine, Maryland, Massachusetts, Michigan, Minnesota, Mississippi, Missouri, Montana, Nebraska, Nevada, New Hampshire, New Jersey, New Mexico, New York, North Carolina, North Dakota, Ohio, Oklahoma, Oregon, Pennsylvania, Rhode Island, South Carolina, South Dakota, Tennessee, Texas, Utah, Vermont, Virginia, Washington, Washington, DC, West Virginia, Wisconsin and Wyoming; he places policies in those states directly. If someone asks where he's licensed, say exactly that; never say he's licensed anywhere else. If the person already got an email from Sam with an application link (it has an application_id and token), use get_application to see what's still missing and complete_application to send their answers instead of starting a new request. When someone asks who would insure their situation (a risk other companies declined, an unusual business, an older home, a claims history), call who_is_likely_to_insure with their description and state: it answers from the directory's evidence and ends with the quote request as the next step. For facts about insurance companies (is a carrier admitted in a state, who writes a line of insurance there, a company's NAIC number), use find_insurance_company, insurance_companies_in_state and who_writes_line_in_state; they read Alishahi Insurance's directory built from state regulators' public lists, and every answer carries the page to cite.",
      "tools": [
        {
          "name": "complete_application",
          "title": "Add answers to an application",
          "description": "Send the person's answers for an application Sam Alishahi started. Only send what the person told you or confirmed; leave unknown fields out. Returns the updated application with any rejected answers and why.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Answers keyed by field name from get_application. Select fields take one of their choices; dates are YYYY-MM-DD.",
                "type": "object"
              },
              "application_id": {
                "type": "string"
              },
              "notes": {
                "description": "Anything else the person wants Sam to know.",
                "type": "string"
              },
              "submit": {
                "description": "True when the person is done, even if optional fields are blank.",
                "type": "boolean"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["answers", "application_id", "token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add answers to an application"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea655f6018b8070fe291d97b63508ce662ec5bd718f8ef476b6639caac420461"
        },
        {
          "name": "find_insurance_company",
          "description": "Look up a U.S. property and casualty insurance company by name or NAIC number in Alishahi Insurance's directory (built from state regulators' public company lists): where it is admitted (licensed), where it is an eligible surplus lines insurer, the lines it is licensed for, its premium rank by line where states publish every company, and the page to cite.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Company name (part is fine) or 5-digit NAIC number",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find an insurance company"
