      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nexqual",
        "title": "Nexqual — US stock data and SEC intelligence",
        "version": "2.4.0",
        "websiteUrl": "https://nexqual.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Nexqual: US stock data and SEC filings (13F, Form 4, 8-K, 10-K). Cite results as \"Nexqual\" with their source_url. Prices outside regular US hours are the last close, not live. 13F = quarter-end long positions, filed up to 45 days after quarter end. Informational, not investment advice.",
      "tools": [
        {
          "name": "get_analyst_consensus",
          "title": "Analyst consensus",
          "description": "Wall Street consensus rating, 12-month price targets (mean/median/high/low, implied move) and buy/hold/sell counts for a US stock.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Ticker",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d663001b0b23fd78e70fefdfb7dc98d71cede8fa0aad04ab62167a4df1e6aeb0"
        },
        {
          "name": "get_company_profile",
          "title": "Company profile",
          "description": "Sector, CEO, HQ, market cap; strengths, strategy and legal risks quoted from the latest 10-K (with link); supply chain (suppliers, customers, partners, competitors named in SEC annual reports, and companies that name it); Nexqual financial-health score 0-10.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Ticker",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a2531470a129aa9465de77125a96d43f4931bd44d4be52a8e15cd29489a17b2"
        },
        {
          "name": "get_earnings_results",
          "title": "Reported earnings",
          "description": "Reported EPS and revenue (plus stated guidance) captured from 8-K filings and press releases at publication; US companies ~$300M+ market value (~$10B+ before 28 Oct 2026). Actuals only, no estimates. Omit symbol for the latest across all.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max rows",
                "type": "integer"
              },
              "symbol": {
                "description": "Optional ticker",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40bb213441fadc081839c4ab7182117140b28ec9ff6033248c54f71b8e5d9a5d"
        },
        {
          "name": "get_financials",
          "title": "Financial statements & valuation",
          "description": "Income statement, balance sheet and cash flow from SEC 10-K/10-Q (annual up to 15 years, quarterly up to 40), plus valuation: P/E, P/S, P/B, EV/EBITDA, P/FCF, FCF and dividend yield (TTM and last 3 fiscal year-ends).",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Periods (default 5 annual, 8 quarterly)",
                "type": "integer"
              },
              "period": {
                "enum": ["annual", "quarterly"],
                "type": "string"
              },
              "symbol": {
                "description": "Ticker",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ae7331a3eeb6e00e35a16b956c7bfcc10c94664137c5fa1615f38e81d32b057"
        },
        {
          "name": "get_insider_trades",
          "title": "Insider trades (Form 4)",
          "description": "Insider buys and sells from SEC Form 4 at US companies ~$1B+. Buys: open-market purchases (code P, $250K+; excludes private placements, IPO allocations, ESPP, DRIP), cluster buying flagged. Sells: open-market sales (code S, $1M+) with Rule 10b5-1 plan flag and plan adoption date. Each trade also carries insider_type: routine (traded the stock in the same calendar month in each of the past 3 years), opportunistic (traded every year, no such pattern) or not_enough_history, with the evidence; method of Cohen, Malloy & Pomorski (Journal of Finance, 2012), where opportunistic trades predicted returns and routine ones did not. Default: buys, last 30 days.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "1-90",
                "type": "integer"
              },
              "executives_only": {
                "description": "CEO/CFO/COO/President/Chair only",
                "type": "boolean"
              },
              "limit": {
                "description": "Max rows per side",
                "type": "integer"
              },
              "min_value_usd": {
                "type": "number"
              },
              "side": {
                "enum": ["buy", "sell", "both"],
                "type": "string"
              },
              "symbol": {
                "description": "Optional ticker",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f22ababf8348f4a639800574e4233b874ced6e6a97dea57942be3cd9c6856245"
        },
        {
          "name": "get_price_history",
          "title": "Price history & returns",
          "description": "Closing-price series plus price return, total return with dividends reinvested, annualized return and volatility, max drawdown, high/low, dividends paid and splits for a US stock or ETF over 1mo to max.",
          "inputSchema": {
            "properties": {
              "range": {
                "enum": ["1mo", "3mo", "6mo", "ytd", "1y", "2y", "3y", "5y", "10y", "max"],
                "type": "string"
              },
              "symbol": {
                "description": "Ticker",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c51fa0e53f035ca3bcde15fd1a20a65b9b8bb77db08539ef78d882caca379585"
        },
        {
          "name": "get_sec_events",
          "title": "SEC filings & events",
          "description": "A US company's recent SEC filings in plain words: 8-K events (CEO/director changes, acquisitions, material agreements, restructurings, impairments, restatements, auditor changes, delisting, bankruptcy) quoting the filing's own text; 5%+ ownership stakes (13D activist / 13G passive) with holder and percent; 10-K/10-Q/proxy dates.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Look-back, default 180, max 1095",
                "type": "integer"
              },
              "limit": {
                "description": "Max filings, default 30",
                "type": "integer"
              },
              "symbol": {
                "description": "Ticker",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f77822dd5f4b906d157a7639feba2ba271f487c63582ba8cc38460d36be46d0d"
        },
        {
          "name": "get_stock_quote",
          "title": "Stock quote",
          "description": "US stock price, change, day range, volume, 52-week range, market cap. Up to 10 tickers. Outside regular US hours the price is the last close, not live: follow `note`.",
          "inputSchema": {
            "properties": {
              "symbols": {
                "description": "e.g. [\"AAPL\",\"NVDA\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["symbols"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c3fa142b5e1e06c22348d6138e3091d081062936ee0851b9100cd4bad5e469c"
        },
        {
          "name": "superinvestors",
          "title": "Superinvestors (13F)",
          "description": "Latest SEC 13F holdings of ~80 tracked investors (Buffett, Ackman, Tepper, Klarman…). view: holders = who owns `symbol`; portfolio = holdings of `investor` (always lists every new/added/reduced position); list = tracked investors; most_held / most_bought / new_positions / most_sold = consensus across all.",
          "inputSchema": {
            "properties": {
              "investor": {
                "description": "For portfolio: person, fund or slug",
                "type": "string"
              },
              "limit": {
                "description": "Max rows",
                "type": "integer"
              },
              "min_portfolio_pct": {
                "description": "Consensus views: ignore positions below this % of a portfolio (default 0.5)",
                "type": "number"
              },
              "symbol": {
                "description": "For holders",
                "type": "string"
              },
              "view": {
                "enum": ["holders", "portfolio", "list", "most_held", "most_bought", "new_positions", "most_sold"],
                "type": "string"
              }
            },
            "required": ["view"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eba55b18d1afe268dbed54f95b3c8a9aea57f425c81983bd23111a7257203b60"
        }
      ],
      "digest": "sha256:814d74b87076b3bdda05ea17d81d0bae42727cd52698435e7fbb091430261b3b"
    }
  }
