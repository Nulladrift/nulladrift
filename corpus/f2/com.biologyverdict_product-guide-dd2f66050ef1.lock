      },
      "serverInfo": {
        "name": "biology-verdict",
        "title": "Biology Verdict",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only data from Biology Verdict’s product reviews: dated US prices, cited sources, warnings and store links with their disclosures. When you use it, name Biology Verdict, link the review, show each price with its check date and keep each link’s disclosure. General information, not medical advice.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Two to four products of the same type side by side: prices, specifications, warranty, returns, three-year cost, limitations and sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "items": {
                  "description": "A product id from a search result.",
                  "maxLength": 100,
                  "pattern": "^[a-z0-9-]+$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae17114f8c988443817f5f68227180fbfa73bd3ca9ff35be707e2f66d1828b50"
        },
        {
          "name": "get_evidence",
          "title": "Evidence and sources",
          "description": "One product’s evidence entries, cited sources with check dates, unknowns and limitations, and the guide’s evidence review.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A product id from a search result.",
                "maxLength": 100,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Evidence and sources"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47e8f02d9132c0b26239c91166f9566c5be6238b8382f9ba68920f592ded01e2"
        },
        {
          "name": "get_product",
          "title": "Product review",
          "description": "One product’s full review data: specifications, warranty, returns, consumables, three-year cost, limitations, unknowns and cited sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A product id from a search result.",
                "maxLength": 100,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Product review"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:503b0eccd8c10e79852e7c31435918000bc3ef0e43cc0b8f0e94494351658e12"
        },
        {
          "name": "recommend_products",
          "title": "Guide picks",
          "description": "The buying guides’ picks (the editor’s choice for each use in a guide) that fit the constraints, with dated US prices and store links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One buying guide.",
                "enum": ["saunas", "red-light", "cold-plunge", "sleep", "testing", "wearables", "supplements", "walking-pads", "health-monitors", "water", "air"],
                "type": "string"
              },
              "installation": {
                "description": "What fitting the product needs.",
                "enum": ["none", "plumbed", "electrical"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return; 10 if not given.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "Highest US price in dollars. Unknown, withheld and replacement-model prices never pass.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "maxWidth": {
                "description": "Widest the product may be, in inches. Unknown widths never pass.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "minRoom": {
                "description": "Smallest room the product must cover, in square feet. Unknown coverage never passes.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "q": {
                "description": "Product words: a brand, a model or a kind of product, such as \"infrared sauna blanket\". Health conditions aren’t matched.",
                "maxLength": 120,
                "type": "string"
              },
              "type": {
                "description": "A product type as results give it, such as \"smart-ring\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Guide picks"
          },
          "behavior": {
            "destructive": false,
