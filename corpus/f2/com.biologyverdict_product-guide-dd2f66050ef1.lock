            "readOnly": true
          },
          "digest": "sha256:b416ee1ce685c5702361437d25ffe994239b92b6f47974fb9285646d897bf107"
        },
        {
          "name": "running_cost",
          "title": "Running cost",
          "description": "What a product costs to own over 1 to 10 years: purchase, installation, consumables and electricity. A cost the review doesn’t know is named, never counted as zero.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A product id from a search result.",
                "maxLength": 100,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "kwhRate": {
                "description": "Electricity price in dollars per kWh; 0.18 if not given.",
                "maximum": 1,
                "minimum": 0.05,
                "type": "number"
              },
              "years": {
                "description": "Years to cover; 3 if not given.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
