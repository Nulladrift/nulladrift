        },
        {
          "name": "campaign_request",
          "title": "Start a study: request a quoted campaign",
          "description": "No key needed. Sends a study request to a person and returns a request_id, the tier that fits, the price band, what we still need from you, the next step and the claim scope. Nothing is run or charged. Call it after reading a guide.",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "description": "Where the reply goes",
                "type": "string"
              },
              "customer_type": {
                "description": "mineral-processing | dark-proteins | alloys | semiconductor | other",
                "enum": ["mineral-processing", "dark-proteins", "alloys", "semiconductor", "other"],
                "type": "string"
              },
              "data_rules": {
                "description": "How the data and results may be used, kept or shared",
                "type": "string"
              },
              "grid": {
                "description": "Free text: compositions x temperatures, or ligands x pockets (e.g. 3 ligands x 1 receptor)",
                "type": "string"
              },
              "inputs_available": {
                "description": "What you can supply now, e.g. bath range, AlphaFold model, ligand list, alloy composition range",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "organization": {
                "description": "Optional",
                "type": "string"
              },
              "question": {
                "description": "One paragraph: the decision the study feeds",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["contact_email", "customer_type", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a study: request a quoted campaign"
          },
          "behavior": {
