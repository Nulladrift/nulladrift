        {
          "name": "capabilities",
          "title": "What the runner can do",
          "description": "Capability manifest of the hosted runners: LAMMPS version, installed packages, and every style by category with gpu=true (KOKKOS-accelerated) or gpu=false (exists, but runs on the pod's CPU cores at the GPU rate). Default = compact summary; runner=lammps&full=true returns the whole style table. Use preflight_deck to check a specific deck.",
          "inputSchema": {
            "properties": {
              "full": {
                "description": "Include the full style table (large)",
                "type": "boolean"
              },
              "runner": {
                "description": "lammps | openmm; omit for all",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
