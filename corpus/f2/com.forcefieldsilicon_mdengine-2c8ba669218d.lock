        {
          "name": "submit_job",
          "title": "Submit a deck (inline files) and start it",
          "description": "One call: create a hosted GPU job, upload the deck given INLINE as {relative_path: text}, and queue it. Total inline size <= 8 MB; for larger decks use create_job, PUT the tarball to upload_url, then start_job. Billing starts at the first heartbeat (state running) and stops at done/failed/cancelled. The deck is executed as a program on an isolated GPU pod.",
          "inputSchema": {
            "properties": {
              "end_marker": {
