      "serverInfo": {
        "name": "com.forcefieldsilicon/mdengine",
        "title": "MDEngine (hosted GPU)",
        "version": "0.11.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MDEngine runs molecular dynamics on hosted GPUs for people who have a Claude, in three groups: semiconductor process materials, drug discovery and delivery, and mineral processing and critical metals, with a fourth guide for alloy wear and hardness studies (customer_type alloys). Call guide first, then capabilities and preflight_deck; all three work without a key, and after reading a guide, call campaign_request to start a study. To submit runs, buy a credit pack at https://forcefieldsilicon.com/mdengine and paste the key once on the sign-in page, never in chat.",
      "tools": [
        {
          "name": "account",
          "title": "Account balance and pricing",
          "description": "Balance in USD (`balance_usd`), the part of it held by your unfinished jobs (`reserved_usd`, `held_jobs`) and what a new submit can use (`available_usd` = balance - reserved; a submit needs wall_limit_s x rate of it), how jobs are priced (`pricing.mode` job = the deck's own work in atom-steps at per-class prices, capped at wall_limit_s x rate; metered = per second of pod time), the rate table, the key id of the API key in use, and `packs` (when the endpoint sells credit): [{id, name, usd, gpu_h, url}] to top up THIS key by appending ?client_reference_id=<key_id> to the pack url.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Account balance and pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
