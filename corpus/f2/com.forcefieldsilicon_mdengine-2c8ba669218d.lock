        },
        {
          "name": "create_job",
          "title": "Create a job (returns upload URL)",
          "description": "Step 1 of the two-step path for big decks: validates the spec, reserves a job id, returns a presigned upload_url. PUT the deck as a .tar.gz (<= 2 GB, relative paths, input at `input`) to upload_url, then call start_job.",
          "inputSchema": {
            "properties": {
              "end_marker": {
                "description": "Optional line your deck prints when it truly finished (e.g. a `print DONE` at the end); a done job whose log lacks a line starting with it gets verdict=warnings, end_marker_missing=true",
                "type": "string"
              },
              "estimate_s": {
                "description": "Your runtime guess in seconds; informational only; the pre-check uses wall_limit_s net of credit held by your unfinished jobs",
                "type": "integer"
              },
              "gpu": {
                "description": "GPU class; call account for the offered classes and how jobs are priced. Default any = cheapest available",
                "type": "string"
              },
              "input": {
                "description": "Relative path of the LAMMPS (or runner) input script inside the deck, e.g. in.lmp",
                "type": "string"
              },
              "label": {
                "description": "Free text <= 120 chars shown in job lists",
                "type": "string"
              },
              "launch": {
                "description": "Launch template; omit for the default KOKKOS/CUDA LAMMPS command line",
                "type": "string"
              },
              "runner": {
                "description": "Runner flavour: lammps (default) or openmm (beta)",
                "type": "string"
              },
              "wall_limit_s": {
                "description": "Hard cap in seconds (default 14400, max 86400); the job fails at the cap and is billed to it",
                "type": "integer"
              }
            },
            "required": ["input"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
