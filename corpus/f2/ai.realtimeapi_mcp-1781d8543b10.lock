{
  "lockfileVersion": 2,
  "subjects": {
    "ai.realtimeapi/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.realtimeapi.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "realtimeapi",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RealtimeAPI.ai: one gateway for live data feeds (crypto, stocks, more).\nFast start, no key: discover(query) finds endpoints; get_sample(tool) returns a free trimmed copy of any result marked sample: true. Two calls to real data.\nFull responses: call_feed(tool, params) with an API key (X-API-Key header on this server or the api_key argument) or an x402 payment. get_quote prices a call first (optional).\nKey: create_free_key(email) gives 1,000 calls/month on every feed and works at once. Use the user's email if you already have it; otherwise ask once. Keep the key out of chat output.\nDo not fetch the OpenAPI specs or list_feeds first: discover carries the params and price of each endpoint, and list_feeds names each feed's tools and sample_tool.\nOther ways to pay: x402 per call (the 402 accepts from call_feed), a time pass for every feed from 1 hour to 30 days (purchase_url in get_quote), or a 30-day Builder/Scale plan for every feed. Per-feed paid servers at /mcp/{feed} expose endpoints as x402 paid tools.",
      "tools": [
        {
          "name": "call_feed",
          "description": "Call a feed endpoint through the gateway with your API key (or an x402 payment). Without either it returns the 402 payment options.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "rta_live_ key; defaults to this server's X-API-Key header",
                "maxLength": 128,
                "type": "string"
              },
              "method": {
                "description": "HTTP method for url (default GET)",
                "maxLength": 10,
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": ["string", "number", "boolean"]
                    },
                    {
                      "items": {
                        "type": ["string", "number", "boolean"]
                      },
                      "type": "array"
                    }
                  ]
                },
                "description": "Endpoint params by name (path params fill the URL, the rest become query params)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "payment": {
                "description": "base64 x402 PAYMENT-SIGNATURE answering a previous 402",
                "maxLength": 16384,
                "type": "string"
              },
              "tool": {
                "description": "Tool name from discover, e.g. \"cryptodata_market-health\"",
                "maxLength": 128,
                "type": "string"
              },
              "url": {
                "description": "Gateway URL, e.g. https://api.realtimeapi.ai/v1/cryptodata/market-health",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac12fc0643b42698318b32cac6e1b446fffc591a5d144845b2bbaa45081f014b"
        },
        {
          "name": "create_free_key",
          "description": "Create a free API key (1,000 calls/month, all feeds) for the user's real email. Works at once; signing in at realtimeapi.ai with that email later re-issues the secret once.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0ea2abee9ee6efb387c03926cf80d0947c1c8a0cb73633da5a9580cceba878f6"
        },
        {
          "name": "discover",
          "description": "Search all feeds for endpoints matching a need. Returns up to `limit` ranked endpoints with price, params and latency (`latency.by_region`: cache-miss ms per Cloudflare region).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Results, default and max 5",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Max USD per call, e.g. 0.01",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "What data you need, in plain words",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3bbde34b7880c586636a0eedacf16fd539e03f21c1237b553502029c6ffa8bab"
        },
        {
          "name": "get_quote",
          "description": "Price an endpoint without calling it: x402 `accepts` for one call plus time-pass plans. Nothing is charged.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "method": {
                "description": "HTTP method for url (default GET)",
                "maxLength": 10,
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "type": ["string", "number", "boolean"]
                    },
                    {
                      "items": {
                        "type": ["string", "number", "boolean"]
                      },
                      "type": "array"
                    }
                  ]
                },
                "description": "Endpoint params by name (path params fill the URL, the rest become query params)",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "tool": {
                "description": "Tool name from discover, e.g. \"cryptodata_market-health\"",
                "maxLength": 128,
                "type": "string"
              },
              "url": {
                "description": "Gateway URL, e.g. https://api.realtimeapi.ai/v1/cryptodata/market-health",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de258cf79471aa7278d3eae913cdd908f2d0e4375ef1eabe5f8102dc7e54c71c"
        },
        {
          "name": "get_sample",
          "description": "Free trimmed sample of an endpoint's real response from the probe's cached copy (no key, no payment): see the data shape before paying. Works for results discover marks sample: true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "Tool name from discover, e.g. \"cryptodata_market-health\"",
                "maxLength": 128,
                "type": "string"
              },
              "url": {
                "description": "Gateway URL, e.g. https://api.realtimeapi.ai/v1/cryptodata/market-health",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a8ac9bd1cec775a6690e3a2cba0a207592ad4e1a80646b174e0f3c54a5752c1"
        },
        {
          "name": "list_feeds",
          "description": "List all live feeds with endpoint counts, per-call price range, plans and their paid MCP URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:037be03e160df68f18d4e6fcd6b1d0f6687cb15dbc16e41b84711874d50566ca"
        }
      ],
      "digest": "sha256:18fd649637397c1ad6c323b84af5d1afed64ad314c450d9950a72b820bcf2ae1"
    }
  }
}
