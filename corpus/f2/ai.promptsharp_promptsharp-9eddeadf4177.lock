{
  "lockfileVersion": 2,
  "subjects": {
    "ai.promptsharp/promptsharp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://promptsharp.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "promptsharp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PromptSharp prompt library. Call list_verticals to see what your license unlocks, search_prompts to find prompts, then get_prompt for the full copy-paste prompt.",
      "tools": [
        {
          "name": "get_prompt",
          "description": "Fetch one prompt by id: the full copy-paste prompt plus its guardrails and a why-it-works note. Requires that the prompt is within your license scope.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Prompt id, e.g. pros-01 (from search_prompts results).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b992bb50877d2b9add70a9c4b2ec12090892225dc1b77018e72ddc85e8435a2"
        },
        {
          "name": "list_verticals",
          "description": "List every vertical in the PromptSharp library with its sections, prompt counts, and whether it is unlocked for your current license tier.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bff4659bca25a14e736bf84d3b1f33d55a9246bcc1805fd32a09c4d84cfbdc4a"
        },
        {
          "name": "search_prompts",
          "description": "Search the PromptSharp prompt library. Returns ready-to-run AI prompts scoped to your license tier (no token = 15 public teasers; vertical Pro = your vertical; all-access = the full cross-vertical library). Locked results are shown as stubs with an upgrade hint.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1-25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords to match against title, use-case, section, vertical, and prompt body.",
                "type": "string"
              },
              "section": {
                "description": "Optional section slug filter within a vertical.",
                "type": "string"
              },
              "vertical": {
                "description": "Optional vertical slug filter, e.g. sales, marketing, finance, cpg, dev, product, csuite, consulting, career, personal_finance, law, air.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7891ed49bda49ba6cd166eed84f27dfcd38502d154176205da3f40d4c270301f"
        }
      ],
      "digest": "sha256:09eb4d75c4897bb0e906525316b68607a733a8b07a41037244ad08d0c2f2bccd"
    }
  }
}
