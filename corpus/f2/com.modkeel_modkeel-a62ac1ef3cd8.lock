        {
          "name": "check_mod_pair",
          "title": "Do two mods work together",
          "description": "Whether two Minecraft mods ran together in the Modkeel lab, clashed, or were never tested together. Use it for \"can I use X with Y?\" or to check two suspects from diagnose_crash; for one mod's whole record, use get_mod_runs. Takes two mod ids in any order (from names, call search_mods first). Unknown ids are not an error: the verdict is untested, meaning no lab run, never a known conflict. With mc, only runs on that version count. clash wins if any run clashed. Returns the verdict and the runs behind it.",
          "inputSchema": {
            "properties": {
              "mc": {
                "description": "Minecraft version to narrow the answer to, e.g. 1.21.1, 1.20.1 or 26.2. Omit it to get every version the lab ran; with it, only runs on exactly that version count.",
                "type": "string"
              },
              "mod_a": {
                "description": "First mod. Lowercase mod id as the loader knows it (the Modrinth/Fabric/NeoForge id, e.g. sodium, create, entityculling), not the display name. Unsure of the id? Call search_mods first.",
                "type": "string"
              },
              "mod_b": {
                "description": "Second mod, same format, e.g. iris.",
                "type": "string"
              }
            },
            "required": ["mod_a", "mod_b"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
