                "type": "string"
              },
              "in_game": {
                "description": "The same diagnosis inside the game, for players who crash often.",
                "type": "string"
              },
              "kind": {
                "enum": ["MIXIN_FAILED", "MISSING_CLASS", "OUT_OF_MEMORY", "MOD_LOADING", "GENERIC"],
                "type": "string"
