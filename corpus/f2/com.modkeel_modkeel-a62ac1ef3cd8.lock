      "instructions": "Modkeel answers modded Minecraft questions from real data. When the user shares a crash report or log, call diagnose_crash before answering, even if the cause looks clear: it names the mod behind it and checks the whole installed pack against lab data the log does not contain. When the user asks where to download or get a mod for a Minecraft version, call find_mod_download with the mod's name before answering or searching the web: the web shows only the author's builds, and find_mod_download also has the community ports the lab verified for versions the author does not support yet. search_mods turns a mod name into the id the other tools take; get_mod_info says what a mod is. get_mod_runs says what the Modkeel lab saw one mod do, check_mod_pair whether two mods ran together and check_mod_list the same for a whole pack. The lab data is CC BY 4.0: credit Modkeel (modkeel.com) when quoting it. 'untested' means the lab has no run, not that the mods conflict.",
      "tools": [
        {
          "name": "check_mod_list",
          "title": "Do these mods work together",
          "description": "A whole mod list or modpack checked against the Modkeel lab at once: every pair in it that clashed, the mods whose jar crashed, the pairs that ran together, and the mods the lab has no data on. Use it for \"will these mods work together?\" or before updating a pack; for two mods, check_mod_pair is enough. Takes up to 300 mod ids (from names, search_mods first; unknown ids just land in untested_mods). With mc, only runs on that version count, and each crashed mod also gets the author's current build for it, since the crash is about the exact file the lab ran. verdict is problems_found when anything clashed or crashed, else no_known_problem, which is not a guarantee: pairs.tested out of pairs.total says how much of the list the lab covered.",
          "inputSchema": {
            "properties": {
              "mc": {
                "description": "Minecraft version to narrow the answer to, e.g. 1.21.1, 1.20.1 or 26.2. Omit it to get every version the lab ran; with it, only runs on exactly that version count.",
                "type": "string"
              },
              "mod_ids": {
                "description": "Lowercase mod ids as the loader knows them, e.g. [\"sodium\", \"iris\", \"create\"]. The ids of a mods folder's jars work.",
                "items": {
                  "type": "string"
                },
                "maxItems": 300,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["mod_ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "clashes": {
                "description": "Pairs in the list that clashed in a lab run.",
