        {
          "name": "search_mods",
          "title": "Find a mod's id in the Modkeel lab",
          "description": "Turn a mod's display name or part of its id into the exact mod id the other lab tools take, and see which mods the Modkeel lab has data on. Use it first when you only have a name (\"Entity Culling\", \"Sodium\") or are unsure of the id; skip it when you already have the id. To download a mod, call find_mod_download with its name instead: it finds the mod itself. Matching ignores case, spaces and punctuation; best match first, then the mods with more lab data. An empty query lists every mod the lab tested. Returns each mod's id, the Minecraft versions it was tested on and how many runs and pairs it has, plus the total number of matches. No match means the lab has no data on that mod, not that it is broken (get_mod_info still finds it on Modrinth by slug). mc keeps only mods with a run on that exact version; limit caps the list, and total says how many matched.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "description": "How many mods to return, 1 to 100. Default 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "mc": {
                "description": "Minecraft version to narrow the answer to, e.g. 1.21.1, 1.20.1 or 26.2. Omit it to get every version the lab ran; with it, only runs on exactly that version count.",
                "type": "string"
              },
              "query": {
                "description": "Mod name or part of its id, e.g. \"Entity Culling\", \"sod\" or \"create\". Empty or omitted: list every mod the lab tested.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "description": "Snapshot date and license of the lab data; attribute when quoting.",
                "properties": {
                  "built": {
                    "type": "string"
                  },
                  "license": {
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "mc": {
                "type": ["string", "null"]
              },
              "mods": {
                "description": "Best match first.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Pass this to the other tools as mod_id.",
                      "type": "string"
                    },
                    "pairs": {
                      "type": "integer"
                    },
                    "runs": {
                      "type": "integer"
                    },
                    "versions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "total": {
                "description": "Matches before the limit.",
                "type": "integer"
              }
            },
            "required": ["data", "mods", "query", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
