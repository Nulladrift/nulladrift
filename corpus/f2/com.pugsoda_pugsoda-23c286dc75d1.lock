      "serverInfo": {
        "name": "pugsoda",
        "title": "PugSoda",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PugSoda (https://pugsoda.com) turns one photo of a person or pet into trending TikTok AI meme videos and themed studio photo sets, paid per video with no subscription required. Use list_trending_memes or search_templates to find matching effects, get_template for photo tips and exact pricing, and give the user the returned url so they can upload their photo and preview the first frame for free in the browser.",
      "tools": [
        {
          "name": "get_template",
          "title": "Get details for one PugSoda template",
          "description": "Get full details for a PugSoda template by slug: what photo to upload, clip duration, pricing, whether a free first-frame preview is shown before payment, step-by-step instructions, FAQ, and the direct upload URL.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Template slug, e.g. \"hit-the-road-dude\", \"clapping-cat\", or \"wild-west-saloon\".",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aee7c0897b306d02b7f003995ba80765892a5b7ba5f72bfeeb074456a4c453b3"
        },
        {
          "name": "list_trending_memes",
          "title": "List trending AI meme video templates",
          "description": "List trending TikTok AI meme video templates on PugSoda, ordered by heat and recency, with subject requirements (1 person, 2 people, couple, or pet), clip length, starting one-time price, free preview availability, and direct upload URL.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "description": "Maximum number of templates to return (1–50, default 15).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "subject": {
                "description": "Optional filter by who goes into the video: person (1 person), pair (2 people), couple, or pet.",
                "enum": ["person", "pair", "couple", "pet"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e3eb80caabc6a5e49ec720d241e75ccdc73ed64e79ff7136241eaa54b80b0db"
        },
        {
          "name": "search_templates",
          "title": "Search PugSoda video and photo studio templates",
          "description": "Search all PugSoda AI video templates, TikTok meme swaps, themed family photo studios, and product video templates by keyword, theme, or subject.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum number of templates to return (1–50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword to match against template title, H1, teaser, description, or tags (e.g. \"cat\", \"car\", \"dance\", \"saloon\", \"christmas\").",
                "maxLength": 120,
                "type": "string"
              },
              "subject": {
                "description": "Optional filter by subject type.",
                "enum": ["person", "pair", "couple", "pet"],
                "type": "string"
              },
              "theme": {
                "description": "Optional theme or tag filter (e.g. \"halloween\", \"pets\", \"cars\", \"dance\", \"songs\").",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3825d1d14efa0a4210baed444b7df3166583086591556ef4a37e8989b04c3339"
        }
