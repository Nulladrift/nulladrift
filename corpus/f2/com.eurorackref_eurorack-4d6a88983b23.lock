        {
          "name": "get_module",
          "title": "Look up module",
          "description": "Return the citation-anchored specification for one Eurorack module by id.\n\nUse this when the user names a specific module and you want its specs: HP, depth, power, and the typed record — jacks (direction, signals, voltages, what they feed or come from), controls, modes, hidden functions, specs with units, properties, behavior rules and function tags — plus firmware history.\n\nEvery record element carries src, the id of the manufacturer document it came from; list_references(module_id=...) gives each source's title and canonical_url.\n\nModule IDs are slug-shaped: \"<manufacturer-id>/<module-slug>\", e.g. \"make-noise/maths\", \"alm-busy-circuits/pamelas-new-workout\".\n\n## Optional args — trim the payload\n  - view: \"concise\" returns the id-card fields (name, manufacturer, hp, function_tags, production_status). \"full\" (default) returns everything. Ignored when fields is set.\n  - fields: array of top-level keys to include (e.g. [\"record\"]). id and _meta are always returned. Takes precedence over view.\n\nReturns:\n  - id, name, manufacturer { id, name }, hp, depth_mm, power { plus_12, minus_12, plus_5 } (mA), production_status (\"current\" | \"discontinued\")\n  - function_tags: the record's function tag ids — a quick \"what does it do\"\n  - record: the typed record, or null when the module hasn't been extracted yet (then _meta.feedback_hint says so). Layers: blocks[] (named circuits with their controls/inputs/outputs and types), jacks[] (name, direction input|output|bidirectional, signal_types, function, voltage_min/max, polarity, scaling, threshold_v, pulse_ms, coupling, audio_rate, impedance_ohms, normalled_from, attenuated_by, feeds / sourced_from / selected_by, per_mode, types, not_stated, name_basis), controls[] (function, range, positions, affects, per_mode, name_basis), modes[], hidden_functions[], specs[] (quantity, min/max/value, unit, condition), properties[] (subject/property/value), rules[] (subject / when / effect, optional mode), tags[] (tag, basis, evidence, scope). Labels are the manual's own terms, never quotes. name_basis says whether a jack/control name is printed on the panel, described in the docs, or inferred. A field listed in a jack's not_stated was checked and the manufacturer doesn't state it; a null field not listed there is unknown.\n  - firmware_versions[]: { version, release_date, notes, source_id }\n  - reference_url: the manufacturer's canonical manual URL; audit_url: the module's page on the reference site\n  - _meta: source_count, last_verified, record_meta { schema_version, extracted_at }\n\nErrors:\n  - \"Module not found: <id>\" if no module with that id exists.\n\nIf the manufacturer's documents don't cover the question, say so — never infer from spec data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Optional: top-level keys to include (e.g. [\"record\"]) when you only need a slice and want to skip the full payload. Omit for everything. id and _meta are always returned. Takes precedence over `view`. Selectable: manufacturer, name, hp, depth_mm, power, function_tags, firmware_versions, reference_url, audit_url, production_status, record.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "module_id": {
                "description": "Stable module id, \"<manufacturer-id>/<module-slug>\" (e.g. \"alm-busy-circuits/pamelas-new-workout\").",
                "minLength": 3,
                "type": "string"
              },
              "view": {
                "description": "Optional: \"concise\" returns the id-card subset (name, manufacturer, hp, function_tags, production_status) and drops the record. \"full\" (default) returns the complete spec. Ignored when `fields` is set.",
                "enum": ["full", "concise"],
                "type": "string"
              }
            },
            "required": ["module_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up module"
