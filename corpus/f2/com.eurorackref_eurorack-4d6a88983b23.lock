        {
          "name": "get_manufacturer",
          "title": "Look up a manufacturer",
          "description": "Return one Eurorack manufacturer: its website, every module of theirs in the reference, and their maker-wide documents.\n\nUse it for \"what does <maker> make?\" or to browse a maker's line before picking modules. For filtering (by function, jacks, HP) use search_modules with manufacturer instead.\n\nArgs:\n  - manufacturer_id: the maker's id, e.g. \"make-noise\", \"mutable-instruments\", \"alm-busy-circuits\". A near-miss returns an error listing close ids.\n\nReturns:\n  - id, name, website (the maker's own site), url (their page on eurorackref.com)\n  - module_count, modules[]: { id, name, manufacturer, hp, function_tags, production_status, url }, by name\n  - sources[]: maker-wide documents not tied to one module (same shape as get_module's sources)\n  - _meta.corpus_records: how many modules in the whole reference have a typed record",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "manufacturer_id": {
                "description": "Manufacturer id, e.g. \"make-noise\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["manufacturer_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a manufacturer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5e59f9b5eb9e2288459d78aea272fee4c2f04419ec62c549ce8ab911c5ffdf4"
        },
        {
          "name": "get_module",
          "title": "Look up modules",
          "description": "Return the citation-anchored specification for one Eurorack module by id, or for up to 25 at once.\n\nUse it when you know the module id (from search_modules) and want its specs: HP, depth, power, and the typed record — jacks (direction, signals, voltages, what they feed or come from), controls, modes, hidden functions, specs with units, properties, behavior rules and function tags — plus its manufacturer documents and firmware history.\n\nModule ids are \"<manufacturer-id>/<module-slug>\", e.g. \"make-noise/maths\". A near-miss id (missing maker, wrong maker, known alias) resolves; _meta.id_resolved_from says so.\n\nArgs (exactly one of module_id / module_ids):\n  - module_id: one id → returns the module.\n  - module_ids: up to 25 ids → returns { modules: [...], errors: [{ id, message }] }; one bad id doesn't fail the batch. Prefer this over repeated calls.\n  - view: \"concise\" returns the id card (name, manufacturer, hp, function_tags, production_status, url) without the record — the cheapest way to triage a list. \"full\" (default) returns everything. Ignored when fields is set.\n  - fields: top-level keys to include (e.g. [\"record\"], [\"power\"]). id and _meta are always returned. Takes precedence over view.\n\nReturns (per module):\n  - id, name, manufacturer { id, name }, hp, depth_mm, power { plus_12, minus_12, plus_5 } (mA), production_status (\"current\" | \"discontinued\")\n  - function_tags: the record's function tag ids, a quick \"what does it do\"\n  - url: the module's page on eurorackref.com\n  - record: the typed record, or null when the module hasn't been extracted yet (then _meta.feedback_hint says so). Layers: blocks[] (named circuits with their controls/inputs/outputs and types), jacks[] (name, direction input|output|bidirectional, signal_types, function, voltage_min/max, polarity, scaling, threshold_v, pulse_ms, coupling, audio_rate, impedance_ohms, normalled_from, attenuated_by, feeds / sourced_from / selected_by, per_mode, types, not_stated, name_basis), controls[] (function, range, positions, affects, per_mode, name_basis), modes[], hidden_functions[], specs[] (quantity, min/max/value, unit, condition), properties[] (subject/property/value), rules[] (subject / when / effect, optional mode), tags[] (tag, basis, evidence, scope). Every element cites src, a source id listed in sources. Labels are the manual's own terms, never quotes. name_basis says whether a name is printed on the panel, described in the docs, or inferred. A field listed in a jack's not_stated was checked and the manufacturer doesn't state it; a null field not listed there is unknown.\n  - sources[]: { id, source_type, format, title, canonical_url (the manufacturer's URL), url (its page here), last_verified, canonical_changed_at, primary?, changed_since_verified? }. Cite canonical_url. changed_since_verified means the manufacturer's document changed after we last checked it — say so when it matters.\n  - firmware_versions[]: { version, release_date, notes, source_id }\n  - _meta: last_verified, record_meta { schema_version, extracted_at }, feedback_hint, id_resolved_from\n\nErrors: \"Module not found: <id>\" (with did-you-mean suggestions) for a single unknown id.\n\nIf the manufacturer's documents don't cover the question, say so — never infer from spec data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Top-level keys to include. id and _meta are always returned. Selectable: manufacturer, name, hp, depth_mm, power, production_status, function_tags, url, record, sources, firmware_versions.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "module_id": {
                "description": "One module id, \"<manufacturer-id>/<module-slug>\" (e.g. \"make-noise/maths\").",
                "minLength": 3,
                "type": "string"
              },
              "module_ids": {
                "description": "Up to 25 module ids; returns { modules, errors }.",
                "items": {
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "view": {
                "description": "\"concise\" returns the id card without the record. \"full\" (default) returns everything. Ignored when `fields` is set.",
                "enum": ["full", "concise"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up modules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:183b1f45c542854e5ae394543d9ba0ce9f6b9c1d97470ab67adc9dc45b5b64a1"
        },
        {
          "name": "search_modules",
          "title": "Search Eurorack Modules",
          "description": "Find Eurorack modules: by name, by a combination of filters, or resolve a whole list of names to ids at once.\n\nFilters compose with AND. Omit any filter to leave that dimension unrestricted. Results are sorted by module name; use limit/offset to page.\n\nArgs:\n  - names (string[]): resolve up to 100 module names to ids in one call — the way a user writes their rack (\"Maths\", \"Plaits\", \"Pamela's New Workout\", \"Morph 4\"). Use this instead of one search per name. Can't be combined with other filters; returns { resolutions, _meta } instead of { modules, total } (see below).\n  - function_tag (string): what the module does, from a fixed vocabulary (e.g. looping_envelope, slew_limiter, lowpass_gate, granular, sub_oscillator). The strongest way to search by function. By default it matches only PATCHABLE functions — ones you can patch an external signal through or whose result is on an output jack. Pass include_internal: true to also match functions that only shape the module's own sound (e.g. a voice's built-in low-pass gate).\n  - jack_type (string): the module has a jack of this standard type (e.g. end_of_cycle_out, pitch_cv_in, sync_in, audio_in_left).\n  - block_type (string): the module has an internal block of this type (e.g. envelope_generator, vca, filter, delay).\n  - manufacturer (string): manufacturer id, e.g. 'make-noise', 'mutable-instruments'. Exact match; a near-miss returns _meta.manufacturer_suggestions.\n  - hp_min, hp_max (number): module width in HP.\n  - power_plus_12_max (number): +12 V draw at most this many mA (modules with a stated draw only).\n  - has_modes (boolean): true = the module has selectable modes (per its record); false = it has none.\n  - signal_type_in (string): the module has an input jack carrying this signal: audio, cv, pitch (V/oct), gate, trigger, clock or midi. 'cv' also matches pitch jacks. A bidirectional jack counts as an input and an output.\n  - signal_type_out (string): the module has an output jack carrying this signal. Same values.\n  - text (string): case-insensitive match against module id, name, slug and curated aliases. Separator- and whitespace-insensitive (\"filter 8\" finds \"filter-8\", \"3x MIA\" finds \"3xMIA\"). Names only — search by what a module does with function_tag / jack_type / block_type.\n  - voct_tracking_range_min (number): the manufacturer states a pitch tracking range of at least this many octaves.\n  - audio_outputs_min (number): has at least this many audio output jacks (e.g. ≥3 finds multi-output filters).\n    Every filter except manufacturer, hp, power and text reads the modules' typed records. A few modules have no record yet; _meta.record_coverage gives the count when it matters, so say when a result may be incomplete.\n  - limit (number): default 50, max 200. offset (number): pagination offset.\n\nReturns (filters):\n  {\n    \"modules\": [{ id, name, manufacturer { id, name }, hp, function_tags, production_status, url }],  // function_tags: the record's function tag ids, [] without a record\n    \"total\": number,\n    \"_meta\": {\n      \"query\": <args>,\n      \"record_coverage\": { with_record, total, note },  // when a record-backed filter was used\n      \"relaxed_to_tokens\": true,                         // a multi-word phrase matched nothing, so each word was matched against identifiers instead\n      // On total=0 only, each optional:\n      \"would_match_without\": [\"text\"],                   // filters that, if individually dropped, would yield ≥1 result\n      \"closest_text_hits\": [{ id, name, manufacturer }], // top 3 modules matching 'text' alone\n      \"did_you_mean\": [{ id, name, manufacturer }],      // edit-distance neighbors of 'text' (typo); absent means a genuine corpus gap\n      \"manufacturer_suggestions\": [{ id, name }],        // maker slugs near the 'manufacturer' arg\n      \"feedback_hint\": \"...\"\n    }\n  }\n\nExamples:\n  - \"Looping envelopes with an end-of-cycle output\" → {function_tag: 'looping_envelope', jack_type: 'end_of_cycle_out'}\n  - \"What ALM modules are in the corpus?\" → {manufacturer: 'alm-busy-circuits'}\n  - \"Modules under 8 HP with a clock output\" → {hp_max: 8, signal_type_out: 'clock'}\n  - \"Filters that track V/Oct over 5 octaves\" → {voct_tracking_range_min: 5}\n  - \"Multi-output filters\" → {audio_outputs_min: 3, text: 'filter'}\n\nReturns (names):\n  {\n    \"resolutions\": [{ input, best_match (a module card or null), score (0..1), match_kind ('id'|'slug'|'exact'|'relaxed'|'ambiguous'|'fuzzy'|'none'), did_you_mean [cards], ambiguous [cards] }],\n    \"_meta\": { requested, resolved, feedback_hint? }\n  }\n  If a name is ambiguous, show the user the candidates; don't pick one. best_match null with nothing in did_you_mean means the module isn't in the reference.\n\nAfter picking a hit, call get_module with the id (or module_ids for several) for full details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_outputs_min": {
                "minimum": 1,
                "type": "integer"
              },
              "block_type": {
                "description": "Standard block type id.",
                "enum": ["oscillator", "complex_oscillator", "macro_oscillator", "wavetable_oscillator", "fm_oscillator", "additive_oscillator", "sub_oscillator", "noise_source", "physical_model", "resonator", "waveshaper", "ring_modulator", "complete_voice", "filter", "lowpass_gate", "formant_filter", "filter_bank", "allpass_phaser", "vca", "mixer", "crossfader_panner", "compressor_dynamics", "envelope_follower", "distortion", "envelope_generator", "function_generator", "slew_limiter", "lfo", "random_source", "sample_and_hold", "attenuverter_offset", "cv_processor", "manual_controller", "modulation_matrix", "clock_generator", "clock_divider", "logic_gate", "gate_processor", "counter", "sequencer", "trigger_sequencer", "euclidean_pattern_generator", "arpeggiator", "quantizer", "sequential_switch", "delay", "reverb", "chorus_flanger", "granular_processor", "looper", "pitch_shifter", "spectral_processor", "multi_effect", "drum_voice", "sampler", "multiple", "precision_adder", "output_stage", "input_stage", "midi_interface", "power_utility", "expander"],
                "type": "string"
              },
              "function_tag": {
                "description": "Function tag id.",
                "enum": ["analog_vco", "digital_oscillator", "waveshape_morph", "simultaneous_waveform_outputs", "through_zero_fm", "linear_fm", "exponential_fm", "hard_sync", "pulse_width_modulation", "one_v_per_octave", "sub_oscillator", "noise_source", "chord_oscillator", "lowpass_filter", "highpass_filter", "bandpass_filter", "multimode_filter", "simultaneous_filter_outputs", "self_oscillating_filter", "formant_filter", "vocal_synthesis", "filter_bank", "lowpass_gate", "wavefolder", "distortion", "ring_modulator", "vca", "vca_response_curve", "mixer", "stereo_panning", "crossfader", "attenuverter", "multiple", "compressor", "adsr_envelope", "function_generator", "looping_envelope", "end_of_cycle_output", "lfo", "slew_limiter", "envelope_follower", "random_cv", "chaos_modulation", "sequencer", "trigger_sequencer", "quantizer", "clock_source", "tempo_sync", "clock_division", "logic", "probability_gate", "switch", "gate_trigger_utility", "arithmetic_cv", "delay", "reverb", "modulation_effect", "pitch_shifter", "granular", "freeze_hold", "audio_recording", "sample_playback", "vocoder", "drum_voice", "complete_voice", "midi_interface", "external_io", "manual_controller", "stereo_processing", "cv_recorder", "polyphony", "resonator", "euclidean_rhythm", "vactrol", "quadrature_outputs", "polarity_switch", "reverse_playback", "send_return"],
                "type": "string"
              },
              "has_modes": {
                "description": "Has selectable modes (true) or none (false).",
                "type": "boolean"
              },
