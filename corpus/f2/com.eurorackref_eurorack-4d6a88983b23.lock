        {
          "name": "get_modules",
          "title": "Look up modules",
          "description": "Batched get_module — returns `{ modules: [...], errors: [...] }` with full citation-anchored specs for up to 25 modules in one call.\n\nPrefer this over multiple get_module calls when you have a known list of modules to fetch (e.g. comparing several candidates side-by-side). One round trip vs. N.\n\nArgs:\n  - module_ids: array of \"<manufacturer-id>/<module-slug>\" strings. Up to 25 per call; duplicates are deduplicated.\n\nOptional args (apply to every module in the batch, same semantics as get_module):\n  - view: \"concise\" returns the id-card subset (name, manufacturer, hp, function_tags, production_status) for every module and drops the record — the cheapest way to triage a list (\"which of these are LFOs?\"). \"full\" (default) returns complete specs. Ignored when fields is set.\n  - fields: top-level keys to include on each module (e.g. [\"function_tags\",\"power\"]). id and _meta are always returned. Use this when you only need a slice across N modules instead of N full specs.\n\nReturns:\n  - modules[]: GetModuleResponse for each id that resolved (same shape as get_module; narrowed when fields is set).\n  - errors[]: { id, message } for each id that failed (e.g. unknown module). Other ids in the batch still resolve.\n\nIf you only need a single module, use get_module — same shape, one element. Need only power draw? Pass fields: [\"power\"] to skip the full specs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fields": {
                "description": "Optional: top-level keys to include on every module in the batch (e.g. [\"function_tags\",\"power\"]) when you only need a slice — keeps a multi-module fetch from returning full specs. Omit for everything. id and _meta are always returned. Takes precedence over `view`. Same selectable keys as get_module.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "module_ids": {
                "items": {
                  "description": "Stable module id, \"<manufacturer-id>/<module-slug>\" (e.g. \"alm-busy-circuits/pamelas-new-workout\").",
                  "minLength": 3,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "view": {
                "description": "Optional: \"concise\" returns the id-card subset for every module in the batch and drops the heavy arrays — cheapest way to triage a list. \"full\" (default) returns complete specs. Ignored when `fields` is set.",
                "enum": ["full", "concise"],
                "type": "string"
              }
            },
            "required": ["module_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up modules"
          },
          "behavior": {
            "destructive": false,
