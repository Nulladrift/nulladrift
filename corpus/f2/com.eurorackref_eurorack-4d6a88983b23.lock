        {
          "name": "get_source",
          "title": "Get Source Metadata",
          "description": "Return provenance metadata for one source by integer source_id.\n\nSources include manufacturer manuals, product pages, firmware notes, schematics, errata, and (in v2) field notes. Source ids are surfaced wherever facts cite their origin — in get_module's reference list, in the audit page citation links, and (in v2) in the claims table.\n\nArgs:\n  - source_id (integer, required)\n\nReturns metadata only — not the document content. The audit_url field links to the audit site's per-source page where the document can be viewed. The archived_url field is a path on the worker that streams the archived bytes from R2 (e.g. /sources/123/document).\n\nReturns:\n  {\n    \"id\": number,\n    \"source_type\": \"manual\" | \"firmware_notes\" | \"product_page\" | ...,\n    \"format\":      \"pdf\" | \"html\" | \"text\" | ...,\n    \"title\":       string | null,\n    \"canonical_url\": string,                 // manufacturer-hosted URL\n    \"archived_url\":  string | null,          // worker route to the R2-archived copy\n    \"content_hash\":  string | null,          // sha256 of archived bytes\n    \"fetched_date\":  string,                 // when first archived\n    \"last_verified\": string | null,          // when canonical was last confirmed\n    \"canonical_changed_at\": string | null,   // null until manufacturer side changes\n    \"module_id\":     string | null,          // owning module, if any\n    \"manufacturer_id\": string | null,\n    \"audit_url\":     string                  // audit site page for this source\n  }\n\nThe pair (canonical_changed_at, last_verified) is the staleness signal: if canonical_changed_at > last_verified, the manufacturer document changed since we last checked it. Surface that to the user when relevant.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source_id": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["source_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Source Metadata"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:845fca93c1854f637f29ee99f38d0722ed9147b2e8e90ba805fac849725dae3d"
        },
        {
          "name": "list_references",
          "title": "List Module References",
          "description": "Return the source documents associated with one module — manuals, firmware notes, product pages, errata, and (in v2) field notes.\n\nArgs:\n  - module_id (string, required): \"<manufacturer-slug>/<module-slug>\"\n\nReturns:\n  {\n    \"module_id\": string,\n    \"references\": [\n      { id, source_type, title, canonical_url, archived_url, format, last_verified }\n    ]\n  }\n\nEach reference's id can be passed to get_source for full metadata (content_hash, fetched_date, canonical-change detection, audit_url).\n\nReturns module_id with references=[] if the module has no sources recorded. Errors if the module id is unknown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "module_id": {
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["module_id"],
