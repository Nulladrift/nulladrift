        {
          "name": "resolve_modules",
          "title": "Resolve Module Names to IDs",
          "description": "Bulk fuzzy name → id resolver. Pass a list of module NAMES (the way a user writes their rack — \"Maths\", \"Plaits\", \"Pamela's New Workout\", \"Morph 4\") and get back, per name, the best-matching corpus module id plus recovery affordances. This is the \"import my rack\" tool: resolving a 60-module inventory is ONE call here, not 60 search_modules calls.\n\nUse this the moment a user gives you a list of module names to map onto the corpus — before get_module / get_modules, which want ids. Feed the resolved best_match.id into those.\n\nFor each input name it runs the same resolution search_modules uses (exact id, unique-slug recovery, module_aliases, separator-fold, token-AND, and edit-distance + multi-token fuzzy \"did you mean\"), then returns:\n  - best_match: the single resolved module ({ id, name, manufacturer, hp, production_status }), or null when nothing resolved confidently.\n  - score: confidence 0..1 (1.0 exact id, ~0.97 unique slug / alias, ~0.9 literal name hit, ~0.72 token-AND relaxed, 0 when best_match is null).\n  - match_kind: \"id\" | \"slug\" | \"exact\" | \"relaxed\" | \"ambiguous\" | \"fuzzy\" | \"none\".\n  - did_you_mean: up to 5 fuzzy neighbours to confirm — populated when best_match is null (a near-miss like \"morf 4\" → joranalogue/morph-4, or \"tiny time machin\" → oam/tiny-time-machine).\n  - ambiguous: up to 5 candidates when several modules tied for the match and the server declined to pick (e.g. a slug shared across manufacturers). Present them to the user; do NOT silently take the first.\n\nThe server AUTO-RESOLVES a confident single match but never guesses through a genuine tie — that's the ambiguous bucket. A name with best_match=null AND empty did_you_mean/ambiguous is a real corpus gap: tell the user the module isn't in the corpus.\n\nArgs:\n  - names (string[], required): module names or ids, up to 100. Order and duplicates are preserved in the response.\n\nReturns:\n  {\n    \"resolutions\": [\n      {\n        \"input\": \"Pamela's New Workout\",\n        \"best_match\": { \"id\": \"alm-busy-circuits/pamelas-new-workout\", \"name\": \"Pamela's NEW Workout\", \"manufacturer\": \"ALM Busy Circuits\", \"hp\": 8, \"production_status\": \"current\" },\n        \"score\": 0.9,\n        \"match_kind\": \"exact\",\n        \"did_you_mean\": [],\n        \"ambiguous\": []\n      },\n      ...\n    ],\n    \"_meta\": { \"requested\": 3, \"resolved\": 2, \"feedback_hint\"?: \"...\" }\n  }\n\nErrors:\n  - Throws only on a malformed call (missing/empty names array, or > 100 names). Unresolved individual names are NOT errors — they come back with best_match=null and the recovery fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "description": "Module names (or ids) to resolve, up to 100. Order and duplicates preserved.",
                "items": {
                  "description": "A module name or id, e.g. \"Maths\" or \"make-noise/maths\".",
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Resolve Module Names to IDs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40572c9e9cda72fcb28d82caec3062b0ec0e32b3afd6eba71b6d9f6c3bd442d4"
        },
        {
          "name": "search_modules",
          "title": "Search Eurorack Modules",
          "description": "Search the corpus for Eurorack modules matching a combination of filters.\n\nFilters compose with AND. Omit any filter to leave that dimension unrestricted. Results are sorted by module name; use limit/offset to page.\n\nArgs:\n  - function_tag (string): what the module does, from a fixed vocabulary (e.g. looping_envelope, slew_limiter, lowpass_gate, granular, sub_oscillator). The strongest way to search by function. By default it matches only PATCHABLE functions — ones you can patch an external signal through or whose result is on an output jack. Pass include_internal: true to also match functions that only shape the module's own sound (e.g. a voice's built-in low-pass gate).\n  - jack_type (string): the module has a jack of this standard type (e.g. end_of_cycle_out, pitch_cv_in, sync_in, audio_in_left).\n  - block_type (string): the module has an internal block of this type (e.g. envelope_generator, vca, filter, delay).\n  - manufacturer (string): manufacturer id, e.g. 'make-noise', 'mutable-instruments'. Exact match; a near-miss returns _meta.manufacturer_suggestions.\n  - hp_min, hp_max (number): module width in HP.\n  - signal_type_in (string): the module has an input jack carrying this signal: audio, cv, pitch (V/oct), gate, trigger, clock or midi. 'cv' also matches pitch jacks. A bidirectional jack counts as an input and an output.\n  - signal_type_out (string): the module has an output jack carrying this signal. Same values.\n  - text (string): case-insensitive match against module id, name, slug and curated aliases. Separator- and whitespace-insensitive (\"filter 8\" finds \"filter-8\", \"3x MIA\" finds \"3xMIA\"). Names only — search by what a module does with function_tag / jack_type / block_type.\n  - voct_tracking_range_min (number): the manufacturer states a pitch tracking range of at least this many octaves.\n  - audio_outputs_min (number): has at least this many audio output jacks (e.g. ≥3 finds multi-output filters).\n    Every filter except manufacturer, hp and text reads the modules' typed records. A few modules have no record yet; _meta.record_coverage gives the count when it matters, so say when a result may be incomplete.\n  - limit (number): default 50, max 200. offset (number): pagination offset.\n\nReturns:\n  {\n    \"modules\": [{ id, name, manufacturer, hp, function_tags, production_status }],  // function_tags: the record's function tag ids, [] without a record\n    \"total\": number,\n    \"_meta\": {\n      \"query\": <args>,\n      \"record_coverage\": { with_record, total, note },  // when a record-backed filter was used\n      \"relaxed_to_tokens\": true,                         // a multi-word phrase matched nothing, so each word was matched against identifiers instead\n      // On total=0 only, each optional:\n      \"would_match_without\": [\"text\"],                   // filters that, if individually dropped, would yield ≥1 result\n      \"closest_text_hits\": [{ id, name, manufacturer }], // top 3 modules matching 'text' alone\n      \"did_you_mean\": [{ id, name, manufacturer }],      // edit-distance neighbors of 'text' (typo); absent means a genuine corpus gap\n      \"manufacturer_suggestions\": [{ id, name }],        // maker slugs near the 'manufacturer' arg\n      \"feedback_hint\": \"...\"\n    }\n  }\n\nExamples:\n  - \"Looping envelopes with an end-of-cycle output\" → {function_tag: 'looping_envelope', jack_type: 'end_of_cycle_out'}\n  - \"What ALM modules are in the corpus?\" → {manufacturer: 'alm-busy-circuits'}\n  - \"Modules under 8 HP with a clock output\" → {hp_max: 8, signal_type_out: 'clock'}\n  - \"Filters that track V/Oct over 5 octaves\" → {voct_tracking_range_min: 5}\n  - \"Multi-output filters\" → {audio_outputs_min: 3, text: 'filter'}\n\nAfter picking a hit, call get_module with the id for full details.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audio_outputs_min": {
                "minimum": 1,
                "type": "integer"
              },
              "block_type": {
                "description": "Standard block type id.",
                "enum": ["oscillator", "complex_oscillator", "macro_oscillator", "wavetable_oscillator", "fm_oscillator", "additive_oscillator", "sub_oscillator", "noise_source", "physical_model", "resonator", "waveshaper", "ring_modulator", "complete_voice", "filter", "lowpass_gate", "formant_filter", "filter_bank", "allpass_phaser", "vca", "mixer", "crossfader_panner", "compressor_dynamics", "envelope_follower", "distortion", "envelope_generator", "function_generator", "slew_limiter", "lfo", "random_source", "sample_and_hold", "attenuverter_offset", "cv_processor", "manual_controller", "modulation_matrix", "clock_generator", "clock_divider", "logic_gate", "gate_processor", "counter", "sequencer", "trigger_sequencer", "euclidean_pattern_generator", "arpeggiator", "quantizer", "sequential_switch", "delay", "reverb", "chorus_flanger", "granular_processor", "looper", "pitch_shifter", "spectral_processor", "multi_effect", "drum_voice", "sampler", "multiple", "precision_adder", "output_stage", "input_stage", "midi_interface", "power_utility", "expander"],
                "type": "string"
              },
              "function_tag": {
                "description": "Function tag id.",
                "enum": ["analog_vco", "digital_oscillator", "waveshape_morph", "simultaneous_waveform_outputs", "through_zero_fm", "linear_fm", "exponential_fm", "hard_sync", "pulse_width_modulation", "one_v_per_octave", "sub_oscillator", "noise_source", "chord_oscillator", "lowpass_filter", "highpass_filter", "bandpass_filter", "multimode_filter", "simultaneous_filter_outputs", "self_oscillating_filter", "formant_filter", "vocal_synthesis", "filter_bank", "lowpass_gate", "wavefolder", "distortion", "ring_modulator", "vca", "vca_response_curve", "mixer", "stereo_panning", "crossfader", "attenuverter", "multiple", "compressor", "adsr_envelope", "function_generator", "looping_envelope", "end_of_cycle_output", "lfo", "slew_limiter", "envelope_follower", "random_cv", "chaos_modulation", "sequencer", "trigger_sequencer", "quantizer", "clock_source", "tempo_sync", "clock_division", "logic", "probability_gate", "switch", "gate_trigger_utility", "arithmetic_cv", "delay", "reverb", "modulation_effect", "pitch_shifter", "granular", "freeze_hold", "audio_recording", "sample_playback", "vocoder", "drum_voice", "complete_voice", "midi_interface", "external_io", "manual_controller", "stereo_processing", "cv_recorder", "polyphony", "resonator", "euclidean_rhythm", "vactrol", "quadrature_outputs", "polarity_switch", "reverse_playback", "send_return"],
