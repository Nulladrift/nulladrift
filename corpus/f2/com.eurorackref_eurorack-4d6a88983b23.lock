                "type": "boolean"
              },
              "jack_type": {
                "description": "Standard jack type id.",
                "enum": ["pitch_cv_in", "fm_in", "through_zero_fm_in", "sync_in", "timbre_cv_in", "pulse_width_cv_in", "osc_waveform_out", "osc_mix_out", "sub_oscillator_out", "noise_out", "voice_out", "audio_in", "audio_out", "audio_out_left", "audio_out_right", "audio_in_left", "audio_in_right", "filter_mode_out", "cutoff_cv_in", "resonance_cv_in", "mode_cv_in", "level_cv_in", "pan_cv_in", "mix_out", "envelope_follower_out", "sidechain_in", "gate_in", "trigger_in", "retrigger_in", "envelope_out", "stage_time_cv_in", "end_of_cycle_out", "end_of_rise_out", "stage_gate_out", "lfo_out", "rate_cv_in", "random_cv_out", "random_gate_out", "probability_cv_in", "sample_and_hold_in", "sample_and_hold_out", "slew_out", "modulation_out", "attenuverter_out", "cv_param_in", "clock_in", "clock_out", "clock_division_out", "reset_in", "run_stop_in", "logic_out", "gate_out", "trigger_out", "accent_in", "sequence_cv_out", "step_select_in", "step_gate_out", "pattern_select_in", "quantizer_in", "quantized_pitch_out", "scale_root_cv_in", "feedback_send", "feedback_return", "dry_wet_cv_in", "freeze_in", "record_in", "delay_time_cv_in", "tap_tempo_in", "sample_start_cv_in", "playback_speed_cv_in", "drum_trigger_in", "drum_param_cv_in", "multiple_out", "switch_out", "headphone_out", "external_in", "midi_cv_out", "expander_link"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Manufacturer id.",
                "type": "string"
              },
              "names": {
                "description": "Module names (or ids) to resolve, up to 100. Order and duplicates preserved. Not combinable with filters.",
                "items": {
