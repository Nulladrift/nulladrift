        "url": "https://mcp.dataart.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.dataart/case-studies",
        "version": "1.1.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_case",
          "title": "Get a DataArt case study",
          "description": "Get the full content of one case study (article text, challenge, solution, conclusion). The texts are Markdown. Pass the id, slug or url returned by search_cases.",
          "inputSchema": {
            "properties": {
              "idOrSlug": {
                "description": "Case study id, slug or url from search_cases.",
                "type": "string"
              }
            },
            "required": ["idOrSlug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a DataArt case study"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a941f39a209ec652ca5922114ba685a2b0d6a752eb109b5bfce743240c8b9c60"
        },
        {
          "name": "get_case_tags",
          "title": "List DataArt case study filters",
          "description": "Get all available tags that can be used to filter case studies. Returns a list of tags with id, parentId, and title. The list is flat: parentId is always null. Use the tag ids in the search_cases tagIds parameter.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List DataArt case study filters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7299111e7c1dbe9042e1827c8df19601ab42f609e28b6d6c3fda61321860d856"
        },
        {
          "name": "search_cases",
          "title": "Search DataArt case studies",
          "description": "Search DataArt case studies by text query and/or tag IDs with pagination. The query can be keywords or a whole question: it is split into words, common words are ignored, whole words are matched in the title, description and tag names (British/American spelling and plurals are folded). Cases containing every word come first (allTermsTotal of them), then cases containing some of the words, best match first. Pass an empty query to browse all cases. Use get_case_tags to discover available tag IDs before filtering. Text and tags combine with AND. Multiple tags combine per tagMatch: \"any\" (default) or \"all\". Returns short records; use get_case with the id, slug or url of a result to get its full text.",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "description": "Page number, 1-based. Default is 1.",
                "type": "integer"
              },
              "pageSize": {
                "default": 20,
                "description": "Items per page. Default is 20, maximum 50.",
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a question, e.g. \"telemedicine\" or \"Have you built a trading platform?\". Pass empty string to skip text filtering.",
                "type": "string"
              },
              "tagIds": {
                "default": "",
                "description": "Comma-separated tag IDs to filter by (e.g. \"12,45\"). Pass empty string to skip tag filtering.",
                "type": "string"
              },
              "tagMatch": {
                "default": "any",
                "description": "\"any\" (default) - case has at least one of the tags; \"all\" - case has every tag.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search DataArt case studies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e33ee538b817b71cbbd321cd429a15e924667858850db906cee29752703759fd"
        }
      ],
      "digest": "sha256:cb4150fb2dcb9eed681920696bcc959edeb742401467b8f456690f9fca782da8"
    }
  }
