      },
      "instructions": "BLIA answers what a Canadian bank published about a chequing account: fees, fee-waiver rules, welcome offers and benefits, each with an effective date. Start with list_bank_products to get a product_slug, then use get_product_terms for one account, compare_products for several, list_offers for welcome offers or list_benefits for ongoing perks. Rules: not_published, unresolved and not_recorded mean unknown, never zero or none. A waiver is never applied to a customer's balances; give its conditions. Say when a question falls outside coverage (every response carries it, as does blia://coverage). Follow freshness.guidance and before_acting. The full rules are at blia://agent-guide.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare published fees across products",
          "description": "Use this when the user wants to compare accounts, within one bank or across banks. One call returns, for each product: monthly fee, annual fee before waivers, included transactions (checked against monthly_transactions if given), minimum balance, NSF fee, the fee-waiver conditions (summary and logic), e-transfer and ATM terms, and what is missing -- plus a ranking by monthly fee with the annual difference to the lowest. It never applies a waiver to the customer's balances: it gives the conditions so they can be checked. Products whose fee BLIA has not published are listed as not_ranked, never ranked as free. The ranking uses published monthly fee and nothing else: monthly_transactions adds a separate ranking_at_usage and the included-transactions check, and never changes ranking_by_monthly_fee. For one account's complete terms and rule logic use get_product_terms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "How the account is opened. Default \"any\" (terms that apply whatever the channel).",
                "enum": ["branch", "online", "any"],
                "type": "string"
              },
              "cohort": {
                "description": "Customer group the terms apply to. Default \"current\" (the standard offer). Other groups a product carries (e.g. \"senior_60_plus\") are listed per product as variants; pass one to get that group's terms. Case and punctuation are ignored.",
                "type": "string"
              },
              "monthly_transactions": {
                "description": "Optional: the customer's typical debit transactions per month, checked against each product's included transactions.",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "product_slugs": {
                "description": "2 to 10 product_slugs from list_bank_products, from one or several banks.",
                "items": {
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "province": {
                "description": "Province: a two-letter code (ON, QC, ...) or a name such as Ontario or Québec. Default \"ALL\".",
                "type": "string"
              }
            },
            "required": ["product_slugs"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "as_of": {
                "description": "When the snapshot was built, ISO 8601 UTC.",
                "type": "string"
              },
              "coverage": {
                "additionalProperties": true,
                "description": "What BLIA does and does not cover: product classes, institutions, kinds of information.",
                "properties": {},
                "type": "object"
              },
              "coverage_scope": {
                "description": "The product class, institutions and lineup completeness the snapshot covers.",
                "type": "string"
              },
              "disclaimer": {
                "description": "BLIA's disclaimer, verbatim. Include it when relaying values.",
                "type": "string"
              },
              "freshness": {
                "additionalProperties": true,
                "properties": {
                  "as_of": {
                    "description": "When the snapshot was built, ISO 8601 UTC.",
                    "type": "string"
                  },
                  "guidance": {
                    "description": "What to say and what to confirm with the institution at this age.",
                    "type": "string"
                  },
                  "staleness_days": {
                    "description": "Whole days since as_of.",
                    "type": "number"
                  },
                  "status": {
                    "description": "How old the snapshot is: current up to 30 days, aging up to 90, then stale.",
                    "enum": ["current", "aging", "stale"],
                    "type": "string"
                  }
                },
                "required": ["as_of", "guidance", "staleness_days", "status"],
                "type": "object"
              },
              "freshness_warning": {
                "description": "Repeats freshness.guidance when the snapshot is not current.",
                "type": "string"
              },
              "not_ranked": {
                "description": "Products left out of the ranking and why; never ranked as free.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "product_slug": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["product_slug", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "publication_seq": {
                "description": "Publication number of the snapshot being served.",
                "type": "integer"
              },
              "ranking_by_monthly_fee": {
                "description": "Products with a published CAD monthly fee, cheapest first, ties by product_slug. Nothing else affects the order.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "product_slug": {
                      "type": "string"
                    }
                  },
                  "required": ["product_slug"],
                  "type": "object"
                },
                "type": "array"
              },
              "staleness_days": {
                "description": "Whole days since as_of.",
                "type": "number"
              }
            },
            "required": ["as_of", "coverage", "coverage_scope", "disclaimer", "freshness", "not_ranked", "publication_seq", "ranking_by_monthly_fee", "staleness_days"],
            "type": "object"
          },
