        {
          "name": "get_product_terms",
          "title": "Get published terms for one product",
          "description": "Use this when the user asks about one account's fees, included transactions, minimum balance, fee waiver conditions, e-transfer or ATM costs, or deposit insurance. Returns each published term with its value and effective date; a rule comes with its plain-language summary AND its logic (default outcome plus conditions with thresholds, e.g. the balance that waives the monthly fee). Says which customer-group variant was used, which others exist, which questions the terms answer (answerability) and exactly what is not published (before_acting). cohort, province and channel pick the variant (defaults current, ALL and any, echoed in defaults_applied; cohort ignores case and punctuation, so \"Senior 60+\" finds senior_60_plus). If none matches, no_variant_matched lists available_cohorts: a problem with the query, not missing data. An unknown product_slug returns an error naming the nearest published slugs. not_published and unresolved mean unknown, never zero. Free tier: no source quote, content hash, provenance tier or corroboration status. For several accounts side by side use compare_products; for perks or welcome offers across accounts use list_benefits or list_offers. as_of (YYYY-MM-DD) answers for a past date from the rows BLIA holds, each with its effective dates and whether the bank stated them; before BLIA's earliest record it says no_record_before. BLIA cannot say what a fee will be.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Optional past date, YYYY-MM-DD: the terms in force that day, e.g. the day a mortgage funded. A date before BLIA's earliest record answers no_record_before, never a value. Omit for today's terms.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "attributes": {
                "description": "Limit to these attributes (at most 40), e.g. monthly_fee, transaction_limit, minimum_balance, nsf_fee, etransfer_rules, atm_rules. Omit for all.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "channel": {
                "description": "How the account is opened. Default \"any\" (terms that apply whatever the channel).",
                "enum": ["branch", "online", "any"],
                "type": "string"
              },
              "cohort": {
                "description": "Customer group the terms apply to. Default \"current\" (the standard offer). Other groups a product carries (e.g. \"senior_60_plus\") are listed per product as variants; pass one to get that group's terms. Case and punctuation are ignored.",
                "type": "string"
              },
              "product_slug": {
                "description": "A product_slug from list_bank_products, e.g. td-every-day-chequing-account",
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              },
              "province": {
                "description": "Province: a two-letter code (ON, QC, ...) or a name such as Ontario or Québec. Default \"ALL\".",
                "type": "string"
              }
            },
            "required": ["product_slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "as_of": {
                "description": "When the snapshot was built, ISO 8601 UTC.",
                "type": "string"
              },
              "coverage": {
                "additionalProperties": true,
                "description": "What BLIA does and does not cover: product classes, institutions, kinds of information.",
                "properties": {},
                "type": "object"
              },
              "coverage_scope": {
                "description": "The product class, institutions and lineup completeness the snapshot covers.",
                "type": "string"
              },
              "disclaimer": {
                "description": "BLIA's disclaimer, verbatim. Include it when relaying values.",
                "type": "string"
              },
              "freshness": {
                "additionalProperties": true,
                "properties": {
                  "as_of": {
                    "description": "When the snapshot was built, ISO 8601 UTC.",
                    "type": "string"
                  },
                  "guidance": {
                    "description": "What to say and what to confirm with the institution at this age.",
                    "type": "string"
                  },
                  "staleness_days": {
                    "description": "Whole days since as_of.",
                    "type": "number"
                  },
                  "status": {
                    "description": "How old the snapshot is: current up to 30 days, aging up to 90, then stale.",
                    "enum": ["current", "aging", "stale"],
                    "type": "string"
                  }
                },
                "required": ["as_of", "guidance", "staleness_days", "status"],
                "type": "object"
              },
              "freshness_warning": {
                "description": "Repeats freshness.guidance when the snapshot is not current.",
                "type": "string"
              },
              "publication_seq": {
                "description": "Publication number of the snapshot being served.",
                "type": "integer"
              },
              "staleness_days": {
                "description": "Whole days since as_of.",
                "type": "number"
              }
            },
            "required": ["as_of", "coverage", "coverage_scope", "disclaimer", "freshness", "publication_seq", "staleness_days"],
            "type": "object"
