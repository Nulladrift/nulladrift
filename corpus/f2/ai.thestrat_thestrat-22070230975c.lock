              "now": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Current time, ISO 8601. Decides if the last bar is still open. Default: the server clock.",
                "title": "Now"
              },
              "position_timeframes": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The user's timeframes for the positions: [\"Y\"] investor, [\"Q\", \"M\"] position trader, [\"W\", \"D\", \"60\"] swing or day trader. Positions are checked only on these. Ask the user.",
                "title": "Position Timeframes"
