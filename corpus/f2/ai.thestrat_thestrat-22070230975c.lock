        {
          "name": "exhaustion",
          "description": "Exhaustion risk: how much time is left in the signal's bar (session minutes,\n    wall-clock minutes, sessions left, fraction left), and until when the fire stays active.\n\n    Docs example: a 60-minute hammer that triggers at 9:32 has 58 minutes; at 10:25 it has 5.\n    Once the bar closes, the signal is gone. The tool reports time; it does not grade it.\n    ",
          "inputSchema": {
            "properties": {
              "now": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Current time, ISO 8601. Decides if the last bar is still open. Default: the server clock.",
                "title": "Now"
              },
              "signal": {
                "additionalProperties": true,
                "description": "A signal from find_signals, or {\"timeframe\": \"60\", \"trigger_bar_t\": \"2026-10-23T09:30:00-04:00\"}.",
                "title": "Signal",
                "type": "object"
              }
            },
            "required": ["signal"],
            "title": "exhaustionArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06072bd967f7642a5afd282683bfd3b81872bc8da5e7de1618abc75c4dd1d2ed"
        },
        {
          "name": "find_signals",
          "description": "Find TheStrat actionable signals on one timeframe.\n\n    Patterns: 2-2 reversal, 1-2-2 rev strat, 3-2-2, 2-1-2, 3-1-2, 3-2, hammer, shooter,\n    momo hammer/shooter, inside bar, outside bar reversal (2d-3u / 2u-3d), 1-3 rev strat,\n    1-3-2, I-O-I. Each signal has: trigger, target (magnitude, null if the pattern has\n    none), level_of_reclaim, invalidation, status, sequence, kind (reversal/continuation)\n    and source_url (the docs page for the rule).\n\n    Status: setup (trigger not taken), in_force (taken, target not hit, still active),\n    triggered (taken, bar closed, no target), hit_target, failed. Timing: a signal is in\n    force only while its bar is open; D fires stay active until the next session open;\n    the W is closed from Friday close to Monday open.\n    ",
          "inputSchema": {
            "properties": {
              "bars": {
                "description": "OHLC bars, oldest first. Each bar is an object {t, o, h, l, c, v?} (also accepts open/high/low/close/time) or a row [t, o, h, l, c, v?]. t = bar START time, ISO 8601 (New York time if no offset). Daily bars may use a date only.",
                "items": {},
                "title": "Bars",
                "type": "array"
              },
              "include_history": {
                "default": false,
                "description": "Also list older setups and what happened to them (evidence of participation).",
                "title": "Include History",
                "type": "boolean"
              },
              "now": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Current time, ISO 8601. Decides if the last bar is still open. Default: the server clock.",
                "title": "Now"
              },
              "timeframe": {
                "default": "D",
                "description": "Timeframe of the bars: 5, 15, 30, 60, D, W, M, Q or Y.",
                "title": "Timeframe",
                "type": "string"
              }
            },
            "required": ["bars"],
            "title": "find_signalsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdc6ad4f5bd1633ab2e95e12fae621acff8fe4d8e73d6946b1edab8429094933"
        },
