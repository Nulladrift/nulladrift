      "serverInfo": {
        "name": "thestrat",
        "title": "TheStrat for agents",
        "version": "0.3.1",
        "description": "Quant price analysis for AI agents, bring your own OHLC data: TheStrat price action scenarios, multi-timeframe continuity, technical signals with trigger/target/reclaim, simultaneous setups and breaks across a basket, sector rotation by participation.",
        "websiteUrl": "https://thestrat.ai/agents/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "TheStrat tools. You bring OHLC bars; the tools return checkable facts in TheStrat words.\nDo not read charts by eye: call these tools and quote their output.\nFraming: TheStrat does not backtest patterns. It gathers evidence of participation by price and time.\nSay facts (\"SPY day: 2u, above the day open: buyers are more aggressive\"), not opinions (\"looks bullish\").\nWording: distance from an open (and FTFC) is the level of aggression of buyers or sellers: who is more\nwilling to buy at higher prices or sell at lower prices. Describe it only as aggression.\nEvery signal carries a trigger, a target (magnitude) and a level of reclaim, plus source_url: cite it.\nOrder of work: describe_price (whole picture) -> find_signals (one timeframe) -> exhaustion (time left) ->\ndefine_term / docs_search to explain a word. Many symbols at once (a sector ETF + holdings, or SPY QQQ DIA IWM):\nsim_setups (before the break) -> sim_breaks (the break, same bar, 2+ symbols) -> sector_analysis. Bars: oldest first, each {t, o, h, l, c} with t = bar start\n(ISO time, New York session 09:30-16:00). 60-minute bars start at 09:30.\nA user's portfolio (\"protect my assets\"): prompt protect_portfolio, then portfolio_check. Report conditions\nand evidence only, never an action (\"buy\", \"sell\", \"hedge\").\n",
      "tools": [
        {
          "name": "buy_sell_list",
          "description": "Buy list and sell list: reversal signals in force across timeframes (technical signals\n    screener on your own data). Buy: hammer, 2d-2u, 3-2u, 1-2u in force. Sell: shooter, 2u-2d,\n    3-2d, 1-2d in force. Continuations (2u-2u, 2d-2d) do not count. Per timeframe: symbols,\n    count, % of basket, trigger, target and level of reclaim; plus which timeframes each\n    symbol is on.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO time. Use only bars that start at or before this time (replay a past bar).",
                "title": "As Of"
              },
              "basket_by_timeframe": {
                "additionalProperties": {
                  "additionalProperties": {
                    "items": {},
                    "type": "array"
                  },
                  "type": "object"
                },
                "description": "Bars per timeframe, then per symbol: {\"M\": {\"AAPL\": [...], ...}, \"W\": {...}}. Up to 4 timeframes; 60 symbols and 500 bars per symbol each.",
                "title": "Basket By Timeframe",
                "type": "object"
              },
              "now": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Current time, ISO 8601. Decides if the last bar is still open. Default: the server clock.",
                "title": "Now"
              }
            },
            "required": ["basket_by_timeframe"],
            "title": "buy_sell_listArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a748c6a99e9f6617859e21eb8246e4f3a2b7a67400e4868468641549605d8cda"
        },
        {
          "name": "classify_bars",
          "description": "Label every bar as TheStrat scenario 1, 2u, 2d or 3 (Truth #1).\n\n    Rule: compare each bar with the bar before it. Took the prior high only = 2u. Took the\n    prior low only = 2d. Took both = 3. Took neither = 1 (inside bar). Equal to the prior\n    high/low is NOT a take-out (still a 1). The first bar has no scenario (null).\n    Also returns color, hammer/shooter shape, failed-2 flags (2u red / 2d green = potential 3)\n    and 3u/3d when the bar has first_side data. Use this instead of reading a chart.\n    ",
          "inputSchema": {
            "properties": {
              "bars": {
                "description": "OHLC bars, oldest first. Each bar is an object {t, o, h, l, c, v?} (also accepts open/high/low/close/time) or a row [t, o, h, l, c, v?]. t = bar START time, ISO 8601 (New York time if no offset). Daily bars may use a date only.",
                "items": {},
                "title": "Bars",
                "type": "array"
              }
            },
            "required": ["bars"],
            "title": "classify_barsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb8a871652ad9de55f0777bcd20983a97ee18ad6f41c5868e977dbe835479eb6"
        },
