        },
        {
          "name": "describe_price",
          "description": "Multi-timeframe price analysis in plain language for one symbol (quant price action,\n    technical signals, timeframe continuity) from your own bars.\n\n    Returns `text` (one short line per timeframe, e.g. \"SPY day: 2u, above the day open\n    (green). Last 3 bars: 2d 1 2u. In force: bullish 2-1-2 ...\") and the same facts as\n    JSON: scenario, color, last 3 bars, signals in force, setups, and FTFC (M W D 60).\n    Start here, then quote the text to the user. Hosted server: free, no cooldown.\n    Fair-use limit: 60 calls per minute.\n    ",
          "inputSchema": {
            "properties": {
              "bars_by_timeframe": {
                "additionalProperties": {
                  "items": {},
                  "type": "array"
                },
                "description": "Bars per timeframe, e.g. {\"M\": [...], \"W\": [...], \"D\": [...], \"60\": [...]}. Give at least 3 bars per timeframe; more gives more signals.",
                "title": "Bars By Timeframe",
                "type": "object"
              },
              "now": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Current time, ISO 8601. Decides if the last bar is still open. Default: the server clock.",
                "title": "Now"
              },
              "symbol": {
                "description": "Ticker, e.g. SPY.",
                "title": "Symbol",
                "type": "string"
              }
            },
            "required": ["bars_by_timeframe", "symbol"],
            "title": "describe_priceArguments",
            "type": "object"
          },
          "behavior": {
