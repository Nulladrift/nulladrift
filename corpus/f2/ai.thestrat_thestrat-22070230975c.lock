                ],
                "default": null,
                "description": "Optional, up to 3: the holdings of an ETF the user owns, {\"WGMI\": {\"IREN\": [...], ...}}, on etf_timeframe. For the concentration check.",
                "title": "Etf Baskets"
              },
              "etf_timeframe": {
                "default": "D",
                "description": "Timeframe of the etf_baskets bars: D (default) or W.",
                "title": "Etf Timeframe",
