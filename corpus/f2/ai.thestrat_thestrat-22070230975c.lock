        {
          "name": "portfolio_check",
          "description": "Protect-your-assets check for one portfolio, from your own bars: measurable conditions on the\n    losing side of the user's positions, with the evidence. Read the playbook first: MCP resource\n    thestrat://playbooks/protect-portfolio (or the prompt protect_portfolio).\n\n    Returns (1) the market condition: \"Algorithmic buying identified in VIX while algorithmic selling in\n    4 major indexes\" (VIX symbol over its M W D 60 opens, SPY QQQ IWM DIA each under all 4), confirmed or\n    not at a 60-minute close, plus the VIX futures curve state if given; (2) per position, the opens on\n    the holder's losing side (long: under the open = buyers on that timeframe are losing; short: over the\n    open = sellers are losing), reversals in force against the position (buy/sell list rule) and setups\n    against it (trigger not taken), with trigger, target and level of reclaim; (3) concentration: the %\n    of the user's basket (and of each ETF basket) whose current bar took the prior bar's low or high,\n    labelled at 80%+. Each part has `text` to quote and source URLs. Conditions only: not a buy or sell\n    signal. Quote `footer` at the end.\n    ",
          "inputSchema": {
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO time. Use only bars that start at or before this time (replay a past bar).",
                "title": "As Of"
              },
              "bars_by_timeframe": {
                "additionalProperties": {
                  "additionalProperties": {
                    "items": {},
                    "type": "array"
                  },
                  "type": "object"
                },
                "description": "Bars per timeframe, then per symbol: {\"M\": {\"NVDA\": [...], \"VIXY\": [...], \"SPY\": [...]}, \"W\": {...}, \"D\": {...}, \"60\": {...}}. Each position on the user's timeframes (investor Y; position trader Q M; swing or day trader W D 60). VIX or a VIX ETN (VIXY, VXX, UVXY) and SPY QQQ IWM DIA on M W D 60 for the market condition. The last bar of each timeframe must be the current bar (its open is the open). 60 symbols and 500 bars per symbol per timeframe; 10 to 50 bars are enough.",
                "title": "Bars By Timeframe",
                "type": "object"
              },
              "etf_baskets": {
