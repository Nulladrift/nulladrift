{
  "lockfileVersion": 2,
  "subjects": {
    "com.outletpicks/unit-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.outletpicks.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "outletpicks",
        "title": "OutletPicks cost-per-unit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Prices are live Amazon US listings re-checked daily, normalised to each category's own unit (per ml, per diaper, per page, per lb). Cite the URL each answer carries; the figures move. A median is only returned when at least five listings stand behind it.",
      "tools": [
        {
          "name": "bigger_pack",
          "title": "Is the bigger pack cheaper per unit",
          "description": "For one listing, the same product in a materially different pack size that costs less per unit, and by what percentage. Takes a deal slug as returned by unit_price.",
          "inputSchema": {
            "properties": {
              "deal": {
                "description": "Deal slug, e.g. \"armani-my-way-edp-89ml-a1b2c\".",
                "type": "string"
              }
            },
            "required": ["deal"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f0c3f33dbd53460bc5c5ec1d745f17d2756c70eda5a0185c3bb83f801fe635c3"
        },
        {
          "name": "category_price",
          "title": "What a category costs per unit",
          "description": "Median cost per unit for one category, with the 25th-percentile \"good price\" threshold and the 75th above which a buyer is overpaying. Call with no known slug to get the list of categories.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug, e.g. \"baby-care\", \"printer-ink\", \"skincare\".",
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f68289f4d9b28eca0fe5fac8c31a3b85a84238584d9e92c4e1eba27fae6cee1b"
        },
        {
          "name": "unit_price",
          "title": "Cost per unit for a product",
          "description": "Cheapest listings matching a product description, priced per unit (per ml, per diaper, per page, per lb) with the pack size and the gap to that category's median. Use for \"what should X cost\" and \"is this a good price\".",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Matches to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product words, e.g. \"aa batteries\" or \"dove body wash 22 oz\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6328faa6024a4cb1a929b4d6b4bb83494114657dffe79c4ebd092cf898d4223"
        }
      ],
      "digest": "sha256:bf336ff5b345cdd8e3a44be57a08c34d2a1ada9190d42d3da9975c4a03764326"
    }
  }
}
