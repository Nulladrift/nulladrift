      "instructions": "Eckari is a machine-native utility layer: each tool is one deterministic external capability,\npriced per call and payable either with an Eckari account key (Authorization: Bearer ek_...)\nor accountlessly per call with x402. Eckari performs no reasoning - call a tool only when you\nneed the underlying real-world record, and read `_meta['eckari/pricing']` before calling.\n\nEvery successful result is the canonical Eckari envelope { data, meta } in the tool result's\nstructuredContent - that is the authoritative answer. The single text line beside it is only a\nsummary (capability, outcome, request_id); never parse it. meta carries capability, version,\nretrieved_at, source, freshness and request_id. Quote request_id when reporting a problem.\nWhen the source licence requires acknowledgement, meta.attribution (and meta.attribution_url)\ncarry the exact statement - republish it with the data.\n\nLists always answer { items: [...], page: { limit, offset, returned, total, has_more,\nnext_offset } }; page.has_more is authoritative and next_offset is the next request's offset.\n\nTool metadata here is deliberately compact: it tells you which tool to call and how to call it.\nThe full output schema, examples and provenance for a capability are served on demand at\nhttps://api.eckari.com/v1/capabilities/{capability_id} (also in _meta['eckari/schema_url']) and in\nthe OpenAPI document. Fetch one only when you need the field-level contract.\n\nAn unpaid x402 call returns isError with `_meta['x402/payment-required']`; retry the same tool\nwith the signed payload in `_meta['x402/payment']`.\n\nTools:\n- company_uk_accounts: Return the accounts filing status of a UK company from the Companies House register — the accounting reference date, the last accounts filed (type and period), the next accounts due date and a derived overdue flag. This is the filing position, not the financial statements: no turnover, profit or balance-sheet figures are published here. (USD 0.003/call)\n- company_uk_charges: Charges registered against a UK company at Companies House — mortgages, debentures and other security — with dates, classification, particulars and the persons entitled. Register-wide outstanding/satisfied/part-satisfied counts lead the answer, and each charge carries a derived is_outstanding because the register records discharge under two status keys. (USD 0.006/call)\n- company_uk_directors: Directors of a UK company from the Companies House officers register — the register of directors, secretaries and LLP members — including corporate and nominee directors, with appointment and resignation dates, nationality, country of residence, occupation, month/year of birth and correspondence address. role and include_resigned widen it. (USD 0.005/call)\n- company_uk_filings: Return the filing history of a UK company from the Companies House register — accounts, confirmation statements, officer appointments, address and capital changes, resolutions and mortgages — most recent first, optionally filtered by category, with date, form type (AA, CS01, AP01, TM01), the readable register description, registrar annotations and a document_url for every filed image. (USD 0.005/call)\n- company_uk_owners: An empty items list is never the same as \"no owner\": ownership_status and the filed PSC statements/exemptions explain why the register discloses none. Returns the persons with significant control (PSCs) for a UK company — the individuals, entities or legal persons that own or control it — each nature of control carrying the register code and its official text, with dates and public identification. The UK statutory beneficial-ownership (UBO) record. (USD 0.008/call)\n- company_uk_profile: Return the core registered profile of a UK company from the Companies House register: name, status with derived is_active and is_striking_off, type, jurisdiction, incorporation and cessation dates, SIC codes with their official UK SIC 2007 descriptions, registered office address, previous names, and the accounts and confirmation-statement summary. One call for the standard KYB company record. (USD 0.004/call)\n- company_uk_registered_office: Return the current registered office address of a UK company from the Companies House register as structured fields (premises, address lines, locality, region, postcode, country) plus a single-line rendering for correspondence, address matching and verification. This is the statutory registered address, not a trading or branch address. (USD 0.003/call)\n- company_uk_search: Search the UK Companies House register by name or keyword and return matching companies with company number, register status and a derived is_active, type, incorporation and cessation dates and the register's one-line address snippet. Use this first when you only have a name, then call the per-company capabilities with the returned company_number. Ordering is the register's own, echoed as match_rank — a position, not a relevance score. (USD 0.002/call)\n- company_uk_status: Return the current legal status of a UK company from the Companies House register — active, dissolved, liquidation, administration, receivership, voluntary-arrangement and others — with status detail, cessation date, a derived is_active (true for the live-on-the-register statuses active, open and registered) and a derived is_striking_off for an active company with a proposal to strike off. One call, one authoritative register answer. (USD 0.003/call)\n- company_us_filings: Return the recent EDGAR filing history of a US company identified by stock ticker (AAPL) or CIK, optionally filtered by form type and filing date and paged. It is the company's own EDGAR index, so it also holds filings third parties made about it (SCHEDULE 13G, Forms 3/4/5, UPLOAD). Each entry carries the accession number, form, dates, 8-K items, XBRL flags, size and sec.gov links. (USD 0.005/call)\n- company_us_filings_latest: Give a stock ticker (AAPL) or CIK and get the most recent EDGAR filing of each requested form — by default the latest 10-K, 10-Q and 8-K — with filing and report dates and a direct sec.gov link to each primary document. Request other forms (4, SCHEDULE 13G) and you get the newest one filed about the company. Requested forms with no recent filing are named in forms_not_found, never dropped. (USD 0.003/call)\n- company_us_profile: Look up an SEC filer by stock ticker (AAPL) or CIK and return its registered profile — legal name, entity type, SIC industry code and description, EIN, filer category, fiscal year end, state of incorporation, tickers and exchanges, former names, business and mailing addresses and phone. Tickers are matched exactly; company names are not accepted (resolve one with company.us.resolve). (USD 0.004/call)\n- company_us_resolve: Turn a company-name fragment or stock ticker into the SEC EDGAR identifiers. Searches the SEC listed-security index and returns ranked matches with the 10-digit CIK, ticker, registered name and listing exchange. Deterministic ranking: ticker exact, then name exact, then name prefix, then name contains. Use it for names — the other company.us.* capabilities take a ticker directly. (USD 0.002/call)\n- domain_expiry: Registry expiry date for a domain read live from the authoritative registry RDAP server, with whole days remaining, the registry status codes, the registrar name and the registry's own last-update timestamp. A focused, cheaper subset of domain.registration for renewal monitoring and portfolio checks. (USD 0.002/call)\n- domain_registration: The WHOIS lookup for a domain, answered from the registry's own RDAP service - the structured successor to port-43 WHOIS, read live via the IANA bootstrap, never scraped WHOIS text. Registrar and IANA id, RDAP/EPP status codes, creation, update and expiry dates, nameservers, DNSSEC, days until expiry and the terms link. Registrant contacts are redacted by registries. (USD 0.004/call)\n- entity_lei_profile: Return the registry-authoritative GLEIF record for a Legal Entity Identifier — legal and previous names, legal and headquarters addresses, jurisdiction, legal form, entity and registration status, renewal dates (with days until renewal), managing LOU, corroboration level, BIC codes and the named local registry. The LEI checksum is validated before any lookup. (USD 0.004/call)\n- entity_lei_search: Find Legal Entity Identifiers by company name in the global GLEIF register, optionally narrowed to one country. Returns the LEI, legal name, registration and entity status, jurisdiction, legal address and the local registry the entity is registered at — the identifier bridge between national company registers worldwide. (USD 0.003/call)\n- fx_reference_rate: European Central Bank euro foreign exchange reference rate for a pair - the official daily fix used for accounting, invoicing and reporting - latest or any date in the last 90 days. The ECB publishes EUR/XXX only, so inverse and cross rates are computed from the same fix and named in rate_derivation. One fix per TARGET working day, not a tradable market rate. (USD 0.002/call)\n- location_us_geocode: Convert a one-line US street address into coordinates using the US Census Bureau Geocoder. Returns the standardised matched address, latitude and longitude to 6 decimal places, the TIGER/Line segment and parsed address components. Coordinates are interpolated along street address ranges, not rooftop or parcel positions. No match is a normal answer, not an error. (USD 0.003/call)\n- location_us_geographies: Return the US Census Bureau geographies containing a latitude/longitude — state, county, census tract, block group, census block, incorporated place, congressional district and ZIP Code Tabulation Area — each with its FIPS or GEOID. The standard way to attach official US statistical geography to a point. (USD 0.003/call)\n- parcel_detect_carrier: Identify which carrier issued a tracking number using a deterministic, versioned signature set - prefixes, lengths, carrier check digits and UPU S10 structure - returning the carrier, how distinctive the match is, every ranked candidate with typed evidence, and the parsed S10 details. No upstream call and no carrier account required. (USD 0.001/call)\n- weather_us_alerts: Active National Weather Service watches, warnings and advisories for a US coordinate or a two-letter state or marine area code - event, severity, certainty, urgency, headline, affected areas and zone codes, and effective/onset/expiry times in UTC. Read at request time, so an empty list means nothing is active. The 5 newest come back by default; detail=full adds the NWS narrative. (USD 0.003/call)\n- weather_us_forecast: Official National Weather Service forecast for any US coordinate - six 12-hour day/night periods by default, or hourly - each with temperature in C and F, precipitation probability, a wind speed range in km/h, wind direction and a short forecast, plus the NWS issue time so an agent can judge its age. detail=full adds the narrative, icon, dewpoint and humidity. United States, its territories and coastal waters only. (USD 0.003/call)\n- weather_us_observation: Latest surface observation from the nearest National Weather Service station to a US coordinate, with the station identity, the observation time (observed_at), its age in seconds and an is_stale flag. Station observations are reported roughly every 20-60 minutes, so this is the most recent measurement, not a real-time reading. Readings that fail the station's quality control are returned as null. (USD 0.003/call)\n\nCatalogue: https://api.eckari.com/v1/capabilities | OpenAPI: https://api.eckari.com/v1/openapi.json | Docs: https://eckari.com",
      "tools": [
        {
          "name": "company_uk_accounts",
          "title": "Check UK company accounts due dates on Companies House",
          "description": "Return the accounts filing status of a UK company from the Companies House register — the accounting reference date, the last accounts filed (type and period), the next accounts due date and a derived overdue flag. Use when: When are this UK company's accounts due? Not for: You need financial figures (turnover, profit, balance sheet) — not on the public register API. Related: company_uk_filings; company_uk_profile; company_uk_status. Price: USD 0.003/call (x402), 0.002 (account key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_number": {
                "description": "Companies House company number, also called the company registration number (CRN). Accepted shapes are the register's own — 1-8 digits (zero-padded to 8, e.g. 445790 → 00445790), one letter + 7 digits (R0000001), two letters + 6 digits (SC002180, NI000001, OC123456, OE000001), or the registered-society suffix forms (two letters + 5 digits + 1 letter; two letters + 4 digits + 2 letters). Case-insensitive; surrounding whitespace is ignored (which is why maxLength is 10); internal spaces and punctuation are not accepted. Any other value (for example PROBE) is rejected as INVALID_INPUT before payment and before any upstream call.",
                "maxLength": 10,
                "minLength": 1,
                "pattern": "^\\s*(?:[0-9]{1,8}|[A-Za-z][0-9]{7}|[A-Za-z]{2}[0-9]{6}|[A-Za-z]{2}[0-9]{5}[A-Za-z]|[A-Za-z]{2}[0-9]{4}[A-Za-z]{2})\\s*$",
                "type": "string"
              }
            },
            "required": ["company_number"],
            "type": "object"
