              "since": {
                "description": "Keep only filings with a filing_date on or after this ISO date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
