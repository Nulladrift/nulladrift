          "title": "Detect the carrier from a tracking number",
          "description": "Identify which carrier issued a tracking number using a deterministic, versioned signature set - prefixes, lengths, carrier check digits and UPU S10 structure - returning the carrier, how distinctive the match is, every ranked candidate with typed evidence, and the parsed S10 details. No upstream call and no carrier account required. Use when: Which carrier is this tracking number from? Not for: You need tracking events, status or delivery estimates - not yet available. Price: USD 0.001/call (x402), 0.001 (account key).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination_country": {
                "description": "Optional ISO 3166-1 alpha-2 destination country hint. Used only as a small tie-breaker; it never invents a candidate.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "origin_country": {
                "description": "Optional ISO 3166-1 alpha-2 origin country hint. Used only as a small tie-breaker; it never invents a candidate.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "tracking_number": {
                "description": "Tracking or consignment number. Spaces and hyphens are removed and letters upper-cased before matching (4-40 letters and digits after normalisation). Digits and letters are never altered.",
