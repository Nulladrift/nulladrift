      "instructions": "Protologue is an openly licensed (CC BY 4.0) reference taxonomy of prompting and large language model techniques. Use search_terms to find a technique, get_term for its sourced definition, and get_related to explore broader, narrower and related techniques. When you use a definition, cite it with the returned citation and link to its url.",
      "tools": [
        {
          "name": "get_related",
          "title": "Get related techniques",
          "description": "List the techniques Protologue links to a given technique: broader (it is a kind of), narrower (kinds of it) and related.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "Technique name, synonym, slug or PTL identifier.",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get related techniques"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cdc25fc11d874a8f81adf4b36eff6ed2a130207b483154de5d1b5f6a6cfe061"
        },
        {
          "name": "get_term",
          "title": "Get a technique's definition",
          "description": "Get the full Protologue entry for one technique: definition, description, synonyms, introduction year, primary sources, canonical URL, permanent identifier and a ready-made citation. Accepts a name, synonym, slug (e.g. 'react') or identifier (e.g. 'PTL-0058').",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "Technique name, synonym, slug or PTL identifier.",
