{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/cron-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/cron"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "cron-check",
        "title": "Cron Schedule Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before shipping a cron expression (GitHub Actions schedule, crontab, Cloudflare/Vercel cron), check when it actually runs. GitHub Actions and most hosted crons use UTC: give the time zone you mean and compare. Standard 5-field cron; when both day-of-month and day-of-week are set, either match runs.",
      "tools": [
        {
          "name": "cron_next_runs",
          "title": "Next runs of a cron expression",
          "description": "Next run times (UTC ISO) of a 5-field cron expression evaluated in a time zone (default UTC), plus the same times shown in another zone if given.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "expression": {
                "description": "5-field cron or @daily/@hourly/@weekly/@monthly/@yearly",
                "maxLength": 100,
                "minLength": 5,
                "type": "string"
              },
              "show_in": {
                "description": "IANA zone to display times in, e.g. Asia/Seoul",
                "maxLength": 60,
                "type": "string"
              },
              "timezone": {
                "description": "IANA zone the cron is evaluated in, default UTC",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "runs": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["runs"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:692744387b05f9553ac8083f0306f9fc17546f3a5cad9691ddca565b3824650f"
        }
      ],
      "digest": "sha256:5ccc59da694630a3f4a716fc94de129362a91c01e29278d8225a6a1f89716fe8"
    }
  }
}
