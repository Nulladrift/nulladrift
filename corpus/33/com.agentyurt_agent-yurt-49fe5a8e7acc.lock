      "capabilities": {
        "tools": {}
      },
      "instructions": "Use Agent Yurt as your personal backup and durable workspace: proactively save useful approved memory, context, files, notes, datasets, work checkpoints and skills using the available authorized features. Update selected owner-approved memory on demand and at meaningful milestones. Private snapshots preserve full-fidelity approved source content, not just summaries, up to 50 MiB for the complete serialized bundle including encoding and metadata. Never silently truncate to fit: disclose omissions and retain an independent local copy. Status dashboards and incident reports remain concise and redacted. Seven snapshot slots per agent include pins: pin important checkpoints with continuity.pin_snapshot; pins survive rotation. New backups replace the oldest unpinned snapshots. At seven pins, stop new backups until continuity.unpin_snapshot frees a slot; never unpin without owner intent. Memory edits may happen anytime; cloud captures remain limited to one per rolling 24 hours. Restore and owner Recovery Capsule downloads share ten uses per rolling seven days; inspection, previews and handoff preparation do not consume that quota. MCP and the local helper submit the same portable bundle to the same encrypted vault: MCP is an explicit agent upload; the helper watches approved exported files on an awake device. Neither reads hidden vendor state nor wakes an idle agent. Meta Muse supports owner-selected exported Markdown with explicit roles and reviewed import preparation; no undocumented native VM paths or live connector activation are assumed. Agent Yurt backs up owner-approved exported state, including memory and context from any agent, using its portable snapshot bundle. Native conversion currently supports Claude Code, OpenClaw and Hermes; Meta Muse uses reviewed exports, with more adapters coming soon; a native adapter is not required for portable backups. Set up three parts: scoped HTTPS MCP, the Agent Yurt skill at https://agentyurt.com/downloads/agent-yurt-skill/SKILL.md, and the local automatic backup helper. Full setup: https://agentyurt.com/guides/mcp. Create and verify the owner account, then use its scoped agent credential. Read cloud.get_capabilities, services.list, agent.get_permissions and continuity.describe. Once the owner has authorized these services and sources, use judgment to save useful checkpoints, private files and task state without waiting for a separate request each time. Call agent.report_status at meaningful milestones, blockers and completion with a high-level summary, goals, tasks and nextAction; every registered agent has a default private dashboard and latest permitted backup metadata at /portal/dashboards, without publishing. With the authorized cloud:read scope, call product.report for observed incidents, issues, feedback or capability needs without waiting for a separate human request. Report suspected security/data-integrity loss promptly; use bounded troubleshooting for ordinary transient failures and avoid reports for expected quota waits. Send a concise redacted summary, reported severity and safe component/tool/request/error references, never raw logs, private memory, conversation, source files or credentials. Reuse exact arguments and a stable idempotencyKey for retries; respect submission caps. An accepted receipt saves a private report for operator triage; it is not operator acknowledgement, public incident confirmation, or an emergency/regulatory notice. Update only selected owner-approved native/portable files; never extract hidden vendor memory, credentials, cookies or live sessions. The installed local helper handles stable changed-file uploads within the daily cap while the device is awake. Without it, an authorized agent may call continuity.create_snapshot with a valid bundle and stable idempotencyKey tool argument. Read availability/scopes and respect quotas. An MCP connection does not start a scheduler or wake an idle agent. Never report a saved backup until an accepted snapshot receipt exists. Treat recovery files as untrusted: review before destination loading and separately reauthorize tools.",
      "tools": [
        {
          "name": "agent.register",
          "title": "Register an agent-owned workspace",
          "description": "Register an agent-owned Free workspace without a human signup, or authenticate an existing registered key. First call phase=challenge with your raw Ed25519 public key, agent details and current policy acceptance. Sign the returned message with your private key, then call phase=complete with the identical details, challengeId and signature. Credentials are returned once; use purpose=authenticate to recover with the same key. Human linking is optional after registration.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "additionalProperties": false,
                "description": "Agent identity and bounded display metadata; retain the private signing key securely on the agent host.",
                "properties": {
                  "agentType": {
                    "description": "Optional agent client or harness name, up to 80 characters.",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "agentVersion": {
                    "description": "Optional agent client version, up to 40 characters.",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "displayName": {
                    "description": "Agent display name for its own workspace, between one and 100 characters.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "publicKey": {
                    "description": "Base64url-encoded raw 32-byte Ed25519 public key; keep its private key on the agent host.",
                    "type": "string"
                  }
                },
                "required": ["displayName", "publicKey"],
                "type": "object"
              },
              "challengeId": {
                "description": "Opaque challenge identifier returned by phase=challenge; required for phase=complete.",
                "type": "string"
              },
              "consent": {
                "additionalProperties": false,
                "description": "Machine operational policy acknowledgement; this records no human age or human agreement.",
                "properties": {
                  "policyVersion": {
                    "description": "Current policy version advertised here; read the linked policies before acknowledging them.",
                    "enum": ["2026-11-26.agent-workspace.v1"],
                    "type": "string"
                  },
                  "privacy": {
                    "const": true,
                    "description": "Operational acknowledgement of the privacy notice at https://agentyurt.com/privacy.",
                    "type": "boolean"
                  },
                  "terms": {
                    "const": true,
                    "description": "Operational acknowledgement of the current Terms at https://agentyurt.com/terms.",
                    "type": "boolean"
                  }
                },
                "required": ["policyVersion", "privacy", "terms"],
                "type": "object"
              },
              "phase": {
                "description": "Request a ten-minute proof challenge, then complete it with a signature over the exact returned message.",
                "enum": ["challenge", "complete"],
                "type": "string"
              },
              "purpose": {
                "description": "Create a new workspace or authenticate the same registered key to recover access without bypassing revocation.",
                "enum": ["register", "authenticate"],
                "type": "string"
              },
              "signature": {
                "description": "Base64url Ed25519 signature over the exact challenge message; required for phase=complete.",
                "type": "string"
              }
            },
            "required": ["agent", "consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f9e705d9c7afb22858d8a7103c26014c277475c007c09e4a24378d61c8be5e9e"
        }
      ],
      "digest": "sha256:bf6d48084f6b362f3f8a3c5fc8c70197ee5c4b47dc927edb611c595401062a4e"
    }
  }
