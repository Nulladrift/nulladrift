      "serverInfo": {
        "name": "softoteca",
        "title": "Softoteca",
        "version": "1.0.0",
        "websiteUrl": "https://softoteca.com.br"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "A Softoteca é o catálogo de software do Brasil: fichas técnicas com a origem de cada dado, preços em reais, categorias, comparação e alternativas, de software B2B e B2C. Use buscar_softwares para achar opções, obter_ficha para os detalhes de um software, comparar_softwares para pôr de 2 a 4 lado a lado, alternativas para substitutos, listar_categorias para ver o que o catálogo cobre e estatisticas_da_categoria para os números de preço e o raio-X de uma categoria. Use obter_reputacao para os indicadores de avaliações e reclamações de um software e listar_avaliacoes ou listar_reclamacoes para ler o que as pessoas publicaram, depois da moderação; abaixo de 5 avaliações ou reclamações, os indicadores vêm como dados insuficientes. Cite a url_canonica de cada software e, quando houver, a fonte_url do dado.",
      "tools": [
        {
          "name": "alternativas",
          "title": "Alternativas",
          "description": "Lista outros softwares publicados nas mesmas categorias de um software do catálogo, com as categorias em comum, primeiro os que têm mais categorias em comum. Use quando a pessoa pedir alternativas, concorrentes ou substitutos de um software.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "pagina": {
                "description": "Página dos resultados, a partir de 1. São 20 por página.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Slug do software, como vem da busca ou do endereço softoteca.com.br/software/{slug}.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9292bfae35dd4af9a0b4dbac34dc11abf5fb9681f4329be2079947e68596bffd"
        },
        {
          "name": "buscar_softwares",
          "title": "Buscar softwares",
          "description": "Busca softwares no catálogo publicado da Softoteca, o catálogo de software do Brasil (B2B e B2C), com preços em reais. Use quando a pessoa pedir indicação, lista ou opções de software para uma necessidade (ex.: controle de ponto, ERP, emissão de nota fiscal), com filtros opcionais de categoria, tipo, plataforma e preço máximo. Devolve até 20 softwares por chamada, em ordem alfabética, com resumo factual, fornecedor, categorias, menor preço publicado e url_canonica. Para os detalhes de um software, use obter_ficha.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categoria": {
                "description": "Slug da categoria, como vem da lista de categorias (ex.: \"controle-de-ponto\"). Veja listar_categorias.",
                "maxLength": 100,
                "type": "string"
              },
              "consulta": {
                "description": "O que se procura, em poucas palavras (ex.: \"controle de ponto\", \"emissão de NFS-e\"). Cada palavra precisa aparecer no nome, no resumo, na descrição, no fornecedor ou nas categorias, sem diferença de acento ou de maiúsculas. Pode ficar vazia quando houver outro filtro.",
                "maxLength": 200,
                "type": "string"
              },
              "origem": {
                "description": "Origem da empresa fornecedora: brasileira (sede no Brasil, comprovada no site do fornecedor) ou internacional (a filial brasileira de grupo estrangeiro conta como internacional). Fica de fora o software cujo fornecedor ainda não tem a origem comprovada; nas respostas, ele vem com fornecedor.origem null.",
                "enum": ["brasileira", "internacional"],
                "type": "string"
              },
              "pagina": {
                "description": "Página dos resultados, a partir de 1. São 20 por página.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "plataforma": {
                "description": "Plataforma em que o software precisa rodar: web, windows, macos, linux, ios, android.",
                "enum": ["web", "windows", "macos", "linux", "ios", "android"],
                "type": "string"
              },
              "preco_max_brl": {
                "description": "Preço máximo em reais. Fica o software com plano gratuito ou com ao menos um plano de preço publicado até esse valor, na periodicidade do próprio plano (mensal, anual ou pagamento único). O plano com preço em dólar ou euro não entra neste filtro: a Softoteca não converte.",
                "minimum": 0,
                "type": "number"
              },
              "tipo": {
                "description": "B2B para software de empresas, B2C para software de consumidores. Software que atende os dois entra nos dois.",
                "enum": ["B2B", "B2C"],
                "type": "string"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cbc01d113981714f6cdcfd6e04cea0ad115039f6dc133f4fb11da964635d390"
        },
        {
          "name": "comparar_softwares",
          "title": "Comparar softwares",
          "description": "Compara de 2 a 4 softwares do catálogo lado a lado: quadro com preço, campos da ficha, integrações e conformidade, com a origem e a fonte de cada valor. Use quando a pessoa quiser saber a diferença entre softwares ou escolher entre eles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "De 2 a 4 slugs de softwares diferentes, como vêm de buscar_softwares.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
