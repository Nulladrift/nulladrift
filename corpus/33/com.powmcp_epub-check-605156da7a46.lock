        {
          "name": "ebook_compare",
          "description": "Runs the identical pinned EPUBCheck 5.4.0 validation over exactly two EPUB builds (directly hosted public URLs or files attached in chat, baseline first, revised second) sequentially under one shared 110-second deadline, then reports which spec findings regressed or were fixed between them. Returns per-build hashes, EPUB versions, pass verdicts and severity counts, a regressions list (rules that appear or worsen in the revised build) and a fixed list (rules removed or reduced), and a ranking by pass state then fewer blocking findings. Use for 'did my re-export get worse', 'which build has fewer problems', and revision-over-revision questions. The ranking orders automated conformance only (it never means one build renders, reads, or sells better), and when both builds tie on pass state and blocking count it names no winner rather than crowning the first submission. It also flags when the two files declare different titles, since that usually means they are not two builds of one book. Human review remains required for both builds. A comparison can take up to 110 seconds under its shared deadline; tell the user before the call.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "STRICT RULE: Ebook compare failed: the two sources must be distinct builds",
            "properties": {
              "files": {
                "description": "Exactly two distinct EPUB builds attached in chat: the baseline build first, the revised build second. Provide either these attachments or urls, never both.",
                "items": {
                  "additionalProperties": false,
                  "description": "An EPUB build file attached in chat, up to 25 MB, validated from its exact bytes.",
                  "properties": {
                    "download_url": {
                      "description": "Temporary authorized download URL supplied by ChatGPT; fetch it only while handling this tool call",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "ChatGPT file id for the attached file",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "Original file name when ChatGPT knows it",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "MIME type when ChatGPT knows it",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              },
              "maxMessages": {
                "description": "Maximum findings to collect per build for the comparison (default 150)",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "urls": {
                "description": "Exactly two distinct direct public HTTP(S) EPUB URLs: the baseline build first, the revised build second. Provide either these URLs or files, never both.\n\nSTRICT RULE: Ebook compare failed: provide either two EPUB URLs or two attached EPUB files, not both\nSTRICT RULE: Ebook compare failed: provide two public EPUB URLs or attach two EPUB build files",
                "items": {
                  "description": "Direct public HTTP(S) URL to the EPUB file bytes, including the protocol, not a ChatGPT file id, local path, cloud-drive share, archive/viewer page, or authenticated URL needing a login. Each call takes either URL sources or attached-file sources, never both",
                  "pattern": "^https?://",
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 2,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "comparedAt": {
                "description": "ISO timestamp of the comparison",
                "type": "string"
              },
              "documents": {
                "description": "Per-build hashes, versions, and verdicts in submitted order (baseline first, revised second)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "description": "Downloaded EPUB size in bytes",
                      "type": "number"
                    },
                    "counts": {
                      "additionalProperties": false,
                      "description": "Counts of EPUBCheck findings grouped by severity for this build",
                      "properties": {
                        "error": {
                          "description": "Error messages: spec violations that fail validation and typically block store uploads",
                          "type": "number"
                        },
                        "fatal": {
                          "description": "Fatal messages: the container could not be fully processed",
                          "type": "number"
                        },
                        "usage": {
                          "description": "Usage messages: informational notices about optional or unusual constructs",
                          "type": "number"
                        },
                        "warning": {
                          "description": "Warning messages: advisory issues that do not fail validation",
                          "type": "number"
                        }
                      },
                      "required": ["error", "fatal", "usage", "warning"],
                      "type": "object"
                    },
                    "epubVersion": {
                      "description": "Detected EPUB version",
                      "type": "string"
                    },
                    "failed": {
                      "description": "Why this build could not be validated, when it could not",
                      "type": "string"
                    },
                    "findingsTruncated": {
                      "description": "True when this build's findings were capped by maxMessages",
                      "type": "boolean"
                    },
                    "pass": {
                      "description": "True when the build has no fatal or error messages",
                      "type": "boolean"
                    },
                    "sha256": {
                      "description": "SHA-256 hash of the exact validated bytes",
                      "type": "string"
                    },
                    "url": {
                      "description": "The checked EPUB source: the submitted URL with query and fragment stripped, or the attached file's name",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "type": "array"
              },
              "engineVersion": {
                "description": "EPUBCheck engine version that produced the verdicts",
                "type": "string"
              },
              "fixed": {
                "description": "Rules removed or reduced in the revised build versus the baseline",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "baselineCount": {
                      "description": "Occurrences in the first (baseline) build",
                      "type": "number"
                    },
                    "description": {
                      "description": "Representative message text for the rule",
                      "type": "string"
                    },
                    "revisedCount": {
                      "description": "Occurrences in the second (revised) build",
                      "type": "number"
                    },
                    "ruleId": {
                      "description": "EPUBCheck message id that differs between builds",
                      "type": "string"
                    },
                    "severity": {
                      "description": "Severity of the rule in the build where it appears",
                      "type": "string"
                    }
                  },
                  "required": ["baselineCount", "description", "revisedCount", "ruleId", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "humanReviewItems": {
                "description": "Checks only a qualified human can perform",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "humanReviewRequired": {
                "description": "Always true: automated conformance never covers how either build reads or renders",
                "type": "boolean"
              },
              "limits": {
                "description": "Conclusions this automated comparison cannot support",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "nonclaims": {
                "description": "What these automated results do not establish",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "processingMs": {
                "description": "Total processing time in milliseconds",
                "type": "number"
              },
              "ranking": {
                "description": "Builds ranked by pass state then fewer blocking findings; unvalidatable builds last",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "blockingCount": {
                      "description": "Fatal + error messages for this build",
                      "type": "number"
                    },
                    "failed": {
                      "description": "Why this build could not be validated, when it could not",
                      "type": "string"
                    },
                    "pass": {
                      "description": "Automated pass verdict",
                      "type": "boolean"
                    },
                    "rank": {
                      "description": "1-based rank by automated conformance evidence",
                      "type": "number"
                    },
                    "url": {
                      "description": "Build source: the submitted URL query- and fragment-stripped, or the attached file's name",
                      "type": "string"
                    }
                  },
                  "required": ["rank", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "regressions": {
                "description": "Rules that appear or worsen in the revised build versus the baseline",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "baselineCount": {
                      "description": "Occurrences in the first (baseline) build",
                      "type": "number"
                    },
                    "description": {
                      "description": "Representative message text for the rule",
                      "type": "string"
                    },
                    "revisedCount": {
                      "description": "Occurrences in the second (revised) build",
                      "type": "number"
                    },
                    "ruleId": {
                      "description": "EPUBCheck message id that differs between builds",
                      "type": "string"
                    },
                    "severity": {
                      "description": "Severity of the rule in the build where it appears",
                      "type": "string"
                    }
                  },
                  "required": ["baselineCount", "description", "revisedCount", "ruleId", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "ruleProfileDate": {
                "description": "Release date of the pinned EPUBCheck rule profile",
                "type": "string"
              },
              "truncated": {
                "description": "True when either build's findings were truncated, which can make the difference table incomplete",
                "type": "boolean"
              }
            },
            "required": ["comparedAt", "documents", "engineVersion", "fixed", "humanReviewItems", "humanReviewRequired", "limits", "nonclaims", "processingMs", "ranking", "regressions", "ruleProfileDate", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "EPUB Build Compare"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/fileParams": ["files"],
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["profile", "email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4e185de475650629e1863cdf70bcd76467fe1256639725929d3434bd211ffe59"
        }
