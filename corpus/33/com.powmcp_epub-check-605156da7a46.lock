      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://powmcp.com/epub-check/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "epub-check",
        "version": "0.5.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use ebook_check when the user supplies one EPUB (a publicly fetchable URL or a file attached in the conversation) and asks whether the EPUB has specification problems, including problems that may explain a store-upload rejection. A rejection citing accessibility, WCAG or accessibility metadata belongs to Ebook Accessibility Check; EPUBCheck does not predict bookstore acceptance. Use ebook_compare only when the user supplies exactly two EPUB builds (two public URLs or two attached files) and asks what changed between builds, whether a re-export regressed, or which build has fewer machine-checkable problems. Pass attachments through the file parameter (files for ebook_compare), never as URLs, give each tool exactly one source kind per call, and never ask the user to host an attached file publicly. These tools fetch the source artifact and run the official EPUBCheck engine; they do not render the book in a reading system, judge accessibility (that is the sibling Ebook Accessibility Check), or predict a specific distributor's extra metadata rules. EPUBCheck stays loaded, so a warm single check typically takes a few seconds and a two-build comparison a few seconds more; the first call after a restart can take 15 to 25 seconds, and any call can take up to 110 seconds, bounded by the existing call deadline; tell the user before the call if the service has just started. Lead with pass/fail, EPUB version, and the most severe rule finding, then summarize error/warning counts, structural inventory, and truncation. When ebook_compare reports no evidenced winner, say that plainly instead of naming a better build, and when it reports that the two files declare different titles, surface that before any regression talk. Never repeat EPUB URL query strings, attachment download-URL tokens, or credentials in narration.",
      "tools": [
        {
          "name": "ebook_check",
          "description": "Validates one EPUB (a directly hosted public URL or a file attached in chat) against the EPUB 2/3 specification using a pinned local EPUBCheck 5.4.0 engine run in a no-network sandbox. Each call takes exactly one source: the url parameter or the file attachment, never both. Returns the automated verdict: pass boolean, EPUB version, message counts by severity (fatal/error/warning/usage), findings grouped most-severe-first with EPUBCheck rule id (RSC-005, OPF-014, …), file path and line/column, plus a structural inventory (spine items, media types, remote-resource state), SHA-256 of the exact bytes, and truncation metadata. Use for one-file readiness and diagnosis: 'is this ebook valid', 'does this EPUB have specification problems before upload', 'what is wrong with it'. A pass means only that the bytes satisfied the automated profile; it never renders the book, judges accessibility, or guarantees any store will accept it, and human review of how the book reads and looks is always required. Downloads and validates a live EPUB under a 110-second call deadline; tell the user before the call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "additionalProperties": false,
                "description": "An EPUB file attached in chat, up to 25 MB, validated from its exact bytes. Provide either this attachment or url, never both.",
                "properties": {
                  "download_url": {
                    "description": "Temporary authorized download URL supplied by ChatGPT; fetch it only while handling this tool call",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "ChatGPT file id for the attached file",
                    "type": "string"
                  },
                  "file_name": {
                    "description": "Original file name when ChatGPT knows it",
                    "type": "string"
                  },
                  "mime_type": {
                    "description": "MIME type when ChatGPT knows it",
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "maxMessages": {
                "description": "Maximum spec findings to return, most severe first (default 200); raise it to see more of a very noisy book, lower it to keep the answer short",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Direct public HTTP(S) URL to the EPUB file bytes, including the protocol, not a ChatGPT file id, local path, cloud-drive share, archive/viewer page, or authenticated URL needing a login. Each call takes either URL sources or attached-file sources, never both\n\nSTRICT RULE: Ebook check failed: provide either an EPUB URL or an attached EPUB file, not both\nSTRICT RULE: Ebook check failed: provide a public EPUB URL or attach the EPUB file",
                "pattern": "^https?://",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bytes": {
                "description": "Downloaded EPUB size in bytes",
                "type": "number"
              },
              "contentType": {
                "description": "Content-Type the server returned",
                "type": "string"
              },
              "counts": {
                "additionalProperties": false,
                "description": "Counts of EPUBCheck findings grouped by severity",
                "properties": {
                  "error": {
                    "description": "Error messages: spec violations that fail validation and typically block store uploads",
                    "type": "number"
                  },
                  "fatal": {
                    "description": "Fatal messages: the container could not be fully processed",
                    "type": "number"
                  },
                  "usage": {
                    "description": "Usage messages: informational notices about optional or unusual constructs",
                    "type": "number"
                  },
                  "warning": {
                    "description": "Warning messages: advisory issues that do not fail validation",
                    "type": "number"
                  }
                },
                "required": ["error", "fatal", "usage", "warning"],
                "type": "object"
              },
              "engineVersion": {
                "description": "EPUBCheck engine version that produced the verdict",
                "type": "string"
              },
              "epubVersion": {
                "description": "Detected EPUB version, e.g. 2.0.1 or 3.0; omitted when the engine could not detect it",
                "type": "string"
              },
              "epubVersionDetected": {
                "description": "Distinguished state: false means the version could not be detected, distinct from a detected-but-invalid version",
                "type": "boolean"
              },
              "fetchedAt": {
                "description": "ISO timestamp the EPUB was fetched and validated",
                "type": "string"
              },
              "finalUrl": {
                "description": "URL after redirects, with query string and fragment stripped",
                "type": "string"
              },
              "findings": {
                "description": "Bounded spec findings, most severe first, capped by maxMessages",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "additionalLocations": {
                      "description": "How many further locations share this finding beyond the one shown",
                      "type": "number"
                    },
                    "column": {
                      "description": "Column number of the issue, when the engine reports one",
                      "type": "number"
                    },
                    "label": {
                      "description": "Short display identity combining the EPUBCheck rule id with its primary file path and reported line",
                      "type": "string"
                    },
                    "line": {
                      "description": "Line number of the issue, when the engine reports one",
                      "type": "number"
                    },
                    "message": {
                      "description": "What the rule reports",
                      "type": "string"
                    },
                    "path": {
                      "description": "File path inside the EPUB where the issue was found",
                      "type": "string"
                    },
                    "ruleId": {
                      "description": "EPUBCheck message id, e.g. RSC-005, OPF-014, HTM-004",
                      "type": "string"
                    },
                    "severity": {
                      "description": "FATAL, ERROR, WARNING, or USAGE",
                      "type": "string"
                    },
                    "suggestion": {
                      "description": "Engine-provided remediation hint, when present",
                      "type": "string"
                    }
                  },
                  "required": ["additionalLocations", "label", "message", "ruleId", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "humanReviewItems": {
                "description": "Checks only a qualified human can perform",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "humanReviewRequired": {
                "description": "Always true: automated conformance never covers how the book reads or renders",
                "type": "boolean"
              },
              "inventory": {
                "additionalProperties": false,
                "description": "Structural inventory reported for the EPUB container",
                "properties": {
                  "containerEntryCount": {
                    "description": "Total ZIP entries in the container",
                    "type": "number"
                  },
                  "containerItemCount": {
                    "description": "Number of manifest/container items EPUBCheck inspected",
                    "type": "number"
                  },
                  "decompressedBytes": {
                    "description": "Total declared decompressed size of the container in bytes",
                    "type": "number"
                  },
                  "embeddedFontCount": {
                    "description": "Number of fonts embedded in the container",
                    "type": "number"
                  },
                  "fixedFormat": {
                    "description": "True for fixed-layout publications",
                    "type": "boolean"
                  },
                  "hasAudio": {
                    "description": "True when the publication embeds audio",
                    "type": "boolean"
                  },
                  "hasEncryption": {
                    "description": "True when the container declares encryption",
                    "type": "boolean"
                  },
                  "hasVideo": {
                    "description": "True when the publication embeds video",
                    "type": "boolean"
                  },
                  "mediaTypes": {
                    "description": "Distinct declared media types present in the publication",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "remoteResources": {
                    "additionalProperties": false,
                    "description": "Detected remote-resource references and referenced font count",
                    "properties": {
                      "referencedFontCount": {
                        "description": "Count of remotely referenced fonts",
                        "type": "number"
                      },
                      "state": {
                        "anyOf": [
                          {
                            "const": "referenced",
                            "description": "Distinguished state: 'referenced' when remote resources or remote fonts are used, 'none-detected' when the engine found none (absence of evidence, not a guarantee of none)",
                            "type": "string"
                          },
                          {
                            "const": "none-detected",
                            "description": "Distinguished state: 'referenced' when remote resources or remote fonts are used, 'none-detected' when the engine found none (absence of evidence, not a guarantee of none)",
                            "type": "string"
                          }
                        ],
                        "description": "Distinguished state: 'referenced' when remote resources or remote fonts are used, 'none-detected' when the engine found none (absence of evidence, not a guarantee of none)"
                      }
                    },
                    "required": ["referencedFontCount", "state"],
                    "type": "object"
                  },
                  "scripted": {
                    "description": "True when the publication contains scripting",
                    "type": "boolean"
                  },
                  "spineItemCount": {
                    "description": "Number of reading-order spine items",
                    "type": "number"
                  }
                },
                "required": ["containerEntryCount", "containerItemCount", "decompressedBytes", "embeddedFontCount", "fixedFormat", "hasAudio", "hasEncryption", "hasVideo", "mediaTypes", "remoteResources", "scripted", "spineItemCount"],
                "type": "object"
              },
              "nonclaims": {
                "description": "What this automated result does not establish",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pass": {
                "description": "True when the EPUB has no fatal or error messages against the automated profile",
                "type": "boolean"
              },
              "processingMs": {
                "description": "Total processing time in milliseconds",
                "type": "number"
              },
              "redirects": {
                "description": "Redirect hops followed",
                "type": "number"
              },
              "requestedUrl": {
                "description": "The checked EPUB source: the submitted URL with query and fragment stripped, or the attached file's name",
                "type": "string"
              },
              "ruleProfileDate": {
                "description": "Release date of the pinned EPUBCheck rule profile",
                "type": "string"
              },
              "sha256": {
                "description": "SHA-256 hash of the exact validated bytes",
                "type": "string"
              },
              "truncation": {
                "additionalProperties": false,
                "description": "Finding totals and the applied limit on returned findings",
                "properties": {
                  "findingsTruncated": {
                    "description": "True when more findings exist than were returned",
                    "type": "boolean"
                  },
                  "maxMessages": {
                    "description": "The applied per-call findings cap",
                    "type": "number"
                  },
                  "returnedFindings": {
                    "description": "Findings actually returned after the maxMessages cap",
                    "type": "number"
                  },
                  "totalFindings": {
                    "description": "Total findings the engine produced",
                    "type": "number"
                  }
                },
                "required": ["findingsTruncated", "maxMessages", "returnedFindings", "totalFindings"],
                "type": "object"
              }
            },
            "required": ["bytes", "counts", "engineVersion", "epubVersionDetected", "fetchedAt", "finalUrl", "findings", "humanReviewItems", "humanReviewRequired", "inventory", "nonclaims", "pass", "processingMs", "redirects", "requestedUrl", "ruleProfileDate", "sha256", "truncation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "EPUB Spec Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
