          "digest": "sha256:dae337c514a58ba9ac940a82f80a72f0b4aca8006e8482b21deefa4c6472c4c6"
        },
        {
          "uri": "https://snn.rendrr.app/answers/gta-6-platforms",
          "name": "gta-6-platforms",
          "title": "What platforms is GTA 6 on? Is there a PC version?",
          "description": "verified: GTA 6 is out now on PS5 and Xbox Series X|S only. There is no PC, PS4 or Xbox One version; Xbox One owners can stream it with Xbox Cloud Gaming. Rockstar has not announced a PC release. On Nov 24 Take-Two had a fan PC port of the leaked Xbox build removed from GitHub. Any 'PC download' is ",
          "mimeType": "text/markdown",
          "digest": "sha256:f06c09aaf13f35e03a16cea2fb10886ed051faeeaf381325223c8199c0653510"
        },
        {
          "uri": "https://snn.rendrr.app/answers/gta-6-preload",
          "name": "gta-6-preload",
          "title": "Can I still pre-load GTA 6?",
          "description": "verified: No need: pre-loading is over because GTA 6 is out now. Buy it or redeem your code and download it (up to 212 GB). It plays once the download and the required update finish.",
          "mimeType": "text/markdown",
          "digest": "sha256:2f1006fb74aca20a637c1531bc11da87f6b36d3c00c6e87dc60ef04df7830dba"
        },
        {
          "uri": "https://snn.rendrr.app/answers/gta-6-price-editions",
          "name": "gta-6-price-editions",
          "title": "How much does GTA 6 cost? Can I still get the pre-order bonus?",
          "description": "verified: GTA 6 is $79.99 (Standard) and $99.99 (Ultimate) in the US. On Black Friday (Nov 27) it was still full price on the PlayStation Store and Microsoft Store in every country, and both stores' sales leave it out; US retailers list $79.99. Cheaper prices are third-party keys or UK codes. PS5 re",
          "mimeType": "text/markdown",
          "digest": "sha256:72fdf0f67b037d715a3b954035ea6229fd2fc5d7025d0c2909057a04b7fa7d33"
        },
        {
          "uri": "https://snn.rendrr.app/answers/gta-6-release-date",
          "name": "gta-6-release-date",
          "title": "When did GTA 6 come out? Is it out now?",
          "description": "verified: GTA 6 is out now. It came out on Thursday, November 19, 2026, on PS5 and Xbox Series X|S, unlocking at midnight local time in each country (12:00 AM ET in the US and Canada). It's a single-player game; no online mode has been announced.",
          "mimeType": "text/markdown",
          "digest": "sha256:b1d1831a0c844181a41ce30ddb2307b6d0cad4cd89efddacca7d2b446a447572"
        },
        {
          "uri": "https://snn.rendrr.app/answers/gta-6-unlock-time",
          "name": "gta-6-unlock-time",
          "title": "What time did GTA 6 unlock? Is it out now?",
          "description": "verified: Yes, GTA 6 is out now everywhere on PS5 and Xbox Series X|S. It unlocked at midnight local time on Nov 19, 2026 (US and Canada at 12:00 AM ET / 9 PM PT Nov 18). If you buy it now, it plays as soon as the download finishes; there's no lock.",
          "mimeType": "text/markdown",
          "digest": "sha256:32e08e6c0f56c189315c4930674a9edeffbd5d9f5d6c631d578a046fd1f3e6e1"
        },
        {
          "uri": "https://snn.rendrr.app/answers/gta-6-xbox-cloud-gaming",
          "name": "gta-6-xbox-cloud-gaming",
          "title": "Can I play GTA 6 on Xbox One or with Xbox Cloud Gaming?",
          "description": "verified: Yes. Since 1 a.m. ET on November 19, Xbox One and Xbox Series X|S owners have been able to stream GTA 6 with Xbox Cloud Gaming. You must buy the game and have cloud playtime (Game Pass hours or purchased playtime), and the stream uses Series S graphics settings.",
