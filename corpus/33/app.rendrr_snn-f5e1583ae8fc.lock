      "instructions": "SNN is a fan-made GTA VI news desk. Use search_answers then get_answer for facts; always pass on the citations and the verification status (verified vs unverified) to the user, and link the SNN answer URL. Unverified means provisional. Never present SNN as official: SNN is an independent, fan-made news channel with AI-generated anchors. Not affiliated with Rockstar Games or Take-Two. Game names and footage belong to their owners and creators. Anchors are fictional AI characters. submit_clip_tip only sends a link to the newsroom for human review; it never publishes anything. Free tier: 60 tool calls/hour per network. Tools marked [MCP Pass] need an SNN MCP Pass key ($3.99 per year subscription, https://snn.rendrr.app/pass) sent as \"Authorization: Bearer <key>\".",
      "tools": [
        {
          "name": "get_answer",
          "title": "Get one answer",
          "description": "Get one SNN answer by slug (from search_answers or list_latest): full markdown answer, short answer, verification status and numbered source citations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Answer slug, e.g. \"gta-6-release-date\"",
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Answer with citations[] and verification{status, verified}.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one answer"
          },
          "behavior": {
