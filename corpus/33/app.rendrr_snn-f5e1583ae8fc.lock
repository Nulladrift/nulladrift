        {
          "name": "submit_clip_tip",
          "title": "Send SNN a clip link",
          "description": "Send the SNN newsroom a link to a GTA VI clip (X, TikTok, Instagram, YouTube, Twitch, Reddit, Kick, Streamable). Goes to a human review queue; nothing is published automatically and no personal data is needed. Say whether the user made the clip or found it. Strict limits: 5 per hour per network.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "note": {
                "description": "Optional: what happens in the clip / why it matters. No personal info.",
                "maxLength": 280,
                "type": "string"
              },
              "relation": {
                "description": "\"made\" if the user created the clip, \"found\" if someone else did",
                "enum": ["made", "found"],
                "type": "string"
              },
              "submitter_handle": {
                "description": "Optional public social handle to credit for the tip",
                "maxLength": 40,
                "type": "string"
              },
              "url": {
                "description": "Public link to the clip",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["relation", "url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ok": {
                "type": "boolean"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send SNN a clip link"
