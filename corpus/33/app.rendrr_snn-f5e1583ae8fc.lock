        {
          "name": "search_answers",
          "title": "Search GTA VI answers",
          "description": "Full-text search over SNN's published GTA VI answers (release date, platforms, price, editions, launch fixes...). Returns short answers with verification status and source citations. Follow up with get_answer for the full text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user wants to know, e.g. \"is GTA 6 on PC\"",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "description": "Optional: only verified or only unverified answers",
                "enum": ["verified", "unverified"],
                "type": "string"
              },
              "tag": {
                "description": "Optional tag filter, e.g. \"launch\", \"price\"",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "description": "Answer with citations[] and verification{status, verified}.",
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["count", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search GTA VI answers"
