          "name": "gta-6-physical-copy-disc",
          "title": "Does the GTA 6 physical copy come with a disc?",
          "description": "verified: No. GTA 6 is out now, and the physical version is a download code in a box, with no disc. Redeem the code and download the game (up to 212 GB). Code missing or unreadable? PlayStation says contact the retailer. There is no physical Ultimate Edition.",
