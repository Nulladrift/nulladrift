        {
          "name": "live_breaking",
          "title": "Live launch feed (MCP Pass)",
          "description": "[MCP Pass] The full SNN Breaking feed with bodies and citations, filterable by topic and pollable with a \"since\" timestamp so an agent can follow launch night live. Topics: unlock-time, file-size, preload, platforms, price, cloud, disc, issues.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO 8601 timestamp; only items after it (use the newest \"at\" you have seen)",
                "maxLength": 40,
                "type": "string"
              },
              "topic": {
                "enum": ["unlock-time", "file-size", "preload", "platforms", "price", "cloud", "disc", "issues"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "newest_at": {
                "type": ["string", "null"]
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Live launch feed"
