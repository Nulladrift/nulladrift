          "description": "Register a new Keywordise account from the terminal and receive an API key for it. Requires accept_terms=true: the person accepts the Terms and Privacy Policy (https://keywordise.com/terms) and authorises Keywordise to apply for jobs on their behalf. A confirmation email is sent; applying opens once the address is confirmed. Trial: 7 days and 5 applications, then Starter at $24.99/month (500 applications) or Pro at $49/month (1,000).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "type": "boolean"
              },
              "email": {
                "format": "email",
                "type": "string"
