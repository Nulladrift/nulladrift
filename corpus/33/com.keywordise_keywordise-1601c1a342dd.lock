      "serverInfo": {
        "name": "keywordise",
        "title": "Keywordise",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Keywordise applies to jobs for a person: it matches their CV against live vacancies taken from employers' own career pages, tailors the CV per posting, answers screening questions from their saved answers and submits inside the employer's own system. This server is the person's full console: create_account or login mints a key; then upload_cv, describe_what_i_want (or update_targeting), list_matching_jobs, preview_tailored_cv, start_apply_run, list_blocking_questions and answer_screening_question. Tools marked destructive send real applications or answers in the person's name; confirm intent before calling them.",
      "tools": [
        {
          "name": "answer_screening_question",
          "title": "Answer an employer's screening question",
          "description": "Record the person's answer to one screening question on one application. The answer is written in the person's name and saved to their answer book, so the same question is never asked again. When it is the last required answer, the application is SUBMITTED to the employer. Only give an answer the person actually stated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "maxLength": 5000,
                "type": "string"
              },
              "application_id": {
                "type": "string"
              },
              "question_id": {
                "type": "string"
              }
            },
            "required": ["answer", "application_id", "question_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9fca882407fc4fcddf5fe9f28b55e7513941b6edd895e71754028bb69e017321"
        },
        {
          "name": "apply_to_live_job",
          "title": "Apply to a job found by search",
          "description": "Use after search_live_jobs when the person picks one of the results to apply to. The same as apply_to_public_job, for a pool_job_id: puts the job into the person's matches and starts the application for that ONE job, which SUBMITS in the person's name. Needs the saved CV, a confirmed email and an active plan. Confirm with the person first. dry_run=true prepares and sends nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dry_run": {
                "default": false,
                "type": "boolean"
              },
              "pool_job_id": {
                "description": "The pool_job_id from search_live_jobs.",
                "type": "string"
              }
            },
            "required": ["pool_job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
