      "instructions": "md2sign sends markdown contracts for legally binding e-signatures.\n\nMarkdown format: standard markdown plus signature fields, one per signer, each on its own line:\n  [[signature: First Last <email@example.com>]]\n  [[signature: First Last <email@example.com> | role: Director]]\nOptional hidden directives: <!-- md2sign:style=classic|modern|formal --> and <!-- md2sign:title=... -->.\n\nTypical flow:\n1. validate_markdown: check fields (free, no account).\n2. render_preview: show your human what recipients will see (free, no account).\n3. create_account: if your human has no account yet. Returns api_key + checkout_urls. The human must confirm their email. Their first sent document is free (up to 5 signers, no subscription); after that they subscribe (Starter $7.50/mo for 50 signature requests, Pro $26.41/mo for 500, one unit per recipient). get_account shows free_document_available.\n4. create_draft, then update_draft as many times as needed.\n\nWho signs: add a signature field only for people who must agree to the document. The sender does NOT need to sign one-sided documents (quotes, proposals, consents, acknowledgements, waivers, one-way NDAs, offer or terms acceptances): sending them is the sender's offer, and the recipient's signature accepts it. Two-sided agreements (services or contractor agreements, mutual NDAs, leases, partnerships) are usually signed by every party, so ask the human whether they want to sign too. To add the sender, pass sender_signs: true (with optional sender_role) to create_draft, update_draft or create_document_from_template instead of writing their field yourself. Every validation result includes signing_advice (document_kind, sender_should_sign, message).\n5. test_send_document: free watermarked copy to the account owner.\n6. send_document, then get_document or get_audit_trail to track signatures.\n\nPro accounts can save versioned templates with {{ variable }} placeholders: list_templates, get_template, save_template, create_document_from_template.\nPro admins can also post document events (markdown + signed PDF) to Zapier, Make, n8n, a CRM or their own server: list_webhooks, save_webhook.\n\nAuthenticate with \"Authorization: Bearer <api_key>\" or pass api_key to each tool. Errors are JSON with a stable \"error\" code (e.g. subscription_required, email_unverified, quota_exceeded, invalid_document).",
      "tools": [
        {
          "name": "create_account",
          "title": "Create Account",
          "description": "Create an md2sign account for your human and get an API key. They are emailed a confirmation link and subscription options. Once they confirm their email, their first sent document is free (up to 5 signers); after that, sending needs a plan (Starter $7.50/mo for 50 signature requests, Pro $26.41/mo for 500). You can validate, draft, preview and test-send right away. Returns api_key and checkout_urls to hand to the human.",
          "inputSchema": {
            "properties": {
              "company_name": {
                "description": "Company name shown to recipients, e.g. \"Acme Pty Ltd\".",
                "type": "string"
              },
              "email": {
                "description": "Email address of your human. Document emails show it as the sender.",
                "type": "string"
              },
              "name": {
                "description": "The full name of your human.",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "title": "Create Account"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
