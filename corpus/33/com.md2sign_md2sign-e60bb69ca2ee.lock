        {
          "name": "create_document_from_template",
          "title": "Create Document From Template",
          "description": "Create a draft from a template by filling in its {{ variables }} (Pro). Set send=true to send it straight away; otherwise review it and call send_document. Missing variables return a missing_variables error listing them.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Your md2sign API key. Only needed if your MCP client cannot send an \"Authorization: Bearer <api_key>\" header.",
                "type": "string"
              },
              "external_reference": {
                "description": "Your own ID for this document (e.g. a CRM deal or invoice number). Returned in responses and webhooks.",
                "type": "string"
              },
              "message": {
                "description": "Short personal note from the sender.",
                "type": "string"
              },
              "send": {
                "description": "Send immediately after creating the draft.",
                "type": "boolean"
              },
              "sender_role": {
                "description": "Optional role shown on the sender's signature, e.g. \"Client\" or \"Director\". Used with sender_signs=true.",
                "type": "string"
              },
              "sender_signs": {
                "description": "true adds a signature field for the sender (the account holder, using their name and email); false removes it. Only for two-sided agreements (services/contractor agreements, mutual NDAs, leases, partnerships). Never for quotes, proposals, consents, acknowledgements, waivers or one-way NDAs, where only the recipient signs. Check validation.signing_advice and ask the human if unsure.",
                "type": "boolean"
              },
              "style": {
                "description": "Visual style for the email and signing page. Overrides the md2sign:style directive. Default classic.",
                "enum": ["classic", "modern", "formal"],
                "type": "string"
              },
              "template_id": {
                "description": "The template ID.",
                "type": "string"
              },
              "title": {
                "description": "Document title shown to signers. Defaults to the md2sign:title directive or the first # heading.",
                "type": "string"
              },
              "variables": {
                "description": "Values for every {{ variable }} in the template, e.g. {\"client_name\": \"Jane Citizen\", \"client_email\": \"jane@example.com\"}.",
                "type": "object"
              },
              "version": {
                "description": "Template version to use. Defaults to the latest.",
                "type": "integer"
              }
            },
            "required": ["template_id"],
            "type": "object"
          },
          "annotations": {
            "title": "Create Document From Template"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
