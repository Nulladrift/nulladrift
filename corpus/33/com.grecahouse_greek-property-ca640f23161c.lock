        {
          "name": "get_property_details",
          "title": "Get a Greca House listing",
          "description": "Use this when the user asks about one specific Greca House listing by its reference (for example GH-108459), usually after a search. Returns the public description, facts, features, photos, 3D/360°/video links, Golden Visa classification and the listing URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for listing text and links (en, el, ru, he, zh, ar).",
                "enum": ["en", "el", "ru", "he", "zh", "ar"],
                "type": "string"
              },
              "reference": {
                "description": "e.g. GH-108459",
                "pattern": "^(?:GH-?)?\\d{3,10}$",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "description": {
                "type": "string"
              },
              "features": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "found": {
                "type": "boolean"
              },
              "golden_visa": {
                "type": "object"
              },
              "media_links": {
                "type": "object"
              },
              "price_eur": {
                "type": ["integer", "null"]
              },
              "reference": {
                "type": "string"
              },
              "scope": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["found", "reference", "scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
