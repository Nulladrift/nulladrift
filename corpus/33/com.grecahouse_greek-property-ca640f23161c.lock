      "serverInfo": {
        "name": "greca-house-greece-property",
        "title": "Greca House Greece Property",
        "version": "1.1.1",
        "websiteUrl": "https://grecahouse.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Greca House is an independent real-estate brokerage in central Athens, continuing the brokerage its founder, Iryna Rondyak, established in 2008. These tools cover only Greca House's own current public listings and dated research on their asking prices: never present results as the whole Greek market or as sale prices. Always give the listing or report link. A Golden Visa flag is Greca House's property-route classification, not applicant eligibility or legal advice. Cost estimates use the law in force and add professional fees only from the user's quotes. Never use the research for forecasts.",
      "tools": [
        {
          "name": "compare_budget_by_area",
          "title": "Compare asking prices by area or budget",
          "description": "Use this when the user wants to compare asking prices per square metre between Greek areas (e.g. Kolonaki vs Glyfada) or asks what a budget such as €250k, €400k or €800k buys. Answers from Greca House's dated research snapshot of its own listings' asking prices, with sample sizes. A dated snapshot of Greca House's own listings' ASKING prices, not a whole-market transaction-price index. Do not use it for forecasts, predicted appreciation, next-year price growth, time-series trends or questions about the whole market's future prices. Do not add 'current market' figures from memory; other sources may be cited only if you actually retrieve them separately.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "areas": {
                "description": "Athens neighbourhoods or regions, e.g. ['Kolonaki', 'Glyfada'].",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "budget_eur": {
                "minimum": 0,
                "type": "integer"
              },
              "language": {
                "default": "en",
                "description": "Language for listing text and links (en, el, ru, he, zh, ar).",
                "enum": ["en", "el", "ru", "he", "zh", "ar"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "areas": {
                "type": "array"
              },
              "basis": {
                "type": "string"
              },
              "budget": {
                "type": "object"
              },
              "method_url": {
                "type": "string"
              },
              "not_covered": {
                "type": "array"
              },
              "scope": {
                "type": "string"
              },
              "snapshot_date": {
                "type": "string"
              }
            },
            "required": ["basis", "method_url", "scope", "snapshot_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a501d920a1624fb7097717fcd3208075c8a598b5e0418355888f5d83ba7cd109"
        },
        {
          "name": "estimate_greece_buying_costs",
          "title": "Estimate buying costs in Greece",
          "description": "Use this when the user asks how much it costs on top of the price to buy a resale property in Greece. Computes transfer tax, municipal surcharge, Cadastre registration and the notary's scale fee; adds lawyer, engineer or agency fees only from amounts the user gives. Not legal or tax advice. Never invent lawyer, engineer, agency or other professional fee percentages and never turn this into a generic 'typical all-in' range: professional fees enter only from amounts the user gives from written quotes. Keep the calculator link and the stated assumptions. The estimate uses the rates in force; an announced change listed under announced_not_in_force is not law yet: never apply it as the current rate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Language for listing text and links (en, el, ru, he, zh, ar).",
                "enum": ["en", "el", "ru", "he", "zh", "ar"],
                "type": "string"
              },
              "objective_value_eur": {
                "description": "The tax-assessed value, if known; tax is due on the higher.",
                "minimum": 0,
                "type": "integer"
              },
              "price_eur": {
                "minimum": 1000,
                "type": "integer"
              },
              "professional_quotes_eur": {
                "additionalProperties": false,
                "description": "Amounts from written quotes, VAT included.",
                "properties": {
                  "agency": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "engineer": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "lawyer": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "other": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "registered_in_cadastre": {
                "default": true,
                "type": "boolean"
              }
            },
            "required": ["price_eur"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "announced_not_in_force": {
                "type": "array"
              },
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "calculator_url": {
                "type": "string"
              },
              "lines": {
                "type": "array"
              },
              "official_scale_eur": {
                "type": "integer"
              },
              "price_eur": {
                "type": "integer"
              },
              "rates_read_on": {
                "type": "string"
              },
              "rates_status": {
                "type": "string"
              },
              "share_of_price": {
                "type": "number"
              },
              "statutory_eur": {
                "type": "integer"
              },
              "total_on_top_of_price_eur": {
                "type": "integer"
              },
              "your_quotes_eur": {
                "type": "integer"
              }
            },
            "required": ["lines", "price_eur", "rates_read_on", "total_on_top_of_price_eur"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
