        },
        {
          "name": "search_greece_properties",
          "title": "Search Greca House listings in Greece",
          "description": "Use this when the user wants to find homes, land or commercial property for sale or rent in Greece (Athens, Attica, the islands, the Peloponnese and elsewhere) within a budget, area, type or size. Searches Greca House's current public listings only, not every property in Greece. Returns references, asking prices and links. Do not use for holiday rentals, hotels or travel bookings. golden_visa_classified is Greca House's office classification of the property route only. Do not recalculate or overrule it from price, size or location, do not rank listings by eligibility strength, and do not imply applicant, document, transaction or permit approval: those need review by a qualified Greek lawyer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Neighbourhood, town or island, e.g. 'Glyfada', 'Kolonaki', 'Mykonos', 'Corfu'.",
                "maxLength": 80,
                "type": "string"
              },
              "deal": {
                "default": "sale",
                "enum": ["sale", "rent"],
                "type": "string"
              },
              "golden_visa_classified_only": {
                "description": "Only listings Greca House classifies as eligible under a Golden Visa property route. golden_visa_classified is Greca House's office classification of the property route only. Do not recalculate or overrule it from price, size or location, do not rank listings by eligibility strength, and do not imply applicant, document, transaction or permit approval: those need review by a qualified Greek lawyer.",
                "type": "boolean"
              },
              "has_media": {
                "description": "Only listings with a 3D model, a 360° tour or a video.",
                "enum": ["3d_model", "360_tour", "video"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language for listing text and links (en, el, ru, he, zh, ar).",
                "enum": ["en", "el", "ru", "he", "zh", "ar"],
                "type": "string"
              },
              "limit": {
                "default": 6,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_bedrooms": {
                "description": "Upper bound. Exactly two bedrooms: min_bedrooms=2 and max_bedrooms=2.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "max_price_eur": {
                "minimum": 0,
                "type": "integer"
              },
              "min_area_sqm": {
                "minimum": 0,
                "type": "integer"
              },
              "min_bedrooms": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "min_price_eur": {
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "property_type": {
                "description": "townhouse includes maisonettes; villa includes detached houses.",
                "enum": ["apartment", "villa", "townhouse", "building", "complex", "commercial", "land"],
                "type": "string"
              },
              "region": {
                "description": "Broad public region; use instead of area for whole regions.",
                "enum": ["athens_center", "athens_south", "athens_north", "athens_east", "athens_west", "rest_attica", "piraeus", "thessaloniki", "islands", "peloponnese", "mainland"],
                "type": "string"
              },
              "sort": {
                "default": "newest",
                "enum": ["newest", "price_asc", "price_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "browse_url": {
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "area_sqm": {
                      "type": ["number", "null"]
                    },
                    "bathrooms": {
                      "type": ["integer", "null"]
                    },
                    "bedrooms": {
                      "type": ["integer", "null"]
                    },
                    "commercial_subtype": {
                      "type": ["string", "null"]
                    },
                    "deal": {
                      "type": "string"
                    },
                    "golden_visa_classified": {
                      "type": "boolean"
                    },
                    "image_url": {
                      "type": ["string", "null"]
                    },
                    "location": {
                      "type": ["string", "null"]
                    },
                    "media": {
                      "type": "object"
                    },
                    "plot_area_sqm": {
                      "type": ["number", "null"]
                    },
                    "price_eur": {
                      "type": ["integer", "null"]
                    },
                    "property_type": {
                      "type": "string"
                    },
                    "reference": {
                      "type": "string"
                    },
                    "region": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["golden_visa_classified", "price_eur", "reference", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offset": {
                "type": "integer"
              },
              "returned": {
                "type": "integer"
              },
