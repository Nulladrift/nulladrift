        {
          "name": "tp_search_filter_options",
          "title": "Discover Total Parks search filters",
          "description": "Use this to discover the structured filters accepted by tp_search_parks and tp_search_stays before filtering on amenities or curated highlights. Returns Total Parks features (e.g. pools, campfires, laundry) and curated highlights (e.g. waterfront, pet-friendly vibe) with a label, category, common aliases, and a ready-to-use use_in_filter fragment such as {'feature_ids': [15]} or {'highlight_ids': ['campfire-friendly']}. Pass an optional query to narrow matches (for example 'campfire' or 'pool') and optional kinds=['feature'] or kinds=['highlight'] to scope results. Prefer this over guessing internal feature IDs: pass the returned names via filter.feature_names or filter.highlight_names, or merge the use_in_filter fragment directly. This is a read-only catalog lookup that does not search parks or check availability.",
          "inputSchema": {
            "properties": {
              "kinds": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional catalog kinds to return, such as 'feature' or 'highlight'. Accepts one kind or a list. Omit for all kinds.",
                "examples": ["highlight"]
              },
              "limit": {
                "default": 50,
                "description": "Maximum catalog entries to return. Default 50. Example: 20.",
                "examples": [50],
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional text to filter the amenity/highlight catalog, such as 'campfire', 'pool', or 'pet'. Omit to list the full catalog page.",
                "examples": ["campfire"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Discoverable catalog of structured search filters for the search tools.",
            "properties": {
              "contract_version": {
                "const": "search_filters.v1",
                "default": "search_filters.v1",
                "type": "string"
              },
              "options": {
                "items": {
                  "description": "One discoverable search filter (a structured feature or curated highlight).\n\n``use_in_filter`` mirrors the exact ``search.v1`` filter shape to merge into a\n``tp_search_parks`` / ``tp_search_stays`` ``filter`` argument, so the caller\nnever has to memorise internal numeric feature IDs.",
                  "properties": {
                    "aliases": {
                      "description": "Extra traveller phrases that also resolve to this option.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "category": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Feature category grouping where available."
                    },
                    "id": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Feature ID when kind='feature'; omitted for highlights."
                    },
                    "kind": {
                      "description": "Whether this option is a structured feature or a curated highlight.",
                      "enum": ["feature", "highlight"],
                      "type": "string"
                    },
                    "label": {
                      "description": "Traveller-facing name for this filter option.",
                      "type": "string"
                    },
                    "slug": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "default": null,
                      "description": "Highlight slug when kind='highlight'; omitted for features."
                    },
                    "use_in_filter": {
                      "additionalProperties": true,
                      "description": "Exact search.v1 filter fragment to pass, e.g. {'feature_ids': [15]} or {'highlight_ids': ['campfire-friendly']}.",
                      "type": "object"
                    }
                  },
                  "required": ["kind", "label"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
