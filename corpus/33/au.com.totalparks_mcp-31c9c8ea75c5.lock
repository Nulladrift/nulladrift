              "property_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Traveller-facing Total Parks property URL returned by a previous tool. Accepted as an alias of property_ref. Example: 'https://totalparks.com.au/victoria/big4-aireys-inlet'.",
                "examples": ["https://totalparks.com.au/victoria/big4-aireys-inlet"]
              },
              "room_type_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Internal room/site type ID. Compatibility only; prefer room_type_ref or room_type_url from a previous tool result."
              },
              "room_type_ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public room/site ref returned by search or tp_assess_stay. Example: 'victoria/big4-aireys-inlet/rooms/cosy-cottage-4-person'.",
                "examples": ["victoria/big4-aireys-inlet/rooms/cosy-cottage-4-person"]
              },
              "room_type_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Traveller-facing Total Parks room/site URL returned by a previous tool. Accepted as an alias of room_type_ref.",
                "examples": ["https://totalparks.com.au/victoria/big4-aireys-inlet/rooms/cosy-cottage-4-person"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "accommodation_kind": {
                "enum": ["site", "accommodation"],
                "type": "string"
              },
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string"
