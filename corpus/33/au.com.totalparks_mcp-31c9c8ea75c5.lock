              },
              "slug": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Exact Total Parks property slug. Pair with state when you already know the listing. Example: 'big4-aireys-inlet'.",
