        {
          "name": "tp_get_pet_blockouts",
          "title": "Get pet blockouts",
          "description": "Use this for date-specific pet questions at a visible Total Parks-listed property. Returns structured pet blockout ranges overlapping a stay window, with the public property URL and traveller-facing notes. Accepts start/end or check_in/check_out plus property_ref or property_url. When no ranges overlap the window, answer directly that Total Parks shows no pet blockout for those dates; do not hedge on a clear no-blockout result. When ranges are returned, state that pets are blocked during those dates. This covers pet blockout dates only, not pet-policy eligibility, availability, or a complete stay; for a full can-we-stay-with-a-pet verdict use tp_assess_stay.",
          "inputSchema": {
            "properties": {
              "check_in": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Stay check-in date (YYYY-MM-DD). Pair with check_out. Example: '2026-10-03'.",
                "examples": ["2026-10-03"]
              },
              "check_out": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Stay check-out date (YYYY-MM-DD). Must be after check_in. Example: '2026-10-06'.",
                "examples": ["2026-10-06"]
              },
              "end": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last date of the stay window to check for pet blockouts (YYYY-MM-DD). Must be after start. Alias: check_out. Example: '2026-04-07'.",
                "examples": ["2026-04-07"]
              },
              "property_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Internal property ID. Compatibility only; prefer property_ref or property_url from a previous Total Parks tool result."
              },
              "property_ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public property ref from tp_resolve_property or search, formatted as '{state}/{slug}'. Prefer this or property_url over internal IDs. Example: 'victoria/big4-aireys-inlet'.",
                "examples": ["victoria/big4-aireys-inlet"]
              },
              "property_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Traveller-facing Total Parks property URL returned by a previous tool. Accepted as an alias of property_ref. Example: 'https://totalparks.com.au/victoria/big4-aireys-inlet'.",
                "examples": ["https://totalparks.com.au/victoria/big4-aireys-inlet"]
              },
              "start": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First date of the stay window to check for pet blockouts (YYYY-MM-DD). Alias: check_in. Example: '2026-04-03'.",
                "examples": ["2026-04-03"]
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
