        {
          "name": "tp_search_parks",
          "title": "Search Total Parks discovery candidates",
          "description": "Use this for open-ended discovery and inspiration questions such as finding parks near a place, matching structured filters, or ranking by a trip vibe. Accepts structured search.v1 geo, filter, vibe, paging objects, and natural_language original wording, and returns lightweight public property_ref/property_url candidates with matched signals, channel_state and canonical actions. Request to Book sends an unconfirmed request to the park; directory-only results have a neutral View park handoff. Fill structured fields you are confident about and also pass the traveller's phrasing in natural_language; structured geo/filter/vibe fields take precedence, and natural_language only augments deterministic alias recovery and vibe ranking. This tool resolves places with geo.type='place' and geo.query, and family-friendly prompts should use the soft vibe.traveller_appeal=['families'] preference rather than an unsupported hard family_friendly filter. To filter on amenities or curated highlights (campfires, pools, pet-friendly, waterfront, etc.), call tp_search_filter_options to discover the catalog, then pass filter.feature_names/filter.highlight_names; the server resolves them to canonical feature_ids/highlight_ids. For room/site option wording such as ensuite, drive-through, slab, powered, unpowered, tent-only, accessible, spa, pet-friendly cabin, or pet-fee, set filter.option_facets and still include the traveller's original wording in natural_language. For off-site needs, use filter.local_proximity entries with a topic and maximum straight-line kilometres. Supported topics are supermarket, pharmacy, boat_ramp, dump_point, ev_charging, beach, and brewery; multiple entries are ANDed. Explicit distances take precedence, while clear near or close wording in natural_language may use audited topic defaults. Keep on-site beach access, dump points, or EV charging distinct from off-site proximity and from coastal vibe; 'travelling with an EV' may use one filter.any_of group for on-site or nearby charging. Never present these distances as walking or driving distance. Missing or stale local evidence means unverified, not that no venue exists. For an explicit Google star threshold, set filter.min_google_rating; properties with a lower or missing cached Google rating are excluded. Do not invent a numeric threshold from vague wording such as top-rated. When quoting a score, identify it as a Google rating. For dog-friendly or pet-friendly searches, also set filter.pet_friendly=true. This discovery tool does not accept booking intent and does not verify pets, rig fit, dates, restrictions, or price. For open-ended searches with dates, guests, rig details, or pet intent, use tp_search_stays. For a concrete stay at a chosen park, call tp_assess_stay. When the answer is ready for presentation, pass this search output to tp_render_result_cards once; this data tool does not render a widget itself.",
          "inputSchema": {
            "properties": {
              "filter": {
                "anyOf": [
                  {
                    "description": "Authoritative structured filters applied before vibe ranking.",
                    "properties": {
                      "accessible": {
                        "anyOf": [
                          {
                            "type": "boolean"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Optional accessibility-oriented filter signal."
                      },
                      "accommodation_kind": {
                        "anyOf": [
                          {
                            "enum": ["site", "accommodation"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Optional stay-kind filter: use site for caravan, campervan, motorhome, fifth-wheeler, tent, camping, powered-site, unpowered-site, ensuite-site, slab-site, and drive-through-site requests; use accommodation for cabins, villas, cottages, glamping, and similar roofed stays."
                      },
                      "any_of": {
                        "description": "OR-groups: each group is satisfied when a candidate has any listed feature, highlight, or confirmed local-proximity match. Groups are ANDed together; members within a group are ORed.",
                        "items": {
                          "description": "An OR-group of on-property and/or off-site structured facts.\n\nA candidate satisfies the group when it has *any* of the listed feature IDs\nor highlight IDs (overlap, not contains-all), or satisfies any listed local\nproximity constraint. Groups let a single real-world concept represented in\ndifferent source stores — e.g. on-site EV charging or a confirmed charger\nnearby — match without merging those stores.\n\nMultiple groups on a filter are ANDed together; members *within* a group are\nORed.",
                          "properties": {
                            "feature_ids": {
                              "description": "Feature IDs; matching any one satisfies this group.",
                              "items": {
                                "type": "integer"
                              },
                              "type": "array"
                            },
                            "highlight_ids": {
                              "description": "Highlight IDs; matching any one satisfies this group.",
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "local_proximity": {
                              "description": "Independent off-site topic/distance alternatives; matching any one satisfies this group.",
                              "items": {
                                "description": "One confirmed off-site topic required within a straight-line bound.",
                                "properties": {
                                  "max_distance_km": {
                                    "description": "Required maximum straight-line distance in kilometres. REST and GUI callers and explicit MCP arguments must provide a bound; the controlled MCP natural-language adapter may fill an audited topic default for clear 'near' or 'close' wording.",
                                    "exclusiveMinimum": 0,
                                    "type": "number"
                                  },
                                  "topic": {
                                    "description": "Allowlisted off-site topic: supermarket, pharmacy, boat_ramp, dump_point, ev_charging, beach, or brewery.",
                                    "enum": ["supermarket", "pharmacy", "boat_ramp", "dump_point", "ev_charging", "beach", "brewery"],
                                    "type": "string"
                                  }
                                },
                                "required": ["max_distance_km", "topic"],
                                "type": "object"
                              },
                              "type": "array"
                            }
                          },
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "booking_enabled": {
                        "anyOf": [
                          {
                            "type": "boolean"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "When true, restricts to parks bookable on Total Parks."
                      },
                      "feature_ids": {
                        "description": "Property feature IDs that candidates must satisfy.",
                        "items": {
                          "type": "integer"
                        },
                        "type": "array"
                      },
                      "highlight_ids": {
                        "description": "Curated property highlight IDs that candidates must satisfy. Use stable highlight slugs when the traveller asks for known curated signals such as campfire-friendly, swimming-pool, resort-style-pool, beach-access, or pet-friendly.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "local_proximity": {
                        "description": "Confirmed current off-site topic/distance requirements. Every entry is required (AND semantics). Use this for explicit 'near', 'close', or 'within X km' venue needs, not on-property amenities, coastal vibe, or walking/driving claims.",
                        "items": {
                          "description": "One confirmed off-site topic required within a straight-line bound.",
                          "properties": {
                            "max_distance_km": {
                              "description": "Required maximum straight-line distance in kilometres. REST and GUI callers and explicit MCP arguments must provide a bound; the controlled MCP natural-language adapter may fill an audited topic default for clear 'near' or 'close' wording.",
                              "exclusiveMinimum": 0,
                              "type": "number"
                            },
                            "topic": {
                              "description": "Allowlisted off-site topic: supermarket, pharmacy, boat_ramp, dump_point, ev_charging, beach, or brewery.",
                              "enum": ["supermarket", "pharmacy", "boat_ramp", "dump_point", "ev_charging", "beach", "brewery"],
                              "type": "string"
                            }
                          },
                          "required": ["max_distance_km", "topic"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "management_ids": {
                        "description": "Optional management or chain IDs to include.",
                        "items": {
                          "type": "integer"
                        },
                        "type": "array"
                      },
                      "min_google_rating": {
                        "anyOf": [
                          {
                            "maximum": 5,
                            "minimum": 1,
                            "type": "number"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Optional explicit minimum cached Google star rating. Properties with a lower or missing rating do not satisfy this hard filter."
                      },
                      "option_facets": {
                        "description": "Canonical room/site option facts requested by the traveller, e.g. powered, ensuite, drive_through, slab, accessible, spa, pet_friendly, family. Search annotates and tiers by scoped room-type evidence rather than treating these as park-level amenity checkboxes. Do not leave requested room/site option words only in vibe.query: copy every explicit option requirement here. For powered-site requests include option_facets=['powered'] and also set intent.equipment.power_required=true when using tp_search_stays.",
                        "items": {
                          "description": "Traveller-facing inventory-option facts at room/site scope.",
                          "enum": ["powered", "unpowered", "ensuite", "drive_through", "slab", "tent_only", "accessible", "spa", "pet_friendly", "family", "pet_fee_applies", "no_pet_fee", "declaration_required"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "pet_friendly": {
                        "anyOf": [
                          {
                            "type": "boolean"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Property-level pet-friendly filter. For dog-friendly or pet-friendly discovery/stay searches, set this true as a search filter and also put the declared travelling pet facts in intent.pet when using tp_search_stays. Phase B hard pet checks use the capability graph and room-type truth before claiming fit."
                      },
                      "region_ids": {
                        "description": "Canonical tourism-region IDs to include with exact, OR-within-dimension matching against Property.region (for example, nsw-north-coast). Regions are distinct from state filters.",
                        "items": {
                          "type": "string"
                        },
                        "maxItems": 59,
                        "type": "array"
                      },
                      "setting": {
                        "anyOf": [
                          {
                            "enum": ["beachside", "riverside", "lakeside", "bushland", "mountain", "rural", "town_centre", "city_fringe", "coastal", "outback"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Canonical enrichment setting, e.g. beachside or bushland."
                      },
                      "states": {
                        "description": "Uppercase Australian state names aligned with map geobuf data.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "traveller_appeal": {
                        "description": "Traveller segment hints from the enrichment taxonomy.",
                        "items": {
                          "enum": ["grey_nomads", "families", "couples", "groups", "fishers", "hikers", "pet_owners", "big_rig_tourers"],
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "search.v1 hard filters applied before vibe ranking: states, features, highlights, pet_friendly, option_facets, and local_proximity. Discover names via tp_search_filter_options. Example: {\"states\":[\"TASMANIA\"],\"pet_friendly\":true}.",
                "examples": [
                  {
                    "pet_friendly": true,
                    "states": ["TASMANIA"]
                  }
                ]
              },
              "geo": {
                "anyOf": [
                  {
                    "discriminator": {
                      "propertyName": "type"
                    },
                    "oneOf": [
                      {
                        "description": "Server-resolved place, region, POI, or park-name query.",
                        "properties": {
                          "query": {
                            "description": "Place, region, POI, or park name to resolve server-side.",
                            "maxLength": 200,
                            "minLength": 1,
                            "type": "string"
                          },
                          "radius_km": {
                            "anyOf": [
                              {
                                "maximum": 500,
                                "minimum": 1,
                                "type": "number"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "default": null,
                            "description": "Optional radius around the resolved anchor in kilometres."
                          },
                          "type": {
                            "const": "place",
                            "default": "place",
                            "type": "string"
                          }
                        },
                        "required": ["query"],
                        "type": "object"
                      },
                      {
                        "description": "Pre-resolved point geometry from a trusted client.",
                        "properties": {
                          "lat": {
                            "description": "Latitude in WGS84.",
