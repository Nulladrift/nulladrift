              },
              "state": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Australian state or territory code or name used with slug for an exact lookup. Example: 'vic' or 'Victoria'.",
