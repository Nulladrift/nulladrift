        {
          "name": "tp_render_result_cards",
          "title": "Render Total Parks result cards",
          "description": "Use this exactly once after the data calls are complete and the host can display MCP Apps UI. Pass search_response for search-only cards, assess_stay_result for one assessed park, or both to render a final stay shortlist: the assessed park's room/site options first, followed by up to three compact planning-level fallback parks from the search. The assess_stay_result must be the park selected as the recommendation in the answer. When the traveller asked for parks near a place or landmark (town, ferry port, airport), recommend the same-tier candidate with the smallest geo matched_signals[].detail.distance_km. Do not recommend a farther park just because it ranks higher on vibe or quality. Optional fallback_property_refs chooses and orders alternatives. Do not call this after each intermediate search or assessment. This tool does not search again, change ranking, create a cart, hold inventory, take payment, or confirm a booking; clients without UI support can ignore it and use the plain structured output from the data tools.",
          "inputSchema": {
            "properties": {
              "assess_stay_result": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Prior tp_assess_stay JSON payload. Pass the previous tool result unchanged when rendering the chosen park's room/site cards."
              },
              "fallback_limit": {
                "default": 3,
                "description": "Maximum compact fallback park cards in a composite stay shortlist. Zero hides fallbacks.",
                "examples": [3],
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "fallback_property_refs": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional public property_ref values to use as compact fallback cards. Example: ['victoria/big4-aireys-inlet'].",
                "examples": [
                  ["victoria/big4-aireys-inlet"]
                ]
              },
              "include_nearby": {
                "default": false,
                "description": "When true, include compact nearby fallback park cards in a composite stay shortlist. Default false.",
                "examples": [false],
                "type": "boolean"
              },
              "preferred_stay_kind": {
                "anyOf": [
                  {
                    "enum": ["site", "accommodation"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional stay-kind hint for composite shortlists: 'site' for caravan/camping, 'accommodation' for cabins and other roofed stays.",
                "examples": ["site"]
              },
              "search_response": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Prior tp_search_parks or tp_search_stays JSON payload. Pass the previous tool result unchanged when rendering cards."
              },
              "title": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional heading for the rendered card set. Example: 'Parks near Lakes Entrance'.",
                "examples": ["Parks near Lakes Entrance"]
              }
            },
            "type": "object"
          },
