      "instructions": "Use these read-only tools for first-party public facts about visible Total Parks-listed Australian holiday parks, caravan parks, and campgrounds. Cite returned property_url or room_type_url when grounding an answer. Report provenance and confidence where returned. In traveller-facing answers, use the returned *_label fields; raw machine values such as admin, high, or tp_structured are internal. Never infer a hard constraint when a constraint result is unknown or inferred; say it cannot be confirmed. Do not imply complete national coverage beyond the properties returned by Total Parks. Keep channel_state separate from search tier: live_booking may offer Book Now, request_only may offer Request to Book, and directory_only receives a neutral View park handoff. A request still needs park confirmation and is not a confirmed booking; never infer it from booking_enabled=false. For requests asking for the guaranteed cheapest, best, or available option across all of Australia, decline the premise before calling search tools and offer a bounded Total Parks-listed search instead. For open-ended destination, filter, or vibe discovery questions without dates or stay intent, use tp_search_parks and treat returned parks as discovery candidates only; that tool does not verify dates, pets, rig fit, restrictions, or price. For open-ended searches that include dates, guests, pets, rig details, or accommodation kind across multiple candidate parks, use tp_search_stays; its planning status is an early Total Parks availability check only, not a live PMS check, held inventory, confirmed pet acceptance, or final price. Use returned status_label phrases such as 'Available for your dates' rather than raw status enums. For month-wide or anywhere-in-range searches, pass intent.flexible_window; it is scanned across the whole window server-side, so keep it (optionally narrower) and present returned dates instead of collapsing it into fixed check_in/check_out dates when a coverage note appears. For any concrete stay question where the traveller provides or implies dates plus party details, pets, rig details, a room/site type, price, availability, or can-we-stay/book intent, call tp_assess_stay first after resolving the property. Do not hand-assemble a stay verdict from room details, capability, pet blockout, equipment, or calendar calls. When tp_assess_stay returns verdict='bookable', answer affirmatively that Total Parks shows the stay as available now and the declared hard constraints pass; do not downgrade that or hedge just because payment must happen on Total Parks. For non-blocked stay options, actions.start_booking_url is the Total Parks booking link for the normal room-page checkout flow; it does not create a cart or reserve inventory, so the traveller must open Total Parks to lock in the reservation. For a trip across several parks, give one Total Parks booking link per stay. The traveller opens each link in turn. Where every park allows it, Total Parks puts up to four stays in one cart with one payment; some parks book separately, so do not promise a single payment or booking everything at once. When a follow-up stay assessment cannot verify a search candidate, say Total Parks could not verify that candidate for the requested stay; do not mention refs, endpoints, tool names, cache internals, or resolver errors. When actions.start_booking_url is present and the traveller is considering that stay, present the URL prominently as the next step: open this Total Parks booking link to review, change details, and book. Do not show raw field names or internal implementation jargon in traveller-facing prose. Search and assessment tools return data only. When card presentation helps, call tp_render_result_cards exactly once after all data calls and the final selection are complete. For a multi-park stay answer, pass the original search response plus the assessment for the park chosen as the recommendation; that renders its room/site options with compact fallback park cards. When the traveller asked for parks near a place or landmark (town, ferry port, airport), recommend the same-tier candidate with the smallest geo matched_signals[].detail.distance_km. Do not recommend a farther park just because it ranks higher on vibe or quality. Never render each intermediate assessment. Use tp_get_room_type_details for 'tell me more about this room/site' questions, and tp_get_availability_calendar for bounded flexible-date browsing such as which nearby dates look open or showing availability across a range; pass accommodation_kind='accommodation' for cabin-style stays or accommodation_kind='site' for caravan/camping sites (natural words such as 'cabins' or 'powered sites' are also accepted). For a named park plus a bounded month or date range, use the calendar's available_date_ranges/open_date_range_labels instead of switching to tp_search_stays because the stay length is missing. Do not scan date options by repeatedly calling tp_assess_stay. Calendar data is Total Parks live inventory for browsing open dates; use tp_assess_stay for a concrete stay verdict, then checkout to book. Anonymous pre-booking results include the returned Total Parks property_url, room_type_url, and, when the stay can proceed, actions.start_booking_url. They do not include park phone numbers or email addresses. Open the returned Total Parks URL to see the park, the room, or the booking.",
      "tools": [
        {
          "name": "tp_assess_stay",
          "title": "Assess a stay",
          "description": "Use this after tp_resolve_property, or when you already have a returned property_ref/property_url, for any concrete stay assessment at a known Total Parks-listed property: can-we-stay/book questions, all-in price/quote questions, or specific date-window checks involving party size, pets, rig details, room/site type, availability, or restrictions. Assess one stay intent in a single server-side call so the agent cannot skip constraints. Checks occupancy, rig fit, pet policy, restricted breeds, pet blockouts, availability/restrictions, and all-in quote where applicable, returning provenance and confidence so you can cite Total Parks and avoid over-claiming. Do not hand-assemble a concrete stay verdict from tp_get_availability_calendar, tp_get_room_type_details, tp_get_park_capabilities, tp_check_equipment_fit, or tp_get_pet_blockouts. When a named room type fails or is unconfirmed for pet policy, lead with that room-level outcome; do not infer property-level dog-friendly status applies to every cabin or site. In traveller-facing answers, use the returned *_label fields; raw machine values are internal. Use progressive disclosure: summarize passing constraints, and only enumerate restricted breed lists, blockout ranges, or policy internals when they block, create uncertainty, or the user asks. Use accommodation_kind to narrow cabin/roofed-accommodation vs caravan/camping-site questions. When the traveller names a specific room/site type or category (e.g. 'ensuite site', 'drive-through site', 'deluxe cabin') and other options should still appear, pass their wording as preferred_room_type so that option is surfaced first and flagged is_preferred_match; reserve room_type_ref for when they want only that one option. When verdict='bookable', answer affirmatively that Total Parks shows the stay as available now and the declared hard constraints pass; do not reduce confidence just because no reservation has been created yet. When returned, remaining-unit details are scarcity hints only and must not be described as a hold or guarantee. Broad option lists are paged: follow options_page.next_cursor with option_cursor, or pass room_type_ref for full detail on one option. For non-blocked room options, actions.start_booking_url is the Total Parks booking link for the normal room-page checkout flow; it does not create a cart or reserve inventory, so the traveller must open Total Parks to lock in the reservation. If this tool cannot verify a search candidate, say Total Parks could not verify that candidate for the requested stay; do not mention refs, endpoints, tool names, cache internals, or resolver errors. When actions.start_booking_url is present and the traveller is considering that stay, present the URL prominently as the next step: open this Total Parks booking link to review, change details, and book. When actions.start_watch_url is present, the stay is sold out: after other bookable rooms, dates, or parks, one paid availability watch link may be offered for that park. Say paid, not a price. The link does not hold a site and is not a booking. Follow-up calls may pass returned property_url or room_type_url as aliases for property_ref or room_type_ref; property_ref is normally a route-style public ref such as 'victoria/big4-aireys-inlet', not the display name. Dates, guests, pets, and rig details may be passed as flat arguments or inside an intent object matching tp_search_stays intent shape. For powered-site checks, pass power_required=true. Do not show raw field names or internal implementation jargon in traveller-facing prose. This data tool does not render a widget. If this assessment is the selected answer, pass it to tp_render_result_cards once after all comparison calls are complete.",
