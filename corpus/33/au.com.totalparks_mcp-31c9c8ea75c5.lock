        {
          "name": "tp_get_room_type_details",
          "title": "Get room or site details",
          "description": "Use this as a follow-up detail tool after tp_assess_stay returns a candidate room/site, or when a traveller asks what a named visible Total Parks-listed room or site includes. Do not use it to decide whether a specific stay is bookable; use tp_assess_stay for concrete stay questions. Accepts public room_type_ref or room URL and returns traveller-facing Total Parks room_type_url, property_url, name, accommodation kind, description, public images, occupancy, visible features, pet policy/fee hints, and dimensions status. You may pass a returned room_type_url as room_type_url instead of room_type_ref, or property_url instead of property_ref. Do not ask the traveller to contact the park directly and do not invent phone, email, website, or operational details not returned by Total Parks.",
          "inputSchema": {
            "properties": {
              "property_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Internal property ID. Compatibility only; prefer property_ref or property_url from a previous Total Parks tool result."
              },
              "property_ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public property ref from tp_resolve_property or search, formatted as '{state}/{slug}'. Prefer this or property_url over internal IDs. Example: 'victoria/big4-aireys-inlet'.",
                "examples": ["victoria/big4-aireys-inlet"]
