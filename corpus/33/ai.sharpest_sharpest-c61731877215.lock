{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sharpest/sharpest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sharpest.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sharpest",
        "title": "Sharpest price search",
        "version": "1.0.0",
        "websiteUrl": "https://sharpest.ai/mcp-install"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use search_prices for any question about what something costs now (new or used). Cite the sharpest.ai link.",
      "tools": [
        {
          "name": "check_price",
          "description": "Is this a good price? Give a product (name, model number or eBay item URL) and a price in USD; get where that price sits against today's US eBay listings for it (cheapest, 25th percentile, median, share of listings cheaper) and its 30-day low, with a verdict: great, good, fair or high. Without a price you get the market numbers and an estimated resale value after eBay fees.",
          "inputSchema": {
            "properties": {
              "price_usd": {
                "description": "the price you were offered, item + shipping",
                "type": "number"
              },
              "product": {
                "description": "e.g. 'RTX 4070', 'WD Red Plus 8TB', or an ebay.com/itm/ URL",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef535964c2ebf48a938e890c7ce4a47ce14516cf7c6b0cb7f6a6329137763d8d"
        },
        {
          "name": "deals",
          "description": "Today's deals: products whose cheapest listing is well under their own 30-day average low (or, for new products, under today's typical price). Optional category key from list_categories.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category key exactly as list_categories returns it, e.g. 'gpus', 'storage' or 'Batteries'",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many rows to return (integer, default shown in the schema), e.g. 5",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Today's deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:850822aab9dcfd039cb43851633515860081aa308f3a678a4119217cc3451874"
        },
        {
          "name": "get_price",
          "description": "Today's price summary for one sharpest.ai product page (a URL from search_prices): lowest and median asking price, listing count, 30-day low, high and change.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "https://sharpest.ai/<category>/<product>",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a sharpest.ai price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e86b15158f6d1f809068f71794fbeef6b7e7834b2929281a8141e431a1c1e1c"
        },
        {
          "name": "list_categories",
          "description": "Categories sharpest.ai tracks, with the keys the other tools take: eBay product categories (GPUs, storage, RAM, phones, cameras, cards...) and per-unit staple groups (batteries, coffee, cables...).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6860b94a0a62e29d78bbfbdf5a85f0485ac1e5345a60f06faa2bf8b42826a7a"
        },
        {
          "name": "price_moves",
          "description": "Biggest price moves over the last week across all tracked products (typical asking price, then vs now), falling and rising.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many rows to return (integer, default shown in the schema), e.g. 5",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price moves this week"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7bac93ab15adc08bd0a5a1ffe49c67f3b7ad92a25a33f16a63530d0f35071479"
        },
        {
          "name": "price_per_unit",
          "description": "Cheapest price per unit, best first: per GB/TB for storage and RAM, per GB of VRAM for GPUs, per battery, per ounce, per foot of cable and so on. category = a key from list_categories (e.g. 'storage', 'ram', 'gpus', 'Batteries', 'Coffee & tea'). Optional condition for eBay categories: new, used or refurb.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category key exactly as list_categories returns it, e.g. 'gpus', 'storage' or 'Batteries'",
                "type": "string"
              },
              "condition": {
                "default": "any",
                "description": "Listing condition for eBay categories: 'new', 'used', 'refurb' or 'any' (default)",
                "enum": ["new", "used", "refurb", "any"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many rows to return (integer, default shown in the schema), e.g. 5",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest per unit"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9074843aedaec6cd7996925e43b13140097ebbe8df4bb30113750f4c14db15ac"
        },
        {
          "name": "price_shopping_list",
          "description": "Price a list of things to buy in one call. Each item is matched to the closest product sharpest.ai tracks (computer parts, electronics, collectibles, household staples), and you get the cheapest current US eBay asking price (item + shipping) for each, times its quantity, and the list total. Use it for a PC build, a homelab or NAS parts list, a set of cards, or a grocery/household list. Check the matched name: when it is not what was meant, refine that query and call again.",
          "inputSchema": {
            "properties": {
              "items": {
                "description": "The shopping list: up to 30 objects, each {\"query\": what to buy, optional \"quantity\"}, e.g. [{\"query\": \"2TB NVMe\", \"quantity\": 2}]",
                "items": {
                  "properties": {
                    "quantity": {
                      "default": 1,
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "query": {
                      "description": "What to buy, e.g. 'RTX 4070 Super', '2TB NVMe', 'AA batteries'",
                      "type": "string"
                    }
                  },
                  "required": ["query"],
                  "type": "object"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a shopping list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06a49d1e99f29214f99a4c528eff5c8617212b04f22df93614338afb71ec45fd"
        },
        {
          "name": "search_prices",
          "description": "Find current prices for a product on sharpest.ai: GPUs, CPUs, RAM, SSDs, phones, laptops, cameras, consoles, Pokemon and other trading cards, LEGO, and everyday staples priced per unit (batteries, coffee, cables...). Returns today's lowest and median US eBay Buy It Now asking price (item + shipping, USD; not sold prices) or, for staples, the cheapest price per unit across Amazon and eBay, with a link to the product page.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many rows to return (integer, default shown in the schema), e.g. 5",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to price, e.g. 'rtx 4090', 'aa batteries', 'canon r50'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sharpest.ai prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35eed871ab9b8464344bea133d7a823daef19c9b8c0bf22d27a64930e7bf97c0"
        },
        {
          "name": "used_vs_new",
          "description": "How much buying used or refurbished saves vs new, typical price vs typical price, for a category key from list_categories (not collectibles).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "A category key exactly as list_categories returns it, e.g. 'gpus', 'storage' or 'Batteries'",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many rows to return (integer, default shown in the schema), e.g. 5",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Used vs new savings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:747f7e0404b0b27b3cd4a7ea956d574269263ed9100f1a94fa1adf784d8163f2"
        }
      ],
      "digest": "sha256:ed45bf1f0145d9181e9f3a4fd65fcae3fb6d1f349579fc2349d5ccf48f6cd462"
    }
  }
}
