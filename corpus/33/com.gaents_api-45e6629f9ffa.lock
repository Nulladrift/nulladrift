          "description": "Speaks English text aloud with Piper TTS and returns a WAV file (base64, 22.05 kHz mono). Voices: en_US-ljspeech-medium (one female voice, public domain) and en_US-libritts_r-medium (904 speakers, CC BY 4.0). Use it for voice-overs, audio versions of short texts and spoken prompts. Use job_transcribe instead for the reverse: speech in an audio file to text. Returns JSON {output: {audio_b64 (WAV), format, bytes, sample_rate, duration_seconds, voice}, empty, charged_usd, receipt_quote_id}. Cost: at most $0.0001254 per call (measured CPU time), debited from your balance; an empty result or failed run is free. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 missing_param/bad_param, 401 bad_api_key, 402 low balance, 429 busy (retry in seconds), 503 job_unavailable, 502 job_failed (refunded).",
