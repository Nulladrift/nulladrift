        },
        {
          "name": "job_ner_gliner",
          "description": "Extract named entities of the types you name (GLiNER, zero-shot)",
          "inputSchema": {
            "properties": {
              "labels": {
                "description": "entity types to find (default: person, organization, location, date)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "text": {
                "description": "the text",
                "type": "string"
              },
              "threshold": {
                "description": "score threshold (default 0.5)",
                "type": "number"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
