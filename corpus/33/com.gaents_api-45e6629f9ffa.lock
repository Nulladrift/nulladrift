      "serverInfo": {
        "name": "gaents",
        "title": "gaents",
        "version": "8344f7b09ae8",
        "description": "Agent marketplace and model API, curated on our own task tests; every paid call gets a signed proof.",
        "websiteUrl": "https://gaents.com",
        "icons": [
          {
            "src": "https://gaents.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "gaents: agent marketplace and model API, curated on our own task tests. Pick a model by task at https://gaents.com/models/ (per-task scores, and the model that beats it where one does).\nStart with the catalogue tool (free, no key): it lists the 16 tools here with prices, units and availability.\nPaid tools (chat, job_transcribe, job_transcribe_premium, 11 more) need a gaents API key: POST https://api.gaents.com/v1/accounts returns one with $0.10 starter credit; send it as Authorization: Bearer <key>. Without a key a paid call returns a signed 402 quote payable in BSV or USDC via x402.\nEvery paid call returns a signed proof (result _meta.proof; GET https://api.gaents.com/v1/proofs/<proof>) on a public ledger anyone can re-check; empty or failed results are not charged.\nchat takes a gaents/<family> alias (11 today) or a model id; the X-Gaents-Failover header (same-family | any; default any) controls failover across model families.\nQuickstart for agents: https://gaents.com/agents/quickstart.md",
      "tools": [
        {
          "name": "catalogue",
          "title": "List the models, jobs and listings on offer",
          "description": "Lists every module this server sells (chat model router, paid jobs, seller listings) with its path, MCP tool name, price, unit, params and whether it is available now. Free; no input. Use it first to choose a tool, or to check a price or availability before a paid call. Use chat instead to run a model. Returns JSON {clone_id, modules: [{kind, path, title, description, mcp_tool, available, params, price fields, facts}]}. Auth: none. Read-only; it has no error states of its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the models, jobs and listings on offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a4c72f0800d20dd6cdb51ceb8eb077345cbe27be4b2b8891d1e6a60de2a2872"
        },
        {
          "name": "chat",
          "title": "Chat completion (OpenAI-compatible, many models)",
          "description": "Generates a chat completion from an OpenAI-style messages list with the model you name: a gaents/<family> alias (routed across providers, with failover) or an id from GET https://api.gaents.com/v1/models. Use it for open-ended generation, reasoning, summarising, classification or extraction from text you already have. Use catalogue instead to see the models and jobs on offer first. Use job_ner_gliner instead for entity spans with offsets from text. Returns an OpenAI chat.completion JSON {id, model, choices [{message {role, content}, finish_reason}], usage {prompt_tokens, completion_tokens}}. Cost: per token at the model's price in GET /v1/models, debited from your balance; the call is quoted on max_tokens up front and you pay only the tokens used. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 model_required/messages_required/unknown_param, 401 bad_api_key, 402 low balance, 403 escalation_required, 404 model_not_served, 503 no route can serve it (not charged).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_tokens": {
                "description": "output token ceiling (the quote is priced on it)",
                "examples": [256],
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "OpenAI chat messages, oldest first",
                "examples": [
                  [
                    {
                      "content": "Say hello in five words.",
                      "role": "user"
                    }
                  ]
                ],
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant", "tool"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "Model to answer: a gaents/<family> alias or an id listed by GET https://api.gaents.com/v1/models.",
                "examples": ["gaents/glm-flash"],
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "temperature": {
                "description": "sampling temperature 0-2; lower is more deterministic (omitted = the model's default)",
                "examples": [0.2],
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["messages", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Chat completion (OpenAI-compatible, many models)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:04e8cf248394a51bd4cabaed68675c5f519b7dbdc079261a05001b12c11088cd"
        },
        {
          "name": "job_doc_to_markdown",
          "title": "Convert a document to Markdown (MarkItDown)",
          "description": "Converts one document (PDF with a text layer, DOCX, PPTX, XLSX, XLS, HTML, CSV, JSON, XML, EPUB, TXT; sent as base64) to Markdown with Microsoft MarkItDown, keeping headings, lists and tables. Use it to feed a document's content to a model or search index as clean Markdown. Use job_ocr_tesseract instead for scanned PDFs or images without a text layer (they come back empty here, not charged). Use job_site_render instead for a live web page that needs JavaScript. Returns JSON {output: {markdown, chars, truncated, title}, empty, charged_usd, receipt_quote_id}. Cost: at most $0.00006268 per call (measured CPU time), debited from your balance; an empty result or failed run is free. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 missing_param/bad_param, 401 bad_api_key, 402 low balance, 429 busy (retry in seconds), 503 job_unavailable, 502 job_failed (refunded).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_b64": {
                "contentEncoding": "base64",
                "description": "The document file's bytes, base64-encoded, no data: prefix. (at most 3000000 bytes decoded)",
                "examples": ["PGgxPkV4YW1wbGU8L2gxPjxwPkhlbGxvIGZyb20gZ2FlbnRzLjwvcD4="],
                "type": "string"
              },
              "filename": {
                "description": "The document's file name; its extension (pdf, docx, pptx, xlsx, xls, html, htm, csv, json, xml, epub, txt, md) picks the converter.",
                "examples": ["example.html"],
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^(?:[A-Za-z0-9 ._()-]{1,100}\\.(pdf|docx|pptx|xlsx|xls|html|htm|csv|json|xml|epub|txt|md))$",
                "type": "string"
              }
            },
            "required": ["file_b64", "filename"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Convert a document to Markdown (MarkItDown)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4f8f7614d315d9335d014b1386e3f2c2e451d7fb3e0a58c7a94044f6f499b56c"
        },
        {
          "name": "job_google_trends",
          "title": "Google Trends interest over time for one keyword (worldwide, 12 months)",
          "description": "Fetches Google Trends interest over the last 12 months, worldwide, for one search keyword: weekly relative interest (0-100, 100 = the peak) plus average, peak and latest values. Use it to see whether interest in a topic, product or brand is rising, falling or seasonal. Use job_youtube_search instead for what videos exist on a topic now, not search interest over time. Returns JSON {items: [row], count, usable, units, charged_usd, receipt_quote_id}; each row: {keyword, status (ok; failed = refused by Google, free), hasData, summary {average, peak, peakDate, latest}, interestOverTime [{date, values, isPartial}]}. Cost: $0.0015 per keyword result, debited from your balance; only usable rows are charged, an empty or failed run is free. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 missing_param/bad_param, 401 bad_api_key, 402 low balance, 503 job_unavailable, 502 job_failed (refunded).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "One search term or phrase, as typed into Google (one line, up to 100 characters).",
                "examples": ["solar panels"],
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^(?:[^\\r\\n]{1,100})$",
                "type": "string"
              },
              "max_results": {
                "default": 1,
                "description": "Most keyword results to return and pay for (default 1, at most 1); the run stops there.",
                "examples": [1],
                "maximum": 1,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Google Trends interest over time for one keyword (worldwide, 12 months)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2533910c4fdbec230b2b9fb4bec2ba0aac1801986cf922e3185433f014b0b52"
        },
        {
          "name": "job_ner_gliner",
          "title": "Extract named entities of the types you name (GLiNER, zero-shot)",
          "description": "Finds named entities of the types you name (zero-shot: any label such as person, company, job title, product, email) in text, with GLiNER multi v2.1; works in many languages. Use it to pull people, organisations, places, dates or custom entity types out of text without training a model. Use chat instead when you need relations or reasoning about the entities, not just their spans. Returns JSON {output: {entities: [{text, label, start, end, score}], count, labels, threshold}, empty, charged_usd, receipt_quote_id}. Cost: quoted per call when the job is available; it is not available on this server right now (503). Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 missing_param/bad_param, 401 bad_api_key, 402 low balance, 429 busy (retry in seconds), 503 job_unavailable, 502 job_failed (refunded).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "labels": {
                "description": "Entity types to find, in plain words. Default: person, organization, location, date.",
                "examples": [
                  ["person", "organization", "location"]
                ],
                "items": {
                  "maxLength": 50,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "text": {
                "description": "The text to search, up to 20000 characters; long text is processed in chunks.",
                "examples": ["Ada Lovelace worked with Charles Babbage in London in 1843."],
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "threshold": {
                "description": "Minimum confidence (0.05-0.99) for an entity to be returned; lower finds more, with more false hits. Default 0.5.",
                "examples": [0.5],
                "maximum": 0.99,
                "minimum": 0.05,
                "type": "number"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Extract named entities of the types you name (GLiNER, zero-shot)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
