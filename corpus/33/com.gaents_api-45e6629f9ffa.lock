        {
          "name": "job_google_trends",
          "description": "Google Trends interest over time for one keyword (worldwide, 12 months)",
          "inputSchema": {
            "properties": {
              "keyword": {
                "description": "pattern [^\\r\\n]{1,100}",
                "type": "string"
              },
              "max_results": {
                "description": "default 1, at most 1",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
