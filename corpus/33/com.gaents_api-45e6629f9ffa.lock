            "properties": {
              "image_b64": {
                "description": "the image file, base64 (PNG/JPEG/TIFF/WebP)",
                "type": "string"
              },
              "lang": {
                "description": "traineddata language (installed: eng)",
                "enum": ["eng"],
                "type": "string"
