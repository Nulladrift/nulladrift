        {
          "name": "job_doc_to_markdown",
          "title": "Convert a document to Markdown (MarkItDown)",
          "description": "Converts one document (PDF with a text layer, DOCX, PPTX, XLSX, XLS, HTML, CSV, JSON, XML, EPUB, TXT; sent as base64) to Markdown with Microsoft MarkItDown, keeping headings, lists and tables. Use it to feed a document's content to a model or search index as clean Markdown. Use job_ocr_tesseract instead for scanned PDFs or images without a text layer (they come back empty here, not charged). Use job_site_render instead for a live web page that needs JavaScript. Cost: at most $0.00006268 per call (measured CPU time), debited from your balance; an empty result or failed run is free. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 missing_param/bad_param, 401 bad_api_key, 402 low balance, 429 busy (retry in seconds), 503 job_unavailable, 502 job_failed (refunded).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_b64": {
                "contentEncoding": "base64",
                "description": "The document file's bytes, base64-encoded, no data: prefix. (at most 3000000 bytes decoded)",
                "examples": ["PGgxPkV4YW1wbGU8L2gxPjxwPkhlbGxvIGZyb20gZ2FlbnRzLjwvcD4="],
                "type": "string"
              },
              "filename": {
                "description": "The document's file name; its extension (pdf, docx, pptx, xlsx, xls, html, htm, csv, json, xml, epub, txt, md) picks the converter.",
                "examples": ["example.html"],
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^(?:[A-Za-z0-9 ._()-]{1,100}\\.(pdf|docx|pptx|xlsx|xls|html|htm|csv|json|xml|epub|txt|md))$",
                "type": "string"
              }
            },
            "required": ["file_b64", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "charged": {
                "type": "boolean"
              },
              "charged_usd": {
                "type": "number"
              },
              "empty": {
                "description": "true = nothing found, not charged",
                "type": "boolean"
              },
              "measured": {
                "description": "wall seconds of this run",
                "type": "object"
              },
              "output": {
                "description": "{markdown, chars, truncated, title}",
                "properties": {
                  "chars": {},
                  "markdown": {},
                  "title": {},
                  "truncated": {}
                },
                "type": "object"
              },
              "receipt_quote_id": {
                "type": "string"
              },
              "source": {
                "type": "object"
              }
            },
            "required": ["charged_usd", "empty", "output", "receipt_quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Convert a document to Markdown (MarkItDown)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:aec6cbb0ef186898a3e604f667d3d03c4058355be6337088d10beefecd4a9868"
        },
        {
          "name": "job_google_trends",
          "title": "Google Trends interest over time for one keyword (worldwide, 12 months)",
          "description": "Fetches Google Trends interest over the last 12 months, worldwide, for one search keyword: weekly relative interest (0-100, 100 = the peak) plus average, peak and latest values. Use it to see whether interest in a topic, product or brand is rising, falling or seasonal. Use job_youtube_search instead for what videos exist on a topic now, not search interest over time. Cost: $0.0015 per keyword result, debited from your balance; only usable rows are charged, an empty or failed run is free. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 missing_param/bad_param, 401 bad_api_key, 402 low balance, 503 job_unavailable, 502 job_failed (refunded).",
