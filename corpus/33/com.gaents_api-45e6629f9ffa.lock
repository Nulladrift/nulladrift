        },
        {
          "name": "chat",
          "title": "Chat completion (OpenAI-compatible, many models)",
          "description": "Generates a chat completion from an OpenAI-style messages list with the model you name: a gaents/<family> alias (routed across providers, with failover) or an id from GET https://api.gaents.com/v1/models. Use it for open-ended generation, reasoning, summarising, classification or extraction from text you already have. Use catalogue instead to see the models and jobs on offer first. Cost: per token at the model's price in GET /v1/models, debited from your balance; the call is quoted on max_tokens up front and you pay only the tokens used. Auth: Authorization: Bearer <API key> (POST https://api.gaents.com/v1/accounts, $0.10 free credit); with no key the call returns a signed 402 quote payable in BSV or USDC via x402. Errors (isError, error.code): 400 model_required/messages_required/unknown_param, 401 bad_api_key, 402 low balance, 403 escalation_required, 404 model_not_served, 503 no route can serve it (not charged).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_tokens": {
                "description": "output token ceiling (the quote is priced on it)",
                "examples": [256],
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "OpenAI chat messages, oldest first",
                "examples": [
                  [
                    {
                      "content": "Say hello in five words.",
                      "role": "user"
                    }
                  ]
                ],
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant", "tool"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "Model to answer: a gaents/<family> alias or an id listed by GET https://api.gaents.com/v1/models.",
                "examples": ["gaents/glm-flash"],
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "temperature": {
                "description": "sampling temperature 0-2; lower is more deterministic (omitted = the model's default)",
                "examples": [0.2],
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["messages", "model"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "choices": {
                "items": {
                  "properties": {
                    "finish_reason": {
                      "description": "stop | length | ..."
                    },
                    "index": {},
                    "message": {
                      "properties": {
                        "content": {
                          "description": "the answer text"
                        },
                        "role": {
                          "description": "assistant"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "model": {
                "description": "the model you asked for"
              },
              "object": {
                "description": "chat.completion"
              },
              "served_family": {
                "description": "model family that answered (X-Gaents-Failover)"
              },
              "usage": {
                "properties": {
                  "completion_tokens": {},
                  "prompt_tokens": {},
                  "total_tokens": {}
                },
                "type": "object"
              }
            },
            "required": ["choices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Chat completion (OpenAI-compatible, many models)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
