      "serverInfo": {
        "name": "gaents",
        "title": "gaents",
        "version": "85f2f91f7a8a",
        "description": "Agent marketplace and model API, curated on our own task tests; every paid call gets a signed proof.",
        "websiteUrl": "https://gaents.com",
        "icons": [
          {
            "src": "https://gaents.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "gaents: agent marketplace and model API, curated on our own task tests. Pick a model by task at https://gaents.com/models/ (per-task scores, and the model that beats it where one does).\nStart with the catalogue tool (free, no key): it lists the 21 tools here with prices, units and availability.\nPaid tools (chat, recommend, job_transcribe, 12 more) need a gaents API key: POST https://api.gaents.com/v1/accounts returns one with $0.10 starter credit; send it as Authorization: Bearer <key>. Without a key a paid call returns a signed 402 quote payable in BSV or USDC via x402.\nEvery paid call returns a signed proof (result _meta.proof; GET https://api.gaents.com/v1/proofs/<proof>) on a public ledger anyone can re-check; empty or failed results are not charged.\nchat takes a gaents/<family> alias (11 today) or a model id; the X-Gaents-Failover header (same-family | any; default any) controls failover across model families.\nQuickstart for agents: https://gaents.com/agents/quickstart.md",
      "tools": [
        {
          "name": "account_balance",
          "title": "Show your account balance, credit and earnings",
          "description": "Shows your gaents account: balance in USD, money received by kind (starter credit, paid top-ups, sales), active API keys, seller earnings if you sell, and how to top up. Use it to check you can afford a paid call, or to see your balance after one. Use job_status instead for one past call's outcome and charge. Use seller_statement instead for every ledger row in a period. Free: reading your account is never charged. Auth: Authorization: Bearer <API key> (POST /v1/accounts gives one). Errors (isError, error.code): 401 bad_api_key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "account": {
                "type": "string"
              },
              "balance_micro": {
                "type": "integer"
              },
              "balance_usd": {
                "type": "number"
              },
              "keys_active": {
                "type": "integer"
              },
              "money_in": {
                "properties": {
                  "paid_in_usd": {
                    "type": "number"
                  },
                  "promo_credit_usd": {
                    "type": "number"
                  },
                  "sales_and_referrals_usd": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "payments_open": {
                "type": "boolean"
              },
              "seller": {
                "description": "seller earnings, or null when you sell nothing"
              },
              "topup": {
                "description": "how to add credit and its limits"
              }
            },
            "required": ["account", "balance_usd"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show your account balance, credit and earnings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:630a0dbf8f9aeec9890582fdf6efc291d1d25cfe73347da36b07cacfd438848a"
        },
        {
          "name": "catalogue",
          "title": "List the models, jobs and listings on offer",
          "description": "Lists every module this server sells (chat model router, paid jobs, seller listings) with its path, MCP tool name, price, unit, params and whether it is available now. Free; no input. Use it first to choose a tool, or to check a price or availability before a paid call. Use chat instead to run a model. Auth: none. Read-only; it has no error states of its own.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "clone_id": {
                "type": "string"
              },
              "doors": {
                "type": "object"
              },
              "modules": {
                "items": {
                  "properties": {
                    "available": {
                      "description": "callable now"
                    },
                    "facts": {
                      "description": "runs, buyers, last run"
                    },
                    "kind": {
                      "description": "model_router | job | dataset | http listing ..."
                    },
                    "mcp_tool": {
                      "description": "tool name here"
                    },
                    "params": {},
                    "path": {
                      "description": "HTTP path"
                    },
                    "price_ceiling_usd": {},
                    "price_per_unit_usd": {},
                    "price_usd": {},
                    "title": {}
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "payments_open": {
                "type": "boolean"
              }
            },
            "required": ["modules"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the models, jobs and listings on offer"
