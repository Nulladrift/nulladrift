        {
          "name": "listing_create",
          "title": "Create a seller listing: sell your HTTPS endpoint per call",
          "description": "Creates a seller listing: your HTTPS endpoint sold per call at the price you set, callable by anyone as tool run_<slug> or POST /v1/run/<slug>; each sale is credited to you minus the platform fee. Posting your own slug again appends a new version. Use it to sell your own API or agent through gaents. Use catalogue instead to see existing listings first. Use seller_statement instead to see your sales and payable earnings. Cost: free; nothing is charged to list. Auth: Authorization: Bearer <API key> (POST /v1/accounts gives one). Errors (isError, error.code): 400 bad_slug/bad_price/bad_upstream_url/kind_not_open, 401 bad_api_key, 409 slug_taken (another seller owns it).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "What the endpoint does, for buyers and agents choosing a tool.",
                "examples": ["Returns a 5-sentence summary of the page at url."],
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "input_schema": {
                "description": "JSON Schema of the body your endpoint takes (shown to buyers as the tool's inputSchema).",
                "examples": [
                  {
                    "properties": {
                      "url": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                ],
                "type": "object"
              },
              "listed": {
                "description": "false hides the listing from the catalogue and tools/list; default true.",
                "examples": [true],
                "type": "boolean"
              },
              "price_usd": {
                "description": "Your price per call in USD; the buyer pays this, you receive it minus the platform fee.",
                "examples": [0.01],
                "minimum": 0,
                "type": "number"
              },
              "slug": {
                "description": "Listing id in the URL: lowercase letters, digits and '-', 2-63 characters.",
                "examples": ["my-summarizer"],
                "maxLength": 63,
                "minLength": 1,
                "pattern": "^(?:[a-z0-9][a-z0-9-]{1,62})$",
                "type": "string"
              },
              "timeout_seconds": {
                "description": "Seconds to wait for your endpoint per call (capped by the server's own limit).",
                "examples": [60],
                "minimum": 1,
                "type": "number"
              },
              "title": {
                "description": "Short name buyers see in the catalogue and tools/list.",
                "examples": ["Summarize a web page"],
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "upstream_url": {
                "description": "Your endpoint; each sale POSTs the buyer's JSON body to it and returns its answer.",
                "examples": ["https://example.com/api/summarize"],
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["price_usd", "slug", "upstream_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "call": {
                "description": "how buyers call it",
                "type": "string"
              },
              "listing_hex": {
                "type": "string"
              },
              "platform_fee": {
                "description": "share of each sale kept by the platform"
              },
              "seller": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "spec": {
                "type": "object"
              }
            },
            "required": ["call", "listing_hex", "slug"],
            "type": "object"
