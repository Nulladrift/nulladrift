                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "nights": {
                      "type": "integer"
                    }
                  },
                  "required": ["checkin", "checkout", "nights"],
                  "type": "object"
