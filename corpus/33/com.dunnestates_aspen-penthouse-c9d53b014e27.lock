          "name": "get_quote",
          "title": "Live all-in quote",
          "description": "Exact all-in direct quote for specific dates from the live booking engine: itemized rent, any current offer, cleaning, property protection and taxes, with no platform fee. Also reports minimum-stay rules and invalid dates. Returns a prefilled secure checkout link for the guest. A quote is a live rate snapshot, not a hold or reservation.",
