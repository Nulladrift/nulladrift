      "instructions": "Read-only tools for The Galena Penthouse, a private one-bedroom top-floor penthouse for two in Aspen, Colorado (748 South Galena Street), ten steps from Aspen Mountain. Use check_availability or suggest_dates for open dates and get_quote for exact all-in pricing; never state a fixed nightly rate. Quotes are live rate snapshots, not holds or reservations. Share the bookingUrl from get_quote so the guest can complete the reservation at secure checkout. Booking, payment and messages always happen with the guest, never through these tools.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Night-by-night availability from the live booking calendar between two dates (up to 180 nights). Returns open windows, reserved ranges and whether the whole requested stay is open. Reserved nights are shown simply as reserved. Use get_quote to confirm the price and minimum stay for specific dates.",
          "inputSchema": {
            "properties": {
              "end": {
                "description": "Morning after the last night (departure date), YYYY-MM-DD",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "start": {
                "description": "First night to check (arrival date), YYYY-MM-DD",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["end", "start"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "allNightsOpen": {
                "type": "boolean"
              },
              "calendarAsOf": {
                "type": "string"
              },
              "end": {
                "type": "string"
              },
              "nights": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
