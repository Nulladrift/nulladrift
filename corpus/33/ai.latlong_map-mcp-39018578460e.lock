        {
          "name": "territory_mapping",
          "description": "Run the territory-management pipeline on a branch file uploaded via upload_file. Hybrid async with three modes: pass file_key to START a job (returns a job_id immediately); pass only job_id on subsequent calls to POLL progress; pass job_id AND catchment_type together to RESUME a job that paused for clarification. The pipeline validates that all branches are in one state, computes each branch's isochrone at catchment_distance_km, finds villages (catchment_type='village') or pincodes (catchment_type='pincode') that overlap the isochrone by ≥50%. A village/pincode inside several catchments is kept under EVERY branch (never deduplicated), and the last column closest_branch names the nearest branch by driving distance for those shared units (blank otherwise). Each catchment is split into 5 wedges of 72° (group_number 1-5); each wedge is split into bunches of 1-5 neighbouring units (bunch_number 1..N); each bunch is sequenced via the Trips API (trip_number 1-5); s_no numbers each branch's rows 1..N in that order. Returns a signed URL to an XLSX (download_url) with a Territory sheet of rows and a Maps sheet, and maps: one SVG per branch (map_url) with the branch at the centre, its units shaded by group_number and labelled by s_no, overlaps hatched green (this branch is closest) or red (another branch is closer); render_map=false skips the maps. Optional at start: style_request (the user's words for the map colours, e.g. 'groups in pink shades'; only the 5 group colours and the near/far hatch colours change, applied exactly as asked, pincode maps only) and map_title (replaces the map title). If requested colours make the hatching hard to see, warnings carry a suggestion to pass on to the user. catchment_type is OPTIONAL at start: if omitted, the geo-match service detects the branch file's place columns (a pincode column means pincode, a village column means village), and a catchment_type / area_type / mapping_type column also counts (must be uniform across rows). If the file is unclear (several such columns) or neither the caller nor the file specifies it — or they disagree — the job pauses in phase=awaiting_catchment_type and the poll response carries clarification_needed=true with a clarification_message instead of an error; answer by calling again with that same job_id plus the chosen catchment_type to resume. A file with mixed village/pincode values in its own column fails outright with AMBIGUOUS_CATCHMENT_TYPE. While a job runs, each response carries poll_after_seconds=10: wait 10 seconds, then poll again. Expect phase transitions: validating → isochroning → overlapping → grouping → bunching → routing → distancing → rendering_map → writing_output → complete (or awaiting_catchment_type, from which a resume call re-enters at validating). Flow: upload_file → upload bytes → territory_mapping{file_key,…} → territory_mapping{job_id} until phase=complete or phase=awaiting_catchment_type → if awaiting, territory_mapping{job_id, catchment_type} to resume → territory_mapping{job_id} until phase=complete.",
