                },
                "type": "array"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search API providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:196624bfc25738fe9f7838b782fee2d27e7ed64d253f94a617fada43de734170"
        }
