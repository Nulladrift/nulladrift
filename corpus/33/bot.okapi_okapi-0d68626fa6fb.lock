{
  "lockfileVersion": 2,
  "subjects": {
    "bot.okapi/okapi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.okapi.bot/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "okapi",
        "title": "Okapi",
        "version": "1.1.0",
        "description": "The breaking changes of third-party APIs: check your code's calls before they break.",
        "websiteUrl": "https://www.okapi.bot/products/mcp/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Okapi knows the breaking changes API providers announced (removed endpoints, retired versions, shut down models) and the ones it worked out itself. Before you write or change code that calls a third-party API, send its calls to check_calls and follow what comes back: the migration, the day, the provider's source. Search a provider's changes with search_breaking_changes (find its slug with search_providers); read your own repositories' calls with list_repositories and get_repository_calls. Cite a change with its okapi.bot page. check_calls works without a key; the other tools need a free API key from https://www.okapi.bot/app/api-keys/, sent as Authorization: Bearer okapi_…",
      "tools": [
        {
          "name": "check_calls",
          "title": "Check API calls",
          "description": "Before writing or changing code that calls a third-party API, send the calls (URL, method, models, parameters, version headers, SDK) and get each one's status (broken, at_risk, redirected, deprecated, ok, unknown) with the breaking changes that hit it: what breaks, when, what to migrate to, the provider's source. Works without a key (25 calls, the changes providers announced); a free key adds the ones Okapi inferred and 100 calls a request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "calls": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "headers": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "description": "Every version header the call sends, name and literal value; {} when it sends none, so the changes for calls without one apply. Left out, Okapi cannot tell. Never a secret.",
                      "type": "object"
                    },
                    "method": {
                      "description": "The HTTP method, when the code names one.",
                      "type": "string"
                    },
                    "models": {
                      "description": "Model ids the call may send.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "params": {
                      "description": "Parameter names it sends; dot paths for nested ones.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "sdk": {
                      "additionalProperties": false,
                      "properties": {
                        "package": {
                          "type": "string"
                        },
                        "symbol": {
                          "type": "string"
                        },
                        "version": {
                          "type": "string"
                        }
                      },
                      "required": ["package"],
                      "type": "object"
                    },
                    "url": {
                      "description": "The URL the code calls; templates welcome: https://api.github.com/repos/{owner}/{repo}",
                      "type": "string"
                    }
                  },
                  "required": [],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["calls"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calls": {
                "items": {
                  "properties": {
                    "breakingChanges": {
                      "type": "array"
                    },
                    "index": {
                      "type": "integer"
                    },
                    "provider": {
                      "type": "object"
                    },
                    "status": {
                      "type": "string"
                    }
                  },
                  "required": [],
                  "type": "object"
                },
                "type": "array"
              },
              "checkedAt": {
                "type": "string"
              },
              "notice": {
                "description": "Without a key: how many more changes a free key would show.",
                "type": "string"
              }
            },
            "required": ["calls", "checkedAt"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check API calls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4358a597182444d1250c393b29f83cf331af4c241b533d2f4eef2d99237b62b5"
        },
        {
          "name": "get_breaking_change",
          "title": "Read a breaking change",
          "description": "One breaking change by its id (openai/gpt-4o) or its okapi.bot page URL: its facts, what it targets, the migration. Needs a free API key (Authorization: Bearer okapi_…).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Its id: provider/slug, as search_breaking_changes gives it.",
                "type": "string"
              },
              "url": {
                "description": "Or its page on okapi.bot.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "announcedAt": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "effectiveAt": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "id": {
                "description": "provider/slug: the end of its okapi.bot page address.",
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "migration": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "model": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "outcome": {
                "type": "string"
              },
              "page": {
                "description": "Its okapi.bot page: link it when you cite the change.",
                "type": "string"
              },
              "provider": {
                "properties": {
                  "host": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "page": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": [],
                "type": "object"
              },
              "status": {
                "type": "string"
              },
              "summary": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "targets": {
                "type": "object"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["id", "page", "status", "title"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a breaking change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ee9db7165c3b004b81c7c93140d01f1ee3e4aec6609d7f465f278575d6ace3a"
        },
        {
          "name": "get_repository_calls",
          "title": "Read a repository's calls",
          "description": "Every API call Okapi found in one of your repositories at its last scan, each with its file and line, its status and the breaking changes that hit it; the broken and at risk first. Needs a free API key (Authorization: Bearer okapi_…).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "repository": {
                "description": "owner/name, or its id from list_repositories.",
                "type": "string"
              },
              "status": {
                "description": "Only the calls in this status.",
                "enum": ["broken", "at_risk", "redirected", "deprecated", "ok", "unknown"],
                "type": "string"
              },
              "workspace": {
                "description": "A workspace's id from list_repositories; your personal one when left out.",
                "type": "string"
              }
            },
            "required": ["repository"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "calls": {
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["calls"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a repository's calls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:844220e06c10b97842a075ecce990119039db9dd71a780509a9504011d8b8bea"
        },
        {
          "name": "list_repositories",
          "title": "List your repositories",
          "description": "Your repositories Okapi reaches through its GitHub App, in a workspace, each with its last scan (status, calls found, providers), and your workspaces. Needs a free API key (Authorization: Bearer okapi_…).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "workspace": {
                "description": "A workspace's id from list_repositories; your personal one when left out.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "repositories": {
                "type": "array"
              },
              "workspaces": {
                "type": "array"
              }
            },
            "required": ["repositories"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List your repositories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8ed23d7a77691c3bb62cfcc85633353f933dbce32bcbfd90e108a279dfd6651"
        },
        {
          "name": "search_breaking_changes",
          "title": "Search breaking changes",
          "description": "The breaking changes 1 to 10 providers announced: those to come (the nearest first), or in effect within a year, with their day, what changes, what to use instead and the okapi.bot page to cite. A provider by its okapi.bot slug: find it with search_providers. 20 a page (50 at most): pass nextCursor back as cursor for the next. Needs a free API key (Authorization: Bearer okapi_…).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The nextCursor of the page before.",
                "type": "string"
              },
              "kind": {
                "enum": ["removal", "version_retirement", "behaviour_change", "model_retirement"],
                "type": "string"
              },
              "limit": {
                "description": "Changes a page: 20 by default.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "providers": {
                "description": "Providers' okapi.bot slugs: openai, anthropic, stripe-api.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "when": {
                "description": "upcoming (the default), past (in effect within a year) or all.",
                "enum": ["upcoming", "past", "all"],
                "type": "string"
              }
            },
            "required": ["providers"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "items": {
                  "properties": {
                    "announcedAt": {
                      "anyOf": [
                        {
                          "format": "date",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "effectiveAt": {
                      "anyOf": [
                        {
                          "format": "date",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "description": "provider/slug: the end of its okapi.bot page address.",
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "migration": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "model": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "outcome": {
                      "type": "string"
                    },
                    "page": {
                      "description": "Its okapi.bot page: link it when you cite the change.",
                      "type": "string"
                    },
                    "provider": {
                      "properties": {
                        "host": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "page": {
                          "type": "string"
                        },
                        "slug": {
                          "type": "string"
                        }
                      },
                      "required": [],
                      "type": "object"
                    },
                    "status": {
                      "type": "string"
                    },
                    "summary": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "targets": {
                      "type": "object"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "page", "status", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "nextCursor": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["data", "nextCursor"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search breaking changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f48142d252d20b3da4552a0587ecb8a208c5c0adeb23b04a6b9136f8333f468"
        },
        {
          "name": "search_providers",
          "title": "Search API providers",
          "description": "API providers by name, host or slug (stripe, api.openai.com), each with its okapi.bot slug and how many breaking changes Okapi publishes for it. Needs a free API key (Authorization: Bearer okapi_…).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
