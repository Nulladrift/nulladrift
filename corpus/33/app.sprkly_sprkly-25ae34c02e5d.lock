        {
          "name": "sprkly_get_automation_insights",
          "title": "Get automation insights",
          "description": "What automations did over the last 7, 30 or 90 days: people messaged, messages sent (DMs, private replies, comment replies), active conversations (people who wrote in or were messaged), comments and DMs in (split), new contacts (and how many came by DM), emails captured and link clicks with the click rate, each against the period before. Also per day, and split by automation, keyword, post, account and campaign; each by_post row carries the reach and views of that post (null until fetched). Leads (who was reached, with emails they agreed to share) only with include [\"leads\"] and inbox access. One DM per person per post: a comment from someone who already got a DM on that post sends nothing, so comments in can run ahead of people messaged. That is the rule working, not a fault. Read `notes` before comparing numbers.",
          "inputSchema": {
            "properties": {
              "campaign": {
                "description": "Only automations in this campaign.",
                "type": "string"
              },
              "flow_id": {
                "description": "Only this automation (the automation_id from sprkly_list_automations).",
                "type": "string"
              },
              "include": {
                "description": "Which parts to return. Default: everything but leads.",
                "items": {
                  "enum": ["kpis", "daily", "by_flow", "by_keyword", "by_post", "by_profile", "by_campaign", "leads"],
                  "type": "string"
                },
                "type": "array"
              },
              "leads_limit": {
                "default": 25,
                "description": "How many leads, newest first. Up to 100.",
                "maximum": 100,
