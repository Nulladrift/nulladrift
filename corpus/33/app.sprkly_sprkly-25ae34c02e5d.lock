              },
              "ends_at": {
                "description": "Optional. When it switches itself off, as an ISO 8601 time in the future with a time zone. An empty string removes the end.",
                "type": "string"
              },
              "keyword": {
                "description": "Optional. The new word people comment or send. Only on an automation that starts from a word.",
                "type": "string"
              },
              "link": {
                "description": "Optional. The new https link for its link button.",
                "type": "string"
              },
              "message": {
                "description": "Optional. The new DM, or the new public reply on an automation that only replies in the comments. It replaces every version of the public reply.",
                "type": "string"
