        {
          "name": "sprkly_update_scheduled_post",
          "title": "Reschedule or edit a post",
          "description": "Change the caption, publish time, target accounts or attached media on a post that has not published yet. Posts with status \"scheduled\", \"pending_approval\" or \"draft\" can be edited, and the status never changes here: editing a post that waits for approval does not approve it, and a rejected post stays a draft until you request approval again. A post waiting for approval can only target one account. Refusals carry a code: approval_pending (the caption, media and accounts are locked while it waits for approval; the time can still change), publishing_now (it is going out right now), post_changed (it changed since you read it: read it again), stuck_publishing (it got stuck while going out: send the user to support@sprkly.app), caption_too_long (too long for one of its targets).",
          "inputSchema": {
            "properties": {
              "alt_text": {
                "description": "Replacement alt text, one entry per media item, in the post's media order after this edit. Use \"\" for an item with no alt text. Replaces all alt text on the post. Used on platforms that support it.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "caption": {
                "description": "Replacement caption. Each platform's own limit applies: X 280, Bluesky 300, Threads 500, Instagram and TikTok video 2,200, LinkedIn 3,000, TikTok photos 4,000, YouTube 5,000 bytes, Facebook 63,206, Telegram 4,096 as text alone and 1,024 with a photo or video. No < or > on YouTube.",
                "type": "string"
              },
              "media_id": {
                "description": "Replacement sprkly media file id. Shorthand for a one-item media_ids.",
                "type": "string"
              },
              "media_ids": {
                "description": "Replacement media, in slide order. Replaces the whole set, it does not append — pass every slide you want the post to keep. Clears the post's alt text unless alt_text is sent too.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "post_id": {
                "description": "The scheduled post id.",
                "type": "string"
              },
              "post_type": {
                "description": "Optional. What the post is for: awareness (show new people who you are and what you sell), educational (teach something useful), proof (show that other people trust you), conversation (get people to reply), conversion (ask people to buy, book or order now), loyalty (for people who already bought). Any other value is refused. Separate from category, which is the topic. Send \"\" to clear it.",
                "type": "string"
              },
              "profile_ids": {
                "description": "Replacement target accounts. Platforms are re-derived from them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "scheduled_time": {
                "description": "New ISO 8601 publish time. Must be in the future.",
                "type": "string"
              }
            },
            "required": ["post_id"],
