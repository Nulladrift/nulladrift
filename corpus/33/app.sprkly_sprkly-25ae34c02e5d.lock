        {
          "name": "sprkly_schedule_post",
          "title": "Schedule a post",
          "description": "Queue a post for publishing, in ONE call. Attach media by passing the user's link straight to media_urls: sprkly downloads it into storage itself for the platforms that need that, so no upload tool has to run first. Runs the same quota, duplicate-content and platform pre-flight checks as the sprkly app. Instagram and TikTok require media at submission time; YouTube and TikTok require a title, and TikTok also requires platform_meta.tiktok.privacyLevel — just send the level the user asked for and this tool names the allowed values if it is not one of them. It reads the real bytes of the media and the response says what will actually publish on each platform (a Reel, a 3-slide carousel, a photo set, a Page feed video) plus anything worth passing on: relay that to the user. Confirm the date, time and target accounts with the user first. If a target platform has more than one connected account and profile_ids is not given, the tool returns needsAccountChoice with the options instead of scheduling — put that choice to the user, then re-call.",
          "inputSchema": {
            "properties": {
              "all_accounts": {
                "default": false,
                "description": "Explicitly post to EVERY connected account on every listed platform, skipping the needsAccountChoice question. Only pass true when the user has said they want all accounts.",
                "type": "boolean"
              },
              "alt_text": {
                "description": "Optional alt text, one entry per media item, in the same order as media_urls then media_ids. Use \"\" for an item with no alt text. Up to 1,000 characters each. A list longer than the media is refused. Stored with the post. Used on platforms that support it.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "approval_note": {
                "description": "Optional note to the owner, shown in the approval email. Only used with requires_approval.",
                "type": "string"
              },
              "automation": {
                "description": "Instagram only, optional. An auto reply that switches on once this post is live: when someone comments the keyword, sprkly DMs them. Not on a story. It replies to real people, so show the user the word and the DM first. One per Instagram account in the targets.",
                "properties": {
                  "buttons": {
                    "description": "Optional link buttons under the DM, up to 3. Needs dm.",
                    "items": {
                      "properties": {
                        "title": {
                          "description": "Up to 20 characters.",
                          "type": "string"
                        },
                        "url": {
                          "description": "A full https link.",
                          "type": "string"
                        }
                      },
                      "required": ["title", "url"],
                      "type": "object"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "campaign": {
                    "description": "Optional. A campaign label, up to 60 characters.",
                    "type": "string"
                  },
                  "comment_reply": {
                    "description": "Optional public reply under their comment.",
                    "type": "string"
                  },
                  "daily_send_cap": {
                    "description": "Optional. Most DMs a day for this automation, 1 to 1000.",
                    "type": "number"
                  },
                  "dm": {
                    "description": "The DM sent to them, up to 1,000 bytes: about 1,000 plain letters, fewer with emoji.",
                    "type": "string"
                  },
                  "ends_at": {
                    "description": "Optional. When it switches off, ISO 8601 with a time zone. Must be after the post time.",
                    "type": "string"
                  },
                  "keyword": {
                    "description": "The word people comment. Needed for post_keyword.",
                    "type": "string"
                  },
                  "kind": {
                    "description": "post_keyword (the default) answers comments with the keyword. post_any_comment answers every comment.",
                    "enum": ["post_keyword", "post_any_comment"],
                    "type": "string"
                  },
                  "name": {
                    "description": "Optional. Its name in sprkly.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "caption": {
                "description": "Post caption. Each platform's own limit applies: X 280, Bluesky 300, Threads 500, Instagram and TikTok video 2,200, LinkedIn 3,000, TikTok photos 4,000, YouTube 5,000 bytes, Facebook 63,206, Telegram 4,096 as text alone and 1,024 with a photo or video. No < or > on YouTube. Links in a caption or first comment are published as written: sprkly does not check them. Too long for a target is refused with caption_too_long.",
                "type": "string"
              },
              "category": {
                "description": "Optional content category, e.g. \"fitness\".",
                "type": "string"
              },
              "first_comment": {
                "description": "Instagram only. Optional text sprkly posts as the first comment under the post right after it publishes, e.g. \"Comment GUIDE and I will send you the link.\" Up to 2,200 characters. Ignored for other platforms. Refused on a story (surface story): stories take no comments. Every paid plan: Free gets upgrade_required.",
                "type": "string"
              },
              "media_id": {
                "description": "Id of a single media file already uploaded to sprkly. Shorthand for a one-item media_ids.",
                "type": "string"
              },
              "media_ids": {
                "description": "Ids of media files already uploaded to sprkly, in slide order. Array order is the published order. Use these when the user already has media in sprkly, or when one file is going on several posts; for a link the user just gave you, media_urls is fewer steps. Every photo in a set must be the SAME shape or the call is refused: export them all at 1080x1920 (9:16), 1080x1440 (3:4), 1080x1350 (4:5) or 1080x1080 (1:1). Instagram takes at most 20 slides; TikTok photo sets take up to 35.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "media_urls": {
                "description": "Publicly reachable image or video URLs to attach, in slide order. Pass links through for ANY platform. Instagram and Threads fetch them directly; for TikTok, YouTube and Facebook sprkly downloads the file into its own storage while scheduling, so a link works there too and any problem with it is reported now, in this call. Google Drive and Dropbox share links are converted automatically. JPEG, PNG, WebP, GIF, MP4, MOV and WebM only: AVIF and HEIC (the iPhone camera default) are refused with re-export instructions, because sprkly cannot convert them. Each file must be publicly reachable and under 50 MB.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "platform_meta": {
                "description": "Platform-specific publishing options, keyed by platform.",
                "properties": {
                  "instagram": {
                    "description": "Instagram publishing options.",
                    "properties": {
                      "surface": {
                        "description": "Where to publish. 'story' posts to the account's Story instead of the feed: it disappears after 24 hours, takes exactly ONE photo or video, and sends no caption — Instagram Stories have no caption field. Omit for a normal feed post or Reel. The media cannot decide this: a 9:16 video is a Reel or a Story, so ask the user which they want rather than guessing.",
                        "enum": ["feed", "story"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "tiktok": {
                    "description": "TikTok publishing options. privacyLevel is REQUIRED for every TikTok post.",
                    "properties": {
                      "autoAddMusic": {
                        "default": true,
                        "description": "Attach TikTok's recommended music. Photo posts only; defaults true.",
                        "type": "boolean"
                      },
                      "brandContentOptIn": {
                        "description": "Branded content: the post promotes a third party. Cannot be combined with privacyLevel SELF_ONLY.",
                        "type": "boolean"
                      },
                      "brandName": {
                        "description": "Optional brand name shown with the commercial content disclosure.",
                        "type": "string"
                      },
                      "brandOrganicOptIn": {
                        "description": "Organic branding: the post promotes the creator's own brand.",
                        "type": "boolean"
                      },
                      "commercialContentDisclosure": {
                        "description": "Declare the post as commercial content. When true, at least one of brandContentOptIn or brandOrganicOptIn must also be true.",
                        "type": "boolean"
                      },
                      "disableComment": {
                        "description": "Turn off comments on the post.",
                        "type": "boolean"
                      },
                      "disableDuet": {
                        "description": "Disallow duets of the video.",
                        "type": "boolean"
                      },
                      "disableStitch": {
                        "description": "Disallow stitches of the video.",
                        "type": "boolean"
                      },
                      "privacyLevel": {
                        "description": "REQUIRED for TikTok posts. Must be one of this creator's allowed options: fetch them with sprkly_get_tiktok_posting_options.",
                        "enum": ["PUBLIC_TO_EVERYONE", "MUTUAL_FOLLOW_FRIENDS", "FOLLOWER_OF_CREATOR", "SELF_ONLY"],
                        "type": "string"
                      },
                      "title": {
                        "description": "Optional TikTok-only title, used instead of the top-level title on TikTok. Trimmed to 150 characters. The top-level title is still required even when you set this one.",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "platforms": {
                "description": "Platforms to publish to. A platform with exactly one connected account is targeted directly; one with several makes the tool answer needsAccountChoice so the user can pick.",
                "items": {
                  "enum": ["instagram", "tiktok", "youtube", "threads", "facebook", "bluesky", "x", "linkedin", "telegram"],
                  "type": "string"
                },
                "type": "array"
              },
              "post_type": {
                "description": "Optional. What the post is for: awareness (show new people who you are and what you sell), educational (teach something useful), proof (show that other people trust you), conversation (get people to reply), conversion (ask people to buy, book or order now), loyalty (for people who already bought). Any other value is refused. Separate from category, which is the topic.",
                "enum": ["awareness", "educational", "proof", "conversation", "conversion", "loyalty"],
                "type": "string"
              },
              "profile_ids": {
                "description": "Specific accounts to publish to, from sprkly_list_profiles. When given, this list IS the target set — platforms are not fanned out.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "requires_approval": {
                "default": false,
                "description": "Hold the post until the owner approves it. It is saved as pending_approval and never publishes on its own; the owner gets an email with an Approve link and can also approve or reject in the sprkly calendar. Poll sprkly_get_post_approval_status for the answer. Brand, Pro, Agency and lifetime Tier 2 and up only (postApproval in sprkly_get_account_summary): other plans get upgrade_required.",
                "type": "boolean"
              },
              "scheduled_time": {
                "description": "ISO 8601 timestamp to publish at. Must be in the future. If omitted the post goes out on the next publisher run, about a minute from now — there is no smart slot-picking, so pass an explicit time unless the user wants it published immediately. sprkly_get_analytics can suggest one.",
                "type": "string"
              },
              "title": {
                "description": "Post title. Required for YouTube (max 100 characters) and TikTok (max 150 characters).",
                "type": "string"
              },
              "x_link_as_text": {
                "default": false,
                "description": "X only. Writes each link in the X caption as plain text, like sprkly dot app, so X counts it as a post without a link. A post with a link uses more of the X posts on lifetime plans. Other platforms keep the caption as sent.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
