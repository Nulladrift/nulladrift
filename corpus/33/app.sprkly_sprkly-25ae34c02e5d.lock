        {
          "name": "sprkly_get_analytics",
          "title": "Get post performance",
          "description": "How the user's published posts actually performed: total views and engagement, week-on-week / month-on-month / year-on-year change, their best posting hour, weekday and content category, and the top posts behind those numbers. Every recommendation carries a `samples` count: say how thin the evidence is rather than presenting a one-post pattern as a finding. Every period-on-period percentage carries the post counts and raw totals it came from: quote those, because a big percentage off a tiny base is not a big change. `topPosts` is grouped by platform and ranked only inside each group; `relativeToPlatformBest` compares a post with others on its OWN platform and never across platforms, so use the absolute `value` and its `metric` label to weigh one platform against another. Instagram contributes reach, saves, shares and views only for accounts connected or reconnected with the insights permission, and likes and comments only for the rest. X contributes views, likes, replies, reposts and bookmarks, read twice for each post: about a day after it goes out and about a week after. Bluesky contributes likes, replies and reposts, never views. Facebook reports reactions and shares for posts made with sprkly, plus comments once Meta allows it for the Page, and views and reach only for accounts that granted insights access. Threads reports nothing until the account grants insights access. LinkedIn and Telegram report no numbers yet. Read `coverage` before comparing platforms, and never rank platforms on a metric one of them lacks. Each top post also carries reach, views, saves and shares (null where the platform or the connection does not share that number, absent when the plan does not include saves and shares) and `vsUsual`: that post against the median of the same account's other posts, per metric, so you can say \"3x your usual views\". There is no count of followers gained per post: never credit a follow to a post. `findings` are computed from these numbers; use them as a starting point and check them against the data.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "How many days back to analyse. Default 30. Free plans read at most 30 days; paid plans read up to 730.",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 12,
                "description": "Most top posts to return across all platforms. Default 12. Each platform still shows at most 5.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "profile_ids": {
                "description": "Limit to these accounts. Omit for every account this connection can see.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get post performance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fb0252cb5454f00cc91dc61292b35962b9bc48a096f9c51a5fc82f6449f3e3e"
        },
        {
          "name": "sprkly_get_audience",
          "title": "Get Instagram audience",
          "description": "Who follows each Instagram account and how that changed: followers by age, gender, top 5 countries and top 5 cities, the hours followers are online (UTC), and how many accounts followed and unfollowed in the last 7 and last 28 days. Instagram only: no other platform shares this. Saved for 24 hours when Instagram answers; retried sooner otherwise. Rules: under 100 followers Instagram shares nothing, and `notes` says so; report that, never zeros. Follows are totals per window with no day by day split and no count per post, so never credit a follow to a post. These numbers describe followers, not everyone a post reached. Never call anything \"link taps\". An account without the insights permission comes back as reconnect until the owner connects Instagram again. Every paid plan.",
