{
  "lockfileVersion": 2,
  "subjects": {
    "app.recalldb/recalldb": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://recalldb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "recalldb",
        "title": "RecallDB recall data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RecallDB gives official U.S. recall notices (NHTSA vehicles, car seats and tires; CPSC products; FDA food, supplements, drugs and devices). Every result names the agency and links to the official notice: cite both. A result means a notice mentions the item; it does not say a specific item is affected, and finding nothing never means an item is safe or has no recall. Never tell a user an item is \"safe\", \"not recalled\" or \"unaffected\"; tell them to compare lot codes, dates and serial numbers with the official notice and to confirm with the manufacturer or the agency. Show \"Data from RecallDB\" with a link to https://recalldb.app when you present results.",
      "tools": [
        {
          "name": "barcode_lookup",
          "title": "Look up a barcode",
          "description": "Recalls whose official notice lists a barcode (UPC-A, EAN-13, GTIN-14, UPC-E or EAN-8; the check digit must be right). Each match includes the notice's own text and the lot codes, best-by dates and serial numbers written near the barcode. A match means the code appears in a notice; the user must verify lot codes and dates against the official notice. No match does not mean there is no recall: not every recall lists barcodes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The barcode number, digits only or with spaces and dashes.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a barcode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca93f6799d13faefce4c87cf08cb8291a6d711e41eca17702bfc532f69fa4d31"
        },
        {
          "name": "get_recall",
          "title": "Get a recall",
          "description": "The full record for one recall: the official problem, consequence and remedy text, the issuing company, units, official codes as listed, and the agency, its own number and a link to the official notice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The recall id as returned by search_recalls, for example 21V215000 (NHTSA), cpsc-27064 or fda-98506.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a recall"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddb7f95655ac6044928ecd0c0e0ad57d31cb8ee38a28dd90fc761e6740e6f602"
        },
        {
          "name": "search_recalls",
          "title": "Search recalls",
          "description": "Full-text search of recall notices by product name, brand, model number, recall number or UPC across vehicles, motorcycles, RVs, car seats, tires, equipment, consumer products, food, supplements, pet food, cosmetics, drugs and medical devices. Returns up to 50 results a page, each with an id for get_recall and a link to the official notice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Only this agency.",
                "enum": ["nhtsa", "cpsc", "fda", "usda", "tc", "hc", "cfia", "fsa", "accc", "eusg", "opss", "mhra"],
                "type": "string"
              },
              "category": {
                "description": "Only this category.",
                "enum": ["vehicle", "motorcycle", "rv", "car_seat", "tire", "equipment", "other_vehicle", "consumer_product", "food", "dietary_supplement", "pet_food", "cosmetic", "drug", "medical_device", "ca_vehicle", "ca_product", "ca_food", "ca_medicine", "uk_food", "au_product", "meat_poultry", "public_health_alert"],
                "type": "string"
              },
              "from": {
                "description": "Only recalls dated on or after this day (YYYY-MM-DD).",
                "type": "string"
              },
              "fuzzy": {
                "description": "Default true: if nothing matches, names (makes, brands, companies, products) are tried with a corrected spelling and corrected_query says so. Recall numbers, UPCs and model numbers are always exact. false turns it off.",
                "type": "boolean"
              },
              "page": {
                "description": "Page number (default 1).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, for example \"bunk bed\", \"Graco car seat\" or a model number.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "description": "A U.S. state code such as TX: keeps recalls sold nationwide, in that state or with no clear distribution.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "to": {
                "description": "Only recalls dated on or before this day (YYYY-MM-DD).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search recalls"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0ba485cce3cfe222d0cc77a3b7d1145371c1d0d9cdb2ad8ac0c994f27b47e880"
        },
        {
          "name": "vehicle_recalls",
          "title": "Vehicle recalls by model and year",
          "description": "NHTSA recalls for a car make, model and model year, as listed by the recall notices. Recalls are by model, not by individual vehicle: this does not say whether one specific car has an open recall (the owner checks the VIN with NHTSA or the carmaker).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "The make, for example Honda.",
                "type": "string"
              },
              "model": {
                "description": "The model, for example Civic.",
                "type": "string"
              },
              "year": {
                "description": "The model year, for example 2019.",
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Vehicle recalls by model and year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b6ffe7c148773a5907adce14ac01cc92df2a252e3ff7748b09d6535e46aba86"
        }
      ],
      "digest": "sha256:0e3975ed9aa9267bc5607867351aeee70a7394f99a7cfea165cbc8de9ecaf4fb"
    }
  }
}
