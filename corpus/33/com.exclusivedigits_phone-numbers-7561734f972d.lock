      "instructions": "Exclusive Digits is a store of US local phone numbers. Prices are one-time; there is no monthly fee.\n- To find numbers, call find_numbers once: put the user's own words in request and fill the fields they imply (place and its area codes, a word to spell, digits, pattern, industry, price, on sale). Results come ranked, best first; when nothing matches, the store has already widened the search and its note says how.\n- Give each number with its page link (url). The user buys on that page; you cannot buy for them.\n- For more numbers from the same search, call find_numbers with search_id and page.\n- get_number checks one specific number. catalog_vocabulary lists pattern and industry codes. how_buying_works answers payment, transfer and refund questions.\n- Prices and availability can change; availability is checked again at checkout. Toll-free numbers are not sold.",
