        {
          "name": "find_numbers",
          "title": "Find phone numbers for sale",
          "description": "Searches Exclusive Digits' phone numbers for sale and returns up to 20, ranked best first, each with price, location, what it spells, its patterns and its page link. Unknown pattern or industry codes are left out with a note. When nothing matches, the search widens on its own and the reply says how.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "alternate_words": {
                "description": "Short words with the same meaning, tried when the first finds nothing (PIZZA: PIE, SLICE).",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "area_codes": {
                "description": "Area codes that serve the place, overlays included (Miami: 305, 786, 645; Manhattan: 212, 646, 332, 917), or an area code the user asked for. A city with no area codes searches its whole state, so give them; leave empty only for a whole state.",
                "items": {
                  "pattern": "^\\d{3}$",
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "digits": {
                "description": "3 to 7 digits the number should contain (\"7777\"), not an area code asked for as a place.",
                "maxLength": 10,
                "type": "string"
              },
              "industry": {
                "description": "Industry code when the user names a kind of business and no word, e.g. LAW, MED, REAL, HOME, AUTO. catalog_vocabulary lists them all.",
                "maxLength": 40,
                "type": "string"
              },
              "max_price": {
                "description": "Highest price in US dollars (\"under $500\" is 500).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price in US dollars.",
                "minimum": 0,
                "type": "number"
              },
              "on_sale": {
                "description": "Only numbers on sale, including daily specials.",
                "type": "boolean"
              },
              "own_numbers_only": {
                "description": "Only numbers the store owns itself.",
                "type": "boolean"
              },
              "page": {
                "description": "Page 2 to 5 of the search named by search_id.",
                "maximum": 5,
                "minimum": 2,
                "type": "integer"
              },
              "pattern": {
                "description": "Pattern code when the user describes one: repeating (\"easy to remember\"), lucky_sevens (\"lots of 7s\"), npa_nxx_x000 (\"ends in 000\"), sequential, year. catalog_vocabulary lists them all.",
                "maxLength": 40,
                "type": "string"
              },
              "place_words": {
                "description": "The words that name the place: \"Miami\", \"south Florida\", \"NYC\", \"Austin, TX\", \"90210\". Leave out when no place was named.",
                "maxLength": 80,
                "type": "string"
              },
              "position": {
                "description": "Where the word or digits go: endsWith (the default), startsWith (right after the area code; needs a place) or contains (anywhere).",
                "enum": ["endsWith", "startsWith", "contains"],
                "type": "string"
              },
              "request": {
                "description": "The user's request in their own words, e.g. \"an easy to remember number for my Austin plumbing business under $300\". The store checks your other fields against these words and the fields themselves.",
                "maxLength": 300,
                "type": "string"
              },
              "search_id": {
                "description": "The search_id of an earlier result, with page, for more numbers from that search. Send no other fields with it.",
                "maxLength": 64,
                "type": "string"
              },
              "sort": {
                "description": "recommended (the default ranking), price_asc for \"cheap\", price_desc for \"premium\", newest.",
                "enum": ["recommended", "price_asc", "price_desc", "newest"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state of that place, or the state asked for (\"TX\").",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "words": {
                "description": "What the number should spell, letters only, 3 to 7 letters (PIZZA, not \"pizza place\"). One is usual.",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "note": {
                "type": ["string", "null"]
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "numbers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "daily_special": {
                      "type": "boolean"
                    },
                    "display": {
                      "type": "string"
                    },
                    "formatted": {
                      "type": "string"
                    },
                    "list_price": {
                      "type": ["number", "null"]
                    },
                    "number": {
                      "type": "string"
                    },
                    "owned_by_store": {
                      "type": "boolean"
                    },
                    "patterns": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "position": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "price": {
                      "type": ["number", "null"]
                    },
                    "sale_ends_at": {
                      "type": ["string", "null"]
                    },
                    "spells": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["city", "daily_special", "display", "formatted", "list_price", "number", "owned_by_store", "patterns", "position", "price", "sale_ends_at", "spells", "state", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "page": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "search_id": {
                "type": ["string", "null"]
              },
              "searched": {
                "type": "string"
              },
              "see_all_url": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["found", "none", "no_more", "unclear"],
                "type": "string"
              }
            },
            "required": ["has_more", "note", "notes", "numbers", "page", "search_id", "searched", "see_all_url", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find phone numbers for sale"
