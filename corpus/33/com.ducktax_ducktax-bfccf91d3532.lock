        {
          "name": "check_filing_extension",
          "description": "Whether a company can still apply to its registrar for more time to file, how many days are left to apply, and what being late costs if that window is missed. This is usually the most useful thing to tell somebody who has just found a deadline: applying is free, takes about 15 minutes, and has to be done BEFORE the deadline it extends, so the option expires on the same day the penalty starts. Returns nextAction first. It PREPARES an application and can never submit one: the application is made by a director on the registrar’s own service, which this tool links to. It does not file accounts. Give a company number to read the deadline off the register (quota-charged, cached results free), or give the dates yourself and it costs nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alreadyExtended": {
                "default": false,
                "description": "True if this deadline has been extended once already. Do not guess it, ask.",
                "type": "boolean"
              },
              "companyNumber": {
                "description": "Read the deadline and period end off the register. Omit if you supply the dates.",
                "minLength": 1,
                "type": "string"
              },
              "filing": {
                "default": "accounts",
                "description": "Which deadline. Only accounts can be extended; ask about the other and it says so.",
                "enum": ["accounts", "confirmation-statement"],
                "type": "string"
              },
              "filingDeadline": {
                "description": "The normal filing deadline, if you already have it. Skips the register request.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "jurisdiction": {
                "default": "GB",
                "description": "ISO country code. Register access exists for GB and AU.",
                "enum": ["GB", "IE", "US", "AU"],
                "type": "string"
              },
              "periodEnd": {
                "description": "The accounting reference date. Bounds how much extra time could be granted.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "today": {
                "description": "Defaults to the server's date. Supply it to test a boundary.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["alreadyExtended", "filing", "jurisdiction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Filing Extension"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d4352578c11188e516f1cb27004a5021a7f52e170efe4b619a05c4779bedc12e"
        },
