            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "descriptions": {
                "description": "The raw description strings, one per transaction.",
                "items": {
                  "type": "string"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              },
              "tradingType": {
                "default": "other",
                "description": "What the company does, to resolve ambiguous merchants. One of: software, consulting, creative, retail, construction, property, hospitality, other. lookup_company suggests one from the SIC codes.",
                "type": "string"
              }
            },
            "required": ["descriptions", "tradingType"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Categorise Transactions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f20e03f03be853e89428803fd56e3ca5958c86c911c6ad4b96ccb2cde329d485"
        },
        {
          "name": "check_accounts",
          "description": "Derive a small-company balance sheet (micro-entity, in UK terms) from raw figures and validate it. Returns the derived sheet for the current and prior year, the figures the authority would reject (negatives where it wants a positive, share capital left at nil), and whether they are complete enough to hand to a filing product. It does NOT check that the sheet balances and cannot: retained earnings is derived as the balancing figure, so each column always agrees with itself. Do not tell anybody their sheet was checked for internal consistency within a column. It DOES compare the two columns to each other: when this year's reserves do not equal last year's plus this year's result it returns a warning, which most often means last year was wrong and the comparative needs restating. Free and instant: call it after every change to the figures. All money in major units (pounds not pence, dollars not cents). Pass lastFiledAs from lookup_company and it also warns when figures showing activity are about to be filed dormant again.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "figures": {
                "additionalProperties": false,
                "description": "The figures behind a small-company balance sheet. ALL amounts in major units.",
                "properties": {
                  "calledUpShareCapitalNotPaid": {
                    "default": 0,
                    "description": "Share capital subscribed for but never paid to the company, an asset on its own line above fixed assets. Usually 1 for a company formed with one unpaid share. Not a debtor and not a current asset.",
                    "type": "number"
                  },
                  "calledUpShareCapitalNotPaidPrior": {
                    "default": 0,
                    "description": "Previous year called up share capital not paid. Usually the same as this year.",
                    "type": "number"
                  },
                  "cashAtBank": {
                    "description": "Bank balance at the year end. Negative means an overdraft.",
                    "type": "number"
                  },
                  "cashAtBankPrior": {
                    "description": "Previous year-end bank balance. 0 for a first year.",
                    "type": "number"
                  },
                  "creditorsWithinOneYear": {
                    "description": "Money the company owes, due within a year, expressed positive. Includes director loans owed back.",
                    "type": "number"
                  },
                  "creditorsWithinOneYearPrior": {
                    "description": "Previous year creditors. 0 for a first year.",
                    "type": "number"
                  },
                  "debtors": {
                    "description": "Money owed to the company at the year end.",
                    "type": "number"
                  },
                  "debtorsPrior": {
                    "description": "Previous year debtors. 0 for a first year.",
                    "type": "number"
                  },
                  "directorsLoan": {
                    "default": 0,
                    "description": "How much of the creditors above is owed to the company's own directors. Part of that figure, never an addition to it. Usually the largest line on a one-person company's sheet, and repayable to the director free of tax.",
                    "type": "number"
                  },
                  "directorsLoanPrior": {
                    "default": 0,
                    "description": "Previous year directors' loan. 0 for a first year.",
                    "type": "number"
                  },
                  "fixedAssets": {
                    "description": "Equipment and other fixed assets at net book value.",
                    "type": "number"
                  },
                  "fixedAssetsPrior": {
                    "description": "Previous year fixed assets. 0 for a first year.",
                    "type": "number"
                  },
                  "operatingCosts": {
                    "description": "Total running costs for the year, expressed positive.",
                    "type": "number"
                  },
                  "operatingCostsPrior": {
                    "description": "Previous year operating costs. 0 for a first year.",
                    "type": "number"
                  },
                  "shareCapital": {
                    "description": "Issued share capital or common stock, typically 1 to 100.",
                    "type": "number"
                  },
                  "shareCapitalPrior": {
                    "description": "Previous year share capital. Usually the same as this year.",
                    "type": "number"
                  },
                  "turnover": {
                    "description": "Sales income for the year, in major currency units (pounds/euros/dollars).",
                    "type": "number"
                  },
                  "turnoverPrior": {
                    "description": "Previous year turnover. 0 for a first year.",
                    "type": "number"
                  }
                },
                "required": ["calledUpShareCapitalNotPaid", "calledUpShareCapitalNotPaidPrior", "cashAtBank", "cashAtBankPrior", "creditorsWithinOneYear", "creditorsWithinOneYearPrior", "debtors", "debtorsPrior", "directorsLoan", "directorsLoanPrior", "fixedAssets", "fixedAssetsPrior", "operatingCosts", "operatingCostsPrior", "shareCapital", "shareCapitalPrior", "turnover", "turnoverPrior"],
                "type": "object"
              },
              "jurisdiction": {
                "default": "GB",
                "description": "ISO country code. GB is the only jurisdiction with full support.",
                "enum": ["GB", "IE", "US", "AU"],
                "type": "string"
              },
              "lastFiledAs": {
                "description": "What the last accounts were filed as, straight from lookup_company's company.lastAccountsType. Pass it through; do not guess it.",
                "type": "string"
              }
            },
            "required": ["figures", "jurisdiction"],
            "type": "object"
          },
