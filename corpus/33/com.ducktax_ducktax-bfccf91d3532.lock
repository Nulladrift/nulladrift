        {
          "name": "track_company_deadlines",
          "description": "Watch a company by its register number and get reminded before its filing deadlines. Which channels are actually available depends on the server: the reply reports what will really be sent, and it can be nothing at all, so read it rather than assuming. No saved filing is needed: this is for the deadline itself, which matters months before any figures exist. Reminders go out on a ladder of days before the deadline (default 90, 60, 30, 14, 7, 1), and each one states the company, the deadline, the date, the days remaining and the penalty for missing it. Calling this again updates the settings and un-mutes a company that was untracked.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "companyNumber": {
                "description": "The register identifier: GB company number (e.g. 15379140) or AU ABN.",
                "minLength": 1,
                "type": "string"
              },
              "email": {
                "default": true,
                "description": "Send reminders to the account email address.",
                "type": "boolean"
              },
              "jurisdiction": {
                "default": "GB",
                "description": "ISO country code. Deadline reminders exist where the register publishes deadlines.",
                "enum": ["GB", "IE", "US", "AU"],
                "type": "string"
              },
              "push": {
                "default": true,
                "description": "Send reminders as web push to signed-in browsers.",
                "type": "boolean"
              },
              "remindDaysBefore": {
                "description": "Days before the deadline to warn, e.g. [60, 14, 1]. Omit to use this server’s default ladder. Only the tightest rung that applies is ever sent, so a long ladder does not mean a burst of messages.",
                "items": {
                  "maximum": 3650,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "required": ["companyNumber", "email", "jurisdiction", "push"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Track Company Deadlines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
