      "instructions": "Duck Tax checks micro-entity company accounts: raw figures in, validated balance sheet out.\n\nAll money amounts, in every tool, are MAJOR currency units (pounds/euros/dollars, decimals allowed). Never pass pence.\n\nA typical flow: search_companies to find the company, lookup_company for its record and deadlines, get_prior_year_figures for last year's comparatives, check_accounts after every change to the figures, explain_accounts for a plain-English reading, and save_filing (token required) to keep the result. For a bank statement, send categorise_transactions the description strings only, sum the amounts per category yourself, and feed totals_to_figures.\n\nWhen somebody has just discovered a deadline, check_filing_extension before anything else: applying to the registrar for more time is free, takes about 15 minutes, and has to be done BEFORE the deadline, so the option expires on the day the penalty starts. It returns the ranked next action. Neither that tool nor draft_extension_reason submits anything, and this server cannot file: the application is made by a director on the registrar's own service.\n\nWhen somebody is at risk of missing a deadline, track_company_deadlines (token required) is the useful thing to offer: it needs only a company number, no figures, and it sends reminders on a ladder of days before the deadline. Which channels it can actually use is a property of this deployment, not of the request, so the tool's reply reports what will really be sent and may report nothing at all; relay that rather than promising an email. Saved filings are watched automatically, so only offer it for a company they have not saved.\n\nThis server does NOT file accounts with Companies House, HMRC or anyone else, and nothing you build on it should claim otherwise. The output is checked numbers to hand to a filing product or an accountant. It is not accounting, tax or legal advice.\n\nTools that write need a bearer token from https://ducktax.com/docs/mcp. Everything else works anonymously under daily quotas; server_status shows what is configured and what remains.",
      "tools": [
        {
          "name": "categorise_transactions",
          "description": "Categorise bank-statement transaction descriptions into the fixed vocabulary this product maps to balance sheet lines (sales, software, owner-in, …). Send description strings only, never amounts or dates. Sum the amounts per returned category yourself, then call totals_to_figures. One statement import is one quota unit; previously seen descriptions are answered from a shared cache free.",
