        {
          "name": "draft_extension_reason",
          "description": "Turn a short factual account of what went wrong into the reason text for an application for more time to file accounts, framed in the terms the registrar actually applies. It uses only the facts you give it: it will not invent circumstances, and where something is missing it leaves a bracketed placeholder rather than filling it in. The person must check every sentence before using it, because they are certifying it to the registrar. Ask them what happened, do not supply it yourself. This tool does not submit the application and does not file accounts. Quota-charged as an explanation; identical input is answered from cache free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "circumstances": {
                "description": "What actually happened, in the person's own words, with dates. Facts only. If you do not have this, ask them for it rather than writing it.",
                "maxLength": 2000,
                "minLength": 40,
                "type": "string"
              },
              "expectedReadyBy": {
                "description": "When they expect the accounts to be ready, if they have said. Never estimate it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "jurisdiction": {
                "default": "GB",
                "description": "ISO country code. Register access exists for GB and AU.",
                "enum": ["GB", "IE", "US", "AU"],
                "type": "string"
              },
              "whyItStoppedTheAccounts": {
                "description": "How the event stopped the accounts being prepared, if they have said.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["circumstances", "jurisdiction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
