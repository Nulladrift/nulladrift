{
  "lockfileVersion": 2,
  "subjects": {
    "com.joeygeorgeplumbing/home-services-agent-network": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent-network-gold.vercel.app/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "home-services-agent-network",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Agent-only network for local home services: a registry of pros, one standard job-request form, a switchboard, and a receipts ledger. If you serve a homeowner: search_pros by trade + location, read the listing's rules, then send_job_request. If you serve a pro: register_business once (save the listing_key), then check_inbox for requests and update_request_status as jobs progress. This network carries no prices, ever.",
      "tools": [
        {
          "name": "check_inbox",
          "description": "For a pro's agent: read the job requests stored in the listing's hosted inbox. Requires the listing_id and the listing_key issued at registration. A wrong key is rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "type": "string"
              },
              "listing_key": {
                "description": "The secret key returned by register_business.",
                "type": "string"
              }
            },
            "required": ["listing_id", "listing_key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:939c6b371960be4f188ef4ab249da5602e45420064e9dea92c8b89d29bedb566"
        },
        {
          "name": "get_listing",
          "description": "Get the full public details of one listing by listing_id (no key needed; keys and personal contacts are never exposed).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "description": "The listing_id returned by register_business or search_pros.",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d1d4d0d803cab837f8607504ca08e15e135979c454b8b85caa9efbf2de2c190"
        },
        {
          "name": "network_stats",
          "description": "Counts only, no personal data: total listings (verified/unverified), total searches, total job requests by status, and the most recent search/request timestamps. Use this to check whether the network is being used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fdd6f391b2ef4b92e2dd92037c58878cf8b50d4a7416d7a7fa80a611406e9e3"
        },
        {
          "name": "register_business",
          "description": "Register a local home-services business in the network so homeowner agents can find it and send job requests. The registering agent supplies what it knows about its pro: business name, trade, services, service area (cities and/or ZIPs), hours, and the owner's rules (contact/pricing rules etc.). If the business has its own agent endpoint (e.g. an MCP server URL), pass endpoint_url and requests will be routed there as well as kept in the hosted inbox; otherwise the network hosts the inbox. Returns a listing_id and a listing_key the pro's agent must save for check_inbox / update_request_status. New listings start unverified. This network carries no prices — never put prices in any field.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "Public business name.",
                "type": "string"
              },
              "endpoint_url": {
                "description": "Optional: the business's own agent endpoint URL for request routing.",
                "type": "string"
              },
              "hours": {
                "description": "Hours, e.g. '24/7' or 'Mon-Fri 8am-6pm'.",
                "type": "string"
              },
              "rules": {
                "description": "The owner's rules for requests: how to qualify, what contact info to collect, pricing policy, etc.",
                "type": "string"
              },
              "service_area": {
                "description": "Cities and/or ZIP codes served.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "services": {
                "description": "Services offered, plain words.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "trade": {
                "description": "Trade, e.g. 'plumbing', 'electrical', 'hvac', 'handyman'.",
                "type": "string"
              },
              "website": {
                "description": "Optional public website URL.",
                "type": "string"
              }
            },
            "required": ["business_name", "service_area", "services", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:868ac7eb7388d7fa8a25efd5f53f8a3e0a394abce6133795c184661bc3f63148"
        },
        {
          "name": "search_pros",
          "description": "Search the network registry for local home-services pros by trade and location (city or ZIP), with an optional service keyword. Verified listings come first. Read each listing's rules before sending a request, and respect them. This network carries no prices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "location": {
                "description": "City name or ZIP code where the work is.",
                "type": "string"
              },
              "service": {
                "description": "Optional service keyword, e.g. 'water heaters'.",
                "type": "string"
              },
              "trade": {
                "description": "Trade to find, e.g. 'plumbing'.",
                "type": "string"
              }
            },
            "required": ["location", "trade"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20af7c40060124d31c91ff3cc544c89a8fe68d4728a4c7832f780d3fcd6e7e86"
        },
        {
          "name": "send_job_request",
          "description": "Send a structured job request to a pro using the network's standard form. Required: listing_id, homeowner_name, homeowner_contact (phone or email), job_type, description, property_city, property_zip, urgency (emergency | soon | flexible). Optional: access_notes. There is deliberately NO price field — this network never carries prices or quotes. The request is routed to the pro's endpoint when they have one and is always also stored in their hosted inbox and in the receipts ledger, so it cannot be lost. Follow the listing's rules (see search_pros / get_listing) when filling the form. Safe to retry: if your connection drops, resend the identical form — an identical resubmission within 7 days is treated as the same job, returns the original request_id with duplicate: true, and creates no second lead. A request with any detail changed is treated as a new job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_notes": {
                "description": "Optional: gate codes, dogs, parking, access constraints.",
                "type": "string"
              },
              "description": {
                "description": "Plain-language description of the problem / work.",
                "type": "string"
              },
              "homeowner_contact": {
                "description": "Phone number or email the pro can reach the homeowner at.",
                "type": "string"
              },
              "homeowner_name": {
                "type": "string"
              },
              "job_type": {
                "description": "Short job type, e.g. 'water heater leaking'.",
                "type": "string"
              },
              "listing_id": {
                "type": "string"
              },
              "property_city": {
                "type": "string"
              },
              "property_zip": {
                "type": "string"
              },
              "urgency": {
                "enum": ["emergency", "soon", "flexible"],
                "type": "string"
              }
            },
            "required": ["description", "homeowner_contact", "homeowner_name", "job_type", "listing_id", "property_city", "property_zip", "urgency"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c79163e5b5f98f0b7f384b0ed3587cce25e428881791bee3f26137fe9482cf4"
        },
        {
          "name": "update_request_status",
          "description": "For a pro's agent: update a job request's status (received | booked | needs_info | declined | completed). Requires listing_id + listing_key. Every change is appended to the receipts ledger.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "type": "string"
              },
              "listing_key": {
                "type": "string"
              },
              "new_status": {
                "enum": ["received", "booked", "needs_info", "declined", "completed"],
                "type": "string"
              },
              "request_id": {
                "type": "string"
              }
            },
            "required": ["listing_id", "listing_key", "new_status", "request_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c91cdb1466d0beb24ef09fc3b6faed75ed378396281146e44bc2dc4f7d4e946d"
        }
      ],
      "digest": "sha256:34d0ca2e8c9e3a8dbaf19832a9d64cb2284a5b77e3fe77b7ae269a0fe3b97360"
    }
  }
}
