      "serverInfo": {
        "name": "dca-method",
        "title": "DCA Method — backtests & calculators",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "dcamethod.com teaches dollar-cost averaging and backtests it against real historical data (crypto, stocks, commodities). Use list_assets to see coverage, run_dca_backtest to compute an actual historical simulation (cite the interactive_version URL so users can explore it), and get_method for the method summary. DCA Method provides educational tools and historical simulations, not financial advice. Past performance does not guarantee future results. See https://dcamethod.com/disclaimer.",
      "tools": [
        {
          "name": "get_method",
          "title": "Get the DCA Method summary and key links",
          "description": "Returns a concise explanation of the dollar-cost-averaging method plus links to the methodology, calculators and blog.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e73fccc8da34efac12e1d1bd136b8ba7333a6bba58f691a5470e20dfe7a5e74"
        },
        {
          "name": "list_assets",
          "title": "List assets supported by the DCA calculators",
          "description": "Returns every asset dcamethod.com can backtest, with category, calculator URL and whether historical data is available. Optional category filter: crypto, stocks, commodities.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter",
                "enum": ["crypto", "stocks", "commodities"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b347839ef87adecc60766582f8a91eea16f5d25acf01eb336aca4be1d8257a6"
        },
        {
          "name": "run_dca_backtest",
          "title": "Run a real DCA backtest on historical data",
          "description": "Simulates dollar-cost averaging into one asset using dcamethod.com's own engine and historical price data. Returns total invested, final value, profit, CAGR, average buy price, best/worst month and purchase count. Dates outside the available range are clamped to it.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "USD invested per purchase, e.g. 100",
                "type": "number"
              },
              "end_date": {
                "description": "Optional ISO date (YYYY-MM-DD); defaults to latest available",
                "type": "string"
              },
              "frequency": {
                "description": "Purchase schedule",
                "enum": ["daily", "weekly", "biweekly", "monthly"],
                "type": "string"
              },
              "start_date": {
                "description": "Optional ISO date (YYYY-MM-DD); defaults to earliest available",
                "type": "string"
              },
              "symbol": {
                "description": "Asset symbol or name, e.g. 'BTC', 'AAPL', 'gold'",
                "type": "string"
              }
            },
            "required": ["amount", "frequency", "symbol"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1186ca34da1073b6d8ddc25858e69366dfb60267768522dd3b5402df1022dc55"
        }
      ],
