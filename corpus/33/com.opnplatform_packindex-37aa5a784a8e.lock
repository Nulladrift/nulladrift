          "title": "Compare a material across regions",
          "description": "One material across regions — e.g. PP in Europe, US, China and the Middle East — in USD with spreads vs a reference region; add freight per unit and duty % to compare landed costs. Professional plan and above.",
          "inputSchema": {
            "properties": {
              "codes": {
