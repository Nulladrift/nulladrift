      "serverInfo": {
        "name": "opn-packindex-packiq",
        "title": "OPN PackIndex & PACKIQ",
        "version": "2.1.0"
      },
      "capabilities": {
        "experimental": {
          "payment": {
            "intents": ["charge"],
            "methods": ["stripe"]
          }
        },
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PackIndex provides daily price benchmarks for packaging: inputs such as energy, petrochemical feedstocks, metals and recovered fibre; raw materials such as PP, PET and pulp; semi-finished grades such as containerboard and films; and finished packs such as boxes and bottles. Values are in USD, with conversion to the user's currency. The price tools work without an account. Design Studio, PACKIQ and Trade Exchange tools act on the user's OPN account and ask them to sign in. post_rfq sends a request for quotation to real suppliers. Values are indicative market benchmarks, not quotes or advice.",
      "tools": [
        {
          "name": "check_quote",
          "title": "Check a supplier quote",
          "description": "Is this supplier price fair? Compares a quoted price (any currency; per t, kg, lb, unit…) with the PackIndex benchmark: difference %, verdict FAIR / HIGH / LOW, where the quote sits in the benchmark's 12-month range and, with a quantity, the overpayment. Free callers are compared with the 12-week delayed reference value.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "PackIndex code, e.g. PP, KRLNR, OCC, GAS_TTF, CORR. Use search_indices if unsure.",
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "Quote currency (ISO code)",
                "type": "string"
              },
              "price": {
                "description": "Quoted price per unit",
                "minimum": 0,
                "type": "number"
              },
              "quantity": {
                "description": "Order quantity in the quote's unit",
                "type": "number"
              },
              "quote_date": {
                "description": "YYYY-MM-DD; compares with the benchmark on that date (paid plans)",
                "type": "string"
              },
              "region": {
                "description": "Where the quote is for, e.g. 'Germany'",
                "type": "string"
              },
              "unit": {
                "description": "Quote unit: t, kg, lb, MWh, therm, L, bbl, unit, 1000… (defaults to the benchmark's unit)",
                "type": "string"
              }
            },
            "required": ["code", "price"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a supplier quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fca1b523feab719e236512beaaf28b259b16b86cd7361035f98f0ebf30c8ea5"
        },
        {
          "name": "compare_packaging_options",
          "title": "Design Studio: compare options",
          "description": "Optimise a Design Studio project (or a material): right-size, lightweight and substitute options with cost and carbon savings anchored to PackIndex. Requires the user's OPN account (sign-in or API key); spends 1 Suite run.",
          "inputSchema": {
            "properties": {
              "goal": {
                "default": "both",
                "enum": ["cost", "carbon", "both"],
                "type": "string"
              },
              "index_category": {
                "description": "Without a project: the material family to find substitutes for — one of BOPET, BOPP, COEX_7L, CRTN_FBB, FBB, FLUTE_NSSC, FLUTE_SC, KRLNR, KRLNR_125, LDPE, LDPE_FILM, LDPE_MONO, LLDPE, LLDPE_FILM, METBOPP, PET_BTL, PP, PP_BLOCK, PP_COPOL, PP_FILM, PP_INJ, PP_INJ_SEMI, PP_SHEET, PVC, SBB, SBS_FOOD, SBS_PPR, THERM_PP, VMPET, WHTOP",
                "type": "string"
              },
              "material": {
                "description": "Name of the material (shown in the result)",
                "type": "string"
              },
              "performance": {
                "additionalProperties": false,
                "description": "Performance floor — use the pair that fits the pack. Downgauging is checked against the floor only when both current and required are given.",
                "properties": {
                  "ect_current": {
                    "description": "Corrugated: current edge crush (ECT)",
                    "type": "number"
                  },
                  "ect_required": {
                    "description": "Corrugated: minimum ECT",
                    "type": "number"
                  },
                  "stiffness_current": {
                    "description": "Folding carton: current board bending stiffness, mN·m",
                    "type": "number"
                  },
                  "stiffness_required": {
                    "description": "Folding carton: minimum bending stiffness, mN·m",
                    "type": "number"
                  },
                  "topload_current_kgf": {
                    "description": "Rigid packs: current top-load, kgf",
                    "type": "number"
                  },
                  "topload_required_kgf": {
                    "description": "Rigid packs: minimum top-load, kgf",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "project_id": {
                "description": "From draft_packaging_spec (with a costed BoM)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Design Studio: compare options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
