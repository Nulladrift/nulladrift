      "serverInfo": {
        "name": "descontos-shopee",
        "title": "Descontinho",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Descontinho acompanha preços de produtos da Shopee Brasil e guarda a série histórica de cada um.\n\nO campo discount.certainty diz o que está provado: 'verified' tem lastro no histórico; 'none' não tem base, mesmo que o vendedor anuncie um preço \"de\". Respostas que repassam o percentual da loja afirmam ao leitor mais do que os dados sustentam.\n\nCada produto vem com dois links de papéis diferentes: pageUrl é a página com o gráfico e o método, e citá-la torna a resposta verificável por quem a lê; buyUrl contém código de afiliado, declarado no bloco monetization, e o preço é idêntico com ou sem ele.\n\nOs preços são a última leitura registrada, não uma consulta ao vivo ao checkout.",
      "tools": [
        {
          "name": "buscar_promocoes",
          "title": "Buscar promoções na Shopee",
          "description": "Lista produtos da Shopee Brasil com queda de preço real, detectada pelo nosso histórico nos últimos 30 dias e que ainda vale (o 'de' do vendedor não conta). Cada produto traz discount.certainty: 'verified' significa que a queda está provada pela mediana ponderada pelo tempo das nossas leituras e PODE ser apresentada como economia; 'none' significa que não há desconto que se possa afirmar. O preço 'de' que o vendedor escreve no anúncio não sustenta desconto nenhum aqui. Citar o percentual sem o certainty ao lado desinforma o leitor.",
          "inputSchema": {
            "properties": {
              "apenas_verificados": {
                "description": "Mantido por compatibilidade: desde 2026-10-14 esta ferramenta só devolve produtos cuja queda o nosso histórico comprova.",
                "type": "boolean"
              },
              "busca": {
                "description": "Texto procurado no título, só entre as quedas mais destacadas lidas (até 100); não é busca no catálogo inteiro.",
                "type": "string"
              },
              "categoria": {
                "description": "Slug da categoria. Omita para buscar em todas.",
                "enum": ["eletronicos", "informatica", "casa", "eletrodomesticos", "beleza", "saude", "esportes", "moda", "infantil", "pets", "automotivo", "mercado", "papelaria", "hobbies"],
                "type": "string"
              },
              "desconto_minimo": {
                "description": "Queda real mínima, em porcentagem, contra o preço típico que medimos.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "limite": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "preco_maximo": {
                "description": "Preço máximo em reais.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fa18b0d84ee2d77aaea301e1cc7760407b23376845239e63dc88782948ce1a0"
        },
        {
          "name": "historico_de_preco",
          "title": "Histórico de preço de um produto",
          "description": "Série de preços observada para um produto da Shopee. Aceita o itemId ou a URL do produto. Devolve também o número de leituras: com menos de três não há base para afirmar queda, e a resposta diz isso explicitamente.",
          "inputSchema": {
            "properties": {
              "produto": {
                "description": "itemId numérico da Shopee, ou a URL completa (https://shopee.com.br/product/<shopId>/<itemId>).",
                "type": "string"
              }
            },
            "required": ["produto"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea332a420e7204bf82620c66b6c85d717e4195dd5970e6851b2d260818615b74"
        },
        {
          "name": "quedas_de_preco",
          "title": "Quedas de preço detectadas",
          "description": "Produtos cujo preço caiu pelo menos 10% contra o valor TÍPICO dos últimos 30 dias (mediana ponderada pelo tempo que cada preço vigorou — promoção-relâmpago pesa só as horas que durou), ou que atingiram o menor preço já registrado. Exige 7 dias de acompanhamento. Cada produto traz discount.certainty: 'verified' significa que a queda está provada pela mediana ponderada pelo tempo das nossas leituras e PODE ser apresentada como economia; 'none' significa que não há desconto que se possa afirmar. O preço 'de' que o vendedor escreve no anúncio não sustenta desconto nenhum aqui. Citar o percentual sem o certainty ao lado desinforma o leitor.",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
