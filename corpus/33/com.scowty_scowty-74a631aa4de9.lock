{
  "lockfileVersion": 2,
  "subjects": {
    "com.scowty/scowty": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scowty.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "scowty",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Scowty builds websites and brands for small service businesses. Use start_website_preview when someone wants a website; it takes two to three minutes, so call check_website_preview afterwards and show the person the preview link and the 'Keep this site' link. Use check_ai_visibility for 'does AI recommend my business'. Nothing is bought here; pricing links go to scowty.com. Previews are limited to 20 a day and visibility checks to 20 a day across all assistants; a tool says so when the day's limit is reached.",
      "tools": [
        {
          "name": "check_ai_visibility",
          "title": "Check a website's AI-search visibility",
          "description": "Audits an existing website's homepage and returns a health score, how often AI search engines cite the business in test questions, and the two highest-impact fixes. Takes up to a minute. Input is the website address.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "website": {
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a website's AI-search visibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5cd7145bc8fbc17a80b199e59747ff9f714770c948fcac0123b420e0d42f6c3b"
        },
        {
          "name": "check_website_preview",
          "title": "Check a website preview",
          "description": "Returns the status of a preview started with start_website_preview. When the build is done, returns the preview link and the link that saves the site to the person's own Scowty account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "jobId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a website preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e938cedc2b08bd2c26f5754a3f2150b797f59f0ccc237d2f326311778e7867f3"
        },
        {
          "name": "get_plans_and_pricing",
          "title": "Scowty plans and pricing",
          "description": "Returns Scowty's current products and prices with a link to the pricing page. Read-only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scowty plans and pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f52cee9dfcd4b475e9a5f1fa4fee9551b662f3bb2e09f61ca9eb5d38ca6a31e6"
        },
        {
          "name": "start_website_preview",
          "title": "Start a free website preview",
          "description": "Starts building a preview website for a small service business from its name, business type, city and up to three main services. Returns a job id immediately; the build takes two to three minutes, so call check_website_preview with the job id about a minute later.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "businessName": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "businessType": {
                "enum": ["lawyer", "dentist", "accountant", "contractor", "agency", "therapist", "real_estate", "consultant", "online_store", "photographer", "student", "beauty", "spa", "massage", "healthcare_other", "legal_other", "financial_other", "services_other"],
                "type": "string"
              },
              "city": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "industry": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "services": {
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "state": {
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["businessName", "businessType", "city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a free website preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ce04d65047e9520d1dfbeeb3f0ec4d9eecb348a33c45637cc13884eef11b7e6c"
        }
      ],
      "digest": "sha256:49919696a66fabdd3fd4e540f4629462dd9bdbc19a633df0ce9e81e4b9582ecf"
    }
  }
}
