                },
                "maxItems": 10,
                "type": "array"
              },
              "date_from": {
                "description": "Check-in date, YYYY-MM-DD, today or later. Pass together with date_to; without dates prices are the lowest upcoming 'from' prices and availability is not checked.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Check-out date, YYYY-MM-DD, after date_from (at most 60 nights).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "filters": {
                "description": "Slowhop's own filter ids. Alternatives of one kind match ANY — settings, types, who-for, accepted pets, the wellness facilities sauna/wooden_bath/pool/jacuzzi/bathtube/massages — while different kinds must ALL match (['lake', 'sauna'] = by a lake AND with a sauna; ['sauna', 'jacuzzi'] = either): the site's own logic. Setting: lake, sea, mountain, forest, countryside, shoreline, river, city. Type: agro_guesthouse (agritourism, guesthouse), cottages (houses incl. tiny houses), tiny_house, camping (glamping/camping), hotels, city_apartments, hostels, campers, yachts. Who for: children_loving, couples, without_neighbors, adults (adults and teens only), rarities, unique_view, good_design, modern_architecture, idyllic, historical_places, fixer_upper, pet-free, lots_of_animals, single, disability, celebrations, workshops_and_conferences. Food: breakfast, meals (meals on site), restaurant, kitchen_available, vegetarian, vegan, special_diets. Pets: small_dogs, medium_dogs, big_dogs, cats, fenced_area, leash_free. Wellness: sauna, wooden_bath (outdoor hot tub, 'balia'), pool, jacuzzi, bathtube, massages, fireplace. Active: forest-trails, trail (mountain trail), skiing-slope, running-ski (cross-country skiing), horseriding, kayaks, fishing, bikes_onsite. Other: solo / groups (workation), fast_internet, no_internet, electric-car-charger, kids-playground.",
                "items": {
                  "enum": ["lake", "sea", "mountain", "forest", "countryside", "shoreline", "river", "city", "agro_guesthouse", "cottages", "tiny_house", "camping", "hotels", "city_apartments", "hostels", "campers", "yachts", "children_loving", "couples", "without_neighbors", "adults", "fixer_upper", "rarities", "unique_view", "modern_architecture", "good_design", "idyllic", "historical_places", "pet-free", "lots_of_animals", "single", "disability", "celebrations", "workshops_and_conferences", "breakfast", "meals", "restaurant", "kitchen_available", "vegetarian", "vegan", "special_diets", "small_dogs", "medium_dogs", "big_dogs", "cats", "fenced_area", "leash_free", "sauna", "wooden_bath", "pool", "jacuzzi", "bathtube", "massages", "fireplace", "forest-trails", "trail", "skiing-slope", "running-ski", "horseriding", "kayaks", "fishing", "bikes_onsite", "solo", "groups", "fast_internet", "no_internet", "electric-car-charger", "kids-playground"],
                  "type": "string"
