      "serverInfo": {
        "name": "Slowhop",
        "title": "Slowhop MCP",
        "version": "1.0.0",
        "description": "Slow stays on Slowhop.com, mostly in Poland: cabins, agritourism, glamping, guesthouses, PLN prices.",
        "websiteUrl": "https://mcps.wondel.ai/servers/slowhop/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
