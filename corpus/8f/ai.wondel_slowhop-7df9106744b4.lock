              "place": {
                "description": "Where, resolved by Slowhop's own autocomplete: a region ('Mazury', 'Bieszczady', 'Kaszuby', 'Tatry', 'Roztocze', 'Toskania'), a town ('Zakopane', 'Kazimierz Dolny' — searched within radius_km), a country ('Chorwacja', 'Włochy'), or a landscape word ('góry', 'morze', 'jezioro', 'las', 'wieś' → Poland with that setting filter). Polish names work best. Omit to search everywhere.",
                "minLength": 1,
                "type": "string"
              },
              "price_max": {
