{
  "lockfileVersion": 2,
  "subjects": {
    "app.tidetrade/tidetrade": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tidetrade.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tidetrade",
        "title": "TideTrade",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "TideTrade reports the mechanical state of one published trend rule, Supertrend(10, 3), on 140 crypto assets, read on completed daily and weekly candles, with every flip on a public ledger. Use snapshot for today's market (breadth, every asset's state and room to its line, the day's flips), asset for one coin (state, record, flips), report for a Sunday Tide Report, rule for the published rule; search and fetch are the generic pair. A state is where the last completed close sits against the line: tide in (above by more than half an ATR), slack water (within half an ATR), tide out (below). Nothing here forecasts anything; quote states with their candle date. Decision support, not financial advice. Indices and commodities are an alpha and not for decisions.",
      "tools": [
        {
          "name": "asset",
          "title": "One asset",
          "description": "One asset by id, symbol or name (btc, BTC, Bitcoin): its state on the last completed daily and weekly candle, the room to its line, the record of every daily trip since its replay (trips, losing share, average win and loss, best, worst, the rule against holding) and its most recent flips, with the page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Asset id, symbol or name, e.g. btc, ETH, Solana.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c301fd12f355eee0ba8c2f346ca85360ffce2519a7dffc495eba4657ea48e91c"
        },
        {
          "name": "fetch",
          "title": "Fetch a document",
          "description": "Fetch one document by id from search: snapshot (today's market, daily), snapshot:W (weekly), asset:<id>, report:<week> or report:latest, rule, page:<path>.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:460e7e7f629faddae1714246f860b359b05759e29bee17749942228dbea4cfcb"
        },
        {
          "name": "report",
          "title": "Sunday Tide Report",
          "description": "One Sunday Tide Report from the public archive (every ISO week since 2025-W01): how many of the 140 crypto assets were tide in, slack or out on the candles completed by that Sunday, the Core 30, the week's flips, the leaders, the assets in slack water and the ledger hash of the day. The latest report without a week.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "week": {
                "description": "ISO week, e.g. 2026-W43. Omit for the latest.",
                "pattern": "^\\d{4}-W\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3d73b36e6621e760a3a0aede7468db21752fa9ac25ce821889756d7fad82b39"
        },
        {
          "name": "rule",
          "title": "The published rule",
          "description": "The rule manifest behind every state and flip: Supertrend parameters, ATR method, candle definitions, data sources per asset class, the schedule, record types, the changelog and the manifest hash.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cadc2b613e716d52a2caec4e5ace7c07ac11d48b36772265e0905b8960dd9fa"
        },
        {
          "name": "search",
          "title": "Search TideTrade",
          "description": "Search assets, reports and pages. Returns ids for fetch: snapshot, snapshot:W, asset:<id>, report:<week>, rule, page:<path>.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Free text: a coin name or symbol, a week like 2026-W43, or a topic such as breadth, rule, trend trading.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16ad58f7f905c3b8cf39216523c936a4aeb936c11086f9442ed5bcf0cfc19fd6"
        },
        {
          "name": "snapshot",
          "title": "Market snapshot",
          "description": "Today's tide on every asset under the rule: crypto breadth and the Core 30 by state (tide in, slack water, tide out), the flips on the newest completed candle, the current Sunday Tide Report, and one row per asset with band, direction, close, the Tideline, distance from it in ATR and percent, candle date and last flip. Filter by band, tier or class; daily by default, weekly with timeframe W. Cached a minute; the rows change a few times a day after each candle completes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "band": {
                "description": "Only assets in this state: IN (tide in), SLACK (slack water) or OUT (tide out).",
                "enum": ["IN", "SLACK", "OUT"],
                "type": "string"
              },
              "class": {
                "default": "crypto",
                "description": "crypto by default; index and commodity are an alpha and not for decisions.",
                "enum": ["crypto", "index", "commodity", "all"],
                "type": "string"
              },
              "limit": {
                "default": 300,
                "description": "At most this many asset rows.",
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "tier": {
                "description": "core: the 30 most liquid crypto assets; extended: the other 110.",
                "enum": ["core", "extended"],
                "type": "string"
              },
              "timeframe": {
                "default": "D",
                "description": "D for daily candles (default), W for weekly.",
                "enum": ["D", "W"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cbaa64d408ecb3f08c395d6d344f4fd12289f8df6e4f16a38df3d4b489286e5"
        }
      ],
      "digest": "sha256:e9a45e28e17de39577889b42d2553b5d8bb45c27278e48faa1cf8a7eadd63bcc"
    }
  }
