{
  "lockfileVersion": 2,
  "subjects": {
    "com.lstuvi/tuvi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lstuvi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lstuvi",
        "title": "LsTuvi - Tử Vi & Lịch âm",
        "version": "1.0.0",
        "websiteUrl": "https://lstuvi.com",
        "icons": [
          {
            "src": "https://lstuvi.com/brand/app-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://lstuvi.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vietnamese Tử Vi (Purple Star astrology) and lunar calendar tools from lstuvi.com. Charts and day judgements are computed by fixed traditional rules, not AI. Dates are Gregorian unless a tool says lunar; times are Vietnam local time (UTC+7). Results are in Vietnamese and are cultural reference, not advice. Each result has a `more` link to the matching page on lstuvi.com, where the user can see the full chart and the paid detailed readings.",
      "tools": [
        {
          "name": "check_age_compatibility",
          "title": "Check age compatibility",
          "description": "Compares two people by birth year and gender using Vietnamese age-matching (nạp âm element, heavenly stem, earthly branch, Bát Trạch cung phi, zodiac animal) and returns a score out of 100 with each factor explained.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "person1": {
                "properties": {
                  "birth_year": {
                    "maximum": 2100,
                    "minimum": 1920,
                    "type": "integer"
                  },
                  "gender": {
                    "description": "\"nam\" = male, \"nu\" = female",
                    "enum": ["nam", "nu"],
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["birth_year", "gender"],
                "type": "object"
              },
              "person2": {
                "properties": {
                  "birth_year": {
                    "maximum": 2100,
                    "minimum": 1920,
                    "type": "integer"
                  },
                  "gender": {
                    "description": "\"nam\" = male, \"nu\" = female",
                    "enum": ["nam", "nu"],
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["birth_year", "gender"],
                "type": "object"
              }
            },
            "required": ["person1", "person2"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check age compatibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb4184eccd5c784ebe3acdd2c349c478f9d550f91a062aafb8cd1980b0b0f04a"
        },
        {
          "name": "convert_lunar_solar",
          "title": "Convert lunar and solar dates",
          "description": "Converts a date between the Gregorian calendar and the Vietnamese lunar calendar (with leap months, 1900–2100), and gives the can chi of the day, month and year plus the solar term.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD; for lunar_to_solar this is the lunar year, month and day",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "direction": {
                "enum": ["solar_to_lunar", "lunar_to_solar"],
                "type": "string"
              },
              "leap_month": {
                "description": "lunar_to_solar only: true if the lunar month is a leap month",
                "type": "boolean"
              }
            },
            "required": ["date", "direction"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert lunar and solar dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:839f3ef8388427eb647b9b4f77c0e227bc513aec64f4fbe52150b9bed418120d"
        },
        {
          "name": "create_tuvi_chart",
          "title": "Create Tử Vi chart",
          "description": "Builds a Vietnamese Tử Vi Đẩu Số (Purple Star) birth chart from Gregorian birth date, birth time and gender: lunar date, can chi, nạp âm, cục, the 12 palaces with their stars, and a short rule-based reading of each palace. Use when the user wants their Tử Vi chart or asks what their chart says.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth_date": {
                "description": "Gregorian birth date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth_time": {
                "description": "Local clock time of birth in Vietnam time, HH:MM 24-hour. Use 12:00 if unknown and say so.",
                "pattern": "^([01]?\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "gender": {
                "description": "\"nam\" = male, \"nu\" = female",
                "enum": ["nam", "nu"],
                "type": "string"
              },
              "name": {
                "maxLength": 60,
                "type": "string"
              },
              "view_year": {
                "description": "Gregorian year to read the yearly luck for; default is the current year",
                "maximum": 2200,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["birth_date", "birth_time", "gender"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create Tử Vi chart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2f56bfa833708948696fe65ee5c6c0f6c4ecddb14137265396aadddff1ec05f"
        },
        {
          "name": "find_compatible_birth_years",
          "title": "Find compatible birth years",
          "description": "For one person's birth year and gender, scores every partner birth year within a range by the same Vietnamese age-matching rules and returns the best and worst matching years.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth_year": {
                "maximum": 2100,
                "minimum": 1920,
                "type": "integer"
              },
              "gender": {
                "description": "\"nam\" = male, \"nu\" = female",
                "enum": ["nam", "nu"],
                "type": "string"
              },
              "partner_gender": {
                "description": "default: the opposite gender",
                "enum": ["nam", "nu"],
                "type": "string"
              },
              "range": {
                "description": "years around the birth year to scan, default 10",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["birth_year", "gender"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find compatible birth years"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c048e976d5aecbbed3c26e2ebb4e19f74d09678204062aed0c9efd6dd616684"
        },
        {
          "name": "find_good_days",
          "title": "Find good days in a month",
          "description": "Ranks the days of one Gregorian month for an activity (wedding, opening a shop, moving house, signing a contract, travel…) by Vietnamese day-selection rules, optionally checked against the birth years of the people involved. Returns the best days with reasons and good hours, and the days to avoid.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activity": {
                "description": "Activity: viec-chung = Việc chung; cuoi-hoi = Cưới hỏi; an-hoi = Ăn hỏi; khai-truong = Khai trương; nhap-trach = Nhập trạch, chuyển nhà; dong-tho = Động thổ; lam-nha = Làm nhà, sửa nhà; mua-xe = Mua xe; ky-hop-dong = Ký hợp đồng; xuat-hanh = Xuất hành",
                "enum": ["viec-chung", "cuoi-hoi", "an-hoi", "khai-truong", "nhap-trach", "dong-tho", "lam-nha", "mua-xe", "ky-hop-dong", "xuat-hanh"],
                "type": "string"
              },
              "birth_year": {
                "description": "Birth year of the person doing it (for weddings: the bride)",
                "maximum": 2100,
                "minimum": 1920,
                "type": "integer"
              },
              "month": {
                "description": "Gregorian month",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "partner_birth_year": {
                "description": "Weddings and engagements only: birth year of the groom",
                "maximum": 2100,
                "minimum": 1920,
                "type": "integer"
              },
              "year": {
                "description": "Gregorian year",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["activity", "month", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find good days in a month"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed2477de9adc9a9eab832b3d3e1eea4b5b29f8b5b96a8626f2a43921bcd018ba"
        },
        {
          "name": "get_2027_forecast_by_birth_year",
          "title": "Get 2027 outlook by birth year",
          "description": "Returns the traditional facts for a birth year in the lunar year 2027 (Đinh Mùi): age, relation of the birth branch and stem with the year, element relation, Tam Tai, Kim Lâu, and the yearly palace for men and women.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "birth_year": {
                "description": "Gregorian birth year (the person's lunar year of birth)",
                "maximum": 2100,
                "minimum": 1920,
                "type": "integer"
              }
            },
            "required": ["birth_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get 2027 outlook by birth year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b7311c94c403aa0b3df6137cf2a83e50c5a1765d1c96114cb40fdd614e77903"
        },
        {
          "name": "get_article",
          "title": "Read an lstuvi article",
          "description": "Returns the summary of one lstuvi.com article by slug (from search_articles): the short answer, key points and FAQ, or the opening of the article.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "pattern": "^[a-z0-9-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an lstuvi article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb8904fe38e11484956fa4200928146725586ec63d611cd5b4859ac9c85c1e69"
        },
        {
          "name": "get_lunar_day",
          "title": "Get lunar calendar day",
          "description": "Returns the Vietnamese lunar calendar entry for one Gregorian date (default today): lunar date, can chi, hoàng đạo or hắc đạo day, trực, lunar mansion, ages that clash with the day, taboo days and the auspicious hours.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Gregorian date YYYY-MM-DD; default is today in Vietnam",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get lunar calendar day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2895b1e6e28ca34d4fcc40abb683e669e420d239c6967bf981fcbc4e42f0377a"
        },
        {
          "name": "get_pricing",
          "title": "Get lstuvi prices",
          "description": "Returns which lstuvi.com features are free and the current prices of the paid ones: detailed chart reading, couple reading, Tử Vi chat packages and coin top-up packages.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get lstuvi prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68ae171960518da2fd13e7fc4c4df04a5e28a47e088a9fc19e336aaeba87a713"
        },
        {
          "name": "search_articles",
          "title": "Search lstuvi articles",
          "description": "Searches the Vietnamese articles published on lstuvi.com about Tử Vi, palaces, stars, the lunar calendar and yearly outlooks. Returns titles, slugs and short descriptions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Vietnamese or unaccented keywords; empty lists the newest articles",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search lstuvi articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:256e53b90356d4e75f7dd1521dd859d1a3bc92f09f3af82564b7c2cde5036ade"
        }
      ],
      "digest": "sha256:61a3ccd14cdffe37b1977d9121c4bd893a3e87199e67b5e39a4e0ace0adeabaa"
    }
  }
}
