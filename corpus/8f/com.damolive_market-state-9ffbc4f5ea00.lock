      "instructions": "DAMO: A fixed, versioned definition of market state: recorded at the time, never recomputed, verifiable by anyone. It gives the market state of an asset on 10 fixed timeframes (1m 5m 15m 1h 4h 12h 1d 3d 1w 1M) using 4 permanent states: 1 bull_momentum, 2 weakening, 3 bear_momentum, 4 recovery. Deterministic and rule-based, not machine learning. Two layers: layer='verified' = closed candles, recorded once and never changed; layer='live' = forming candles, provisional until the candle closes, never recorded. VERIFIED states are written once into an append-only hash chain; each UTC day gets an attestation anchored on Base mainnet (contract 0x67FeC2A19B3e3eb26d80Ad87D19e33dfc39F5766). Each VERIFIED value carries its seq and hash, so an answer that cites it can be checked later against the anchored daily attestation. What does not change: the 4 state codes and 10 timeframes are permanent; any engine change is released as a new engine version (engine_version is in every VERIFIED value); recorded states are never recomputed. Not provided: prices or candles, order book, funding rates, intrabar events, forecasts or trading signals, bulk historical exports (the full recorded history is not offered as a download). Each full state response includes a 'citation' line (DAMO VERIFIED or DAMO LIVE, symbol, time), a 'source_url' and 'quota' (compact: a short citation and 'quota_remaining'). Free tier: no key, 500 state values per client per UTC day (1 state value = 1 symbol x 1 timeframe). Optional timeframes selection (e.g. timeframes=15m,1h): only those are returned and counted; the vector keeps its 10 positions, others are null with status not_requested. Case-sensitive: 1m = minute, 1M = month. Optional format=compact returns only symbol, layer, time, the 10-value vector, a short citation line and the remaining quota, plus stale: true when the data is old (no per-timeframe seq, hash or engine version; batch: one citation line for all results). It is counted the same way (state values). Default format=full is for citing and checking records. Responses are signed by DAMO (Ed25519); public keys: https://api.damolive.com/.well-known/damo-keys.json. Time fields: verified as_of is when DAMO last wrote the record (UTC), not a candle time; each timeframe's candle close is states[tf].candle_close. live observed_at is when DAMO observed the forming candles; states[tf].candle_close_expected is when that candle will close. There is no generated_at. Not investment advice. Market states are computed from the DAMO composite, built from several public crypto perpetual futures markets. DAMO publishes its own state outputs only, not raw prices or candles. VERIFIED records with engine_version 1.0 (before 2026-10-26 00:00 UTC) were computed from a single reference market; engine 1.1 and later use the DAMO composite (same calculation, new input). Use of the API and MCP server is subject to the DAMO API terms: https://damolive.com/api-terms (among others: no reverse engineering of the state engine, no use of outputs to train or calibrate a model or service that reproduces DAMO states, no systematic collection beyond your own application's needs). Privacy: https://damolive.com/privacy",
      "tools": [
        {
          "name": "get_market_state",
          "title": "Get DAMO market state",
          "description": "Use when the user asks about the current market state (trend or momentum) of a crypto asset on any timeframe from 1 minute to 1 month. Returns state data only: no prices, forecasts or trade signals. Current DAMO market state of one symbol across 10 timeframes: state name and permanent code per timeframe, plus a 10-value vector in fixed timeframe order. as_of is when DAMO last wrote the record; each timeframe's candle close is in states[tf].candle_close (live: candle_close_expected).",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "full",
                "description": "compact = symbol, layer, time, vector, short citation and remaining quota only. full = per-timeframe state, seq, hash and engine version (for citing and checking).",
                "enum": ["full", "compact"],
                "type": "string"
              },
              "layer": {
                "default": "verified",
                "description": "verified = closed candles (recorded, never changed); live = forming candles (provisional)",
                "enum": ["verified", "live"],
                "type": "string"
              },
              "proof": {
                "default": false,
                "description": "Also put DAMO's Ed25519 signature in the result body as 'proof'.",
                "type": "boolean"
              },
              "symbol": {
                "description": "Ticker, e.g. BTCUSDT. BTC, btc, BTC/USDT, BTC-PERP and coin names like Bitcoin are also accepted. Not a sentence: on a wrong symbol the error lists did_you_mean.",
                "maxLength": 40,
                "type": "string"
              },
              "timeframes": {
                "description": "Optional. Only these timeframes are returned and counted against the quota (case-sensitive: 1m = minute, 1M = month). Omit for all 10.",
                "items": {
                  "enum": ["1m", "5m", "15m", "1h", "4h", "12h", "1d", "3d", "1w", "1M"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "verified: when DAMO last wrote this record (UTC). Each timeframe's own close time is states[tf].candle_close",
                "type": "string"
              },
              "chain_head": {
                "type": "object"
              },
              "citation": {
                "type": "string"
              },
              "engine_version": {
                "type": "string"
              },
              "layer": {
                "enum": ["verified", "live"],
                "type": "string"
              },
              "observed_at": {
                "description": "live: when DAMO observed the forming candles (UTC)",
                "type": "string"
              },
              "proof": {
                "description": "Ed25519 signature when proof=true",
                "type": "object"
              },
              "quota": {
                "type": "object"
              },
              "quota_remaining": {
                "type": "integer"
              },
              "stale": {
                "type": "boolean"
              },
              "states": {
                "additionalProperties": {
                  "type": "object"
                },
                "description": "full format: per-timeframe state, code, candle status and record fields",
                "type": "object"
              },
              "symbol": {
                "type": "string"
              },
              "vector": {
                "description": "State codes in timeframe order (1 bull_momentum, 2 weakening, 3 bear_momentum, 4 recovery); null = not requested or not available",
                "items": {
                  "maximum": 4,
                  "minimum": 1,
                  "type": ["integer", "null"]
                },
                "type": "array"
              },
              "vector_order": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["citation", "layer", "symbol", "vector"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get DAMO market state"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88bbf45acc9d2912c1e384defa798f4667a5520bfd25dd412f100a6a84d92670"
        },
