{
  "lockfileVersion": 2,
  "subjects": {
    "com.gotfreefax/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.gotfreefax.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "GotFreeFax",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_fax_status",
          "description": "Check the delivery status of a previously sent fax using its job_id. No authentication required — the job_id is the unforgeable token.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The job ID returned by send_fax",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c00d7f58afd1dda93154f99f596129ddf3fff07d2b82a3ebe9c9bbb6121351af"
        },
        {
          "name": "get_account_balance",
          "description": "Get the current page balance and dollar amount balance for the authenticated account.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1ce41eae72eac8db4245c4966f9558a2fc386f70ab358b5b0cc7d07a47e6c057"
        },
        {
          "name": "list_sent_faxes",
          "description": "List faxes previously sent by the authenticated account (most recent first). Includes faxes sent via MCP, REST API, and the prepaid web form. Free anonymous sends are not included.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max records to return (1-100, default 20)",
                "type": "integer"
              },
              "offset": {
                "description": "Skip first N records for pagination (default 0)",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cff8f7a489c731888b9f4550fb9e1c1d3ef766d963d77a5c451d81245371a96c"
        },
        {
          "name": "list_supported_formats",
          "description": "List all supported file formats that can be faxed.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3d1a50733424404b1189d73533be487527779ba969d414e5181b52d7e94a501"
        },
        {
          "name": "purchase_credits",
          "description": "Start a prepaid credit purchase. If the request is authenticated, credits will be loaded into the authenticated account after PayPal payment. If the request is not authenticated, provide email and name to create a new prepaid account (or load credits into an existing one with the same email). Returns a PayPal payment URL the user must visit to complete the purchase.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Required when the request is not authenticated. Used to create or load an existing prepaid account.",
                "type": "string"
              },
              "name": {
                "description": "Required when the request is not authenticated. Account holder name.",
                "type": "string"
              },
              "service_type": {
                "description": "Purchase option. One of: prepaid10 (100 pages, $12.95), prepaid20 (250 pages, $24.95), prepaid50 (800 pages, $59.95), intprepaid50 ($49.95 international balance), intprepaid100 ($99.95 international balance), intprepaid200 ($199.95 international balance).",
                "type": "string"
              }
            },
            "required": ["service_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:42ffb19bd267c40217f99c69bfec436108ed8ba0d93967ba967bb866f771de06"
        },
        {
          "name": "send_fax",
          "description": "Send a fax to a US or Canada phone number. Accepts PDF, DOC, DOCX, JPG, JPEG, TXT files (max 10) as base64-encoded content. Uses one page credit per page from the authenticated account, deducted when the fax is queued and returned if it fails to send; the account must have enough credits for the whole document.",
          "inputSchema": {
            "properties": {
              "fax_number": {
                "description": "Destination fax number (10 digits, US or Canada)",
                "type": "string"
              },
              "files": {
                "description": "Array of files to fax",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Base64-encoded file content",
                      "type": "string"
                    },
                    "filename": {
                      "description": "File name with extension (e.g. document.pdf)",
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "notify_url": {
                "description": "Optional URL to receive fax completion notification",
                "type": "string"
              }
            },
            "required": ["fax_number", "files"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d853f1ceb2c7f5eff68f997b3e282d91c0ca911b689344d2cc1fa129c57b7dc5"
        },
        {
          "name": "send_free_fax",
          "description": "Send a free fax to a US or Canada number (no account required). Limited to 3 pages total and 2 sends per email/IP per day. Returns a job_id immediately, but the fax does NOT send until the sender clicks a confirmation link emailed to sender_email. The daily-limit check happens at click time, not at submission — a submitted fax may still be rejected if the limit is hit by then; the agent can detect this by calling check_fax_status after the user reports clicking the link. If the document exceeds the free page limit, the response will suggest using purchase_credits to buy a prepaid account.",
          "inputSchema": {
            "properties": {
              "cover_sheet": {
                "description": "Include cover sheet (default true).",
                "type": "boolean"
              },
              "fax_number": {
                "description": "Destination fax number (10 digits, US or Canada).",
                "type": "string"
              },
              "files": {
                "description": "Up to 3 files. Each must be base64-encoded. Free faxes are limited to 3 pages total across text + files.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Base64-encoded file content",
                      "type": "string"
                    },
                    "filename": {
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "receiver_company": {
                "description": "Receiver's company (optional).",
                "type": "string"
              },
              "receiver_name": {
                "description": "Receiver's name (required).",
                "type": "string"
              },
              "sender_company": {
                "description": "Sender's company (optional).",
                "type": "string"
              },
              "sender_email": {
                "description": "Sender's email address. A confirmation link will be sent here; the fax does NOT actually send until the user clicks that link.",
                "type": "string"
              },
              "sender_fax": {
                "description": "Sender's fax number (optional).",
                "type": "string"
              },
              "sender_name": {
                "description": "Sender's name (required).",
                "type": "string"
              },
              "subject": {
                "description": "Subject line (optional).",
                "type": "string"
              },
              "text": {
                "description": "Fax body text. Either text or files must be provided.",
                "type": "string"
              }
            },
            "required": ["fax_number", "receiver_name", "sender_email", "sender_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5cb489bd5c184ed230f810d50bf8199db75d1bce2ff1ba59a7d095fe1b8798a2"
        }
      ],
      "digest": "sha256:796137c1187c3edb0270275c1056fede387d0da42ba2753b7b68bae540a0d165"
    }
  }
}
