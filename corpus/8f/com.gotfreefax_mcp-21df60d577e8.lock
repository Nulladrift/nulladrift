        },
        {
          "name": "send_fax",
          "title": "Send Fax from Prepaid Account",
          "description": "Send a fax to a US or Canada phone number. Accepts PDF, DOC, DOCX, JPG, JPEG, TXT files (max 10), as base64-encoded content in files or as links in attachments (how ChatGPT passes files the user attached). Uses one page credit per page from the authenticated account, deducted when the fax is queued and returned if it fails to send; the account must have enough credits for the whole document.",
          "inputSchema": {
            "properties": {
              "attachments": {
                "description": "Files passed by link instead of content. ChatGPT fills this in with files the user attached to the conversation; any other client may give https links. Same formats as files, and files and attachments together count toward the file limit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "https link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "The app's id for the file",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The file's name",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The file's media type, for example application/pdf",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "fax_number": {
                "description": "Destination fax number (10 digits, US or Canada)",
                "type": "string"
              },
              "files": {
                "description": "Files to fax, as base64-encoded content. Either files or attachments is required.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Base64-encoded file content",
                      "type": "string"
                    },
                    "filename": {
                      "description": "File name with extension (e.g. document.pdf)",
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "notify_url": {
                "description": "Optional URL to receive fax completion notification",
                "type": "string"
              }
            },
            "required": ["fax_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send Fax from Prepaid Account"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["attachments"],
            "securitySchemes": [
              {
                "scopes": ["gff.fax"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c5f90e1721d59b96edbae151acbbd4d4be4695134f4954b6cdc473fa7d9fbe1b"
        },
        {
          "name": "send_free_fax",
          "title": "Send Free Fax",
          "description": "Send a free fax to a US or Canada number (no account required). Limited to 3 pages total and 2 sends per email/IP per day. Returns a job_id immediately, but the fax does NOT send until the sender clicks a confirmation link emailed to sender_email. The daily-limit check happens at click time, not at submission — a submitted fax may still be rejected if the limit is hit by then; the agent can detect this by calling check_fax_status after the user reports clicking the link. If the document exceeds the free page limit, the response will suggest using purchase_credits to buy a prepaid account. Files go in files (base64-encoded content) or attachments (links; how ChatGPT passes files the user attached).",
          "inputSchema": {
            "properties": {
              "attachments": {
                "description": "Files passed by link instead of content. ChatGPT fills this in with files the user attached to the conversation; any other client may give https links. Same formats as files, and files and attachments together count toward the file limit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "description": "https link to the file",
                      "type": "string"
                    },
                    "file_id": {
                      "description": "The app's id for the file",
                      "type": "string"
                    },
                    "file_name": {
                      "description": "The file's name",
                      "type": "string"
                    },
                    "mime_type": {
                      "description": "The file's media type, for example application/pdf",
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "cover_sheet": {
                "description": "Include cover sheet (default true).",
                "type": "boolean"
              },
              "fax_number": {
                "description": "Destination fax number (10 digits, US or Canada).",
                "type": "string"
              },
              "files": {
                "description": "Up to 3 files. Each must be base64-encoded. Free faxes are limited to 3 pages total across text + files.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Base64-encoded file content",
                      "type": "string"
                    },
                    "filename": {
                      "type": "string"
                    }
                  },
                  "required": ["content", "filename"],
                  "type": "object"
                },
                "type": "array"
              },
              "receiver_company": {
                "description": "Receiver's company (optional).",
                "type": "string"
              },
              "receiver_name": {
                "description": "Receiver's name (required).",
                "type": "string"
              },
              "sender_company": {
                "description": "Sender's company (optional).",
                "type": "string"
              },
              "sender_email": {
                "description": "Sender's email address. A confirmation link will be sent here; the fax does NOT actually send until the user clicks that link.",
                "type": "string"
              },
              "sender_fax": {
                "description": "Sender's fax number (optional).",
                "type": "string"
              },
              "sender_name": {
                "description": "Sender's name (required).",
                "type": "string"
              },
              "subject": {
                "description": "Subject line (optional).",
                "type": "string"
              },
              "text": {
                "description": "Fax body text. Either text, files or attachments must be provided.",
                "type": "string"
              }
            },
            "required": ["fax_number", "receiver_name", "sender_email", "sender_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send Free Fax"
