              },
              "urgency": {
                "description": "Urgent only when the customer says it is urgent or an emergency, as the website's Urgent choice. Everything else is flexible (default), including wanting it today, tomorrow, soon or fast. Never ask about urgency or timing. this_week is still accepted. Never promise a response time.",
                "enum": ["flexible", "this_week", "urgent"],
                "type": "string"
              }
            },
            "required": ["addressLine1", "locale", "municipality", "name", "phone"],
            "type": "object"
