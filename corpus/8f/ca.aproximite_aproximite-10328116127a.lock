        {
          "name": "submit_referral_request",
          "title": "Send the reviewed request",
          "description": "Send the request exactly as reviewed. CONSEQUENTIAL: call only after showing the customer the review from prepare_referral_request and getting their explicit permission. Pass that review token and privacy version with customerAuthorized:true. Repeating the same token never creates a second request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "customerAuthorized": {
                "const": true,
                "description": "true, only after the customer has seen the review and said yes to sending it.",
                "type": "boolean"
              },
              "privacyVersion": {
                "description": "The consent.privacyVersion from that same review, unchanged.",
                "maxLength": 100,
                "type": "string"
              },
              "reviewToken": {
                "description": "The reviewToken from prepare_referral_request's ready review, unchanged.",
                "maxLength": 120000,
                "type": "string"
              }
            },
            "required": ["customerAuthorized", "privacyVersion", "reviewToken"],
            "type": "object"
          },
          "annotations": {
