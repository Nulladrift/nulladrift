      "serverInfo": {
        "name": "aproximite",
        "title": "À proximité",
        "version": "1.0.2",
        "websiteUrl": "https://aproximite.ca/ai-assistants"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "À proximité connects homeowners in Vaudreuil-Soulanges, Quebec, with a local company chosen on merit for work in and around their home (an electrician, a plumber, a heating and cooling company, an exterminator, a cleaning company, a painter, a roofer, a moving company, a landscaper, a snow removal company, a window washer, a gutter company, a tree service, a general contractor, a handyman, a fence and deck builder, an appliance repair company, a window and door company, a pool company or a chimney sweep). Use get_referral_options, optionally lookup_service_address (manual address entry always remains available), then prepare_referral_request with the situation from its options, show the customer the exact review, and submit_referral_request only with their explicit permission. ONE REQUEST PER TRADE: when the customer describes work for two or more trades (for example after moving in: an electrical panel, painting and a cleaning), call prepare_referral_request once with services, one entry per trade, each with only that trade's part of the description and its own situation questions; never one description for several trades. The customer sees one review and says yes once; one submit sends one request per trade.",
      "tools": [
        {
          "name": "get_referral_options",
          "title": "À proximité: services and areas",
          "description": "Find out how to connect a homeowner with a local company chosen on merit for work in and around their home (an electrician, a plumber, a heating and cooling company, an exterminator, a cleaning company, a painter, a roofer, a moving company, a landscaper, a snow removal company, a window washer, a gutter company, a tree service, a general contractor, a handyman, a fence and deck builder, an appliance repair company, a window and door company, a pool company or a chimney sweep) through À proximité in Vaudreuil-Soulanges, Quebec. You can collect the job and contact details, prepare a request, show the customer a review and submit with their explicit permission. When a suitable professional accepts, they contact the customer directly. Read services, municipalities, availability and the workflow. No booking or callback-time guarantee. This tool only reads public information. Call this first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The customer's language: fr for French, en for English. Use it for the review and the text messages they receive.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f7fc654a118da8d7cf2ddb2b18054cc77da29e557ef1d0dd1d3264c431628c1"
        },
        {
          "name": "lookup_service_address",
          "title": "Look up a service address",
          "description": "Return up to five labeled address suggestions or resolve one opaque selection. Read-only: this never changes a request or records consent. Query and selection are mutually exclusive. Suggestions are candidates only; never guess or auto-select. Manual entry is always available. If Google output is shown to the customer, include the exact attribution text Google Maps.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The customer's language: fr for French, en for English. Suggestions come back in it.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "query": {
                "description": "What the customer typed. Pass query or selection, not both.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "selection": {
                "description": "The suggestion the customer picked. Pass query or selection, not both.",
                "maxLength": 3000,
                "minLength": 1,
                "type": "string"
              },
              "session": {
                "description": "The session returned by your previous lookup with a query, to keep the same search as the customer types more. Leave it out on the first query.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["locale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a1593371704d1b8b14b8a0c0306acab6c369c7026cf172b7d11ad1c689aa8d8e"
        },
        {
          "name": "prepare_referral_request",
          "title": "Prepare a request for review",
          "description": "Validate the customer's details and return the exact request and consent notice to show them, with a review token. Nothing is sent. Work from two or more trades goes in services, one entry per trade with only that trade's part of the description, in this one call: never one description for several trades. Pass the situation, since and answers from the customer's words and get_referral_options' situations. Municipality must be the customer's stated job location; ask if unknown. Call again with corrected details if fieldsToCorrect is not empty. Photos are not supported here; the customer can add them on aproximite.ca.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addressLine1": {
                "description": "Customer-stated street address for this job. Required for a ready review. Manual entry is valid; never guess from a suggestion.",
                "maxLength": 200,
                "type": "string"
              },
              "addressUnit": {
                "description": "Apartment, unit or suite number, if the customer gave one.",
                "maxLength": 40,
                "type": "string"
              },
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Answers to the situation's questions, question id to choice id, from what the customer said. Only that situation's questions and choices; leave out a question they can't answer. Later answers add to earlier ones.",
                "type": "object"
              },
              "company": {
                "description": "Only when the customer came from a company's page on this site (/fr/entreprises/{company} or /companies/{company}): that page's last path segment. The request goes to that company first when it can take it, otherwise as usual. An empty string removes it. Never guess one.",
                "pattern": "^([a-z0-9-]{3,60})?$",
                "type": "string"
              },
              "description": {
                "description": "The job as the customer would tell the company, in the first person and in their words, keeping every detail they gave about it (age, model, where, what happens). Only one trade's work: another trade's work is another request (or another entry in services, where offered). Don't add the urgency, the quotes choice or the situation's answers: they go with the request already. A trade name alone is too short: at least three words about the job.",
                "maxLength": 1500,
                "type": "string"
              },
              "locale": {
                "description": "The customer's language: fr for French, en for English. Use it for the review and the text messages they receive.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "mode": {
                "description": "one_company (default): one local company calls the customer. quotes: several local companies call about the same request so the customer can compare quotes and choose. Use quotes only when the customer says they want to compare quotes; never promise a number of companies or a delay.",
                "enum": ["one_company", "quotes"],
                "type": "string"
              },
              "municipality": {
                "description": "Customer-stated property location, required on every preparation. Ask the customer if unknown.",
                "enum": ["vaudreuil-dorion", "coteau-du-lac", "hudson", "les-cedres", "les-coteaux", "l-ile-cadieux", "l-ile-perrot", "notre-dame-de-l-ile-perrot", "pincourt", "pointe-des-cascades", "pointe-fortune", "rigaud", "riviere-beaudette", "saint-clet", "saint-lazare", "saint-polycarpe", "saint-telesphore", "saint-zotique", "sainte-justine-de-newton", "sainte-marthe", "tres-saint-redempteur", "terrasse-vaudreuil", "vaudreuil-sur-le-lac"],
                "type": "string"
              },
              "name": {
                "description": "The customer's name, as they gave it. The company uses it when calling back.",
                "maxLength": 100,
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number, where the company calls back and where the confirmation text goes. A Canadian number, as they gave it.",
                "maxLength": 40,
                "type": "string"
              },
              "postalCode": {
                "description": "The job address's postal code, if the customer gave it.",
                "maxLength": 10,
                "type": "string"
              },
              "sameCompanyAsLastTime": {
                "description": "true only when the customer says they want the same company as for a previous job (\"the same electrician as last time\"). Never ask about it.",
                "type": "boolean"
              },
              "service": {
                "description": "The trade for this job, from get_referral_options' services. When a situation is given, the service follows it.",
                "enum": ["ev-charger", "panel-upgrade", "troubleshooting", "other", "plumbing-repairs", "drain-cleaning", "water-heaters", "heat-pumps", "heating", "ventilation", "insects", "mice-rats", "bed-bugs", "regular-cleaning", "deep-cleaning", "move-cleaning", "interior-painting", "exterior-painting", "cabinet-staining", "roof-repairs", "roof-replacement", "roof-flashing-vents", "home-moves", "small-moves", "heavy-items", "landscape-planting", "pavers-walls", "lawn-upkeep", "snow-contract", "snow-one-off", "roof-snow", "house-windows", "screens-frames", "pressure-washing", "gutter-cleaning", "gutter-installation", "gutter-repairs", "tree-pruning", "tree-removal", "stump-grinding", "kitchen-renovation", "bathroom-renovation", "basement-renovation", "small-repairs", "furniture-assembly", "wall-mounting", "fence-installation", "deck-building", "fence-deck-repairs", "washer-dryer-repair", "fridge-repair", "stove-dishwasher-repair", "window-replacement", "window-repairs", "entry-patio-doors", "pool-opening-closing", "pool-repairs", "pool-installation", "chimney-sweep", "chimney-parts", "stove-fireplace", "plumbing", "hvac", "pest-control", "house-cleaning", "painting", "roofing", "moving", "landscaping", "snow-removal", "window-washing", "gutters", "trees", "renovation", "handyman", "fences-decks", "appliance-repair", "windows-doors", "pools", "chimney"],
                "type": "string"
              },
              "services": {
                "description": "ONLY when the customer describes work for two or more trades (for example after moving in: an electrical panel, painting and a cleaning): one entry per trade, never two for the same trade. Each entry has its service or situation, ONLY that trade's part of the description in the customer's words (with what they said about the house or the dates), and that situation's since and answers. Then leave out the top-level description, service, situation, since and answers; the address, name, phone, urgency and mode go with every entry. The customer sees one review and approves once; one submit sends one request per trade, and each company sees only its own entry.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answers": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "description": "Answers to the situation's questions, question id to choice id, from what the customer said. Only that situation's questions and choices; leave out a question they can't answer. Later answers add to earlier ones.",
                      "type": "object"
                    },
                    "description": {
                      "description": "The job as the customer would tell the company, in the first person and in their words, keeping every detail they gave about it (age, model, where, what happens). Only one trade's work: another trade's work is another request (or another entry in services, where offered). Don't add the urgency, the quotes choice or the situation's answers: they go with the request already. A trade name alone is too short: at least three words about the job.",
                      "maxLength": 1500,
                      "type": "string"
                    },
                    "service": {
                      "description": "The trade for this job, from get_referral_options' services. When a situation is given, the service follows it.",
                      "enum": ["ev-charger", "panel-upgrade", "troubleshooting", "other", "plumbing-repairs", "drain-cleaning", "water-heaters", "heat-pumps", "heating", "ventilation", "insects", "mice-rats", "bed-bugs", "regular-cleaning", "deep-cleaning", "move-cleaning", "interior-painting", "exterior-painting", "cabinet-staining", "roof-repairs", "roof-replacement", "roof-flashing-vents", "home-moves", "small-moves", "heavy-items", "landscape-planting", "pavers-walls", "lawn-upkeep", "snow-contract", "snow-one-off", "roof-snow", "house-windows", "screens-frames", "pressure-washing", "gutter-cleaning", "gutter-installation", "gutter-repairs", "tree-pruning", "tree-removal", "stump-grinding", "kitchen-renovation", "bathroom-renovation", "basement-renovation", "small-repairs", "furniture-assembly", "wall-mounting", "fence-installation", "deck-building", "fence-deck-repairs", "washer-dryer-repair", "fridge-repair", "stove-dishwasher-repair", "window-replacement", "window-repairs", "entry-patio-doors", "pool-opening-closing", "pool-repairs", "pool-installation", "chimney-sweep", "chimney-parts", "stove-fireplace", "plumbing", "hvac", "pest-control", "house-cleaning", "painting", "roofing", "moving", "landscaping", "snow-removal", "window-washing", "gutters", "trees", "renovation", "handyman", "fences-decks", "appliance-repair", "windows-doors", "pools", "chimney"],
                      "type": "string"
                    },
                    "since": {
                      "description": "Since when the problem has been going on: today, days (a few days), week_plus (more than a week) or unknown. Only for a problem situation, never for an installation.",
                      "enum": ["", "today", "days", "week_plus", "unknown"],
                      "type": "string"
                    },
                    "situation": {
                      "description": "The situation from get_referral_options' situations that matches the job, confirmed with the customer. The service then follows the situation. An empty string removes it.",
                      "enum": ["", "outlet_switch_light_out", "breaker_trips", "power_outage", "ev_charger", "electrical_panel", "add_outlets_lights", "electric_heating", "light_fixture_or_fan", "hardwired_smoke_detectors", "electrical_renovation", "spa_pool_generator", "water_leak", "faucet_toilet_shower", "clogged_drain", "water_heater", "low_water_pressure", "frozen_pipe", "sump_backwater_sewer", "plumbing_renovation", "outdoor_faucet_water_treatment", "no_heat", "heat_pump_not_working", "heat_pump_install", "furnace_or_boiler", "air_exchanger", "exhaust_ventilation", "hvac_maintenance", "roof_leak_repair", "roof_replacement", "lawn_mowing", "lawn_treatment", "hedge_trimming", "wildlife", "mice_rats", "carpet_upholstery", "deck_fence_staining", "pool_liner", "pool_equipment", "spa", "home_move", "door_handle_trim"],
                      "type": "string"
                    }
                  },
                  "required": ["description"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 2,
                "type": "array"
              },
              "since": {
                "description": "Since when the problem has been going on: today, days (a few days), week_plus (more than a week) or unknown. Only for a problem situation, never for an installation.",
                "enum": ["", "today", "days", "week_plus", "unknown"],
                "type": "string"
              },
              "situation": {
                "description": "The situation from get_referral_options' situations that matches the job, confirmed with the customer. The service then follows the situation. An empty string removes it.",
                "enum": ["", "outlet_switch_light_out", "breaker_trips", "power_outage", "ev_charger", "electrical_panel", "add_outlets_lights", "electric_heating", "light_fixture_or_fan", "hardwired_smoke_detectors", "electrical_renovation", "spa_pool_generator", "water_leak", "faucet_toilet_shower", "clogged_drain", "water_heater", "low_water_pressure", "frozen_pipe", "sump_backwater_sewer", "plumbing_renovation", "outdoor_faucet_water_treatment", "no_heat", "heat_pump_not_working", "heat_pump_install", "furnace_or_boiler", "air_exchanger", "exhaust_ventilation", "hvac_maintenance", "roof_leak_repair", "roof_replacement", "lawn_mowing", "lawn_treatment", "hedge_trimming", "wildlife", "mice_rats", "carpet_upholstery", "deck_fence_staining", "pool_liner", "pool_equipment", "spa", "home_move", "door_handle_trim"],
