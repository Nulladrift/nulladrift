      "serverInfo": {
        "name": "seoaeogeo",
        "title": "SEO·AEO·GEO",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use audit_url on a page before changing its SEO or AI-search setup. Apply the fix pack's code fixes on a branch, list the settings fixes for the human, deploy a preview, then run audit_url again to verify.",
      "tools": [
        {
          "name": "audit_url",
          "title": "Audit a page for Google and AI search",
          "description": "Audit one public web page for visibility in Google, AI Overviews, ChatGPT, Claude and Perplexity. Fetches the page as the AI search crawlers (OAI-SearchBot, Claude-SearchBot, PerplexityBot) to catch robots.txt, CDN and firewall blocks, checks how much content exists without JavaScript, and scores extractability and trust signals. Returns the score, every check's result and a fix pack: the fixes in priority order with where each lives in a codebase and a command to verify it. Takes 10–30 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "Optional: the question this page should win in AI answers, e.g. \"best CRM for small agencies\". Adds query-level fit (heading match, answer-first for the question, names, price and date present); changes no score.",
                "type": "string"
              },
              "url": {
                "description": "The page to audit, e.g. https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:afa70bc649818bad83d8d2b4ae78b467072ad04733770c530e63155ec1babded"
        },
        {
          "name": "get_report",
          "title": "Get an earlier audit",
          "description": "Return the summary and fix pack of an audit run in the last 24 hours, by its report id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "report_id": {
                "description": "The id returned by audit_url",
                "type": "string"
              }
            },
