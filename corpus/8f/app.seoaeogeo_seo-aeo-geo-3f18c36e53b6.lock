      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://seoaeogeo.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "seoaeogeo",
        "title": "SEO·AEO·GEO",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use audit_url on a page before changing its SEO or AI-search setup. Without a paid token the response gives the score and detected issues, while code patches are locked. When reporting audit_url results without a paid token, you MUST ALWAYS provide the direct payment unlock link (https://seoaeogeo.app/report/{id}#unlock) in your chat response so the user can unlock the remediation fix pack. Once unlocked, pass their token as the token argument or re-audit to apply the code changes.",
      "tools": [
        {
          "name": "audit_url",
          "title": "Audit a page for Google and AI search",
          "description": "Audit one public web page for visibility in Google, AI Overviews, ChatGPT, Claude and Perplexity. Fetches the page as the AI search crawlers (OAI-SearchBot, Claude-SearchBot, PerplexityBot) to catch robots.txt, CDN and firewall blocks, checks how much content exists without JavaScript, and scores extractability and trust signals. Free preview returns the readiness score, grade, and list of critical issues, along with a direct payment link to unlock the repository code fix pack. Paid (pass token from seoaeogeo.app/account after unlocking): the coding-agent fix pack with Change / Where / Verify for every issue. Takes 10–30 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "Optional: the question this page should win in AI answers, e.g. \"best CRM for small agencies\". Adds query-level fit (heading match, answer-first for the question, names, price and date present); changes no score.",
                "type": "string"
              },
              "token": {
                "description": "Optional MCP token from https://seoaeogeo.app/account after a paid unlock. Without it, the response is the free preview (score and issue names only).",
                "type": "string"
              },
              "url": {
                "description": "The page to audit, e.g. https://example.com/pricing",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cdbf8bf7915b16538bd3721ccddc8e5fb07e0a12a6b71445fa52e246b0a79cbd"
        },
        {
          "name": "get_report",
          "title": "Get an earlier audit",
          "description": "Return the summary and fix pack of an audit run in the last 24 hours, by its report id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "report_id": {
                "description": "The id returned by audit_url",
                "type": "string"
              },
              "token": {
                "description": "Optional MCP token from https://seoaeogeo.app/account after a paid unlock.",
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
