        {
          "name": "simulate_life_insurance_flush",
          "description": "Simulates a Cyprus unit-linked life insurance policy and calculates tax and returns from executed withdrawals only. Requests above available funds are capped and flagged; self-funded surrender taxes are included in household cash flows and IRR. Use to model withdrawals from an existing Cyprus life-insurance policy. Require actual policy terms, tax rate, historical policy records and future premium/withdrawal projections; ask for missing items and never generate policy history. Amounts requested above available funds are limited to executed proceeds, and tax/return figures follow those executed cash flows. Forecast returns are assumptions and must be identified as such.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Current age of the policyholder.",
                "maximum": 90,
                "minimum": 18,
                "type": "integer"
              },
              "aumFee": {
                "description": "Annual management fee as a percent of fund value.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "brokerReturnRate": {
                "description": "Annual return of the broker account, percent (used with useDifferentBrokerReturn).",
                "type": "number"
              },
              "capitalSumInsured": {
                "description": "Death benefit / sum insured, EUR. Mortality cost applies to the amount at risk above the fund value.",
                "minimum": 0,
                "type": "number"
              },
              "contractStartYear": {
                "description": "Calendar year the policy started. Partial surrenders are only tax-free from the 4th policy year.",
                "type": "integer"
              },
              "gender": {
                "description": "Used to look up mortality rates.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "historicalData": {
                "description": "Actual policy history; the last entry's endingBalance is the simulation's opening balance, and the 3/4-year lookbacks drive the safe limit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "endingBalance": {
                      "description": "Fund value at 31 December, EUR.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "premiumsPaid": {
                      "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "withdrawalsMade": {
                      "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "year": {
                      "type": "integer"
                    }
                  },
                  "required": ["endingBalance", "premiumsPaid", "withdrawalsMade", "year"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "investmentReturn": {
                "description": "Annual percentage value (e.g. 2.5 for 2.5%). Supply the actual rate unless the user accepts a stated modelling default. Expected annual return inside the policy.",
                "type": "number"
              },
              "monthlyFee": {
                "description": "Fixed policy fee charged each month, EUR.",
                "minimum": 0,
                "type": "number"
              },
              "projections": {
                "description": "Future years to simulate.",
                "items": {
                  "properties": {
                    "isSelfFunded": {
                      "description": "Premium funded by withdrawing from the policy itself; costs a 5% spread each month.",
                      "type": "boolean"
                    },
                    "monthlyPremium": {
                      "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "plannedWithdrawal": {
                      "description": "Withdrawal to attempt in this year (userInput scenario only).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "year": {
                      "type": "integer"
                    }
                  },
                  "required": ["monthlyPremium", "year"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "reinvestWithdrawals": {
                "description": "When true, net withdrawals are reinvested in a broker account and IRR is computed on combined wealth.",
                "type": "boolean"
              },
              "scenario": {
                "description": "Which scenario to report as the primary result (default userInput). All three are always returned for comparison.",
                "enum": ["maxTaxFree", "userInput", "noWithdrawals"],
                "type": "string"
              },
              "taxBracket": {
                "description": "Marginal income tax rate applied to taxable surrender amounts and to premium relief, percent.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "useDifferentBrokerReturn": {
                "description": "Use brokerReturnRate instead of investmentReturn for the broker account.",
                "type": "boolean"
              }
            },
            "required": ["age", "aumFee", "capitalSumInsured", "contractStartYear", "gender", "historicalData", "investmentReturn", "monthlyFee", "projections", "taxBracket"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Typed machine-readable tool result.",
            "properties": {
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["field", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "finalBalance": {
                "type": "number"
              },
