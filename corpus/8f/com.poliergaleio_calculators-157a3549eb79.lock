            "required": ["assumptions", "availableDeductions", "chargeableIncome", "effectiveTaxRate", "gesy", "grossIncome", "incomeTax", "mindsDeduction", "mindsEligibility", "netIncome", "netSalary", "selfEmployedHRDA", "socialInsurance", "specialDefenseContribution", "statutoryAssumptions", "totalDeductions"],
            "type": "object"
