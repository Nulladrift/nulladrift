                "type": "string"
              },
              "irrWithoutTax": {
                "type": ["number", "null"]
              },
              "irrWithoutTaxPerspective": {
                "type": "string"
              },
              "mortalityDataAvailable": {
                "type": "boolean"
              },
              "netWithdrawalsPaidOut": {
                "type": "number"
              },
              "safeLimitByYear": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "balance4YrAgo": {
                      "type": "number"
                    },
                    "netExcessWithdrawals": {
                      "type": "number"
                    },
