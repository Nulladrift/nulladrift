        {
          "name": "calculate_cyprus_income_tax",
          "description": "Calculates Cyprus income tax, employee/self-employed SI, GESY and take-home pay. Employee SI and first-employment relief use qualifying employment remuneration only; rent does not increase employee SI. GESY uses the shared €180,000 personal ceiling. Use for a Cyprus resident or non-resident employee or sole proprietor tax estimate. Before calling, confirm whether a stated salary is monthly or annual and confirm employment category (private, civil or self-employed); do not infer either. Supply gross annual salary in EUR (use explicit 0 for self-employed-only cases); self-employed calculations also need turnover and occupational category. Identify when 2026 tax rules are a default rather than a user-supplied year. Optional incomes, deductions, tax year and eligibility facts must come from the user. Employee Social Insurance applies to qualifying employment remuneration only; passive rental income does not increase employee SI. Article 8(21A)/(23A) exemptions are based on qualifying employment remuneration only; GESY's €180,000 annual personal ceiling is shared across salary, self-employment, pension and income-earner categories. Never infer exemption eligibility. Household tax category differs from marital status; confirm family income, custody and dividend profit origin. Missing facts appear in statutoryAssumptions and require review.",
          "inputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "if": {
                  "properties": {
                    "employmentType": {
                      "const": "self-employed"
                    }
                  },
                  "required": ["employmentType"]
                },
                "then": {
                  "properties": {
                    "selfEmployedDetails": {
                      "required": ["occupationalCategory", "turnover"]
                    }
                  },
                  "required": ["selfEmployedDetails"]
                }
              }
            ],
            "properties": {
              "alreadyTaxedOtherDividends": {
                "description": "Already SDC-taxed amount within the remaining dividend allocation.",
                "minimum": 0,
                "type": "number"
              },
              "alreadyTaxedPre2026CyprusDividends": {
                "description": "Already SDC-taxed amount within the pre-2026 Cyprus-profit allocation; not merely this year's withholding.",
                "minimum": 0,
                "type": "number"
              },
              "cryptoTradingIncome": {
                "description": "Annual taxable cryptoasset trading gains in EUR. From tax year 2026 the amount is taxed at 8% separately from progressive PIT; do not include non-taxable investment disposals.",
                "minimum": 0,
                "type": "number"
              },
              "depositInterestIncome": {
                "description": "Annual deposit interest in EUR. Standard interest is subject to 17% SDC for Cyprus-domiciled individuals, rather than progressive PIT; GESY still applies.",
                "minimum": 0,
                "type": "number"
              },
              "dividendIncome": {
                "description": "Annual dividend income in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "donations": {
                "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                "minimum": 0,
                "type": "number"
              },
              "employmentType": {
                "description": "'private' for private sector (8.8% SI), 'civil' for civil service (4.45% SI), 'self-employed' for sole proprietor (16.6% SI on deemed/actual, 4% GESY). Required; the API does not assume a category.",
                "enum": ["private", "civil", "self-employed"],
                "type": "string"
              },
              "energyEfficiencyExpense": {
                "minimum": 0,
                "type": "number"
              },
              "evExpense": {
                "minimum": 0,
                "type": "number"
              },
              "exemptionType": {
                "description": "Minds in Cyprus Art. 8(21B), applied only when eligibility conditions are met.",
                "enum": ["none", "article_8_21a", "article_8_23a", "article_8_21b_minds_in_cyprus"],
                "type": "string"
              },
              "familyIncome": {
                "description": "Total relevant statutory family income for Article 14B eligibility. Includes applicable income outside the calculator streams; do not add an ex-partner outside this household.",
                "minimum": 0,
                "type": "number"
              },
              "firstEmploymentDeduction": {
                "enum": ["", "20", "50"],
                "type": "string"
              },
              "fullCustodyChildOrders": {
                "description": "One-based eligible-child positions qualifying for sole-custody doubling within a family. Do not combine with single-parent status, which doubles all eligible children.",
                "items": {
                  "maximum": 10,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array",
                "uniqueItems": true
              },
              "hasDividendIncome": {
                "description": "Whether dividend income applies.",
                "type": "boolean"
              },
              "hasRentalIncome": {
                "description": "Whether rental income applies.",
                "type": "boolean"
              },
              "homeInsurancePremium": {
                "minimum": 0,
                "type": "number"
              },
              "householdChildrenForThreshold": {
                "description": "Children counted for family threshold, at least the eligible deduction-child count.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "housingInterestPaid": {
                "minimum": 0,
                "type": "number"
              },
              "innovativeInvestment": {
                "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                "minimum": 0,
                "type": "number"
              },
              "interestPaid": {
                "description": "Interest paid on rental property.",
                "minimum": 0,
                "type": "number"
              },
              "isDividendNonDomicile": {
                "description": "Non-dom status for dividends.",
                "type": "boolean"
              },
              "isNonDomicile": {
                "description": "Cyprus non-domicile status; exempts rental and deposit-interest SDC where applicable.",
                "type": "boolean"
              },
              "legislationVersion": {
                "description": "Tax/legislation year. Supported: 2025, 2026.",
                "enum": ["2025", "2026"],
                "type": "string"
              },
              "maritalStatus": {
                "enum": ["single", "married", "cohabiting"],
                "type": "string"
              },
              "mindsEligibility": {
                "additionalProperties": false,
                "description": "Facts used to validate Minds in Cyprus Art. 8(21B). Omit or leave incomplete to receive no 8(21B) deduction.",
                "properties": {
                  "cyprusStartDate": {
                    "description": "Date the Cyprus employment or business began.",
                    "format": "date",
                    "type": "string"
                  },
                  "cyprusTaxResidentInClaimYear": {
                    "description": "Cyprus tax resident in the claim year; not required for the commencement year.",
                    "type": "boolean"
                  },
                  "first12MonthsQualifyingIncome": {
                    "description": "Qualifying Cyprus remuneration or business profits in the first 12 months after starting.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "fullTimeForeignEmploymentMonthsPrior84": {
                    "description": "Months of full-time foreign employment during the preceding 84 months.",
                    "maximum": 84,
                    "minimum": 0,
                    "type": "number"
                  },
                  "nonResidentForPriorSevenYears": {
                    "description": "Not Cyprus tax resident throughout the seven years before starting.",
                    "type": "boolean"
                  },
                  "recognizedUniversityDegree": {
                    "description": "Holds a degree recognized by the Cyprus Council for the Recognition of Higher Education Qualifications.",
                    "type": "boolean"
                  },
                  "residentBeforePriorSevenYears": {
                    "description": "Cyprus tax resident in a year before those seven years.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "numDependentChildren": {
                "minimum": 0,
                "type": "integer"
              },
              "pensionIncome": {
                "additionalProperties": false,
                "properties": {
                  "cyprusPension": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreignPension": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "foreignPensionTaxMethod": {
                    "enum": ["flat_5_percent", "progressive"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "pre2026CyprusDividendIncome": {
                "description": "Portion of total dividends from pre-2026 Cyprus-company profits distributed in 2026, subject to transitional 17% SDC. Foreign dividends belong in the remaining 5% portion. Explicit 0 confirms no transitional portion; omission produces a review assumption.",
                "minimum": 0,
                "type": "number"
              },
              "propertyPrice": {
                "description": "Property price for wear-and-tear allowance.",
                "minimum": 0,
                "type": "number"
              },
              "propertyYear": {
                "description": "Year the property was acquired.",
                "type": "integer"
              },
              "providentFund": {
                "description": "Total provident/PEPP fund contribution in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "qualifiesForFirstEmployment": {
                "type": "boolean"
              },
              "rentPaidPrimary": {
                "minimum": 0,
                "type": "number"
              },
              "rentalIncome": {
                "description": "Annual rental income in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "salaryIncome": {
                "description": "Gross annual salary in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "selfEmployedDetails": {
                "additionalProperties": false,
                "description": "Sole-proprietor schedule: net profit = turnover − expenses − capitalAllowances − lossBroughtForward (floor 0).",
                "properties": {
                  "capitalAllowances": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "expenses": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "lossBroughtForward": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "occupationalCategory": {
                    "description": "Official year-specific MLSI occupational category driving weekly deemed earnings. Ask for the actual occupation and use the up-to/over-10-years variant where the schedule distinguishes practice duration.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "turnover": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "useActualEarningsForSI": {
                    "description": "Pay SI on actual profit when higher than deemed.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "spouseIncome": {
                "minimum": 0,
                "type": "number"
              },
              "taxHouseholdCategory": {
                "description": "Statutory household status, not marital status. Equal shared custody uses family; single-parent requires the statutory definition. If omitted, the estimate reports a review assumption.",
                "enum": ["single-person", "family", "single-parent"],
                "type": "string"
              },
              "taxesPrepaid": {
                "additionalProperties": false,
                "properties": {
                  "gesyWithheld": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "payeWithheld": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "provisionalInstallments": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "sdcWithheld": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "tradeUnionSubs": {
                "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["employmentType", "salaryIncome"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Typed machine-readable tool result.",
            "properties": {
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "reason": {
