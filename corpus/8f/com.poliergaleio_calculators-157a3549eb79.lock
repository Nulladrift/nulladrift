        {
          "name": "run_retirement_stress_test",
          "description": "Runs a deterministic projection plus Monte Carlo simulation of a retirement savings plan. Seeded market and medical paths use independent random streams. Age-keyed returnOverrides replace returns in both calculation modes; nonDepletionProbability always reports basic no-shortfall success, while successProbability also applies supplied successCriteria. Use for a retirement savings sustainability or portfolio-longevity projection. Reuse the user's ages, savings, contributions and planned monthly spending; ask for each missing essential input and never use example personal values. Values are EUR, contributions/drawdown are monthly, and ages are years. Supply pensionStreams to include Cyprus or foreign pension income; concurrent streams are aggregated before applying personal tax allowances and the shared €180,000 GESY ceiling. Foreign pensions use the 2026 flat 5% rate above €5,000 unless a net override is supplied. Omitted state pension means pension income is excluded. accumulationVolatility and distributionVolatility set annual return volatility; medicalShocks optionally models acute and long-term-care costs. returnOverrides replaces age-specific returns in both calculation paths. Market and medical random streams are independent, so changing medical assumptions does not shift seeded market paths. successCriteria optionally sets nominal retirement and terminal thresholds. nonDepletionProbability reports basic no-shortfall success separately. Runs without seed are stochastic; a supplied seed makes identical inputs repeatable for the same implementation version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accumulationVolatility": {
                "default": 15,
                "description": "Annual accumulation return volatility in percentage points.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "currentAge": {
                "description": "Age today.",
                "minimum": 18,
                "type": "integer"
              },
              "currentSavings": {
                "description": "Current investable savings balance in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "distributionVolatility": {
                "default": 10,
                "description": "Annual retirement return volatility in percentage points.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "endAge": {
                "default": 90,
                "description": "Planning horizon age (default 90).",
                "type": "integer"
              },
              "expectedAnnualReturn": {
                "default": 6,
                "description": "Annual percentage value (e.g. 2.5 for 2.5%). Supply the actual rate unless the user accepts a stated modelling default.",
                "type": "number"
              },
              "expectedAnnualReturnRetirement": {
                "default": 4,
                "description": "Annual percentage value (e.g. 2.5 for 2.5%). Supply the actual rate unless the user accepts a stated modelling default.",
                "type": "number"
              },
              "inflationRate": {
                "default": 2.5,
                "description": "Annual percentage value (e.g. 2.5 for 2.5%). Supply the actual rate unless the user accepts a stated modelling default.",
                "type": "number"
              },
              "medicalShocks": {
                "additionalProperties": false,
                "description": "Optional acute-medical and long-term-care sampling assumptions. Medical and market paths are seeded independently.",
                "properties": {
                  "acuteEnabled": {
                    "default": false,
                    "type": "boolean"
                  },
                  "acuteEndProbPct": {
                    "default": 9,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "acuteSevereCost": {
                    "default": 25000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "acuteStartProbPct": {
                    "default": 2,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "acuteTypicalCost": {
                    "default": 4000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "ltcAnnualCost": {
                    "default": 18000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "ltcEnabled": {
                    "default": false,
                    "type": "boolean"
                  },
                  "ltcEntryCost": {
                    "default": 6000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "ltcLifetimeProbPct": {
                    "default": 25,
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "ltcMaxYears": {
                    "default": 4,
                    "minimum": 1,
                    "type": ["integer", "null"]
                  },
                  "ltcStartAge": {
                    "default": 80,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["acuteEnabled", "acuteEndProbPct", "acuteSevereCost", "acuteStartProbPct", "acuteTypicalCost", "ltcAnnualCost", "ltcEnabled", "ltcEntryCost", "ltcLifetimeProbPct", "ltcMaxYears", "ltcStartAge"],
                "type": "object"
              },
              "monthlyContribution": {
                "description": "Monthly contribution until retirement in EUR.",
                "type": "number"
              },
              "monthlyDrawdown": {
                "description": "Planned monthly withdrawal in retirement in EUR.",
                "type": "number"
              },
              "pensionStreams": {
                "description": "Optional annual pension streams that offset retirement drawdown. Concurrent streams are aggregated before applying progressive tax, the single 2026 foreign-pension €5,000 allowance, and the shared personal GESY ceiling. A supplied netAnnualOverride is treated as already net and is used as-is.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "fxRateToEur": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "grossAnnual": {
                      "minimum": 0,
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["cyprus", "foreign"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "netAnnualOverride": {
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "startAge": {
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["currency", "fxRateToEur", "grossAnnual", "id", "kind", "name", "startAge"],
                  "type": "object"
                },
                "type": "array"
              },
              "retirementAge": {
                "description": "Planned retirement age.",
                "minimum": 18,
                "type": "integer"
              },
              "returnOverrides": {
                "additionalProperties": false,
                "description": "Optional age-keyed replacement annual nominal return percentages. Each listed age replaces its simulated and deterministic return; the market draw is still consumed so later seeded years remain aligned.",
                "patternProperties": {
                  "^\\d{1,3}$": {
                    "description": "Replacement annual return percentage at this age.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "seed": {
                "description": "Optional unsigned 32-bit seed for repeatable runs with identical inputs and implementation versions. Omit to keep the run stochastic.",
                "maximum": 4294967295,
                "minimum": 0,
                "type": "integer"
              },
              "simulations": {
                "default": 1000,
                "description": "Monte Carlo runs (default 1000).",
                "maximum": 5000,
                "minimum": 100,
                "type": "integer"
              },
              "statePension": {
                "description": "Expected monthly state pension in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "successCriteria": {
                "additionalProperties": false,
                "description": "Optional nominal thresholds that make success stricter than basic non-depletion.",
                "properties": {
                  "retirementHurdleNominal": {
                    "description": "Minimum nominal balance required at retirement age, EUR.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "terminalFloorNominal": {
                    "description": "Minimum nominal balance required at endAge, EUR.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "required": ["currentAge", "currentSavings", "monthlyContribution", "monthlyDrawdown", "retirementAge"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Typed machine-readable tool result.",
            "properties": {
              "acuteRunRate": {
                "type": "number"
              },
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["field", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "averageDepletionAge": {
                "type": ["number", "null"]
              },
              "deterministicFinalBalance": {
                "type": "number"
              },
              "ltcRunRate": {
                "type": "number"
              },
              "medianDepletionAge": {
                "type": ["number", "null"]
              },
              "medianTerminalWealth": {
                "type": "number"
              },
              "nonDepletionProbability": {
                "type": "number"
              },
              "series": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "chartId": {
                      "type": "string"
                    },
                    "points": {
                      "items": {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "xKey": {
                      "type": "string"
                    },
                    "yKeys": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["chartId", "points", "xKey", "yKeys"],
                  "type": "object"
                },
                "type": "array"
              },
              "shockRunRate": {
                "type": "number"
              },
              "successProbability": {
                "type": "number"
              },
              "worstCase10thPercentileBalance": {
                "type": "number"
              }
            },
            "required": ["acuteRunRate", "assumptions", "averageDepletionAge", "deterministicFinalBalance", "ltcRunRate", "medianDepletionAge", "medianTerminalWealth", "nonDepletionProbability", "shockRunRate", "successProbability", "worstCase10thPercentileBalance"],
            "type": "object"
          },
          "behavior": {
