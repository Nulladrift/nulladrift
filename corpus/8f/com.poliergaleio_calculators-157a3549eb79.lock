        {
          "name": "calculate_cyprus_state_pension",
          "description": "Estimates the Cyprus state (contributory) pension amount at retirement using official contribution schedules and current 2026 pension income-tax bands, based on accumulated insurance units and contribution history. Use to estimate contributory Cyprus state pension entitlement and amount at retirement. Results apply the current 2026 pension income-tax bands; projected contribution amounts use the published SI rate increases in 2029, 2034 and 2039. Reuse supplied facts and ask only for missing essentials: mode and retirement age are always required; quick mode also needs current age, years worked and total insurance units; advanced mode needs the actual non-empty yearly contribution record. Ask for dependants or state the zero-dependants assumption before presenting a personalized result. Never infer contribution history or eligibility facts. Missing insurance-statement facts leave qualifiesForPension null and a conditional amount estimate; special/cross-border routes require assessment. Units are per calendar year; a legacy year-to-units map is accepted.",
          "inputSchema": {
            "allOf": [
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "quick"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "required": ["currentAge", "totalInsuranceUnits", "yearsWorked"]
                }
              },
              {
                "if": {
                  "properties": {
                    "mode": {
                      "const": "advanced"
                    }
                  },
                  "required": ["mode"]
                },
                "then": {
                  "required": ["yearlyUnits"]
                }
              }
            ],
            "properties": {
              "currentAge": {
                "description": "Current age (quick mode only).",
                "maximum": 70,
                "minimum": 18,
                "type": "integer"
              },
              "dependentSpouse": {
                "description": "Confirmed eligibility for a dependent-spouse pension increase; not merely married.",
                "type": "boolean"
              },
              "dependents": {
                "description": "Legacy estimated dependant count. It cannot identify an eligible spouse; use dependentSpouse and otherDependents for the statutory tier.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "eligibilityFacts": {
                "additionalProperties": false,
                "properties": {
                  "actualBasicInsurancePoints": {
                    "description": "Actual paid basic insurance points at claim date; credited points do not satisfy the actual-points condition.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "referencePeriodYears": {
                    "description": "Reference period from the insurance statement, including applicable statutory exclusions.",
                    "exclusiveMinimum": 0,
                    "maximum": 70,
                    "type": "number"
                  },
                  "standardDomesticCase": {
                    "description": "Confirm the ordinary domestic route, without special invalidity, miner or cross-border provisions. False or omitted leaves eligibility undetermined.",
                    "type": "boolean"
                  },
                  "totalBasicInsurancePoints": {
                    "description": "Paid plus credited BASIC points, not total basic-plus-supplementary insurance units.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "weeksSinceFirstInsurance": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "mode": {
                "description": "Calculation mode.",
                "enum": ["quick", "advanced"],
                "type": "string"
              },
              "otherDependents": {
                "description": "Other confirmed eligible dependants; increase is capped at two. Supply with dependentSpouse for an exact dependant tier.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "retirementAge": {
                "description": "Planned retirement age.",
                "maximum": 67,
                "minimum": 63,
                "type": "integer"
              },
              "totalInsuranceUnits": {
                "description": "Actual accumulated Cyprus insurance units/points (quick mode); do not infer from salary or years worked.",
                "minimum": 0,
                "type": "number"
              },
              "yearlyUnits": {
                "additionalProperties": false,
                "description": "Advanced mode only. Insurance units earned per calendar year, e.g. [{\"year\":2003,\"units\":5.2}]. Units per year must be between 0 and the statutory maximum for that year (about 5.3-6.0; 6.0 for years after 2026). A legacy object map {\"2003\": 5.2} is also accepted. Years worked and total units are derived from this array, so yearsWorked/totalInsuranceUnits are ignored in advanced mode.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "units": {
                      "description": "Insurance units earned that year.",
                      "maximum": 6,
                      "minimum": 0,
                      "type": "number"
                    },
                    "year": {
                      "description": "Calendar year of the contributions.",
                      "minimum": 1981,
                      "type": "integer"
                    }
                  },
                  "required": ["units", "year"],
                  "type": "object"
                },
                "minItems": 1,
                "patternProperties": {
                  "^[0-9]{4}$": {
                    "maximum": 6,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": ["array", "object"]
              },
              "yearsWorked": {
                "description": "Actual years with insurance contributions (quick mode); do not infer from age or employment duration.",
                "maximum": 49,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["mode", "retirementAge"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Typed machine-readable tool result.",
            "properties": {
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["field", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "basicPensionComponent": {
                "type": "number"
              },
              "earningsRelatedComponent": {
                "type": "number"
              },
              "eligibility": {
                "additionalProperties": false,
                "properties": {
                  "reasons": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "status": {
                    "enum": ["eligible", "ineligible", "undetermined"],
                    "type": "string"
                  }
                },
                "required": ["reasons", "status"],
                "type": "object"
              },
              "estimateAssumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "estimatedAnnualPension": {
                "type": "number"
              },
              "estimatedMonthlyPension": {
                "type": "number"
              },
              "ghsDeduction": {
                "type": "number"
              },
              "incomeTax": {
                "type": "number"
              },
              "minimumPensionApplied": {
                "type": "boolean"
              },
              "monthlyNet": {
                "type": "number"
              },
              "qualifiesForPension": {
                "type": ["boolean", "null"]
              },
              "series": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "chartId": {
                      "type": "string"
                    },
                    "points": {
                      "items": {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "xKey": {
                      "type": "string"
                    },
                    "yKeys": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["chartId", "points", "xKey", "yKeys"],
                  "type": "object"
                },
                "type": "array"
              },
              "totalUnits": {
                "type": "number"
              },
              "weeklyGross": {
                "type": "number"
              },
              "yearsWorked": {
                "type": "number"
              }
            },
            "required": ["assumptions", "basicPensionComponent", "earningsRelatedComponent", "eligibility", "estimateAssumptions", "estimatedAnnualPension", "estimatedMonthlyPension", "ghsDeduction", "incomeTax", "minimumPensionApplied", "monthlyNet", "qualifiesForPension", "totalUnits", "weeklyGross", "yearsWorked"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "apiVersion": "18.1.0",
            "changedIn": ["18.0.0", "14.0.0", "7.0.0", "5.0.0", "3.0.0", "2.0.0", "1.10.0", "1.2.0", "1.1.0"],
            "deprecated": false,
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "since": "1.0.0",
            "status": "stable",
