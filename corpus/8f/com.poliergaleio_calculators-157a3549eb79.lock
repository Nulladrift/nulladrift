        {
          "name": "analyze_portfolio",
          "description": "Analyzes portfolio transactions or holdings: invested capital, value, absolute/TWR returns, eligible single-deposit CAGR, sub-portfolio allocation, and FX conversion. CAGR is null with a reason after multiple contributions or withdrawals. Use to analyze actual portfolio ledgers or current holdings and valuation data. Require real transactions/holdings and a current valuation for each holding; require FX rates where currencies differ. TWR needs a valuation immediately before each later external cash flow and at the end date; report null with its reason when absent. Equal and opposite same-day movements between sleeves in the base currency net to an internal transfer for combined TWR; confirm both legs before using that treatment. Missing acquisition cost may use the disclosed performance-from-today behavior. Never create transactions or holdings records.",
          "inputSchema": {
            "properties": {
              "asOfDate": {
                "description": "Optional ISO date (YYYY-MM-DD) used as the CAGR end date. Defaults to today.",
                "type": "string"
              },
              "baseCurrency": {
                "description": "Reporting currency (e.g. EUR). Transactions in another currency require fxRate.",
                "type": "string"
              },
              "portfolioName": {
                "description": "Optional label for the portfolio.",
                "type": "string"
              },
              "subPortfolios": {
                "description": "One entry per account, broker or strategy sleeve.",
                "items": {
                  "allOf": [
                    {
                      "if": {
                        "properties": {
                          "type": {
                            "const": "holdings"
                          }
                        },
                        "required": ["type"]
                      },
                      "then": {
                        "required": ["holdings"]
                      }
                    },
                    {
                      "if": {
                        "properties": {
                          "type": {
                            "const": "cash_flow"
                          }
                        },
                        "required": ["type"]
                      },
                      "then": {
                        "required": ["transactions"]
                      }
                    }
                  ],
                  "properties": {
                    "cashBalance": {
                      "description": "Uninvested cash swept into a holdings sleeve's value (counts 1:1 on invested and current value).",
                      "minimum": 0,
                      "type": "number"
                    },
                    "cashLabel": {
                      "description": "Cash bucket label (e.g. emergency, savings, collateral, current).",
                      "type": "string"
                    },
                    "currency": {
                      "description": "Currency the transactions are denominated in.",
                      "type": "string"
                    },
                    "holdings": {
                      "description": "Positions for a holdings sleeve. Omitted avgCostPrice tracks returns from today (day-1 return 0%).",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "acquiredDate": {
                            "description": "Vintage powering per-holding CAGR (YYYY-MM-DD).",
                            "type": "string"
                          },
                          "asOfDate": {
                            "description": "Bar date of currentPrice (YYYY-MM-DD).",
                            "type": "string"
                          },
                          "avgCostPrice": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "currency": {
                            "type": "string"
                          },
                          "currentPrice": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "fxRate": {
                            "description": "Legacy alias for fxRateToBase.",
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "fxRateToBase": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "isin": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "notes": {
                            "type": "string"
                          },
                          "ownershipShare": {
                            "maximum": 1,
                            "minimum": 0,
                            "type": "number"
                          },
                          "shares": {
                            "exclusiveMinimum": 0,
                            "type": "number"
                          },
                          "symbol": {
                            "description": "Ticker, e.g. VWCE.",
                            "type": "string"
                          },
                          "yahooSymbol": {
                            "description": "Resolved Yahoo symbol, e.g. VWCE.MI.",
                            "type": "string"
                          }
                        },
                        "required": ["currentPrice", "shares", "symbol"],
                        "type": "object"
                      },
                      "maxItems": 200,
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "transactions": {
                      "description": "Ledger for cash_flow sleeves. May be empty for holdings sleeves (valued from holdings closes).",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "amount": {
                            "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                            "minimum": 0,
                            "type": "number"
                          },
                          "date": {
                            "description": "ISO date (YYYY-MM-DD).",
                            "type": "string"
                          },
                          "fxRate": {
