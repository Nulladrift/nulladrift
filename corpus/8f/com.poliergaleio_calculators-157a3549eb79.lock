                      "type": "number"
                    },
                    "year": {
                      "type": "integer"
                    }
                  },
                  "required": ["balance4YrAgo", "netExcessWithdrawals", "policyMature", "priorPremiums3Yr", "priorWithdrawals3Yr", "safeLimit", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "scenario": {
                "enum": ["maxTaxFree", "userInput", "noWithdrawals"],
                "type": "string"
              },
              "scenarioComparison": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "finalBalance": {
                      "type": "number"
                    },
