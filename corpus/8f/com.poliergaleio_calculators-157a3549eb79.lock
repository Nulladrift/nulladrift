        {
          "name": "optimize_company_director_remuneration",
          "description": "Optimizes Cyprus LTD company-director remuneration for monetary inputs up to €1,000,000, with a fixed solver evaluation budget. Use for a Cyprus LTD director remuneration comparison. Monetary inputs may not exceed €1,000,000; larger values are rejected before solving. Require company profit/revenue, deductible expenses, tax year and domicile status; reuse supplied data and request missing essentials. The default €2,000 corporate administration cost is a disclosed modelling assumption.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annualCorporateAdminCost": {
                "default": 2000,
                "description": "Annual corporate admin, audit and compliance costs in EUR (Cyprus Companies Law Cap. 113). Defaults to 2000; maximum €1,000,000.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "corporateGrossProfit": {
                "description": "Annual company turnover/revenue in EUR, before operating expenses. Maximum supported value: €1,000,000.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "directorSalaryAllocation": {
                "description": "Optional fixed director salary in EUR (maximum €1,000,000); omit to run the bounded solver for the optimal split.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "isNonDomiciled": {
                "description": "Non-dom status; exempts dividends from SDC.",
                "type": "boolean"
              },
              "operatingExpenses": {
                "description": "Annual deductible operating expenses in EUR (maximum €1,000,000).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "taxYear": {
                "description": "Tax/legislation year. Supported: 2025, 2026.",
                "enum": ["2025", "2026"],
                "type": "string"
              }
            },
            "required": ["corporateGrossProfit", "isNonDomiciled", "operatingExpenses", "taxYear"],
            "type": "object"
