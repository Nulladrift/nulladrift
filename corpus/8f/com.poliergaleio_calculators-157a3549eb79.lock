        {
          "name": "calculate_cyprus_capital_gains",
          "description": "Calculates Cyprus Capital Gains Tax on an immovable property disposal using 2025 or 2026 rules, including CPI indexation, year-specific lifetime exemptions, the 20% CGT rate and the 0.4% property transfer fee. Use for Cyprus capital-gains tax on an immovable-property sale. Obtain the actual acquisition price and year, disposal tax year, sale price and property type; ask for missing essentials. Tax-year rules default to 2026; supply 2025 for a disposal in that year. Currency defaults to EUR only as a modelling convention. Omission of isFirstDisposal means no lifetime exemption is claimed; do not infer eligibility.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "acquisitionPrice": {
                "description": "Purchase price in the original currency.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "acquisitionYear": {
                "description": "Calendar year the property was acquired.",
                "minimum": 1960,
                "type": "integer"
              },
              "agentFees": {
                "description": "Estate agent / legal fees deducted from the sale price, EUR.",
                "minimum": 0,
                "type": "number"
              },
              "currency": {
                "default": "EUR",
                "description": "EUR (default) or CYP for pre-2008 purchases (converted at 0.585274).",
                "enum": ["EUR", "CYP"],
                "type": "string"
              },
              "isFirstDisposal": {
                "description": "Whether the lifetime first-disposal exemption is being claimed. Omission means no exemption is claimed.",
                "type": "boolean"
              },
              "propertyType": {
                "description": "Drives the year-specific lifetime exemption: 2025 general/plot €17,086, qualifying main residence €85,430 and agricultural land €25,629; 2026 general/plot €30,000, qualifying main residence €150,000 and agricultural land €50,000; other €0.",
                "enum": ["plot", "house", "agricultural", "other"],
                "type": "string"
              },
              "salePrice": {
                "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "taxYear": {
                "default": "2026",
                "description": "Disposal tax year; defaults to the current 2026 rules and selects year-specific lifetime allowances.",
                "enum": ["2025", "2026"],
                "type": "string"
              }
            },
            "required": ["acquisitionPrice", "acquisitionYear", "propertyType", "salePrice"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Typed machine-readable tool result.",
            "properties": {
              "acquisitionPriceEUR": {
                "type": "number"
              },
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["field", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "capitalGainsTax": {
                "type": "number"
              },
              "currentValuation": {
                "type": "number"
              },
              "netProceeds": {
                "type": "number"
              },
              "netSalePrice": {
                "type": "number"
              },
              "propertyTransferFee": {
                "type": "number"
              },
              "series": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "chartId": {
                      "type": "string"
                    },
                    "points": {
                      "items": {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "xKey": {
                      "type": "string"
                    },
                    "yKeys": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["chartId", "points", "xKey", "yKeys"],
                  "type": "object"
                },
                "type": "array"
              },
              "taxExemption": {
                "type": "number"
              },
              "taxableGain": {
                "type": "number"
              },
              "totalTaxDue": {
                "type": "number"
              }
            },
            "required": ["acquisitionPriceEUR", "assumptions", "capitalGainsTax", "currentValuation", "netProceeds", "netSalePrice", "propertyTransferFee", "taxExemption", "taxableGain", "totalTaxDue"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
