        {
          "name": "plan_monthly_budget",
          "description": "Builds a monthly budget from a list of expenses at any frequency: normalises everything to a monthly basis, tiers each item (T1 fixed essentials, T2 variable essentials, T3 lifestyle, T4 discretionary), and returns cash-basis disposable income, savings rate after expenses and investments, the biggest optimisable leak and a surplus projection; deficit months clamp savings at zero. Use to summarize a household's actual monthly net income and expense items. Ask for the actual expense ledger or item amounts; never fabricate expenses. Entries without a frequency are treated as monthly and disclosed. Omitted investment contributions are treated as zero and disclosed.",
          "inputSchema": {
            "properties": {
              "expectedAnnualReturn": {
                "default": 0,
                "description": "Assumed annual return on invested surplus, percent (default 0).",
                "type": "number"
              },
              "expenses": {
                "description": "Expense items. Known catalogue keys (mortgageRent, groceries, netflix, fuel, ...) are tiered automatically; otherwise pass an explicit tier.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "EUR amount. Supply the actual value when applicable; use 0 only when confirmed to be zero.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "category": {
                      "description": "Optional grouping label (housing, transportation, ...).",
                      "type": "string"
                    },
                    "frequency": {
                      "default": "monthly",
                      "description": "Payment frequency; everything is normalised to monthly. Default monthly.",
                      "enum": ["monthly", "weekly", "quarterly", "semiannual", "yearly", "oneoff"],
                      "type": "string"
                    },
                    "key": {
                      "description": "Catalogue key or free-form label.",
                      "type": "string"
                    },
                    "tier": {
                      "description": "Override the automatic tier.",
                      "enum": ["T1", "T2", "T3", "T4"],
                      "type": "string"
                    }
                  },
                  "required": ["amount", "key"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "monthlyInvestments": {
                "description": "Recurring monthly investments/savings, EUR.",
                "minimum": 0,
                "type": "number"
              },
              "monthlyNetIncome": {
                "description": "Take-home monthly income, EUR (net of tax, social insurance and GESY); zero is valid but savings rate is unavailable.",
                "minimum": 0,
                "type": "number"
              },
              "projectionYears": {
                "default": 10,
                "description": "Horizon of the surplus projection (default 10).",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "targetSavingsRate": {
                "description": "Savings-rate goal as a percent of net income.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["expenses", "monthlyNetIncome"],
            "type": "object"
          },
          "outputSchema": {
