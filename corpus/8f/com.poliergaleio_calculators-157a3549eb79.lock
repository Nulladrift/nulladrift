        {
          "name": "audit_mortgage_statement",
          "description": "Forensic audit of a mortgage statement: replays the loan day by day and grid-searches the bank's interest convention (Actual/365, Actual/360 or Actual/Actual day count; monthly, semi-annual or annual capitalisation; exact or 2-decimal daily rounding), ranks candidates by RMS error against the bank's own running balance, and reports the interest overcharge implied by the best fit. Use to audit an actual mortgage statement. Require statement rows, at least one usable interest rate and balance checkpoints sufficient to fit the calculation. Reuse only extracted facts; inferred day-count and capitalization conventions are estimates, not confirmed bank terms.",
          "inputSchema": {
            "properties": {
              "includeRowDetail": {
                "description": "Include the per-row expected balance / delta / flag detail (can be large).",
                "type": "boolean"
              },
              "rows": {
                "description": "Parsed statement rows in chronological order. At least one row must carry ratePct.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "balanceAfter": {
                      "description": "Outstanding balance the statement reports after this row, EUR. Used as the fit checkpoint.",
                      "type": "number"
                    },
                    "date": {
                      "description": "ISO date (YYYY-MM-DD).",
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "kind": {
                      "description": "Row type. interest_post rows are the bank's own interest charges and are what the audit compares against.",
                      "enum": ["drawdown", "payment", "interest_post", "fee", "adjustment", "other"],
                      "type": "string"
                    },
                    "ratePct": {
                      "description": "Annual nominal rate in effect from this row onwards, percent.",
                      "maximum": 30,
                      "minimum": 0,
                      "type": "number"
                    },
                    "signedAmount": {
                      "description": "Positive increases the outstanding balance (drawdown, interest posting, fee); negative reduces it (payment).",
                      "type": "number"
                    }
                  },
                  "required": ["date", "signedAmount"],
                  "type": "object"
                },
                "maxItems": 2000,
                "minItems": 1,
                "type": "array"
              },
              "rules": {
                "description": "Skip the grid search and test one explicit convention.",
                "properties": {
                  "capitalization": {
                    "enum": ["daily", "monthly", "quarterly", "semiannual", "annual"],
                    "type": "string"
                  },
                  "capitalizationAnchor": {
                    "enum": ["month_end", "first_disbursement", "fixed_dates"],
                    "type": "string"
                  },
                  "dailyRounding": {
                    "description": "Decimals for daily interest rounding, or null for exact.",
                    "type": ["number", "null"]
                  },
                  "dayCount": {
                    "oneOf": [
                      {
                        "enum": [360, 365],
                        "type": "number"
                      },
                      {
                        "enum": ["actual"],
                        "type": "string"
                      }
                    ]
                  },
                  "fixedCapDates": {
                    "items": {
                      "description": "MM-DD",
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "ignoreBankCapRows": {
                    "description": "Do not add the bank's own interest postings to the simulated balance (default true).",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "topN": {
                "default": 3,
                "description": "How many ranked candidate conventions to return (default 3).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Typed machine-readable tool result.",
            "properties": {
              "assumptions": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["field", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "bankInterest": {
                "type": "number"
              },
              "bestFitLabel": {
                "type": "string"
              },
              "bestFitRules": {
                "additionalProperties": true,
                "properties": {
                  "capitalization": {
                    "type": "string"
                  },
                  "capitalizationAnchor": {
                    "type": "string"
                  },
                  "dailyRounding": {
                    "type": ["number", "null"]
                  },
                  "dayCount": {
                    "anyOf": [
                      {
                        "enum": [360, 365],
                        "type": "integer"
                      },
                      {
                        "const": "actual",
                        "type": "string"
                      }
                    ]
                  },
                  "fixedCapDates": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "ignoreBankCapRows": {
                    "type": "boolean"
                  }
                },
                "required": [],
                "type": "object"
              },
              "equivalentCandidateCount": {
                "type": "integer"
              },
              "equivalentCandidates": {
