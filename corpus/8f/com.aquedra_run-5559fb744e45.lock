        {
          "name": "reproject_geojson",
          "title": "Reproject GeoJSON",
          "description": "Reprojects every coordinate of a GeoJSON from one CRS to another (EPSG:4326, 3857, 4674, 5361, 32718, 32719 or a WGS84 UTM zone) and returns the GeoJSON. To convert individual points to degrees-minutes-seconds or UTM text use convert_coordinates, and to read a CSV, KML, GPX or Shapefile use convert_geo_file. Takes a GeoJSON of up to 50,000 features and 200,000 vertices, and up to 1 MiB of arguments. Costs US$0.001 per unit (up to 1,000 features and 10,000 vertices) from prepaid credits; with the default 3 s it is charged only when it succeeds, and invalid input is never charged. Set dry_run to true to get the price without charging and max_cost_usd to refuse a call that would cost more; for heavier inputs set max_seconds from 4 to 30, where each second over the 3 included costs US$0.0005, the full time is held up front and the unused part refunded, and the price and the time used are charged if the call runs out of time or memory, or is cancelled while running.",
