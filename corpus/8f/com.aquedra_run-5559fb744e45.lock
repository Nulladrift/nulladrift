        {
          "name": "convert_coordinates",
          "title": "Convert coordinates",
          "description": "Converts up to 1,000 points between decimal degrees (dd), degrees-minutes-seconds (dms) and UTM, and returns each point in the requested output formats, in the input order. To change the coordinate reference system of a GeoJSON use reproject_geojson. Takes up to 1,000 points per call (WGS84 latitude and longitude, or UTM zone, hemisphere, easting and northing). Costs US$0.001 per unit (up to 1,000 points) from prepaid credits; with the default 3 s it is charged only when it succeeds, and invalid input is never charged. Set dry_run to true to get the price without charging and max_cost_usd to refuse a call that would cost more; for heavier inputs set max_seconds from 4 to 30, where each second over the 3 included costs US$0.0005, the full time is held up front and the unused part refunded, and the price and the time used are charged if the call runs out of time or memory, or is cancelled while running.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Convert points between decimal degrees, degrees-minutes-seconds and UTM.",
            "properties": {
              "dry_run": {
                "description": "When true, return the price (cost_usd) and units of this call without running it or charging anything.",
                "type": "boolean"
              },
              "from": {
                "description": "Format of the input points: dd (decimal degrees), dms (degrees-minutes-seconds text) or utm.",
                "enum": ["dd", "dms", "utm"],
                "type": "string"
              },
              "max_cost_usd": {
                "description": "The most this call may cost, in USD, as a number or decimal text with at most 6 decimals (e.g. 0.01 or \"0.01\"). A call that would cost more is refused with 402 max_cost_exceeded and nothing is charged.",
                "type": ["number", "string"]
              },
              "max_seconds": {
                "description": "Compute time limit in seconds, 1 to 30 (default 3; 1 to 3 all use the standard 3 s). The price includes 3 s of compute. From 4 to 30 (extended time) the call runs on a separate lane, where buffer accepts larger inputs, and each second over 3 costs the geo_compute_second price: the price plus all those seconds is held at the start (that is what dry_run reports and max_cost_usd is compared with), the seconds not used are refunded, and the response adds compute_ms and max_seconds. With extended time the price and the time used are charged if the call runs out of time or memory, or is cancelled while running: 422 operation_too_complex keeps the whole hold, 422 operation_too_large or 413 result_too_large (a result over 8 MiB) or 499 cancelled keep the price and the seconds used, and those errors carry cost_usd. Any other failure is refunded in full. For the elevation operations (elevation, profile and terrain), running out of time is 503 terrain_unavailable, refunded in full on both lanes, never 422 operation_too_complex.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "points": {
                "description": "Up to 1000 points. Each is {lat, lon} for dd, a text for dms, or {zone, hemisphere, easting, northing} for utm, matching `from`.",
                "items": {
                  "anyOf": [
                    {
                      "properties": {
                        "lat": {
                          "description": "Latitude in decimal degrees (-90 to 90).",
                          "maximum": 90,
                          "minimum": -90,
                          "type": "number"
                        },
                        "lon": {
                          "description": "Longitude in decimal degrees (-180 to 180).",
                          "maximum": 180,
                          "minimum": -180,
                          "type": "number"
                        }
                      },
                      "required": ["lat", "lon"],
                      "type": "object"
                    },
                    {
                      "description": "Latitude then longitude as degrees-minutes-seconds text, e.g. 33°26'56\"S 70°40'09\"W (separated by a space, comma or semicolon).",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "easting": {
                          "description": "UTM easting in meters.",
                          "type": "number"
                        },
                        "hemisphere": {
                          "description": "UTM hemisphere: N or S.",
                          "enum": ["N", "S"],
                          "type": "string"
                        },
                        "northing": {
                          "description": "UTM northing in meters.",
                          "type": "number"
                        },
                        "zone": {
                          "description": "UTM zone number (1 to 60).",
                          "maximum": 60,
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["easting", "hemisphere", "northing", "zone"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "to": {
                "description": "Output formats to return for every point (1 to 3 of dd, dms, utm).",
                "items": {
                  "enum": ["dd", "dms", "utm"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["from", "points", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "balance_usd": {
                "description": "Credit balance after the charge, US dollars as decimal text; absent with dry_run.",
                "type": "string"
              },
              "call_id": {
                "description": "Server-issued id of the call; absent with dry_run.",
                "type": "string"
              },
              "compute_ms": {
                "description": "Extended time only: the compute time the call was billed on, in milliseconds.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "cost_usd": {
                "description": "What the call cost (or would cost, with dry_run), US dollars as decimal text.",
                "type": "string"
              },
