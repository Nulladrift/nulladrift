        {
          "name": "convert_geo_file",
          "title": "Convert geospatial file",
          "description": "Converts a geospatial file (CSV, KML, GPX, GeoJSON or a zipped Shapefile as base64 text) to GeoJSON, KML or CSV and returns the converted text with the feature count. To reproject or measure features that are already GeoJSON use reproject_geojson or measure_geojson. Takes text content up to 1 MiB, or a Shapefile zip of up to about 750 KB, within 1 MiB of arguments and up to 50,000 features and 200,000 vertices. Costs US$0.01 per file from prepaid credits; with the default 3 s it is charged only when it succeeds, and invalid input is never charged. Set dry_run to true to get the price without charging and max_cost_usd to refuse a call that would cost more; for heavier inputs set max_seconds from 4 to 30, where each second over the 3 included costs US$0.0005, the full time is held up front and the unused part refunded, and the price and the time used are charged if the call runs out of time or memory, or is cancelled while running.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Convert a geospatial file between CSV, KML, GPX, GeoJSON and Shapefile.",
            "properties": {
              "content": {
                "description": "The file content as text. Size limits: csv 1 MiB (at most 200 columns, 50,000 rows and 200,000 cells), kml 1 MiB, gpx 1 MiB, geojson 1 MiB. For shapefile, a base64-encoded .zip (a bare .shp is not accepted) of up to ~750 KB (the whole request must fit in 1 MiB), which may expand to at most 8 MiB of .shp/.dbf/.prj/.cpg parts. csv and kml output accept at most 200 distinct property keys; csv output at most 200,000 cells (features x keys), kml output at most 20,000 features and 80,000 cells.",
                "minLength": 1,
                "type": "string"
              },
              "dry_run": {
                "description": "When true, return the price (cost_usd) and units of this call without running it or charging anything.",
                "type": "boolean"
              },
              "input_format": {
                "description": "Format of `content`.",
                "enum": ["csv", "kml", "gpx", "geojson", "shapefile"],
                "type": "string"
              },
              "max_cost_usd": {
                "description": "The most this call may cost, in USD, as a number or decimal text with at most 6 decimals (e.g. 0.01 or \"0.01\"). A call that would cost more is refused with 402 max_cost_exceeded and nothing is charged.",
                "type": ["number", "string"]
              },
              "max_seconds": {
                "description": "Compute time limit in seconds, 1 to 30 (default 3; 1 to 3 all use the standard 3 s). The price includes 3 s of compute. From 4 to 30 (extended time) the call runs on a separate lane, where buffer accepts larger inputs, and each second over 3 costs the geo_compute_second price: the price plus all those seconds is held at the start (that is what dry_run reports and max_cost_usd is compared with), the seconds not used are refunded, and the response adds compute_ms and max_seconds. With extended time the price and the time used are charged if the call runs out of time or memory, or is cancelled while running: 422 operation_too_complex keeps the whole hold, 422 operation_too_large or 413 result_too_large (a result over 8 MiB) or 499 cancelled keep the price and the seconds used, and those errors carry cost_usd. Any other failure is refunded in full. For the elevation operations (elevation, profile and terrain), running out of time is 503 terrain_unavailable, refunded in full on both lanes, never 422 operation_too_complex.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "output_format": {
                "description": "Format to convert to.",
                "enum": ["geojson", "kml", "csv"],
                "type": "string"
              },
              "x_field": {
                "description": "CSV only: name of the longitude (x) column. Detected automatically when omitted.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "y_field": {
                "description": "CSV only: name of the latitude (y) column. Detected automatically when omitted.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["content", "input_format", "output_format"],
            "type": "object"
          },
