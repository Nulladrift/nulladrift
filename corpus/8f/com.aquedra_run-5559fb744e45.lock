                "type": "string"
              },
              "pack_usd": {
                "description": "Credit pack in US dollars; 1 credit = US$1.",
                "enum": [5, 20, 50, 100],
                "type": "number"
              }
            },
            "required": ["pack_usd"],
            "type": "object"
          },
