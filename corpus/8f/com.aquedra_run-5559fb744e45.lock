      "instructions": "Aquedra Run sells GIS tools for AI agents, priced per call and paid with prepaid credits (1 credit = US$1). This connection has GIS tools (convert_coordinates, measure_geojson, reproject_geojson, transform_geojson, convert_geo_file, get_elevation, elevation_profile, analyze_terrain), each call charging its listed price from the credits (dry_run returns the price without charging), and can read the account's usage and buy credits. Elevation results carry a Copernicus attribution that must be kept when they are shared. The chat tool answers with open models on Aquedra Run's own GPUs on a best-effort basis: when they are busy it fails with gpu_busy and retry_after_seconds, and nothing is charged. Credit packs are not on sale yet. Never buy credits or pay unless the user asked for it, and never pay again for a payment reported as pending. Money amounts are US dollars as decimal text.",
      "tools": [
        {
          "name": "analyze_terrain",
          "title": "Terrain analysis",
          "description": "Returns the area and surface area, elevation statistics, slope and aspect of a GeoJSON Polygon or MultiPolygon from the pixels of Copernicus DEM, a surface model (DSM) whose heights include buildings and trees, in metres above EGM2008 inside it, with the result's dem and attribution. For the elevation of points use get_elevation, and along a line use elevation_profile. Takes a polygon of up to 100 km² and 10,000 vertices, within up to 16 DEM blocks (about 120 x 120 km near the equator; each 90 m GLO-90 block counts as 4) and a bounding box of up to 4,194,304 DEM pixels. Costs US$0.002 per unit (up to 4 km² of polygon area) from prepaid credits; with the default 3 s it is charged only when it succeeds, and invalid input is never charged. Set dry_run to true to get the price without charging and max_cost_usd to refuse a call that would cost more; for heavier inputs set max_seconds from 4 to 30, where each second over the 3 included costs US$0.0005, the full time is held up front and the unused part refunded, and running out of time is 503 terrain_unavailable, refunded in full on both lanes, never 422 operation_too_complex.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Terrain of a polygon from the DEM pixels whose centres fall inside it: area and surface area, elevation statistics, Horn slope and aspect, area-weighted. Elevations come from Copernicus DEM (GLO-30, GLO-90 where GLO-30 is missing), a surface model that includes buildings and vegetation, in metres above the EGM2008 geoid; the ocean is 0 m.",
            "properties": {
              "dry_run": {
                "description": "When true, return the price (cost_usd) and units of this call without running it or charging anything.",
                "type": "boolean"
              },
              "geojson": {
                "additionalProperties": {},
                "description": "A GeoJSON Polygon or MultiPolygon, or a Feature of one, in WGS84 longitude/latitude: at most 10,000 vertices and 100 km² of geodesic area, not crossing the antimeridian.",
                "properties": {
                  "type": {
                    "description": "GeoJSON type: Polygon or MultiPolygon, or Feature with one as its geometry.",
                    "enum": ["Polygon", "MultiPolygon", "Feature"],
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "max_cost_usd": {
                "description": "The most this call may cost, in USD, as a number or decimal text with at most 6 decimals (e.g. 0.01 or \"0.01\"). A call that would cost more is refused with 402 max_cost_exceeded and nothing is charged.",
                "type": ["number", "string"]
              },
              "max_seconds": {
                "description": "Compute time limit in seconds, 1 to 30 (default 3; 1 to 3 all use the standard 3 s). The price includes 3 s of compute. From 4 to 30 (extended time) the call runs on a separate lane, where buffer accepts larger inputs, and each second over 3 costs the geo_compute_second price: the price plus all those seconds is held at the start (that is what dry_run reports and max_cost_usd is compared with), the seconds not used are refunded, and the response adds compute_ms and max_seconds. With extended time the price and the time used are charged if the call runs out of time or memory, or is cancelled while running: 422 operation_too_complex keeps the whole hold, 422 operation_too_large or 413 result_too_large (a result over 8 MiB) or 499 cancelled keep the price and the seconds used, and those errors carry cost_usd. Any other failure is refunded in full. For the elevation operations (elevation, profile and terrain), running out of time is 503 terrain_unavailable, refunded in full on both lanes, never 422 operation_too_complex.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["geojson"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "balance_usd": {
                "description": "Credit balance after the charge, US dollars as decimal text; absent with dry_run.",
                "type": "string"
              },
              "call_id": {
                "description": "Server-issued id of the call; absent with dry_run.",
                "type": "string"
              },
              "compute_ms": {
                "description": "Extended time only: the compute time the call was billed on, in milliseconds.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "cost_usd": {
                "description": "What the call cost (or would cost, with dry_run), US dollars as decimal text.",
                "type": "string"
              },
              "dry_run": {
                "const": true,
                "description": "True when nothing was run or charged.",
                "type": "boolean"
              },
              "max_seconds": {
                "description": "Extended time only: the max_seconds the call ran (or would run) with.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "result": {
                "description": "The operation's result; absent with dry_run."
              },
              "units": {
                "description": "Price units the input measured.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["cost_usd", "units"],
            "type": "object"
