        {
          "name": "chat",
          "title": "Chat with an open model",
          "description": "Answers a chat with open models on Aquedra Run's own GPUs: qwen3-8b (reasons before answering, and those tokens count as output and use up max_tokens, so set max_tokens to at least 1024); qwen2.5-3b (small text model for simple tasks); qwen2.5-coder-7b (code); qwen2.5-vl-7b (reads data: images). It runs only on idle GPUs: if the GPUs are busy the call fails with gpu_busy and retry_after_seconds, and nothing is charged. Limits are 8192 tokens of context, up to 2048 output tokens (a larger max_tokens is lowered to that, and the result then has max_tokens_requested) and 1 MiB of arguments, with no tools, JSON mode or embeddings; qwen2.5-vl-7b takes up to 2 inline data: images of up to 512 KB each, which together must fit in the 1 MiB. Costs per million tokens (input/output): qwen3-8b US$0.18/US$0.70, qwen2.5-3b US$0.05/US$0.10, qwen2.5-coder-7b US$0.025/US$0.05, qwen2.5-vl-7b US$0.18/US$0.69; minimum US$0.0005 per call, taken from prepaid credits and charged only when the call works; prompts and answers are not stored. Set dry_run to true to get the maximum a call can cost and max_cost_usd to refuse a call that could cost more.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dry_run": {
                "description": "When true, return the most this call can cost (cost_usd, the hold) and the max_tokens it assumes, without running it or charging anything.",
                "type": "boolean"
              },
              "max_completion_tokens": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Same as max_tokens; wins when both are sent."
              },
              "max_cost_usd": {
                "description": "The most this call may cost, in USD, as a number or decimal text with at most 6 decimals (e.g. 0.01 or \"0.01\"). A call that would cost more is refused with 402 max_cost_exceeded and nothing is charged.",
                "type": ["number", "string"]
              },
              "max_tokens": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Most tokens to generate, default 1024. A larger value than the output cap (max_output_tokens in GET /v1/models) is lowered to it, and the response says so in max_tokens and max_tokens_requested. qwen3-8b's reasoning counts toward it: send at least 1024."
              },
              "messages": {
                "description": "The conversation, 1 to 64 messages.",
                "items": {
                  "properties": {
                    "content": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "items": {
                            "oneOf": [
                              {
                                "description": "A text part.",
                                "properties": {
                                  "text": {
                                    "type": "string"
                                  },
                                  "type": {
                                    "const": "text",
                                    "type": "string"
                                  }
                                },
                                "required": ["text", "type"],
                                "type": "object"
                              },
                              {
                                "description": "An inline image as a data:image/png|jpeg|webp;base64 URL (qwen2.5-vl-7b only, up to 2 images of 512 KB each, which together must fit in the 1 MiB request).",
                                "properties": {
                                  "image_url": {
                                    "properties": {
                                      "url": {
                                        "type": "string"
                                      }
                                    },
                                    "required": ["url"],
                                    "type": "object"
                                  },
                                  "type": {
                                    "const": "image_url",
                                    "type": "string"
                                  }
                                },
                                "required": ["image_url", "type"],
                                "type": "object"
                              }
                            ]
                          },
                          "type": "array"
                        }
                      ],
                      "description": "The message text, or a list of text and image parts."
                    },
                    "role": {
                      "description": "Who wrote the message. The tool role is not supported.",
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "Model id, default qwen3-8b. See GET /v1/models for the ones on sale.",
                "type": ["string", "null"]
              },
              "n": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Only 1 is supported."
              },
              "response_format": {
                "anyOf": [
                  {
                    "properties": {
                      "type": {
                        "const": "text",
                        "type": "string"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Only {\"type\":\"text\"} is supported."
              },
              "seed": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Integer seed for repeatable sampling."
              },
              "stop": {
                "anyOf": [
                  {
                    "anyOf": [
                      {
                        "maxLength": 64,
                        "type": "string"
                      },
                      {
                        "items": {
                          "maxLength": 64,
                          "type": "string"
                        },
                        "maxItems": 4,
                        "type": "array"
                      }
                    ]
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Up to 4 stop sequences of up to 64 characters each."
              },
              "temperature": {
                "anyOf": [
                  {
                    "maximum": 2,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Sampling temperature, 0 to 2."
              },
              "top_p": {
                "anyOf": [
                  {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Nucleus sampling, 0 to 1."
              }
            },
            "required": ["messages"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "balance_usd": {
                "description": "Credit balance after the charge, US dollars as decimal text.",
                "type": "string"
              },
              "call_id": {
                "description": "Server-issued id of the call.",
                "type": "string"
              },
              "content": {
                "description": "The model's answer; absent with dry_run.",
                "type": "string"
              },
              "cost_usd": {
                "description": "What the call cost (or the most it can cost, with dry_run), US dollars as decimal text.",
                "type": "string"
              },
              "dry_run": {
                "const": true,
                "description": "True when nothing was run or charged.",
                "type": "boolean"
              },
              "estimated_prompt_tokens": {
                "description": "Dry run only: the estimate of the prompt's tokens.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "finish_reason": {
                "description": "stop, or length when max_tokens ran out.",
                "enum": ["stop", "length"],
                "type": "string"
              },
              "max_tokens": {
                "description": "The max_tokens used: always with dry_run (the one the quote assumes); otherwise only when the max_tokens asked for was above the output cap and was lowered to it.",
                "maximum": 9007199254740991,
