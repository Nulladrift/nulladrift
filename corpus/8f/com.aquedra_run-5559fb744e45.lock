              },
              "min_call_usd": {
                "description": "Dry run only: the minimum charge per call.",
                "type": "string"
              },
              "model": {
                "description": "The model that answered (or would answer, with dry_run).",
                "type": "string"
              },
              "object": {
                "const": "run.quote",
