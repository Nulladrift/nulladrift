      "serverInfo": {
        "name": "latam-tax-api",
        "title": "LatAm Tax ID Validator",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tax ID checks for Latin American suppliers and customers: validate_peru_ruc (Peru RUC), validate_mexico_rfc (Mexico RFC), validate_colombia_nit (Colombia NIT) and validate_costa_rica_cedula (Costa Rica cédula, beta), plus validate_tax_id (any supported country: official-registry check for Norway, Finland, France, Ireland, Taiwan, the Dominican Republic, Chile, Argentina, Paraguay, Ecuador, Brazil, Canada (federal corporations), Switzerland, Israel, Singapore and United Kingdom company numbers (Companies House), EU VAT numbers checked live in VIES of the European Commission (VAT registration for intra-EU trade, not the trade register), the lookups above for Peru, Mexico, Colombia and Costa Rica, format check elsewhere) and validate_tax_id_format (format and check digit only, offline, for every country including the UK, Brazil, Australia, India, Japan and China). Check assessment.verdict: pass = registered and in good standing per the source; review = needs a human look; fail = invalid, not active or on a blacklist. Mexico never returns pass because Mexico publishes no RFC registry; the format check never returns pass because it does not query any registry (see verification_level and official_lookup_url).",
      "tools": [
        {
          "name": "validate_colombia_nit",
          "title": "Validate Colombia NIT (tax ID)",
          "description": "Validate a Colombian NIT with the DIAN check-digit algorithm and look it up live in the RUES commercial registry kept by the chambers of commerce (Confecámaras, licensed CC BY-SA 4.0). Returns the computed check digit, legal name, registration status (active, cancelled and others), last renewal year, registration dates, chamber of commerce, legal form, CIIU activity codes and a pass/review/fail assessment with reasons. This is the commercial registry, not DIAN tax status. For individuals only the check digit and registration status are returned, without name or address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nit": {
                "description": "Colombian NIT with or without the check digit, e.g. \"899999068-1\" or \"899999068\". Dots and spaces are ignored.",
                "type": "string"
              }
            },
            "required": ["nit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate Colombia NIT (tax ID)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:544bbec36f8f0d8a2d4e103343b53c113bbcaed35f9302e8fabff213d4b26375"
        },
        {
          "name": "validate_costa_rica_cedula",
          "title": "Validate Costa Rica cédula (tax ID, beta)",
          "description": "Check a Costa Rican tax ID (cédula física, cédula jurídica, DIMEX or NITE) live against the Ministerio de Hacienda. Returns the ID type, taxpayer status (registered or not), tax regime, delinquent (moroso) and non-filer (omiso) flags, tax administration office, registered economic activities and a pass/review/fail assessment with reasons. Beta: the meaning of some Hacienda fields is not formally documented. Names are returned only for legal entities; for individuals the name is withheld.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cedula": {
                "description": "Costa Rican ID: 9 digits (cédula física), 10 digits (cédula jurídica or NITE) or 11-12 digits (DIMEX), e.g. \"2-100-042005\". Dashes are ignored.",
                "type": "string"
              }
            },
            "required": ["cedula"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate Costa Rica cédula (tax ID, beta)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4d783e3aa4eef212f5c45d13e98dcda3351c41abaa0651779b200cd81d7c0315"
        },
        {
          "name": "validate_mexico_rfc",
          "title": "Check Mexico RFC (tax ID)",
          "description": "Check a Mexican RFC (12 characters for companies, 13 for individuals): structure, encoded date and SAT check digit, plus whether it appears on SAT's public lists under article 69-B of the Código Fiscal de la Federación (taxpayers presumed or confirmed to invoice non-existent operations, also called EFOS) and article 69 (not located, unpaid or cancelled tax debts, tax-crime convictions). Returns the list status with publication dates and a review/fail assessment with reasons. Mexico publishes no RFC registry, so the result never confirms that an RFC is registered or active and never returns pass. Company names are returned only when a SAT list carries them; individuals get list status only, without name or birth date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rfc": {
                "description": "Mexican RFC, 12 or 13 characters, e.g. \"SAT970701NN3\". Case, spaces and dashes are ignored.",
                "type": "string"
              }
            },
            "required": ["rfc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Mexico RFC (tax ID)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3198397407756954aa7cca27150da752144213878413769b6a57f131c7ffdfe"
        },
        {
          "name": "validate_peru_ruc",
          "title": "Validate Peru RUC (tax ID)",
          "description": "Validate a Peruvian RUC (11-digit tax ID) and look up the company in the SUNAT registry. Returns check-digit validity, legal name, taxpayer status (active or not), fiscal-address condition (HABIDO / NO HABIDO), fiscal address with district, and a pass/review/fail vendor assessment with reasons. Full data is returned for company RUCs (prefix 20). For natural-person RUCs (prefix 10, 15, 16, 17) the taxpayer status and address condition are returned; the holder's name is returned only when the connector is used with an API key (?api_key=... or Authorization header), for supplier and customer verification; never the DNI or address (privacy, Ley 29733). If that registry data is unavailable the answer is a check-digit validation with verification_level \"format\". Typical use: checking a Peruvian supplier or customer before paying, invoicing or onboarding it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ruc": {
                "description": "11-digit Peru RUC, e.g. \"20615614841\". Spaces and dashes are ignored.",
                "type": "string"
              }
            },
            "required": ["ruc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate Peru RUC (tax ID)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7da96ed0bee626bf8213e43b0e1c3439aac3cd9b2fc28a668c4ef7df78b50558"
        },
        {
          "name": "validate_tax_id",
          "title": "Validate a business tax ID (any supported country)",
          "description": "Validate a business tax or registry ID for any supported country with the deepest check available for it. Norway (organisation number), Finland (Y-tunnus or VAT), France (SIREN, SIRET or VAT), Ireland (CRO company number) and Taiwan (unified business number) are checked live against the official registry: legal name, status (active, dissolved, bankrupt, struck off and others), address, key dates, the source with its licence and the date of the data, verification_level \"official_registry\" and a pass/review/fail assessment with reasons. Ireland comes from CRO data updated daily, not a live query. Dominican Republic RNC (9 digits) is checked against the DGII RNC register, updated daily (legal and trade name, status, activity, payment regime); an 11-digit cédula of a natural person gets the format check only, without any name. Chile RUT is checked against the SII register of legal entities (updated a few times a year: see source.data_as_of): name, legal form, start date and término de giro (closure = fail). Canada BN (9 digits, or with a program account such as RT0001) is checked against the Corporations Canada register of federal corporations, updated daily (Open Government Licence – Canada): name, status, registered office, dates; it covers federal corporations only, so a BN not found is review, never fail. Argentina CUIT (legal entities, prefixes 30, 33, 34) is checked against the ARCA register of tax conditions: name and registration in Ganancias and IVA (registered, active or exempt, in either = pass; ARCA states no active flag). Paraguay RUC is checked against the DNIT RUC register (monthly): status, plus the name of legal entities only (natural persons: status only). Ecuador RUC (companies and other entities, third digit 6 or 9) is checked against the SRI RUC register (monthly): name, status (ACTIVO = pass, SUSPENDIDO = review, PASIVO = fail), class and dates. Natural persons of Argentina and Ecuador get the format check only (review), without any name. Brazil CNPJ is checked against the Receita Federal CNPJ register (monthly): legal name, legal nature and the head office's situação cadastral (ATIVA = pass, SUSPENSA = review, INAPTA, BAIXADA or NULA = fail); a branch never gets a pass on its own, and individual entrepreneurs (MEI) get their status only. For sole proprietorships (Norway ENK, French entrepreneurs individuels, Finnish sole traders) only the status is returned, without name or address. EU VAT numbers of 24 member states (all but Finland, France and Ireland, which have the registries above) are checked live in VIES, the VAT Information Exchange System of the European Commission: pass = the VAT number is registered for intra-EU transactions today, fail = it is not. VIES is not the trade register, so a valid VAT number does not show that the company is solvent or still registered; the name VIES returns is given only to API-key holders, and Germany and Spain share no name (legal_name null). Czechia (ARES), Latvia (Enterprise Register) and Romania (ANAF) add the legal name and status from the national register, and the company number (id_type \"ico\") is checked in ARES for Czechia and RPO for Slovakia. Switzerland UID (UID register, live), Israel company number (Companies Register, updated daily) and Singapore UEN (ACRA, updated monthly) are official-registry checks too. United Kingdom company numbers (id_type \"crn\") are checked live against the Companies House register (name, status, type, incorporation date, registered office; dissolved = fail, liquidation or administration = review); a UK VAT number gets the format check only. If VIES or a register does not answer, the tool returns an error and the call is not billed. Peru, Mexico, Colombia and Costa Rica are answered by the same lookups as their own tools. Every other covered country (including India, and Brazil, Australia, Japan and the United States while their registry switches are off) gets the offline format check with verification_level \"format\", which never returns pass. Also checked against official data: Australia ABN (Australian Business Register, updated weekly: active or cancelled, entity type, GST; individuals get status only); Japan corporate number (National Tax Agency, updated monthly: name, address, closure); United States EIN as a PARTIAL official source (IRS exempt organizations and SEC filers only; not found = review, never fail). Also checked against official sources: Moldova IDNO (State Register of Legal Units, updated weekly: name, legal form, liquidation; individual enterprises status only); Guernsey Registry number (live: name, type, status); Zambia TPIN (live, Zambia Revenue Authority: status, taxes incl. VAT; individuals status only); Angola NIF (live, AGT: status, in default or not, VAT regime; individuals status only); Mali NIF (live DGI list of ACTIVE taxpayers; not found = review); Seychelles TIN (live, Seychelles Revenue Commission: VAT-registered businesses only; not found = review). When one of these sources is down, the answer is HTTP 503 (not billed).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"NO\", \"FI\", \"FR\", \"IE\", \"TW\", \"DO\", \"CL\", \"AR\", \"PY\", \"EC\", \"BR\", \"CA\", \"DE\", \"IT\", \"CH\", \"SG\", \"GB\", \"PE\". \"EL\" is accepted for Greece and \"UK\" for the United Kingdom.",
                "type": "string"
              },
              "id": {
                "description": "The ID as written, with or without the country prefix, spaces, dots or dashes, e.g. \"974761076\", \"1003521-5\", \"FR90130004955\", \"98788\", \"03741302\".",
                "type": "string"
              },
              "id_type": {
                "description": "Optional ID type when the country has several, e.g. \"siren\", \"siret\", \"vat\", \"ytunnus\", \"cro\", \"orgnr\", \"ubn\", \"rnc\", \"cedula\", \"rut\", \"bn\", \"ico\", \"uid\", \"uen\", \"crn\". Detected from the input when omitted.",
                "type": "string"
              }
            },
            "required": ["country", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate a business tax ID (any supported country)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:655dc3f20900578255c8e1d93422057c225236bbcc80b0a6460d8f1260dda537"
        },
        {
          "name": "validate_tax_id_format",
          "title": "Check tax ID format (more than 100 countries and territories)",
          "description": "Check the format of a business tax or registry ID offline: structure and, where the issuing authority publishes one, the check digit (VIES and the registries are never queried here). Covers EU VAT numbers for all 27 member states (plus Spain NIF, France SIREN/SIRET, Finland Y-tunnus, Sweden organisationsnummer), United Kingdom VAT and company number, Switzerland UID, Norway, Iceland, Türkiye, United States EIN (structure only), Canada BN, Brazil CNPJ (including the alphanumeric format), Argentina, Chile RUT, Ecuador, Uruguay, Paraguay, Bolivia, Guatemala, Panama, Dominican Republic (RNC and cédula), Venezuela, Australia ABN/ACN, New Zealand NZBN/IRD, India GSTIN/PAN, Japan, South Korea, Taiwan, Singapore, Israel and South Africa, and 63 more countries and territories (among them China, Russia, Ukraine, Indonesia, Thailand, Vietnam, Kazakhstan, Morocco, Ghana, Kenya, Nigeria, the United Arab Emirates and Saudi Arabia; some of those have no published check digit, so only the structure is checked). Returns the normalized ID, format and check-digit validity, verification_level \"format\", a review/fail assessment with reasons and, when one exists, the URL of the free official lookup. No registry is queried, so the result never confirms that the business exists or is active and never returns pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"DE\", \"FR\", \"BR\", \"GB\". \"EL\" is accepted for Greece and \"UK\" for the United Kingdom.",
                "type": "string"
              },
              "id": {
                "description": "The ID as written, with or without the country prefix, spaces, dots or dashes, e.g. \"DE 123 456 807\" or \"12.345.678/9013-11\".",
                "type": "string"
              },
              "id_type": {
                "description": "Optional ID type when the country has several, e.g. \"vat\", \"siren\", \"siret\", \"nif\", \"crn\", \"abn\", \"acn\", \"gstin\", \"pan\", \"nzbn\", \"ird\". Detected from the input when omitted.",
                "type": "string"
              }
            },
            "required": ["country", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check tax ID format (more than 100 countries and territories)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9becf08b55454a919e47d3f5713205b35f5a9d5d74ebb6799c1f3fb91b7e7ab0"
        }
      ],
      "digest": "sha256:c3d854d18536477be6180431a9091c6569fd6fd40870172d7b3554a3d4dfc705"
    }
