        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://taxid.halpii.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "latam-tax-api",
        "title": "LatAm Tax ID Validator",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tax ID checks for Latin American suppliers and customers: validate_peru_ruc (Peru RUC), validate_mexico_rfc (Mexico RFC), validate_colombia_nit (Colombia NIT) and validate_costa_rica_cedula (Costa Rica cédula, beta), plus validate_tax_id (any supported country: official-registry check for Norway, Finland, France, Ireland, Taiwan, the Dominican Republic, Chile and Canada (federal corporations), the lookups above for Peru, Mexico, Colombia and Costa Rica, format check elsewhere) and validate_tax_id_format (format and check digit only, about 50 more countries: EU VAT, UK, Brazil, Australia, India, Japan and others). Check assessment.verdict: pass = registered and in good standing per the source; review = needs a human look; fail = invalid, not active or on a blacklist. Mexico never returns pass because Mexico publishes no RFC registry; the format check never returns pass because it does not query any registry (see verification_level and official_lookup_url).",
      "tools": [
        {
          "name": "validate_colombia_nit",
          "title": "Validate Colombia NIT (tax ID)",
          "description": "Validate a Colombian NIT with the DIAN check-digit algorithm and look it up live in the RUES commercial registry kept by the chambers of commerce (Confecámaras open data on datos.gov.co, licensed CC BY-SA 4.0). Returns the computed check digit, legal name, registration status (active, cancelled and others), last renewal year, registration dates, chamber of commerce, legal form, CIIU activity codes and a pass/review/fail assessment with reasons. This is the commercial registry, not DIAN tax status. For individuals only the check digit and registration status are returned, without name or address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nit": {
                "description": "Colombian NIT with or without the check digit, e.g. \"899999068-1\" or \"899999068\". Dots and spaces are ignored.",
                "type": "string"
              }
            },
            "required": ["nit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate Colombia NIT (tax ID)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d6d10ae1a633c138e22b00e741b9c8aaaf6290fbd6a23bcb62327c9131e260e2"
        },
        {
          "name": "validate_costa_rica_cedula",
          "title": "Validate Costa Rica cédula (tax ID, beta)",
          "description": "Check a Costa Rican tax ID (cédula física, cédula jurídica, DIMEX or NITE) live against the Ministerio de Hacienda's public taxpayer lookup. Returns the ID type, taxpayer status (registered or not), tax regime, delinquent (moroso) and non-filer (omiso) flags, tax administration office, registered economic activities and a pass/review/fail assessment with reasons. Beta: the Hacienda endpoint is not formally documented. Names are returned only for legal entities; for individuals the name is withheld.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cedula": {
                "description": "Costa Rican ID: 9 digits (cédula física), 10 digits (cédula jurídica or NITE) or 11-12 digits (DIMEX), e.g. \"2-100-042005\". Dashes are ignored.",
                "type": "string"
              }
            },
            "required": ["cedula"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate Costa Rica cédula (tax ID, beta)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:91401286e6286acec9cea1a8cda5f858303c736f5ac377e5ad790f55c8fb7777"
        },
        {
          "name": "validate_mexico_rfc",
          "title": "Check Mexico RFC (tax ID)",
          "description": "Check a Mexican RFC (12 characters for companies, 13 for individuals): structure, encoded date and SAT check digit, plus whether it appears on SAT's public lists under article 69-B of the Código Fiscal de la Federación (taxpayers presumed or confirmed to invoice non-existent operations, also called EFOS) and article 69 (not located, unpaid or cancelled tax debts, tax-crime convictions). Returns the list status with publication dates and a review/fail assessment with reasons. Mexico publishes no RFC registry, so the result never confirms that an RFC is registered or active and never returns pass. Company names are returned only when a SAT list carries them; individuals get list status only, without name or birth date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rfc": {
                "description": "Mexican RFC, 12 or 13 characters, e.g. \"SAT970701NN3\". Case, spaces and dashes are ignored.",
                "type": "string"
              }
            },
            "required": ["rfc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Mexico RFC (tax ID)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3198397407756954aa7cca27150da752144213878413769b6a57f131c7ffdfe"
        },
        {
          "name": "validate_peru_ruc",
          "title": "Validate Peru RUC (tax ID)",
          "description": "Validate a Peruvian RUC (11-digit tax ID) and look up the company in the public SUNAT registry file (Padrón Reducido del RUC). Returns check-digit validity, legal name, taxpayer status (active or not), fiscal-address condition (HABIDO / NO HABIDO), fiscal address with district, and a pass/review/fail vendor assessment with reasons. Full data is returned for company RUCs (prefix 20). For natural-person RUCs (prefix 10, 15, 16, 17) the taxpayer status and address condition are returned; the holder's name is returned only when the connector is used with an API key (?api_key=... or Authorization header), for supplier and customer verification; never the DNI or address (privacy, Ley 29733). If that copy is unavailable the answer is a check-digit validation with verification_level \"format\". Typical use: checking a Peruvian supplier or customer before paying, invoicing or onboarding it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ruc": {
                "description": "11-digit Peru RUC, e.g. \"20615614841\". Spaces and dashes are ignored.",
                "type": "string"
              }
            },
            "required": ["ruc"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate Peru RUC (tax ID)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66177711e1201bae2718e0597cd6511334de5cb374e6a3aee04f3ce195c79feb"
        },
        {
          "name": "validate_tax_id",
          "title": "Validate a business tax ID (any supported country)",
          "description": "Validate a business tax or registry ID for any supported country with the deepest check available for it. Norway (organisation number), Finland (Y-tunnus or VAT), France (SIREN, SIRET or VAT), Ireland (CRO company number) and Taiwan (unified business number) are checked live against the official open registry: legal name, status (active, dissolved, bankrupt, struck off and others), address, key dates, the source with its licence and the date of the data, verification_level \"official_registry\" and a pass/review/fail assessment with reasons. Ireland comes from the CRO daily snapshot, not a live query. Dominican Republic RNC (9 digits) is checked against our copy of the DGII RNC registry file, refreshed from the file the DGII publishes daily (legal and trade name, status, activity, payment regime); an 11-digit cédula of a natural person gets the format check only, without any name. Chile RUT is checked against our copy of the SII register of legal entities (nómina de personas jurídicas, refreshed a few times a year: see source.data_as_of): name, legal form, start date and término de giro (closure = fail). Canada BN (9 digits, or with a program account such as RT0001) is checked against our copy of the Corporations Canada federal corporations data, refreshed daily (Open Government Licence – Canada): name, status, registered office, dates; it covers federal corporations only, so a BN not found is review, never fail. For sole proprietorships (Norway ENK, French entrepreneurs individuels, Finnish sole traders) only the status is returned, without name or address. Peru, Mexico, Colombia and Costa Rica are answered by the same lookups as their own tools. Every other covered country (about 45, including EU VAT numbers, the United Kingdom, Brazil, Australia, India and Japan) gets the offline format check with verification_level \"format\", which never returns pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"NO\", \"FI\", \"FR\", \"IE\", \"TW\", \"DO\", \"CL\", \"CA\", \"DE\", \"PE\". \"EL\" is accepted for Greece and \"UK\" for the United Kingdom.",
                "type": "string"
              },
              "id": {
                "description": "The ID as written, with or without the country prefix, spaces, dots or dashes, e.g. \"974761076\", \"1003521-5\", \"FR90130004955\", \"98788\", \"03741302\".",
                "type": "string"
              },
              "id_type": {
                "description": "Optional ID type when the country has several, e.g. \"siren\", \"siret\", \"vat\", \"ytunnus\", \"cro\", \"orgnr\", \"ubn\", \"rnc\", \"cedula\", \"rut\", \"bn\". Detected from the input when omitted.",
                "type": "string"
              }
            },
            "required": ["country", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate a business tax ID (any supported country)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c6173624a57ec9497c6502889d6691a5da41a796be259e0b77d519a55d89741"
        },
        {
          "name": "validate_tax_id_format",
          "title": "Check tax ID format (about 50 countries)",
          "description": "Check the format of a business tax or registry ID offline: structure and, where the issuing authority publishes one, the check digit. Covers EU VAT numbers for all 27 member states (plus Spain NIF, France SIREN/SIRET, Finland Y-tunnus, Sweden organisationsnummer), United Kingdom VAT and company number, Switzerland UID, Norway, Iceland, Türkiye, United States EIN (structure only), Canada BN, Brazil CNPJ (including the alphanumeric format), Argentina, Chile RUT, Ecuador, Uruguay, Paraguay, Bolivia, Guatemala, Panama, Dominican Republic (RNC and cédula), Venezuela, Australia ABN/ACN, New Zealand NZBN/IRD, India GSTIN/PAN, Japan, South Korea, Taiwan, Singapore, Israel and South Africa. Returns the normalized ID, format and check-digit validity, verification_level \"format\", a review/fail assessment with reasons and, when one exists, the URL of the free official lookup. No registry is queried, so the result never confirms that the business exists or is active and never returns pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. \"DE\", \"FR\", \"BR\", \"GB\". \"EL\" is accepted for Greece and \"UK\" for the United Kingdom.",
                "type": "string"
              },
              "id": {
                "description": "The ID as written, with or without the country prefix, spaces, dots or dashes, e.g. \"DE 123 456 807\" or \"12.345.678/9013-11\".",
                "type": "string"
              },
              "id_type": {
                "description": "Optional ID type when the country has several, e.g. \"vat\", \"siren\", \"siret\", \"nif\", \"crn\", \"abn\", \"acn\", \"gstin\", \"pan\", \"nzbn\", \"ird\". Detected from the input when omitted.",
                "type": "string"
              }
            },
            "required": ["country", "id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check tax ID format (about 50 countries)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e294819730bff48a1306be0c2a4c96f84c06c6d6cdc76c75d5d219ac5d35d1ca"
        }
      ],
      "digest": "sha256:dff751750f170eec002e4298a611a3c2b4dd6b9b5fe05127d64e0b7159e42ee5"
    }
  }
