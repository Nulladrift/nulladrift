        {
          "name": "nichedb_population",
          "title": "NicheDB: Population Lookup",
          "description": "[NicheDB] Population and demography, drilled down from the world to the ZIP code. Give a `key` (us, us-ca, us-ca-los-angeles, gb, gb-england-london), a US `zip`, or a place name in `q`; no argument is the world. Answers with the area (population, year, measures: age, income, home value, rent, poverty, education, unemployment, race and Hispanic origin for the US; growth, age structure, births, deaths, fertility, life expectancy, migration, GDP per head and Gini for countries), how many areas of each level it contains, and the largest of its children at `level` (country, state, city or zip). Sources: World Bank, US Census ACS 5-year, GeoNames.\n\nServed by NicheDB (https://nichedb.dev/docs/mcp).",
          "inputSchema": {
            "properties": {
