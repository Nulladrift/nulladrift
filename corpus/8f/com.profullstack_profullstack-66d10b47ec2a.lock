                "description": "Offer kinds.",
                "items": {
                  "enum": ["vps", "cloud", "dedicated", "bare-metal", "gpu", "shared", "managed", "paas", "serverless", "storage", "colocation", "edge", "p2p", "hybrid", "on-prem"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "max_disk": {
                "description": "GB",
                "type": "number"
              },
              "max_price": {
                "description": "USD per month, estimated",
                "type": "number"
              },
              "max_ram": {
                "description": "GB",
                "type": "number"
              },
              "max_vcpu": {
                "type": "number"
              },
              "min_disk": {
                "description": "GB",
                "type": "number"
              },
              "min_price": {
                "description": "USD per month, estimated",
                "type": "number"
              },
              "min_ram": {
                "description": "GB",
                "type": "number"
              },
              "min_vcpu": {
                "type": "number"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "order": {
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "platform": {
                "description": "Where the row was read: api, whmcs, openserver…",
                "type": "string"
              },
              "provider": {
                "description": "Provider slugs, domains or names.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "q": {
                "description": "A sentence or keywords: \"2 vcpu 4gb under $10 in germany\". Parsed into the fields below; explicit fields win.",
                "type": "string"
              },
              "region": {
                "description": "A region word (eu, europe, asia, north america, nordics, dach…) expanded to countries.",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "price", "value", "ram", "vcpu", "disk", "updated", "name"],
                "type": "string"
