      "instructions": "One connector for the Profullstack network of public data and web tools. Every tool is read-only and needs no account.\nTool names are <server>_<tool>. Groups:\n- profullstack_*: domains (availability, suggestions), SEO, Lighthouse, WCAG, link checks, weather, tides, US government data (data.gov, Library of Congress, libraries, education), and the Profullstack fleet directory.\n- nichedb_*: real-time public data: TLDs and domains, company standing, reputation, vulnerabilities, flights, ships, satellites, transit, people profiles.\n- rssamplifier_* (independent blogs and feeds), p0dcasters_* (podcasts), bufferoverride_* (developer Q&A), hqtui_bbs_* (a bulletin board), pwamart_* (web apps), w3bs_* (W3BS packages).\n- threatcrush_* (file hash, IP and domain reputation), vu1nz_* (repo scans and advisories), r4ck_* (server and GPU offers).\n- readm3_*, obscura_*, tronbrowser_*: read any public URL as markdown, or screenshot it.\nWrite and account tools live on each server's own MCP endpoint; profullstack_fleet_get_service lists them.",
