        {
          "name": "nichedb_match_items",
          "title": "NicheDB: Match Names to Items",
          "description": "[NicheDB] Which title, channel or fixture is this name? Give a file name, a release name or a playlist entry (\"Top.Gun.Maverick.2022.1080p.mkv\", \"US: ESPN2 HD\"); it is cleaned (year, season and episode, quality tags, playlist decorations) and matched by similarity. A matchup (\"NFL: Chiefs vs Bills\", \"Lakers @ Celtics\", \"Rangers at Celtic 19:45\") is answered by the fixture whose two teams those are, kicking off between 36 hours ago and 7 days ahead unless date narrows it. Each result carries a score in 0..1. Use screen for films and TV, channels for television channels, sports for fixtures.\n\nServed by NicheDB (https://nichedb.dev/docs/mcp).",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "west,south,east,north; west > east crosses the antimeridian",
                "type": "string"
              },
              "collection": {
                "description": "Collection slug: screen, channels or sports (optional), e.g. screen",
                "type": "string"
              },
              "date": {
                "description": "A day (YYYY-MM-DD) to look for a fixture on, plus a day either side, e.g. 2026-11-02",
                "type": "string"
              },
              "kind": {
                "description": "Item kind: title, channel or fixture (optional), e.g. title",
                "type": "string"
              },
              "lat": {
                "description": "Query center latitude; requires long",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Rows to return, integer 1-50, default 5, e.g. 3",
                "type": "integer"
              },
              "long": {
                "description": "Query center longitude; requires lat",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "q": {
                "description": "The name as written, e.g. Top.Gun.Maverick.2022.1080p.mkv or US: ESPN2 HD",
                "type": "string"
              },
              "radius": {
                "description": "Default 10; maximum 1000 km",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "Result order. distance (needs lat and long) puts the nearest first, e.g. \"distance\"; anything else keeps newest first",
                "enum": ["id", "published", "updated", "distance"],
                "type": "string"
              },
              "unit": {
                "description": "Default km",
                "enum": ["km", "mi"],
                "type": "string"
              },
              "year": {
                "description": "A four-digit year to prefer, when known, e.g. 2022",
                "type": "integer"
