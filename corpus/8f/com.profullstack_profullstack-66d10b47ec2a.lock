          "name": "nichedb_airplane_lookup",
          "title": "NicheDB: Aircraft Lookup",
          "description": "[NicheDB] An aircraft by N-number (N172SP, or 172SP), Mode S hex (A2D8E1) or flight callsign (UAL1895), or words to search the US register (Cessna 172). Answers `record` (the FAA registration: maker, model, year, seats, engines, airworthiness, status, expiry, hex; private owners are withheld) and `live` (where adsb.lol sees it now: lat, lon, altitude, speed, squawk), or `matches` for words. A foreign aircraft has no record but may be live.\n\nServed by NicheDB (https://nichedb.dev/docs/mcp).",
