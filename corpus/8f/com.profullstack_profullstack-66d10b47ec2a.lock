        },
        {
          "name": "nichedb_check_domain",
          "title": "NicheDB: Check Domain Registration",
          "description": "[NicheDB] Is a domain name registered? Asks each registry over RDAP. Give `name` as a full name (foo.watches), or a bare word with `tlds` (foo + com,dev,io), or several names comma separated. Each answer is registered (with registrar and expiry), not_registered, or unknown. not_registered means the registry holds no registration; the name may still be reserved or premium, so it is not a promise that it is for sale. unknown (no RDAP server, a timeout, a 429) is never a yes. Each answer carries the cheapest known USD price for its ending.\n\nServed by NicheDB (https://nichedb.dev/docs/mcp).",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "A full name, a bare word with tlds, or names comma separated, e.g. foo.watches or a.com,b.dev",
                "type": "string"
              },
              "tlds": {
                "description": "Endings to try a bare word under, comma separated (optional)",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "NicheDB: Check Domain Registration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b91525f02864a0a81114cc92051d3c47752cf30232a864f2200bf054184dbb37"
        },
        {
          "name": "nichedb_feed_items",
          "title": "NicheDB: Feed Items",
          "description": "[NicheDB] What a feed selects, newest first. Page with before_id.\n\nServed by NicheDB (https://nichedb.dev/docs/mcp).",
          "inputSchema": {
            "properties": {
              "bbox": {
                "description": "west,south,east,north; west > east crosses the antimeridian",
                "type": "string"
              },
              "before_id": {
                "description": "Keyset cursor: the smallest item id from the previous page, e.g. 81234567; not with sort=distance",
                "type": "integer"
              },
              "feed": {
                "description": "Feed slug, e.g. new-on-steam (see list_feeds)",
                "type": "string"
              },
              "lat": {
                "description": "Query center latitude; requires long",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Rows to return, integer 1-200, default 30, e.g. 50",
                "type": "integer"
              },
              "long": {
                "description": "Query center longitude; requires lat",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip when sort=distance, integer, e.g. 30",
                "type": "integer"
              },
              "radius": {
                "description": "Default 10; maximum 1000 km",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "Result order. distance (needs lat and long) puts the nearest first, e.g. \"distance\"; anything else keeps newest first",
                "enum": ["id", "published", "updated", "distance"],
                "type": "string"
              },
              "unit": {
                "description": "Default km",
                "enum": ["km", "mi"],
                "type": "string"
              }
            },
            "required": ["feed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "NicheDB: Feed Items"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
