        {
          "name": "nichedb_business_standing",
          "title": "NicheDB: Business Standing Check",
          "description": "[NicheDB] Is a business on anybody's list? Give its `name`, and any of `domain`, `state` (two letters), `number` (state entity number) and `ein`. Answers with `standing` (flagged, incomplete or clear; clear only when every list was checked and found nothing), the `findings` behind it, and each section: US Treasury OFAC sanctions (SDN and consolidated, aliases included), GLEIF LEI records, SEC EDGAR filers, state registry status (OpenCorporates) and SAM.gov exclusions when keyed, and the domain over RDAP plus Spamhaus/URIBL/SURBL/Safe Browsing when the operator enabled them. A name match is not an identity: confirm against address and identifiers.\n\nServed by NicheDB (https://nichedb.dev/docs/mcp).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Its website or mail domain (optional)",
                "type": "string"
              },
              "ein": {
                "description": "US EIN, kept to identify it, never checked (optional)",
                "type": "string"
              },
              "name": {
                "description": "Company name, e.g. Profullstack, Inc.",
                "type": "string"
              },
              "number": {
                "description": "State entity number, e.g. 4218574 (optional)",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state it is registered in (optional), e.g. CA",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "NicheDB: Business Standing Check"
          },
