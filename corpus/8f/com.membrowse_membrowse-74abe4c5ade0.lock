      "serverInfo": {
        "name": "membrowse",
        "title": "MemBrowse",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MemBrowse tracks the memory footprint (flash, RAM and other regions) of firmware and other ELF builds for every commit. These tools are read-only. Sizes are bytes.\nReviewing a pull request: get_commit_summary with the PR's head commit SHA shows every target's change against the PR's base branch, with the largest section and file changes and, for targets with benchmark metrics, how each metric moved; then compare_builds with level='symbols' and the same head SHA on a target that grew shows which symbols grew.\nAuditing memory: list_targets (how full each region is) -> get_memory_history (the commits that changed it, with their deltas) -> compare_builds with level='symbols' on a commit that grew it, or between two releases; list_symbols shows what takes the space.\nBenchmark metrics (cycle counts, timings, scores CI attaches to commits) are separate from memory: get_metric_history lists a target's benchmarked commits with each metric's change, to find the commit that moved one; then get_commit_summary or compare_builds on that commit shows whether memory changed with it.\nFinding savings: list_symbols with group_by='library' (or 'section', 'file', 'directory') shows where the bytes are, and compare_builds with base_target which other target already does without a symbol. For anything deeper (duplicates, template instances, compiler clones), export_symbols downloads the whole symbol table as a file to process with code.\nCommits are named by full SHA, a SHA prefix, or a branch or tag name; a pull request by its head commit SHA. MemBrowse only knows commits whose build was uploaded to it, so a commit CI has not finished with yet has no report.\nProjects: a public project is its GitHub 'owner/repo', passed as 'project' with no API key needed; start with list_targets. list_projects needs an account API key, sent as 'Authorization: Bearer <key>', and lists the private and public projects that key's account owns or belongs to.",
      "tools": [
        {
          "name": "compare_builds",
          "title": "Compare builds",
          "description": "Compare two builds of a target. Always returns each region's old and new size; 'level' adds the changed sections, source files or symbols, sorted by size of change. Without 'base', the head is compared with the build it was compared with when it was uploaded: for a pull request's head commit that is the tip of the PR's base branch, so the result is the whole PR; for a pushed commit it is the branch's previous build, so the result is what that one commit did. With 'base_target', the base is a build of another target instead, to see which target already does without a symbol.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base": {
                "description": "The older build, in the same forms. Default: the build 'head' was compared with when it was uploaded (for a pull request, the tip of its base branch); with 'base_target', the head of that target's default branch.",
                "type": "string"
              },
              "base_target": {
                "description": "Compare with this other target of the project ('base' then names its build).",
                "type": "string"
              },
              "head": {
                "description": "The newer build: a full commit SHA, a SHA prefix (7+ characters), or a branch or tag name. Default: the head of the default branch. For a pull request, its head commit SHA.",
                "type": "string"
              },
              "level": {
                "description": "Detail to return (default 'regions'). 'symbols' and 'files' load full reports and are slower.",
                "enum": ["regions", "sections", "files", "symbols"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum rows to return (default 50, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "name_contains": {
                "description": "Only sections, files or symbols whose name contains this text (case-insensitive).",
                "type": "string"
              },
              "project": {
                "description": "The project: a public project's GitHub 'owner/repo' (no API key needed), or, with an API key, a project id or name from list_projects.",
                "type": "string"
              },
              "region": {
                "description": "Only this memory region, e.g. FLASH or RAM.",
                "type": "string"
              },
              "section": {
                "description": "Only this section, e.g. .text (sections and symbols levels).",
                "type": "string"
              },
              "target": {
                "description": "Target name (see list_targets).",
                "type": "string"
              }
            },
            "required": ["project", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare builds"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cf14aea1910a52301b0bbb6eca377d337fbcfd913b3f2fc9f32e61e8b6d22c89"
        },
        {
          "name": "export_symbols",
          "title": "Export symbol table",
          "description": "Get one build's whole symbol table as a file, to analyse with code (Python, pandas, DuckDB, jq) when the other tools cannot answer the question. Returns a one-time download, not the symbols: run the returned 'command' in a shell to save the file, then work on the file, so the table never enters the conversation. Needs a shell that can reach the MemBrowse server.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project": {
                "description": "The project: a public project's GitHub 'owner/repo' (no API key needed), or, with an API key, a project id or name from list_projects.",
                "type": "string"
              },
              "ref": {
                "description": "The build: a full commit SHA, a SHA prefix (7+ characters), or a branch or tag name. Default: the head of the default branch.",
                "type": "string"
              },
              "target": {
                "description": "Target name (see list_targets).",
                "type": "string"
              }
            },
            "required": ["project", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Export symbol table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddbf1ebe995d8c587b2ae73e3d8c4cdcee5f879471f1dbff40efb78451eea4aa"
        },
        {
          "name": "get_commit_summary",
          "title": "Commit memory summary",
          "description": "For one commit, show every target's memory change against its base build: per region, the largest section and source-file changes, budget alerts, and, for targets with benchmark metrics, each metric's change. For a pull request, pass the PR's head commit SHA: its base is the tip of the PR's base branch, so the result is the whole PR's change. Use it to review a pull request or check whether a commit grew memory or moved a benchmark.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Section, file and metric changes per target (default 10, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "project": {
                "description": "The project: a public project's GitHub 'owner/repo' (no API key needed), or, with an API key, a project id or name from list_projects.",
                "type": "string"
              },
              "ref": {
                "description": "The commit: a full commit SHA, a SHA prefix (7+ characters), or a branch or tag name. Default: the head of the default branch. For a pull request, its head commit SHA.",
                "type": "string"
              },
              "target": {
                "description": "Only this target (default: all).",
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Commit memory summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa72daa2d9d1e00c2252ef461f4dbcb6b835ee59aa696b734be754e539625a9c"
        },
        {
          "name": "get_memory_history",
          "title": "Memory history",
          "description": "List a target's commits, newest first, with each memory region's used size and the change that commit made. Use it to see how memory evolved and to find the commits that grew it (the largest positive 'delta'); page back with 'offset'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Commits per page (default 30, max 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Commits to skip, for paging (default 0).",
                "minimum": 0,
                "type": "integer"
              },
              "only_changed": {
                "description": "Skip commits whose build was identical to the previous one (default true).",
                "type": "boolean"
              },
              "project": {
                "description": "The project: a public project's GitHub 'owner/repo' (no API key needed), or, with an API key, a project id or name from list_projects.",
                "type": "string"
              },
              "ref": {
                "description": "Where to start: a full commit SHA, a SHA prefix (7+ characters), or a branch or tag name. Default: the head of the default branch.",
                "type": "string"
              },
              "region": {
                "description": "Only this memory region, e.g. FLASH or RAM.",
                "type": "string"
              },
              "target": {
                "description": "Target name (see list_targets).",
                "type": "string"
              }
            },
            "required": ["project", "target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Memory history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e27fb2e438665a370a18d1cebd5937a0233910369487ef9048ab1617ff88df6"
        },
        {
          "name": "get_metric_history",
          "title": "Benchmark metric history",
          "description": "List a target's benchmarked commits, newest first, with each benchmark metric's value (cycle counts, timings, scores that CI attached) and its change from the previous commit that had the metric. Use it to see how a benchmark evolved and to find the commit that moved it; page back with 'offset'.",
