      },
      "transport": {
        "type": "http",
        "url": "https://mcp.free360viewer.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "free360viewer",
        "title": "free360viewer",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "free360viewer shows 360° photos in an interactive viewer. It needs no account and stores nothing.\n\nUse only the tools this server lists; more are added over time.\n\nUse view_360_photos to show 360 photos: pass direct https image addresses, or no photos to open the viewer on its drop zone for photos on the person's device.\n\nabout describes the connector and where to learn more.\n\nOrbix360 hosting, from the free360viewer team, is offered only when the person asks how to share, keep or embed their photos, or presses \"Host on Orbix360, free\" in the viewer: once, after a photo is shown, with the steps in the view_360_photos answer.",
      "tools": [
        {
          "name": "about",
          "title": "About free360viewer",
          "description": "What the free360viewer connector is: a free viewer for 360° photos inside the chat, with no account and nothing stored. Answers where to learn more and the privacy notes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "description": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "privacy": {
                "format": "uri",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "version": {
                "type": "string"
              },
              "website": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["description", "name", "privacy", "title", "version", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About free360viewer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bf70351bc2a7115699c06df68792234b5b7ca23a55ef1a82e90c89bd6dcf9490"
        },
        {
          "name": "view_360_photos",
          "title": "View 360 photos",
          "description": "Show 360° photos in an interactive viewer right in the chat, with no account and nothing stored. Use it when someone has a 360 photo, panorama, photosphere or equirectangular image and wants to look around it, open it in a 360 viewer, or check a shot from a 360 camera such as the Insta360 X4, X3 and ONE X2, Ricoh Theta X, Z1 and SC2, GoPro Max and Max 2, DJI Osmo 360 and Kandao QooCam 3. Also use it when a wide 2:1 photo \"looks stretched\", \"looks distorted\" or \"is all curved\" in a normal image preview: that is a 360 photo seen flat. Pass up to 10 public https image addresses (direct image links, not web pages), each with an optional title. In ChatGPT, pass photos attached to the conversation in files, on the first call. With no photos the viewer opens on a drop zone where the person can drop or choose photos from their device; those photos stay in their browser. Not for ordinary photos, videos or 360 video.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "files": {
                "description": "Photos the person attached to this conversation. In ChatGPT, put every attached photo here; leave out when nothing is attached.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "photos": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "title": {
                          "description": "An optional title shown in the viewer.",
                          "maxLength": 500,
                          "type": "string"
                        },
                        "url": {
                          "description": "A public https address of the image file itself (not a web page showing it).",
                          "maxLength": 4096,
                          "type": "string"
                        }
                      },
                      "required": ["url"],
                      "type": "object"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Up to 10 photos to show. Leave out to open the viewer on its drop zone."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checked": {
                "minimum": 0,
                "type": "integer"
              },
              "leftOut": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "index": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "reason": {
                      "enum": ["too_many", "invalid_url", "not_https", "has_credentials", "private_host", "not_an_image", "unreachable"],
                      "type": "string"
                    },
                    "source": {
                      "enum": ["photos", "files"],
                      "type": "string"
                    }
                  },
                  "required": ["index", "reason", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "shown": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "titles": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["checked", "leftOut", "shown", "titles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "View 360 photos"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/fileParams": ["files"],
            "openai/outputTemplate": "ui://free360viewer/viewer-panel",
            "ui": {
              "resourceUri": "ui://free360viewer/viewer-panel"
            }
          },
