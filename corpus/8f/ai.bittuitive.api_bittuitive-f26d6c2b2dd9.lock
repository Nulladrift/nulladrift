        {
          "name": "get_trust_data",
          "title": "Sanctions screening",
          "description": "Use this when an agent is about to pay, transfer, trade or onboard and must check whether a person, entity or crypto address appears on US OFAC lists or the UK Sanctions List. kind=\"intuitive\" (the default) is a compact match/hit-count check; kind=\"stats\" is the full screen with hit details; kind=\"pro\" bundles both. Each paid response includes a compliance BitScore (0-100) and a verdict of clear, possible_match or match. kind=\"signals\" is a pre-payment counterparty check that combines the sanctions screen with a reputation BitScore (0-100) and a verdict of do_not_pay, review, ok or unknown. Pass a pay-to (x402/EVM) address, Lightning invoice, LN address, node pubkey, domain, url or business name. Volume packs: 100 checks for 2,000 sats or 1,000 for 15,000 sats at POST /api/v1/credits. A screening aid only, not legal advice or a KYC/AML product; unknown is not a finding that a payee is safe. Pass name and/or address for the sanctions tiers; optional country and dob narrow name matches. An exact address match is definitive. Fuzzy name hits are always a possible match, never a flat yes. Informational only, not legal advice. get_sanctions_data is a deprecated alias of this tool. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when an agent only needs a compact sanctions check (match, hit count, and whether an exact address matched) before paying or onboarding. Pass name and/or address. For hit details use trust_stats. Informational only, not legal advice. Example: GET /api/v1/data/trust_intuitive?address=0x0000...0000 or MCP get_trust_data(kind=\"intuitive\").\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when an agent is about to pay, transfer, trade or onboard and needs the full sanctions screen: whether a person, entity or crypto address appears on official sanctions lists, with hit details and scores. Pass name and/or address; optional country and dob narrow name matches. Informational only, not legal advice.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when an agent is about to pay or onboard and wants the compact sanctions check and the full screen in one call. Pass name and/or address; optional country and dob. Informational only, not legal advice. Example: GET /api/v1/data/trust_pro?address=0x0000...0000 or MCP get_trust_data(kind=\"pro\"). 100 sats or $0.10 USDC.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when your agent is about to pay someone and needs one pre-payment check: official sanctions plus reputation signals and a Reputation BitScore. Pass an x402 payTo address, a Lightning invoice, LN address or node, a domain, or a business name. Informational only, not legal advice.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
