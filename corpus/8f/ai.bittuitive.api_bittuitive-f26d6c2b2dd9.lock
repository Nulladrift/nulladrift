        {
          "name": "get_ai_buildout",
          "title": "AI Buildout trends",
          "description": "Use this when a research agent needs a quick headline for one company or the whole AI buildout: capex, year-over-year growth and whether it is speeding up. Answers 'How much is Microsoft spending, and is it accelerating?' Pass optional symbol (e.g. MSFT) or omit it for the universe total. Returns BitTuitive's recommended ai_intuitive value plus a Data BitScore (coverage and filing freshness). 10 sats or $0.01 USDC. Pick get_ai_data kind=stats to compare layers or build a table, kind=pro for the full history in one call, kind=signals for whether the buildout is accelerating or rolling over and whether capex is outgrowing cash flow. Informational only, not investment advice. Figures are as reported in SEC filings, company-wide, not an official AI-spend line; not affiliated with or endorsed by the SEC. Returns JSON in the `data` field. Read-only; the only side effect is the payment you choose to make.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
