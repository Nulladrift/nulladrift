        },
        {
          "name": "call_routed_api",
          "title": "Call any verified data API through BitTuitive (sats or USDC)",
          "description": "Use this when you want data from another paid API without handling its invoice: pay ONE BitTuitive invoice (sats, or the same all-in price in USDC via x402) and BitTuitive pays the upstream, calls it and returns its JSON in `data` plus `routing` (upstream, score, fee). Pass endpoint_id (from list_routable_apis) or data_type and/or q for the best pick with automatic fallback. Cost: upstream price + routing fee max(20%, 3 sats). Side effect: spends your payment on the upstream call; if every upstream fails you get a 24h credit token to pass as `credit`. If the result is status 'running', repeat the identical call to collect it. Payment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and x402 terms; pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (single use, valid 10 min) or x402_payment. Bad input is rejected before any invoice. Example: call_routed_api(data_type=\"bitcoin\", q=\"mempool fees\")",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "24h credit token from an earlier failed routed call (instead of paying).",
                "type": "string"
              },
              "data_type": {
                "description": "Best-pick mode: category.",
                "enum": ["bitcoin", "crypto", "stocks", "weather", "traffic", "other"],
                "type": "string"
              },
              "endpoint_id": {
                "description": "Scoreboard id from list_routable_apis.",
                "type": "string"
              },
              "l402_credential": {
                "description": "L402 credential '<macaroon>:<preimage_hex>' from a paid invoice (or an active subscription). Omit it on the first call to receive the Lightning invoice and macaroon.",
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Optional query parameters forwarded to the upstream API.",
                "type": "object"
              },
              "q": {
                "description": "Best-pick mode: keywords, e.g. 'air quality'.",
                "type": "string"
              },
              "x402_payment": {
                "description": "x402 payment (USDC on Base): base64 PaymentPayload signed for accepts[0] of the payment_required result. Alternative to l402_credential; also accepted in params._meta['x402/payment'].",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cb8144eca941ec17e01a1421ccf522da68286d02461022f2d5541f5cd2acef86"
        },
        {
          "name": "create_feed",
          "title": "Create a feed (prepaid)",
          "description": "Use this when an agent would otherwise poll: get data pushed on a schedule (e.g. hourly BTC price) or when a trigger fires (BTC moves 2%, price crosses a level, a weather alert for a location, an airport delay, a new 10-K or 8-K). Delivery is a webhook and/or a 72 h mailbox; each delivery costs the same as one normal call, debited from prepaid credits (fund with buy_credits first); creating a feed is free. Omit credit_token on your first feed to open an account (a btf_ token is returned ONCE: store it). Example: create_feed(endpoint=\"btc_price\", mode=\"trigger\", trigger={\"type\": \"btc_move\", \"percent\": 2})",
          "inputSchema": {
            "properties": {
              "credit_token": {
                "description": "Prepaid token (btf_...), returned once by buy_credits or create_feed. Send it on every later feed or credit call.",
                "type": "string"
              },
              "endpoint": {
                "description": "Endpoint to deliver: btc_price, btc_price_fresh, btc_price_lite, btc_oracle, weather_now, weather_current, weather_alerts, airport_delays, travel_airport, stock_filings or stock_fundamentals. Put its arguments in `params`.",
                "type": "string"
              },
              "interval": {
                "description": "mode=schedule: 'hourly', 'daily' or a number of seconds (minimum 900).",
                "type": "string"
              },
              "interval_seconds": {
                "description": "mode=schedule: the interval in seconds (alternative to interval).",
                "type": "integer"
              },
              "mailbox": {
                "default": true,
                "description": "Also store deliveries in the mailbox (default true).",
                "type": "boolean"
              },
              "mode": {
                "description": "schedule: deliver on an interval. trigger: deliver when the trigger condition hits.",
                "enum": ["schedule", "trigger"],
                "type": "string"
              },
              "params": {
                "description": "Endpoint parameters, e.g. {location}, {airport} or {symbol}.",
                "type": "object"
              },
              "trigger": {
                "description": "Required when mode=trigger. type is one of: btc_move (percent, optional window_seconds), btc_threshold (above and/or below, in USD), weather_alert (location), airport_delay (airport, optional min_delay_minutes), sec_filing (symbol, optional forms; default 8-K, 10-Q, 10-K). Optional max_fires, expires_at, cooldown_seconds.",
                "type": "object"
              },
              "webhook_url": {
                "description": "https URL to POST deliveries to. A signing secret is returned once.",
                "type": "string"
              }
            },
            "required": ["endpoint", "mode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:205288d88e8f2aaed688da7e88194ce8a9e2edbf12a882ac1e63c5130f7f2bba"
        },
        {
          "name": "delete_feed",
          "title": "Delete a feed (permanent)",
          "description": "Use this when you no longer want a feed. PERMANENTLY deletes the feed definition and stops all future deliveries; this cannot be undone (create a new feed to restart). Deliveries already in the mailbox stay until they expire (72 h); the prepaid balance is untouched and non-refundable. Requires the account token and the feed id. Prefer update_feed state=paused if you may want it back.",
          "inputSchema": {
            "properties": {
              "credit_token": {
                "description": "Prepaid token (btf_...), returned once by buy_credits or create_feed. Send it on every later feed or credit call.",
                "type": "string"
              },
              "feed_id": {
                "description": "Feed id returned by create_feed or get_feeds.",
                "type": "string"
              }
            },
            "required": ["credit_token", "feed_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
