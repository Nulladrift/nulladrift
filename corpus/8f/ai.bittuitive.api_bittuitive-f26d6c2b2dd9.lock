        {
          "name": "get_weather",
          "title": "Weather",
          "description": "Use this when an agent needs weather, Data BitScored: current conditions (kind=\"intuitive\", the default), a 7-day forecast (kind=\"stats\"), go/no-go windows and location compare (kind=\"pro\"), or severe-weather alerts (kind=\"signals\") for a city, ZIP, lat/lon, or a route. Pass `location`, `zip`, or `lat`+`lon`; kind=pro also takes `locations` or `origin`/`destination` and optional wind, temperature and precipitation limits; kind=signals also takes `state`. Informational only, not for navigation. Examples: get_weather(kind=\"intuitive\", location=\"Austin, TX\"); get_weather(kind=\"pro\", locations=\"Austin, TX|Dallas, TX\"); get_weather(kind=\"signals\", state=\"TX\"). Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when a user asks what the weather is now, or an agent checks conditions at a destination. Pass location (city, ZIP, or lat/lon); omit to default to Austin, TX. Returns temperature_c, temperature_f, humidity, wind_speed_mph and a text summary, with a Data BitScore.\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when planning trips, deliveries or outdoor events: an hourly and 7-day forecast, not just current weather. Pass location, ZIP, or lat/lon; omit to default to Austin, TX. Returns period forecasts with temperature and short_forecast. Example: GET /api/v1/data/weather_stats?location=Austin,+TX or MCP get_weather(kind=\"stats\", location=\"Austin, TX\").\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when a routing, delivery or travel agent must decide whether conditions stay within wind, precipitation and temperature limits at one place or along a route. Pass location or locations (pipe- or semicolon-separated) or origin and destination; optional wind_mph_max, temp_f_min, temp_f_max, precip_chance_max.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when a monitoring or travel agent must check for severe-weather warnings (tornado, flood, wind, winter storm) at a US point, city, ZIP or a whole state. Returns event, severity, headline, onset, expires. US coverage. Omit the parameter to default to state=TX.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
          "inputSchema": {
            "properties": {
              "credit_token": {
                "description": "Prepaid token (btf_..., from buy_credits). Pays this call from your prepaid sats or USDC balance with no invoice; a failed call is refunded. Balance is non-refundable.",
                "type": "string"
              },
