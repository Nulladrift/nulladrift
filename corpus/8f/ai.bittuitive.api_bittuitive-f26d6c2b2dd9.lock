        },
        {
          "name": "get_btc_data",
          "title": "Bitcoin data",
          "description": "Use this when an agent needs Bitcoin data: the current BTC price (trading and treasury bots, pricing an invoice in USD, spotting a >2% move), network fees and mempool state (choosing a transaction fee), or market sentiment. One tool, six products: pick `kind` by freshness and detail. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 25 sats or $0.015 USDC. Use this when a wrong price costs money and one source is not enough: sizing or approving a trade, settling an invoice in USD, or any decision a bot cannot take back.\n- kind=\"price\": 10 sats or $0.01 USDC. Use this when a trading or treasury bot needs the BTC spot price, a user asks \"what is BTC at?\", you must price an invoice in USD, or you want to flag a >2% 24h move (a 60 s quote is enough). This is a single-source price. Not BitScored; for a multi-source price with a Data BitScore, use btc_intuitive. Returns price_usd, price_eur, change_24h_percent.\n- kind=\"price_fresh\": 30 sats or $0.025 USDC. Use this when a stale quote costs money: sizing a trade, converting sats to USD at checkout, or confirming a price just before settlement. Returns price_usd, price_eur, change_24h_percent, age_seconds (cached 10 seconds at most, vs 60 seconds for btc_price). MCP: get_btc_data(kind=\"price_fresh\")\n- kind=\"price_lite\": 3 sats or $0.005 USDC. Use this when you only need a rough whole-dollar BTC price (display, sanity check, cheap valuation). Returns price_usd as an integer, refreshed every 5 min; no EUR or 24h change. The cheapest BTC price. MCP: get_btc_data(kind=\"price_lite\")\n- kind=\"oracle\": 50 sats or $0.05 USDC. Use this when an agent needs a Bitcoin network snapshot: choosing a transaction fee (fast, average, slow sat/vB), checking mempool congestion, hash rate, difficulty or block height, plus the BTC price. Returns market, on_chain, fees. MCP: get_btc_data(kind=\"oracle\")\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when researching or monitoring the Bitcoin ecosystem: everything in kind=\"oracle\" plus Lightning capacity, channel and node counts and daily miner revenue. Returns market, on_chain, lightning, mining. MCP: get_btc_data(kind=\"pro\")\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when a trading or research agent needs sentiment and trend context: Fear & Greed index, BTC/gold ratio, % from all-time high, momentum score, volatility regime, 24h transactions (dominance, NVT and active addresses are null: no licensed source). MCP: get_btc_data(kind=\"signals\")\nPayment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and, if enabled, x402 terms (USDC on Base). Pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (HTTP equivalent: Authorization: L402 <macaroon>:<preimage>; single use, valid 10 min), x402_payment / params._meta['x402/payment'], or credit_token (prepaid, see buy_credits). Invalid input is rejected before any invoice. Copy-pasteable examples: https://api.bittuitive.ai/pay.",
          "inputSchema": {
            "properties": {
              "credit_token": {
                "description": "Prepaid token (btf_..., from buy_credits). Pays this call from your prepaid sats or USDC balance with no invoice; a failed call is refunded. Balance is non-refundable.",
                "type": "string"
              },
              "kind": {
                "description": "Product to fetch. Every kind, its price and when to use it are listed in the tool description.",
