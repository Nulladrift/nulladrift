        {
          "name": "create_feed",
          "title": "Create a feed (prepaid)",
          "description": "Use this when an agent would otherwise poll: get data pushed on a schedule (e.g. hourly BTC price) or when a trigger fires (BTC moves 2%, price crosses a level, a weather alert for a location, an airport delay, a new 10-K or 8-K). Delivery is a webhook and/or a 72 h mailbox; each delivery costs the same as one normal call, debited from prepaid credits (fund with buy_credits first); creating a feed is free. Omit credit_token on your first feed to open an account (a btf_ token is returned ONCE: store it). Example: create_feed(endpoint=\"btc_price\", mode=\"trigger\", trigger={\"type\": \"btc_move\", \"percent\": 2})",
          "inputSchema": {
            "properties": {
              "credit_token": {
                "description": "Prepaid token (btf_...), returned once by buy_credits or create_feed. Send it on every later feed or credit call.",
                "type": "string"
              },
              "endpoint": {
                "description": "Endpoint to deliver: btc_intuitive, btc_stats, btc_pro, btc_signals, weather_intuitive, weather_stats, weather_signals, travel_intuitive, stock_filings or stock_fundamentals (deprecated aliases such as btc_price, btc_oracle, weather_now and airport_delays still work). Put its arguments in `params`.",
                "type": "string"
              },
              "interval": {
                "description": "mode=schedule: 'hourly', 'daily' or a number of seconds (minimum 900).",
                "type": "string"
              },
              "interval_seconds": {
                "description": "mode=schedule: the interval in seconds (alternative to interval).",
                "type": "integer"
              },
              "mailbox": {
                "default": true,
                "description": "Also store deliveries in the mailbox (default true).",
                "type": "boolean"
              },
              "mode": {
                "description": "schedule: deliver on an interval. trigger: deliver when the trigger condition hits.",
                "enum": ["schedule", "trigger"],
                "type": "string"
              },
              "params": {
                "description": "Endpoint parameters, e.g. {location}, {airport} or {symbol}.",
                "type": "object"
              },
              "trigger": {
                "description": "Required when mode=trigger. type is one of: btc_move (percent, optional window_seconds), btc_threshold (above and/or below, in USD), weather_alert (location), airport_delay (airport, optional min_delay_minutes), sec_filing (symbol, optional forms; default 8-K, 10-Q, 10-K). Optional max_fires, expires_at, cooldown_seconds.",
                "type": "object"
              },
              "webhook_url": {
                "description": "https URL to POST deliveries to. A signing secret is returned once.",
                "type": "string"
              }
            },
            "required": ["endpoint", "mode"],
            "type": "object"
          },
