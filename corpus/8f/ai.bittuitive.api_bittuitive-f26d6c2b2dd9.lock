        {
          "name": "call_routed_api",
          "title": "Call any verified data API through BitTuitive (sats or USDC)",
          "description": "Use this when you want data from another paid API without handling its invoice: pay ONE BitTuitive invoice (sats, or the same all-in price in USDC via x402) and BitTuitive pays the upstream, calls it and returns its JSON in `data` plus `routing` (upstream, score, fee). Pass endpoint_id (from list_routable_apis) or data_type and/or q for the best pick with automatic fallback. Cost: upstream price + routing fee max(20%, 3 sats). Side effect: spends your payment on the upstream call; if every upstream fails you get a 24h credit token to pass as `credit`. If the result is status 'running', repeat the identical call to collect it. Payment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and x402 terms; pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (single use, valid 10 min) or x402_payment. Bad input is rejected before any invoice. Example: call_routed_api(data_type=\"bitcoin\", q=\"mempool fees\") Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "24h credit token from an earlier failed routed call (instead of paying).",
                "type": "string"
              },
              "data_type": {
                "description": "Best-pick mode: category.",
                "enum": ["bitcoin", "crypto", "stocks", "weather", "traffic", "other"],
                "type": "string"
              },
              "endpoint_id": {
                "description": "Scoreboard id from list_routable_apis.",
                "type": "string"
              },
              "l402_credential": {
                "description": "L402 credential '<macaroon>:<preimage_hex>' from a paid invoice (or an active subscription). Omit it on the first call to receive the Lightning invoice and macaroon.",
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Optional query parameters forwarded to the upstream API.",
                "type": "object"
              },
              "q": {
                "description": "Best-pick mode: keywords, e.g. 'air quality'.",
                "type": "string"
              },
              "x402_payment": {
                "description": "x402 payment (USDC on Base): base64 PaymentPayload signed for accepts[0] of the payment_required result. Alternative to l402_credential; also accepted in params._meta['x402/payment'].",
                "type": "string"
              }
            },
            "type": "object"
          },
