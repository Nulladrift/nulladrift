        {
          "name": "browse_scoreboard",
          "title": "Browse the API scoreboard (free)",
          "description": "Use this when you want to survey the market instead of getting one pick: list paid agent APIs by score with filters (view=\"search\": q, data_type, protocol, min_score, paging), or see per-category entry counts, average scores and top endpoints (view=\"categories\"). Free, read-only. Example: browse_scoreboard(view=\"categories\") to see which data types have reliable suppliers.",
          "inputSchema": {
            "properties": {
              "data_type": {
                "description": "view=search: category filter.",
                "enum": ["bitcoin", "crypto", "stocks", "weather", "traffic", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "view=search: page size.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "view=search: minimum 0-100 score.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "view=search: entries to skip.",
                "minimum": 0,
                "type": "integer"
              },
              "protocol": {
                "description": "view=search: protocol filter.",
                "enum": ["L402", "x402"],
                "type": "string"
              },
              "q": {
                "description": "view=search: text to match in name, description and URL.",
                "type": "string"
              },
              "top": {
                "default": 3,
                "description": "view=categories: top endpoints per data type.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "view": {
                "default": "search",
                "description": "search lists entries; categories summarises each data type.",
                "enum": ["search", "categories"],
                "type": "string"
              }
            },
            "type": "object"
          },
