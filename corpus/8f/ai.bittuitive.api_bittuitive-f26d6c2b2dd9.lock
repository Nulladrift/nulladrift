        {
          "name": "get_stocks_data",
          "title": "SEC computed fundamentals",
          "description": "Use this when a research agent needs computed SEC fundamentals and parsed Form 4 insider trades, not raw reprints: the latest-quarter snapshot with margins, growth and the latest Form 4 (kind=\"intuitive\", the default; stock_filings is a deprecated alias), multi-quarter history, TTM and recent Form 4s (kind=\"stats\"), restatement-aware series, optional compare and 90-day net Form 4 activity (kind=\"pro\"), or acceleration/deceleration signals in revenue, cash flow and margins plus Form 4 cluster-purchase and size-versus-holdings flags (kind=\"signals\", feedable on new Form 4s). Pass symbol or omit to default to AAPL. SEC EDGAR only. Informational only, not investment advice, and not a buy, sell or hold. Example: get_stocks_data(kind=\"signals\", symbol=\"NVDA\"). Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when an agent needs a company's latest fiscal-quarter snapshot with already-computed margins and growth, plus recent 10-K, 10-Q and 8-K links and the latest parsed Form 4 insider trade. Pass symbol or omit to default to AAPL. SEC EDGAR only. Informational only, not investment advice. MCP: get_stocks_data(kind=\"intuitive\", symbol=\"NVDA\").\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when an agent needs fiscal-quarter history with TTM and QoQ/YoY growth for revenue, cash flow and margins, plus a recent Form 4 insider-trade history. Pass symbol or omit to default to AAPL. Informational only. MCP: get_stocks_data(kind=\"stats\", symbol=\"NVDA\"). 50 sats or $0.05 USDC.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when an agent must see restatements, amendments, derived Q4, TTM and data-quality flags, or compare two tickers, plus 90-day net Form 4 activity by reporting owner. Pass symbol and optional compare (e.g. compare=AMD). Informational only. MCP: get_stocks_data(kind=\"pro\", symbol=\"NVDA\", compare=\"AMD\"). 100 sats or $0.10 USDC.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when an agent must know whether revenue, operating cash flow, FCF or margin growth is speeding up or slowing down (QoQ and YoY change-of-change), with a Data BitScore, plus Form 4 signals (cluster open-market purchases and size versus holdings). Feedable on new 10-Q, 10-K and Form 4 filings. Informational only, not investment advice.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
