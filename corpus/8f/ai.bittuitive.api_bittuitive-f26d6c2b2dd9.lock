        {
          "name": "get_btc_data",
          "title": "Bitcoin data",
          "description": "Use this when an agent needs Bitcoin data. For the current Bitcoin price (BTC/USD, btc price), start with kind=\"intuitive\" (the default; also get_bitcoin_price): a multi-source price with a Data BitScore. Fees and mempool are kind=\"stats\" (btc_oracle is a deprecated alias); ecosystem stats kind=\"pro\"; sentiment kind=\"signals\". Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this for the current Bitcoin price (BTC/USD, btc price) when a wrong quote costs money and one source is not enough: sizing a trade, settling an invoice in USD, or any decision a bot cannot take back. Returns a price checked across independent sources, with pair, price_usd and a Data BitScore (confidence, agreement, spread, freshness). No params.\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when an agent needs a Bitcoin network snapshot: fee rates (fast, average, slow sat/vB), mempool congestion, hash rate, difficulty, block height, plus the BTC price. Returns market, on_chain, fees. No params. Example: GET /api/v1/data/btc_stats or MCP get_btc_data(kind=\"stats\"). 50 sats or $0.05 USDC.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when researching or monitoring the Bitcoin ecosystem: everything in btc_stats plus Lightning capacity, channel and node counts and daily miner revenue. Returns market, on_chain, lightning, mining. No params. Example: GET /api/v1/data/btc_pro or MCP get_btc_data(kind=\"pro\"). 100 sats or $0.10 USDC.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when a research agent needs Bitcoin sentiment and trend context: Fear & Greed, percent from all-time high, momentum, volatility regime and 24h transactions. No params. Example: GET /api/v1/data/btc_signals or MCP get_btc_data(kind=\"signals\"). Informational only, not investment advice. 200 sats or $0.20 USDC.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
