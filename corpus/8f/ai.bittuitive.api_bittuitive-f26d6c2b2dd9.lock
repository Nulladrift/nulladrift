      "instructions": "BitTuitive: One Lightning payment, any verified data API, routed to the highest-rated source with automatic fallback. Reliable data for AI agents, paid per call over Lightning (L402); see the ROUTER section below. FREE: an independent scoreboard of paid agent APIs (L402 and x402) grouped by data type (bitcoin, crypto, stocks, weather, traffic, other) with 0-100 quality scores from unpaid probes: use best_endpoint to pick a reliable API for a need, scoreboard_search to browse, scoreboard_categories for the top of each type. Each paid tool description lists the price in sats, an illustrative sample result (not live data), and how to pay. Call a paid tool without l402_credential to get a payment_required error (isError=true) with a Lightning invoice and macaroon. Pay that invoice yourself (lnget, a Lightning wallet, or NWC / the Alby SDK), then retry with l402_credential='<macaroon>:<preimage_hex>' or Authorization: L402 <macaroon>:<preimage>. One payment = one response (use within 10 minutes). Subscriptions (30 days, daily quota) also work as l402_credential. This server never spends from your wallet. USDC via x402 is coming soon. If nothing matches what you need, use the free request_data tool (or POST /api/v1/request-data) to record a demand signal; BitTuitive does not auto-add sources. Ranked counts and trends are the paid get_market_insights tool (also in the pro subscription); public /api/v1/insights/* pages are teasers only. STOCKS (L402): get_stock_fundamentals 25 sats and get_stock_filings 10 sats take symbol, any US ticker that maps to an SEC CIK (featured: SPY, QQQ, NVDA, TSLA, AAPL, MSFT, AMZN, META, GOOGL, AMD, AVGO, MU, PLTR, NBIS, CRWV, RKLB, INTC, ASTS, HIMS, TSM, SOFI, ORCL, HOOD, NFLX, SMCI, COIN, MSTR, IBIT, MARA, GME). First-party FMP quotes stay off; the router only fetches stock prices from vetted sources. ROUTER (one Lightning payment, any verified data API): route_endpoints lists every scoreboard-verified L402 data API BitTuitive can call for you, ranked by quality score and latency; route_call buys one call: you pay ONE BitTuitive invoice (upstream price + fee: max(25%, 5 sats)), BitTuitive pays the upstream API, calls it and returns its data with routing metadata (upstream, score, fee). Pick by endpoint_id or by data_type/q (highest-rated endpoint, automatic fallback to the next-best). Call route_call again with the SAME arguments plus l402_credential after paying. If it reports status 'running', call again the same way to collect the result. If every upstream fails you get a credit token (24 h) to pass as `credit`. WEATHER (L402): get_weather_current 10 sats, get_weather_forecast 25 sats, get_weather_alerts 10 sats. Pass lat and lon, or location='Austin, TX' / zip=10001 (US Census Gazetteer). Alerts also accept state=TX. US data is from NOAA NWS (public domain, not endorsed by NOAA). Current/forecast outside the US use MET Norway (CC BY 4.0). Alerts are US-only. A missing location returns an error before any invoice. TRAVEL (L402): get_airport_delays 10 sats (optional airport=SFO for one airport, or omit for the full FAA snapshot) and get_travel_airport 25 sats (airport required: delays plus current weather and NWS alerts). Source: Federal Aviation Administration NAS Status (public domain, not for navigation, not endorsed by the FAA). A missing or invalid airport on get_travel_airport returns an error before any invoice.",
