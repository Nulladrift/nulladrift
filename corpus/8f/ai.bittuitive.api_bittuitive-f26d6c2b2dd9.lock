              "need": {
                "description": "What the API should provide, in keywords, e.g. 'bitcoin price' or 'air quality'.",
                "type": "string"
              },
              "protocol": {
                "description": "Optional payment protocol filter.",
                "enum": ["L402", "x402"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
