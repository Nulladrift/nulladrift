        {
          "name": "get_airport_data",
          "title": "Airport status (alias of get_travel_data)",
          "description": "Use this when a travel agent needs US airport status: one-airport briefing (kind=\"intuitive\", the default; pass airport=SFO or omit to default to SFO), delay breakdown and recent history (kind=\"stats\"), a multi-airport or origin/destination delay-risk compare including destination weather (kind=\"pro\"; pass origin and destination or airports=SFO,JFK), or ground stop / GDP / severe-weather flags with a Data BitScore (kind=\"signals\"). Informational only, not a delay prediction, and not for navigation. Example: get_travel_data(kind=\"intuitive\", airport=\"SFO\"). Not endorsed by aviation or weather agencies. get_airport_data is a deprecated alias of this tool. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when a travel agent needs one airport briefing before a departure or connection. Pass airport (IATA or ICAO, e.g. SFO); omit to default to SFO. Returns delays, closures, current weather and alerts. Not for navigation. Example: GET /api/v1/data/travel_intuitive?airport=SFO or MCP get_travel_data(kind=\"intuitive\"). 10 sats or $0.01 USDC.\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when a travel agent needs the breakdown of why an airport is delayed (cause and FAA program) and how that has changed in recent snapshots. Pass airport (IATA or ICAO); omit to default to SFO. Informational only, not for navigation. Example: GET /api/v1/data/travel_stats?airport=SFO or MCP get_travel_data(kind=\"stats\", airport=\"SFO\").\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when a travel agent is comparing two or more US airports, or an origin and destination, and needs an informational delay-risk estimate that includes destination weather. Pass origin and destination, or airports=SFO,LAX. Informational only, not a prediction of an actual delay, and not for navigation.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when a monitoring or travel agent must know whether a US airport has a ground stop, a ground delay program (GDP), a closure, or a severe-weather flag. Pass airport (IATA or ICAO); omit to default to SFO. Returns flags, supporting events and a Data BitScore. Feedable with the airport_delay trigger. Informational only, not for navigation.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer. Deprecated alias of get_travel_data.",
