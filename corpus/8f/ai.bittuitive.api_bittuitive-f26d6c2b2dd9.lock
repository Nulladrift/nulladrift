      "instructions": "BitTuitive™: Ask BitTuitive before your agent acts. Verified data, with proof, and a check on who you're paying.\nHow to read BitScore: a 0-100 confidence score on every answer. 80 or above is high, 50-79 is medium, below 50 is low. On data endpoints it reflects source agreement and freshness. On Trust (compliance) it reflects how sure a sanctions match is, whether official lists agree, and how recently those lists were updated, with a verdict of clear, possible_match or match. On trust_signals (reputation) it reflects official-list coverage plus first-party payment and probe history, with a verdict of do_not_pay, review, ok or unknown. The score describes data, match or reputation quality only. AI and Insights are informational only, not investment advice, and are not a buy, sell or hold recommendation.\nBitTuitive™: One Payment, BTC or USDC, Any Verified Data Point, routed to the highest-rated source with automatic fallback. Paid per call, no account, no API key.\nUSE IT WHEN:\n- A trading or treasury bot needs the Bitcoin price (BTC/USD), a >2% move check, fees or sentiment, or you must price an invoice in USD: get_bitcoin_price or get_btc_data (defaults to kind=intuitive, the recommended multi-source price).\n- A travel agent must check US airport delays or ground stops, or the weather and alerts at a destination: get_travel_data (kind=intuitive) or get_weather (kind=intuitive/stats/signals).\n- A research agent needs SEC EDGAR financials or new 10-K, 10-Q and 8-K filings for a US ticker: get_stock_data.\n- A research agent needs AI Buildout trends from SEC filings: get_ai_buildout or get_ai_data (defaults to kind=intuitive) for a quick headline on one company or the whole buildout; kind=stats to compare layers or build a table; kind=pro for the full dataset including history; kind=signals for whether the buildout is accelerating or rolling over and whether capex is outgrowing cash flow. Informational only, not investment advice.\n- A monitoring agent would otherwise poll: create_feed pushes data on a schedule or trigger (webhook or mailbox).\n- You need data BitTuitive does not sell: find_best_endpoint, then call_routed_api (one payment, automatic fallback).\nFREE: find_best_endpoint, browse_scoreboard, get_scoreboard_entry (independent 0-100 quality scores of paid agent APIs), get_pricing, list_routable_apis, request_data.\nPAID DATA: get_btc_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_weather(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_finance_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_rates_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats, official 25 sats; get_alerts_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats, standalone 25 sats; get_expense_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_travel_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_stocks_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_stock_data(kind): filings 10 sats, fundamentals 30 sats; get_ai_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_trust_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_seller_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_insights_data(kind): intuitive 10 sats, stats 50 sats, pro 100 sats, signals 200 sats; get_market_insights 200 sats. Each tool description lists every kind with its price.\nHOW TO PAY: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Or prepay once with buy_credits and pass credit_token on later calls. This server never spends your funds.\nRouter: list_routable_apis shows other verified L402 APIs; call_routed_api pays one for you (one invoice: upstream price + routing fee), with automatic fallback and a credit token if all upstreams fail. Vetted sources only: BitTuitive routes just to upstreams that pass its own recent probes (quality score >= 80) and policy checks (no scrapers, URL fetchers or LLM endpoints); stock prices route only to sources with a disclosed redistribution license, and registered providers must disclose their data source and license and pass review before they are routed. BitTuitive's own data comes from public-domain or openly licensed sources (NOAA, FAA, SEC EDGAR, MET Norway). Upstreams are picked by reliability score and latency, with automatic fallback.\nCredits: buy_credits once (Lightning or USDC) -> btf_ token; pass credit_token on any paid tool; get_credit_balance.\nFeeds: create_feed, get_feeds, update_feed, delete_feed, get_feed_mailbox, ack_feed_mailbox_item: scheduled or trigger-based pushes.\nNothing fits? request_data records a demand signal; ranked demand is get_insights_data (kind=signals) or get_market_insights. Docs: https://api.bittuitive.ai/llms.txt. BitTuitive and BitScore are trademarks of BitTuitive.",
