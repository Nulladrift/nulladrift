        {
          "name": "get_ai_data",
          "title": "AI Buildout",
          "description": "Use this when a research agent needs AI Buildout trends from company regulatory filings (company-wide capex, revenue and cash flow, not an official AI-spend line and not stock prices). kind=\"intuitive\" (the default; also get_ai_buildout) is a quick headline for one company or the whole buildout; pass optional symbol (e.g. MSFT) or omit it for the universe total. kind=\"stats\" compares layers and companies (build a table). kind=\"pro\" is the full dataset including history, in one call for a report or model. kind=\"signals\" is a ready-made answer on whether the buildout is accelerating or rolling over, and whether capex is outgrowing cash flow. Informational only, not investment advice. The BitScore describes filing coverage and freshness only, not a buy, sell or hold. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 25 sats or $0.025 USDC. Use this when a research agent needs a quick headline for one company or the whole AI buildout: capex, YoY growth and whether it is speeding up. Answers 'How much is Microsoft spending, and is it accelerating?' Call GET /api/v1/data/ai_intuitive?symbol=MSFT, or omit symbol for the universe total.\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when a research agent needs to compare AI-stack layers or companies, or build a table: layer subtotals plus each company's latest quarter. Answers 'Which layer is growing capex fastest, and how do the hyperscalers compare?' Call GET /api/v1/data/ai_stats, or ?symbol=MSFT for that firm's layer.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when a research agent needs the full AI Buildout dataset in one call for a report or model: headlines, layer subtotals, every company and filing history. Answers 'Give me the complete buildout series I can put in a spreadsheet.' Call GET /api/v1/data/ai_pro.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when a research agent needs a ready-made answer on whether the AI buildout is accelerating or rolling over, and whether capex is outgrowing cash flow. Answers 'Is hyperscaler capex speeding up, and can cash still fund it?' Call GET /api/v1/data/ai_signals or ?symbol=MSFT. Trends only, not a buy, sell or hold view.\nPayment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and, if enabled, x402 terms (USDC on Base). Pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (HTTP equivalent: Authorization: L402 <macaroon>:<preimage>; single use, valid 10 min), x402_payment / params._meta['x402/payment'], or credit_token (prepaid, see buy_credits). Invalid input is rejected before any invoice. Copy-pasteable examples: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
