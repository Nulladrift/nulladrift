        {
          "name": "get_seller_data",
          "title": "Seller payment screen",
          "description": "Use this when an agent is about to pay a seller and needs a screening aid that bundles the trust_signals counterparty check, price fairness versus the Agent Services Price Index, and observed uptime or latency. kind=\"intuitive\" (the default) is the compact verdict; kind=\"stats\" adds figures; kind=\"pro\" is the full bundle; kind=\"signals\" is the proprietary combined screen (top premium). Verdicts are do_not_pay, review, ok or unknown. Unknown is not a finding that a seller is safe. Screening aid only, not legal advice. Example: get_seller_data(kind=\"signals\", domain=\"example.com\"). Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when an agent is about to pay a seller and needs a compact screening aid: a verdict of do_not_pay, review, ok or unknown, plus price-fairness and uptime headlines. Unknown is not a finding that a seller is safe. Pass a pay-to address, invoice, domain or name; optional price_usd and data_type compare the list price to the Agent Services Price Index.\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when an agent needs the figures behind a seller screen: price versus the index (median, p10, p90) and observed 7-day uptime and latency. Screening aid only, not legal advice, a KYC or AML product, or a guarantee that a payment will succeed or that a seller will deliver. An unknown result is not a finding that a seller is safe.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when an agent needs the full pre-payment bundle: the trust_signals check, price fairness versus the index, and observed reliability. Screening aid only, not legal advice, a KYC or AML product, or a guarantee that a payment will succeed or that a seller will deliver. An unknown result is not a finding that a seller is safe.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when an agent needs the proprietary combined should-I-pay-this-seller signals: clustered flags on official-list hits, price outliers versus the index, and low observed uptime. Top premium. Unknown is not safe. Screening aid only, not legal advice, a KYC or AML product, or a guarantee that a payment will succeed or that a seller will deliver.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
