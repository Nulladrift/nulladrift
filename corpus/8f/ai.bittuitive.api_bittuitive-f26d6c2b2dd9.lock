        {
          "name": "get_fx_data",
          "title": "Official FX reference rates",
          "description": "Use this when an agent needs official daily foreign-exchange reference rates for USD, EUR, CAD and common crosses, with a Data BitScore from the European Central Bank and the Bank of Canada. These are reference rates, not live tradable quotes. Tool: get_fx_data, pick kind=\"rates\". Returns rates, sources, as_of dates and a bitscore object. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"rates\": 8 sats or $0.005 USDC. Use this when an agent needs official daily foreign-exchange reference rates for USD, EUR, CAD and common crosses, with a Data BitScore that says how closely the European Central Bank and the Bank of Canada agree and how fresh the latest value dates are. These are reference rates, not live tradable quotes.\nPayment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and, if enabled, x402 terms (USDC on Base). Pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (HTTP equivalent: Authorization: L402 <macaroon>:<preimage>; single use, valid 10 min), x402_payment / params._meta['x402/payment'], or credit_token (prepaid, see buy_credits). Invalid input is rejected before any invoice. Copy-pasteable examples: https://api.bittuitive.ai/pay.",
