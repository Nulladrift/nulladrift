        },
        {
          "name": "find_best_endpoint",
          "title": "Find the best paid API for a need (free)",
          "description": "Use this when your task needs a paid data API you have not picked yet (e.g. 'bitcoin price', 'air quality', 'stock fundamentals') and you want the most reliable one. Returns up to `limit` endpoints ranked by BitTuitive's own 0-100 quality score (from independent unpaid probes): id, URL, protocol (L402 or x402), price and score. Free, read-only. Next: get_scoreboard_entry(id) for probe history, or call_routed_api to buy from it. Example: find_best_endpoint(need=\"air quality\", limit=3)",
          "inputSchema": {
            "properties": {
              "data_type": {
                "description": "Optional category filter.",
                "enum": ["bitcoin", "crypto", "stocks", "weather", "traffic", "other"],
                "type": "string"
              },
              "limit": {
                "default": 3,
                "description": "How many results (1-10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
