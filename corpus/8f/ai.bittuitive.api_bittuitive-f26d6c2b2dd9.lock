        {
          "name": "get_insights_data",
          "title": "Agent demand insights",
          "description": "Use this when you are deciding what data to build, source or price, or want to know what other AI agents ask for and pay for. kind=\"intuitive\" is a headline; kind=\"stats\" adds willingness to pay and unmet searches; kind=\"pro\" is the full report; kind=\"signals\" is a derived build-next signal. Aggregates only (k-anonymized). The BitScore describes coverage and freshness of those aggregates only; informational only, not investment advice, not a buy, sell or hold. get_market_insights is a deprecated alias of kind=\"signals\". Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when you want the Agent Services Price Index headline: median and mean list price for single-data-point API endpoints, sample size, as-of, and a one-line type split. Own demand aggregates are included when available. No params. Example: GET /api/v1/data/insights_intuitive or MCP get_insights_data(kind=\"intuitive\").\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when you want price-index breakdowns by category and type, with percentiles and sample sizes, plus willingness to pay and unmet searches from our own demand aggregates. No params. Example: GET /api/v1/data/insights_stats or MCP get_insights_data(kind=\"stats\"). Informational only, not investment advice, and not a buy, sell or hold recommendation.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when you want the full price index: breakdowns, the daily trend, and BitTuitive's position versus the index, plus the full agent-demand report. Aggregates only. Example: GET /api/v1/data/insights_pro or MCP get_insights_data(kind=\"pro\"). Informational only, not investment advice, and not a buy, sell or hold recommendation. 100 sats or $0.10 USDC.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when you want index movers, category growth context (x402stats volume, CC BY 4.0) and unmet demand, plus supply-demand gaps from our own aggregates. Example: GET /api/v1/data/insights_signals or MCP get_insights_data(kind=\"signals\") / get_market_insights(). Informational only, not investment advice, and not a buy, sell or hold recommendation.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
