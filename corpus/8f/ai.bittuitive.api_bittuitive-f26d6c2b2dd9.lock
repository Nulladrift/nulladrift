        {
          "name": "get_alerts_data",
          "title": "Official government alerts",
          "description": "Use this when an agent needs official US government alert streams: USGS earthquakes, CISA Known Exploited Vulnerabilities, openFDA drug recalls, or Federal Register documents. kind=\"intuitive\" (the default) is the latest item from one stream (pass stream=usgs_quakes, cisa_kev, openfda_recalls or federal_register); kind=\"stats\" is recent items; kind=\"pro\" is a digest of all four; kind=\"signals\" is computed flags (for example a magnitude 6+ quake or a Class I recall). The push_* names remain deprecated aliases at their original 25-sat price. Informational only, not medical, legal or safety advice. Example: get_alerts_data(kind=\"intuitive\", stream=\"usgs_quakes\"). Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when an agent needs the latest official item from one government stream (USGS earthquakes, CISA KEV, openFDA recalls, or the Federal Register). Pass stream=usgs_quakes (the default), cisa_kev, openfda_recalls or federal_register. Informational only, not medical, legal or safety advice, and not a buy, sell or hold.\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when an agent needs the recent official items from one government stream, not just the latest. Pass stream= and optional limit=. Informational only, not medical, legal or safety advice, and not a buy, sell or hold. Not affiliated with or endorsed by USGS, CISA, the FDA, NARA or the Federal Register. Verify against the official source before acting.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when an agent needs a digest of the latest official items across USGS, CISA KEV, openFDA recalls and the Federal Register in one call. Informational only, not medical, legal or safety advice, and not a buy, sell or hold. Not affiliated with or endorsed by USGS, CISA, the FDA, NARA or the Federal Register.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when an agent needs computed flags on official items (for example a magnitude 6+ earthquake, a CISA KEV labeled known ransomware, a Class I recall, or a Federal Register rule). Informational only, not medical, legal or safety advice, and not a buy, sell or hold. Not affiliated with or endorsed by USGS, CISA, the FDA, NARA or the Federal Register.\n- kind=\"standalone\": 25 sats or $0.025 USDC. Deprecated listed alias of alerts_intuitive?stream=federal_register at the original 25 sat / $0.025 pull price. Feed updates stay 13 sats / $0.0125. Informational only, not medical, legal or safety advice, and not a buy, sell or hold. Not affiliated with or endorsed by USGS, CISA, the FDA, NARA or the Federal Register.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
