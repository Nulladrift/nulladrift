        {
          "name": "get_finance_data",
          "title": "Official FX reference rates",
          "description": "Use this when an agent needs official daily FX reference rates (ECB and Bank of Canada), with a Data BitScore. kind=\"intuitive\" (the default) is one pair (default EURUSD); kind=\"stats\" is the multi-currency table and optional remittance conversion; kind=\"pro\" adds history; kind=\"signals\" is notable FX moves plus official policy-rate context. Reference rates, not live tradable quotes. Informational only, not a buy, sell or hold. Example: get_finance_data(kind=\"stats\"). Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Use this when an agent needs the latest official daily FX reference rate for one currency pair (default EURUSD; set pair=USDMXN for a remittance corridor) and a reserved gold/silver slot. These are official dailies, not live tradable quotes and not a send-money quote. MCP: get_finance_data(kind=\"intuitive\", pair=\"USDMXN\").\n- kind=\"stats\": 50 sats or $0.05 USDC. Use this when an agent needs a multi-currency official FX table, cross rates and a remittance-corridor conversion (optional amount, from, to). Official dailies from the ECB and the Bank of Canada, not live tradable or send-money quotes. MCP: get_finance_data(kind=\"stats\", amount=100, from=\"USD\", to=\"MXN\"). Informational only, not investment advice.\n- kind=\"pro\": 100 sats or $0.10 USDC. Use this when an agent needs official FX history and changes, and optionally SEC EDGAR fundamentals and filings for one US ticker (?symbol=AAPL). History covers about 30 days (days=7 to 90). MCP: get_finance_data(kind=\"pro\", pair=\"EURUSD\", symbol=\"AAPL\"). Not endorsed by the SEC, the ECB or the Bank of Canada. Informational only, not investment advice.\n- kind=\"signals\": 200 sats or $0.20 USDC. Use this when an agent needs notable official FX-rate moves and ECB/BoC divergence, plus a Fed vs ECB vs Bank of Canada policy-rate comparison, the Treasury yield-curve shift versus recent history, and inversion state, with a BitScore for freshness and source agreement. Official-source speed, not a news wire. Not endorsed by the Federal Reserve, the U.S.\nPayment: Pay by calling without a credential, paying the Lightning invoice or the USDC amount, then retrying with l402_credential='<macaroon>:<preimage>' or x402_payment. One payment buys one response. Details: https://api.bittuitive.ai/pay. Informational only; not financial, investment, legal or tax advice; provided as-is, with no warranty; verify before acting. https://api.bittuitive.ai/disclaimer.",
