        },
        {
          "name": "get_airport_data",
          "title": "Airport status",
          "description": "Use this when a travel agent must know whether a US airport has delays, a ground stop or a closure before booking, rebooking or telling a user when to leave (FAA NAS Status). Not for navigation. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"delays\": 10 sats or $0.01 USDC. Use this when a travel agent must check for ground stops, ground-delay programs, arrival or departure delays and closures at a US airport before booking, rebooking or telling a user when to leave. Omit airport for the national FAA NAS Status snapshot. Not for navigation. Not endorsed by the FAA. MCP: get_airport_data(kind=\"delays\", airport=\"SFO\")\n- kind=\"report\": 30 sats or $0.025 USDC. Use this when a travel agent needs one airport briefing before a departure or connection (airport=SFO, or omit to default to SFO): FAA delay and closure events plus current NOAA weather and NWS alerts in one call. Not for navigation. Not endorsed by the FAA or NOAA. MCP: get_airport_data(kind=\"report\", airport=\"SFO\")\nPayment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and, if enabled, x402 terms (USDC on Base). Pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (HTTP equivalent: Authorization: L402 <macaroon>:<preimage>; single use, valid 10 min), x402_payment / params._meta['x402/payment'], or credit_token (prepaid, see buy_credits). Invalid input is rejected before any invoice. Copy-pasteable examples: https://api.bittuitive.ai/pay.",
          "inputSchema": {
            "properties": {
              "airport": {
                "description": "US airport IATA (SFO) or ICAO (KSFO) code. Required for kind=report; optional filter for kind=delays.",
                "type": "string"
              },
              "credit_token": {
                "description": "Prepaid token (btf_..., from buy_credits). Pays this call from your prepaid sats or USDC balance with no invoice; a failed call is refunded. Balance is non-refundable.",
                "type": "string"
              },
              "iata": {
                "description": "Alias of airport.",
                "type": "string"
              },
              "icao": {
                "description": "Alias of airport.",
                "type": "string"
              },
              "kind": {
                "description": "Product to fetch. Every kind, its price and when to use it are listed in the tool description.",
                "enum": ["delays", "report"],
                "type": "string"
              },
              "l402_credential": {
                "description": "L402 credential '<macaroon>:<preimage_hex>' from a paid invoice (or an active subscription). Omit it on the first call to receive the Lightning invoice and macaroon.",
                "type": "string"
              },
              "x402_payment": {
                "description": "x402 payment (USDC on Base): base64 PaymentPayload signed for accepts[0] of the payment_required result. Alternative to l402_credential; also accepted in params._meta['x402/payment'].",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
