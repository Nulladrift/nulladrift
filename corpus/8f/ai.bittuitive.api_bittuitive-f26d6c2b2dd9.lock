      "instructions": "BitTuitive: One Lightning payment, any verified data API, routed to the highest-rated source with automatic fallback. Reliable data for AI agents, paid per call over Lightning (L402); see the ROUTER section below. FREE: an independent scoreboard of paid agent APIs (L402 and x402) grouped by data type (bitcoin, crypto, stocks, weather, traffic, other) with 0-100 quality scores from unpaid probes: use best_endpoint to pick a reliable API for a need, scoreboard_search to browse, scoreboard_categories for the top of each type. Each paid tool description lists the price in sats, an illustrative sample result (not live data), and how to pay. Call a paid tool without l402_credential to get a payment_required error (isError=true) with a Lightning invoice and macaroon. Pay that invoice yourself (lnget, a Lightning wallet, or NWC / the Alby SDK), then retry with l402_credential='<macaroon>:<preimage_hex>' or Authorization: L402 <macaroon>:<preimage>. One payment = one response (use within 10 minutes). Subscriptions (30 days, daily quota) also work as l402_credential. This server never spends from your wallet. Paid data tools also accept USDC on Base via x402: the payment_required result carries x402Version, resource and accepts (scheme exact, eip155:8453, USDC amount in atomic units, payTo); sign accepts[0] and call the tool again with the PaymentPayload in params._meta['x402/payment'] (or a base64 x402_payment argument); the receipt comes back in _meta['x402/payment-response']. Only successful calls are settled. If nothing matches what you need, use the free request_data tool (or POST /api/v1/request-data) to record a demand signal; BitTuitive does not auto-add sources. Ranked counts and trends are the paid get_market_insights tool (also in the pro subscription); public /api/v1/insights/* pages are teasers only. BITFEED: prepaid Lightning feeds that push data on a schedule or when a trigger hits (BTC percent move, BTC threshold, NOAA weather alert, airport delay). Each delivery costs the same as a normal call to that endpoint. Tools: create_feed (omit bitfeed_token to open an account; store the btf_ token), list_feeds, get_feed, update_feed, pause_feed, resume_feed, delete_feed, get_balance, topup, get_mailbox, ack_mailbox. Page: https://api.bittuitive.ai/data/feed STOCKS (L402): get_stock_fundamentals 30 sats and get_stock_filings 10 sats take symbol, any US ticker that maps to an SEC CIK (featured: SPY, QQQ, NVDA, TSLA, AAPL, MSFT, AMZN, META, GOOGL, AMD, AVGO, MU, PLTR, NBIS, CRWV, RKLB, INTC, ASTS, HIMS, TSM, SOFI, ORCL, HOOD, NFLX, SMCI, COIN, MSTR, IBIT, MARA, GME). First-party FMP quotes stay off; the router only fetches stock prices from vetted sources. ROUTER (one Lightning payment, any verified data API): route_endpoints lists every scoreboard-verified L402 data API BitTuitive can call for you, ranked by quality score and latency; route_call buys one call: you pay ONE BitTuitive invoice (upstream price + fee: max(20%, 3 sats)), BitTuitive pays the upstream API, calls it and returns its data with routing metadata (upstream, score, fee). Pick by endpoint_id or by data_type/q (highest-rated endpoint, automatic fallback to the next-best). Call route_call again with the SAME arguments plus l402_credential after paying. If it reports status 'running', call again the same way to collect the result. If every upstream fails you get a credit token (24 h) to pass as `credit`. Vetted sources only: BitTuitive routes just to upstreams that pass its own recent probes (quality score >= 80) and policy checks (no scrapers, URL fetchers or LLM endpoints); stock prices route only to sources with a disclosed redistribution licence, and registered providers must disclose their data source and licence and pass review before they are routed. BitTuitive's own data comes from public-domain or openly licensed sources (NOAA, FAA, SEC EDGAR, MET Norway). Upstreams are picked by reliability score and latency, with automatic fallback. WEATHER (L402): get_weather_current 10 sats, get_weather_forecast 30 sats, get_weather_alerts 10 sats. Pass lat and lon, or location='Austin, TX' / zip=10001 (US Census Gazetteer). Alerts also accept state=TX. US data is from NOAA NWS (public domain, not endorsed by NOAA). Current/forecast outside the US use MET Norway (CC BY 4.0). Alerts are US-only. A missing location returns an error before any invoice. TRAVEL (L402): get_airport_delays 10 sats (optional airport=SFO for one airport, or omit for the full FAA snapshot) and get_travel_airport 30 sats (airport required: delays plus current weather and NWS alerts). Source: Federal Aviation Administration NAS Status (public domain, not for navigation, not endorsed by the FAA). A missing or invalid airport on get_travel_airport returns an error before any invoice.",
