        {
          "name": "get_weather",
          "title": "Weather",
          "description": "Use this when an agent needs weather (NOAA NWS and MET Norway, Data BitScored): current conditions, a 7-day forecast or severe-weather alerts for a city, ZIP or lat/lon, e.g. for travel and delivery planning. Pass `location`, `zip`, or `lat`+`lon`; kind=alerts also takes `state`. Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"now\": 5 sats or $0.005 USDC. Use this when a travel or logistics agent needs a quick current temperature and wind for a US city, ZIP or lat/lon (omit the parameter to default to Austin, TX). Returns temperature_f, wind_speed_mph and a text summary (about 1 km, cached up to 15 min); no humidity or Celsius (use kind=\"current\"). MCP: get_weather(kind=\"now\", location=\"Austin, TX\")\n- kind=\"current\": 10 sats or $0.01 USDC. Use this when a user asks \"what is the weather in Austin right now?\" or an agent checks conditions at a destination (omit the parameter to default to Austin, TX). Returns temperature_c, temperature_f, relative_humidity_percent, wind_speed_mph and a text summary (NWS in the US, MET Norway elsewhere). MCP: get_weather(kind=\"current\", location=\"Austin, TX\")\n- kind=\"forecast\": 30 sats or $0.025 USDC. Use this when planning trips, deliveries or outdoor events: hourly and 7-day forecast (temperature, short_forecast) for a US city, ZIP or lat/lon (omit the parameter to default to Austin, TX). MCP: get_weather(kind=\"forecast\", lat=30.27, lon=-97.74)\n- kind=\"alerts\": 10 sats or $0.01 USDC. Use this when a monitoring or travel agent must check for severe-weather warnings (tornado, flood, wind, winter storm) at a US point, city, ZIP or a whole state. Returns event, severity, headline, onset, expires. US only. Omit the parameter to default to state=TX. MCP: get_weather(kind=\"alerts\", state=\"TX\")\nPayment: call without a credential to get payment_required (isError=true) with a Lightning invoice, macaroon and, if enabled, x402 terms (USDC on Base). Pay it yourself (this server never pays), then repeat the identical call with l402_credential='<macaroon>:<preimage_hex>' (HTTP equivalent: Authorization: L402 <macaroon>:<preimage>; single use, valid 10 min), x402_payment / params._meta['x402/payment'], or credit_token (prepaid, see buy_credits). Invalid input is rejected before any invoice. Copy-pasteable examples: https://api.bittuitive.ai/pay.",
