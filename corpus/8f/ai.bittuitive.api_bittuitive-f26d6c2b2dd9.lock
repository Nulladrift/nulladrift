          "description": "Use this when an agent needs official Fed, ECB and Bank of Canada policy rates and the official Treasury par yield curve. kind=\"intuitive\" (the default) is policy rates plus the 10Y headline; kind=\"stats\" is the full curve, prior session and 10Y move (the legacy `rates` path is a deprecated alias of this, still priced at 25 sats); kind=\"pro\" adds recent daily curve history; kind=\"signals\" is the policy-rate comparison, curve shift and inversion state. Official-source speed, not a news wire. Informational only, not a buy, sell or hold, and not endorsed by any central bank. Example: get_rates_data(kind=\"intuitive\"). Returns JSON in the `data` field with source attribution. Read-only; the only side effect is the payment you choose to make.\nKinds and prices:\n- kind=\"intuitive\": 10 sats or $0.01 USDC. Official-source publication speed, not a news wire. Informational only, not a buy, sell or hold, and not endorsed by the Fed, Treasury, ECB or Bank of Canada. Data BitScore for freshness and source agreement. Use this when an agent needs the latest official Fed, ECB and Bank of Canada policy rates and the Treasury 10Y headline.\n- kind=\"stats\": 50 sats or $0.05 USDC. Official-source publication speed, not a news wire. Informational only, not a buy, sell or hold, and not endorsed by the Fed, Treasury, ECB or Bank of Canada. Data BitScore for freshness and source agreement. Use this when an agent needs official policy rates plus the official Treasury par yield curve, the prior session and the 10Y move.\n- kind=\"pro\": 100 sats or $0.10 USDC. Official-source publication speed, not a news wire. Informational only, not a buy, sell or hold, and not endorsed by the Fed, Treasury, ECB or Bank of Canada. Data BitScore for freshness and source agreement. Use this when an agent needs the official rates snapshot plus recent daily Treasury par yield curves in one call. MCP: get_rates_data(kind=\"pro\").\n- kind=\"signals\": 200 sats or $0.20 US