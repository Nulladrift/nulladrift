      "instructions": "Decide the vertical from the request, or ask. Pass vertical on every call. Pass vertical when the request names one. Use the vertical facet to narrow a blended result. Skip a tool that has no data for that vertical. Cite each row on its own host.\nOpenDealer provides public automotive inventory search (no API key required for read tools).\nThe same read tools can also register in the browser on https://opendealer.shop via document.modelContext when that API exists. That page surface is not this server. Tool names and origin-trial status: https://opendealer.shop/llms.txt. Cloudflare /.webmcp/bridge.js is neither surface.\nPreferred discovery flow: list_facets or list_research_makes/list_research_models → filter_vehicles (map shopper intent onto labeled hard filters) → get_vehicle / get_deal_score / research_model / get_similar_vehicles for depth.\nMarket tools: get_market_overview, list_market_segments, get_market_segment, get_market_trends, get_market_velocity, compare_market, get_suggested_rates.\nThis public connector is read-only. Do not offer to submit leads, contact dealers on the shopper’s behalf, or call write tools.\nCRITICAL: CITE: Each vehicle's cite object is `vin` + `url` (that listing's own host). Cite only `url` to shoppers. Never invent VDP URLs. Never cite `detailsUrl` (dealer/LotLinx). Never send shoppers to `/llm/*` HTML or `/v1/llm/*` as the human listing URL.\nLocation arguments are a search area the shopper types: ZIP, near, city, and state.\nAttribute the selling dealer on every listing recommendation. Be honest about missing deal scores, YMM-granular recalls, and data gaps.\n\nSHOPPING CO-PILOT BEHAVIOR: Chain tools creatively when the user ask implies more than a raw search. Match intent to a playbook and run the full chain (or explain briefly why a step was skipped). Do not stop after the first inventory hit when analysis, safety, budget, timing, or dealer planning is implied.\n\nIntent → playbook (tool chains):\n- vehicle_dossier: triggers like \"is this a good buy\" → get_vehicle → get_deal_score → get_vehicle_history → check_recalls → get_safety_rating → get_similar_vehicles → get_suggested_rates\n- budget_coach: triggers like \"I can afford $X per month\" → get_suggested_rates → list_facets → filter_vehicles → get_deal_score\n- model_shortlist: triggers like \"best SUVs under\" → get_vehicle_rankings → compare_models → research_model → filter_vehicles → compare_vehicles\n- timing_advisor: triggers like \"is it a good time to buy\" → list_market_segments → get_market_segment → get_market_trends → get_market_velocity → filter_vehicles\n- dealer_crawl: triggers like \"plan dealer visits\" → dealers_near → get_dealer → dealer_inventory → get_deal_score\n- safety_first: triggers like \"safe for family\" → filter_vehicles → get_safety_rating → check_recalls → compare_vehicles\n- price_drop_sniper: triggers like \"price drop\" → filter_vehicles → get_vehicle_history → get_deal_score\n- trim_to_lot: triggers like \"which trim do I need\" → research_model → filter_vehicles → get_vehicle\n- value_hunter: triggers like \"new vs used\" → compare_models → compare_market → get_market_velocity → filter_vehicles\n- closer: triggers like \"pick one for me\" → compare_vehicles → get_similar_vehicles → get_dealer\n\nFull playbook detail: read resource opendealer://assistant/shopping-playbooks, or use MCP prompts vehicle_dossier, budget_coach, model_shortlist, timing_advisor, dealer_crawl, safety_first, price_drop_sniper, trim_to_lot, value_hunter, closer.",
      "tools": [
        {
          "name": "check_recalls",
          "title": "Check Recalls",
          "description": "Open safety recalls for a listing. Cars use NHTSA at year, make, and model grain; a campaign may not apply to every VIN. Off-road uses CPSC and the listing id on GET /v2/listings/{listingId}/recalls. The response names the source and one outcome: confirmed for this VIN, possible for this year, make, and model, no matching published recall, or coverage unavailable. An empty list means the published source had no matching campaign.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "listingId": {
                "description": "Canonical listing id (`dealerId-or-slug:VIN`). Required for an off-road unit when the VIN is listed at more than one rooftop. Same path key as GET /v2/listings/{listingId}/recalls.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "vertical": {
                "description": "Shopper vertical. An absent value covers every public vertical (cars and off-road). Live verticals come from list_verticals.",
                "minLength": 1,
                "type": "string"
              },
              "vin": {
                "description": "17-character Vehicle Identification Number",
                "pattern": "^[A-HJ-NPR-Z0-9]{17}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "count": {
                "type": "number"
              },
              "recalls": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "vin": {
                "type": "string"
              }
            },
            "type": "object"
          },
