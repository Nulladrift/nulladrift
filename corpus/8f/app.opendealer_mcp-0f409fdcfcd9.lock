        {
          "name": "get_deal_score",
          "title": "Get Deal Score",
          "description": "Deal score and market context for one listing: a 1 to 100 score with a rating, price versus the market average, days on lot, price history, and similar vehicles in the market.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "dealerId": {
