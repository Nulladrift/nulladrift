        {
          "name": "search_vehicles",
          "title": "Search Vehicles",
          "description": "Forgiving vehicle search over the live index. Accepts a natural-language query, a 17-character VIN, or structured filters. Listings with zero photos are omitted. Location is a search area the shopper states: zip and radius, near, city and state, or county and state. Each vehicle row includes cite.vin and cite.url. cite.url is that listing's page on its own host.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bodyType": {
                "description": "Vehicle body style. Same as GET /v1/vehicles bodyType.",
                "enum": ["sedan", "suv", "truck", "coupe", "van", "wagon", "convertible", "hatchback"],
                "type": "string"
              },
              "certified": {
                "description": "Certified pre-owned only. Same as GET /v1/vehicles certified.",
                "type": "boolean"
              },
              "city": {
                "description": "City name",
                "minLength": 1,
                "type": "string"
              },
              "class": {
                "description": "Off-road class. Legal when vertical=offroad. side-by-side, atv, or snowmobile.",
                "enum": ["side-by-side", "atv", "snowmobile"],
                "type": "string"
              },
              "color": {
                "description": "Exterior color (e.g., black, white). Resolved to color families, so \"black\" matches \"Crystal Black Pearl\". Same as GET /v1/vehicles color.",
                "minLength": 1,
                "type": "string"
              },
              "condition": {
                "description": "Listing condition. Same as GET /v1/vehicles condition: new, used, or cpo. The value certified is a deprecated alias of cpo.",
                "enum": ["new", "used", "cpo"],
                "type": "string"
              },
              "county": {
                "description": "County name",
                "minLength": 1,
                "type": "string"
              },
              "dealerId": {
                "description": "Filter to a single dealer UUID. Same as GET /v1/vehicles/search dealerId.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "displacementMax": {
                "description": "Maximum engine displacement in cc. Legal when vertical=offroad. Same as GET /v2/listings/search displacementMax.",
                "minimum": 0,
                "type": "number"
              },
              "displacementMin": {
                "description": "Minimum engine displacement in cc. Legal when vertical=offroad. Same as GET /v2/listings/search displacementMin.",
                "minimum": 0,
                "type": "number"
              },
              "drive": {
                "description": "Drive: 2wd, 4wd, or awd. Legal when vertical=offroad. Same as GET /v2/listings/search drive.",
                "enum": ["2wd", "4wd", "awd"],
                "type": "string"
              },
              "drivetrain": {
                "description": "Drivetrain configuration. Same as GET /v1/vehicles drivetrain.",
                "enum": ["fwd", "rwd", "awd", "4wd"],
                "type": "string"
              },
              "fuelType": {
                "description": "Fuel type. Same as GET /v1/vehicles fuelType.",
                "enum": ["gasoline", "diesel", "electric", "hybrid", "plug-in-hybrid"],
                "type": "string"
              },
              "hasImages": {
                "description": "Listings with zero photos are omitted. Same as GET /v1/vehicles/search hasImages=true.",
                "type": "boolean"
              },
              "inventoryStatus": {
                "description": "Inventory disposition filter. Same as GET /v1/vehicles/search inventoryStatus.",
                "enum": ["on_lot", "in_transit", "sold", "reserved", "all"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of results to return (1-100, default: 25)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Vehicle make (e.g., Honda, Toyota, Tesla)",
                "minLength": 1,
                "type": "string"
              },
              "mileageMax": {
                "description": "Maximum mileage. Same as GET /v1/vehicles mileageMax.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "description": "Search mode. hybrid matches conceptual queries with little keyword overlap. Hard caps still apply as filters. Keyword is the fallback when semantic search is unavailable.",
                "enum": ["keyword", "hybrid"],
                "type": "string"
              },
              "model": {
                "description": "Vehicle model (e.g., Civic, Camry, Model 3). Broad terms match all variants (Civic -> Civic Sedan/Si/Hatchback) unless narrowed by trim.",
                "minLength": 1,
                "type": "string"
              },
              "near": {
                "description": "Location string (ZIP or city, state). Same as GET /v1/vehicles/search near.",
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number (1-based). Same as GET /v1/vehicles/search page.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "priceChangeMax": {
                "description": "Maximum indexed priceChange (USD delta vs first recorded ask). -1 excludes unchanged listings.",
                "type": "number"
              },
              "priceChangeMin": {
                "description": "Minimum indexed priceChange (USD delta vs first recorded ask; negative means a drop)",
                "type": "number"
              },
              "priceMax": {
                "description": "Maximum price in USD. Same as GET /v1/vehicles priceMax.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "priceMin": {
                "description": "Minimum price in USD. Same as GET /v1/vehicles priceMin.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Free-text query, or a 17-character VIN. A sentence may include price, mileage, year, condition, and a zip with radius as hard constraints. Make, model, color, and body words match the index. Explicit structured params override values parsed from the sentence.",
                "minLength": 1,
                "type": "string"
              },
              "radius": {
                "description": "Search radius in miles (1-250). An absent value uses the platform default of 150 miles, the same as the shop and the Runtime API.",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "seats": {
                "description": "Seating capacity. Legal when vertical=offroad. Same as GET /v2/listings/search seats.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "semanticRatio": {
                "description": "Semantic blend weight 0..1 when mode=hybrid (default 0.5). Higher = more conceptual matching.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "sortBy": {
                "description": "Sort field. Same as GET /v1/vehicles/search sortBy: price, vehiclemodeldate, distance, updatedat, mileage, daysonlot, pricechange.",
                "enum": ["price", "vehiclemodeldate", "distance", "updatedat", "mileage", "daysonlot", "pricechange"],
                "type": "string"
              },
              "sortOrder": {
                "description": "Sort direction. Same as GET /v1/vehicles sortOrder.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code (e.g., CA, TX)",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "subtype": {
                "description": "Off-road sub-type: sport, utility, or youth. Legal when vertical=offroad. Same as GET /v2/listings/search subtype.",
                "enum": ["sport", "utility", "youth"],
                "type": "string"
              },
              "transmission": {
                "description": "Transmission type. Same as GET /v1/vehicles transmission.",
                "enum": ["automatic", "manual", "cvt"],
                "type": "string"
              },
              "trim": {
                "description": "Trim level (e.g., EX, Limited, Performance)",
                "minLength": 1,
                "type": "string"
              },
              "vehicleModelDate": {
                "description": "Exact model year. Same as GET /v1/vehicles/search vehicleModelDate.",
