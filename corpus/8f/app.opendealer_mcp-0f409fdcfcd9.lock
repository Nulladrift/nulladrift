          "description": "Structured inventory lookup. Exact filters on the same live index as search_vehicles, with totals for those filters. Listings with zero photos are omitted. fuelType is the canonical label. transmission and drivetrain match every indexed raw string in that bucket (automatic includes \"8-Speed Automatic\"). A 503 powertrain_filter_unavailable means that facet list could not be read. Location is a search area the shopper states: zip, near, city and state, or county and state. Each vehicle row includes cite.vin and cite.url. cite.url is that listing's page on its own host.",
          "inputSchema": {
