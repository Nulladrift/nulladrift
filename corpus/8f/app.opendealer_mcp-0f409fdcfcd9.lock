        {
          "name": "get_vehicle_history",
          "title": "Get Vehicle Price History",
          "description": "OpenDealer listing history for a VIN or listing id: price changes, days on lot, and status, including vehicles that left a dealer feed. Fields include chronological price history, days-on-market signals, badges, and active or no-longer-listed status when known. A sold vehicle has no deal score on this record. URL fields, when present, are the ones on the record.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
