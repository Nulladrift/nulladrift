{
  "lockfileVersion": 2,
  "subjects": {
    "com.detourmap/places": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://detourmap.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "detourmap",
        "title": "Detourmap — every place worth the detour",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read-only tools over the Detourmap atlas: 39,832 notable places across 233 countries, and nothing else — the map is cut to 2 kinds: archaeological (ancient ruins, tombs, ghost towns, shipwrecks, catacombs, mines, battlefields and crash sites); nature (parks, mountains, waterfalls, caves, volcanoes and coves). It is an atlas of what nature made and what people left behind, so it holds no museums, galleries, churches, castles, gardens or theme parks. (Facts from Wikidata, CC0; every place has a photo and a Wikipedia article, in English where one exists and otherwise in at least three other languages.) Every result links its spot on https://detourmap.com. Use search_places / get_place for lookups, places_near for \"what's worth visiting near X\" (geocode X first), top_places for fame, list_kinds / list_countries for coverage, get_statistics for aggregate claims and random_place for discovery.",
      "tools": [
        {
          "name": "get_place",
          "title": "Get one place in full",
          "description": "Fetch one place’s full record by slug (preferred, e.g. \"neuschwanstein-castle\") or exact name: coordinates, founding year, worldwide fame rank and tier, short description, photo URL, Wikipedia and Wikidata links, and a deep link that opens it on the map. Unsure of the slug? Call search_places first.",
          "inputSchema": {
            "properties": {
              "place": {
                "description": "Slug (preferred, e.g. \"colosseum\") or exact name",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c28fe230fc6eb813e12f2bd00736bb7e0dccc8292df191a1de860a3810dd67e0"
        },
        {
          "name": "get_statistics",
          "title": "Atlas statistics",
          "description": "Headline statistics computed live from the atlas: totals by kind, top countries, fame-tier sizes, dated-entry stats, geographic extremes and the most famous place. The source for aggregate claims like \"how many castles are on Detourmap\" or \"which country has the most notable places\".",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7c9b5a34f09a7465f99bddd70a2eddbeef5a4198bd7c6d48969b19383964846"
        },
        {
          "name": "list_countries",
          "title": "Countries with place counts",
          "description": "Every country in the atlas with its place count, most first — answers \"which country has the most notable places\". Countries with eight or more places include a browsable index page URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c09566d4e6609ad150345d82673d6650ddf63668582fc5f208b8f3ee492d6e92"
        },
        {
          "name": "list_kinds",
          "title": "The kinds of place on the map",
          "description": "The layers Detourmap carries — archaeological and nature — with worldwide counts and a browsable index page for each. The atlas is cut to these kinds and holds nothing else.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec7ec44ae336f59eabea41d40ef400066fd5a1eb4938cd166963e914c26647ae"
        },
        {
          "name": "places_near",
          "title": "Find places worth a detour near a point",
          "description": "List notable places within a radius of a WGS84 coordinate, most famous first (rank order), each with distance_km — the direct answer to \"what is worth visiting near <place>?\". Radius defaults to 50 km (max 500). Geocode the location yourself, then call this with its latitude/longitude. Filter by kind to answer e.g. \"waterfalls near Zurich\".",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Kind of place — key or slug: ruins (Archaeological), natural (Nature) (optional)",
                "type": "string"
              },
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "Max results (default 15)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius in km (default 50)",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f284cbbf9458e69a5b8351725805f6b68c6c0ea1976bd1f0096e2770409dbdc5"
        },
        {
          "name": "random_place",
          "title": "A random place worth a detour",
          "description": "One random place with its full record — deliberately biased toward the little-known long tail, like the site’s own \"Surprise me\" button. Optionally limit by country and/or kind. Great for discovery and \"place of the day\" features.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO code (optional)",
                "type": "string"
              },
              "kind": {
                "description": "Kind of place — key or slug: ruins (Archaeological), natural (Nature) (optional)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2feb1de36cf1fb967b2a85600bd66b6d802cb1040fb2d9c4c63a888d6aa46a69"
        },
        {
          "name": "search_places",
          "title": "Search places by name",
          "description": "Search 39,832 notable places worldwide by name (accent- and case-insensitive substring match): archaeological and nature. Optionally filter by country (name or ISO code) and kind. Results come best-match-first, then by fame; each carries coordinates, fame rank/tier and links to the map and Wikipedia. If nothing matches, retry with a shorter fragment.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or 2-letter ISO code (optional)",
                "type": "string"
              },
              "kind": {
                "description": "Kind of place — key or slug: ruins (Archaeological), natural (Nature) (optional)",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or part of a name, e.g. \"pyramiden\" or \"plitvice\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:331909c58fba0af38ab6b7e19dba8d957687b4e6754029cf9cf70844c10a2538"
        },
        {
          "name": "top_places",
          "title": "Most famous places",
          "description": "The most famous places worldwide, in one country, or of one kind — ordered by Detourmap fame rank (derived from Wikipedia language coverage; rank 1 is the most famous). The direct answer to \"most famous <kind> in <country>\" and \"what are the must-sees in <country>\".",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country name or ISO code (optional — omit for worldwide)",
                "type": "string"
              },
              "kind": {
                "description": "Kind of place — key or slug: ruins (Archaeological), natural (Nature) (optional)",
                "type": "string"
              },
              "limit": {
                "description": "How many (default 10)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8697dc6fcc5e8a197b81758d9d897298d5857b3f19383be912d2e86cb16e76ec"
        }
      ],
      "digest": "sha256:792867eeefd549145f2e60c37953d422bdb214f9597f994008eb13d49b7b844e"
    }
  }
