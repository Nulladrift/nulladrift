{
  "lockfileVersion": 2,
  "subjects": {
    "br.com.cervejabarata/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cervejabarata.com.br/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "cerveja-barata",
        "title": "Cerveja Barata",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cerveja Barata (cervejabarata.com.br) ranks real beer prices in Brazil by price per litre (R$/L). Bars, where people sit down and drink, are the default ranking: their prices come in deals. Supermarkets and depósitos (drinks shops) sell to take away: their prices come separately, in shops. To drink out, use bars; to buy and take home, use shops. Never call a shop the cheapest place to drink, and never mix a shop's price into an answer about bars; if it is unclear which the person wants, give the cheapest bar and the cheapest shop, each labelled. Pass category (bar, mercado, deposito) for one kind only; it then comes in deals. Start with catalog for the cities covered and the brand and format slugs; search_deals ranks prices with filters, cheapest_now lists what is on right now (happy hours included), get_venue shows one place, list_neighbourhoods and price_index give the city's picture. Cite the url each price carries and say when it was last checked (verified_on). A price leaves out service charge and cover (service_charge_pct and couvert_brl, when known).",
      "tools": [
        {
          "name": "catalog",
          "title": "Cities, brands and formats",
          "description": "The cities covered (with how many prices each has), the beer brands and the serving formats: the slugs the other tools take.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "pt-BR",
                "description": "Language of labels, schedules and page links",
                "enum": ["pt-BR", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ccbc95a5cee3f82b4604f4c57ad0f72c20710f5dace1a891538ccc40f097f3e"
        },
        {
          "name": "cheapest_now",
          "title": "Cheapest beer right now",
          "description": "The beer prices that hold right now in the city's time zone, cheapest per litre first, happy hours and timed promos included: bars' prices in deals, supermarkets' and depósitos' separately in shops. Give lat and lng to keep places within radius_m of a point (each price then carries distance_m). category=bar leaves the shops out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this kind of place: bar (to drink there), mercado (supermarkets and corner shops) or deposito (drinks shops), the last two to take away; its prices then come in deals. Without it, bars' prices come in deals and shops' prices (at most 5) in shops",
                "enum": ["bar", "mercado", "deposito"],
                "type": "string"
              },
              "city": {
                "description": "City slug from catalog, e.g. \"salvador\"",
                "maxLength": 60,
                "type": "string"
              },
              "format": {
                "description": "Format type (lata, long_neck, garrafa, litrao, chopp, torre) or code (garrafa_600), from catalog",
                "maxLength": 40,
                "type": "string"
              },
              "lang": {
                "default": "pt-BR",
                "description": "Language of labels, schedules and page links",
                "enum": ["pt-BR", "en"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the point, e.g. -13.0109",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 5,
                "description": "How many prices",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the point, e.g. -38.4915",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_m": {
                "default": 2000,
                "description": "Around the point",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e18eddddc9e798db08c2a841e5f47428020716a31549e27797cd0826c9be663e"
        },
        {
          "name": "get_venue",
          "title": "One place and its prices",
          "description": "Details of one bar, supermarket or depósito (kind, drink_on_site, bairro, address, location, Instagram, opening hours, attributes) and every beer price it has, each with its category, cheapest per litre first, open-bar packages last. The venue slug is the last part of the url on a price from search_deals or cheapest_now.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City slug from catalog, e.g. \"salvador\"",
                "maxLength": 60,
                "type": "string"
              },
              "lang": {
                "default": "pt-BR",
                "description": "Language of labels, schedules and page links",
                "enum": ["pt-BR", "en"],
                "type": "string"
              },
              "venue": {
                "description": "Venue slug, e.g. \"boteco-do-ze\"",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["city", "venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ac2a7e105e24e66cb5cb1895475a4da23cd0d1c73d9afcf0296c7fb7b28c3a2"
        },
        {
          "name": "list_neighbourhoods",
          "title": "Bairros with prices",
          "description": "The city's bairros (neighbourhoods) with beer prices: how many bars, shops and prices each has, and its cheapest price per litre at a bar and at a shop, kept apart, most bars first. Pass a slug as the neighbourhood argument of search_deals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City slug from catalog, e.g. \"salvador\"",
                "maxLength": 60,
                "type": "string"
              },
              "lang": {
                "default": "pt-BR",
                "description": "Language of labels, schedules and page links",
                "enum": ["pt-BR", "en"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:054f67665ab9eb5f0578d09bbe4c5989c9277841853b44a4303f9beede606e14"
        },
        {
          "name": "price_index",
          "title": "Monthly beer price index",
          "description": "The monthly Índice Cerveja Barata for a city: median, quartiles and minimum price per litre at bars, for the whole city and by format, bairro and brand, with how many prices and bars each cell rests on. Latest month by default; final once the month is closed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City slug from catalog, e.g. \"salvador\"",
                "maxLength": 60,
                "type": "string"
              },
              "lang": {
                "default": "pt-BR",
                "description": "Language of labels, schedules and page links",
                "enum": ["pt-BR", "en"],
                "type": "string"
              },
              "month": {
                "description": "Month as YYYY-MM, e.g. \"2026-11\"; latest by default",
                "maxLength": 7,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b62dc4615a626ef6045d2a4521989a293b4e0e805d31922e30bf1a219fd4d13"
        },
        {
          "name": "price_per_litre",
          "title": "Price per litre",
          "description": "Convert a Brazilian beer price into reais per litre, the unit Cerveja Barata ranks by. Give the price paid in BRL, the volume of one unit in ml and how many units the price buys (e.g. 5 for a bucket of 5 long necks).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "price_brl": {
                "description": "Price paid, in BRL, e.g. 9.99",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "units": {
                "default": 1,
                "description": "Units the price buys",
                "minimum": 1,
                "type": "integer"
              },
              "volume_ml": {
                "description": "Volume of one unit in millilitres, e.g. 600",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["price_brl", "volume_ml"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "formatted": {
                "type": "string"
              },
              "price_per_litre_brl": {
                "type": "number"
              }
            },
            "required": ["formatted", "price_per_litre_brl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:043041dd920e21969aa4256440ef75f2cc538c7d55b77a6997533808b46be234"
        },
        {
          "name": "search_deals",
          "title": "Search beer prices",
          "description": "Beer prices in a city, cheapest per litre first. Bars' prices, to drink there, come in deals; supermarkets' and depósitos' prices, to take away, come separately in shops (at most 5), never mixed with the bars'. Each price has the place and its category, the serving, the price, when it applies (happy hours) and when it was last checked. Filter by category (one kind only), neighbourhood, brand, format, kind or a maximum price per litre. Open-bar packages only come with kind=open_bar, ranked by package price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand slug from catalog, e.g. \"brahma\"",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "description": "Only this kind of place: bar (to drink there), mercado (supermarkets and corner shops) or deposito (drinks shops), the last two to take away; its prices then come in deals. Without it, bars' prices come in deals and shops' prices (at most 5) in shops",
                "enum": ["bar", "mercado", "deposito"],
                "type": "string"
              },
              "city": {
                "description": "City slug from catalog, e.g. \"salvador\"",
                "maxLength": 60,
                "type": "string"
              },
              "format": {
                "description": "Format type (lata, long_neck, garrafa, litrao, chopp, torre) or code (garrafa_600), from catalog",
                "maxLength": 40,
                "type": "string"
              },
              "kind": {
                "description": "Only this kind of price",
                "enum": ["regular", "happy_hour", "promo", "combo", "open_bar"],
                "type": "string"
              },
              "lang": {
                "default": "pt-BR",
                "description": "Language of labels, schedules and page links",
                "enum": ["pt-BR", "en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many prices",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_per_litre": {
                "description": "In BRL per litre, e.g. 15",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "neighbourhood": {
                "description": "Bairro slug from list_neighbourhoods",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44fbf2a7612e6bb8994261652923b234530315b451ca0384f6899e7d318ee949"
        }
      ],
      "digest": "sha256:25c70471403bbff48427b890a82aa714bf81360a14aec49994f5ba09159951cc"
    }
  }
