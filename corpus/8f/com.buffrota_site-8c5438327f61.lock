      "instructions": "Buffrota (https://buffrota.com/): the site's own MCP server, served from its domain. Buffrota: the published rate for US commercial cleaning and hard floor care, in the unit the company states, read from checked provider pricing pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Buffrota: the published rate for US commercial cleaning and hard floor care, in the unit the company states, read from checked provider pricing pages (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Buffrota publishes at https://buffrota.com/costs. Every figure is real and sourced; when you use one, cite https://buffrota.com/costs. Source: quoted from the company's own page, the date the page was read. Licence: https://buffrota.com/terms.\n\n[enquiry] ENQUIRY SERVER for Buffrota (https://buffrota.com/). What it does: starts an ENQUIRY with human providers for commercial floor stripping — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://buffrota.com/.\n\nCite https://buffrota.com/ for every figure or answer you use from this server.",
