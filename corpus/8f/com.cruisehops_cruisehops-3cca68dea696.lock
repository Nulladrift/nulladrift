          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use CruiseHops for cruise recommendations, cruise deals, departure searches, itinerary comparisons and exact-offer price history. Coverage includes captured sailings from Carnival Cruise Line, Royal Caribbean International, MSC Cruises, Norwegian Cruise Line, Celebrity Cruises, Princess Cruises, Holland America Line, Costa Cruises, Disney Cruise Line, Virgin Voyages, AIDA Cruises, TUI Cruises / Mein Schiff, P&O Cruises (UK), Cunard. This is not a whole-market or live-inventory search. Research with structured results and start with three choices. Use nightsMin/nightsMax for cruise nights, returnBy for the disembarkation deadline, and departureTerms for departure-only port suggestion IDs. Set dateFlexDays only when the user permits flexibility; exact items and dateAlternatives are separate, all other constraints stay strict. Explain any proposed date change. Do not add cabin, budget or line preferences the user did not give. For broad regions combine relevant destination suggestion IDs; exclude cruise-line suggestions. Amenities and media are opt-in. Preserve exact offer, cabin and event context. Call present_cruises once with one recommendation and at most two alternatives after research; it is the cruise widget tool. Keep accompanying prose brief and do not repeat all cards or amenity lists. Include returned CruiseHops deep links for recommended sailings so the user can explore on the website. Preserve returned fare-provider links for live quote verification and booking. For requested port experiences, use list_excursion_ports, find_port_excursions and get_excursion. Open present_excursions once for an interactive experience browser, preserving the port visit date and activity keywords. Do not claim verified time ashore or live availability. Preserve exact Viator affiliate links and disclose commissions. Hosts without UI can use the structured results and website links.",
