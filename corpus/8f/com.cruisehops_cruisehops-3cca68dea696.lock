        {
          "name": "suggest_cruise_terms",
          "title": "Find ships and destinations",
          "description": "Suggest matching ship, port, destination and cruise line names, including suffix words. Returns stable term IDs for search filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amenity": {
                "description": "Exact captured amenity name from get_sailing ship.amenities[].name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cabinClass": {
                "description": "Normalized cabin class: inside, oceanview, balcony, suite, or other, as captured on the offer.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "maxLength": 1000,
                "type": "string"
              },
              "dateFlexDays": {
                "description": "Optional departure flexibility, 0–30 days before dateFrom and after dateTo. Requires both dates when positive. Exact matches stay in items; outside-window options are separate dateAlternatives. All other filters remain strict. Use only when the user permits flexible dates.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "dateFrom": {
                "description": "Inclusive earliest departure date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "dateTo": {
                "description": "Inclusive latest departure date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "departurePort": {
                "description": "Departure port selection: shared port suggestion ID or source-native items[].departurePort.id. Reviewed equivalent ports match across cruise lines; source still restricts the line. Different embarkation ports remain distinct.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "departureTerms": {
                "description": "Port IDs from suggest_cruise_terms, matching departure only (OR within this list). General terms ports also match visited ports. Other filters still apply.",
                "items": {
                  "pattern": "^port:[a-f0-9]{24}$",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "destination": {
                "description": "Shared destination suggestion ID or destination label. Umbrella destinations such as Caribbean include mapped subregions across cruise lines. Specific regions remain strict; generic Caribbean does not imply Eastern Caribbean. Prefer suggest_cruise_terms to resolve names.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "durationMax": {
                "description": "Maximum normalized duration in days, not advertised nights.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "durationMin": {
                "description": "Minimum normalized duration in days, not advertised nights.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "includeUnavailable": {
                "type": "boolean"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "nightsMax": {
                "description": "Maximum nights, inclusive. Prefer nightsMin/nightsMax for cruise trip lengths; legacy durationMin/durationMax are days-only.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "nightsMin": {
                "description": "Minimum nights. Uses advertised nights, otherwise calendar nights between captured departure and return dates. Unknown durations cannot match.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "description": "One-based result page; default 1.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Items per page, 1–50; default 3.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "priceMaxCents": {
                "description": "Maximum captured USD cents per person for two guests; 50000 means USD 500/person. Not a party total.",
                "maximum": 999999999,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "returnBy": {
                "description": "Inclusive latest disembarkation date, YYYY-MM-DD; excludes unknown return dates. This deadline never expands with dateFlexDays.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "roundtrip": {
                "type": "boolean"
              },
              "ship": {
                "description": "Source-native ship ID from items[].ship.id, not a suggestion term ID. Prefer terms for names.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "enum": ["price", "departure", "duration", "relevance"],
                "type": "string"
              },
              "source": {
                "description": "Source ID: carnival, royal_caribbean, msc, norwegian, celebrity, princess, holland_america, costa, disney, virgin, aida, tui_cruises, p_and_o, cunard.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "terms": {
                "description": "Stable term IDs from suggest_cruise_terms; prefer these for entity-name filtering.",
                "items": {
                  "description": "Complete suggestion item ID including ship:, port:, destination:, or line: prefix.",
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "view": {
                "description": "Default groups combines departures for each ship itinerary; sailings returns one row per unique dated sailing. Event-specific fares remain available within each sailing.",
                "enum": ["groups", "sailings"],
                "type": "string"
              },
              "visitedPort": {
                "description": "Visited port selection: shared port suggestion ID or source-native items[].visitedPorts[].id. Reviewed equivalent ports match across cruise lines; source still restricts the line.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
