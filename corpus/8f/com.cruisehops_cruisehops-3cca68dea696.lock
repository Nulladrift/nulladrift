      "serverInfo": {
        "name": "cruisehops",
        "title": "CruiseHops",
        "version": "1.4.0",
        "description": "Find and compare cruises, itineraries, cabin fares and price history. Coverage includes captured sailings from Carnival Cruise Line, Royal Caribbean International, MSC Cruises, Norwegian Cruise Line, Celebrity Cruises, Princess Cruises, Holland America Line, Costa Cruises, Disney Cruise Line, Virgin Voyages, AIDA Cruises, TUI Cruises / Mein Schiff, P&O Cruises (UK), Cunard. This is not a whole-market or live-inventory search. Explore Viator experiences at supported cruise ports with optional visit dates and activity keywords. Continue on CruiseHops or follow provider links to verify availability and book.",
