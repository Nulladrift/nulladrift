        {
          "name": "get_price_history",
          "title": "View cabin price history",
          "description": "Read one exact captured offer context's price history. contextKey is required from get_sailing offers. Never blends cabins, fares, markets, guest counts or events. Dates select overlapping captured observation spans; maxPoints retains the latest points.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contextKey": {
                "description": "Exact offers[].contextKey from get_sailing, identifying cabin/fare/occupancy/market/event; never infer or combine contexts.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "dateFrom": {
                "description": "Inclusive earliest observation date; includes captured spans that overlap this date.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "dateTo": {
                "description": "Inclusive latest observation date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "maxPoints": {
                "description": "Retain latest matching observations, default 100, maximum 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "sailingId": {
                "description": "Stable sailing ID from search_cruises items[].id or list_departures items[].id.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["contextKey", "sailingId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
