        {
          "name": "search_cruises",
          "title": "Find cruises",
          "description": "Find cruise recommendations and deals on CruiseHops by destination, departure port, dates, cabin and budget. Coverage includes captured sailings from Carnival Cruise Line, Royal Caribbean International, MSC Cruises, Norwegian Cruise Line, Celebrity Cruises, Princess Cruises, Holland America Line, Costa Cruises, Disney Cruise Line, Virgin Voyages, AIDA Cruises, TUI Cruises / Mein Schiff, P&O Cruises (UK), Cunard. This is not a whole-market or live-inventory search. Returns sailing links for further exploration on CruiseHops. Research only; no widget. Default three choices. Do not add cabin or budget constraints the user did not give. Search captured cruise sailings using typed filters. Prices are USD cents per person for two guests, not live or family quotes. Filter before grouping and choosing lowest cabin price. Use term IDs from suggest_cruise_terms for precise names.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
