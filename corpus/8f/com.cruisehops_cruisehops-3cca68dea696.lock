                "type": "string"
              },
              "cabinClass": {
                "description": "Normalized cabin class: inside, oceanview, balcony, suite, or other, as captured on the offer.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "dateFlexDays": {
                "description": "Optional departure flexibility, 0–30 days before dateFrom and after dateTo. Requires both dates when positive. Exact matches stay in items; outside-window options are separate dateAlternatives. All other filters remain strict. Use only when the user permits flexible dates.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "dateFrom": {
                "description": "Inclusive earliest departure date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "dateTo": {
                "description": "Inclusive latest departure date (YYYY-MM-DD).",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
