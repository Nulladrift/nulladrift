{
  "lockfileVersion": 2,
  "subjects": {
    "com.campiamo/campsites": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://campiamo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Campiamo Campsites",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Campiamo Campsites lets you find and book independent campsites, glamping sites and holiday parks that use Campiamo: every site on the Campiamo directory and every site whose website Campiamo hosts (mostly UK, France, Spain, Australia and New Zealand). Flow: search_campsites (with dates and party size if known) → get_campsite for details → check_availability → optionally get_quote for extras or a discount code → start_booking, which returns a hosted checkout link. You never take payment: the guest pays the campsite directly on that link, and nothing is reserved until they do. Campsites that take payment on arrival (assistant_can_book false) can be searched and priced but not booked by you; give the guest the booking_url instead. Always confirm dates, party size, the accommodation and the total with the guest before calling start_booking, and only pass the guest's real name and email with their consent. Prices are in the campsite's own currency. Dates are YYYY-MM-DD; check_out is the departure morning.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Live availability at one campsite for a stay and party. Returns the accommodation types that can take the party with the total price and the amount due at checkout, and explains why the others cannot (fully booked, minimum stay, adults only, no dogs).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "description": "Number of adults.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "campsite": {
                "description": "The campsite slug, as returned by search_campsites.",
                "type": "string"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Must be after check_in.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children. Which ages count as a child varies by campsite: see age_policy on get_campsite (default: everyone under 18).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "dogs": {
                "default": 0,
                "description": "Number of dogs.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "infants": {
                "default": 0,
                "description": "Number of infants, only at campsites whose age_policy has infants_under_age. Infants are never charged.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["campsite", "check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c68824e1308aad3d8650622fb58cd319c82233a5fa03241e59a1f8ed8b9f5bb"
        },
        {
          "name": "get_campsite",
          "title": "Campsite details",
          "description": "Full details of one campsite: description, photos, check-in times, open season, every accommodation type with prices and rules, optional extras, the questions the campsite asks at booking, payment and deposit terms, and recent reviews.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campsite": {
                "description": "The campsite slug, as returned by search_campsites.",
                "type": "string"
              }
            },
            "required": ["campsite"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f31efe995d1f7a17a82b1500abfe6a6c6eb9bc1e45eb94373513b3ca4e21fc03"
        },
        {
          "name": "get_quote",
          "title": "Price quote",
          "description": "An itemised price for one accommodation, stay and party, including chosen extras and any discount or voucher code. Use it to show the guest the exact total and the amount payable now before starting the booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodation_id": {
                "description": "accommodation_id from check_availability or get_campsite.",
                "type": "string"
              },
              "adults": {
                "default": 2,
                "description": "Number of adults.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "campsite": {
                "description": "The campsite slug, as returned by search_campsites.",
                "type": "string"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Must be after check_in.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children. Which ages count as a child varies by campsite: see age_policy on get_campsite (default: everyone under 18).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "discount_code": {
                "description": "A promotional code the guest has, if the campsite accepts them.",
                "maxLength": 50,
                "type": "string"
              },
              "dogs": {
                "default": 0,
                "description": "Number of dogs.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "extras": {
                "description": "Optional extras from get_campsite (electric hook-up, firewood, late checkout...).",
                "items": {
                  "properties": {
                    "adults": {
                      "description": "For per-person extras: how many adults.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "children": {
                      "description": "For per-person extras: how many children.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "choice": {
                      "description": "One of the extra's choices, when it has them.",
                      "type": "string"
                    },
                    "extra_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["extra_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "infants": {
                "default": 0,
                "description": "Number of infants, only at campsites whose age_policy has infants_under_age. Infants are never charged.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "voucher_code": {
                "description": "A gift voucher code, if the campsite sells them.",
                "maxLength": 50,
                "type": "string"
              }
            },
            "required": ["accommodation_id", "adults", "campsite", "check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:955edfa06f2c11e62fc4433cacb7e13d8b98f3846db0bd59885641b84e7cb0cf"
        },
        {
          "name": "search_campsites",
          "title": "Search campsites",
          "description": "Find campsites, glamping sites and holiday parks that use Campiamo (the public directory plus every Campiamo-hosted campsite website). Filter by free text (name, town, county, country, description), country, amenities and, with dates, live availability and total stay price for the party. Returns each campsite's slug for the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "description": "Number of adults.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "amenities": {
                "description": "Facilities that must be present, e.g. [\"electric hook-up\", \"showers\", \"dogs\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Must be after check_in.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children. Which ages count as a child varies by campsite: see age_policy on get_campsite (default: everyone under 18).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "country": {
                "description": "Country name or ISO code, e.g. \"UK\", \"France\", \"NZ\".",
                "maxLength": 60,
                "type": "string"
              },
              "dogs": {
                "default": 0,
                "description": "Number of dogs.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "infants": {
                "default": 0,
                "description": "Number of infants, only at campsites whose age_policy has infants_under_age. Infants are never charged.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: a place, region, campsite name or keyword such as \"lake\" or \"glamping\".",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2161e63da0da1dd6660eb714b64e8461f353cc48e7bc51453eb7eab31b8b8eb2"
        },
        {
          "name": "start_booking",
          "title": "Start a booking",
          "description": "Start a booking and get a secure checkout link for the guest. Nothing is reserved until the guest pays on that link (valid 24 hours). Only works at campsites that take payment online (assistant_can_book is true); elsewhere send the guest to the booking_url to book themselves. Requires the guest's name and email, which the campsite uses for the confirmation. Confirm every detail with the guest first. Rate limited.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accommodation_id": {
                "description": "accommodation_id from check_availability or get_campsite.",
                "type": "string"
              },
              "adults": {
                "default": 2,
                "description": "Number of adults.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "answers": {
                "additionalProperties": true,
                "description": "Answers to the campsite's booking_questions from get_campsite, keyed by question id. Required questions must be answered.",
                "type": "object"
              },
              "campsite": {
                "description": "The campsite slug, as returned by search_campsites.",
                "type": "string"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Must be after check_in.",
                "format": "date",
                "type": "string"
              },
              "child_ages": {
                "description": "One age per child, if known.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "children": {
                "default": 0,
                "description": "Number of children. Which ages count as a child varies by campsite: see age_policy on get_campsite (default: everyone under 18).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "club_membership": {
                "description": "Required when get_campsite lists a members-only club under club_memberships. status \"member\" with the guest's membership identifier in \"number\" (a membership number, or where the club's identifier is \"email\", such as the Greener Camping Club, the email address the membership is registered to), or \"join\" where the club allows joining at booking (the fee is added to the total).",
                "properties": {
                  "club": {
                    "description": "The club key from club_memberships.",
                    "type": "string"
                  },
                  "number": {
                    "description": "Membership number, or membership email for clubs whose identifier is email.",
                    "maxLength": 255,
                    "type": "string"
                  },
                  "status": {
                    "enum": ["member", "join"],
                    "type": "string"
                  }
                },
                "required": ["club", "status"],
                "type": "object"
              },
              "discount_code": {
                "description": "A promotional code the guest has, if the campsite accepts them.",
                "maxLength": 50,
                "type": "string"
              },
              "dogs": {
                "default": 0,
                "description": "Number of dogs.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "extras": {
                "description": "Optional extras from get_campsite (electric hook-up, firewood, late checkout...).",
                "items": {
                  "properties": {
                    "adults": {
                      "description": "For per-person extras: how many adults.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "children": {
                      "description": "For per-person extras: how many children.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "choice": {
                      "description": "One of the extra's choices, when it has them.",
                      "type": "string"
                    },
                    "extra_id": {
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["extra_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "guest": {
                "properties": {
                  "email": {
                    "description": "Where the confirmation is sent.",
                    "format": "email",
                    "type": "string"
                  },
                  "name": {
                    "description": "The guest's full name.",
                    "maxLength": 255,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 50,
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "infants": {
                "default": 0,
                "description": "Number of infants, only at campsites whose age_policy has infants_under_age. Infants are never charged.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "notes": {
                "description": "A message for the campsite (arrival time, requests).",
                "maxLength": 1000,
                "type": "string"
              },
              "voucher_code": {
                "description": "A gift voucher code, if the campsite sells them.",
                "maxLength": 50,
                "type": "string"
              }
            },
            "required": ["accommodation_id", "adults", "campsite", "check_in", "check_out", "guest"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12f3eb0ecf0b3e76b77c39f88dd75abc1e33e102d9eddf4b81115c98124b5b84"
        }
      ],
