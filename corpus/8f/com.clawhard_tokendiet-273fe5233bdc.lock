      "serverInfo": {
        "name": "com.clawhard/tokendiet",
        "title": "Token Diet",
        "version": "1.1.0",
        "description": "Token Diet shrinks what you paste into AI. It shows what a prompt costs in tokens and cuts the junk in one tap (base64 blobs, giant JSON, repeated log lines, stack-trace noise) so you hit your AI usage limit later. Runs in your browser.",
        "websiteUrl": "https://tokendiet.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Token Diet: Token Diet shrinks what you paste into AI. It shows what a prompt costs in tokens and cuts the junk in one tap (base64 blobs, giant JSON, repeated log lines, stack-trace noise) so you hit your AI usage limit later. Runs in your browser. Use it when your prompts are too long or you keep hitting an AI usage limit. Tools: tokendiet_count_tokens (Count the exact tokens in a text). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "tokendiet_count_tokens",
          "title": "Count the exact tokens in a text",
          "description": "Use when the user asks how many tokens a text, prompt, log, document or code paste is, whether it fits a context window (128K, 200K, 1M), or how big something is before they send it to an AI. Returns the exact o200k token count (GPT-4o family and later; Claude and Gemini usually within about 15%), plus words, characters and how much of each window it uses. Counts are exact for that tokenizer. Example: {\"text\": \"<the text to measure>\"}. Not for shortening text.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "The text to count (up to 200,000 characters).",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count the exact tokens in a text"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
