          "description": "Record where the user is with a job on BirJob: saved, applied, interview, offer, rejected. Use this when the user says they applied, got an interview, an offer or a rejection. Calling it again for the same job changes the status. Do not use to apply: it records the status for the user only, and does not apply to the job or contact the employer. Needs a signed-in BirJob job seeker account: the first call asks the user to sign in to BirJob and allow access.",
