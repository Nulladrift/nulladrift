        },
        {
          "name": "get_job",
          "title": "Read a BirJob job",
          "description": "Read one job on BirJob by its id (from search_jobs) or its birjob.com URL. Use this when the user wants the full description, requirements or how to apply for a job already found. Returns title, company, place, salary, work format, employment type, seniority, dates, the whole description and requirements as plain text (contact details removed), the apply link and its source. A closed job answers only its id, title, company and status closed. Do not use for searching: it reads one known job.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "maxLength": 300,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "The job id from search_jobs, or a birjob.com job URL (https://www.birjob.com/jobs/…)."
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "job": {
                "anyOf": [
                  {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "apply_url": {
                            "description": "Where to apply: the link the job page's apply button opens.",
                            "type": ["string", "null"]
                          },
                          "career_level": {
                            "description": "The career level as the source wrote it.",
                            "type": ["string", "null"]
                          },
                          "company": {
                            "type": ["string", "null"]
                          },
                          "company_url": {
                            "description": "The employer's page on birjob.com.",
                            "type": ["string", "null"]
                          },
                          "country": {
                            "description": "ISO 3166-1 alpha-2.",
                            "type": "string"
                          },
                          "deadline": {
                            "description": "Application deadline, YYYY-MM-DD. Null when the posting does not say.",
                            "type": ["string", "null"]
                          },
                          "description": {
                            "description": "The whole description as the job page shows it, as plain text, with e-mail addresses, phone numbers and links replaced by […].",
                            "type": ["string", "null"]
                          },
                          "education": {
                            "description": "Minimum education the description names. Null when the posting does not say.",
                            "type": ["string", "null"]
                          },
                          "employment_type": {
                            "anyOf": [
                              {
                                "enum": ["full_time", "part_time", "contract", "internship", "temporary"],
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Null when the posting does not say."
                          },
                          "id": {
                            "description": "The job id, for get_job.",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "last_seen": {
                            "description": "ISO time BirJob last saw the posting live at its source.",
                            "type": ["string", "null"]
                          },
                          "location": {
                            "type": ["string", "null"]
                          },
                          "posted": {
                            "description": "YYYY-MM-DD the source published it, else the day BirJob first saw it.",
                            "type": ["string", "null"]
                          },
                          "requirements": {
                            "description": "The requirements section, when the source sends one apart, as plain text, contacts replaced alike.",
                            "type": ["string", "null"]
                          },
                          "salary": {
                            "description": "As the board prints it; ₼ is manat (AZN), a month unless it says otherwise.",
                            "type": ["string", "null"]
                          },
                          "salary_currency": {
                            "description": "ISO code. AZN where an Azerbaijani posting states no currency, as the board reads it; null when unknown.",
                            "type": ["string", "null"]
                          },
                          "salary_max": {
                            "description": "Upper figure as stated. Null when the posting does not say.",
                            "type": ["number", "null"]
                          },
                          "salary_min": {
                            "description": "Lower figure as stated. Null when the posting does not say.",
                            "type": ["number", "null"]
                          },
                          "salary_period": {
                            "anyOf": [
                              {
                                "enum": ["hour", "day", "week", "month", "year"],
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "As stated; null when not stated (the board reads that as a month)."
                          },
                          "seniority": {
                            "anyOf": [
                              {
                                "enum": ["intern", "junior", "mid", "senior", "lead", "exec"],
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "The stated career level. Null when the posting does not say."
                          },
                          "source": {
                            "description": "The site that published the posting.",
                            "type": ["string", "null"]
                          },
                          "status": {
                            "const": "open",
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "description": "The job's page on birjob.com.",
                            "type": "string"
                          },
                          "work_format": {
                            "anyOf": [
                              {
                                "enum": ["remote", "hybrid", "onsite"],
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Null when the posting does not say."
                          }
                        },
                        "required": ["apply_url", "career_level", "company", "company_url", "country", "deadline", "description", "education", "employment_type", "id", "last_seen", "location", "posted", "requirements", "salary", "salary_currency", "salary_max", "salary_min", "salary_period", "seniority", "source", "status", "title", "url", "work_format"],
                        "type": "object"
                      },
                      {
                        "additionalProperties": false,
                        "properties": {
                          "company": {
                            "type": ["string", "null"]
                          },
                          "id": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "status": {
                            "const": "closed",
                            "description": "Its deadline passed or its source took it down. search_jobs lists open jobs.",
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          }
                        },
                        "required": ["company", "id", "status", "title"],
                        "type": "object"
                      }
                    ]
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "note": {
                "type": ["string", "null"]
              }
            },
            "required": ["job", "note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a BirJob job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:51ac674b284a4f712f6d8673b12be2b2b85ce4bc8eb8faf2ae5681aeb71953be"
        },
