        },
        {
          "name": "get_applications",
          "title": "List tracked applications",
          "description": "List the user's tracked applications on BirJob, most recently changed first, optionally by status. Use this when the user asks where they applied or how their applications stand. Do not use for saved jobs (get_saved_jobs). Needs a signed-in BirJob job seeker account: the first call asks the user to sign in to BirJob and allow access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "description": "Result page, 1 to 50 (default 1), 10 a page.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Only applications with this status.",
                "enum": ["saved", "applied", "interview", "offer", "rejected"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
