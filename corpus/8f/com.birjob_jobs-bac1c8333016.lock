        {
          "name": "match_jobs",
          "title": "Match BirJob jobs to a CV",
          "description": "Rank open jobs in Azerbaijan on BirJob against a role, skills or CV text, with the words each job matched and why. Use this when the user shares a CV or a list of skills and asks which jobs fit. Pass title, skills and/or cv_text: they are used for this one call and not stored. No sign-in needed. Or set use_profile to true to use the signed-in user's own BirJob CV profile (title, skills, experience); that asks the user to sign in to BirJob. Do not use for a plain search by job title (search_jobs).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cv_text": {
                "description": "The CV's text, up to 20000 characters. Used for this call only, never stored. Leave out contact details.",
                "maxLength": 20000,
                "type": "string"
              },
              "skills": {
                "description": "Skills, comma-separated: \"Python, SQL, Excel\".",
                "maxLength": 1000,
                "type": "string"
              },
              "title": {
                "description": "The role the user wants, e.g. \"Baş mühasib\", \"Frontend Developer\".",
                "maxLength": 200,
                "type": "string"
              },
              "use_profile": {
                "description": "true: use the signed-in user's BirJob CV profile instead of the text passed. Needs sign-in.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Match BirJob jobs to a CV"
