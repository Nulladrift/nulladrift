{
  "lockfileVersion": 2,
  "subjects": {
    "com.atkvn/security-checks": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://atkvn.com/agent/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "atk-security-checks",
        "title": "ATK Security Checks",
        "version": "0.3.0",
        "description": "Public-front-door checks for post-quantum TLS readiness and TLS certificates, plus a Wazuh custom-rule audit that finds rules which pass wazuh-analysisd -t but are silently dropped at load.",
        "websiteUrl": "https://atkvn.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use check_post_quantum_tls or check_tls_certificate for any public hostname (one ordinary TLS handshake per probe, no scanning). Use audit_wazuh_rules with the custom rule files exactly as named in /var/ossec/etc/rules/. The free audit returns counts and a preview; the full report needs an API key from https://atkvn.com/agent/. For the PHP2Shell CVEs (CVE-2026-109618/109619) run check_php2shell with output you collect on the server itself.",
      "tools": [
        {
          "name": "audit_wazuh_rules",
          "title": "Audit Wazuh custom rules",
          "description": "Finds Wazuh custom rules that pass wazuh-analysisd -t but are dropped at load (load order across ruleset/rules and etc/rules, missing parents, duplicate or colliding ids). Input: list of {filename, xml}. Supported versions: 4.14.7, 4.14.9. Free: counts + 2 findings. Full report: pass api_key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "default": "",
                "description": "Optional key for the full report. Without it you get counts and 2 findings; the full report is also sold per call by x402 at POST https://atkvn.com/agent/v1/wazuh-audit.",
                "title": "Api Key",
                "type": "string"
              },
              "files": {
                "description": "Custom rule files, each {\"filename\": \"0094-local.xml\", \"xml\": \"<group>...</group>\"}; filename exactly as in /var/ossec/etc/rules/, up to 20 files.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Files",
                "type": "array"
              },
              "wazuh_version": {
                "default": "4.14.9",
                "description": "Wazuh manager version: 4.14.7 or 4.14.9.",
                "title": "Wazuh Version",
                "type": "string"
              }
            },
            "required": ["files"],
            "title": "audit_wazuh_rulesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96dc8eefc9192b6648cea1a40d63609e21acab2218a5a12aac387af61797f6d9"
        },
        {
          "name": "check_php2shell",
          "title": "Check PHP2Shell (CVE-2026-109618/109619)",
          "description": "Is this PHP install exposed to PHP2Shell, the two critical unauthenticated RCE flaws patched on 21 Oct 2026 (CVE-2026-109618, CVE-2026-109619)? Paste local evidence collected on the server: `php -v`, `php -i` or `php-fpm -i`, `cat /etc/os-release`, `dpkg -l 'php*'` or `rpm -qa 'php*'`. Returns patched / vulnerable / check_vendor_backport, the exact changelog command that decides distribution builds, upgrade commands, config mitigations until patched, and a tested Wazuh rule pack for crash and OOM signals. Free. Nothing is fetched from your servers.",
          "inputSchema": {
            "properties": {
              "evidence": {
                "description": "Raw output of the commands above, pasted as one text block (up to 20 KB).",
                "title": "Evidence",
                "type": "string"
              }
            },
            "required": ["evidence"],
            "title": "check_php2shellArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fec8999a81c00a89cadb77edf6f1b1926e6177fb6e7d0fde09b8a1187da4e86b"
        },
        {
          "name": "check_post_quantum_tls",
          "title": "Check post-quantum TLS",
          "description": "Does this public hostname negotiate hybrid post-quantum key exchange (X25519MLKEM768)? Returns TLS version, hybrid yes/no and a one-line verdict. Free. One TLS handshake per probe, no scanning.",
          "inputSchema": {
            "properties": {
              "hostname": {
                "description": "Public DNS hostname, e.g. www.example.com. IP addresses and internal names are refused.",
                "title": "Hostname",
                "type": "string"
              }
            },
            "required": ["hostname"],
            "title": "check_post_quantum_tlsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e41aa40b2564a81c60267cbead2aad0ecf27fd6069b0448ee8b592d3b46df4cf"
        },
        {
          "name": "check_tls_certificate",
          "title": "Check TLS certificate",
          "description": "Certificate issuer, expiry date, days left, and whether the chain verifies for the hostname from a strict client (catches missing intermediate certificates and name mismatches). Free.",
          "inputSchema": {
            "properties": {
              "hostname": {
                "description": "Public DNS hostname, e.g. www.example.com. IP addresses and internal names are refused.",
                "title": "Hostname",
                "type": "string"
              }
            },
            "required": ["hostname"],
            "title": "check_tls_certificateArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c6c6d5eb3e99df5c6f976844afdf552e76f04ade03e6f70a13d7d51532e58ae2"
        },
        {
          "name": "test_wazuh_rule",
          "title": "Test Wazuh rule on a real manager",
          "description": "Runs log lines through a real wazuh-manager 4.14.9 (fresh logtest session) with your custom rules and decoders: which decoder and rule matched, whether YOUR rule fired, and load warnings such as 7617/7619. Logtest engine: frequency/timeframe rules and some live-only behaviour are out of scope. Free: 1 log line with your files (3 with the stock ruleset only), summary. 10 lines with decoded fields and full alerts: POST https://atkvn.com/agent/v1/wazuh-testfire (x402, USD 0.008 per call).",
          "inputSchema": {
            "properties": {
              "decoders": {
                "default": [],
                "description": "Optional custom decoder files, same shape as rules.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Decoders",
                "type": "array"
              },
              "log_format": {
                "default": "syslog",
                "description": "Wazuh log_format, e.g. syslog or json.",
                "title": "Log Format",
                "type": "string"
              },
              "logs": {
                "description": "Raw log lines exactly as the agent would forward them, one event per item.",
                "items": {
                  "type": "string"
                },
                "title": "Logs",
                "type": "array"
              },
              "rules": {
                "default": [],
                "description": "Optional custom rule files: [{\"filename\": \"0096-local.xml\", \"xml\": \"<group>...</group>\"}]. Filename order matters: files load by name together with the stock ruleset.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Rules",
                "type": "array"
              }
            },
            "required": ["logs"],
            "title": "test_wazuh_ruleArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e7875fb54eaf9ab4bc4692be06a3164807c609569e194f257199c022cd3dce9b"
        }
      ],
      "digest": "sha256:4378da7a1c77ac1c7751bb65bbf78e4573892d1397c09ddf34187bfa9bcd85b4"
    }
  }
