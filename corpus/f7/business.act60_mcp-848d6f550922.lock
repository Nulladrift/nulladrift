        {
          "name": "calendar_feed",
          "title": "Act 60 compliance calendar feed",
          "description": "Returns an ICS calendar feed URL with the Act 60 compliance dates for a segment and regime, each event citing its rule. No login and no contact; the URL holds only the segment, regime, decree year and language.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "decree_year": {
                "description": "Year the decree was obtained, if known. Starts the donation from the second tax year and dates rules that count from the decree.",
                "maximum": 2100,
                "minimum": 2012,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the calendar text; default the language of the conversation.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "regime": {
                "description": "pre2027: decree applied for by December 31, 2026; post2027: applied for from January 1, 2027; both: rows of either regime.",
                "enum": ["pre2027", "post2027", "both"],
                "type": "string"
              },
              "segment": {
                "description": "individual: a decree holder; chapter3: an export services business; all: both lists.",
                "enum": ["individual", "chapter3", "all"],
                "type": "string"
              }
            },
            "required": ["regime", "segment"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "events": {
                "description": "Dated deadlines in the feed.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "ics_url": {
                "description": "ICS feed URL to subscribe to in a calendar app.",
                "type": "string"
              },
              "webcal_url": {
                "description": "The same feed with the webcal scheme.",
                "type": "string"
              }
            },
            "required": ["events", "ics_url", "webcal_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Act 60 compliance calendar feed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e9d0694c6c7c87a51fc162671308272a848a9906ac9d63587880b27ebc688a6d"
        },
        {
          "name": "delete_my_data",
          "title": "Delete my data",
          "description": "Deletes the data of the person behind this session and never anyone else’s: with account true, the account this conversation is linked to (every contact and job merged into it); with contact, the verified contact of this session, which must match. Reminders, messages, the forward-to address and the calendar connection stop at once, every record is deleted by the date returned (within 30 days), and a confirmation goes to the same channel.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "account": {
                "const": true,
                "description": "true: delete the account this conversation is linked to, with every contact and job merged into it.",
                "type": "boolean"
              },
              "contact": {
                "description": "The verified contact of this session (email address, phone number, Telegram id or WhatsApp number); it must match. Give this or account, not both.",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              },
              "locale": {
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "scheduled_for": {
                "description": "YYYY-MM-DD: every record of this person is deleted by this date, within 30 days of the request.",
                "type": "string"
              },
              "status": {
                "const": "scheduled",
                "description": "Reminders and messages have stopped; the records are being deleted.",
                "type": "string"
              }
            },
            "required": ["scheduled_for", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Delete my data"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ad0665938e3c15198e454f62dfe2ce92b4d51d2011730c710521bb79fbc54e34"
        },
