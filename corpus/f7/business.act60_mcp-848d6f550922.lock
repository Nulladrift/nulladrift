        {
          "name": "remind_me",
          "title": "Remind me of Act 60 deadlines",
          "description": "Schedules reminders 30, 7 and 1 days before chosen Act 60 deadlines, each citing its rule, on the verified contact of this session only: it never subscribes another address. A guest is asked for a verified contact first. It stores the reminders, the channel and language preference and a subscription id, nothing else.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "channel": {
                "description": "Where reminders go: email, sms, telegram or whatsapp.",
                "enum": ["email", "sms", "telegram", "whatsapp"],
                "type": "string"
              },
              "contact": {
                "description": "The verified contact of this session on that channel (email address, phone number, Telegram id or WhatsApp number); it must match.",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              },
              "deadline_ids": {
                "description": "Deadline ids from next_deadlines (dated deadlines only).",
                "items": {
                  "pattern": "^[a-z0-9-]{3,80}$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Language of the reminders; default the language of the conversation.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["channel", "contact", "deadline_ids"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "channel": {
                "enum": ["email", "sms", "telegram", "whatsapp"],
                "type": "string"
              },
              "scheduled": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "deadline_id": {
                      "type": "string"
                    },
                    "due": {
                      "description": "The deadline date the reminders lead up to (YYYY-MM-DD).",
                      "type": "string"
                    },
                    "send_at": {
                      "description": "When each reminder goes out (ISO time, UTC).",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["deadline_id", "due", "send_at"],
                  "type": "object"
                },
                "type": "array"
              },
              "subscription_id": {
                "description": "Reminder subscription id; keep it with the conversation.",
                "type": "string"
              }
            },
            "required": ["channel", "scheduled", "subscription_id"],
            "type": "object"
          },
