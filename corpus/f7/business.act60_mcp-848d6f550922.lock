      "serverInfo": {
        "name": "act60",
        "title": "Act 60 tools by Rabbithole Labs",
        "version": "1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free Act 60 (Puerto Rico) tools. When a request matches one tool, call it. When it matches several or none, call pick_tool and show the cards. Every rule answer cites a primary source with a verified-on date and a regime tag; without a citation there is no answer. Results are information, not legal or tax advice. Answer in the language of the user.",
      "tools": [
        {
          "name": "ask_canon",
          "title": "Ask an Act 60 rule question",
          "description": "Answers an Act 60 (Puerto Rico) rule question from a page a person verified against the official texts: a two-sentence answer, the full answer in details (markdown, [n] = citations[n-1]), primary-source citations with quotes, a regime tag (pre2027, post2027, both) and the verified-on date. Answer from details and cite the sources; do not add facts the page does not state. Answers no_citation when no verified page covers the question. Information, not advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "anyOf": [
                  {
                    "enum": ["en", "es"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "question": {
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "type": "string"
              },
              "canon_version": {
                "type": "string"
              },
              "citations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "accessed_on": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "primary": {
                      "type": "boolean"
                    },
                    "publisher": {
                      "type": "string"
                    },
                    "quote": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["accessed_on", "id", "primary", "publisher", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "details": {
                "type": "string"
              },
              "disclaimer": {
                "type": "string"
              },
              "locale": {
                "enum": ["en", "es"],
                "type": "string"
              },
              "page_url": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "regime": {
                "enum": ["pre2027", "post2027", "both"],
                "type": "string"
              },
              "route": {
                "const": "find_pro",
                "type": "string"
              },
              "segment": {
                "enum": ["individual", "chapter3", "all"],
                "type": "string"
              },
              "verified_on": {
                "type": "string"
              }
            },
            "required": ["answer", "canon_version", "citations", "details", "disclaimer", "locale", "page_url", "question", "regime", "segment", "verified_on"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
