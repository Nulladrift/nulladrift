        {
          "name": "pick_tool",
          "title": "Pick a tool",
          "description": "Lists the Act 60 tools as cards grouped by lifecycle stage, best matches for the request first. Call it when a request matches several tools or none.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Card language; default: the language of the request",
                "enum": ["en", "es"],
                "type": "string"
              },
              "request": {
                "description": "The user's request, in their words",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cards": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "demo_prompt": {
                            "type": "string"
                          },
                          "id": {
                            "type": "string"
                          },
                          "job": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "stage": {
                            "enum": ["considering", "applying", "establishing-residency", "annual-compliance", "audit-exit", "all"],
                            "type": "string"
                          }
                        },
                        "required": ["demo_prompt", "id", "job", "name", "stage"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "stage": {
                      "enum": ["considering", "applying", "establishing-residency", "annual-compliance", "audit-exit", "all"],
                      "type": "string"
                    }
                  },
                  "required": ["cards", "stage"],
                  "type": "object"
                },
                "type": "array"
              },
              "matches": {
                "items": {
                  "type": "string"
                },
                "type": "array"
