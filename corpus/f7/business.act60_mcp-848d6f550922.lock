        {
          "name": "whats_changed",
          "title": "What changed in the Act 60 rules",
          "description": "Lists the approved change notes on the Act 60 primary sources (Act 60-2019 as amended, Act 38-2026, DDEC, Hacienda, CECFL, IRS) dated on or after `since`, newest first, each with English and Spanish summaries and the source URL. Only notes a person approved are listed; an empty list means no approved change in that period.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Response language; default: en",
                "enum": ["en", "es"],
                "type": "string"
              },
              "since": {
                "description": "ISO date (YYYY-MM-DD); notes dated on or after it",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "notes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "doc_id": {
                      "type": "string"
                    },
                    "summary_en": {
                      "type": "string"
                    },
                    "summary_es": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["date", "doc_id", "summary_en", "summary_es", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["notes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
