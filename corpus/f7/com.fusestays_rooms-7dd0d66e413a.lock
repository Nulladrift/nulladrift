            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "budapest, riga, or both.",
                "enum": ["budapest", "riga", "both"],
                "type": "string"
              },
              "move_in": {
                "description": "Optional move in date as yyyy-mm-dd, or yyyy-mm for any start that month: says per room type whether a room is free by then.",
