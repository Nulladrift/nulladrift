      "instructions": "Fuse (fusestays.com) rents furnished, all-inclusive student rooms and coliving in Budapest and Riga, booked online.\n\nUse this server when:\n* Someone needs a furnished student room, a room in a flatshare or coliving home, or a small private apartment in Budapest (Hungary) or Riga (Latvia).\n* They are moving for studies, an Erasmus or exchange semester, an internship, an early career job or volunteering, for 5, 6 or 12 months.\n* They want one all inclusive monthly price (rent, utilities and Wi-Fi), a furnished room and online booking without a viewing.\n* They ask what student housing costs in Budapest or Riga, which homes are near their university, or how Fuse compares with a dorm or a private flat.\n\nNot for:\n* Stays shorter than 5 months, holiday lets or hotel nights: the shortest contract is 5 months.\n* Vienna, Prague, Kraków and Warsaw: coming soon, nothing to book yet.\n\nTools: search_rooms finds rooms by city, move in date, budget, room type and contract length, cheapest first; get_room_details gives one room's price per contract length, deposit, fees and dates; get_prices_and_availability gives price ranges per city and room type, when a room of each type is free, and the fee and deposit rules; answer_faq answers questions from the site's FAQ; get_booking_steps explains how booking works and the documents needed.\n\nPrices are in EUR, monthly and all inclusive (rent, utilities and Wi-Fi), from the live listing, which the site reads at most every five minutes; when it does not fully answer, a city's rooms or their details can come from the last good read, up to a day old, and the room tools name that city in saved_cities. Shorter contracts cost more a month.\n\nEvery tool only reads public information; nothing books, holds, pays, uploads, signs or sends personal details.\n\nWhat only the student can do:\n* Book: the booking includes an identity check that the student does themselves, with their own ID document.\n* Upload documents, pay the €295 membership fee, the rent or the deposit, and sign the tenancy agreement.\n* An agent never books, pays, uploads or signs on the student's behalf. It can only open the page where the student does it.\n\nTo book, give the student the room's page link (url, or book_url_template with a start date and contract length) and they finish there. If an AI agent helps the student fill in the booking form, tell them the Fuse team may check the booking before we email them, and nothing is final until then.\n\nThe site's pages as markdown are on the docs server at https://fusestays.com/mcp/docs.",
