{
  "lockfileVersion": 2,
  "subjects": {
    "com.signalaf/contribution-exchange": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://signalaf.com/api/exchange/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "contribution-exchange",
        "title": "Contribution Exchange MCP",
        "version": "1.0.0",
        "description": "Contribution Exchange — discover domain profiles, published Exchange Signals, and submit non-binding Contribution Proposals. No tool creates a Commitment, authorization, or settlement."
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Contribution Exchange MCP — discover and act on Contribution Exchange opportunities. Read-only tools: exchange_discover_domain (check if a domain has an Exchange profile), exchange_get_policy (fetch domain policy), exchange_preflight (advisory policy evaluation — no state change), exchange_list_signals (domain-published work signals), exchange_get_signal, exchange_get_attempt. Mutation tools (require auth): exchange_propose (unsolicited proposal — creates a non-binding proposal, NOT a Commitment), exchange_create_attempt, exchange_submit_attempt, exchange_create_proposal_from_attempt. IMPORTANT: No Exchange tool creates a Commitment, authorization, or payment obligation. Signals and proposals are invitational, not binding. Bilateral terms-hash acceptance is required for Commitment formation.",
      "tools": [
        {
          "name": "exchange_discover_domain",
          "title": "Exchange Discover Domain — Contribution Exchange Profile Lookup",
          "description": "Determine whether a domain publishes a Contribution Exchange profile. Returns the canonical Exchange manifest, policy URLs, signal URLs, and whether the domain is self-hosted or delegated to a Steward. Read-only — does not propose, commit, or authorize anything. Enforces HTTPS, redirect limits, timeouts, and SSRF protections (blocks loopback, link-local, private-network, and metadata-service targets).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name or HTTPS URL to check (e.g. 'signalaf.com' or 'https://signalaf.com'). Normalized to hostname.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:974a4a47aa2cf05b14099dd2eb63b5e0a6dec61cac361a70e7979845c10e30fe"
        },
        {
          "name": "exchange_get_attempt",
          "title": "Exchange Get Attempt — Signal Attempt Detail",
          "description": "Get detail for a signal attempt. Read-only. Enforces attempt visibility — actors may only read their own private attempts. Returns attempt status and verification result if available. Attempt status is NOT an exchange state. Verification is Steward-controlled and cannot be self-asserted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "attempt_id": {
                "description": "Attempt ID.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "signal_id": {
                "description": "Signal ID.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["attempt_id", "signal_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab9a71df9ae1fd33cf8c5cd63c6ee35b7bc6e051ff7c0fff7e07411ec7935e2f"
        },
        {
          "name": "exchange_get_policy",
          "title": "Exchange Get Policy — Domain Exchange Policy",
          "description": "Fetch the canonical Contribution Exchange policy for a domain or its delegated Steward. Returns authority ceilings, consideration limits, human-review requirements, and supported behavior. Read-only — does not mutate state or perform preflight evaluation. Distinguishes a missing policy from an unavailable service.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name to fetch policy for.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0507350ac7a83a0462f355bd89890e00a0422f40b320a90ff5535d997bf736d3"
        },
        {
          "name": "exchange_get_signal",
          "title": "Exchange Get Signal — Signal Detail by ID",
          "description": "Get full detail for a single Exchange Signal by ID. Read-only. Returns the complete signal including constraints, participation rules, verification configuration, consideration declaration, and follow-on behavior. A signal does NOT create a Commitment, authorize execution, or guarantee payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "signal_id": {
                "description": "Signal ID.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["signal_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1fa72041d9b2904e2c80083b157cdf3faaa357471bfb9016874d414a327ea65d"
        },
        {
          "name": "exchange_list_signals",
          "title": "Exchange List Signals — Domain-Published Work Signals",
          "description": "List domain-published Exchange Signals (problems, requests, challenges, bounties, verification tasks, discoveries, experiments). Read-only. Returns canonical URLs, signal revision, revision hash, and status. Signal status is DISTINCT from exchange status — a signal does not create a Commitment or authorize execution. Supports the same filters and pagination as the HTTP API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accepting_attempts": {
                "description": "Only return signals currently accepting attempts.",
                "type": "boolean"
              },
              "consideration_mode": {
                "description": "Filter by consideration mode.",
                "enum": ["fixed", "maximum", "negotiable"],
                "type": "string"
              },
              "cursor": {
                "description": "Pagination cursor from a previous response.",
                "type": "string"
              },
              "domain": {
                "description": "Filter by publisher domain.",
                "type": "string"
              },
              "expires_before": {
                "description": "ISO 8601 timestamp — only signals expiring before this.",
                "type": "string"
              },
              "label": {
                "description": "Filter by label.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Maximum signals to return (1-100, default 50).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "published_after": {
                "description": "ISO 8601 timestamp — only signals published after this.",
                "type": "string"
              },
              "status": {
                "description": "Filter by signal status.",
                "enum": ["published", "paused", "closed", "expired", "withdrawn"],
                "type": "string"
              },
              "type": {
                "description": "Filter by signal type.",
                "enum": ["problem", "request", "challenge", "bounty", "verification", "discovery", "experiment"],
                "type": "string"
              },
              "verification_mode": {
                "description": "Filter by verification mode.",
                "enum": ["deterministic", "hybrid", "manual"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4f738f5a3d9e788c84537314784dcd4b15bc73614497b3f11f841308d9e71424"
        },
        {
          "name": "exchange_preflight",
          "title": "Exchange Preflight — Advisory Proposal Policy Evaluation",
          "description": "Evaluate a proposed contribution against the same policy logic used by the real proposal flow. Returns whether the proposal is likely to be auto-engaged, accepted for review, escalated to a human, or rejected as invalid. READ-ONLY: performs no proposal insertion, notification, event creation, or state transition. The result is advisory and time-bound — a favorable preflight does NOT guarantee engagement, Commitment, authorization, payment, or execution. Uses the same evaluateProposal function as the canonical proposal route.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Contribution category (e.g. 'technical', 'accessibility', 'documentation', 'research').",
                "type": "string"
              },
              "confidence": {
                "description": "Confidence in the observation (score 0-1 and basis).",
                "properties": {
                  "basis": {
                    "type": "string"
                  },
                  "score": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "consideration": {
                "description": "Requested consideration (cash, royalty, reciprocal_access, attribution, referral, other). Advertised consideration is NOT binding until accepted through Commitment.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "description": "Target domain for the proposed contribution.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "required_authorization": {
                "description": "Authority requested (inspect_public, sandbox_test, repository_write, private_data, credential_access, production_modify, deploy, penetration_testing).",
                "properties": {
                  "credential_access": {
                    "type": "boolean"
                  },
                  "deploy": {
                    "type": "boolean"
                  },
                  "inspect_public": {
                    "type": "boolean"
                  },
                  "other": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "penetration_testing": {
                    "type": "boolean"
                  },
                  "private_data": {
                    "type": "boolean"
                  },
                  "production_modify": {
                    "type": "boolean"
                  },
                  "repository_read": {
                    "type": "boolean"
                  },
                  "repository_write": {
                    "type": "boolean"
                  },
                  "sandbox_test": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              }
            },
            "required": ["category", "domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f7e9c59bc2eede5e3f40791e63fd8e08fb1b5dea4e2c6928e3b64e859d2b0d0"
        }
      ],
      "digest": "sha256:deb86f978b2fc19a078bbe9a25fb820921f8a0362c0996ded8816b99c53ad030"
    }
  }
}
