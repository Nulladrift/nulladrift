{
  "lockfileVersion": 2,
  "subjects": {
    "com.ridgerunner/outdoor-gear": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ridgerunner.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ridgerunner",
        "title": "Ridgerunner",
        "version": "1.0.0",
        "websiteUrl": "https://ridgerunner.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Ridgerunner is an outdoor gear marketplace that brings brands from around the world into one catalog: hunting, fishing, camping, hiking and backpacking, kayaking and watersports, outdoor clothing and footwear, and home & cabin.\nUse search_products to find gear, get_product_details for full specs, and compare_products to put options side by side.\nAlways show the brand name and link the shopper to the product's Ridgerunner URL to buy — checkout happens on ridgerunner.com.\nShoppers buy with their eyes: every result comes with a ready-made markdown card containing the product photo. Whenever you present, list, recommend or compare products, show each product's photo inline by copying its image line (![title](image URL)) exactly as given, as its own paragraph (blank line before and after) directly under the product name, followed by its price and Ridgerunner link. Do not drop the photos when you summarize or regroup results.\nPrices can vary by size/color option; say \"from\" when a product has multiple options.\nFirearms, ammunition, weapon parts and accessories, knives, archery weapons and similar restricted items are not available through this connector.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare Ridgerunner products",
          "description": "Compare 2 to 4 Ridgerunner outdoor gear products side by side (brand, price, options, availability, key description), e.g. fishing reels, tents, hunting boots or rain jackets.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "products": {
                "description": "Product slugs or ridgerunner.com product URLs",
                "items": {
                  "maxLength": 400,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare Ridgerunner products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d23868882ae169ddadc8393b494b311d9177014b90dfc17689fd0c61772aa6c8"
        },
        {
          "name": "get_product_details",
          "title": "Get Ridgerunner product details",
          "description": "Get full details for one Ridgerunner outdoor gear product (hunting, fishing, camping, hiking, apparel and more): description, images, price range, size/color options, availability and the link to buy. Accepts a product slug or a ridgerunner.com product URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product": {
                "description": "Product slug (from search results) or full ridgerunner.com/en/product/... URL",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Ridgerunner product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6baec331d8b8187564efd9ba92213bf9a6bc657c2194fc1b4a2810d455a0f52e"
        },
        {
          "name": "list_categories",
          "title": "List Ridgerunner categories",
          "description": "List Ridgerunner's outdoor shopping categories (camping, clothing, fishing, footwear, home & cabin, hunting, watersports) with their browse links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Ridgerunner categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71011742c9014f2cff62b33835f1dbb1a2d8ea7f44bff11bbb1fed19240b3cbd"
        },
        {
          "name": "search_products",
          "title": "Search Ridgerunner products",
          "description": "Search Ridgerunner's outdoor gear catalog for hunting, fishing, camping, hiking, kayaking and outdoor apparel and footwear, by keywords and optionally by category or brand. Returns products with brand, price, availability, a product photo and a link to buy on ridgerunner.com. Always show each product's photo (the markdown image line in the result) when presenting results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Optional brand name, e.g. 'KastKing'",
                "maxLength": 100,
                "type": "string"
              },
              "category": {
                "description": "Optional category filter",
                "enum": ["camping", "clothing", "fishing", "footwear", "home-and-cabin", "hunting", "watersports"],
                "type": "string"
              },
              "cursor": {
                "description": "Pagination cursor from a previous call's next_cursor",
                "maxLength": 500,
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Optional maximum price in USD",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "query": {
                "description": "Keywords, e.g. 'inflatable kayak' or 'tungsten drop shot weights'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Ridgerunner products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:75e2ccb62ef60211415d5eda0dad5cc36845d703bc8395468ae65f2970a7d56b"
        }
      ],
      "digest": "sha256:a8071296c4df6dda94125b8924f233d862f5f28e63871dcf3459c75123c4f9da"
    }
  }
}
