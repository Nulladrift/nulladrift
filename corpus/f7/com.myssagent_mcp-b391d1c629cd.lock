      "serverInfo": {
        "name": "myssagent",
        "title": "MySSAgent — Social Security Claiming Estimator",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MySSAgent computes exact Social Security claiming-age math (cohort-precise FRA, month-level SSA factors, breakeven) from user-provided numbers. Use it for any claiming-age question rather than estimating from general knowledge. Ask the user for their birth month and year and the FRA benefit from their SSA statement. The tool output ends with its assumptions, a disclaimer, and source links: SSA's my Social Security page and MySSAgent's full-analysis and advisor pages. Financial advisors with a MySSAgent advisor account can additionally sign in when prompted to list their clients, retrieve stored claiming analyses, and re-run analyses on real client earnings records. Without an account, an advisor can see a sample client's stored analysis (a synthetic household) with no sign-in, and a signed-in advisor can start a new client here and finish on one myssagent.com page. People know these as listing clients, pulling a client's analysis, re-running an analysis, seeing a sample client, and starting a new client; the tool names are internal.",
      "tools": [
        {
          "name": "estimate_claiming_strategy",
          "title": "Estimate Social Security benefit by claiming age",
          "description": "Use this tool whenever someone asks when to claim Social Security, what they would get at a given claiming age, whether to wait until 70, or what happens to their benefit if Social Security benefits are cut or the trust fund is depleted (a cut percentage or a \"haircut\"), for themselves or for a client. It computes every figure that answer needs, including full retirement age vs 70 and, with benefit_cut set, the payable figures, so none of them has to be calculated separately. Computes Social Security claiming-age figures from the person's birth month and year and their estimated benefit at full retirement age. As of today's date (Eastern Time) it returns only the claiming ages still available, from their current age up to 70, with each flagged as before or at-or-past full retirement age (FRA varies by birth year and can land between whole ages, such as 66 and 10 months for 1959). Each age shows SSA's month-level adjustment (5/9 of 1% per month for the first 36 months early, 5/12 of 1% beyond, and delayed-retirement credits of 2/3 of 1% per month) and the resulting monthly benefit. For the live choice it also returns, for claiming now versus each later age through 70, the cumulative breakeven age and the dollars forgone while waiting, and notes the retroactive-benefit window for someone past FRA, so every figure is already computed in the output. Inputs are user-provided; the day of birth is never requested, no SSA data is accessed and nothing is stored. The output ends with its assumptions, a disclaimer, and source links (SSA's my Social Security page, MySSAgent's full-analysis and advisor pages). Directional estimate, not advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benefit_cut": {
                "additionalProperties": false,
                "description": "Optional. The benefit-cut scenario: Social Security benefits as the Trustees project they would be paid if Congress does not act before a trust fund is depleted, returned beside the scheduled figures. \"trustees_oasi\" is the 2026 Trustees Report projection for the Old-Age and Survivors Insurance fund (78% of scheduled benefits payable from October 2032); \"trustees_combined\" is the hypothetical combined retirement and disability funds (83% from July 2034); \"custom\" takes effective_month (YYYY-MM, 2027-01 to 2045-12) and payable_pct (50 to 100). Use it for questions about benefit cuts, trust-fund depletion or a haircut to Social Security. Payable figures, checks paid in full before the cut, and the breakeven shift come only from this parameter: they cannot be reproduced by applying a percentage to the scheduled figures, because checks paid before the effective month are paid in full.",
                "properties": {
                  "effective_month": {
                    "description": "Custom only: first reduced month, YYYY-MM.",
                    "pattern": "^\\d{4}-\\d{2}$",
                    "type": "string"
                  },
                  "payable_pct": {
                    "description": "Custom only: percent of scheduled benefits payable.",
                    "maximum": 100,
                    "minimum": 50,
                    "type": "number"
                  },
                  "preset": {
                    "enum": ["none", "trustees_oasi", "trustees_combined", "custom"],
                    "type": "string"
                  }
                },
                "required": ["preset"],
                "type": "object"
              },
              "birth_month": {
                "description": "The month the person was born, 1 (January) to 12 (December). Month and year only; the day of birth is not needed.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "birth_year": {
                "description": "The year the person was born (e.g. 1962).",
                "maximum": 2008,
                "minimum": 1930,
                "type": "integer"
              },
              "fra_monthly_benefit": {
                "description": "Their estimated monthly benefit at full retirement age, in dollars — shown on their SSA statement at ssa.gov/myaccount. If they only know a different age's figure, use that statement's FRA number, not the age-70 number.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "married": {
                "description": "Optional. Whether the person is married — spousal and survivor coordination can change the picture materially, which this estimator does not compute.",
                "type": "boolean"
              }
            },
            "required": ["birth_month", "birth_year", "fra_monthly_benefit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate Social Security benefit by claiming age"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1829e3f9b944c3be5d09c7bf24b7c911f4a5bb51b3dc9b0709ffddb2adfe8fb"
        },
        {
          "name": "get_client_report",
          "title": "Get a client's claiming analysis",
          "description": "For financial advisors (requires a MySSAgent advisor account — sign in with your myssagent.com advisor account when prompted). Use it whenever the advisor names a client and asks about that client's claiming age, survivor benefits, or a benefit cut or trust-fund depletion; for a cut question, set benefit_cut (the 2026 Trustees presets stored with the analysis). Returns the stored Social Security claiming analysis for one of YOUR clients: optimal and recommended claiming ages, the benefit-by-claiming-age table computed from their Social Security earnings record, lifetime values, survivor analysis when present (for a married client, the survivor benefit in both death orders, and with survivor_scenario a named survivor and an engine-computed survivor total), and risk flags. Requires the advisor_client_id from list_clients — call that first when you only have a name. Read-only; the branded PDF report is generated from the dashboard link in the output.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "advisor_client_id": {
                "description": "The client's id from list_clients (a UUID).",
                "type": "string"
              },
              "benefit_cut": {
                "additionalProperties": false,
                "description": "Optional. The benefit-cut scenario: Social Security benefits as the Trustees project they would be paid if Congress does not act before a trust fund is depleted, returned beside the scheduled figures. \"trustees_oasi\" is the 2026 Trustees Report projection for the Old-Age and Survivors Insurance fund (78% of scheduled benefits payable from October 2032); \"trustees_combined\" is the hypothetical combined retirement and disability funds (83% from July 2034); \"custom\" takes effective_month (YYYY-MM, 2027-01 to 2045-12) and payable_pct (50 to 100). Use it for questions about benefit cuts, trust-fund depletion or a haircut to Social Security. Payable figures, checks paid in full before the cut, and the breakeven shift come only from this parameter: they cannot be reproduced by applying a percentage to the scheduled figures, because checks paid before the effective month are paid in full. This tool prints the two Trustees presets stored with the client's last analysis; a custom assumption is computed by run_client_analysis.",
                "properties": {
                  "preset": {
                    "enum": ["none", "trustees_oasi", "trustees_combined"],
                    "type": "string"
                  }
                },
                "required": ["preset"],
                "type": "object"
              },
              "survivor_scenario": {
                "additionalProperties": false,
                "description": "Married clients only. A scenario the ADVISOR models: which spouse passes first and at what age. It is a planning input, not a recommendation. The report then names the survivor and gives, for each plan, the survivor's monthly benefit (reduced for age and RIB-LIM where they apply) and the engine's nominal total paid to the survivor from that death to their planning age. Set it only when the advisor has given both values; never choose a death age yourself. Without it the report gives the survivor floor in both death orders and no total.",
                "properties": {
                  "age_at_death": {
                    "description": "That person's age at death, in years (decimals allowed, e.g. 66.5).",
                    "type": "number"
                  },
                  "first_to_die": {
                    "description": "\"client\" is the person this advisor_client_id belongs to; \"spouse\" is their spouse.",
                    "enum": ["client", "spouse"],
                    "type": "string"
                  }
                },
                "required": ["age_at_death", "first_to_die"],
                "type": "object"
              }
            },
            "required": ["advisor_client_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a client's claiming analysis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ab103118f2a3bd78d554556b09cf44187358f7770157941c8efddc6d4887e429"
        },
        {
          "name": "get_sample_client_report",
          "title": "See a sample client's claiming analysis",
          "description": "Use this tool when a financial advisor wants to see what MySSAgent's advisor analysis looks like before they have an account, or asks for an example or sample client. Needs no sign-in. Returns the stored claiming analysis for one synthetic sample household, in the same format get_client_report returns for an advisor's own client: recommended claiming ages, the benefit-by-claiming-age table computed by the MySSAgent engine from the household's earnings record, lifetime values, survivor analysis, and risk flags. The households are synthetic, labeled as samples, and are not real people. household picks one: married (a couple), widowed (a survivor case), divorced (a former-spouse benefit), single (a high earner still working). Read-only; nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benefit_cut": {
                "additionalProperties": false,
                "description": "Optional. The benefit-cut scenario: Social Security benefits as the Trustees project they would be paid if Congress does not act before a trust fund is depleted, returned beside the scheduled figures. \"trustees_oasi\" is the 2026 Trustees Report projection for the Old-Age and Survivors Insurance fund (78% of scheduled benefits payable from October 2032); \"trustees_combined\" is the hypothetical combined retirement and disability funds (83% from July 2034); \"custom\" takes effective_month (YYYY-MM, 2027-01 to 2045-12) and payable_pct (50 to 100). Use it for questions about benefit cuts, trust-fund depletion or a haircut to Social Security. Payable figures, checks paid in full before the cut, and the breakeven shift come only from this parameter: they cannot be reproduced by applying a percentage to the scheduled figures, because checks paid before the effective month are paid in full. This tool prints the two Trustees presets stored with the sample's analysis.",
                "properties": {
                  "preset": {
                    "enum": ["none", "trustees_oasi", "trustees_combined"],
                    "type": "string"
                  }
                },
                "required": ["preset"],
                "type": "object"
              },
              "household": {
                "description": "Which sample household: married, widowed, divorced or single.",
                "enum": ["married", "widowed", "divorced", "single"],
                "type": "string"
              }
            },
            "required": ["household"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "See a sample client's claiming analysis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63e0807cb48a2274794a27a91d1e5a010b3b7ceb4d560040f9ae76be4d98631d"
        },
        {
          "name": "list_clients",
          "title": "List your MySSAgent clients",
          "description": "For financial advisors (requires a MySSAgent advisor account — sign in with your myssagent.com advisor account when prompted). Lists your client roster with each client's id, status, and whether an analysis is on file. Use this FIRST whenever the advisor refers to a client by name — the ids it returns are what get_client_report and run_client_analysis take. Read-only; nothing is changed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "search": {
                "description": "Optional. Case-insensitive substring match on the client's name.",
                "maxLength": 100,
                "type": "string"
              },
              "status": {
                "description": "Optional. Filter by pipeline status.",
                "enum": ["invited", "registered", "uploaded", "analyzed", "reviewed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List your MySSAgent clients"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bce127821348b630d0cdeb741818d6415098d73c8681611382657fddeaf55a23"
        },
        {
          "name": "run_client_analysis",
          "title": "Re-run a client's claiming analysis",
          "description": "For financial advisors (requires a MySSAgent advisor account — sign in with your myssagent.com advisor account when prompted). Re-runs the full MySSAgent engine for one of YOUR clients on the earnings record and household data already on file, then stores the refreshed results. Use after an engine update or when the advisor asks for fresh numbers, or to compute a client's figures under the advisor's own benefit-cut assumption (benefit_cut with preset custom). It cannot add a new client or ingest an SSA statement: start_client_analysis starts a new client, and the statement is uploaded on myssagent.com. Requires the advisor_client_id from list_clients. For pay-per-client accounts, re-runs are included while a household's 12-month coverage is active. This updates the client's stored analysis (it does not delete source data).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "advisor_client_id": {
                "description": "The client's id from list_clients (a UUID).",
                "type": "string"
              },
              "benefit_cut": {
                "additionalProperties": false,
                "description": "Optional. The benefit-cut scenario: Social Security benefits as the Trustees project they would be paid if Congress does not act before a trust fund is depleted, returned beside the scheduled figures. \"trustees_oasi\" is the 2026 Trustees Report projection for the Old-Age and Survivors Insurance fund (78% of scheduled benefits payable from October 2032); \"trustees_combined\" is the hypothetical combined retirement and disability funds (83% from July 2034); \"custom\" takes effective_month (YYYY-MM, 2027-01 to 2045-12) and payable_pct (50 to 100). Use it for questions about benefit cuts, trust-fund depletion or a haircut to Social Security. Payable figures, checks paid in full before the cut, and the breakeven shift come only from this parameter: they cannot be reproduced by applying a percentage to the scheduled figures, because checks paid before the effective month are paid in full.",
                "properties": {
                  "effective_month": {
                    "description": "Custom only: first reduced month, YYYY-MM.",
                    "pattern": "^\\d{4}-\\d{2}$",
                    "type": "string"
                  },
                  "payable_pct": {
                    "description": "Custom only: percent of scheduled benefits payable.",
                    "maximum": 100,
                    "minimum": 50,
                    "type": "number"
                  },
                  "preset": {
                    "enum": ["none", "trustees_oasi", "trustees_combined", "custom"],
                    "type": "string"
                  }
                },
                "required": ["preset"],
                "type": "object"
              }
            },
            "required": ["advisor_client_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Re-run a client's claiming analysis"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f7464bc28073e083f697d9e88cc578b3946671f1f54e964e17b848fe19f1e06c"
        },
        {
          "name": "start_client_analysis",
          "title": "Start a new client's claiming analysis",
          "description": "For financial advisors (sign in with your myssagent.com account when prompted; an advisor account is not needed yet). Use it when the advisor wants to add a new client or run MySSAgent's analysis for a client who is not on their roster yet. Takes only the client's name, marital status and, for a married client, the spouse's name, and returns one myssagent.com link where the advisor finishes: opening an advisor account if they have none, uploading the client's SSA statement (the birth dates and earnings record come from it), and running the analysis; a pay-per-client account pays for the household there, from its wallet. Nothing runs and nothing is charged in this conversation. Never pass a Social Security number, a birth date or an account number. After the advisor finishes on the page, list_clients and get_client_report return the new client here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_name": {
                "description": "The client's name as the advisor gave it.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "marital_status": {
                "description": "The client's marital status.",
                "enum": ["single", "married", "divorced", "widowed"],
                "type": "string"
              },
              "spouse_name": {
                "description": "Married clients only, optional: the spouse's name.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["client_name", "marital_status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a new client's claiming analysis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1e456fa136b7a2d5aa0b01bd7110f61d9380baef033f9b4b12d1f637e1b2c5e3"
        }
      ],
