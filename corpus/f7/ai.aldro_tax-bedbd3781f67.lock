          },
          "digest": "sha256:17a21b0ed901ca38e479f5af5b419e431ba9e62f407b936bf5d315606667546f"
        },
        {
          "name": "start_onboarding",
          "title": "Send the user's signup to Aldro",
          "description": "Call this only after the user has explicitly said yes, in this chat, to sending their name, email and business details to Aldro to get their business taxes or bookkeeping done. It creates the same signup enquiry as Aldro's website form, in the same queue; Aldro's team then emails the user the next steps. Set consent to true only when the user agreed. Testing the tool? Set test to true. It is not a marketing opt-in and takes no payment. Limits: 5 signups an hour per connection, 25 a day in total.",
          "inputSchema": {
            "properties": {
              "business_name": {
                "description": "The business's name.",
                "maxLength": 200,
                "type": "string"
              },
              "consent": {
                "description": "true only if the user explicitly agreed in this chat to share these details with Aldro.",
                "type": "boolean"
              },
              "country": {
                "description": "US for the United States, CA for Canada.",
                "enum": ["US", "CA"],
                "type": "string"
              },
              "email": {
                "description": "The email address Aldro should reply to.",
                "maxLength": 254,
                "type": "string"
              },
              "entity": {
                "description": "Business type. US: sole_prop, single_member_llc, multi_member_llc, partnership, s_corp, c_corp. Canada: sole_prop or corporation.",
                "enum": ["sole_prop", "single_member_llc", "multi_member_llc", "partnership", "s_corp", "c_corp", "corporation"],
                "type": "string"
              },
              "message": {
                "description": "Optional. Anything the user wants Aldro to know.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "description": "The user's full name.",
                "maxLength": 200,
                "type": "string"
              },
              "service": {
                "description": "tax (yearly business tax filing), bookkeeping (monthly), both, or catch-up (behind on the books).",
                "enum": ["tax", "bookkeeping", "both", "catch-up"],
                "type": "string"
              },
              "test": {
                "description": "Optional. true when you are testing this tool rather than sending a real user's signup. The enquiry is stored, marked as a test, and nobody emails it.",
                "type": "boolean"
              }
            },
            "required": ["business_name", "consent", "country", "email", "entity", "name", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send the user's signup to Aldro"
          },
          "behavior": {
            "destructive": false,
