          "description": "Both are red cards, but they are different offences in the 2026/27 Laws: serious foul play happens in a challenge for the ball; violent conduct needs no challenge, can target anyone, and counts even without contact. The distinction decides restarts and applies to VAR review scope.",
          "mimeType": "application/json",
          "digest": "sha256:3e91422a07bf1dfce3db09bd36d8e74500efb14f3195ca08fe909aead8746b59"
        },
        {
          "uri": "citarium://futbol-atlas/entity/simulation",
          "name": "simulation",
          "title": "Simulation — Football Atlas",
          "description": "Simulation is the act of creating a wrong or false impression that something has occurred when it has not, committed to gain an unfair advantage; it is cautioned as unsporting behaviour.",
          "mimeType": "application/json",
          "digest": "sha256:813bf85fadb5267e28d979723882c3ec19aee67a04859702e48b2c9478fd14e4"
        },
        {
          "uri": "citarium://futbol-atlas/sources/1",
          "name": "sources-1",
          "title": "Football Atlas — source registry (1 of 2)",
          "description": "131 sources, caf-afcon-2025-final-report … uefa-weuro-every-final.",
          "mimeType": "application/json",
