        {
          "name": "search",
          "title": "Search Football Atlas",
          "description": "Full-text search over the knowledge graph. Matching ignores accents and apostrophes, so query in the user's own words; every hit carries the fields it matched and a score. BM25 relevance: each query term is weighted by how RARE it is in this corpus and by where it hits (name 3, tags 2, questions 2, body 1). A hit must also cover a minimum share of the question's information, measured in the same rarity weights — matching only common words does not qualify. Centrality (how many objects point at this one) breaks TIES ONLY and is never part of the score, so it cannot make an irrelevant object rank. Two hits with the same matched_fields can still differ: the score is rarity-weighted, so matching a rare term is worth more than matching a common one. Use this whenever you have a question rather than an id, then follow up with get_entity.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many ranked hits to return, best first.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in the user's own words. Matched against titles, questions, claim text and tags; accents and apostrophes are ignored, so 'jose' finds 'José'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "api_url": {
                      "type": "string"
                    },
                    "canonical_url": {
                      "type": "string"
                    },
                    "confidence": {
                      "type": "number"
                    },
                    "coverage": {
                      "description": "Share of the question's information this object accounts for, weighted by term rarity. 1 means every meaningful word in the query is present; a low value with a high score means the object matched common words only.",
                      "type": "number"
                    },
                    "evidence_tier": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "last_verified": {
                      "type": "string"
                    },
                    "matched_fields": {
                      "description": "Which fields the query hit: name, tags, questions, summary, claims. Does NOT determine the score on its own.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
