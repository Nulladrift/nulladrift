                "type": "array"
              },
              "matched_question": {
                "description": "The stored question this was matched to, when the answer came from one.",
                "type": "string"
              },
              "missing_topics": {
                "description": "Meaningful words in the question that appear nowhere in the winning object — the gap, named.",
