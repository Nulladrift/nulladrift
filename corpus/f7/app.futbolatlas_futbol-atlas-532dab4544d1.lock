        {
          "name": "answer",
          "title": "Answer a question about Football Atlas",
          "description": "Answer a question from the corpus, or refuse. Returns only the claims that bear on the question, each with the sources it cites and its editorial confidence. When the corpus cannot answer, answered is false and abstention_reason plus missing_topics say what was not covered — a refusal is a real result here, not an error. Use this when the user asked a question in words; use search when you want to see the candidates yourself.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "description": "The question to answer, in the words the user asked it.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "abstention_reason": {
                "description": "Why the corpus declined: empty_query, no_candidates, below_coverage, ambiguous_candidates or no_intent_match.",
                "type": "string"
              },
              "answered": {
                "type": "boolean"
              },
              "candidates": {
                "description": "Near misses, so a refusal is still a lead. Present whether or not the question was answered.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "coverage": {
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "score": {
                      "type": "number"
                    }
                  },
                  "required": ["coverage", "id", "score"],
                  "type": "object"
                },
                "type": "array"
              },
              "claims": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "type": "number"
                    },
                    "relevance": {
                      "type": "number"
                    },
                    "sources": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["id", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "text": {
                      "type": "string"
                    }
                  },
                  "required": ["confidence", "relevance", "sources", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "coverage": {
                "description": "Share of the question's information the winning object accounts for, weighted by term rarity.",
                "type": "number"
              },
              "entity": {
                "additionalProperties": false,
                "properties": {
                  "api_url": {
                    "type": "string"
                  },
                  "canonical_url": {
                    "type": "string"
                  },
                  "confidence": {
                    "type": "number"
                  },
                  "evidence_tier": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "last_verified": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "summary": {
                    "type": "string"
                  },
                  "tags": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "type": {
                    "type": "string"
                  },
                  "x": {
                    "additionalProperties": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "description": "Indexed instance-specific attributes, grouped by namespace — the same fields api/index.json publishes. Absent when the instance declares none.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "required": ["api_url", "canonical_url", "confidence", "evidence_tier", "id", "last_verified", "name", "summary", "tags", "type"],
                "type": "object"
              },
              "margin": {
                "description": "Relative gap between the best candidate and the runner-up. A small margin means the corpus cannot tell them apart.",
                "type": "number"
              },
              "match_confidence": {
                "description": "How well the answer fits the QUESTION — retrieval confidence, not editorial. Never confuse it with a claim's own confidence, which is how much the corpus stands behind the statement.",
                "type": "number"
              },
              "match_score": {
                "type": "number"
              },
              "match_threshold": {
                "description": "The coverage this corpus requires before it will answer at all.",
                "type": "number"
              },
              "matched_fields": {
                "items": {
                  "type": "string"
