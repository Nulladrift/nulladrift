          "name": "world-cup-2026-faq",
          "title": "World Cup 2026 - the questions everyone asks — Football Atlas",
          "description": "Verified answers to the most-asked questions about the 2026 World Cup: the champion, the score and scorer of the final, the top scorer, the third place, the host cities and the records set, all bound to FIFA primary pages.",
          "mimeType": "application/json",
