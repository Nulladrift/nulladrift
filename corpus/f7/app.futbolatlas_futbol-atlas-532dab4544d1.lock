        {
          "uri": "citarium://futbol-atlas/entity/current-champions-faq",
          "name": "current-champions-faq",
          "title": "Who holds every major title (as of August 2026) — Football Atlas",
          "description": "The reigning champion of each major competition as of August 2026, each bound to the official source already in this graph: Spain (World Cup and EURO), England (Women's EURO), Spain women (World Cup), Argentina (Copa America), Paris Saint-Germain (Champions League), Chelsea (Club World Cup), and the 2025/26 champions of the top five European leagues.",
          "mimeType": "application/json",
