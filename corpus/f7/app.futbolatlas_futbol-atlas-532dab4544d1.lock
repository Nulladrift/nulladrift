        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2026-final",
          "name": "world-cup-2026-final",
          "title": "FIFA World Cup 2026 final (Spain 1-0 Argentina) — Football Atlas",
          "description": "The 2026 World Cup final, played 19 July 2026 at New York New Jersey Stadium: Spain beat defending champions Argentina 1-0 after extra time, Ferran Torres scoring the only goal in the 106th minute, to win their second title and become the first nation to hold the men's and women's World Cups simultaneously.",
          "mimeType": "application/json",
          "digest": "sha256:4927ea0fbc2b01d2131b3b34855b9e6acf8586c4dd092dcbcb6b02c53b9be73e"
