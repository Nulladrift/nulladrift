          "uri": "citarium://futbol-atlas/entity/world-cup-2026-awards",
          "name": "world-cup-2026-awards",
          "title": "FIFA World Cup 2026 individual awards — Football Atlas",
          "description": "The official individual awards of the 2026 World Cup: Rodri won the Golden Ball, Kylian Mbappe the Golden Boot with ten goals, Unai Simon the Golden Glove with seven clean sheets, Pau Cubarsi the Young Player Award, and the Netherlands the Fair Play Trophy.",
          "mimeType": "application/json",
          "digest": "sha256:752b5d3e2391d3827a62f6284a2e9d79458b5bc938c132c3444d11f0a5cfc2e8"
