        },
        {
          "uri": "citarium://futbol-atlas/entity/direct-free-kick",
          "name": "direct-free-kick",
          "title": "Direct free kick — Football Atlas",
          "description": "A direct free kick is a free kick from which a goal can be scored by kicking the ball directly into the opponents' goal, awarded for the contact and handball offences listed in Law 12.",
          "mimeType": "application/json",
          "digest": "sha256:49c099de08fcc96b272d667fa17eaf65869b4151ebb49832817f83725685c180"
        },
        {
          "uri": "citarium://futbol-atlas/entity/direct-vs-indirect-free-kick",
          "name": "direct-vs-indirect-free-kick",
          "title": "Direct vs indirect free kick — Football Atlas",
          "description": "The two free kick types differ in three practical ways under the 2026/27 Laws: whether a goal can be scored without another touch, which offences produce them, and what they become inside the penalty area. This comparison separates all three, bound to Laws 12 and 13.",
          "mimeType": "application/json",
          "digest": "sha256:2c4c7d0d5c628e7bc622d6a368cff4965c7deddff56659f7e1af13654df48e98"
        },
        {
          "uri": "citarium://futbol-atlas/entity/dissent",
          "name": "dissent",
          "title": "Dissent — Football Atlas",
          "description": "Dissent is public protest or disagreement, verbal or physical, with a match official's decision; it is punishable with a caution.",
          "mimeType": "application/json",
          "digest": "sha256:2bc691deb3dc2261cd055414e87ae8bcd3507ba1f54b2ac74c7927e47eca8dc5"
        },
        {
          "uri": "citarium://futbol-atlas/entity/dogso",
          "name": "dogso",
          "title": "DOGSO (Denying an Obvious Goal-Scoring Opportunity) — Football Atlas",
          "description": "DOGSO is the Law 12 sending-off category for denying an opponent or the opposing team an obvious goal-scoring opportunity, with a caution instead of a red card when a penalty is awarded for a genuine attempt to play the ball.",
          "mimeType": "application/json",
          "digest": "sha256:ce4b099c80a6106160cf7d7acab13ee4b5f83286b47fe614b3b40773c5e42d24"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1960",
          "name": "euro-1960",
          "title": "UEFA EURO 1960 (champions - Soviet Union) — Football Atlas",
          "description": "The Soviet Union beat Yugoslavia 2-1 after extra time at the Parc des Princes on 10 July 1960, Viktor Ponedelnik heading the winner in the 113th minute, to become the first holders of the Henri Delaunay Cup. Only 17 nations entered, the four British associations among those who did not, and the USSR reached the finals on a walkover after Spain refused to play them.",
          "mimeType": "application/json",
          "digest": "sha256:7e95e7c9241cb6e0de02397fbf92c69220a312d0ffc1b4d83a411b7a7755b0f2"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1964",
          "name": "euro-1964",
          "title": "UEFA EURO 1964 (champions - Spain) — Football Atlas",
          "description": "Spain beat holders the Soviet Union 2-1 at the Santiago Bernabeu on 21 June 1964 for the first major trophy in their history, Pereda opening after six minutes - still the earliest goal in a EURO final - and Marcelino heading the late winner. UEFA's own pages disagree on both that winner's minute and on who refereed the match.",
          "mimeType": "application/json",
          "digest": "sha256:2e14053a162f9d79b7a66afd3bba6a605723d51ef0ae9659f8b320cfdd70c47e"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1968",
          "name": "euro-1968",
          "title": "UEFA EURO 1968 (champions - Italy) — Football Atlas",
          "description": "Italy won the first tournament to carry the name UEFA European Championship, and won it twice over by the standards of any later edition: they reached the final on the toss of a coin after a goalless semi-final, drew the final 1-1 with Yugoslavia, and won the replay 2-0 two days later. Both remain unique in the competition's history.",
          "mimeType": "application/json",
          "digest": "sha256:4eccaee861e925be54cf487cc049f668fc173a655db16d251e7e6ce62323653e"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1972",
          "name": "euro-1972",
          "title": "UEFA EURO 1972 (champions - West Germany) — Football Atlas",
          "description": "West Germany beat the Soviet Union 3-0 at the Heysel Stadium in Brussels for their first European title, Gerd Muller scoring twice and Herbert Wimmer once. It stood as the biggest winning margin in a EURO final for forty years, and Muller became the only player ever to top the scoring lists of both the qualifying and the final phase of one European Championship.",
          "mimeType": "application/json",
          "digest": "sha256:1f4c4710de3ddc89b3e67c783cf200b959971d341ccb9add8cc75729a5df4b92"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1976",
          "name": "euro-1976",
          "title": "UEFA EURO 1976 (champions - Czechoslovakia) — Football Atlas",
          "description": "Czechoslovakia beat West Germany 5-3 on penalties after a 2-2 draw at the Stadion Crvena zvezda in Belgrade on 20 June 1976 - the first major international tournament final ever decided by a shoot-out. They had led 2-0 before Bernd Holzenbein equalised in the dying seconds, and the first seven penalties were all scored before Antonin Panenka's chip.",
          "mimeType": "application/json",
          "digest": "sha256:da1ee79c5f41d76c9a7bdcebda783c77243e75cc571bd5f468b0a50ea52649e1"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1980",
          "name": "euro-1980",
          "title": "UEFA EURO 1980 (champions - West Germany) — Football Atlas",
          "description": "West Germany beat Belgium 2-1 at Rome's Stadio Olimpico on 22 June 1980 for their second European title, Horst Hrubesch scoring both - his first goals in international football - with the winner in the closing seconds. It was the first eight-team EURO and staged the last third-place play-off in the competition's history.",
          "mimeType": "application/json",
          "digest": "sha256:772c16fa95a3362c6e669bea522bb926a839db786daaec5f8e8bcdb3aa64a3cd"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1984",
          "name": "euro-1984",
          "title": "UEFA EURO 1984 (champions - France) — Football Atlas",
          "description": "France beat Spain 2-0 at the Parc des Princes on 27 June 1984 for their first official title in any team sport. Michel Platini's ninth goal of the finals - still the competition record, and more than any other nation scored in the whole tournament - went in when Luis Arconada let a modest free-kick creep out of his hands and over the line.",
          "mimeType": "application/json",
          "digest": "sha256:80d4971949052b38bc3a9ce58ca5e881a58fef9023cbce63c12375af0773b3b4"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1988",
          "name": "euro-1988",
          "title": "UEFA EURO 1988 (champions - Netherlands) — Football Atlas",
          "description": "The Netherlands beat the Soviet Union 2-0 at Munich's Olympiastadion on 25 June 1988 for their first major title. Marco van Basten headed the assist for Ruud Gullit's opener before scoring the volley from the right-hand goal line that the tournament is remembered for - a goal UEFA's own pages date two minutes apart.",
          "mimeType": "application/json",
          "digest": "sha256:cf6d9a00b08f02e254a1381fb1211f621391b448548ea39478d1722abac59eff"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1992",
          "name": "euro-1992",
          "title": "UEFA EURO 1992 (champions - Denmark) — Football Atlas",
          "description": "Denmark beat the newly reunified Germany 2-0 at the Ullevi Stadium in Gothenburg on 26 June 1992, through John Jensen and Kim Vilfort. They were at the finals only because Yugoslavia had been suspended from international football that May and the place passed to the qualifying group's runners-up - one of three ways politics redrew this tournament.",
          "mimeType": "application/json",
          "digest": "sha256:ca736313ffdbc51a96e4dbf467c4c7bd8292f13faaa65d124caca700eb0a36f4"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-1996",
          "name": "euro-1996",
          "title": "UEFA EURO 1996 (champions - Germany) — Football Atlas",
          "description": "EURO '96 in England ended at Wembley with Germany beating the Czech Republic 2-1 in extra time. Substitute Oliver Bierhoff headed an equaliser after Patrik Berger's penalty, then scored senior international football's first golden goal - a goal the referee first checked for offside, and whose minute UEFA's own pages still give differently.",
          "mimeType": "application/json",
          "digest": "sha256:2325299057ea1d080b895f4e1830833ae0402cbd5f90eaa447225c82e5f6505f"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-2000",
          "name": "euro-2000",
          "title": "UEFA EURO 2000 (champions - France) — Football Atlas",
          "description": "EURO 2000, co-hosted by Belgium and the Netherlands, ended at Rotterdam's Feijenoord Stadium on 2 July 2000 with France beating Italy 2-1 on a golden goal. Italy led through Marco Delvecchio until Sylvain Wiltord equalised in added time, and David Trezeguet won it 13 minutes into extra time - France the first team to win the European Championship as reigning world champions.",
          "mimeType": "application/json",
          "digest": "sha256:196127202c7c3ee281aa09bf05f049776710a5fd08d29acde0723bfc823653ad"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-2004",
          "name": "euro-2004",
          "title": "UEFA EURO 2004 (champions - Greece) — Football Atlas",
          "description": "EURO 2004 ended in Lisbon on 4 July 2004 with Greece beating hosts Portugal 1-0, Angelos Charisteas heading in Angelos Basinas's corner early in the second half. Greece had started as 80-1 outsiders and Portugal became the first host nation to lose a European Championship final.",
          "mimeType": "application/json",
          "digest": "sha256:5be1bd9f9789bfc7dcc3bef2c488338d804657f623f5453916e1d821c42bfedb"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-2008",
          "name": "euro-2008",
          "title": "UEFA EURO 2008 (champions - Spain) — Football Atlas",
          "description": "EURO 2008 ended with Spain beating Germany 1-0 in the Vienna final - Fernando Torres outmuscling Lahm and clipping over Lehmann in the 33rd minute from Xavi's pass - ending a 44-year wait for a major title and opening the Spain era that ran through the 2010 World Cup and EURO 2012.",
          "mimeType": "application/json",
          "digest": "sha256:349f651ee3ae95e7ad019ec8ef5dbeae3c488ec2733c58d6f7ee9bc1a1bee3e7"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-2012",
          "name": "euro-2012",
          "title": "UEFA EURO 2012 (champions - Spain) — Football Atlas",
          "description": "EURO 2012 ended with Spain beating Italy 4-0 in Kyiv on 1 July 2012 - the most emphatic win in a EURO final - through Silva, Alba, Torres and Mata, against an Italy reduced to ten after Motta's injury. It completed Spain's unprecedented EURO-World Cup-EURO treble.",
          "mimeType": "application/json",
          "digest": "sha256:2475d2739469d0685be96cc98a177f2f32abf002788affd5bfb025aa38f7fb17"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-2016",
          "name": "euro-2016",
          "title": "UEFA EURO 2016 (champions - Portugal) — Football Atlas",
          "description": "EURO 2016 ended with Portugal beating hosts France 1-0 after extra time at the Stade de France on 10 July 2016 - substitute Eder striking from 20 metres in the 109th minute - for Portugal's first major trophy, in a final Cristiano Ronaldo left injured after 25 minutes to coach from the touchline.",
          "mimeType": "application/json",
          "digest": "sha256:730494bf09e0d8714f8aaae2295917d57f70001140ccead47e50e32bc5cb965d"
        },
        {
          "uri": "citarium://futbol-atlas/entity/euro-2020",
