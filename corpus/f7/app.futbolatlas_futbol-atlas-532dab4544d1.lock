        {
          "uri": "citarium://futbol-atlas/entity/world-cup-all-time-top-scorers",
          "name": "world-cup-all-time-top-scorers",
          "title": "World Cup all-time top scorers (through 2026) — Football Atlas",
          "description": "The all-time World Cup scoring chart after the 2026 tournament, from FIFA's own final-day list: Kylian Mbappe leads with 22 goals in 22 matches, ahead of Lionel Messi (21), Miroslav Klose (16), Ronaldo (15), Harry Kane and Gerd Muller (14), Just Fontaine (13) and Pele (12) - Klose's long-standing record having fallen twice in one tournament.",
          "mimeType": "application/json",
          "digest": "sha256:53d9f80a7f4e80c56793b06ec5266b713f18b96d911ebeadecf1194eda0a6380"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-most-titles-by-player",
          "name": "world-cup-most-titles-by-player",
          "title": "Most World Cup titles by a player (Pele, three) — Football Atlas",
          "description": "Pele remains the only player to win the World Cup three times - 1958, 1962 and 1970 with Brazil - a record FIFA notes could not even be equalled at the 2026 tournament, since no active player held two winner's medals going into it.",
          "mimeType": "application/json",
          "digest": "sha256:1b6262f597a8b3d240ffbabf75b69d3521bf189fe8ac8ded6395325333c8459e"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-titles-by-country",
          "name": "world-cup-titles-by-country",
          "title": "World Cup titles by country (through 2026) — Football Atlas",
          "description": "The all-time FIFA World Cup honours table after the 2026 edition: Brazil 5 titles, Germany and Italy 4, Argentina 3, France, Spain and Uruguay 2, England 1 - with title years and the structural caveats (no final in 1950) taken from FIFA's own updated honours article.",
