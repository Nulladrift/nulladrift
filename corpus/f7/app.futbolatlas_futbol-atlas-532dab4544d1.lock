        },
        {
          "uri": "citarium://futbol-atlas/entity/substitution-rules-faq",
          "name": "substitution-rules-faq",
          "title": "Substitution rules FAQ — Football Atlas",
          "description": "The substitution questions actually asked, answered from the 2026/27 texts of Laws 3 and 10: how many changes are allowed, the three-window limit, extra time, return substitutes, and who may take part in a penalty shoot-out.",
          "mimeType": "application/json",
          "digest": "sha256:5c0e776f1a99508ee6d200b9d7ef8811a1c578717cf567c1de3360844a7fb431"
        },
        {
          "uri": "citarium://futbol-atlas/entity/the-best-fifa-awards-2025",
          "name": "the-best-fifa-awards-2025",
          "title": "The Best FIFA Football Awards 2025 — Football Atlas",
          "description": "FIFA's The Best awards for 2025, presented in Doha on 16 December 2025 on the eve of the Intercontinental Cup final: Ousmane Dembele and Aitana Bonmati (her third straight) took the player awards, Luis Enrique and Sarina Wiegman the coaching honours, Donnarumma and Hampton the goalkeeper prizes, and Santiago Montiel the Puskas Award.",
          "mimeType": "application/json",
          "digest": "sha256:ce310ddbe0440703c094178a97f9719b233d0085c0c7372dbb0ef8aed6c3c277"
        },
        {
          "uri": "citarium://futbol-atlas/entity/uefa-historical-sources-faq",
          "name": "uefa-historical-sources-faq",
          "title": "Where UEFA's own pages disagree about historic EURO finals — Football Atlas",
          "description": "UEFA is the primary record for European Championship history, and its pages sometimes disagree with each other and occasionally with themselves - about goal minutes, about the format's own history, about who captained a side, and in one case with the scorer's own account of his goal. Seven cases across six finals, re-checked on 9 August 2026, with one control case where the pages agree.",
          "mimeType": "application/json",
          "digest": "sha256:d3db045b0d378da9c09ac8fec8f16ae63f6c916a1105af802911e7ed77cf298f"
        },
        {
          "uri": "citarium://futbol-atlas/entity/var",
          "name": "var",
          "title": "VAR (Video Assistant Referee) — Football Atlas",
          "description": "The VAR is a match official who may assist the referee only in the event of a clear and obvious error or serious missed incident, in a closed list of match-changing categories; the referee always takes the final decision.",
          "mimeType": "application/json",
          "digest": "sha256:38e9adab7b73e742e7ebe1bc4ff6c99d2dbb4340b59ff25a7ac59bada27eb721"
        },
        {
          "uri": "citarium://futbol-atlas/entity/var-misconceptions",
          "name": "var-misconceptions",
          "title": "Common VAR misconceptions — Football Atlas",
          "description": "Answers to what fans get wrong about VAR, checked against the 2026/27 IFAB protocol: VAR cannot review everything, cannot decide, cannot be demanded by teams, does not re-referee soft calls, and never handles second yellow cards.",
          "mimeType": "application/json",
          "digest": "sha256:a4fa6b01cc64a7af6637ea06cd3300ceab42f151767dbf0d85dd6567a5a33fba"
        },
        {
          "uri": "citarium://futbol-atlas/entity/var-vs-goal-line-technology",
          "name": "var-vs-goal-line-technology",
          "title": "VAR vs goal-line technology — Football Atlas",
          "description": "VAR and goal-line technology are often conflated. GLT is an automatic system with a single factual scope (did the whole ball cross the goal line) signalled to the match officials within one second; VAR is a human match official who reviews a closed list of match-changing decisions for clear and obvious errors, with the referee taking the final decision.",
          "mimeType": "application/json",
          "digest": "sha256:be77c7259afa3ebc897e490fb9b8fe02b332679ac2e8cc1bbba925192d86a32d"
        },
        {
          "uri": "citarium://futbol-atlas/entity/violent-conduct",
          "name": "violent-conduct",
          "title": "Violent conduct — Football Atlas",
          "description": "Violent conduct is using or attempting to use excessive force or brutality when not challenging for the ball — against anyone, with or without contact — including deliberate non-negligible strikes to the head or face; it is always a sending-off offence.",
          "mimeType": "application/json",
          "digest": "sha256:c19df9fdf085e4be3a59dd10f553aed62a4707cf33680baebcf60df23a110524"
        },
        {
          "uri": "citarium://futbol-atlas/entity/what-changed-in-2026-27",
          "name": "what-changed-in-2026-27",
          "title": "What changed in the 2026/27 Laws of the Game — Football Atlas",
          "description": "The 2026/27 edition changes that alter match outcomes, from the official IFAB law-changes list: the ten-second substitution exit, five-second restart countdowns, the DOGSO-advantage sanction removal, penalty double-touch handling, VAR review of clearly incorrect second cautions, and the competition options added this cycle.",
          "mimeType": "application/json",
          "digest": "sha256:4a606f2afbc7ba3f3f28975001d328233900e840d01fce7ca8dba173802dbfa7"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-1984",
          "name": "womens-euro-1984",
          "title": "UEFA Women's EURO 1984 (champions - Sweden) — Football Atlas",
          "description": "The first Women's EURO was settled over two legs: Sweden won 1-0 at the Ullevi through Pia Sundhage, England levelled the tie through Linda Curl at Kenilworth Road, and Sweden took the shoot-out 4-3. Sundhage scored the tie's first goal and converted its last kick. It remains Sweden's only title.",
          "mimeType": "application/json",
          "digest": "sha256:53ea447bf655e364a4bc74abb474bed9bd30746d8c1e03696144002216a96da7"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-1995",
          "name": "womens-euro-1995",
          "title": "UEFA Women's EURO 1995 (champions - Germany) — Football Atlas",
          "description": "Germany beat Sweden 3-2 in Kaiserslautern for a third title, the winning goal scored by a 17-year-old substitute who had been on the pitch for barely three minutes. It was the edition at which women's internationals went from 80 minutes to 90, and the one that ended Norway's run of reaching every final.",
          "mimeType": "application/json",
          "digest": "sha256:8de4411483f01d591cfda83d8825268cf2c8b3f3d63b237a2790bdd9c9a7065a"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-1997",
          "name": "womens-euro-1997",
          "title": "UEFA Women's EURO 1997 (champions - Germany) — Football Atlas",
          "description": "Germany beat Italy 2-0 at the Ullevaal Stadion in Oslo to retain the title - having first had to survive a play-off to reach the finals at all. They finished behind Norway in qualifying, losing 3-1 at home, and only got there by beating Iceland 7-0 on aggregate. It was the first edition with an eight-team final tournament.",
          "mimeType": "application/json",
          "digest": "sha256:007028de7aa21fa9cb6f49be6e68c6c1fe612d125731b1a79fdfc763ff86b6d9"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2001",
          "name": "womens-euro-2001",
          "title": "UEFA Women's EURO 2001 (champions - Germany) — Football Atlas",
          "description": "Germany beat Sweden 1-0 at the Donaustadion in Ulm on a golden goal, substitute Claudia Muller scoring on 97 minutes before 18,000 people after Sweden had unexpectedly taken the hosts to extra time. The rule that ended the match there no longer exists in the Laws.",
          "mimeType": "application/json",
          "digest": "sha256:eb8dc56ea89525a198788e5660d6d18aa1dae1b93a5c67c85b25cdfaa0a2e4b4"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2005",
          "name": "womens-euro-2005",
          "title": "UEFA Women's EURO 2005 (champions - Germany) — Football Atlas",
          "description": "Germany beat Norway 3-1 at Ewood Park for a fourth successive title, then a record. The edition's defining number is not the final's crowd of just over 21,100 but the 29,092 who watched England play Finland in the opening match - at the time a record for a women's match anywhere in Europe.",
          "mimeType": "application/json",
          "digest": "sha256:8190f4af343c41e04167c32a40aa9953416dfd46267b81bc8fcd35c696baa3cd"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2009",
          "name": "womens-euro-2009",
          "title": "UEFA Women's EURO 2009 (champions - Germany) — Football Atlas",
          "description": "Germany beat England 6-2 in Helsinki for a fifth consecutive title, in the highest-scoring final the competition has had. The scoreline hides the match: England were within a goal after 55 minutes, and three German goals in 14 minutes turned 3-2 into 6-2.",
          "mimeType": "application/json",
          "digest": "sha256:664dd32595d4d043fcd4c047352d0320b2cf84a463d5be9ffd50118eeb0ac1c9"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2013",
          "name": "womens-euro-2013",
          "title": "UEFA Women's EURO 2013 (champions - Germany) — Football Atlas",
          "description": "Germany took a sixth consecutive title in Sweden, beating Norway 1-0 in Solna before a tournament-record crowd of 41,301. They did it having won only one of their three group games - and having lost 1-0 to the same Norway in the group stage. Nadine Angerer saved a penalty in each half of the final.",
          "mimeType": "application/json",
          "digest": "sha256:4fb755c0ede4732abdb90d08889b859e84ac4dfdfa7e2b7041d3489dceef1a46"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2017",
          "name": "womens-euro-2017",
          "title": "UEFA Women's EURO 2017 (champions - Netherlands) — Football Atlas",
          "description": "The Netherlands won their first Women's EURO on home soil, beating Denmark 4-2 in Enschede having won all six matches. It ended Germany's 22-year reign, made the Dutch only the fourth different champion, and came seven months after they had changed coach following five defeats in eight games.",
          "mimeType": "application/json",
          "digest": "sha256:931e8b7587f5f04161f9ac5eeba6b19389aae57b4657d489605136d3931faff2"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2022",
          "name": "womens-euro-2022",
          "title": "UEFA Women's EURO 2022 (champions - England) — Football Atlas",
          "description": "England beat Germany 2-1 after extra time at Wembley for their first major international title, in front of a record crowd of 87,192. Both England goals came from substitutes: Ella Toone, on six minutes earlier, opened the scoring, and Chloe Kelly won it in extra time after Lina Magull had equalised.",
          "mimeType": "application/json",
          "digest": "sha256:689cf0877e3258270795630ec01e0355926f1e9930278bff3b5c5e691d8b125a"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-2025",
          "name": "womens-euro-2025",
          "title": "UEFA Women's EURO 2025 (champions - England) — Football Atlas",
          "description": "The Women's EURO 2025 final at St. Jakob-Park in Basel on 27 July 2025 ended England 1-1 Spain after extra time, England winning 3-1 on penalties - Caldentey scoring for Spain, Russo equalising, Chloe Kelly converting the decisive kick - making England only the second team to retain the Women's EURO.",
          "mimeType": "application/json",
          "digest": "sha256:0ea6079d5708469b7c8aab5979183b57a8d4c2b7edcf12aa1cc84658ef9ecedd"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-euro-titles-by-country",
          "name": "womens-euro-titles-by-country",
          "title": "Women's EURO titles by country (through 2025) — Football Atlas",
          "description": "Five nations have won the 14 Women's EUROs played since 1984. Germany lead on eight, a record built on six consecutive titles and a 22-year reign as champions; England have two, Norway two, and Sweden and the Netherlands one each. UEFA counts the 1989 title, won by West Germany, within Germany's eight.",
          "mimeType": "application/json",
          "digest": "sha256:c791304dea51de0a53aa8a6686e1d3fa9d5e2bb9274622b06f0c25c3aa4d3a9b"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-1991",
          "name": "womens-world-cup-1991",
          "title": "FIFA Women's World Cup 1991 (champions - USA) — Football Atlas",
          "description": "The inaugural Women's World Cup, in China PR, had 12 teams and 26 matches and ended at the Tianhe Stadium in Guangzhou on 30 November 1991 with USA beating Norway, Michelle Akers scoring twice. FIFA's own pages disagree on whether the final finished 2-1 or 2-0.",
          "mimeType": "application/json",
          "digest": "sha256:5b56cd6c9c2e6f37468511c7dda2946cb17c997cb19a73cbdd37af8350ce8048"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-1995",
          "name": "womens-world-cup-1995",
          "title": "FIFA Women's World Cup 1995 (champions - Norway) — Football Atlas",
          "description": "Norway won the second Women's World Cup, beating Germany 2-0 at the Rasunda Stadium in Solna on 18 June 1995 through Hege Riise and Marianne Pettersen, after knocking out holders USA in the semi-finals. The 12-team tournament doubled as qualification for the first women's Olympic football tournament.",
          "mimeType": "application/json",
          "digest": "sha256:1428d33a7f7a52f4aed05d28f96a65ae3e93090aa25126b76ee2fbfc8eb8ed07"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-1999",
          "name": "womens-world-cup-1999",
          "title": "FIFA Women's World Cup 1999 (champions - USA) — Football Atlas",
          "description": "The 1999 final at the Rose Bowl in Pasadena on 10 July 1999 ended USA 0-0 China PR after 120 minutes, the hosts winning the shoot-out 5-4 with Brandi Chastain converting the decisive kick in front of 90,185 spectators - the moment FIFA calls one of the most memorable in the tournament's history.",
          "mimeType": "application/json",
          "digest": "sha256:b0a016572f4bc13942ff1569d7bf187cb0ab5d38ea89256e25284806f2b41c50"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2003",
          "name": "womens-world-cup-2003",
          "title": "FIFA Women's World Cup 2003 (champions - Germany) — Football Atlas",
          "description": "China PR gave up the hosting of the 2003 tournament and it moved to the USA, where the hosts fell to Germany in the semi-finals. Germany beat Sweden 2-1 in the all-European final at the StubHub Center in Carson on 12 October 2003, Nia Kuenzer scoring in extra time for a first German world title.",
          "mimeType": "application/json",
          "digest": "sha256:d8eaf74a2ebed104c2997d7165bdd5350957799697d24bcbd52c7986364608c0"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2007",
          "name": "womens-world-cup-2007",
          "title": "FIFA Women's World Cup 2007 (champions - Germany) — Football Atlas",
          "description": "Germany retained the trophy at China PR 2007, beating Brazil 2-0 at the Shanghai Hongkou Football Stadium on 30 September 2007 through Birgit Prinz and Simone Laudehr. They were the first team ever to defend the Women's World Cup, and Brazil the first South American side to reach the final.",
          "mimeType": "application/json",
          "digest": "sha256:f84ae475c0cab374ff9be11d4a384786f6503e5476c2fa35e3e4a89cc96d71b0"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2011",
          "name": "womens-world-cup-2011",
          "title": "FIFA Women's World Cup 2011 (champions - Japan) — Football Atlas",
          "description": "Japan won their first world title in the host nation's own tournament: 2-2 with USA after 120 minutes at the Commerzbank Arena in Frankfurt on 17 July 2011, then victory on penalties. Homare Sawa's side ended Germany's run of successive titles and USA's pursuit of a third star.",
          "mimeType": "application/json",
          "digest": "sha256:4bd4c17fe9430b6444bb392e4667733776aaa885593f686f29ea8fe210c4a77f"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2015",
          "name": "womens-world-cup-2015",
          "title": "FIFA Women's World Cup 2015 (champions - USA) — Football Atlas",
          "description": "USA took a third title at Canada 2015, beating Japan 5-2 at BC Place Stadium in Vancouver on 5 July 2015 in a rematch of the 2011 final - the highest-scoring Women's World Cup final, 4-0 to the USA inside 16 minutes, with a Carli Lloyd hat-trick.",
          "mimeType": "application/json",
          "digest": "sha256:8b161db2ac20587fc5c9bb2fdd2671bd57c30d16c467f96a356ece6ee372d0df"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2019",
          "name": "womens-world-cup-2019",
          "title": "FIFA Women's World Cup 2019 (champions - USA) — Football Atlas",
          "description": "USA retained the trophy at France 2019, beating the Netherlands 2-0 at the Stade de Lyon on 7 July 2019 through Rose Lavelle and Megan Rapinoe. It was the second successful defence in the tournament's history, the Netherlands' first final, and the fourth USA title.",
          "mimeType": "application/json",
          "digest": "sha256:951051abc3e21add9b60ede7dddae9059ebb1b0bccaa0aebb990bb858176e989"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2023",
          "name": "womens-world-cup-2023",
          "title": "FIFA Women's World Cup 2023 (champions - Spain) — Football Atlas",
          "description": "The 2023 FIFA Women's World Cup, co-hosted by Australia and New Zealand, ended with Spain beating England 1-0 in the final at Stadium Australia on 20 August 2023 before 75,784 fans. Captain Olga Carmona scored the winner before the half-hour; Mary Earps saved a Jenni Hermoso penalty. It was Spain's first women's world title.",
          "mimeType": "application/json",
          "digest": "sha256:c2b79ebac3b51e541377b458dab4f06016c7d261b7b02a50b8a4b36a4e6a2834"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-2027",
          "name": "womens-world-cup-2027",
          "title": "FIFA Women's World Cup 2027 (Brazil, upcoming) — Football Atlas",
          "description": "The tenth Women's World Cup runs from 24 June to 25 July 2027 in Brazil - the first in South America - with 32 teams and 64 matches across eight host cities, from the Maracana in Rio to Arena Itaquera in Sao Paulo. Spain arrive as 2023 champions and England as European champions.",
          "mimeType": "application/json",
          "digest": "sha256:8cc5185e2925051418004c2091f7dde1923bf172c2aa515f9e9e5336a7b81677"
        },
        {
          "uri": "citarium://futbol-atlas/entity/womens-world-cup-titles-by-country",
          "name": "womens-world-cup-titles-by-country",
          "title": "Women's World Cup titles by country (through 2023) — Football Atlas",
          "description": "Five nations have won the nine editions of the FIFA Women's World Cup played to date: USA four (1991, 1999, 2015, 2019), Germany two (2003, 2007), Norway (1995), Japan (2011) and Spain (2023) one each. Only Germany and the USA have ever retained the trophy, and Spain go to Brazil 2027 as holders.",
          "mimeType": "application/json",
          "digest": "sha256:750b21820eb4947eabeceb8a4b4f7fb2ee1554aaa2dbc612448afd75b704b7b9"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1930",
          "name": "world-cup-1930",
          "title": "FIFA World Cup 1930 (champions - Uruguay) — Football Atlas",
          "description": "The first World Cup, played entirely in Montevideo, ended with hosts Uruguay coming from 2-1 down at half-time to beat Argentina 4-2 at the Estadio Centenario - a final played with a different ball in each half by order of referee Jean Langenus because the teams could not agree, in the year of Uruguay's independence centenary.",
          "mimeType": "application/json",
          "digest": "sha256:04e3e70e93850ffd5ec6d7560c7651a8920fe40354709f713f705bbe32b66e79"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1934",
          "name": "world-cup-1934",
          "title": "FIFA World Cup 1934 (champions - Italy) — Football Atlas",
          "description": "The 1934 World Cup ended with hosts Italy beating Czechoslovakia in extra time in the Rome final, Angelo Schiavio scoring the winner five minutes into the added period after a 1-1 draw - the first of Vittorio Pozzo's two consecutive titles.",
          "mimeType": "application/json",
          "digest": "sha256:86c81f5ef9a1581288ed18e71ade46a8240fd31a79d846b6618b20510a97e4f7"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1938",
          "name": "world-cup-1938",
          "title": "FIFA World Cup 1938 (champions - Italy) — Football Atlas",
          "description": "The 1938 World Cup in France ended with Italy beating Hungary 4-2 in the Paris final - doubles from Gino Colaussi and Silvio Piola - making Italy the first nation to win consecutive World Cups and Vittorio Pozzo the only coach ever to win two.",
          "mimeType": "application/json",
          "digest": "sha256:afafb4261539d988c40bda82c8ed13ef0f5dac2d5eaf793801c714199889bc35"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1950",
          "name": "world-cup-1950",
          "title": "FIFA World Cup 1950 (champions - Uruguay) — Football Atlas",
          "description": "The 1950 World Cup in Brazil had no final: Uruguay won the concluding four-team group by beating hosts Brazil 2-1 at the Maracana - the Maracanazo - coming from behind through Schiaffino and Ghiggia before a record crowd of 173,850. It was Uruguay's second title.",
          "mimeType": "application/json",
          "digest": "sha256:8acdd96a01070ddae3c09c41ae1cf4338f646f9b5e920a2a0c1f95226a01655c"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1954",
          "name": "world-cup-1954",
          "title": "FIFA World Cup 1954 (champions - West Germany) — Football Atlas",
          "description": "The 1954 World Cup in Switzerland ended with the Miracle of Bern: West Germany came from 2-0 down inside eight minutes to beat Hungary 3-2 at the Wankdorf Stadium, Helmut Rahn scoring twice including the late winner, against a Hungary side that had beaten them 8-3 in the group stage and were the biggest final favourites in World Cup history.",
          "mimeType": "application/json",
          "digest": "sha256:678442f8eb405107c397abf0554c9edaf9befcb27c7b3e48b0ee2d5d58f1a88b"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1958",
          "name": "world-cup-1958",
          "title": "FIFA World Cup 1958 (champions - Brazil) — Football Atlas",
          "description": "The 1958 World Cup ended with Brazil beating hosts Sweden 5-2 in Stockholm - still the highest-scoring World Cup final - for their first title. Pele, at 17 years and 249 days, remains the youngest player to appear in and score in a World Cup final, after a semi-final hat-trick against France.",
          "mimeType": "application/json",
          "digest": "sha256:337fb912ff63ef9830d5d32dddf93a9b38ba510b694f5d337867bd8b552f5052"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1962",
          "name": "world-cup-1962",
          "title": "FIFA World Cup 1962 (champions - Brazil) — Football Atlas",
          "description": "The 1962 World Cup in Chile ended with Brazil retaining the title, beating Czechoslovakia 3-1 in the final - with Garrincha, sent off in the semi-final against the hosts, allowed to play after a petition backed even by Chile's president. Brazil became the second nation to win consecutive World Cups.",
          "mimeType": "application/json",
          "digest": "sha256:0c909d2e1007408c8d3dd2bcdc5fbb349b04d80be17f25b21da63b8b176390c0"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1966",
          "name": "world-cup-1966",
          "title": "FIFA World Cup 1966 (champions - England) — Football Atlas",
          "description": "The 1966 World Cup ended with hosts England beating West Germany 4-2 after extra time at Wembley before 96,924 fans - Geoff Hurst scoring the only hat-trick in a men's World Cup final (18', 101', 120'), including the crossbar goal awarded after the referee consulted linesman Tofiq Bahramov. It remains England's only title.",
          "mimeType": "application/json",
          "digest": "sha256:ba8e1b0b33c232d036bd9bbde32deb9a348a3579826c555464570d4a97cc2598"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1970",
          "name": "world-cup-1970",
          "title": "FIFA World Cup 1970 (champions - Brazil) — Football Atlas",
          "description": "The 1970 World Cup in Mexico ended with Brazil beating Italy 4-1 at the Estadio Azteca on 21 June 1970 before 107,412 fans - Pele, Gerson, Jairzinho and Carlos Alberto scoring in what FIFA calls the greatest final performance. Brazil's third title meant they kept the Jules Rimet Trophy permanently.",
          "mimeType": "application/json",
          "digest": "sha256:f4bfd57ee07746b24b54799b5ff8783592f9c72bc10760b3423663d61fe1e09b"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1974",
          "name": "world-cup-1974",
          "title": "FIFA World Cup 1974 (champions - West Germany) — Football Atlas",
          "description": "The 1974 World Cup ended with hosts West Germany beating the Netherlands 2-1 at Munich's Olympiastadion on 7 July 1974, coming from behind after Johan Neeskens's 88-second penalty - still the fastest goal in a World Cup final, scored before West Germany had touched the ball - through a Paul Breitner penalty and Gerd Muller's winner.",
          "mimeType": "application/json",
          "digest": "sha256:9a662070d0fbd52d2a746e5cb4a93a19ad9502ffe1ce1546892bd29d9d495860"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1978",
          "name": "world-cup-1978",
          "title": "FIFA World Cup 1978 (champions - Argentina) — Football Atlas",
          "description": "The 1978 World Cup ended with hosts Argentina beating the Netherlands 3-1 after extra time at El Monumental in Buenos Aires on 25 June 1978 - two goals from Mario Kempes, who won both the Golden Ball and the Golden Boot with six goals, and a Bertoni clincher, after Rensenbrink had hit the post for the Dutch seconds from full time.",
          "mimeType": "application/json",
          "digest": "sha256:c46f86a82b47baadf60c86d2390c41627f767297e4e3af222e44ce985dfcf37b"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1982",
          "name": "world-cup-1982",
          "title": "FIFA World Cup 1982 (champions - Italy) — Football Atlas",
          "description": "The 1982 World Cup in Spain ended with Italy beating West Germany 3-1 at the Santiago Bernabeu on 11 July 1982 - Rossi, Tardelli (with the legendary celebration) and Altobelli scoring. Paolo Rossi won both the Golden Boot (six goals) and Golden Ball after not scoring in Italy's first four games, including a hat-trick that eliminated favourites Brazil.",
          "mimeType": "application/json",
          "digest": "sha256:7b191da399617f876cefdbe29b9b4a88bee7a89acd905c3c2c4b4b4abe508646"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1986",
          "name": "world-cup-1986",
          "title": "FIFA World Cup 1986 (champions - Argentina) — Football Atlas",
          "description": "The 1986 World Cup in Mexico ended with Argentina beating West Germany 3-2 in the Azteca final on 29 June 1986 before 114,000 fans - Brown, Valdano and Burruchaga scoring after a Maradona through-ball settled it. It was Maradona's tournament: Golden Ball, five goals and five assists, including the Hand of God and the Goal of the Century against England.",
          "mimeType": "application/json",
          "digest": "sha256:fa3b14530040c2d08bf4201b2b3cf89ca4c964cd8e2846c5e92165e427b055d5"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1990",
          "name": "world-cup-1990",
          "title": "FIFA World Cup 1990 (champions - West Germany) — Football Atlas",
          "description": "The 1990 World Cup in Italy ended with West Germany beating holders Argentina 1-0 in Rome's Stadio Olimpico, Andreas Brehme converting an 85th-minute penalty past Sergio Goycochea after Rudi Voller was fouled. Argentina had two players sent off; it was West Germany's third title.",
          "mimeType": "application/json",
          "digest": "sha256:96ebd6d916f39983430ab7f533680378b9a411ca427dbdff25b179184649ba44"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1994",
          "name": "world-cup-1994",
          "title": "FIFA World Cup 1994 (champions - Brazil) — Football Atlas",
          "description": "The 1994 World Cup in the USA ended with Brazil beating Italy in the first final decided on penalties, after a 0-0 draw at the Rose Bowl in Pasadena - Roberto Baggio skying the decisive kick. It was Brazil's fourth title, ending a 24-year wait since 1970.",
          "mimeType": "application/json",
          "digest": "sha256:54c73a66157b84c8037b1e180305ed8e91ec564193ab28849a3c8e55fb800107"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-1998",
          "name": "world-cup-1998",
          "title": "FIFA World Cup 1998 (champions - France) — Football Atlas",
          "description": "The 1998 World Cup ended with hosts France beating holders Brazil 3-0 at the Stade de France on 12 July 1998 - two first-half Zidane headers from corners and an injury-time third by Emmanuel Petit - for their first title, making France the sixth host nation to win at home.",
          "mimeType": "application/json",
          "digest": "sha256:c7a0f7804604b034af852962c6ac88af5921962395e76757575b0bff8ff55bee"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2002",
          "name": "world-cup-2002",
          "title": "FIFA World Cup 2002 (champions - Brazil) — Football Atlas",
          "description": "The 2002 World Cup, co-hosted by Korea Republic and Japan, ended with Brazil beating Germany 2-0 in the Yokohama final on 30 June 2002 - Ronaldo scoring both goals (67th and 79th minutes) to complete his redemption from 1998 and win the Golden Boot. Brazil won all seven games to claim a record fifth title.",
          "mimeType": "application/json",
          "digest": "sha256:9923465c9131c75a0b1117a7041d740fb2b61010de098808949f40fbcdb772f7"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2006",
          "name": "world-cup-2006",
          "title": "FIFA World Cup 2006 (champions - Italy) — Football Atlas",
          "description": "The 2006 World Cup in Germany ended with Italy beating France 5-3 on penalties after a 1-1 draw at Berlin's Olympiastadion on 9 July 2006 - a final remembered for Zidane's early penalty, Materazzi's equaliser, and Zidane's 110th-minute red card for headbutting Materazzi. It was Italy's fourth title and their first shoot-out win at a World Cup.",
          "mimeType": "application/json",
          "digest": "sha256:41e483cabf1a4ca4dcc583dc317e99d39a2e794be0034baadd59faa523ebf6d3"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2010",
          "name": "world-cup-2010",
          "title": "FIFA World Cup 2010 (champions - Spain) — Football Atlas",
          "description": "The 2010 World Cup in South Africa ended with Spain beating the Netherlands 1-0 after extra time at Soccer City, Johannesburg, on 11 July 2010 - Andres Iniesta scoring with four minutes of extra time to spare and revealing his tribute to Dani Jarque. It was Spain's first world title, won with three consecutive 1-0 knockout wins beforehand.",
          "mimeType": "application/json",
          "digest": "sha256:6f0d6aa5474dfb9d91bfa49e9f36d44a3daa34ab679b93d27a0e3b78543de68a"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2014",
          "name": "world-cup-2014",
          "title": "FIFA World Cup 2014 (champions - Germany) — Football Atlas",
          "description": "The 2014 World Cup in Brazil ended with Germany beating Argentina 1-0 after extra time in the Maracana final on 13 July 2014, Mario Gotze volleying the winner from Andre Schurrle's cross - at 22 years and 40 days the youngest scorer in a World Cup final since Wolfgang Weber in 1966.",
          "mimeType": "application/json",
          "digest": "sha256:5da672341c5970d3c29d07a45ef93c4b164f4435e6e02a9bfa17f04b4c2bc2d3"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2018",
          "name": "world-cup-2018",
          "title": "FIFA World Cup 2018 (champions - France) — Football Atlas",
          "description": "The 2018 World Cup in Russia ended with France beating Croatia 4-2 in the final at the Luzhniki Stadium in Moscow on 15 July 2018 - a final featuring the first own goal in a World Cup decider and a VAR-reviewed penalty - for a second title, twenty years after 1998, with Didier Deschamps now as coach.",
          "mimeType": "application/json",
          "digest": "sha256:a2f8e24977ab014e12975fa3bbaf1c5739b4fc050f98efbfb52786dfdbee847a"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2022",
          "name": "world-cup-2022",
          "title": "FIFA World Cup 2022 (champions - Argentina) — Football Atlas",
          "description": "The 2022 World Cup in Qatar ended with Argentina beating France on penalties (4-2) after a 3-3 draw in the Lusail final on 18 December 2022 - Messi scoring twice and winning a second Golden Ball, Mbappe scoring a final hat-trick and taking the Golden Boot with eight goals. It was the last 32-team World Cup.",
          "mimeType": "application/json",
          "digest": "sha256:16a28192af35a760bf975a206b3de6102e46e48f33253619ea2dbf760b2c7a6c"
        },
        {
          "uri": "citarium://futbol-atlas/entity/world-cup-2026",
          "name": "world-cup-2026",
          "title": "FIFA World Cup 2026 — Football Atlas",
          "description": "The 23rd FIFA World Cup, co-hosted by Canada, Mexico and the United States from 11 June to 19 July 2026: the first 48-team, 104-match edition, played in 16 host cities and won by Spain, who beat Argentina 1-0 after extra time in the final.",
          "mimeType": "application/json",
          "digest": "sha256:7cf8ee99625d1c5379569421adc2db4a6e21bf9020e0a5af77178c44941fd3cc"
        },
