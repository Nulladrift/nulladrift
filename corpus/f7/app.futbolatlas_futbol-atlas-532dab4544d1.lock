          "name": "champions-league-1999-final",
          "title": "UEFA Champions League 1998/99 final (Man Utd 2-1 Bayern, the treble) — Football Atlas",
          "description": "The 1998/99 final at the Camp Nou on 26 May 1999 ended Manchester United 2-1 Bayern Munchen after Bayern had led for 85 minutes: two substitutes, Teddy Sheringham in the 91st minute and Ole Gunnar Solskjaer two minutes later, turned the final around to give United their first European Cup since 1968 and complete a treble inside ten days.",
          "mimeType": "application/json",
          "digest": "sha256:48a4ee7a3c6a0a6acec3238afee2b283500adc31d6d4e0dec5dbad2cb559413e"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-2005-final",
          "name": "champions-league-2005-final",
          "title": "UEFA Champions League 2004/05 final (the Miracle of Istanbul) — Football Atlas",
          "description": "The 2005 Champions League final at Istanbul's Ataturk Olympic Stadium on 25 May 2005 ended Milan 3-3 Liverpool, with Liverpool winning the shoot-out 3-2 - Jerzy Dudek saving the decisive penalty from Andriy Shevchenko - in what UEFA itself calls one of the greatest finals of all time, the Miracle of Istanbul.",
          "mimeType": "application/json",
          "digest": "sha256:b71f31edce6bbcb74796c90e098e1bab9a105e6c727e116cd50ad128441d43f5"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-2012-final",
          "name": "champions-league-2012-final",
          "title": "UEFA Champions League 2011/12 final (Bayern 1-1 Chelsea, 4-3 pens) — Football Atlas",
          "description": "Chelsea won their first Champions League on 19 May 2012 in Bayern's own stadium in Munich, Didier Drogba equalising in the 88th minute five minutes after Thomas Muller had headed Bayern ahead, then converting the last penalty of a 4-3 shoot-out. Bayern had been trying to become the first club to win the competition at home.",
          "mimeType": "application/json",
          "digest": "sha256:9856081a6446b2c6dc08e676354ca54c1401f77392f2daf015d544ee3a80073f"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-2014-final",
          "name": "champions-league-2014-final",
          "title": "UEFA Champions League 2013/14 final (Real Madrid 4-1 Atletico, La Decima) — Football Atlas",
          "description": "Real Madrid beat Atletico 4-1 after extra time in Lisbon on 24 May 2014 for a tenth European title. Diego Godin's header had led from the 36th minute until Sergio Ramos equalised from a corner deep into stoppage time, with two of the five added minutes left, and Madrid scored three more in extra time.",
          "mimeType": "application/json",
          "digest": "sha256:51d476a8c52824e52231d32b9d44b0146adb3bb1d8356e7759f95be8836393e7"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-2024-final",
          "name": "champions-league-2024-final",
          "title": "UEFA Champions League 2023/24 final (Dortmund 0-2 Real Madrid) — Football Atlas",
          "description": "The 2023/24 Champions League final at Wembley ended Borussia Dortmund 0-2 Real Madrid - Carvajal heading in from a Kroos corner (74th) and Vinicius Junior sealing it (83rd) - for Madrid's record-extending 15th European crown, Ancelotti's fifth as coach, and a sixth winners' final for Modric and Carvajal, matching Paco Gento.",
          "mimeType": "application/json",
          "digest": "sha256:be2e0477b9a6d48e77be8f0bedc89888154016f3e2dc1d8c9bb657126a2450a5"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-2025-final",
          "name": "champions-league-2025-final",
          "title": "UEFA Champions League 2024/25 final (Paris 5-0 Inter) — Football Atlas",
          "description": "The 2024/25 Champions League final in Munich on 31 May 2025 ended Paris 5-0 Inter - the biggest winning margin in any European Cup final. Hakimi, a Desire Doue double, Kvaratskhelia and teenager Mayulu scored as Paris won the competition for the first time.",
          "mimeType": "application/json",
          "digest": "sha256:087c41de1a587dd7bd279492a9d71fbf1785f5ee475438de40fb4cc469c088ea"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-2026-final",
          "name": "champions-league-2026-final",
          "title": "UEFA Champions League 2025/26 final (Paris 1-1 Arsenal, 4-3 pens) — Football Atlas",
          "description": "The 2025/26 Champions League final, played 30 May 2026 at the Puskas Arena in Budapest: Paris Saint-Germain drew 1-1 with Arsenal after extra time and won the shoot-out 4-3 to retain the trophy, the first side to do so since Real Madrid in 2018.",
          "mimeType": "application/json",
          "digest": "sha256:abd51a1f1967b5a476983d938ce707c8adb6082a8f5d0d222fe1021440fb647f"
        },
        {
          "uri": "citarium://futbol-atlas/entity/champions-league-titles-by-club",
          "name": "champions-league-titles-by-club",
          "title": "European Cup / Champions League titles by club (through 2026) — Football Atlas",
          "description": "UEFA's all-time honours board after the 2026 final: 24 clubs from ten nations have won the competition, Real Madrid leading on 15 from 18 finals, ahead of AC Milan (7), Liverpool and Bayern Munchen (6) and Barcelona (5) - with the separate Champions League-era table, the finals-played denominators and the by-nation split UEFA publishes alongside them.",
          "mimeType": "application/json",
          "digest": "sha256:033dd4978d59862a1a4f7311f8ce6ea69b329cf6cb32eb2fefef12617911245a"
        },
        {
          "uri": "citarium://futbol-atlas/entity/club-world-cup-2025",
          "name": "club-world-cup-2025",
          "title": "FIFA Club World Cup 2025 (champions - Chelsea) — Football Atlas",
          "description": "The first 32-team FIFA Club World Cup, hosted in the USA in June-July 2025, was won by Chelsea, who beat reigning European champions Paris Saint-Germain 3-0 in the final at MetLife Stadium on 13 July 2025. Cole Palmer scored twice, assisted the third and won the Golden Ball.",
          "mimeType": "application/json",
          "digest": "sha256:ae96657675e82376ea8ba246b12bf3488f3c0d712e481f006b3219295ac5bd57"
        },
        {
          "uri": "citarium://futbol-atlas/entity/copa-america-2015",
          "name": "copa-america-2015",
          "title": "CONMEBOL Copa America 2015 (champions - Chile) — Football Atlas",
          "description": "Chile won the Copa America for the first time at the 36th attempt, beating Argentina 4-1 on penalties in Santiago on 4 July 2015 after a goalless 120 minutes. Claudio Bravo saved from Ever Banega and Gonzalo Higuain put his kick over the bar.",
          "mimeType": "application/json",
          "digest": "sha256:e448bae555f75366a18dd68a9329d506875cd14f9f882659d204d22a0fb7d93a"
        },
        {
          "uri": "citarium://futbol-atlas/entity/copa-america-2016",
          "name": "copa-america-2016",
          "title": "CONMEBOL Copa America Centenario 2016 (champions - Chile) — Football Atlas",
          "description": "Chile retained the title at the Copa America Centenario, beating Argentina on penalties for the second year running - 4-2 after another goalless 120 minutes - at MetLife Stadium on 26 June 2016 before 82,026 spectators, in a final reduced to ten against ten inside the first 45 minutes.",
          "mimeType": "application/json",
          "digest": "sha256:b3c15b3223cd9f50953b1bc19bec787b62441effb137e82b6ee8d8b769164c7f"
        },
        {
          "uri": "citarium://futbol-atlas/entity/copa-america-2019",
          "name": "copa-america-2019",
          "title": "CONMEBOL Copa America 2019 (champions - Brazil) — Football Atlas",
          "description": "Brazil won their ninth Copa America on home soil, beating Peru 3-1 at the Maracana on 7 July 2019 - their first knockout-final win at that ground, since the 1989 title there came under a four-team group format. They finished undefeated having conceded a single goal, the fewest by a champion since 2001.",
          "mimeType": "application/json",
          "digest": "sha256:01edd66f8b93f2e5443459035de39b9fe76616bf72557c1aaf49ff497a1f695c"
        },
        {
          "uri": "citarium://futbol-atlas/entity/copa-america-2021",
          "name": "copa-america-2021",
          "title": "CONMEBOL Copa America 2021 (champions - Argentina) — Football Atlas",
          "description": "The 2021 Copa America final at the Maracana on 10 July 2021 ended Argentina 1-0 Brazil - Angel Di Maria chipping Ederson in the 22nd minute from Rodrigo De Paul's long pass - ending Argentina's 28-year title drought with their 15th Copa America. Messi was named best player of the tournament.",
          "mimeType": "application/json",
          "digest": "sha256:da4742fc76e5f3445ecc1058c4216cb6ca7265f2985be3611742bb5659d373db"
        },
        {
          "uri": "citarium://futbol-atlas/entity/copa-america-2024",
          "name": "copa-america-2024",
          "title": "CONMEBOL Copa America 2024 (champions - Argentina) — Football Atlas",
          "description": "The 2024 Copa America, hosted in the United States, ended with Argentina beating Colombia 1-0 after extra time in the final, Lautaro Martinez scoring in the 112th minute. It was Argentina's record 16th title, overtaking Uruguay's 15, and back-to-back triumphs after 2021.",
          "mimeType": "application/json",
          "digest": "sha256:54c88649ab89695d450cf1619d07e09488ce5eea92ae1d023d2cf7f65bd8f4b5"
        },
        {
          "uri": "citarium://futbol-atlas/entity/copa-america-titles-by-country",
          "name": "copa-america-titles-by-country",
          "title": "Copa America titles by country (through 2024) — Football Atlas",
          "description": "Argentina lead the all-time Copa America honours list with 16 titles after 2024, ahead of Uruguay on 15 and Brazil on 9 - a change from the 15-15 tie that held from 2021 to 2024 and that trained answers still report. The 48 titles reconcile exactly with the 48 editions played since 1916, and titles won are not the same count as finals won.",
          "mimeType": "application/json",
          "digest": "sha256:7f46b36df6a427f7263c3735dbf5283bc325adf46a003c5349ba86943231972e"
        },
