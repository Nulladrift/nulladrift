{
  "lockfileVersion": 2,
  "subjects": {
    "com.conductscience/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://conductscience.com/api/mcp/catalog"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "conductscience-catalog",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "The public ConductScience catalog of laboratory equipment and research software. search_products finds products; get_product returns one product's full details.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get ConductScience product details",
          "description": "Returns the full public details of one product in the ConductScience catalog by the numeric ID from search_products: description, specifications, categories, stock status, product page URL, image URL and, for equipment, the price in US dollars when one is published, with the same price_type values as search_products. For equipment that published studies name, the result adds one sentence with the number of studies, the date of that count and a link to the list. Returns a null product for an unknown or unpublished ID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product_id": {
                "description": "Numeric product ID from search_products",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "categories": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "currency": {
                        "const": "USD",
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      },
                      "id": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      "image_url": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "kind": {
                        "enum": ["equipment", "software"],
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "price": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "price_type": {
                        "enum": ["listed", "from", "request_quote", "not_applicable"],
                        "type": "string"
                      },
                      "sku": {
                        "type": "string"
                      },
                      "specifications": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "name": {
                              "type": "string"
                            },
                            "options": {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            }
                          },
                          "required": ["name", "options"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "stock_status": {
                        "anyOf": [
                          {
                            "enum": ["instock", "outofstock", "onbackorder"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "url": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["categories", "currency", "description", "id", "image_url", "kind", "name", "price", "price_type", "sku", "specifications", "stock_status", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get ConductScience product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6d3ef18d70f904f9e6e176139fddae99f92596facfe2f1c7a475f52921f6d3f9"
        },
        {
          "name": "search_products",
          "title": "Search ConductScience products",
          "description": "Searches the public ConductScience catalog of laboratory equipment and research software by product name, SKU, research keyword or a short description such as \"rotarod for mice\". Returns matching products with ID, name, SKU, kind (equipment or software), product page URL, image URL, short description, categories, specifications and stock status. Equipment results include the price in US dollars when one is published; price_type is listed, from (a starting price) or request_quote (no published price), and software results use not_applicable. For equipment that published studies name, the result adds one sentence with the number of studies, the date of that count and a link to the list. Returns an empty list when nothing matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 5,
                "description": "Products per page, up to 10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results, starting at 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product name, SKU, research keyword or short description",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "page": {
                "type": "number"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "categories": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "currency": {
                      "const": "USD",
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "image_url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "kind": {
                      "enum": ["equipment", "software"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "price_type": {
                      "enum": ["listed", "from", "request_quote", "not_applicable"],
                      "type": "string"
                    },
                    "sku": {
                      "type": "string"
                    },
                    "specifications": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "options": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["name", "options"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "stock_status": {
                      "anyOf": [
                        {
                          "enum": ["instock", "outofstock", "onbackorder"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["categories", "currency", "description", "id", "image_url", "kind", "name", "price", "price_type", "sku", "specifications", "stock_status", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["has_more", "page", "products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search ConductScience products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bdb1845e0bfbdf7ba5eccb381ae02915a8929cfa2aef314d620620f013e14fd6"
        }
      ],
      "digest": "sha256:3a12af63010de4b6820c983800c0d05600292bc09977fed361efe753c9f28ecd"
    }
  }
