{
  "lockfileVersion": 2,
  "subjects": {
    "com.conductscience/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://conductscience.com/api/mcp/catalog"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "conductscience-catalog",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server searches the public ConductScience catalog of laboratory equipment and research software and gives ConductScience's counts of the animal research papers in PubMed that mention behavioral tests. search_products finds products; get_product returns one product's full details; get_test_data returns the counts for one behavioral test and the products for it.",
      "tools": [
        {
          "name": "get_product",
          "title": "Get ConductScience product details",
          "description": "Returns the full public details of one product in the ConductScience catalog by the numeric ID from search_products: description, specifications, categories, stock status, product page URL, image URL and, for equipment, the price in US dollars when one is published, with the same price_type values as search_products. When published studies name the equipment, the result adds one sentence giving the number of those studies, the date of that count and a link to their list. For a product built for a behavioral test, it adds a link to ConductScience's page for the test when there is one. That page counts the PubMed papers that mention the test. Returns a null product for an unknown or unpublished ID.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "product_id": {
                "description": "Numeric product ID from search_products",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "categories": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "currency": {
                        "const": "USD",
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      },
                      "id": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      "image_url": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "kind": {
                        "enum": ["equipment", "software"],
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "price": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "price_type": {
                        "enum": ["listed", "from", "request_quote", "not_applicable"],
                        "type": "string"
                      },
                      "sku": {
                        "type": "string"
                      },
                      "specifications": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "name": {
                              "type": "string"
                            },
                            "options": {
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            }
                          },
                          "required": ["name", "options"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "stock_status": {
                        "anyOf": [
                          {
                            "enum": ["instock", "outofstock", "onbackorder"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "url": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "required": ["categories", "currency", "description", "id", "image_url", "kind", "name", "price", "price_type", "sku", "specifications", "stock_status", "url"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get ConductScience product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4d5c1343c2482f0bf32b1aa9771d59fe560214113bec4ce2c7b77d97345011aa"
        },
        {
          "name": "get_test_data",
          "title": "Count PubMed papers that mention a behavioral test",
          "description": "Returns ConductScience's counts of the animal research papers in PubMed that mention one behavioral test, such as the Morris water maze or the forced swim test, in their title or abstract. The counts cover the last five full years. They include the test on any maker's apparatus, not only ConductScience's. It gives how many papers mention the test, how many of those study mice and how many study rats, the tests most often mentioned with it and the health conditions those papers study most. It also links ConductScience's page for the test, which shows how the papers are counted, and lists ConductScience products for the test. Use it when someone asks how often published research mentions a behavioral test. If the name matches none of the tests ConductScience counts, it returns no counts and links the list of tests it does count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "test": {
                "description": "A behavioral test's name, abbreviation or apparatus, such as \"Morris water maze\", \"EPM\" or \"shuttle box\"",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["test"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "other_matches": {
                "description": "Other tests ConductScience counts that the name also matches",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "products": {
                "description": "ConductScience products for the test, each with its page",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "products_total": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How many products ConductScience lists for the test, or null when its store could not be checked"
              },
              "products_url": {
                "anyOf": [
                  {
                    "format": "uri",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The store page that lists them all, or null when there are none"
              },
              "test": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "conditions_studied": {
                        "description": "The health conditions those papers study most, each with how many papers study it. A paper can count under several",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "data_url": {
                              "anyOf": [
                                {
                                  "format": "uri",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "name": {
                              "type": "string"
                            },
                            "papers": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["data_url", "name", "papers"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "data_url": {
                        "anyOf": [
                          {
                            "format": "uri",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "ConductScience's page for the test, with its papers per year and how they are counted, or null when there is none"
                      },
                      "first_year": {
                        "description": "The first year counted",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "last_year": {
                        "description": "The last year counted",
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "name": {
                        "type": "string"
                      },
                      "papers": {
                        "description": "How many animal research papers in PubMed mention the test in their title or abstract from first_year to last_year, on any maker's apparatus",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "papers_naming_mice": {
                        "description": "How many of those papers study mice. A paper can study mice and rats, or neither",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "papers_naming_rats": {
                        "description": "How many of those papers study rats",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "released": {
                        "description": "The day ConductScience released the counts, as YYYY-MM-DD",
                        "type": "string"
                      },
                      "tests_alongside": {
                        "description": "The tests those papers most often mention with this one, each with how many papers mention both",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "data_url": {
                              "anyOf": [
                                {
                                  "format": "uri",
                                  "type": "string"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "name": {
                              "type": "string"
                            },
                            "papers": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["data_url", "name", "papers"],
                          "type": "object"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["conditions_studied", "data_url", "first_year", "last_year", "name", "papers", "papers_naming_mice", "papers_naming_rats", "released", "tests_alongside"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The counts for the test the name matches, or null when it matches none ConductScience counts"
              }
            },
            "required": ["other_matches", "products", "products_total", "products_url", "test"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Count PubMed papers that mention a behavioral test"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d1a69cc5a3a0ddf5e4b2a0ac51a3fe90545e56bf3f88c5c5b2b2b817187588ae"
        },
        {
          "name": "search_products",
          "title": "Search ConductScience products",
          "description": "Searches the public ConductScience catalog of laboratory equipment and research software by product name, SKU, research keyword or a short description such as \"rotarod for mice\". Returns matching products with ID, name, SKU, kind (equipment or software), product page URL, image URL, short description, categories, specifications and stock status. Equipment results include the price in US dollars when one is published; price_type is listed, from (a starting price) or request_quote (no published price), and software results use not_applicable. For equipment that published studies name, the result adds one sentence with the number of studies, the date of that count and a link to the list. Returns an empty list when nothing matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 5,
                "description": "Products per page, up to 10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page of results, starting at 1",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Product name, SKU, research keyword or short description",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "type": "boolean"
              },
              "page": {
                "type": "number"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "categories": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "currency": {
                      "const": "USD",
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "image_url": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "kind": {
                      "enum": ["equipment", "software"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "price_type": {
                      "enum": ["listed", "from", "request_quote", "not_applicable"],
                      "type": "string"
                    },
                    "sku": {
                      "type": "string"
                    },
                    "specifications": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "options": {
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          }
                        },
                        "required": ["name", "options"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "stock_status": {
                      "anyOf": [
                        {
                          "enum": ["instock", "outofstock", "onbackorder"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["categories", "currency", "description", "id", "image_url", "kind", "name", "price", "price_type", "sku", "specifications", "stock_status", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["has_more", "page", "products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search ConductScience products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
