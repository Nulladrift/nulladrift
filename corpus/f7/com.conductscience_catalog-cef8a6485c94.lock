          },
          "digest": "sha256:79a19b5b9f384a2712667679f96ea65c224cd8f2afe790f61f50878c6a0e83bc"
        }
      ],
      "digest": "sha256:b23b06f8377a49531e4dcf539e5ed1286206f60a7e492b1e48726b7d9eb54d2e"
    }
  }
