      },
      "instructions": "Dados do mercado financeiro brasileiro (B3, fundos CVM, câmbio, cripto, indicadores). Todas as tools são somente leitura. Chamar tools exige o header Authorization: Bearer <KID>.<SECRET> (token grátis em https://api.sldx.com.br/dev); cada chamada consome créditos do plano do usuário, então evite repetir consultas.",
      "tools": [
        {
          "name": "get_commodity_price",
          "title": "Preço de commodities",
          "description": "Retorna dados de mercado (preço, variação 24h, volume) de uma ou mais commodities, como ouro (GOLD), petróleo (OIL), soja (SOJA), etc. Custa 1 crédito por chamada.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "codes": {
                "description": "Códigos em maiúsculo separados por vírgula, ex: 'GOLD,OIL'",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["codes"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a3cb5bb9d5c0a5a93e2d688a4a30d190f920ebfe80ae769cc902bbfa7521051f"
        },
        {
          "name": "get_crypto_liquidations",
          "title": "Liquidações de derivativos cripto",
          "description": "Retorna quanto foi liquidado à força no mercado de derivativos cripto — posições alavancadas encerradas automaticamente pela corretora — nas janelas de 1h, 4h e 24h. Cada janela traz o total, quanto veio de posições compradas (long) e vendidas (short), os percentuais já calculados e um campo 'sentiment' com a leitura pronta do desequilíbrio (ex: 'Alerta de Long Squeeze', 'Mercado equilibrado'). Além do bloco 'global' do mercado inteiro, devolve o ranking das moedas mais liquidadas. Use para responder sobre estresse, alavancagem, squeezes e quedas bruscas no mercado cripto. Dados da CoinMarketCap, atualizados a cada ~20 minutos. Custa 3 créditos por chamada.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Moeda dos valores (padrão 'both', que traz os campos _usd e _brl)",
                "enum": ["usd", "brl", "both"],
                "type": "string"
              },
              "limit": {
                "description": "Quantas moedas trazer no ranking (1-100, padrão 5)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "window": {
                "description": "Retorna apenas esta janela. Omitir devolve as três.",
                "enum": ["1h", "4h", "24h"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dcc4000ea59109eee3e3347d17a77b15b109f68ef67c089753a1b64e37f1b400"
        },
        {
          "name": "get_crypto_liquidations_by_symbol",
          "title": "Liquidações de uma moeda específica",
          "description": "Retorna as liquidações de uma única criptomoeda (ex: BTC, ETH, SOL) nas janelas de 1h, 4h e 24h, cada uma com o campo 'sentiment' já interpretado e 'dominant' indicando se predominaram longs ou shorts. Use quando a pergunta for sobre uma moeda em particular; para o panorama do mercado, use get_crypto_liquidations. Custa 3 créditos por chamada.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Moeda dos valores (padrão 'both')",
                "enum": ["usd", "brl", "both"],
                "type": "string"
              },
              "symbol": {
                "description": "Símbolo da moeda, não diferencia maiúsculas de minúsculas (ex: 'BTC'). O valor 'global' devolve apenas o agregado do mercado.",
                "maxLength": 100,
                "type": "string"
              },
              "window": {
                "description": "Retorna apenas esta janela. Omitir devolve as três.",
                "enum": ["1h", "4h", "24h"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
