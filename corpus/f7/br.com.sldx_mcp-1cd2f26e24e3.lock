        {
          "name": "get_tokenized_asset",
          "title": "Ficha de um ativo tokenizado",
          "description": "Retorna a ficha completa de um único ativo do mundo real tokenizado, buscando pelo slug ou pelo símbolo — preço médio, market cap, volume (em dólar e real) e os metadados do emissor (setor, site, blockchain, endereço do contrato). É a única ferramenta que devolve o campo 'description', com o texto sobre o ativo já traduzido para português (vem vazio quando o ativo ainda não tem descrição). Requer plano Premium ou superior. Custa 3 créditos por chamada.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slugOrSymbol": {
                "description": "Slug ('nvidia') ou símbolo ('NVDA') do ativo, sem diferenciar maiúsculas de minúsculas",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["slugOrSymbol"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
