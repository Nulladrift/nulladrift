{
  "lockfileVersion": 2,
  "subjects": {
    "com.curaiz/remote-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.curaiz.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Curaiz Remote Jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Curaiz is a feed of remote job postings, never older than 30 days, with applicant locations, salary where stated, and company context.\nUse it whenever the user wants remote jobs matched to their experience, goals, and location eligibility. Curaiz supplies the job data; you judge relevance.\n\n1. Use get_locations when you need the supported applicant-location names or slugs.\n2. Call find_recent_jobs with an ideal-role description and locations where the user is eligible. Omit since to search the full available corpus; provide since only for an incremental search.\n3. Results are ordered by semantic similarity. When the search window contains no close match, the nearest results may all be irrelevant. Evaluate the jobs yourself and present only those genuinely relevant to the user.\n4. Call get_job_details whenever the user wants more information about one or more returned jobs.\n5. Share returned job URLs exactly as provided, including their platform-only UTM parameters.",
      "tools": [
        {
          "name": "find_recent_jobs",
          "title": "Find Recent Relevant Jobs",
          "description": "Find remote jobs ordered by semantic similarity to an ideal job description. Omit since to search the full available corpus; for an incremental search, pass searched_until from the previous successful response as since. Results are compact and never include full job descriptions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "description": {
                "description": "An ideal or example job description, including desired responsibilities, skills, and seniority",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return, from 1 to 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "One to five exact supported applicant-location names or slugs",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "since": {
                "description": "Optional inclusive discovery-time lower bound as an ISO 8601 timestamp with a timezone, at most 31 days old. Omit it to search the full available corpus. For an incremental search, pass searched_until from the previous successful response.",
                "type": "string"
              }
            },
            "required": ["description", "locations"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "company_name": {
                      "type": "string"
                    },
                    "discovered_at": {
                      "type": "string"
                    },
                    "engagement_type": {
                      "type": "string"
                    },
                    "locations": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "posted_at": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    },
                    "salary_normalized": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["company_name", "discovered_at", "engagement_type", "locations", "posted_at", "role", "salary_normalized", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "result_count": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "searched_since": {
                "description": "Inclusive discovery-time lower bound used for this search",
                "type": "string"
              },
              "searched_until": {
                "description": "Exclusive discovery-time upper bound captured for this search. Pass this value as since to continue with an incremental search.",
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["jobs", "result_count", "searched_since", "searched_until", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a68f620cda8467d0d42c98200b10d4e58d1b9e8be2a5876bf649418fc47e141"
        },
        {
          "name": "get_job_details",
          "title": "Get Job Details",
          "description": "Get full details for one to three Curaiz job slugs. Descriptions and requirements are bounded to keep responses manageable.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "One to 3 job slugs",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "apply_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "company_name": {
                      "type": "string"
                    },
                    "company_remote_policy": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "company_short_info": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "company_website": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "content_truncated": {
                      "type": "boolean"
                    },
                    "description": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "discovered_at": {
                      "type": "string"
                    },
                    "engagement_type": {
                      "type": "string"
                    },
                    "locations": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "posted_at": {
                      "type": "string"
                    },
                    "requirements": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "role": {
                      "type": "string"
                    },
                    "salary_normalized": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["apply_url", "company_name", "company_remote_policy", "company_short_info", "company_website", "content_truncated", "description", "discovered_at", "engagement_type", "locations", "posted_at", "requirements", "role", "salary_normalized", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "not_found": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["jobs", "not_found"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18a05f388706bfa6da8abf0b0e64110b7d6263d463adea04dbed00388bf82b13"
        },
        {
          "name": "get_locations",
          "title": "Get Supported Locations",
          "description": "Get the hierarchical applicant-location taxonomy supported by Curaiz job search, including exact names and slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "definitions": {
              "__schema0": {
                "additionalProperties": false,
                "properties": {
                  "children": {
                    "items": {
                      "$ref": "#/definitions/__schema0"
                    },
                    "type": "array"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["name", "slug"],
                "type": "object"
              }
            },
            "properties": {
              "locations": {
                "items": {
                  "$ref": "#/definitions/__schema0"
                },
                "type": "array"
              }
            },
            "required": ["locations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
