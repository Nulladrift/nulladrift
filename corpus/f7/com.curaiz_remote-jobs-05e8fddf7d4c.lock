          },
          "digest": "sha256:9fe392678456ecbc4685f5a3e85d924d99414fdd2b97c7a62948a0702ebf4646"
        }
      ],
      "digest": "sha256:cedd2ca3470cb24b4d86f1898f3103e0abbef0ef50c7ac8ae3380bfaa7e8da15"
    }
  }
}
