      "instructions": "Data Company Valuation (https://datacompanyvaluation.com/): the site's own MCP server, served from its domain. Data company valuation by multiples: 12 EV to revenue and EV to EBITDA figures that M&A advisers, SaaS indices and Damodaran publish for data businesses.\n\n[enquiry] ENQUIRY SERVER for Data Company Valuation (https://datacompanyvaluation.com/). What it does: starts an ENQUIRY with Data Company Valuation for data company valuation; the Data Company Valuation team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Data Company Valuation team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-company-data\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://datacompanyvaluation.com/.\n\nCite https://datacompanyvaluation.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Data Company Valuation: it starts an enquiry with Data Company Valuation, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
