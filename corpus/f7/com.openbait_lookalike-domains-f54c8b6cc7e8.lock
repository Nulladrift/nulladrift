{
  "lockfileVersion": 2,
  "subjects": {
    "com.openbait/lookalike-domains": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openbait.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "openbait",
        "title": "OpenBait",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_lookalike_domains",
          "title": "Check lookalike domains",
          "description": "Find lookalike domains of a brand's website: the brand's name with common words such as login or pay, on the domain's own ending (or on .com for endings like .co.jp), and, for most longer brand names, .shop names of the kind copied stores use. Checks which of them resolve in DNS and what their front page shows (a page using the brand's name, a redirect to the brand's own site, another live site, or nothing). It does not try misspellings or look-alike characters. Read-only. Same check as https://openbait.com/tools/typosquat-check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "the brand's website, e.g. example.com or https://www.example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "the registrable domain that was checked",
                "type": "string"
              },
              "lookalikes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "activeDns": {
                      "description": "the name resolves in DNS",
                      "type": "boolean"
                    },
                    "domain": {
                      "type": "string"
                    },
                    "mutationType": {
                      "description": "homoglyph, keyword, omission, transposition or tld_swap",
                      "type": "string"
                    },
                    "score": {
                      "description": "0-100, higher is more likely to be mistaken for the brand",
                      "type": "integer"
                    },
                    "severity": {
                      "description": "high or medium",
                      "type": "string"
                    },
                    "site": {
                      "description": "for names that resolve: brand_page (page uses the brand's name), redirects_to_you (ends on the brand's own domain), live_other or no_site",
                      "type": "string"
                    }
                  },
                  "required": ["activeDns", "domain", "mutationType", "score", "severity"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "resultUrl": {
                "description": "the same result on openbait.com",
                "type": "string"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "activeDns": {
                    "type": "integer"
                  },
                  "reviewNow": {
                    "type": "integer"
                  },
                  "totalCandidates": {
                    "type": "integer"
                  },
                  "watchlist": {
                    "type": "integer"
                  }
                },
                "required": ["activeDns", "reviewNow", "totalCandidates", "watchlist"],
                "type": "object"
              }
            },
            "required": ["domain", "lookalikes", "resultUrl", "summary"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check lookalike domains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:67c9f6e51938d9f9ba658966913f260f6b835e77d3233454a24209117117ca89"
        }
      ],
      "digest": "sha256:43d3c3deb665104e16d8e565b9a9e850e90c37d60bd9bcfe1bd527c1d045ddc2"
    }
  }
}
