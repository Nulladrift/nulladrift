{
  "lockfileVersion": 2,
  "subjects": {
    "com.openbait/lookalike-domains": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openbait.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "openbait",
        "title": "OpenBait",
        "version": "2.1.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_lookalike_domains",
          "title": "Check lookalike domains",
          "description": "Find registered lookalike domains of a brand's website: the brand's name on other endings, with common words such as login or pay, as .shop names of the kind copied stores use (also for the shorter name a brand goes by when its domain ends in a word such as supply or store), and a few misspellings. Checks which of them resolve in DNS and what their front page shows (a page using the brand's name, another live site, or nothing); a misspelling counts only when its page uses the brand's name, and a name that lands on the brand's own site is left out. Returns how many were found and at most five of them. Read-only. Same check as https://openbait.com/tools/typosquat-check. A free OpenBait account for the brand lists every lookalike found, checks newly registered lookalike names every day, and emails the owner when one needs a look (see monitoring.url).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "the brand's website, e.g. example.com or https://www.example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "the registrable domain that was checked",
                "type": "string"
              },
              "lookalikes": {
                "description": "at most five registered lookalikes, names using the brand's name first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "blocked": {
                      "description": "live_other only: the site answered with a bot check, so its page was not read",
                      "type": "boolean"
                    },
                    "domain": {
                      "type": "string"
                    },
                    "site": {
                      "description": "what the front page shows: brand_page (uses the brand's name), live_other (another live site), no_site (nothing there) or unread (registered, page not read in time)",
                      "type": "string"
                    }
                  },
                  "required": ["domain", "site"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "monitoring": {
                "additionalProperties": false,
                "properties": {
                  "note": {
                    "description": "what the free account does beyond this check",
                    "type": "string"
                  },
                  "url": {
                    "description": "free sign-up for this brand on openbait.com",
                    "type": "string"
                  }
                },
                "required": ["note", "url"],
                "type": "object"
              },
              "resultUrl": {
                "description": "the same result on openbait.com",
                "type": "string"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "checked": {
                    "description": "how many names were looked up in DNS",
                    "type": "integer"
                  },
                  "found": {
                    "description": "how many registered lookalikes were found",
                    "type": "integer"
                  },
                  "more": {
                    "description": "how many of found are not listed in lookalikes",
                    "type": "integer"
                  }
                },
                "required": ["checked", "found", "more"],
                "type": "object"
              }
            },
            "required": ["domain", "lookalikes", "monitoring", "resultUrl", "summary"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check lookalike domains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72cd96cb93ae8c27a9718e7c89973008fb974f0bccd26726f5fee2346aff9bbc"
        }
      ],
      "digest": "sha256:73372ca011714888420a16b62d9c0c4a9fedd105867832d7c95c40121dcd4dd9"
    }
  }
}
