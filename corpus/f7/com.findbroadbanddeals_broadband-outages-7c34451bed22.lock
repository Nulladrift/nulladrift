      "instructions": "FindBroadband's UK broadband outage tracker, the same data and wording as findbroadbanddeals.com/is-my-broadband-down, covering the last 30 days. Where we can read a provider's own status page it decides the status; for the rest the status comes from public reports, which are unconfirmed. Places are the ones the provider named. We hold no outage data for individual addresses, so never tell someone their own line is or isn't affected: say what has been reported and where. Fields ending in _uk are UK local time; every other timestamp is ISO 8601 in UTC. Quote headlines and providers' own words as given rather than rewording them. When status_based_on is public_reports, Down means people are reporting problems the provider hasn't confirmed and Working fine means nobody is reporting problems, not that the provider has said all is well. If the user is still offline, point them to the provider's status page or the provider. Give scope_note with the status when there is one. Outage data covers the last 30 days only: say so if asked about anything older.",
      "tools": [
        {
          "name": "get_outage_history",
          "title": "Broadband outages in the last 30 days",
          "description": "Returns the outage incidents each provider's FindBroadband page lists, for the last 30 days, a shorter window or one day: current first, then newest first, with start and end times, places and the provider's own words, plus a count per provider when no provider is given. Covers the last 30 days only. Entries with source public_reports rest on public reports the provider never confirmed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Only incidents that touched this UK calendar day, as YYYY-MM-DD. Must be within the last 30 days. Overrides days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "How many days to look back, counting today, up to 30. Leave it out for everything we hold (the last 30 days).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "description": "Only incidents for this provider. Leave it out to search every provider we track.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "by_provider": {
