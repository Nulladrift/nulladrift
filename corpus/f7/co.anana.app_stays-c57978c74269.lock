      "serverInfo": {
        "name": "anana-stays",
        "title": "ANANA Stays",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use this when someone wants a place to stay in Vancouver, Burnaby or West Vancouver, BC. Ask for the dates and number of guests if missing, then call search_stays. Totals already include cleaning and 5% GST, with no service fee. To book, call book_stay with the guest's full name and email and share the Stripe link; the stay is confirmed once they pay. Not for hotels, flights or other cities.",
      "tools": [
        {
          "name": "book_stay",
          "title": "Book a stay",
          "description": "Holds the home for about 30 minutes and returns a secure Stripe payment link. The booking is confirmed only when the guest pays on that page. Needs the guest's full name and email.",
          "inputSchema": {
            "properties": {
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD",
                "type": "string"
              },
              "email": {
                "description": "Guest email for the confirmation",
                "type": "string"
              },
              "guests": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Guest full name",
                "type": "string"
              },
              "stay_code": {
                "description": "stay_code from search_stays",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "email", "guests", "name", "stay_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a stay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c2d0071ea582a05067430599159b379f8031271fb80d0cccbdfd759371cb1ea"
        },
        {
          "name": "search_stays",
          "title": "Find a stay in Vancouver",
          "description": "Private homes in Vancouver, Burnaby and West Vancouver, BC that are free for the dates, with the exact total (cleaning and 5% GST included, no service fee) and a link to each home's booking page.",
          "inputSchema": {
            "properties": {
              "check_in": {
                "description": "Check-in date, YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "Check-out date, YYYY-MM-DD",
                "type": "string"
              },
              "guests": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["check_in", "check_out", "guests"],
            "type": "object"
          },
