      "serverInfo": {
        "name": "federalcourtdeadlines",
        "title": "FederalCourtDeadlines",
        "version": "1.0.0",
        "websiteUrl": "https://federalcourtdeadlines.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Federal civil litigation deadlines, computed from the Federal Rules of Civil Procedure, Federal Rule of Appellate Procedure 4, and 28 U.S.C. 1446 and 1447, and from a district court's own local rules for the districts federal_local_deadline accepts.\n\nfederal_deadline returns a date computed from the rule text, with the rule and subdivision it rests on and the text quoted. federal_local_deadline does the same for a motion, opposition or reply under a listed district's local rules, which usually set times that replace FRCP 6(c), and given \"list\" it lists that district's rows and computes nothing. federal_count_days counts a period in days under FRCP 6(a) or FRAP 26(a) and quotes no rule text. federal_legal_holidays lists a year's legal holidays with their sources. The count follows Rule 6(a), which rolls a period measured after an event forward and a period measured before an event back; Rule 6(d)'s 3 days are added only after the roll and only for the methods of service it names; and the questions that are not settled (observed holidays, presidential closure days, whether Rule 6(d) reaches a period) are reported with the date under each reading.\n\nEvery deadline answer gives the due date under the prevailing reading, and when the readings differ it also gives the earliest date (safe for a party computing its own deadline) and the latest date (the floor for arguing that someone else filed late). Every open question and note travels with the date. Repeat the authority, the earliest date and the notes when you report a date. Do not present any of this as legal advice: chambers rules, a case management order or a judge's standing order can move almost any of these dates. Local rules apply only for the districts federal_local_deadline accepts; for any other district the dates follow the federal rules alone. No state holidays are applied yet.\n\n70 rule rows transcribed from the official text, the latest on October 5, 2026. None has been countersigned yet. Every answer says \"not yet countersigned\" until an attorney countersigns the rows it used. Nothing here reads or writes any user's data.",
      "tools": [
        {
          "name": "federal_count_days",
          "title": "Count a federal period in days",
          "description": "Count a period stated in days from a date under FRCP 6(a) or FRAP 26(a): leave out the trigger day, count every day, and if the last day is a weekend or legal holiday roll to the next open day (or, for a period counted backward before an event, to the preceding one). Optionally adds 3 days under FRCP 6(d) or FRAP 26(c) after the roll, for a period that runs after being served. Returns the due date under the prevailing reading, and the earliest and latest dates when observed or closure days make the readings differ. Use this for a period no specific rule row covers, such as one set by a court order. With court_open_days, counts only days a district court is open instead, for a local rule that states its period that way.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "court_open_days": {
                "description": "Optional, FRCP only, and only with a district whose local rules this site applies (federal_local_deadline accepts it): true counts only days that court is open, skipping weekends, legal holidays and the days its posted schedule closes the court. The last day counted is a day the court is open, so it is not rolled. Not with service_method.",
                "type": "boolean"
              },
              "date": {
                "description": "The date of the event the period counts from. That day itself is not counted.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days": {
                "description": "How many days: calendar days, or with court_open_days only days the court is open. Negative counts backward, for a period measured before an event. Not zero.",
                "maximum": 365,
                "minimum": -365,
                "type": "integer"
              },
              "district": {
                "description": "Optional. The CM/ECF id of the district court, such as casd, cacd, nysd or dcd. Adds the notes for that district and the Ninth Circuit notes for California districts. Required with court_open_days.",
                "type": "string"
              },
              "frap_delivery": {
                "description": "FRAP only, and only when the period runs after being served: how the paper was delivered. \"other\" adds 3 days under FRAP 26(c). served-electronically = Served electronically: adds nothing; delivered-on-proof-date = Delivered on the date stated in the proof of service: adds nothing; other = Any other service: adds 3 days (FRAP 26(c)).",
                "enum": ["served-electronically", "delivered-on-proof-date", "other"],
                "type": "string"
              },
              "regime": {
                "description": "frcp (default) counts under FRCP 6(a), for the district court; frap counts under FRAP 26(a), for an appeal.",
                "enum": ["frcp", "frap"],
                "type": "string"
              },
              "service_method": {
                "description": "FRCP only, and only when the period runs after being served: how the paper was served under Rule 5(b)(2). Mail, leaving it with the clerk and other consented means add 3 days under Rule 6(d); the rest add nothing. 5b2C-mail = Mail (Rule 5(b)(2)(C)); 5b2D-clerk = Leaving it with the clerk (Rule 5(b)(2)(D)); 5b2F-consented-other = Other means you consented to in writing (Rule 5(b)(2)(F)); 5b2E-electronic = The court's electronic-filing system or other consented electronic means (Rule 5(b)(2)(E)): adds nothing; 5b2A-handing = Handing it to the person (Rule 5(b)(2)(A)): adds nothing; 5b2B-leaving = Leaving it at the office or home (Rule 5(b)(2)(B)): adds nothing.",
                "enum": ["5b2C-mail", "5b2D-clerk", "5b2F-consented-other", "5b2E-electronic", "5b2A-handing", "5b2B-leaving"],
                "type": "string"
              }
            },
            "required": ["date", "days"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27b2f2ec729268730e1e78de67fac0be120c494410fa12f8cb23f3b9f4b7371c"
        },
        {
          "name": "federal_deadline",
          "title": "Federal civil deadline for one rule",
          "description": "Compute one federal civil deadline under the Federal Rules of Civil Procedure, FRAP 4 or 28 U.S.C. 1446 and 1447, from the date of the event the rule counts from. Counts under FRCP 6(a) (FRAP 26(a) for an appeal), rolls off weekends and legal holidays in the direction the rule requires, and adds 3 days under Rule 6(d) or FRAP 26(c) only when that rule reaches the period and the method of service calls for it. Returns the due date under the prevailing reading and, when the readings differ, the earliest date (safe for a party computing its own deadline) and the latest date (the floor for arguing someone else was late), with every open question, the rule text, the authority and the countersign status. A deadline a district court's own local rules set is returned by federal_local_deadline.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compliance_date": {
                "description": "FRCP 45(d)(2)(B) only, required there: the date for compliance stated in the subpoena.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "compliance_time": {
                "description": "FRCP 45(d)(2)(B) only, required there: the time for compliance stated in the subpoena, 24-hour HH:MM.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "defendant_appeared_date": {
                "description": "FRCP 26(f)(1) only, with defendant_served_date: the date any defendant appeared, if known.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "defendant_served_date": {
                "description": "FRCP 26(f)(1) only, when neither the scheduling conference date nor the date the scheduling order is due is known: the date any defendant was served with the complaint. Rule 16(b)(2) is then computed first and the conference date counted back from it, in one reading. trigger_date and second_trigger_date are ignored.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "district": {
                "description": "Optional. The CM/ECF id of the district court, such as casd (S.D. Cal.), cacd (C.D. Cal.), nysd (S.D.N.Y.) or dcd (D.D.C.). Adds the time the last day ends where the court states it, the notes for that district, and the Ninth Circuit notes for California districts. For a district whose local rules this site applies (federal_local_deadline accepts it), it also adds that court's local rule notes and the days its posted schedule closes the court; for any other district the answer says its local rules are not applied.",
                "type": "string"
              },
              "frap_delivery": {
                "description": "For an appeal period that runs after being served: how the paper was delivered, under FRAP 26(c). served-electronically = Served electronically: adds nothing; delivered-on-proof-date = Delivered on the date stated in the proof of service: adds nothing; other = Any other service: adds 3 days (FRAP 26(c)).",
                "enum": ["served-electronically", "delivered-on-proof-date", "other"],
                "type": "string"
              },
              "outside_district": {
                "description": "FRCP 4(d)(1)(F) and 12(a)(1)(A)(ii): true when the waiver request was sent to the defendant outside any judicial district of the United States.",
                "type": "boolean"
              },
              "reason": {
                "description": "FRCP 60(c)(1) only, required there: the reason under Rule 60(b), 1 to 6. Reasons 1 to 3 have a one-year outer limit; reasons 4 to 6 have no fixed date.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "rule": {
                "description": "The rule row to compute. Each id names the rule and subdivision: fed-frcp-4m (FRCP 4(m), after the complaint is filed); fed-frcp-4d1F (FRCP 4(d)(1)(F), after the request was sent); fed-frcp-12a1Ai (FRCP 12(a)(1)(A)(i), after being served with the summons and complaint); fed-frcp-12a1Aii (FRCP 12(a)(1)(A)(ii), after the request for a waiver was sent); fed-frcp-12a2 (FRCP 12(a)(2), after service on the United States attorney); fed-frcp-12a3 (FRCP 12(a)(3), after service on the officer or employee or service on the United States attorney, whichever is later); fed-frcp-12a4A (FRCP 12(a)(4)(A), after notice of the court's action); fed-frcp-12a4B (FRCP 12(a)(4)(B), after the more definite statement is served); fed-frcp-15a1A (FRCP 15(a)(1)(A), after serving it); fed-frcp-15a1B (FRCP 15(a)(1)(B), after service of a responsive pleading or 21 days after service of a motion under Rule 12(b), (e), or (f), whichever is earlier); fed-frcp-15a3 (FRCP 15(a)(3), after service of the amended pleading); fed-frcp-38b1 (FRCP 38(b)(1), after the last pleading directed to the issue is served); fed-frcp-16b2 (FRCP 16(b)(2), the earlier of 90 days after any defendant has been served with the complaint or 60 days after any defendant has appeared); fed-frcp-26f1 (FRCP 26(f)(1), at least 21 days before a scheduling conference is to be held or a scheduling order is due under Rule 16(b)); fed-frcp-26a1C (FRCP 26(a)(1)(C), after the parties' Rule 26(f) conference); fed-frcp-26a1D (FRCP 26(a)(1)(D), after being served or joined); fed-frcp-26a2Di (FRCP 26(a)(2)(D)(i), at least 90 days before the date set for trial or for the case to be ready for trial); fed-frcp-26a2Dii (FRCP 26(a)(2)(D)(ii), after the other party's disclosure); fed-frcp-26a3B-disclosures (FRCP 26(a)(3)(B), at least 30 days before trial); fed-frcp-26a3B-objections (FRCP 26(a)(3)(B), Within 14 days after they are made); fed-frcp-33b2 (FRCP 33(b)(2), after being served with the interrogatories); fed-frcp-34b2A-served (FRCP 34(b)(2)(A), after being served); fed-frcp-34b2A-early (FRCP 34(b)(2)(A), after the parties' first Rule 26(f) conference); fed-frcp-36a3 (FRCP 36(a)(3), within 30 days after being served); fed-frcp-45d2B (FRCP 45(d)(2)(B), 14 days after the subpoena is served); fed-frcp-56b (FRCP 56(b), until 30 days after the close of all discovery); fed-frcp-72a (FRCP 72(a), after being served with a copy); fed-frcp-72b2-objections (FRCP 72(b)(2), after being served with a copy of the recommended disposition); fed-frcp-72b2-response (FRCP 72(b)(2), after being served with a copy); fed-frcp-50b (FRCP 50(b), after the entry of judgment); fed-frcp-50d (FRCP 50(d), after the entry of the judgment); fed-frcp-52b (FRCP 52(b), after the entry of judgment); fed-frcp-59b (FRCP 59(b), after the entry of judgment); fed-frcp-59c (FRCP 59(c), after being served); fed-frcp-59d (FRCP 59(d), after the entry of judgment); fed-frcp-59e (FRCP 59(e), after the entry of the judgment); fed-frcp-54d2Bi (FRCP 54(d)(2)(B)(i), after the entry of judgment); fed-frcp-60c1 (FRCP 60(c)(1), after the entry of the judgment or order or the date of the proceeding); fed-frcp-62a (FRCP 62(a), for 30 days after its entry); fed-frap-4a1A (FRAP 4(a)(1)(A), after entry of the judgment or order appealed from); fed-frap-4a1B (FRAP 4(a)(1)(B), after entry of the judgment or order appealed from); fed-frap-4a3 (FRAP 4(a)(3), after the date when the first notice was filed); fed-frap-4a4 (FRAP 4(a)(4), from the entry of the order disposing of the last such remaining motion); fed-frap-4a5 (FRAP 4(a)(5)(A)(i), no later than 30 days after the time prescribed by this Rule 4(a) expires); fed-frap-4a6 (FRAP 4(a)(6), after the date when its order to reopen is entered); fed-usc-1446b1 (28 U.S.C. 1446(b)(1), after the receipt by the defendant, through service or otherwise, of a copy of the initial pleading); fed-usc-1446b2BC (28 U.S.C. 1446(b)(2)(B)-(C), after receipt by or service on that defendant of the initial pleading or summons described in paragraph (1)); fed-usc-1446b3 (28 U.S.C. 1446(b)(3), after receipt by the defendant, through service or otherwise, of a copy of an amended pleading, motion, order or other paper); fed-usc-1446c1 (28 U.S.C. 1446(c)(1), more than 1 year after commencement of the action); fed-usc-1447c (28 U.S.C. 1447(c), after the filing of the notice of removal under section 1446(a)); fed-frcp-81c2 (FRCP 81(c)(2), receipt of the initial pleading; service of the summons for an initial pleading on file; filing of the notice of removal); fed-frcp-6c1 (FRCP 6(c)(1), before the time specified for the hearing); fed-frcp-6c2 (FRCP 6(c)(2), before the hearing).",
                "enum": ["fed-frcp-4m", "fed-frcp-4d1F", "fed-frcp-12a1Ai", "fed-frcp-12a1Aii", "fed-frcp-12a2", "fed-frcp-12a3", "fed-frcp-12a4A", "fed-frcp-12a4B", "fed-frcp-15a1A", "fed-frcp-15a1B", "fed-frcp-15a3", "fed-frcp-38b1", "fed-frcp-16b2", "fed-frcp-26f1", "fed-frcp-26a1C", "fed-frcp-26a1D", "fed-frcp-26a2Di", "fed-frcp-26a2Dii", "fed-frcp-26a3B-disclosures", "fed-frcp-26a3B-objections", "fed-frcp-33b2", "fed-frcp-34b2A-served", "fed-frcp-34b2A-early", "fed-frcp-36a3", "fed-frcp-45d2B", "fed-frcp-56b", "fed-frcp-72a", "fed-frcp-72b2-objections", "fed-frcp-72b2-response", "fed-frcp-50b", "fed-frcp-50d", "fed-frcp-52b", "fed-frcp-59b", "fed-frcp-59c", "fed-frcp-59d", "fed-frcp-59e", "fed-frcp-54d2Bi", "fed-frcp-60c1", "fed-frcp-62a", "fed-frap-4a1A", "fed-frap-4a1B", "fed-frap-4a3", "fed-frap-4a4", "fed-frap-4a5", "fed-frap-4a6", "fed-usc-1446b1", "fed-usc-1446b2BC", "fed-usc-1446b3", "fed-usc-1446c1", "fed-usc-1447c", "fed-frcp-81c2", "fed-frcp-6c1", "fed-frcp-6c2"],
                "type": "string"
              },
              "second_trigger_date": {
                "description": "A second date, for a row that compares two periods: FRCP 12(a)(3) the other service date; 15(a)(1)(B) the service date of the other paper; 15(a)(3) the date the response to the original pleading was due; 16(b)(2) the date any defendant appeared; 26(f)(1) the other anchor; FRAP 4(a)(3) entry of the judgment or order; 1446(b)(1) service of summons; 81(c)(2) receipt of the initial pleading.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_method": {
                "description": "How the paper that starts the period was served, under FRCP 5(b)(2). Only mail, leaving it with the clerk and other consented means add 3 days, and only on a period that runs after being served: 5b2C-mail = Mail (Rule 5(b)(2)(C)); 5b2D-clerk = Leaving it with the clerk (Rule 5(b)(2)(D)); 5b2F-consented-other = Other means you consented to in writing (Rule 5(b)(2)(F)); 5b2E-electronic = The court's electronic-filing system or other consented electronic means (Rule 5(b)(2)(E)): adds nothing; 5b2A-handing = Handing it to the person (Rule 5(b)(2)(A)): adds nothing; 5b2B-leaving = Leaving it at the office or home (Rule 5(b)(2)(B)): adds nothing.",
                "enum": ["5b2C-mail", "5b2D-clerk", "5b2F-consented-other", "5b2E-electronic", "5b2A-handing", "5b2B-leaving"],
                "type": "string"
              },
              "third_trigger_date": {
                "description": "A third date, used only by FRCP 81(c)(2): service of the summons for an initial pleading on file.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "trigger_date": {
                "description": "Required, except on fed-frcp-26f1 when defendant_served_date is given. The date of the event the rule counts from, in the rule's own words above: the date of service, entry, filing, the conference, or for a period counted backward the date of the later event (trial, a hearing, the scheduling conference). For a removal row, the date of receipt by the defendant, through service or otherwise, as 28 U.S.C. 1446(b) puts it, never a mailing date plus 3.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "us_party": {
                "description": "FRAP 4(a)(3), 4(a)(4) and 4(a)(5): true when one of the parties is the United States, a United States agency, or an officer or employee in one of the four categories FRAP 4(a)(1)(B) lists, which makes the appeal period 60 days.",
                "type": "boolean"
              }
            },
            "required": ["rule"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82ff0868cc7ca73db5d8eeec2d5845147d504994ce985187aa39fc0a63a259e5"
        },
        {
          "name": "federal_legal_holidays",
          "title": "Federal legal holidays for a year",
          "description": "List the legal holidays for a year under FRCP 6(a)(6) and FRAP 26(a)(6): the eleven days in 5 U.S.C. 6103(a), the Friday observed for a Saturday holiday (5 U.S.C. 6103(b)(1)), the Monday observed for a Sunday holiday (Executive Order 11582), and the days the President closed the executive branch. These are the days a federal deadline rolls off. Each observed or closure day says which reading treats it as a legal holiday and that the point is not settled. State holidays are not applied.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "year": {
                "description": "Four-digit year, 2024 to 2030.",
                "maximum": 2030,
                "minimum": 2024,
                "type": "integer"
              }
            },
            "required": ["year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3a06179e246848c3e3e0ed0e52bc466ef73a211b365e7adcdd4ea903f02c546"
        },
        {
          "name": "federal_local_deadline",
          "title": "Deadline under a district court's local rules",
          "description": "Compute a deadline a federal district court's own local rules set, for the districts whose local rules this site applies: a motion, an opposition or a reply counted back from the hearing date, and the court's other periods the rules fix. Give the rule as the court's own citation or a row id; rule \"list\" returns the district's rows and the date each counts from. Counts under FRCP 6(a) and the court's computation rule, applies the days the court's posted schedule closes it and the court's own mail rule, and returns the due date under the prevailing reading with the earliest and latest dates where the readings differ, the federal date a local rule replaces, the time of day where the rule sets one, the court's notes, the rule text and the countersign status. A district this site does not cover returns the districts it does.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "district": {
                "description": "Required. The CM/ECF id of the district court, such as \"casd\". Only districts whose local rules this site applies are accepted; any other id returns the list of those that are.",
                "type": "string"
              },
              "rule": {
                "description": "Required. The row to compute: a row id from the list, the court's own citation as its local rules print it (for example \"CivLR 7.1.e.1\"), matched without regard to case, or \"list\" for every row this site computes for the district. A citation that names more than one row returns those rows and computes nothing; an unknown one returns the district's citations.",
                "type": "string"
              },
              "schedule": {
                "description": "Optional. true returns every paper of the briefing schedule the row belongs to, for the one hearing date in trigger_date, with the dates under FRCP 6(c) alone beside them.",
                "type": "boolean"
              },
              "second_trigger_date": {
                "description": "Only on a row that asks for a second date (the list says which): the other date of a row that takes the later of two periods, or the date a federal rule's own period counts from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_method": {
                "description": "How the paper was served, under FRCP 5(b)(2), on a row whose date depends on it (the list says which). A local rule's own extra days for mail, or Rule 6(d)'s 3 days, are added only where that rule reaches the row and the method calls for it: 5b2C-mail = Mail (Rule 5(b)(2)(C)); 5b2D-clerk = Leaving it with the clerk (Rule 5(b)(2)(D)); 5b2F-consented-other = Other means you consented to in writing (Rule 5(b)(2)(F)); 5b2E-electronic = The court's electronic-filing system or other consented electronic means (Rule 5(b)(2)(E)): adds nothing; 5b2A-handing = Handing it to the person (Rule 5(b)(2)(A)): adds nothing; 5b2B-leaving = Leaving it at the office or home (Rule 5(b)(2)(B)): adds nothing.",
                "enum": ["5b2C-mail", "5b2D-clerk", "5b2F-consented-other", "5b2E-electronic", "5b2A-handing", "5b2B-leaving"],
                "type": "string"
              },
              "trigger_date": {
                "description": "Required unless rule is \"list\". The date the row counts from, in the row's own words (the list gives them): for a motion, opposition or reply, the hearing date; for an earliest-hearing row, the date the papers will be filed.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["district", "rule"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:032f01994fdd63b38991aeb48ae1ee21a5bd519b243b12b4851c8e88c62405a0"
        }
