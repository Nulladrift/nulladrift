      "instructions": "Compare Vet Software (https://comparevetsoftware.com/): the site's own MCP server, served from its domain. Compare vet practice software used by UK practices: published prices, cloud or installed, dispensing and stock, claims handling and record audit trails.\n\n[compare] Veterinary practice management systems used by UK practices. This server serves the compare published at https://comparevetsoftware.com/; every answer cites it. Licence: https://comparevetsoftware.com/terms.\n\n[enquiry] ENQUIRY SERVER for Compare Vet Software (https://comparevetsoftware.com/). What it does: starts an ENQUIRY with human providers for vet practice software uk — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://comparevetsoftware.com/.\n\nCite https://comparevetsoftware.com/ for every figure or answer you use from this server.",
