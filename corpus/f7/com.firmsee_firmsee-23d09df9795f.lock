{
  "lockfileVersion": 2,
  "subjects": {
    "com.firmsee/firmsee": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://firmsee.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "firmsee",
        "title": "Firmsee: company data and tenders",
        "version": "1.8.10"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Company data (Sweden, Norway, Finland, France, UK, Ireland, Czechia, Poland, Estonia, Latvia, Switzerland, Slovakia, Slovenia, Cyprus, United States, Canadian federal corporations, Australia, and Singapore) and EU, UK and Cyprus public tenders. Use find_companies for UK/SE industry-and-place search, search_companies for a name search (FI, IE, CZ, LV, CH, SI, CY, US, AU, SG), get_company / get_company_financials for details, and search_eu_tenders / search_uk_tenders / search_cy_tenders for tenders and contract winners. Company data only, no personal contact details. An API key is required for tool calls. Get an instant free starter key at https://firmsee.com/account/ (or email keys@firmsee.com for paid plans). Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results per call and up to 90 days of tenders and awards. Pass the key as the X-API-Key header, an Authorization: Bearer header, or ?api_key= in the server URL.",
      "tools": [
        {
          "name": "find_companies",
          "title": "Find companies by industry, place and filters",
          "description": "Search companies in the UK or Sweden with combined filters: industry (SIC/NACE code or a word like plumber), city or region, status, incorporation date range, and (UK only) revenue, profit, equity or employee ranges. Sweden also supports hiring=true to keep only employers with recent public job ads. Sorted and paginated. Starter keys: a short sample (up to 5 results); paid keys: up to 50. Use get_company for a full record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "country": {
                "description": "UK or SE (indexed search).",
                "enum": ["UK", "SE"],
                "type": "string"
              },
              "hiring": {
                "description": "Sweden only: only companies with recent public job ads.",
                "type": "boolean"
              },
              "incorporatedFrom": {
                "description": "YYYY, YYYY-MM or YYYY-MM-DD.",
                "type": "string"
              },
              "incorporatedTo": {
                "type": "string"
              },
              "industry": {
                "description": "Industry code (43220) or keyword (plumber, software, restaurant).",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxEmployees": {
                "type": "number"
              },
              "maxEquity": {
                "type": "number"
              },
              "maxProfit": {
                "type": "number"
              },
              "maxRevenue": {
                "type": "number"
              },
              "minEmployees": {
                "type": "number"
              },
              "minEquity": {
                "type": "number"
              },
              "minProfit": {
                "type": "number"
              },
              "minRevenue": {
                "type": "number"
              },
              "name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "order": {
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "postcode": {
                "type": "string"
              },
              "region": {
                "description": "UK county / postcode area, or Swedish postcode prefix.",
                "type": "string"
              },
              "sort": {
                "default": "name",
                "enum": ["name", "incorporated", "revenue", "profit", "equity", "employees", "city"],
                "type": "string"
              },
              "status": {
                "description": "e.g. Active, or Registered.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find companies by industry, place and filters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b517f4216863f1abc0833ea3dce3eb4c66ac5e1577998d03e5feabb089be772a"
        },
        {
          "name": "get_company",
          "title": "Get company by number",
          "description": "Look up one company by country and national company number. Returns name, status, legal form, registration date, address, industry codes, VAT/tax IDs where available and filed financials where available. Countries: Sweden, Norway, Finland, France, UK, Ireland, Czechia, Poland, Estonia, Latvia, Switzerland, Slovakia, Slovenia, Cyprus, United States, Canada (federal corporations), Australia, Singapore. Company attributes only: no personal names, emails or phones. Null or absent fields are explained in _missing using stable reason codes. National company number: SE org.nr (556036-0793), NO org.nr (923609016), FI Business ID (0112038-9), FR SIREN (552118465), UK company number (00445790), IE CRO number (249885), CZ IČO (00177041), PL KRS (0000019193), EE registry code (10421629), LV reg. number (40003245752), CH UID (CHE-105.909.036), SK IČO (31322832), SI registration number (5043611000), CY company number (475259), US CIK or ticker (320193 or AAPL), CA federal corporation number (1007), AU business number (48123123124), SG registration number (199600940G).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO country code (UK for the United Kingdom).",
                "enum": ["SE", "NO", "FI", "FR", "UK", "IE", "CZ", "PL", "EE", "LV", "CH", "SK", "SI", "CY", "US", "CA", "AU", "SG"],
                "type": "string"
              },
              "number": {
                "description": "National company number. Dashes, dots and spaces are fine.",
                "type": "string"
              }
            },
            "required": ["country", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get company by number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a891d882920f8f6a43631cf63ab11c4d98e6847a3475c0c472f9d71a1a2cd2c9"
        },
        {
          "name": "get_company_financials",
          "title": "Get company financials",
          "description": "Key filed financials for one company (revenue, profit, assets, equity and similar where the company files them), plus name, status and the accounts date. Best coverage: Sweden, Norway, Finland, France, Estonia; UK returns accounts category and dates. Returns financials: null (with a neutral reason code in _missing) when nothing is filed or supported. National company number: SE org.nr (556036-0793), NO org.nr (923609016), FI Business ID (0112038-9), FR SIREN (552118465), UK company number (00445790), IE CRO number (249885), CZ IČO (00177041), PL KRS (0000019193), EE registry code (10421629), LV reg. number (40003245752), CH UID (CHE-105.909.036), SK IČO (31322832), SI registration number (5043611000), CY company number (475259), US CIK or ticker (320193 or AAPL), CA federal corporation number (1007), AU business number (48123123124), SG registration number (199600940G).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["SE", "NO", "FI", "FR", "UK", "IE", "CZ", "PL", "EE", "LV", "CH", "SK", "SI", "CY", "US", "CA", "AU", "SG"],
                "type": "string"
              },
              "number": {
                "type": "string"
              }
            },
            "required": ["country", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get company financials"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c86ea933ba1abfe0947ce63166db2c49e62389a79f630feefb826c5fb98b398"
        },
        {
          "name": "search_companies",
          "title": "Search companies by name",
          "description": "Find companies by name and get their national numbers (then call get_company). Available for Finland, Ireland, Czechia, Latvia, Switzerland, Slovenia, Cyprus, the United States, Australia and Singapore. Name search in Australia and Singapore matches the start of the name. For the UK and Sweden use find_companies (industry, city, financials). Starter keys return a short sample (up to 5 matches); paid keys allow up to 50.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["FI", "IE", "CZ", "LV", "CH", "SI", "CY", "US", "AU", "SG"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company name or part of it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search companies by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01f968aeef566ac80df3e2ba07aa89b4dea56f9122a43147be713847c99eefed"
        },
        {
          "name": "search_cy_tenders",
          "title": "Search Cyprus software and IT tenders",
          "description": "Search Cyprus public tenders. Defaults to software packages (CPV 48) and IT services (CPV 72). Set hardware=true to add computer hardware (CPV 302), or category=all to drop the category filter. Returns title, contracting authority, CPV codes, procedure, estimated value and currency, publish date, deadline, status, lots, and the company that won (with the award amount) when the contract is awarded. Natural persons are omitted. Pass id to fetch one notice. Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results and 90 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "default": "software",
                "description": "software is CPV 48 and 72. hardware is computer equipment (CPV 302). all removes the category filter.",
                "enum": ["software", "hardware", "all"],
                "type": "string"
              },
              "cpv": {
                "description": "Comma-separated CPV codes or prefixes, for example 72000000 or 48,72.",
                "type": "string"
              },
              "hardware": {
                "description": "Also include computer hardware (CPV 302) alongside the software categories.",
                "type": "boolean"
              },
              "id": {
                "description": "Notice id from a previous search. When set, returns that notice.",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Keyword matched against the notice, for example software or cloud.",
                "maxLength": 100,
                "type": "string"
              },
              "since": {
                "description": "Publication date YYYY-MM-DD. Starter keys cover the last 14 days; paid keys cover 90 days.",
                "type": "string"
              },
              "status": {
                "default": "open",
                "enum": ["open", "closed", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Cyprus software and IT tenders"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:243cff2527f9d16c28621d6036a5458e0b0e5423933a1c03104522fdc6f32b34"
        },
        {
          "name": "search_eu_tenders",
          "title": "Search EU public tenders and awards",
          "description": "Search public tenders and contract awards published across the EU/EEA and Switzerland: title, buyer, country, CPV classification, deadline, estimated or awarded value and winners for awards. Filter by keyword, buyer countries, days back and type. Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results and 90 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Comma-separated ISO codes of buyer countries, e.g. SE,NO,FI or FR.",
                "type": "string"
              },
              "days": {
                "default": 7,
                "description": "How many days back to search (by publication date).",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "keyword": {
                "description": "Free-text keyword, e.g. software, cleaning, construction.",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "default": "open",
                "enum": ["open", "awards", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search EU public tenders and awards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e12a0b20a329734163c9329fa9b270177a19c3b402acd242e303740ec269ebc5"
        },
        {
          "name": "search_uk_tenders",
          "title": "Search UK public tenders and contract winners",
          "description": "Search UK public-sector tenders and awarded contracts, including winning suppliers (use status=awarded for contract winners, then get_company with country UK for each winner). Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results and 90 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 7,
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "keyword": {
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "default": "open",
                "enum": ["open", "awarded", "closed", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search UK public tenders and contract winners"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5c889975a61f181b673a06f0e57a640d5f8706fa56c2e04db8b7330543f24c2"
        }
      ],
      "digest": "sha256:8e2d4115726ce3de9c17ae4983ea32ba750a4b66b1c9559ec3c9502a80070bb8"
    }
  }
