{
  "lockfileVersion": 2,
  "subjects": {
    "com.firmsee/firmsee": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://firmsee.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nordic-data-tools",
        "title": "Nordic Data Tools: European company data and tenders",
        "version": "1.8.6"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "European company data (Sweden, Norway, Finland, France, UK, Ireland, Czechia, Poland, Estonia, Latvia, Switzerland, Slovakia, Slovenia, Cyprus) and EU/UK public tenders. Use find_companies for UK/SE industry-and-place search, search_companies for a name search (FI, IE, CZ, LV, CH, SI, CY), get_company / get_company_financials for details, and search_eu_tenders / search_uk_tenders for tenders and contract winners. Company data only, no personal contact details. An API key is required for tool calls. Get an instant free starter key at https://firmsee.com/account/ (or email keys@firmsee.com for paid plans). Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results per call and up to 90 days of tenders and awards. Pass the key as the X-API-Key header, an Authorization: Bearer header, or ?api_key= in the server URL.",
      "tools": [
        {
          "name": "find_companies",
          "title": "Find companies by industry, place and filters",
          "description": "Search companies in the UK or Sweden with combined filters: industry (SIC/NACE code or a word like plumber), city or region, status, incorporation date range, and (UK only) revenue, profit, equity or employee ranges. Sweden also supports hiring=true to keep only employers with recent public job ads. Sorted and paginated. Starter keys: a short sample (up to 5 results); paid keys: up to 50. Use get_company for a full record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "country": {
                "description": "UK or SE (indexed search).",
                "enum": ["UK", "SE"],
                "type": "string"
              },
              "hiring": {
                "description": "Sweden only: only companies with recent public job ads.",
                "type": "boolean"
              },
              "incorporatedFrom": {
                "description": "YYYY, YYYY-MM or YYYY-MM-DD.",
                "type": "string"
              },
              "incorporatedTo": {
                "type": "string"
              },
              "industry": {
                "description": "Industry code (43220) or keyword (plumber, software, restaurant).",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxEmployees": {
                "type": "number"
              },
              "maxEquity": {
                "type": "number"
              },
              "maxProfit": {
                "type": "number"
              },
              "maxRevenue": {
                "type": "number"
              },
              "minEmployees": {
                "type": "number"
              },
              "minEquity": {
                "type": "number"
              },
              "minProfit": {
                "type": "number"
              },
              "minRevenue": {
                "type": "number"
              },
              "name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "order": {
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "postcode": {
                "type": "string"
              },
              "region": {
                "description": "UK county / postcode area, or Swedish postcode prefix.",
                "type": "string"
              },
              "sort": {
                "default": "name",
                "enum": ["name", "incorporated", "revenue", "profit", "equity", "employees", "city"],
                "type": "string"
              },
              "status": {
                "description": "e.g. Active, or Registered.",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find companies by industry, place and filters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b517f4216863f1abc0833ea3dce3eb4c66ac5e1577998d03e5feabb089be772a"
        },
        {
          "name": "get_company",
          "title": "Get company by number",
          "description": "Look up one European company by country and national company number. Returns name, status, legal form, registration date, address, industry codes, VAT/tax IDs where available and filed financials where available. Countries: Sweden, Norway, Finland, France, UK, Ireland, Czechia, Poland, Estonia, Latvia, Switzerland, Slovakia, Slovenia, Cyprus. Company attributes only: no personal names, emails or phones. Null or absent fields are explained in _missing using stable reason codes. National company number: SE org.nr (556036-0793), NO org.nr (923609016), FI Business ID (0112038-9), FR SIREN (552118465), UK company number (00445790), IE CRO number (249885), CZ IČO (00177041), PL KRS (0000019193), EE registry code (10421629), LV reg. number (40003245752), CH UID (CHE-105.909.036), SK IČO (31322832), SI registration number (5043611000), CY company number (475259).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO country code (UK for the United Kingdom).",
                "enum": ["SE", "NO", "FI", "FR", "UK", "IE", "CZ", "PL", "EE", "LV", "CH", "SK", "SI", "CY"],
                "type": "string"
              },
              "number": {
                "description": "National company number. Dashes, dots and spaces are fine.",
                "type": "string"
              }
            },
            "required": ["country", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get company by number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:394bb61d1e532e2312d6b1ac8c127630569bf400b1c0e5fa9e1033943adb604d"
        },
        {
          "name": "get_company_financials",
          "title": "Get company financials",
          "description": "Key filed financials for one company (revenue, profit, assets, equity and similar where the company files them), plus name, status and the accounts date. Best coverage: Sweden, Norway, Finland, France, Estonia; UK returns accounts category and dates. Returns financials: null (with a neutral reason code in _missing) when nothing is filed or supported. National company number: SE org.nr (556036-0793), NO org.nr (923609016), FI Business ID (0112038-9), FR SIREN (552118465), UK company number (00445790), IE CRO number (249885), CZ IČO (00177041), PL KRS (0000019193), EE registry code (10421629), LV reg. number (40003245752), CH UID (CHE-105.909.036), SK IČO (31322832), SI registration number (5043611000), CY company number (475259).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["SE", "NO", "FI", "FR", "UK", "IE", "CZ", "PL", "EE", "LV", "CH", "SK", "SI", "CY"],
                "type": "string"
              },
              "number": {
                "type": "string"
              }
            },
            "required": ["country", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get company financials"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c7cabab815bd75aed9f8a81d8a7b979470911166bc7e309d6a95cd59853a9511"
        },
        {
          "name": "search_companies",
          "title": "Search companies by name",
          "description": "Find companies by name and get their national numbers (then call get_company). Available for Finland, Ireland, Czechia, Latvia, Switzerland, Slovenia and Cyprus. For the UK and Sweden use find_companies (industry, city, financials). Starter keys return a short sample (up to 5 matches); paid keys allow up to 50.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["FI", "IE", "CZ", "LV", "CH", "SI", "CY"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Company name or part of it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search companies by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8e03b7c5a31906cdf95c80341f36fb501200aa8d4f3490c342938d03ce265743"
        },
        {
          "name": "search_eu_tenders",
          "title": "Search EU public tenders and awards",
          "description": "Search public tenders and contract awards published across the EU/EEA and Switzerland: title, buyer, country, CPV classification, deadline, estimated or awarded value and winners for awards. Filter by keyword, buyer countries, days back and type. Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results and 90 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Comma-separated ISO codes of buyer countries, e.g. SE,NO,FI or FR.",
                "type": "string"
              },
              "days": {
                "default": 7,
                "description": "How many days back to search (by publication date).",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "keyword": {
                "description": "Free-text keyword, e.g. software, cleaning, construction.",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "default": "open",
                "enum": ["open", "awards", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search EU public tenders and awards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e12a0b20a329734163c9329fa9b270177a19c3b402acd242e303740ec269ebc5"
        },
        {
          "name": "search_uk_tenders",
          "title": "Search UK public tenders and contract winners",
          "description": "Search UK public-sector tenders and awarded contracts, including winning suppliers (use status=awarded for contract winners, then get_company with country UK for each winner). Starter keys return a short sample (up to 5 results, last 14 days); paid keys allow up to 50 results and 90 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 7,
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "keyword": {
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "default": "open",
                "enum": ["open", "awarded", "closed", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search UK public tenders and contract winners"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e5c889975a61f181b673a06f0e57a640d5f8706fa56c2e04db8b7330543f24c2"
        }
      ],
      "digest": "sha256:f4216b9d7e9ec6f0a824a49eae857505cdbcab45a788c0cd467552cede19fea2"
    }
  }
}
