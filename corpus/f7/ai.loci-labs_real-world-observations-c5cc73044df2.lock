{
  "lockfileVersion": 2,
  "subjects": {
    "ai.loci-labs/real-world-observations": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.loci-labs.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "loci-labs-real-world-observations",
        "title": "Loci Labs Real-World Observations",
        "version": "0.1.0",
        "description": "Provides fresh, human-observable information about physical places and real-world conditions when normal online information may be unavailable, stale, or uncertain.",
        "websiteUrl": "https://mcp.loci-labs.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Loci Labs answers questions about current physical-world conditions (crowds, lines, closures, construction, weather effects, availability, accessibility) that may be stale or missing online. During the current preview, requests may return that no sufficiently recent observation is available. Do not send personal or sensitive information.",
      "tools": [
        {
          "name": "search_real_world_observations",
          "title": "Search real-world observations",
          "description": "Search for fresh real-world observations about physical places, conditions, availability, crowds, lines, closures, construction, weather effects, events, inventory visible in person, accessibility, or other facts that may be stale, uncertain, or unavailable on the public web. Use this when answering the user's question would benefit from a recent observation made by a person physically present at or near the relevant location.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "Optional extra context that helps interpret the question. Do not include personal or sensitive information.",
                "maxLength": 2000,
                "type": "string"
              },
              "freshness": {
                "description": "How recent the observation needs to be, e.g. \"right now\", \"within 30 minutes\", \"today\", \"within 24 hours\".",
                "maxLength": 100,
                "type": "string"
              },
              "location": {
                "description": "Place name, address, neighborhood, venue, or coordinates written as text. Precision is not required.",
                "maxLength": 300,
                "type": "string"
              },
              "observation_type": {
                "description": "Kind of observation: crowd, condition, availability, closure, construction, weather impact, accessibility, inventory, event status, or other.",
                "maxLength": 100,
                "type": "string"
              },
              "question": {
                "description": "What you want to know, in natural language. Examples: \"Is the playground muddy right now?\", \"How long is the security line?\"",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "request": {
                "additionalProperties": false,
                "properties": {
                  "freshness": {
                    "type": "string"
                  },
                  "location": {
                    "type": "string"
                  },
                  "observation_type": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "status": {
                "enum": ["no_observation_available"],
                "type": "string"
              }
            },
            "required": ["message", "request", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4fca2f06b16a4eceecefb36f87674937f8d05b96ed60b14f8f19e7029d3b8533"
        }
      ],
      "digest": "sha256:2c2ef9e7697d407e5c8aad7ecf097c5d494d722703f9893f8451b24f7434eb91"
    }
  }
}
