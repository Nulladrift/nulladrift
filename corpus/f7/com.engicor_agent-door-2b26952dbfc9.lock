          },
          "digest": "sha256:e9a56392b108f77e0590cdc855d2f5178861476523082891c3ec1d36497a9481"
        },
        {
          "name": "search_stock",
          "title": "Search used engines in stock",
          "description": "Search ENGICOR's used-engine warehouse list (Guangzhou, ~488 engine/gearbox families, 38 makes) by engine code, vehicle model or make. Returns specs, typical vehicles, configurations held, and the wholesale list price where published (FOB Guangzhou, USD per unit). Wholesale only.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Optional make filter, e.g. \"Toyota\"",
                "type": "string"
              },
              "priced_only": {
                "description": "Only models with a published price",
                "type": "boolean"
              },
              "query": {
                "description": "Engine code, vehicle or words, e.g. \"2TR\", \"Hilux\", \"Corolla 1.5\", \"Nissan 1.6\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search used engines in stock"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdaa2792b7d044a8ebb16f2dbfecba9f2aa6dd0f00baed69796f006e61ac3792"
        }
      ],
