            "readOnly": true
          },
          "digest": "sha256:3f2ed15565f436c17e884ce417cbe2d5eec17d87f2a084778c59ab16967d840c"
        },
        {
          "name": "get_terms",
          "title": "Trade terms",
          "description": "ENGICOR's trade terms: what is sold and how engines are checked, order formats and minimums, payment (30% / 70%, T/T), what is not covered, warranty, markets served, inspection visit, contacts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trade terms"
          },
          "behavior": {
            "destructive": false,
