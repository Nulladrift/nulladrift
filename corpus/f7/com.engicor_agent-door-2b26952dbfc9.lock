            "readOnly": true
          },
          "digest": "sha256:e6abf0fd17cec77c0e1f7af1d6404953f2329eff4fecba426ce20830ac26c659"
        },
        {
          "name": "request_quote",
          "title": "Request a formal quotation",
          "description": "Register a quotation request with ENGICOR on behalf of the buyer. Priced models get an estimated FOB quotation (valid 14 days) with a reference and a quotation link; models without a published price are registered for manual pricing. A human sales person confirms availability and sends the written Proforma Invoice within one business day. Nothing is payable or binding at this step. It registers the buyer's contact details with ENGICOR.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Who is calling",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "platform": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "buyer": {
                "description": "The buyer ENGICOR will send the Proforma Invoice to. Give email or phone.",
                "properties": {
                  "company": {
                    "type": "string"
                  },
                  "country": {
                    "description": "Destination country",
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "name": {
                    "description": "Contact person",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone or WhatsApp with country code, e.g. +234 803 000 0000",
                    "type": "string"
                  }
                },
                "required": ["country", "name"],
                "type": "object"
              },
              "destination_port": {
                "description": "e.g. Lagos (Apapa), Mombasa, Jebel Ali",
                "type": "string"
              },
              "lines": {
                "description": "Engine codes (e.g. \"1NZ-FE\", \"HR16DE\") and gearbox SKUs (e.g. \"TR-HR16DE-CVT\") with quantities.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["code", "quantity"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "maxLength": 600,
                "type": "string"
              },
              "order_type": {
                "description": "first_order = new customer, 20/30/40 engines (+ optional gearboxes), LCL. container_20ft = 90 engines or 45+45 gearboxes. container_40ft = 130 engines or 65+65.",
                "enum": ["first_order", "container_20ft", "container_40ft"],
                "type": "string"
              },
              "purchase_preference": {
                "description": "remote = buy with photos/video; visit = Guangzhou Inspection Day; help = help me choose",
                "enum": ["remote", "visit", "help"],
                "type": "string"
              }
            },
            "required": ["buyer", "lines", "order_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a formal quotation"
          },
          "behavior": {
            "destructive": false,
