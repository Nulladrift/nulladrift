          "digest": "sha256:7208caafaa461a6e28de88fa33530eca5ff2f808ca8b613cfca7c56fa6c21082"
        },
        {
          "name": "get_price_list",
          "title": "Published wholesale price list",
          "description": "The models with a published wholesale list price (USD per unit, FOB Guangzhou, Grade A used engines) and their gearbox options. Same price for first orders and full containers.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
