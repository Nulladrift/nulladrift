      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "engicor-agent-door",
        "title": "ENGICOR — wholesale used engines",
        "version": "1.0.0",
        "websiteUrl": "https://engicor.com/agents/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ENGICOR is a UAE-based B2B wholesaler of used Grade A engines shipped by sea from Guangzhou, China. Wholesale only: full containers (20-ft: 90 engines or 45+45 gearboxes; 40-ft: 130 or 65+65) or, for a new customer's first order, 20, 30 or 40 engines. Prices are USD per unit FOB Guangzhou. Typical flow: search_stock or get_price_list → estimate_order → (with the buyer's consent) request_quote. A human confirms every quotation and issues the Proforma Invoice; never tell the buyer to pay before receiving it. Used engines, no warranty; the check is a manual crankshaft rotation plus photos, not a running test. Iran is not served.",
      "tools": [
        {
          "name": "estimate_order",
          "title": "Price an order (no commitment)",
          "description": "Validate an order against ENGICOR's order formats and compute the FOB total and the 30/70 payment split at published list prices. Nothing is registered.",
          "inputSchema": {
            "properties": {
              "lines": {
                "description": "Engine codes (e.g. \"1NZ-FE\", \"HR16DE\") and gearbox SKUs (e.g. \"TR-HR16DE-CVT\") with quantities.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 500,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["code", "quantity"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "order_type": {
                "description": "first_order = new customer, 20/30/40 engines (+ optional gearboxes), LCL. container_20ft = 90 engines or 45+45 gearboxes. container_40ft = 130 engines or 65+65.",
                "enum": ["first_order", "container_20ft", "container_40ft"],
                "type": "string"
              }
            },
            "required": ["lines", "order_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price an order (no commitment)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3a95ac42e74af530ce15f28d43aa48117d75c948c24b035e653b688edf0c99f"
        },
        {
          "name": "get_engine",
          "title": "Engine family detail",
          "description": "Full detail of one engine family by code (e.g. \"1NZ-FE\", \"QR25DE\", \"2TR-FE\"): spec, typical vehicles, configurations held, list price and gearbox options if published, page and photo URLs.",
          "inputSchema": {
            "properties": {
              "code": {
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Engine family detail"
          },
          "behavior": {
