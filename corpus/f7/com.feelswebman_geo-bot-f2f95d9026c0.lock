      "serverInfo": {
        "name": "geo-bot",
        "title": "GEO-bot",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "One free tool, check_ai_readiness(domain): is a website technically open to AI assistants (robots.txt for AI crawlers, llms.txt, title/description, JSON-LD). It does not measure whether AI assistants recommend the brand.",
      "tools": [
        {
          "name": "check_ai_readiness",
          "title": "Check AI readiness of a website",
          "description": "Checks whether a website is technically open to AI assistants: robots.txt rules for 9 AI crawlers (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-SearchBot, Claude-User, PerplexityBot, Google-Extended, CCBot), presence of llms.txt, and on the home page the title, meta description and JSON-LD (Organization/LocalBusiness). Free, read-only, takes a few seconds. It does NOT measure whether any AI assistant actually recommends the brand (that is what the paid GEO-bot check does) and it only looks at the home page, robots.txt and llms.txt.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain or URL of the website, e.g. \"example.com\".",
                "type": "string"
              },
              "language": {
                "description": "Language of the report. Default \"en\".",
                "enum": ["en", "de"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
