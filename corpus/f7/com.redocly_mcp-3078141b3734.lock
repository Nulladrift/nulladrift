        "url": "https://redocly.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Redocly",
        "version": "1.0.0-next.2",
        "description": "Tools for the documentation at https://redocly.com.",
        "websiteUrl": "https://redocly.com"
      },
      "capabilities": {
        "logging": {},
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for the documentation at https://redocly.com. Use them to answer questions about the content of these docs.\n- `discover` returns the exact TypeScript signatures of the sandbox functions.\n- `execute` runs a JavaScript script that calls those functions on the global `site` object.\nWorkflow: analyze the request, call `discover` once with `names` set to only the functions it needs, then batch everything into a single `execute` script. Minimize round-trips and never guess function signatures.\n\nFunctions for `execute` scripts (signatures come from `discover`):\n- listApis — List the available APIs.\n- getEndpoints — Get all endpoints for an API.\n- getEndpointInfo — Get the details of an endpoint.\n- getSecuritySchemes — Get the security schemes for an API.\n- getFullApiDescription — Get the complete OpenAPI description.\n- search — Search the documentation.\n- listPages — List the docs navigation, one level per call.\n- getPage — Read a docs page as Markdown, in line windows.\n- grepPages — Find the docs lines that contain a text.",
      "tools": [
        {
          "name": "discover",
          "title": "Get docs function signatures",
          "description": "Get the exact TypeScript signatures of the sandbox functions that `execute` scripts can call.\nAnalyze the user request first, then pass `names` with only the functions the request needs (every name is listed in this input schema / description); omit `names` only when you cannot tell which functions apply.\nAlways call this before your first `execute` and never guess signatures. Request every function the task may need in ONE call instead of calling this repeatedly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "description": "Names of the sandbox functions to discover: listApis, getEndpoints, getEndpointInfo, getSecuritySchemes, getFullApiDescription, search, listPages, getPage, grepPages. Omit to discover all of them.",
                "items": {
                  "enum": ["listApis", "getEndpoints", "getEndpointInfo", "getSecuritySchemes", "getFullApiDescription", "search", "listPages", "getPage", "grepPages"],
                  "type": "string"
                },
                "nullable": true,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get docs function signatures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:387ec3ec5c4a543c7236c97dea1b49884146fee07f2fe7e845e38885ba5fb2a0"
        },
        {
          "name": "execute",
          "title": "Query the docs with code",
          "description": "Run plain JavaScript (no TypeScript syntax) in a sandbox against the documentation at https://redocly.com. The script calls the sandbox functions on the global `site` object.\nThe only extra global is `site` - there is no `fetch`, `console`, `setTimeout`, `require`, or Node.js API; all I/O goes through `site`.\n\nWorkflow - minimize round-trips; one `discover` call plus one `execute` call covers most requests:\n1. Analyze the request and decide which sandbox functions it needs.\n2. Call `discover` with those names to get their exact TypeScript signatures - inputs, result shapes, and a worked example. NEVER call `execute` with guessed function names, parameter names, enum values, or result field names: read fields off the declared return types, not from assumptions.\n3. Batch everything into a SINGLE script: chain function calls, pass one call's output into the next, process results in plain JavaScript, and `return` only what the request needs.\n\nFunctions for `execute` scripts (signatures come from `discover`):\n- listApis — List the available APIs.\n- getEndpoints — Get all endpoints for an API.\n- getEndpointInfo — Get the details of an endpoint.\n- getSecuritySchemes — Get the security schemes for an API.\n- getFullApiDescription — Get the complete OpenAPI description.\n- search — Search the documentation.\n- listPages — List the docs navigation, one level per call.\n- getPage — Read a docs page as Markdown, in line windows.\n- grepPages — Find the docs lines that contain a text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "JavaScript to run in the sandbox. Return a value to receive it as the result.",
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "A short, human-readable summary of what this code does.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["code", "description"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "description": "Why the code failed. Set only on a failed call",
                "type": "string"
              },
              "result": {
                "description": "The value the code returned, as JSON"
              },
              "sentFetches": {
                "description": "Every `fetch` request that reached an API before the failure, with its status; running the code again sends them again. Set only on a failed call",
                "items": {
                  "properties": {
                    "method": {
                      "type": "string"
                    },
                    "status": {
                      "description": "Unset when no response arrived",
                      "type": "number"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query the docs with code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a686d985b21ceb32a8ed3148971a95b4816390ce25aa45ef70f37c0c04b3c22"
        },
        {
          "name": "submit-feedback",
          "title": "Submit feedback",
          "description": "Report a documentation page that is wrong or incomplete. Use it when the user reports a problem with a page on this site, or agrees to report a problem that you found. Do not use it for product bugs or support questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "details": {
                "description": "Expected versus actual behavior, missing steps, or the snippet that failed",
                "maxLength": 4000,
                "nullable": true,
                "type": "string"
              },
              "path": {
                "description": "Path or URL of the documentation page the feedback is about (e.g. /guides/auth)",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "summary": {
                "description": "One sentence that names what is wrong with the page",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "targetFeature": {
                "description": "The API or feature the page documents",
                "maxLength": 500,
                "nullable": true,
                "type": "string"
              }
            },
            "required": ["path", "summary"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["message", "page", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8153bc4ad13585ba4269aa65db82e0a5db495be43f3db3e15730fd8fa5b5809"
        }
      ],
      "resources": [
        {
