            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "creator_curve_buy_fraction": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "ticker": {
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              },
              "tier": {
                "enum": ["checklist", "standard", "premium"],
                "type": "string"
              },
              "website": {
                "maxLength": 200,
                "type": "string"
              },
              "whole_token_supply": {
                "minimum": 100000,
                "type": "integer"
              }
