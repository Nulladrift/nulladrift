            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "creator_curve_buy_fraction": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
