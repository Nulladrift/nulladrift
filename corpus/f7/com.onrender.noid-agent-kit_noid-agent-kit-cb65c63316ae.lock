              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "ticker": {
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              },
              "tier": {
                "enum": ["checklist", "standard", "premium"],
                "type": "string"
