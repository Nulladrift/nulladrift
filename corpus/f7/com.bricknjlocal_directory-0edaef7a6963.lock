        },
        {
          "name": "check_availability",
          "title": "Check open times",
          "description": "Open times for a business that has can_book, read live from its calendar. start_date (YYYY-MM-DD) and days (1-30) narrow the range. Times are ISO 8601 in the business's time zone; pass one back unchanged to book_appointment.",
          "inputSchema": {
            "properties": {
              "business_id": {
                "title": "Business Id",
                "type": "string"
              },
              "days": {
                "default": 14,
                "title": "Days",
                "type": "integer"
              },
              "start_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Start Date"
              }
            },
            "required": ["business_id"],
            "title": "check_availabilityArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
