            "readOnly": true
          },
          "digest": "sha256:f01cb409542092f2f0bb0663c3e40fa178dd2679678c06f4206fefcd196bc6ba"
        },
        {
          "name": "contact_business",
          "title": "Message a business",
          "description": "Send a question, quote request or callback request to a business that has can_contact (kinds it takes are in get_business). The business gets the message and the person's name, email and phone (phone required for callbacks) and replies to them directly. Confirm the message and details with the person first, then call with confirmed=true.",
          "inputSchema": {
            "properties": {
              "business_id": {
                "title": "Business Id",
                "type": "string"
              },
              "confirmed": {
                "default": false,
                "title": "Confirmed",
                "type": "boolean"
              },
              "email": {
                "title": "Email",
                "type": "string"
              },
              "first_name": {
                "title": "First Name",
                "type": "string"
              },
              "kind": {
                "default": "question",
                "title": "Kind",
                "type": "string"
              },
              "last_name": {
                "default": "",
                "title": "Last Name",
                "type": "string"
              },
              "message": {
                "title": "Message",
                "type": "string"
              },
              "phone": {
                "default": "",
