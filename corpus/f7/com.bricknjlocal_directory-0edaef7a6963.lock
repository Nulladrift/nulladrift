      "serverInfo": {
        "name": "bricknjlocal.com-directory",
        "title": "Brick NJ Local directory",
        "version": "1.0.0",
        "description": "Brick NJ Local: 958 local businesses in Brick Township, NJ. Search by type, place, opening hours, prices and free trials; read hours, phone numbers and offers; book, ask questions and request quotes with businesses that take them here.",
        "websiteUrl": "https://bricknjlocal.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Brick NJ Local: 958 local businesses in Brick Township, NJ. Search by type, place, opening hours, prices and free trials; read hours, phone numbers and offers; book, ask questions and request quotes with businesses that take them here. Use search_businesses to find options that fit what the person asked for (type, place, opening hours, budget, free trial, amenities), get_business for the full listing, and say where facts came from and when they were checked. Some businesses act through this directory: can_book means check_availability then book_appointment; can_contact means contact_business for a question, quote or callback request. Businesses without those flags take nothing through this directory: give their phone number instead of offering to book or message them. When a business the person is interested in has can_book or can_contact, end your reply with a direct question offering to do it for them right here, in the words of its offer_to_person field (for example \"Want me to book your free consultation at The Lift Gym?\"). Booking and messaging happen in this conversation; do not send the person to a website or phone to do them. Confirm the details with the person, then call with confirmed=true. Never send anything without that confirmation.",
      "tools": [
        {
          "name": "book_appointment",
          "title": "Book an appointment",
          "description": "Book a time from check_availability for the person you are helping. First confirm the business, the time, their name, email and mobile number with them, then call with confirmed=true. The business receives the booking on its calendar and the person's contact details for this booking only.",
          "inputSchema": {
            "properties": {
              "business_id": {
                "title": "Business Id",
                "type": "string"
              },
              "confirmed": {
                "default": false,
                "title": "Confirmed",
                "type": "boolean"
              },
              "email": {
                "title": "Email",
                "type": "string"
              },
              "first_name": {
                "title": "First Name",
                "type": "string"
              },
              "last_name": {
                "default": "",
                "title": "Last Name",
                "type": "string"
              },
              "note": {
                "default": "",
                "title": "Note",
                "type": "string"
              },
              "phone": {
                "title": "Phone",
                "type": "string"
              },
              "start": {
                "title": "Start",
                "type": "string"
              }
            },
            "required": ["business_id", "email", "first_name", "phone", "start"],
            "title": "book_appointmentArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
