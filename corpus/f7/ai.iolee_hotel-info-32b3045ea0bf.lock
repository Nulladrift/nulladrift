        {
          "name": "elenco_hotel",
          "title": "Elenco degli hotel Iolee",
          "description": "Elenca gli hotel pubblicati sullo sportello Iolee (nome, città, tipo e stelle e appartenenze quando documentate) con il loro identificativo da usare negli altri strumenti. Il campo stelle riporta valore, fonte e stato; se assente, la classificazione non è disponibile. Con un filtro (comune, regione o nome) restituisce anche le strutture non verificate che corrispondono, con soli dati pubblici.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "comune": {
                "description": "Facoltativo: comune o località (anche solo l'inizio). Con almeno un filtro compaiono anche le strutture non verificate.",
                "maxLength": 80,
                "type": "string"
              },
              "limite": {
                "description": "Facoltativo: quante strutture non verificate restituire (massimo 50, predefinito 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "nome": {
                "description": "Facoltativo: parte del nome della struttura (almeno 3 caratteri).",
                "maxLength": 80,
                "type": "string"
              },
              "regione": {
