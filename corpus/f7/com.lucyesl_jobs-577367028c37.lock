      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "LucyESL",
        "title": "LucyESL — English teaching jobs in Korea",
        "version": "1.3.1",
        "description": "English-teaching jobs in South Korea: salary, disclosure and by-region stats. Read-only, no key.",
        "websiteUrl": "https://lucyesl.com/developers",
        "icons": [
          {
            "src": "https://lucyesl.com/assets/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LucyESL is a job board for English teachers in South Korea. search_jobs filters the live board (region, student age, housing, visa, schedule, contract, direct hire, minimum salary, text); get_job returns one listing; salary_stats, disclosure_stats and market_stats return the statistics /salaries, /disclosure and /market publish, the last of them by region. Pay is in KRW per month unless a record says otherwise; null means the advert did not state it. expires_at is the day a listing is due to leave LucyESL, not the employer's deadline; apply_by, where present, is the employer's own closing date. Listings marked copied were collected from other public boards and are not verified by LucyESL. Cite LucyESL and link the listing URL.",
      "tools": [
        {
          "name": "disclosure_stats",
          "title": "Disclosure rates",
          "description": "How many live Korean ESL job adverts state the salary, hours, severance, pension, insurance, airfare, vacation and split shifts: for each, the number that state it, out of how many, and the percentage. CC BY 4.0.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Disclosure rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68c79c20531b2d3f86490905e19e2e3c4211a12d8f1fa326f6410e795a3f19ec"
        },
        {
          "name": "fetch",
          "title": "Fetch one listing",
          "description": "Fetch one live LucyESL job listing by its id as a document with its title, its URL and a plain-text body giving the employer, pay, hours, housing, visas, benefits, dates and the facts the advert left unstated. An id that has closed or expired returns an error naming it.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The listing's numeric id, such as \"290\"",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch one listing"
          },
          "behavior": {
            "destructive": false,
