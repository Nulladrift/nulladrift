            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d486da50598a7caab66eb9a2ff858ae091b5588b474180dd5258adcffb362dcd"
        },
        {
          "name": "get_job",
          "title": "Get one listing as a record",
          "description": "Get one live LucyESL job listing by its numeric id as a structured record: employer and employer type, region, pay in KRW, teaching and on-site hours, housing, visas, benefits, contract length, start date, dates, and the facts the advert left unstated (null means not stated). An id that has closed or expired returns an error naming it.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The listing's numeric id, such as 290",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one listing as a record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e201c166fb96235b661810f733345b22d5389c3b2ee425896c990014ea7482df"
        },
        {
          "name": "market_stats",
          "title": "The job market by region",
          "description": "Live English-teaching job adverts in South Korea counted by region: how many in each, direct hire against recruiters, how many state total on-site hours, and the median advertised salary where the sample allows. Counts of adverts, not of employers. CC BY 4.0.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The job market by region"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85b00952a5defcf3c8040393b71094a3be85e9ebafe667fc0b5e1a609612878d"
        },
        {
          "name": "salary_stats",
          "title": "Salary statistics",
          "description": "English-teacher salary statistics for South Korea computed from the live listings: median, quartiles, by region, by employer type, effective pay per teaching hour, disclosure rates, housing. Each median comes with the number of adverts behind it. CC BY 4.0.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Salary statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3f6e32c19fa47ff1016a553452b86529d86474e2c90760ffb38b39d0e068740"
        },
        {
          "name": "search",
          "title": "Search LucyESL jobs",
          "description": "Search live English-teaching jobs in South Korea on LucyESL with a plain-language query. Words for a region, student age, housing, schedule, visa or direct hire are read as filters. Returns up to 20 matches, each an id, a title with the employer, and the listing URL.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to look for, in plain words, such as \"kindergarten jobs in Seoul with housing\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search LucyESL jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c515d3dbcbcafad4f4dcfa22bbae2ee38c4776b4cd826786f142d4ddc04f823b"
        },
        {
          "name": "search_jobs",
          "title": "Filter the live board",
          "description": "Filter the live LucyESL board of English-teaching jobs in South Korea: region, student age, housing, visa, schedule, contract, setting, direct hire, minimum salary, free text. Returns the number that match and a page of structured records; pay in KRW per month unless stated otherwise; null means the advert did not say.",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Student age group; adults_only means adults and nobody younger",
                "enum": ["kindergarten", "elementary", "middle", "high", "adults", "adults_only"],
                "type": "string"
              },
              "contract": {
                "description": "An employment contract (employee) or a contractor agreement",
                "enum": ["employee", "contractor"],
                "type": "string"
              },
              "delivery": {
                "description": "In person, online or hybrid",
                "enum": ["in_person", "online", "hybrid"],
                "type": "string"
              },
              "direct_only": {
                "description": "Only employers hiring directly (no recruiters or agencies)",
                "type": "boolean"
              },
              "format": {
                "description": "Class shape: group, small group (up to 4) or one to one",
                "enum": ["group", "small_group", "one_to_one"],
                "type": "string"
              },
              "housing": {
                "description": "Housing provided, an allowance instead, or none",
                "enum": ["provided", "allowance", "none"],
                "type": "string"
              },
              "limit": {
                "description": "Records per page: 25 by default, at most 50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_salary": {
                "description": "Minimum monthly pay in KRW; snaps down to the board's steps 2000000, 2300000, 2600000, 3000000",
                "type": "integer"
              },
              "page": {
                "description": "Page of results, from 1",
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Words to match in the title, city or employer name",
                "type": "string"
              },
              "region": {
                "description": "Region of South Korea (gyeonggi includes Incheon)",
                "enum": ["seoul", "gyeonggi", "busan", "daegu", "daejeon", "gwangju", "ulsan", "sejong", "gangwon", "chungcheong", "jeolla", "gyeongsang", "jeju"],
                "type": "string"
              },
              "schedule": {
                "description": "Full-time, part-time, camp or substitute",
                "enum": ["fulltime", "parttime", "camp", "substitute"],
                "type": "string"
              },
              "setting": {
                "description": "Where the teaching happens: the academy, a company, a school or a student's home",
                "enum": ["academy", "corporate", "school", "home"],
                "type": "string"
              },
              "specialty": {
                "description": "What is taught besides general English, such as IELTS, business English or phonics",
                "enum": ["ielts", "toefl", "toeic_opic", "sat_ap", "business", "esp", "phonics", "writing_debate", "subject", "bilingual", "training", "content"],
                "type": "string"
              },
              "visa": {
                "description": "Visa statuses the advert accepts: e2 = E-2 holders, f = F-series visa holders, other = another status or ask; whether the employer sponsors an E-2 is each record's sponsors_e2",
                "enum": ["e2", "f", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Filter the live board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ca4f8ce4ef05a182af1691160bfce094bc888f0d451dc7c82e50f004f560ac4"
        }
      ],
      "digest": "sha256:cb9be3939d8d4992ac41fb4fe295cdb46f45dddc547199be7b0736fca3fb8b46"
    }
  }
