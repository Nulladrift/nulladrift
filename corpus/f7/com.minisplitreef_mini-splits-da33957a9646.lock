{
  "lockfileVersion": 2,
  "subjects": {
    "com.minisplitreef/mini-splits": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://minisplitreef.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mini-split-reef",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Mini Split Reef installs ductless mini split heat pumps in Austin and Central Texas. $2,000 per mini split installed, however many you need. Volume discount for property managers. Use get_pricing and estimate_job for prices, check_coverage for a ZIP or city, get_financing for monthly payments, and request_quote only when the user explicitly asks to be contacted and gives their own phone or email.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check coverage",
          "description": "Whether a ZIP code or city is in the service area, with local housing facts when available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "maxLength": 60,
                "type": "string"
              },
              "zip": {
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:62c9945c01c91f4ef63b48b456f746808e688b6be78607d8f8b262995f55de59"
        },
        {
          "name": "estimate_job",
          "title": "Estimate a mini split job",
          "description": "Installed price for a number of zones (indoor units), with the financing option.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "zones": {
                "description": "Number of rooms / indoor units",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["zones"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e1c966aa064a7289b3952e6a14ac29fd575fe4c34782f9e55a7f4b1239ea9290"
        },
        {
          "name": "get_financing",
          "title": "Financing",
          "description": "Monthly payment for a system price: $2,000 down, 10% APR fixed, 40-50 months, on approved credit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "months": {
                "maximum": 50,
                "minimum": 40,
                "type": "integer"
              },
              "price_usd": {
                "maximum": 60000,
                "minimum": 2500,
                "type": "number"
              }
            },
            "required": ["price_usd"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:148294c2f858219daf594f2346895205c9c8f867b65488bc9d71a6956ca13e26"
        },
        {
          "name": "get_pricing",
          "title": "Posted prices",
          "description": "Mini Split Reef's posted installed prices and what they include.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:98609a390eb4e4427981e9901c88fcab1f2e211d5de10f9a547688cca2a35e97"
        },
        {
          "name": "request_quote",
          "title": "Request a quote",
          "description": "Send a mini split quote request to the crew. Only when the user explicitly asks to be contacted and gives their own phone or email.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "format": "email",
                "maxLength": 120,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "maxLength": 30,
                "type": "string"
              },
              "rooms": {
                "maxLength": 400,
                "type": "string"
              },
              "zip": {
                "maxLength": 10,
                "type": "string"
              },
              "zones": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b2b3e58af7bc5df051e6d22b30db84d80fbf01d67bf590642f30832eb9ab6dfc"
        }
      ],
      "digest": "sha256:db01b0de0358305261702741fce999438882d2fd6302f83032e63ba97c8f7aef"
    }
  }
}
