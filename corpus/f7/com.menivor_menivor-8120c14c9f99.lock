{
  "lockfileVersion": 2,
  "subjects": {
    "com.menivor/menivor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://menivor.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "menivor",
        "title": "Menivor",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Menivor makes short-form vertical video. Use create_reel, or render_html when you already wrote the page, then poll get_job until the job completes. render_html reads the heading and the paragraphs and does not speak text inside a script or style tag. Use generation_quote or list_media_models to check prices first and wallet_balance to check funds. Every call acts as the owner of the API key.",
      "tools": [
        {
          "name": "ad_from_url",
          "title": "Ads from a product URL",
          "description": "Extract a product from a URL and draft ad angles as an Ad Studio project. With render=true, also renders ad variants for every angle in the chosen formats and aspects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspects": {
                "description": "Aspect ratios to render",
                "items": {
                  "enum": ["9:16", "16:9", "1:1"],
                  "type": "string"
                },
                "type": "array"
              },
              "avatar_id": {
                "description": "Avatar presenter id; required for the ugc_avatar format",
                "maxLength": 64,
                "type": "string"
              },
              "formats": {
                "description": "Ad formats to render",
                "items": {
                  "enum": ["showcase", "before_after", "ugc_avatar"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "description": "Ad language code, e.g. en",
                "maxLength": 5,
                "type": "string"
              },
              "render": {
                "description": "Render variants right away (uses credits)",
                "type": "boolean"
              },
              "title": {
                "description": "Optional project title",
                "maxLength": 200,
                "type": "string"
              },
              "url": {
                "description": "Product or landing page URL",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a696124794c648a5049ca9e1cb23fb19deea71655979652415243ceafd6f1e01"
        },
        {
          "name": "create_reel",
          "title": "Create a reel",
          "description": "Start rendering a vertical short-form reel. Uses one reel credit per variant, reserved at start and released if the render fails. Returns job_id; poll it with get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "Output aspect ratio; defaults to 9:16",
                "enum": ["9:16", "16:9", "1:1"],
                "type": "string"
              },
              "avatar_id": {
                "description": "Avatar presenter id from GET /avatars",
                "maxLength": 128,
                "type": "string"
              },
              "caption_style": {
                "description": "Caption style id",
                "maxLength": 64,
                "type": "string"
              },
              "language": {
                "description": "Script language code, e.g. en or tr; defaults to auto",
                "maxLength": 8,
                "type": "string"
              },
              "screen_recording_key": {
                "description": "Key of an uploaded screen recording you own",
                "maxLength": 512,
                "type": "string"
              },
              "script": {
                "description": "Optional narration script; generated from the subject when omitted",
                "maxLength": 5000,
                "type": "string"
              },
              "subject": {
                "description": "What the reel is about (the topic or hook)",
                "maxLength": 500,
                "type": "string"
              },
              "variants": {
                "description": "Render 1 to 3 variants; each uses one credit",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "voice_name": {
                "description": "Voice id from GET /voices",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:138632e3d25bc2719623ed1e413dd4fb8c1c77db11db2394e15ad0748a833d06"
        },
        {
          "name": "generation_quote",
          "title": "Quote a generation",
          "description": "Get a signed price quote before generating: name a generation profile, or map pipeline stages to catalog model ids. Optionally cap the budget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_cost_usd": {
                "description": "Budget cap as a decimal USD string, e.g. \"2.50\"",
                "type": "string"
              },
              "profile": {
                "description": "Generation profile slug",
                "maxLength": 128,
                "type": "string"
              },
              "stages": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Stage to catalog model id, e.g. {\"voice\": \"elevenlabs/multilingual-v2\"}",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e094f2ac91cd3abc539bcb98f31702732f7d04b1040211ced74e135452072384"
        },
        {
          "name": "get_job",
          "title": "Get a job",
          "description": "Read a reel job's state, progress and, once finished, its download URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job id returned by create_reel",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d7023eb599c9ad693a7f4bea9c86b50b5cd575fcc3d3cbda64c480f1e8ce2b48"
        },
        {
          "name": "get_performance",
          "title": "Get performance",
          "description": "Read logged performance (views, likes, retention) for one reel with job_id, or your most recent logged reels without it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Optional reel job id",
                "type": "string"
              },
              "limit": {
                "description": "Rows when listing; default 20",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d385cbbd006686dfa4b92461e0b853e76a09fb57640a36bf345f82eab036476a"
        },
        {
          "name": "list_media_models",
          "title": "List media models",
          "description": "List Menivor's image, video and audio generation models with their integer micro-USD prices (per image, per second of video, or per audio clip).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "modality": {
                "enum": ["image", "video", "audio"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:51dfb9071c9e0c7fc3cedad0e3355616163c06411ad2247924bfa6256b62115a"
        },
        {
          "name": "list_scheduled",
          "title": "List scheduled posts",
          "description": "List your scheduled publishes and their status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f32207a6d8cd87f76f88855b69bf137f729f69ad3bbea0298c1ff5240a5bc371"
        },
        {
          "name": "render_html",
          "title": "Render HTML as a reel",
          "description": "Turn HTML the agent wrote into a vertical reel. The heading is the subject and the paragraphs are the narration. Starts the same render as create_reel. Text inside a script or style tag is not spoken. Uses one reel credit per variant. Returns job_id; poll it with get_job.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "Output aspect ratio; defaults to 9:16",
                "enum": ["9:16", "16:9", "1:1"],
                "type": "string"
              },
              "avatar_id": {
                "description": "Avatar presenter id from GET /avatars",
                "maxLength": 128,
                "type": "string"
              },
              "caption_style": {
                "description": "Caption style id",
                "maxLength": 64,
                "type": "string"
              },
              "html": {
                "description": "A short HTML page: a heading and paragraphs",
                "maxLength": 30000,
                "type": "string"
              },
              "language": {
                "description": "Script language code, e.g. en or tr; defaults to auto",
                "maxLength": 8,
                "type": "string"
              },
              "variants": {
                "description": "Render 1 to 3 variants; each uses one credit",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "voice_name": {
                "description": "Voice id from GET /voices",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d52307a700371ab05345ffa44cbfbc2eb5e24dfab6d6574cceae77e08de47de8"
        },
        {
          "name": "schedule_publish",
          "title": "Schedule publishing",
          "description": "Schedule a finished reel to auto-publish to connected TikTok, Instagram or YouTube Shorts accounts at a future UTC time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "A completed reel job id",
                "type": "string"
              },
              "platforms": {
                "items": {
                  "enum": ["tiktok", "instagram", "youtube_shorts"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "scheduled_at": {
                "description": "Future ISO-8601 UTC time",
                "format": "date-time",
                "type": "string"
              },
              "youtube_privacy_status": {
                "enum": ["private", "unlisted", "public"],
                "type": "string"
              }
            },
            "required": ["job_id", "platforms", "scheduled_at"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:913c8dcbe1906b878bc533e3d1e9a547e159361bc06b9bc1d3024f41ae11fbd0"
        },
        {
          "name": "wallet_balance",
          "title": "Wallet balance",
          "description": "Read your Menivor wallet: available and reserved balance in USD.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a492dbc38c18671919d5b619c35c36021bd90f715dfe179f4b5783e3513335ce"
        }
      ],
      "digest": "sha256:099a77729d28e55143b142ab049568066afc198a8f07cda7fb58fd0eb45a397e"
    }
  }
}
