        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "lucky-numbers",
        "title": "Lucky Numbers",
        "version": "1.0.0",
        "description": "Random number picks for fun: lottery-style presets, a custom range, and daily numbers from a name. Never a prediction.",
        "websiteUrl": "https://luckynumbers.fuseapi.app",
        "icons": [
          {
            "src": "https://luckynumbers.fuseapi.app/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Lucky Numbers draws random numbers for fun, like an \"I'm feeling lucky\" button. Call lucky_numbers with a game (powerball, mega_millions, euromillions, uk_lotto or custom). Pass seed_text only when the user gives a name, a birthday or other text and wants their numbers for the day. Always show the note with the numbers. Never say a pick is lucky in a way that means it is more likely to win, never call it a prediction, and never suggest buying tickets.",
      "tools": [
        {
          "name": "lucky_numbers",
          "title": "Lucky Numbers",
          "description": "Random number picks for fun, like an \"I'm feeling lucky\" button. Presets: powerball (5 of 1-69 plus 1 of 1-26), mega_millions (5 of 1-70 plus 1 of 1-24), euromillions (5 of 1-50 plus 2 Lucky Stars of 1-12), uk_lotto (6 of 1-59), or custom with min, max and numbers. Give seed_text (a name or a birthday) for one set of numbers that stays the same for that text all day (UTC) and changes the next day. This is entertainment only: it predicts nothing, every combination has exactly the same odds, and no pick improves the chance of winning. Always show the user the note field with the numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 1,
                "description": "How many lines (sets of numbers) to draw.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "date": {
                "description": "Only with seed_text: the UTC day (YYYY-MM-DD) to draw for. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "game": {
                "description": "Which ball set to draw from. custom needs max, and takes min and numbers.",
                "enum": ["powerball", "mega_millions", "euromillions", "uk_lotto", "custom"],
                "type": "string"
              },
              "max": {
                "description": "custom only: the highest number.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "min": {
                "default": 1,
                "description": "custom only: the lowest number.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "numbers": {
                "default": 6,
                "description": "custom only: how many different numbers per line.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "seed_text": {
                "description": "Optional text such as a name or a birthday. The same text gives the same numbers all day. It is not stored.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["game"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bonusLabel": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "game": {
                "type": "string"
              },
              "lines": {
                "items": {
                  "properties": {
                    "bonus": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    },
                    "main": {
                      "items": {
                        "type": "integer"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["main"],
                  "type": "object"
                },
                "type": "array"
              },
              "mode": {
                "enum": ["random", "daily"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["note"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://lucky-numbers/balls-v1",
            "openai/toolInvocation/invoked": "Numbers drawn",
            "openai/toolInvocation/invoking": "Drawing numbers",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://lucky-numbers/balls-v1"
            }
          },
          "digest": "sha256:a94fe9212c2dbbb56d492171dbff46e990b1b5f8c23adec3af2cba68a99604dc"
        }
      ],
