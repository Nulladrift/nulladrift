                "description": "One line, 10 to 200 characters. Name the company in it.",
                "type": "string"
              },
              "image_file": {
                "description": "Optional: an image file the user attached in the chat.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
