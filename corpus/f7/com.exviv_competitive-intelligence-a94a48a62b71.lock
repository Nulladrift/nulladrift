        {
          "name": "get_market_evidence_brief",
          "title": "Get Verified Market Evidence Brief",
          "description": "Buy a $2.00 USDC competitive-change brief for a tracked software market: recent pricing, packaging, product, and positioning changes across monitored companies, with timestamps, classifications, commercial implications, and primary-source evidence. Use for ongoing competitive monitoring and GTM planning. Uses x402; the first call returns payment requirements.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 30,
                "description": "Lookback window in days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 25,
                "description": "Maximum reviewed events to return.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "marketSlug": {
                "description": "Market slug returned by get_exviv_catalog.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
