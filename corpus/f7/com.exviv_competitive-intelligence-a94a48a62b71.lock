      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "exviv-competitive-intelligence",
        "title": "EXVIV Competitive Intelligence",
        "version": "1.0.0",
        "description": "Evidence-backed competitor pricing, offer comparisons, and market-change intelligence.",
        "websiteUrl": "https://exviv.com/agent-intelligence",
        "icons": [
          {
            "src": "https://exviv.com/exviv-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use get_exviv_catalog before choosing inputs. Paid tools state their fixed USDC price and return x402 v2 payment requirements before settlement. Use reviewed slugs from the catalog and retain the onchain receipt returned with paid results.",
      "tools": [
        {
          "name": "compare_competitor_offers",
          "title": "Compare Reviewed Competitor Offers",
          "description": "Buy a $1.00 USDC comparison of reviewed plans, prices, limits, features, source URLs, capture dates, and historical changes across two to four software competitors. Use for product marketing, deal support, procurement, and positioning decisions. Uses x402; the first call returns payment requirements.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "companySlugs": {
                "description": "Two to four unique reviewed company slugs returned by get_exviv_catalog.",
                "items": {
                  "maxLength": 100,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array",
                "uniqueItems": true
              }
            },
            "required": ["companySlugs"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "dataset": {
                "type": "object"
              },
              "evidencePolicy": {
                "type": "object"
              },
              "generatedAt": {
                "format": "date-time",
                "type": "string"
              },
              "intel": {
                "type": "object"
              },
              "productId": {
                "enum": ["pricing_snapshot", "pricing_comparison", "market_brief"],
                "type": "string"
              },
              "purchase": {
                "type": "object"
              },
              "schemaVersion": {
                "const": "exviv.agent-intel.v1",
                "type": "string"
              }
            },
            "required": ["dataset", "evidencePolicy", "generatedAt", "intel", "productId", "purchase", "schemaVersion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Compare Reviewed Competitor Offers ($1.00)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:63013ef68f4692f66b447c4147047e77bf4fee5fc618ba8622cae229a88ca8ed"
        },
        {
