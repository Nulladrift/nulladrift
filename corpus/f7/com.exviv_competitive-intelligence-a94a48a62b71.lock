            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "companySlug": {
                "description": "Reviewed company slug returned by get_exviv_catalog.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["companySlug"],
