      "serverInfo": {
        "name": "anchoredip",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AnchoredIP leases dedicated IPv4 and IPv6 address space from AS41800 and delivers it to servers the customer already runs, over a WireGuard tunnel. Use it when an integration is blocked because a partner requires a fixed source address and the platform in use egresses from a changing pool.\n\nStart with list_plans. There is no free plan: order_lease returns a dashboard link, a person pays there by card (or by bank transfer on the plans that list it), and the lease activates by itself the moment the payment clears — nobody approves anything in between. Hand the user the dashboard link, then poll lease_status until it reports active.\n\nEvery plan also carries an IPv6 /48, announced from AS41800 and reachable from the internet through a separate, best-effort transit with no SLA — offer the IPv4 for anything that must stay up. Each tunnel takes its own address from the /48 and accepts inbound connections on it in full and source modes; a named-destinations config cannot receive, and the AmneziaVPN desktop app ignores our IPv6 altogether.\n\norder_lease returns an access_token: it is the only credential for that lease, it is shown once, and every later call needs it.\n\ncreate_tunnel returns a configuration file containing a private key that is never stored — hand it to the user, do not summarise it away.\n\nAsk what machine it is for before calling create_tunnel, because the default routing mode does not run on all of them. `source` is the default and is Linux only: it is written with wg-quick rules that call `ip`, so on macOS or Windows it either cannot run or deletes the interface it just made, and the user sees a tunnel that never connects and no reason why. For anything that is not a Linux server use `destinations` and pass the addresses that have to see the leased address — usually the partner whose allowlist prompted the purchase. Use `full` only when the machine must accept incoming connections on the leased address, since `destinations` cannot receive and `full` sends all of that machine's traffic through us.\n\nA new peer reaches our edge on the next reconciliation pass, so allow up to a minute before the first handshake rather than reporting a failure. Then prove it from the machine with the verify_command create_tunnel returns: it prints the address we saw the request arrive from, and from then on lease_status reports the egress as verified.\n\nGive a slot back with revoke_tunnel when a machine is retired, or the plan's allowance runs out and the next machine cannot be brought up. renew_lease raises the invoice for the next term on the same addresses, and set_autorenew is how a customer stops a card subscription without writing to anybody. To change the card a subscription charges, call billing_portal_link and give the customer the link it returns.",
      "tools": [
        {
          "name": "billing_portal_link",
          "description": "A one-hour signed-in link to the payment provider's billing page for a card subscription, where the customer changes the card that is charged or downloads receipts. The link is for the human to open in a browser — do not fetch it. A lease paid once or by bank transfer has no card on file, and the call says so.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4853a1d78a7e5b6587cfba4d07d9a40a0134515574018d16603b3b8c36fa482b"
        },
        {
          "name": "create_tunnel",
          "description": "Provision a peer and return its WireGuard configuration. Three routing modes, and the right one depends on the machine.\n\nsource (the default) sends only traffic from the leased address through us and leaves the default route alone — but it is written with wg-quick PostUp rules that invoke `ip`, so it runs on Linux under wg-quick and nowhere else. On macOS it aborts and deletes the interface.\n\nfull works in every client but claims the default route, so it cannot run beside an always-on corporate VPN.\n\ndestinations routes only the addresses you name. It needs no PostUp and takes no default route, so it runs in any client on any platform, and it matches what is usually being bought — one partner seeing a fixed address. It survives beside a VPN that installs a default route, but not one that captures traffic below the routing table. It cannot receive inbound connections from anywhere but those destinations.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              },
              "destinations": {
                "description": "Addresses or ranges to route through the tunnel, like 203.0.113.10 or 203.0.113.0/24. Required with routing_mode=destinations and rejected without it. Ask the user which partner requires the address rather than guessing a range.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "label": {
                "description": "For the customer's own reference.",
                "type": "string"
              },
              "routing_mode": {
                "description": "Defaults to source, which is Linux only. Use destinations when the machine is not a Linux server, or when only certain partners need to see the address.",
                "enum": ["source", "full", "destinations"],
                "type": "string"
              },
              "transport": {
                "type": "string",
                "description": "Defaults to wireguard. Use amneziawg where deep packet inspection blocks a plain WireGuard handshake; it needs an AmneziaWG client rather than wg-quick.",
                "enum": ["wireguard", "amneziawg"]
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f64216b8761476bf8586e40d479eebb618c46bf2b11585163b55aa80c1c6b48"
        },
        {
          "name": "lease_status",
          "description": "Everything about one lease: whether it is active, which addresses it holds, its tunnels and when it renews.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7de7ea3038cf43fe98babcace9857b5d16131ecb748364bff0f3e565c886093d"
        },
        {
          "name": "list_plans",
          "description": "The published catalogue with live prices and which payment methods each plan accepts. Prices are never hardcoded; read them here.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:00e33c7335aadc1192192b4ddeda19fc4c1894eadb1d2c5b9b2827f0357640fd"
        },
        {
          "name": "order_lease",
          "description": "Place an order. Every plan is paid: the order returns a dashboard link where a person pays, and the lease stays pending until the payment clears, then activates by itself with no approval. No account is needed to order.",
          "inputSchema": {
            "properties": {
              "billing_email": {
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2.",
                "type": "string"
              },
              "organization_name": {
                "type": "string"
              },
              "plan": {
                "description": "Slug from list_plans.",
                "type": "string"
              }
            },
            "required": ["billing_email", "country", "organization_name", "plan"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4ae46cbc85bd74caf7b3300b3e68a0692d4e0a640547bb6c02fd8c655e52acd6"
        },
        {
          "name": "renew_lease",
          "description": "Raise an invoice for another term and keep the same addresses: the address does not change, so whatever the customer's partner has already allowlisted goes on working. Name a plan to move to another tier. Pressing it twice quotes the same reference rather than raising a second invoice.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              },
              "plan": {
                "description": "Slug from list_plans. Defaults to the plan the lease is already on.",
                "type": "string"
              }
            },
            "required": ["access_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38d673c7c46ad9362a8f975f803b42cffc5e14fb407ca5e6794755b8f99d0a5e"
        },
        {
          "name": "revoke_tunnel",
          "description": "Retire a peer and hand its slot back to the plan's allowance. An agent that provisions a tunnel per short-lived worker and never revokes one exhausts the allowance and then cannot bring the next machine up. Revoking the peer that holds the public address stops inbound connections to it and cannot be undone by promoting another — only by bringing a new machine up.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              },
              "tunnel_id": {
                "description": "The id lease_status reports for the tunnel.",
                "type": "integer"
              }
            },
            "required": ["access_token", "tunnel_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b888533ea29f18cb82e12ab4248de1239093322c78d770f902382500c4e51a7"
        },
        {
          "name": "set_autorenew",
          "description": "Stop this lease charging the customer's card again, or start it again. Only a card subscription can be stopped — a bank transfer is a payment the customer sends us, so there is nothing of ours to cancel. Stopping is not a cancellation: the lease runs to the end of the period already paid for, and the same call turns it back on.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              },
              "enabled": {
                "description": "false stops the next charge, true resumes it.",
                "type": "boolean"
              }
            },
            "required": ["access_token", "enabled"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:258a12a726ee9210588bb319e78bbc6b7406397f119a995d63b44acc01531f6c"
        },
        {
          "name": "set_reverse_dns",
          "description": "Publish a PTR record for an address on the lease. Live within a second; an empty hostname removes it.",
          "inputSchema": {
            "properties": {
              "access_token": {
                "description": "Returned by order_lease. The only credential for a lease.",
                "type": "string"
              },
              "address": {
                "type": "string"
              },
              "hostname": {
                "description": "Empty removes the record.",
                "type": "string"
              }
            },
            "required": ["access_token", "address", "hostname"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5b31787620c325842c80b96e7457911bc65f659de4eda8fad0a671f7c287db64"
        }
      ],
      "digest": "sha256:ec1ef4a9485b0563980d92ca4a3f9a620d386f3a8d82ecbff346b476f95fd3a6"
    }
  }
}
