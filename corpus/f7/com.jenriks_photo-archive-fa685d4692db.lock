                    "required": ["full"],
                    "type": "object"
                  },
                  "location": {
                    "description": "City and country when known",
                    "type": ["string", "null"]
                  },
                  "photographer": {
                    "enum": ["Erik", "Jens"],
                    "type": "string"
                  },
                  "tags": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
