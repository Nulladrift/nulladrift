        {
          "name": "search_photos",
          "title": "Search photos",
          "description": "Search the JENRIKS archive (one photo per day since 2006). Free-text query matches title, place, categories, tags and photographer; filters narrow by photographer, category, year and location. Returns permanent page URLs, credits, coordinates and image URLs, newest first. Page with offset, or with the opaque cursor from next_cursor (cursor wins when both are sent).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One of: Abstract, Architecture, B&W, Humans, Landscapes, Macro, Nature, News, Street, Studio, Time exposure",
                "type": "string"
              },
              "cursor": {
                "description": "Opaque page token from next_cursor; overrides offset",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City or country name, e.g. \"Iceland\"",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "photographer": {
                "enum": ["Erik", "Jens"],
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. \"harbour\", \"Barcelona\", \"fog\"",
                "type": "string"
              },
              "year": {
                "description": "Four-digit publication year",
                "minimum": 2005,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "cursor": {
                "description": "Echo of the cursor this page was fetched with, when one was sent",
                "type": "string"
              },
              "has_more": {
                "description": "True when another page exists",
                "type": "boolean"
              },
              "links": {
                "properties": {
                  "next": {
                    "description": "The same request with cursor=next_cursor and no offset; null on the last page",
                    "format": "uri",
                    "type": ["string", "null"]
                  },
                  "self": {
                    "description": "This request",
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["self"],
                "type": "object"
              },
              "next_cursor": {
                "description": "Opaque token for the next page; null on the last page. Send it back as cursor.",
                "type": ["string", "null"]
              },
              "next_offset": {
                "description": "Kept for offset paging; present when more matches exist",
                "type": "integer"
              },
              "offset": {
                "description": "Offset of the first returned row; 0 when a cursor was used",
                "minimum": 0,
                "type": "integer"
              },
              "photos": {
                "items": {
                  "properties": {
                    "categories": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "credit": {
                      "description": "Ready-made credit line: photographer, JENRIKS, page URL",
                      "type": "string"
                    },
                    "date": {
                      "description": "Publication date, YYYY-MM-DD",
                      "format": "date",
                      "type": "string"
                    },
                    "geo": {
                      "description": "WGS 84 coordinates of the location when the post carries them, otherwise null",
                      "properties": {
                        "latitude": {
                          "maximum": 90,
                          "minimum": -90,
                          "type": "number"
                        },
                        "longitude": {
                          "maximum": 180,
                          "minimum": -180,
                          "type": "number"
                        }
                      },
                      "required": ["latitude", "longitude"],
                      "type": ["object", "null"]
                    },
                    "image": {
                      "properties": {
                        "full": {
                          "description": "1600 px long edge",
                          "format": "uri",
                          "type": "string"
                        },
                        "thumbnail": {
                          "description": "400 px long edge",
                          "format": "uri",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["full"],
                      "type": "object"
                    },
                    "location": {
                      "description": "City and country when known",
                      "type": ["string", "null"]
                    },
                    "photographer": {
                      "enum": ["Erik", "Jens"],
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Permanent page URL",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["categories", "credit", "date", "image", "photographer", "tags", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "minimum": 0,
                "type": "integer"
              },
              "total_matches": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["has_more", "next_cursor", "offset", "photos", "returned", "total_matches"],
            "type": "object"
          },
