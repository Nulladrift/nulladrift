      "instructions": "Read-only access to the JENRIKS daily photoblog: one photograph per day since January 1, 2006, alternating between Jens Herrmann and Erik Hehrmann. Use search_photos to find photos by keyword, place, category, photographer, tag or year; get_photo for one post by date (YYYY-MM-DD) or page URL; get_latest_photo for today's post; random_photo for serendipity; get_site_overview for totals, categories and section URLs. Every result carries a permanent page URL and the photographer credit. Photographs are copyrighted: credit the photographer, link the page, and send licensing questions to https://jenriks.com/contact/. search_photos pages with cursor/next_cursor; get_latest_photo takes an optional photographer (Erik or Jens) and get_site_overview an optional include list (photographers, categories, years, sections, license).",
      "tools": [
        {
          "name": "get_latest_photo",
          "title": "Today's photo",
          "description": "Return today's JENRIKS photo (the newest post), or the newest post by one photographer when photographer is set. A new photo appears every day at 00:00 Europe/Berlin.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "photographer": {
                "description": "Latest post by this photographer; omit for the newest post overall",
                "enum": ["Erik", "Jens"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "photo": {
                "properties": {
                  "categories": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "credit": {
                    "description": "Ready-made credit line: photographer, JENRIKS, page URL",
                    "type": "string"
                  },
                  "date": {
                    "description": "Publication date, YYYY-MM-DD",
                    "format": "date",
                    "type": "string"
                  },
                  "geo": {
                    "description": "WGS 84 coordinates of the location when the post carries them, otherwise null",
                    "properties": {
                      "latitude": {
                        "maximum": 90,
                        "minimum": -90,
                        "type": "number"
                      },
                      "longitude": {
                        "maximum": 180,
                        "minimum": -180,
                        "type": "number"
                      }
                    },
                    "required": ["latitude", "longitude"],
                    "type": ["object", "null"]
                  },
                  "image": {
                    "properties": {
                      "full": {
                        "description": "1600 px long edge",
                        "format": "uri",
                        "type": "string"
                      },
                      "thumbnail": {
                        "description": "400 px long edge",
                        "format": "uri",
                        "type": ["string", "null"]
                      }
