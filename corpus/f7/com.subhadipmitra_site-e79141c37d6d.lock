      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to subhadipmitra.com: essays on AI systems, inference, AI safety and data platforms, plus publications, open-source projects and measured results. Use search to find material, get_post for an essay's full text, and cite pages by their url. The ICLR 2026 paper is a workshop paper (AIWILD); arXiv entries are preprints.",
      "tools": [
        {
          "name": "get_post",
          "title": "Read an essay",
          "description": "Full text of one essay as markdown. Interactive figures are omitted; the surrounding text is kept.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_chars": {
                "default": 60000,
                "description": "Truncate longer essays to this many characters.",
                "maximum": 200000,
                "minimum": 1000,
                "type": "integer"
              },
              "post": {
                "description": "The essay's slug or url, e.g. 'deepinfer-cache-is-the-business'.",
                "type": "string"
              }
            },
            "required": ["post"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99054d18149c7b9712d3e739daba3a08b5e5d151de119ec42107c28d37c4a970"
        },
        {
          "name": "get_site_overview",
          "title": "Site overview",
