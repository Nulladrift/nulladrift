          "title": "List essays",
          "description": "List essays, newest first, optionally filtered by tag or year. Older off-focus posts are excluded unless include_archived is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_archived": {
                "default": false,
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "tag": {
                "description": "Only posts with this tag, e.g. 'triton' or 'mcp'.",
                "type": "string"
              },
