      "instructions": "You are helping a traveler book a Daytrip private door-to-door car transfer. Daytrip (daytrip.com) is the seller; it operates in Europe, the Americas, Asia, Africa and Oceania. Speak to the traveler as a travel assistant, not as an operator of this API.\n\n- Never mention tool names, offer or quote ids, cart or configuration ids, \"calls\", \"results\" or the order in which you use the tools. Describe what you found and what happens next in plain language. Refer to a booking by its booking reference.\n- Refer to options by vehicle name and price (\"Sedan, 271 EUR\"); prices are per vehicle and all-inclusive (driver, fuel, tolls, taxes, up to the stated luggage).\n- Collect the pickup place, drop-off place, date and time (local to the pickup place), number of adults and children (under 12) before searching. Ask when something is missing or ambiguous instead of guessing.\n- When the search lists sightseeing stops, mention that stops can be added (name, time at the stop, extra cost) and add the ones the traveler wants when quoting; other places can be requested as custom stops and are re-priced.\n- Before any booking, present the quote's total and currency, what is included, when they are charged, and the cancellation terms with the free-cancellation deadline, and obtain the traveler's approval of exactly that. If the price changes afterwards, present the new quote and ask again.\n- Booking and paying through book_trip (when available to you) needs the lead traveler's name, email and phone; collect them, use them only for the booking, and never ask for card details yourself: your platform supplies the payment credential. Say the booking is confirmed only when the result says so; \"pending payment\" means it is placed but not paid, and the traveler pays on the link you give them.\n- Without book_trip, the booking link (get_booking_link) is where the traveler enters their name, email and phone, can add a pickup address or flight number, and pays. Nothing is reserved or charged until they pay there. Each quote says how long its price is held — use that, never a duration of your own.\n- For an existing booking, the booking reference and the lead traveler's email are what identify it. Before cancelling, tell the traveler what cancelling now refunds and get their approval.",
      "tools": [
        {
          "name": "get_booking_link",
          "title": "Prepare a Daytrip booking on daytrip.com (handover link)",
          "description": "Prepare a search_trips option on daytrip.com and return a link where the traveler finishes the booking themselves. Nothing is charged and no personal data is needed: on the link the traveler enters their name, email and phone, optional pickup address and flight number, and pays.\n\nUse this when the traveler prefers to finish on the website, or when book_trip is not available to you. It does not create a booking.\n\nReturns one of:\n- status \"handover\": give handoverUrl to the traveler and tell them to open it, complete their details and pay. summary describes the trip; the quoted price is held until expiresAt (the link keeps working afterwards, but the price may be re-quoted).\n- status \"price_changed\" (PRICE_CHANGED): the price moved since the search. Tell the traveler the new price; if they accept, call get_booking_link again with the returned offerId.\n- status \"offer_expired\" (OFFER_EXPIRED): call search_trips again and offer the fresh options.\n- status \"route_not_available\" (ROUTE_NOT_AVAILABLE): the trip can no longer be booked; call search_trips again or suggest alternatives.\n- status \"invalid_input\" (INVALID_INPUT): the vehicleType or a stop does not belong to that offer, or a customStops place could not be resolved; the message says what to fix.\n\nStops: pass availableStops entries as stops (price is known from the search) or other places as customStops (re-priced). The returned price is the total including stops.\n\nNothing is reserved or charged by this tool: the booking exists only once the traveler pays on the website. Never mention ids, tool names or internal steps to the traveler. Each call creates a new booking draft; call it once per confirmed choice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "additionalLuggage": {
                "default": 0,
                "description": "Suitcases beyond one per passenger.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "adults": {
                "description": "Number of adult passengers, including the lead traveler.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "default": 0,
                "description": "Number of children.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "description": "ISO 4217 code to show the price in as well; use the one from search_trips.",
                "enum": ["eur", "usd", "aud", "cad", "gbp", "nzd", "czk", "mxn"],
                "type": "string"
              },
              "customStops": {
                "default": [],
                "description": "Stops at places not in availableStops. The trip is then routed and priced through them, so the price will differ from the search.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "durationMinutes": {
                      "description": "Time at the stop.",
                      "maximum": 480,
                      "minimum": 15,
                      "type": "integer"
                    },
                    "place": {
                      "description": "Free-text place, like origin/destination.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["durationMinutes", "place"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "locale": {
                "default": "en",
                "description": "Language of the traveler's pages and emails (en, de, es, fr, pt).",
                "enum": ["en", "es", "de", "fr", "pt"],
                "type": "string"
              },
              "offerId": {
                "description": "offerId of the chosen search_trips option.",
                "format": "uuid",
                "type": "string"
              },
              "stops": {
                "default": [],
                "description": "Sightseeing stops from the search's availableStops the customer wants to add, in any order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "durationMinutes": {
                      "description": "Time at the stop; defaults to the stop's defaultDurationMinutes.",
                      "maximum": 480,
                      "minimum": 15,
                      "type": "integer"
                    },
                    "locationId": {
                      "description": "locationId of an availableStops entry from search_trips.",
                      "format": "uuid",
                      "type": "string"
                    }
                  },
                  "required": ["locationId"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "vehicleType": {
                "description": "vehicle.type of the chosen search_trips option (a class identifier such as sedan or van).",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["adults", "offerId", "vehicleType"],
            "type": "object"
          },
