        {
          "name": "get_quote",
          "title": "Quote a Daytrip transfer",
          "description": "Price one search_trips option exactly as it will be booked: the chosen vehicle, the party and any stops. Returns everything the traveler must see before committing (seller, total price and currency, what is included, when they are charged, cancellation policy and free-cancellation deadline) and a single-use quoteId for book_trip.\n\nReturns one of:\n- status \"quoted\": present price, cancellationTerms and paymentTiming to the traveler; if previousPrice is set, the price differs from the search option and must be confirmed again. The quote can be booked until expiresAt; afterwards call get_quote again.\n- status \"offer_expired\" (OFFER_EXPIRED): the search option is gone; call search_trips again.\n- status \"route_not_available\" (ROUTE_NOT_AVAILABLE): the trip can no longer be priced; call search_trips again or suggest alternatives.\n- status \"invalid_input\" (INVALID_INPUT): the vehicleType or a stop does not belong to that offer, or a customStops place could not be resolved; the message says what to fix.\n\nNothing is reserved and no personal data is needed. Each call prices the trip afresh.",
