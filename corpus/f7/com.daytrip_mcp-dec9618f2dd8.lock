        {
          "name": "search_trips",
          "title": "Search Daytrip transfers",
          "description": "Search Daytrip private door-to-door car transfers between two places (city to city, airport to city, …) and get bookable prices for every vehicle class.\n\nReturns one of:\n- status \"ok\": options[] (one per vehicle class) with price, capacity, duration and expiresAt, plus the resolved origin/destination and departureAt (local time). Present the options that fit the party (fitsPassengers) to the customer; when they choose, call get_quote with the option's offerId and vehicle.type (then book_trip with the quote), or get_booking_link with the same arguments for the traveler to finish on daytrip.com. availableStops[] lists sightseeing stops on the way with their extra cost per vehicle class (priceByVehicle, keyed by vehicle.type) and default time at the stop; offer them and pass the chosen ones to get_quote or get_booking_link. Only options with stopsAllowed can take stops (Lite classes are direct rides).\n- status \"ambiguous_location\" (code AMBIGUOUS_LOCATION): field says whether origin or destination was unclear, candidates[] lists the places it could mean. Ask the customer, then call search_trips again passing the chosen candidate's label verbatim in that field.\n- status \"location_not_found\" (LOCATION_NOT_FOUND): ask for a city, airport or IATA code.\n- status \"invalid_departure\" (INVALID_DEPARTURE): fix the date/time and retry.\n- status \"route_not_available\" (ROUTE_NOT_AVAILABLE): Daytrip does not serve that trip; suggest a nearby city/airport or another date.\n- status \"price_unavailable\" (PRICE_UNAVAILABLE): nothing could be priced for that date; suggest another date.\n\nWhen talking to the customer, describe options by vehicle name and price and never mention ids, tool names or internal steps. Prices are per vehicle (not per person), all-inclusive and valid until expiresAt. price is in the trip's pricing currency; when a currency was requested and priceInRequestedCurrency is present, that is the amount the checkout charges, so quote that one to the customer. Only one-way transfers with a single vehicle are searched; larger parties may need two bookings. vehicle.type is the vehicle class identifier to pass on; show the customer vehicle.name. Read the daytrip://vehicle-classes and daytrip://cancellation-policy resources for what each class and policy means.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "additionalLuggage": {
                "default": 0,
                "description": "Suitcases beyond one per passenger; each passenger already has one suitcase and one carry-on included.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "adults": {
                "description": "Number of adult passengers (the lead traveler counts as one).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "children": {
                "default": 0,
                "description": "Number of children (under 12).",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "currency": {
                "description": "ISO 4217 code the customer prefers (eur, usd, gbp, …). Adds priceInRequestedCurrency and makes the checkout charge in it.",
                "enum": ["eur", "usd", "aud", "cad", "gbp", "nzd", "czk", "mxn"],
                "type": "string"
              },
              "departureAt": {
                "description": "Pickup date and time, ISO 8601. Without an offset it is local time at the pickup place (e.g. 2026-10-01T09:00); with an offset or Z it is converted to the pickup place's local time.",
                "type": "string"
              },
              "destination": {
                "description": "Drop-off place, same rules as origin.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Customer language (en, de, es, fr, pt). Used for the handover link.",
                "enum": ["en", "es", "de", "fr", "pt"],
                "type": "string"
              },
              "origin": {
                "description": "Pickup place as the customer said it: a city, airport, IATA code or \"City, Country\". To pick an ambiguous_location candidate, pass its label verbatim.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["adults", "departureAt", "destination", "origin"],
            "type": "object"
          },
