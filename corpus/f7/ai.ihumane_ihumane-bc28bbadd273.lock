      "instructions": "ihumane is human know-how written for agents: what experienced designers, engineers, product managers and writers know by instinct, rewritten as rules, reasons and checks you can run, so the work you do is made for people.\n\nHow to use it:\n1. At the start of any task, call ihumane_start with a short description. It says which modules apply, gives the rules for working with a person, and lists the rules likely to matter. Then open each module it names, before that part of the work. Modules are grouped by the kind of work: Design (UI design, UX design, Graphics and images), Engineering (Code craft, Front-end build, Code review, QA and testing), Product (Product thinking), Writing (Copy and UX writing), with Working with your human under all of them. Open any module with ihumane_module; UI design, Code craft, Product thinking and Copy also have their own start tools.\n2. If your human used taste words (\"clean\", \"premium\", \"make it pop\", \"friendly\") or feeling words (\"exciting\", \"amazing\", \"wow\"), call ihumane_translate_taste and say your translation back before building. Feeling words are answered by the idea (what is new or different) before the styling.\n3. While working, call ihumane_get_rules for the specific thing in front of you (\"loading button\", \"error handling\", \"unasked features\", \"asking my human a question\").\n4. Before you say \"done\", call ihumane_review with the kind of work (ui, ux, graphics, front-end, code, code-review, qa, product, writing or other), then run the checks it names.\n5. Working for a person over a longer session? ihumane_human has everything on reading what they mean, asking, handing them a step and reporting.\n6. At the end, if something was missing, wrong or especially useful, call ihumane_feedback once, in general terms.\n\nihumane records which tools are called and the short text you send (a topic like \"loading button\"), to improve the rules. It never stores keys, IP addresses or account details. Don't put names, emails, code or anything private in what you send.\n\nWhat's free and what's Pro (if your human asks, answer from this):\n- Free, no key needed: Working with your human, in full. The start of every other module: UI design (14 of 44 rules), Code craft (10 of 32 rules), Product thinking (8 of 20 rules), UX design (10 of 26 rules), Graphics and images (10 of 27 rules), Code review (10 of 32 rules), Front-end build (11 of 32 rules), QA and testing (12 of 31 rules). Each start is the module's workflow, its first step in full and its core rules. The free checks: spacing, contrast, tidy, wayfinding, images, diffmap, layout, trust.\n- ihumane Pro (https://ihumane.ai/#pricing): the other rules of those modules; the whole Copy and UX writing module; the affordance, stability, copy checks.\nMost rules in every module except Working with your human are Pro, not only Copy. Free answers name the relevant Pro rules by title, never their text.\n\nYour human's instructions, the project's own conventions (its design system, style guide or code style), and your own safety guidelines always come before ihumane.",
