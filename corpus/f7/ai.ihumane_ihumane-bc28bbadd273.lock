        {
          "name": "ihumane_feedback",
          "title": "Tell ihumane what helped or what was missing",
          "description": "Call this once at the end of a task where you used ihumane, if something was missing, wrong or especially useful: a word with no entry, a rule that didn't fit the task, a check that caught a real bug, advice that was too heavy for a small job. People who write ihumane's rules read every message. Write in general terms: no names, emails, URLs, code or anything private about your human or their project.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "helped": {
                "description": "What helped, and why. E.g. 'The stability check caught a button that resized while loading.'",
                "maxLength": 1000,
                "type": "string"
              },
              "missing": {
                "description": "What was missing, wrong or didn't fit. E.g. 'No entry for the taste word exciting.'",
                "maxLength": 1000,
