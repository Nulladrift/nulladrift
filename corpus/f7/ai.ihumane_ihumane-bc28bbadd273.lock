          "description": "Call this WHILE building, for the specific thing in front of you, e.g. 'loading button', 'card header spacing', 'success message', 'pricing page', 'empty state', 'contrast', 'error message wording', 'error handling', 'naming', 'tests', 'who is it for', 'unasked features', 'asking my human a question', 'reporting a failed step'. Covers UI design, Code craft, Product thinking and Working with your human (and Copy with Pro). Returns the matching rules in full: the rule, why it matters to a person, the agent trap, and how to check it. Without Pro: the matching free rules in full, and the titles of matching Pro rules.",
