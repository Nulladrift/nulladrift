        {
          "name": "ihumane_get_check",
          "title": "Get a runnable check",
          "description": "Returns a check to run on your own work. Browser checks run on the RENDERED page (browser console or a browser tool's evaluate/execute): 'spacing': text touching lines, uneven padding. 'contrast': text and field edges too faint against their real background, in light and dark mode. 'affordance' (Pro): controls that look like something they aren't, link underlines, back-link direction. 'stability' (Pro): controls that move or resize when used. 'copy' (Pro): vague labels, 'click here' links, placeholder-only fields, missing alt text, errors with no next step, machine-voice words. Code check, run with Node in the project: 'tidy': leftovers in your change (debug logs, .only in tests, empty catches, likely secrets, new TODOs, commented-out code, very long functions). 'wayfinding' (UX design): Pages that don't say where you are or give a way back: no clear heading or a generic page title, menus with no current item, a breadcrumb that links to itself, a deep page with no way up, a step with no Back or way out, and dead ends. 'images' (Graphics and images): Images shown larger than the file (blurry), files far wider than their slot, stretched images, broken images, images with no width and height, missing or useless alt text, icon-only buttons with no name, heavy files, and icons in one row with different sizes, strokes or styles. 'diffmap' (Code review): The shape of a change before you review it: size, a reading order, and what to look at closely (code changed with no test, migrations, data deletes, risky paths, removed exports still in use, new dependencies, imports of packages the project doesn't have, tests that mock what they test). 'layout' (Front-end build): Sideways scrolling and the element causing it, text cut off by a fixed height, tap targets that are too small at touch widths, stretched or oversized images, clickable divs with no role, fields with no label or the wrong type, and skipped heading levels. 'trust' (QA and testing): Tests you can't trust: tests that check a constant or assert nothing, tests that only check a fake was called, checks that pass for almost any result, snapshot-only tests, fixed waits, retries that hide flaky tests, end-to-end tests that find elements by CSS class or position, and the real clock or random numbers inside a check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "name": {
                "description": "Which check to get",
                "enum": ["spacing", "contrast", "affordance", "stability", "tidy", "copy", "wayfinding", "images", "diffmap", "layout", "trust"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a runnable check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
