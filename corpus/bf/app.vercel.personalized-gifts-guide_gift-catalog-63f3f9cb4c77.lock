        {
          "name": "search_gifts",
          "title": "Search gifts",
          "description": "Search the published Personalized Gifts Guide catalog (Zazzle products, Amazon bundle picks and related guides or bundles) by free text and/or structured filters: recipient, occasion, product type, source. Returns title, product type, the site page, an image (Zazzle), and the already-correct Zazzle or Amazon URL. Prices are not in the feed: price is always null and min_price/max_price only steer guide picks (under-$ guides), never invent prices. Does not invent links. Never returns Coach fashion products. Give a query or at least one filter.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max products to return (default 8, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Optional budget in USD. Used to pick matching under-$ guides; products are not price-filtered because the catalog has no prices.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Optional. Prices are not in the catalog, so this cannot filter products; it is echoed and noted.",
                "minimum": 0,
                "type": "number"
              },
              "occasion": {
                "description": "Occasion. Catalog values: Christmas, Hanukkah, Thanksgiving, New Year, Lunar New Year, Valentine's Day, Easter, Father's Day, Graduation, Weddings, Any occasion. Also matched on product titles: birthday, anniversary, mother's day, baby shower, bridal shower, retirement, housewarming, halloween, back to school.",
                "maxLength": 60,
                "type": "string"
              },
              "product_type": {
                "description": "Product type. Values: Mugs & drinkware, Ornaments, Bags & accessories, Cards, Home & textiles, Apparel & socks, Decor & signs, Invitations, Stationery & office, Stickers & labels, Puzzles & games, Party supplies, Badges & name tags, Business cards, Gift wrap, Other. Simple words work too (mug, ornament, shirt, blanket, tote, card, sticker, puzzle).",
                "maxLength": 60,
                "type": "string"
              },
              "query": {
                "description": "Search text, for example 'gift for grandma under $30' or 'nana mug'. Optional when a filter is given.",
                "maxLength": 200,
                "type": "string"
              },
              "recipient": {
                "description": "Who it's for. Values: mom, dad, grandma, grandpa, grandparents, couples, pet lovers, baby, kids, family, friends, coworkers, teacher, nurses, graduates, retirees, first responders, golfers, her, runners, athletes, parents-to-be, party hosts, pen pals, small business owners, coffee lovers, new homeowners, gamers, anyone. Common aliases work (mother, nana, wife, dog lover, husband...).",
                "maxLength": 60,
                "type": "string"
              },
              "source": {
                "description": "Limit to Zazzle (personalized) or Amazon (bundle and GTA 6 gear picks).",
                "enum": ["zazzle", "amazon"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "budget": {
                "type": ["number", "null"]
              },
              "count": {
                "type": "integer"
              },
