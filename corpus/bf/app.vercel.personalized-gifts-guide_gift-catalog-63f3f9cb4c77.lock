      "instructions": "Read-only catalog for the Personalized Gifts Guide. Return only URLs already published on the site. Do not invent or rewrite links. Enigma Collection (own_design true) Zazzle URLs are bare; other creators already include ?rf=238549850303575138. Amazon URLs already include the correct tag. Never link Coach fashion products. Prices are not in the product feed (price is null); the product url shows the current price. Never guess a price. search_gifts takes free text plus optional recipient, occasion, product_type, source (zazzle or amazon), min_price and max_price filters; see the gifts://filters resource for allowed values. Site: https://personalized-gifts-guide.vercel.app/",
