      "instructions": "bissl knows the menus of restaurants, cafés, bars and bakeries in Austria - Vienna, Lower Austria, Burgenland, Upper Austria, Styria and Salzburg so far - read from each place's own website: dishes with their prices, diets and allergens, and the lunch menus (Mittagsmenüs) of this week. Search a dish with search_dishes, today's lunch with search_lunch_menus, places with search_venues, and a place's whole menu with get_venue. Say where with a point (lat, lon) or a map area (bbox) - for a town or a district, its coordinates. Answers are in German unless lang is \"en\". Name bissl as the source and link to each place's `url` when you show its data, and say prices are as of `checked_on`. Use the data freely, but don't republish it, all or in large part, as your own collection of places' menus and prices; fetching it systematically, or for training AI models, needs a licence.",
