{
  "lockfileVersion": 2,
  "subjects": {
    "com.canvas64/wall": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://canvas64.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "canvas64",
        "title": "Canvas64",
        "version": "1.6.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Canvas64 is a public wall of 64 ad cells on Base, paid in USDC, with a royalty to every earlier owner on every later sale. Read the wall, a cell or the price model here. To buy, prepare_buy gives the unsigned transactions for the person's own wallet to sign, or send the person to the cell's url, where their wallet pays in the browser. Never ask anyone for a private key or a recovery phrase.",
      "tools": [
        {
          "name": "get_cell",
          "title": "Read one cell",
          "description": "One cell by its address (A1 to H8): owner, step, price paid, the price to claim or buy it out now, what the next buyer pays to buy them out and what they get from it, their royalty after that, and the link where a person buys it with their own wallet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cell": {
                "description": "The cell's address, such as D4.",
                "pattern": "^[A-Ha-h][1-8]$",
                "type": "string"
              }
            },
            "required": ["cell"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one cell"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bb5da4646b9d17e99821dc0a88fbac1f1bdf90063612ff2a66485773c0f7513"
        },
        {
          "name": "get_rules",
          "title": "The rules",
          "description": "The rules of Canvas64 in a few quotable sentences: the price formula, the payout, the royalty, the contract and network, the services a cell links to, the audit status and the docs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "The rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92961e37fe456659e60c742bfa076df250e2ba737c799027b666a28cc29b771e"
        },
        {
          "name": "get_wall",
          "title": "Read the wall",
          "description": "All 64 cells of the Canvas64 wall, A1 to H8: who owns each (name and wallet), its step, what it was bought for, what buying it out costs now, and the owner's links. Use it to find free cells, the cheapest cell, the priciest cells or a creator on the wall.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter": {
                "description": "Which cells; all by default.",
                "enum": ["all", "free", "taken"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the wall"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:273396b5722ed312a655130cec6b365c2ab60d7fee7b981c53eca77531efa290"
        },
        {
          "name": "prepare_buy",
          "title": "Prepare a purchase",
          "description": "Prepares the purchase of one cell (A1 to H8) for the buyer's own wallet: the price read from the contract now, and the unsigned transactions on Base that the wallet signs and sends in order, a USDC approval of the exact price (left out when the wallet already allows it) and the purchase. Canvas64 never holds a key and sends nothing. Give the wallet address to check its USDC and allowance first. If someone buys the cell before the transaction lands, it fails and nothing is charged; prepare again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cell": {
                "description": "The cell's address, such as D4.",
                "pattern": "^[A-Ha-h][1-8]$",
                "type": "string"
              },
              "wallet": {
                "description": "Optional: the buyer's wallet address, to check its USDC balance and allowance.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["cell"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a purchase"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e10d5fc243a5dd39be8e620c4185fef0acf187fa3246aa3709e9ec7e242a4d3"
        },
        {
          "name": "quote",
          "title": "Price a step",
          "description": "The Canvas64 price model for one step of any cell: its price, what its owner gets when bought out, their royalty on every later sale, and optionally how much that royalty has paid once the cell reaches a later step. Prices rise 1.65x per step from $30, with no cap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "step": {
                "description": "The purchase number; 1 is a claim of a free cell.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "until": {
                "description": "Optional: a later step, to sum the royalty earned up to it.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["step"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a step"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e930cbbd9c548a48630199c4a8ffd6b23049fa316da599c523bb412300eb789"
        }
      ],
      "digest": "sha256:309925e51b43bcbc50b0e6a8e811b5d02adddfe1524dbeebeb27943b410fa95e"
    }
  }
