                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "year": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["authors", "citation_count", "matched_queries", "paper_id", "title"],
                  "type": "object"
