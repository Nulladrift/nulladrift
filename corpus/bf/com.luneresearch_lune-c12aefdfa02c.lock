        },
        {
          "name": "search_research_guidance",
          "title": "Search research guidance",
          "description": "Use before recommending experimental design, ablation strategy, evaluation metrics, baselines, reproducibility, paper structure, related-work organisation, venue choice, response-to-reviewers, scientific writing, or methodology in general. Searches the Lune guidance corpus, curated from senior researchers, reproducibility checklists, venue-reviewer guidance, and author tutorials, so methodology advice can cite vetted sources. Triggering questions: “how should I design an ablation for X”, “what's a good evaluation setup for retrieval”, “how do I respond to reviewer 2”, “what's the reproducibility checklist for NeurIPS”, “how should I structure the related-work section”, “what venue should I target for a systems paper on X”. Returns top-K excerpts with source attribution; cite every entry you draw on.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "results": {
                "items": {
                  "properties": {
                    "doc_id": {
                      "type": "string"
                    },
                    "doc_title": {
                      "type": "string"
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "section": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["doc_id", "doc_title", "excerpt", "section"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "anthropic/alwaysLoad": true
          },
          "digest": "sha256:db912b6d94fb04e7aad5cf647942766c8740a1046b62fb518707f07f51fdf4c4"
        },
        {
          "name": "send_feedback",
          "title": "Send feedback to Lune",
          "description": "Sends the user's feedback about Lune to the Lune team. Use it when the user says something about Lune itself (papers it missed, results that did not fit, an error, something that helped, an idea): offer to pass it on, show the user the message you would send, and call this only after they agree. Set `allow_training` only if they also agreed that Lune may train models on it, after telling them they can withdraw that at any time in their Lune account settings. Write the message from what the user said about Lune, leaving out unrelated conversation and personal details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "allow_training": {
                "default": false,
                "description": "True only when the user explicitly agreed that Lune may use this feedback to train its models.",
                "type": "boolean"
              },
              "category": {
                "description": "missing_papers: Lune did not find papers the user expected. irrelevant_results: the results did not fit the question. helpful: Lune helped. issue: an error or something broken. idea: a suggestion.",
                "enum": ["missing_papers", "irrelevant_results", "helpful", "issue", "idea", "other"],
                "type": "string"
              },
              "message": {
                "description": "The feedback as the user approved it: what they asked Lune for and what happened, naming the papers involved. Leave out the user's own name and contact details, credentials, and private documents.",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["category", "message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "The stored feedback's id; nothing to show the user.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "status": {
                "const": "sent",
                "type": "string"
              }
            },
            "required": ["id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:946e92b69c288e683a58529ae07d21b04b53fabd45c4c8719d60236dc8d0345d"
        },
        {
          "name": "verify_claims",
          "title": "Verify claims against the corpus",
          "description": "Fact-check 1 to 25 natural-language claims against Lune's peer-reviewed corpus in ONE call. For each claim the server retrieves the most relevant passages and an LLM judges the claim ONLY against those passages (never outside knowledge), returning one verdict per claim: `supported`, `unsupported`, or `insufficient_evidence`. Use this to ground a draft before you assert it, to vet a user's claim, or to check your own answer against the literature. Every verdict carries a `verbatim_quote` copied EXACTLY from a retrieved passage (or null when nothing could be quoted, e.g. an insufficient_evidence verdict) plus `supporting_paper_ids` (the corpus papers the verdict relied on); both are verified server-side, the quote is guaranteed to be a real substring of a retrieved passage and the ids are guaranteed to be real retrieved candidates, so you can cite the quote directly without re-checking. Also returns a `confidence` (0..1) and short `reasoning` per claim. Filters (`conference`, `year`, `year_min`, `year_max`, `venues`) scope the evidence search and are shared across every claim; `context` is optional shared framing for the judge. `paper_id`s are fetch handles for get_paper_fulltext, not for showing to the user, cite papers by title, authors, and venue.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "claims": {
                "description": "1 to 25 natural-language factual claims to fact-check against the corpus in ONE call. Phrase each as a complete, self-contained assertion (e.g. \"LoRA fine-tuning matches full fine-tuning on GLUE while training far fewer parameters\"), not a keyword bag. Each claim is retrieved and judged independently, so you get one grounded verdict per claim.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "conference": {
                "description": "Restrict the evidence search to this conference short name, e.g. \"CCS\", \"NeurIPS\". Shared across every claim.",
                "type": "string"
              },
              "context": {
                "description": "Optional shared framing passed to the judge for every claim, e.g. the surrounding paragraph or the question the claims answer. Use it to disambiguate terse claims; it does not change what is retrieved.",
                "type": "string"
              },
              "venues": {
                "description": "Restrict the evidence search to these conference short names (e.g. [\"NeurIPS\", \"ICML\"]). Shared across every claim.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "year": {
                "description": "Restrict the evidence search to a single publication year.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "year_max": {
                "description": "Restrict the evidence search to this publication year or earlier. Shared across every claim.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "year_min": {
                "description": "Restrict the evidence search to this publication year or later. Shared across every claim.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              }
            },
            "required": ["claims"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "claims_processed": {
                "description": "Total claims judged; equals verdicts.length.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "verdicts": {
                "description": "One grounded verdict per input claim, in input order.",
                "items": {
                  "properties": {
                    "claim": {
                      "description": "The input claim this verdict judges.",
                      "type": "string"
                    },
                    "confidence": {
                      "description": "The judge's confidence in this verdict, 0..1.",
                      "type": "number"
                    },
                    "reasoning": {
                      "description": "Short justification for the verdict, grounded in the passages.",
                      "type": "string"
                    },
                    "supporting_paper_ids": {
                      "description": "Lune paper UUIDs of the retrieved passages the verdict relied on (a subset of the candidates retrieved for this claim, never invented). Fetch full text with get_paper_fulltext.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "verbatim_quote": {
                      "description": "Text copied verbatim from a retrieved passage that grounds the verdict, or null when none could be quoted. Verified server-side against a passage from one of supporting_paper_ids (compared with whitespace normalised), so it is safe to quote directly. A supported/unsupported verdict failing that check is downgraded to insufficient_evidence with the quote dropped, so those two are always citable.",
                      "type": ["string", "null"]
                    },
                    "verdict": {
                      "description": "`supported`: a retrieved passage directly substantiates the claim. `unsupported`: a retrieved passage directly contradicts it. `insufficient_evidence`: the corpus passages neither confirm nor deny it (also the safe degrade when verification was unavailable).",
                      "enum": ["supported", "unsupported", "insufficient_evidence"],
                      "type": "string"
                    }
                  },
                  "required": ["claim", "confidence", "reasoning", "supporting_paper_ids", "verbatim_quote", "verdict"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["claims_processed", "verdicts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "anthropic/maxResultSizeChars": 500000
          },
          "digest": "sha256:26eea3d7df9a4ac8919c8e77131763514d6b45b818b76db9c01e920346b6c325"
        }
