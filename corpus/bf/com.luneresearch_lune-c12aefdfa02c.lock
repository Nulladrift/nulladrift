        {
          "name": "get_paper_citations",
          "title": "Get paper citations",
          "description": "Use this when the user asks “what does this paper build on”, “what built on this”, traces influence chains, asks for follow-up work, or wants the lineage of an idea. `direction=cited_by` returns indexed papers that cite this one; `direction=cites` returns this paper's parsed references (which may or may not be in the corpus). Each edge carries `contexts`, the citing sentences with their section, which show HOW a work is used (baseline, method borrowed, result disputed). Page with `limit` / `offset`; the response reports `total` and `has_more` so you can walk a large citation set.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "direction": {
                "default": "cited_by",
                "description": "`cited_by`: indexed papers that cite this one (forward, follow-up work). `cites`: this paper's parsed references (back, what it built on).",
                "enum": ["cited_by", "cites"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Max citation edges to return per page (default 25, max 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset; re-call with offset += limit while the response `has_more` is true. The response also reports `total`.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "paper_id": {
                "description": "A corpus paper UUID, taken from a `search_papers` or `search_related_papers` result.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["paper_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "citations": {
                "items": {
                  "properties": {
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "citation_count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "contexts": {
                      "description": "The citing paper's own sentences that cite the other paper, each with its section, so you can see how the work is used without fetching full text. Absent when the edge predates sentence extraction; empty when the paper lists the work without citing it in its text.",
                      "items": {
                        "properties": {
                          "section": {
                            "type": "string"
                          },
                          "text": {
                            "type": "string"
                          }
                        },
                        "required": ["section", "text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "doi": {
                      "type": "string"
                    },
                    "in_corpus": {
                      "description": "True if paper_id is set (the edge resolves to an indexed paper).",
                      "type": "boolean"
                    },
                    "paper_id": {
                      "description": "Lune paper UUID when this edge resolves to a paper in the corpus; absent for a parsed-only reference. Fetch full text with get_paper_fulltext.",
