        {
          "name": "search_papers",
          "title": "Search papers",
          "description": "Searches full-text, peer-reviewed papers from top-tier venues. Use for questions about academic papers, research topics, literature reviews, surveys, “what's been published on X”, named methods, or any claim that should be backed by a peer-reviewed citation. Returns each paper's metadata and the passages that matched. Hybrid semantic + lexical search over titles, abstracts, and full text. Phrase the query the way a researcher would describe the topic in prose, not a keyword bag. Triggering questions: “what's the latest on diffusion guidance”, “which papers compare against SimPO” (requirements beyond the topic are checked per paper: `conditions`, evidence first in `contexts`). `paper_id` is a handle for YOU to fetch full text via `get_paper_fulltext`; never show it to the user: cite papers by title, authors, and venue. `rerank_score` is the calibrated Cohere Rerank v3.5 relevance (0..1), null when the reranker did not run (a lone term, or a failure); `score` is uncalibrated: keep the hits' order. The top-level `best_score` and `low_confidence` derive from `rerank_score`: `low_confidence` marks weaker matches, so rephrase for stronger ones and still cite a hit that fits; with no reranked hit, `best_score` is null and `low_confidence` false, so judge each hit yourself. Each hit carries metadata, abstract, ids, and `contexts` spans to ground or quote from; `detail: false` returns concise hits with one `snippet`. Page with `offset` (re-call with offset += limit while `has_more` is true and `conditions` match page 1's; offset + limit <= 50). Order with `sort_by` (relevance / date / citations, within the ranked shortlist, not the corpus). Narrow with `year_min` / `year_max` / `venues`.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "conference": {
                "description": "Filter by conference short name, e.g. \"CCS\", \"NeurIPS\".",
                "type": "string"
              },
              "detail": {
                "default": true,
                "description": "true (default): include the full abstract, ids, and contexts[] matched spans for grounding. false: concise hits (title, authors, year, venue, citations, score, and a single grounding snippet) for token-saving triage. For the complete paper text call get_paper_fulltext.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset over the ranked results. Re-call with offset += limit while the response `has_more` is true. offset + limit must stay <= 50.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Full natural-language research query; phrase it the way you would ask a human research assistant. On the paper corpus the server drops request wording (\"find me papers on\"), adds the standard names of what the query describes and a hypothetical abstract (HyDE), and expands an abbreviation only when the rest of the query fixes its meaning, so give context (\"MPC for drone control\", not \"MPC\"); a lone term is searched as typed, without expansion, HyDE or rerank. The richer the input, the better the recall. Good: \"methods for retrieval-augmented generation that reduce hallucination on long-form QA\". Less optimal: \"RAG hallucination\".",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "sort_by": {
                "default": "relevance",
                "description": "Result ordering within the ranked shortlist: `relevance` (default), `date` (newest first), or `citations` (most-cited first).",
                "enum": ["relevance", "date", "citations"],
                "type": "string"
              },
              "venues": {
                "description": "Restrict to these conference short names (e.g. [\"NeurIPS\", \"ICML\"]).",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "year": {
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "year_max": {
                "description": "Only include papers published in this year or earlier.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "year_min": {
                "description": "Only include papers published in this year or later.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "best_score": {
                "description": "The highest per-hit rerank_score (calibrated 0..1), or null when no hit was reranked (a lone-term query, or a reranker failure) or there were no results.",
                "type": ["number", "null"]
              },
              "conditions": {
                "description": "What the request requires of its papers beyond the topic (compares against a method, evaluates on a dataset, releases code), when the search checked it in the papers' own text: every hit meets each, with its evidence first among its contexts, and an empty first page means none of the top-ranked papers the check read does. Absent when nothing was checked, so the hits are unverified.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "has_more": {
                "description": "True when more results exist past this page; re-call with offset += limit.",
                "type": "boolean"
              },
              "low_confidence": {
                "description": "True when the best rerank_score fell below the relevance floor: these are weaker matches, so rephrase for stronger ones and still cite a hit that fits. False when a hit cleared the floor, and also when no hit was reranked or there were no results: best_score is then null, so there is no calibrated basis and you judge each hit's fit yourself.",
                "type": "boolean"
              },
              "results": {
                "description": "The ranked hits.",
                "items": {
                  "properties": {
                    "abstract": {
                      "type": "string"
                    },
                    "arxiv_id": {
                      "type": "string"
                    },
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "citation_count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "compares_against": {
                      "description": "No longer set; kept because released output schemas only grow.",
                      "type": "string"
                    },
                    "conference": {
                      "description": "Conference short name (e.g. NeurIPS, CCS).",
                      "type": "string"
                    },
                    "contexts": {
                      "description": "Present by default and in detail mode: the matched span(s) inside this paper; where a search checked conditions, the evidence for each comes first, labelled by condition (from any section), then the span that best answers the request; no other span from the abstract. Use to ground an answer; for full text call get_paper_fulltext.",
                      "items": {
                        "properties": {
                          "chunk_id": {
                            "description": "Stable id of the source chunk; deep-links the exact matched span.",
                            "type": "string"
                          },
                          "condition": {
                            "description": "Set on the passage a condition check named as evidence: the condition (one of the response's conditions) this passage shows the paper meets.",
                            "type": "string"
                          },
                          "score": {
                            "description": "The retriever's score for this span. A semantic match and a span that names a query term literally score on different scales, so do not compare them; rerank_score is the paper's relevance.",
                            "type": "number"
                          },
                          "section": {
                            "description": "Section the chunk came from (e.g. Methods, Results).",
                            "type": "string"
                          },
                          "text": {
                            "description": "The exact matched text span from the paper.",
                            "type": "string"
                          }
                        },
                        "required": ["text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "doi": {
                      "type": "string"
                    },
                    "et_al_count": {
                      "description": "Authors beyond the first 6 (concise mode trims the list).",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "paper_id": {
                      "description": "Lune paper UUID. An internal handle for fetching a paper's FULL TEXT via get_paper_fulltext; do NOT show it to the user. Cite papers by title, authors, and venue instead.",
                      "type": "string"
                    },
                    "pdf_cdn_url": {
                      "type": "string"
                    },
                    "rerank_score": {
                      "description": "Raw Cohere Rerank v3.5 relevance, calibrated 0..1. Present only when the reranker ran; omitted for a lone-term query, which skips it, and after a reranker failure. This is the calibrated relevance and the basis for best_score / low_confidence.",
                      "type": "number"
                    },
                    "score": {
                      "description": "The reranker's score when it ran, otherwise a fused retrieval score on a different scale. Hits arrive in the requested order, and a single search's relevance order also follows a language model's grades of the top results, so a lower score can come first: keep that order instead of re-sorting by score. rerank_score is the calibrated relevance.",
                      "type": "number"
                    },
                    "snippet": {
                      "description": "Concise-mode grounding: the top matched span, or a truncated abstract.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "year": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["authors", "citation_count", "paper_id", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["best_score", "has_more", "low_confidence", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "anthropic/alwaysLoad": true,
            "anthropic/maxResultSizeChars": 500000
          },
          "digest": "sha256:0f3c12beaa85b57365e9beb924777af1a9a22b92aead9e89e615181eadbfa36b"
        },
        {
          "name": "search_papers_many",
          "title": "Search papers (multi-query)",
          "description": "Use for a LITERATURE SWEEP or survey: a research question broad enough to need several angles, e.g. \"what's been done on X\", a related-work section, or a state-of-the-field summary. One call returns one merged, ranked list of the papers the angles found, with the passages that matched. For a single focused question, use `search_papers` instead. Runs 1 to 25 query variants in ONE call and gets back a single deduped, RRF-merged ranked list with per-paper provenance (`matched_queries`: which of your queries, by index into the echoed `queries`, surfaced each paper, and at what rank): supply several genuinely different angles on the topic (rephrasings, sub-questions, alternate terminology) and the server fuses their ranked lists so the merged result covers more of the corpus than any single query would. Each variant runs the same hybrid retrieval as `search_papers` (Cohere Embed v4 + BM25 + Cohere Rerank v3.5) without its server-side rewrites, because your variants are the expansion: spell out abbreviations and synonyms in the variants themselves. Filters (`conference`, `year`, `year_min`, `year_max`, `venues`) are SHARED across all queries. The envelope reports `queries_run` and, for any variant whose pipeline failed, `queries_failed` (so one bad variant never sinks the batch). `has_more` is always false: the merged shortlist is bounded; widen the query set or filters for more coverage. Each hit carries metadata, abstract, ids, and the matched `contexts` spans to ground or quote from; `detail: false` returns concise hits with one `snippet`. `paper_id` is a handle for YOU to fetch full text via `get_paper_fulltext`; cite papers by title, authors, and venue, never by id. Billing: each query variant counts as one search against your quota (an 8-query call costs 8), since the server runs a full search pipeline per variant; prefer a focused set of genuinely distinct angles over padding the list.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "conference": {
                "description": "Shared across every query: filter to this conference short name, e.g. \"CCS\", \"NeurIPS\".",
                "type": "string"
              },
              "detail": {
                "default": true,
                "description": "true (default): include the full abstract, ids, and contexts[] non-abstract matched spans for grounding. false: concise hits (title, authors, year, venue, citations, score, and a single grounding snippet) for token-saving triage. `matched_queries` provenance is always present. For the complete paper text call get_paper_fulltext.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Max papers in the merged, deduped result list (default 10, max 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "queries": {
                "description": "1 to 25 query variants to run in ONE call. Phrase each the way you would ask a human research assistant (full natural-language questions beat keyword bags). Supply genuinely different angles on the topic (rephrasings, sub-questions, alternate terminology) so the merged list covers more of the literature than any single query would. The server runs each variant through the full hybrid pipeline and RRF-fuses the ranked lists into one deduped result set.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "venues": {
                "description": "Shared across every query: restrict to these conference short names (e.g. [\"NeurIPS\", \"ICML\"]).",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "year": {
                "description": "Shared across every query: restrict to a single publication year.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "year_max": {
                "description": "Shared across every query: only papers published in this year or earlier.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              },
              "year_min": {
                "description": "Shared across every query: only papers published in this year or later.",
                "maximum": 2100,
                "minimum": 1990,
                "type": "integer"
              }
            },
            "required": ["detail", "limit", "queries"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "has_more": {
                "description": "Always false: the merged shortlist is bounded, so there is no cursor to page past it. Widen the query set or filters for more coverage.",
                "type": "boolean"
              },
              "queries": {
                "description": "Your query variants, once each and in the order you sent them; each hit's `matched_queries` points into this list.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "queries_failed": {
                "description": "Variants whose pipeline raised; recorded here instead of sinking the whole batch. Empty when every variant ran.",
                "items": {
                  "properties": {
                    "query": {
                      "type": "string"
                    },
                    "reason": {
                      "description": "Why this variant's pipeline failed.",
                      "type": "string"
                    }
                  },
                  "required": ["query", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "queries_run": {
                "description": "How many of the submitted query variants completed successfully.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "results": {
                "description": "One deduped, RRF-merged ranked list across all query variants; each hit carries `matched_queries` provenance.",
                "items": {
                  "properties": {
                    "abstract": {
                      "type": "string"
                    },
                    "arxiv_id": {
                      "type": "string"
                    },
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "citation_count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "compares_against": {
                      "description": "No longer set; kept because released output schemas only grow.",
                      "type": "string"
                    },
                    "conference": {
                      "description": "Conference short name (e.g. NeurIPS, CCS).",
                      "type": "string"
                    },
                    "contexts": {
                      "description": "Present by default and in detail mode: the matched span(s) inside this paper; where a search checked conditions, the evidence for each comes first, labelled by condition (from any section), then the span that best answers the request; no other span from the abstract. Use to ground an answer; for full text call get_paper_fulltext.",
                      "items": {
                        "properties": {
                          "chunk_id": {
                            "description": "Stable id of the source chunk; deep-links the exact matched span.",
                            "type": "string"
                          },
                          "condition": {
                            "description": "Set on the passage a condition check named as evidence: the condition (one of the response's conditions) this passage shows the paper meets.",
                            "type": "string"
                          },
                          "score": {
                            "description": "The retriever's score for this span. A semantic match and a span that names a query term literally score on different scales, so do not compare them; rerank_score is the paper's relevance.",
                            "type": "number"
                          },
                          "section": {
                            "description": "Section the chunk came from (e.g. Methods, Results).",
                            "type": "string"
                          },
                          "text": {
                            "description": "The exact matched text span from the paper.",
