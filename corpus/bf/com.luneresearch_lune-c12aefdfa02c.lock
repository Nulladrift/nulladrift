                      "type": "integer"
                    },
                    "matched_queries": {
                      "description": "Which of the input queries surfaced this paper, with each variant's 1-based rank. Use it to see which fan-out variants paid off.",
                      "items": {
                        "properties": {
                          "query": {
                            "description": "The input query variant that surfaced this paper.",
                            "type": "string"
                          },
                          "query_index": {
                            "description": "That variant's 0-based index into `queries`.",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "rank": {
                            "description": "1-based rank of this paper within that variant's ranked list.",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          }
                        },
                        "required": ["query", "query_index", "rank"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "paper_id": {
                      "description": "Lune paper UUID. An internal handle for fetching a paper's FULL TEXT via get_paper_fulltext; do NOT show it to the user. Cite papers by title, authors, and venue instead.",
                      "type": "string"
                    },
                    "pdf_cdn_url": {
                      "type": "string"
                    },
                    "rerank_score": {
                      "description": "Raw Cohere Rerank v3.5 relevance, calibrated 0..1. Present only when the reranker ran; omitted for a lone-term query, which skips it, and after a reranker failure. This is the calibrated relevance and the basis for best_score / low_confidence.",
                      "type": "number"
                    },
                    "score": {
                      "description": "The reranker's score when it ran, otherwise a fused retrieval score on a different scale. Hits arrive in the requested order, and a single search's relevance order also follows a language model's grades of the top results, so a lower score can come first: keep that order instead of re-sorting by score. rerank_score is the calibrated relevance.",
                      "type": "number"
                    },
                    "snippet": {
                      "description": "Concise-mode grounding: the top matched span, or a truncated abstract.",
                      "type": "string"
