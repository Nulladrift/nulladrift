        {
          "name": "search_related_papers",
          "title": "Search related papers",
          "description": "Given a paper_id, return the most semantically similar papers by embedding distance, NOT by citation links. Use for “more papers like this one” / “adjacent work on the same topic”. For papers this one cites or that cite it, use `get_paper_citations` instead. Each hit carries metadata, abstract, the closest non-abstract matched chunk as `contexts`, and a `similarity` score (0..1, higher is nearer). Returns up to `limit` papers; an unknown paper_id is an error, an empty list means no neighbors were found.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 6,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "paper_id": {
                "description": "A corpus paper UUID (from a paper search) to find neighbors for.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["paper_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "papers": {
                "description": "Semantically nearest papers by embedding distance (NOT citation links), ordered nearest-first; empty when none were found.",
                "items": {
                  "properties": {
                    "abstract": {
                      "type": "string"
                    },
                    "arxiv_id": {
                      "type": "string"
                    },
                    "authors": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "citation_count": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "conference": {
                      "description": "Conference short name (e.g. NeurIPS).",
                      "type": "string"
                    },
                    "contexts": {
                      "description": "Nearest non-abstract matched chunk(s) from this related paper, currently at most one. Empty when no parsed chunk is available.",
                      "items": {
                        "properties": {
                          "chunk_id": {
                            "description": "Stable id of the source chunk; deep-links the exact matched span.",
                            "type": "string"
                          },
                          "score": {
                            "description": "The retriever's score for this span. A semantic match and a span that names a query term literally score on different scales, so do not compare them; rerank_score is the paper's relevance.",
                            "type": "number"
                          },
                          "section": {
                            "description": "Section the chunk came from (e.g. Methods, Results).",
                            "type": "string"
                          },
                          "text": {
                            "description": "The exact matched text span from the paper.",
                            "type": "string"
                          }
                        },
                        "required": ["text"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "doi": {
                      "type": "string"
                    },
                    "paper_id": {
                      "description": "Lune paper UUID. A fetch handle for get_paper_fulltext; do not show it to the user. Cite by title, authors, and venue.",
                      "type": "string"
                    },
                    "pdf_cdn_url": {
                      "type": "string"
                    },
                    "similarity": {
                      "description": "Embedding cosine similarity to the seed paper (higher is nearer, ~1 is almost identical). Use it to gauge how related each neighbour is.",
                      "type": "number"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "year": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["authors", "citation_count", "contexts", "title"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["papers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
