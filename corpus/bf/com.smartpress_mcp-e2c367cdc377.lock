        },
        {
          "name": "get_file_session_analysis",
          "description": "Read the stored file summary for a file session. Returns { analysis } where analysis is the summary analyze_file stored (page count, finished size, size without bleed, and the file-derived selections), or null when the file session carries no stored summary. Summaries stored before this tool read only sizes may also carry a classification and color palette.\n\nUse this on a fresh product-page arrival to decide whether to open with a file summary and offer to match the configuration. Absence of a summary means \"no analysis → start from scratch\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
