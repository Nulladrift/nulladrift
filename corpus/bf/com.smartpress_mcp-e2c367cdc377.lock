        {
          "name": "recommend_products",
          "description": "Find products that print an uploaded file. The file's finished size and page count are checked against every product you can offer: a standard size of the product first, then a custom size within its limits; products that can't print it are left out. When there are words to go on (the customer's own, passed as query, else the file's name), the products those words match come first.\n\nReturns up to 5 candidates, each with productId, productName, a rationale, a 0-1 confidence, matchSignals, and initialSelections in the configuration's shape (the size, with the standard size's id, and the page count for a booklet). When the file may include bleed and that can't be told, the candidates carry no size and a note says so: ask the customer which size they want. Pass the uploaded file's fileSessionId, or the result of analyze_file. Then create the configuration with the customer's choice: create_config_session takes initialSelections as selections and the customer's other choices by name in options.",
