        {
          "name": "get_product_templates",
          "description": "Get the downloadable print templates and design guides for a Smartpress product. Returns:\n\n- **summary**: a one-line description of what this product has — paraphrase this rather than counting the arrays yourself.\n- **designGuides**: instructional PDFs about how to set artwork up (bleed, folding). Not tied to a size.\n- **templateGroups**: the print templates, in the groups the layout team defined (e.g. \"Flat\", \"Single Fold\"). `group` is omitted when a product's templates are not grouped, which is common.\n- Each entry has a **label** (what to call it to the customer) and **files** (format -> download URL, e.g. `{\"pdf\": \"https://...\", \"idml\": \"https://...\"}`).\n\nUse this when a customer asks for a template, a layout guide, artwork setup help, dimensions to design to, or an InDesign file. If you only know the product by name, call find_products first and pass its \"id\" (e.g. \"SLS_7\") here.\n\nRules:\n- Give customers the exact URLs this tool returned. Never construct, guess, or edit a template URL.\n- Use the **label** verbatim when naming a template. Labels are display text written by the layout team — do NOT parse them as dimensions or assume a label matches the customer's configured size.\n- Only offer a format that appears in that entry's **files**. Most templates have PDF and InDesign, but some have only one, and a few are Illustrator or spreadsheets.\n- If a product has none, say so plainly. Many products have no templates yet — that is normal, not an error, and you must not substitute another product's template.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "Only return templates available in this format, and only that file. Omit for all formats.",
                "enum": ["pdf", "idml", "ai", "eps", "xls", "xlsx"],
                "type": "string"
              },
              "include": {
                "description": "Limit the response to print templates or to design guides. Omit for both.",
                "enum": ["templates", "guides"],
                "type": "string"
              },
              "productId": {
                "description": "Product ID with prefix, e.g. \"SLS_7\". Get it from find_products or the page context.",
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
