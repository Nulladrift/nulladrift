        {
          "name": "add_to_cart",
          "description": "Add the current session configuration to the cart. Calls the add-to-cart endpoint which translates the session's selections into the format required by the external cart service.\n\nOn success, returns a **clientKey** (anonymous cart identifier) and a **cartLink** (shareable URL to view the cart). These are also persisted on the session and will appear in all subsequent session responses.\n\nIf neither clientKey nor userId is provided, a new anonymous cart is created. Repeat calls add the item again (no idempotency).\n\n**Files are attached automatically.** If the session was linked to a file session (via create_file_session with productConfigSessionId, link_file_session, or create_config_session called with a fileSessionId), the backend resolves the file session from the configuration session — you do NOT need to pass fileSessionId. Only pass fileSessionId to override that durable link with a specific file session.\n\nThe cartLink opens the cart on the Smartpress website, where the customer reviews the order and checks out.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clientKey": {
                "description": "Optional anonymous cart identifier. If omitted, uses the session's persisted clientKey or creates a new cart.",
                "type": "string"
              },
              "fileSessionId": {
                "description": "Optional override. Normally omit this — the backend resolves the file session from the durable config<->file link. Only set it to force a specific file session.",
                "type": "string"
              },
              "jobName": {
                "description": "Optional custom job name. Defaults to the product name if not provided.",
                "type": "string"
              },
              "sessionId": {
                "description": "Configuration session ID (UUID)",
                "type": "string"
              },
              "userId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "Optional user identifier for authenticated carts"
              }
            },
            "required": ["sessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add To Cart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:91feb35f7eb13b2cd67479e84404f30c3575fa3870a58ed12617c6daf0313a2b"
        },
        {
          "name": "analyze_file",
          "description": "Read a file already uploaded to a file session: its finished size, page count and orientation. Returns facts in a few seconds, not a reading of the file's content (no text, colors or design classification).\n\nThe finished size is the file's trim box when it has one. Without one, a page that is a standard product size plus standard bleed (0.125 in a side) is read as that size with bleed; otherwise the page is the size. recommendedSelections carries that finished size (left out when it can't be told), ready to compare with a configuration. Works on PDF, PNG and JPEG (an image needs a resolution to have a size). Pass the result, or just the fileSessionId, to recommend_products to find products that print this size.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fileName": {
                "description": "Which file to read. Optional when the session has exactly one file.",
                "type": "string"
              },
              "fileSessionId": {
                "description": "File session ID holding the uploaded file.",
                "type": "string"
              },
              "waitSeconds": {
                "description": "How long to wait for a just-uploaded PDF to be read before falling back to its page sizes (default 10; at most 30 is used).",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["fileSessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Analyze File"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:682096bbb2f8507415b25ee215cfc1cd8acf8f68ca494433dde53a30f1923a87"
        },
        {
          "name": "clone_file_session",
          "description": "Copy a file session — files, approved proofs, and completed check results — into a NEW file session, leaving the original and its configuration join untouched. Optionally link the CLONE to a configuration session in the same call.\n\nUse this instead of link_file_session whenever the source file session is one a page is currently displaying: linking would MOVE the single join pointer and strip the files off that page, while cloning gives the target configuration its own copy. Typical case: the customer is on a product page and selects a recommended candidate — clone the page's file session and link the clone to the candidate's configuration session.\n\nReturns the new **fileSessionId** (the clone), the sourceFileSessionId, and fileCount.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fileSessionId": {
                "description": "Source file session ID to copy.",
                "type": "string"
              },
              "productConfigSessionId": {
                "description": "Configuration session ID to link the CLONE to (e.g. the selected candidate).",
                "type": "string"
              }
            },
            "required": ["fileSessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Clone File Session"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d60c2c994f4b68c0184bb2c11f8353685e042324d30f54584b37fc77c5014874"
        },
        {
          "name": "create_config_session",
          "description": "Create a product configuration: the customer's order for one product, with its live price.\n\n**Name the options:** pass productId, quantity, and `options` with the customer's choices by name, e.g. {\"productId\": \"SLS_12\", \"quantity\": 500, \"options\": {\"paper\": \"120# Cover Coated Gloss\", \"backInk\": \"None\", \"finishing\": {\"rounded corners\": \"1/4 inch\"}}}. Names are matched to the product's choices; you don't need get_product_config first. Every choice left out keeps the product's default.\n\nThe result leads with productConfigSessionId and a one-line summary, then `chosen` (every choice by name), `applied`, and `notApplied`: options that matched nothing or more than one choice, or that need an answer, each with the reason and the valid names. Ask the customer about each notApplied entry, then fix it with update_config_session. It also has quote, selections, validation (with selectionChangeMessages) and configurationUrl (a link to the configuration on the storefront).\n\nProvide either a productId (to start from product defaults) or a productConfigId (to bootstrap from an existing blueprint or configuration). Once the order is right, use add_to_cart.\n\n**Exact ids instead of names (selections):** the rest of this description covers `selections`, which takes the product's ids from get_product_config. Use names unless you already hold the ids.\n\n**IMPORTANT — selections structure:** The selections object must use nested objects that mirror the structure of the selections field in the response. Flat keys are silently ignored (no error returned). Always verify the response's selections match what you requested.\n\nKnown selection keys and their required structure:\n\n- **Size** — nested sizeSelection object:\n  {\"sizeSelection\": {\"width\": 6, \"height\": 9, \"presetDimensionsId\": 15}}\n  For custom dimensions, omit presetDimensionsId or set it to null.\n\n- **Quantity & Pages** — flat top-level keys (these DO work as simple values):\n  {\"quantity\": 1200, \"pages\": 20}\n\n- **Paper** — nested paperSelection object:\n  {\"paperSelection\": {\"pressSheetTypeId\": 78, \"pressSheetWeightId\": 5, \"coverPressSheetTypeId\": 78, \"coverPressSheetWeightId\": 3}}\n\n- **Ink** — nested objects per ink position:\n  {\"coverSide1Ink\": {\"id\": 146}, \"coverSide2Ink\": {\"id\": 146}, \"interiorSide1AndSide2Ink\": {\"id\": 146}}\n\n- **Proof** — nested proofSelection:\n  {\"proofSelection\": {\"proofId\": 1}}\n\n- **Turnaround** — nested turnTimeSelection:\n  {\"turnTimeSelection\": {\"turnTimeId\": 13}}\n\n- **Operations** — nested operationSelections with operation name keys:\n  {\"operationSelections\": {\"laminatingCoverOnly\": {\"operationId\": 81, \"itemId\": 2323}}}\n  An entry accepts ONLY operationId, itemId, operationName, itemName, followUpQuestionAnswer, followUpQuestion and followUpQuestionDataType — any other key is rejected with a validation error.\n\n- **Follow-up answers** — when an operation in availableOptions has a followUpQuestion (e.g. shrink-wrapping \"How many pieces per bundle do you want?\", drilling \"Please note placement.\"), put the customer's answer in followUpQuestionAnswer on the SAME entry, as a string even for integer questions:\n  {\"operationSelections\": {\"shrinkwrappingService\": {\"operationId\": 14, \"itemId\": 42, \"followUpQuestionAnswer\": \"20\"}}}\n  Each update replaces the whole entry, so resend followUpQuestionAnswer whenever you resend that operation. Ask the customer if they chose the operation without answering its question.\n\n**General rule:** Look at the selections object in the response — use the same key names and nesting structure when sending updates. Invalid or unrecognized keys are silently ignored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fileSessionId": {
                "description": "File session ID to durably join to this configuration (file-first workflow): pass the fileSessionId create_file_session returned in this conversation. Omit it and no file is linked. Once linked, add_to_cart attaches files without needing this ID.",
                "type": "string"
              },
              "options": {
                "additionalProperties": false,
                "description": "The customer's choices by name (see the description). Applied after any selections.",
                "properties": {
                  "backInk": {
                    "description": "Back ink by name: \"Full Color\", \"Black Only\", or \"None\" for a blank back.",
                    "type": "string"
                  },
                  "finishing": {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "properties": {
                            "answer": {
                              "description": "The customer's answer to the option's follow-up question, as text (\"25\").",
                              "type": "string"
                            },
                            "choice": {
                              "description": "The finishing choice by name, e.g. \"Bundles\".",
                              "type": "string"
                            }
                          },
                          "required": ["choice"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "description": "Finishing options keyed by name, e.g. {\"coating\": \"Ultra Gloss UV, 1 side\", \"rounded corners\": \"1/4 inch\", \"shrink-wrapping\": {\"choice\": \"Bundles\", \"answer\": \"25\"}}. null removes one.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "frontInk": {
                    "description": "Front ink by name, e.g. \"Full Color\" or \"Black Only\".",
                    "type": "string"
                  },
                  "paper": {
                    "description": "Paper by name, e.g. \"120# Cover Coated Gloss\" or \"100 lb gloss cover\".",
                    "type": "string"
                  },
                  "size": {
                    "description": "Finished size, e.g. \"3.5 x 2\" (either way round) or a standard size's name. A custom size is used when the product allows one.",
                    "type": "string"
                  },
                  "turnaround": {
                    "description": "Turnaround by name, e.g. \"2 Business Days\".",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "pages": {
                "description": "Page count, for products with pages (booklets).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "productConfigId": {
                "description": "Existing configuration/blueprint UUID to clone from",
                "type": "string"
              },
              "productId": {
                "description": "Product ID to start from defaults, e.g. \"SLS_7\"",
                "type": "string"
              },
              "quantity": {
                "description": "How many to print.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "selections": {
                "additionalProperties": {},
                "description": "Optional initial selections by id, as nested objects mirroring the response selections structure. Prefer options (by name).",
                "properties": {
                  "operationSelections": {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "followUpQuestion": {
                              "type": "string"
                            },
                            "followUpQuestionAnswer": {
                              "description": "The customer's answer to the operation's followUpQuestion (e.g. pieces per bundle for shrink-wrapping, drill placement, starting number). Always a string, even when followUpQuestionDataType is \"integer\" — send \"20\", not 20.",
                              "type": "string"
                            },
                            "followUpQuestionDataType": {
                              "enum": ["string", "integer"],
                              "type": "string"
                            },
                            "itemId": {
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "itemName": {
                              "type": "string"
                            },
                            "operationId": {
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "operationName": {
                              "type": "string"
                            }
                          },
                          "required": ["itemId", "operationId"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "description": "Keyed by camelCase operation name. null deselects the operation. Each entry accepts ONLY operationId, itemId, operationName, itemName, followUpQuestionAnswer, followUpQuestion, followUpQuestionDataType; any other key is rejected.",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Configuration Session"
          },
          "behavior": {
            "destructive": false,
