        },
        {
          "name": "update_config_session",
          "description": "Change a configuration: pass sessionId and only what changes, by name, e.g. {\"sessionId\": \"...\", \"quantity\": 1000, \"options\": {\"turnaround\": \"3 Business Days\", \"finishing\": {\"coating\": null}}}. The result has the same shape as create_config_session's (summary, chosen, applied, notApplied, quote, selections, validation, configurationUrl); it leaves out availableOptions: get_session_latest returns the full state, including which choices are now disabled.\n\n**Exact ids instead of names (selections):** the rest of this description covers `selections`, which takes ids from get_product_config. Use names unless you already hold the ids.\n\n**IMPORTANT — selections structure:** The selections object must use nested objects that mirror the structure of the selections field in the response. Flat keys are silently ignored (no error returned). Always verify the response's selections match what you requested.\n\nKnown selection keys and their required structure:\n\n- **Size** — nested sizeSelection object:\n  {\"sizeSelection\": {\"width\": 6, \"height\": 9, \"presetDimensionsId\": 15}}\n  For custom dimensions, omit presetDimensionsId or set it to null.\n\n- **Quantity & Pages** — flat top-level keys (these DO work as simple values):\n  {\"quantity\": 1200, \"pages\": 20}\n\n- **Paper** — nested paperSelection object:\n  {\"paperSelection\": {\"pressSheetTypeId\": 78, \"pressSheetWeightId\": 5, \"coverPressSheetTypeId\": 78, \"coverPressSheetWeightId\": 3}}\n\n- **Ink** — nested objects per ink position:\n  {\"coverSide1Ink\": {\"id\": 146}, \"coverSide2Ink\": {\"id\": 146}, \"interiorSide1AndSide2Ink\": {\"id\": 146}}\n\n- **Proof** — nested proofSelection:\n  {\"proofSelection\": {\"proofId\": 1}}\n\n- **Turnaround** — nested turnTimeSelection:\n  {\"turnTimeSelection\": {\"turnTimeId\": 13}}\n\n- **Operations** — nested operationSelections with operation name keys:\n  {\"operationSelections\": {\"laminatingCoverOnly\": {\"operationId\": 81, \"itemId\": 2323}}}\n  An entry accepts ONLY operationId, itemId, operationName, itemName, followUpQuestionAnswer, followUpQuestion and followUpQuestionDataType — any other key is rejected with a validation error.\n\n- **Follow-up answers** — when an operation in availableOptions has a followUpQuestion (e.g. shrink-wrapping \"How many pieces per bundle do you want?\", drilling \"Please note placement.\"), put the customer's answer in followUpQuestionAnswer on the SAME entry, as a string even for integer questions:\n  {\"operationSelections\": {\"shrinkwrappingService\": {\"operationId\": 14, \"itemId\": 42, \"followUpQuestionAnswer\": \"20\"}}}\n  Each update replaces the whole entry, so resend followUpQuestionAnswer whenever you resend that operation. Ask the customer if they chose the operation without answering its question.\n\n**General rule:** Look at the selections object in the response — use the same key names and nesting structure when sending updates. Invalid or unrecognized keys are silently ignored.\n\n**Example — multiple changes in one call:**\n{\"quantity\": 500, \"sizeSelection\": {\"width\": 8.5, \"height\": 11, \"presetDimensionsId\": 1}, \"paperSelection\": {\"pressSheetTypeId\": 78, \"pressSheetWeightId\": 5}, \"turnTimeSelection\": {\"turnTimeId\": 13}}\n\nThe response includes:\n- **validation**: Messages indicating issues with current selections. Check globalMessages and fieldMessages to understand what needs to change.\n- **selectionChangeMessages**: Indicates if any of your selections were automatically adjusted by the system. Always check these after every update — the system may change your selections due to dependency rules.\n- **availableOptionChangeMessages**: Indicates which available options changed as a result of your selections.\n- **configurationUrl**: A direct link to view the configuration on the storefront website (when available).\n\nUse this iteratively: update selections, review validation, update again until validation is clean.\n\n**Send ONLY the selections you are changing.** Every field you send counts as something you asked for, and the server now holds it to that (below).\n\n**⚠ SELECTION_CONFLICT — a refusal, never a transport failure.** If a rule would remove a selection you just changed, the call fails with code `SELECTION_CONFLICT` and **nothing is saved** — the session still holds exactly what it held before, so there is no partial state to clean up. The error carries `conflicts: [{ requested, ruleId, ruleName, message }]`, where `message` is the rule's own explanation, e.g. \"Not compatible with textured papers\".\n\nWhen you see it:\n1. **Do NOT retry the same call.** It is not a network or server error and will fail identically every time.\n2. Tell the customer what is incompatible, using the conflict `message`.\n3. Either pick a compatible alternative, or change the blocking selection first (e.g. move to a coatable stock before selecting coating) — then update again.\n\n**Avoid the conflict up front: never select an option whose `disabled` is true** in `availableOptions`. Disabled options carry a `disabledReason` explaining why. Reading `disabled` before choosing is the difference between a smooth change and a refused one.\n\nNote the server only refuses selections you CHANGED. A rule removing something you did not touch (e.g. raising the quantity past a turnaround band, which drops a turnaround you never mentioned) still succeeds with a 200 and reports it in `selectionChangeMessages` — so keep checking those.",
          "inputSchema": {
