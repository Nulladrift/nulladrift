        },
        {
          "name": "set_proof_approval",
          "description": "Record the customer's decision on a proof: APPROVED (they sign off on the proof as shown), FURTHER_REVIEW (a Smartpress expert checks the file before printing), or DECLINED. An approved proof is what prints: when the order is placed, the approved proof file goes to production and the order item is marked \"User approved their instant proof through an AI assistant.\"\n\nBefore calling this, ALL of these must be true:\n1. The customer has seen the proof: you gave them its `proofFileUrl` from get_file_session_proofs (exactly as returned) or they opened it on smartpress.com. \"It's in the file area\" alone is not enough.\n2. In the same message as the offer, you restated the product, the proof, and every preflight error and warning.\n3. The customer then confirmed with an approve / expert-review action click or a clear yes to that restatement. Never call this unprompted or on an ambiguous reply.\n\nWhich statuses to offer: if the proof has preflight ERRORS, or `noReport: true` (no report, so its errors are unknown), do not offer approval. Offer expert review (FURTHER_REVIEW) first, or a corrected file and a new proof. If it has only WARNINGS (or nothing), offer approval and expert review side by side. Declining is always available.\n\nThe tool re-reads the session and refuses (tool error, nothing written) when the proof isn't in this file session, isn't COMPLETED, or is out of date (`invalid`); refuses APPROVED and FURTHER_REVIEW when the proof carries no `proofFileUrl` (not the current proof the customer could have opened); and refuses APPROVED when the proof has errors or no report. Don't retry a refusal; explain it and offer what it suggests. Approving or requesting review of one proof clears that status from the session's other proofs.\n\nReturns { proofId, fileSessionId, approvalStatus, approvalOrigin, productConfigSessionId, nextStep }. After APPROVED or FURTHER_REVIEW, follow `nextStep`: call add_to_cart with that productConfigSessionId and give the customer the cartLink. Do not stop at the approval.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "approvalMessage": {
                "description": "Optional note in the customer's words, e.g. what an expert should check or why they declined.",
                "maxLength": 1000,
                "type": "string"
              },
              "approvalStatus": {
                "description": "APPROVED, FURTHER_REVIEW (expert review), or DECLINED.",
                "enum": ["APPROVED", "FURTHER_REVIEW", "DECLINED"],
                "type": "string"
              },
              "fileSessionId": {
                "description": "File session ID the proof belongs to.",
                "type": "string"
              },
              "proofId": {
                "description": "The proof `id` from get_file_session_proofs.",
                "type": "string"
              }
            },
            "required": ["approvalStatus", "fileSessionId", "proofId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set Proof Approval"
