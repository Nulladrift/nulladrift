        {
          "name": "send_feedback",
          "title": "Send feedback to Smartpress",
          "description": "Send the user's feedback to the Smartpress team: a problem they ran into, a suggestion, or praise.\n\nRules:\n- Call this ONLY when the user asks to send feedback, report a problem, or pass on praise. Never call it on your own after an error; you may offer it.\n- Before calling, show the user what you'll send (type, and the message) and get their yes.\n- Put the user's own words in \"message\". Leave out payment details, passwords and anything they asked you not to share.\n- Pass the ids of what the conversation was working on (product, configuration, artwork, proof), and for a failed tool call its name and error, so the team can find it.\n\nAfterwards, give the user the reference (e.g. FB-3F9K). Nobody replies through this channel; for help with an order, point them to Smartpress customer support.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
