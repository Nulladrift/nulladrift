        {
          "name": "get_file_session_proofs",
          "description": "Read the proof AND file-check state for a file session. Returns a compact view:\n- isProofable: whether the session's product/config supports proofing. With isProofableUnknown: true the service didn't report it (isProofable then reads false but isn't a refusal: create_proof still runs).\n- isFileCheckAvailable: whether a file check can run. A file check is a preflight report only (no proof file) and is often available when proofing is not.\n- files: [{ fileName, isProofable, isProofableUnknown?, isFileCheckAvailable }] per uploaded file (isProofableUnknown: neither the file nor the session reported the flag, so its false means unknown).\n- proofs: newest-first, each { id, fileName, type, status, approvalStatus, invalid, invalidReason, errors[], warnings[], noReport, createdAt, proofFileUrl, totalPages }.\n- checks: newest-first file checks, each { id, fileName, type, status, invalid, errors[], warnings[], noReport, createdAt }.\n\n`id` is the proofId / checkId the create call returned — match on it to find the job you just started (an older proof or check for the same file may still be listed). A proof or check is \"ready to report\" when status is COMPLETED. `invalid: true` means a later configuration change made it stale and it needs re-running — it is computed server-side; just read it. Checks carry no invalidReason (only one reason is kept per session, chosen for proofs, so it reads wrong for checks), so describe a stale check in your own words. `errors`/`warnings` are the preflight messages shown to the customer (capped for length). `noReport: true` means a COMPLETED proof or check has no preflight report (for example a proof copied from a past order), so its errors and warnings are unknown, not empty: never tell the customer it has no issues. `proofFileUrl` is a signed link to the proof PDF. For each file currently in the session, only the latest proof that is neither invalid nor failed can carry it, and only once that proof is COMPLETED. While a newer proof of that file is still running, or if the file was replaced or removed, there is no link. It stops working within 24 hours of this read, possibly sooner; read again for a fresh one. If you pass it on, use it exactly as returned: never shorten, rebuild, or guess it, or the signature breaks. `productConfigSessionId` is the configuration session this file session is linked to: the sessionId add_to_cart takes. Use this to suggest a proof (or a file check when not proofable), report issues, answer questions about them, and detect when a config change invalidated a proof or check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fileSessionId": {
                "description": "File session ID to read proof and file-check state from.",
                "type": "string"
              }
            },
            "required": ["fileSessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get File Session Proofs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d09f251872bd3fc5fe5929acb3f94dc3a74c02e0dda49a6c2fd8435d21c8dfde"
        },
        {
          "name": "get_file_upload_url",
          "description": "Mint a short-lived presigned URL that a client (a browser, an app, or the user) can use to upload a file directly to storage, attached to a file session.\n\nUse this when the bytes are NOT on the machine running this server — e.g. the remote/hosted server, or a file the user has in a browser. (If this server also offers a tool that uploads a file from the local machine, prefer it for local files: it performs the upload for you.)\n\n**Easiest for a person:** if the response includes **uploadPageUrl**, give that link to the user. It opens a simple Smartpress upload page in their browser where they pick the file; the page uploads it directly and securely (the file never passes through the chat).\n\n**For a programmatic client:** issue a single HTTP **PUT** to **url** with the raw file bytes as the body and **no extra headers** — do not set Content-Type and do not add x-amz-* headers; everything required is already baked into the URL. The URL expires (default 15 minutes), so use it promptly. Confirm the result with list_session_files.\n\nReturns **uploadPageUrl** (when the server has a public base URL configured), the raw **url**, the assigned **sessionFileId**, the storage **key**, and **expiresAt**.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "expiresIn": {
                "description": "Presigned URL lifetime in seconds (1-3600, default 900).",
                "maximum": 3600,
                "minimum": 1,
                "type": "integer"
              },
              "fileName": {
                "description": "Name to store the file under, e.g. \"artwork.pdf\".",
                "type": "string"
              },
              "fileSessionId": {
                "description": "File session ID returned by create_file_session.",
                "type": "string"
              }
            },
            "required": ["fileName", "fileSessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get File Upload URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4fbd69558c2bb1e7ad1d51bf8e9b730ac9f367364d02d766d7d28d55b4f2e1a4"
        },
        {
          "name": "get_product_config",
          "description": "A product's menu: every choice the customer can make, by name and id, with the defaults and the starting price. Call it when the customer asks what's available, or to show choices; to configure, create_config_session takes the choices by name and doesn't need this first.\n\n- **availableOptions**: the choices by category:\n  - **presetDimensions**: standard sizes; customDimensionsSupported and customSizeLimits for custom sizes.\n  - **pressSheets**: papers (type, then weight, then color).\n  - **side1Inks / side2Inks**: front and back ink (side2 \"None\" = blank back).\n  - **turnaroundTypes**: turnaround times, with estimatedDeliveryDate and maxQuantity.\n  - **operations**: finishing options keyed by camelCase name, each with its items; a followUpQuestion is asked when that option is chosen.\n  - An option whose `disabled` is true can't be chosen with the defaults; `disabledReason` says why.\n- **selections**: the default choices.\n- **quote**: the default price.\n- **validation**: messages about the default choices.",
          "inputSchema": {
