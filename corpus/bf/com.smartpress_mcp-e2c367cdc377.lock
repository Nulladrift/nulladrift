            "readOnly": false
          },
          "digest": "sha256:5bc5d032c34171621fe57064ef0119bdeebacde7ed951dfb9a3c590394302be8"
        },
        {
          "name": "create_file_check",
          "description": "Run (enqueue) a file check for a file in a file session: the proof service preflights the file against the product's print specs and produces a report of errors/warnings. Unlike create_proof it makes NO proof file — the report is the whole result, and there is nothing to approve.\n\nUse it when the session is NOT proofable but isFileCheckAvailable is true (read get_file_session_proofs first). When the session is proofable, prefer create_proof.\n\nReturns { checkId, ... } once enqueued. A check takes tens of seconds — after calling this, poll get_file_session_proofs until the `checks` entry whose `id` equals checkId reaches status COMPLETED, then report its errors/warnings. Refuses (tool error, nothing queued) when the session or file isn't eligible for a file check — do not retry a refusal.\n\nONLY call this on the customer's explicit go-ahead (a run-file-check quick-action click or a clear yes) — never unprompted. The file must already be uploaded to the session.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fileName": {
                "description": "The file in the session to check (exact name).",
                "type": "string"
              },
              "fileSessionId": {
                "description": "File session ID holding the uploaded file.",
                "type": "string"
              }
            },
            "required": ["fileName", "fileSessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create File Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5bcc0ad7d9927f4e7a8680b19b493eb390a67af264b8127194bf84557aa06a9e"
        },
        {
          "name": "create_file_session",
          "description": "Create a file session for uploading proof/artwork files. Returns a **fileSessionId**. Once it is joined to a configuration session, add_to_cart attaches its files without you passing the ID.\n\n**Two workflows:**\n- **File-first** (no product chosen yet): call with no arguments. A placeholder product is used. When the product is chosen, you MUST pass this fileSessionId to create_config_session (or call link_file_session): nothing joins them otherwise, and the configuration has no files. The real product is then reconciled automatically.\n- **Config-first** (configuration session already exists): pass productConfigSessionId (and ideally the productId). The file session is created and linked immediately, so add_to_cart needs only the configuration sessionId.\n\nOnce joined, the link is persisted server-side, so later tools (add_to_cart) need only the configuration sessionId.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "productConfigSessionId": {
                "description": "Existing configuration session ID to link this file session to immediately (config-first).",
                "type": "string"
              },
              "productId": {
                "description": "Product ID, e.g. \"SLS_7\". Omit for file-first; a placeholder is used until a product is chosen.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create File Session"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3777c3e361eb470d90be8b9c76260549006a2290fa369dc94c06a74f88ac2c1c"
        },
        {
          "name": "create_proof",
          "description": "Generate (enqueue) a preflight proof for a file in a file session: the proof service checks the file against the product's print specs and produces a proof with any errors/warnings.\n\nReturns { proofId, sessionId } once enqueued. Proof generation takes tens of seconds — after calling this, poll get_file_session_proofs until the proof whose `id` equals proofId reaches status COMPLETED, then report its errors/warnings.\n\n**Artwork orientation (checked before every proof).** If the artwork is turned against the configured size (e.g. 6 x 4 landscape art on a 4 x 6 portrait postcard) and swapping width and height fits it, this tool CHANGES THE CONFIGURED SIZE to match the artwork before proofing. The result then carries `orientation`:\n- `changedNow` (on the swap actions) is true only when THIS call changed the size. Announce a size change to the customer ONLY when `changedNow` is true, never otherwise.\n- `action: \"swapped\"` (`changedNow: true`): the size was changed (`from` → `to`, plus the new `price`) and the proof uses the new size. You MUST tell the customer the size changed, and the price if it changed, in your next message.\n- `action: \"swapped-not-synced\"` (`changedNow: true`): this call changed the size (`from` → `to`) but NO proof was started yet (no proofId) because the file service hasn't picked it up. Tell the customer the size changed, then call create_proof again in a few seconds.\n- `action: \"swapped-earlier\"` (`changedNow: false`): the configuration already had the size that fits the artwork (an earlier create_proof changed it, or the customer chose it); nothing was changed now and this proof uses it. Don't announce it as a new change.\n- `action: \"warned\"`: the artwork is turned but the size was NOT changed (`message` says why; `reason: \"config-not-synced\"` means the file service had not caught up with the configuration, so the proof may come back invalid and need re-running). The proof will show the artwork unrotated, possibly cut off, with a warning. Tell the customer before they review it; offer a corrected file or a different size.\n`orientation.message` states what happened in plain words. No `orientation` means the artwork already fits the size's orientation.\n\nONLY call this on the customer's explicit go-ahead (a create-proof quick-action click or a clear yes) — never unprompted. The file must already be uploaded to the session. Read get_file_session_proofs first: a session or file with isProofable false (and no isProofableUnknown) can't be proofed, and this call refuses it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "fileName": {
                "description": "The file in the session to proof (exact name).",
                "type": "string"
              },
              "fileSessionId": {
                "description": "File session ID holding the uploaded file.",
                "type": "string"
              }
            },
            "required": ["fileName", "fileSessionId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Proof"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:17fcb39dabddcf90b0340a5520a5abda7866f0073f0e65135adc60628e3348d8"
        },
        {
          "name": "find_products",
          "description": "Find Smartpress products matching a name or description. Returns matching products with their id, name, and description (plus group, link, image and a relevance score).\n\nOnly products that can be configured through this assistant are returned. If nothing fits, say so and point the customer to smartpress.com rather than suggesting a product from memory.\n\nUse this to discover products by what the user is trying to print (e.g. \"saddle stitch booklet\", \"matte business cards\"). Take the \"id\" of the best match (e.g. \"SLS_7\") and pass it to create_config_session as productId to configure the product, then add_to_cart.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum number of products to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, e.g. \"saddle stitch booklet\" or \"matte business cards\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
