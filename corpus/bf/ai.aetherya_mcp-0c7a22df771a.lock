        {
          "name": "aetherya_run_study",
          "title": "Run a research study with a synthetic audience",
          "description": "Run a Research Lab study — pricing sensitivity, message testing, concept testing, focus groups — against a synthetic audience and get a structured verdict with segment breakdowns, objections and representative reactions. Call aetherya_list_capabilities first to pick a method and see the inputs it needs. Results are SIMULATED predicted behaviour, not feedback from real users.",
