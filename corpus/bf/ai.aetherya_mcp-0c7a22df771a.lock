                "type": "array"
              },
              "reportId": {
                "type": "string"
              },
              "reportLanguage": {
                "type": "string"
              },
              "score": {
                "description": "Predicted experience score, 0-100, when available.",
                "type": "number"
              },
              "source": {
                "description": "Always 'synthetic_audience_simulation'.",
                "type": "string"
              },
              "status": {
                "description": "'completed' when findings are inline, or 'running' when pollable.",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
