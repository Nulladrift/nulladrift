                  "required": ["description", "key", "label"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "website_url": {
                "description": "Optional. A site to infer the audience from — Aetherya analyzes it and generates personas that match its likely visitors.",
                "format": "uri",
                "type": "string"
              }
