                    "maxItems": 8,
                    "type": "array"
                  },
                  "market": {
                    "description": "Market, e.g. 'Romania'.",
                    "type": "string"
                  }
                },
                "required": ["brand"],
                "type": "object"
              },
              "category": {
                "description": "Optional. A category/segment label for the audience (e.g. 'e-commerce', 'fintech').",
                "type": "string"
              },
              "count": {
                "description": "How many synthetic personas to create (1-25, default 3).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "description": {
                "description": "Who to simulate, in plain language (e.g. 'price-sensitive first-time SaaS buyers in Germany' or 'busy parents shopping for groceries online'). When provided, Aetherya engine-generates personas matching it; omit for a general-consumer audience.",
                "type": "string"
              },
              "language": {
                "description": "Optional. Language for the personas, e.g. 'ro'.",
                "type": "string"
              },
              "market": {
                "description": "Optional. Target market / locale as a country or region (e.g. 'US', 'DE', 'UK').",
                "type": "string"
              },
              "pack_name": {
                "description": "Optional. Name for the saved audience pack.",
                "type": "string"
              },
              "segments": {
                "description": "Optional. Explicit audience segments (max 12); weights follow 'size'. Builds a manual blueprint.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand_awareness": {
                      "description": "How familiar this segment is with the brand.",
                      "enum": ["unaware", "aware", "considering", "customer", "lapsed"],
