                "description": "Check an existing plan instead of starting one. Mutually exclusive with objective.",
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Optional. Report language, e.g. 'ro'.",
                "type": "string"
              },
              "market": {
                "description": "Optional. Target market, e.g. 'RO'.",
                "type": "string"
              },
              "max_wait_seconds": {
