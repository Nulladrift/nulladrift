        {
          "name": "aetherya_test_flow",
          "title": "Test which exit an ad and landing page drive people to",
          "description": "Simulate people who arrive from an ad (image, video or copy), land on a page, and take one of several exits (for example book a consultation, open the plan form, or leave). Reports the exit split per arm. Pass rewrites to compare a changed ad and page copy against the original on the same audience. The first call quotes the cost and starts nothing; call again with accept_cost true once the user agrees. Collect results with aetherya_get_result kind 'flow'. Results are SIMULATED, not real-user data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accept_cost": {
                "description": "Leave unset on the first call: nothing starts and the quote comes back. Set true only after the user agrees to the quoted cost.",
                "type": "boolean"
              },
              "ads": {
                "description": "0-2 ads. Each simulated visitor sees one ad first; with two, they are split across them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "asset_id": {
                      "description": "An image or video already uploaded and read through the Read card. The ad is then what that read described (image: its description; video: speech and on-screen text only). Use instead of description.",
                      "format": "uuid",
                      "type": "string"
                    },
                    "description": {
                      "description": "The ad's copy, or what the image or video shows and says. Give this or asset_id.",
                      "maxLength": 6000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "kind": {
                      "description": "What the ad is. asset_id needs image or video.",
                      "enum": ["image", "video", "copy"],
                      "type": "string"
                    },
                    "label": {
                      "description": "Short name for the ad, e.g. 'Spring carousel'.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "label"],
                  "type": "object"
                },
                "maxItems": 2,
                "type": "array"
              },
              "audience": {
                "description": "Optional. A synthetic audience: a persona id or name from aetherya_list_audiences, or a short free-text description (e.g. 'first-time SaaS buyers').",
                "type": "string"
              },
              "exits": {
                "description": "1-4 ways the visit can end. A visitor takes the first exit whose signal matches, or leaves. Give at least one signal per exit: form_contains (most reliable), url_contains or text_visible.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "form_contains": {
                      "description": "Words found only in this exit's form or on its final button (not in the other exit's form), e.g. 'Phone' or 'Generate my plan'. The most reliable signal.",
                      "type": "string"
                    },
                    "label": {
                      "description": "What this exit is, e.g. 'Book a consultation'.",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "primary": {
                      "description": "The exit that matters most. One exit should be primary; the first is used if none is.",
                      "type": "boolean"
                    },
                    "text_visible": {
                      "description": "Text that appears only after this exit, e.g. a confirmation message.",
                      "type": "string"
                    },
                    "url_contains": {
                      "description": "Part of the thank-you URL, e.g. '/thank-you'.",
                      "type": "string"
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "num_agents": {
                "description": "Simulated visitors per arm. Default 6. Each arm runs this many, and the ads are split round-robin across them. Cost is quoted per arm.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "page_url": {
                "description": "The landing page the ads send people to.",
                "format": "uri",
                "type": "string"
              },
              "rewrites": {
                "additionalProperties": false,
                "description": "Adds a second arm, 'rewrite', run against the same audience as 'original'. Give ads and/or page_copy.",
                "properties": {
                  "ads": {
                    "description": "Same order and count as ads. Each replaces that ad's description in the rewrite arm.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "asset_id": {
                          "$ref": "#/properties/ads/items/properties/asset_id",
                          "description": "An image or video already uploaded and read through the Read card. The ad is then what that read described (image: its description; video: speech and on-screen text only). Use instead of description."
                        },
                        "description": {
                          "description": "The rewritten ad copy or visual description.",
                          "maxLength": 6000,
                          "minLength": 1,
                          "type": "string"
                        },
                        "label": {
                          "description": "Optional. Defaults to the original ad's label.",
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "maxItems": 2,
                    "type": "array"
                  },
                  "label": {
                    "description": "Name for the rewrite arm. Default 'rewrite'.",
                    "type": "string"
                  },
                  "page_copy": {
                    "description": "Text swaps applied to the landing page in the rewrite arm only.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "find": {
                          "description": "Exact text on the page.",
                          "minLength": 1,
                          "type": "string"
                        },
                        "replace": {
                          "description": "Text to show instead.",
                          "type": "string"
                        }
                      },
                      "required": ["find", "replace"],
                      "type": "object"
                    },
                    "maxItems": 40,
                    "type": "array"
                  }
                },
                "type": "object"
              }
            },
            "required": ["exits", "page_url"],
            "type": "object"
          },
