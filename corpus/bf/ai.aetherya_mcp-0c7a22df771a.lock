        {
          "name": "aetherya_compare_creatives",
          "title": "Compare image creatives",
          "description": "Compare 2+ image creatives (thumbnails, display banners, social images) against a synthetic audience. Creates the experiment, uploads the images, attaches the audience and drafts the comparison (free). It then returns status 'needs_price_confirmation' with the quoted simulation sessions; nothing is spent until you re-call with accept_sessions >= the quote (pass accept_sessions up front to skip the pause). To confirm a draft already created, pass comparison_id + accept_sessions only. Cost scales with creatives x personas; an audience group is capped at 10 personas per segment. choice_task adds a forced-choice round (choiceCost in the quote). Collect the ranking with aetherya_get_result kind 'creative_comparison'. Results are simulated, not real-user data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accept_sessions": {
                "description": "Sessions you accept to spend; must cover the quote.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "audience_group_id": {
                "description": "Audience group (see aetherya_list_audiences).",
                "type": "string"
              },
              "choice_task": {
                "description": "Also run a forced-choice task (each persona picks one creative). Adds sessions; the quote shows choiceCost.",
                "type": "boolean"
              },
              "comparison_id": {
                "description": "Confirm and run a draft created by an earlier call.",
                "type": "string"
              },
              "creatives": {
                "description": "2-10 creatives to compare. Needed unless you pass comparison_id.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "body": {
                      "description": "Body copy shown with the image.",
                      "type": "string"
                    },
                    "concept": {
                      "description": "Creatives sharing a concept are grouped; the first is its representative.",
                      "type": "string"
                    },
                    "cta": {
                      "description": "Call-to-action text.",
                      "type": "string"
                    },
                    "headline": {
                      "description": "Headline shown with the image.",
                      "type": "string"
                    },
                    "image_base64": {
                      "description": "data:image/...;base64,... URL, max 8 MB.",
                      "type": "string"
                    },
                    "image_url": {
                      "description": "http(s) image, png/jpeg/webp, max 8 MB.",
                      "type": "string"
                    },
                    "label": {
                      "description": "Short name for the creative.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "exposure": {
                "description": "glance = a split-second scroll-past view.",
                "enum": ["glance", "considered"],
                "type": "string"
              },
              "name": {
                "description": "Name for the comparison.",
                "minLength": 1,
                "type": "string"
              },
              "persona_ids": {
                "description": "Persona ids (see aetherya_list_audiences), instead of an audience group.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "platform": {
                "description": "Where the creatives run.",
                "enum": ["google_display", "facebook", "instagram", "google_search"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "choiceCost": {
                "type": "number"
              },
              "comparisonId": {
                "type": "string"
              },
              "estimatedSessions": {
                "type": "number"
              },
