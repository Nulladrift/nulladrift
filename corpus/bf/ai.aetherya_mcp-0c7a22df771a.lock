        {
          "name": "aetherya_plan_study",
          "title": "Plan and run a study from a plain-English objective",
          "description": "Give Aetherya a decision you need to make, in plain English, and it designs the study, picks or builds the audience, prices it, and runs it — then writes a decision brief. Use this when you do not already know which research method fits; use aetherya_run_study when you do. It can also simulate a whole funnel (an ad leading to a landing page, and which call to action people take there): describe the ad, the page URL and the goals in the objective. It always stops for your approval at a price before spending anything: expect status 'needs_price_confirmation' and answer it with aetherya_confirm_study. Call it again with autopilot_id to check on a plan already running. Results are SIMULATED predicted behaviour, not real-user research.",
