                "properties": {
                  "brand": {
                    "description": "The brand under test.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "competitors": {
                    "description": "Up to 8 competitor brands.",
                    "items": {
                      "minLength": 1,
                      "type": "string"
