                "description": "How long to wait inline before handing back an id to poll. Defaults to 45.",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              },
              "method": {
                "description": "Research method id, from aetherya_list_capabilities — e.g. 'messaging_test', 'concept_test', 'feature_adoption', 'pricing_van_westendorp', 'focus_group'.",
                "type": "string"
              },
              "objective": {
                "description": "The decision this study should inform.",
                "minLength": 1,
                "type": "string"
              },
              "register": {
                "description": "Optional. Report tone register.",
                "enum": ["formal", "neutral"],
                "type": "string"
              },
              "regulated": {
                "description": "Optional. True for regulated sectors (claims are checked).",
                "type": "boolean"
