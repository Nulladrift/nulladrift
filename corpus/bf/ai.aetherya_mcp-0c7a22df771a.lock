                "description": "Name for the pretest.",
                "minLength": 1,
                "type": "string"
              },
              "persona_ids": {
                "description": "Persona ids, instead of an audience group.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "placement": {
                "default": "generic",
                "description": "Where the video runs.",
                "enum": ["generic", "reels", "shorts", "tiktok", "facebook_feed", "youtube_instream"],
                "type": "string"
              },
              "prepare_job_id": {
                "description": "Resume: from an earlier call.",
