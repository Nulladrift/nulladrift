                "type": "number"
              },
              "audience_group_id": {
                "description": "Audience group (see aetherya_list_audiences).",
                "type": "string"
              },
              "experiment_id": {
                "description": "Resume: from an earlier call.",
                "type": "string"
              },
              "hook_windows": {
                "default": true,
