                "description": "How deeply each respondent engages. Cost multiplier: single_pass 1x, deliberation 2x, deep 4x.",
                "enum": ["single_pass", "deliberation", "deep"],
                "type": "string"
              },
              "hypothesis": {
                "description": "Optional. What you expect to find.",
                "type": "string"
              },
              "language": {
                "description": "Optional. Report language, e.g. 'ro'.",
                "type": "string"
