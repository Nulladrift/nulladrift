                      "description": "data:image/...;base64,... URL, max 8 MB.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "image_path": {
                      "description": "Local png, jpeg or webp file (disabled when AETHERYA_MCP_ALLOW_LOCAL_FILES=0).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "image_url": {
                      "description": "http(s) image, png/jpeg/webp, max 8 MB.",
                      "format": "uri",
                      "type": "string"
                    },
                    "is_control": {
                      "description": "The current/baseline variant. Exactly one; defaults to the first.",
