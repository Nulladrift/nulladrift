      "instructions": "Aetherya runs behavioral simulations with a synthetic audience: it predicts how real users\nwould behave (where they hesitate, get confused, or drop off) — it does not survey real people.\nEvery result is simulated, not real-user data; frame it that way to the user.\n\nThere are two ways in. Pick by what you actually have:\n\nLANE A — you have a decision, not a study design. Call aetherya_plan_study with the objective in\nplain English. Aetherya designs the study, picks or builds the audience, prices it and runs it.\nIt stops at a price and returns status 'needs_price_confirmation'; check with the user, then call\naetherya_confirm_study with accept_sessions set to the quoted figure. Nothing is spent until you\ndo. It may also return 'needs_clarification' with a question — answer it the same way. Re-call\naetherya_plan_study with the autopilot_id to check progress.\n\nLANE B — you already know the method and the exact inputs:\n1. ORIENT — call aetherya_list_capabilities to see which research methods are available and the\n   exact inputs each needs, plus the plan headroom left. Do not guess method ids or enum values.\n2. PRICE — call aetherya_estimate before anything expensive. It is free and runs nothing.\n3. RUN — aetherya_run_study for a research study (pricing, concept, message, focus group),\n   aetherya_test_copy to compare 2-5 copy variants, aetherya_audit_site for a page or flow,\n   aetherya_ask_audience for a quick open-ended reaction, aetherya_simulate_post for a social\n   post or email before it goes out. For a fast, cheap first answer on 2-5 variants, start with\n   aetherya_read (an instant read against a market, in seconds) and test_copy the winner if it matters.\n4. COLLECT — simulations usually outlive a single tool call, so a run normally returns\n   status 'running' plus an id. That is expected. Call aetherya_get_result with the kind and id\n   from the run's `next` hint to collect the findings.\n\nDELIVER (both lanes) — do not stop at raw metrics. aetherya_get_brief turns a finished run into a\nshort decision brief (question, answer, reasoning, risks, what to do next) — that is what you show\nthe user. aetherya_share_result then mints a public link they can send to someone else. Briefs are\ncached, so re-reading one is free.\n\nHistory: aetherya_list_runs finds earlier runs with the kind and id to collect them; do not re-run\nwhat already exists. aetherya_cancel stops a run started by mistake.\n\nImages: aetherya_compare_creatives compares thumbnails or banners (draft is free, it quotes the cost first).\nVideo: aetherya_pretest_video uploads a clip, drafts it and quotes the cost before spending (speech-to-text is charged at prepare unless you pass a transcript); collect with aetherya_get_result kind video_analysis.\n\nAudiences: aetherya_list_audiences shows the synthetic audiences you can target;\naetherya_create_audience generates new ones from a description.\n\nCost: every run reports the simulation sessions it consumed. Four results are states, not\nfailures — 'needs_price_confirmation' (re-send accepting the quoted sessions), 'needs_audience'\n(create an audience first), 'needs_clarification' (answer the question asked) and 'needs_api_key'\n(no credential: ask the user to connect one). Each names its own next call. If a tool reports\nthe plan's simulation limit was reached, relay that plainly and stop retrying.",
      "tools": [
        {
          "name": "aetherya_ask_audience",
          "title": "Ask ONE synthetic persona a question (secondary)",
          "description": "SECONDARY TOOL. Pose a question to a SINGLE synthetic persona and get one predicted, in-character response — good for an open-ended 'would this confuse someone like this?' sounding-out. The answer is SIMULATED (one persona's predicted reaction), not a real person, and ONE persona is not an audience: it carries no distribution and no disagreement, so never report it as what 'users' or 'the audience' think. For a finding you can act on, use aetherya_test_copy (compare variants) or aetherya_run_study / aetherya_plan_study (a panel with a spread of reactions).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Optional. A persona id or name from aetherya_list_audiences to answer as. If omitted, one of your synthetic audiences is chosen automatically.",
                "type": "string"
              },
              "context": {
                "description": "Optional. Background/situation for the audience to consider when answering.",
                "type": "string"
              },
              "language": {
                "description": "Optional. The language to answer in, e.g. 'English' or 'Romanian'. Personas answer in their own native language by default, which is correct for research but unreadable when you asked in another language. Set this to your own language unless you specifically want the persona's.",
                "type": "string"
              },
              "question": {
                "description": "The question to ask the synthetic audience (e.g. 'Would this pricing page confuse you?').",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "type": "string"
              },
