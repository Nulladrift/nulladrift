        {
          "name": "aetherya_confirm_study",
          "title": "Approve, answer, cancel or retry a planned study",
          "description": "Respond to a plan from aetherya_plan_study. Use action 'confirm' with accept_sessions to approve the quoted cost and start the run — this is the point at which simulation sessions are spent, so check with the user first. Use 'answer' to reply to the clarifying questions (answers with the option ids the user picked, or answer for one free-text reply), 'cancel' to abandon the plan, or 'retry' after a failure. After confirming, the run continues and returns its decision brief when it finishes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accept_sessions": {
                "description": "Required for 'confirm': the exact sessions figure from the plan's estimate. Never invent it — a mismatch is rejected and re-quoted.",
                "type": "number"
              },
              "action": {
                "description": "'confirm' accepts the quoted cost and starts the run (requires accept_sessions). 'answer' replies to the clarifying questions (requires answers or answer). 'cancel' abandons the plan. 'retry' re-runs a failed plan.",
                "enum": ["confirm", "answer", "cancel", "retry"],
                "type": "string"
              },
              "answer": {
                "description": "For 'answer': a free-text reply to the (first) question asked. Prefer answers when the plan lists questions.",
                "minLength": 1,
                "type": "string"
              },
              "answers": {
                "description": "For 'answer': one entry per question from the plan's questions, with the optionId the user picked or their own text. A question left out keeps its default. Only relay what the user said.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "optionId": {
                      "description": "The id of the option the user picked.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "questionId": {
                      "description": "A question id from the plan's questions.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "text": {
                      "description": "The user's own words, when no option fits.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["questionId"],
                  "type": "object"
                },
                "maxItems": 3,
                "type": "array"
              },
              "autopilot_id": {
                "description": "The autopilotId from aetherya_plan_study.",
                "minLength": 1,
                "type": "string"
              },
              "max_wait_seconds": {
                "description": "How long to wait inline after confirming before handing back an id. Defaults to 45.",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["action", "autopilot_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
