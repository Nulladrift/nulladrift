        {
          "name": "aetherya_audit_site",
          "title": "Audit a site with a synthetic audience",
          "description": "Run a behavioral simulation: a synthetic audience visits a URL and predicts where real users would hesitate, get confused, or drop off, plus messaging-clarity and UX friction findings with concrete fixes. Ideal for evaluating a freshly built or changed page and getting actionable UX/messaging improvements in the same loop. To find out how people experience a flow (sign-up, onboarding, checkout), pass tasks and start_url: the simulated visitors then walk the flow step by step instead of touring the site. By default they stop before the final submit, so nothing is created or bought; pass allow_test_signups only when the user explicitly allows test sign-ups. Payment is never submitted. For pages behind a login, pass credentials for a dedicated test account the user gave you. Results are SIMULATED (predicted behavior of a synthetic audience), not feedback from real users.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "allow_test_signups": {
                "description": "Flow tests only. Default false: visitors stop before the final submit, so no account is created and no order is placed. Set true only if the user explicitly allows test sign-ups on this site. Payment is never submitted either way.",
                "type": "boolean"
              },
              "audience": {
                "description": "Optional. A synthetic audience to use: a persona id or name from aetherya_list_audiences, or a short free-text description (e.g. 'first-time SaaS buyers'). If omitted, Aetherya simulates a small mixed audience.",
                "type": "string"
              },
              "credentials": {
                "additionalProperties": false,
                "description": "Use a dedicated test account. Sent once, stored encrypted, deleted when the run ends. Never use a real customer or admin account.",
                "properties": {
                  "allowed_hosts": {
                    "description": "Extra hosts the login may pass through (single sign-on), e.g. ['auth.example.com'].",
                    "items": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "login_url": {
                    "description": "Form mode: the login page URL, on the audited site.",
                    "format": "uri",
                    "type": "string"
                  },
                  "mode": {
                    "description": "'form': a login page; 'basic': HTTP basic auth.",
                    "enum": ["form", "basic"],
                    "type": "string"
                  },
                  "password": {
                    "description": "Test account password.",
                    "maxLength": 512,
                    "minLength": 1,
                    "type": "string"
                  },
                  "persona_login": {
                    "description": "'prelogin' (default): Aetherya logs in once and every visitor starts signed in. 'persona': each visitor logs in itself, which tests the login page too.",
                    "enum": ["prelogin", "persona"],
                    "type": "string"
                  },
                  "username": {
                    "description": "Test account username or email.",
                    "maxLength": 320,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["mode", "password", "username"],
                "type": "object"
              },
              "focus": {
                "description": "Optional. What to pay attention to, e.g. 'checkout flow', 'onboarding clarity', 'is the value proposition clear?'.",
                "type": "string"
              },
              "max_wait_seconds": {
                "description": "How long to wait inline before handing back an id to poll. Defaults to 45.",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              },
              "num_agents": {
                "description": "How many simulated visitors walk the page. Default 3. Drives cost — quote it with aetherya_estimate (kind 'audit', audience_size = this number) before raising it.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "objective": {
                "description": "Optional. What you want to find out, in your own words, e.g. 'how do new users feel about our onboarding flow?'. Sent as written (not paraphrased); steers the simulated visitors and the report.",
                "type": "string"
              },
              "scope": {
                "additionalProperties": false,
                "description": "Optional. Restrict where visitors may go: 'site' (whole domain, default), 'path' (a subtree, value '/blog') or 'page' (one page, value a path or full URL).",
                "properties": {
                  "mode": {
                    "description": "'site', 'path' or 'page'.",
                    "enum": ["site", "path", "page"],
                    "type": "string"
                  },
                  "value": {
                    "description": "For 'path': a subtree like '/blog'. For 'page': a path or full URL.",
                    "type": "string"
                  }
                },
                "required": ["mode"],
                "type": "object"
              },
              "start_url": {
                "description": "Optional. Where a flow test begins, e.g. https://example.com/signup. Same site as url. Use together with tasks.",
                "format": "uri",
                "type": "string"
              },
              "tasks": {
                "description": "Optional flow test (max 5 tasks). Each simulated visitor walks the flow step by step and reports where they stall and how each step felt, instead of touring the site. Use it for 'how do people experience our sign-up / onboarding / checkout' questions, with start_url set to where the flow begins. Runs the ux_journey audit.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "expected_outcome": {
                      "description": "Optional. What counts as done, e.g. 'Lands on a welcome or dashboard screen'.",
                      "type": "string"
                    },
                    "instructions": {
                      "description": "Optional extra guidance for the visitor.",
                      "type": "string"
                    },
                    "title": {
                      "description": "What the visitor tries to do, e.g. 'Create an account and reach the first screen'.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["title"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "url": {
                "description": "The full URL of the page to audit (e.g. https://example.com/pricing).",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "executiveSummary": {
                "type": "string"
