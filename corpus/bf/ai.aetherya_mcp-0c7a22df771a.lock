                "type": "string"
              },
              "market": {
                "description": "Who to read against, as a place: 'United States', 'Germany', 'RO'. Defaults to the US.",
                "type": "string"
              },
              "target_action": {
                "description": "The action the variants should drive, e.g. 'Sign up'.",
                "type": "string"
              },
              "title": {
