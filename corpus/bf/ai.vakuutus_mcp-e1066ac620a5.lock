          },
          "digest": "sha256:b1f6e37ed6d644a702fe8d698478f237c4e19503b70a5138942b40ea9b2da059"
        },
        {
          "name": "pikatarkistus_kysymykset",
          "title": "Pikatarkistuksen kysymykset / Quick check questions",
          "description": "Palauttaa pikatarkistuksen viisi kysymystä, vastausvaihtoehdot ja \"miksi kysymme\" -tekstit. Kysy ne käyttäjältä ja anna vastaukset työkalulle pikatarkistus_tulos. EN: Returns the five quick check questions with answer options and why each is asked. Ask them from the user and pass the answers to pikatarkistus_tulos.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
