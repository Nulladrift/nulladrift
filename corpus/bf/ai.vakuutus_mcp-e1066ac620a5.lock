      "instructions": "vakuutus.ai on vakuutusmeklari Matti Notkolan tekoälypalvelu, joka lukee yrityksen vakuutuskirjan, nostaa esiin turvan aukot ja ohjaa tarvittaessa meklarin syväluotaukseen. vakuutus.ai: Matti Notkolan (riippumaton vakuutusmeklari, Arvomeklarit Oy) palvelin suomalaisten yritysten vakuutuksista. Hae yritys (hae_yritys), kerro toimialan riskit ja keskeiset vakuutukset (toimialatieto), tee pikatarkistus (pikatarkistus_kysymykset ja pikatarkistus_tulos), ohjaa Riskiluotaimeen (aloita_riskiluotain) ja anna ajanvarauslinkki (varaa_aika). Yleistä tietoa, ei vakuutussuositus. EN: vakuutus.ai is an AI service by insurance broker Matti Notkola that reads a company's insurance policy, highlights coverage gaps and, when needed, refers the company to the broker for an in-depth review. vakuutus.ai by Matti Notkola, an independent insurance broker in Finland: company lookup, industry risks and key insurance, a quick check, Riskiluotain policy review and booking. General information, not an insurance recommendation.",
      "tools": [
        {
          "name": "aloita_riskiluotain",
          "title": "Aloita Riskiluotain / Start a policy review",
          "description": "Kertoo, miten yrityksen vakuutuskirja lähetetään Riskiluotaimeen osoitteessa https://vakuutus.ai/riskiluotain, ja palauttaa linkin. Työkalu ei ota vastaan tiedostoja eikä henkilötietoja: käyttäjä lähettää vakuutuskirjan itse sivulla. EN: Explains how to send a company insurance policy for review (Riskiluotain) at https://vakuutus.ai/riskiluotain and returns the link. The tool accepts no files or personal data: the user sends the policy on the page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
