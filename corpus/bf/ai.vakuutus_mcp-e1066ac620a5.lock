        {
          "name": "toimialatieto",
          "title": "Toimialatieto / Industry information",
          "description": "Palauttaa toimialan lyhyen vastauksen, tyypilliset riskit, keskeiset vakuutukset ja yleisimmät virheet Matti Notkolan hyväksymästä sisällöstä sekä lähdelinkin sivulle. EN: Returns the short answer, typical risks, key insurance policies and common mistakes for an industry from content approved by Matti Notkola, with a source link.",
