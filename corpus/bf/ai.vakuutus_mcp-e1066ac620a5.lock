          "digest": "sha256:b475025564a592b0d6b5178f4ef1d5f9eaaeab2f93b0a09905f682d3df90ac54"
        },
        {
          "name": "hae_yritys",
          "title": "Hae yritys / Find a company",
          "description": "Hakee yrityksen julkiset tiedot (nimi, Y-tunnus, kotipaikka, päätoimiala) PRH:n avoimesta YTJ-rajapinnasta nimellä tai Y-tunnuksella. EN: Looks up a Finnish company in the public Finnish Business Information System (YTJ) by name or business ID and returns name, business ID, domicile and main industry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "haku": {
                "description": "Yrityksen nimi tai Y-tunnus / company name or business ID",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["haku"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
