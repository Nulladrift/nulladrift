        },
        {
          "name": "pikatarkistus_tulos",
          "title": "Pikatarkistuksen tulos / Quick check result",
          "description": "Muodostaa suuntaa antavat havainnot vastauksista ja yrityksen julkisista tiedoista Matti Notkolan hyväksymillä säännöillä: ryhmät todennäköisesti puuttuu, kannattaa tarkistaa ja hyvä lähtökohta, perustelut ja viittaukset kysymyksiin. Tarkempaan läpikäyntiin ohjaa Riskiluotaimeen (aloita_riskiluotain). EN: Builds indicative findings from the answers and public company data with rules approved by Matti Notkola, grouped as likely missing, worth checking and a good starting point, with reasoning. For a thorough review, point the user to Riskiluotain (aloita_riskiluotain).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ala": {
                "description": "Toimiala, jos koodia ei ole / industry if no code",
                "enum": ["maarakentaminen", "kuljetus", "louhinta", "purkutyot", "teollisuus", "lvis", "siivous", "rakennusala", "muu"],
                "type": "string"
              },
              "henkilosto": {
                "enum": ["alle-10", "10-49", "50-249", "250+"],
                "type": "string"
              },
              "keskeytys": {
                "enum": ["paivia", "viikkoja", "kuukausia"],
                "type": "string"
              },
              "kriittista": {
                "items": {
                  "enum": ["tyokoneet", "kiinteistot", "varasto", "ajoneuvot", "tietojarjestelmat"],
                  "type": "string"
                },
                "type": "array",
                "uniqueItems": true
              },
              "lapikaynti": {
                "enum": ["alle-1", "1-3", "yli-3", "en-tieda"],
                "type": "string"
              },
              "sopimukset": {
                "enum": ["kylla", "ei", "osittain"],
                "type": "string"
              },
              "toimialakoodi": {
                "description": "YTJ:n päätoimialakoodi, esim. 43120 / main industry code from YTJ",
                "maxLength": 10,
                "type": "string"
              },
              "toimialaluokitus": {
                "description": "YTJ:n typeCodeSet, esim. TOL2025 / industry classification",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["keskeytys", "kriittista", "lapikaynti", "sopimukset"],
            "type": "object"
          },
