        {
          "name": "create_alert",
          "title": "Create a saved search alert",
          "description": "Create a saved search alert so FlatHunt notifies the user about new matching listings in the chosen city (Berlin unless `city` is set). Accepts housing, price, size, rooms, availability, canonical area ids, amenity and rental-policy filters. Email notifications are enabled by default; Telegram too when the user has linked Telegram on FlatHunt. Requires the alerts.write scope.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amenityTags": {
                "description": "Canonical amenity tags (AND). Backend filters listings that have ALL of these tags. Catalog (snake_case only): wifi, parking, bike_parking, wheelchair, dishwasher, washing_machine, dryer, elevator, balcony, desk, tv, oven, heating, furnished, fridge, microwave, cooktop, coffee_machine, iron, hair_dryer, closet, wardrobe, bed, bathtub, shower, garden, basement, air_conditioning, parking_street, workspace, fitness, concierge, laundry, pets_friendly. Do not invent aliases (wiFi, hasWifi, Waschmaschine).",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "anmeldungLikely": {
                "description": "true = Anmeldung likely (broader). Prefer for \"with Anmeldung\" unless the user needs a hard guarantee.",
                "type": "boolean"
              },
              "areas": {
                "description": "Canonical area IDs from list_areas (Berlin only, e.g. berlin:ortsteil:prenzlauer-berg). Up to 20 IDs; multiple IDs are combined with OR. District / Ortsteil mode — do not mix with lat/lng/radiusKm. When the user names an area, call list_areas first. Pass only canonical IDs returned by list_areas. Never construct, translate, normalize, or guess IDs.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "availableFrom": {
                "description": "Available from / not earlier than (YYYY-MM-DD), e.g. \"2026-08-01\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "availableTo": {
                "description": "Available until / not later than (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "bedroomsMin": {
                "description": "Minimum number of bedrooms (from provider extra data when available).",
                "minimum": 0,
                "type": "number"
              },
              "city": {
                "description": "City (search market) id from list_cities, e.g. es-madrid. Omit for Berlin (the default). Every search is scoped to one city; areas (district ids) exist only for Berlin.",
                "type": "string"
              },
              "depositMax": {
                "description": "Maximum deposit (Kaution) in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "housingType": {
                "description": "Type of housing. Studios map to apartment; room includes both private and shared rooms unless roomType narrows it.",
                "enum": ["room", "apartment"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude for nearby search; must be provided with lng (+ radiusKm). Do not mix with areas.",
                "type": "number"
              },
              "lng": {
                "description": "Longitude for nearby search; must be provided with lat (+ radiusKm). Do not mix with areas.",
                "type": "number"
              },
              "name": {
                "description": "Optional short label for the saved search (max 120 characters). If omitted, FlatHunt derives a concise label from housing type, budget and location filters.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "noSchufaLikely": {
                "description": "true = Schufa likely not required (broader). Prefer for \"without Schufa\".",
                "type": "boolean"
              },
              "noSchufaRequired": {
                "description": "true = Schufa explicitly not required (strict).",
                "type": "boolean"
              },
              "onlyStudentsAllowed": {
                "description": "true = students-only listings.",
                "type": "boolean"
              },
              "personsMaxMin": {
                "description": "Minimum capacity (personsMax). Use 2 for couples, 1 for solo — filters listings that can accommodate at least this many people.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "petsAllowed": {
                "description": "true = pets explicitly allowed.",
                "type": "boolean"
              },
              "postCode": {
                "description": "Exact post code in the searched city, e.g. 10115 (Berlin).",
                "type": "string"
              },
              "priceMax": {
                "description": "Maximum monthly price in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "priceMin": {
                "description": "Minimum monthly price in EUR.",
                "minimum": 0,
                "type": "number"
              },
              "providers": {
                "description": "Restrict to specific housing providers (ids from the providers catalog).",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "radiusKm": {
                "description": "Search radius in km around lat/lng (min 0.1, max 25). Nearby mode — do not mix with areas.",
                "maximum": 25,
                "minimum": 0.1,
                "type": "number"
              },
              "registrationPossible": {
                "description": "true = Anmeldung / registration explicitly possible (strict).",
                "type": "boolean"
              },
              "roomType": {
                "description": "Room occupancy: private = one private bedroom in shared housing; shared = a bed in a shared bedroom. Omit to include both. housingType=room remains the broad backwards-compatible filter.",
                "enum": ["private", "shared"],
                "type": "string"
              },
              "rooms": {
                "description": "Exact room counts (OR). Allowed values only: \"studio\", \"1\", \"2\", …, \"10\" (strings, not numbers). Prefer over roomsMin/roomsMax for \"1–2 rooms\": [\"1\",\"2\"] or [\"studio\",\"1\"].",
                "items": {
