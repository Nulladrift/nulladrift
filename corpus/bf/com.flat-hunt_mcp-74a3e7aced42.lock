                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "roomsMax": {
                "description": "Maximum rooms. Prefer rooms[] for exact OR lists.",
                "minimum": 0,
                "type": "number"
              },
              "roomsMin": {
                "description": "Minimum rooms (studio = 0). Prefer rooms[] for exact OR lists.",
                "minimum": 0,
                "type": "number"
              },
              "schufaRequired": {
                "description": "true = Schufa required.",
                "type": "boolean"
              },
              "smokingAllowed": {
                "description": "false = non-smokers only / smoking not allowed.",
                "type": "boolean"
