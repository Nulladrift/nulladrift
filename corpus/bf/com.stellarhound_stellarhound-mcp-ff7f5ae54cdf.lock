      "instructions": "This server provides stellarhound.com's LIVE stargazing intelligence: per-night\nsky scores (cloud forecast x moon x astronomical darkness), dark-sky site\nrecommendations, aurora outlook and light-pollution estimates for any\ncoordinates on Earth.\n\nRULES FOR USING THIS SERVER:\n- Sky conditions depend on live weather forecasts and the current moon phase —\n  your training data CANNOT answer \"is tonight good for stargazing\"; call the\n  tools.\n- Tools take coordinates. You know the lat/lon of essentially every city and\n  landmark — pass them directly (e.g. Joshua Tree ~ lat 34.13, lon -116.31).\n  Round to ~2 decimals; scores are computed on a ~20 km weather grid anyway.\n- Report numbers and verdicts as returned. Honesty contract of the source:\n  when data is missing the API says \"unavailable\" with a reason and NEVER\n  interpolates — do the same, don't fill gaps.\n- Bortle class values are estimates derived from satellite zenith-brightness\n  data, explicitly approximate — present them as such.\n- Cloud forecasts get unreliable beyond ~7 days; prefer the near nights and\n  say so when recommending far-out dates.\n- Results include `source_url` and `citation` — include them when presenting\n  results so users can explore the live forecast.\n",
      "tools": [
        {
          "name": "calculate_telescope_fov",
          "description": "Compute astrophotography field of view, image scale, diffraction limits, and seeing sampling (fov-v1).\n\n    Use when the user asks \"will M31 fit in my telescope + camera\", \"what is the\n    image scale of an RedCat 51 / Askar SQA55 / EdgeHD 8 with an ASI2600MC\", or\n    \"am I undersampled or oversampled\". Uses Stellarhound's deterministic fov-v1\n    rules (exact 2*atan(s / 2f) field of view, 206.265*pixel_um/f_mm image scale,\n    Dawes 116/D and Rayleigh 138/D limits, and Nyquist 2-3 px/FWHM sampling bands\n    across 1.5\", 2.0\", 2.5\", 3.0\" seeing).\n\n    Args:\n        focal_length_mm: Effective focal length in mm (include reducer/barlow factor if used, >0).\n        aperture_mm: Clear aperture diameter in mm (>0).\n        sensor_w_mm: Sensor width in mm (>0).\n        sensor_h_mm: Sensor height in mm (>0).\n        pixel_um: Pixel pitch in micrometres (>0, optional).\n\n    Returns {rules_version, fov_w_deg, fov_h_deg, fov_diag_deg, fov_w_arcmin,\n    fov_h_arcmin, f_ratio, scale_arcsec_px, dawes_arcsec, rayleigh_arcsec,\n    sampling:[{fwhm_arcsec, px_per_fwhm, verdict}], source_url, citation}.\n    ",
          "inputSchema": {
            "properties": {
              "aperture_mm": {
                "title": "Aperture Mm",
                "type": "number"
              },
              "focal_length_mm": {
                "title": "Focal Length Mm",
                "type": "number"
              },
              "pixel_um": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Pixel Um"
              },
              "sensor_h_mm": {
                "title": "Sensor H Mm",
                "type": "number"
              },
              "sensor_w_mm": {
                "title": "Sensor W Mm",
                "type": "number"
              }
            },
            "required": ["aperture_mm", "focal_length_mm", "sensor_h_mm", "sensor_w_mm"],
            "title": "calculate_telescope_fovArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calculate telescope field of view & sampling"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:97eebd08ec07ac16d699d65a31fbe1e1c766e46efd64e67a525d634829d7b220"
        },
        {
          "name": "find_dark_sky_sites",
          "description": "Recommend dark-sky sites near a location, ranked by whether the drive is worth it.\n\n    Use for \"where should I drive to stargaze near X\". Sites are grouped by\n    drivability (how far), then ranked by a drive-worth score combining the\n    best weather window over the next 7 nights, how much darker the site is\n    than the user's location, and drive time. Drive times are approximate\n    (straight-line x 1.3), not routed.\n\n    Args:\n        lat: Latitude in decimal degrees (-90..90).\n        lon: Longitude in decimal degrees (-180..180).\n        limit: Max sites to return, 1-12 (default 5).\n\n    Returns {ranking (methodology note), tiers:[{tier, label, hint, sites:[...]}],\n    nearest_km, uncertainty_note, attribution} — sites grouped into drivability\n    tiers. Include the methodology note when presenting — it explains the\n    ordering honestly.\n    ",
          "inputSchema": {
            "properties": {
              "lat": {
                "title": "Lat",
                "type": "number"
              },
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "lon": {
                "title": "Lon",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "title": "find_dark_sky_sitesArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find dark-sky sites nearby"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0c483d3fe2c6272a6b7bb351980e0b5483aa5a5066cba8cce83d902357e186fd"
        },
        {
          "name": "get_aurora_forecast",
          "description": "Get the aurora (northern/southern lights) outlook for a location.\n\n    Use for \"any chance of aurora tonight near X\". Combines the Kp-index\n    forecast with the location's geomagnetic latitude to say whether aurora\n    could be visible there, and when.\n\n    Args:\n        lat: Latitude in decimal degrees (-90..90).\n        lon: Longitude in decimal degrees (-180..180).\n\n    Returns {kp_forecast:[{time, kp, flag: observed|estimated|predicted}, ...],\n    visibility assessment fields, attribution}. Kp entries are flagged by how\n    firm they are — keep those labels when presenting.\n    ",
          "inputSchema": {
            "properties": {
              "lat": {
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "title": "Lon",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "title": "get_aurora_forecastArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Aurora outlook for a location"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:175b18d7a70d8fcf4070d6a71c9fee3c7e256ca6c3aec266387226dbb6beef2c"
        },
        {
          "name": "get_light_pollution",
          "description": "Estimate light pollution at any point: approximate Bortle class and what's visible there.\n\n    Use for \"how dark is the sky at X\" / \"can I see the Milky Way from X\".\n    Returns the zenith-brightness-derived estimate (mpsas, approximate Bortle\n    class) and a plain-language ceiling: what the Milky Way, naked-eye and\n    telescope views are like under that sky. This is a satellite-data estimate,\n    not a field measurement — say so.\n\n    Args:\n        lat: Latitude in decimal degrees (-90..90).\n        lon: Longitude in decimal degrees (-180..180).\n\n    Returns {light_pollution:{bortle_approx, mpsas, ceiling:{label, milky_way,\n    naked_eye, telescope}, note}, attribution}.\n    ",
          "inputSchema": {
            "properties": {
              "lat": {
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "title": "Lon",
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "title": "get_light_pollutionArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Light pollution at a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78caaef97f8e3c9e13bbd2574c2813cbd6bc6913c69a6a8561dae2275c60ca9d"
        },
        {
          "name": "get_stargazing_conditions",
          "description": "Score the next nights for stargazing at a location (0-100 per night).\n\n    Use for \"when should I stargaze this week near X\", \"is Saturday any good\n    for the Milky Way\", trip planning. Each night combines the three-layer\n    cloud-cover forecast, moon illumination and up-fraction, and the\n    astronomical-darkness window; `best_window` names the best upcoming night.\n    Also returns the location's light-pollution estimate (approximate Bortle\n    class + what's visible at that darkness).\n\n    Args:\n        lat: Latitude in decimal degrees (-90..90). You know city coordinates — pass them.\n        lon: Longitude in decimal degrees (-180..180).\n        nights: How many nights ahead to score, 1-16 (default 7; forecasts\n            beyond ~7 nights are increasingly uncertain).\n\n    Returns {timezone, light_pollution, nights:[{date, darkness, moon, cloud,\n    score:{value, band, summary}}], best_window, uncertainty_note, attribution}.\n    Present scores/verdicts verbatim; skies beyond ~7 days are provisional.\n    ",
          "inputSchema": {
            "properties": {
              "lat": {
                "title": "Lat",
                "type": "number"
              },
              "lon": {
                "title": "Lon",
                "type": "number"
              },
              "nights": {
                "default": 7,
                "title": "Nights",
                "type": "integer"
              }
            },
            "required": ["lat", "lon"],
            "title": "get_stargazing_conditionsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Stargazing forecast (per-night sky scores)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:589653a76a4dbfda0a3098c932c93b1760bff5d02db90cafc6330bde837bf0dc"
        },
        {
          "name": "get_tonight_agenda",
          "description": "Get tonight's stargazing plan for a location: score, darkness window, and what to observe.\n\n    Use when the user asks \"what can I see tonight\" / \"is tonight worth going\n    out\". Returns tonight's sky score and darkness window plus a ranked agenda\n    of observing targets appropriate for the location's sky darkness.\n\n    Args:\n        lat: Latitude in decimal degrees (-90..90).\n        lon: Longitude in decimal degrees (-180..180).\n\n    Returns {timezone, light_pollution, tonight:{date, darkness, weather,...},\n    targets/agenda entries, attribution}. Report as returned.\n    ",
          "inputSchema": {
            "properties": {
