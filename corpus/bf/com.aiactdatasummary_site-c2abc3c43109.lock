      "instructions": "AI Act Data Summary (https://aiactdatasummary.com/): the site's own MCP server, served from its domain. The AI Act training data summary in Article 53(1)(d): what the EU text says, the Commission's template, the dates it applies from and the fines.\n\n[calculator] Which training-summary provisions speak to your model: an agent-callable calculator for ai act training data summary; What Article 53(1)(d) says, When it applies, The template, computed from your inputs with sources.. This server runs the Which training-summary provisions speak to your model calculator published at https://aiactdatasummary.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://aiactdatasummary.com/. Licence: https://aiactdatasummary.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Act Data Summary (https://aiactdatasummary.com/). What it does: starts an ENQUIRY with AI Act Data Summary for ai act training data summary; the AI Act Data Summary team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Act Data Summary team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-data-to-model-providers\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://aiactdatasummary.com/.\n\nCite https://aiactdatasummary.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
          "title": "Which training-summary provisions speak to your model",
