        {
          "name": "insumer_wallet_trust",
          "title": "Wallet trust profile (signed)",
          "description": "Generate a signed wallet trust fact profile for an EVM wallet: a curated set of presence checks organized into dimensions (stablecoins, governance, nfts, staking, institutional_stablecoins, tokenized_treasuries, stablecoin_deposits, wrapped_bitcoin, names, account): 155 base checks across 27 chains in 10 dimensions. Optional Solana, XRPL, Bitcoin and Tron wallets add their own dimensions, up to 176 checks across 29 chains in 14 dimensions; optional Stellar and Sui wallets let rows inside existing dimensions evaluate. Dimensions arrive in a fixed order: the base dimensions as listed, then any of solana, xrpl, bitcoin and tron that were switched on, in that order. The account dimension holds two rows per chain on Ethereum, Base, Arbitrum, Optimism and Polygon: contract code at the wallet address, and an EIP-7702 delegation there; a plain key reads false on both, and which contract is never named. Rows on a chain whose wallet is not supplied stay in the signed profile with evaluated: false. Every check is held or not held (present or not present in the account dimension), never a balance. The signed conditionSetVersion (currently 2026-10-08) names the check list that was run; log it, never reject on it. Returns per-dimension pass/fail counts and an overall summary: no score, no opinion. Designed for AI agent-to-agent trust decisions. Costs 3 credits (6 with proof: 'merkle'). An rpc_failure error (503) means a read did not complete and nothing was signed: retry, and never treat it as a no. Current chain and check counts: https://insumermodel.com/llms.txt On this hosted endpoint the call is paid from a shared daily allowance, so the caller is not charged; the credit cost above applies on the caller's own API key, and each result states the price on a key and by x402 pay-per-call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bitcoinWallet": {
                "description": "Bitcoin address. If provided, adds the Bitcoin dimension (native BTC presence).",
                "pattern": "^(?:[13][1-9A-HJ-NP-Za-km-z]{25,34}|(?:bc1|BC1)[02-9ac-hj-np-zAC-HJ-NP-Z]{11,87})$",
                "type": "string"
              },
              "proof": {
                "description": "Set to 'merkle' for EIP-1186 Merkle storage proofs on EVM token checks (6 credits). Rows whose balance is computed rather than stored (Aave aTokens, BUIDL), NFT/non-EVM rows and the account rows are declined with a reason (an account proof is available from the attest tool's account_code condition); the premium is refunded whenever no proof is delivered.",
                "enum": ["merkle"],
                "type": "string"
              },
              "solanaWallet": {
                "description": "Solana wallet address (base58). If provided, adds the Solana dimension and lets the institutional rows on Solana evaluate.",
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                "type": "string"
              },
              "stellarWallet": {
                "description": "Stellar wallet address (G-prefixed). If provided, lets the institutional rows on Stellar evaluate (classic trustlines). Adds no dimension.",
                "pattern": "^G[A-Z2-7]{55}$",
                "type": "string"
              },
              "suiWallet": {
                "description": "Sui wallet address (0x + 64 hex). If provided, lets the rows on Sui evaluate. Adds no dimension.",
                "pattern": "^0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "tronWallet": {
                "description": "Tron wallet address (T-prefixed). If provided, adds the Tron dimension.",
                "pattern": "^T[1-9A-HJ-NP-Za-km-z]{33}$",
                "type": "string"
              },
              "wallet": {
                "description": "EVM wallet address (0x...) to profile",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "xrplWallet": {
                "description": "XRPL wallet address (r-address). If provided, adds the XRPL dimension and lets the institutional row on XRPL evaluate.",
                "pattern": "^r[1-9A-HJ-NP-Za-km-z]{24,34}$",
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
