        },
        {
          "name": "search_blog",
          "description": "Search the Bookatu blog for business owners (a translated post in the language asked for), or the engineering blog with section \"engineering\". Returns the posts that match, closest first, with their excerpt, date, page and markdown copy.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional. The language to search and answer in: en, de, fr, es, it, nl, pt, da, sv, nb, fi, pl, ja, cs (a tag like de-DE works too). Defaults to English; a language Bookatu has no catalog for reads English.",
                "type": "string"
              },
              "limit": {
                "description": "Optional. How many posts, 1 to 10. Default 5.",
                "type": "number"
              },
              "query": {
                "description": "What you are looking for, e.g. \"reduce no-shows\".",
                "type": "string"
              },
              "section": {
                "description": "Optional. \"blog\" (the default) or \"engineering\".",
                "enum": ["blog", "engineering"],
                "type": "string"
