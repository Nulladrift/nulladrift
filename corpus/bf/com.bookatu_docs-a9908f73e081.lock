            "properties": {
              "language": {
                "description": "Optional. The language to search and answer in: en, de, fr, es, it, nl, pt, da, sv, nb, fi, pl, ja, cs (a tag like de-DE works too). Defaults to English; a language Bookatu has no catalog for reads English.",
                "type": "string"
              },
              "slug": {
                "description": "The guide's slug, from search_help (e.g. \"deposits\").",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a help guide"
          },
          "behavior": {
