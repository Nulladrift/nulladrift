        {
          "name": "get_plans",
          "description": "Get what Bookatu costs, as the pricing page states it: each plan's monthly price, billed monthly and billed yearly, how many active clients it covers, the commission, the optional add-ons, the length of the trial and the currency. Takes no arguments.",
