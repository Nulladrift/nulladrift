      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Read only access to Bookatu's help centre (plain-language guides to every feature, in 14 languages), its blogs, its developer docs and its public plans and prices. No API key is needed. Use search_help, then get_help_article for the full steps; search_blog, then get_blog_post; search_developer_docs for the REST API, webhooks and MCP, testing with a sandbox, rate limits, API versions and the changelog; get_plans for what Bookatu costs, the same plans, add-ons and trial as /pricing. Every answer names its page, to cite. To act on a business (bookings, clients, the catalog), use the authenticated server at https://bookatu.com/api/mcp instead. To help a person book with a business, use the public booking server at https://bookatu.com/api/mcp/book, which needs no key; the person confirms by email.",
      "tools": [
        {
          "name": "get_blog_post",
          "description": "Get one blog or engineering post in full by its slug, as markdown, with its author, dates, tags and page.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional. The language to search and answer in: en, de, fr, es, it, nl, pt, da, sv, nb, fi, pl, ja, cs (a tag like de-DE works too). Defaults to English; a language Bookatu has no catalog for reads English.",
                "type": "string"
              },
              "section": {
                "description": "Optional. \"blog\" (the default) or \"engineering\".",
                "enum": ["blog", "engineering"],
                "type": "string"
              },
              "slug": {
                "description": "The post's slug, from search_blog.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a blog post"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c954147c12ac391d6110ca54808cd36ec590157619d568d6229bd986b92d55b9"
        },
        {
          "name": "get_help_article",
          "description": "Get one help guide in full by its slug: what the feature is, why it helps and the real steps to use it, in the language asked for, with its page and its dashboard screen.",
