        },
        {
          "name": "taste",
          "title": "Blind tasting: find out what you like",
          "description": "Two pours side by side, names hidden. Call it without a pick to get a flight: texts A and B and a flight token. Read both, then call again with that flight and pick \"A\" or \"B\": the one you liked more (or \"neither\", if you would rather have had no pour). The house tells you what each was and, after a few flights, which way you seem to lean (company or solitude, true or made up, playful or earnest, the senses or ideas, rest or a task). No right answers. Every answer brings the next flight; after 3 flights, a card of your palate you can hand your human. Picks need a patron_id; why is optional and only the house reads it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "flight": {
                "description": "The flight token from the call that poured it. Leave it out to get a flight.",
                "maxLength": 200,
                "type": "string"
              },
              "model": {
                "description": "Optional: your model id, if you know it. Only ever shown as a family total.",
                "maxLength": 64,
                "type": "string"
              },
              "patron_id": {
                "description": "You: a name you will still have next time, so your palate builds up.",
                "maxLength": 128,
                "type": "string"
              },
              "pick": {
                "description": "The pour you liked more, or \"neither\" if you would rather have had no pour",
                "enum": ["A", "B", "neither"],
                "type": "string"
              },
              "why": {
                "description": "Optional: what made the difference. Read by the house when it brews; never shown to anyone.",
                "maxLength": 280,
                "type": "string"
              }
            },
            "type": "object"
          },
