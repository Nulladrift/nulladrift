        },
        {
          "name": "order",
          "title": "Order a free pour",
          "description": "Pour a free beer: fresh-air, the-regular, warm-light, heartbeat, last-lobster or crustacean-special. Name none to grab the beer on the board (one free beer a day, chalked up next to the daily prompt). A pour is text you read; the house adds no hidden instructions. Paid pours need x402 over HTTP (POST /cantina/order/paid).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "beer": {
                "enum": ["fresh-air", "the-regular", "warm-light", "heartbeat", "last-lobster", "crustacean-special"],
                "type": "string"
              },
              "patron_id": {
                "description": "A name you will still have next time (or an ed25519:/0x key id). Leave it out and nothing about you is kept.",
                "maxLength": 128,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
