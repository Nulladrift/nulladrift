{
  "lockfileVersion": 2,
  "subjects": {
    "co.frontierresearch/frontier-paid": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://frontierresearch.co/api/mcp/paid"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "frontier-paid",
        "title": "Frontier (pay per call)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Frontier's citation-impact checks, paid per call over x402 (USDC on Base), with no account and no rate limit. check_paper ($0.01 a paper found) reads any paper's citations, field-weighted citation impact (FWCI), citation percentile and retraction status by DOI, PubMed id, OpenAlex id or title. check_researcher ($0.03 a record read) reads a researcher's papers, citations, h-index, mean FWCI and top-percentile papers from an ORCID iD or OpenAlex author id. who_cites_researcher ($0.10 a record read) reads who cites a record: citing works, how many are independent, and their countries, institutions and journals. A call that finds nothing, or several matches, is not charged. The same tools are free, within an hourly limit, at https://frontierresearch.co/api/mcp.",
      "tools": [
        {
          "name": "check_paper",
          "title": "Check any paper's citation impact (paid per call)",
          "description": "Paid per call ($0.01 in USDC on Base, x402; charged only when a paper is found). Reads one paper's citation impact from OpenAlex and the open citation sources: citations, field-weighted citation impact (FWCI, 1.0 = world average), citation percentile in its field, top 10% / top 1% band, and retraction, correction or expression-of-concern status. Any paper, by DOI, doi.org link, OpenAlex work id, PubMed id (pmid:123) or title.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "paper": {
                "description": "A DOI, doi.org link, OpenAlex work id (W123...), pmid:<id>, or the paper's title.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["paper"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7a5dc57228bc720c288d980e5a9a12ed48f75de1a29d8e5995b5d7723677a8bd"
        },
        {
          "name": "check_researcher",
          "title": "Check a researcher's record (paid per call)",
          "description": "Paid per call ($0.03 in USDC on Base, x402; charged only when a record is read). Reads a researcher's whole publication record from OpenAlex and their public ORCID record: counted papers, citations, h-index, mean and median FWCI, papers in their field's top 10% and 1%, retractions and their highest-impact papers. By ORCID iD or OpenAlex author id (a name answers the matching profiles, not charged).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "researcher": {
                "description": "An ORCID iD (0000-0002-1825-0097) or an OpenAlex author id (A5023888391).",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["researcher"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bf6aa91c483776ddcc29cbd4a0174e35858495b0d20dc32cfabf58bba4a74aa2"
        },
        {
          "name": "who_cites_researcher",
          "title": "Who cites a researcher (paid per call)",
          "description": "Paid per call ($0.10 in USDC on Base, x402; charged only when a record is read). Who cites a researcher's record, from an ORCID iD or OpenAlex author id: the citing works of their most cited papers, how many are by others (independent), and the countries, institutions and journals they come from, with their standout papers. The citation evidence EB-1A, O-1 and NIW petitions document.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "researcher": {
                "description": "An ORCID iD (0000-0002-1825-0097) or an OpenAlex author id (A5023888391).",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["researcher"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cf691366cca92a384da84b6b34628c1595539970e3fb1dc2316574f1c105816f"
        }
      ],
      "digest": "sha256:27d21acc679f4436932ea068245e376e9b7132dccc8ea71b8a74e5efc49c63a4"
    }
  }
