{
  "lockfileVersion": 2,
  "subjects": {
    "com.lazynext/accessibility-checker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.lazynext.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "accessibility-checker",
        "title": "Accessibility Checker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_report",
          "description": "Fetch a stored scan report by its id (from a prior scan_url/scan_html result).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "report id (the slug in the report URL)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:084270468f5e5b55254dd0ff6b951ff831e0fbbadcae44ce58b0ebe7c07545bb"
        },
        {
          "name": "list_rules",
          "description": "List every WCAG criterion the scanner can emit, with level and detection path.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:937affe71f27d7aa8e886f5bdfbab9df3ac84dbf22ccf34d7af9351d0b76cb0d"
        },
        {
          "name": "scan_html",
          "description": "Audit pasted HTML markup for WCAG violations (static rules — no render, no quota).",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "HTML source, max 512KB",
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c236b1f83d7c693ddb59fea929e4b3f7be894d994a9e16dabdda05709cca3786"
        },
        {
          "name": "scan_url",
          "description": "Render and audit a live web page for WCAG 2.1/2.2 violations. Returns score, findings, and a shareable report URL. Free tier: 3 URL scans/day/IP; pass a Pro license email for more.",
          "inputSchema": {
            "properties": {
              "license": {
                "description": "Pro license email (optional)",
                "type": "string"
              },
              "site": {
                "description": "crawl same-origin pages (3 free / 10 Pro)",
                "type": "boolean"
              },
              "url": {
                "description": "http(s) URL to scan",
                "type": "string"
              },
              "viewport": {
                "description": "render profile — mobile 390×844 handset (default); desktop preserves the pre-mobile baseline render",
                "enum": ["mobile", "desktop"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a337e0a1d209437539764dfcbe2e2b89ba395491c756fd9e734e144aa6e1cfb"
        }
      ],
      "digest": "sha256:9f2ddb579c57257c14209a2b111dc2a05fc49b72da5236ef3b8a888a696b674c"
    }
  }
}
