      "serverInfo": {
        "name": "market0x",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_listing_details",
          "description": "Full detail for one order including a FRESH live-contents snapshot (principal, claimable rewards, voting/earning power, as_of_block).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "orderHash": {
                "type": "string"
              }
            },
            "required": ["orderHash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4557ca01d22c9d9ea0834a28fb8b7a836efc9a97c5696e3f193b79ba8773bdff"
        },
        {
          "name": "get_listings",
          "description": "Active listings/auctions for a market. Each row carries the ask and the position's underlying contents priced at current market (published formula: /docs#data-sources), plus discountPct (the difference between them). Sorted by discount percentage, descending.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "enum": ["listing", "dutch_auction", "offer"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "marketId": {
                "description": "market id, e.g. 'vehydx'",
                "type": "string"
              },
              "minDiscountPct": {
                "description": "only return orders at >= this discount %. IGNORED on markets whose asset has no priced underlying, where there is nothing to compare the ask against — the response says so in `note` rather than returning an empty market.",
                "type": "number"
              },
              "nameContains": {
                "description": "case-insensitive substring match on the listing's label (the name on name markets, e.g. 'alice'; 'veAERO #123' elsewhere)",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["marketId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d966c9b5ae9098af5ded1e2dae3778629eda85bfd69c365f3767ee3c0d2a6562"
        },
        {
          "name": "get_orders",
          "description": "List orders created by an address (its listings, auctions, offers). Status is reconciled by the background worker — treat as advisory until checked at fill.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "offerer": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "status": {
                "enum": ["active", "filled", "cancelled", "expired"],
                "type": "string"
              }
            },
            "required": ["offerer"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:920a5b5165074d34c4ce8b8b013e72b4b5ef3fc0232d808ea196beb6f0d082d0"
        },
        {
          "name": "get_owned_positions",
          "description": "List the positions an address owns in a market, with listability (voted/attached positions can't transfer).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "marketId": {
                "type": "string"
              },
              "owner": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["marketId", "owner"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:309ec6b93c163c7aaebf69f8df837ef90584ce272a62301ca4f736af56f5adfa"
        },
        {
          "name": "get_recent_trades",
          "description": "Recently settled sales for a market. `amount` is the EXACT settled total (incl. fee) from the on-chain fill where the indexer recorded it, with `settledAt` the block time and `exact: true`; otherwise it falls back to the listed ask with `exact: false` (a decayed Dutch auction settles BELOW its listed amount, so treat inexact rows as an upper bound).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "marketId": {
                "type": "string"
              }
            },
            "required": ["marketId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c8bcff683d20e33b4a5fef75f3922534ed35e10a6501301f5e8f09939e87eb3e"
        },
        {
          "name": "list_micro_markets",
          "description": "List the markets this marketplace facilitates (asset, chain, currencies, fee).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:530b00641a96c4c40bb244582058e86674eb6e86aa5cbd6795ffb1cf2a1fac87"
        },
        {
          "name": "list_subscriptions",
          "description": "List a wallet's notification subscriptions (webhook URLs redacted to origin).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "wallet": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["wallet"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:164465de0819b88035466bf00855bbc2d020061a732079980ddb3ac66ee3e252"
        },
        {
          "name": "prepare_cancel",
          "description": "Prepare the on-chain Seaport cancel transaction for an active order. Only the order's offerer can execute it (Seaport enforces msg.sender == offerer), so the calldata is safe to return. After it confirms, POST { txHash } to the confirm endpoint to update the book.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "orderHash": {
                "type": "string"
              }
            },
            "required": ["orderHash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f0949321e2c870dd791a82899e9b7c13c9a6d52317f8d25cb9ac364f5a0c629"
        },
        {
          "name": "prepare_listing",
          "description": "Prepare a SELL listing or Dutch auction. Verifies the seller OWNS the position and it's transferable (not voted/attached), builds the Seaport order with the Interface fee injected by the server, and returns the one-time NFT approval + EIP-712 typed data to sign. Never signs or holds keys.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ask": {
                "description": "listing: price the seller nets — must be positive",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "currencySymbol": {
                "description": "one of the market's settlementCurrencies (see list_micro_markets). A symbol resolves per market, so the same symbol can name different contracts: 'AERO' is the NEW Aero token (0x3f5b…a4Ee) on saero and the legacy Aerodrome token (0x9401…8631) on veaero. Check the address in list_micro_markets.",
                "enum": ["USDC", "WETH", "HYDX", "AERO", "USDT", "THE", "KITTEN", "NEST", "USDG", "UP"],
                "type": "string"
              },
              "durationDays": {
                "maximum": 90,
                "minimum": 1,
                "type": "number"
              },
              "endAsk": {
                "description": "dutch_auction: floor price (must be below the start)",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "kind": {
                "enum": ["listing", "dutch_auction"],
                "type": "string"
              },
              "marketId": {
                "type": "string"
              },
              "name": {
                "description": "name markets only, e.g. 'alice' or 'alice.base.eth' — tokenId is derived",
                "type": "string"
              },
              "seller": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "startAsk": {
                "description": "dutch_auction: starting (high) price",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "tokenId": {
                "description": "required for token markets (e.g. vehydx)",
                "type": "string"
              }
            },
            "required": ["currencySymbol", "kind", "marketId", "seller"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5e11092f927976f3e8be3cb9a001a829ec34ec7b105d83ad4cea48541263b89a"
        },
        {
          "name": "prepare_offer",
          "description": "Prepare a BID/offer on a position: returns the Seaport order to sign (EIP-712), the currency approval needed, and how to submit it. The agent reads its Seaport counter, signs, and POSTs the signed order — settlement stays on Seaport. The buyer wallet must hold the offer's outlay (price + its fee share) when it submits; an unfunded offer is rejected (insufficient_balance), and one that later loses its funds or allowance is hidden from the book until they return.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "buyer": {
                "description": "0x address that will sign and fund the offer",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "currencySymbol": {
                "description": "one of the market's settlementCurrencies (see list_micro_markets). A symbol resolves per market, so the same symbol can name different contracts: 'AERO' is the NEW Aero token (0x3f5b…a4Ee) on saero and the legacy Aerodrome token (0x9401…8631) on veaero. Check the address in list_micro_markets.",
                "enum": ["USDC", "WETH", "HYDX", "AERO", "USDT", "THE", "KITTEN", "NEST", "USDG", "UP"],
                "type": "string"
              },
              "durationDays": {
                "maximum": 90,
                "minimum": 1,
                "type": "number"
              },
              "marketId": {
                "type": "string"
              },
              "name": {
                "description": "name markets only, e.g. 'alice' or 'alice.base.eth' — tokenId is derived",
                "type": "string"
              },
              "offerAmount": {
                "description": "human amount the seller nets, e.g. '750' — must be positive",
                "pattern": "^\\d+(\\.\\d+)?$",
                "type": "string"
              },
              "tokenId": {
                "description": "required for token markets (e.g. vehydx)",
                "type": "string"
              }
            },
            "required": ["buyer", "currencySymbol", "marketId", "offerAmount"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e9c01617febd694be28e31aea967278784c4275e6e928d9f40083bc32ab79328"
        },
        {
          "name": "prepare_purchase",
          "description": "Prepare the non-custodial transaction package to BUY a listing (or accept an offer): ordered approvals + Seaport fulfillOrder calldata + a fresh contents snapshot. prepared.summary quotes the CURRENT price (Dutch auctions interpolate, asOf says when); the approval grants approveBaseUnits — slightly above the quote on a decaying order, never above maxTotalBaseUnits — and Seaport charges the exact interpolated amount at fill. On auctions, prepared.cleanup is an optional post-settlement tx that zeroes the residual allowance. The agent's own wallet signs and submits — this never signs or holds keys.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "orderHash": {
                "type": "string"
              }
            },
            "required": ["orderHash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:55b9f2c203940f9498b9123633f2a245e4b9c0fa867ceef5b2643fbb2a708ec2"
        },
        {
          "name": "subscribe_notifications",
          "description": "Subscribe a wallet to push notifications (order_filled / offer_received / saved_search) via an HMAC-signed webhook — the agent-native alternative to polling. Two-step: call WITHOUT `signature` to get the exact message to sign (EIP-191 personal_sign), then call again WITH the signature. `chainId` is signed over and the signature is verified on THAT chain, so pass the chain the wallet actually signs on (smart-wallet signatures do not validate cross-chain). Each signed message is SINGLE-USE: resending the same body returns 409 replayed_signature — retry with a fresh timestamp and a new signature. The response includes the webhook HMAC secret ONCE (verify x-market0x-signature = hex(HMAC-SHA256(rawBody, secret))).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chainId": {
                "description": "chain the wallet signs on; it is part of the signed message",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "channel": {
                "enum": ["webhook", "inapp"],
                "type": "string"
              },
              "events": {
                "items": {
                  "enum": ["order_filled", "offer_received", "saved_search"],
                  "type": "string"
                },
                "type": "array"
              },
              "savedSearch": {
                "properties": {
                  "kind": {
                    "enum": ["listing", "dutch_auction"],
                    "type": "string"
                  },
                  "marketId": {
                    "type": "string"
                  },
                  "nameContains": {
                    "description": "name markets: substring match on listed names",
                    "maxLength": 64,
                    "type": "string"
                  }
                },
                "required": ["marketId"],
                "type": "object"
              },
              "signature": {
                "description": "EIP-191 signature of the canonical message; omit to receive the message to sign",
                "type": "string"
              },
              "timestamp": {
                "description": "unix seconds; must be within 10 minutes of now",
                "type": "number"
              },
              "wallet": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "webhookUrl": {
                "description": "https URL; required for the webhook channel",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["chainId", "channel", "events", "timestamp", "wallet"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8221ea1b985220e8d9a0a43de9eb3e32491448dd1b6c279e1dc8b5e46cbffd87"
        },
        {
          "name": "unsubscribe_notifications",
          "description": "Delete a notification subscription. Two-step like subscribe_notifications: call without `signature` to get the message to sign. `chainId` is signed over and verified on that chain. Signed messages are single-use.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "chainId": {
                "description": "chain the wallet signs on; it is part of the signed message",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "signature": {
                "type": "string"
              },
              "subscriptionId": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "timestamp": {
                "type": "number"
              },
              "wallet": {
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["chainId", "subscriptionId", "timestamp", "wallet"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ae54a4b29cfef4a5da07279294e182d2aa05b4d6ac845e27771279bbba592dde"
        }
      ],
      "digest": "sha256:cb0363511bd5b2108a439f39d16c19afbbdbbffc975a0e32e3184eb42fe85149"
    }
  }
}
