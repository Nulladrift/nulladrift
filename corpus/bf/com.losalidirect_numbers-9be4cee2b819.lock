      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Annuaire public des numéros spéciaux français, sous licence CC-BY-4.0. Dérivé des données publiques de numérotation de l'ARCEP (« Ressources en numérotation téléphonique », data.gouv.fr) et enrichi par Losali. Dernière vérification des services et des tarifs : 2026-06-29. Dernière vérification des attributions au registre de l'ARCEP : 2026-10-12.",
