{
  "lockfileVersion": 2,
  "subjects": {
    "app.fojin/fojin-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fojin.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fojin",
        "version": "0.5.0",
        "websiteUrl": "https://fojin.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "fojin = a verified corpus of the Buddhist canons (Chinese/CBETA, Pali, Sanskrit, Tibetan) for AI agents. 佛津：给 AI 用的佛典原文库。\nWHEN TO USE: any time the user's request involves a Buddhist scripture, sutra, sutta, 佛经/經文/经论/注疏, a Buddhist term, or a quotation attributed to the Buddha or a Buddhist master — including when you are writing an answer that will quote such a text.\nRULES: (1) Before you show the user ANY quotation from Buddhist scripture, call verify_quote on it — models routinely produce plausible but non-existent quotes; only present it as a quotation if `verbatim` is true, otherwise say it is a paraphrase or use `closest`. (2) Cite with the `citation` / `line_urn` / `reader_url` the tools return; do not reconstruct third-party links. (3) Respect the `license` returned with each passage: CBETA text is CC BY-NC-SA 3.0 TW (attribute CBETA, non-commercial, share-alike).\nTYPICAL FLOW: search_corpus (find where something is said) → read_passage (get the real text) → verify_quote (check the exact words) → cite (paste-ready citation, BibTeX/RIS). lookup_dictionary for terms; get_parallels to compare Chinese/Pali/Tibetan versions; commentaries for what classical commentators said.",
      "tools": [
        {
          "name": "cite",
          "description": "Paste-ready, machine-readable citation for a Buddhist-canon location (生成引用).\n\n    Use when the user wants to cite a passage (paper, footnote, reference list,\n    Zotero) or when you finish an answer that quoted scripture. Give either a\n    fojin `urn` (e.g. \"fojin:cbeta/T0374.14#p0450a12\", from search/verify results)\n    or a CBETA line head `ref` (e.g. \"T12n0374_p0450a12\"); optional `quote` is put\n    into the citation. Returns `plain` (《大般涅槃經》卷14：「…」(CBETA, T12, no. 374,\n    p. 450a12)), `cbeta_line_head`, line-level `urn`, `reader_url`, `bibtex`, `ris`,\n    `csl_json`, and `license` (with attribution, commercial-use flag and conditions)\n    — pass the licence on to the user.\n    ",
          "inputSchema": {
            "properties": {
              "quote": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Quote"
              },
              "ref": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ref"
              },
              "urn": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Urn"
              }
            },
            "title": "citeArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4ae894ad2ad92a3b43b4a68c3fcea81897c73befbbc89ee9be9e6da120b8df1"
        },
        {
          "name": "commentaries",
          "description": "What the historical commentators said about a passage of Buddhist scripture.\n\n    Give a line of a sūtra and get back the classical commentaries that gloss\n    it — each with the commentator's own words, the work it comes from, a\n    quality tier, and a resolvable citation. This is the layer no other tool\n    exposes for the Chinese canon: CBETA marks up almost none of it, and the\n    alignment behind this was derived text by text.\n\n    Two things to read carefully rather than skim. `total` is how many\n    commentators the passage actually has — `truncated` says the list you got\n    is a sample. And coverage is partial: roughly half of what a commentator\n    wrote is not aligned, so an absent commentator means \"not in the data\",\n    never \"he said nothing\". When nothing matches, `available_sutras` tells\n    you which sūtras have data at all — do not read a miss as silence from the\n    tradition.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "title": "Limit",
                "type": "integer"
              },
              "quote": {
                "title": "Quote",
                "type": "string"
              }
            },
            "required": ["quote"],
            "title": "commentariesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3219fcf19158ee77a1a9c640bcf9df2a8a2f1629fdc81e805f70d469cf4a725"
        },
        {
          "name": "get_parallels",
          "description": "Cross-canon parallel passages aligned to a fascicle.\n\n    fojin's alignment moat: given a Chinese fascicle, returns the aligned\n    Pali/Tibetan/Sanskrit parallels so you can compare how a passage is\n    rendered across traditions.\n\n    A fascicle returns parallels for the *whole* juan — often hundreds. To\n    narrow them to one passage, match the passage against `source_chunks[].text`\n    and keep the parallels whose `aligns_source_chunk` equals that chunk_index.\n\n    `urn` is filled for parallels that are fojin works; rows with\n    `source=\"mitra-parallel\"` are inline Skt/Tib sentences with no fojin work to\n    cite, so they carry `original_preview` instead and stay `urn: null`.\n    ",
          "inputSchema": {
            "properties": {
              "juan_num": {
                "title": "Juan Num",
                "type": "integer"
              },
              "text_id": {
                "title": "Text Id",
                "type": "integer"
              }
            },
            "required": ["juan_num", "text_id"],
            "title": "get_parallelsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d65f838624c9209cf9c3670cc63b0f73c747a231e5f21210b438591c605cf1b6"
        },
        {
          "name": "lookup_dictionary",
          "description": "Look up a Buddhist term (名相/术语, e.g. 般若, 阿賴耶識, dukkha) in 39 dictionaries.\n\n    Use when the user asks what a Buddhist term means, or before explaining a\n    technical term yourself. Covers 佛光大辭典, 丁福保佛學大辭典, Soothill,\n    Pali/Sanskrit/Tibetan dictionaries — 748K+ entries. Cite the dictionary name\n    when you use a definition; a dictionary entry is not a scriptural citation.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "term": {
                "title": "Term",
                "type": "string"
              }
            },
            "required": ["term"],
            "title": "lookup_dictionaryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43436caf58de61437c8442ffeabcd386dedc8d2c56e2dfd9b2997b7231ba666f"
        },
        {
          "name": "lookup_entity",
          "description": "Look up a Buddhist person, place, text or school in fojin's knowledge graph\n    (人物/寺院/经典/宗派, e.g. 鳩摩羅什, 玄奘, 天台宗).\n\n    Use for biographical or historical questions (who translated X, where Y lived,\n    which school Z belongs to).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "lookup_entityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e0ea23a3c289161759d605943f2e3ac9d0e35ce21313bf4df6e4ac7e5c9296e"
        },
        {
          "name": "read_passage",
          "description": "Get the actual text of one fascicle (卷) — quote from this, not from memory.\n\n    Use after search_corpus (pass its `text_id`/`juan_num`) whenever you are going\n    to quote, summarise or explain a specific passage. Returns the canonical text\n    with its `urn`.\n    ",
          "inputSchema": {
            "properties": {
              "juan_num": {
                "title": "Juan Num",
                "type": "integer"
              },
              "text_id": {
                "title": "Text Id",
                "type": "integer"
              }
            },
            "required": ["juan_num", "text_id"],
            "title": "read_passageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f6dd1ed51a95b6db795b1bca3b09536439b1a29bd4337f82c3ddb26bb0f38f7d"
        },
        {
          "name": "resolve_urn",
          "description": "Turn a fojin URN (fojin:cbeta/T0001.1#p0001a01) into a reader link and\n    check it exists. Use to dereference a citation someone gave you. For a\n    paste-ready citation with BibTeX/RIS and licence, use `cite` instead.",
          "inputSchema": {
            "properties": {
              "urn": {
                "title": "Urn",
                "type": "string"
              }
            },
            "required": ["urn"],
            "title": "resolve_urnArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8eab110c6c28b5e30dacedc914c6803aa27b5bd219252c517547f5501e8817fb"
        },
        {
          "name": "search_corpus",
          "description": "Find where the Buddhist canon talks about something (佛经检索 / 哪部经讲到…).\n\n    Use when the user asks which sutra/text says X, wants sources on a topic, or\n    you need a real passage instead of recalling one. Semantic search over 10K+\n    texts in Classical Chinese, Pali, Sanskrit, Tibetan and English; each hit has\n    a `urn`, title, snippet, similarity and `license`. `lang` filters by code\n    (lzh=Classical Chinese, pi=Pali, sa=Sanskrit, bo=Tibetan, en=English).\n    Next step: read_passage with the hit's text_id/juan_num to get the actual text.\n    ",
          "inputSchema": {
            "properties": {
              "lang": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lang"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_corpusArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:054292b84b592d7738b1eca6d4ab264d4c99fd9f9c98c41470b94981a27e03ad"
        },
        {
          "name": "verify_quote",
          "description": "ALWAYS call this before showing the user any quotation from Buddhist scripture (引用佛经原文前必须先核验).\n\n    Verify that a Buddhist-canon quote exists VERBATIM in the corpus.\n\n    Call this before presenting any quoted scripture to a reader: LLMs\n    routinely invent plausible-looking quotes. Returns `verbatim` (bool),\n    where it was found (`matches`, each with a resolvable `urn`), or the\n    closest near-miss window when it wasn't. `cite` optionally narrows the\n    search — a CBETA id (\"T0374\") or fojin URN (\"fojin:cbeta/T0374.13\") —\n    and `cite_matched` reports honestly whether the quote is where you\n    claimed (a hit in a different fascicle does NOT confirm your citation).\n    Quote must be ≥4 CJK chars after normalisation; Classical Chinese only.\n    Short quotes are answered but say less: a four-character phrase recurs\n    across the canon, so read `cite_matched` rather than `verbatim`, and check\n    `matches_capped` before treating the list as complete. Each match carries\n    an absolute `reader_url` — cite that, not a reconstructed third-party link.\n    The first matches also carry `line_ref`, `cbeta_line_head` (T12n0374_p0450a12),\n    `line_urn`, a paste-ready `citation` and the passage's `license`/`attribution`.\n    ",
          "inputSchema": {
            "properties": {
              "cite": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cite"
              },
              "juan": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Juan"
              },
              "quote": {
                "title": "Quote",
                "type": "string"
              }
            },
            "required": ["quote"],
            "title": "verify_quoteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ced9ffe89aaf5edb82ddd9ae95aa11f75d3ad6eba0fe9bee1d4be50af7f7b6eb"
        }
      ],
      "digest": "sha256:959092191479a39c14afffb78326613ac808b8a55841dbae37e902644d63a55f"
    }
  }
