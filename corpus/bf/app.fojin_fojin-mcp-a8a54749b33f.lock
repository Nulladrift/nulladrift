{
  "lockfileVersion": 2,
  "subjects": {
    "app.fojin/fojin-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fojin.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fojin",
        "version": "0.4.0",
        "websiteUrl": "https://fojin.app"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tools over fojin's cross-canon Buddhist digital-text platform. Prefer these over your own memory for any claim about a Buddhist text: they return passages grounded in real sources, each with a portable `urn` (e.g. fojin:cbeta/T0251.1). Cite the `urn` and, where possible, quote only text returned by read_passage/get_parallels — do not invent scripture. Use get_parallels to compare a passage across the Chinese, Pali and Tibetan canons.",
      "tools": [
        {
          "name": "commentaries",
          "description": "What the historical commentators said about a passage of Buddhist scripture.\n\n    Give a line of a sūtra and get back the classical commentaries that gloss\n    it — each with the commentator's own words, the work it comes from, a\n    quality tier, and a resolvable citation. This is the layer no other tool\n    exposes for the Chinese canon: CBETA marks up almost none of it, and the\n    alignment behind this was derived text by text.\n\n    Two things to read carefully rather than skim. `total` is how many\n    commentators the passage actually has — `truncated` says the list you got\n    is a sample. And coverage is partial: roughly half of what a commentator\n    wrote is not aligned, so an absent commentator means \"not in the data\",\n    never \"he said nothing\". When nothing matches, `available_sutras` tells\n    you which sūtras have data at all — do not read a miss as silence from the\n    tradition.\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "title": "Limit",
                "type": "integer"
              },
              "quote": {
                "title": "Quote",
                "type": "string"
              }
            },
            "required": ["quote"],
            "title": "commentariesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3219fcf19158ee77a1a9c640bcf9df2a8a2f1629fdc81e805f70d469cf4a725"
        },
        {
          "name": "get_parallels",
          "description": "Cross-canon parallel passages aligned to a fascicle.\n\n    fojin's alignment moat: given a Chinese fascicle, returns the aligned\n    Pali/Tibetan/Sanskrit parallels so you can compare how a passage is\n    rendered across traditions.\n\n    A fascicle returns parallels for the *whole* juan — often hundreds. To\n    narrow them to one passage, match the passage against `source_chunks[].text`\n    and keep the parallels whose `aligns_source_chunk` equals that chunk_index.\n\n    `urn` is filled for parallels that are fojin works; rows with\n    `source=\"mitra-parallel\"` are inline Skt/Tib sentences with no fojin work to\n    cite, so they carry `original_preview` instead and stay `urn: null`.\n    ",
          "inputSchema": {
            "properties": {
              "juan_num": {
                "title": "Juan Num",
                "type": "integer"
              },
              "text_id": {
                "title": "Text Id",
                "type": "integer"
              }
            },
            "required": ["juan_num", "text_id"],
            "title": "get_parallelsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d65f838624c9209cf9c3670cc63b0f73c747a231e5f21210b438591c605cf1b6"
        },
        {
          "name": "lookup_dictionary",
          "description": "Look up a Buddhist term across fojin's dictionaries (748K+ entries).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "term": {
                "title": "Term",
                "type": "string"
              }
            },
            "required": ["term"],
            "title": "lookup_dictionaryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:718b993dd2cd101c1d695970d3b09eda3864a947169c2efeb23f287523a9a5e2"
        },
        {
          "name": "lookup_entity",
          "description": "Search fojin's knowledge graph for entities — people, places, works,\n    doctrinal terms — matching `query`.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "lookup_entityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:89049c6a58d643ea06c5da04e4b276e3f785120c32c342b74c8fd3736175be60"
        },
        {
          "name": "read_passage",
          "description": "Read the full content of one fascicle (卷) of a text, with its `urn`.\n\n    Use the `text_id`/`juan_num` from a search_corpus hit. Returns the actual\n    canonical text — quote from this, not from memory.\n    ",
          "inputSchema": {
            "properties": {
              "juan_num": {
                "title": "Juan Num",
                "type": "integer"
              },
              "text_id": {
                "title": "Text Id",
                "type": "integer"
              }
            },
            "required": ["juan_num", "text_id"],
            "title": "read_passageArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f7399e172a03bb108281cf5b71ebf9981e7e5d3ebca6fb04079e60a373c3e0e"
        },
        {
          "name": "resolve_urn",
          "description": "Resolve a fojin URN (e.g. fojin:cbeta/T0001.1) to a reader URL and confirm\n    it exists in the corpus. Use to verify or dereference a citation.",
          "inputSchema": {
            "properties": {
              "urn": {
                "title": "Urn",
                "type": "string"
              }
            },
            "required": ["urn"],
            "title": "resolve_urnArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6faf6f31485c4014b7d776ef4940cb7abed155db39b6d1aa6f8352e037d09533"
        },
        {
          "name": "search_corpus",
          "description": "Semantic search across fojin's Buddhist corpus (10K+ texts, 30+ langs).\n\n    Returns the most relevant passages, each with a `urn`, title, snippet and\n    similarity score. `lang` optionally filters by language code\n    (lzh=Classical Chinese, pi=Pali, sa=Sanskrit, bo=Tibetan, en=English).\n    ",
          "inputSchema": {
            "properties": {
              "lang": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lang"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_corpusArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81e926b6e3fc056f58c29e9506f8c69c5e1a389c6032c9dd6785652dce0b69a9"
        },
        {
          "name": "verify_quote",
          "description": "Verify that a Buddhist-canon quote exists VERBATIM in the corpus.\n\n    Call this before presenting any quoted scripture to a reader: LLMs\n    routinely invent plausible-looking quotes. Returns `verbatim` (bool),\n    where it was found (`matches`, each with a resolvable `urn`), or the\n    closest near-miss window when it wasn't. `cite` optionally narrows the\n    search — a CBETA id (\"T0374\") or fojin URN (\"fojin:cbeta/T0374.13\") —\n    and `cite_matched` reports honestly whether the quote is where you\n    claimed (a hit in a different fascicle does NOT confirm your citation).\n    Quote must be ≥4 CJK chars after normalisation; Classical Chinese only.\n    Short quotes are answered but say less: a four-character phrase recurs\n    across the canon, so read `cite_matched` rather than `verbatim`, and check\n    `matches_capped` before treating the list as complete. Each match carries\n    an absolute `reader_url` — cite that, not a reconstructed third-party link.\n    ",
          "inputSchema": {
            "properties": {
              "cite": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Cite"
              },
              "juan": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Juan"
              },
              "quote": {
                "title": "Quote",
                "type": "string"
              }
            },
            "required": ["quote"],
            "title": "verify_quoteArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06553d77365e4980d1a5fa30115b8b8c28964f6c0c199fc826edd6fc3afc5bd2"
        }
      ],
      "digest": "sha256:42bc1299973d26d4f4d0872bad167fd056e8be3c9926746acafb79930f5e1d86"
    }
  }
}
