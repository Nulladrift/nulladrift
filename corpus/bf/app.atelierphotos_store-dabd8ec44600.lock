              "cursor": {
                "description": "next_cursor from the previous page, unchanged, with the same query and filters. Cannot be combined with target_width/target_height.",
                "type": "string"
              },
              "include_previews": {
                "description": "Set false for metadata only, which is much cheaper.",
                "type": "boolean"
              },
              "licence": {
                "description": "\"commercial\" for only the images that can be licensed for business use. Every image has the personal license.",
                "enum": ["personal", "commercial"],
                "type": "string"
              },
              "limit": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "orientation": {
