      "instructions": "A store of original photographs sold under a personal-use license, and some under a commercial one too. Searching needs no account; the first account tool (get_account and the others that spend or download) asks the person to sign in by email, so tell them before you call it. Search with search_images, passing the destination screen size when there is one, then show the person the previews and let them choose. A host that supports MCP Apps draws the pictures for the person; others show them nothing, so there give them each result's preview_url as a link to open. Buying spends the image's price in credits (price.credits — not always 1): check get_account first, and confirm with the person before calling fulfil_image. The free trial is 3 credits, once per person and only before they have paid for anything (get_account says trial_available): offer start_trial only when it would buy the image they chose — price.credits no more than that, and price.trial_credits_accepted true. An image bought with trial credits comes as the screen file only; its print file can be bought afterwards at the full price (fulfil_image with buy_print: true, in paid credits, or by card). Anything the buyer already owns (owned: true in results once signed in) re-downloads free. For more credits, or to pay for one image by card where price.card_available is true, create_checkout returns a link for them to open — never ask anyone for card details. After they pay for an image by card, fulfil_image delivers it without spending credits. The personal license does not cover business use. When the person wants an image for a business, a client, marketing, advertising or anything sold, they need the commercial license: offered only where price.commercial is not null (search_images with licence: \"commercial\" finds those), bought by card with create_checkout kind=one_off licence=commercial, and never with credits, the trial or a subscription. Ask what the image is for when it is unclear, and read get_licence code=commercial before recommending it. If the person has a private gallery's link and access code from a photographer, unlock_collection opens it to their account. Every image names its photographer; the license asks for credit where practical, so pass the name on with the file. A bought image comes as a screen file and a full-resolution print file; the person can download them again at any time from the account_url that get_account returns. There, too, they cancel or change a subscription, disconnect you, or delete their data; you cannot do those for them.",
      "tools": [
        {
          "name": "create_checkout",
          "title": "Start a purchase the person completes themselves",
          "description": "Return a payment link for the person to open in a browser: either a subscription plan, or a single image bought outright (only where price.card_available is true) — or that image's commercial license, with licence=commercial, where price.commercial is not null. The commercial license is sold only this way; Stripe's page asks the person to name the licensee. THE AGENT NEVER HANDLES CARD DETAILS and must not ask for any — hand the url over and let the person pay on the payment page. Nothing is granted until they finish. After a one-off, call fulfil_image with the same listing_id: once the payment has landed it delivers the image at no credit cost, and until then it answers payment_pending. After a subscription, get_account shows it. Every result lists the plans with their prices. Use fulfil_image instead when the buyer already has credits or already owns the image, and start_trial when they have none and have not tried the store. Refused when the buyer already owns the image or already has a subscription, so that nobody pays twice — except an image the free trial bought, which is the screen file only: a one-off for it buys the print file at the full price. Each new link cancels the previous one — any earlier subscription link, or an earlier link for the same image — so give the person only the latest.",
