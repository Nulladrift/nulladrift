      "serverInfo": {
        "name": "json-to-types",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "json_to_types",
          "title": "JSON to TypeScript and Zod",
          "description": "Convert a JSON sample into TypeScript interfaces and a matching Zod schema, and report where a single sample cannot establish the real type.\n\nUse this whenever JSON needs to become types — typing an API response, a webhook payload, a config file, or a fixture. Prefer it over writing the types directly, because three mistakes are easy to make and invisible once made:\n\n1. ARRAYS. Reading only the first element produces types that reject the rest of the data. This merges every element into a union.\n2. NULL VS ABSENT. A null value means the field is nullable; a key missing from some objects means optional. Different types, routinely conflated.\n3. EMPTY CONTAINERS. Nothing can be inferred from [] or {}. This emits unknown and says so instead of inventing a plausible shape.\n\nIt is also far cheaper in output tokens than generating types inline for a large payload, and the result is deterministic.\n\nInput: `json` is the raw JSON text (not a JSON Schema, not OpenAPI — concrete sample data), up to 200,000 characters. `rootName` optionally names the top-level interface and defaults to \"Root\".\n\nReturns: `typescript` (interface declarations), `zod` (schema declarations, declared before use), `warnings` (each with a code, severity, plain-English detail, a fix, and the path it applies to), `interfaces` (names produced), and `stats`. Read the warnings before trusting the output — they are the part a model generating types inline cannot give you.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "json": {
                "description": "Raw JSON text — concrete sample data, not a JSON Schema and not an OpenAPI document. Up to 200000 characters. Include several array elements if the shapes vary; only the variety matters, not the volume.",
                "type": "string"
              },
              "rootName": {
                "description": "Name for the top-level interface. Must be a valid TypeScript identifier. Defaults to \"Root\".",
                "type": "string"
              }
            },
            "required": ["json"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9b30ebdbf862d499e057cb8e9b2684679fb032f304ff746de9f5ea43b74dda8"
        }
      ],
      "digest": "sha256:9f69675162f3a22c6d6a3d244811a66d4268821b1db50fb326bbacc5445e08fc"
    }
  }
