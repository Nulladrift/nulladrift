      },
      "transport": {
        "type": "http",
        "url": "https://api.amfionhq.com/v1/setup/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "amfion-front-desk-setup",
        "title": "Amfion front desk setup",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Amfion is an AI front desk for service businesses that take appointments: it answers website chat, phone calls, texts and email from the business's own services, prices, hours and policies, books appointments, and hands a conversation to a person when it should.\n\nThese tools let a business owner, or someone building websites for service businesses, see it working for a real business before anyone signs up: check_amfion_fit for what it can and cannot do; build_front_desk_preview with the business's website; get_front_desk_preview until it is ready (about a minute); then summarize what it learned and what needs confirming, and test it with ask_front_desk_preview using the questions the business's customers ask. For a business that is already live on Amfion, get_website_install returns the exact code to add it to a website and how to check it works.\n\nReport what the preview learned exactly, including what it marks as assumed or unsure; never fill gaps with your own guesses about the business.\n\nA preview is a sealed test: no customer is contacted and no email is sent. To keep it, the person opens the Keep link, signs up and accepts the terms themselves; you cannot do that for them. Give them the preview link to try it in their browser and the Keep link when they want it.",
      "tools": [
        {
          "name": "ask_front_desk_preview",
          "title": "Ask the front desk a test question",
          "description": "Sends one simulated customer message to a ready preview and returns its reply, actions and remaining test budget. An optional conversation identifier continues an existing test conversation. Bookings are test bookings; no customer is contacted and no email is sent. Each preview has conversation and message limits.",
          "inputSchema": {
            "properties": {
              "conversation": {
                "description": "An optional conversation identifier from an earlier call. When absent, a new test conversation starts.",
                "type": "string"
              },
              "message": {
                "description": "What a customer would write, for example \"How much is a full groom for a large doodle, and can you fit me in Saturday?\"",
                "type": "string"
              },
              "preview": {
                "description": "The `preview` handle or the preview link.",
                "type": "string"
              }
            },
            "required": ["message", "preview"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask the front desk a test question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d0050f2f2aa85ae5b5dc1ff36ee52b19b32103f94520428d1dbaebf8626a2eaa"
        },
        {
          "name": "build_front_desk_preview",
          "title": "Build a front desk preview",
          "description": "Builds a temporary front desk preview from a service business's public website, including services, prices, hours and policies. Returns a preview handle, current build status and links immediately; completion typically takes about a minute. Creates no account and publishes nothing. Amfion is not intended for practices handling health information.",
          "inputSchema": {
            "properties": {
              "website": {
                "description": "The business's own website address, for example harborpawsgrooming.com.",
                "type": "string"
              }
            },
            "required": ["website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Build a front desk preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92f2781390bc2416001677ee15107de805dc8e11d02578eff77de967e24ce3ed"
        },
        {
          "name": "check_amfion_fit",
          "title": "Check whether Amfion fits a business",
          "description": "Checks Amfion's capabilities, pricing and suitability for a business type and stated needs. Returns matching capabilities as \"yes\", \"partly\" with conditions, or \"no\", along with supported business types, limitations, plans, prices and links. Covers Amfion's product capabilities rather than facts about a specific business.",
          "inputSchema": {
            "properties": {
              "business_type": {
                "description": "The kind of business in the person's words, for example \"mobile dog grooming\" or \"plumbing and HVAC\".",
                "type": "string"
              },
              "needs": {
                "description": "What the person wants it to do, in their words, for example \"answer calls after hours, book jobs, put them in Jobber\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether Amfion fits a business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce7ba49ca305c706374c6a6d162450139a60d5cfed8295851be7b3024bd49991"
        },
        {
          "name": "get_front_desk_preview",
          "title": "Get a front desk preview",
          "description": "Retrieves a front desk preview using its handle or URL. Returns the current build step while processing. A ready preview includes services, prices and appointment lengths with source or assumption labels, hours, cases requiring a person, missing information, suggested test questions, remaining test budget and links.",
          "inputSchema": {
            "properties": {
              "preview": {
                "description": "The preview handle or preview URL.",
                "type": "string"
              }
            },
            "required": ["preview"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a front desk preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f40640ccbc9e845fa899ad1a100c8092bfbcc1305302111990fc9c08f85db68"
        },
        {
          "name": "get_website_install",
          "title": "Get the website install code",
          "description": "Returns website installation code for an existing live Amfion business identified by its Amfion address, connected domain or short name. Includes chat-bubble, in-page-chat and request-form snippets, Content-Security-Policy entries, placement notes and verification steps. Unclaimed previews are unsupported. Makes no changes.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "The business's Amfion address (harbor-paws.amfionhq.com), connected domain, or short name (harbor-paws).",
                "type": "string"
              }
            },
            "required": ["business"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the website install code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a4ac8d4f40eab6e912997433fd7fb1cd0c5b00d3a59c026047fae6f4da3138ab"
        }
      ],
      "digest": "sha256:c2e59eabb045938e25a17162f170216bd74677d924e1531fa9c345e8fa9f343b"
    }
  }
