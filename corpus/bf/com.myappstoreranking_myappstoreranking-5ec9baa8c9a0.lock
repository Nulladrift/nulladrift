              "chartType": {
                "enum": ["free", "paid"],
                "type": "string"
              },
              "country": {
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "genreId": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 500,
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "enum": ["iphone", "ipad", "mac", "android"],
                "type": "string"
              },
              "sinceDays": {
                "default": 90,
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["appStoreId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
