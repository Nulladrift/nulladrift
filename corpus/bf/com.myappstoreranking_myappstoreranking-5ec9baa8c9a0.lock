        {
          "name": "get_daily_report",
          "title": "The user's daily or weekly report, as structured data",
          "description": "The same analysis the user's email report is built from: portfolio summary, what needs attention, wins, competitor movements and new entrants. The best single call for a scheduled 'what happened overnight' digest.\n\nExample question: \"What happened with my apps overnight?\"",
