                  "properties": {
                    "best": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "country": {
                      "pattern": "^[a-z]{2}$",
                      "type": "string"
                    },
                    "platform": {
                      "enum": ["iphone", "ipad", "mac", "android"],
                      "type": "string"
