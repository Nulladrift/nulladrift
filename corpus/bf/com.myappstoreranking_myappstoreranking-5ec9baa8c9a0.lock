        {
          "name": "get_app_history",
          "title": "Day-by-day chart positions for one tracked app",
          "description": "Raw rank observations, newest first, for trend questions. Filter by country, platform, chart type or category, because an unfiltered portfolio-wide history is large and will be truncated. Only apps the user tracks have history.\n\nExample question: \"Show my app's daily rank in France over the last month.\"",
