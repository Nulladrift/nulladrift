      "serverInfo": {
        "name": "bloomy-esim",
        "title": "Bloomy eSIM",
        "version": "1.4.0",
        "websiteUrl": "https://bloomyesim.com/ai-agents/",
        "icons": [
          {
            "src": "https://bloomyesim.com/wp-content/uploads/2026/04/花アイコン.png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bloomy eSIM sells data-only travel eSIMs (no phone number, no SMS) for 200+ countries and regions. Start with recommend_plan (destination + days, plus how they use data if known). Show the options with price and reason, then give the traveler the purchase_url of the one they pick. The traveler pays on that page; this server never takes payment. No account or app is needed: an email address is enough, and the QR code and one-tap install link are emailed and shown in My Page right after payment. For most plans validity starts when the eSIM first connects at the destination, so they can buy and install before departure; each plan's validity_starts says which rule applies. Plans with topup true can get more data later from My Page. Quote prices with their price_as_of time. Use get_setup_guide for installation questions. If the traveler pastes an itinerary, extract every country and the total days and call recommend_plan once with destinations.",
      "tools": [
        {
          "name": "estimate_data",
          "title": "Estimate data needed",
          "description": "Use when the traveler asks how much data they need, without choosing a plan yet. Returns estimated_gb for the trip, estimated_daily_gb and recommended_min_gb. Same formula as bloomyesim.com/data-calculator: daily MB per activity x days x Wi-Fi factor x 1.15 safety buffer, rounded up. Per-day assumptions (daily_mb_by_activity) are based on about 1 hour of social video, 1-2 hours of navigation and 1 hour of calls.",
          "inputSchema": {
            "properties": {
              "activities": {
                "description": "Required. What mobile data will be used for, e.g. [\"maps\", \"messaging\", \"video\"]. hotspot_light / hotspot_heavy mean sharing the connection with another device.",
                "items": {
                  "enum": ["maps", "messaging", "web", "music", "voice", "social", "video_call", "hotspot_light", "video", "hotspot_heavy"],
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "Required. Trip length in days, integer 1 to 180.",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "wifi": {
                "description": "How often hotel or cafe Wi-Fi replaces mobile data: rarely, sometimes (default) or often.",
                "enum": ["rarely", "sometimes", "often"],
                "type": "string"
              }
            },
            "required": ["activities", "days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate data needed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:788d5c290f843a8192843a4ad4142c6fccedff7adf8a8eb60b4ba173b4abff46"
        },
        {
          "name": "get_plan",
          "title": "Get plan details",
          "description": "Use for questions about one plan returned by another tool. Details of one Bloomy eSIM plan by plan_id: data, validity, when validity starts, network (4G/5G) and carriers per country, top-up support, price_jpy, price_usd, price_as_of and the checkout link.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Trip length in days. For daily plans it sets the number of days and the total price; ignored for fixed-GB plans.",
                "type": "integer"
              },
              "lang": {
                "description": "Language of country names, reasons and of the checkout page the link opens: en, ja, zh-cn, zh-tw, ko, es or fr. Default en. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present) and price_as_of.",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "plan_id": {
                "description": "Required. The plan_id from recommend_plan or search_plans, e.g. 14085.",
                "type": "integer"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2c30384ab70e9c1b2b50fdd41dc59241a20b3dbc5a2f1a5603071448679897f"
        },
        {
          "name": "get_purchase_link",
          "title": "Get checkout link",
          "description": "Use when the traveler has chosen a plan and wants to buy it. Returns a link straight to the checkout confirmation screen with the plan and days filled in. The traveler pays there themselves (no account or app needed, just an email address); this tool never takes payment. The QR code and one-tap install link are emailed and shown in My Page right after payment.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Trip length in days. Needed for daily plans (sets how many days are bought); ignored for fixed-GB plans.",
                "type": "integer"
              },
              "lang": {
                "description": "Language of country names, reasons and of the checkout page the link opens: en, ja, zh-cn, zh-tw, ko, es or fr. Default en. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present) and price_as_of.",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "plan_id": {
                "description": "Required. The plan_id of the chosen plan, from recommend_plan or search_plans.",
                "type": "integer"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30d8524cbbb23a79eaa6142252b4b288c532d48f1644624089d01f2089c1696c"
        },
        {
          "name": "get_setup_guide",
          "title": "Get setup guide",
          "description": "Use for questions about compatibility, installing or connecting. Short setup steps for iPhone or Android (no app to download: install from the QR code or one-tap link in the phone settings), what to check before buying, and links to the full guide, the device checker and troubleshooting.",
          "inputSchema": {
            "properties": {
              "device": {
                "description": "The traveler's phone: iphone or android. Default iphone.",
                "enum": ["iphone", "android"],
                "type": "string"
              },
              "lang": {
                "description": "Language of country names, reasons and of the checkout page the link opens: en, ja, zh-cn, zh-tw, ko, es or fr. Default en. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present) and price_as_of.",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get setup guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b437b8ff603369c187ca0c01dce08cb7d991f1d4b9571bfcc2324a4e36a86ab"
        },
        {
          "name": "list_destinations",
          "title": "List destinations",
          "description": "Use to check whether Bloomy eSIM has plans for a place, or to list all destinations. Returns countries with a dedicated plan: ISO code, localized name, number of plans and the lowest price (from_jpy, from_usd). Many more countries are covered by regional plans (200+ countries and regions in total).",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of country names, reasons and of the checkout page the link opens: en, ja, zh-cn, zh-tw, ko, es or fr. Default en. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present) and price_as_of.",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "query": {
                "description": "Part of a country name or ISO code to filter by, e.g. \"tur\" or \"TR\". Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:85163a453f3a50c81506849ef4220e64cc935ed8d255ffd02bc1fd6a8c8722d7"
        },
        {
          "name": "recommend_plan",
          "title": "Recommend a plan",
          "description": "Use when a traveler asks which eSIM to get for a trip. Input: destination (or every country of a multi-country trip in destinations), trip length in days, and how they use data if known. Estimates the GB the trip needs (need_gb, same formula as estimate_data), then returns up to 3 Bloomy eSIM plans with a reason each: best_fit (lowest price in our catalog that covers the estimate with about 20% headroom, or exactly the estimate when the headroom would cost much more), budget (cheaper: either sized right at the estimate, or below it with covers_estimate false, meaning it may not be enough) and roomier (next size up, or a daily unlimited plan for heavy use). A multi-country trip is matched to one regional plan that covers every country. Each option has data, validity, networks (4G/5G per carrier), top-up support, price_jpy, price_usd and price_as_of, plus purchase_url (the checkout confirmation page; the traveler pays there).",
          "inputSchema": {
            "properties": {
              "activities": {
                "description": "What the traveler will use mobile data for, when they say so, e.g. [\"maps\", \"social\", \"video_call\"]. hotspot_light / hotspot_heavy mean sharing the connection with another device. Overrides usage. Same categories as bloomyesim.com/data-calculator.",
                "items": {
                  "enum": ["maps", "messaging", "web", "music", "voice", "social", "video_call", "hotspot_light", "video", "hotspot_heavy"],
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "Required. Trip length in days, integer 1 to 180 (the whole trip for a multi-country trip). Example: 7.",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "One country or region for a single-country trip. Country name in English, Japanese, Chinese, Korean, Spanish or French, common names included (e.g. \"Turkey\", \"Türkiye\", \"トルコ\", \"튀르키예\", \"Hawaii\") or an ISO 3166-1 alpha-2 code (\"TR\"). Use destinations instead for several countries.",
                "type": "string"
              },
              "destinations": {
                "description": "Every country of a multi-country trip (2 to 5 entries; names in any supported language or ISO alpha-2 codes), e.g. [\"France\", \"Italy\", \"Spain\"]. One eSIM that covers all of them is searched. Use instead of destination.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "lang": {
                "description": "Language of country names, reasons and of the checkout page the link opens: en, ja, zh-cn, zh-tw, ko, es or fr. Default en. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present) and price_as_of.",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "min_gb": {
                "description": "Data the traveler already knows they want, in GB for the whole trip (e.g. 10). Skips the estimate; overrides usage and activities.",
                "type": "number"
              },
              "usage": {
                "description": "Rough data usage when activities are not known: light = maps and messaging, normal = maps, messaging, web and social (default), heavy = normal plus video streaming. Ignored when activities or min_gb is given.",
                "enum": ["light", "normal", "heavy"],
                "type": "string"
              },
              "wifi": {
                "description": "How often the traveler will be on hotel or cafe Wi-Fi instead of mobile data: rarely, sometimes (default) or often. More Wi-Fi lowers the estimate.",
                "enum": ["rarely", "sometimes", "often"],
                "type": "string"
              }
            },
            "required": ["days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://bloomy-esim/plan-cards",
            "openai/toolInvocation/invoked": "Bloomy eSIM options ready",
            "openai/toolInvocation/invoking": "Comparing Bloomy eSIM plans",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://bloomy-esim/plan-cards",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:de7829d3d2cdf56f4c2a7a861650d97b9e9d7c9d1429996a1bd97cdf10e27481"
        },
        {
          "name": "search_plans",
          "title": "Search plans",
          "description": "Use when the traveler wants to browse or compare Bloomy eSIM plans for one destination themselves. Lists plans cheapest first, single-country plans before regional ones, each with data (GB), validity (days), plan_type, networks (4G/5G), top-up support, price_jpy, price_usd, price_as_of and plan_id. Filter by trip length, minimum GB and plan type. For a recommendation with reasons, recommend_plan is the better fit.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Required. Country name (English, Japanese, Chinese, Korean, Spanish or French) or ISO 3166-1 alpha-2 code, e.g. \"Japan\", \"日本\" or \"JP\". A country with no dedicated plan returns an error, never plans for a different country.",
                "type": "string"
              },
              "lang": {
                "description": "Language of country names, reasons and of the checkout page the link opens: en, ja, zh-cn, zh-tw, ko, es or fr. Default en. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present) and price_as_of.",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of plans to return, 1 to 20. Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Trip length in days (integer). Fixed-GB plans valid for fewer days are skipped; daily plans are priced for this many days.",
                "type": "integer"
              },
              "min_gb": {
                "description": "Minimum data in GB, e.g. 3. For fixed-GB plans this is the total; for daily plans it is the high-speed allowance per day.",
                "type": "number"
              },
              "plan_type": {
                "description": "\"data\" = a fixed amount of GB for the whole validity period; \"unlimited\" = daily plans priced per day (a daily high-speed allowance, then slower speed). Omit to include both.",
                "enum": ["data", "unlimited"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:741e2a566507b3472d421116edf452eb46896eec41b66907508bf012c1a9db56"
        }
      ],
