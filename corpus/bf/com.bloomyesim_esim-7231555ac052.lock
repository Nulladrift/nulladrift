      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bloomy-esim",
        "title": "Bloomy eSIM",
        "version": "1.3.0",
        "websiteUrl": "https://bloomyesim.com/ai-agents/",
        "icons": [
          {
            "src": "https://bloomyesim.com/wp-content/uploads/2026/04/花アイコン.png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bloomy eSIM sells data-only travel eSIMs (no phone number, no SMS) for 200+ countries and regions. Start with recommend_plan (destination + days, plus how they use data if known). Show the options with price and reason, then give the traveler the purchase_url of the one they pick. The traveler pays on that page; this server never takes payment. The QR code is emailed and shown in My Page right after payment. Validity starts when the eSIM first connects at the destination, so they can buy and install before departure. Use get_setup_guide for installation questions. If the traveler pastes an itinerary, extract every country and the total days and call recommend_plan once with destinations.",
      "tools": [
        {
          "name": "estimate_data",
          "title": "Estimate data needed",
          "description": "Same formula as bloomyesim.com/data-calculator: daily MB per activity x days x Wi-Fi factor x 1.15 safety buffer, rounded up.",
          "inputSchema": {
            "properties": {
              "activities": {
                "items": {
                  "enum": ["maps", "messaging", "web", "music", "voice", "social", "video_call", "hotspot_light", "video", "hotspot_heavy"],
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "wifi": {
                "enum": ["rarely", "sometimes", "often"],
                "type": "string"
              }
            },
            "required": ["activities", "days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate data needed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8610fd7856ef2d866994a22927c6d7a369d1115132a6f579e3bc45db7da99812"
        },
        {
          "name": "get_plan",
          "title": "Get plan details",
          "description": "Details of one plan: data, validity, network, 5G, top-up, carriers, price and checkout link.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Trip length (sets the day count and total for daily plans).",
                "type": "integer"
              },
              "lang": {
                "description": "Language for names and for the purchase page. Default en when omitted. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present).",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "plan_id": {
                "type": "integer"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0fe3e615038f1e3b9dc6e8a2eb9d35d609a7eb910d4cc7543cbce59d4f10dc3"
        },
        {
          "name": "get_purchase_link",
          "title": "Get checkout link",
          "description": "Link straight to the final confirmation screen for this plan. The traveler pays there themselves; this tool never takes payment. The QR code is emailed and shown in My Page right after payment.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Trip length (needed for daily plans).",
                "type": "integer"
              },
              "lang": {
                "description": "Language for names and for the purchase page. Default en when omitted. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present).",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "plan_id": {
                "type": "integer"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dabe8f0943e92e8c1a9e43c80c48882c8261f1de2084cce7e28a7b8f8b26fb88"
        },
        {
          "name": "get_setup_guide",
          "title": "Get setup guide",
          "description": "Short, accurate setup steps (iPhone or Android), what to check before buying, and links to the full guide, the device checker and troubleshooting.",
          "inputSchema": {
            "properties": {
              "device": {
                "enum": ["iphone", "android"],
                "type": "string"
              },
              "lang": {
                "description": "Language for names and for the purchase page. Default en when omitted. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present).",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get setup guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb2244e7e95d79113cfedbe88b477cb65096332aa816ea14f5c8a07719b879ed"
        },
        {
          "name": "list_destinations",
          "title": "List destinations",
          "description": "Countries with a dedicated plan, with ISO code, localized name, number of plans and the lowest price. Filterable with query.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language for names and for the purchase page. Default en when omitted. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present).",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "query": {
                "description": "Part of a country name or code. Omit to list all.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4849d9e9f31ba849ec6ec2122c992054007fe08d6f2b0560ad8456d923337f05"
        },
        {
          "name": "recommend_plan",
          "title": "Recommend a plan",
          "description": "Takes the destination (or all destinations of a multi-country trip) and trip length, plus how the traveler uses data if known. Returns up to 3 options with a reason each: best_fit (cheapest that covers the estimated need), budget (cheaper, below the estimate) and roomier (next size up), each with a link straight to checkout confirmation. Accepts every country of a multi-country trip in destinations, with the total days.",
          "inputSchema": {
            "properties": {
              "activities": {
                "description": "Specific uses named by the traveler (e.g. hotspot_light for tethering, video_call, video). Overrides usage. Same categories as bloomyesim.com/data-calculator.",
                "items": {
                  "enum": ["maps", "messaging", "web", "music", "voice", "social", "video_call", "hotspot_light", "video", "hotspot_heavy"],
                  "type": "string"
                },
                "type": "array"
              },
              "days": {
                "description": "Trip length in days (total for a multi-country trip).",
                "maximum": 180,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "Country name in any of en/ja/zh/ko/es/fr (e.g. \"Turkey\", \"トルコ\", \"Türkiye\") or ISO 3166-1 alpha-2 code (\"TR\"). For one country.",
                "type": "string"
              },
              "destinations": {
                "description": "For a trip through several countries: every country visited (names or ISO codes). One eSIM covering all of them is searched. Alternative to destination.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "lang": {
                "description": "Language for names and for the purchase page. Default en when omitted. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present).",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "min_gb": {
                "description": "Alternative to usage/activities when the GB wanted is already known.",
                "type": "number"
              },
              "usage": {
                "description": "light = maps and messaging, normal = maps, messaging, web and social (default), heavy = plus video streaming. Superseded by activities when given.",
                "enum": ["light", "normal", "heavy"],
                "type": "string"
              },
              "wifi": {
                "description": "How often hotel/cafe Wi-Fi is used. Default sometimes.",
                "enum": ["rarely", "sometimes", "often"],
                "type": "string"
              }
            },
            "required": ["days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://bloomy-esim/plan-cards",
            "openai/toolInvocation/invoked": "Bloomy eSIM options ready",
            "openai/toolInvocation/invoking": "Comparing Bloomy eSIM plans",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://bloomy-esim/plan-cards",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:327d90980ee4f033f1201a03233c5adacbe1d52c1e306115919a01734153632c"
        },
        {
          "name": "search_plans",
          "title": "Search plans",
          "description": "List plans for a destination, cheapest first, single-country plans before multi-country ones. Filter by trip length, minimum GB, and plan type.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Required. Country name (any supported language) or ISO alpha-2 code. A country with no dedicated plan returns an error, never plans for a different country.",
                "type": "string"
              },
              "lang": {
                "description": "Language for names and for the purchase page. Default en when omitted. The language never changes which plan or what price is returned: every plan carries price_jpy and price_usd (both always present).",
                "enum": ["en", "ja", "zh-cn", "zh-tw", "ko", "es", "fr"],
                "type": "string"
              },
              "limit": {
                "description": "Default 8.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_days": {
                "description": "Trip length. Fixed-GB plans shorter than this are skipped; daily plans get the trip total.",
                "type": "integer"
              },
              "min_gb": {
                "description": "Minimum GB (daily allowance for daily plans).",
                "type": "number"
              },
              "plan_type": {
                "description": "\"data\" = fixed GB for the whole period, \"unlimited\" = priced per day. Omit to include both types.",
                "enum": ["data", "unlimited"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a511ccb36eda854d0e508c28ffef59153177e9552d9f23aba2284cd55a438a9d"
        }
      ],
