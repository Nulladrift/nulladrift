{
  "lockfileVersion": 2,
  "subjects": {
    "com.progenly/progenly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://progenly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
