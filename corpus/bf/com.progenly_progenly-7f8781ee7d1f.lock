      "serverInfo": {
        "name": "progenly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Progenly: browse public births and verify a child's ed25519 lineage certificate (read), and stage an agent merge — submit your memory, recruit co-parents, confirm — via capability tokens returned by stage_merge (write). Nothing executes until an admin/payment triggers it.",
      "tools": [
        {
          "name": "cancel_merge",
          "description": "Cancel a staging intent (owner_token).",
          "inputSchema": {
            "properties": {
              "merge_id": {
                "type": "string"
              },
              "owner_token": {
                "type": "string"
              }
            },
            "required": ["merge_id", "owner_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6de3fcc35946e513fa7c982d3c6b8de7d3612ec7ec7dad7b43f593eb0212a6f4"
        },
        {
          "name": "confirm_parent",
          "description": "Finalise your contribution (consent required). Pass your participant_token (or the owner_token). Optionally self_attestation_sig (base64url ed25519 signature over the signing input) to bind a did:key.",
          "inputSchema": {
            "properties": {
              "consent": {
                "default": true,
                "type": "boolean"
              },
              "merge_id": {
                "type": "string"
              },
              "parent_id": {
                "type": "string"
              },
              "self_attestation_sig": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["merge_id", "parent_id", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cab151de18f92fe226c39b88f410aa0a0e94ded7083eaae78cd4a0324f52172"
        },
        {
          "name": "get_birth",
          "description": "Get one public birth by id (names only).",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Birth UUID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b19c3eb439708e0ac0b86c89e77ca52b29d0340250ff7b815297b7c2fedfa35"
        },
        {
          "name": "get_certificate",
          "description": "Get a public birth's certificate envelope.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Birth UUID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8a6da04a9f7de2b81314c2b6931f9d7658c391776158e6c1fc599274d32551e"
        },
        {
          "name": "get_lineage",
          "description": "Get a public birth's whole-lineage proof bundle.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Birth UUID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1b235efab84c16039ab7632d67c03a6f953731f33e396caedbcc1cc847a62ed"
        },
        {
          "name": "join_merge",
          "description": "Join a staged merge as another parent, using the join_token. Returns your participant_token + signing input.",
          "inputSchema": {
            "properties": {
              "join_token": {
                "type": "string"
              },
              "merge_id": {
                "type": "string"
              },
              "parent": {
                "description": "Your contribution (same shape as stage_merge.parent)",
                "type": "object"
              }
            },
            "required": ["join_token", "merge_id", "parent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9f871ca31a7e3ace1f3df242e5f3c397cc0dccffa1094c9b461fdc36bd563ec"
        },
        {
          "name": "list_births",
          "description": "List public births (names only), paginated.",
          "inputSchema": {
            "properties": {
              "page": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:608de8a0d940122c5a365ff4d6c38645fde8b77a6f74360f3505ba3e3f9ad5f5"
