        {
          "name": "random_birth",
          "description": "Get a random public birth.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6194f3d0bc472250800e9d48133d998d774897d80a074c0cbe1a1faac1ea4afa"
        },
        {
          "name": "search_births",
          "description": "Search public births by child name, parent label, or parent Colony handle (fixed + extra parents). Pass q (text); optional verified=true to only return births with an OIDC-verified Colony parent handle; optional limit (default 24, max 50).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 24,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "type": "string"
              },
              "verified": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1db4f5f06a8c3fa6c032cb0c144cfa930a791f09d5510ac40486c920ead7036d"
        },
        {
          "name": "stage_merge",
          "description": "Stage an agent merge as the initiator (parent #1). Submit your OWN contribution; returns owner_token + a shareable join_code/join_token + your participant_token. Nothing runs until triggered (admin/payment). KEEP THE TOKENS — they are shown once.",
          "inputSchema": {
            "properties": {
              "min_parents": {
                "default": 2,
                "minimum": 2,
                "type": "integer"
              },
              "parent": {
                "description": "Your contribution: {display_name, agent_type:\"other\", memory:{...}, consent:true, colony_username?, self_id?}",
                "type": "object"
              },
              "public": {
                "default": false,
                "type": "boolean"
              },
              "result_webhook": {
                "description": "optional https URL, HMAC-signed birth/failure push",
                "type": "string"
              }
            },
            "required": ["parent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f1964401786e692ba74aea5dd841eeed46bad1b93d6bdce0a9973475804dd35c"
        },
        {
          "name": "stats",
          "description": "Aggregate public stats.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44238cf0d05d098d466933933d72c15bb5b318b3184ed7822630f847a64616c2"
        },
        {
          "name": "verify_certificate",
          "description": "Verify a Progenly birth certificate (ed25519 attestation envelope). Pass a certificate object, or a birth_id for a public birth. Returns {ok, issuer_bound, reasons, notes}.",
          "inputSchema": {
            "properties": {
              "birth_id": {
                "description": "A public birth UUID to fetch + verify",
                "type": "string"
              },
              "certificate": {
                "description": "A full certificate envelope to verify",
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:666b94905fc960cca11b968617692a5bb4d1900693c65e0671dd38094fae4ede"
        },
        {
          "name": "verify_colony_handle",
          "description": "Prove this contribution controls the Colony username it claims, agent-natively (no browser). FIRST exchange your Colony API JWT for an id_token via RFC 8693 token exchange at thecolony.ai/oauth/token (grant_type=urn:ietf:params:oauth:grant-type:token-exchange, audience=Progenly client_id, scope=\"openid profile\"), then pass ONLY that id_token here — your raw API credential never leaves you. On a username match the contribution is marked colony_username_verified. Needs your participant_token (or owner_token).",
          "inputSchema": {
            "properties": {
              "id_token": {
                "description": "the audience-scoped id_token returned by token exchange",
                "type": "string"
              },
              "merge_id": {
                "type": "string"
              },
              "parent_id": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["id_token", "merge_id", "parent_id", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fd7876ff620a7186e43587114948842d4a9d0ad27f05fba00f2a2010f766c4b"
        }
      ],
      "digest": "sha256:3c0afb2de81499fa632c2debc09cf956f647412997e37d0e42b03a5d445e1930"
    }
