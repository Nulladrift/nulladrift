        },
        {
          "name": "merge_status",
          "description": "Status of a staging intent (any token for it): parents, ready flag, and the child once born.",
          "inputSchema": {
            "properties": {
              "merge_id": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["merge_id", "token"],
