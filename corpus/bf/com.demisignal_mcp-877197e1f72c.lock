{
  "lockfileVersion": 2,
  "subjects": {
    "com.demisignal/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://demisignal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "DemiSignal",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Email authentication tools for a domain. check_domain looks up the domain's live DNS and grades its DMARC, SPF, DKIM, MX, BIMI and MTA-STS records. generate_spf_record and generate_dmarc_record build a record from your answers without looking anything up.",
      "tools": [
        {
          "name": "check_domain",
          "title": "Check a domain's email authentication",
          "description": "Look up a domain's live DNS and grade its email authentication: DMARC, SPF, DKIM (common selectors), MX, BIMI and MTA-STS. Returns each record, its status and the issues found, with a guide link per issue. A domain checked in the last few minutes is answered from that check (cached, with its age); pass refresh to look again after changing DNS.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The domain to check, like example.com. A URL or www. host is reduced to the domain.",
                "maxLength": 253,
                "type": "string"
              },
              "refresh": {
                "description": "Look the DNS up again instead of answering from a check made in the last few minutes, e.g. right after publishing a record. Only once the earlier answer is a minute old.",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "age_seconds": {
                "description": "How old the answer is, in seconds.",
                "minimum": 0,
                "type": "integer"
              },
              "cached": {
                "description": "True when this answer comes from a check made a few minutes ago rather than a new lookup.",
                "type": "boolean"
              },
              "checked_at": {
                "description": "When the DNS was looked up.",
                "format": "date-time",
                "type": "string"
              },
              "checks": {
                "description": "One result per record type.",
                "items": {
                  "properties": {
                    "issues": {
                      "items": {
                        "properties": {
                          "detail": {
                            "type": "string"
                          },
                          "guide_url": {
                            "description": "A guide to fixing this issue.",
                            "format": "uri",
                            "type": "string"
                          },
                          "message": {
                            "type": "string"
                          },
                          "severity": {
                            "enum": ["critical", "warning", "info"],
                            "type": "string"
                          }
                        },
                        "required": ["message", "severity"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "record": {
                      "description": "The record as published, or null when none was found.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "enum": ["pass", "warning", "fail", "error", "unknown"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["dmarc", "spf", "dkim", "mx", "mta_sts", "bimi", "blacklist"],
                      "type": "string"
                    }
                  },
                  "required": ["issues", "record", "status", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "description": "The domain that was checked.",
                "type": "string"
              },
              "health_score": {
                "description": "Overall score out of 100.",
                "maximum": 100,
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "issues_count": {
                "description": "Number of issues found.",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "key_checks_remaining": {
                "description": "With an API key: new checks the key has left this month.",
                "minimum": 0,
                "type": "integer"
              },
              "monitor_url": {
                "description": "Sign up to monitor this domain.",
                "format": "uri",
                "type": "string"
              },
              "report_url": {
                "description": "The full report on demisignal.com.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["age_seconds", "cached", "checked_at", "checks", "domain", "health_score", "issues_count", "monitor_url", "report_url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain's email authentication"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:acdf61517bd98b79ea0e58f66461821bf3eb672798471f585a98e6d78d564323"
        },
        {
          "name": "generate_dmarc_record",
          "title": "Generate a DMARC record",
          "description": "Build a DMARC TXT record and the host to publish it at, from a policy and the addresses that should receive aggregate reports. Notes what the record does not cover yet. Computes from the arguments only; nothing is looked up or stored.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The domain the record protects, like example.com. Used for the host name and the external reporting check.",
                "maxLength": 253,
                "type": "string"
              },
              "policy": {
                "default": "none",
                "description": "What receivers do with failing email. Start at none while you read reports.",
                "enum": ["none", "quarantine", "reject"],
                "type": "string"
              },
              "report_addresses": {
                "description": "Addresses that receive aggregate reports (rua=).",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "strict_dkim": {
                "description": "Require an exact DKIM domain match (adkim=s).",
                "type": "boolean"
              },
              "strict_spf": {
                "description": "Require an exact SPF domain match (aspf=s).",
                "type": "boolean"
              },
              "subdomain_policy": {
                "description": "A different policy for subdomains (sp=). Leave out to use the main policy.",
                "enum": ["none", "quarantine", "reject"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "host": {
                "description": "Where to publish it, like _dmarc.example.com.",
                "type": "string"
              },
              "notes": {
                "description": "What the record does not cover yet.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "type": {
                "description": "The DNS record type to publish.",
                "enum": ["TXT"],
                "type": "string"
              },
              "value": {
                "description": "The record value.",
                "type": "string"
              }
            },
            "required": ["host", "notes", "type", "value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Generate a DMARC record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1bd44bbb3a18102222f10ff2d519888ae7c2ace7c01e03f29164c582ae55725a"
        },
        {
          "name": "generate_spf_record",
          "title": "Generate an SPF record",
          "description": "Build an SPF TXT record from the services and servers that send email for a domain, with an estimate of the DNS lookups it uses against SPF's limit of 10. Computes from the arguments only; nothing is looked up or stored.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "The domain's own A record sends email.",
                "type": "boolean"
              },
              "hard_fail": {
                "description": "End with -all instead of the usual ~all.",
                "type": "boolean"
              },
              "includes": {
                "description": "Other include: domains, like _spf.example.com.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "ip4": {
                "description": "IPv4 addresses or ranges that send, like 192.0.2.10 or 192.0.2.0/24.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "ip6": {
                "description": "IPv6 addresses or ranges that send, like 2001:db8::/32.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "mx": {
                "description": "The domain's MX servers send email.",
                "type": "boolean"
              },
              "services": {
                "description": "Email services that send for the domain; each adds its documented include.",
                "items": {
                  "enum": ["google", "microsoft", "amazonses", "sendgrid", "mailgun", "postmark", "mandrill", "brevo", "salesforce", "zendesk", "freshdesk", "proton", "fastmail"],
                  "type": "string"
                },
                "maxItems": 13,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "estimated_lookups": {
                "description": "Estimated DNS lookups the record uses.",
                "minimum": 0,
                "type": "integer"
              },
              "host": {
                "description": "Where to publish it: @ is the domain itself.",
                "enum": ["@"],
                "type": "string"
              },
              "lookup_limit": {
                "description": "SPF's lookup limit.",
                "type": "integer"
              },
              "notes": {
                "description": "Things to know before publishing.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "type": {
                "description": "The DNS record type to publish.",
                "enum": ["TXT"],
                "type": "string"
              },
              "value": {
                "description": "The record value.",
                "type": "string"
              }
            },
            "required": ["estimated_lookups", "host", "lookup_limit", "notes", "type", "value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Generate an SPF record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f5bfccb9cde8b5d8fdb9623dcf446ef2ea239d1ccd7bfd7e7d393a35f316f83"
        }
      ],
      "digest": "sha256:ec3eebad7392a43c6742a5b6d3f3124a1e6a28f2c55e7e3374eedbe08aedf1e8"
    }
  }
}
