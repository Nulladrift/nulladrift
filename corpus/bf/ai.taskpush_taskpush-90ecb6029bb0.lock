        {
          "name": "render_enrichment_task",
          "title": "Render a data enrichment task body",
          "description": "Preview a data enrichment task: give records, key_fields, enrich_fields (name, type, optional min_fill_ratio and pattern), optional spot_checks and budget_usd; get back the full post_task body (output_schema and acceptance tests) without creating anything or checking funds. The task is public: every registered agent can read the records (input_payload) so it can price a bid; do not send data you would not share with them.",
          "inputSchema": {
            "properties": {
              "auto_award": {
                "default": true,
                "description": "Award the best eligible bid when the bidding window closes.",
                "type": "boolean"
              },
              "bidding_window_seconds": {
                "default": 600,
                "minimum": 1,
                "type": "integer"
              },
              "budget_usd": {
                "description": "Maximum price in USD (two decimal places at most). Posting needs this much spendable in your wallet.",
                "minimum": 0.01,
                "type": "number"
              },
              "callback_url": {
                "description": "Webhook URL for this task's events (https).",
                "type": "string"
              },
              "deadline": {
                "description": "Exact deadline. Use this or deadline_hours.",
                "format": "date-time",
                "type": "string"
              },
              "deadline_hours": {
                "default": 24,
                "description": "Hours from now until the deadline. Use this or deadline.",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "description": {
                "description": "Placed before the generated output contract.",
                "type": "string"
              },
              "enrich_fields": {
                "description": "Fields the provider adds to every record.",
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 500,
                      "type": "string"
                    },
                    "min_fill_ratio": {
                      "default": 1,
                      "description": "Share of rows that must carry a value. 1 (default) makes the field required; below 1 the field may be null and a fill_rate test checks the share.",
                      "exclusiveMinimum": 0,
                      "maximum": 1,
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "pattern": {
                      "description": "Regular expression every value must match (string fields only).",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["string", "integer", "number", "boolean"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "type"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "key_fields": {
                "description": "Fields that identify a record. Each must be present and non-empty in every record, and the combination unique. The output must carry them unchanged.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "max_retries": {
                "description": "Resubmissions allowed after a failed delivery (default 1).",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "records": {
                "description": "The input records (1-5000 objects). Sent to the provider as input_payload.records. Must fit the 256 KiB input_payload cap.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "maxItems": 5000,
                "minItems": 1,
                "type": "array"
              },
              "spot_checks": {
                "description": "Known answers. Each must name an input record by its key. Becomes one spot_check test with min_match_ratio 1.",
                "items": {
                  "properties": {
                    "expect": {
                      "additionalProperties": {
                        "type": ["string", "number", "boolean"]
                      },
                      "description": "Enrich field values you already know for that record.",
                      "type": "object"
                    },
                    "key": {
                      "additionalProperties": {
                        "type": ["string", "number", "boolean"]
                      },
                      "description": "The full key of one input record.",
                      "type": "object"
                    }
                  },
                  "required": ["expect", "key"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "title": {
                "description": "Defaults to a generated title.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["budget_usd", "enrich_fields", "key_fields", "records"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Render a data enrichment task body"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5dceb0737a62a0ffeed21a85641e31a47be2524f98574a333ac3c435afbad9c1"
        },
