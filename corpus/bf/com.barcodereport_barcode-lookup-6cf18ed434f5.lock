{
  "lockfileVersion": 2,
  "subjects": {
    "com.barcodereport/barcode-lookup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://barcodereport.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "barcodereport",
        "title": "Barcode Report",
        "version": "1.0.0",
        "websiteUrl": "https://barcodereport.com/barcode-api/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Barcode Report looks up products by barcode (UPC, EAN, GTIN or ISBN) across 500M+ records. Use lookup_barcode for one code, lookup_barcodes for several (up to 100 in one call), and search_products when you only have a product name. Each code that is found uses one lookup from the user's monthly allowance; codes that are not found are free. A search that returns results uses one per call; get_usage is free. Every record has a title; brand, category, images and other fields are present on a smaller share. When a result includes an attribution string, show it with the data.",
      "tools": [
        {
          "name": "get_usage",
          "title": "Check plan and remaining lookups",
          "description": "Show the account's plan, monthly allowance, lookups used and when usage resets. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check plan and remaining lookups"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d41cb248dc808c5bbb452937504232397280375cee500fac3111a776c7a78e18"
        },
        {
          "name": "lookup_barcode",
          "title": "Look up a barcode",
          "description": "Find the product for one barcode: UPC-A, UPC-E, EAN-13, EAN-8, GTIN-14, ISBN-10 or ISBN-13. Returns the title and, where known, brand, category, description, image, price, identifiers and book details. Uses one lookup from the monthly allowance; free when the code is not found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcode": {
                "description": "The barcode, for example 049000050103. Spaces and dashes are ignored.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up a barcode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3bbb5dfa9818eb2a3a757be999664058d031f5a11edb61e60a0fb66fdab4da4e"
        },
        {
          "name": "lookup_barcodes",
          "title": "Look up several barcodes",
          "description": "Find the products for up to 100 barcodes in one call. Duplicates are ignored. Uses one lookup per code that is found; codes that are not found are free. The batch must fit in the remaining allowance: if it has more distinct codes than that, nothing is looked up or charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcodes": {
                "description": "Barcodes to look up.",
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["barcodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up several barcodes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6be9fcc2ef1610ff78901c7feaeac589a06563b3b7d644fe1be76f1d22b074c0"
        },
        {
          "name": "search_products",
          "title": "Search products by name",
          "description": "Search products by title, brand or category when you have a name rather than a barcode. Returns barcode, title, brand, category and image for the best matches. Words shorter than 3 letters are ignored. Uses one lookup per call that returns results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search text, for example \"nutella 400g\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search products by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14ab65299e535c49c7de3aba51424b8862c308f0a7a3443790f04b788a630433"
        }
      ],
      "digest": "sha256:74d995559510393a05e66dff6a30450933e76fd5ff0f5151b26d5dc702abd8de"
    }
  }
}
