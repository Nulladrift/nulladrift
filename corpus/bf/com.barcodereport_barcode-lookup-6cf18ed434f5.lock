{
  "lockfileVersion": 2,
  "subjects": {
    "com.barcodereport/barcode-lookup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://barcodereport.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "barcodereport",
        "title": "Barcode Report",
        "version": "1.0.0",
        "websiteUrl": "https://barcodereport.com/barcode-api/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Barcode Report looks up products by barcode (UPC, EAN, GTIN or ISBN) across 500M+ records. Use lookup_barcode for one code, lookup_barcodes for several (up to 100 in one call), and search_products when you only have a product name. Each code looked up uses one lookup from the user's monthly allowance, including codes that are not found; a search uses one per call; get_usage is free. Every record has a title; brand, category, images and other fields are present on a smaller share. When a result includes an attribution string, show it with the data.",
      "tools": [
        {
          "name": "get_usage",
          "title": "Check plan and remaining lookups",
          "description": "Show the account's plan, monthly allowance, lookups used and when usage resets. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check plan and remaining lookups"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d41cb248dc808c5bbb452937504232397280375cee500fac3111a776c7a78e18"
        },
        {
          "name": "lookup_barcode",
          "title": "Look up a barcode",
          "description": "Find the product for one barcode: UPC-A, UPC-E, EAN-13, EAN-8, GTIN-14, ISBN-10 or ISBN-13. Returns the title and, where known, brand, category, description, image, price, identifiers and book details. Uses one lookup from the monthly allowance, even when the code is not found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcode": {
                "description": "The barcode, for example 049000050103. Spaces and dashes are ignored.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "required": ["barcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up a barcode"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3b99646d414dd9d53299740caa67e71abf53bbf0342efd321a42f0efc3ed5273"
        },
        {
          "name": "lookup_barcodes",
          "title": "Look up several barcodes",
          "description": "Find the products for up to 100 barcodes in one call. Duplicates are ignored. Uses one lookup per distinct code; if the batch would exceed the remaining allowance, nothing is looked up or charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barcodes": {
                "description": "Barcodes to look up.",
                "items": {
                  "maxLength": 32,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["barcodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up several barcodes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72e6be6e7a4ed2570e66e52b4e50462a4dd631820d8f0aee06ab4abe3d65b734"
        },
        {
          "name": "search_products",
          "title": "Search products by name",
          "description": "Search products by title, brand or category when you have a name rather than a barcode. Returns barcode, title, brand, category and image for the best matches. Words shorter than 3 letters are ignored. Uses one lookup per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search text, for example \"nutella 400g\".",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search products by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8dd7d49eb1bf0bcc8166437f7a49f435d01b63375d5222e6726a532a88966b53"
        }
      ],
      "digest": "sha256:28d666adbf45ea6c9edfe949975327e8a8f357d827f58cbd53765f570fe73812"
    }
  }
}
