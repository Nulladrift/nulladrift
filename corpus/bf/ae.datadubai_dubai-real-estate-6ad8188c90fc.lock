      },
      "instructions": "Read-only statistics on the Dubai property market, computed from registered Dubai Land Department (DLD) transactions and rebuilt daily by datadubai.ae: prices, price per square foot, sales volumes, rents, gross yields, off-plan share, project registry and monthly reports, for projects, communities, developers and DLD areas. Start with `search` to find a place, then `get_entity` or `fetch` for its full record; `get_monthly_report` gives citable monthly figures. Every response has a `url` on datadubai.ae and a `data_through` date. Descriptive statistics only — not investment advice or a valuation. Data: registered sales transactions from Dubai Land Department (DLD) open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a record",
          "description": "Fetch the full readable record for one project, community, developer or area by its id (\"type:slug\", e.g. \"community:dubai-marina\") — the same text as the datadubai.ae page, as Markdown with figures, limits and a citation line.\n    Returns id, title, text, url and metadata.\n    Data: registered sales transactions from Dubai Land Department open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
          "inputSchema": {
            "properties": {
              "id": {
                "title": "Id",
                "type": "string"
              }
            },
            "required": ["id"],
            "title": "fetchArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac4fbb5d072ef84589fe3f192178047460aace6841f0be33035292f5a743331c"
        },
        {
          "name": "get_entity",
          "title": "Get place statistics",
          "description": "Get the full statistics record for one project, community, developer or area by slug (the last part of its page address, e.g. dubai-marina).\n    type: project | community | developer | area. Includes price and AED/sqft medians, year-on-year changes, off-plan share, bedroom breakdown, monthly price history (may be truncated) and, for developers, their projects.\n    Data: registered sales transactions from Dubai Land Department open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
          "inputSchema": {
            "properties": {
              "slug": {
                "title": "Slug",
                "type": "string"
              },
              "type": {
                "title": "Type",
                "type": "string"
              }
            },
            "required": ["slug", "type"],
            "title": "get_entityArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get place statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cef12b27273fb6a6ef9ba2c3e1cf75a2f2dd43d8f95bef7f9262c89c9cb7dfd2"
        },
        {
          "name": "get_market_summary",
          "title": "Dubai market summary",
          "description": "Get the overall Dubai property market summary: sales count, median price and AED/sqft, year-on-year changes, off-plan share, bedroom and property-type breakdown, yearly history and recent monthly price series.\n    Data: registered sales transactions from Dubai Land Department open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
          "inputSchema": {
            "properties": {},
            "title": "get_market_summaryArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dubai market summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c7cde839723124f15c1b768d65e72a683b730bb9af7964ae18c2ba6a0b966a8"
        },
        {
          "name": "get_monthly_report",
          "title": "Monthly market report",
          "description": "Get the monthly Dubai property market report: key figures (sales, median price, AED/sqft, year-on-year), summary facts, top movers and a ready-made citation string.\n    month: 'YYYY-MM'; omit for the latest report.\n    Data: registered sales transactions from Dubai Land Department open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
          "inputSchema": {
            "properties": {
              "month": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Month"
              }
            },
            "title": "get_monthly_reportArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Monthly market report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
