          },
          "digest": "sha256:f526be19dcb781ee01ae9f53735f97325a84015a66ae5e86de142ea8048aa78c"
        },
        {
          "name": "list_rankings",
          "title": "Rankings",
          "description": "List top rankings. kind: rents (communities by median annual rent, AED), yields (communities by gross rental yield %), communities (by number of sales in last 12 months, with median price and AED/sqft) or developers (by number of sales).\n    Each row includes a url. limit: 1-100.\n    Data: registered sales transactions from Dubai Land Department open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
