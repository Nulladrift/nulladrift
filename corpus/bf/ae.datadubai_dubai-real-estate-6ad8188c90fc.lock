            "readOnly": true
          },
          "digest": "sha256:81c1a4dba361ad1e1a004516f08bc23ea1a228cfcb35abd7da2ddff41bee78fc"
        },
        {
          "name": "search",
          "title": "Search places",
          "description": "Search Dubai projects, communities, developers and areas by name (case- and accent-insensitive, all query words must match; exact > prefix > contains, then by number of sales).\n    type: optional filter, one of project | community | developer | area.\n    Returns for each hit: id (\"type:slug\"), title, type, name, slug, url and key figures (median price AED, AED per sqft, sales in last 12 months, status/completion for projects). url can be null for projects without their own page.\n    Data: registered sales transactions from Dubai Land Department open data, updated daily, licensed CC BY 4.0. Each response includes the url of the source page on datadubai.ae.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Type"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
