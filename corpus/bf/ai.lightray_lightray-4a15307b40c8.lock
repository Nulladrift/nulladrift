{
  "lockfileVersion": 2,
  "subjects": {
    "ai.lightray/lightray": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.lightray.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "LightRay",
        "title": "LightRay",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "LightRay checks companies. Use check_company with a company's name and its city or country: a new report takes about 12 minutes and gives the background, any questions to ask and what to do next. get_report shows how far a report has got and what has been found so far, and, once it is ready, the report and its link. LightRay writes each report: its main point, questions, findings and next steps are LightRay's.",
      "tools": [
        {
          "name": "check_company",
          "title": "Check a company",
          "description": "Use this when someone asks about a company or wants one checked. Give the company's name and, if known, its city or country. If a recent report on the company is stored, it comes back at once; otherwise a new report starts and the answer says when it will be ready. A new report uses one of the reader's reports; asking again for the same company does not. When several companies match the name, the answer lists them: ask the reader which one they mean, then call this again with that company's choice token. LightRay checks companies, not people.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "choice": {
                "description": "The choice token of one company from the list this tool returned when several matched. Give it with the same name.",
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "The company's name, as it is registered if known: its legal name with its legal form, such as Limited or LLC.",
                "maxLength": 160,
                "type": "string"
              },
              "place": {
                "description": "The company's city or country, if known. It helps find the right company.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "status": {
                "enum": ["ready", "building", "choose", "several", "no_company", "declined", "limit", "paused", "failed", "stopped", "expired", "not_found", "error"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reports"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7a02c532370de841f62a57e75a1521610093f7f38eaa4ffc52c224fd31fe12be"
        },
        {
          "name": "get_report",
          "title": "Read a report",
          "description": "Use this to see how far a report has got and what has been found so far, or to read a ready report: its date, the main point, any questions to ask, what was found, the next steps, the companies worth a look next and its link. LightRay writes each report: the main point, questions, findings and next steps are LightRay's. Give the report_id that check_company or list_reports returned, or the report's link. Reading a report uses none of the reader's reports.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "report_id": {
                "description": "The report_id that check_company or list_reports returned, or the report's link.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "status": {
                "enum": ["ready", "building", "choose", "no_company", "paused", "failed", "stopped", "expired", "not_found", "error"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reports"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6864c0dde64bcc7ce7ee9345cfe00032d398f9cc81076f67290abf561f4600f1"
        },
        {
          "name": "list_reports",
          "title": "List my reports",
          "description": "Use this to see the reader's recent reports from here, newest first, each with whether it is ready and its link. It uses none of the reader's reports.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many reports to list, newest first: 1 to 20. 10 if not given.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "reports": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["listed"],
                "type": "string"
              }
            },
            "required": ["reports", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my reports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["reports"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:74dbaf1a0a62588f4fbc07285e5e26f5e75665448a35148cf56b7931d96723f8"
        }
      ],
      "digest": "sha256:c044e2c8a4393518e312616b63745fbdab250c807320702a75bd0434d15f4320"
    }
  }
}
