      },
      "instructions": "AI 與科技名詞白話解釋（繁體中文）：名詞定義、概念比較、實作教學與搜尋意圖分類，每則附原始來源與查核日期。",
      "tools": [
        {
          "name": "classify_search_intent",
          "description": "判斷一句搜尋或提問屬於資訊探索、商業比較、技術除錯或行動指引哪種意圖，並給出建議答案結構、結構化資料類型與本站相關內容。",
          "inputSchema": {
            "properties": {
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8d510c3faeb737be31fca2abd182f2fba2fc46262c86f058a4e0da264ceebe4"
        },
        {
          "name": "compare_concepts",
          "description": "比較兩個 AI 概念差在哪（如 RAG vs 微調、MCP vs API、SEO vs GEO），回傳結論、比較表與各自適用情境。可給 id，或 a、b 兩個名詞。",
          "inputSchema": {
            "properties": {
              "a": {
                "type": "string"
              },
              "b": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c69d40ab35352cfbb1ab018e03ca1685ed715a5294a813cb9bfe30cb44bb8a47"
        },
        {
          "name": "explain_term",
          "description": "用白話解釋 AI 或科技名詞（如 MCP、RAG、AI 代理人、幻覺、GEO、x402），回傳定義、運作方式、例子、常見誤解、FAQ 與原始來源。可用中文、英文或別名。",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "名詞或 id，例如 MCP、檢索增強生成、ai-agent",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4fb1af4ec5658090f08caa10b3f8896fa44bea29f57f60fa20fb6d5e91ec9763"
        },
        {
          "name": "get_howto",
          "description": "取得 AI 實作教學（建立 MCP 伺服器、llms.txt、FAQPage JSON-LD、robots.txt 封鎖 AI 訓練、x402 流程、計算 Token），含需求、步驟、程式碼與常見錯誤。",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "q": {
                "description": "關鍵字，例如 MCP、llms.txt",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:499239d935e070eddb64a8637901ce905b8d179b4e50bfbc863715be948bf07d"
        },
        {
          "name": "list_topics",
          "description": "列出所有名詞（可依分類篩選）、概念比較與實作教學。",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["基礎概念", "模型技術", "協定與標準", "應用與產品", "搜尋與行銷", "硬體"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:65de12577e9d6f5f332f3e5bc509b349e5e2b9e109741ec5c86d46cc406dcea4"
        },
        {
          "name": "search_glossary",
          "description": "模糊搜尋本站的 AI 名詞、概念比較與實作教學。",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d4a39222c1bb811c334da09ebe98f4e9e06f629c9ed14d6717c034758d77228"
        }
      ],
      "digest": "sha256:2e6256ea79aa23f9c593f42e6388bdfdeaeab3e81b1f952ee63cd89bae75606e"
    }
  }
