{
  "lockfileVersion": 2,
  "subjects": {
    "ai.skillsafe/skillsafe": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.skillsafe.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "skillsafe",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_install_commands",
          "description": "Get the commands to install a skill from the SkillSafe registry (npx skills add, or git clone), plus its version, file list, and scan verdict. Installs nothing itself: run one of the returned commands to install. Does not return file contents.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Skill name",
                "type": "string"
              },
              "namespace": {
                "description": "Skill namespace (with or without @)",
                "type": "string"
              },
              "version": {
                "description": "Semver version (omit for latest)",
                "type": "string"
              }
            },
            "required": ["name", "namespace"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get install commands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9eb3033b4b4b743996ed3a01205fbec0ab875fddaf08b99c0736455050036ad"
        },
        {
          "name": "get_skill_info",
          "description": "Get detailed metadata for a specific skill by namespace and name (e.g. @anthropics/pptx).",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Skill name",
                "type": "string"
              },
              "namespace": {
                "description": "Skill namespace (with or without @)",
                "type": "string"
              }
            },
            "required": ["name", "namespace"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get skill details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5ef18cc8efbcbd5eb0f848c92c4e7b7085def74d3326f328b486f785441aed9"
        },
        {
          "name": "recommend_skills",
          "description": "Given a task description, recommend the most relevant skills from the SkillSafe registry. Call this before attempting non-trivial tasks like creating presentations, building bots, or generating reports.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1-20, default 5)",
                "type": "number"
              },
              "task": {
                "description": "What the user wants to accomplish (max 500 chars)",
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend skills for a task"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69bb9f46547aae02deb17c416ecf51a03d656332c138032173086f01b3c1de14"
        },
        {
          "name": "scan_mcp_config",
          "description": "Scan MCP tool definitions or server configurations for poisoning patterns (injection tags, credential theft, stealth instructions, exfiltration).",
          "inputSchema": {
            "properties": {
              "mcpServers": {
                "description": "MCP server config object to scan (e.g. from claude_desktop_config.json)",
                "type": "object"
              },
              "tools": {
                "description": "MCP tool definitions to scan (provide tools OR mcpServers, not both)",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "inputSchema": {
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scan MCP tools or config"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2809613b739b36aa9253369cdb2cc2eb4ac0f376f4bea6124171b697e2b7f6c"
        },
        {
          "name": "scan_skill",
          "description": "Scan skill files for security issues. Provide file paths and contents to analyze for vulnerabilities, prompt injection, credential exposure, and other risks.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Files to scan",
                "items": {
                  "properties": {
                    "content": {
                      "description": "File content",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative file path",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Scan skill files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7bc2bd70efb0d38183547435b9cd7c6f348bb710b23cabc46fbd1e8dd344952"
        },
        {
          "name": "search_skills",
          "description": "Search the SkillSafe registry for AI coding skills. Returns a compact list of matching skills with metadata.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category",
                "type": "string"
              },
              "limit": {
                "description": "Max results (1-100, default 20)",
                "type": "number"
              },
              "namespace": {
                "description": "Filter by @namespace",
                "type": "string"
              },
              "query": {
                "description": "Free-text search query",
                "type": "string"
              },
              "sort": {
                "description": "Sort order",
                "enum": ["popular", "recent", "verified", "trending", "hot", "stars", "newest", "eval_score", "relevance", "updated", "installs"],
                "type": "string"
              },
              "tag": {
                "description": "Filter by tag",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search skills"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66d0e5a3edaff4aef31699a46a8f44a5508696312a3729b3131a5bcfcdf4a79f"
        }
      ],
      "digest": "sha256:920fac03eb445e040d3e8b28648b169e142dfaedeb4f3b2c68fdb78fd3e5b8fd"
    }
  }
}
