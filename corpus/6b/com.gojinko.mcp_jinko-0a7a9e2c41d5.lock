        {
          "name": "flight_search",
          "title": "flight_search",
          "description": "Live flight tool with two modes. Provide exactly one of \"search\" or \"price_check\". Set the unused one to null or leave it out; for a route search, send \"price_check\": null. EACH CALL HITS LIVE PRICING — it prices ONE exact date pair, so any loose, open or flexible date query belongs to flight_calendar instead.\n\nMODE 1 — search: route + exact single dates + optional filters (most common first-call case)\n- Use when the user has committed to ONE specific route AND a specific departure date. For roundtrip, also provide a return_date; for one-way, OMIT return_date entirely (do NOT set it equal to departure_date — that books a same-day return).\n- ROUTE CODES: the city code when the user named a city, the airport code when they named an airport. Untyped, a code that names a multi-airport city is searched as the city and any other code as the airport; LAX, MIA and LAS are both a city code and that city's main airport, so they are read as the city unless you send origin_type / destination_type \"airport\".\n- Supports the full shop filter set on the same call: trip_type, max_stops, cabin_class, max_price (whole-trip budget for all passengers), limit, include_carriers / exclude_carriers, single_carrier_only, departure/arrival (and return_*) time ranges, connection_time_min/max_minutes, max_total_duration_minutes, refundable_only, changeable_only, checked_bag_included, via_airports / exclude_via_airports, aircraft_types, origin_alternate_airports / destination_alternate_airports, nearby_airports, same_connection/origin/turnaround_airport_only, origin_type, destination_type.\n- **Trip-context dates count as exact.** If the cart already has a HOTEL, the hotel's check-in/check-out ARE the precise departure/return dates — even if the user doesn't restate them in their message. Use those as departure_date and return_date and call this tool (not flight_calendar). Forward the trip_id on the call.\n- Examples:\n  ✓ \"Paris to NYC, June 1 to June 10\" → { search: { origin: \"PAR\", destination: \"NYC\", departure_date: \"2027-06-01\", return_date: \"2027-06-10\" } }\n  ✓ \"Paris to Rome June 19 to 27, direct only, business class\" → { search: { origin: \"PAR\", destination: \"ROM\", departure_date: \"2026-06-19\", return_date: \"2026-06-27\", max_stops: 0, cabin_class: \"business\" } }\n  ✓ \"JFK → CDG August 5 to 12, Air France only, under $800\" → { search: { origin: \"JFK\", origin_type: \"airport\", destination: \"CDG\", destination_type: \"airport\", departure_date: \"2026-08-05\", return_date: \"2026-08-12\", include_carriers: [\"AF\"], max_price: 800 } }\n  ✓ \"Paris to LA June 3, one way\" → { search: { origin: \"PAR\", destination: \"LAX\", departure_date: \"2026-06-03\" } } — the user named the city, so untyped LAX is right: it is the Los Angeles CITY and returns other Los Angeles airports too (Ontario, ONT)\n  ✓ \"Paris to LAX June 3, one way\" → { search: { origin: \"PAR\", destination: \"LAX\", destination_type: \"airport\", departure_date: \"2026-06-03\" } } — the user named the airport\n  ✓ \"Paris to Rome June 19 to 27, at most one stop, refundable, bag included\" → { search: { origin: \"PAR\", destination: \"ROM\", departure_date: \"2026-06-19\", return_date: \"2026-06-27\", max_stops: 1, refundable_only: true, checked_bag_included: true } }\n  ✓ Cart has hotel in Madrid May 8 → May 10; user says \"add a flight from Paris, directs only\" → { search: { origin: \"PAR\", destination: \"MAD\", departure_date: \"2026-05-08\", return_date: \"2026-05-10\", max_stops: 0 }, trip_id: \"trip_xxx\" }\n- A search takes ONE origin/destination pair, ONE departure_date and at most ONE return_date — no date arrays, no date ranges.\n\nMODE 2 — price_check: confirm live fares for a specific flight\n- Use after the user picks a flight returned by flight_calendar or find_destination. Pass the offer_token.\n- Schema: { \"price_check\": { \"offer_token\": \"...\" } }\n\nWHEN NOT TO USE (route to flight_calendar instead):\n- \"Cheapest flight in June\" (loose month window)\n- \"Paris to NYC next week\" (loose window — 7 days)\n- \"Best weekend to fly to Rome in spring\" (no anchor date — the tool would have to pick one)\n- \"Paris to Rome June 19 to 27, give or take a day\" / \"±2 days\" / \"a day or two either side of the 19th\" (a soft window around the anchors — however narrow, this tool cannot widen a date)\n- Any OPEN date RANGE that implies multiple candidate departure/return pairs the user has not narrowed\n- CARRY THE FILTERS BACK: flight_calendar takes only direct_only, cabin_class, max_price and the time windows — refundable_only, changeable_only, checked_bag_included, max_stops and the carrier lists are NOT in its input, and price_check re-applies none of them (JIN-245). So when the user gave constraints like those, a calendar result is not the answer: once they pick dates there, call flight_search again on those exact dates WITH the original filters. The calendar budget is per adult: flight_calendar's max_price caps a one-adult fare; a whole-party budget is divided by adults only for a loose pre-filter. This tool's max_price covers the whole trip for all passengers — send the user's whole-trip figure unchanged, or for a per-person figure multiply by the number of passengers. Never carry the calendar budget across as max_total; flight_search refuses that name.\n\nNOTE: \"June 19 to 27\" / \"between the 19 and 27\" with a specific round-trip intent counts as\nexact single dates (dep=19, ret=27) — use flight_search, not flight_calendar.\n\nWIDGET:\nThe flight-shop widget renders fare options with Refundable/Changeable flags and a\n\"Book\" button that launches the traveler modal. Both search and price_check modes\npopulate this widget.\n\nFILTERS (search mode):\n- Every filter that narrows the results (cabin on the longest segment, stops, price, airlines, times, connections, fare conditions, aircraft) is applied exactly as sent: no returned itinerary breaks one, except that business also returns first fares on flights entirely within the United States, where the premium cabin is sold as first. Options that widen a search (alternate or nearby airports) are searched where the source supports them, and sources search at most 9 via_airports per leg. An empty result carries an instruction: relay it. It asks which filter to relax only when a narrowing filter was sent; otherwise it asks about other dates or airports.\n- origin_alternate_airports / destination_alternate_airports are searched beside an airport or a city anchor: origin NYC with [\"BOS\"] covers New York's airports and Boston.\n- Each fare carries refundable / changeable / checked_bag_included booleans, so you can re-check those constraints yourself.\n\nIMPORTANT:\n- Prices are subject to change until booking is confirmed\n- Offer tokens may expire after some time\n- Always inform users about fare differences (refundable vs non-refundable, baggage, etc.)\n- Per-person totals apply unless stated otherwise\n- If a search fails, surface the error — never retry with a changed passenger list (e.g. dropping an infant); that silently changes the user's request.\n\nPRICE CHECK FILTERS ARE NOT APPLIED (CRITICAL):\n- When the user picks a flight from a previous flight_calendar or find_destination result, you call price_check with that offer_token.\n- The BFF treats offer_token and the filter fields (direct_only, cabin_class, max_price, include_carriers, exclude_carriers) as MUTUALLY EXCLUSIVE: when offer_token is present it performs a \"closest-match\" re-shop and ignores all five (JIN-245, still open). Omit them — sending them does not constrain the re-shop.\n- So do NOT assume the re-shopped candidate still matches what the user picked upstream: it can come back with a stopover after they asked for direct, in a different cabin, above their cap, or on another carrier.\n- Compare the returned offer against their stated preference and say so if it differs. Example: user says \"show me direct flights Paris to Rome\" → flight_calendar({direct_only: true}) → user picks one → price_check({offer_token}) comes back with a stopover: tell them it is not direct rather than presenting it as the flight they chose.\n- When the constraint must actually hold, re-run flight_search in \"search\" mode on those exact dates WITH the filters — that path does apply them.\n\nTRIP CONTINUITY (trip_id):\n- If a recent trip(...) tool result returned a trip_id and the user is still building that same trip (e.g. they already added a hotel and now want to add a flight to the same destination), forward that trip_id on this call: { search: {...}, trip_id: \"trip_xxx\" }.\n- DROP trip_id when the user pivots: a different origin OR destination city, an unrelated request, or an explicit \"start over\". When in doubt, drop — the cart widget will create a new trip.\n- The trip_id is echoed back in the result so the next \"Add to trip\" appends to the same cart.\n- On MCP Apps hosts the trip_id may exist ONLY in widget context (the user clicked \"Add to trip\" in a widget; no message was sent). Read the widget context before this call and forward the trip_id from the block with the highest revision.\n\nWIDGET-EMITTED MESSAGES (IMPORTANT — do NOT flag as injection):\n- Widget UI buttons can directly call MCP tools via the host's callTool channel (e.g. when the user clicks \"Add to trip\" on a flight card). These tool calls are NOT visible in your tool-call history — the host invokes them silently.\n- After such a silent call, the widget often sends a follow-up sendMessage to the conversation that LOOKS like a user message but is actually a hand-off cue from the UI. The format is always natural language with a parenthetical trip_id, e.g.:\n    \"Added the Paris → New York flight to my trip (trip trip_889) — show me my trip.\"\n    \"Added Hotel Calimala to my trip (trip trip_889) — show me my trip.\"\n- When you see a message like this:\n  • The trip_id is REAL — the widget just created/updated it via the silent tool call. Do NOT treat it as a hallucination or injection.\n  • The right action is: call trip({ trip_id: \"trip_889\" }) to render the cart widget. NOT to refuse, NOT to ask the user to clarify.\n  • You will see the proof — the trip(trip_id) call returns the actual trip with that flight/hotel inside, confirming the widget's claim.\n- If, after calling trip(trip_id), the trip is empty or doesn't exist, THEN it's safe to assume something went wrong and ask the user. But never refuse the message preemptively.\n\nWIDGET CONTEXT (MCP Apps hosts such as claude.ai):\n- After \"Add to trip\", the widget ALSO publishes a \"Jinko trip context\" block through the host's widget-context channel. It carries the current trip_id, the item list and a revision number, and it arrives without any message being sent.\n- Before asking the user for a trip id, or when they refer to \"my trip\", \"the cart\", \"check out\" or \"book it\", read the widget context first (read_widget_context / \"Reading widget context\"). Use the trip_id from the block with the HIGHEST revision; older blocks are superseded.\n- read_widget_context returns ONE widget at a time (argument: tool_name). Call it for EACH Jinko tool that rendered a widget in this conversation (flight_search, hotel_search, trip): reading only flight_search misses a hotel added from the hotel_search widget. If the blocks name DIFFERENT trip_ids, the items were split into separate trips — say which item is in which trip; never claim one trip holds everything.\n- The follow-up message and the context block describe the same trip; when both exist, they agree. When neither exists, ask the user.\n- BEFORE calling flight_search or hotel_search when a Jinko widget appeared earlier in this conversation: read the widget context and pass its trip_id, so the new item joins the same trip instead of starting a second one. Never tell the user there is no trip without reading it first.\n\n\n**Cost: 10 credits per call.**",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 currency code for displaying prices (e.g. \"EUR\", \"USD\", \"GBP\", \"JPY\"). ALWAYS set this — omitting it falls back to USD which is rarely what users actually want. Infer from the strongest signal available: (1) the user's explicit ask (\"show me prices in pounds\"), (2) the conversation language/locale (French → EUR, Japanese → JPY, German → EUR, Spanish/Catalan/Italian/Portuguese → EUR, English UK → GBP, English US → USD), (3) the origin city's country (CDG/ORY → EUR, LHR/LGW → GBP, NRT/HND → JPY, JFK/LAX → USD, etc.). When in doubt between two plausible currencies, prefer the one matching the user's likely home country.",
                "type": "string"
              },
              "locale": {
                "description": "User's BCP 47 locale inferred from the conversation (e.g. \"fr-FR\", \"en-US\", \"ja-JP\"). Used for formatting dates, numbers, and selecting currency.",
                "type": "string"
              },
              "price_check": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "cabin_class": {
                        "description": "Not applied in price_check (JIN-245); omit even if the upstream call had this filter set. With offer_token present the BFF re-shops closest-match and ignores it, so the candidate can come back in a different cabin.",
                        "enum": ["economy", "premium_economy", "business", "first"],
                        "type": "string"
                      },
                      "direct_only": {
                        "description": "Not applied in price_check (JIN-245); omit even if the upstream call had this filter set. With offer_token present the BFF re-shops closest-match and ignores it, so the candidate can come back with a stopover.",
                        "type": "boolean"
                      },
                      "exclude_carriers": {
                        "description": "IATA 2-letter marketing carrier codes (blacklist). Not applied in price_check (JIN-245); omit even if the upstream call had this filter set.",
                        "items": {
                          "maxLength": 2,
                          "minLength": 2,
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "include_carriers": {
                        "description": "IATA 2-letter marketing carrier codes (whitelist). Not applied in price_check (JIN-245); omit even if the upstream call had this filter set.",
                        "items": {
                          "maxLength": 2,
                          "minLength": 2,
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "max_price": {
                        "description": "Not applied in price_check (JIN-245); omit even if the upstream call had this filter set. With offer_token present the BFF re-shops closest-match and ignores it, so the candidate can come back above the cap.",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "offer_token": {
                        "description": "offer_token from flight_calendar or find_destination results. Uniquely identifies a specific flight offer for live pricing.",
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["offer_token"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Get confirmed live fares for a specific flight offer. Returns fare brands with trip_item_token for booking. The BFF treats offer_token and the filter fields (direct_only, cabin_class, max_price, include_carriers, exclude_carriers) as MUTUALLY EXCLUSIVE: when offer_token is present it performs a \"closest-match\" re-shop and ignores all five (JIN-245, still open). Omit them here, and do NOT assume the re-shopped candidate still matches what the user picked upstream — compare the returned offer against their stated preference and say so if it differs. The wider shop filters (max_stops, refundable_only, …) belong to `search` only."
              },
              "search": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "aircraft_types": {
                        "description": "Restrict every segment to these IATA aircraft equipment codes. Example: [\"320\",\"321\"]. Use only when the user names equipment; most users do not.",
                        "items": {
                          "pattern": "^[A-Z0-9]{3}$",
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "arrival_time_range": {
                        "additionalProperties": false,
                        "description": "Filter the OUTBOUND leg by local arrival time-of-day. Example: { \"latest\": \"20:00\" }. Use when the user says \"arrive before dinner\", \"land by noon\".",
                        "properties": {
                          "earliest": {
                            "description": "Inclusive earliest local time-of-day (HH:MM, 24-hour).",
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          },
                          "latest": {
                            "description": "Inclusive latest local time-of-day (HH:MM, 24-hour).",
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "cabin_class": {
                        "anyOf": [
                          {
                            "enum": ["economy", "premium_economy", "business", "first"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Cabin class filter. Use null when the user did not explicitly request a cabin; null or omission lets the provider use economy as its search default without filtering returned fares by cabin. When the user explicitly requests economy, premium economy, business, or first, send that value; results must match it on the longest segment, while shorter segments may use another cabin. On flights entirely within the United States (including Puerto Rico and the US Virgin Islands), business also returns first fares, because US airlines sell the domestic premium cabin as first; those fares keep cabin first."
                      },
                      "changeable_only": {
                        "description": "Keep only fares that allow a voluntary change (with or without a fee). Same conservative behavior as refundable_only. Each returned fare echoes the resolved `changeable` flag.",
                        "type": "boolean"
                      },
                      "checked_bag_included": {
                        "description": "Keep only fares whose price already includes a checked bag. Use when the user says \"with a bag included\", \"I need to check luggage\".",
                        "type": "boolean"
                      },
                      "connection_time_max_minutes": {
                        "description": "Maximum layover length, in minutes, for EVERY connection of EVERY leg. Use when the user says \"no long layovers\" (\"under 3 hours\" → 180).",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "connection_time_min_minutes": {
                        "description": "Minimum layover length, in minutes, for EVERY connection of EVERY leg. Use when the user wants a comfortable connection (\"at least 90 minutes to change planes\"). Must not exceed connection_time_max_minutes.",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "departure_date": {
                        "description": "Single departure date (YYYY-MM-DD) — no arrays or ranges. Required.",
                        "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                        "type": "string"
                      },
                      "departure_time_range": {
                        "additionalProperties": false,
                        "description": "Filter the OUTBOUND leg by local departure time-of-day. Example: { \"earliest\": \"08:00\", \"latest\": \"12:00\" }. Use when the user says \"morning flight\", \"leave after 6pm\".",
                        "properties": {
                          "earliest": {
                            "description": "Inclusive earliest local time-of-day (HH:MM, 24-hour).",
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          },
                          "latest": {
                            "description": "Inclusive latest local time-of-day (HH:MM, 24-hour).",
                            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "destination": {
                        "description": "Destination IATA city code (e.g. MIL, BCN, TYO) or airport code (e.g. MXP, BCN, NRT). A city code searches every airport of the city, which is what a user naming a city wants. ALWAYS convert place names to codes yourself before calling (Tokyo → TYO, São Paulo → SAO); a name like \"Tokyo\" fails validation. See destination_type for how an untyped code is read — LAX alone is the Los Angeles CITY. Required.",
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      "destination_alternate_airports": {
                        "description": "ADDITIONAL arrival airports searched ALONGSIDE `destination`, e.g. [\"EWR\",\"LGA\"] with `destination: \"JFK\"`. WIDENING ONLY — the anchor in `destination` is always searched. THE ANCHOR RANKS AND TRUNCATES the result set, so put the airport that matters most to the user in `destination`, not in this list: on one measured route, anchor JFK + alternate EWR came back 15 JFK / 35 EWR, while anchor EWR + alternate JFK came back 2 JFK / 48 EWR. Works with an airport or a city anchor: `destination: \"NYC\"` with [\"BOS\"] searches New York's airports and Boston. On a round trip the whole side is mirrored, so these airports also apply to where the RETURN departs from. Some sources search only the anchor.",
                        "items": {
                          "pattern": "^[A-Z]{3}$",
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "destination_type": {
                        "description": "How to read destination: \"city\" searches every airport of the city; \"airport\" only that one airport. With no type sent, the platform applies one rule: a code that names a multi-airport city is searched as the city; every other code is searched as the airport. NYC, LON, PAR → the city. JFK, LHR, CDG → the airport. LAX, MIA, LAS — codes a city shares with its main airport — → the CITY, every airport of it. If the user named the airport (\"LAX\", \"JFK\", \"Heathrow\"), send \"airport\"; if they named the city (\"Los Angeles\", \"New York\"), send the city code and omit the type. On a live search the provider decides which airports a city holds, so untyped LAX returns flights into other Los Angeles airports — Ontario (ONT) among them, often as the cheapest offers. Each offer reports the airports flown on its legs; the offer-level city code does not change.",
                        "enum": ["city", "airport"],
                        "type": "string"
                      },
                      "direct_only": {
                        "description": "DEPRECATED — send `max_stops: 0` instead. Still accepted: `direct_only: true` is folded into `max_stops: 0` before the search runs and only `max_stops` reaches the platform. Setting it beside a non-zero `max_stops` is an error.",
                        "type": "boolean"
                      },
                      "exclude_carriers": {
                        "description": "IATA 2-letter marketing carrier codes to exclude (blacklist). Example: [\"FR\",\"U2\"]. ALWAYS convert airline names to codes yourself (Ryanair → FR, Frontier → F9); a name like \"Ryanair\" fails validation. A brand that operates several marketing carriers needs every code listed (\"no Wizz Air\" → W6, W9). Use when the user says \"no Ryanair\", \"avoid budget airlines\", etc. Must not overlap include_carriers.",
                        "items": {
                          "pattern": "^[A-Z0-9]{2}$",
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "exclude_via_airports": {
                        "description": "Ban connections at these IATA airport codes. Example: [\"LHR\"] when the user says \"anything but Heathrow\". Lists longer than 9 are still fully enforced. Must not overlap via_airports.",
                        "items": {
                          "pattern": "^[A-Z]{3}$",
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "include_carriers": {
                        "description": "IATA 2-letter marketing carrier codes to include (whitelist). Example: [\"AF\",\"KL\"]. ALWAYS convert airline names to codes yourself (Air France → AF, Delta → DL); a name like \"Delta\" fails validation. A brand that operates several marketing carriers needs every code listed (easyJet → U2, EC, DS). Use when the user says \"Air France only\", \"fly Delta\", etc. Must not overlap exclude_carriers. Matching means EVERY segment is marketed by a listed carrier (codeshares count by marketing carrier). When nothing matches, the search returns no offers with reason no_matches; the platform never widens to other carriers. Tell the user no itinerary satisfied the airline filter and ask which filter to relax.",
                        "items": {
                          "pattern": "^[A-Z0-9]{2}$",
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "limit": {
                        "description": "TOTAL number of flights returned (1–300). Caps the whole result set, not a per-page size; it only trims what comes back, since the providers still bound the real count.",
                        "maximum": 300,
                        "minimum": 1,
                        "type": "integer"
                      },
                      "max_price": {
                        "description": "Maximum total price for the whole trip and ALL passengers together, in the requested currency. Send the user's whole-trip budget unchanged, or multiply a per-person budget by the number of passengers.",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "max_stops": {
                        "description": "Maximum stops per leg (0-2). 0 = nonstop — send `max_stops: 0` when the user says \"direct only\" / \"non-stop\" / \"no layovers\"; 1 when the user says \"at most one stop\".",
                        "maximum": 2,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "max_total_duration_minutes": {
                        "description": "Cap on EACH leg's total elapsed travel time, in minutes (gate to gate, layovers included). Use when the user says \"nothing longer than 12 hours\" → 720.",
                        "exclusiveMinimum": 0,
                        "type": "integer"
                      },
                      "multi_fare": {
                        "description": "Defaults to TRUE: several branded fares per itinerary (the upsell ladder). Set false for a single fare per itinerary and much smaller responses.",
                        "type": "boolean"
                      },
                      "nearby_airports": {
                        "description": "Ask the providers to also search alternate airports around each leg's origin and destination. WIDENS the search. Use when the user says \"or any nearby airport\".",
                        "type": "boolean"
                      },
                      "origin": {
                        "description": "Origin IATA city code (e.g. PAR, NYC, LON) or airport code (e.g. CDG, JFK, LHR). A city code searches every airport of the city, which is what a user naming a city wants. ALWAYS convert place names to codes yourself before calling (Paris → PAR, Mexico City → MEX, Miami → MIA); a name like \"Paris\" fails validation. See origin_type for how an untyped code is read. Required.",
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      "origin_alternate_airports": {
                        "description": "ADDITIONAL departure airports searched ALONGSIDE `origin`, e.g. [\"EWR\",\"LGA\"] with `origin: \"JFK\"`. WIDENING ONLY — the anchor in `origin` is always searched. THE ANCHOR RANKS AND TRUNCATES the result set, so put the airport that matters most to the user in `origin`, not in this list: on one measured route, anchor JFK + alternate EWR came back 15 JFK / 35 EWR, while anchor EWR + alternate JFK came back 2 JFK / 48 EWR. Works with an airport or a city anchor: `origin: \"NYC\"` with [\"BOS\"] searches New York's airports and Boston. On a round trip the whole side is mirrored, so these airports also apply to where the RETURN lands. Some sources search only the anchor.",
                        "items": {
                          "pattern": "^[A-Z]{3}$",
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "origin_type": {
                        "description": "How to read origin: \"city\" searches every airport of the city; \"airport\" only that one airport. With no type sent, the platform applies one rule: a code that names a multi-airport city is searched as the city; every other code is searched as the airport. NYC, LON, PAR → the city. JFK, LHR, CDG → the airport. LAX, MIA, LAS — codes a city shares with its main airport — → the CITY, every airport of it. If the user named the airport (\"LAX\", \"JFK\", \"Heathrow\"), send \"airport\"; if they named the city (\"Los Angeles\", \"New York\"), send the city code and omit the type. On a live search the provider decides which airports a city holds, so untyped LAX returns flights into other Los Angeles airports — Ontario (ONT) among them, often as the cheapest offers. Each offer reports the airports flown on its legs; the offer-level city code does not change.",
                        "enum": ["city", "airport"],
                        "type": "string"
                      },
                      "refundable_only": {
                        "description": "Keep only fares that can be cancelled before departure (with or without a fee). Narrowing and conservative: fares whose rules cannot be verified are dropped, so some carriers disappear entirely. Each returned fare echoes the resolved `refundable` flag.",
                        "type": "boolean"
                      },
                      "return_arrival_time_range": {
                        "additionalProperties": false,
                        "description": "Round-trip only. Filter the RETURN leg by local arrival time-of-day.",
                        "properties": {
                          "earliest": {
                            "description": "Inclusive earliest local time-of-day (HH:MM, 24-hour).",
