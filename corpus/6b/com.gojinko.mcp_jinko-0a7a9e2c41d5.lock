        {
          "name": "flight_calendar",
          "title": "flight_calendar",
          "description": "Search flights between a known origin and destination using cached pricing, especially for flexible dates.\n\nWHEN TO USE THIS TOOL (CRITICAL):\n- The user provides both an origin AND a destination (city or airport)\n- Examples: \"Paris to Barcelona\", \"JFK to CDG\", \"London to NYC for a weekend\"\n- Supports loose / flexible dates: single dates, date arrays, date ranges, stay_days\n- ALSO the right tool for \"cheapest flight\", \"best flight\", \"find me a flight\", \"cheapest date\" phrasings — this tool returns the cheapest cached itineraries for the given route and window.\n\nWHEN TO USE find_destination INSTEAD:\n- The user does NOT specify a destination: \"Where should I go from Paris?\", \"Best deals from NYC\"\n- The user wants inspiration: \"Beach destinations from London\", \"Cheap flights from SF\"\n\nWHEN TO USE flight_search INSTEAD:\n- The user wants live pricing on one specific route with an exact departure date. For a round trip, also require an exact return date; one-way trips need no return date.\n- Examples: \"Paris → NYC one-way on June 17\", \"Paris → NYC, June 17 → June 26\"\n- flight_search hits live pricing (each call has a cost) and is the step immediately before booking. Use it once the route and required travel dates are locked.\n- **TRIP-CONTEXT DATES COUNT AS EXACT.** If a trip is already in context with a HOTEL, the hotel's check-in and check-out ARE the exact departure/return dates the user wants — even if they don't restate the dates in the message. In that case use flight_search (not flight_calendar) with the hotel's check-in as departure_date and check-out as return_date. Examples: cart has hotel May 8 → May 10 in Madrid; user says \"add a flight from Paris\" → flight_search with PAR→MAD, dep=2026-05-08, ret=2026-05-10. The trip cross-sell hint confirms this — when it points you at flight_search, follow it.\n\nIMPORTANT:\n  All dates in query parameters (departure_dates, departure_date_ranges, return_dates, return_date_ranges) MUST be in the future. Never use past dates.\n  Use departure_dates for specific days or departure_date_ranges for a window. There is no departure_date parameter.\n  Origin and destination: send the city code when the user named a city (Paris → PAR, New York → NYC) and the airport code when they named an airport (JFK, CDG). A code that names a multi-airport city covers every airport of that city; any other code is that one airport. LAX, MIA and LAS are both a city code and that city's main airport, so they are read as the city here — this tool has no type field; flight_search has origin_type / destination_type to pin one airport.\n\nROUTE SEARCH:\n- Use exact 3-letter IATA airport codes or IATA city code for both origin and destination\n- Date ranges OR stay duration for flexible trip planning\n- Natural trip duration (stay_days) instead of exact return dates\n- By default, please search roundtrip flights unless user specifies one-way. Use trip_type=\"oneway\" ONLY when the user explicitly asks for a one-way trip\n\nUSE CASES:\n✓ \"Find flights from JFK to CDG next month\" - route + flexible date range\n✓ \"Fly from LA to Tokyo for a week in December\" - uses departure_date_ranges + stay_days\n✓ \"Paris to Barcelona for a weekend in April\" - route + loose window\n✓ \"Cheapest flight from ORD to LHR in June\" - route + loose month window\n✓ \"Direct business-class flight NYC → LON next month\" - route with preferences\n\nFlow: flight_calendar → (user picks) → flight_search (price_check with offer_token) → trip → book.\nOr, for precise dates: skip flight_calendar and go straight to flight_search search mode.\n\nThe widget displays flights in a scrollable carousel with options to view detailed itineraries.\n\nEvery price this tool returns is one adult's cached fare; the tool takes no party. To price the whole party, price-check the offer using flight_search with price_check and the travellers' counts in traveler_counts.\n\n**Cost: 1 credit per call.**",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "arrival_time_range": {
                "additionalProperties": false,
                "description": "Filter the OUTBOUND leg by local arrival time-of-day. Example: { \"latest\": \"20:00\" } to arrive by 8pm. Use when the user says \"arrive before dinner\", \"land by noon\", etc.",
                "properties": {
                  "earliest": {
                    "description": "Inclusive earliest local time-of-day (HH:MM, 24-hour).",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  "latest": {
                    "description": "Inclusive latest local time-of-day (HH:MM, 24-hour).",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "cabin_class": {
                "anyOf": [
                  {
                    "enum": ["economy", "premium_economy", "business", "first"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cabin class preference. Options: \"economy\" (standard economy), \"premium_economy\" (enhanced economy with more space/amenities), \"business\" (business class), \"first\" (first class). When specified, only shows flights in the requested cabin class."
              },
              "currency": {
                "description": "ISO 4217 currency code for displaying prices (e.g. \"EUR\", \"USD\", \"GBP\"). Infer from the user's country or locale. If the user mentions a specific currency, use that.",
                "type": "string"
              },
              "departure_date_ranges": {
                "description": "List of departure date ranges for flexible travel exploration. Use when user says \"next month\", \"spring\", or wants to discover deals across multiple date periods with OR logic. Example: [{start: \"2025-12-10\", end: \"2025-12-15\"}, {start: \"2025-12-20\", end: \"2025-12-25\"}] for non-contiguous periods.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end": {
                      "description": "Range end date (YYYY-MM-DD)",
                      "type": "string"
                    },
                    "start": {
                      "description": "Range start date (YYYY-MM-DD)",
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "departure_dates": {
                "description": "List of specific departure dates in ISO 8601 format (YYYY-MM-DD). Use for searching multiple specific dates with OR logic. Example: [\"2025-12-15\", \"2025-12-16\", \"2025-12-17\"] for flexible date searches. Useful when user wants to check specific dates like weekends.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "departure_time_range": {
                "additionalProperties": false,
                "description": "Filter the OUTBOUND leg by local departure time-of-day. Example: { \"earliest\": \"08:00\", \"latest\": \"12:00\" } for a late-morning departure. Use when the user says \"morning flight\", \"leave after 6pm\", etc.",
                "properties": {
                  "earliest": {
                    "description": "Inclusive earliest local time-of-day (HH:MM, 24-hour).",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  "latest": {
                    "description": "Inclusive latest local time-of-day (HH:MM, 24-hour).",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "destination": {
                "description": "REQUIRED: Single destination IATA airport code or IATA city code. Airport codes: \"CDG\" for Paris Charles de Gaulle, \"SFO\" for San Francisco. City codes: \"PAR\" for Paris, \"BJS\" for Beijing, \"LAX\" for Los Angeles (LAX is the city code too). A code that names a multi-airport city (NYC, LON, PAR — and LAX, MIA, LAS, which a city shares with its main airport) covers every airport of that city; any other code is that one airport.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "direct_only": {
                "description": "Only show direct/nonstop flights. When true, only flights with no stops are returned. Use for fastest travel or when layovers are not desired.",
                "type": "boolean"
              },
              "locale": {
                "description": "User's BCP 47 locale inferred from the conversation (e.g. \"fr-FR\", \"en-US\", \"ja-JP\"). Used for formatting dates, numbers, and selecting currency. Infer from the user's language and location context.",
                "type": "string"
              },
              "max_price": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Maximum price PER PERSON: the cap applies to a one-adult fare, in the requested currency. For a whole-party budget, divide it by the number of ADULTS only and treat the result as a loose pre-filter: children and lap infants usually cost less than an adult, so dividing by every traveller would exclude affordable trips. Send a per-person budget as-is. The exact whole-trip budget check is flight_search with max_price."
              },
              "origin": {
                "description": "REQUIRED: Single origin IATA airport code or IATA city code. Airport codes: \"JFK\" for John F. Kennedy in New York, \"LGW\" for Gatwick in London. City codes: \"NYC\" for New York, \"LON\" for London, \"PAR\" for Paris. A code that names a multi-airport city (NYC, LON, PAR — and LAX, MIA, LAS, which a city shares with its main airport) covers every airport of that city; any other code is that one airport.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "return_arrival_time_range": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "Local time-of-day window (\"HH:MM\", 24-hour). Either bound may be omitted.",
                    "properties": {
                      "earliest": {
                        "description": "Inclusive earliest local time-of-day (HH:MM, 24-hour).",
                        "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                        "type": "string"
                      },
                      "latest": {
                        "description": "Inclusive latest local time-of-day (HH:MM, 24-hour).",
                        "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Round-trip only. Filter the RETURN leg by local arrival time-of-day."
              },
              "return_date_ranges": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "end": {
                          "description": "Range end date (YYYY-MM-DD)",
                          "type": "string"
                        },
                        "start": {
                          "description": "Range start date (YYYY-MM-DD)",
                          "type": "string"
                        }
                      },
                      "required": ["end", "start"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "List of return date ranges for flexible round-trip exploration. Use when user wants flexibility on return timing across multiple periods with OR logic. Example: [{start: \"2025-12-22\", end: \"2025-12-25\"}, {start: \"2025-12-29\", end: \"2026-01-02\"}]"
              },
              "return_dates": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
