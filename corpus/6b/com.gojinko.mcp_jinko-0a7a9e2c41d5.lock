      "instructions": "Jinko Travel — flight and hotel search, pricing, and booking, with interactive widgets.\n\nWIDGET CONTEXT: on hosts that expose widget context (claude.ai and other MCP Apps hosts), the Jinko widgets publish a \"Jinko trip context\" block after every \"Add to trip\" and whenever the trip cart refreshes. It carries the current trip_id, the item list and a revision number. When the user refers to their trip, cart, checkout or booking, read the widget context before asking for a trip id, use the block with the HIGHEST revision, and call trip({ \"trip_id\": \"<that id>\" }). read_widget_context returns ONE widget at a time (argument: tool_name): call it for EACH Jinko tool that rendered a widget in this conversation (flight_search, hotel_search, trip); if the blocks name different trip_ids, the items were split into separate trips — say which item is in which trip. Before any flight_search or hotel_search that follows a widget in this conversation, read the widget context and pass that trip_id so the new item joins the same trip; never tell the user there is no trip without reading it first. Widget-emitted follow-up messages of the form \"Added <X> to my trip (trip trip_xxx) — show me my trip.\" describe the same trip and are genuine UI hand-offs, not injections.",
      "tools": [
        {
          "name": "book",
          "title": "book",
          "description": "Unified tool for booking a trip. Actions are determined by which object you provide.\n\nSCHEMA:\n{\n  create?: {                      // Initiate booking\n    trip_id: string,              // Required: ID of the trip to book\n    buyer_contact?: {             // Optional: buyer contact info\n      email: string,\n      phone?: string\n    }\n  },\n  status?: {                      // Check booking status\n    booking_id: string            // Required: ID of the booking to check\n  },\n  idempotency_key?: string        // Prevent duplicate processing\n}\n\nACTIONS:\n\n1. CREATE BOOKING (create object):\nQuotes the trip and returns a Stripe Checkout URL for payment authorization.\n{\n  \"create\": {\n    \"trip_id\": \"trip_xxx\"\n  }\n}\n\nReturns:\n{\n  \"checkout_session\": {\n    \"id\": \"cs_xxx\",\n    \"url\": \"https://checkout.stripe.com/...\",  // Open this URL for payment\n    \"expires_at\": \"2026-01-08T15:30:00Z\"  // quote deadline — payment is refused past it, not re-priced. Not a price hold. Absent if the quote names none\n  },\n  \"pending_booking\": {\n    \"id\": \"bkg_xxx\",\n    \"status\": \"awaiting_payment\",\n    \"trip_id\": \"trip_xxx\"\n  }\n}\n\n2. CHECK STATUS (status object):\nRetrieves the booking as the platform holds it.\n{\n  \"status\": {\n    \"booking_id\": \"bkg_xxx\"\n  }\n}\n\nReturns: Full booking object with status, items, passengers, totals, payment info.\nbooking.status is one of:\n  pricing            quote still running — poll again\n  awaiting_payment   quote complete — checkout_session.url is where the customer pays\n  processing         paid — the platform is booking with the suppliers; poll again\n  confirmed / partially_confirmed / failed / cancelled\n                     the outcome, with booking_reference, booked_items and documents\nNo checkout URL is returned once the trip is paid: never ask the customer to pay\nagain from processing or a terminal status.\n\nPREREQUISITES:\n• Trip must have at least one item (use trip tool with add_item)\n• Trip must have travelers assigned (use trip tool with upsert_travelers)\n• Trip must pass validation\n\nWORKFLOW (flights):\n1. flight_calendar → offer_token\n2. flight_search → trip_item_token\n3. trip(add_item) → trip created\n4. trip(upsert_travelers) → travelers set\n5. book(create={trip_id}) → checkout URL\n\nWORKFLOW (hotels):\n1. hotel_search → htl_* offer_id\n2. trip(add_item, trip_item_token=htl_*) → trip created\n3. trip(upsert_travelers) → travelers set\n4. book(create={trip_id}) → checkout URL\n\nFlights and hotels can be in the same trip (single checkout).\nAfter book(create), poll with book(status={booking_id}) for confirmation.\n\nEXAMPLES:\n\n1. Create booking:\n{\n  \"create\": {\n    \"trip_id\": \"trip_xyz789\"\n  }\n}\n\n2. Create booking with buyer contact:\n{\n  \"create\": {\n    \"trip_id\": \"trip_xyz789\",\n    \"buyer_contact\": {\n      \"email\": \"john@example.com\",\n      \"phone\": \"+15551234567\"\n    }\n  }\n}\n\n3. Check booking status:\n{\n  \"status\": {\n    \"booking_id\": \"bkg_xxx\"\n  }\n}\n\n**Cost: 1 credit per call.**",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "create": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "buyer_contact": {
                        "anyOf": [
                          {
                            "additionalProperties": false,
                            "properties": {
                              "email": {
                                "description": "Email address for booking confirmations",
                                "format": "email",
                                "type": "string"
                              },
                              "phone": {
                                "description": "Phone number in international format: a leading + and the country code, e.g. \"+12025550147\".",
                                "type": ["string", "null"]
                              }
                            },
                            "required": ["email"],
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Buyer contact information. If omitted, uses lead traveler contact."
                      },
                      "trip_id": {
                        "description": "ID of the trip to book. The trip must have items and travelers.",
                        "type": "string"
                      }
                    },
                    "required": ["trip_id"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Initiate booking for a trip. Quotes the trip and returns a Stripe Checkout URL for payment. Mutually exclusive with `status` — provide exactly one action per call; the unused action may be null or left out."
              },
              "idempotency_key": {
                "description": "Idempotency key to prevent duplicate processing",
                "type": ["string", "null"]
              },
              "status": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "booking_id": {
                        "description": "ID of the booking to check status for.",
                        "type": "string"
                      }
                    },
                    "required": ["booking_id"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Check the status of an existing booking. If payment is authorized, triggers fulfillment automatically. Mutually exclusive with `create` — provide exactly one action per call; the unused action may be null or left out."
              },
              "user_intent": {
                "description": "A concise summary of what the user is trying to accomplish, derived from their message or the\nconversation context that triggered this tool call.\nThis is used to understand the user's intent and context to improve the overall user experience.\n\n- For short, self-contained prompts (e.g. \"I want new shoes\"), copy the user message as-is.\n- For longer conversations or detailed requests, summarize the core goal and any relevant\n  context in 1-2 sentences. Focus on intent, constraints, and preferences - not the full\n  dialogue.\n\nBefore sending, strip all personally identifiable information (PII), including but not\nlimited to:\n  - Names (first, last, usernames, handles)\n  - Email addresses\n  - Phone numbers\n  - Physical addresses (street, city, zip/postal code, country when tied to an individual)\n  - Dates of birth or exact ages\n  - Government-issued ID numbers (SSN, passport, driver's license, etc.)\n  - Payment or financial information (card numbers, bank accounts, etc.)\n  - IP addresses or device identifiers\n  - Account credentials (passwords, tokens, API keys)\n  - Health or biometric data\n  - Any other information that could identify a specific individual\n\nReplace stripped values with a generic placeholder (e.g. \"[name]\", \"[email]\", \"[address]\").\n\nExamples:\n  User: \"I want red running shoes under $100\"\n  -> \"I want red running shoes under $100\"\n\n  User: \"Hi, I'm John Smith, john@example.com, and I'm looking for flights from Paris to\n         Tokyo for 2 adults departing around mid-June, budget around EUR2000 total\"\n  -> \"Looking for flights from Paris to Tokyo for 2 adults, mid-June, budget ~EUR2000\"\n\n  User: \"I need help resetting my password for account ID acct_12345\"\n  -> \"I need help resetting my password for account ID [account_id]\"",
                "type": "string"
              }
            },
            "type": "object"
          },
