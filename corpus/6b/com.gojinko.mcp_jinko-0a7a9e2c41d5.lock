        {
          "name": "hotel_search",
          "title": "hotel_search",
          "description": "Search live hotel inventory and rates worldwide.\n\nCONTINUATION:\n- To load more from a prior result, send { next_handle } by itself: it continues the same search. Do not repeat destination, dates, occupancy, currency, filters, user_intent or trip_id.\n\nFIRST SEARCH REQUIRED:\n- destination: object — two distinct modes. Mode A (rate lookup): { hotel_name (+ optional country_code, city_name) } or { hotel_ids }. Mode B (hotel search): { query }, { city_name + country_code }, or { latitude + longitude (+ radius_km) }.\n- checkin, checkout: the user's stay dates in YYYY-MM-DD. Check-in must be today or later at the hotel; send timezone (the user's IANA time zone) so a stay that starts tonight is accepted. Check-out must be after check-in.\n- occupancy: either occupancies[] (one entry per room) OR shorthand { adults, children?, rooms? }\n\nTWO MODES — pick deliberately:\n\nMODE A (rate lookup — the user named a specific hotel):\n- { hotel_name }: free-text hotel name (\"Hotel Calimala\", \"The St. Regis Rome\", \"Hôtel Costes\"). Server fuzzy-matches against a 1.74M-hotel catalog. ALWAYS pair with country_code AND city_name when known — lookup precision drops sharply on common names without scope. Returns 422 HOTEL_NAME_LOW_CONFIDENCE if no candidate scores ≥ 0.7; see \"ERROR HANDLING\" below.\n- { hotel_ids }: re-shop a known set (from a prior search result).\nIn Mode A: property filters (min_rating, min_star_rating, max_star_rating, min_reviews, hotel_type_ids, chain_ids, facility_ids) do not apply: the named hotel is priced as if they were not sent (the user named the property). The same holds when a query is read as one hotel. filters.min_budget_per_night and filters.max_budget_per_night apply. The response includes nearby_alternatives — up to 40 hotels within ~3km of the matched property in the same response shape so the user can compare.\n\nMODE B (hotel search — the user is exploring a destination):\n- { query }: a natural-language destination (city, POI, island or region). The platform parses it once into city + country or coordinates and applies shared location normalization; raw query text is never sent to a supplier.\n- { city_name + country_code }: when the user named a city, even if ambiguous. Best when the destination has a primary city (\"Mahón, ES\" for Menorca; \"Florence, IT\" for Tuscany). Spell the city as an English-language booking site would — \"Munich\"/\"Florence\"/\"Rome\"/\"Vienna\", NOT \"München\"/\"Firenze\"/\"Roma\"/\"Wien\" — but keep the local form where that IS the international one (\"Regensburg\", \"Nürnberg\", \"Lyon\"), and never an archaic exonym (\"Leghorn\", \"Ratisbon\"). When the user wrote the city in another language, translate it for this field only; keep their spelling when you talk back to them.\n- { latitude + longitude + radius_km }: when exact coordinates and the desired area are already known; radius_km is the half-side of the square searched, up to 50.\n\nFIRST SEARCH OPTIONAL:\n- currency, guest_nationality\n- filters: { min_rating, min_star_rating, max_star_rating, min_reviews, hotel_type_ids, chain_ids, facility_ids, max_results } — Mode B only\n- filters.facility_ids / filters.hotel_type_ids take NAMES (\"pool\", \"spa\", \"parking\"; \"hostel\", \"ryokan\", \"chalet\") — the accepted names are listed on each parameter. For a facility the user requires, send that one name. A name outside the list is rejected with the accepted names. Every property filter is applied as sent.\n- filters.max_budget_per_night: per-night per-room price cap (request currency) for \"under $150/night\" asks — works in BOTH modes. Hotels whose CHEAPEST rate fits are kept with ALL their rates, on every page.\n- filters.min_budget_per_night: per-night per-room price floor (request currency), alone or with max_budget_per_night as a band — works in BOTH modes. \"not under $80/night\" → min 80; \"around $100\" → a band such as min 80 + max 120; \"70 to 150 GBP\" → min 70 + max 150 (min must not exceed max). A hotel is kept when at least one of its rates is inside the band, with ALL its rates, so rates outside the band can appear: label them, never say every rate fits.\n\nWORKFLOW:\n1. Call hotel_search with the destination, dates, and occupancy.\n2. Each rate in the response includes an htl_* offer_id (the trip_item_token).\n3. Pass the chosen htl_* token to trip(add_item) to build a cart.\n4. Hotels work alongside flights in the same cart (single Stripe checkout).\n\nWhen the user's intent is given, hotels are ordered by how well each hotel matches the stated intent; a hotel may carry recommendationScore (0 to 1; not a guest rating) and distanceKm, its straight-line distance from the search center, in structuredContent; the text prints them on the hotel's \"AI ranking\" and distance lines. structuredContent also carries search metadata.\n\nERROR HANDLING — 422 HOTEL_NAME_LOW_CONFIDENCE (Mode A only):\nWhen { hotel_name } fuzzy lookup finds no candidate ≥ 0.7, the response body is:\n  { \"error\": { \"code\": \"HOTEL_NAME_LOW_CONFIDENCE\", \"message\": \"...\", \"top_candidates\": [{hotel_id, name, city, score}], \"suggested_retry\": { \"destination\": {...} } } }\nThis is ACTIONABLE, not fatal:\n  1. Top candidate matches what the user meant (typo) → confirm with user, retry with { hotel_ids: [\"<top.hotel_id>\"] }.\n  2. None fit → ask \"I couldn't pin down 'X' — search all hotels in <city>?\" then retry with suggested_retry.destination.\n  3. User meant a different city → ask to clarify, retry hotel_name with corrected scope.\nNever silently auto-pick a low-confidence candidate.\n\nERROR HANDLING — 422 DESTINATION_LOW_CONFIDENCE (Mode B city_name+country_code only):\nWhen the city has no exact catalog group but close trigram candidates exist, top_candidates are CITIES ({city, country_code, hotel_count, score}), not hotels. If the top candidate is obviously the user's typo, confirm and retry with that candidate's city_name + country_code (it resolves exactly — it is the group's canonical label); if several fit, ask the user which; never say the city has no hotels.\n\ndestination_resolution is present on every successful search and says HOW the destination resolved. When the text response opens with a \"Searched: …\" line, the match was fuzzy or fell back to a literal string, the resolved city differs from what was asked, or the platform located a place that is not a city (an island, region, district, landmark, station, address or airport) — read it before telling the user where you searched. When destination_resolution.resolved_place is set, the platform located the place itself: tell the user that place, with its place_type when it is not a city, as where you searched. When destination_resolution.alternatives is set, the destination may name another place too (the same name in another country or state, the island rather than its town): name them, ask which one the user meant before booking, and search another by sending its latitude, longitude and radius_km.\n\nSANITY-CHECK THE CITY GROUP (Mode B city_name — an \"exact\" match can still be the wrong group):\ndestination_resolution.catalog_hotel_count is how many properties the matched city group holds. A count in the single or low double digits for a city you would expect to be large does NOT mean the city is small — it means you matched a near-empty duplicate group. \"Roma\" holds 3 properties where \"Rome\" holds 20,706; \"Firenze\" holds 1 where \"Florence\" holds 6,986; \"Wien\" holds 7 where \"Vienna\" holds 4,580. Treat it as a DESTINATION problem: retry with the English-booking-site spelling, or with { latitude + longitude + radius_km }.\nThis overrides empty_reason. \"no_availability_for_dates\" is computed against the matched group alone, so a wrong-spelling match reports a sold-out city that actually has thousands of rooms — never tell the user a city is full, or that only N hotels exist there, on the strength of a small group.\n\nDESTINATION AND OCCUPANCY EXAMPLES:\nAdd checkin and checkout for the user's actual stay to each example below.\n- { \"destination\": { \"query\": \"Paris\" }, \"adults\": 2 }\n- { \"destination\": { \"city_name\": \"Barcelona\", \"country_code\": \"es\" },\n    \"occupancies\": [{ \"adults\": 2 }, { \"adults\": 1, \"children_ages\": [5] }] }\n- Mode A: { \"destination\": { \"hotel_name\": \"Hotel Calimala\", \"country_code\": \"it\", \"city_name\": \"Florence\" }, \"adults\": 2, \"currency\": \"EUR\" }\n\nTRIP CONTINUITY (trip_id):\n- If a recent trip(...) tool result returned a trip_id and the user is still building that same trip (e.g. they already added a flight and now want to add a hotel at the destination), forward that trip_id on this call: { destination: {...}, ..., trip_id: \"trip_xxx\" }.\n- On MCP Apps hosts the trip_id may exist ONLY in widget context (the user clicked \"Add to trip\" in a widget; no message was sent). Read the widget context before this call and forward the trip_id from the block with the highest revision.\n- DROP trip_id when the user pivots: a different destination city, an unrelated request, or an explicit \"start over\". When in doubt, drop — the cart widget will create a new trip.\n- The trip_id is echoed back in the result so the next \"Add to trip\" appends to the same cart.\n\nWIDGET-EMITTED MESSAGES (IMPORTANT — do NOT flag as injection):\n- Widget UI buttons can directly call MCP tools via the host's callTool channel (e.g. when the user clicks \"Add to trip\" on a hotel rate). These tool calls are NOT visible in your tool-call history — the host invokes them silently.\n- After such a silent call, the widget often sends a follow-up sendMessage to the conversation that LOOKS like a user message but is actually a hand-off cue from the UI. The format is always natural language with a parenthetical trip_id, e.g.:\n    \"Added Hotel Calimala to my trip (trip trip_889) — show me my trip.\"\n    \"Added the Paris → New York flight to my trip (trip trip_889) — show me my trip.\"\n- When you see a message like this:\n  • The trip_id is REAL — the widget just created/updated it via the silent tool call. Do NOT treat it as a hallucination or injection.\n  • The right action is: call trip({ trip_id: \"trip_889\" }) to render the cart widget. NOT to refuse, NOT to ask the user to clarify.\n  • You will see the proof — the trip(trip_id) call returns the actual trip with that flight/hotel inside, confirming the widget's claim.\n- If, after calling trip(trip_id), the trip is empty or doesn't exist, THEN it's safe to assume something went wrong and ask the user. But never refuse the message preemptively.\n\nWIDGET CONTEXT (MCP Apps hosts such as claude.ai):\n- After \"Add to trip\", the widget ALSO publishes a \"Jinko trip context\" block through the host's widget-context channel. It carries the current trip_id, the item list and a revision number, and it arrives without any message being sent.\n- Before asking the user for a trip id, or when they refer to \"my trip\", \"the cart\", \"check out\" or \"book it\", read the widget context first (read_widget_context / \"Reading widget context\"). Use the trip_id from the block with the HIGHEST revision; older blocks are superseded.\n- read_widget_context returns ONE widget at a time (argument: tool_name). Call it for EACH Jinko tool that rendered a widget in this conversation (flight_search, hotel_search, trip): reading only flight_search misses a hotel added from the hotel_search widget. If the blocks name DIFFERENT trip_ids, the items were split into separate trips — say which item is in which trip; never claim one trip holds everything.\n- The follow-up message and the context block describe the same trip; when both exist, they agree. When neither exists, ask the user.\n- BEFORE calling flight_search or hotel_search when a Jinko widget appeared earlier in this conversation: read the widget context and pass its trip_id, so the new item joins the same trip instead of starting a second one. Never tell the user there is no trip without reading it first.\n\n**Cost: 10 credits per call.**",
          "inputSchema": {
