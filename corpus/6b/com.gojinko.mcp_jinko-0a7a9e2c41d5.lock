        {
          "name": "find_destination",
          "title": "find_destination",
          "description": "Discover travel destinations when the user does NOT know where to go. This is a destination EXPLORATION tool.\n\nWHEN TO USE THIS TOOL (CRITICAL):\n- The user does NOT specify a destination: \"Where should I go?\", \"Best deals from NYC\"\n- The user wants inspiration based on criteria: \"Beach destinations\", \"Somewhere warm\", \"Cheap flights from SF\"\n- The user wants to compare multiple destination options from their origin\n- The user previously asked for destination recommendations and wants pricing for those options\n\nWHEN NOT TO USE THIS TOOL — USE flight_calendar INSTEAD:\n- The user specifies BOTH an origin AND a destination → use flight_calendar\n- Examples that should use flight_calendar, NOT this tool:\n  • \"Flights from Paris to Barcelona\" → flight_calendar\n  • \"Find me a flight from JFK to CDG\" → flight_calendar\n  • \"Cheapest flight from LA to Miami in June\" → flight_calendar\n  • \"Paris to BCN for a weekend in April\" → flight_calendar\n  • \"What are the cheapest dates to go to NYC from Paris?\" → flight_calendar\n- If the user names a specific city/airport as destination, that means they KNOW where to go → flight_calendar\n\nIMPORTANT - DATES:\n  All dates in query parameters (departure_dates, departure_date_ranges, return_dates, return_date_ranges) MUST be in the future. Never use past dates.\n  Please fill as much as possible search parameters based on user intent to get best results.\n\nIMPORTANT - RE-CALL THIS TOOL when the user:\n- Asks for a different type of destination (beach, city trip, ski, etc.)\n- Asks for different dates while still exploring\n- The user is already in fullscreen mode in the widget\n\nCORE FUNCTIONALITY:\n- REQUIRED: User's origin location (LLM identifies ALL nearby airports)\n- OPTIONAL: Destination filtering by specific airports/cities OR omit for global discovery mode\n- Destination Discovery Mode: When destinations is omitted/empty, searches ALL destinations globally\n- Flexible dates and stay durations for exploring options\n- Filter by budget, direct flights preference, and locale\n- By default, please search roundtrip flights unless user specifies one-way\n\nAIRPORT IDENTIFICATION - CRITICAL:\nLLM MUST identify and recommend ALL relevant airports for user's origin location:\n- \"New York\": [\"JFK\", \"LGA\", \"EWR\"]\n- \"London\": [\"LHR\", \"LGW\", \"STN\", \"LTN\", \"LCY\"]\n- \"Paris\": [\"CDG\", \"ORY\"]\n- \"Tokyo\": [\"NRT\", \"HND\"]\n- \"Chicago\": [\"ORD\", \"MDW\"]\n- \"Los Angeles\": [\"LAX\"]\n- \"San Francisco\": [\"SFO\"]\n\nDESTINATION FILTERING - INTELLIGENT INTERPRETATION:\nDestinations can be specified using IATA airport codes OR city codes (3 letters). You can mix both types:\n- Airport codes: [\"JFK\", \"CDG\", \"LHR\"] - searches specific airports\n- City codes: [\"NYC\", \"LON\", \"PAR\"] - searches all airports in those cities\n- A code a city shares with its main airport (LAX, MIA, LAS) is read as the CITY: every airport of it\n\nDESTINATION LIST - CRITICAL:\nWhen users mention criteria that imply a type of destination, the LLM MUST generate the appropriate list:\n- \"Sunny places in winter\": [\"MIA\",\"MCO\",\"SAN\",\"PHX\",\"HNL\",\"CUN\",\"PUJ\",\"PTY\",\"LIM\",\"GIG\"]\n- \"Somewhere in Asia\": [\"NRT\",\"HND\",\"ICN\",\"PVG\",\"PEK\",\"HKG\",\"SIN\",\"BKK\",\"KUL\",\"MNL\"]\n- \"Beach destinations\": [\"MIA\",\"SAN\",\"HNL\",\"CUN\",\"PUJ\",\"SJU\",\"NAS\",\"MBJ\"]\n- \"European capitals\": [\"LHR\",\"CDG\",\"FRA\",\"MAD\",\"FCO\",\"AMS\",\"BRU\",\"VIE\",\"PRG\",\"CPH\"]\n\nIf no filtering is specified (\"anywhere\", \"surprise me\"), leave destinations empty for global discovery.\n\nTYPICAL USE CASES:\n1. \"Where should I travel from NYC next month?\" → origins: [\"JFK\",\"LGA\",\"EWR\"], destinations: []\n2. \"I want to go somewhere warm from Chicago for a week in December\" → origins: [\"ORD\",\"MDW\"], destinations: [warm destinations]\n3. \"Best weekend getaways from Boston?\" → origins: [\"BOS\"], destinations: []\n4. \"Beach vacation from Seattle in summer under $600\" → origins: [\"SEA\"], destinations: [beach destinations]\n\nIMPORTANT: Always provide ALL airports for origins to maximize search results.\n\nEvery price this tool returns is one adult's cached fare; the tool takes no party. To price the whole party, price-check the offer using flight_search with price_check and the travellers' counts in traveler_counts.\n\n**Cost: 1 credit per call.**",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cabin_class": {
                "anyOf": [
                  {
                    "enum": ["economy", "premium_economy", "business", "first"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Preferred cabin class. Options: \"economy\", \"premium_economy\", \"business\", or \"first\". Filters results accordingly."
              },
              "currency": {
                "description": "ISO 4217 currency code for displaying prices (e.g. \"EUR\", \"USD\", \"GBP\"). Infer from the user's country or locale. If the user mentions a specific currency, use that.",
                "type": "string"
              },
              "departure_date_ranges": {
                "description": "List of departure date ranges for flexible travel discovery. Use when the user mentions periods like “next month” or “spring.” Supports multiple non-contiguous ranges (OR logic). Example: [{start: \"2025-12-10\", end: \"2025-12-15\"}, {start: \"2025-12-20\", end: \"2025-12-25\"}].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "end": {
                      "description": "Range end date (YYYY-MM-DD)",
                      "type": "string"
                    },
                    "start": {
                      "description": "Range start date (YYYY-MM-DD)",
                      "type": "string"
                    }
                  },
                  "required": ["end", "start"],
                  "type": "object"
                },
                "type": "array"
              },
              "departure_dates": {
                "description": "List of specific departure dates in ISO 8601 format (YYYY-MM-DD). Use for searching multiple specific dates with OR logic. Example: [\"2025-12-15\", \"2025-12-16\", \"2025-12-17\"] for flexible date searches. Useful when user wants to check specific dates like weekends.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "destinations": {
                "description": "OPTIONAL. Array of destination IATA codes (3-letter uppercase), representing either airports or cities. When a city code is provided, the LLM MUST expand it to include all associated airports. Examples: [\"LHR\", \"LGW\", \"STN\", \"LTN\", \"LCY\"] for London airports; [\"CDG\", \"ORY\"] for Paris; [\"TYO\"] for all Tokyo airports. You may mix airport and city codes: [\"JFK\", \"CDG\", \"LON\", \"PAR\"]. A code that names a multi-airport city (NYC, LON, PAR — and LAX, MIA, LAS, which a city shares with its main airport) covers every airport of that city; any other code is that one airport. When omitted or empty, the system searches globally to discover the best flight deals (destination discovery mode).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "direct_only": {
                "description": "When true, only returns nonstop (direct) flights. Useful for avoiding layovers or minimizing total travel time.",
                "type": "boolean"
              },
              "locale": {
                "description": "User's BCP 47 locale inferred from the conversation (e.g. \"fr-FR\", \"en-US\", \"ja-JP\"). Used for formatting dates, numbers, and selecting currency. Infer from the user's language and location context.",
                "type": "string"
              },
              "max_price": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Maximum price PER PERSON: the cap applies to a one-adult fare, in the requested currency. For a whole-party budget, divide it by the number of ADULTS only and treat the result as a loose pre-filter: children and lap infants usually cost less than an adult, so dividing by every traveller would exclude affordable trips. Send a per-person budget as-is. The exact whole-trip budget check is flight_search with max_price."
              },
              "origins": {
                "description": "REQUIRED. Array of origin IATA codes (3-letter uppercase), representing either airports or cities where the trip starts. The LLM MUST detect and include all relevant nearby airports or city codes based on the user’s location. Examples: [\"JFK\", \"LGA\", \"EWR\"] for New York City; [\"SFO\", \"OAK\", \"SJC\"] for the San Francisco Bay Area; [\"ORD\", \"MDW\"] for Chicago; or a single city code like [\"NYC\"]. A code that names a multi-airport city (NYC, LON, PAR — and LAX, MIA, LAS, which a city shares with its main airport) covers every airport of that city; any other code is that one airport.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "return_date_ranges": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "end": {
                          "description": "Range end date (YYYY-MM-DD)",
                          "type": "string"
                        },
                        "start": {
                          "description": "Range start date (YYYY-MM-DD)",
                          "type": "string"
                        }
                      },
                      "required": ["end", "start"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "List of return date ranges for flexible round-trip searches. Supports multiple return windows. Example: [{start: \"2025-12-22\", end: \"2025-12-25\"}, {start: \"2025-12-29\", end: \"2026-01-02\"}]."
              },
              "return_dates": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "List of specific return dates for round-trip searches (YYYY-MM-DD). Must be after the corresponding departure dates. Supports multiple options (OR logic). Example: [\"2025-12-22\", \"2025-12-23\", \"2025-12-24\"]."
              },
              "sort_by": {
                "description": "Sort order. \"lowest\" (cheapest first) is the only order today; omit it for the same.",
                "enum": ["lowest"],
                "type": "string"
              },
              "stay_days": {
                "anyOf": [
                  {
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Exact number of days to stay at the destination. Used with a departure date to automatically compute the return date. Example: 7 = one-week trip; 3 = weekend getaway."
              },
              "stay_days_range": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "max": {
                        "description": "Maximum stay duration in days",
                        "maximum": 365,
                        "type": "integer"
                      },
                      "min": {
                        "description": "Minimum stay duration in days",
                        "minimum": 1,
                        "type": "integer"
                      }
                    },
                    "required": ["max", "min"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Range of acceptable trip durations for flexible planning (e.g., “5 to 10 days”). Cannot be combined with stay_days or explicit return_date. Example: {min: 5, max: 10}."
              },
              "trip_type": {
                "description": "REQUIRED. Type of trip: \"oneway\" for single-leg flights, or \"roundtrip\" for return flights.",
                "enum": ["oneway", "roundtrip"],
                "type": "string"
              },
              "user_intent": {
                "description": "A concise summary of what the user is trying to accomplish, derived from their message or the\nconversation context that triggered this tool call.\nThis is used to understand the user's intent and context to improve the overall user experience.\n\n- For short, self-contained prompts (e.g. \"I want new shoes\"), copy the user message as-is.\n- For longer conversations or detailed requests, summarize the core goal and any relevant\n  context in 1-2 sentences. Focus on intent, constraints, and preferences - not the full\n  dialogue.\n\nBefore sending, strip all personally identifiable information (PII), including but not\nlimited to:\n  - Names (first, last, usernames, handles)\n  - Email addresses\n  - Phone numbers\n  - Physical addresses (street, city, zip/postal code, country when tied to an individual)\n  - Dates of birth or exact ages\n  - Government-issued ID numbers (SSN, passport, driver's license, etc.)\n  - Payment or financial information (card numbers, bank accounts, etc.)\n  - IP addresses or device identifiers\n  - Account credentials (passwords, tokens, API keys)\n  - Health or biometric data\n  - Any other information that could identify a specific individual\n\nReplace stripped values with a generic placeholder (e.g. \"[name]\", \"[email]\", \"[address]\").\n\nExamples:\n  User: \"I want red running shoes under $100\"\n  -> \"I want red running shoes under $100\"\n\n  User: \"Hi, I'm John Smith, john@example.com, and I'm looking for flights from Paris to\n         Tokyo for 2 adults departing around mid-June, budget around EUR2000 total\"\n  -> \"Looking for flights from Paris to Tokyo for 2 adults, mid-June, budget ~EUR2000\"\n\n  User: \"I need help resetting my password for account ID acct_12345\"\n  -> \"I need help resetting my password for account ID [account_id]\"",
                "type": "string"
              }
            },
            "required": ["origins", "trip_type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "availableAirlines": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "destinations": {
