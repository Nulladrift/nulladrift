          "title": "hotel_details",
          "description": "Rich metadata for one hotel. Pass the hotel_ref from hotel_search when available, exactly as returned; hotel_id remains a legacy fallback.\n\n**Cost: 1 credit per call.**",
          "inputSchema": {
