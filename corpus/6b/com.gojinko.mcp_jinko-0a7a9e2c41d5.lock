                        "description": "Restrict connections to these IATA airport codes. Nonstop itineraries still pass. Example: [\"CDG\",\"AMS\"]. Every connection in a returned itinerary is at a listed airport; sources search at most 9 per leg. Must not overlap exclude_via_airports.",
