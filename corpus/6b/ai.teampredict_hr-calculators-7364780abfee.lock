        {
          "name": "us_paycheck_take_home",
          "title": "US paycheck take-home pay",
          "description": "Calculate US take-home (net) pay from a salary or an hourly wage for 2026, after federal income tax (from the Form W-4), Social Security, Medicare and the state's own income tax and payroll contributions, in any of the 50 states or DC. Use it for 'how much will I take home on $X in <state>?', for comparing states, or to price an offer; it also returns the full-year totals and what the employer pays on top. Use us_bonus_tax instead for tax withheld from a bonus, overtime_pay for the extra pay for overtime hours before tax, and hourly_to_salary for converting pay between hour, week, month and year without tax. Assumes the 2026 federal withholding method and the state's published employer withholding formula, one job, and a W-4 filed in the standard way.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annual_salary_usd": {
                "description": "Yearly gross salary in US dollars. Required when pay_type is salary. For example 60000.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "filing_status": {
                "default": "single",
                "description": "Filing status on the federal Form W-4, step 1(c): single (or married filing separately), married (filing jointly) or head (head of household). Default single.",
                "enum": ["single", "married", "head"],
                "type": "string"
              },
              "health_premiums_usd_per_paycheck": {
                "default": 0,
                "description": "Pre-tax health, dental and vision premiums per paycheck, in US dollars. Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "hourly_rate_usd": {
                "description": "Hourly wage in US dollars. Required when pay_type is hourly. For example 25.",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "hsa_usd_per_paycheck": {
                "default": 0,
                "description": "Pre-tax HSA contribution through payroll per paycheck, in US dollars (capped at the 2026 family limit). Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "local_tax": {
                "description": "Id of a city or county income tax to include (for example 'nyc' or 'yonkers' for New York). Leave out for none; an unknown id returns the ids that state accepts.",
                "maxLength": 40,
                "type": "string"
              },
              "overtime_hours_per_week": {
                "default": 0,
                "description": "Overtime hours per week paid at time and a half, hourly pay only. Default 0.",
                "maximum": 168,
                "minimum": 0,
                "type": "number"
              },
