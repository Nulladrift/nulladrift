                "maximum": 8784,
                "minimum": 1,
                "type": "number"
              },
              "pay_frequency": {
                "default": "biweekly",
                "description": "How often accrual is credited: weekly (52 a year), biweekly (26), semimonthly (24) or monthly (12). Default biweekly.",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly"],
                "type": "string"
