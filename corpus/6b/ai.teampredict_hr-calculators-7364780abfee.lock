        {
          "name": "add_to_date",
          "title": "Add or subtract time from a date",
          "description": "Add or subtract years, months, weeks and days to or from a calendar date and get the resulting date with its weekday, ISO week and day of the year. Use it for 'what is the date 90 days from today?', contract end dates, probation periods and anniversaries. Years and months move by the calendar first (Jan 31 plus one month is the last day of February), then weeks and days. Use add_business_days to skip weekends and holidays and days_between_dates to measure the gap between two dates. Valid for years 2000 to 2100.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 0,
                "description": "Days to move, 0 to 37,000. Default 0.",
                "maximum": 37000,
                "minimum": 0,
                "type": "integer"
              },
              "direction": {
                "default": "add",
                "description": "add to move forward, subtract to move back. Default add.",
                "enum": ["add", "subtract"],
                "type": "string"
              },
              "months": {
                "default": 0,
                "description": "Months to move, 0 to 1,200. Default 0.",
                "maximum": 1200,
                "minimum": 0,
                "type": "integer"
              },
              "start_date": {
                "description": "The date to start from as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "weeks": {
                "default": 0,
                "description": "Weeks to move, 0 to 5,300. Default 0.",
                "maximum": 5300,
                "minimum": 0,
                "type": "integer"
              },
              "years": {
                "default": 0,
                "description": "Years to move, 0 to 100. Default 0.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["start_date"],
            "type": "object"
          },
          "outputSchema": {
