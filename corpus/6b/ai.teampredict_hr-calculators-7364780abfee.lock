        {
          "name": "business_days_between",
          "title": "Business days between two dates",
          "description": "Count the business days (Monday to Friday, optionally skipping US federal holidays) between two dates. Use it for working-day questions such as notice periods, delivery windows, payroll runs and project lead times. Use add_business_days instead to find the date that is N business days from a start date, and days_between_dates for plain calendar days. Holidays are the 11 US federal holidays with their observed dates when one falls on a weekend; company and state holidays are not included. Valid for years 2000 to 2100.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "end_date": {
                "description": "The second date; if it is before start_date the two are swapped as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_end_date": {
                "default": true,
                "description": "Whether the end date itself is counted when it is a business day. Default true.",
                "type": "boolean"
              },
              "skip_us_federal_holidays": {
                "default": true,
                "description": "Whether US federal holidays are left out of the business-day count. Default true.",
                "type": "boolean"
              },
              "start_date": {
                "description": "The first date as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["end_date", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calculator_url": {
