      },
      "instructions": "Free HR, payroll and date calculators from TeamPredict. No account or API key is needed. Each tool runs the same formula as the matching page at teampredict.ai/tools, returns the computed numbers and a plain-English summary, and links to that page so a person can change the inputs. Pay figures follow 2026 US rules. Dates are YYYY-MM-DD and times are 24-hour HH:MM.",
      "tools": [
        {
          "name": "add_business_days",
          "title": "Add or subtract business days",
          "description": "Find the date that is a given number of business days after (or before) a start date, skipping weekends and optionally US federal holidays. Use it to answer 'what is the due date 10 business days from now?', delivery dates, response deadlines and notice periods. Use business_days_between instead to count the working days between two known dates, and add_to_date to move by calendar years, months, weeks or days. The start date itself is not counted; day 1 is the next business day. Holidays are the 11 US federal holidays with observed dates. Valid for years 2000 to 2100.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_days": {
                "description": "How many business days to move, a whole number from 0 to 10,000.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "direction": {
                "default": "add",
                "description": "add to move forward in time, subtract to move back. Default add.",
                "enum": ["add", "subtract"],
                "type": "string"
              },
              "skip_us_federal_holidays": {
                "default": true,
                "description": "Whether US federal holidays are skipped as well as weekends. Default true.",
                "type": "boolean"
              },
              "start_date": {
                "description": "The date to count from as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["business_days", "start_date"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calculator_url": {
                "description": "The TeamPredict calculator page that shows the same calculation, where a person can change the inputs.",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": {},
                "description": "The inputs as used, with defaults filled in.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "results": {
                "additionalProperties": {},
                "description": "The computed numbers. Unavailable numbers are null.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "summary": {
                "description": "One or two plain sentences with the headline numbers.",
                "type": "string"
              }
            },
            "required": ["calculator_url", "inputs", "results", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Add or subtract business days"
          },
          "behavior": {
