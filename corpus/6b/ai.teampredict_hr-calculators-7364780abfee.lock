          },
          "digest": "sha256:ab964f8b1cc67f8464aee21e128123f59f4b5ad025e0dce4c70d0c3da28950da"
        },
        {
          "name": "add_time_to_datetime",
          "title": "Add or subtract days, hours and minutes from a date-time",
          "description": "Move a date and clock time forward or back by days, hours and minutes in a US time zone and get the resulting date and time. Days move the calendar date and keep the clock time (the way a phone calendar does); hours and minutes are counted as they really pass, so a daylight saving change inside the span is handled. Use time_duration_between instead to measure the gap between two known date-times, add_to_date for calendar years, months and weeks, and convert_time_zone to show a moment in other zones.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 0,
                "description": "Days to move. Default 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "direction": {
                "default": "add",
                "description": "add to move forward, subtract to move back. Default add.",
                "enum": ["add", "subtract"],
                "type": "string"
              },
              "hours": {
                "default": 0,
                "description": "Hours to move. Default 0.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "minutes": {
                "default": 0,
                "description": "Minutes to move. Default 0.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "integer"
              },
              "start_date": {
                "description": "The date to start from as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "start_time": {
                "description": "The time to start from as a 24-hour clock time in the form HH:MM, for example 22:30.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "time_zone": {
                "default": "America/New_York",
                "description": "The time zone the clock times are read in, so a span across a daylight saving change counts the hour that really passes. Use 'none' for plain 24-hour days with no zone. Default America/New_York.",
                "enum": ["none", "America/New_York", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu", "America/Puerto_Rico", "UTC"],
                "type": "string"
              }
            },
            "required": ["start_date", "start_time"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calculator_url": {
                "description": "The TeamPredict calculator page that shows the same calculation, where a person can change the inputs.",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": {},
                "description": "The inputs as used, with defaults filled in.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "results": {
                "additionalProperties": {},
                "description": "The computed numbers. Unavailable numbers are null.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "summary": {
                "description": "One or two plain sentences with the headline numbers.",
                "type": "string"
              }
            },
            "required": ["calculator_url", "inputs", "results", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
