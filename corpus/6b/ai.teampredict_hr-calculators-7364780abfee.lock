        {
          "name": "us_bonus_tax",
          "title": "US bonus tax withholding",
          "description": "Calculate how much tax is withheld from a US bonus in 2026 and what is left: federal income tax (the 22% flat rate or the combined method, 37% above $1 million), Social Security, Medicare, and the state's own bonus withholding rule, for all 50 states and DC. Use it for 'how much of my $X bonus will I keep in <state>?'. Withholding is not the final tax: the bonus is taxed at your normal rate on your return. Use us_paycheck_take_home instead for regular pay, and salary_increase for a raise. When the bonus is paid on its own it also returns the result under the other federal method so the two can be compared.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "annual_salary_usd": {
                "description": "Regular yearly salary in US dollars, before the bonus. For example 75000.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "bonus_paid": {
                "default": "separately",
                "description": "Whether the employer pays the bonus as a separate payment (the usual case) or adds it to a regular paycheck. Default separately.",
                "enum": ["separately", "with_regular_paycheck"],
                "type": "string"
              },
              "bonus_usd": {
                "description": "Gross bonus in US dollars. For example 5000.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "earlier_supplemental_pay_usd": {
                "default": 0,
                "description": "Bonuses and other supplemental pay already paid this calendar year, before this one, in US dollars. Total supplemental pay above $1 million in a year is withheld at 37%. Default 0.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "federal_method": {
                "default": "flat_22_percent",
                "description": "How the employer withholds federal income tax on a bonus paid separately: the flat 22% rate (the common choice) or the combined (aggregate) method. Ignored when the bonus is paid with a regular paycheck. Default flat_22_percent.",
                "enum": ["flat_22_percent", "combined"],
                "type": "string"
              },
              "filing_status": {
                "default": "single",
                "description": "Filing status on the federal Form W-4, step 1(c): single (or married filing separately), married (filing jointly) or head (head of household). Default single.",
                "enum": ["single", "married", "head"],
                "type": "string"
              },
              "pay_frequency": {
                "default": "biweekly",
                "description": "How often the employee is paid: weekly (52 paychecks a year), biweekly (26), semimonthly (24, twice a month) or monthly (12). Default biweekly.",
                "enum": ["weekly", "biweekly", "semimonthly", "monthly"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter postal code of the state where the employee works and lives: all 50 states and DC (for example CA, NY, TX, DC).",
