        {
          "name": "time_duration_between",
          "title": "Time duration between two date-times",
          "description": "Work out how much time passes between a start and an end date and time, in days, hours and minutes, accounting for daylight saving changes in the chosen US time zone. Use it for shift lengths that cross midnight, elapsed time on a ticket, on-call windows and billing time. Use days_between_dates for whole calendar days, add_time_to_datetime to move a date-time forward or back by a known amount, and military_shift_hours for a shift written in 24-hour times only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "end_date": {
                "description": "The end date as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "end_time": {
                "description": "The end time as a 24-hour clock time in the form HH:MM, for example 22:30.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "start_date": {
                "description": "The start date as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "start_time": {
                "description": "The start time as a 24-hour clock time in the form HH:MM, for example 22:30.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "time_zone": {
                "default": "America/New_York",
                "description": "The time zone the clock times are read in, so a span across a daylight saving change counts the hour that really passes. Use 'none' for plain 24-hour days with no zone. Default America/New_York.",
                "enum": ["none", "America/New_York", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu", "America/Puerto_Rico", "UTC"],
                "type": "string"
              }
            },
            "required": ["end_date", "end_time", "start_date", "start_time"],
            "type": "object"
