        {
          "name": "convert_time_zone",
          "title": "Time zone converter",
          "description": "Convert one date and clock time from a source time zone to other time zones, with daylight saving applied for that date, and find the stretch of the day when it is 9 AM to 5 PM in every zone at once. Use it to schedule across offices, pick a meeting time for a distributed team, or answer 'what is 3 PM Eastern in London?'. Supports 24 zones (US zones, UTC and major world zones); the valid zone ids are listed in the schema. Use time_duration_between for the length of time between two moments.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "The date in the source time zone as a calendar date in the form YYYY-MM-DD, for example 2026-11-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from_time_zone": {
                "default": "America/New_York",
                "description": "IANA id of the source time zone. Default America/New_York.",
                "enum": ["America/New_York", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu", "America/Puerto_Rico", "UTC", "Europe/London", "Europe/Dublin", "Europe/Paris", "Europe/Athens", "Africa/Lagos", "Asia/Dubai", "Asia/Kolkata", "Asia/Manila", "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney", "America/Mexico_City", "America/Toronto", "America/Bogota", "America/Sao_Paulo"],
                "type": "string"
              },
              "time": {
                "description": "The clock time in the source time zone as a 24-hour clock time in the form HH:MM, for example 22:30.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "to_time_zones": {
                "description": "IANA ids of the zones to convert to, between 1 and 12 (for example [\"America/Los_Angeles\",\"Europe/London\",\"Asia/Kolkata\"]).",
                "items": {
                  "enum": ["America/New_York", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles", "America/Anchorage", "Pacific/Honolulu", "America/Puerto_Rico", "UTC", "Europe/London", "Europe/Dublin", "Europe/Paris", "Europe/Athens", "Africa/Lagos", "Asia/Dubai", "Asia/Kolkata", "Asia/Manila", "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney", "America/Mexico_City", "America/Toronto", "America/Bogota", "America/Sao_Paulo"],
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["date", "time", "to_time_zones"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calculator_url": {
                "description": "The TeamPredict calculator page that shows the same calculation, where a person can change the inputs.",
                "type": "string"
              },
