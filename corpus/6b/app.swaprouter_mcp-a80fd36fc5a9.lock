{
  "lockfileVersion": 2,
  "subjects": {
    "app.swaprouter/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://swaprouter.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "swaprouter",
        "title": "SwapRouter",
        "version": "1.0.0",
        "websiteUrl": "https://swaprouter.app"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SwapRouter finds the best non-custodial swap route between coins (Monero by default) and books it. Use quote first, then swap with the user's own recipient and refund addresses. Booking only creates a deposit address: always show the user the address, exact amount and any memo, and the tracking link. Use status to follow a swap.",
      "tools": [
        {
          "name": "quote",
          "title": "Quote a swap",
          "description": "Best routes right now to swap an amount of one coin into another, across exchanges, bridges and DEXs. Each route lists its steps, providers, KYC risk, rough time and what the user receives after fees. Non-custodial: the user sends to the provider, which pays them directly. If an asset is ambiguous, the result lists candidates to pick from. Quotes last about 10 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount to send, in whole coins as a decimal string, like \"1000\". With exactOut, the amount to receive.",
                "type": "string"
              },
              "exactOut": {
                "description": "For payments: true when the recipient must get exactly `amount` of `to`. Routes are fixed-rate, one step, and ranked by the least to send.",
                "type": "boolean"
              },
              "from": {
                "description": "Coin to send. An asset id like \"base:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913\" or \"monero:native\", or a symbol with an optional chain: \"XMR\", \"USDC on Base\", \"ETH on Arbitrum\".",
                "type": "string"
              },
              "to": {
                "description": "Coin to receive. An asset id like \"base:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913\" or \"monero:native\", or a symbol with an optional chain: \"XMR\", \"USDC on Base\", \"ETH on Arbitrum\".",
                "type": "string"
              }
            },
            "required": ["amount", "from", "to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Quote a swap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://swaprouter/route-card.html"
            }
          },
          "digest": "sha256:600fdea6b1cefdda518f37256406d8b27b5e22dac5846b4c69e596f33934ac2e"
        },
        {
          "name": "status",
          "title": "Swap status",
          "description": "Current state of a booked swap and each of its steps. Needs the id and secret from the swap tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Swap id.",
                "type": "string"
              },
              "secret": {
                "description": "Swap secret, from the swap tool or the tracking link.",
                "type": "string"
              }
            },
            "required": ["id", "secret"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Swap status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://swaprouter/route-card.html"
            }
          },
          "digest": "sha256:886c7374e19e879b2302ea8d4c90083279bfd608739c6dac9d152aca29cab53f"
        },
        {
          "name": "swap",
          "title": "Book a swap",
          "description": "Books a swap and returns a deposit address, the exact amount to send, a memo if any, an expiry, a QR code and a tracking link. Nothing happens until the user sends the deposit from their own wallet; no funds move by calling this. You must show the user the deposit address and the exact amount (and memo, if any), and give them the tracking link. Pass routeId from a recent quote, or from, to and amount to book the best route. Routes that need a wallet signature return only a link to finish on the website, with no booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Without routeId: amount to send, in whole coins, like \"1000\". With exactOut, the amount to receive.",
                "type": "string"
              },
              "exactOut": {
                "description": "Without routeId: the recipient gets exactly `amount` (a payment).",
                "type": "boolean"
              },
              "from": {
                "description": "Without routeId: coin to send. An asset id like \"base:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913\" or \"monero:native\", or a symbol with an optional chain: \"XMR\", \"USDC on Base\", \"ETH on Arbitrum\".",
                "type": "string"
              },
              "recipient": {
                "description": "The user's own address for the received coin.",
                "type": "string"
              },
              "refundAddress": {
                "description": "The user's own address on the sending chain, for a refund if the swap can't finish. Not needed on FixedFloat and CCE Cash routes (refunds through their support).",
                "type": "string"
              },
              "routeId": {
                "description": "A route id from a quote in the last 10 minutes.",
                "type": "string"
              },
              "to": {
                "description": "Without routeId: coin to receive. An asset id like \"base:0x833589fcd6edb6e08f4c7c32d4f71b54bda02913\" or \"monero:native\", or a symbol with an optional chain: \"XMR\", \"USDC on Base\", \"ETH on Arbitrum\".",
                "type": "string"
              }
            },
            "required": ["recipient"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a swap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://swaprouter/route-card.html"
            }
          },
          "digest": "sha256:fd4c496f427a8be5c5f491cc273080351af95ca53c7bb930a43807065735c54b"
        }
      ],
      "resources": [
        {
          "uri": "ui://swaprouter/route-card.html",
          "name": "route-card",
          "title": "Swap route card",
          "description": "Shows a quote, a booked swap with its deposit QR, or its status.",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:459d218907a7b22c6908fafdbb94febff20b54a79975c4b751268c0ae22b9314"
        }
      ],
      "digest": "sha256:88e9faf0d34cf3f11c87a21eceea5ca592447a31239523bd5af7ff3f1a2c0ce1"
    }
  }
}
