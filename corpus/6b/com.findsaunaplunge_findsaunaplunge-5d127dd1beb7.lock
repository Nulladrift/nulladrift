{
  "lockfileVersion": 2,
  "subjects": {
    "com.findsaunaplunge/findsaunaplunge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://findsaunaplunge.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "findsaunaplunge",
        "title": "FindSaunaPlunge — US cold plunge & sauna studios, checked and dated",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FindSaunaPlunge lists cold plunge, sauna, and contrast-therapy studios in the United States, with details read from each studio's own published pages and the date they were checked.\n\nData rules you can rely on:\n- Every venue carries lastVerified — the date its details were last checked — and a status: \"verified\" means every published fact was cross-checked against multiple current public sources in agreement (the studio's own site plus its live booking pages or other public channels); \"community\"/\"brand_import\" mean checked against the studio's own published details. Nobody contacts studios; every check is against published pages. Surface both fields when citing a fact.\n- An absent field means \"not published / unknown\", never zero. We do not guess temperatures or prices.\n- Venue ids are stable and never reassigned.\n\nUse search_venues for discovery, get_venue for one venue's full record, list_cities to see coverage, get_city_stats for per-city aggregates (medians always carry their denominator), and get_data_freshness for check-date coverage. Corrections: submit@findsaunaplunge.com.",
      "tools": [
        {
          "name": "get_city_stats",
          "title": "Get city statistics",
          "description": "Aggregate figures for one covered city: venue count, modality and access breakdowns, contrast-capable count, and median published prices and plunge temperature. Every median carries its denominator (n) — absent fields are excluded, never treated as zero.",
          "inputSchema": {
            "properties": {
              "citySlug": {
                "description": "City slug, e.g. \"dallas-tx\". Use list_cities to discover.",
                "type": "string"
              }
            },
            "required": ["citySlug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b567215fa366c08997172c87f9dab9403d8ed38e4e5719460b12d85b461eabff"
        },
        {
          "name": "get_data_freshness",
          "title": "Get dataset freshness",
          "description": "When the dataset was generated and how recently venues were checked: oldest and newest lastVerified dates, counts by age bucket, and the newest check date per city.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb80c5458b6ee268a3157703e1826b9aab3b8f3f14f1b4add76351d141f5b9e0"
        },
        {
          "name": "get_venue",
          "title": "Get one venue",
          "description": "Fetch the full record for one venue by its stable id.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Venue id, e.g. \"alive-and-well-dallas-tx\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:054ab290b440a3b8840e4c6db55a38bf2f57b6fc71377befa7fd95ed76b50a79"
        },
        {
          "name": "list_cities",
          "title": "List covered cities",
          "description": "Cities with live venues, with counts and available modalities.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d5809c155d7010e6fbc8b597ee7da81cabf49a0142cf56ac427d013080118356"
        },
        {
          "name": "search_venues",
          "title": "Search venues",
          "description": "Search cold plunge / sauna venues. All filters are optional and AND-combined. Absent fields in results mean \"not published\", never zero.",
          "inputSchema": {
            "properties": {
              "access": {
                "description": "private_suite = your own room; communal = shared areas; mixed matches either request. Venues that do not publish their access model are excluded whenever this filter is used — absence of the fact is not a match.",
                "enum": ["private_suite", "communal", "mixed"],
                "type": "string"
              },
              "citySlug": {
                "description": "City slug, e.g. \"dallas-tx\". Use list_cities to discover.",
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 10, cap 25.",
                "type": "number"
              },
              "maxDropInUsd": {
                "description": "Only venues with a PUBLISHED drop-in price at or below this. Excludes venues with no published price.",
                "type": "number"
              },
              "modality": {
                "description": "Venue must offer this modality.",
                "enum": ["cold_plunge", "traditional_sauna", "infrared_sauna", "steam_room", "cryotherapy", "red_light", "pemf", "compression", "float"],
                "type": "string"
              },
              "query": {
                "description": "Substring match on venue name (case-insensitive).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:375c5f0883f1def730e82cdcc11131e4fa1362ee3b78fbb0fc4a725e70a895c7"
        }
      ],
      "digest": "sha256:4132a04c75df77665192bd2ace36cd4d68e33898dba123291cb4f59287d91d45"
    }
  }
}
