        {
          "name": "buscar_software_mx",
          "title": "Buscar software en México",
          "description": "Busca en el directorio de mexsaas el software que resuelve lo que necesita un negocio en México. Acepta texto libre en español y filtros opcionales. Devuelve productos con precio, plan gratis, soporte, país de origen y su ficha.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "categoria": {
                "description": "Slug de categoría (lista en categorias_mx).",
                "maxLength": 60,
                "type": "string"
              },
              "consulta": {
                "default": "",
                "description": "Lo que necesita el negocio en palabras normales, ej. 'facturar sin contador'. Puede ir vacío si usas filtros.",
                "maxLength": 200,
                "type": "string"
              },
              "limite": {
                "default": 8,
                "description": "Cuántos resultados (máx. 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "negocio": {
                "description": "Tipo de negocio, ej. 'restaurantes', 'contadores', 'tienditas'.",
                "enum": ["abogados", "contadores", "arquitectos", "constructoras", "consultorios-medicos", "dentistas", "restaurantes", "tienditas", "salones-de-belleza", "gimnasios", "escuelas", "inmobiliarias", "tiendas-en-linea", "freelancers", "agencias", "hoteles", "transportistas", "fabricas", "pymes", "startups"],
                "type": "string"
