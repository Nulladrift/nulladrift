                "description": "true: solo con plan gratis.",
                "type": "boolean"
              },
              "precio_max_mxn": {
                "description": "Precio de entrada máximo en MXN. Excluye productos sin precio publicado.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "tarea": {
                "description": "Necesidad concreta, ej. 'facturar', 'cobrar', 'nomina', 'agendar-citas'.",
