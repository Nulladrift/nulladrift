      "serverInfo": {
        "name": "atalaya-ai-crawler-check",
        "title": "Atalaya AI crawler check",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only checks of public websites for AI crawler access. No account needed. Results are cached for an hour per domain.",
      "tools": [
        {
          "name": "check_ai_crawler_access",
          "title": "Check AI crawler access",
          "description": "Checks whether AI crawlers can reach and read a public website or web app: which AI crawlers (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, PerplexityBot, Google-Extended and more) robots.txt allows and the exact rule for each, how much text the homepage HTML carries for crawlers that do not run JavaScript (flags client-rendered app shells, common in apps built with Lovable, Bolt, Base44 or Replit), title/meta description/H1, llms.txt, sitemap, and the platform or host setting to change (Cloudflare, Vercel, Netlify). Use it when someone asks why their site or app does not show up in ChatGPT, Claude, Perplexity or other AI answers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Public domain or URL, for example example.com",
                "type": "string"
              },
              "lang": {
                "description": "Language of the verdict text (default en)",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bcbe482bf5806ed89b6d9f799c9e8f47d4a672f1de154895839626d350afad2d"
        },
        {
          "name": "list_ai_crawlers",
          "title": "List known AI crawlers",
          "description": "Lists the AI crawler user-agent tokens Atalaya checks, by vendor and purpose (training, search index, user-triggered fetch), so you can write a robots.txt that keeps AI search while opting out of training.",
          "inputSchema": {
            "additionalProperties": false,
