{
  "lockfileVersion": 2,
  "subjects": {
    "app.subvencioname/datos-publicos": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://subvencioname.app/api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "subvencioname",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Datos oficiales de subvenciones y contratos públicos de España. Son datos informativos: la convocatoria o el pliego oficial manda. No inventes importes ni plazos: si un dato no viene en la respuesta, dilo.",
      "tools": [
        {
          "name": "buscar_adjudicaciones",
          "description": "Contratos públicos ya adjudicados, por NIF de la empresa adjudicataria, por texto o por provincia. Sirve para ver qué gana una empresa y cuándo vence cada contrato. Solo empresas: no hay datos de personas físicas.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "nif": {
                "description": "NIF de la empresa adjudicataria (p. ej. B12345678). Con NIF se ignora el texto.",
                "type": "string"
              },
              "page": {
                "description": "Página de resultados (empieza en 1, máximo 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Resultados por página (25 por defecto, máximo 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "provincia": {
                "description": "Provincia por su nombre oficial, p. ej. «La Rioja», «Bizkaia».",
                "type": "string"
              },
              "q": {
                "description": "Texto a buscar en el objeto del contrato.",
                "type": "string"
              },
              "vence_antes": {
                "description": "Solo contratos que vencen antes de esta fecha (AAAA-MM-DD).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar contratos adjudicados"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a59889a3638a810cc3a1d304f7c057203073002ca0295a64318ed20c570895e8"
        },
        {
          "name": "buscar_convocatorias",
          "description": "Busca subvenciones y ayudas públicas de España (BDNS y fuentes autonómicas). Devuelve título, órgano, importe, plazo y código de cada convocatoria. Usa «abiertas» para quedarte con las que aún se pueden pedir. Si la respuesta trae «ampliado» distinto de null, no había nada con esos filtros y los resultados son de una búsqueda más amplia (otra zona o el sector entero): dilo así, no los presentes como si cumplieran lo pedido.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "abiertas": {
                "description": "Solo las que tienen el plazo abierto.",
                "type": "boolean"
              },
              "ambito": {
                "description": "Quién convoca.",
                "enum": ["ESTADO", "AUTONOMICA", "LOCAL", "OTROS"],
                "type": "string"
              },
              "ccaa": {
                "description": "Comunidad autónoma por su slug, p. ej. «rioja», «pais-vasco», «andalucia».",
                "type": "string"
              },
              "orden": {
                "description": "Orden de los resultados.",
                "enum": ["recientes", "cierre", "presupuesto"],
                "type": "string"
              },
              "page": {
                "description": "Página de resultados (empieza en 1, máximo 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Resultados por página (25 por defecto, máximo 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "provincia": {
                "description": "Provincia por su nombre oficial, p. ej. «La Rioja», «Bizkaia».",
                "type": "string"
              },
              "pymes": {
                "description": "Solo las que admiten pymes y autónomos.",
                "type": "boolean"
              },
              "q": {
                "description": "Texto a buscar: actividad, gasto o tema («placas solares», «contratación jóvenes»).",
                "type": "string"
              },
              "ue": {
                "description": "Solo las cofinanciadas con fondos europeos.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar convocatorias"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:622a498827257148d44012018d95557e4e93dfb366a64099d02ae7078400846d"
        },
        {
          "name": "buscar_licitaciones",
          "description": "Busca contratos públicos de España con el plazo de ofertas abierto (Plataforma de Contratación, TED y BOE). Devuelve objeto, órgano, importe sin IVA y fecha límite. Si «ampliado» no es null, no había nada con ese texto y son contratos parecidos: dilo así.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cpv": {
                "description": "División CPV de dos dígitos, p. ej. «45» (obras) o «90» (limpieza).",
                "pattern": "^[0-9]{2}$",
                "type": "string"
              },
              "importeMax": {
                "description": "Importe máximo en euros, sin IVA.",
                "minimum": 0,
                "type": "number"
              },
              "importeMin": {
                "description": "Importe mínimo en euros, sin IVA.",
                "minimum": 0,
                "type": "number"
              },
              "orden": {
                "description": "Orden de los resultados.",
                "enum": ["margen", "cierre", "importe"],
                "type": "string"
              },
              "organo": {
                "description": "Texto del órgano de contratación.",
                "maxLength": 100,
                "type": "string"
              },
              "page": {
                "description": "Página de resultados (empieza en 1, máximo 500).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "pageSize": {
                "description": "Resultados por página (25 por defecto, máximo 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "provincia": {
                "description": "Provincia por su nombre oficial, p. ej. «La Rioja», «Bizkaia».",
                "type": "string"
              },
              "q": {
                "description": "Texto a buscar en el objeto del contrato («limpieza de edificios», «mantenimiento informático»).",
                "type": "string"
              },
              "tipo": {
                "description": "Tipo de contrato, por su nombre.",
                "enum": ["suministros", "servicios", "obras", "administrativo especial", "privado", "gestión de servicios públicos", "concesión de servicios", "concesión de obras públicas", "concesión de obras", "colaboración público-privada", "patrimonial"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar licitaciones"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:baf9c567aa66a535aafca5a70082a028dd028a5e4cef17946650611721bd5b72"
        },
        {
          "name": "ver_convocatoria",
          "description": "Ficha completa de una convocatoria por su código BDNS: beneficiarios, importes, plazos, requisitos y enlace a las bases. Úsala después de buscar, antes de afirmar un requisito o una fecha.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "codigo": {
                "description": "Código de la convocatoria tal como lo devuelve la búsqueda (p. ej. 922483).",
                "pattern": "^[A-Za-z0-9-]{4,64}$",
                "type": "string"
              }
            },
            "required": ["codigo"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ver una convocatoria"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:93be7d6fdd93b4f72881529af28033715daf4f52a1872a02220c9f668c9c393c"
        }
      ],
      "digest": "sha256:9000f0051361f4992264bc3a2ac1c90469fe66ef21c8dc8a0fef809f2226b291"
    }
  }
}
