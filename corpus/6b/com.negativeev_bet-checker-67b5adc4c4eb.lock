      "serverInfo": {
        "name": "negativeev-bet-checker",
        "title": "NegativeEV bet checker",
        "version": "1.4.5"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Grade MLB, WNBA, PGA, ATP, and NFL bets against NegativeEV's thousands of play-by-play game simulations. Call get_slate first to confirm there's a checkable slate; check_bet spends one of the caller's checks only when the bet fully grades, and every check_bet result says so outright (`status`, `check_spent`), so read those rather than inferring from the numbers. A bet that came back `ungraded` was understood — it is simply not on the simulated slate, so re-sending it with different wording returns the same answer; check get_slate instead. get_usage shows what's left. Anonymous calls share a per-device quota of 100 checks a day; send a signed-in user's Supabase access token as `Authorization: Bearer` to raise that to 1000 an hour (see https://negativeev.com/auth.md). An invalid or expired token is rejected with 401 rather than silently downgraded, so re-authenticate rather than retrying anonymously.",
      "tools": [
        {
          "name": "check_bet",
          "title": "Check a bet",
          "description": "Check a specific sports bet against thousands of play-by-play game simulations: each leg's simulated probability, the sportsbook's implied probability, and the edge. Send the bet as plain text - teams or players, market, line, odds. A parlay in one string is graded leg by leg and priced as a whole. Call this first; nothing has to be set up, and a missing slate, an unrecognized bet, or an unsupported market comes back as a plain `status` without spending a check. It prices a bet the caller names and never suggests one, so there is nothing to send for \"what should I bet tonight\". Every result leads with `status` and `check_spent` and says whether re-wording would change anything; when it says no, it means no. Covers MLB, WNBA, PGA, ATP, and NFL. A game that already started still checks, against the simulations from before it began.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "bet": {
                "description": "The bet text, e.g. 'Shohei Ohtani over 1.5 total bases -120'",
                "type": "string"
              }
            },
            "required": ["bet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d9950eb373cfd83ef6764974a29be4c8b08bfeb3a90d72ffd1d2db0a51ffe868"
        },
        {
          "name": "get_slate",
          "title": "Today's slate",
          "description": "Which of MLB, WNBA, PGA, ATP, and NFL have a checkable slate right now - at least one simulated game that has not started. Pass `sport` for one; omit it for all. Free, spends no check. It is not required before `check_bet`, which reports a missing slate itself at no cost. Call it to answer \"what can be checked today\", or after a `no_slate` or `ungraded` result, which mean the game is not on the simulated slate rather than that the bet was worded wrong.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "sport": {
                "description": "One of: MLB, WNBA, PGA, ATP, NFL. Omit to get every live sport.",
                "enum": ["MLB", "WNBA", "PGA", "ATP", "NFL"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7e0b694330702947d2e55ce574d7cd33ff96eb641198dc1499b45567f46f0ca7"
        },
        {
          "name": "get_usage",
          "title": "Checks remaining",
          "description": "How many bet checks the caller has left and when the next one frees up - 100 a day shared per device anonymously, 1000 an hour with a signed-in user's token. Free, spends no check. It grades nothing, so it is not a step before a check: call it when a check comes back refused for quota, or before working through a long list of bets.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a9f2e9846d9746640cf2450bb4c12bcec9971d1b15efc9245589d41d7a654b91"
        }
      ],
      "digest": "sha256:8919817404e651a293cd8154ad00391a3dc1401d6cb920a46da386deb62470f6"
    }
  }
}
