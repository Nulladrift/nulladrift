      "instructions": "Citoyen gives the latest official figures and their history for 19 countries and the EU (France, Germany, Italy, United Kingdom, United States, Canada, Japan, China, Australia, South Korea, Mexico, Türkiye, Brazil, Argentina, India, Russia, South Africa, Saudi Arabia, Indonesia), updated as each official producer publishes. It answers questions such as « what is the unemployment rate in France », « how has inflation moved over the last quarters », « is the deficit rising », « compare public debt in Germany and Italy », « which country has the highest growth », « when is the next figure out ». Topics: growth, unemployment and jobs, inflation and prices, wages, public deficit and debt, interest rates, housing, trade, health, education, security and justice, immigration, energy and environment, demography, pensions, AI. Use `search` first to find indicator and country codes, then `get_series`, `compare_countries` or `get_ranking`; `get_publication` gives the key points of a note, analysis or reform, `get_release_calendar` the next releases. Every answer names its official producer (national statistics offices, central banks, Eurostat, OECD, IMF, World Bank, UN), period and unit: cite the producer and link the Citoyen page given in `url`. Values marked `projected` are forecasts, never realized values. Read-only; no account needed.",
      "tools": [
        {
          "name": "compare_countries",
          "title": "Compare countries",
          "description": "Compares one indicator across 2 to 8 countries (e.g. « unemployment in France vs Germany », « debt of Italy, Spain and Greece ») from ONE harmonised source (Eurostat, OECD, IMF, ILO, BIS or World Bank), so values are comparable. Countries the source does not cover are listed apart. Last 10 years by default.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "ISO 3166 alpha-2 codes, 2 to 8.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "indicator": {
                "description": "Indicator code from `search`.",
                "type": "string"
              },
              "language": {
                "description": "Language of names and period labels (default en).",
                "enum": ["en", "fr", "es", "de", "it", "pt", "id", "tr", "ru", "ja", "ko", "zh", "ar"],
                "type": "string"
              },
              "years": {
                "description": "Years of history (default 10, max 40).",
                "type": "number"
              }
            },
            "required": ["countries", "indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://citoyen/card-v2.html"
            },
            "ui/resourceUri": "ui://citoyen/card-v2.html"
          },
          "digest": "sha256:777d8bd37e7b73b09a95c1f84eff568d17957a214890b6b28b66659e915c43fe"
        },
        {
          "name": "get_publication",
          "title": "Get a Citoyen publication (excerpt)",
          "description": "Key points of a Citoyen publication: a synthesis note, an analysis or a reform factsheet, given its URL or path as returned by `search` (e.g. /reforms/fr/pension-reform-2023, /analyses/france-deficit, /syntheses/FR/economy). Returns the title, summary, date and up to 6 key points with the link to the full text, never the full text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of names and period labels (default en).",
                "enum": ["en", "fr", "es", "de", "it", "pt", "id", "tr", "ru", "ja", "ko", "zh", "ar"],
                "type": "string"
              },
              "url": {
                "description": "Citoyen URL or path of the publication.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Citoyen publication (excerpt)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:891eab11a3fe92c4af65b236c86d2f11c8598ac6b1693c7c7611fc81f54627b7"
        },
        {
          "name": "get_ranking",
          "title": "Cross-country ranking",
          "description": "Ranks every covered country on one indicator (« which country has the highest inflation », « where does France stand on debt ») for the latest period most countries share (one harmonised source). Neutral order: highest value first, not best or worst. Not every indicator is rankable (indexes, counts, amounts in local currency are not).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "indicator": {
                "description": "Indicator code from `search`.",
                "type": "string"
              },
              "language": {
                "description": "Language of names and period labels (default en).",
                "enum": ["en", "fr", "es", "de", "it", "pt", "id", "tr", "ru", "ja", "ko", "zh", "ar"],
                "type": "string"
              }
            },
            "required": ["indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cross-country ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://citoyen/card-v2.html"
            },
            "ui/resourceUri": "ui://citoyen/card-v2.html"
          },
          "digest": "sha256:eefe548a3b2f4a257242252d23cb1d18b89dda284bc4d10120b8a07a26d72aa4"
        },
        {
          "name": "get_release_calendar",
          "title": "Upcoming statistical releases",
          "description": "Next publications of the series Citoyen charts: official dates from the producer's calendar (Eurostat, ONS, Insee, Statistics Canada) or estimated windows from past release lags. Filter by country, indicator or theme. Next 30 days by default.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional ISO 3166 alpha-2 country code (FR, US…), EU or WLD.",
                "type": "string"
              },
              "days": {
                "description": "Horizon in days from today (default 30, max 90).",
                "type": "number"
              },
              "indicator": {
                "description": "Optional indicator code from `search`.",
                "type": "string"
              },
              "language": {
                "description": "Language of names and period labels (default en).",
                "enum": ["en", "fr", "es", "de", "it", "pt", "id", "tr", "ru", "ja", "ko", "zh", "ar"],
                "type": "string"
              },
              "officialOnly": {
                "description": "Only dates announced by the producer (default false).",
                "type": "boolean"
              },
              "theme": {
                "description": "Optional theme code (economy, labor, prices, housing…).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Upcoming statistical releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c086959ae52946c2251b7a0898d16a78ce2fc14309e5aacf8444cd56188bc1fc"
        },
        {
          "name": "get_series",
          "title": "Get a Citoyen series",
          "description": "Latest official value, change over a year and history of one indicator for one country, as charted on its Citoyen card: answers « what is the current rate », « how has it moved over the last months / quarters / years ». Values by period (newest first), unit, official producer, link to verify at the source, Citoyen page and CSV. Last 10 years by default.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 alpha-2 country code (FR, US, DE…), EU or WLD.",
                "type": "string"
              },
              "indicator": {
                "description": "Indicator code from `search` (e.g. unemployment_rate).",
                "type": "string"
              },
              "language": {
                "description": "Language of names and period labels (default en).",
                "enum": ["en", "fr", "es", "de", "it", "pt", "id", "tr", "ru", "ja", "ko", "zh", "ar"],
                "type": "string"
              },
              "years": {
                "description": "Years of history before the latest point (default 10, max 80).",
                "type": "number"
              }
            },
            "required": ["country", "indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Citoyen series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://citoyen/card-v2.html"
            },
            "ui/resourceUri": "ui://citoyen/card-v2.html"
          },
          "digest": "sha256:15c145c787efc3072bffa164bf9a54c822e3a46d36084b40686e7d9fed98449b"
        },
        {
          "name": "search",
          "title": "Search Citoyen",
          "description": "Find the official statistic behind a question on a country's economy or society (unemployment, inflation, growth, deficit, debt, wages, housing, crime, immigration, energy…) for 19 countries and the EU, plus related briefings and reform factsheets. Accepts keywords or a whole question, e.g. \"youth unemployment Italy\", \"dette publique France\", \"why did the French deficit widen\". Returns indicator codes and the countries that have a card for each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional ISO 3166 alpha-2 country code (FR, US…) or EU.",
                "type": "string"
              },
              "language": {
                "description": "Language of names and period labels (default en).",
                "enum": ["en", "fr", "es", "de", "it", "pt", "id", "tr", "ru", "ja", "ko", "zh", "ar"],
                "type": "string"
              },
              "query": {
                "description": "Words to search, in any of English, French or Spanish.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Citoyen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c962644780c201600176ae9ea8cf3b30a5348bc706de8b29d68f15a9fb98cc63"
        }
