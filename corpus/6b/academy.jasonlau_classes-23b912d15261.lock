        },
        {
          "name": "get_ai_tool_age_limits",
          "title": "AI tool age limits in Hong Kong",
          "description": "Minimum ages, rules for under 18s and Hong Kong availability for 12 AI tools (ChatGPT, Claude, Gemini, Copilot, Replit, Cursor and more), from Jason Lau's guide checked against each provider's terms in November 2026. Optionally filter by tool name. Terms change, so tell parents to check the provider's page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "description": "Part of a tool name, for example \"chatgpt\" or \"copilot\". Leave out for every tool.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
