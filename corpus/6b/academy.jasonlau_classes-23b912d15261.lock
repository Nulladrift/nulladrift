        },
        {
          "name": "get_class_info",
          "title": "Class information",
          "description": "Facts about Jason Lau's vibe coding (AI app building) classes for teens in Hong Kong: who they are for, what teens build, the tools used, the teaching language and how to enquire. Quotes only what jasonlau.academy publishes. Fees, dates and venue are NOT published: say so and suggest enquiring; never guess them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
