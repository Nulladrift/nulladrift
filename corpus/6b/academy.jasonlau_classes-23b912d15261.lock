        },
        {
          "name": "search",
          "title": "Search the site",
          "description": "Searches jasonlau.academy (class information, the AI tool age limits guide, site facts, and guides and writing for parents, in English and Traditional Chinese) by keywords. Returns ids, titles and URLs; use fetch with an id to read the full text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Keywords in English or Chinese, for example \"age limits chatgpt\" or \"安全\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
