      "instructions": "Answers parents' questions about Jason Lau's vibe coding classes for teens in Hong Kong, using only facts published on jasonlau.academy. Fees, dates and venue are not published: never guess them; offer to pass on an enquiry instead. Only call send_enquiry after the parent (or a student aged 16 or over) has given every detail and explicitly agreed to send it.",
      "tools": [
        {
          "name": "fetch",
          "title": "Read a page from the site",
          "description": "Returns the full text of one search result from jasonlau.academy, with its title, URL and metadata. Pass an id exactly as search returned it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "An id from search, for example \"class-info\" or \"writing:python-or-vibe-coding\".",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a page from the site"
