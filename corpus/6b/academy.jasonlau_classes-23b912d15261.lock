          },
          "digest": "sha256:942fa32c8ded205e7c1d7dd692b798942a28a88a217b6b0632941d91b0354c4f"
        },
        {
          "name": "send_enquiry",
          "title": "Send a class enquiry to Jason",
          "description": "Passes a class enquiry to Jason Lau by email, the same way as the enquiry form on jasonlau.academy. Use only when a parent (or a student aged 16 or over) asks you to, after they have given every field and explicitly agreed that you send their details to Jason. Never send for a student under 16 contacting Jason themselves; ask them to have a parent get in touch. Jason replies with dates and fees. Set consent_to_email to true only when the person has said yes to sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent_to_email": {
                "const": true,
                "description": "Must be true: the person agreed to send these details to Jason by email.",
                "type": "boolean"
              },
              "contact": {
                "description": "Email address, Telegram username (like @name) or phone number with country code (like +852).",
                "maxLength": 254,
                "minLength": 1,
                "type": "string"
              },
              "contact_method": {
                "description": "How Jason should reply.",
                "enum": ["email", "telegram", "phone"],
                "type": "string"
              },
              "contact_name": {
                "description": "Name of the person Jason should reply to.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "message": {
                "description": "What the teen is interested in or wants to build, and any questions, in the person's own words.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "reply_language": {
                "default": "en",
                "description": "Language for Jason's reply.",
                "enum": ["en", "zh-HK"],
                "type": "string"
              },
              "submitted_by": {
                "description": "Who is sending the enquiry.",
                "enum": ["parent", "student_16_plus"],
                "type": "string"
              },
              "teen_age": {
                "description": "The student's age in years.",
                "maximum": 19,
                "minimum": 10,
                "type": "integer"
              }
            },
            "required": ["consent_to_email", "contact", "contact_method", "contact_name", "message", "submitted_by", "teen_age"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
