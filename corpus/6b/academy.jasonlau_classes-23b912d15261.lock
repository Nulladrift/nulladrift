        },
        {
          "name": "list_guides",
          "title": "Guides for parents",
          "description": "Lists Jason Lau's guides and writing for parents of teens learning to build with AI, with URLs and one line summaries, in English and Traditional Chinese.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
