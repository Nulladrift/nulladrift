      "instructions": "MaFactureOK vérifie les entreprises françaises et explique les rejets de factures électroniques. Outils : verifier_tiers (SIREN ou SIRET → existe, active ou cessée, nom officiel, adresse, TVA), verifier_tva (numéro de TVA intracommunautaire français → validité VIES et entreprise associée), expliquer_code_rejet (code AFNOR comme REJ_SEMAN ou règle comme BR-CO-15 → signification et correction), valider_facture (ouvre une carte de dépôt : l'utilisateur y glisse son fichier Factur-X, UBL ou CII et lit le verdict, les corrections et l'état des entreprises). Les vérifications fonctionnent sans clé, avec un quota réduit (5 identifiants par appel, 30 par jour) ; une clé gratuite (https://mafactureok.com/api), passée en Authorization: Bearer ou en paramètre ?cle= de l'URL du serveur, élargit le quota. Seuls des identifiants publics sont transmis ; rien n'est conservé. Les signaux sont des signaux de vigilance, pas des preuves : « indetermine » signifie qu'un service n'a pas répondu et justifie un nouvel essai.",
      "tools": [
        {
          "name": "expliquer_code_rejet",
          "title": "Expliquer un code de rejet ou une règle de validation",
          "description": "Traduit en clair un motif de rejet ou de refus de facture électronique (codes AFNOR XP Z12-012 : REJ_SEMAN, REJ_ADR, DEST_INC, NON_TRANSMISE, TX_TVA_ERR…) ou une règle de validation EN 16931 / française (BR-CO-15, BR-FR-10, BR-S-08…) : signification, action attendue, faut-il un avoir. Sans clé, données du site MaFactureOK.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code": {
                "description": "Code tel que reçu, par exemple REJ_SEMAN ou BR-CO-15",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a657b9a27b4ab71260f7c3840523180066c332216092e41ac73b6b2a6f1b1e90"
        },
        {
          "name": "valider_facture",
          "title": "Vérifier une facture électronique (dépôt de fichier)",
          "description": "Ouvre une carte de dépôt dans la conversation. L'utilisateur y glisse sa facture électronique (PDF Factur-X, XML UBL ou CII, 15 Mo au maximum) ; le fichier est envoyé directement à MaFactureOK, analysé puis effacé, et la carte affiche le verdict (valide, à vérifier, invalide), chaque anomalie en français avec la correction attendue, et l'état des entreprises de la facture au registre officiel. À appeler dès que l'utilisateur veut vérifier, valider ou comprendre le rejet d'une facture qu'il possède en fichier. Aucun argument : le fichier n'est jamais transmis par le modèle.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
