{
  "lockfileVersion": 2,
  "subjects": {
    "com.northboundintelligence/sentinel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.northboundintelligence.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "northbound-sentinel-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "NorthBound Sentinel MCP Server provides governed, tenant-isolated access to assets, discovered application Site Maps, Technology Stack + CVE/KEV intelligence, normalized security findings, Virtual CISO posture summaries, cryptographically signed security reports (PAdES + RFC 3161), and governed assessment execution. Balanced and Active assessments require verified domain ownership; unverified targets only permit Passive assessments.",
      "tools": [
        {
          "name": "sentinel_generate_report",
          "description": "Generate a NorthBound Dossier report for a tenant project or asset as structured summary JSON, standalone HTML, or a PAdES + RFC 3161 signed PDF. (Required token scope: read_findings)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "Required when scope is 'asset'.",
                "type": "integer"
              },
              "format": {
                "default": "summary_json",
                "enum": ["summary_json", "html", "signed_pdf_base64"],
                "type": "string"
              },
              "project_id": {
                "description": "Required when scope is 'project'.",
                "type": "string"
              },
              "scope": {
                "enum": ["project", "asset"],
                "type": "string"
              }
            },
            "required": ["scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7933ae5c03fb4fcbb6baf218de3117296fd6cd9af5d2e42c0c79f52d5c0227bb"
        },
        {
          "name": "sentinel_get_assessment_status",
          "description": "Poll live execution progress or completed run status for a security assessment scan_id or run_id. (Required token scope: read_assets or launch_scans)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scan_id": {
                "description": "Live scan_id or persisted run_id.",
                "type": "string"
              }
            },
            "required": ["scan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6f62784e2606b2e223db22be082606a0b1b5299807844fbfe4f8d43e8e41fc21"
        },
        {
          "name": "sentinel_get_asset_surface",
          "description": "Retrieve discovered HTTP Site Map tree, endpoints, and fingerprinted Technology Stack + CVE alerts for a tenant asset. (Required token scope: read_assets)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "Target asset integer ID.",
                "type": "integer"
              }
            },
            "required": ["asset_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c8345f495c72e111fa9be35041304499f0396670fdcf28f70fb0393d28563cdf"
        },
        {
          "name": "sentinel_get_finding_detail",
          "description": "Fetch full technical detail, normalized evidence, proof level, CVSS/CWE metadata, and remediation guidance for one finding. (Required token scope: read_findings)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "finding_id": {
                "description": "Numeric finding ID.",
                "type": "integer"
              }
            },
            "required": ["finding_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb95109979492155733f0692ae0a7dd49b36f5e683b59c1481d8953b573d9ef5"
        },
        {
          "name": "sentinel_get_vciso_posture",
          "description": "Return truthful Virtual CISO security posture metrics: open severity distribution, verified asset ratio, SLA aging, and top remediation priorities. (Required token scope: read_findings)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project_id": {
                "description": "Optional project ID scope.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e476200136022e28d04dc45d8b6d2d1402bf4d638136092d2614d9c1edc3000"
        },
        {
          "name": "sentinel_launch_assessment",
          "description": "Launch a governed security assessment on a tenant domain/FQDN asset. Balanced and Active postures require verified domain ownership; unverified assets accept Passive posture only. The caller must explicitly confirm legal authorization to test the target (legal_authorization=true); the confirmation is recorded in the audit trail. One launch per request; runs are sequential per user. (Required token scope: launch_scans)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "description": "Target asset ID.",
                "type": "integer"
              },
              "legal_authorization": {
                "description": "Must be true: the account holder confirms they are legally authorized to run security testing against this target. Never set this on the operator's behalf without their explicit confirmation.",
                "type": "boolean"
              },
              "posture": {
                "default": "passive",
                "enum": ["passive", "balanced", "active"],
                "type": "string"
              },
              "testing_type": {
                "default": "full_assessment",
                "enum": ["full_assessment", "application_security", "network_security", "exposure_intelligence", "recon_only"],
                "type": "string"
              }
            },
            "required": ["asset_id", "legal_authorization"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c14a1019c67d4398417c72d6f22f60e18c45ab0a9a4e8113c75bb95c143b7f1"
        },
        {
          "name": "sentinel_list_assets",
          "description": "List tenant assets with domain ownership verification status, target type, and open finding counts. (Required token scope: read_assets)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "description": "Optional project ID filter.",
                "type": "string"
              },
              "search": {
                "description": "Optional substring filter on asset domain/hostname.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f9033d20e684f0624842e964cf9febaca2d17d753144781f5c76fcc7e3530cef"
        },
        {
          "name": "sentinel_list_findings",
          "description": "Query normalized security findings across the tenant with optional filters by project, asset, severity, status, or keyword. (Required token scope: read_findings)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "type": "string"
              },
              "search": {
                "type": "string"
              },
              "severity": {
                "enum": ["critical", "high", "medium", "low", "info"],
                "type": "string"
              },
              "status": {
                "enum": ["open", "investigating", "fixed", "resolved", "risk_accepted", "false_positive"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:30d5d86c0bca5fc77b0d22e2cd65498e49a09096be241144a29abc06e66b1ad9"
        },
        {
          "name": "sentinel_list_projects",
          "description": "List security projects visible to the authenticated tenant, including asset and open finding counts. (Required token scope: read_assets)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7d71e5cf0e6b2353b883289b574a013eb30391cd4477ec69d5ab4f3b82de691"
        },
        {
          "name": "sentinel_list_runs",
          "description": "List historical and active security assessment runs visible to the tenant. (Required token scope: read_assets)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_id": {
                "type": "integer"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "project_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9736dcd510bba854d42932b2caf6ac1121406632b80b3ff4f171938b2c4ee1e8"
        }
      ],
      "digest": "sha256:90b6ce3f68d4e24243f6f21e4798f1bda8f8263be3ea76d6aa7bad01acccba99"
    }
  }
}
