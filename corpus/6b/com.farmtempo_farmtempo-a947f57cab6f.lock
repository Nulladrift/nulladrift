        {
          "name": "decide_buy_or_wait",
          "title": "살까/기다릴까 (Buy now or wait)",
          "description": "오늘 시세, 7일 뒤 범위(템포 레인지), 평년 대비, 세 예측 의견, 변동 주의, 과거 성적(어제 가격 대비), 대체 품목을 한 번에 묶어 '재고 있으면 대기(1주) / 지금 사기 / 필요한 만큼만 / 모름' 참고 신호를 줍니다. 숫자마다 출처·기준일(receipts). 판단 규칙(rule)을 응답에 싣고, 그 규칙의 성과는 아직 검증 전입니다. 사용자에게 '확정은 사람'임을 밝히세요. qty(kg)를 주면 지금 살 때와 7일 뒤 예상 금액을 함께 줍니다. '1주 기다리기'는 필요한 날이 7일 뒤 이후일 때만 해당합니다 — need_days(며칠 안에 필요한가, 재고가 버티는 날 수)를 주면 그보다 이를 때 need_check.verdict_for_need 로 '필요한 만큼 지금 사기'를 알려 줍니다. 사용자의 재고·납기를 알면 꼭 넘기세요.",
          "inputSchema": {
            "properties": {
              "item": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
