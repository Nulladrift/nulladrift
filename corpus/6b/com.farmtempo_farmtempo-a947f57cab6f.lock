        {
          "name": "decide_buy_or_wait",
          "description": "오늘 시세, 7일 뒤 범위(템포 레인지), 평년 대비, 세 예측 의견, 변동 주의, 과거 성적(어제 가격 대비), 대체 품목을 한 번에 묶어 '1주 기다리기 / 지금 사기 / 필요한 만큼만 / 모름' 참고 신호를 줍니다. 숫자마다 출처·기준일(receipts). 판단 규칙(rule)을 응답에 싣고, 그 규칙의 성과는 아직 검증 전입니다. 사용자에게 '확정은 사람'임을 밝히세요. qty(kg)를 주면 지금 살 때와 7일 뒤 예상 금액을 함께 줍니다.",
