        {
          "name": "get_auction_price",
          "description": "특정 품목의 경락(낙찰) 요약을 반환한다. 단위는 원/kg(거래중량 가중평균).\n\n- market 지정: 해당 시장 1곳의 평균 낙찰가·총물량·거래건수·가격범위 + KAMIS 정산 도매가 비교(기준 상이: 경락=낙찰가, KAMIS=정산 도매가).\n- market 생략: 전 시장을 평균가 오름차순(어디가 싼지)으로 반환.\n- date 생략: 최신 수집일 자동.\n- market 매칭: 코드(110001)·한글명(서울가락)·부분일치(가락) 모두 허용. 부분일치 복수 시 후보 목록 반환.\n- 미존재 품목·시장·날짜는 404 아닌 200 + {found:false, hint}.",
          "inputSchema": {
            "properties": {
              "date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "거래정산일 YYYY-MM-DD. 생략 시 최신 수집일.",
                "title": "Date"
              },
