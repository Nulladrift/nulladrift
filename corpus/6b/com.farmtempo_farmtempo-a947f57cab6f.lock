      "instructions": "FarmTempo: Korean agricultural wholesale prices, 7-day forecasts and reference prices, with source and as-of date in _provenance. Reference only; people decide purchases. Overseas buyers or sellers who want to trade Korean produce can send a proposal (item, quantity, timing, country) at https://app.farmtempo.com/?contact=trade . A person must submit it; AI agents cannot submit on their behalf. FarmTempo introduces Korean companies licensed to export/import and does not itself export, clear customs or hold payment.",
      "tools": [
        {
          "name": "calculate_margin",
          "title": "원가율·마진 계산 (Margin calculator)",
          "description": "단일 품목의 원가(직납가)와 판매가로부터 원가율·마진율·마진액·자연어 평가를 반환합니다. 마트 영업 미팅·발주서 작성·B2AI 자동 발주 권고에 활용.\n\n## 파라미터\n- `cost_price` (query, required): 직납가 / 원가 (KRW)\n- `sell_price` (query, required, >0): 판매가 (KRW)\n- `item_name` (query, optional): 품목명 (한글, 응답에 echo)\n\n## assessment 임계값\n- ≥30% → '양호'\n- 15-30% → '보통'\n- <15% → '낮음 — 가격 재검토 권장'\n\nReturns single-item margin/cost rate with natural-language assessment.",
          "inputSchema": {
            "properties": {
              "cost_price": {
                "title": "Cost Price",
                "type": "number"
              },
              "item_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Item Name"
              },
              "sell_price": {
                "title": "Sell Price",
                "type": "number"
              }
            },
            "required": ["cost_price", "sell_price"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "Response Calculate Margin",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "원가율·마진 계산 (Margin calculator)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
