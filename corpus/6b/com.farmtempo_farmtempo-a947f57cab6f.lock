        {
          "name": "calculate_margin_bulk",
          "title": "여러 품목 마진 계산 (Bulk margin calculator)",
          "description": "여러 품목의 매입·판매 행을 일괄로 계산해 행별·총계 결과를 반환합니다. HTML 원가율 계산기 탭의 calcRow + totals 와 동일 출력.\n\n## Body 스키마\n```json\n{\"rows\": [{\"item\": \"배추\", \"buyPrice\": 1000, \"sellPrice\": 1500, \"qty\": 1}]}\n```\n\nReturns per-row + aggregated totals for bulk margin calculation.",
          "inputSchema": {
            "properties": {
              "rows": {
                "description": "품목별 매입·판매 행",
                "items": {
                  "properties": {
                    "buyPrice": {
                      "description": "직납가 / 원가 (원)",
                      "minimum": 0,
                      "title": "Buyprice",
                      "type": "number"
                    },
                    "item": {
                      "description": "품목명 한글 (예: 배추)",
                      "title": "Item",
                      "type": "string"
                    },
                    "qty": {
                      "default": 1,
                      "description": "수량 (기본 1)",
                      "exclusiveMinimum": 0,
                      "title": "Qty",
                      "type": "number"
                    },
                    "sellPrice": {
                      "description": "판매가 (원)",
                      "exclusiveMinimum": 0,
                      "title": "Sellprice",
                      "type": "number"
                    }
                  },
                  "required": ["buyPrice", "item", "sellPrice"],
                  "title": "_BulkRow",
                  "type": "object"
                },
                "minItems": 1,
                "title": "Rows",
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "Response Calculate Margin Bulk",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "여러 품목 마진 계산 (Bulk margin calculator)"
