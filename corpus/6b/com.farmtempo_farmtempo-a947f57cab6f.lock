          "title": "기상 특보 (Weather alerts)",
          "description": "**특허 #1 추천 시스템의 사용자 인터페이스 출력.** 현재 월에 해당하는 기상 민감 품목별 경보를 자연어 메시지로 반환. AI 에이전트가 그대로 사용자에게 전달 가능한 형태.\n\n## action 값 4단계\n- `즉시매입` / `선매입권고` / `정상발주` / `매입지연`\n\nMonthly weather alerts for current month, with natural language messages.",
