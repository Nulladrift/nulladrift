        {
          "name": "decide_buy_plan",
          "title": "구매 계획 세 안 (Buying plan options)",
          "description": "aT 도매 정산가 기준 26품목. 필요량(kg)과 기한(오늘~7일)을 주면 세 가지 사는 방법의 예상 금액(중앙값·80% 범위, 신선도 손실 가정 포함)과 묶음별 과거 성적(과거 자료 검증·가상 구매 계산: 평균 절감·나쁜 5% 날·손해 본 날 비율)을 줍니다. 팜템포는 고르거나 주문하지 않습니다. 금액은 예측 기반 예시이며 약속이 아님을 사용자에게 밝히세요.",
          "inputSchema": {
