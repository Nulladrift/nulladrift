          "description": "공급자의 신고된 배송 조건으로 지정 시군구 커버 여부를 판정한다. status=SELF(자차)/CARRIER(외부 운송)/PICKUP_ONLY(산지 인도)/NEGOTIATE(미신고 — 결격 아님)/OUT_OF_RANGE(권역 밖·육로 미연결). unit_price_krw·qty_value·qty_unit 을 함께 주면 운임 포함 인도원가와 kg당 인도단가(원/kg)를 같이 계산한다. 좌표·읍면동·주소는 반환하지 않는다. 단위: distance_km_straight 는 킬로미터(km)이며 **예상 직선거리**입니다(도로거리·소요시간 아님). fee_estimate_krw 는 대한민국 원(KRW) 범위이고 정보가 부족하면 min·max 모두 null 입니다(0원 아님). max_load_kg 는 킬로그램(kg). 모든 배송 정보는 공급자 신고 기준이며 팜템포가 검증하지 않았습니다. 행정구역 경계: 통계청 SGIS(공공누리 제1유형) / 가공: vuski/admdongkor (CC BY 4.0)",
