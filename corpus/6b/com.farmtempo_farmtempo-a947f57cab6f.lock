        {
          "name": "predict_demand_for_item",
          "title": "수요 참고 추정 (Demand estimate, reference)",
          "description": "⚠️ 실제 매장 판매·주문 자료로 만든 예측이 아니라 규칙으로 만든 참고값입니다(method='rule-baseline-v1'). 사용자에게 수요 '예측'으로 말하지 말고 '규칙 기반 참고값'이라고 밝히세요. [AGENT_HONESTY 20261011]\n\n품목별 일자 수요량을 마트 거래 단위와 kg 환산으로 동시 반환.\n\n## 단위 정책\n각 수량 필드는 `trade_unit_value` + `trade_unit` + `kg_equivalent` 3중 표현. 외부 AI는 `kg_equivalent`로 정규화 계산, 마트 UI는 `trade_unit_value`로 표시. 환산 출처: KAMIS·가락시장 관행 표준.\n\n## mart_id\n현재 무시. 향후 매장별 모델 + 매장별 단위 환산 계수 오버라이드 예약 필드.\n\nReturns per-day demand forecast in dual units (trade + kg). Method is rule-based heuristic; ML migration planned.",
          "inputSchema": {
            "properties": {
              "horizon_days": {
                "default": 7,
                "description": "예측 기간(일). 1~30",
                "maximum": 30,
                "minimum": 1,
                "title": "Horizon Days",
                "type": "integer"
              },
              "item_code": {
                "description": "품목 한글명. 예: 배추, 무, 양파, 대파, 마늘, 오이, 감자, 생고추, 토마토",
                "title": "Item Code",
                "type": "string"
              },
              "mart_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "매장 식별자 (현재 무시, B2AI forward-compat)",
                "title": "Mart Id"
              }
            },
            "required": ["item_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
