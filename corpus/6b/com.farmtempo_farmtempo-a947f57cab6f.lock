        {
          "name": "get_wholesale_prices",
          "description": "**v2 신설 — 5대 원칙 #4 데이터 정규화 핵심 엔드포인트.** 9개 핵심 품목(배추·무·양파·대파·마늘·오이·감자·생고추·토마토)의 도매가를 품목당 1행 단일 스키마로 반환합니다.\n\n## 호출 메커니즘\n- KAMIS `dailyPriceByCategoryList` (도매: `p_product_cls_code=02`) 카테고리 200·100 두 번 호출 · 국가코드 비움 = 조사 도매시장(최대 5곳) 평균\n- 각 품목의 `(item_code, kind_code, rank_code)` 매칭으로 단일 행 추출\n- 도매 매칭 실패 품목은 `dailySalesList`(소매)로 자동 fallback\n\n## 핵심 필드\n- `today`, `yesterday`: 도매가 (KRW, KAMIS 단위 기준)\n- `unit`: KAMIS 도매시장 표준 단위 (예: '10kg', '100개')\n- `kg_per_unit`: 단위→kg 환산 계수 (품목 간 비교용)\n- `krw_per_kg`: **kg당 단가 (KRW/kg)** — 품목 간 직접 비교 가능한 정규화 가격\n- `kg_conversion_note`: 환산 근거 자연어 설명 (LLM 컨텍스트용)\n- `price_basis`: `\"wholesale\"` (도매 성공) / `\"retail_fallback\"` (소매 대체)\n- `as_of`: 실제 가격 기준일 (도매시장 마감 전이면 전일)\n- `kamis_item_code`, `kamis_kind_code`, `kamis_kind_name`, `kamis_rank`: 출처 추적용 메타필드\n- `coverage`: 9품목 중 도매/소매 fallback/누락 분포\n\n## /api/prices와의 차이\n- `/api/prices`: 소매가, 다중 단위 중복 가능 (대시보드 호환용)\n- `/api/prices/wholesale`: **도매가, 9품목, 정규화된 단일 스키마 (LLM/AI용)**\n\nReturns normalized wholesale prices (1 row per item) for 9 core items. Falls back to retail when wholesale unavailable (price_basis indicates source).",
          "inputSchema": {
            "properties": {
              "regday": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
