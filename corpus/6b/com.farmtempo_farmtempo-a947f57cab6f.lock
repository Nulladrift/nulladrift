        {
          "name": "calculate_margin",
          "description": "단일 품목의 원가(직납가)와 판매가로부터 원가율·마진율·마진액·자연어 평가를 반환합니다. 마트 영업 미팅·발주서 작성·B2AI 자동 발주 권고에 활용.\n\n## 파라미터\n- `cost_price` (query, required): 직납가 / 원가 (KRW)\n- `sell_price` (query, required, >0): 판매가 (KRW)\n- `item_name` (query, optional): 품목명 (한글, 응답에 echo)\n\n## assessment 임계값\n- ≥30% → '양호'\n- 15-30% → '보통'\n- <15% → '낮음 — 가격 재검토 권장'\n\nReturns single-item margin/cost rate with natural-language assessment.",
          "inputSchema": {
            "properties": {
              "cost_price": {
                "title": "Cost Price",
                "type": "number"
              },
              "item_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "title": "Item Name"
              },
              "sell_price": {
                "title": "Sell Price",
                "type": "number"
              }
            },
            "required": ["cost_price", "sell_price"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "Response Calculate Margin",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:5fd7e3100476c0ede277037927265c03f4a725fc0ab8e672c09687cbfa7af4e3"
        },
        {
          "name": "calculate_margin_bulk",
          "description": "여러 품목의 매입·판매 행을 일괄로 계산해 행별·총계 결과를 반환합니다. HTML 원가율 계산기 탭의 calcRow + totals 와 동일 출력.\n\n## Body 스키마\n```json\n{\"rows\": [{\"item\": \"배추\", \"buyPrice\": 1000, \"sellPrice\": 1500, \"qty\": 1}]}\n```\n\nReturns per-row + aggregated totals for bulk margin calculation.",
          "inputSchema": {
            "properties": {
              "rows": {
                "description": "품목별 매입·판매 행",
                "items": {
                  "properties": {
                    "buyPrice": {
                      "description": "직납가 / 원가 (원)",
                      "minimum": 0,
                      "title": "Buyprice",
                      "type": "number"
                    },
                    "item": {
                      "description": "품목명 한글 (예: 배추)",
                      "title": "Item",
                      "type": "string"
                    },
                    "qty": {
                      "default": 1,
                      "description": "수량 (기본 1)",
                      "exclusiveMinimum": 0,
                      "title": "Qty",
                      "type": "number"
                    },
                    "sellPrice": {
                      "description": "판매가 (원)",
                      "exclusiveMinimum": 0,
                      "title": "Sellprice",
                      "type": "number"
                    }
                  },
                  "required": ["buyPrice", "item", "sellPrice"],
                  "title": "_BulkRow",
                  "type": "object"
                },
                "minItems": 1,
                "title": "Rows",
                "type": "array"
              }
            },
            "required": ["rows"],
            "type": "object"
