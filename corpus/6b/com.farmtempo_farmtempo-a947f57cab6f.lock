        {
          "name": "get_weather_price_correlation",
          "description": "**특허 #1 기상×가격 매입 타이밍 추천 시스템의 핵심 데이터.** 11년치(2015~2025) KAMIS 가격 + 기상청 ASOS 데이터로 산출한 품목별·월별 피어슨 상관계수 매트릭스.\n\n## 핵심 필드\n- `yearly_corr[품목][기상변수]`: `{r, p, n, significant}` 객체\n  - `r`: 피어슨 상관계수 (-1 ~ +1)\n  - `p`: p-value (0.05 미만이면 통계적 유의)\n  - `significant`: p<0.05 + |r|>=0.7 동시 충족\n- `alert_triggers`: 사전 정의된 경보 규칙 14개\n\nMonthly weather-price Pearson correlation matrix (Patent #1 core data).",
