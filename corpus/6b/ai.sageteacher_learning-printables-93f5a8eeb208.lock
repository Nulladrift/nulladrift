{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sageteacher/learning-printables": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.sageteacher.ai/mcp/printables"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sage-learning-printables",
        "title": "Sage Learning Printables",
        "version": "1.0.0",
        "description": "Free printable learning pages for children ages 4-8, for parents and teachers.",
        "websiteUrl": "https://www.sageteacher.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free printable learning pages from Sage Teacher for parents and teachers of children ages 4-8 (grades K-2). Everything in this catalog is free to print, with no sign-in.\n\nThe catalog has Sage's daily color-by-number math printables, each inspired by a day in history: an event, an invention, a work of art, a feast day or a holiday. Use search_printables to find sheets by topic words, tag or date (today=true for today's sheet), and get_printable for one sheet's full details.\n\nGive the adult the pageUrl: that page has Print and Download buttons. imageUrl is the full worksheet PNG with its color key. These pages are for an adult to print for a child; speak to the parent or teacher, not to the child.",
      "tools": [
        {
          "name": "get_printable",
          "title": "Get a printable",
          "description": "Get one printable by the id from search_printables: its title, the day in history it marks, the short story printed with it, its color key, and links to print or download it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "An id from search_printables, like 2026-10-31/halloween-all-hallows-eve.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80778cbd103175416f6f26b1aec6bb94d473a3eac3c4b46f47e58a58272c416c"
        },
        {
          "name": "search_printables",
          "title": "Search printables",
          "description": "Search Sage's free color-by-number math printables for ages 4-8 (grades K-2). Newest first when browsing, most relevant first with a query. Each result has an id for get_printable, a pageUrl to print or download from, and imageUrl, the worksheet PNG. Pass nextCursor back as cursor for more.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous call, for the next page.",
                "maxLength": 200,
                "type": "string"
              },
              "date": {
                "description": "Only the sheet(s) for this publish date, YYYY-MM-DD.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum printables to return. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the title, topic, tags, historical event and description, like 'moon landing' or 'saints'. Omit to browse.",
                "maxLength": 200,
                "type": "string"
              },
              "tag": {
                "description": "Only sheets with this topic tag: moments-in-history (Moments in History), inventions-and-discoveries (Inventions & Discoveries), faith (Faith), art (Art), natural-science (Natural Science), holidays-and-traditions (Holidays & Traditions).",
                "enum": ["moments-in-history", "inventions-and-discoveries", "faith", "art", "natural-science", "holidays-and-traditions"],
                "type": "string"
              },
              "today": {
                "description": "Only today's sheet(s), by the date in New York.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e18968cc14365133dcb485a0fe1792a1e2650bc55321f01312e8e3d3badf382"
        }
      ],
      "digest": "sha256:07465c21741b1d8b9055ac63022ba2d2af823be29de1092699872e9d933356cb"
    }
  }
}
