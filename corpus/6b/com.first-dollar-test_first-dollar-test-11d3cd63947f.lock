          "digest": "sha256:eba315db031d1864b8e2cf1b11aecf2ab5261d1f15044d0ece978ac004260371"
        },
        {
          "name": "poll_run",
          "title": "Poll the original run",
          "description": "Read payment, challenge, verdict and outgoing transfer state using the private run capability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
