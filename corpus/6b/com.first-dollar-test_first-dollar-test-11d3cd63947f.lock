{
  "lockfileVersion": 2,
  "subjects": {
    "com.first-dollar-test/first-dollar-test": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.first-dollar-test.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "first-dollar-test",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read live terms. Save your private clientToken and create/submission idempotency keys before calls. Create an unpaid run, obtain its unsigned quote, then use your own wallet to authorize at most that quoted payment. enroll submits only your supplied x402 signature. A 202 or timeout is unknown/pending: poll the same run and receipt, never assume failure or create a replacement payment. Only finalized chain evidence proves reward/refund. MCP access proves transport use; it does not prove Registry discovery or autonomous provenance.",
      "tools": [
        {
          "name": "create_run",
          "title": "Create an unpaid run",
          "description": "Creates no payment. Save clientToken and idempotencyKey first. Registry/autonomy fields are caller claims only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientToken": {
                "description": "Private run capability: generate and save 32 random bytes before creating a run. Never put it in a URL or public trace.",
                "pattern": "^[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "discovery": {
                "additionalProperties": false,
                "description": "Optional caller claims. MCP transport does not prove Registry discovery or autonomous intent.",
                "properties": {
                  "mode": {
                    "enum": ["autonomous", "human_handoff", "unknown"],
                    "type": "string"
                  },
                  "selfReportedChannel": {
                    "enum": ["google", "mcp_registry", "a2a", "x402_discovery", "direct_url", "human_handoff", "unknown"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "idempotencyKey": {
                "description": "Persist 8–128 safe characters before calling. Reuse the key with the identical request after a timeout.",
                "pattern": "^[A-Za-z0-9_-]{8,128}$",
                "type": "string"
              },
              "termsVersion": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["clientToken", "idempotencyKey", "termsVersion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a458a0cf9d4a75ea3e1249a52c4a855c3b875d2428124cb1f6a19958b8503af"
        },
        {
          "name": "enroll",
          "title": "Submit a caller-authorized x402 payment",
          "description": "Financial action: forwards your existing PAYMENT-SIGNATURE for this exact run. Does not sign, fund a wallet or create a new authorization. Poll the same run after pending/unknown outcomes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientToken": {
                "description": "Private run capability: generate and save 32 random bytes before creating a run. Never put it in a URL or public trace.",
                "pattern": "^[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "paymentSignature": {
                "description": "Caller-created x402 v2 PAYMENT-SIGNATURE value for this run. This tool submits the provided authorization; it never signs or chooses a wallet.",
                "maxLength": 24576,
                "minLength": 1,
                "type": "string"
              },
              "runId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["clientToken", "paymentSignature", "runId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d5dfb33edda9362cb3354ea264c47525a24fd71ff15a8cff9e3534109267126"
        },
        {
          "name": "get_opportunity",
          "title": "Read live First Dollar Test terms",
          "description": "Free current admission, network, price, reward/refund policy and wallet requirements. Read before creating or paying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1060300de6019c8058e1f1752130b18926c63431003ebac4ac88cb18ecdebb11"
        },
        {
          "name": "get_payment_quote",
          "title": "Get an unsigned x402 quote",
          "description": "Returns the existing HTTP 402 body and PAYMENT-REQUIRED header without a signature or charge. A paid/pending run returns its original state.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clientToken": {
                "description": "Private run capability: generate and save 32 random bytes before creating a run. Never put it in a URL or public trace.",
                "pattern": "^[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "runId": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["clientToken", "runId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
