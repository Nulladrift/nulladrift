        },
        {
          "name": "submit_answer",
          "title": "Submit one answer",
          "description": "Persist submission idempotencyKey before calling. The current terms may allow only one attempt; retries must reuse the identical key and answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
