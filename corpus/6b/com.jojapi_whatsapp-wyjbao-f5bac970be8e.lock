{
  "lockfileVersion": 2,
  "subjects": {
    "com.jojapi/whatsapp-wyjbao": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.jojapi.com/whatsapp-wyjbao"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi-whatsapp-wyjbao",
        "title": "WhatsApp API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of WhatsApp on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/whatsapp-wyjbao/pricing · Docs: https://jojapi.com/hub/api/whatsapp-wyjbao",
      "tools": [
        {
          "name": "get_v1_channel",
          "title": "Get Channel",
          "description": "A WhatsApp channel by its invite link or code: name, description, follower count (`channelMetadata.size`), verification, creation time and settings. Looking does not follow the channel. Group: Channels. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The channel's link (`https://whatsapp.com/channel/…`) or just its code.",
                "example": "https://whatsapp.com/channel/0029VaAb12Cd34Ef56Gh78Ij90",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af7afa8682e3bae68d52295670399fe52193237ac488008c8751b45b175362af"
        },
        {
          "name": "get_v1_channel_messages",
          "title": "Get Channel Posts",
          "description": "The latest posts of a WhatsApp channel, newest last, with their text, type, time, links and whether they carry media. Does not follow the channel. Group: Channels. Billing per call: 2 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The channel's link (`https://whatsapp.com/channel/…`) or just its code.",
                "example": "https://whatsapp.com/channel/0029VaAb12Cd34Ef56Gh78Ij90",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many of the latest posts to return, 1–100. Default 20.",
                "type": "integer"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:af8de22ba7feb5cf6d1574bfabed74c5173247a26bc0b960bc67ea8a21310db1"
        },
        {
          "name": "get_v1_channels_search",
          "title": "Search Channels",
          "description": "WhatsApp's channel directory: channels whose name matches `query`, in the countries asked for, or without a query the directory's recommended, trending, popular or new channels. Each channel comes with its follower count, verification, description and invite code (use it with Get Channel and Get Channel Posts). Channels the lookup account follows are not listed. Group: Channels. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country codes, comma-separated (up to 10). Default `US`.",
                "example": "TR,DE",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many channels to return, 1–50. Default 20.",
                "type": "integer"
              },
              "query": {
                "description": "Text to look for in channel names, up to 100 characters. Without it, `view` decides what is listed.",
                "example": "news",
                "type": "string"
              },
              "view": {
                "default": "recommended",
                "description": "Which directory list to browse when there is no query.",
                "enum": ["recommended", "trending", "popular", "new"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a45315d1dc31b46bec5c403b6327e9a10a95f0e483e044bff51650efd747b941"
        },
        {
          "name": "get_v1_group_invite",
          "title": "Get Group by Invite Link",
          "description": "What WhatsApp shows anyone who opens a group's invite link: the group's name (`subject`) and description with who set them and when, its size, creation time and creator's country, its settings (announcements only, admin-only edits, join approval), the owner, and a few participants with their phone numbers. Looking does not join the group. A code that is wrong, revoked or expired answers 404 `not_found`. Group: Groups. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The invite link (`https://chat.whatsapp.com/…`) or just its code.",
                "example": "https://chat.whatsapp.com/Ab12Cd34Ef56Gh78Ij90Kl",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe3cc31e6c2576de415eb411e733929ab6dec8b68931257796399a5094f9bae7"
        },
        {
          "name": "get_v1_number_check",
          "title": "Check Number",
          "description": "Whether a phone number has a WhatsApp account, and its WhatsApp id. A number without an account is a normal answer (`registered: false`), not an error. Group: Numbers. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "phone": {
                "description": "The phone number in international format with its country code, e.g. `+14155550123`. Spaces, dashes, brackets, a leading `00` or the WhatsApp id form (`14155550123@c.us`) are accepted.",
                "example": "+14155550123",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c2558d891cefc72e696fa99763b328e33c4af4acd90c0bc96668265305e574d"
        },
        {
          "name": "get_v1_number_profile",
          "title": "Get Profile",
          "description": "Everything WhatsApp shows about the account on a phone number: the contact (`pushname`, the name the person set; `isBusiness`, `verifiedName` and, for business accounts, `businessProfile` with description, categories, website, email, address, opening hours and linked Facebook/Instagram), the about text, the profile picture URL, the account's LID and the number of devices it uses (phone plus WhatsApp Web/desktop). `about` and `profile_picture_url` are `null` when the person hides or never set them; picture URLs expire after a while. A part that could not be read is `null` and named in `unavailable`. A number with no WhatsApp account answers 404 `not_registered`. Group: Numbers. Billing per call: 3 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "phone": {
                "description": "The phone number in international format with its country code, e.g. `+14155550123`. Spaces, dashes, brackets, a leading `00` or the WhatsApp id form (`14155550123@c.us`) are accepted.",
                "example": "+14155550123",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:85f60699b60b8ef10eb60172475587c400e8b6e23b9f07bde27e1d62e871f393"
        }
      ],
      "digest": "sha256:c0351b420cbdcc50d1b13117e7ba1fd8e9aad88b0bdf551aa7ad2f162eca13a5"
    }
  }
}
