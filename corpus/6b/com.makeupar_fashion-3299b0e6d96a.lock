          "name": "AI-Bracelet-Virtual-Try-On",
          "title": "Ai Bracelet Virtual Try On",
          "description": "The Ultimate AI Bracelet Virtual Try-On\nEmploy AI-powered solutions to assist your customers with online purchases, ensuring perfect fit and great shopping satisfaction every time. Only One 2D Image Needed.\nCreate a compelling shopping flow with the hyper-realistic bracelet virtual try-on experiences. Our solution caters to the needs of jewelry brands of all sizes. Opt for 2D images for effortless yet high-quality virtual try-on experiences with minimal effort. This unique feature sets us apart in the world of e-commerce, making it easier than ever for customers to experience your products.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "polling": {
