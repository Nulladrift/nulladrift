        {
          "name": "File-Upload",
          "title": "File upload",
          "description": "Interactive drag-and-drop widget for uploading images (JPEG, PNG) or videos (MP4). Returns file IDs for YouCam AI tools (AI-Fabric, AI-Cloth, AI-Makeup-Vto, AI-Hairstyle-Generator, AI-Skin-Analysis, etc.). /n Use when the user wants to upload or select an image/video (e.g. upload, drag & drop, choose file, pick image/video), or before any AI-* tool requiring src_file_id or ref_file_id when no file ID or URL is available. /n Also use as the mandatory fallback whenever Get-Upload-API-Info cannot complete the upload for any reason (including network restrictions, host_not_allowed, or other failures). Uploads directly from the browser, bypassing sandbox egress restrictions.",
          "inputSchema": {
            "additionalProperties": false,
