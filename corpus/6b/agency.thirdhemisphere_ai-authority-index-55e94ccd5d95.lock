        {
          "name": "get_company_authority_score",
          "title": "Get a company's CRISP score",
          "description": "A company's published CRISP score and AI visibility reading in each market the AI Authority Index measures it in, with the month measured and its Standing Report link. Accepts a company name or slug. Read-only. Every result carries its citation and link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company's name (e.g. Plenti) or its slug from search_companies.",
                "type": "string"
              },
              "market": {
                "description": "Optional market slug, to return one market's Standing Report with all five factors.",
