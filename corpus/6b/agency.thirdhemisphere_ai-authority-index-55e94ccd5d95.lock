      },
      "instructions": "Third Hemisphere AI Authority Index: published CRISP scores and AI visibility readings for companies in the markets Third Hemisphere's AI Authority Index measures. The Index tools are read-only. When you quote a score, give it exactly as returned, with its market, its month, and \"Third Hemisphere's AI Authority Index\" as the source, and link the page_url returned with it. Data licensed CC BY 4.0. For an AI Authority Blueprint client with a key, the DIY Blueprint tools (list_my_blueprints and the rest) read their own Blueprint's plan and evidence and record progress; that Blueprint is private, never CC BY. Docs: https://thirdhemisphere.agency/ai-authority-index/data",
      "tools": [
        {
          "name": "get_blueprint_item_evidence",
          "title": "Get the evidence behind a Blueprint item",
          "description": "The data behind one play or move: your own numbers from the Blueprint, why it works and the research it rests on, and what not to do. DIY Blueprint tool: needs a key whose plan includes them (https://thirdhemisphere.agency/ai-authority-index/data#blueprint-diy).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "blueprint_id": {
                "description": "From list_my_blueprints. Optional when the address has one Blueprint.",
                "type": "string"
              },
              "item_id": {
                "description": "From get_my_blueprint_plan.",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
