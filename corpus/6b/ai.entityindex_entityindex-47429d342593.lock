      "instructions": "Also all restaurants in Andorra (open data + verified records): search_restaurants, get_restaurant. Data licence CC BY 4.0, attribution: entityindex.ai — MERX TECHNOLOGIES, SLU. Read-only index of accommodation in Andorra. Use search_hotels, then get_hotel (or the generic search_entities / get_entity with vertical='hotels'; list_verticals shows what exists). Send users to booking_link (official site); entityindex.ai never books. Facts come only from each property's official website (automatic check 2026-10-16); each verified fact carries its source URL. entityindex.ai does not book or charge and has no prices, photos or availability: send the user to booking_link (redirects to the official website with src=entityindex) to check price and availability.",
      "tools": [
        {
          "name": "get_entity",
          "title": "Get one entity record (generic)",
          "description": "Generic record lookup: vertical + slug (from search_entities). Same output as the vertical-specific get tool (e.g. get_hotel). Example: {\"vertical\":\"hotels\",\"slug\":\"hotel-nordic\"}.",
