            "additionalProperties": false,
            "properties": {
              "country": {
                "enum": ["andorra"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of labels, note and record page URL (en, es, fr, ca)",
                "enum": ["en", "es", "fr", "ca"],
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "vertical": {
                "enum": ["hotels", "restaurants"],
                "type": "string"
              }
            },
            "required": ["slug", "vertical"],
            "type": "object"
          },
