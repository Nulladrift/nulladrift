        {
          "name": "search_entities",
          "title": "Search any vertical (generic)",
          "description": "Generic search across entityindex.ai verticals; same data as the vertical-specific tools. Verticals: 'hotels' and 'restaurants' (country 'andorra'); call list_verticals to see what exists. Parameters: vertical (required), country, area, query, filters (vertical-specific verified booleans; for hotels: spa, pool, parking, pets, ski_in_out, family, plus min_stars and type), limit. Example: {\"vertical\":\"hotels\",\"area\":\"Soldeu\",\"filters\":{\"ski_in_out\":true}}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "type": "string"
              },
              "country": {
                "enum": ["andorra"],
                "type": "string"
              },
              "filters": {
                "additionalProperties": true,
                "description": "Vertical-specific filters (see list_verticals)",
                "type": "object"
              },
              "lang": {
                "default": "en",
                "description": "Language of labels, note and record page URL (en, es, fr, ca)",
                "enum": ["en", "es", "fr", "ca"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "vertical": {
                "enum": ["hotels", "restaurants"],
                "type": "string"
              }
            },
            "required": ["vertical"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
