        {
          "name": "search_hotels",
          "title": "Find hotels in Andorra by area and verified amenities",
          "description": "Use this when a user asks for accommodation in Andorra, e.g. 'ski-in/ski-out hotel in Grandvalira', 'hotel with spa in Andorra', 'pet-friendly hotel in Canillo', 'family hotel in Soldeu or El Tarter', 'hotel with parking in Pas de la Casa'. Coverage today: parishes Canillo (Soldeu, El Tarter, Canillo village), Encamp (Pas de la Casa, Encamp village) and Andorra la Vella. Filters: area (parish or locality, or 'Grandvalira'), type (hotel, apartamentos, hostel), min_stars (category stated on the official site), and amenity filters spa, pool, parking, pets, ski_in_out, family. true = the official website explicitly says so; false = it explicitly says no; properties with unknown values are excluded when a filter is set. Grandvalira ski villages are Soldeu, El Tarter, Canillo, Encamp and Pas de la Casa. Each result includes verified_facts (value + source URL + date), the record page, and booking_link (official website with src=entityindex). No prices, photos or availability: always tell the user to confirm on the official site and cite 'entityindex.ai (CC BY 4.0)'. Examples: {\"area\":\"Soldeu\",\"ski_in_out\":true} · {\"spa\":true} · {\"pets\":true,\"area\":\"Canillo\"} · {\"family\":true,\"area\":\"El Tarter\"} · {\"parking\":true,\"area\":\"Pas de la Casa\"} · {\"query\":\"nordic\"}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "Parish or locality, e.g. 'Soldeu', 'El Tarter', 'Pas de la Casa', 'Canillo', 'Andorra la Vella'. Also 'Grandvalira' for its ski villages.",
                "type": "string"
              },
              "family": {
                "description": "Family rooms, kids club or play area (verified)",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Language of labels, note and record page URL (en, es, fr, ca)",
                "enum": ["en", "es", "fr", "ca"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_stars": {
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "parking": {
                "description": "Parking or garage (verified)",
                "type": "boolean"
              },
              "pets": {
                "description": "Pets allowed (true) or explicitly not allowed (false)",
                "type": "boolean"
              },
              "pool": {
                "description": "Swimming pool (verified)",
                "type": "boolean"
              },
              "query": {
                "description": "Free text on name, locality or parish",
                "type": "string"
              },
              "ski_in_out": {
                "description": "Official site literally says ski-in/ski-out or 'a pie de pista'",
                "type": "boolean"
              },
              "spa": {
                "description": "Own spa/wellness, sauna or jacuzzi (verified on official site)",
                "type": "boolean"
              },
              "type": {
                "enum": ["hotel", "apartamentos", "hostel"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ai.entityindex/description_i18n": {
              "ca": "Cerca allotjament a Andorra per zona i serveis verificats (spa, piscina, pàrquing, mascotes, a peu de pista, famílies). Retorna dades verificades amb font i enllaç de reserva oficial.",
              "en": "Find hotels in Andorra by area and verified amenities",
              "es": "Busca alojamiento en Andorra por zona y servicios verificados (spa, piscina, parking, mascotas, a pie de pista, familias). Devuelve datos verificados con fuente y enlace de reserva oficial.",
              "fr": "Recherche d'hébergements en Andorre par zone et services vérifiés (spa, piscine, parking, animaux, skis aux pieds, familles). Renvoie des données vérifiées avec source et lien de réservation officiel."
            }
          },
          "digest": "sha256:36064952e0417b3d5913275a2b13a1ad5483e05ac5ad8f0d57a03f942b17783e"
        },
        {
          "name": "search_restaurants",
          "title": "Find restaurants in Andorra (parish, ski area, cuisine, open now, diet, reservations…)",
          "description": "Use this when a user asks where to eat in Andorra, e.g. 'restaurant open now in Soldeu', 'Andorran cuisine in Canillo', 'restaurant on the slopes in Grandvalira', 'vegetarian options in Andorra la Vella', 'pizza in Pas de la Casa', 'restaurant that takes reservations in Escaldes'. Index of all restaurants in Andorra built from open data (OpenStreetMap, ODbL) and official websites; each record has a level: basica (public data, not confirmed), verificada (confirmed by the restaurant: menu, hours, booking link) or cliente (enriched and SPONSORED, always flagged). Order: filter relevance, then completeness, then name — never paid. Unknown values are excluded when a filter is set unless include_unknown=true. No prices or ratings: tell the user to confirm with the restaurant and cite 'entityindex.ai'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accepts_reservations": {
                "type": "boolean"
              },
              "country": {
                "default": "andorra",
                "enum": ["andorra", "spain", "all"],
                "type": "string"
              },
              "cuisine": {
                "description": "andorran, mountain, pizza, italian, spanish, tapas, grill, steak_house, french, japanese…",
                "type": "string"
              },
              "gluten_free": {
                "type": "boolean"
              },
              "groups": {
                "type": "boolean"
              },
              "include_unknown": {
                "default": false,
                "type": "boolean"
              },
              "kids": {
                "type": "boolean"
              },
              "language": {
                "type": "string"
              },
              "level": {
                "enum": ["basica", "verificada", "cliente"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 300,
                "minimum": 1,
                "type": "integer"
              },
              "locality": {
                "description": "e.g. Soldeu, El Tarter, Pas de la Casa, Arinsal",
                "type": "string"
              },
              "on_slope": {
                "type": "boolean"
              },
              "open_now": {
                "description": "Open now (Europe/Andorra time), from published hours",
                "type": "boolean"
              },
              "open_on": {
                "enum": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                "type": "string"
              },
              "parish": {
                "description": "Andorra la Vella, Canillo, Encamp, Escaldes-Engordany, La Massana, Ordino, Sant Julià de Lòria",
                "type": "string"
              },
              "price_range": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "reservation_channel": {
                "enum": ["phone", "online", "whatsapp"],
                "type": "string"
              },
              "season": {
                "description": "winter, summer, all year",
                "type": "string"
              },
              "ski_access": {
                "type": "boolean"
              },
              "ski_area": {
                "enum": ["Grandvalira", "Pal Arinsal", "Ordino Arcalís"],
                "type": "string"
              },
              "vegetarian": {
                "type": "boolean"
              }
            },
            "type": "object"
          },
