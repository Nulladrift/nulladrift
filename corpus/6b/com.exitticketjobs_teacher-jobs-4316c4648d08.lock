        },
        {
          "name": "search_jobs",
          "title": "Search jobs for former teachers",
          "description": "Search remote and non-classroom jobs for teachers leaving the classroom on Exit Ticket (https://exitticketjobs.com). Filter by kind of work, US state and fully remote. Returns counts for every match (total_matching, free_preview_matching, locked_matching) and the free preview listings that match, in full: title, employer, posted pay, work mode, location, states, sector and a link to the listing page. Listings outside the free preview are counted only; a plan on the site shows their employer, pay and apply link. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many free preview listings to return, 1 to 20. Default 10. Counts always cover every match.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "remote_only": {
                "default": false,
                "description": "Only fully remote listings (work mode remote). Default false.",
                "type": "boolean"
              },
              "role": {
                "description": "Kind of work. One of: instructional-design (Instructional design), training (Training and L&D), curriculum (Curriculum and content), customer-success (Customer success), sales (Ed-tech sales), program (Programs and advising), online-teaching (Online teaching).",
                "enum": ["instructional-design", "training", "curriculum", "customer-success", "sales", "program", "online-teaching"],
                "type": "string"
              },
              "state": {
                "description": "A US state as a 2-letter code (\"TX\") or full name (\"Texas\"), any case. Matches listings that name the state, plus remote listings open across the US.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
