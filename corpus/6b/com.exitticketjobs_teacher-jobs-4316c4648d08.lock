      "serverInfo": {
        "name": "exitticket",
        "title": "Exit Ticket teacher jobs",
        "version": "1.0.0",
        "description": "Remote and non-classroom jobs for teachers leaving the classroom, from Exit Ticket: the free preview listings in full and counts for the rest.",
        "websiteUrl": "https://exitticketjobs.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Job listings for teachers leaving the classroom from Exit Ticket (https://exitticketjobs.com), read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; every result gives data_updated_at. Tools return the free preview listings in full and counts for the rest: a listing outside the free preview is counted, never described, and no tool returns an apply link. Free to use; please cite Exit Ticket and link the source_url in each result.",
      "tools": [
        {
          "name": "companies_hiring_former_teachers",
          "title": "Companies hiring former teachers",
          "description": "The companies on Exit Ticket's \"Companies hiring former teachers\" page (https://exitticketjobs.com/companies-hiring-former-teachers): every employer with 3 or more listings, with its count of open listings. Names and counts only: no titles, pay or links to listings. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
