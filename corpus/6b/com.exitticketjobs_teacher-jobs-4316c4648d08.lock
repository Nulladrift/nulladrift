        },
        {
          "name": "job_board_info",
          "title": "About Exit Ticket",
          "description": "About Exit Ticket (https://exitticketjobs.com): what the job board is, where its data comes from, totals (listings, employers, remote, hybrid, listings with posted pay, free preview size), what is free and what a plan adds, the plan prices and refund rule as the pricing page prints them, and the links to the developer docs, MCP URL and OpenAPI spec. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
