        {
          "name": "employer_counts",
          "title": "Employers hiring teachers",
          "description": "Which employers have jobs for former teachers on Exit Ticket (https://exitticketjobs.com) and how many open listings each has, optionally for one US state. Names and counts only: no titles, pay or links to listings. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at. When an employer's feed does not answer we keep its listings. Each carries last_seen, the last day it was really seen, and goes once the feed has been down for several days.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
