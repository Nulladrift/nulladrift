        {
          "name": "list_roles",
          "title": "List kinds of work",
          "description": "List the kinds of work on Exit Ticket (https://exitticketjobs.com) with how many listings each has and how many are fully remote, plus listing counts by work mode. Counts only, from the board's current data file. Data is re-read from employers' own career sites (Workday, Greenhouse, Lever, Ashby) when the board is rebuilt; each result gives data_updated_at.",
          "inputSchema": {
            "properties": {},
