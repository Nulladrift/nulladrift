        {
          "name": "request_sales_call",
          "title": "Book an intro call",
          "description": "Submit a brand's details to MadBroad's sales team (the same form as madbroad.co/book-meeting) and get a link to pick a time for the intro call. Only use details the person has provided.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "The brand, its website, and what it sells",
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "description": "Contact's work email",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "interview_start": {
                "description": "When the brand could start on street interviews",
                "enum": ["Now", "Within 30 days", "30 days or more", "Next quarter or later"],
                "type": "string"
              },
              "marketing_spend": {
                "description": "Approximate monthly marketing spend",
                "enum": ["Under $20k /mo", "$20–50k /mo", "$50–100k /mo", "$100–500k /mo", "$500k+ /mo"],
                "type": "string"
              },
              "monthly_revenue": {
                "description": "Approximate monthly revenue",
                "enum": ["Less than $50k /mo", "$50k–$100k /mo", "$100k–$500k /mo", "$500k–$1M /mo", "$1M+ /mo"],
                "type": "string"
              },
              "name": {
                "description": "Contact's full name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Contact's phone number",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "name", "phone"],
            "type": "object"
          },
