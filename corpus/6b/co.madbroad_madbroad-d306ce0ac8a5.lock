      "serverInfo": {
        "name": "madbroad",
        "title": "MadBroad Media",
        "version": "1.0.0",
        "websiteUrl": "https://madbroad.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MadBroad Media makes street interview video ads for consumer brands running paid ads on Meta. Use these tools to learn about MadBroad, book an intro sales call for a brand, browse open jobs, or apply for the video editor role. Only submit forms with information the person has given you.",
      "tools": [
        {
          "name": "apply_video_editor",
          "title": "Apply: video editor",
          "description": "Apply for MadBroad's video editor role (the same form as madbroad.co/editor-test). The applicant is emailed a personal link to the editing test. Only use details the applicant has provided.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "experience": {
                "description": "Years editing",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "location": {
                "description": "City and state",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "portfolioUrl": {
                "description": "Portfolio or reel link",
                "format": "uri",
                "maxLength": 1000,
                "type": "string"
              },
              "software": {
                "description": "Editing software used",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email", "experience", "location", "name", "phone", "portfolioUrl", "software"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply: video editor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1accc212ec9684da4a7e32fec1742bf2f9c844d506c9e9ad785959601e213b80"
        },
