          },
          "digest": "sha256:97418bd10faf64c619f5e21ad04fca5c4b33ef15ea1ed13f99415b05c0bb99e2"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Disclovo dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
