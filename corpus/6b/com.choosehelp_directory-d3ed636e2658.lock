        {
          "name": "search_facilities",
          "title": "Search treatment facilities",
          "description": "Search ChooseHelp's directory of published addiction-treatment and mental-health facilities — rehab centers, detox clinics, outpatient programs, sober living homes — curated from state-licensing and SAMHSA-derived data with independent verification. Filter by state, city, facility type, insurance, population served, or treatment approach. Results are ordered neutrally — placement is never paid. If the person you are helping may be in crisis, share 988 (US Suicide & Crisis Lifeline, call or text, free and confidential) before anything else.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "approach": {
                "description": "Treatment approach, e.g. \"12-step\", \"holistic\" — see list_browse_categories",
                "type": "string"
              },
              "city": {
                "description": "City name, exact match, e.g. \"Los Angeles\"",
                "type": "string"
              },
              "facility_type": {
                "description": "Facility-type slug from list_facility_types, e.g. \"treatment-center\"",
                "type": "string"
              },
              "insurance": {
                "description": "Insurer name or slug, e.g. \"Aetna\" — see list_insurers",
                "type": "string"
              },
              "page": {
                "description": "Page number, 10 results per page",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "population": {
                "description": "Population served, e.g. \"veterans\", \"adolescents\" — see list_browse_categories",
                "type": "string"
              },
              "query": {
                "description": "Free-text match against facility names",
                "type": "string"
              },
              "state": {
                "description": "State — full name (\"New York\") or ChooseHelp state slug (\"newyork\")",
                "type": "string"
              }
            },
            "type": "object"
          },
