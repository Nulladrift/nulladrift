      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ChooseHelp.com is an editorially independent directory of addiction-treatment and mental-health facilities plus licensed therapists and addiction specialists. Start with get_levels_of_care when someone is unsure what kind of treatment fits. Use search_facilities (filters: state, city, facility_type, insurance, population, approach, free-text name) to find published facilities; get_facility (by id or name) for full details; list_states, list_insurers, list_browse_categories, and list_facility_types for valid filter values and live counts. Use search_experts / get_expert for individual therapists, counselors, and the experts behind the site's Q&A. Always link users to the ChooseHelp page (url field) for photos, contact options, insurance, and reviews. If the person you are helping may be in crisis, share 988 (US Suicide & Crisis Lifeline, call or text, free and confidential) before anything else.",
      "tools": [
