        {
          "name": "list_appointments",
          "title": "List a patient's or a day's appointments",
          "description": "Use this when someone asks when a patient is booked, or what is booked at the clinic on a given day. Returns appointment ids with patient, clinic and provider ids, times, status, edit time and how many procedures each has, latest first, up to 100. Not for counting how busy days are, nor for procedure names, notes or any medical detail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clinicId": {
                "description": "Only appointments at this clinic, by an id from list_clinics; every clinic when absent",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "endTime": {
                "description": "Only appointments ending before this ISO 8601 time",
                "maxLength": 32,
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of appointments to return (default 20, maximum 100)",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "integer"
              },
              "patientId": {
                "description": "Only appointments of this patient, by an id from find_patient",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "startTime": {
                "description": "Only appointments starting at or after this ISO 8601 time. Without a patientId, give a startTime and endTime at most one day apart",
                "maxLength": 32,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointments": {
                "description": "Appointments, latest start first. Procedure names, notes, reminders, patient names and contact details are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clinicId": {
                      "anyOf": [
                        {
                          "pattern": "^[0-9a-f]{24}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "endTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "pattern": "^[0-9a-f]{24}$",
                      "type": "string"
                    },
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Version to pass as expectedLastEditTime when moving or cancelling it"
                    },
                    "patientId": {
                      "anyOf": [
                        {
                          "pattern": "^[0-9a-f]{24}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "procedureCount": {
                      "description": "How many procedures it has; never which",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "providerIds": {
                      "description": "Doctors, nurses or assistants booked on it, as list_providers ids",
                      "items": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "startTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "status": {
                      "anyOf": [
                        {
                          "enum": ["REQUESTED", "SCHEDULED", "PATIENT_ARRIVED", "NO_SHOW", "CANCELED"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["clinicId", "endTime", "id", "lastEditTime", "patientId", "procedureCount", "providerIds", "startTime", "status"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "count": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "hasMore": {
                "type": "boolean"
              }
            },
            "required": ["appointments", "count", "hasMore"],
            "type": "object"
          },
          "annotations": {
