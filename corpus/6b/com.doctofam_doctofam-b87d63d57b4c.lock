        {
          "name": "find_patient",
          "title": "Find a patient by name",
          "description": "Use this when someone names a patient to book, move, cancel or update. Returns up to 5 patients whose name contains every word given, with their ids and clinic; the last two phone digits appear only to tell namesakes apart. Not for browsing, counting or reading patient records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clinicId": {
                "description": "Only patients of this clinic; every clinic of the account when absent",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "search": {
                "description": "The patient's name as the user gave it, or part of it. Every word must appear in the stored name, in any order, ignoring case and accents.",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "patients": {
                "description": "The patients whose name matches, with the ids the other tools take. Contact details, dates of birth, notes and clinical records are never returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "clinicId": {
                      "anyOf": [
                        {
                          "pattern": "^[0-9a-f]{24}$",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "pattern": "^[0-9a-f]{24}$",
                      "type": "string"
                    },
                    "lastEditTime": {
