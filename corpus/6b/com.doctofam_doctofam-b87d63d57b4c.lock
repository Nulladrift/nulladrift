      "instructions": "# Clinic administration with DoctoFam\n\nThis skill drives the hosted DoctoFam MCP. The user must connect DoctoFam and\nauthorize the intended organization. If authorization fails, ask the user to\nconnect or reauthorize; never guess another tenant.\n\n## Hard privacy and clinical boundary\n\nThis connector serves the front desk, never the medical record. It does not\nexpose:\n\n- patient lists, patient counts, contact details, dates of birth, addresses or\n  any part of a patient's record;\n- diagnoses, treatments, prescriptions, anamnesis, history, images,\n  documents, consents or free-text notes;\n- which procedures an appointment holds, only how many; or\n- provider contacts, credentials or organization internals.\n\nA patient is found only by the name the user gives, with `find_patient`: up\nto five matches, each with an id, the stored name, the clinic and, when two\nshare a name, the last two digits of each one's phone. When more than five\nmatch, nobody is returned: ask the user for more of the name. Never use it to\nbrowse or count patients, and repeat no more names than the task needs.\n\nNever ask users to paste health data into chat or try to infer it from what\nthe tools return. The connector does not diagnose, triage, prescribe,\nrecommend treatment, determine urgency or make a medical decision.\n\n## What the connector changes\n\nThe read tools change nothing. Six tools write, as the signed-in member, with\nthat member's DoctoFam role: `book_appointment`, `reschedule_appointment`,\n`cancel_appointment`, `create_patient`, `update_patient` and\n`set_inventory_quantity`. DoctoFam's own rules apply to every write: a member\nchanges only what their role allows.\n\nIf those six tools are missing, the connection was authorized to read only\n(every connection made before November 2026 was). Ask the user to disconnect\nDoctoFam and connect it again, allowing DoctoFam to create and update data.\n\nConfirm every write with the user before calling it: which patient, which\nclinic, when, and what will change. Booking, moving and cancelling reach the\npatient: a booking schedules the clinic's reminder messages, a move moves\nthem, and a cancellation sends the clinic's cancellation message when the\nclinic set one up. Say so when you ask.\n\nThe connector cannot delete anything, read or write a medical record, add a\nnote, take or refund payments, send a message of its own, change reminder\nsettings, create a repeating series of appointments, change procedures,\nprices, staff or roles, or touch expenses. Direct the user to the DoctoFam\napp for those.\n\n## Resource identifiers\n\n- `clinicId` selects an owned clinic. A write may leave it out when the\n  account has one clinic. Never guess one: call `list_clinics` and reuse its\n  24-character hexadecimal id. Ask when several match.\n- `patientId` names one patient, from `find_patient` or `create_patient`;\n  `appointmentId` one appointment, from `list_appointments`;\n  `inventoryItemId` one stock item.\n- `providerIds` are the ids `list_providers` returns; `procedureIds` the ids\n  `list_procedures` returns.\n- `lastEditTime` is a record's version. Moving or cancelling an appointment,\n  updating a patient and setting a stock quantity take it as\n  `expectedLastEditTime` and are refused with `conflict` when the record\n  changed since it was read.\n- `requestId` is a unique id you choose for each new booking or patient, such\n  as a UUID. Calling again with the same `requestId` returns the first result\n  instead of booking or adding twice.\n\nOpaque cursors may be reused only with the filters that produced them.\n\n## Available tools\n\n| Tool                          | Use it when someone asks…                                                    |\n| ----------------------------- | ---------------------------------------------------------------------------- |\n| `list_clinics`                | which practices they run; also resolves the clinic ID every other tool needs |\n| `get_clinic`                  | about one practice's currency, language or timezone                          |\n| `get_clinic_schedule_summary` | how busy each UTC day is (appointment counts, at most 31 days)               |\n| `list_procedures`             | what a consultation or service costs, or which procedure to book             |\n| `list_rooms`                  | which consultation or exam rooms a practice has                              |\n| `list_calendar_events`        | when the practice is closed or a doctor or room is blocked                   |\n| `list_providers`              | which doctors, nurses or assistants can be booked, with their ids            |\n| `get_clinic_availability`     | when there are free consultation times (up to 7 days with openings)          |\n| `get_subscription_status`     | which plan a practice is on and its caps, or the default Free plan           |\n| `show_clinic_overview`        | for a one-card overview of one practice                                      |\n| `find_patient`                | for the patient they named, to book, move, cancel or update                  |\n| `list_appointments`           | when a patient is booked, or what is booked on one day                       |\n| `list_inventory_items`        | how much of a supply is left, or what is running low                         |\n| `book_appointment`            | to book a patient in                                                         |\n| `reschedule_appointment`      | to move an appointment to another day or time                                |\n| `cancel_appointment`          | to cancel an appointment                                                     |\n| `create_patient`              | to add a new patient                                                         |\n| `update_patient`              | to change a patient's name, phone, email or language                         |\n| `set_inventory_quantity`      | to correct or update a stock count                                           |\n\nFor a broad snapshot, resolve a clinic and call `show_clinic_overview`. For\nworkload, call `get_clinic_schedule_summary` and report only the total,\nlower-bound flag and UTC-day counts. Counts include canceled appointments; say\nso when describing workload. A `+` count is not a complete total. Bookable\navailability is unassigned capacity inside the practice's own online-booking\nwindow; it is not evidence about any person. Procedure names and prices are\nadministrative catalog data, not diagnosis, treatment history or a\nrecommendation.\n\n## Booking workflow\n\n1. Find the patient with `find_patient` and the name the user gave. If\n   several match, ask which one, using the last phone digits when given. If\n   none does, offer to add them with `create_patient` and use the id it\n   returns.\n2. Use `get_clinic` for the clinic's timezone, and `get_clinic_availability`\n   when the user has no time in mind.\n3. Use `list_procedures` for the procedures asked for, and `list_providers`\n   when the clinic has several providers and the user named one or must\n   choose.\n4. Confirm the patient, clinic, local day and time, procedures and provider\n   with the user, then call `book_appointment` with a new `requestId`. Give\n   `startTime` with the clinic's UTC offset. Leave `durationMinutes` out for\n   the clinic's usual length.\n5. Report the booked time in the clinic's timezone, and that the clinic's\n   reminders will reach the patient.\n\n`book_appointment` books only a doctor, nurse or assistant, and only a patient\nof the same organization. With several providers and none named, it answers\n`provider_required`: ask which one. `plan_limit_reached` means the clinic's\nplan limit is used up; the owner can upgrade in the app.\n\n## Moving or cancelling an appointment\n\n1. Find the appointment with `list_appointments`, by the patient's id or by\n   one day, and keep its `id` and `lastEditTime`.\n2. Confirm the change with the user, then call `reschedule_appointment` (the\n   patient, providers, procedures and length stay the same unless a new\n   `durationMinutes` is given) or `cancel_appointment`. Cancelling keeps the\n   appointment as canceled; it never deletes it.\n3. On `conflict`, read the appointment again, tell the user what changed, and\n   ask again before retrying with the new `lastEditTime`.\n\nOnly requested and booked appointments can be moved or canceled. One the\npatient attended or missed stays as it is.\n\n## Patients\n\n`create_patient` needs a name; phone, email and language are optional. The\nphone and email are saved for the clinic's messages but never returned. Use\n`update_patient` with the patient's `lastEditTime` from `find_patient` to\nchange a name, phone, email or language; only the fields given change.\nNothing else about a patient can be written here. Ask for a patient's phone or\nemail only to add or update that patient, never to answer a question.\n\n## Stock\n\n`list_inventory_items` shows each item's unit, quantity, minimum and whether\nit is at or below its minimum. `set_inventory_quantity` replaces the stored\nquantity with the number given: when the user reports a change (\"we used\ntwo\"), work out the new total from the quantity you read, confirm it, and send\nthat total with the item's `lastEditTime`.\n\n## When the answer is lost\n\n`delivery_unknown` means the connection dropped after the request was sent,\nso the change may have been saved. For a booking or a new patient, retry with\nthe same `requestId`: a record already saved is returned instead of written\ntwice. For anything else, read the record again before deciding to retry.\n\nFor clinical or medical-decision requests, follow host safety guidance and\nmake clear that DoctoFam provides no medical decision.\n",
