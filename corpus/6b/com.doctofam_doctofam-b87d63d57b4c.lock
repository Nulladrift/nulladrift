                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "durationMinutes": {
                "description": "Length in minutes. Leave it out for the clinic's usual length.",
                "maximum": 480,
                "minimum": 5,
                "type": "integer"
              },
              "patientId": {
                "description": "Id of the patient, from find_patient or create_patient.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "procedureIds": {
                "description": "Ids of the procedures booked, from list_procedures.",
                "items": {
                  "maxLength": 24,
                  "minLength": 24,
                  "pattern": "^[0-9a-f]{24}$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "providerIds": {
                "description": "Ids of the doctors, nurses or assistants who take it, from list_providers. Leave it out when the clinic has one provider or the user is the provider.",
                "items": {
                  "maxLength": 24,
                  "minLength": 24,
                  "pattern": "^[0-9a-f]{24}$",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
