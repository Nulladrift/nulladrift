                    "startTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "type": {
                      "anyOf": [
                        {
                          "maxLength": 64,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Label such as COURSE, MEETING, VACATION, SICK, HOLIDAY, MAINTENANCE or OTHER"
                    }
                  },
                  "required": ["allDay", "effect", "endTime", "scope", "startTime", "type"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "nextCursor": {
                "anyOf": [
                  {
                    "maxLength": 4096,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cursor for the next page; null on the last page"
              }
            },
            "required": ["calendarEvents", "nextCursor"],
            "type": "object"
          },
