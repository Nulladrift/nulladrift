                  },
                  "productName": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "status": {
                    "anyOf": [
                      {
                        "enum": ["ACTIVE", "PAST_DUE", "CANCELED"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["billingFrequency", "isDefaultFreePlan", "lastEditTime", "maxNumberOfAppointments", "maxNumberOfPatients", "maxNumberOfSeats", "maxNumberOfUsers", "productName", "status"],
