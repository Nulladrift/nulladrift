        {
          "name": "update_patient",
          "title": "Update a patient's contact details",
          "description": "Use this when someone asks to change a patient's name, phone, email or language. Returns the patient's id, name, clinic and which fields changed; contact details are never returned. Not for medical history or any other patient detail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "New email address.",
                "maxLength": 254,
                "type": "string"
              },
              "expectedLastEditTime": {
                "description": "The lastEditTime from find_patient. A patient changed since then is refused.",
                "format": "date-time",
                "maxLength": 40,
                "type": "string"
              },
              "language": {
                "description": "New language for their messages, as a code such as en or it.",
                "maxLength": 10,
                "type": "string"
              },
              "name": {
                "description": "New full name.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "patientId": {
                "description": "Id of the patient, from find_patient.",
                "maxLength": 24,
                "minLength": 24,
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              },
              "phone": {
                "description": "New mobile number, with the country code when known.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["expectedLastEditTime", "patientId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changedFields": {
                "items": {
                  "enum": ["name", "phone", "email", "language"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "patient": {
                "additionalProperties": false,
                "properties": {
                  "clinicId": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "id": {
                    "anyOf": [
                      {
                        "maxLength": 24,
                        "minLength": 24,
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "language": {
                    "anyOf": [
                      {
                        "maxLength": 16,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "lastEditTime": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["clinicId", "id", "language", "lastEditTime", "name"],
                "type": "object"
              },
              "status": {
                "enum": ["updated"],
                "type": "string"
              }
            },
            "required": ["changedFields", "patient", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Update a patient's contact details"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["doctofam:write"],
                "type": "oauth2"
              }
            ]
          },
