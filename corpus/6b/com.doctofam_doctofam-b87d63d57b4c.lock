        {
          "name": "show_clinic_overview",
          "title": "Show medical practice overview",
          "description": "Use this when someone wants a quick overview or dashboard of one medical practice. Returns an overview card with the practice's details, appointment counts for the next 7 days, staff and room counts, open online-booking slots, up to 12 service prices and the current plan (no patient or clinical data). Not for a single patient or visit.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clinicId": {
                "description": "Practice id: 24 lowercase hexadecimal characters",
                "pattern": "^[0-9a-f]{24}$",
                "type": "string"
              }
            },
            "required": ["clinicId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "appointmentCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "appointmentCountIsLowerBound": {
                "type": "boolean"
              },
              "availabilityDays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "day"],
                  "type": "object"
                },
                "maxItems": 7,
                "type": "array"
              },
              "availableDayCount": {
                "maximum": 7,
                "minimum": 0,
                "type": "integer"
              },
              "availableSlotCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "clinic": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "currency": {
                        "anyOf": [
                          {
                            "pattern": "^[A-Za-z]{3}$",
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "defaultLocale": {
                        "anyOf": [
                          {
                            "maxLength": 35,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "id": {
                        "pattern": "^[0-9a-f]{24}$",
                        "type": "string"
                      },
                      "name": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "timezone": {
                        "anyOf": [
                          {
                            "maxLength": 64,
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["currency", "defaultLocale", "id", "name", "timezone"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Administrative practice metadata; null when the practice was not found. The overview never includes individual appointment records, patient information, diagnoses, treatment details, notes or other clinical data."
              },
              "procedureCount": {
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "procedureCountIsLowerBound": {
                "type": "boolean"
              },
              "procedures": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "duration": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "lastEditTime": {
                      "anyOf": [
                        {
                          "maxLength": 32,
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "name": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "price": {
                      "anyOf": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["duration", "lastEditTime", "name", "price"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "providerCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "providerCountIsLowerBound": {
                "type": "boolean"
              },
              "roomCount": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "roomCountIsLowerBound": {
                "type": "boolean"
              },
              "scheduleDays": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "day": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["count", "day"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "scheduleRange": {
                "additionalProperties": false,
                "properties": {
                  "endTime": {
                    "maxLength": 32,
                    "type": "string"
                  },
                  "startTime": {
                    "maxLength": 32,
                    "type": "string"
                  }
                },
                "required": ["endTime", "startTime"],
                "type": "object"
              },
              "subscription": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "billingFrequency": {
                        "anyOf": [
                          {
                            "enum": ["MONTHLY", "YEARLY"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "isDefaultFreePlan": {
                        "type": "boolean"
                      },
                      "maxNumberOfAppointments": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "maxNumberOfPatients": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "maxNumberOfSeats": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "maxNumberOfUsers": {
                        "anyOf": [
                          {
                            "maximum": 9007199254740991,
                            "minimum": 0,
                            "type": "integer"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "productName": {
                        "maxLength": 200,
                        "type": "string"
                      },
                      "status": {
                        "anyOf": [
                          {
                            "enum": ["ACTIVE", "PAST_DUE", "CANCELED"],
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      }
                    },
                    "required": ["billingFrequency", "isDefaultFreePlan", "maxNumberOfAppointments", "maxNumberOfPatients", "maxNumberOfSeats", "maxNumberOfUsers", "productName", "status"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["appointmentCount", "appointmentCountIsLowerBound", "availabilityDays", "availableDayCount", "availableSlotCount", "clinic", "procedureCount", "procedureCountIsLowerBound", "procedures", "providerCount", "providerCountIsLowerBound", "roomCount", "roomCountIsLowerBound", "scheduleDays", "scheduleRange", "subscription"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show medical practice overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://doctofam/clinic-overview-v2.html",
            "openai/toolInvocation/invoked": "DoctoFam clinic overview ready.",
            "openai/toolInvocation/invoking": "Loading DoctoFam clinic…",
            "securitySchemes": [
              {
                "scopes": ["doctofam:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://doctofam/clinic-overview-v2.html"
            },
            "ui/resourceUri": "ui://doctofam/clinic-overview-v2.html"
          },
          "digest": "sha256:522b4a18c645ddcb9e114752c71025fa0b2e4edda6da22befeb8a9098aae7625"
