                  "additionalProperties": false,
                  "properties": {
                    "allDay": {
                      "type": "boolean"
                    },
                    "effect": {
                      "anyOf": [
                        {
                          "enum": ["BLOCK", "OPEN"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "BLOCK removes bookable time; OPEN adds hours on a normally closed time"
                    },
                    "endTime": {
                      "anyOf": [
                        {
                          "$ref": "#/properties/calendarEvents/items/properties/startTime/anyOf/0"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "scope": {
                      "anyOf": [
                        {
                          "enum": ["SEAT", "PROVIDER", "CLINIC"],
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "CLINIC: the whole practice; PROVIDER: one or more staff; SEAT: one room"
