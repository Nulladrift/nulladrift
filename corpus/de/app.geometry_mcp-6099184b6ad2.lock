            "readOnly": true
          },
          "digest": "sha256:56404a8babc4d3a44a9073e9892c48c756a84ea1b2e358ba3bcf1a68808868d9"
        },
        {
          "name": "get_plays_numerology",
          "title": "Baseball play numerology (HR/K milestones)",
          "description": "USE when a player's season HR# or K# aligns with calendar day-of-month, jersey number, or inning on baseball.plays. NOT for roster cardology → get_team_chemistry; cosmic day card → get_date. Requires retro_id. mode=season (default) | spotlight (tier<=1) | career_summary (aggregates only). lane=both (default) | hr | k. Optional game_dt filter, tier_max (0-4), limit (1-500). RETURNS summary + events[] with pattern labels (day=HR#, HR#=jersey, day=K#=jersey, etc.). Overlay get_date(game_dt) for MCP day-card narrative.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game_dt": {
                "description": "Optional single-game filter YYYY-MM-DD",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lane": {
                "description": "Home runs, strikeouts, or both (default both)",
                "enum": ["hr", "k", "both"],
                "type": "string"
              },
              "limit": {
                "description": "Max event rows returned (default 100, max 500)",
                "type": "integer"
              },
              "mode": {
                "description": "season (default) | spotlight | career_summary",
                "enum": ["spotlight", "season", "career_summary"],
                "type": "string"
              },
              "retro_id": {
                "description": "Retrosheet player id e.g. ohtas001, freef001 (not Lahman/BBRef ids like ohtansh01)",
                "minLength": 1,
                "type": "string"
              },
              "season_yr": {
                "description": "Required for season/spotlight modes",
                "type": "integer"
              },
              "tier_max": {
                "description": "Max pattern tier 0-4 (spotlight defaults to 1)",
                "type": "integer"
              }
            },
            "required": ["retro_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aff7bf55706aa59047ff3af139268ce721b8183555f7b1f6c7948f7df5cd33e"
        },
        {
          "name": "get_team_chemistry",
          "title": "Baseball team roster cardology",
          "description": "USE for MLB team × season roster cardology (suit mix, anchor stacks, Chinese zodiac year-animal match on postseason scope). NOT for play-by-play HR/K numerology → get_plays_numerology; two-person dyads → get_compatibility; single date → get_date. Requires season_yr + team_code. scope=ws_champion (default) | postseason. RETURNS roster_size, suit_mix, anchor_stacks, season_animal; postseason adds year_animal_match_pct (CNY-aware birth animal). Apply: apply_mcp_baseball_linked.ps1.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gametype": {
                "description": "Postseason round when scope=postseason (default worldseries)",
                "type": "string"
              },
              "include_pair_matrix": {
                "description": "Reserved v2 — echoes pair_note when true",
                "type": "boolean"
              },
              "scope": {
                "description": "ws_champion (default) or postseason active roster",
                "enum": ["ws_champion", "postseason"],
                "type": "string"
              },
              "season_yr": {
                "description": "MLB season year e.g. 2024",
                "type": "integer"
              },
              "team_code": {
                "description": "Retrosheet team code e.g. LAN, CHN, HOU",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["season_yr", "team_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:621a17d2f5acdc43a15b12897d4b0f7a39203778a739d3d868126a36dd8a1b61"
        }
