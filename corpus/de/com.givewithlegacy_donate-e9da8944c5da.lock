{
  "lockfileVersion": 2,
  "subjects": {
    "com.givewithlegacy/donate": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://donate.givewithlegacy.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "legacy",
        "title": "Legacy",
        "version": "4c987c5"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Legacy takes one card payment and passes it on to up to 6 UK registered charities.\n\nThere is no search here. Find the charities yourself, on the charity registers or the charities' own sites, and pass their registered charity numbers. Then:\n1. check_charities says which can take a gift here, with our name for each number. Confirm it is the charity the donor meant.\n2. quote shows what a gift comes to: the fee, each charity's share and Gift Aid. Optional.\n3. create_checkout_link returns a link for the donor to open and pay.\n\nNothing is given until the donor finishes on that page, so never say they have donated. They give their details, answer the Gift Aid question and choose an optional tip there; never answer those for them.",
      "tools": [
        {
          "name": "check_charities",
          "title": "Check charities",
          "description": "Look up UK registered charities by charity number and say which can take a gift through Legacy. Gives our name for each number, so you can confirm it is the charity the donor meant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "charityNumbers": {
                "items": {
                  "description": "A UK registered charity number, e.g. 220949 (England & Wales) or SC022140 (Scotland)",
                  "pattern": "^[A-Za-z0-9 -]{1,20}$",
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["charityNumbers"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "charities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "charityNumber": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "logoUrl": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["available", "not_accepting", "not_found", "ambiguous"],
                      "type": "string"
                    }
                  },
                  "required": ["charityNumber", "status"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["charities"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a28767f44c9c7c0af68932a0394990381edcacb3b416a14b4460f0471426429"
        },
        {
          "name": "create_checkout_link",
          "title": "Create a checkout link",
          "description": "A link to Legacy’s checkout with these charities, and the amounts when given. The donor opens it to give their details, answer Gift Aid, choose an optional tip and pay by card; the amounts stay theirs to change.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "charities": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Pounds, e.g. 20 or 12.50",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "charityNumber": {
                      "description": "A UK registered charity number, e.g. 220949 (England & Wales) or SC022140 (Scotland)",
                      "pattern": "^[A-Za-z0-9 -]{1,20}$",
                      "type": "string"
                    }
                  },
                  "required": ["charityNumber"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["charities"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "charities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": ["number", "null"]
                    },
                    "charityNumber": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["amount", "charityNumber", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["charities", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5aa01fe296d76d96702a44cc57a66ff782dd9d54655181dd6c65983bf1136c33"
        },
        {
          "name": "quote",
          "title": "Price a gift",
          "description": "What a gift to these charities comes to: what the donor pays, the payment processing fee, each charity’s share and, if asked, the Gift Aid they could claim. The donor chooses Gift Aid and any tip at checkout, so these are assumptions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "charities": {
                "items": {
                  "properties": {
                    "amount": {
                      "description": "Pounds, e.g. 20 or 12.50",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "charityNumber": {
                      "description": "A UK registered charity number, e.g. 220949 (England & Wales) or SC022140 (Scotland)",
                      "pattern": "^[A-Za-z0-9 -]{1,20}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "charityNumber"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "giftAid": {
                "default": false,
                "description": "Whether to show Gift Aid, which only a UK taxpayer can add",
                "type": "boolean"
              },
              "tipPercentage": {
                "default": 0,
                "description": "An optional tip to Legacy, taken from the gift",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["charities"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "charities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "charityNumber": {
                      "type": "string"
                    },
                    "giftAid": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "receives": {
                      "type": "number"
                    }
                  },
                  "required": ["amount", "charityNumber", "giftAid", "name", "receives"],
                  "type": "object"
                },
                "type": "array"
              },
              "charitiesReceive": {
                "type": "number"
              },
              "donorPays": {
                "type": "number"
              },
              "giftAid": {
                "type": "number"
              },
              "maximumTotal": {
                "type": ["number", "null"]
              },
              "minimumPerCharity": {
                "type": "number"
              },
              "minimumTotal": {
                "type": "number"
              },
              "paymentProcessing": {
                "type": "number"
              },
              "platformTip": {
                "type": "number"
              }
            },
            "required": ["charities", "charitiesReceive", "donorPays", "giftAid", "maximumTotal", "minimumPerCharity", "minimumTotal", "paymentProcessing", "platformTip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac0ac10e2db59ceea7d17fa03696de2146e52e4e698a3100b7f581afd6d5499b"
        }
      ],
      "digest": "sha256:c5e2c663af48b504181a483c35f24781a0469ecff16eb1a7e453beaa548c5c24"
    }
  }
}
