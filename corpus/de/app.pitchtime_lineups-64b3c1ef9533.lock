{
  "lockfileVersion": 2,
  "subjects": {
    "app.pitchtime/lineups": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pitchtime.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pitchtime-lineups",
        "title": "Pitch Time — Fair Youth Soccer Lineups",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Generate fair youth soccer lineups, recommend formations, calculate equal playing time for 7v7, 9v9 and 11v11, find age groups using official cutoff rules, and generate round-robin league fixtures. Lineups include a shareable, printable pitchtime.app link. Names are processed in memory only; share links keep the lineup in the URL fragment. Goalkeeper commitments can limit equal minutes; include the returned notes.",
      "tools": [
        {
          "name": "age_group",
          "title": "Find a youth soccer age group",
          "description": "Find the age group for a birth date, governing body and season from published official cutoff rules. Covers US Youth Soccer, AYSO, The FA and Canada Soccer from 2026. Returns the cutoff source and calculator link. USYS and AYSO use the revised August–July window from 2026–27.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body": {
                "description": "Slug (us-youth-soccer, ayso, the-fa, canada-soccer) or common name: US Youth Soccer, USYS, AYSO, The FA, FA, Canada Soccer. Case-insensitive.",
                "type": "string"
              },
              "dob": {
                "description": "Date of birth as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "seasonStartYear": {
                "description": "Season start year, or year of play for Canada. Defaults to the current season for the body.",
                "maximum": 2100,
                "minimum": 2026,
                "type": "integer"
              }
            },
            "required": ["body", "dob"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "age": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "body": {
                "enum": ["us-youth-soccer", "ayso", "the-fa", "canada-soccer"],
                "type": "string"
              },
              "bodyName": {
                "type": "string"
              },
              "cutoff": {
                "type": "string"
              },
              "formatAgeBand": {
                "type": ["string", "null"]
              },
              "formatNote": {
                "type": "string"
              },
              "label": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "pageUrl": {
                "format": "uri",
                "type": "string"
              },
              "retrievedDate": {
                "type": "string"
              },
              "rulesUrl": {
                "format": "uri",
                "type": "string"
              },
              "season": {
                "type": "string"
              },
              "seasonStartYear": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "sourceUrl": {
                "format": "uri",
                "type": "string"
              },
              "typicalFormat": {
                "type": ["string", "null"]
              }
            },
            "required": ["age", "body", "bodyName", "cutoff", "formatAgeBand", "formatNote", "label", "note", "pageUrl", "retrievedDate", "rulesUrl", "season", "seasonStartYear", "sourceUrl", "typicalFormat"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f9c5ddee0bd62e91b2238b7a4bf2b579a55056caa79b872b8f98499345d84fb"
        },
        {
          "name": "calculate_playing_time",
          "title": "Calculate equal playing time",
          "description": "Calculate minutes and percentage per player, bench size, a simple segment length and whether equal shares meet a 50% minimum. This is an equal-share calculation, before any goalkeeper constraints.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "enum": ["7v7", "9v9", "11v11"],
                "type": "string"
              },
              "gameMinutes": {
                "maximum": 120,
                "minimum": 10,
                "type": "number"
              },
              "rosterSize": {
                "maximum": 30,
                "minimum": 7,
                "type": "integer"
              }
            },
            "required": ["format", "gameMinutes", "rosterSize"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "benchSize": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "calculatorUrl": {
                "format": "uri",
                "type": "string"
              },
              "meets50PercentMinimum": {
                "type": "boolean"
              },
              "minutesPerPlayer": {
                "type": "number"
              },
              "percent": {
                "type": "number"
              },
              "segmentLength": {
                "type": "number"
              }
            },
            "required": ["benchSize", "calculatorUrl", "meets50PercentMinimum", "minutesPerPlayer", "percent", "segmentLength"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4876852a7c92df45e55119d7662c75794a504f2b567cf299095047f171e06645"
        },
        {
          "name": "generate_fair_lineup",
          "title": "Generate a fair youth soccer lineup",
          "description": "Create a deterministic rotation with balanced minutes, goalkeeper duties and preferred positions. Returns each substitution window, player minutes and a shareable printable link. Duplicate names receive numbered suffixes. Without designated goalkeepers, everyone is available in goal.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "anyOf": [
                  {
                    "enum": ["7v7", "9v9", "11v11"],
                    "type": "string"
                  },
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 9,
                    "type": "number"
                  },
                  {
                    "const": 11,
                    "type": "number"
                  },
                  {
                    "enum": ["7", "9", "11"],
                    "type": "string"
                  }
                ],
                "description": "7v7, 9v9 or 11v11; also accepts numbers 7, 9, 11 and strings \"7\", \"9\", \"11\"."
              },
              "formation": {
                "description": "Full formation including GK, for example 1-2-3-1. Omit for the recommended formation.",
                "type": "string"
              },
              "gameMinutes": {
                "description": "Defaults: 7v7 50, 9v9 60, 11v11 70 minutes.",
                "maximum": 120,
                "minimum": 10,
                "type": "number"
              },
              "goalkeepers": {
                "description": "Roster names in keeper rotation order; combined with canPlayGK flags.",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "periods": {
                "anyOf": [
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ],
                "description": "2 halves (default) or 4 quarters."
              },
              "players": {
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "canPlayGK": {
                          "type": "boolean"
                        },
                        "name": {
                          "maxLength": 80,
                          "minLength": 1,
                          "type": "string"
                        },
                        "preferred": {
                          "items": {
                            "maxLength": 10,
                            "minLength": 1,
                            "type": "string"
                          },
                          "maxItems": 11,
                          "type": "array"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 30,
                "minItems": 7,
                "type": "array"
              },
              "rotateGoalkeeper": {
                "description": "Designated keepers rotate at period breaks by default if more than one. Without designated keepers, defaults to keeping the current keeper until benched; true requests segment rotation, false fixes the first player in goal.",
                "type": "boolean"
              },
              "segmentsPerPeriod": {
                "description": "Equal substitution windows per period; default aims for about 8 minutes per segment.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["format", "players"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "enum": ["7v7", "9v9", "11v11"],
                "type": "string"
              },
              "formation": {
                "type": "string"
              },
              "gameMinutes": {
                "maximum": 120,
                "minimum": 10,
                "type": "number"
              },
              "minutes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "minutes": {
                      "type": "number"
                    },
                    "percent": {
                      "type": "number"
                    },
                    "player": {
                      "type": "string"
                    }
                  },
                  "required": ["minutes", "percent", "player"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "periods": {
                "anyOf": [
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  }
                ]
              },
              "segments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bench": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "endMinute": {
                      "type": "number"
                    },
                    "index": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "onField": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "player": {
                            "type": "string"
                          },
                          "position": {
                            "type": "string"
                          }
                        },
                        "required": ["player", "position"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "period": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "startMinute": {
                      "type": "number"
                    }
                  },
                  "required": ["bench", "endMinute", "index", "onField", "period", "startMinute"],
                  "type": "object"
                },
                "type": "array"
              },
              "shareUrl": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["format", "formation", "gameMinutes", "minutes", "notes", "periods", "segments", "shareUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02f990afc4cd1ff7d5d067d5420cdda0bf4af8cad8e33a391a4903dde95af5c4"
        },
        {
          "name": "generate_round_robin",
          "title": "Generate a round-robin schedule",
          "description": "Create deterministic weekly fixtures for 3–24 teams with balanced home/away games and odd-team byes. Double round-robin reverses the round order and swaps home/away for the return leg. Returns fixtures, team counts, a Markdown table and a share link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "doubleRoundRobin": {
                "type": "boolean"
              },
              "startDate": {
                "description": "First possible match date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "teams": {
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 24,
                "minItems": 3,
                "type": "array"
              },
              "weekday": {
                "anyOf": [
                  {
                    "maximum": 6,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "0 Sunday through 6 Saturday, or an English weekday name or 3-letter abbreviation (case-insensitive), for example Saturday or sat. Requires startDate; first round is on or after that date."
              }
            },
            "required": ["teams"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "byes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "round": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "team": {
                      "type": "string"
                    }
                  },
                  "required": ["round", "team"],
                  "type": "object"
                },
                "type": "array"
              },
              "fixtures": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "away": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "durationMinutes": {
                      "type": "number"
                    },
                    "home": {
                      "type": "string"
                    },
                    "round": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "time": {
                      "type": "string"
                    },
                    "venue": {
                      "type": "string"
                    }
                  },
                  "required": ["away", "durationMinutes", "home", "round"],
                  "type": "object"
                },
                "type": "array"
              },
              "shareUrl": {
                "format": "uri",
                "type": "string"
              },
              "summary": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "away": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "byes": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "home": {
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "team": {
                      "type": "string"
                    }
                  },
                  "required": ["away", "byes", "home", "team"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["byes", "fixtures", "shareUrl", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d30b66dbc0faee8edfbff4dca3c4e308fbc44a6396ce528aaf6e79b97c005dbd"
        },
        {
          "name": "recommend_formation",
          "title": "Recommend a youth soccer formation",
          "description": "Choose a formation for 7v7 (U8–U10), 9v9 (U11–U12) or 11v11 (U13+), with alternatives and coaching notes. Explicit format takes precedence over age; defaults to balanced 7v7.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ageGroup": {
                "description": "For example U9 or U12.",
                "type": "string"
              },
              "format": {
                "anyOf": [
                  {
                    "enum": ["7v7", "9v9", "11v11"],
                    "type": "string"
                  },
                  {
                    "const": 7,
                    "type": "number"
                  },
                  {
                    "const": 9,
                    "type": "number"
                  },
                  {
                    "const": 11,
                    "type": "number"
                  },
                  {
                    "enum": ["7", "9", "11"],
                    "type": "string"
                  }
                ],
                "description": "7v7, 9v9 or 11v11; also accepts numbers 7, 9, 11 and strings \"7\", \"9\", \"11\"."
              },
              "style": {
                "enum": ["balanced", "attacking", "defensive"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ageGuidance": {
                "type": "string"
              },
              "alternatives": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bestFor": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "positions": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["bestFor", "name", "positions"],
                  "type": "object"
                },
                "type": "array"
              },
              "format": {
                "enum": ["7v7", "9v9", "11v11"],
                "type": "string"
              },
              "guideUrl": {
                "format": "uri",
                "type": "string"
              },
              "recommended": {
                "additionalProperties": false,
                "properties": {
                  "bestFor": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "positions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["bestFor", "name", "positions"],
                "type": "object"
              }
            },
            "required": ["ageGuidance", "alternatives", "format", "guideUrl", "recommended"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5d8f5dd33e8f266abb73aef6092e3d700148ee794e909e56c5adf149ddf7ec4a"
        }
      ],
      "digest": "sha256:382594b1cb9834ff38d00c1cd0e74b8c4f02bd8cdd0c8799df3d23afe9d6f61b"
    }
  }
}
