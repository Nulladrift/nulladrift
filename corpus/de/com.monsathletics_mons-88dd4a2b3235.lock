                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "weekly": {
                "items": {
                  "properties": {
                    "focus": {
                      "anyOf": [
                        {
                          "enum": ["rest", "long_run", "running", "swimming", "cycling", "strength", "mobility"],
                          "type": "string"
                        },
                        {
                          "type": "null"
