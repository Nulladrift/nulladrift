                "description": "The furthest distance the person has ever done in one go in that sport, in kilometres. 0 if never.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "sport": {
                "description": "The sport of the challenge: running, cycling or swimming.",
                "enum": ["running", "cycling", "swimming"],
                "type": "string"
