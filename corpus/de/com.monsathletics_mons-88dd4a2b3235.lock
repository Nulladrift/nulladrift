        {
          "name": "check_readiness",
          "title": "Check readiness for a challenge",
          "description": "Picks the challenge to aim for from the person's training, whether they are ready for it, and what is still needed if not. Returns the next question while one is unanswered, then the challenge and verdict. Send every answer so far each time.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Answers so far, keyed by question id, each a distance in kilometres: the one the person gave, or the value of the option they chose. Omit before the first answer.",
                "propertyNames": {
                  "enum": ["longest", "long_count", "long_recent", "weekly", "per_week"],
                  "type": "string"
                },
                "type": "object"
              },
              "challenge_id": {
                "description": "Optional: a challenge id from the challenges find_next_challenge lists, when the person names a goal of their own. Omit to get the next step up from their furthest.",
