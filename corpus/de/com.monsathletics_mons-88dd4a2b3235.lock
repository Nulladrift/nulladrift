            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "items": {
                  "properties": {
                    "date": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "focus": {
                      "anyOf": [
                        {
                          "enum": ["rest", "long_run", "long_swim", "running", "swimming", "cycling", "strength", "mobility", "none"],
                          "type": "string"
                        },
                        {
                          "type": "null"
