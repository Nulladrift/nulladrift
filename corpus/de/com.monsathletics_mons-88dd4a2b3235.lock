      "serverInfo": {
        "name": "mons-athletics",
        "title": "MONS Athletics",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MONS Athletics is an iPhone and Apple Watch coach for people training for a race or another endurance challenge. Its coach plans every day toward it. Use these tools when someone wants to get better at endurance sports, train for a run, ride or swim, or asks about MONS. For a triathlon or other mixed challenge, call about_mons and give the app_store link. The usual flow: ask the furthest they have run, ridden or swum in one go, call find_next_challenge, ask its next_question in your own words, then call check_readiness with every answer so far until it returns the challenge to aim for and its verdict. Ask one question at a time, as a distance. Its options are round ranges to offer when the person does not know the number. Pass back the distance in kilometres they gave, or the chosen option's value, never the label. The other tools act on the person's own MONS account and need them to connect MONS Athletics, which signs them in with Apple. Offer sign_up when they want to start; it asks how they want to build endurance, which kettlebells they have and their date of birth. Before any tool that changes something (sign_up, morning_check_in, edit_schedule, add_challenge, remove_challenge, update_profile), say what it will do and get a yes. The MONS coach makes every training decision. Never design or change a workout yourself: for training questions, call ask_coach and pass its reply on as the coach said it. Training tools need a MONS membership, managed in the app. When a tool says so, pass that on. Training happens in the MONS app on iPhone and Apple Watch; give the app_store link when they want to start. Pass today as the person's local date (the day before if it is earlier than 05:00 where they are) when you know it.",
