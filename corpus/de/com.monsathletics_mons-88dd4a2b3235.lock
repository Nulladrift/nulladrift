        {
          "name": "edit_schedule",
          "title": "Change my schedule",
          "description": "Sets what a coming day is for (days), or what a weekday is for every week (weekly). focus none on a day hands it back to the coach for that date only; focus null clears it. Only one weekday can be the long run.",
