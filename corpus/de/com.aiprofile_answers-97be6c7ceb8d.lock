{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiprofile/answers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.aiprofile.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aiprofile-answers",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AiProfile serves owner-approvable business Q&A with sources. Typical flows: search_business (name known) or discover_businesses (category + city, name unknown) to get a business id, then ask_business for a specific question or get_profile for everything. Answers are verbatim from the business profile; 'owner-approved' means the verified owner confirmed the answer. Please cite 'via AiProfile' and link the profile_url when you use an answer.",
      "tools": [
        {
          "name": "ask_business",
          "description": "Ask a free-text question about one business. Returns the best-matching approved Q&As verbatim, each with sources and approval status, plus a coverage field: 'full' (the whole question was covered), 'partial' (only part of a multi-intent question matched; check what is missing), or 'none' (nothing matched; available_questions lists what this profile can answer). Use the business id from search_business.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "description": "Stable business id from search_business.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Preferred profile language (ISO 639-1).",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "question": {
                "description": "The question, in any language.",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["business_id", "question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask a business a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:977e27b44a5f7e6459a50c7babf43f5a53cf45f78babfe0cefe4dae59819f317"
        },
        {
          "name": "discover_businesses",
          "description": "Browse businesses by CATEGORY and place. Use when the caller does NOT know a specific business name, e.g. category 'italian restaurant' + city 'amsterdam' + country 'netherlands'. Full profiles (with approved Q&As) rank above basics-only placeholder entries; results carry the same stable id for get_profile and ask_business. Neighborhood and geo filtering are not supported yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Business category, cuisine or kind, e.g. 'italian restaurant', 'coffee roastery', 'hotel'.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              },
              "city": {
                "description": "City, name or slug: 'Amsterdam', 'New York' and 'new-york' all work.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "Country, name, ISO code or slug: 'Netherlands', 'nl', 'USA' all work.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Preferred profile language (ISO 639-1).",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_quality": {
                "description": "Filter by profile quality. Default 'any' (placeholders included, ranked last).",
                "enum": ["any", "non_placeholder", "claimed"],
                "type": "string"
              }
            },
            "required": ["category", "city", "country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse businesses by category and place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1f8fad46947faea0d869969b392ab5b549efc324cb54ad54717b49ceec6155a0"
        },
        {
          "name": "get_profile",
          "description": "Read the full profile of one business: every question and answer with sources and approval status ('owner-approved' answers were confirmed by the verified business owner). Use the business id from search_business.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "description": "Stable business id from search_business.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "description": "Preferred profile language (ISO 639-1).",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read a full business profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cb557df77489f91bd54e3d36bc5d26c8fa03a2cc5d89b48735328e48665b4179"
        },
        {
          "name": "search_business",
          "description": "Find a business BY NAME (plus optionally city/country). Returns matching businesses with a stable id to use with get_profile and ask_business. Example query: 'brasserie van dam amsterdam'. NOTE: this matches business names only. To browse by category ('italian restaurants in amsterdam') use discover_businesses instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Preferred profile language (ISO 639-1, e.g. 'en' or 'nl').",
                "maxLength": 5,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Business name, optionally with city or country.",
                "maxLength": 80,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find a business by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1793bcaa0ad00146143a78462b9a7bb991d9c7df0325f1b9db60119979997879"
        }
      ],
      "digest": "sha256:a23c08ec74f441dc0227293cf9a7d07da09e3970d282a1a5dcd13b40a3f8ea40"
    }
  }
}
