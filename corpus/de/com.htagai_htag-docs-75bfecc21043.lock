      "instructions": "HtAG Documentation server (public, no API key). Use it to plan calls to the HtAG property data API and the HtAG MCP data servers before you make them.\n\nCall get_guide('calling-htag') before planning HtAG data calls (the same text is the resource guide://calling-htag). It covers call order for property questions (geocode with limit=1 and check the match, then get_property_summary, then a sold/rented search filtered by propertyType and bedrooms), cost rules (which operations bill per returned row and which per request; filter first; limit=1 to read total_count; no automatic pagination), paging and truncation fields (total, total_count, has_more, next_offset, _truncated), address keys and key spaces, and canonical property types.\n\nFor HtAG membership discounts (an eligible active HtAG plan, not Starter, reduces rates on supported usage once linked), read get_guide('costs'); users link their plan in the developer portal themselves, so never ask for their HtAG password.\n\nBefore a read that could return more than about 100 rows, or any paging loop, estimate it in AUD with get_pricing (or a limit=1 probe's `billing` receipt) and state the plan first.\n\nTools:\n- list_guides: the available guides (name, title, summary, updated).\n- get_guide(name): full markdown of one guide: calling-htag, costs, core-concepts.\n- get_pricing: the rate card (AUD per unit by tier and monthly band, plan multipliers, free allowance, as-of date) and how to read the `billing` receipt.\n- list_api_endpoints(tag?, query?): find REST endpoints in the public OpenAPI spec.\n- get_api_endpoint(path, method): the full OpenAPI operation; check parameters here before calling.\n- list_mcp_servers: HtAG MCP servers and whether each is public.\n- list_mcp_tools(server): tools on one MCP server, with input schemas.\n- list_micro_agents: callable HtAG micro-agents.\n\nResources: guide://calling-htag, guide://costs, guide://core-concepts (text/markdown); pricing://rate-card (application/json).\n",
