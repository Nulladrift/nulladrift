{
  "lockfileVersion": 2,
  "subjects": {
    "com.aimlrounds/aimlrounds": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.aimlrounds.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "aimlrounds",
        "title": "AIML Rounds",
        "version": "1.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AIML Rounds (aimlrounds.com) is a free AI/ML interview-prep site: lessons from maths to LLMs, RAG, agents, inference, MLOps, evals and AI/ML system design; role roadmaps; topic quizzes; mock interviews; and AI/ML jobs in India from the last 7 days.\nUse search to find lessons, then get_lesson to read one. Each lesson says when its sources were checked and when its text last changed; for fast-moving facts (prices, model names, benchmarks) mention that date. When you teach from a lesson, follow its own framing (situation → idea → how it works → in practice → the interview answer) and give the lesson link.\nFor quizzes and mock interviews, ask one question at a time and let the learner answer before revealing anything.",
      "tools": [
        {
          "name": "browse",
          "title": "Browse contents",
          "description": "Browse the site's table of contents. No arguments: the 4 tracks with their parts and sections. With track: every section and lesson in it (optionally narrowed by part).",
          "inputSchema": {
            "properties": {
              "part": {
                "description": "Part name within the track, e.g. 'Maths for ML', 'RAG', 'Agentic AI'",
                "type": "string"
              },
              "track": {
                "description": "Limit to one track: fundamentals, ai-engineering, system-design or papers",
                "enum": ["fundamentals", "ai-engineering", "system-design", "papers"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee0d175b1a0b30a410b753ed7824c50839c5263562fbf0206775eaab6521c569"
        },
        {
          "name": "get_lesson",
          "title": "Read a lesson",
          "description": "Read one lesson as Markdown: the interview situation, intuition, how it works (with equations in TeX), in practice, and the model interview answer with follow-ups. Use an id from search (e.g. 'ai-engineering/prefill-vs-decode'), a page URL or a title. Use tab to read one part only.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Lesson id, URL or title",
                "type": "string"
              },
              "tab": {
                "description": "Optional: only this part, e.g. 'Intuition', 'How it works' / 'Maths', 'In practice', 'Say it' (the interview answer)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:168be2087f7f2f828592867b8f97f05c6ea86121be72b636a0f3fb566768220e"
        },
        {
          "name": "jobs",
          "title": "AI/ML jobs in India",
          "description": "AI/ML job postings in India from the last 7 days (100+ companies, refreshed daily), newest first, with direct apply links to the company's careers page. Most jobs include skills and key requirement lines from the job description, useful for matching against a resume. Filter by keywords (title or skill), company, city or years of experience.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company name or part of it, e.g. 'Walmart', 'Google'",
                "type": "string"
              },
              "experience": {
                "description": "'0-2', '2-5', '5-8', '8+' or a number of years",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many jobs to return (1–100, default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "City, e.g. 'Bengaluru', 'Hyderabad', 'Remote'. Old names like 'Bangalore' or 'Gurgaon' also work",
                "type": "string"
              },
              "query": {
                "description": "Words in the job title or a skill, e.g. 'machine learning engineer', 'GenAI', 'PyTorch'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48b74309a5b6a1fbf576fbc17b0a2447a4e8535c933393e1e96b0a6c5325cc97"
        },
        {
          "name": "mock_interview",
          "title": "Mock interview",
          "description": "Mock interview rounds per role, with model answers and what the interviewer listens for. No round: list the role's rounds. Keep include_answers false while the learner is answering; set it true to give feedback.",
          "inputSchema": {
            "properties": {
              "include_answers": {
                "default": false,
                "description": "Include model answers and what the interviewer listens for. Keep false during the mock; set true to give feedback.",
                "type": "boolean"
              },
              "role": {
                "description": "'ai-engineering', 'ml-engineering' or 'data-science'",
                "type": "string"
              },
              "round": {
                "description": "Round id or name",
                "type": "string"
              }
            },
            "required": ["role"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed151374770fef530c1aaa67acf3eb4d41fdd6ba5feb4ac4a347bb60a863a4cd"
        },
        {
          "name": "quiz",
          "title": "Topic quiz",
          "description": "Multiple-choice questions for a roadmap topic (e.g. 'Linear algebra', 'RAG', 'Inference and serving'). Answers stay hidden unless reveal_answers is true: ask the learner first, then call again with reveal_answers to grade and explain. No topic: list topics.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many questions (default: all)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "reveal_answers": {
                "default": false,
                "description": "Include the correct option and its explanation. Keep false while the learner is answering; set true to grade.",
                "type": "boolean"
              },
              "topic": {
                "description": "Topic id or name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fac474493bfc4408ee7b7048143310041a1f444959b5ccbc3c83510c995d739d"
        },
        {
          "name": "roadmap",
          "title": "Role roadmap",
          "description": "The study roadmap for a role (AI Engineer, ML Engineer, Data Scientist): topics in order, core vs useful, each with its lessons and quiz. No role: list the roles.",
          "inputSchema": {
            "properties": {
              "role": {
                "description": "'ai-engineering', 'ml-engineering' or 'data-science' (names like 'AI engineer' work too)",
                "type": "string"
              },
              "with_lessons": {
                "default": true,
                "description": "Include lesson titles and ids for each topic",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8aac0ca97523c5df288b00a5cdd1e80aafebf8f7580075815d0f8faa59845d06"
        },
        {
          "name": "search",
          "title": "Search lessons",
          "description": "Search AIML Rounds lessons by keywords or an interview question. Filter by track (fundamentals, ai-engineering, system-design, papers), type (concept, interview, design, paper) or section/part name. Returns lesson ids for get_lesson.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many lessons to return (1–30, default 8)",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords or a question, e.g. 'KV cache', 'why does RAG retrieve the wrong chunk'",
                "type": "string"
              },
              "section": {
                "description": "Part or section name to filter by, e.g. 'RAG', 'LLMs', 'Recommendation Systems'",
                "type": "string"
              },
              "track": {
                "description": "Limit to one track: fundamentals, ai-engineering, system-design or papers",
                "enum": ["fundamentals", "ai-engineering", "system-design", "papers"],
                "type": "string"
              },
              "type": {
                "description": "concept = lesson, interview = scenario set, design = system design question, paper = paper explained",
                "enum": ["concept", "interview", "design", "paper"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:18dfaf4695f672db5e8ec8266e8269c9165619e3c9cc8cc0aded7cfbbbd047f4"
        },
        {
          "name": "whats_new",
          "title": "What's new",
          "description": "Lessons, designs, quizzes and mock rounds added to the site recently, newest first.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "description": "How many recent items to return (1–60, default 15)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce2eee4c51f822bc2320614c1bc643f9811a9b210ae9b33be20d8f3a0d642c6e"
        }
      ],
      "prompts": [
