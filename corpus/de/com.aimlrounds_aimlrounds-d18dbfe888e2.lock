          "title": "Study a topic",
          "description": "Learn one topic from the AIML Rounds lessons, then check understanding with its quiz.",
          "arguments": [
            {
              "name": "topic",
              "description": "e.g. 'KV cache', 'RAG evaluation', 'bias-variance'",
              "required": true
            }
          ],
          "digest": "sha256:ca0c63b96159ec9d5a822109e241d07f57d23acbf7f2de1ed0a43fbee18eb83e"
