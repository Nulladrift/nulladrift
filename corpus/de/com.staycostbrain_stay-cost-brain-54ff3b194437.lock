            "readOnly": true
          },
          "digest": "sha256:3ef5f52ecd7eb3ce2dfc0f3eb0628dddd9a09662d7070eea6fd5fb6b5d329ab3"
        },
        {
          "name": "hotels_link",
          "title": "Hotels link",
          "description": "A link to live hotel and rental prices for a place or any town and the given dates and guests (Stay22, showing Booking.com, Expedia, Agoda, Vrbo and others). The person sees prices and books there; this tool returns no prices and books nothing. Stay Cost Brain may earn a commission on bookings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Adults staying (default 2)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "child_ages": {
                "description": "Age of each child on check-in, one entry per child (many taxes exempt under-12s, -16s or -18s); omit for none",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "nights": {
                "description": "Number of nights from check_in (1-60)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "A researched place ('Lisbon', 'Algarve', 'Paris') or any town ('Quarteira', 'Funchal', 'Kyoto')",
                "type": "string"
              },
              "town": {
                "description": "Town inside the place to search in (e.g. 'Albufeira' in the Algarve); omit for the whole place",
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "error": {
                "type": "string"
              },
              "for": {
                "type": "string"
              },
