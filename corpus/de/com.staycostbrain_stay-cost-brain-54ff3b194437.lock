      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Stay Cost Brain covers tourist and city taxes on overnight stays: the amount charged on top of the room price, taken from each tax authority's own pages or the law, with the source and the date checked. tourist_tax works out the tax for a stay (place or town, dates, guests, type of stay), night by night, with seasons, star ratings, night caps and children's exemptions. Places not yet researched return researched=false. It has no room prices and does not book: hotels_link returns a link where the person sees live prices and books themselves. Sister services: Car Rental Brain (car hire) https://app.carrentalbrain.com/mcp and Airfare Brain (flight extras) https://airfarebrain.com/mcp.",
      "tools": [
        {
          "name": "get_capabilities",
          "title": "Get capabilities",
          "description": "What Stay Cost Brain covers: the researched places, how the tax figures are sourced and dated, what it does not do (no room prices, no booking), and the sister services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "error": {
