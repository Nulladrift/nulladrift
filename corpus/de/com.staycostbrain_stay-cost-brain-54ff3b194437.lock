        {
          "name": "tourist_tax",
          "title": "Tourist tax",
          "description": "The tourist tax for one stay, worked out night by night: each tax that applies (regional and city parts separately), the amount or the range when the star rating or type of stay is not given, how many nights are charged, how it is paid, announced changes in force on those nights, and the official source and date for each. Accepts a researched place or any town; towns outside the researched places return researched=false. Percentage taxes need room_price_total. Residents', medical and other special exemptions are listed in `rules`, not applied.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Default 2",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "adults_70_plus": {
                "description": "How many of the adults are 70 or over",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "area": {
                "description": "Area/zone code where a place has zones (e.g. Venice)",
                "type": "string"
              },
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "child_ages": {
                "description": "Age of each child on check-in, one entry per child (many taxes exempt under-12s, -16s or -18s); omit for none",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "local_category": {
                "description": "The authority's own category label, as returned in options",
                "type": "string"
              },
              "nights": {
                "description": "Number of nights from check_in (1-60)",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "A researched place ('Lisbon', 'Algarve', 'Paris') or any town ('Quarteira', 'Funchal', 'Kyoto')",
                "type": "string"
              },
              "room_price_total": {
                "description": "Room price for the whole stay, for percentage taxes",
                "type": "number"
              },
              "rooms": {
                "description": "Default 1 (for per-room taxes)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "town": {
                "description": "Town or municipality inside a region (e.g. 'Albufeira' in the Algarve)",
                "type": "string"
              },
              "type_of_stay": {
                "description": "Hotel stars, apartment, holiday rental, etc.",
                "enum": ["hotel_1", "hotel_2", "hotel_3", "hotel_4", "hotel_4_sup", "hotel_5", "hotel_5_luxury", "apartment", "holiday_rental", "guesthouse", "hostel", "campsite", "cruise", "other"],
                "type": "string"
              }
            },
            "required": ["check_in", "nights", "place"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
