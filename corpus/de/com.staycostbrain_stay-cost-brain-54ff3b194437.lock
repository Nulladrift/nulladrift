                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "places": {
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get capabilities"
          },
          "behavior": {
