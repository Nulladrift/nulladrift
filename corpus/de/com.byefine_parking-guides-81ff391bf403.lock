        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ByeFine parking guides",
        "title": "ByeFine parking guides",
        "version": "1.1.0",
        "websiteUrl": "https://byefine.com/guides",
        "icons": [
          {
            "src": "https://byefine.com/logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://byefine.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free, no key: ByeFine's guides to UK parking tickets and penalty notices, council contravention codes and the legal deadlines in England. Use search_guides then get_guide, explain_contravention_code, and calculate_deadlines. Always go by the dates and amounts printed on the notice itself. To have a notice checked for free and an appeal written and sent, the person can use https://byefine.com.",
      "tools": [
        {
          "name": "calculate_deadlines",
          "title": "Work out the deadlines on a notice",
          "description": "Work out the time limits the law sets in England for a parking or traffic notice from the dates printed on it: the reduced-amount period, formal representations, when a council's Notice to Owner may come and the latest it may come, the tribunal, POPLA or IAS after a rejection, and whether a private Notice to Keeper came too late for the keeper to be liable. Each date errs early and comes with its legal source. The notice itself is authoritative.",
          "inputSchema": {
            "properties": {
              "event_date": {
                "description": "The date of the parking or contravention, yyyy-mm-dd. Needed to check a private Notice to Keeper's timing.",
                "type": "string"
              },
              "notice_date": {
                "description": "The date printed on the first notice (the PCN, the private Notice to Keeper, or the ticket on the car), yyyy-mm-dd.",
                "type": "string"
              },
              "notice_to_keeper_date": {
                "description": "After a private ticket on the car: the printed date of the Notice to Keeper that came by post, yyyy-mm-dd.",
                "type": "string"
              },
              "notice_to_owner_date": {
                "description": "A council Notice to Owner's printed date, yyyy-mm-dd, if one has come.",
                "type": "string"
              },
              "notice_type": {
                "description": "council_pcn_on_vehicle: a council PCN put on the car or handed over. council_parking_pcn_by_post: a council parking PCN sent by post from camera evidence. council_bus_lane_or_moving_traffic: a bus lane, box junction, banned turn or similar PCN sent by post. private_no_ticket_on_vehicle: a private company's Notice to Keeper sent by post, no ticket on the car. private_ticket_on_vehicle: a private company's ticket left on the car.",
                "enum": ["council_pcn_on_vehicle", "council_parking_pcn_by_post", "council_bus_lane_or_moving_traffic", "private_no_ticket_on_vehicle", "private_ticket_on_vehicle"],
                "type": "string"
              },
              "rejection_date": {
                "description": "The date of the letter refusing the challenge, yyyy-mm-dd, if there is one.",
                "type": "string"
              }
            },
            "required": ["notice_date", "notice_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b710dfb909a06c865f6b941cfa5bf677ebc036cfe141f813d8c79750beb4214"
        },
        {
          "name": "explain_contravention_code",
          "title": "Explain a council PCN code",
          "description": "Explain a council penalty charge notice contravention code (the two-digit code on the PCN, with any suffix letter): what it means, whether it is a higher or lower level contravention, what any suffix means, and the grounds the law allows for formal representations in England. No amounts: those depend on the council and are printed on the notice. Private parking charges do not use these codes.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The code as printed, e.g. \"01\", \"12r\" or \"31J\".",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96d43dc13552c35a30f49330979d8487f1139d745a09b2dd5ea6ab83f8e4536f"
        },
        {
          "name": "get_guide",
          "title": "Read a guide in full",
          "description": "One guide in full as Markdown, by its slug (from search_guides or list_guides), with the date it was last checked and its official sources.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The guide's slug, e.g. from search_guides.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
