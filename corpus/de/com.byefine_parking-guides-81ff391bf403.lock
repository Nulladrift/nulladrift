        },
        {
          "name": "search_guides",
          "title": "Search the parking ticket guides",
          "description": "Search ByeFine's plain-English guides to UK parking tickets and other penalty notices (council penalty charge notices, private parking charges, bus lanes, a Notice to Owner, a refused appeal, the independent adjudicators, and more). Returns the best matches with a slug for get_guide. General information for England and Wales, not legal advice.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many matches, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in plain words, e.g. \"private parking charge\" or \"notice to owner\".",
                "type": "string"
              }
            },
