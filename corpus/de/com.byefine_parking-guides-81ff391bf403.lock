        },
        {
          "name": "search_contravention_codes",
          "title": "Find a council PCN code",
          "description": "Find council penalty charge notice contravention codes from plain words, e.g. \"disabled bay\", \"yellow box junction\" or \"dropped kerb\". Returns each code, its description and its charge level; use explain_contravention_code for more.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "How many codes, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What happened or what the sign or marking was, in plain words.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
