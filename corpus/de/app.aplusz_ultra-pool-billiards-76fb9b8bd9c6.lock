{
  "lockfileVersion": 2,
  "subjects": {
    "app.aplusz/ultra-pool-billiards": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://poolgame.aplusz.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ultra-pool-billiards",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Billiards terms, eight-ball rules and 45 players, from the game's own copy. found:false means this site has no line about it - do not fill the gap yourself.",
      "tools": [
        {
          "name": "pool_player",
          "description": "Who are the great pool, snooker and carom players, and what is each one known for? 45 players, each with the method they are known for. Filter by part of a name (q), by country as commonly listed, or by ONE lower-case game tag; combine them, or send nothing for all 45. The game tag has exactly one spelling each: eight-ball, nine-ball, ten-ball, rotation, one-pocket, straight pool, snooker, three-cushion carom, money games - '9-ball' and 'Nine-ball' will miss. The order is editorial and is NOT a ranking; do not present a position as a standing.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "As commonly listed. Example: Philippines",
                "maxLength": 60,
                "type": "string"
              },
              "game": {
                "description": "One lower-case tag from the list.",
                "enum": ["eight-ball", "nine-ball", "ten-ball", "rotation", "one-pocket", "straight pool", "snooker", "three-cushion carom", "money games"],
                "type": "string"
              },
              "q": {
                "description": "Part of a name. Example: Reyes",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:395c51de0b7dc525b7cde1db6a4a146e934473da10797d839177405b142aa9e7"
        },
        {
          "name": "pool_rules",
          "description": "How is eight-ball played? The seven rules this game enforces: the break from behind the head string, the open table until the first called pot, calling the ball and the pocket, what counts as a foul, ball in hand anywhere as the penalty, the eight last and only in the called pocket, and what loses the frame. No arguments. THESE ARE THIS GAME'S RULES - WPA eight-ball as the simulation applies it, not the full WPA rule book. For a tournament question cite https://wpapool.com/rules-of-play/ alongside.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e68e2e5cf84befaa85ac00eb62daf4e70e9a70ccc4e95951502e575b78e7959"
        },
        {
          "name": "pool_search",
          "description": "The word could be a term, a game name, a rule, a player or a feature and you do not know which: search every collection in one call. Each hit says which collection it came from and how it matched (exact, key or body). Use this instead of guessing which of the other tools to call. One required argument.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "One word or short phrase. Example: bank",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61e28bb93109c5fd43ca366e7d7a87c5ba47044e15d2408e46b2ea0a1d78d74d"
        },
        {
          "name": "pool_term",
          "description": "What does a pool, billiards or snooker word mean? 36 terms and 27 names of games in the family, one line each - screw, stun, throw, half-ball, snooker, bank, kick, carom, jaws, rattle, scratch, shape, run out, and what separates pool from snooker from carom. One argument: the word itself, one word or short phrase, any case. A whole sentence will match on the explanation or not at all, so pull the word out first. Omit q to get all of them. found:false means THIS SITE has no line about it - it does not mean the term does not exist, and you must not supply a definition of your own in its place.",
          "inputSchema": {
            "properties": {
              "kind": {
                "default": "both",
                "description": "terms = the 36 playing terms; names = the 27 games in the family; both = search each.",
                "enum": ["terms", "names", "both"],
                "type": "string"
              },
              "q": {
                "description": "One word or short phrase. Example: screw",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:409e549b79291a1cefad89c5f73cc373702b824e92da6105687b82a99d71d49b"
        }
      ],
      "digest": "sha256:7a75d0c65da35c32dd66e118208dd31d97e22165ca5c5978b945976fc4b36a5b"
    }
  }
}
