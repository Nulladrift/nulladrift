      },
      "transport": {
        "type": "http",
        "url": "https://snowbelly.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "app.snowbelly/nutrition",
        "title": "Snowbelly Nutrition",
        "version": "1.0.0",
        "websiteUrl": "https://snowbelly.app/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Nutrition lookups and calculators from Snowbelly. Food values come from USDA FoodData Central. Results are estimates for general wellness, not medical advice.",
      "tools": [
        {
          "name": "daily_calories",
          "title": "Daily calorie needs",
          "description": "Estimated resting (BMR) and daily (TDEE) calories with the Mifflin-St Jeor equation, plus a gentle weight-loss target (TDEE - 500). Estimates for general wellness, not medical advice.",
          "inputSchema": {
            "properties": {
              "activity": {
                "enum": ["sedentary", "light", "moderate", "very_active", "extra_active"],
                "type": "string"
              },
              "age": {
                "type": "number"
              },
              "height_cm": {
                "type": "number"
              },
              "sex": {
                "enum": ["female", "male"],
                "type": "string"
              },
              "weight_kg": {
                "type": "number"
              }
            },
            "required": ["age", "height_cm", "sex", "weight_kg"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acc56037a174fa2c7dc7df146cddb9c16e15ed7d34b12439b7c3ef547e72bc99"
        },
        {
          "name": "food_calories",
          "title": "Calories in a food",
          "description": "Calories, protein, fiber, carbs and fat for an everyday food (USDA FoodData Central values), per 100 g and per common portion, or for a given number of grams.",
          "inputSchema": {
            "properties": {
              "food": {
                "description": "e.g. banana, egg, rice, avocado",
                "type": "string"
              },
              "grams": {
                "description": "optional portion in grams",
                "type": "number"
              }
            },
            "required": ["food"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:45cab971a21ccc1af086c99bd9bd02b0782c04adc9726ad0c3aa289db53be3d8"
        },
        {
          "name": "macro_calories",
          "title": "Calories from macros",
          "description": "Calories from grams of protein, carbs, fat and alcohol (4/4/9/7 kcal per gram).",
          "inputSchema": {
            "properties": {
              "alcohol_g": {
                "type": "number"
              },
              "carbs_g": {
                "type": "number"
              },
              "fat_g": {
                "type": "number"
              },
              "protein_g": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afc9ea37e1c4769e3e2f248db5a8d1c3a2433309adef65579b1e704feab674d4"
        },
        {
          "name": "protein_fiber_targets",
          "title": "Protein and fiber targets",
          "description": "Protein RDA (0.8 g/kg/day, a minimum) and fiber Adequate Intake (14 g per 1,000 kcal).",
          "inputSchema": {
            "properties": {
              "calories": {
                "description": "daily calories, default 2000",
                "type": "number"
              },
              "weight_kg": {
                "type": "number"
              }
            },
            "required": ["weight_kg"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a42c5135ffbc4cf8535f1fcedcd74be15d9cba070dd7ba18052c7f59127723ff"
        }
      ],
