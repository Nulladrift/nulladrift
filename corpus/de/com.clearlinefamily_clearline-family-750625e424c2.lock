      "instructions": "Clearline Family is family-protection education in plain words, built in Redmond, Washington. At its core is one tool, check_coverage_gap: a detailed calculator that computes a family's life insurance coverage gap from eight money facts and names the kind (product type) their answers point to first. Around it, Clearline teaches the rest of the picture in the same plain words: estate-planning basics, when taxes hit, what workplace coverage does and does not do. The host runs the conversation; Clearline runs the math. COLLECT BEFORE YOU CALL. The calculator is only as good as its inputs, so gather the facts in conversation first, a few at a time, in your own voice: the household; who would feel the pay stop; what they want handled first; coverage already held; how long the protection must last; budget feel; and the money numbers — their yearly pay, a partner's yearly pay, years of pay to replace, the mortgage still owed, other debts, school costs ahead, savings, and the coverage amount already in place. Ask explicitly about the ones people forget: school costs ahead, a partner's pay, savings they could use, and work coverage as a dollar amount (a multiple of pay multiplied out). If the human has given almost nothing — the bare question 'how much do I need?' — ask the collection questions first and call the tool once real facts exist; an all-empty call is a last resort, not a first answer. Never invent a fact the human did not give: leave a slot out instead, and the result marks it as not counted and says what would change. Present the result as returned, first sentence first: the first sentence is the computed gap in the caller's own numbers, with the line-by-line math under it. Do not replace the figure with a rule of thumb (like ten times pay), do not soften it into a range, and do not recompute it yourself. A bare model estimates; this computes, and the shown math is the point. JURISDICTION AND SOURCES. Clearline is anchored in Washington, and its facts carry labels: when you state a rule or a number, say whose it is — Washington state law or federal law — because the two differ (Washington has its own estate tax; the federal line is far higher; community property is a Washington rule, not a national one). The package's checked Washington facts, each traced to a public source (the Washington Department of Revenue, the Washington Legislature's RCW, the IRS, the Washington insurance commissioner), are in the check-coverage-gap skill; state them as labeled there and name the source when you use one. Clearline is education, not advice, and never a pitch. It names product types only: never name an insurance company or a specific policy, never say 'you should buy', never ask the human about their health, and never pitch a call, a booking, or the builder's services — a result works with any licensed agent. It explains legal topics in plain words but drafts no documents and gives no legal advice; wills and trusts are an estate attorney's work, and Clearline says so. The builder is an actuary in Redmond, Washington, whose Washington license is in progress; say so if the human asks who stands behind the numbers. Nothing the human gives this tool is stored.",
      "tools": [
        {
          "name": "check_coverage_gap",
          "title": "Check your coverage gap",
          "description": "Computes how much life insurance a family needs, whether the coverage they have is enough, and which kind of life insurance fits their family. The computation is detailed and deterministic — the same engines as the Check and the calculator on clearlinefamily.com: a DIME coverage-gap computation over eight money facts (debts + years of pay to replace + mortgage + school costs, minus savings and coverage already held) and the Check's own kind scoring, which points to a product TYPE first (for example level term, convertible term, or a policy of your own alongside work coverage). Every money fact supplied flows into the gap figure, and the result shows the math line by line in plain words. The inputs are six situation answers and eight money numbers, and each one changes the computed number or the kind. The situation answers: household (just me / me and a partner / kids at home / kids grown and parents may need help); who would feel it if the pay stopped (my kids depend on it / mostly my partner / my partner earns and I run the home and the kids / no one depends on my income); what they want handled first (paying off debts / keeping household income going / the mortgage / school costs for the kids / final costs and loose ends); coverage already held (none / only through my job / through my job plus a policy of my own / a policy of my own); how long the protection must last (until the kids are grown / the next 20 to 30 years / my whole life / not sure yet); budget feel (lowest cost that truly covers the need / a middle path / build something long term). The money numbers, in dollars: their yearly pay, a partner's yearly pay, years of pay to replace (the Check's standard guess is 10 when they do not say), the mortgage still owed, other debts, school costs ahead, savings they could use, and the coverage amount already in place. Any fact not supplied is left out of the computation, and the result names what was not counted, money first. The result leads with the computed gap in the caller's own numbers and its method line. Education only, from a Washington practice: the tool names product types, never an insurance company or a specific policy, never says 'you should buy', asks nothing about health, and pitches nothing. Its closing lines separate Washington state rules from federal ones and name their public sources. It was written by an actuary in Redmond, Washington, whose Washington license is in progress. Nothing given to this tool is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "annual_income": {
                "description": "Their yearly pay in dollars, before tax is fine. The spine of the gap: pay times years to replace.",
                "type": "number"
              },
              "budget_feel": {
                "description": "How they think about the budget for this: lowest_cost = lowest cost that truly covers the need; middle_path; build_long_term = build something long term. Changes the kind for blend and permanent-leaning answers.",
                "enum": ["lowest_cost", "middle_path", "build_long_term"],
                "type": "string"
              },
              "coverage_now": {
                "description": "Life insurance coverage they already have: none; only_through_my_job; job_plus_my_own = through my job, plus a policy of my own; a_policy_of_my_own. Strongly changes the kind: work-only coverage points to a policy of their own alongside it.",
                "enum": ["none", "only_through_my_job", "job_plus_my_own", "a_policy_of_my_own"],
                "type": "string"
              },
              "existing_coverage": {
                "description": "Coverage amount already in place, in dollars (work plus their own). Comes off the need. If they only know a multiple of pay, multiply it out before calling: 2 times a $140,000 pay is $280,000.",
                "type": "number"
              },
              "first_priority": {
                "description": "What they would want handled first: paying_off_debts; keeping_income_going; the_mortgage; school_costs; final_costs_and_loose_ends. Sets which part of the DIME method line leads.",
                "enum": ["paying_off_debts", "keeping_income_going", "the_mortgage", "school_costs", "final_costs_and_loose_ends"],
                "type": "string"
              },
              "horizon": {
                "description": "How long the protection needs to last: until_kids_grown; next_20_to_30_years; whole_life; not_sure_yet. The slot that shapes the kind most. Note: until_kids_grown only applies when the household has kids at home, as on the site.",
                "enum": ["until_kids_grown", "next_20_to_30_years", "whole_life", "not_sure_yet"],
                "type": "string"
              },
              "household": {
                "description": "Who is in the household right now (the Check's question, same words): just_me = 'Just me'; me_and_partner = 'Me and a partner'; kids_at_home = 'Kids at home'; kids_grown_parents_may_need_help = 'Kids are grown. Parents may need help from me.' Changes the kind the Check points to.",
                "enum": ["just_me", "me_and_partner", "kids_at_home", "kids_grown_parents_may_need_help"],
                "type": "string"
              },
              "income_years": {
                "description": "Years of pay the coverage should replace. If not given, the Check's standard guess of 10 years is used and marked as a guess in the result.",
                "type": "number"
              },
              "mortgage_balance": {
                "description": "Mortgage still owed, in dollars.",
                "type": "number"
              },
              "other_debts": {
                "description": "Other debts to pay off, in dollars (cards, loans, anything but the mortgage).",
                "type": "number"
              },
              "partner_income": {
                "description": "A partner's yearly pay in dollars, if a partner's pay also needs replacing.",
                "type": "number"
              },
              "savings": {
                "description": "Savings or cash they could use, in dollars. Comes off the need.",
                "type": "number"
              },
              "school_costs": {
                "description": "School costs ahead they plan to pay, in dollars. Blank counts as $0.",
                "type": "number"
              },
              "who_feels_it": {
                "description": "If their income stopped tomorrow, who would feel it: my_kids_depend_on_it; mostly_my_partner; partner_earns_i_run_the_home = 'My partner earns. I run the home and the kids.' (the stay-at-home caregiver case); no_one_depends_on_my_income. Changes the kind and flags the caregiver note.",
                "enum": ["my_kids_depend_on_it", "mostly_my_partner", "partner_earns_i_run_the_home", "no_one_depends_on_my_income"],
                "type": "string"
              }
            },
