                "type": "number"
              },
              "own_coverage": {
                "description": "Coverage from a policy of their own, held outside work, in dollars. Comes off the need and, unlike work coverage, it does not end with the job.",
                "type": "number"
              },
              "partner_income": {
                "description": "A partner's yearly pay in dollars, if a partner's pay also needs replacing.",
                "type": "number"
              },
              "savings": {
                "description": "Savings or cash they could use, in dollars. Comes off the need.",
