        {
          "name": "get_orchestral_horn_excerpt_guide",
          "title": "Standard Orchestral Audition Excerpt Fingering & Pedagogy Guide",
          "description": "Retrieve audition preparation notes, recommended F/Bb trigger fingerings, breathing plans, and historical crook transpositions for standard orchestral French Horn excerpts (Mozart 4, Beethoven 3/7/9, Brahms 1/3, Mahler 5, Strauss Till Eulenspiegel / Ein Heldenleben, Tchaikovsky 5).",
          "inputSchema": {
            "properties": {
              "composerOrWork": {
                "description": "Composer or orchestral work name (e.g. \"Mozart 4\", \"Strauss Till\", \"Tchaikovsky 5\", \"Brahms 3\", \"Beethoven 7\", \"Mahler 5\")",
                "type": "string"
              }
            },
            "required": ["composerOrWork"],
            "type": "object"
          },
