          "name": "lookup_french_horn_fingering",
          "title": "French Horn F/Bb Double Horn Fingering Lookup",
          "description": "Look up standard F-side and Bb-trigger valve fingerings, concert pitch transposition (down a perfect fifth), and harmonic tendency notes for any written French Horn note (e.g. \"C4\", \"F4\", \"G4\", \"Bb4\", \"C5\", \"F5\").",
          "inputSchema": {
            "properties": {
              "note": {
                "description": "Written note name with octave (e.g. \"C4\", \"F4\", \"G4\", \"Bb4\", \"C5\", \"F5\")",
                "type": "string"
