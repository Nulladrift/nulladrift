          "name": "recommend_beginner_horn_and_mouthpiece",
          "title": "French Horn Wrap (Kruspe vs Geyer) & Mouthpiece Selector",
          "description": "Compare Kruspe wrap (Conn 8D style, dark orchestral projection, larger bell throat) vs Geyer/Knopf wrap (Yamaha 667/671, Alexander 103 style, smooth slurs, medium throat) and recommend mouthpiece cup depths and rim diameters by player level.",
          "inputSchema": {
