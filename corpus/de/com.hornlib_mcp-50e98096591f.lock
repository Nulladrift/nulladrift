      "tools": [
        {
          "name": "analyze_horn_harmonic_series",
          "title": "French Horn Overtone & Harmonic Series Analyzer",
          "description": "Analyze the natural harmonic overtone series (partials 2 through 16) for any F-horn or Bb-horn valve combination, returning equal-temperament cent deviations (e.g. -14 cents on 5th partial, -31 cents on 7th partial) and alternate valve solutions.",
          "inputSchema": {
            "properties": {
              "hornSide": {
                "description": "Horn side tube length: \"F\" (open fundamental F1) or \"Bb\" (trigger fundamental Bb1)",
                "enum": ["F", "Bb"],
                "type": "string"
              },
              "valves": {
                "description": "Valve combination (e.g. \"0\", \"2\", \"1\", \"1-2\", \"2-3\", \"1-3\", \"1-2-3\")",
                "type": "string"
              }
            },
            "required": ["hornSide"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Horn Harmonic Series Analyzer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e883c0eae0f2bb4791616d0ed42018dec0c9f58f26c598ea29fc93972601172a"
        },
        {
          "name": "diagnose_horn_intonation_and_hand_position",
          "title": "French Horn Intonation, Right-Hand Bell Position & Stopped Horn Diagnostic",
          "description": "Diagnose pitch tendencies, right-hand bell acoustics, and Stopped Horn (gestopft / +) transposition rules (transpose down a half-step on the F horn side to compensate for the +1/2 step acoustic shortening when sealing the bell).",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Acoustic or intonation topic to diagnose",
                "enum": ["stopped-horn", "muted-horn", "sharp-high-register", "flat-5th-partial", "right-hand-cup"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Horn Intonation & Bell Acoustics Diagnostic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
