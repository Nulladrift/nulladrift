            "readOnly": true
          },
          "digest": "sha256:e549e7e85ac480050cf824a902082404cff2c46143a0015134101d21af84e233"
        },
        {
          "name": "generate_daily_horn_warmup_routine",
          "title": "Daily French Horn Warm-Up & Embouchure Routine Generator",
          "description": "Generate a structured daily French Horn warm-up schedule covering harmonic lip slurs, Farkas long tones, double/triple tonguing, low-register pedal tones, and dynamic control tailored to available practice time.",
          "inputSchema": {
            "properties": {
              "durationMinutes": {
                "description": "Available warm-up duration in minutes (e.g. 15, 30, 45, 60)",
                "type": "number"
              },
              "focusArea": {
                "description": "Primary technical focus area for the session",
                "enum": ["balanced", "high-range-endurance", "low-register-response", "legato-lip-slurs", "articulation-agility"],
                "type": "string"
              }
            },
            "required": ["durationMinutes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Daily Horn Warm-Up Generator"
