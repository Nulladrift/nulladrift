        {
          "name": "transpose_french_horn_pitch",
          "title": "Historical & Orchestral French Horn Transposition Calculator",
          "description": "Transpose written French Horn parts from historical orchestral crooks (Horn in Eb, D, C, G, A, E, Bb-alto, Bb-basso) to modern Horn in F written pitch and Concert Pitch, with interval semitone shifts and clef rules.",
          "inputSchema": {
            "properties": {
              "sourceCrook": {
                "description": "Historical horn crook marked in the score (e.g. \"Eb\" for Beethoven Eroica, \"D\" for Bach/Mozart, \"C\" for Brahms)",
                "enum": ["Eb", "D", "C", "G", "A", "E", "Bb-alto", "Bb-basso", "F"],
                "type": "string"
              },
              "writtenNote": {
                "description": "Written note in the original orchestral score (e.g. \"C4\", \"G4\", \"E5\")",
