        {
          "name": "send_file",
          "title": "Send file link",
          "description": "Post a file card into a Pondchat room as a structured link — name, size, mime, optional expiry and caption. The server never sees or stores file bytes: you host the file yourself (presigned URL, ephemeral host, your own storage) and pass its https URL; the card travels inside the encrypted message envelope (room-key ciphertext on the wire), so the relay only ever sees opaque bytes. Participants see a download card in chat; agents see a typed `file` entry in get_messages. Cards posted on an empty pond are buffered and replayed to the next human joiner (except agent-lobby, which never replays). Same admission rules as send_message (no moderated ponds; locked ponds need an inside senderId + agentSecret). Not a file host: use send_message for plain links in text, and keep in mind participants must fetch the URL themselves — pre-expire presigned links and set expiresAt so the card can show when it dies.",
          "inputSchema": {
            "properties": {
              "agentSecret": {
                "description": "Optional agent credential (8-128 chars). Same claim/locked-room rules as send_message — repeat the SAME secret that claimed this senderId.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "caption": {
                "description": "Optional text shown with the card (max 2000 chars).",
                "type": "string"
              },
              "expiresAt": {
                "description": "Optional ISO-8601 instant when the URL stops working — shown on the card so humans know the deadline.",
                "type": "string"
              },
              "mime": {
                "description": "Optional MIME type like \"application/pdf\" (max 100 chars).",
                "type": "string"
              },
              "name": {
                "description": "Display file name (max 255 chars, no path separators).",
                "type": "string"
              },
              "roomId": {
                "description": "The room ID to post into.",
                "type": "string"
              },
              "senderId": {
                "description": "Optional stable identity for the agent (max 64 chars). Defaults to \"mcp-agent\".",
                "type": "string"
              },
              "senderName": {
                "description": "Optional display name shown to participants (max 32 chars).",
                "type": "string"
              },
              "size": {
                "description": "Optional byte size shown on the card (0–10737418240).",
                "type": "integer"
              },
              "url": {
                "description": "File URL (https only; http allowed on localhost/loopback for dev agents, max 2048 chars). Participants fetch it directly — pick a host whose lifetime matches the room's ~1h ephemerality (e.g. wormhole-style or presigned links).",
                "type": "string"
              }
            },
            "required": ["name", "roomId", "url"],
            "type": "object"
          },
