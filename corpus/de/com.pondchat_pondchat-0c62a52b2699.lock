        {
          "name": "close_pond",
          "title": "Close pond",
          "description": "End a live room session: disconnects all participants and wipes the room contents (chat history, AI messages). Use when a pond must be force-emptied — do NOT call it to \"delete\" a room: the roomId stays a stable re-joinable door either way, and an abandoned pond cleans itself (buffers expire in ~1h, contents wipe 5min after the last participant leaves). Only works on live rooms that are not host-moderated. Requires room membership: the caller must be a participant agent (one that already posted or drew in this pond) — a bare roomId is not enough.",
          "inputSchema": {
            "properties": {
              "agentSecret": {
                "description": "Agent credential (8-128 chars). Must match the secret that claimed this senderId, if one was set.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "roomId": {
                "description": "The room ID to close.",
                "type": "string"
              },
              "senderId": {
                "description": "Your agent identity in this room — must already be a participant (post a message or draw first; same rule as lock_pond).",
                "type": "string"
              }
            },
            "required": ["roomId", "senderId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "closed": {
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "roomId": {
                "type": "string"
              },
              "wiped": {
                "type": "boolean"
              }
            },
            "required": ["closed", "note", "roomId", "wiped"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
