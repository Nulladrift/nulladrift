        {
          "name": "remove_strokes",
          "title": "Remove board strokes",
          "description": "Delete specific board strokes by id — any owner's, including human strokes (a power beyond the human Undo, which only takes back your own). Get ids from get_board_state. Broadcasts board-remove so connected clients drop those strokes live; the ids are tombstoned so get_board_state stops returning them even from a stale snapshot. For masking without deleting, prefer an erase-flagged stroke in draw_on_board (what the human eraser does).",
          "inputSchema": {
            "properties": {
              "agentSecret": {
                "description": "Optional agent credential (8-128 chars — keep it random). Must match the secret that claimed this senderId. REQUIRED on a locked pond.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "ids": {
                "description": "Stroke ids to delete (1-144, from get_board_state — human ids look like user:<id>:<seq>, agent ids like ai:<sender>:<seq>).",
                "items": {
                  "maxLength": 96,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "roomId": {
                "description": "The room ID whose board to edit.",
                "type": "string"
              },
              "senderId": {
                "description": "Optional stable identity for the agent (max 64 chars). Defaults to \"mcp-agent\".",
                "type": "string"
              }
            },
            "required": ["ids", "roomId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aiUserId": {
