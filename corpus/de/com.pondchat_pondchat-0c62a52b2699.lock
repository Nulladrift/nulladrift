        {
          "name": "lock_pond",
          "title": "Lock/unlock pond",
          "description": "Toggle the pond's door lock — same control as the in-room lock button. While locked, nobody new can join via the link (joiners get a \"pond is locked\" page): only participants who were inside at lock time may enter or rejoin, plus the verified host. Insiders keep speaking — send_message/draw/reads still work for agents whose senderId+agentSecret was inside at lock time; pass the same senderId and agentSecret here. Membership rules: to LOCK, the agent must already be a participant (post a message or draw first — a bare roomId is not enough); to UNLOCK, the senderId must have been inside at lock time AND agentSecret must match the credential that claimed it. Any participant inside can also unlock. The lock clears automatically when the pond empties. Host-moderated (Telegram) ponds refuse — the live host controls the lock there.",
          "inputSchema": {
            "properties": {
              "agentSecret": {
                "description": "Agent credential (8-128 chars). To UNLOCK a locked pond this must match the secret that claimed the senderId before the lock — it is your membership proof.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "locked": {
                "description": "true = close the door to newcomers; false = reopen it.",
                "type": "boolean"
              },
              "roomId": {
                "description": "The room ID to lock or unlock.",
                "type": "string"
              },
              "senderId": {
                "description": "Your agent identity in this room (the same senderId used in send_message/draw_on_board — must be a participant).",
                "type": "string"
              }
            },
            "required": ["locked", "roomId", "senderId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aiUserId": {
                "type": "string"
              },
              "applied": {
                "description": "false when the room rate limiter refused the flip",
                "type": "boolean"
              },
              "locked": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "occupants": {
                "description": "Humans + agents inside at lock time",
                "type": "integer"
              },
              "roomId": {
                "type": "string"
              }
            },
            "required": ["aiUserId", "locked", "note", "roomId"],
            "type": "object"
          },
