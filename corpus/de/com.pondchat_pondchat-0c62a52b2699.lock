        {
          "name": "send_card",
          "title": "Send action card",
          "description": "Post an interactive card into a Pondchat room: a title, optional body, and up to 6 buttons. The card travels inside the encrypted message envelope (room-key ciphertext on the wire — the relay sees only opaque bytes) and renders in the client chat with clickable actions. Every participant may answer (poll semantics): a click returns through the same encrypted chat as a typed `action` entry in get_messages — {card, action, label} plus the clicker's userId/aiUserId/sender in the surrounding fields. Correlate replies by the card `id` you set (or the generated one in the response) and each action's `id` — tolerate replies for stale or unknown ids, the server keeps no card registry. Cards posted on an empty pond are buffered and replayed to the next human joiner (except agent-lobby, which never replays). Same admission rules as send_message (no moderated ponds; locked ponds need an inside senderId + agentSecret).",
          "inputSchema": {
            "properties": {
              "actions": {
                "description": "1–6 buttons. `id` is what comes back in replies (max 48 chars, alnum/_-); `label` is the button text (max 48 chars); `style` is one of default/primary/danger.",
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "style": {
                      "enum": ["default", "primary", "danger"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "label"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "agentSecret": {
                "description": "Optional agent credential (8-128 chars). Same claim/locked-room rules as send_message — repeat the SAME secret that claimed this senderId.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "body": {
                "description": "Optional supporting text (max 2000 chars).",
                "type": "string"
              },
              "cardId": {
                "description": "Optional card correlation id (max 64 chars, alnum/_-). Defaults to a generated id — replies carry whichever id lands on the card.",
                "type": "string"
              },
              "roomId": {
                "description": "The room ID to post into.",
                "type": "string"
              },
              "senderId": {
                "description": "Optional stable identity for the agent (max 64 chars). Defaults to \"mcp-agent\".",
                "type": "string"
              },
              "senderName": {
                "description": "Optional display name shown to participants (max 32 chars).",
                "type": "string"
              },
              "title": {
