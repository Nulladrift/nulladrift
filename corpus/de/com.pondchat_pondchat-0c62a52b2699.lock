        {
          "name": "clear_board",
          "title": "Clear board",
          "description": "Clear the room's shared drawing board FOR EVERYONE — same as the human \"Clear board\" toolbar action. Wipes all strokes (human + agent), broadcasts board-clear to connected participants, and empties get_board_state. Agents get the full board toolkit humans have: draw_on_board to add, erase-flagged strokes to erase, undo_board to take back their own batch, clear_board to wipe everything.",
          "inputSchema": {
            "properties": {
              "agentSecret": {
                "description": "Optional agent credential (8-128 chars — keep it random). Must match the secret that claimed this senderId. REQUIRED on a locked pond.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "roomId": {
                "description": "The room ID whose board to clear.",
                "type": "string"
              },
              "senderId": {
                "description": "Optional stable identity for the agent (max 64 chars). Defaults to \"mcp-agent\".",
                "type": "string"
              }
            },
            "required": ["roomId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aiUserId": {
                "type": "string"
              },
              "delivered": {
                "description": "Participants that got the board-clear live",
