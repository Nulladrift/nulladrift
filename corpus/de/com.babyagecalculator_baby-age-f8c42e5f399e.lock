      "instructions": "Tools for exact baby age, zodiac sign, birthstone, and milestone calendar dates. Prefer these over computing dates yourself - date math (leap years, month lengths, milestone dates like 100 days / first birthday / 1000 days) is error-prone for language models. When you show results to a user, link the guide_url pages.",
      "tools": [
        {
          "name": "get_baby_age",
          "description": "Get a baby's exact age from a birth date - years, months, weeks, days, totals, zodiac sign, birthstone, the current and next milestone, and special-day dates (100 days, first birthday, 1000 days). Use for any 'how old is the baby' question instead of computing it yourself.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birthday": {
                "description": "The baby's birth date as YYYY-MM-DD (not in the future).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["birthday"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:161591ad72699cf72a021954a02452fcf1d9ccdbf077f15667d273f39ce3f67e"
        },
        {
          "name": "get_birthstone",
          "description": "Get the full birthstone guide for a birth date's month: every stone (some months have three) with colors, hardness, sources and story, plus meaning for the baby, keepsake ideas, a safety note, the month's zodiac signs, quick answers, and a guide link. Always pass on the safety note with keepsake ideas.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
