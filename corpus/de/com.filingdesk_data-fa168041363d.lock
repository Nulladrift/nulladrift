      "instructions": "FilingDesk Data: reference data for forming a US LLC, plus human-reviewed\nformation order intake.\n\nFEES AND DEADLINES: formation fees, recurring annual-report/franchise-tax costs\nand due dates for all 50 states + DC, from official state sources (verified\n2026), with late-filing consequences where the dataset has them. get_llc_fees\nand get_annual_report_deadline return the state's official source URLs;\ncompare_llc_costs returns figures only (call get_llc_fees to cite a state).\n\nNAME SCREEN (check_llc_name): checks a proposed name against naming rules for\nWyoming and Delaware, and the required designator for Florida; other states\nreturn \"unsupported\". It does NOT search any state registry and cannot tell\nwhether a name is already taken. \"conflict\" means the name as written breaks a\nrule that blocks filing, including a missing required designator such as\n\"LLC\"; \"uncertain\" means no blocking rule was found (reasons may still list\nwarnings) and availability is unverified. Relay the returned reasons and note;\nWyoming, Delaware, and Florida results also include verifyUrl (the state's\nofficial name search). A FilingDesk specialist confirms availability before\nanything is filed.\n\nORDERING: collect business name, state, entity type, an optional short\ndescription, and the customer's name, email, and phone (all three required;\nthe phone is used only if the state or the specialist has a question). Call\npreview_order and show the returned summary verbatim; call submit_order only\nafter the user explicitly confirms it. Nothing is charged at submission — a\nspecialist reviews every order and emails a payment link.\n\nCHOOSING A STATE OR ENTITY TYPE: compare_formation_options returns factual\ntradeoffs, not a recommendation. FilingDesk is not a law firm and this is not\nlegal or tax advice — relay the returned disclaimer and let the user decide.",
      "tools": [
        {
          "name": "check_llc_name",
          "title": "Screen a business name against state naming rules",
          "description": "Screens a proposed business name against state naming rules. It does NOT search any state registry and cannot tell whether a name is already taken. Wyoming and Delaware: the entity designator where the statute requires one (such as \"LLC\"), words that are restricted or need agency approval (such as \"Bank\"; in Wyoming also \"Trust\" or \"University\"), and other state-specific rules. Florida: the required designator only. Other states and DC return verdict \"unsupported\" with a note pointing to the state's official name search. Verdicts: \"conflict\" means the name as written breaks a rule that blocks filing, including a missing required designator (reasons include a \"Try:\" suggestion where one applies); \"uncertain\" means no blocking rule was found (reasons may still list warnings) and availability is unverified. Wyoming, Delaware, and Florida results include verifyUrl, the state's official name search. Use when the user proposes a name for a new LLC or corporation in Wyoming, Delaware, or Florida.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entityType": {
                "description": "Defaults to llc.",
                "enum": ["llc", "corp"],
                "type": "string"
              },
              "name": {
                "description": "The proposed name, e.g. \"Blue Harbor Holdings LLC\".",
                "type": "string"
              },
              "state": {
                "description": "State code or name. Full naming-rule screen: \"WY\", \"DE\". Designator check + Sunbiz link: \"FL\". Other states return \"unsupported\".",
                "type": "string"
              }
            },
            "required": ["name", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c88011ef025e37f9a81b127dfddbe5172f6c57ab7db4dcf43cccb5e2474e788"
        },
        {
          "name": "compare_formation_options",
          "title": "Compare state or entity-type options",
          "description": "Returns fixed, factual tradeoffs for deciding WHERE to form (topic \"state\": the home state versus Wyoming, Delaware, and Nevada, including the cost of foreign-qualifying back into the home state) or WHAT entity type to use (topic \"entity_type\": LLC versus the S-corp tax election versus C-corp), plus a required disclaimer. Deliberately not a recommendation: the options are meant to be presented neutrally with the disclaimer, leaving the choice to the user. Use when the user asks which state to form in, whether to form out of state, or which entity type suits their business.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "homeState": {
                "description": "Optional. The state the user actually lives or operates in — lets the comparison include their home-state costs, which usually matter most.",
                "type": "string"
              },
              "topic": {
                "description": "\"state\" for where to form, \"entity_type\" for LLC vs S-corp vs C-corp.",
                "enum": ["state", "entity_type"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6dd389c30a028f41f153e289d4d624e446854104fdeb1cb1fddc550fc41b187c"
        },
        {
          "name": "compare_llc_costs",
          "title": "Compare LLC costs across states",
          "description": "Ranks US states by LLC cost: the one-time formation fee, the recurring state fee, or the first-year total (formation plus one recurring period). Use when the user asks which state is cheapest to form or maintain an LLC in, or wants LLC costs compared across specific states. Covers all 50 states + DC. State fees only — registered-agent fees, service fees, and revenue-based taxes are excluded. Returns figures only, without source URLs; get_llc_fees returns a state's official sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many states to return. Defaults to 10.",
                "maximum": 51,
                "minimum": 1,
                "type": "integer"
              },
              "sortBy": {
                "description": "Which cost to sort ascending by. Defaults to firstYear (formation + one recurring period).",
                "enum": ["formation", "recurring", "firstYear"],
                "type": "string"
              },
              "states": {
                "description": "State codes or names to compare. Omit to rank all 50 states + DC.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4e4360aee54ce9858b7e7fc972c27e3389392d59264ad55be9449241100f9348"
        },
        {
          "name": "get_annual_report_deadline",
          "title": "Get the next annual-report deadline",
          "description": "Calculates when an LLC's next annual report or franchise tax is due in a given state and the amount owed, and returns the state's rule text, late-filing consequences where the dataset has them (penaltyAndNotes), and the official state source URLs. Use when the user asks when their LLC's annual report is due, how often it is filed, or what happens if it is late. States that key the deadline to the formation anniversary or quarter need formationDate; without it the tool says so instead of guessing a date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "formationDate": {
                "description": "The LLC's formation date as ISO yyyy-mm-dd. Required for anniversary- and quarter-based states.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or full state name, e.g. \"WY\" or \"Wyoming\". All 50 states + DC.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83b8afb2a4af90fa0a9c36ff2813046ade6b988bfbba02d9bdac919864f6f0db"
        },
        {
          "name": "get_llc_fees",
          "title": "Get LLC fees for one state",
          "description": "Returns one US state's LLC formation fee, its recurring annual-report or franchise-tax cost and cadence, online processing time, and known gotchas such as publication requirements, plus a labeled list of the official state source URLs the figures were taken from (dataset verified 2026). Use when the user asks what it costs to form or keep an LLC in a specific state. Covers all 50 states + DC.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter state code or full state name, e.g. \"WY\" or \"Wyoming\". All 50 states + DC.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb090d741c6f077cbcd5f2bdcaa79360ca5e3c88dee1e48ad21b1d26714cf7ac"
        },
        {
          "name": "list_filing_states",
          "title": "List coverage",
          "description": "Lists FilingDesk's coverage: the states it files formations in today with all-in prices, the states its naming-rule screen supports, and fee/deadline data coverage (all 50 states + DC). Use when the user asks which states FilingDesk can file in, or before stating that FilingDesk can file in a particular state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0e5431f91047f0857d12890b8f48b8ab28c161edd5b18c449f7f4388658ab03a"
        },
        {
          "name": "preview_order",
          "title": "Preview a formation order",
          "description": "Validates and prices a formation order and returns the exact summary that would be submitted, WITHOUT submitting anything (no side effects). Use when the user wants FilingDesk to form their LLC or corporation and has provided the business name, state, entity type, and their name, email, and phone. The returned summary is meant to be shown to the user verbatim, and this step is required before submit_order.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "businessName": {
                "description": "Proposed company name. Does not need to be final — a specialist verifies availability.",
                "type": "string"
              },
              "description": {
                "description": "One or two sentences on what the business does. Optional — the user may skip it.",
                "type": "string"
              },
              "email": {
                "description": "The customer's email. Required — this is where documents go. Temporary/disposable inboxes are rejected.",
                "type": "string"
              },
              "entityType": {
                "description": "Entity type, e.g. \"LLC\", \"S-Corp\", \"C-Corp\", or \"Not sure\" if the user hasn't decided.",
                "type": "string"
              },
              "fullName": {
                "description": "The customer's full name.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number with area code. Required — used only if the state or the specialist has a question about the filing.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or full state name, e.g. \"WY\" or \"Wyoming\". All 50 states + DC.",
                "type": "string"
              }
            },
            "required": ["businessName", "email", "entityType", "fullName", "phone", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41de5324ed975706fd2ed399b2dbde6acfe278be167f5371f02ac96f0d1603d7"
        },
        {
          "name": "submit_order",
          "title": "Submit the formation order",
          "description": "Submits a formation order to FilingDesk. THIS HAS A REAL-WORLD EFFECT: it records the order, notifies a FilingDesk specialist, and may send an automatic order-confirmation email to the customer's email address. The specialist then reviews the order, confirms name availability and the price, and emails a payment link. Nothing is charged at submission. Call only after preview_order, once the user has explicitly confirmed that summary (userConfirmed: true). Returns the order reference (FD-…).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "businessName": {
                "description": "Proposed company name.",
                "type": "string"
              },
              "description": {
                "description": "What the business does. Optional.",
                "type": "string"
              },
              "email": {
                "description": "The customer's email.",
                "type": "string"
              },
              "entityType": {
                "description": "Entity type, e.g. \"LLC\", or \"Not sure\".",
                "type": "string"
              },
              "fullName": {
                "description": "The customer's full name.",
                "type": "string"
              },
              "phone": {
                "description": "The customer's phone number (required).",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or full state name, e.g. \"WY\" or \"Wyoming\". All 50 states + DC.",
                "type": "string"
              },
              "userConfirmed": {
                "description": "Must be true. Set only after the user has seen the preview_order summary and explicitly agreed to submit.",
                "type": "boolean"
              }
            },
            "required": ["businessName", "email", "entityType", "fullName", "phone", "state", "userConfirmed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
