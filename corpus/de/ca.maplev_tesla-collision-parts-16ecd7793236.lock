{
  "lockfileVersion": 2,
  "subjects": {
    "ca.maplev/tesla-collision-parts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://maplev.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "maplev-mcp",
        "title": "MapleV Parts Catalog",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MapleV sells aftermarket collision body parts for the Tesla Model 3 and Model Y online to Tesla owners and body shops across Canada. It is based in Greater Vancouver, British Columbia, and ships to any address in Canada. Use `list_categories` to browse the catalog, `search_parts` to find parts by keyword / OE number / model / grade, `get_part` to fetch full details for one SKU (by catalog id or Tesla OE part number), and `get_delivery_options` to see how an order reaches a given Canadian city: same-day and next-day delivery across Metro Vancouver and the Fraser Valley (2-hour rush in the metro core, order by 11 AM Vancouver time), ground courier with the typical per-province transit time everywhere else in Canada. Prices returned are CAD list prices; wholesale net pricing requires an approved MapleV account. Live per-SKU stock quantity is deliberately not exposed here — confirm availability for a specific order with MapleV directly. All four tools are read-only: nothing here places an order; checkout happens on maplev.ca.",
      "tools": [
        {
          "name": "get_delivery_options",
          "title": "Get delivery options for a city",
          "description": "Given a delivery city anywhere in Canada (province recommended), return MapleV's delivery options with ETA, cut-off time and CAD fee. Inside the local delivery area (Metro Vancouver and the Fraser Valley, BC): same-day and next-day delivery, plus 2-hour rush in the metro core. Everywhere else in Canada: ground courier with the typical transit time for the destination province, freight quoted at checkout. Answers questions like 'can MapleV get this part to my shop in Abbotsford today?' or 'how long does shipping to Calgary take?'. Fees are customer-facing CAD; local delivery is free on orders at or above the published threshold, and courier shipping is free from CA$300 to a BC address and CA$500 to any other province (after discounts; bumper covers excepted); Yukon, the Northwest Territories and Nunavut pay the carrier's rate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "Delivery city, e.g. 'Burnaby', 'Abbotsford', 'Calgary', 'Toronto'.",
                "minLength": 1,
                "type": "string"
              },
              "orderSubtotalCAD": {
                "description": "Order subtotal in CAD, used only to show whether the free-delivery threshold is met. Defaults to 0.",
                "minimum": 0,
                "type": "number"
              },
              "province": {
                "description": "Province or territory, as a code or name ('BC', 'Alberta', 'Québec'). Give it for any city outside Metro Vancouver: the transit estimate is per province, and without it a city outside the local BC delivery area gets only a generic ground-courier answer.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2edbdf4140743517494ae9a8d9e79b15c2bbf2362051ecf46fa89ddee9a92833"
        },
        {
          "name": "get_part",
          "title": "Get part details",
          "description": "Look up a single MapleV part by its catalog id (e.g. 'P-001') or by any Tesla OE part number / variant. Returns full details including grade, fitment, and CAD list price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "identifier": {
                "description": "Catalog id like 'P-001', or an OE part number such as '1519965-SC-B'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["identifier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8709fae6cd82518e4e00ea9d6bb54902c67651ee60b8ccefc8f13310007699d8"
        },
        {
          "name": "list_categories",
          "title": "List catalog categories",
          "description": "List all part categories in the MapleV Tesla collision catalog with the number of SKUs in each.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af661bffb820e495f302ff53796142badf0940bf51c43f6b2fef455df942f731"
        },
        {
          "name": "search_parts",
          "title": "Search parts",
          "description": "Search MapleV's Tesla Model 3 / Model Y collision parts catalog by keyword, OE part number, vehicle model, or category. Returns matching parts with names, OE numbers, grade, category, and CAD list price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Filter by category name, e.g. 'Front Bumpers', 'Lighting'.",
                "type": "string"
              },
              "grade": {
                "description": "Filter by part grade.",
                "enum": ["Aftermarket", "CAPA", "OEM", "OEM-Reman"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Filter to parts that fit this Tesla model.",
                "enum": ["Model 3", "Model 3 Highland", "Model Y", "Model Y Juniper", "Universal"],
                "type": "string"
              },
              "query": {
                "description": "Free-text search, any word order: part words, model name and/or OE part number, e.g. 'Model Y front bumper', 'Juniper tail lamp bracket', '1084168'. English, French (Québec shop terms) and Chinese are understood. A 7-digit OE base matches every revision we hold. A model year (e.g. '2021') is applied as a fitment-year filter. Parts matching every word are returned first; if none do, the closest matches are returned and the answer says so.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b3ebdeca2e648d8144abe7ca322030d1e52f02f4c6d0a7dad2f72ec30baa9443"
        }
      ],
      "digest": "sha256:35b3c2776318846c1f2bee3309d6706acd249cb859a277b44b17133530ebc35a"
    }
  }
}
