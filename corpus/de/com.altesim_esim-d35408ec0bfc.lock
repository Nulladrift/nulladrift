{
  "lockfileVersion": 2,
  "subjects": {
    "com.altesim/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://altesim.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "altesim",
        "title": "Alt eSIM",
        "version": "1.36.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Alt eSIM travel data eSIMs. Start with get_shop_facts. Browse via list_destinations / search_esim_plans / recommend_plans / get_esim_plan. create_checkout (buyer email) returns a Stripe payment link; get_qr_code after pay. Quote only catalog prices (USD). Never invent product URLs.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Create a secure Stripe payment link for an Alt eSIM plan. Returns a payment URL the BUYER opens to pay (the agent never handles card details) AND a checkout_session_id. After the buyer pays, call get_qr_code with that checkout_session_id to fetch the eSIM QR and show it to the buyer. The QR is also emailed. Charged in USD. You MUST collect the buyer's real email.",
          "inputSchema": {
            "properties": {
              "customer_code": {
                "description": "Optional Alt customer code (format Alt-XXXXXXXX, shown on the buyer's altesim.com account page). If provided, the order is linked to that account and appears in its order history regardless of the delivery email used.",
                "type": "string"
              },
              "email": {
                "description": "Buyer's email — the eSIM QR code is also sent here.",
                "type": "string"
              },
              "lang": {
                "description": "Delivery email language (default 'en').",
                "enum": ["en", "zh-hk", "zh-tw", "zh-cn", "id", "hi", "es", "fr", "nl", "ru", "uk", "kk", "uz", "pl", "cs", "hu", "ro", "de", "it", "pt", "tr", "el", "ar", "ja", "ko", "th", "vi", "ms", "tl", "bn", "sv", "da", "nb", "fi", "bg", "hr", "sk", "sl", "sr", "lt", "lv", "et"],
                "type": "string"
              },
              "sku_or_id": {
                "description": "The plan sku or id to buy.",
                "type": "string"
              }
            },
            "required": ["email", "sku_or_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d569d10943abe1534bcefad703a455cf1cfa35c310ce5ef4243db3725856b7fb"
        },
        {
          "name": "get_esim_plan",
          "description": "Get one Alt eSIM plan by its sku or id. Returns full details: title, data amount, validity days, USD price, coverage carriers, product URL.",
          "inputSchema": {
            "properties": {
              "sku_or_id": {
                "description": "The plan sku (e.g. 'eSIM_Alt_JP_1DG1') or id.",
                "type": "string"
              }
            },
            "required": ["sku_or_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e63adbe108bab451a2ff9f9450703eb3f63c997376938e0814e85c60a82cc1df"
        },
        {
          "name": "get_qr_code",
          "description": "Fetch the eSIM QR code(s) for an order, to show the buyer directly. Pass the checkout_session_id from create_checkout. Returns a clear `status`: 'awaiting_payment' (buyer has NOT paid — tell them to pay), 'processing' (paid, eSIM still provisioning — retry in ~30s), 'manual_review' (paid, activation paused for security review; ask buyer to contact support@altesim.com with the order reference), 'ready' (returns the QR image(s) + ICCID(s) to display), 'expired', 'refunded', or 'failed'. Use the status to tell the buyer exactly what's happening — never assume payment succeeded.",
          "inputSchema": {
            "properties": {
              "checkout_session_id": {
                "description": "The checkout_session_id from create_checkout (Stripe session id).",
                "type": "string"
              }
            },
            "required": ["checkout_session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f274efdd26545e59b4b28743532ac079636a7d706dd1d823ae2b0f8f13f0c48"
        },
        {
          "name": "get_shop_facts",
          "description": "Shop rules for Alt eSIM in the shop's own words: product model, currency, refund policy, payment/delivery, and how agents must quote prices/URLs. Call this before recommending or buying.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8cad1a1406ca49174c9b5acb72b6dcd129c92f7829f351b065312921884a062a"
        },
        {
          "name": "list_destinations",
          "description": "List all Alt eSIM destinations (country/region slugs with English names and region). Use a slug as the 'country' argument for search_esim_plans / recommend_plans.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96bf0b644215426438cfe1461c250482d30ac077faab784001e716acd4300535"
        },
        {
          "name": "recommend_plans",
          "description": "Recommend up to a few real catalog plans for one destination. Ranks existing SKUs by trip days and usage (light≈0.5 / normal≈1.5 / heavy≈4 GB/day) — never invents prices or URLs. Prefer this for 'what should I buy?'.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Destination slug, e.g. 'japan', 'thailand', 'europe'.",
                "type": "string"
              },
              "days": {
                "description": "Trip length in days (optional). Prefers plans whose validity is close.",
                "type": "number"
              },
              "limit": {
                "description": "How many plans to return (1–8, default 3).",
                "type": "number"
              },
              "max_price_usd": {
                "description": "Optional max USD price filter.",
                "type": "number"
              },
              "usage": {
                "description": "Data intensity: light≈0.5, normal≈1.5, heavy≈4 GB/day (ranking only).",
                "enum": ["light", "normal", "heavy"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c61f700c8794ca714c46ef059409e6b855948b1b0583bc1b16a6ec414721b574"
        },
        {
          "name": "search_esim_plans",
          "description": "Search Alt eSIM travel data plans. Filter by destination country slug (e.g. 'japan', 'usa', 'europe'), region, and/or max USD price. Returns plans with sku, data amount, validity days, USD price and coverage carriers. All prices are USD.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Destination country/region slug, e.g. 'japan', 'south-korea', 'thailand', 'usa', 'europe'. Omit to list all.",
                "type": "string"
              },
              "max_price_usd": {
                "description": "Optional max price in USD.",
                "type": "number"
              },
              "region": {
                "description": "Optional region filter.",
                "enum": ["asia", "europe", "americas", "oceania", "africa", "middle-east"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98541ad4beed6688a0e292649e44434374054e70a6355b89d454f8b3cb1836f0"
        }
      ],
      "digest": "sha256:4770da59830fe03cd6f97a4c8715bb3feeb2acb867210885a902d4538290ef8e"
    }
  }
}
