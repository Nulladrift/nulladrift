        {
          "name": "search_datasets",
          "title": "Search datasets",
          "description": "Find the slug of a served dataset. Start here for any question about Australian government data, since the other tools read only the datasets this finds.\nEvery word in query must match the title, summary, publisher, keywords or a field name. A word matches its plural and other endings but never as a prefix, so bus does not find business.\nUp to 50 matches come back in one answer, with no paging. If nothing matches, try fewer or broader words, then search_catalogue.\nEach call costs one of the 60 queries each address may make in 10 seconds.",
