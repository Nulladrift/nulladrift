{
  "lockfileVersion": 2,
  "subjects": {
    "au.publicdata/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://publicdata.au/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "publicdata-au",
        "title": "publicdata.au",
        "version": "2.55.27",
        "description": "Search, filter, count and sum Australian government open data, with every version kept.",
        "websiteUrl": "https://publicdata.au/agents/#mcp",
        "icons": [
          {
            "src": "https://publicdata.au/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://publicdata.au/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "completions": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Australian government open data, republished at URLs that never change. Find a dataset with search_datasets, read its fields with list_fields, then answer from the whole table with query_rows or count_rows. A dataset that is not served yet can be found with search_catalogue and voted for with upvote_dataset. Every answer names the version it came from and the publisher's attribution string. When you show the data to a person, use the attribution string, say it came from publicdata.au and link to the version the answer came from, https://publicdata.au/d/<slug>/v/<version>/. Use of this server is under https://publicdata.au/terms/.",
      "tools": [
        {
          "name": "count_rows",
          "title": "Count and sum rows",
          "description": "Count, sum, average, minimum or maximum rows of a served dataset across the whole table, grouped by up to three fields. For the rows themselves use query_rows.\nField names and values for group_by and where come from list_fields.\nsum and avg need a numeric or true-or-false field. min and max take any field.\nversion can be any date in the version history from get_dataset.\nA version too large for one file is stored as period parts and answered from them. A filter on the period field reads only the parts it can match, and parts names the periods read.\nGroups come back largest first, and truncated means raise limit or narrow where. An unknown field or version returns an error naming it.\nEach call costs two of the 60 queries each address may make in 10 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group_by": {
                "description": "Fields to group by, for example [\"crash_severity\"]. One total when absent.",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "limit": {
                "default": 100,
                "description": "Groups to return, 1 to 1000. 100 when absent.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "default": "count",
                "description": "count, or sum, avg, min or max of a field written as sum.field_name. count when absent.",
                "type": "string"
              },
              "slug": {
                "description": "Dataset slug from search_datasets",
                "type": "string"
              },
              "version": {
                "description": "A version date, YYYY-MM-DD, from get_dataset. The newest version when absent.",
                "type": "string"
              },
              "where": {
                "additionalProperties": true,
                "description": "Filters by field name, applied to the whole table. A value may be a scalar for an exact, case-sensitive match, a list of scalars to match any of them, null to match blank or suppressed cells, {\"min\": n, \"max\": n} for an inclusive range, or {\"like\": \"*text*\"} for a pattern where * is the wildcard and case is ignored in ASCII letters. A blank cell never matches a scalar, a list or a range.",
                "type": "object"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "The publisher's attribution string, to show with any answer",
                "type": ["string", "null"]
              },
              "file": {
                "description": "The Parquet file the answer was read from, or that its rollup was counted from, when it came from either",
                "type": "string"
              },
              "group_by": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "groups": {
                "description": "One object per group, holding the group_by fields and the metric value, largest first",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "manifest": {
                "description": "The version's manifest, with its licence, source, hash and fetch time",
                "type": "string"
              },
              "matched": {
                "description": "Rows in the whole table that match where",
                "type": "integer"
              },
              "metric": {
                "type": "string"
              },
              "parts": {
                "description": "The periods whose parts the answer was read from, when the version is stored as period parts. The manifest gives each part's file",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "query": {
                "description": "The query API URL for the same query, on the version's own path",
                "type": "string"
              },
              "truncated": {
                "description": "True when more groups exist than limit",
                "type": "boolean"
              },
              "version": {
                "description": "The version answered",
                "type": ["string", "null"]
              }
            },
            "required": ["group_by", "groups", "matched", "metric", "query", "truncated", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Count and sum rows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0fe4c76f2a345cee03e7d55818a61fb2e8695fc06b6a32ffd65061ae7d6b40ff"
        },
        {
          "name": "diff_versions",
          "title": "Compare versions",
          "description": "Compare two consecutive versions of a served dataset row by row on its key fields, to see what a publisher changed between releases. from and to must be adjacent dates in the version history from get_dataset, older first. Any other pair returns a 404 error, so step through a longer span one pair at a time. A dataset with no key, which list_fields shows as an empty key, gets row counts only, and a dataset with one version has nothing to compare. One answer holds the counts of rows added, removed, changed and unchanged, the keys of the rows added, removed and changed, and up to ten changed rows with their old and new values. The call costs nothing against the rate limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Older version date, YYYY-MM-DD",
                "type": "string"
              },
              "slug": {
                "description": "Dataset slug from search_datasets",
                "type": "string"
              },
              "to": {
                "description": "Newer version date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["from", "slug", "to"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "added": {
                "type": "integer"
              },
              "added_keys": {
                "type": "array"
              },
              "changed": {
                "type": "integer"
              },
              "changed_keys": {
                "type": "array"
              },
              "dataset": {
                "type": "string"
              },
              "examples": {
                "description": "Up to ten changed rows, each with its key and the fields that changed from and to",
                "type": "array"
              },
              "from": {
                "description": "Older version date",
                "type": "string"
              },
              "key": {
                "description": "Key fields compared on. Empty when none is declared",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "Present when no key is declared and only row counts are compared",
                "type": "string"
              },
              "removed": {
                "type": "integer"
              },
              "removed_keys": {
                "type": "array"
              },
              "repeated_from": {
                "description": "Rows of the older version that repeat an earlier row in every field, left out of the other counts. Present only when either version repeats a row",
                "type": "integer"
              },
              "repeated_to": {
                "description": "Rows of the newer version that repeat an earlier row in every field, left out of the other counts",
                "type": "integer"
              },
              "rows_from": {
                "type": "integer"
              },
              "rows_to": {
                "type": "integer"
              },
              "schema": {
                "description": "Fields added, removed and retyped between the versions",
                "type": "object"
              },
              "to": {
                "description": "Newer version date",
                "type": "string"
              },
              "truncated": {
                "description": "True when a key list stops at its cap",
                "type": "boolean"
              },
              "unchanged": {
                "type": "integer"
              }
            },
            "required": ["dataset", "from", "key", "rows_from", "rows_to", "schema", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare versions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76a933bc8d394b5788f0b450f2418c0a0dd59ef5d86388d48b7cf81b08bd4c59"
        },
        {
          "name": "fetch",
          "title": "Fetch a dataset record",
          "description": "Read one served dataset's record as text to quote and cite: its summary, publisher, licence, attribution string, newest version and the URL of that version. It is the fetch that ChatGPT deep research and company knowledge call, with an id from search.\nIt carries no rows. To answer from the data use query_rows or count_rows, and for every version and file use get_dataset.\nOne answer holds the text, with the same facts under metadata. An id that is not served returns an error. The call costs nothing against the rate limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A dataset id from search, which is its slug. A publicdata.au dataset or version URL is read as its slug.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "description": "Publisher, licence, attribution, version, source URL, fetch time and source hash",
                "type": "object"
              },
              "text": {
                "description": "The record, with the attribution string and the statement that the publisher has not endorsed publicdata.au",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "The newest version's page, to cite",
                "type": "string"
              }
            },
            "required": ["id", "metadata", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a dataset record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84440183a9b2dcdf8499f7cf300ccc6b1ee8ef8442eb88449b94dce61925464e"
        },
        {
          "name": "get_dataset",
          "title": "Read a dataset",
          "description": "Read a served dataset's data package and full version history: licence, attribution, whole-table files and the version dates diff_versions and the version parameter take. It carries no rows. To answer from the rows use query_rows or count_rows, and for field names use list_fields.\nslug is lowercase letters, digits and hyphens, the part after /d/ in a dataset page URL, such as au-road-deaths.\nThe whole history comes back in one answer, with no paging. It needs no key or sign-in, and costs nothing against the rate limit. A slug that is not served returns a 404 error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Dataset slug from search_datasets",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "datapackage": {
                "description": "The Frictionless data package: description, licence, attribution string, source, and resources with the URL, format and size of the whole file in each format",
                "type": "object"
              },
              "versions": {
                "description": "Every version with its date, the date its data is as at, row count, source hash and fetch time"
              }
            },
            "required": ["datapackage", "versions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a dataset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cae82e51ace2007b151c4cd32ecaea4708218cc016fbcc77027a0f640a535713"
        },
        {
          "name": "list_backlog",
          "title": "List the build backlog",
          "description": "List the datasets people have asked publicdata.au to build, most votes first. Use it to see what is wanted or under way, or to check that a vote counted.\nTo add a vote use upvote_dataset. To read a dataset that is already served use search_datasets.\nVotes on catalogue records that no entry has claimed yet come back apart, under the vote key search_catalogue uses.\nThe whole backlog comes back in one answer, with no paging, and the call costs nothing against the rate limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "catalogue_votes": {
                "description": "Votes on catalogue records no register entry has claimed yet, most first",
                "items": {
                  "properties": {
                    "vote": {
                      "description": "The record's vote key, which search_catalogue finds",
                      "type": "string"
                    },
                    "votes": {
                      "type": "integer"
                    }
                  },
                  "required": ["vote", "votes"],
                  "type": "object"
                },
                "type": "array"
              },
              "entries": {
                "description": "Register entries that are not live yet, most votes first",
                "items": {
                  "properties": {
                    "blocked_reason": {
                      "description": "Why a blocked entry cannot be built yet",
                      "type": ["string", "null"]
                    },
                    "publisher": {
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "description": "The key upvote_dataset takes",
                      "type": "string"
                    },
                    "source": {
                      "description": "The publisher's own page for the data",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "backlog and assessing wait for votes, building is under way, blocked cannot be built yet",
                      "enum": ["backlog", "assessing", "building", "blocked"],
                      "type": "string"
                    },
                    "summary": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "votes": {
                      "type": "integer"
                    }
                  },
                  "required": ["slug", "status", "title", "votes"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["catalogue_votes", "entries"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the build backlog"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38f2425b5839c8b88e51cacaa2a76d5794efbf6e186679f9c961378df978da94"
        },
        {
          "name": "list_fields",
          "title": "List a dataset's fields",
          "description": "List a served dataset's fields, with their types, descriptions, ranges and values, before querying it. Call it before query_rows or count_rows unless you already know the exact names and values, because where matches values exactly and an unknown field is an error. It also names the key fields diff_versions compares on and the partition fields list_partitions accepts.\nslug is lowercase letters, digits and hyphens, the part after /d/ in a dataset page URL, such as au-road-deaths.\nThe answer describes the newest version, in one page. The call costs nothing against the rate limit. A slug that is not served or not loaded for queries returns an error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Dataset slug from search_datasets",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "The publisher's attribution string, to show with any answer",
                "type": ["string", "null"]
              },
              "fields": {
                "description": "Each field's name, type and publisher's description, with min and max for numbers and dates and values when it holds few",
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "max": {},
                    "min": {},
                    "name": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "values": {
                      "type": "array"
                    }
                  },
                  "required": ["name", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "key": {
                "description": "Fields that identify a row, compared on by diff_versions. Empty when none is declared",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "licence": {
                "type": ["string", "null"]
              },
              "partition_by": {
                "description": "Fields list_partitions accepts",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "publisher": {
                "type": ["string", "null"]
              },
              "rows": {
                "description": "Rows in that version",
                "type": "integer"
              },
              "slug": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "version": {
                "description": "The version the fields describe",
                "type": "string"
              }
            },
            "required": ["fields", "key", "partition_by", "slug", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a dataset's fields"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cdd719a213b1b103245dbab88d147a61269ce5eaa9b875c986c54af04a47d20"
        },
        {
          "name": "list_partitions",
          "title": "List partition files",
          "description": "List the download files that split a served dataset's newest version by one field, such as one file per year. Use it to hand someone a slice of the data as a file. It gives file links and no rows, so to answer a question use query_rows or count_rows instead, and for the whole table as one file use get_dataset. field must be one of the partition_by fields that list_fields names, and any other field returns a 404 error. Every value comes back in one answer, with no paging. The call costs nothing against the rate limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "field": {
                "description": "A partition field named in the data package, for example crash_year or loc_local_government_area",
                "type": "string"
              },
              "slug": {
                "description": "Dataset slug from search_datasets",
                "type": "string"
              }
            },
            "required": ["field", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "field": {
                "type": "string"
              },
              "partitions": {
                "description": "One entry per value: the value, its row count and the URL of a JSON file with every row holding it",
                "items": {
                  "properties": {
                    "rows": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    },
                    "value": {}
                  },
                  "required": ["rows", "url", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "version_base": {
                "description": "The version these files belong to",
                "type": "string"
              }
            },
            "required": ["field", "partitions", "version_base"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List partition files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2698cbb1706323083776080a086db7094d0e98b8e893c9d29993f918653566cc"
        },
        {
          "name": "query_rows",
          "title": "Query rows",
          "description": "Read individual rows of a served dataset, filtered across the whole table. For totals and breakdowns use count_rows, and for files use get_dataset or list_partitions.\nField names and values for where, select and order come from list_fields.\nFilters hold at most 90 values per call, and a list value cannot contain a comma.\nversion can be any date in the version history from get_dataset.\nA version too large for one file is stored as period parts and answered from them, in period order. A filter on the period field reads only the parts it can match, and parts names the periods read.\nOne page holds up to limit rows, and offset steps through the rest until next_offset is null. An unknown field or version returns an error naming it.\nEach call costs two of the 60 queries each address may make in 10 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 50,
                "description": "Rows to return, 1 to 500. 50 when absent.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip. next_offset in each answer gives the next page.",
                "minimum": 0,
                "type": "integer"
              },
              "order": {
                "description": "field.asc or field.desc, comma-separated. When absent, rows come in the order of the file they are read from. For the newest versions that is the version's own data.parquet, which keeps the publisher's order unless the dataset sorted it. Any other version is read from the Parquet file the answer names in file, and when that file is sorted the answer names its sort in order, which ties follow too.",
                "type": "string"
              },
              "select": {
                "description": "Fields to return. Every field when absent.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "slug": {
                "description": "Dataset slug from search_datasets",
                "type": "string"
              },
              "version": {
                "description": "A version date, YYYY-MM-DD, from get_dataset. The newest version when absent.",
                "type": "string"
              },
              "where": {
                "additionalProperties": true,
                "description": "Filters by field name, applied to the whole table. A value may be a scalar for an exact, case-sensitive match, a list of scalars to match any of them, null to match blank or suppressed cells, {\"min\": n, \"max\": n} for an inclusive range, or {\"like\": \"*text*\"} for a pattern where * is the wildcard and case is ignored in ASCII letters. A blank cell never matches a scalar, a list or a range.",
                "type": "object"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "description": "The publisher's attribution string, to show with any answer",
                "type": ["string", "null"]
              },
              "file": {
                "description": "The Parquet file the answer was read from, or that its rollup was counted from, when it came from either",
                "type": "string"
              },
              "manifest": {
                "description": "The version's manifest, with its licence, source, hash and fetch time",
                "type": "string"
              },
              "matched": {
                "description": "Rows in the whole table that match where",
                "type": "integer"
              },
              "next_offset": {
                "description": "offset for the next page, or null on the last",
                "type": ["integer", "null"]
              },
              "order": {
                "description": "The columns the file read is sorted by, which rows without an order and ties follow, when it came from a sorted file",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "parts": {
                "description": "The periods whose parts the answer was read from, when the version is stored as period parts. The manifest gives each part's file",
                "items": {
                  "type": "string"
                },
