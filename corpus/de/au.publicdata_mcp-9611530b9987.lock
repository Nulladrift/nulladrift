        {
          "name": "search_catalogue",
          "title": "Search government portals",
          "description": "Search every dataset listed on Australia's government portals, including the many publicdata.au does not serve yet. Its records describe data held elsewhere, which cannot be queried here.\nUse it when search_datasets finds nothing, to find where a dataset is published, or to pick one for upvote_dataset.\nquery matches every word against the title, summary and publisher, as search_datasets does.\nA page holds 20 records, those that can take a vote first. Pass next_offset as offset for the next page, up to 5000.\nEach call costs three of the 60 queries each address may make in 10 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jurisdiction": {
                "description": "One government. All when absent.",
                "enum": ["cth", "nsw", "vic", "qld", "wa", "sa", "tas", "act", "nt"],
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip. next_offset in each answer gives the next page.",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words from a title, description or publisher",
                "type": "string"
              },
              "votable_only": {
                "default": false,
                "description": "Leave out records that cannot take a vote",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "catalogue_read": {
                "description": "Date the portal lists were read",
                "type": "string"
              },
              "next_offset": {
                "description": "offset for the next page, or null on the last",
                "type": ["integer", "null"]
              },
              "records": {
                "type": "integer"
              },
              "rows": {
                "items": {
                  "properties": {
                    "formats": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "jur": {
                      "type": "string"
                    },
                    "licence": {
                      "type": "string"
                    },
                    "modified": {
                      "type": "string"
                    },
                    "page": {
                      "type": "string"
                    },
                    "publisher": {
                      "type": "string"
                    },
                    "publisher_page": {
                      "type": "string"
