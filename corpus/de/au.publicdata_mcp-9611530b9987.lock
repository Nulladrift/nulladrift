        {
          "name": "upvote_dataset",
          "title": "Vote for a dataset",
          "description": "Add one anonymous vote for a government dataset that publicdata.au does not serve yet, so it is built sooner. To read a served dataset use search_datasets, and to see the votes so far use list_backlog.\nslug is a vote key from search_catalogue, such as act-3u5a-ve4j, or a list_backlog slug.\nA dataset that is served, being built or closed returns an error saying it is not open for votes.\nNo identity is recorded, so a vote cannot be withdrawn, and a second vote from the same caller on the same day adds nothing. The answer gives the dataset's vote total after this call. The call costs nothing against the rate limit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The vote key of a search_catalogue row, or a slug from /backlog.json",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              },
              "votes": {
                "description": "The dataset's vote total after this call",
                "type": "integer"
              }
            },
            "required": ["slug", "votes"],
            "type": "object"
          },
          "annotations": {
