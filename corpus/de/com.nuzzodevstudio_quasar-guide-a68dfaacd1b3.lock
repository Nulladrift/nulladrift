{
  "lockfileVersion": 2,
  "subjects": {
    "com.nuzzodevstudio/quasar-guide": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://guide.quasar.nuzzodevstudio.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "quasar-guide",
        "version": "2026.11.11"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server reads \"Quasar by Nuzzo Dev Studio - Product Guide\", a published guide, read-only and without authentication.\nTo answer a question from it:\n1. Call `index` first: every chapter with a summary of what it answers.\n2. Choose the chapters relevant to the question from their summaries — in any language the question is asked in.\n3. Read them whole with `read` (by id or path); follow `nextCursor` when a chapter is long.\n4. Answer from what you read, citing the revision and each chapter's `url`. If the guide does not cover the question, say so rather than guessing.\n`search` and `fetch` are the same content in the shape ChatGPT connectors and deep research use: `search` finds by words as written (with few matches it also returns the chapters), `fetch` returns one chapter or section whole.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a chapter",
          "description": "One chapter or section of the guide by the `id` search returned: its full text with everything under it, its URL, and its revision.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a47125602ebbc8390fa08b0a3aa6feb0ada555410bcc2fc182161745a85ecc09"
        },
        {
          "name": "index",
          "title": "Guide index",
          "description": "Every chapter of the guide with a summary of what it answers, its outline and its URL. Call this first, then choose chapters by their summaries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "The `nextCursor` of the previous page.",
                "type": "string"
              },
              "revision": {
                "description": "An earlier published revision, by its number. Omitted: the current one.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c68a40cea7014c8dd602c9c9122fa8996fe10be6835033ed808ba20fcad9cf7c"
        },
        {
          "name": "read",
          "title": "Read a chapter",
          "description": "One chapter or section of the guide, whole, with everything under it — by `id` (from index or search) or by `path` (its URL's path inside the guide). Long ones arrive in parts: pass `nextCursor` back as `cursor`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "type": "string"
              },
              "id": {
                "minLength": 1,
                "type": "string"
              },
              "path": {
                "description": "The node's path inside the guide, e.g. `getting-started/install`.",
                "minLength": 1,
                "type": "string"
              },
              "revision": {
                "description": "An earlier published revision, by its number. Omitted: the current one.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b3625d12da6dfd0596b487dccbf558f6833711c56ebd888486d5909d4dbf118"
        },
        {
          "name": "search",
          "title": "Search the guide",
          "description": "Find chapters and sections of the guide by words as written. Returns ids for `fetch`, titles and URLs; with few matches it also returns the chapters, to choose from.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ad834bb9062d251e7f66b57a2133331cbf165cd1cc8a90e37510238387200ff"
        }
      ],
      "digest": "sha256:9b4ad42bcdf77bb0a5bf37bb1235f9e9760bc236cba7221af325354ff73df4da"
    }
  }
}
