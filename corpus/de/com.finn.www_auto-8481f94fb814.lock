      },
      "serverInfo": {
        "name": "FINN Auto",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_available_filters",
          "title": "Available Filters",
          "description": "Discover what's currently available in FINN's fleet. Returns all brands (with nested models), car types, fuel types, colors, subscription terms, gearshifts, and price/power/range bounds. Use this to answer questions like 'What brands does FINN offer?' or to validate filter values before searching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f76e6d96647008d65a75751244e47032c9ce30184658dbd2e92b5e26291fbc1"
        },
        {
          "name": "get_internal_link_url",
          "title": "Internal Link URLs",
          "description": "Get canonical FINN URLs for a brand and its models — for building internal linking blocks on SEO pages. For each model returns three URLs that target DIFFERENT funnels: `mdp_url` (marketing/brand page), `plp_subscribe_url` (subscription product listing, /de-DE/subscribe/{brand}_{model}), and `plp_leasing_url` (leasing product listing, /de-DE/leasing/{brand}_{model}). Use `plp_leasing_url` when linking from a Leasing advisory, `plp_subscribe_url` when linking from subscription content. If `model` is omitted, returns all currently available models for the brand.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name (e.g. \"Ford\", \"Mercedes-Benz\", \"BMW\")",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "description": "Optional model name (e.g. \"Puma\", \"iX1\"). If omitted, returns all available models for the brand.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ece79b8122c5828dbd61864adaaa5a6464e224b1ac3c128b7d3f680fcb48e8f"
        },
        {
          "name": "get_subscription_pricing",
          "title": "Subscription Pricing",
          "description": "Calculate exact monthly subscription price for a specific vehicle, term, and mileage combination. Returns base price, km add-on, total, and a canonical checkout URL.\n\nCheckout URL structure (always use the URL returned in `checkout_url` verbatim — do NOT construct your own):\n  https://www.finn.com/de-DE/checkout/cart/{vehicleId}/{term}/{kmPackage}\n  https://www.finn.com/de-DE/checkout/cart/{vehicleId}/{term}/{kmPackage}?downPaymentAmount={amount}\n\nThe three positional path segments after `/cart` are vehicle id, term in months, and monthly km package — in that order.\n\nAbout `with_down_payment` (Fahrzeugbereitstellung):\n- Fahrzeugbereitstellung is a one-time vehicle provisioning fee with a fixed amount per vehicle.\n- When `with_down_payment` is true, it is paid upfront as Einmalzahlung (one-time payment), the monthly price is lower, and the URL includes `?downPaymentAmount={amount}`.\n- When omitted, the same fee is spread across the term and absorbed into the monthly price; the URL has no query string.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "km_package": {
                "description": "Monthly km package (500, 1000, 1500, 2000, 2500, 3000, 4000, 5000)",
                "enum": [500, 1000, 1500, 2000, 2500, 3000, 4000, 5000],
                "type": "number"
              },
              "term_months": {
                "description": "Subscription term in months (1, 6, 9, 12, 13, 18, 24, 36)",
                "enum": [1, 6, 9, 12, 13, 18, 24, 36],
                "type": "number"
              },
              "vehicle_id": {
                "description": "The vehicle product ID",
                "maxLength": 200,
                "pattern": "^[a-zA-Z0-9+-]+$",
                "type": "string"
              },
              "with_down_payment": {
                "description": "Pay the vehicle's fixed one-time Fahrzeugbereitstellung (vehicle provisioning fee) upfront as Einmalzahlung. The amount is set per vehicle and returned as `down_payment_amount_eur`; the monthly price is lower. When omitted or false, the fee is spread across the term inside the monthly price.",
                "type": "boolean"
              }
            },
            "required": ["km_package", "term_months", "vehicle_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f138015ff53d42633d5bc5cea0ca90beca48d40c13c2a3326182617f6035218"
        },
        {
          "name": "get_vehicle_details",
          "title": "Vehicle Details",
          "description": "Get full specifications, equipment, all images, and pricing per term for a specific vehicle. Use a vehicle_id from search_vehicles results. IMPORTANT: Always show `detail_url` as a clickable link — it points to the FINN configurator where the user picks term and km. To produce a direct checkout link for a specific term + km combination (and optionally a one-time Fahrzeugbereitstellung), call `get_subscription_pricing` and use the `checkout_url` it returns. Never construct checkout URLs yourself. The `vehicle_id` field is an internal API identifier — never display it to users.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vehicle_id": {
                "description": "The vehicle product ID (e.g. \"bmw-ix1-12345-alpinweissuni\")",
                "maxLength": 200,
                "pattern": "^[a-zA-Z0-9+-]+$",
                "type": "string"
              }
            },
            "required": ["vehicle_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52de941b02867b1fb00f8561d8214d44291a0bd785a59556cb72c199bebdca70"
        },
        {
          "name": "search_vehicles",
          "title": "Search Cars",
          "description": "Search available cars on FINN with filters. Returns matching vehicles with prices, images, and links. All filter values use German names (e.g. \"Elektro\" not \"Electric\", \"Schwarz\" not \"Black\"). IMPORTANT: Always show detail_url as a clickable link for each vehicle. The vehicle_id field is an internal API identifier for get_vehicle_details — never display it to users.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "available_from": {
                "description": "Earliest delivery date (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "available_to": {
                "description": "Latest delivery date (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "brands": {
                "description": "Car brands (e.g. [\"BMW\", \"Audi\", \"Mercedes-Benz\"])",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "cartypes": {
                "description": "Car types in German (e.g. [\"SUV\", \"Kombi\", \"Kleinwagen\", \"Van\"])",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "colors": {
                "description": "Colors in German (e.g. [\"Schwarz\", \"Weiß\", \"Blau\"])",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "fuels": {
                "description": "Fuel types in German (e.g. [\"Elektro\", \"Benzin\", \"Diesel\", \"Plug-In-Hybrid\"])",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "has_deals": {
                "description": "Filter for cars with special deals/discounts",
                "type": "boolean"
              },
              "has_hitch": {
                "description": "Filter for cars with hitch",
                "type": "boolean"
              },
              "is_young_driver": {
                "description": "Filter for cars allowing drivers under 23",
                "type": "boolean"
              },
              "limit": {
                "description": "Number of results (1-10, default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "max_ev_range": {
                "description": "Maximum electric range in km",
                "type": "number"
              },
              "max_power": {
                "description": "Maximum power in kW",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum monthly price in EUR",
                "type": "number"
              },
              "min_ev_range": {
                "description": "Minimum electric range in km",
                "type": "number"
              },
              "min_power": {
                "description": "Minimum power in kW",
                "type": "number"
              },
              "min_price": {
                "description": "Minimum monthly price in EUR",
                "type": "number"
              },
              "models": {
                "description": "Car models (e.g. [\"iX1\", \"3er Limousine\"])",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "sort": {
                "description": "Sort order: asc/desc by price, availability, or last_added",
                "enum": ["asc", "desc", "availability", "last_added"],
                "type": "string"
              },
              "terms": {
                "description": "Subscription term lengths in months (available: 1, 6, 12, 18, 24, 36)",
                "items": {
                  "type": "number"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:676e2c6f86daff3c0c5ab26cc700197af63905bd1996d281625e3b1a5bb6fcd3"
        }
      ],
      "digest": "sha256:069d5d5f8b1d3b7adec6ad2374ef363a98a4249565a1c4761476cc63041afdd4"
    }
  }
