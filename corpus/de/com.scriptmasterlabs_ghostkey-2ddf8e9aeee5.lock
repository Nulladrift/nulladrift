        {
          "name": "ghostkey_session_action",
          "description": "Relay one authorized browser action into the user's already-authenticated browser. Actions: navigate, inspect, click, input, select, read, wait. Password/hidden fields and off-allowlist navigation are denied. API and bridge documentation: https://ghostkey-mcp.onrender.com/session-bridge/README.txt.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "action": {
                "enum": ["navigate", "inspect", "click", "input", "select", "read", "wait"],
                "type": "string"
              },
              "agent_token": {
                "minLength": 20,
                "type": "string"
              },
              "attribute": {
                "maxLength": 100,
                "type": "string"
              },
              "selector": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "session_id": {
                "format": "uuid",
                "type": "string"
              },
              "text": {
                "maxLength": 4000,
                "type": "string"
              },
              "timeout_ms": {
                "maximum": 30000,
                "minimum": 1000,
                "type": "integer"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["action", "agent_token", "session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
