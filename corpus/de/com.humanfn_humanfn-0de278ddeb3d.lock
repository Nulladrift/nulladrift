        {
          "name": "request_execution",
          "title": "Request an on-site task at an address (execution request)",
          "description": "Requests execution of an on-site task: use when a task needs a human to be physically present somewhere — the real-world step an agent or browser can't do. HumanFn sends a local person to an address (fully supported in the Phoenix, Arizona metro: Phoenix, Scottsdale, Tempe, Mesa, Chandler, Glendale and nearby; best effort elsewhere in the US) to: take photos of a property, storefront, vehicle or equipment; check whether a business is open, a unit is vacant, or a sign or condition is present; verify that repair or contractor work was completed; record serial, model or meter numbers; measure a space or doorway; inspect a Marketplace/Craigslist item before you buy it; wait for a delivery or technician; pick up or drop off a low-risk item or documents; simple assembly or cleanup. Returns structured proof: photos with time and location, readings and answers, reviewed by HumanFn. Creates a request for a QUOTE. Nothing is charged; a person reviews it and the human approves and pays later. The Phoenix, Arizona metro area is fully supported. Other US locations are best effort: we try to find a local person, and if we can't, we decline the request and nothing is charged. Requests outside the US are declined. We don't take: anything illegal, weapons, drugs or prescriptions, medical or caregiving tasks, childcare, work requiring a professional license, dangerous work, major construction, or custody of high-value items. Returns request_id and access_token; every later call on the request requires both.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_notes": {
                "description": "Gate codes, who to ask for, where to park, hours.",
                "maxLength": 1000,
                "type": "string"
              },
              "address": {
                "description": "Full street address. The Phoenix, AZ metro is fully supported; other US locations are best effort; locations outside the US are declined.",
                "maxLength": 500,
                "minLength": 5,
                "type": "string"
              },
              "client_request_id": {
                "description": "Your idempotency key. Retrying with the same key returns the same request instead of creating a duplicate.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "complete_by": {
                "description": "Deadline for the outcome. ISO 8601 with offset (Phoenix is UTC-07:00).",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                "type": "string"
              },
              "contact_email": {
                "description": "The human customer's email. Quotes and status links are sent here.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "contact_name": {
                "description": "The customer's name, for the quote.",
                "maxLength": 200,
                "type": "string"
              },
              "contact_phone": {
                "description": "The customer's phone number, for urgent questions about the task.",
                "maxLength": 40,
                "type": "string"
              },
              "max_budget_usd": {
                "description": "The most the customer is willing to pay, in US dollars. Quotes above it are flagged.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "objective": {
                "description": "What must be true or be captured when the job is done. Be specific: what to photograph, measure, check, deliver.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["address", "contact_email", "objective"],
            "type": "object"
