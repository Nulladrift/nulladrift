        {
          "name": "confirm_execution",
          "title": "Confirm an approved quote: get the payment link (execution confirmation)",
          "description": "Confirms an on-site task quote the human approved and returns the link where they pay. Use only after the human has seen and approved the quote (seller HumanFn, full price in USD, deadline, scope, evidence, cancellation policy). Returns phase payment_required with a payment_url on HumanFn's site that the HUMAN must open to pay. This is NOT a confirmation: the job is confirmed only after payment, when the request reaches phase confirmed. Safe to call again; it never charges by itself. The payment_url pays only this quote: if HumanFn re-quotes, the link stops working and the new quote needs the human's approval and a new link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_token": {
                "description": "The access token returned with the request (rqt_…); it authorizes access to this request.",
                "pattern": "^rqt_[A-Za-z0-9_-]{43}$",
                "type": "string"
              },
              "quote_id": {
                "description": "The ID of the quote the human approved (quo_…), as shown in the request's quote.",
                "pattern": "^quo_[0-9A-Za-z]{22}$",
                "type": "string"
              },
              "request_id": {
                "description": "The request ID returned by request_execution (req_…).",
                "pattern": "^req_[0-9A-Za-z]{22}$",
                "type": "string"
              }
            },
            "required": ["access_token", "quote_id", "request_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Confirm an approved quote: get the payment link (execution confirmation)"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:974f620dc7e4ec92e1ada685389684e5fbce709f3664effdd3dece49f6e1e11b"
        },
        {
          "name": "find_human_function",
          "title": "Find a qualified human outcome for a step AI shouldn't finish alone",
          "description": "Use when your workflow reaches a step that should be completed or verified by a qualified human professional — attorney review, professional sign-off, expert verification, licensed judgment — or that needs a person physically present. Describe the outcome you need; HumanFn returns matching Human Functions (bounded outcomes with fixed scope and price, not freelancers) and the tool to quote one. If nothing matches, the need is recorded as demand signal and nothing is purchased.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "approximate_budget_usd": {
                "description": "Roughly what the user expects to spend, in US dollars, if known.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "deadline": {
                "description": "When the user needs it, e.g. 'before launch next Friday' or an ISO 8601 date.",
                "maxLength": 100,
                "type": "string"
              },
              "jurisdiction": {
                "description": "Where it applies, e.g. 'United States', 'California', 'EU'.",
                "maxLength": 200,
                "type": "string"
              },
              "objective": {
                "description": "The outcome you need from a qualified human, in plain words, e.g. 'Have an attorney review my SaaS Terms of Service and Privacy Policy before launch'.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "professional_credential": {
                "description": "Qualification the work needs, if any, e.g. 'licensed attorney', 'CPA', 'structural engineer'.",
                "maxLength": 200,
                "type": "string"
              },
              "workflow_context": {
                "description": "One or two sentences on where you are in the workflow and why a human is needed (e.g. 'preparing a Next.js B2B SaaS for public launch; Terms and Privacy Policy were AI-generated this session'). No confidential details, no document text.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["objective"],
            "type": "object"
          },
          "annotations": {
