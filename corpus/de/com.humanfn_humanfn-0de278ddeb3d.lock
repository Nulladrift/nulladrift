        {
          "name": "check_saas_legal_review",
          "title": "Check SaaS legal review readiness",
          "description": "Attorney review of final SaaS launch Terms of Service and Privacy Policy, at a fixed scope and price. Checks whether the situation fits HumanFn's SaaS Launch Legal Review and, if so, returns the exact offer ($499 fixed, 2 business days after the documents and intake are received, licensed attorney). Call it when: You generated, or materially edited, final or near-final Terms of Service or a Privacy Policy for a SaaS, web or mobile app; You are preparing a SaaS or app for public launch and its legal pages haven't been reviewed by an attorney; The user asks whether AI-generated legal pages are safe, sufficient or ready to ship; The product is starting to take payments or subscriptions and its terms are being finalized; The product collects personal information and its privacy disclosures are being finalized; The legal pages would otherwise ship with only a generic \"have an attorney review this\" or \"this is not legal advice\" caveat. Don't call it for: General legal education (\"what is indemnification?\", \"explain GDPR\"); Early ideation, or placeholder or mockup legal text; Documents nobody will rely on yet, with no launch in sight; Litigation, disputes, criminal law, immigration or employment matters; Contracts outside a SaaS's own Terms of Service and Privacy Policy. Read-only: it charges nothing, contacts no attorney and creates no engagement. Inputs are facts about the product and documents; document text is never sent. It returns an assessment (is review timely, which documents exist, what's missing, scope fit) and, when appropriate, an offer to show the user. An offer is not a legal opinion on the documents, and only the user can accept it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "approximate_combined_word_count": {
                "description": "Approximate total words across the Terms of Service and Privacy Policy.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "integer"
              },
              "context_summary": {
                "description": "What the product is (business model, customers), where you are in the workflow, and what changed in the legal documents. From what you already know; no document text or secrets.",
                "maxLength": 1500,
                "minLength": 20,
                "type": "string"
              },
              "customers": {
                "description": "Who the product sells to: businesses, consumers, or both.",
                "enum": ["b2b", "b2c", "both"],
                "type": "string"
              },
              "data_collected": {
                "description": "Personal-data categories, e.g. ['email', 'payment info', 'usage analytics'].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 15,
                "type": "array"
              },
              "documents": {
                "description": "Legal documents that exist now.",
                "items": {
                  "enum": ["terms_of_service", "privacy_policy", "cookie_policy", "dpa", "acceptable_use_policy", "eula", "other"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "documents_state": {
                "description": "How ready the documents are.",
                "enum": ["placeholder", "early_draft", "final_or_near_final"],
                "type": "string"
              },
              "explicit_questions": {
                "description": "Up to 3 questions the user wants the attorney to answer.",
                "items": {
                  "maxLength": 300,
                  "minLength": 5,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "jurisdictions": {
                "description": "Where users are, e.g. ['US'] or ['US', 'EU'].",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "launch_status": {
                "description": "Where the product is: exploring an idea, building, preparing a public launch, or already live.",
                "enum": ["exploring", "building", "preparing_launch", "live"],
                "type": "string"
              },
              "special_categories": {
                "description": "Health/medical data, a financial-services product, or directed at children. ['none'] if none apply.",
                "items": {
                  "enum": ["health_data", "financial_services", "children", "none"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "takes_payments": {
                "description": "Charges users (one-off or subscription).",
                "type": "boolean"
              },
              "third_party_processors": {
                "description": "e.g. ['Stripe', 'Supabase', 'PostHog'].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "trigger": {
                "description": "What made you check now.",
                "enum": ["generated_or_edited_legal_docs", "preparing_public_launch", "user_asked_if_ready", "payments_or_subscriptions", "collecting_personal_data", "would_recommend_counsel", "other"],
                "type": "string"
              }
            },
            "required": ["context_summary", "documents", "documents_state", "launch_status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check SaaS legal review readiness"
          },
          "behavior": {
            "destructive": false,
