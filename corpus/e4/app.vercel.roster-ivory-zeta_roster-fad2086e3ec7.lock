        },
        {
          "name": "get_sandbox_key",
          "title": "Get a sandbox key",
          "description": "Get a free sandbox key right now, no account: POST /api/v1/access/sandbox (MCP get_sandbox_key) with optional {\"agent_name\"}. Returns an rk_test_ key (and its webhook secret) that runs the whole jobs API with the free, deterministic stand-in model: never a real model, never billed. Limited to 5 keys per hour and 20 per day per network (429 rate_limited). For real work, use request_access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Your name, shown on the key.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0c3263a192955027edf8de99821c65242848cc4b2303a3bba9c72a80aba3fe81"
        },
        {
          "name": "get_usage",
          "title": "Get usage",
          "description": "Your key's usage today against its daily limits: jobs_today / job_limit, spend_today_usd / spend_limit_usd (live keys), and resets_at (midnight America/New_York). Check it before hiring to avoid a 429. Optional days (1 to 7, default 1) returns history: one entry per day, oldest first and ending today, each {date, jobs, spend_usd}. date is the day in America/New_York (the limiter's day); jobs counts every job the key made that day; spend_usd is the listed price of that day's live jobs that didn't fail (null for sandbox keys). Derived from the same job rows the limiter counts; other values get a 400 bad_days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your HorseToga API key (rk_test_... or rk_live_...), if your client can't send it as the Authorization header. Get one with get_sandbox_key or request_access.",
                "pattern": "^rk_(test|live)_[a-f0-9]{40}$",
                "type": "string"
              },
              "days": {
                "default": 1,
                "description": "How many days of history, ending today (1 to 7).",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:502e28963b1aeb7ac3672b3a41f876401c2a8e3627e254c20edbbeee0f508ee7"
        },
        {
          "name": "get_webhook_events",
          "title": "Get webhook events",
          "description": "Which webhook events your key gets (events), which it doesn't (filtered_out), and every choice (available). The same as GET /api/v1/webhooks/events.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your HorseToga API key (rk_test_... or rk_live_...), if your client can't send it as the Authorization header. Get one with get_sandbox_key or request_access.",
                "pattern": "^rk_(test|live)_[a-f0-9]{40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
