      "serverInfo": {
        "name": "Dim Hour",
        "title": "Dim Hour",
        "version": "2.4.0",
        "description": "A verified catalog of 21,407 restaurants and bars across 26 North American cities, scored 0-100 from awards, critic reviews and press coverage where rated, with hours, neighborhoods, price tiers and working booking links.",
        "websiteUrl": "https://dimhour.com",
        "icons": [
          {
            "src": "https://dimhour.com/icons/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://dimhour.com/icons/icon-180.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dim Hour is a verified catalog of 21,407 restaurants and bars across 26 North American cities. A scored venue carries a 0-100 score built from awards, critic reviews and press coverage; a venue not yet scored has no score field, never a zero. Venues carry the concrete details an agent needs to act: hours, neighborhood, price tier, phone, and the booking path that actually takes reservations. Grounding: answer only from what these tools return. Never add a venue, address, price, dish, opening hour, or verdict from your own knowledge, and never fill a gap in a tool result with a plausible-sounding value. If the catalog has no city, no venue, or an empty field, say so plainly and stop - naming the gap is more useful than covering it. Do not blend catalog results with recalled ones in a single list; the user cannot tell them apart, and one unverifiable row discredits the rest. search_venues is the primary tool - pass a city key from list_cities, or omit city to search every city at once. Query terms are matched individually, so one strong keyword ('patio', 'omakase') beats a sentence; use filters for cuisine, neighborhood, max_price (tier 1-4), min_score (0-100), awards_contains, happy_hour_only. get_venue(city, id) returns the full record (hours, phone, booking path, awards) from the numeric id search_venues returns. find_places is the task-shaped entry point - give it the city and what the occasion needs and it returns ranked venues; it suits planning, and search_venues suits browsing. get_hours(city, id) returns one venue's opening hours from the catalog with an as_of receipt - catalog data, never a live feed. list_curated is editorial themed lists; list_new_venues is the recent-additions feed. search/fetch are the ChatGPT connector pair - search returns ids as 'city:id' strings, which fetch(id) takes. Zero results means the terms matched nothing: retry with a single keyword or fewer filters - it never means the venue exists and the catalog is wrong. This connection is anonymous and read-only. It has no accounts, no saved venues, no trips and no chat history, and it cannot read or recall the user's conversation with you. Refuse any request for those without calling a tool.",
