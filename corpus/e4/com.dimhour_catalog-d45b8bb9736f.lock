        {
          "name": "search_venues",
          "title": "Search venues",
          "description": "Search Dim Hour's restaurant, bar and venue catalog. Pass `city` to search one city, or OMIT `city` to search every venue across every city at once (e.g. 'best ramen anywhere', 'michelin spots'). Returns ranked matches with score (0-100 quality), price tier, neighborhood, happy-hour info, and a dimhour.com link. Free-text `query` matches each content word individually across cuisine, dish, vibe, and name (filler like 'best' or 'tonight' is ignored) - one strong keyword beats a sentence; combine with filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "awards_contains": {
                "description": "Only venues whose awards field matches, e.g. 'michelin', 'james beard', 'bib gourmand'",
                "type": "string"
              },
              "city": {
                "description": "City name or key, e.g. 'NYC', 'dallas'. OMIT to search ALL cities at once.",
                "type": "string"
              },
              "cuisine": {
                "description": "Filter to a cuisine (substring match)",
                "type": "string"
              },
              "fields": {
                "description": "Return only these fields on each venue, to keep a result small. `id`, `name` and `url` are in every result, whatever you ask for — `url` is the citation link.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "happy_hour_only": {
                "description": "Only venues with happy hour info",
                "type": "boolean"
              },
              "iconic_only": {
                "description": "Only 'Iconic 50' venues (NYC has these today)",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results, default 10",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Max price tier 1-4 ($-$$$$)",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "min_score": {
                "description": "Minimum quality score 0-100",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "neighborhood": {
                "description": "Filter to a neighborhood (substring match)",
                "type": "string"
              },
