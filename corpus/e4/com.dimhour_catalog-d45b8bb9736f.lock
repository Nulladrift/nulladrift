                    },
                    "structured_content": {
                      "type": "number"
                    }
                  },
                  "required": ["applicability", "city", "completeness", "denominator", "fresh_complete", "name", "reasons", "source", "structured_content"],
                  "type": "object"
                },
                "type": "array"
