        {
          "name": "get_narrative",
          "description": "Fetch an investigation narrative by (source, case id). Open-licensed sources return full text; others return a ≤300-char excerpt plus a source_url deep link (per-source licensing policy). id URL-encoding is handled for you — pass the raw case id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "the source’s own case id",
                "type": "string"
              },
              "source": {
                "description": "source code, e.g. \"ntsb\" (see list_sources)",
                "type": "string"
              }
            },
            "required": ["id", "source"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "attribution": {
                    "description": "attribution line to display",
                    "type": "string"
                  },
                  "id": {
                    "description": "the authority own case id",
                    "type": "string"
                  },
                  "license": {
                    "description": "licence the source publishes under",
                    "type": "string"
                  },
                  "narrative_text": {
                    "description": "the narrative, full or a ~300-char excerpt",
                    "type": "string"
                  },
                  "phase_of_flight": {
                    "description": "phase of flight",
                    "type": "string"
                  },
                  "policy": {
                    "description": "full or excerpt, per the source licence",
                    "type": "string"
                  },
                  "probable_cause": {
                    "description": "probable cause where the authority states one",
                    "type": "string"
                  },
                  "slug": {
                    "description": "FlightFinder page slug",
                    "type": "string"
                  },
                  "source": {
                    "description": "source code",
                    "type": "string"
                  },
                  "source_url": {
                    "description": "deep link to the original report",
                    "type": "string"
                  }
                },
                "type": "object"
