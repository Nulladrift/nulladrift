          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "country_iso": {
                    "description": "ISO 3166 alpha-2 country of the occurrence",
                    "type": "string"
                  },
                  "event_date": {
                    "description": "date of the occurrence, YYYY-MM-DD",
                    "type": "string"
                  },
                  "family_slug": {
                    "description": "aircraft family slug",
                    "type": "string"
                  },
                  "fatalities_total": {
                    "description": "total fatalities, where the source reports one",
