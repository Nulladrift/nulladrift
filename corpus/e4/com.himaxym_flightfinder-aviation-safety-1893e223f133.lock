        {
          "name": "aircraft_safety",
          "description": "Aggregate safety statistics for an aircraft family: total occurrences, hull losses, fatal accidents, total fatalities, and first/latest year.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "family slug, e.g. \"airbus-a320\"",
                "type": "string"
              }
            },
            "required": ["family"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "family": {
                "description": "the family this covers",
                "properties": {
                  "label": {
                    "description": "display label",
                    "type": "string"
                  },
                  "manufacturer": {
                    "description": "manufacturer",
                    "type": "string"
                  },
                  "name": {
                    "description": "family name",
                    "type": "string"
                  },
                  "slug": {
                    "description": "family slug",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "stats": {
                "description": "aggregates over the merged corpus",
                "properties": {
                  "fatal_accidents": {
                    "description": "accidents with at least one fatality",
                    "type": "integer"
                  },
                  "hull_losses": {
                    "description": "aircraft written off",
                    "type": "integer"
                  },
                  "total_fatalities": {
                    "description": "fatalities across all occurrences",
                    "type": "integer"
                  },
                  "total_occurrences": {
                    "description": "occurrences of any severity",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "types": {
                "description": "ICAO type designators in the family",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Aircraft family safety record"
          },
          "behavior": {
            "destructive": false,
