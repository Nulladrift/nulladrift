                  "topStates": {
                    "description": "US states with the most sightings",
                    "items": {
                      "properties": {
                        "c": {
                          "description": "report count",
                          "type": "integer"
                        },
                        "name": {
                          "description": "label",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "total": {
                    "description": "UAS sighting reports in scope",
                    "type": "integer"
                  },
                  "yearly": {
                    "description": "one row per year",
                    "items": {
                      "properties": {
