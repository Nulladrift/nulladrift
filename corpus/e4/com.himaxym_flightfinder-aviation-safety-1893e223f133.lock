        {
          "name": "search_accidents",
          "description": "Search the merged aviation-accident corpus (80+ official agencies, occurrence-level dedup). Filters: aircraft family slug (e.g. \"boeing-737\"), ISO alpha-2 country, occurrence type, operator substring, date range (from/to as YYYY-MM-DD), and fatal-only. Returns a page of occurrences with source-attribution links and a next_cursor for pagination.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166 alpha-2 code, e.g. \"US\"",
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from a previous call",
                "type": "string"
              },
              "family": {
                "description": "aircraft family slug, e.g. \"boeing-737\"",
                "type": "string"
              },
              "fatal": {
                "description": "only fatal occurrences",
                "type": "boolean"
              },
              "from": {
                "description": "earliest date, YYYY-MM-DD",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "occurrences per page, 1-100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "operator": {
                "description": "operator name substring",
                "type": "string"
              },
              "to": {
                "description": "latest date, YYYY-MM-DD",
                "type": "string"
              },
              "type": {
                "description": "occurrence type code",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "description": "one page of occurrences",
                "items": {
                  "properties": {
                    "country_iso": {
                      "description": "ISO 3166 alpha-2 country of the occurrence",
                      "type": "string"
                    },
                    "event_date": {
                      "description": "date of the occurrence, YYYY-MM-DD",
                      "type": "string"
                    },
                    "family_slug": {
                      "description": "aircraft family slug",
                      "type": "string"
                    },
                    "fatalities_total": {
                      "description": "total fatalities, where the source reports one",
                      "type": "integer"
                    },
                    "id": {
                      "description": "FlightFinder occurrence id",
                      "type": "string"
                    },
                    "occurrence_type": {
                      "description": "accident, incident, or serious incident",
                      "type": "string"
                    },
                    "operator": {
                      "description": "operator name",
                      "type": "string"
                    },
                    "registration": {
                      "description": "aircraft registration as the source states it",
                      "type": "string"
                    },
                    "severity": {
                      "description": "fatal, substantial, minor, or none",
                      "type": "string"
                    },
                    "sources": {
                      "description": "per-source attribution links",
                      "items": {
                        "properties": {
                          "attribution": {
                            "description": "attribution line to display",
                            "type": "string"
                          },
                          "license": {
                            "description": "licence the source publishes under",
                            "type": "string"
                          },
                          "source": {
                            "description": "source code, e.g. \"ntsb\"",
                            "type": "string"
                          },
                          "url": {
                            "description": "deep link to the authority own record",
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "type_icao": {
                      "description": "ICAO aircraft type designator",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "next_cursor": {
                "description": "pass back as cursor for the next page; absent on the last page",
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search accidents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
