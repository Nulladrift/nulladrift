                "description": "global totals, or the breakdown for one state",
                "properties": {
                  "firstYear": {
                    "description": "earliest year covered",
                    "type": "integer"
                  },
                  "lastYear": {
                    "description": "latest year covered",
                    "type": "integer"
                  },
                  "topCities": {
                    "description": "cities with the most sightings",
