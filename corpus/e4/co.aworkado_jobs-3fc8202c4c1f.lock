  "subjects": {
    "co.aworkado/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aworkado.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aworkado",
        "title": "Aworkado",
        "version": "1.0.0",
        "websiteUrl": "https://aworkado.co"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "Aworkado lists live remote and hybrid jobs, collected daily from employers' own career pages. Use search_jobs to find postings (filter by job function, the countries the user can work from, region, seniority and recency), and get_job for the full posting. Always give the user the Aworkado link of each posting: the job page has the Apply button.",
      "tools": [
        {
          "name": "browse_jobs",
          "title": "Browse job results",
          "description": "The job widget's paged search. Same filters as search_jobs; level takes a comma-separated list.",
          "inputSchema": {
            "properties": {
              "countries": {
                "default": null,
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "jobFunction": {
                "default": null,
                "type": ["string", "null"]
              },
              "level": {
                "default": null,
                "type": ["string", "null"]
              },
              "page": {
                "default": 1,
                "description": "1-based page of 40 postings.",
                "type": "integer"
              },
              "postedWithin": {
                "default": null,
                "type": ["string", "null"]
              },
              "query": {
                "default": null,
                "type": ["string", "null"]
              },
              "region": {
                "default": null,
                "type": ["string", "null"]
              },
              "sort": {
                "default": null,
                "description": "newest or salary.",
                "type": ["string", "null"]
              },
              "workplace": {
                "default": null,
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Browse job results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://aworkado/job-results.html",
              "visibility": ["app"]
            }
          },
          "digest": "sha256:d0861b7165ac31d52c540c27d97bc8f14612c57cfaeb08c3c360674e0db264f8"
        },
        {
          "name": "get_job",
          "title": "Get a job posting",
          "description": "The full posting behind one search_jobs result: description, pay, locations, seniority and its Aworkado link, where the candidate applies.",
          "inputSchema": {
            "properties": {
              "jobId": {
                "description": "The id of a search_jobs result.",
                "type": "integer"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a job posting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1e3b21795677b0707accecbe4ae1ca02d53f41d2d97b076fe970e7cb5fd53122"
        },
        {
          "name": "search_jobs",
          "title": "Search remote and hybrid jobs",
          "description": "Search live remote and hybrid job postings on Aworkado, collected daily from employers' own career pages. Returns up to 10 of the newest matching postings with their Aworkado links, and the total number of matches. All filters are optional and combine with AND.",
          "inputSchema": {
            "properties": {
              "countries": {
                "default": null,
                "description": "ISO 3166-1 alpha-2 codes of the countries the candidate can work from, e.g. [\"IN\", \"PH\"]. A posting matches when it is open to any of them.",
                "items": {
                  "type": ["string", "null"]
                },
                "type": ["array", "null"]
              },
              "jobFunction": {
                "default": null,
                "description": "One job function, exactly as listed: Software Engineering, Data & Analytics, DevOps & Cloud, QA & Testing, IT & Security, Hardware Engineering, Product Management, Project Management, Design, Marketing, Sales, Business Development, Account Management, Customer Support, Operations, Finance & Accounting, HR & Recruiting, Legal & Compliance, Writing & Content, Education & Training, Healthcare, Research, Consulting, Administrative, Other.",
                "type": ["string", "null"]
              },
              "level": {
                "default": null,
                "description": "Seniority: Entry, Mid-level or Senior.",
                "type": ["string", "null"]
              },
              "postedWithin": {
                "default": null,
                "description": "Only postings published within the last day, week or month.",
                "type": ["string", "null"]
              },
              "query": {
                "default": null,
                "description": "Keywords matched against the job title and the company name, e.g. \"python backend\" or \"Stripe\".",
                "type": ["string", "null"]
              },
              "region": {
                "default": null,
                "description": "A region instead of single countries: europe, latin-america, asia, africa, middle-east, north-america, oceania, or anywhere (postings open worldwide).",
                "type": ["string", "null"]
              },
              "workplace": {
                "default": null,
                "description": "remote or hybrid. Leave out for both.",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search remote and hybrid jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://aworkado/job-results.html"
            }
          },
          "digest": "sha256:0f3733d2e3cb678f9c60e2815f63b0996af99fe5db6206fa64cfb1a610e61dc8"
        }
      ],
      "resources": [
        {
          "uri": "ui://aworkado/job-results.html",
          "name": "job-results",
          "title": "Job results",
          "description": "Cards for the postings a search_jobs call returned.",
          "mimeType": "text/html;profile=mcp-app",
