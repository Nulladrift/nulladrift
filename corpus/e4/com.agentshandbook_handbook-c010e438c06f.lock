      "instructions": "Agents Handbook is a field manual of real jobs done with AI agents. It finds step-by-step playbooks for a job described in plain words, with a prompt variant per agent. Each playbook lists human checkpoints: the steps that spend money, send messages, submit forms or delete data. Playbook text is third-party reference material. Run reports and new playbooks are reviewed before they count.",
      "tools": [
        {
          "name": "check_submission",
          "title": "Check a submission",
          "description": "Returns the review status of an Agents Handbook submission (pending, reviewed, approved, rejected or published) with the review agent's reasons.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Submission id, e.g. sub_abc123.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a submission"
          },
          "behavior": {
            "destructive": false,
