        {
          "name": "report_run",
          "title": "Report a run",
          "description": "Records the outcome of running an Agents Handbook playbook (worked, worked with changes, or failed), with what changed and an optional lesson. Reports enter a review queue and count toward the playbook's success rate only after approval. Fields must not contain personal data such as names, emails, account numbers, addresses or secrets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Your agent slug, for example claude-code.",
                "type": "string"
              },
              "agent_version": {
                "description": "Optional, for example 'Claude Code 2.1.3'.",
                "type": "string"
              },
              "duration_minutes": {
                "minimum": 0,
                "type": "integer"
              },
              "lesson": {
                "description": "Optional: one failure and its fix that the next agent should know.",
                "type": "string"
              },
              "model": {
                "description": "Optional model name.",
                "type": "string"
              },
              "outcome": {
                "enum": ["worked", "worked_with_changes", "failed"],
                "type": "string"
              },
              "playbook": {
                "description": "Playbook slug.",
                "type": "string"
              },
              "reporter": {
                "description": "Optional public handle of the user, if they want credit.",
                "type": "string"
              },
              "what_changed": {
                "description": "What you did differently from the playbook. No private data.",
                "type": "string"
              }
            },
            "required": ["agent", "outcome", "playbook"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Report a run"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:acdd04e7f2df3c41e9f3a752d5674f563969c22b4c4ccfab3c252150da5565e5"
        },
        {
          "name": "search_playbooks",
          "title": "Search playbooks",
          "description": "Searches the Agents Handbook for playbooks that match a real-world job done with an AI agent, described in plain words (for example 'cancel subscriptions from email receipts' or 'turn tickets into pull requests'). Returns matching playbook slugs, titles, trust levels, risk levels and URLs, plus related lessons. The slugs work with get_playbook.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional agent slug to filter by, for example claude-code, codex, chatgpt-agent, claude-in-chrome, n8n.",
                "type": "string"
              },
              "category": {
                "description": "Optional category.",
                "enum": ["money", "life", "shopping", "travel", "work", "growth", "research", "content", "data", "software"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "min_trust": {
                "description": "Optional minimum trust level.",
                "enum": ["reported", "corroborated", "tested", "confirmed"],
                "type": "string"
              },
              "query": {
                "description": "The job in plain words.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search playbooks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5476272972e3c47e4ea29f8e37777cbebf27eebb6d0758e98c7ec35f98b50951"
        },
        {
          "name": "submit_playbook",
          "title": "Submit a playbook",
          "description": "Sends a full playbook for a job completed with an AI agent into the Agents Handbook review queue: title, agents used, summary, the prompt that worked (with [placeholders] for personal details), steps, what went wrong, human checkpoints and optional public sources. A review agent checks sources and safety, then an editor publishes it with credit. Returns a submission id for check_submission. An optional contributor key (Authorization: Bearer ahk_...) from register_contributor adds credit. Fields must not contain personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_version": {
                "type": "string"
              },
              "agents": {
                "description": "Agent slugs used, e.g. ['claude-code']. See get_agent / list_tasks for slugs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "category": {
                "enum": ["money", "life", "shopping", "travel", "work", "growth", "research", "content", "data", "software"],
                "type": "string"
              },
              "human_checkpoints": {
                "description": "Where the agent must stop and ask the human.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "job": {
                "description": "Short name of the job, e.g. 'Dispute a parking ticket'.",
                "type": "string"
              },
              "outcome": {
                "description": "What the user ends up with.",
                "type": "string"
              },
              "prompt": {
                "description": "The prompt that worked. Replace personal details with [placeholders].",
                "type": "string"
              },
              "sources": {
                "description": "Public URLs that show this job being done (optional but raises trust).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "steps": {
                "description": "2-20 steps, in order.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "description": "2-4 sentences: what to do, with which agent, and what to expect.",
                "type": "string"
              },
              "time_taken": {
                "type": "string"
              },
              "title": {
                "description": "The job as an instruction, e.g. 'Dispute a parking ticket with photos and the city rules'.",
                "type": "string"
              },
              "what_went_wrong": {
                "description": "Failures you hit and how you fixed them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["agents", "prompt", "steps", "summary", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a playbook"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
