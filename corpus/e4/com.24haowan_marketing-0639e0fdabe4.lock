      "serverInfo": {
        "name": "24haowan",
        "title": "24好玩 · 互动营销模板与案例库",
        "version": "0.1.0",
        "description": "24好玩 H5 互动营销平台的公开模板库、客户案例库与帮助知识库（匿名只读）"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "24好玩（24haowan）是一个微信生态的 H5 互动营销 SaaS 平台：提供开箱即用的活动模板（抽奖/转盘/签到/答题/小游戏等）、活动定制与整包运营交付。\n\n这台 MCP 服务器只读、匿名，暴露的都是站点上已经公开的数据：\n- 活动模板库：search_templates / get_template\n- 客户案例库：list_cases / get_case / list_industries\n- 帮助中心知识库：search_knowledge\n\n用法建议：先用 search_templates 或 list_cases 拿到 id / slug，再用 get_* 取详情。\n回答「怎么做/怎么配置」类问题时优先查 search_knowledge。\n\n这些数据背后的**方法论**另有五个开放技能包（纯 markdown，可直接读取全文，免注册）：\n- 活动策划（按行业/目标选玩法、三段式结构、输出模板）：https://www.24haowan.com/open-skills/campaign-planning\n- 活动复盘（指标口径、漏斗诊断、报告模板）：https://www.24haowan.com/open-skills/campaign-review\n- 奖品与预算设计 + 防刷（奖池分层、概率与预算封顶、兑奖方式）：https://www.24haowan.com/open-skills/prize-and-budget\n- 节日营销日历（全年节点、每个节点配什么玩法、倒推排期）：https://www.24haowan.com/open-skills/festival-calendar\n- 参考案例数据库（案例检索用法与调研方法论）：https://www.24haowan.com/open-skills/case-library\n被问到「怎么策划/怎么复盘/奖池怎么设/什么时候做」这类**方法**问题时，读对应技能包的全文；\n本服务器的工具回答的是「有哪些模板/案例/帮助文档」这类**事实**问题。两者配合使用。",
      "tools": [
        {
          "name": "get_case",
          "title": "获取客户案例全文",
          "description": "按 slug 获取单个客户案例的完整正文（背景、做法、效果口径）。slug 来自 list_cases 的返回。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "案例 slug，例如 csair、k11、powerlong",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1154278a13aa73893f092c35094a9a466ae23c9f171197b14f5a9478a04a5087"
        },
        {
          "name": "get_industry_benchmark",
          "title": "取某行业的活动基准数据",
          "description": "返回该行业在 24好玩平台上真实活动的基准：总中奖率、奖池档位数、活动周期、参与量级、实际中奖率与核销率，全部为按商户等权的中位数并附样本量。用于回答「中奖率设多少」「奖池分几档」「活动开几天」这类要有出处的数字问题。★ 平台没有奖品单价/预算/ROI 数据，本工具**不返回任何金额**，也不要据此推算预算。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "industry": {
                "description": "行业 slug，取值与 list_cases 的 industry 相同（用 list_industries 可取全部）。不传或该行业样本不足时，返回平台整体口径并明确说明。",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3568d54a35bf207e5d253a0be827a46f5fbf449301ab67f3120fa0cd91251804"
        },
        {
          "name": "get_player_behavior",
          "title": "取玩家行为基准（平台级）",
          "description": "返回 24好玩平台上玩家的真实行为分布：参与量在活动上线后怎么衰减、一天里什么时段来、助力类玩法一个人能拉到几个、各类玩法的人均次数与浏览转化率、玩家账号规模与画像可得性。用于回答「活动开几天有用」「什么时候推」「助力能不能拉新」「哪类玩法更黏」这类要有出处的问题。★ 平台级口径，**没有行业维度**；要按行业切的奖池/中奖率数字请用 get_industry_benchmark。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e46c49c8f5127a9fb5d0d3d1633e5549f6085100fb8b82eab0ecd0033909f4b"
        },
        {
          "name": "get_template",
          "title": "获取活动模板详情",
          "description": "按模板 id 获取单个活动模板的完整信息：玩法类别、标签、适用行业、玩法介绍与详情页地址。模板 id 来自 search_templates 的返回。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "模板 id，例如 336",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bac45cedb69d4f0da64914b42d20418a45ee66e6598e9ef8d90153a313b849e6"
        },
        {
          "name": "list_cases",
          "title": "浏览客户案例",
          "description": "列出 24好玩的客户案例（真实交付案例与售前方案），可按行业、类型、关键词筛选。适合回答「你们做过 XX 行业的什么案例」。怎么用案例做参考、以及研究案例时的常见陷阱，见开放技能包全文：https://www.24haowan.com/open-skills/case-library",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "industry": {
                "description": "行业 slug，用 list_industries 可取全部取值，例如 commercial-property",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "返回条数，默认 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "关键词，例如「商场开业」「银行」「扫码」",
                "type": "string"
              },
              "type": {
                "description": "delivered=真实交付案例，proposal=售前方案。留空则两者都返回",
                "enum": ["delivered", "proposal"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c45a88d8891da7dacbdd916f27520e9d3dc08d5a8f378a8b154138a46f2262cd"
        },
        {
          "name": "list_industries",
          "title": "列出案例行业分类",
          "description": "列出案例库的行业分类（slug + 名称 + 该行业导语与常见问题）。用于给 list_cases 的 industry 参数取值，也可直接回答「你们在 XX 行业做过什么」。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "with_faq": {
                "default": false,
                "description": "是否附带每个行业的常见问题，默认 false",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5102420b522e8fe141a5723aa8f9101714dc9c9abb9b1194f109c196d92c811"
        },
        {
          "name": "search_knowledge",
          "title": "检索帮助中心知识库",
          "description": "在 24好玩帮助中心全文里检索使用方法与常见问题：创建活动、编辑器配置、奖品与核销、账户充值、公众号授权、开放接口对接等。适合回答「怎么做 XX」「XX 怎么配置」。这里返回的是平台操作方法；奖池概率/预算/防刷的**设计**方法见开放技能包全文：https://www.24haowan.com/open-skills/prize-and-budget",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 3,
                "description": "返回文档条数，默认 3",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "要查的问题或关键词，例如「怎么设置中奖概率」「奖品核销」",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbbda09a71d847daf458879efc4a0311a1d0cb43eee99457a01dfeb35230a78b"
        },
        {
          "name": "search_templates",
          "title": "搜索活动模板",
          "description": "在 24好玩活动市场里搜索可直接使用的 H5 互动营销模板（抽奖/转盘/刮刮乐/签到/答题/小游戏等）。可按关键词、玩法类别、行业筛选。适合回答「有没有适合 XX 场景的活动玩法」这类问题。注意：本工具没有模板的上线时间，不能回答「最新/新上线了什么」；不带关键词时返回的是热门而非最新。选型判断（按行业/目标怎么选、活动怎么排结构）见开放技能包全文：https://www.24haowan.com/open-skills/campaign-planning",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "玩法类别：lottery=抽奖类 score=分数类 signin=签到类 collect=集字类 test=测试类 create=生成类 help=助力类 complete=通关类",
                "enum": ["lottery", "score", "signin", "collect", "test", "create", "help", "complete"],
                "type": "string"
              },
              "industry": {
                "description": "行业关键词，例如「商超」「餐饮」「地产」",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "返回条数，默认 10",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "关键词，可以是玩法、场景或节日，例如「转盘」「中秋」「商场开业」。留空则返回热门模板",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
