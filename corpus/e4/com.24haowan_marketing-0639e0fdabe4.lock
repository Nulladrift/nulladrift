        "name": "24haowan",
        "title": "24好玩 · 互动营销模板与案例库",
        "version": "0.1.0",
        "description": "24好玩 H5 互动营销平台的公开模板库、客户案例库与帮助知识库（匿名只读）"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "24好玩（24haowan）是一个微信生态的 H5 互动营销 SaaS 平台：提供开箱即用的活动模板（抽奖/转盘/签到/答题/小游戏等）、活动定制与整包运营交付。\n\n这台 MCP 服务器只读、匿名，暴露的都是站点上已经公开的数据：\n- 活动模板库：search_templates / get_template\n- 客户案例库：list_cases / get_case / list_industries\n- 帮助中心知识库：search_knowledge\n- 官网公开知识库（帮助 / 案例 / 解决方案 / 套餐 / 洞察 / 模板一次检索，带引用 URL）：search_public_kb / get_page\n- 公开定价：get_pricing（回答里的金额只能来自它；它说「定价未发布」就不要报数）\n\n用法建议：先用 search_templates 或 list_cases 拿到 id / slug，再用 get_* 取详情。\n回答「怎么做/怎么配置」类问题时优先查 search_knowledge。\n\n这些数据背后的**方法论**另有五个开放技能包（纯 markdown，可直接读取全文，免注册）：\n- 活动策划（按行业/目标选玩法、三段式结构、输出模板）：https://www.24haowan.com/open-skills/campaign-planning\n- 活动复盘（指标口径、漏斗诊断、报告模板）：https://www.24haowan.com/open-skills/campaign-review\n- 奖品与预算设计 + 防刷（奖池分层、概率与预算封顶、兑奖方式）：https://www.24haowan.com/open-skills/prize-and-budget\n- 节日营销日历（全年节点、每个节点配什么玩法、倒推排期）：https://www.24haowan.com/open-skills/festival-calendar\n- 参考案例数据库（案例检索用法与调研方法论）：https://www.24haowan.com/open-skills/case-library\n被问到「怎么策划/怎么复盘/奖池怎么设/什么时候做」这类**方法**问题时，读对应技能包的全文；\n本服务器的工具回答的是「有哪些模板/案例/帮助文档」这类**事实**问题。两者配合使用。",
      "tools": [
