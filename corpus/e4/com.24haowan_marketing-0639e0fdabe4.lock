        {
          "name": "search_public_kb",
          "title": "检索 24好玩公开知识库",
          "description": "一次检索 24好玩官网全部公开内容：帮助中心、客户案例、解决方案（AI 知识库/客服/电话/内容/周报/活页、定制、咨询）、会员套餐、行业洞察与数据报告、活动模板、开放技能包。返回片段（≤300 字）与**引用 URL**，回答时请附上 1–2 个来源链接。要读整页用 get_page；问价格一律用 get_pricing，不要从片段里摘金额。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 5,
                "description": "返回条数，默认 5，最多 8",
