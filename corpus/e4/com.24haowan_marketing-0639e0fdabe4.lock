                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "访客的原话或关键词，例如「做个抽奖活动多少钱」「活动打不开怎么办」",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "types": {
                "description": "只查这些类型：help 帮助 · case 案例 · template 模板 · solution 解决方案/定制/咨询 · plan 活动方案库 · insight 洞察/数据报告 · pricing 定价 · tier 会员套餐 · open-skill 开放技能包 · page 其它页面。留空 = 全部",
