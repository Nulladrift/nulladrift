          "description": "Search the surplus funds (excess proceeds) still on an official list: money left after a tax deed or\n        foreclosure sale that the former owner or lienholders can claim. `state`: two-letter code or name;\n        `county`: optional county name (e.g. \"Duval\"); `min_amount`: optional floor in dollars; `sort`: amount_desc,\n        amount_asc, deadline_asc, deadline_desc or sale_date_desc; `page_number` from 1, `per_page` 1 to 100.\n\n        Each row: case or certificate number, parcel id, property address, former owner (people as initials, businesses\n        as recorded), sale type and date, amount as published, claim deadline and its basis, and the official list URL.\n        Amounts are as the office published them; claims, deadlines and eligibility are decided by that office (the\n        county page and surplus_funds_summary give the statute and how to claim). list_coverage lists covered counties.\n\n        Free preview: this tool returns the first 10 rows of each county's list (page_number above 1 is empty) with the\n        county's true `total_rows`; the full list and the CSV open with a County List Pass ($19 one-time, 30 days, one\n        county: buy_county_list_pass) or HeritageDeed Pro ($39 a month, every county: buy_plan); the `message` field says\n        so. Summaries are complete.",
