      "instructions": "HeritageDeed (heritagedeed.com) turns official US public records into property reports and free lookups.\n\nReports (paid per report: title report $49, environmental report $29; PDF plus JSON). The lookups below are free. All prices: https://heritagedeed.com/pricing\n- Title search report (Current Owner Search), in the counties list_coverage returns: owner of record and vesting deed, mortgages matched to their releases, liens, lis pendens, court records matched to the owner, tax status, flood zone. Workflow: check_coverage (or list_coverage) -> check_address -> order_title_search -> get_order_status every ~20 seconds until 'complete' (usually 1 to 3 minutes) -> get_report.\n- Environmental Records Report, any US street address: Superfund, RCRA, storage tanks, brownfields, permits, flood zone, wetlands, radon, hazard ratings. Workflow: check_address(address, report_type='environmental') -> order_title_search(address, report_type='environmental') -> get_order_status -> get_report.\n- Auction bidders: upcoming_auction_sales / auction_precheck_summary show each upcoming tax or sheriff sale with how many properties were pre-checked and carry open mortgages, liens or lis pendens; the per-property results are the county's auction pack ($149, buy_county_list_pass product='auction_pack').\n- Lists and plans: buy_county_list_pass (County List Pass $19: one county's full surplus and tax sale lists + CSV), buy_plan (Pro $39/month: every list and full lookups; Pro Reports $199/month; API report credits $250 per 10). Every purchase returns a checkout_url the user opens to pay; nothing is charged by a tool.\n- Optional API key: when this connection sends 'Authorization: Bearer hd_live_...', order_title_search pays from the key's report credits (no checkout) and my_account shows the balance. Never ask the user to paste a key into the chat.\n\nFree lookups and calculators (no order needed):\n- Api info: REST API v1 explainer for the public MCP server (backend app/api/v1, docs/API_V1.md, page /developers). Tools: rest_api_info.\n- Building violations and permits (free): Code violations and building permits on record with the city for one address, from the city's own open data: Chicago, Philadelphia, Cincinnati, Mesa, Glendale (AZ), Gilbert, Buffalo and Provo (list_coverage has the current list). Tools: building_records_lookup.\n- Closing cost calculators (free): Title insurance premiums from the promulgated or filed rate schedules (Texas, Florida, Pennsylvania, New York), real estate transfer taxes (NYC, New York State, Florida, Philadelphia, Chicago, Cook County, NC, SC, AR, TX, AZ) and a seller net sheet with buyer closing costs (Florida, Texas, NYC, New York State, Philadelphia). Estimates with every rate's source; the same numbers as the calculator pages. Tools: title_insurance_premium, transfer_tax, seller_net_sheet.\n- Entities: Entity and ownership lookups for the public MCP server: who owns an LLC, NYC landlord registrations, HOA lookup, UCC search. Tools: llc_owner_lookup, nyc_landlord_lookup, hoa_lookup, ucc_lien_search.\n- Superfund sites (free): EPA Superfund National Priorities List sites near any US address (with other Superfund sites and EPA-regulated facilities counted nearby), and every NPL site in a state with status and dates, from EPA data refreshed nightly; a records lookup, not a Phase I Environmental Site Assessment. Tools: superfund_sites_near_address, superfund_sites_by_state, superfund_states_summary.\n- Flood zone lookup (free): FEMA flood zone at any US street address from the National Flood Hazard Layer, with what it means for flood insurance; a screening, not an official flood zone determination. Tools: flood_zone_lookup.\n- Fmr: HUD Fair Market Rents by county and Small Area FMRs by ZIP code (pages /fair-market-rent/<state>/<county> and Tools: fair_market_rent_by_county, fair_market_rent_by_zip.\n- Hazards: Hazard tools: radon (EPA zone + test results by county, ZIP or address), USGS mapped faults near an address, and Tools: radon_lookup, radon_by_county, radon_state_summary, fault_lines_near_address, power_lines_near_address.\n- Investor: Investor tools for the public MCP server: property tax appeal evidence (Cook County IL, New York City, Philadelphia), Tools: tax_appeal_deadlines, check_tax_appeal_property, order_tax_appeal_evidence, get_tax_appeal_evidence, zoning_lookup, recent_sales, start_tax_sale_due_diligence, get_tax_sale_due_diligence.\n- Lending: Lending lookups for the public MCP server: USDA property eligibility, census tract designations (FFIEC income level, Tools: usda_eligibility_lookup, census_tract_lookup, opportunity_zone_lookup.\n- Loanlimits: Loan limits by county: FHFA conforming, HUD FHA forward and the VA county limit (pages /loan-limits/<state>/<county>). Tools: county_loan_limits, national_loan_limits.\n- Property history lookup (free): Deeds, sale prices, mortgages and releases recorded against an address, counted by year and type, from the official parcel-keyed index: New York City, Philadelphia, Cook County IL, Hamilton County OH and Utah County UT. People's names are shown as initials. Tools: property_history_lookup.\n- Plans, passes and auction packs: upcoming tax and sheriff sales with pre-check counts (open mortgages, liens, lis pendens per sale), and checkout links for the County List Pass ($19), the auction pack ($149, every property of an upcoming sale pre-checked), HeritageDeed Pro ($39 a month), Pro Reports ($199 a month) and API report credits ($250 for 10). Tools: upcoming_auction_sales, auction_precheck_summary, buy_county_list_pass, buy_plan, my_account.\n- Surplus funds lists (free): Surplus funds (excess proceeds) from tax deed and foreclosure sales still on the official lists, as the clerk, court or state office publishes them, with amounts, claim deadlines and the claim rules; refreshed from the official lists. The first 10 rows of each county are free here; the full list needs a free account made on the county page. Former owners who are people are shown as initials. Tools: surplus_funds_search, surplus_funds_summary.\n- Tax sale lists (free): Properties on official tax deed, tax lien and sheriff sale lists (NYC lien sale, Florida clerks, Horry SC, Forsyth NC, Montgomery OH, Arkansas), with sale dates, published amounts and the bidding and redemption rules. The first 10 rows of each county are free here; the full list needs HeritageDeed Pro on the county page. Owners who are people are shown as initials. Tools: tax_sale_search, tax_sale_summary.\n- Taxrates: Effective property tax rates by state, county and ZIP code (pages /property-tax-rates[/<state>[/<county>]] and Tools: property_tax_rate_by_county, property_tax_rates_by_state, property_tax_rate_by_zip.\n- Watch: Property Watch tools for the public MCP server: deed and lien monitoring for a property (backend app/api/watch.py). Tools: property_watch_coverage, create_property_watch, list_property_watch_events.\n\nRules for agents: tell the user that a title report is a public-records search, not title insurance or legal advice; that the environmental report and Superfund lookup are not a Phase I Environmental Site Assessment; that the flood lookup is not an official flood zone determination; and that calculator results are estimates. 'unavailable' means a government source did not answer (retry later), never 'nothing found'. People's names in lists and histories are shown as initials. Every result carries the page URL on heritagedeed.com to cite. list_products lists every product and tool. This MCP server and its lookups are free, with no account and no API key. Ordering a report costs the report price: $49 for a title search, $29 for an Environmental Records Report (https://heritagedeed.com/pricing). Reports are public-records searches, not title insurance.",
