{
  "lockfileVersion": 2,
  "subjects": {
    "com.canweship/product-guidance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://canweship.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "canweship-product-guidance",
        "title": "CanWeShip Product Guidance",
        "version": "1.1.0",
        "description": "Preliminary U.S. domestic shipping guidance with carrier context and official source links.",
        "websiteUrl": "https://canweship.com",
        "icons": [
          {
            "src": "https://canweship.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_product",
          "title": "Evaluate Product Shipping Facts",
          "description": "Evaluate supplied product facts through the same deterministic USPS, UPS and FedEx rule runtime used by the CanWeShip checker. Use the fact ids from get_product_guidance questions. Unknown or invalid facts are ignored and never treated as clearance; next_questions lists the facts still open, in the order the checker asks them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "carriers": {
                "description": "Optional carrier subset; defaults to all three carriers.",
                "items": {
                  "enum": ["usps", "ups", "fedex"],
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "facts": {
                "additionalProperties": {},
                "description": "Facts already confirmed by the user, keyed by question id, for example { \"device_condition\": \"used\", \"battery_wh\": 52.6 }.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "slug": {
                "description": "A product slug from list_products (laptop, power-bank), a named product (iphone-15, anker-737-power-bank, aerosol-deodorant) or a product name or alias (cbd oil).",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e41cb736444a544e181b6a3866373caccacf0daba6238e0da8dfa1c2363e5c62"
        },
        {
          "name": "get_product_guidance",
          "title": "Get Product Shipping Guidance",
          "description": "Get preliminary U.S. domestic shipping guidance for one product: the answer with claim-level source IDs, the facts check_product accepts (ids, types, allowed values), carrier context, review dates and the cited official sources. Accepts product slugs, named products and aliases. FAQs, rule evidence and the full source list are left out unless requested with include.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include": {
                "description": "Optional extras: faqs, rule_evidence (every rule with its condition) or all_sources.",
                "items": {
                  "enum": ["faqs", "rule_evidence", "all_sources"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "slug": {
                "description": "A product slug from list_products (laptop, power-bank), a named product (iphone-15, anker-737-power-bank, aerosol-deodorant) or a product name or alias (cbd oil).",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51238a00d9a95d4509f08fa79ac34dc902f420cf5e7a3fb2b3c6c58f75485f33"
        },
        {
          "name": "list_products",
          "title": "List Supported Products",
          "description": "List the products CanWeShip checks, each with the first sentence of its answer, verification date and guide URL. Pass query to search product names, aliases and named products such as iPhone 15 or aerosol deodorant; each named product says which product check answers for it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Optional text to search, for example iphone 15, deodorant or cbd oil.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d955017b89e1a764e7e92a216cc32202c3958f36064972a94ac9fdbf00993cb"
        }
      ],
      "digest": "sha256:d8a826372fe3bb872ad8d8790220315d6e17347a4feed84cb6d8039d410fa844"
    }
  }
}
