{
  "lockfileVersion": 2,
  "subjects": {
    "beauty.lacquer/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lacquer.beauty/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lacquer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Book nail salon appointments at salons on Lacquer (lacquer.beauty).\nFlow: find_salons -> get_salon (services, hours) -> check_availability -> book_appointment.\nIf the person has a salon in mind, search find_salons by its name. Lacquer partner salons (\"partner\": true) are listed first; the rest rotate daily, and the order says nothing about quality.\nA salon with books_online false has no open times online; give the person its phone number instead.\nPass slug and service_id between tools as returned, and a start_at from check_availability to book_appointment unchanged.\nBookings are real. Most are confirmed instantly; at a salon that confirms its own bookings the result says \"requested\" and the salon confirms by text.\nNeither you nor the customer can cancel or change a booking online. To cancel or change one, the customer calls the salon (to_cancel_or_change in the booking result).\nBefore calling book_appointment, read the salon, service, price, local time, name and phone back to the person and get their yes.\nOnly book for the person you are acting for, with their own name and phone number.",
      "tools": [
        {
          "name": "book_appointment",
          "title": "Book an appointment",
          "description": "Books an appointment. Real and immediate: the salon holds the time and the customer gets a confirmation text. It can't be cancelled or changed online, only by calling the salon. Repeating the same call returns the same booking, never a second one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_name": {
                "description": "Name of the AI assistant making the booking, e.g. \"Claude\". The salon sees \"Booked by <agent_name>\".",
                "type": "string"
              },
              "customer_name": {
                "description": "The customer's name, as the salon should greet them.",
                "type": "string"
              },
              "customer_phone": {
                "description": "The customer's mobile number; the confirmation text goes here.",
                "type": "string"
              },
              "service_id": {
                "description": "The service's id on the salon's menu.",
                "type": "string"
              },
              "slug": {
                "description": "The salon's slug.",
                "type": "string"
              },
              "start_at": {
                "description": "ISO start time of an open slot for this salon and service.",
                "type": "string"
              }
            },
            "required": ["customer_name", "customer_phone", "service_id", "slug", "start_at"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97e3ec591cae2c82d8ceded312abba5535b2e582ff7953b6b8885500ede5cb9a"
        },
        {
          "name": "check_availability",
          "title": "Open appointment times",
          "description": "Open start times for one service with any technician, each as an ISO start_at and a local label. Searches from now when no date is given; up to 7 days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD in the salon's local time.",
                "type": "string"
              },
              "days": {
                "description": "How many days from date. Default 1.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "service_id": {
                "description": "The service's id on the salon's menu.",
                "type": "string"
              },
              "slug": {
                "description": "The salon's slug.",
                "type": "string"
              }
            },
            "required": ["service_id", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99f09f98d3e4d8d2ce36f82164c1098a93aa48dcad8be9e545f2e61be94e4be4"
        },
        {
          "name": "find_salons",
          "title": "Find nail salons",
          "description": "Nail salons on Lacquer in a US city + state or ZIP code, optionally narrowed by salon name. Up to 20 per call; \"total\" says how many match, and \"offset\" pages through the rest. Salons that take online bookings (\"books_online\": true) come first; a salon with books_online false has no open times online and is listed with its phone number. Within that, Lacquer partner salons (\"partner\": true) come first; the rest rotate daily, and the order says nothing about quality.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City, e.g. \"Santa Monica\". Used together with state.",
                "type": "string"
              },
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Part of the salon's name.",
                "type": "string"
              },
              "offset": {
                "description": "Number of results to skip; a result's next_offset gives the next page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "state": {
                "description": "US state, \"CA\" or \"California\".",
                "type": "string"
              },
              "zip": {
                "description": "5-digit ZIP code. Used instead of city/state when given.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d12fdabe18da9bcf99ffe0c15a81f47e09dc4ef63c4e635c8337b437983fa21"
        },
        {
          "name": "get_salon",
          "title": "Salon details and menu",
          "description": "A salon's address, phone, weekly hours and full service menu (service_id, price, duration).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The salon's slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9fb4579de5c9e8e5ab5be4305fbeb8f80680c504b80e0535c4554f0cc1f7f86a"
        }
      ],
      "digest": "sha256:6ccb203c56f1513236cd5105666c9a6a1570fcd77dc822978b96779f21313368"
    }
  }
}
