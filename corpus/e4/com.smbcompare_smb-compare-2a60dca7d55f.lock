      "instructions": "SMB Compare prices business software and merchant services for the United States (SMB Compare), the United Kingdom (SME Compare) and Australia (Merchant Compare).\nAlways know the user's country first: if unknown, ask which country they are in. Never guess it.\nChoose the market from the country: UK for the United Kingdom, AU for Australia, and US for the United States or any other country.\nIf the user is outside the United States, the United Kingdom and Australia, say before the results that these are US prices in US dollars from SMB Compare, and that a provider may price differently, or not operate, in their country.\nUse list_categories to find the category slug and the calculator inputs it takes.\nCall compare with the user's own numbers; if inputs are missing, ask for them, then call compare again.\nRefer to the comparison site by the response's site_name; every link lands there.\nIf defaulted_inputs is non-empty, say which figures were assumed and their values (from scenario) before or with the results, and offer to rerun with the user's own numbers.\nIf clamped_inputs is non-empty, say that each of those figures was capped to the calculator's range (supplied, then the value used) and that the results use the capped value.\nShow the ranked results with their figures before offering quotes or links.\nIf cost_basis is list_fee, call each figure the provider's published monthly fee, not an estimate. If cost_basis is net_interest, lead each row with estimated_interest_over_period: the interest the account is estimated to earn over period_months at the inputs given, net of its fees (a negative figure means its fees exceed the interest), at applied_rate (an annual rate, shown as a percent) on the opening balance; estimated_monthly_cost is then that figure's monthly average with the sign reversed, so a negative one is money earned, not a charge. Otherwise each figure is an estimated monthly cost at the inputs given.\nPresent each cost_status truthfully: an incomplete figure excludes what missing names (for example card processing), so say so beside it; when missing is rate_after_intro, the account's introductory rate ends inside the period and no rate is published for after it, so the figure counts the later months as earning nothing; a starting_price is a floor, not the full cost; over_plan_limit means the provider's largest published plan does not cover these inputs (plan_limit says which limit), not that it hides its prices; quote means the provider prices on request.\nMention any caveats and fee_waived_at_balance beside the row they belong to, and include the tax_note. If the response says no_calculator, give its comparison link instead of a ranking.\nIf filters_applied is non-empty, say the list is filtered that way (each label, with its value where given), because the user did not choose those filters.\nIf the user named a provider or brand, pass it as provider and lead with the returned focus rows; if a brand has several products, show each and let the user choose. If focus_hidden lists a product, say it is listed on the site but not shown here because these filters or inputs exclude it; never say it is not compared.\nIf quotes_available is true, ask whether they would like quotes from any of these providers (up to 4) or to compare them on the site first, and give the matching link. Quotes are submitted by the user on the website; you cannot submit one.\nIf a row has an offer, note it beside that row as the provider's current offer, using its headline as written, with its details_link for any conditions; an offer never changes the order or the cost figure, and never describe its terms beyond the headline.\nIf the user asks whether there are deals, offers or discounts in a category, call list_offers with that category's slug. Present the offers in the order returned, each with its headline and details_link, and include the note and the disclosure. If offers is empty, say no current offers are recorded on the site for that category; do not say the providers have none.\nOnly state facts about a provider that this response gives (its cost, cost_status, plan, caveats, any period figures and applied_rate, any offer headline, and links). Do not add claims about a provider from anywhere else, such as its rates, contract terms, payout speed, hardware, support or the chance of a better custom price; if the user asks about those, send them to that provider's page link.\nAlways include the disclosure from the response, and for compare its ranking_method.",
      "tools": [
        {
          "name": "compare",
          "title": "Compare providers by cost",
          "description": "Ranks providers in a category by estimated monthly cost at the user's own numbers (card volume, average sale, employees, users, and so on), for the US, the UK or Australia. Returns links to the comparison table and provider pages, and quote links where quotes are available. Examples: EFTPOS and card machine fees, cheapest payroll software, POS system costs, inventory software pricing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category slug from list_categories, e.g. \"payment-providers\".",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              },
              "inputs": {
                "additionalProperties": {
                  "maximum": 1000000000,
                  "minimum": 0,
                  "type": "number"
                },
                "default": {},
                "description": "Calculator values keyed by input slug (list_categories gives each category's inputs). Inputs not supplied use the calculator defaults and are listed in defaulted_inputs. Unknown keys are returned in ignored_inputs.",
                "propertyNames": {
                  "pattern": "^[a-z0-9_-]{1,40}$",
                  "type": "string"
                },
                "type": "object"
              },
              "market": {
                "description": "The user's country: US, UK or AU.",
                "enum": ["AU", "UK", "US"],
                "type": "string"
              },
              "provider": {
                "description": "A provider or brand the user named, as a lowercase slug (e.g. \"cin7\", \"windcave\"). Every matching product is returned in focus with its own quote link.",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              }
            },
            "required": ["category", "market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare providers by cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b998e839bd1b06ae9ba8be13a827957f76b4d3754db1c31664559940dde78236"
        },
        {
          "name": "list_categories",
          "title": "List SMB Compare categories",
          "description": "Lists the business software and merchant services categories SMB Compare prices in a country (US, UK or AU), and whether quotes are available in each. Each category lists the calculator inputs compare accepts for it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "market": {
                "description": "The user's country: US, UK or AU.",
                "enum": ["AU", "UK", "US"],
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List SMB Compare categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7288881e8ff8c41817ab8d3244c6c6f470d9adbc09cd1a202dcaf07b11442a4c"
        },
        {
          "name": "list_offers",
          "title": "List current provider offers",
          "description": "Lists the providers in a category (US, UK or AU) that have a current offer recorded on SMB Compare, with each offer's headline and a link to its details on our site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "A category slug from list_categories, e.g. \"hr-software\".",
                "pattern": "^[a-z0-9-]{1,80}$",
                "type": "string"
              },
              "market": {
                "description": "The user's country: US, UK or AU.",
                "enum": ["AU", "UK", "US"],
                "type": "string"
              }
            },
            "required": ["category", "market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List current provider offers"
          },
