      "tools": [
        {
          "name": "createSoundiizImportLink",
          "title": "Create a Soundiiz playlist import link",
          "description": "Create a temporary 24-hour Soundiiz import link for 1 to 200 supplied tracks. Show the exact returned shareUrl, including query parameters, and expiry. Preserve a requested destination and omit it otherwise. The user reviews the tracks and completes the transfer in Soundiiz. Omit unknown album or ISRC metadata. No music-service password or token is needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "type": "string"
              },
              "destination": {
                "description": "Include only when the user requests a platform. Use its documented Soundiiz API corename; otherwise omit this field.",
                "enum": ["amazonmusic", "applemusicapp", "audiomack", "audius", "beatport", "boomplay", "brisamusic", "claromusica", "codamusic", "dailymotion", "deezer", "emby", "hearthis", "iheartradio", "jellyfin", "kkbox", "kugou", "listenbrainz", "slackerradio", "movistar", "navidrome", "neteasemusic", "pandora", "plex", "qobuz", "qqmusic", "soundcloud", "soundiiz", "soundmachine", "spotify", "subsonic", "telmore", "tidal", "yandexmusic", "yousee", "youtube", "ytmusic", "zvooq"],
                "type": "string"
              },
              "title": {
                "minLength": 1,
                "type": "string"
              },
              "tracklist": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "album": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "artists": {
                      "description": "Artist names as an array; use an empty array when unknown.",
                      "items": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "isrc": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["artists", "title"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["title", "tracklist"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "properties": {
                  "expiresAt": {
                    "description": "Import expiry as a Unix timestamp in seconds (UTC).",
                    "type": "integer"
                  },
                  "nbTracks": {
                    "maximum": 200,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "shareUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "status": {
                    "const": "success"
                  }
                },
                "required": ["expiresAt", "nbTracks", "shareUrl", "status"],
                "type": "object"
              },
              {
                "properties": {
                  "httpStatus": {
                    "description": "HTTP status associated with this tool error.",
                    "maximum": 599,
                    "minimum": 100,
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "retryAfter": {
                    "description": "Wait at least this many seconds before retrying.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "status": {
                    "const": "error"
                  }
                },
                "required": ["message", "status"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
