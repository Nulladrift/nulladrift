            ]
          },
          "digest": "sha256:2373cb175e27933334de662812682972f318bf20d6b3e3f629994eb582fe4a60"
        },
        {
          "name": "listSoundiizImportDestinations",
          "title": "List Soundiiz playlist import destinations",
          "description": "List configured destinations that can currently receive a Soundiiz playlist import link. Use the returned corename for an import; slug is a public guide identifier and may differ. Does not access an account or check live service health.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "properties": {
                  "destinations": {
                    "items": {
                      "properties": {
                        "corename": {
                          "enum": ["amazonmusic", "applemusicapp", "audiomack", "audius", "beatport", "boomplay", "brisamusic", "claromusica", "codamusic", "dailymotion", "deezer", "emby", "hearthis", "iheartradio", "jellyfin", "kkbox", "kugou", "listenbrainz", "slackerradio", "movistar", "navidrome", "neteasemusic", "pandora", "plex", "qobuz", "qqmusic", "soundcloud", "soundiiz", "soundmachine", "spotify", "subsonic", "telmore", "tidal", "yandexmusic", "yousee", "youtube", "ytmusic", "zvooq"],
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "slug": {
                          "description": "Public platform slug, not the import corename.",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["corename", "name", "slug"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "notice": {
                    "type": "string"
                  },
                  "status": {
                    "const": "success"
                  }
                },
                "required": ["destinations", "notice", "status"],
                "type": "object"
              },
              {
                "properties": {
                  "httpStatus": {
                    "description": "HTTP status associated with this tool error.",
                    "maximum": 599,
                    "minimum": 100,
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "retryAfter": {
                    "description": "Wait at least this many seconds before retrying.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "status": {
                    "const": "error"
                  }
                },
                "required": ["message", "status"],
                "type": "object"
              }
            ],
            "type": "object"
          },
