          "digest": "sha256:c764c467c9205d5589eab76f813b3364fd406799ddcc013b0027afc849bba4bf"
        },
        {
          "name": "createSoundiizImportLinkFromUrl",
          "title": "Create a Soundiiz import link from a public playlist URL",
          "description": "Read a public playlist of at most 200 source items from its full HTTPS URL and create a 24-hour Soundiiz import link. Supported sources: Spotify, Apple Music, Deezer, SoundCloud, YouTube, YouTube Music, Qobuz, TIDAL and public Soundiiz playlists. Private playlists and short links are unsupported. Preserve a requested destination and omit it otherwise. Show warnings, the exact shareUrl including query parameters, and expiry. The user reviews the tracks and connects the destination to complete the transfer in Soundiiz. No music-service password or user token is needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional two-letter catalog country for a TIDAL source, default US. Apple Music uses the storefront in its URL.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Include only when the user requests a platform. Use its documented Soundiiz API corename; otherwise omit this field.",
                "enum": ["amazonmusic", "applemusicapp", "audiomack", "audius", "beatport", "boomplay", "brisamusic", "claromusica", "codamusic", "dailymotion", "deezer", "emby", "hearthis", "iheartradio", "jellyfin", "kkbox", "kugou", "listenbrainz", "slackerradio", "movistar", "navidrome", "neteasemusic", "pandora", "plex", "qobuz", "qqmusic", "soundcloud", "soundiiz", "soundmachine", "spotify", "subsonic", "telmore", "tidal", "yandexmusic", "yousee", "youtube", "ytmusic", "zvooq"],
                "type": "string"
              },
              "playlistUrl": {
                "format": "uri",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["playlistUrl"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "properties": {
                  "expiresAt": {
                    "description": "Import expiry as a Unix timestamp in seconds (UTC).",
                    "type": "integer"
                  },
                  "nbTracks": {
                    "maximum": 200,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "shareUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "sourceItems": {
                    "description": "Source item count before filtering; it can exceed nbTracks.",
                    "maximum": 200,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "sourceName": {
                    "type": "string"
                  },
                  "status": {
                    "const": "success"
                  },
                  "title": {
                    "type": "string"
                  },
                  "warnings": {
                    "description": "Show any warnings about source items excluded from the import.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["expiresAt", "nbTracks", "shareUrl", "sourceItems", "sourceName", "status", "title", "warnings"],
                "type": "object"
              },
              {
                "properties": {
                  "httpStatus": {
                    "description": "HTTP status associated with this tool error.",
                    "maximum": 599,
                    "minimum": 100,
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "retryAfter": {
                    "description": "Wait at least this many seconds before retrying.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "status": {
                    "const": "error"
                  }
                },
                "required": ["message", "status"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:5c3e84ab7b4b82c4a8f6b66e6d2d3d243771048be24fe1794a71fbb1041c72e2"
        },
        {
          "name": "getSoundiizTransferCompatibility",
          "title": "Check Soundiiz transfer compatibility",
          "description": "Check transfer and one-way playlist-sync capabilities between two exact public platform slugs, such as spotify and youtube-music. Return supported item types and human-readable web guide URLs from the cached Soundiiz capability catalog. Show the exact returned guideUrl links, including query parameters, to users. This does not check account eligibility or live status. Import corenames can differ from public slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Exact destination public slug, for example youtube-music rather than import corename ytmusic.",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "source": {
                "description": "Exact source slug from https://soundiiz.com/capabilities.json; not a URL.",
                "maxLength": 255,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["destination", "source"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "properties": {
                  "destination": {
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "slug"],
                    "type": "object"
                  },
                  "generatedAt": {
                    "description": "Generation time of the cached capability snapshot in UTC.",
                    "format": "date-time",
                    "type": "string"
                  },
                  "notice": {
                    "type": "string"
                  },
                  "sameService": {
                    "type": "boolean"
                  },
                  "source": {
                    "properties": {
                      "name": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      }
                    },
                    "required": ["name", "slug"],
                    "type": "object"
                  },
                  "status": {
                    "const": "success"
                  },
                  "sync": {
                    "properties": {
                      "guideUrl": {
                        "description": "Public web guide to show as a clickable link to the user; null when no guide is published.",
                        "format": "uri",
                        "type": ["string", "null"]
                      },
                      "itemTypes": {
                        "items": {
                          "enum": ["playlist"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "supported": {
                        "type": "boolean"
                      }
                    },
                    "required": ["guideUrl", "itemTypes", "supported"],
                    "type": "object"
                  },
                  "transfer": {
                    "properties": {
                      "guideUrl": {
                        "description": "Public web guide to show as a clickable link to the user; null when no guide is published.",
                        "format": "uri",
                        "type": ["string", "null"]
                      },
                      "itemTypes": {
                        "items": {
                          "enum": ["playlist", "album", "artist", "track"],
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "supported": {
                        "type": "boolean"
                      }
                    },
                    "required": ["guideUrl", "itemTypes", "supported"],
                    "type": "object"
                  }
                },
                "required": ["destination", "generatedAt", "notice", "sameService", "source", "status", "sync", "transfer"],
                "type": "object"
              },
              {
                "properties": {
                  "httpStatus": {
                    "description": "HTTP status associated with this tool error.",
                    "maximum": 599,
                    "minimum": 100,
                    "type": "integer"
                  },
                  "message": {
                    "type": "string"
                  },
                  "retryAfter": {
                    "description": "Wait at least this many seconds before retrying.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "status": {
                    "const": "error"
                  }
                },
                "required": ["message", "status"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
