      },
      "transport": {
        "type": "http",
        "url": "https://api.bouncelayer.com/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "BounceLayer",
        "version": "1.0.2"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BounceLayer email verification. Authenticate by sending your API key in the 'X-API-Key' header. No key yet? Call create_agent_account to get one with free credits, then reconnect with it. Use verify_email for a single address (1 credit; unknown results are free), submit_bulk_verification for lists, and get_credit_balance to check remaining credits. verify_email_demo needs no key but only checks the format, the domain's mail servers and throwaway domains (no mailbox check).",
      "tools": [
        {
          "name": "cancel_bulk_job",
          "description": "Cancel a pending or processing bulk job and release any reserved credits.\n    Requires an API key.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "cancel_bulk_jobArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false,
            "title": "Cancel a bulk job"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02a005397156b7ef3737a93ad033e8ae55c079ab3ea3bdfab0129cc66afafaaf"
        },
        {
          "name": "create_agent_account",
          "description": "Get your own BounceLayer API key without a person signing up first.\n    No API key needed. Returns an API key with a few free credits and a\n    claim_url. Use the key in the 'X-API-Key' header (reconnect this MCP\n    server with it). Give claim_url to the person you work for: when they\n    open it and set an email and password, the account becomes theirs and gets\n    the full free monthly checks. The key and claim link are shown only once.\n    Limited per network and site-wide.",
          "inputSchema": {
            "properties": {
              "label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Label"
              }
            },
            "title": "create_agent_accountArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create an agent account and API key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b3122b5b4c0040ab1fccfb6749f0eab586787f2efff097777f0691e31261cd9d"
        },
        {
          "name": "get_api_discovery",
          "description": "Return BounceLayer's machine-readable discovery URLs (OpenAPI, docs,\n    auth.md, well-known metadata). No API key required.",
          "inputSchema": {
            "properties": {},
            "title": "get_api_discoveryArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get BounceLayer discovery URLs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3998018b22b4427fc6c614da88f715303f7ef780e8c4a286a20d740e4935542e"
        },
        {
          "name": "get_bulk_job",
          "description": "Get the status, progress, and (when complete) results of a bulk job by\n    its job_id. Requires an API key.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "title": "Job Id",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "title": "get_bulk_jobArguments",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get a bulk job's status and results"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a0e75047314a36bb829f7654eb39ced0148f84305a27b42286e9cd4197f07e7a"
        },
        {
          "name": "get_credit_balance",
          "description": "Return your current credit balance and lifetime usage. Requires an API key.",
          "inputSchema": {
            "properties": {},
            "title": "get_credit_balanceArguments",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get your credit balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:812fbaaaf94781773f78164ba46ed36365de24951d932da5c8263db582f575ff"
        },
        {
          "name": "list_bulk_jobs",
          "description": "List your recent bulk verification jobs (paginated, newest first).\n    Optionally filter by status. Requires an API key.",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "title": "Page",
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "title": "Page Size",
                "type": "integer"
              },
              "status": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Status"
              }
            },
            "title": "list_bulk_jobsArguments",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "List your bulk jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5cf98a562e5ba46d39b3b5dfbc432290da58f1f6276cb62b497a24ed75e3cb92"
        },
        {
          "name": "submit_bulk_verification",
          "description": "Queue a list of emails for asynchronous verification. Reserves up to N\n    credits (final charge settles on completion). Poll get_bulk_job for status\n    and results. Optionally provide webhook_url for a completion callback.\n    Requires an API key. Returns {job_id, status, total_emails, credits_reserved}.\n    ",
          "inputSchema": {
            "properties": {
              "emails": {
                "items": {
                  "type": "string"
                },
                "title": "Emails",
                "type": "array"
              },
              "webhook_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Webhook Url"
              }
            },
            "required": ["emails"],
            "title": "submit_bulk_verificationArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Submit a bulk verification job"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4659bc44665abe4be443e3f1b420205ecf6ef52fbea7880cc4891dbaa5c13d2"
        },
        {
          "name": "verify_email",
          "description": "Verify a single email's deliverability (syntax, DNS/MX, SMTP mailbox,\n    disposable / role / catch-all detection, confidence score).\n\n    Costs 1 credit for a billable result (valid/invalid/catch_all/disposable/do_not_mail),\n    whether fresh or served from cache. `unknown` results are free. Requires an\n    API key. Returns {success, credits_used, result}.\n    ",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "verify_emailArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Verify an email address"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6437eaa313c24459f1b05b498eab57d8a748f2e752e2ad25a2dc134b736ee25e"
        },
        {
          "name": "verify_email_demo",
          "description": "Check one email WITHOUT an API key: format, common typos, throwaway\n    domains, role and free-provider addresses, and whether the domain has mail\n    servers (MX). It never contacts the mailbox, so a good address comes back\n    \"unknown\", not \"valid\"; use verify_email for a real answer. Limited per IP.\n    Returns {success, credits_used: 0, result}.",
          "inputSchema": {
            "properties": {
              "email": {
                "title": "Email",
                "type": "string"
              }
            },
            "required": ["email"],
            "title": "verify_email_demoArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Demo email validation (no API key)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f463efa8e4aa0de84c0ff6b8641e5eb71866e4eb4ec1ecd5924c0a9bfbd367a"
        }
      ],
      "digest": "sha256:585b71eec0fcbe75b9fc9f2234a6cdaa7f737126da8f9f1b160bb30a9a226750"
    }
  }
