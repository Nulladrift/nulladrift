{
  "lockfileVersion": 2,
  "subjects": {
    "app.qrcodecreator/qr-codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qrcodecreator.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "QRCodeCreator.app",
        "title": "QR Code Creator QR codes",
        "version": "1.0.2",
        "websiteUrl": "https://qrcodecreator.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Creates QR codes for URLs on QRCodeCreator.app and reports how often they are scanned. Creating codes is free and needs no account.\ncreate_qr_code, get_scan_analytics, get_plan_status and start_pro_subscription work without an API key. update_destination needs one; without it, it returns the error api_key_required.\nWithout an API key, a new code has no owner until someone opens the claimUrl in the create_qr_code result. With a key (sent as Authorization: Bearer qrcd_...; keys are issued by hello@qrcodecreator.app), codes belong to the key's owner.\nPro costs $9/month. update_destination requires it, and it keeps the full scan history; without Pro, scan analytics cover the last 7 days.\nNo tool takes payment. start_pro_subscription is free to call: it returns the Pro price and a link to a Stripe checkout page, and a subscription starts only if a person opens the link and completes checkout.",
      "tools": [
        {
          "name": "create_qr_code",
          "title": "Create a QR code",
          "description": "Free. Creates a QR code for a URL. Returns a hosted PNG (imageUrl), the SVG markup when format is \"svg\", and for \"direct\" codes a pageUrl where the code can be viewed and downloaded. \"redirect\" codes encode a scan link (scanUrl) that counts scans; the destination of a redirect code can be changed later with update_destination, which requires Pro. Without an API key the result includes a claimUrl, valid for 30 days, that adds the code to the QR codes of whoever opens it on QRCodeCreator.app. Unsafe links and links to private or internal hosts are refused with an error that names the reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "\"png\" (default) returns a hosted PNG. \"svg\" also returns the SVG markup.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "url": {
                "description": "Where the QR code should send people. https:// is added if no scheme is given.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "variant": {
                "description": "\"direct\" (default) encodes the URL itself. \"redirect\" encodes a scan link that counts scans and whose destination can be changed later.",
                "enum": ["direct", "redirect"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:480f87166b1b2413aafb02c803fd10ea7dba33a191af10224191cf2c4493bfe0"
        },
        {
          "name": "get_plan_status",
          "title": "Get plan status",
          "description": "Free. With an API key, returns whether the key's owner has Pro, the subscription status and when the current period ends. Without a key, returns what the free and Pro plans include and the Pro price ($9/month).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4574437cc5890cb77f513a60300bfbd9a4123e46a76295743d8309d325c281b3"
        },
        {
          "name": "get_scan_analytics",
          "title": "Get scan analytics",
          "description": "Free. Returns how many times a QR code was scanned, in total and per UTC day. Only \"redirect\" codes record scans. Needs no API key: the counts for a code can be read by anyone with its ID. If the code's owner does not have Pro ($9/month), only the last 7 days are included (historyDays in the result); with Pro, the full history is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID from create_qr_code, e.g. \"QR-ABCD1234EF\".",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c7afe43d3beac4e7b88e844613e05a76e1a8311ad20c92d6f0c0a71383ed22c6"
        },
        {
          "name": "start_pro_subscription",
          "title": "Get a Pro checkout link",
          "description": "Pro costs $9/month. Returns a checkoutUrl for the Pro subscription, with the plan and its price. Getting the link is free: it charges nothing and changes no account; a subscription starts only if a person opens the link and completes Stripe checkout in their browser. Without an API key, Pro applies to the browser that completes checkout, including codes added to it with a claimUrl; with a key, it applies to the key's owner. Returns already_pro if the key's owner already has Pro.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Email to fill in on the checkout page.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a9cad0c32f5ec1c607dc270d1b87ef8246e0c79edbd695ced46a55d2e7716aa7"
        },
        {
          "name": "update_destination",
          "title": "Change where a QR code points",
          "description": "Changes the URL a \"redirect\" QR code sends people to, so a printed code can point somewhere new. Requires Pro ($9/month): an API key (Authorization: Bearer qrcd_...) whose owner owns the code and has Pro. Without a key it returns api_key_required; if the owner doesn't have Pro, pro_required; if the code belongs to someone else, not_owner. The new URL gets the same safety checks as create_qr_code.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID, e.g. \"QR-ABCD1234EF\". Must be a \"redirect\" code to have any effect on scans.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "The new destination, an http or https URL.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:889d371e3e3cb1083b7f0d452b18865dc899d42332744989314ef1d05bac8a23"
        }
      ],
      "digest": "sha256:c217c4502853d3b5f4f6108e319046e70a2b50cfa3209ff1cbb5475ba73e9910"
    }
  }
}
