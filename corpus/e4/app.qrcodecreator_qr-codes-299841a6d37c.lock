{
  "lockfileVersion": 2,
  "subjects": {
    "app.qrcodecreator/qr-codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qrcodecreator.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "QRCodeCreator.app",
        "title": "QR Code Creator QR codes",
        "version": "1.0.6",
        "websiteUrl": "https://qrcodecreator.app",
        "icons": [
          {
            "src": "https://qrcodecreator.app/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://qrcodecreator.app/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://qrcodecreator.app/qr-code-creator-logo-1024.png",
            "mimeType": "image/png",
            "sizes": ["1024x1024"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Creates QR codes for URLs on QRCodeCreator.app and reports how often they are scanned. Creating codes is free and needs no account.\ncreate_qr_code, get_scan_analytics, get_plan_status and start_pro_subscription work without an API key. update_destination is listed only when the request carries an API key.\nWithout an API key, a new code has no owner until someone opens the claimUrl in the create_qr_code result. With a key (sent as Authorization: Bearer qrcd_...; keys are issued by hello@qrcodecreator.app), codes belong to the key's owner.\nPro costs $9/month. update_destination requires it, and it keeps the full scan history; without Pro, scan analytics cover the last 7 days.\nNo tool takes payment. start_pro_subscription is free to call: it returns the Pro price and a link to a Stripe checkout page, and a subscription starts only if a person opens the link and completes checkout.",
      "tools": [
        {
          "name": "create_qr_code",
          "title": "Create a QR code",
          "description": "Free. Creates a QR code for a URL. Returns a hosted PNG (imageUrl), the SVG markup when format is \"svg\", and for \"direct\" codes a pageUrl where the code can be viewed and downloaded. \"redirect\" codes encode a scan link (scanUrl) that counts scans, and their destination can be changed later by an owner with Pro. Without an API key the result includes a claimUrl, valid for 30 days, that adds the code to the QR codes of whoever opens it on QRCodeCreator.app. Unsafe links and links to private or internal hosts are refused with an error that names the reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "\"png\" (default) returns a hosted PNG. \"svg\" also returns the SVG markup.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "url": {
                "description": "Where the QR code should send people. https:// is added if no scheme is given.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "variant": {
                "description": "\"direct\" (default) encodes the URL itself. \"redirect\" encodes a scan link that counts scans and whose destination can be changed later.",
                "enum": ["direct", "redirect"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a QR code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d4362e75aff6fc858ac0f495cf91e5fecc971149a7468ad973b93787e9c57ff9"
        },
        {
          "name": "get_plan_status",
          "title": "Get plan status",
          "description": "Free. With an API key, returns whether the key's owner has Pro, the subscription status and when the current period ends. Without a key, returns what the free and Pro plans include and the Pro price ($9/month).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6dfc4da05e4b74ad786545d20993b67ec7e29e2df201446a68ddd7bb3e06a418"
        },
        {
          "name": "get_scan_analytics",
          "title": "Get scan analytics",
          "description": "Free. Returns how many times a QR code was scanned, in total and per UTC day. Only \"redirect\" codes record scans. Needs no API key: the counts for a code can be read by anyone with its ID. If the code's owner does not have Pro ($9/month), only the last 7 days are included (historyDays in the result); with Pro, the full history is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID from create_qr_code, e.g. \"QR-ABCD1234EF\".",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get scan analytics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:22fb5d6180918d6e0fb5a77e0c6f21c5b1fea337318ddb68fd792f14f8b7d3bc"
        },
        {
          "name": "start_pro_subscription",
          "title": "Get a Pro checkout link",
          "description": "Pro costs $9/month. Returns a checkoutUrl for the Pro subscription, with the plan and its price. Getting the link is free: it charges nothing and changes no account; a subscription starts only if a person opens the link and completes Stripe checkout in their browser. Without an API key, Pro applies to the browser that completes checkout, including codes added to it with a claimUrl; with a key, it applies to the key's owner. If the key's owner already has Pro, returns alreadyPro: true and no link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Email to fill in on the checkout page.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Pro checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c3bc03880bbef622d412e8a30051de6ab016410df921234c80e09c598f2ea7fb"
        }
      ],
      "digest": "sha256:7b7bbd0c5fc117ebab177f03924d923b7b51a7ac7c4d0d3a2f3500e38737f62f"
    }
  }
}
