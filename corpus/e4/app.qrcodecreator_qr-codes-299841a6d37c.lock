      },
      "instructions": "Creates QR codes for URLs on QRCodeCreator.app and reports how often they are scanned. Creating codes is free and needs no account.\ncreate_qr_code, get_scan_analytics, get_plan_status and start_pro_subscription work without signing in. list_qr_codes needs an account and update_destination the code's owner: signed in with OAuth (an emailed code, no password) or an API key.\nWithout sign-in or an API key, a new code has no owner until someone opens the claimUrl in the create_qr_code result. Signed in, or with a key (sent as Authorization: Bearer qrcd_...; keys are issued by hello@qrcodecreator.app), codes belong to that account.\nPro costs $9/month. update_destination requires it, and it keeps the full scan history; without Pro, scan analytics cover the last 7 days.\nNo tool takes payment. start_pro_subscription is free to call: it returns the Pro price and a link to a Stripe checkout page, and a subscription starts only if a person opens the link and completes checkout.",
      "tools": [
        {
          "name": "create_qr_code",
          "title": "Create a QR code",
          "description": "Free. Creates a scannable QR code from a website URL, such as a restaurant menu, event page, business website or product link, with no account or API key required. Encodes the URL as a QR symbol and returns the PNG image, a download link for it on QRCodeCreator.app (imageUrl), the SVG markup when format is \"svg\", and for \"direct\" codes a pageUrl where the code can be viewed and downloaded for sharing or printing. Requires a destination URL; supports public HTTP/HTTPS links, not Wi-Fi credentials, contact cards, arbitrary text or decoding an existing QR image. \"redirect\" codes encode a scan link (scanUrl) that counts scans, and their destination can be changed later by an owner with Pro. Signed in or with an API key, the code belongs to that account. Otherwise the result includes a claimUrl, valid for 30 days, that adds the code to the QR codes of whoever opens it on QRCodeCreator.app. Unsafe links and links to private or internal hosts are refused with an error that names the reason.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "description": "\"png\" (default) returns a hosted PNG. \"svg\" also returns the SVG markup.",
                "enum": ["png", "svg"],
                "type": "string"
              },
              "url": {
                "description": "Destination website URL to encode, e.g. https://example.com/menu. Required; https:// is added if no scheme is given.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "variant": {
                "description": "\"direct\" (default) encodes the URL itself. \"redirect\" encodes a scan link that counts scans and whose destination can be changed later.",
                "enum": ["direct", "redirect"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a QR code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/outputTemplate": "ui://qr-code-card/v3.html",
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["qr_codes"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://qr-code-card/v3.html"
            }
          },
          "digest": "sha256:fa13d7586098d26785ca240e9617f55e5ab55795fe81da2838089a73cc37369d"
        },
        {
          "name": "get_plan_status",
          "title": "Get plan status",
          "description": "Free. Signed in (OAuth) or with an API key, returns whether that account has Pro, the subscription status and when the current period ends. Otherwise, returns what the free and Pro plans include and the Pro price ($9/month).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get plan status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["qr_codes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4c9203f598fcbe287918cc2642a1e0961e28ce471b3e947f46cee96043d14277"
        },
        {
          "name": "get_scan_analytics",
          "title": "Get scan analytics",
          "description": "Free. Returns how many times a QR code was scanned, in total and per UTC day. Only \"redirect\" codes record scans. Needs no API key: the counts for a code can be read by anyone with its ID. If the code's owner does not have Pro ($9/month), only the last 7 days are included (historyDays in the result); with Pro, the full history is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID from create_qr_code or list_qr_codes, e.g. \"QR-ABCD1234EF\".",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get scan analytics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:9aa4ee40236331a37926007be2d66037d52eb5b29309a7db368dda0700310757"
        },
        {
          "name": "list_qr_codes",
          "title": "List my QR codes",
          "description": "Free. Lists the QR codes in the signed-in account (or the API key owner's), newest first, optionally only those whose name or destination URL contains a search term, such as \"lunch menu\" or \"example.com/events\". Returns each code's id, name (set on QRCodeCreator.app; null if unnamed), current destination url, createdAt, scanUrl and manageUrl, plus total and truncated. The id works with get_scan_analytics and update_destination. Needs sign-in (OAuth) or an API key, and lists only that account's codes. At most 50 codes per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Most codes to return (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Text to look for in the code's name or destination URL, case-insensitive. Omit to list every code.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my QR codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["qr_codes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f7f1dac0e149ad44032f2540159918468a120690ed14a9d768c2e0d462d2f801"
        },
        {
          "name": "start_pro_subscription",
          "title": "Get a Pro checkout link",
          "description": "Pro costs $9/month. Returns a checkoutUrl for the Pro subscription, with the plan and its price. Getting the link is free: it charges nothing and changes no account; a subscription starts only if a person opens the link and completes Stripe checkout in their browser. Signed in or with an API key, Pro applies to that account; otherwise it applies to the browser that completes checkout, including codes added to it with a claimUrl. If that account already has Pro, returns alreadyPro: true and no link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Email to fill in on the checkout page.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Pro checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["qr_codes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:448533e94a043b3af59145fe3c688a75ee05ac28b27c75e286ca05da81aee957"
        },
        {
          "name": "update_destination",
          "title": "Change where a QR code points",
          "description": "Changes the URL a \"redirect\" QR code sends people to, so a printed code can point somewhere new. Requires Pro ($9/month) and the code's owner: signed in (OAuth) or an API key (Authorization: Bearer qrcd_...) whose owner owns the code. If the owner doesn't have Pro, it returns pro_required; if the code belongs to someone else, not_owner. The new URL gets the same safety checks as create_qr_code.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "QR code ID, e.g. \"QR-ABCD1234EF\". Must be a \"redirect\" code to have any effect on scans.",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "The new destination, an http or https URL.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change where a QR code points"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["qr_codes"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:bd5903b597cf72184764f6e30a810fee1acfb420a7ae54ea4c2ea817d25c7f17"
        }
