          },
          "digest": "sha256:707a7210bf68d68e07b2bc2979bf2077d6e20c3299d491826c4c0b961797399a"
        },
        {
          "name": "search_tracked_brands",
          "title": "Find a tracked advertiser",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. Search your tracked advertisers by name, Meta page ID, or stored Facebook URL. Searches existing local data only; does not resolve vanity URLs through paid providers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a tracked advertiser"
          },
          "behavior": {
            "destructive": false,
