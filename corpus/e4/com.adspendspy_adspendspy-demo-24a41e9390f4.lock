          },
          "digest": "sha256:41d0a8f1c121f103c28ad20c607d4b14099cedef54b475773239dd5cd66d8015"
        }
      ],
      "prompts": [
        {
          "name": "landing_page_teardown",
          "title": "Explain why a top-spending landing page converts",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Rank landing pages by estimated spend and break one down: sections, offer, proof, calls to action and the ad hooks that send traffic to it. No build.",
          "arguments": [
            {
              "name": "landing_url",
              "description": "Optional landing page URL (http or https). Without it, the highest-spend landing pages are ranked first.",
              "required": false
            },
            {
              "name": "page_id",
              "description": "Optional Meta advertiser page_id (digits only) to limit the landing page ranking to one advertiser.",
              "required": false
            }
          ],
          "digest": "sha256:9683daead760e08b50e04532dd73e25bbf8836a0e3ddfd85e7fef931d3fa1c0d"
        },
        {
          "name": "rebuild_landing_page",
          "title": "Rebuild a winning landing page for your offer",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Pick a landing page with real estimated Meta ad spend, explain why it converts and rebuild its structure for your own offer with original copy.",
          "arguments": [
            {
              "name": "landing_url",
              "description": "Optional landing page URL (http or https). Without it, the highest-spend landing pages are ranked first.",
              "required": false
            },
            {
              "name": "page_id",
              "description": "Optional Meta advertiser page_id (digits only) to limit the landing page ranking to one advertiser.",
              "required": false
