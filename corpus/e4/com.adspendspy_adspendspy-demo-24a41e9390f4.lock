      "serverInfo": {
        "name": "adspendspy-demo",
        "title": "Meta Ad Library Spend MCP Demo by AdSpendSpy",
        "version": "1.0.0",
        "websiteUrl": "https://www.adspendspy.com",
        "icons": [
          {
            "src": "https://www.adspendspy.com/android-chrome-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AdSpendSpy MCP reads your own AdSpendSpy account: tracked advertisers, their ads, saved lists, projects, alerts and AdSpendSpy spend estimates (estimates by AdSpendSpy, not figures reported by Meta). Find an advertiser with list_tracked_brands or search_tracked_brands, use its string page_id with list_brand_ads, then pass internal_ad_id as get_ad_details.ad_id. Estimated spend is cumulative EUR; timeframe is only a last-seen filter. Each executed authenticated tool consumes one API request; discovery and initialization do not. Prompts rebuild_landing_page and landing_page_teardown guide landing-page research and rebuilds; prompts never consume quota. This read-only public demo is restricted to Alex Hormozi, page 116482854782233, and approved public ad creatives.",
      "tools": [
        {
          "name": "check_brands_tracked",
          "title": "Check advertiser tracking",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. Check whether each string Meta page ID is actively tracked by your account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page_ids": {
                "items": {
                  "description": "Meta advertiser page ID, kept as a string.",
                  "pattern": "^[0-9]{5,25}$",
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["page_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check advertiser tracking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f7fdc1aa91f71b818d41fa0bd846c2e987fcd24490b10eff02621f18c4144dd"
        },
        {
          "name": "get_ad_details",
          "title": "Inspect an ad creative",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. Retrieve one ad of an advertiser you actively track by its internal AdSpendSpy ad ID (internal_ad_id), not its Meta ad ID. Saved lists and favorites do not retain MCP ad access after you remove a tracked brand on the website.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ad_id": {
                "description": "Internal AdSpendSpy ad ID (internal_ad_id in ad listings); never a Meta ad ID.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["ad_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inspect an ad creative"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b429799d19e5c339669c16d1cb3b4421d2d295ecd76f574ba78126fa23c7af66"
        },
        {
          "name": "get_top_ads_stats",
          "title": "Analyze estimated ad spend",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. Analyze latest cumulative estimated spend in EUR for your tracked advertisers. page_id is an exact advertiser filter. timeframe filters when ads were last seen, NOT spend accrued during that period. Creative breakdowns sample the top 1,000 ads; response metadata states matched and sampled counts and full-match aggregate spend. Zero can mean unavailable estimates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active_only": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["0", "1", "true", "false"],
                    "type": "string"
                  }
                ],
                "default": false
              },
              "category": {
                "maxLength": 100,
                "type": "string"
              },
              "media_type": {
                "default": "all",
                "enum": ["all", "image", "video"],
                "type": "string"
              },
              "page_id": {
                "description": "Meta advertiser page ID, kept as a string.",
                "enum": ["116482854782233"],
                "pattern": "^[0-9]{5,25}$",
                "type": "string"
              },
              "project": {
                "description": "Only all is available in the public demo.",
                "enum": ["all"],
                "type": "string"
              },
              "q": {
                "maxLength": 500,
                "type": "string"
              },
              "timeframe": {
                "default": "30d",
                "description": "Last-seen window; never a period-spend calculation.",
                "enum": ["all", "7d", "30d", "90d"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze estimated ad spend"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02a3c827673d39b9dba5d0d722652010cc1554deaea3a62397356398def51b1a"
        },
        {
          "name": "get_top_landingpages_stats",
          "title": "Rank landing pages by estimated spend",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. Rank the landing pages of your tracked advertisers by latest cumulative estimated spend in EUR. Ads are grouped by landing URL with ad, advertiser and active-ad counts, the top-spending advertiser and, when one is stored, a screenshot as screenshot_url (site path) and screenshot_full_url (absolute URL). page_id is an exact advertiser filter; q matches part of the landing URL. timeframe filters when ads were last seen, NOT spend accrued during that period. Zero can mean unavailable estimates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active_only": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "enum": ["0", "1", "true", "false"],
                    "type": "string"
                  }
                ],
                "default": false
              },
              "limit": {
                "default": 60,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page_id": {
                "description": "Meta advertiser page ID, kept as a string.",
                "enum": ["116482854782233"],
                "pattern": "^[0-9]{5,25}$",
                "type": "string"
              },
              "project": {
                "description": "Only all is available in the public demo.",
                "enum": ["all"],
                "type": "string"
              },
              "q": {
                "description": "Substring of the landing URL.",
                "maxLength": 500,
                "type": "string"
              },
              "timeframe": {
                "default": "30d",
                "description": "Last-seen window; never a period-spend calculation.",
                "enum": ["all", "7d", "30d", "90d"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rank landing pages by estimated spend"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fcc1df626dbf021a5d26451bbb23ee809bd158dc34e6880fed60d2384aeb7ae"
        },
        {
          "name": "list_brand_ads",
          "title": "List advertiser ads",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. List creative summaries for one tracked advertiser, newest internal ID first, or with sort spend highest latest cumulative estimated spend first (use it for an advertiser's top ads). pagination.next_cursor returns the next page. Each ad carries internal_ad_id (AdSpendSpy ID) and meta_ad_id (the ad on Meta).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active_only": {
                "default": false,
                "type": "boolean"
              },
              "cursor": {
                "description": "Opaque pagination.next_cursor returned by the previous page with the same filters.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "media_type": {
                "default": "all",
                "enum": ["all", "image", "video"],
                "type": "string"
              },
              "page_id": {
                "description": "Meta advertiser page ID, kept as a string.",
                "enum": ["116482854782233"],
                "pattern": "^[0-9]{5,25}$",
                "type": "string"
              },
              "sort": {
                "default": "newest",
                "description": "newest = newest internal ID first; spend = highest estimated spend first.",
                "enum": ["newest", "spend"],
                "type": "string"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List advertiser ads"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42fdb9fbfadbe4ef049acb3a5a555ea303a8d01c9bef76eed38f33896cb56539"
        },
        {
          "name": "list_tracked_brands",
          "title": "List tracked advertisers",
          "description": "Public demo: Alex Hormozi only (page_id 116482854782233). Ad listings/details expose only approved public creatives; statistics describe this advertiser only. List your actively tracked advertisers and their string page_id values.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project": {
                "description": "Only all is available in the public demo.",
                "enum": ["all"],
                "type": "string"
              }
            },
            "required": [],
