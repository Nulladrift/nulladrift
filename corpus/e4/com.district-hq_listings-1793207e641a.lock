        {
          "name": "get_listing",
          "title": "Open a District Listing",
          "description": "Returns one published District workspace by id (from search_listings): its name, type, operator's public name, area, postcode and postcode district, desk range, published price (on the basis the operator quotes it, stating whether VAT is included), its price for each commitment length the operator has set, its availability, the day the operator last confirmed it, and url, its District listing page, where viewings are requested and enquiries are made. Read only: it returns no contact details and cannot book or enquire.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The workspace id (from search_listings)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "listing": {
                "additionalProperties": false,
                "properties": {
                  "area": {
                    "description": "The neighbourhood the listing is shown under, or its city when no neighbourhood is published",
                    "type": "string"
                  },
                  "availability": {
                    "description": "One line: available now, from a date, or needs confirming",
                    "type": "string"
                  },
                  "availabilityStatus": {
                    "description": "needs_confirming: the operator has not confirmed the space is free, so it is not a statement that it is available",
                    "enum": ["available_now", "available_from", "needs_confirming", "unavailable"],
                    "type": "string"
                  },
                  "availableFrom": {
                    "description": "First day an occupier could move in (YYYY-MM-DD), when known",
                    "type": ["string", "null"]
                  },
                  "calendarConfirmedThrough": {
                    "description": "The operator has confirmed the availability calendar up to this day (YYYY-MM-DD), or null",
                    "type": ["string", "null"]
                  },
                  "desks": {
                    "additionalProperties": false,
                    "description": "The fewest and the most desks the space is offered for",
                    "properties": {
                      "max": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      "min": {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["max", "min"],
                    "type": "object"
                  },
                  "id": {
                    "description": "The listing id",
                    "type": "string"
                  },
                  "name": {
                    "description": "The listing's name as the operator publishes it",
                    "type": "string"
                  },
                  "operator": {
                    "description": "The operator's public name, as the listing page shows it, or null when none is published",
                    "type": ["string", "null"]
                  },
                  "postcode": {
                    "description": "The building's postcode",
                    "type": "string"
                  },
                  "postcodeDistrict": {
                    "description": "The postcode district (outward code), for example W1T",
                    "type": "string"
                  },
                  "price": {
                    "description": "The published price on the basis the operator quotes it (a month, per desk a month, or per sq ft a year), stating whether VAT is included",
                    "type": "string"
                  },
                  "rentFreeOffer": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "advertisedUntil": {
                            "description": "The last day the operator advertises the offer (YYYY-MM-DD), or null for no end date",
                            "type": ["string", "null"]
                          },
                          "minTermMonths": {
                            "description": "The shortest term, in months, the offer applies to",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "monthsFree": {
                            "description": "Whole months of rent free",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "text": {
                            "description": "The offer as the listing page says it, for example 2 months rent free on 12 months or more",
                            "type": "string"
                          }
                        },
                        "required": ["advertisedUntil", "minTermMonths", "monthsFree", "text"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "A rent-free period the operator advertises on this office today, or null. Advertised only: price stays the headline rent, and the occupier's agreement sets which months are free"
                  },
                  "seats": {
                    "description": "The desk range as text",
                    "type": "string"
                  },
                  "termPrices": {
                    "description": "The operator's price for each commitment length it has set, in the order the listing page shows them. Empty when the listing quotes the single published price only",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "amountMinor": {
                          "description": "The price in pence of the whole space for one week (termUnit week) or one month (termUnit month)",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "maxTerm": {
                          "description": "The longest commitment this price covers, in termUnit",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "minTerm": {
                          "description": "The shortest commitment this price covers, in termUnit",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "price": {
                          "description": "The same price as text, with its basis and VAT treatment",
                          "type": "string"
                        },
                        "term": {
                          "description": "The commitment length this price covers, for example 1 to 2 months",
                          "type": "string"
                        },
                        "termUnit": {
                          "description": "Whether the commitment and the price are counted in weeks or in months",
                          "enum": ["week", "month"],
                          "type": "string"
                        },
                        "vatInclusive": {
                          "description": "True when amountMinor includes VAT, false when VAT is added to it",
