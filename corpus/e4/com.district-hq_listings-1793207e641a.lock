        {
          "name": "search_listings",
          "title": "Search District Listings",
          "description": "Searches District's published, operator-committed London office listings for a team, by the number of desks, an area (for example Fitzrovia) and, optionally, the month the team wants to move in (startMonth, YYYY-MM) and a maximum budget. Only the area, the number of desks and a budget, where given, leave a listing out; the start month ranks results and does not remove one, so a returned listing can miss it. Returns count (listings that meet the area and team size, and the budget where given) and matchCount (those that match everything asked). Each listing has its operator's public name, desk range, published price and price for each commitment length the operator has set, a one line availability summary with its status, the days it was last confirmed, misses (what it misses of what was asked; a listing with any misses is not counted in matchCount and is not a match for everything asked) and url, its District listing page, where viewings are requested and enquiries are made. Read only: it cannot book a viewing, make an enquiry or show contact details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "area": {
                "description": "One London area or neighbourhood, e.g. 'Fitzrovia'",
                "maxLength": 80,
                "type": "string"
              },
              "areas": {
                "description": "Several London areas, e.g. ['Shoreditch','Clerkenwell'] (max 5); treated as alternatives",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "budgetBasis": {
                "description": "Basis the budget is quoted in; defaults to desk_month",
                "enum": ["monthly_total", "desk_month", "sqft_annual"],
                "type": "string"
              },
              "desks": {
                "description": "Number of desks the team needs",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "limit": {
                "description": "Maximum listings to return (default 20)",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              },
              "maxBudgetMinor": {
                "description": "Maximum budget in pence (e.g. 60000 = 600 pounds)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "seats": {
                "description": "The same as desks; use desks",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "startMonth": {
                "description": "Month the team wants to move in, as YYYY-MM, e.g. 2027-01. Ranks listings; never removes one",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "Total listings that meet the area and team size given (and the budget, where given)",
                "type": "number"
              },
              "listings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "area": {
                      "description": "The neighbourhood the listing is shown under, or its city when no neighbourhood is published",
                      "type": "string"
                    },
                    "availability": {
                      "description": "One line: available now, from a date, or needs confirming",
                      "type": "string"
                    },
                    "availabilityStatus": {
                      "description": "needs_confirming: the operator has not confirmed the space is free, so it is not a statement that it is available",
                      "enum": ["available_now", "available_from", "needs_confirming", "unavailable"],
                      "type": "string"
                    },
                    "availableFrom": {
                      "description": "First day an occupier could move in (YYYY-MM-DD), when known",
                      "type": ["string", "null"]
                    },
                    "calendarConfirmedThrough": {
                      "description": "The operator has confirmed the availability calendar up to this day (YYYY-MM-DD), or null",
                      "type": ["string", "null"]
                    },
                    "desks": {
                      "additionalProperties": false,
                      "description": "The fewest and the most desks the space is offered for",
                      "properties": {
                        "max": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "min": {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["max", "min"],
                      "type": "object"
                    },
                    "id": {
                      "description": "The listing id",
                      "type": "string"
                    },
                    "misses": {
                      "description": "What the listing misses of what was asked; empty when nothing. A listing with misses is not a match for everything asked",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "description": "The listing's name as the operator publishes it",
                      "type": "string"
                    },
                    "operator": {
                      "description": "The operator's public name, as the listing page shows it, or null when none is published",
                      "type": ["string", "null"]
                    },
                    "postcode": {
                      "description": "The building's postcode",
                      "type": "string"
                    },
                    "postcodeDistrict": {
                      "description": "The postcode district (outward code), for example W1T",
                      "type": "string"
                    },
                    "price": {
                      "description": "The published price on the basis the operator quotes it (a month, per desk a month, or per sq ft a year), stating whether VAT is included",
                      "type": "string"
                    },
                    "rentFreeOffer": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "advertisedUntil": {
                              "description": "The last day the operator advertises the offer (YYYY-MM-DD), or null for no end date",
                              "type": ["string", "null"]
                            },
                            "minTermMonths": {
                              "description": "The shortest term, in months, the offer applies to",
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "monthsFree": {
                              "description": "Whole months of rent free",
                              "maximum": 9007199254740991,
                              "minimum": -9007199254740991,
                              "type": "integer"
                            },
                            "text": {
                              "description": "The offer as the listing page says it, for example 2 months rent free on 12 months or more",
                              "type": "string"
                            }
                          },
                          "required": ["advertisedUntil", "minTermMonths", "monthsFree", "text"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "A rent-free period the operator advertises on this office today, or null. Advertised only: price stays the headline rent, and the occupier's agreement sets which months are free"
                    },
                    "seats": {
                      "description": "The desk range as text",
                      "type": "string"
                    },
                    "termPrices": {
                      "description": "The operator's price for each commitment length it has set, in the order the listing page shows them. Empty when the listing quotes the single published price only",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "amountMinor": {
                            "description": "The price in pence of the whole space for one week (termUnit week) or one month (termUnit month)",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "maxTerm": {
                            "description": "The longest commitment this price covers, in termUnit",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "minTerm": {
                            "description": "The shortest commitment this price covers, in termUnit",
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "price": {
                            "description": "The same price as text, with its basis and VAT treatment",
                            "type": "string"
                          },
                          "term": {
                            "description": "The commitment length this price covers, for example 1 to 2 months",
                            "type": "string"
                          },
                          "termUnit": {
                            "description": "Whether the commitment and the price are counted in weeks or in months",
                            "enum": ["week", "month"],
                            "type": "string"
                          },
                          "vatInclusive": {
                            "description": "True when amountMinor includes VAT, false when VAT is added to it",
                            "type": "boolean"
                          }
                        },
                        "required": ["amountMinor", "maxTerm", "minTerm", "price", "term", "termUnit", "vatInclusive"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "type": {
                      "description": "managed, serviced or coworking",
                      "type": "string"
                    },
                    "url": {
                      "description": "The District listing page for this workspace, where viewings are requested and enquiries are made",
                      "type": "string"
                    },
                    "verifiedAt": {
                      "description": "The day the operator last confirmed the listing, or null",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["area", "availability", "availabilityStatus", "availableFrom", "calendarConfirmedThrough", "desks", "id", "misses", "name", "operator", "postcode", "postcodeDistrict", "price", "rentFreeOffer", "seats", "termPrices", "type", "url", "verifiedAt"],
                  "type": "object"
                },
                "type": "array"
