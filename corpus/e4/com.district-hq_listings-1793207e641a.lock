                    },
                    "type": "array"
                  },
                  "type": {
                    "description": "managed, serviced or coworking",
                    "type": "string"
                  },
                  "url": {
                    "description": "The District listing page for this workspace, where viewings are requested and enquiries are made",
                    "type": "string"
                  },
                  "verifiedAt": {
                    "description": "The day the operator last confirmed the listing, or null",
                    "type": ["string", "null"]
                  }
                },
                "required": ["area", "availability", "availabilityStatus", "availableFrom", "calendarConfirmedThrough", "desks", "id", "name", "operator", "postcode", "postcodeDistrict", "price", "rentFreeOffer", "seats", "termPrices", "type", "url", "verifiedAt"],
                "type": "object"
              }
            },
            "required": ["listing"],
            "type": "object"
          },
